<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porto Alegre em Jogo · Giovani Perotto Mesquita</title>
<meta name="description" content="Porto Alegre em Jogo: jogo de negócios imobiliários com bairros e pontos da capital gaúcha. Compre, construa, negocie e leve os adversários à falência, contra o computador ou com amigos. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#16323F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12303C; --panel: #FFF9EF; --panel-2: #F6EBD9; --ink: #27211C; --muted: #6B6055; --line: #E2D3BC;
    --board: #F9F1E2; --accent: #C2471F; --accent-ink: #FFFFFF; --river: #1D5C70; --gold: #E9A23B; --ok: #1F7A4D; --danger: #B3261E;
    --sans: "Hanken Grotesk", "Segoe UI", Arial, sans-serif; --serif: "Source Serif 4", Georgia, serif;
    --b: min(calc(100dvh - 16px), calc(100vw - 396px));
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0C1F27; --panel: #1C2A30; --panel-2: #26363D; --ink: #F4EDE2; --muted: #AFA698; --line: #3A4B52; --accent: #E0653A; --ok: #55C48C; --danger: #F2837A; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100dvh; }
  .stage { display: grid; place-items: center; padding: 8px; min-width: 0; }
  .side { display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 8px 0; min-height: 0; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .75rem; }

  /* tabuleiro */
  #board { position: relative; width: var(--b); height: var(--b); display: grid; grid-template-columns: 1.6fr repeat(9, 1fr) 1.6fr; grid-template-rows: 1.6fr repeat(9, 1fr) 1.6fr; gap: 1px; background: #5B4E40; border: 2px solid #5B4E40; border-radius: 8px; overflow: hidden; color: #27211C; font-size: calc(var(--b) / 76); box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  .cell { position: relative; display: flex; background: var(--board); border: 0; padding: 0; min-width: 0; min-height: 0; text-align: center; overflow: hidden; color: inherit; font: inherit; line-height: 1.12; }
  .cell:hover, .cell:focus-visible { filter: brightness(.95); z-index: 1; }
  .cell.b { flex-direction: column; } .cell.t { flex-direction: column-reverse; } .cell.l { flex-direction: row-reverse; } .cell.r { flex-direction: row; }
  .strip { flex: none; display: flex; align-items: center; justify-content: center; gap: 1px; }
  .cell.b .strip, .cell.t .strip { height: 22%; width: 100%; } .cell.l .strip, .cell.r .strip { width: 22%; height: 100%; flex-direction: column; }
  .bd { display: block; width: .62em; height: .62em; background: #1F9D55; border: 1px solid rgba(0,0,0,.55); border-radius: 1px; }
  .bd.h { width: 1.05em; background: #D9342B; }
  .cbody { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .18em; padding: .15em; }
  .cname { font-weight: 700; overflow-wrap: anywhere; hyphens: auto; }
  .cname .short { display: none; }
  .cprice { color: #5D5247; font-size: .9em; }
  .cico { width: 1.9em; height: 1.9em; flex: none; }
  .cell.corner { background: #F4E4C6; font-size: 1.08em; }
  .cell.corner .cico { width: 3.1em; height: 3.1em; }
  .cell .own { position: absolute; width: .85em; height: .85em; border-radius: 50%; border: 1px solid #fff; right: .2em; bottom: .2em; }
  .cell.mort .cbody { background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(179,38,30,.2) 4px 7px); }
  .center { grid-area: 2 / 2 / 11 / 11; position: relative; overflow: hidden; background: #F6C46B; display: flex; align-items: center; justify-content: center; }
  .center svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cbox { position: relative; display: flex; flex-direction: column; align-items: center; gap: .7em; width: 86%; text-align: center; }
  .ctitle { font-family: var(--serif); font-weight: 700; font-size: 3.6em; line-height: 1; color: #fff; text-shadow: 0 2px 8px rgba(40,20,10,.55); }
  .dice { display: flex; gap: .8em; }
  .die { width: 5em; height: 5em; background: #FFFDF8; border-radius: .9em; box-shadow: 0 .25em .6em rgba(0,0,0,.35); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: .6em; }
  .die i { width: .95em; height: .95em; border-radius: 50%; background: #27211C; place-self: center; visibility: hidden; }
  .die i.on { visibility: visible; }
  .die.spin { animation: spin .32s linear infinite; }
  @keyframes spin { 50% { transform: rotate(14deg) scale(1.07); } }
  .card { background: #FFFDF8; color: #27211C; border-radius: .9em; padding: 1em 1.2em; box-shadow: 0 .4em 1.2em rgba(0,0,0,.4); border-top: .55em solid var(--river); font-size: 1.35em; line-height: 1.32; max-width: 100%; }
  .card.c { border-top-color: #4F7A2B; }
  .card b { display: block; font-family: var(--serif); font-size: 1.2em; margin-bottom: .25em; }
  .token { position: absolute; left: 0; top: 0; width: calc(var(--b) / 30); height: calc(var(--b) / 30); border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.5); display: grid; place-items: center; pointer-events: none; transition: left .12s ease-out, top .12s ease-out; z-index: 5; }
  .token svg { width: 72%; height: 72%; }
  .token.on { outline: 2px solid var(--gold); outline-offset: 1px; }
  .fast .token { transition-duration: .04s; }

  /* painel */
  .players { display: grid; gap: 5px; }
  .pl { display: grid; grid-template-columns: auto 1fr auto; gap: .5rem; align-items: center; padding: .32rem .45rem; border-radius: 9px; border: 1px solid transparent; }
  .pl.on { background: var(--panel-2); border-color: var(--gold); }
  .pl.out { opacity: .5; text-decoration: line-through; }
  .ptk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #fff; }
  .ptk svg { width: 72%; height: 72%; }
  .pname { font-weight: 700; font-size: .95rem; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pinfo { font-size: .76rem; color: var(--muted); line-height: 1.2; }
  .pcash { font-weight: 700; font-variant-numeric: tabular-nums; }
  .action h2 { font-family: var(--serif); font-size: 1.1rem; line-height: 1.2; margin: 0 0 .35rem; }
  .action p { margin: 0 0 .5rem; font-size: .92rem; line-height: 1.35; color: var(--muted); }
  .btns { display: flex; flex-wrap: wrap; gap: .4rem; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: .55rem .8rem; font-weight: 700; font-size: .92rem; min-height: 40px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.bad { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.sm { padding: .3rem .55rem; font-size: .8rem; min-height: 32px; }
  .log { flex: 1; min-height: 80px; overflow: auto; font-size: .82rem; line-height: 1.35; }
  .log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .28rem; }
  .log li { color: var(--muted); }
  .log li:last-child { color: var(--ink); font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: .35rem; }

  /* telas e diálogos */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; overflow: auto; z-index: 20; background: var(--bg); }
  .sheet, dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 1.2rem clamp(1rem, 4vw, 1.8rem); box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  .sheet { width: min(100%, 640px); }
  dialog { width: min(94vw, 620px); max-height: 90dvh; overflow: auto; }
  dialog::backdrop { background: rgba(5, 15, 20, .65); }
  .back { font-size: .85rem; color: var(--accent); text-decoration: none; }
  .hero { width: 100%; height: 170px; border-radius: 12px; display: block; margin: .6rem 0; overflow: hidden; }
  .sheet h1 { font-family: var(--serif); font-size: clamp(2rem, 7vw, 2.9rem); line-height: 1.05; margin: .2rem 0 .3rem; }
  .sheet .tag { font-family: var(--serif); font-size: 1.1rem; color: var(--accent); margin: 0 0 .4rem; font-weight: 600; }
  .sheet p { line-height: 1.45; margin: .3rem 0; font-size: .95rem; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .8rem; align-items: end; }
  .field { display: grid; gap: .2rem; font-size: .8rem; color: var(--muted); }
  select, input[type="text"], input[type="number"] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .5rem; color: var(--ink); min-height: 38px; min-width: 0; }
  .setup { display: grid; gap: .35rem; margin-top: .8rem; }
  .setup .ln { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 170px) 30px; gap: .4rem; align-items: center; }
  .iconbtn { width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-weight: 700; }
  dialog h2 { font-family: var(--serif); margin: 0 0 .6rem; font-size: 1.4rem; }
  dialog h3 { font-size: .95rem; margin: .8rem 0 .3rem; }
  .deedhead { color: #fff; padding: .55rem .8rem; border-radius: 9px; font-family: var(--serif); font-weight: 700; font-size: 1.2rem; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .deedhead.dk { color: #27211C; text-shadow: none; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td, th { padding: .28rem .3rem; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  tr.cur td { font-weight: 700; background: var(--panel-2); }
  .mg { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: .45rem; align-items: center; padding: .35rem 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .sw { width: 12px; height: 26px; border-radius: 3px; }
  .mg small { display: block; color: var(--muted); font-size: .76rem; }
  .tcols { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  .tcols label.ck { display: flex; gap: .4rem; align-items: center; padding: .22rem 0; font-size: .88rem; }
  .warn { color: var(--danger); font-size: .86rem; min-height: 1.2em; margin: .5rem 0 0; }
  .rules { padding-left: 1.1rem; margin: 0; display: grid; gap: .4rem; line-height: 1.4; font-size: .93rem; }
  .art2 { width: 100%; height: 150px; border-radius: 10px; display: block; margin-bottom: .6rem; }
  .rank { display: grid; gap: .25rem; margin: .5rem 0; }
  .rank div { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem .45rem; background: var(--panel-2); border-radius: 7px; font-size: .92rem; }
  .toasts { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); width: min(92vw, 460px); display: grid; gap: .3rem; z-index: 40; pointer-events: none; }
  .toast { background: #1C2A30; color: #fff; padding: .5rem .8rem; border-radius: 9px; font-size: .9rem; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.4); }

  @media (max-width: 920px) {
    :root { --b: calc(100vw - 8px); }
    .app { grid-template-columns: minmax(0, 1fr); height: auto; }
    .stage { padding: 4px; }
    .side { padding: 0 4px 12px; }
    .action { order: -1; position: sticky; bottom: 0; }
    .log { max-height: 220px; flex: none; }
    #board { max-width: 100%; }
  }
  @media (max-width: 640px) {
    #board { font-size: calc(var(--b) / 58); }
    .cname .full, .cprice { display: none; }
    .cname .short { display: inline; font-size: .86em; }
    .cico { width: 1.6em; height: 1.6em; }
    .cell.corner .cico { width: 2.4em; height: 2.4em; }
    .cell.corner .cname { display: none; }
    .ctitle { font-size: 2.1em; }
    .die { width: 3.6em; height: 3.6em; padding: .4em; }
    .die i { width: .7em; height: .7em; }
    .card { font-size: 1em; padding: .6em .8em; }
    .tcols { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .token { transition: none; } .die.spin { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app" hidden>

  <aside class="side">
    <section class="box players" id="players" aria-label="Jogadores"></section>
    <section class="box action" id="action" aria-live="polite"></section>
    <section class="box log" aria-label="Histórico"><ol id="log"></ol></section>
    <div class="bar">
      <button type="button" class="btn sm" id="bMine" data-t="myProps"></button>
      <button type="button" class="btn sm" id="bRules" data-t="rules"></button>
      <button type="button" class="btn sm" id="bSound"></button>
      <button type="button" class="btn sm" id="bSpeed"></button>
      <button type="button" class="btn sm" id="bMenu" data-t="menu"></button>
    </div>

</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<section class="overlay" id="ovTitle" aria-labelledby="ttl">

    <p data-t="story"></p>

    <div class="row">
      <button type="button" class="btn sm" id="bAdd" data-t="addPlayer"></button>
      <label class="field"><span data-t="duration"></span>
        <select id="durSel"><option value="0" data-t="durFree"></option><option value="15" data-t="dur15"></option><option value="30" data-t="dur30"></option></select></label>

</section>

<dialog id="dDeed" aria-labelledby="deedName"></dialog>

<dialog id="dEnd" aria-labelledby="endH"></dialog>

<script>
// Motor do jogo: regras e computador, sem nada de tela. O estado é JSON puro, para salvar e testar.
function Engine() {
  const G = {
    br: { c: '#8B5A2B', cost: 50 }, lb: { c: '#8ED1F0', cost: 50, dk: 1 }, pk: { c: '#D9418E', cost: 100 }, or: { c: '#F28C28', cost: 100, dk: 1 },

  const st = (name, short, g, price, rent) => ({ k: 'st', name, short, g, price, rent, mort: price / 2 });
  const rail = (name, short, ico) => ({ k: 'rail', name, short, price: 200, mort: 100, ico });
  const util = (name, short, ico) => ({ k: 'util', name, short, price: 150, mort: 75, ico });
  const SP = [
    { k: 'go', name: 'Largo Glênio Peres', short: 'Largo', ico: 'go' },

    { k: 'tax', name: 'IPTU', short: 'IPTU', amt: 200, ico: 'tax' }, rail('Estação Mercado', 'Trem', 'train'),
    st('Sarandi', 'Sar.', 'lb', 100, [6, 30, 90, 270, 400, 550]), { k: 'm', name: 'Minuano', short: 'Min.', ico: 'm' }, st('Partenon', 'Part.', 'lb', 100, [6, 30, 90, 270, 400, 550]), st('Glória', 'Glór.', 'lb', 120, [8, 40, 100, 300, 450, 600]),
    { k: 'jail', name: 'Detenção', short: 'Det.', ico: 'jail' },
    st('Azenha', 'Azen.', 'pk', 140, [10, 50, 150, 450, 625, 750]), util('Hidráulica Moinhos', 'Água', 'water'), st('Santana', 'Sant.', 'pk', 140, [10, 50, 150, 450, 625, 750]), st('Menino Deus', 'M.Deus', 'pk', 160, [12, 60, 180, 500, 700, 900]),
    rail('Rodoviária', 'Rod.', 'bus'),

  ];
  const GROUP = {}; SP.forEach((s, i) => { if (s.g) (GROUP[s.g] = GROUP[s.g] || []).push(i); });
  const RAILS = [5, 15, 25, 35], UTILS = [12, 28], JAIL = 10, FINE = 50, SALARY = 200;
  const isProp = (i) => SP[i].price > 0;
  // cartas: o texto fica nos idiomas da tela, com a chave m0, c3...
  const CARDS = {
    m: [{ t: 'to', sq: 0 }, { t: 'to', sq: 39 }, { t: 'to', sq: 23 }, { t: 'to', sq: 16 }, { t: 'near', w: 'rail' }, { t: 'near', w: 'rail' }, { t: 'near', w: 'util' }, { t: 'money', n: 50 }, { t: 'free' }, { t: 'back', n: 3 }, { t: 'jail' }, { t: 'repairs', h: 25, H: 100 }, { t: 'money', n: -15 }, { t: 'to', sq: 5 }, { t: 'each', n: 50 }, { t: 'money', n: 150 }],

  function newGame({ players, maxRounds, seed }) {

      owner: new Array(40).fill(-1), lvl: new Array(40).fill(0), mort: new Array(40).fill(false),

  // ---------------------------------------------------------------- dinheiro

  // ---------------------------------------------------------------- movimento

  function sendJail(S) {

  function land(S, mod) {

  function drawCard(S, deck) {

  function nextTurn(S) {

  // ---------------------------------------------------------------- leilão

  // ---------------------------------------------------------------- construção e hipoteca

    const list = GROUP[s.g];
    if (list.some((i) => S.mort[i]) || S.lvl[sq] >= 5) return false;

    const s = SP[sq];

  const canMortgage = (S, pi, sq) => isProp(sq) && S.owner[sq] === pi && !S.mort[sq] && (SP[sq].k !== 'st' || GROUP[SP[sq].g].every((i) => !S.lvl[i]));
  const liftCost = (sq) => Math.ceil(SP[sq].mort * 11 / 10);
  const canLift = (S, pi, sq) => isProp(sq) && S.owner[sq] === pi && S.mort[sq] && S.players[pi].cash >= liftCost(sq);
  // quanto o jogador consegue juntar vendendo todas as construções e hipotecando tudo
  function raisable(S, pi) {

  // ---------------------------------------------------------------- negociação
  // devolve uma chave de problema, ou null se a proposta é válida
  function tradeProblem(S, tr) {

    const free = (list, pi) => list.every((i) => isProp(i) && S.owner[i] === pi && (SP[i].k !== 'st' || GROUP[SP[i].g].every((q) => !S.lvl[q])));

    if (tr.giveCash > A.cash || tr.getCash > B.cash) return 'trCash';

    tr.get.forEach((i) => { S.owner[i] = tr.from; if (S.mort[i]) A.cash -= Math.ceil(SP[i].mort / 10); });

  // ---------------------------------------------------------------- ações. Devolve true se a ação era válida

        return true;

        return true;

      case 'bid': {

        return true;

      case 'pass': {
        if (S.phase !== 'auction') return false;

        return true;

        if (S.lvl[a.sq] === 4) { S.hotels--; S.houses += 4; } else S.houses--;
        S.lvl[a.sq]++;
        log(S, S.lvl[a.sq] === 5 ? 'hotel' : 'house', { p: me, s: a.sq, n: cost });
        return true;
      }
      case 'sell': {

        return true;
      case 'lift':
        if (!canManage(S, me) || S.phase === 'debt' || !canLift(S, me, a.sq)) return false;
        S.players[me].cash -= liftCost(a.sq); S.mort[a.sq] = false;
        log(S, 'lifted', { p: me, s: a.sq, n: liftCost(a.sq) });
        return true;
      case 'bankrupt':
        if (S.phase !== 'debt') return false;
        bankrupt(S, me);
        return true;
      case 'propose': {
        if (S.phase !== 'roll' && S.phase !== 'end') return false;
        const tr = Object.assign({ give: [], get: [], giveCash: 0, getCash: 0, giveCards: 0, getCards: 0 }, a.trade, { from: S.turn });
        if (tradeProblem(S, tr)) return false;
        S.trade = Object.assign(tr, { back: S.phase });

        return true;
      }
      case 'accept':

        return true;
      case 'reject':
        if (S.phase !== 'trade') return false;
        log(S, 'rejected', { p: S.trade.to, q: S.trade.from });
        S.refused[S.trade.from + '>' + S.trade.to] = S.round;
        S.phase = S.trade.back; S.trade = null;
        return true;
      case 'end':
        if (S.phase !== 'end') return false;
        nextTurn(S);
        return true;
    }
    return false;
  }

  // ---------------------------------------------------------------- computador. kind: 0 fácil, 1 médio, 2 difícil
  function aiValue(S, pi, sq) {
    const s = SP[sq], L = S.players[pi].kind;
    let v = s.price;
    if (s.k === 'st') {
      const list = GROUP[s.g], mine = list.filter((i) => S.owner[i] === pi || i === sq).length;

        sfx('card');
        await delay(S.players[S.turn].kind === 'human' ? 1500 : 1100);
      } else if (f.t === 'pay') sfx('coin');
    }
  }
  async function dispatch(a) {
    if (busy || !S) return false;
    const ok = E.act(S, a);
    if (!ok) { sfx('bad'); return false; }
    if (S.lastCard && !S.fx.some((f) => f.t === 'card')) S.lastCard.hide = true;
    const list = S.fx.slice();
    S.fx = [];
    save();
    busy = true;
    renderPlayers(); renderLog(); renderAction(); paintBoard();
    await playFx(list);
    busy = false;
    dispPos = S.players.map((p) => p.pos);
    render();
    if (S.over) { sfx(S.over.winners.some((i) => S.players[i].kind === 'human') ? 'win' : 'lose'); showEnd(); return true; }
    schedule();
    return true;
  }
  function schedule() {
    clearTimeout(aiTimer);
    if (!S || S.over || $('ovTitle').hidden === false) return;
    if (S.players[E.actor(S)].kind === 'human') return;
    aiTimer = setTimeout(() => {
      if (!S || S.over || busy) return;
      const a = E.ai(S);
      dispatch(a).then((ok) => { if (!ok) dispatch({ type: S.phase === 'end' ? 'end' : S.phase === 'roll' ? 'roll' : S.phase === 'buy' ? 'decline' : S.phase === 'auction' ? 'pass' : S.phase === 'trade' ? 'reject' : 'bankrupt' }); });
    }, reduceMotion ? 60 : (fast ? 110 : 620));
  }

  // ---------------------------------------------------------------- título de propriedade
  let deedSq = null;
  function openDeed(sq) { deedSq = sq; renderDeed(sq); if (!$('dDeed').open) $('dDeed').showModal(); }
  function manageButtons(sq) {
    const me = S.over ? -1 : E.actor(S);
    if (me < 0 || S.owner[sq] !== me || S.players[me].kind !== 'human' || !E.canManage(S, me)) return '';
    let h = '';
    const debt = S.phase === 'debt';
    if (SP[sq].k === 'st' && S.lvl[sq] < 5 && !debt && E.ownsAll(S, SP[sq].g, me)) h += `<button type="button" class="btn sm" data-m="build" data-sq="${sq}" ${E.canBuild(S, me, sq) ? '' : 'disabled'}>${t('buildBtn')}</button>`;
    if (E.canSell(S, me, sq)) h += `<button type="button" class="btn sm" data-m="sell" data-sq="${sq}">${t('sellBtn')}</button>`;
    if (S.mort[sq]) { if (!debt) h += `<button type="button" class="btn sm" data-m="lift" data-sq="${sq}" ${E.canLift(S, me, sq) ? '' : 'disabled'}>${t('liftBtn')} ${money(E.liftCost(sq))}</button>`; }
    else h += `<button type="button" class="btn sm" data-m="mortgage" data-sq="${sq}" ${E.canMortgage(S, me, sq) ? '' : 'disabled'}>${t('mortBtn')} ${money(SP[sq].mort)}</button>`;
    return h;
  }
  function renderDeed(sq) {
    const s = SP[sq], d = $('dDeed');
    let h;
    const color = s.g ? E.G[s.g] : null;
    h = `<div class="deedhead${color && color.dk ? ' dk' : ''}" id="deedName" style="background:${color ? color.c : '#1D5C70'}">${s.name}</div>`;
    if (E.isProp(sq)) {
      const o = S ? S.owner[sq] : -1, cur = S && o >= 0 ? S.lvl[sq] : -1, ownsAll = s.g && o >= 0 && E.ownsAll(S, s.g, o);
      h += '<table>';
      h += `<tr><td>${t('owner')}</td><td>${o >= 0 ? esc(pname(o)) : t('noOwner')}${S && S.mort[sq] ? ' · ' + t('mortgagedTag') : ''}</td></tr><tr><td>${t('priceL')}</td><td>${money(s.price)}</td></tr>`;
      if (s.k === 'st') {
        h += `<tr class="${cur === 0 && !ownsAll ? 'cur' : ''}"><td>${t('rentBase')}</td><td>${money(s.rent[0])}</td></tr><tr class="${cur === 0 && ownsAll ? 'cur' : ''}"><td>${t('rentGroup')}</td><td>${money(s.rent[0] * 2)}</td></tr>`;
        for (let k = 1; k <= 4; k++) h += `<tr class="${cur === k ? 'cur' : ''}"><td>${t('rentH', { n: k })}</td><td>${money(s.rent[k])}</td></tr>`;
        h += `<tr class="${cur === 5 ? 'cur' : ''}"><td>${t('rentHotel')}</td><td>${money(s.rent[5])}</td></tr><tr><td>${t('costL')}</td><td>${money(E.G[s.g].cost)}</td></tr>`;
      } else if (s.k === 'rail') { [1, 2, 3, 4].forEach((k) => { h += `<tr><td>${t('railRent', { n: k })}</td><td>${money(25 * Math.pow(2, k - 1))}</td></tr>`; }); }
      else h += `<tr><td colspan="2">${t('utilRent1')}</td></tr><tr><td colspan="2">${t('utilRent2')}</td></tr>`;
      h += `<tr><td>${t('mortL')}</td><td>${money(s.mort)}</td></tr><tr><td>${t('liftL')}</td><td>${money(E.liftCost(sq))}</td></tr></table>`;
      if (S) { const mb = manageButtons(sq); if (mb) h += `<div class="btns" style="margin-top:.6rem">${mb}</div>`; }
    } else {
      const m = { go: 'spaceGo', jail: 'spaceJail', park: 'spacePark', gojail: 'spaceGoJail', m: 'deckM', c: 'deckC' }[s.k];
      h += `<p>${s.k === 'tax' ? t('spaceTax', { n: money(s.amt) }) : t(m)}</p>`;
    }
    h += `<div class="row"><button type="button" class="btn pri" data-close="dDeed">${t('close')}</button></div>`;
    d.innerHTML = h;
  }
  // a janela fica presa ao jogador para quem foi aberta: se a vez passa a outro humano,
  // ela não troca sozinha para as propriedades dele (os botões somem até a vez voltar)
  let mineWho = null;
  function openMine() {
    const me = S.over ? S.turn : E.actor(S), h = S.players.findIndex((p) => p.kind === 'human');
    mineWho = S.players[me].kind === 'human' ? me : (h >= 0 ? h : me);
    renderMine();
    if (!$('dMine').open) $('dMine').showModal();
  }
  function renderMine() {
    const who = mineWho;
    const list = []; S.owner.forEach((o, i) => { if (o === who) list.push(i); });
    let h = `<h2 id="mineH">${t('mineTitle', { p: esc(pname(who)) })}</h2><p class="pinfo">${money(S.players[who].cash)}</p>`;
    if (!list.length) h += `<p>${t('noneOwned')}</p>`;
    list.forEach((i) => {
      const s = SP[i], lv = S.lvl[i], tag = [I18N[lang].level[lv], S.mort[i] ? t('mortgagedTag') : ''].filter(Boolean).join(' · ');
      h += `<div class="mg"><span class="sw" style="background:${s.g ? E.G[s.g].c : '#1D5C70'}"></span><div>${s.name}<small>${tag || money(s.price)}</small></div><div class="btns">${manageButtons(i)}</div></div>`;
    });
    h += `<div class="row"><button type="button" class="btn pri" data-close="dMine">${t('close')}</button></div>`;
    $('dMine').innerHTML = h;
  }

  // ---------------------------------------------------------------- negociação
  let tr = null;
  function openTrade() {
    const others = E.active(S).filter((i) => i !== S.turn);
    if (!others.length) return;
    tr = { to: others[0], give: [], get: [], giveCash: 0, getCash: 0, giveCards: 0, getCards: 0 };
    renderTrade();
    if (!$('dTrade').open) $('dTrade').showModal();
  }
  function renderTrade() {
    const me = S.turn;
    const col = (pi, key, cashKey, cardKey, title) => {
      const ls = []; S.owner.forEach((o, i) => { if (o === pi) ls.push(i); });
      let h = `<div><h3>${title}</h3>`;
      ls.forEach((i) => { h += `<label class="ck"><input type="checkbox" data-tr="${key}" value="${i}" ${tr[key].includes(i) ? 'checked' : ''}><span>${SP[i].name}${S.lvl[i] ? ' · ' + I18N[lang].level[S.lvl[i]] : ''}${S.mort[i] ? ' · ' + t('mortgagedTag') : ''}</span></label>`; });
      h += `<label class="field">${t('cashLabel')} (${money(S.players[pi].cash)})<input type="number" min="0" step="10" max="${S.players[pi].cash}" data-trc="${cashKey}" value="${tr[cashKey]}"></label>`;
      if (S.players[pi].cards.length) h += `<label class="ck"><input type="checkbox" data-trk="${cardKey}" ${tr[cardKey] ? 'checked' : ''}><span>${t('outCard')}</span></label>`;
      return h + '</div>';
    };
    const opts = E.active(S).filter((i) => i !== me).map((i) => `<option value="${i}" ${i === tr.to ? 'selected' : ''}>${esc(pname(i))}</option>`).join('');
    const prob = E.tradeProblem(S, Object.assign({ from: me }, tr));
    $('dTrade').innerHTML = `<h2 id="tradeH">${t('trTitle')}</h2><label class="field">${t('trPartner')}<select id="trTo">${opts}</select></label><div class="tcols">${col(me, 'give', 'giveCash', 'giveCards', t('youGive', { p: esc(pname(me)) }))}${col(tr.to, 'get', 'getCash', 'getCards', t('youGive', { p: esc(pname(tr.to)) }))}</div><p class="warn" id="trWarn">${prob && prob !== 'trEmpty' ? t(prob) : ''}</p><div class="row"><button type="button" class="btn pri" id="trSend" ${prob ? 'disabled' : ''}>${t('trSend')}</button><button type="button" class="btn" data-close="dTrade">${t('trCancel')}</button></div>`;
  }
  // Lê a proposta direto dos campos. Só a troca de parceiro redesenha a janela: redesenhar a cada
  // mudança apagava o elemento sob o mouse e o clique seguinte se perdia (por exemplo, digitar um
  // valor e clicar numa propriedade enviava só o dinheiro, sem a propriedade).
  function readTrade() {
    const d = $('dTrade');
    tr.give = [...d.querySelectorAll('input[data-tr="give"]:checked')].map((x) => +x.value);
    tr.get = [...d.querySelectorAll('input[data-tr="get"]:checked')].map((x) => +x.value);
    d.querySelectorAll('[data-trc]').forEach((x) => { tr[x.dataset.trc] = Math.max(0, Math.floor(+x.value || 0)); });
    d.querySelectorAll('[data-trk]').forEach((x) => { tr[x.dataset.trk] = x.checked ? 1 : 0; });
    const prob = E.tradeProblem(S, Object.assign({ from: S.turn }, tr));
    $('trWarn').textContent = prob && prob !== 'trEmpty' ? t(prob) : '';
    $('trSend').disabled = !!prob;
    return prob;
  }
  $('dTrade').addEventListener('input', (e) => { if (e.target.dataset.trc) readTrade(); });
  $('dTrade').addEventListener('change', (e) => {
    const x = e.target;
    if (x.id === 'trTo') { tr.to = +x.value; tr.get = []; tr.getCash = 0; tr.getCards = 0; renderTrade(); }
    else readTrade();
  });
  $('dTrade').addEventListener('click', (e) => {
    if (e.target.id !== 'trSend' || readTrade()) return;
    const a = { type: 'propose', trade: { to: tr.to, give: tr.give.slice(), get: tr.get.slice(), giveCash: tr.giveCash, getCash: tr.getCash, giveCards: tr.giveCards, getCards: tr.getCards } };
    $('dTrade').close(); dispatch(a);
  });

  // ---------------------------------------------------------------- som
  let audio = null;
  function tone(f, d, type, v, when) {
    if (!soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const o = audio.createOscillator(), g = audio.createGain(), st = audio.currentTime + (when || 0);
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, st);
      g.gain.setValueAtTime(v || 0.05, st); g.gain.exponentialRampToValueAtTime(0.0001, st + d);
      o.connect(g); g.connect(audio.destination); o.start(st); o.stop(st + d);
    } catch (e) { /* sem áudio */ }
  }
  function sfx(k) {
    if (k === 'step') tone(440, 0.04, 'triangle', 0.025);
    else if (k === 'dice') [0, 0.06, 0.13].forEach((w) => tone(900 + w * 800, 0.04, 'square', 0.02, w));
    else if (k === 'coin') { tone(990, 0.07, 'sine', 0.05); tone(1320, 0.12, 'sine', 0.05, 0.06); }
    else if (k === 'card') tone(660, 0.1, 'triangle', 0.04);
    else if (k === 'bad') tone(170, 0.14, 'sawtooth', 0.03);
    else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, i * 0.12));
    else if (k === 'lose') [392, 349, 311, 262].forEach((f, i) => tone(f, 0.3, 'sine', 0.06, i * 0.2));
  }

  // ---------------------------------------------------------------- telas
  function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; $('toasts').appendChild(el); setTimeout(() => el.remove(), 2600); }
  function showEnd() {
    const o = S.over, tie = o.winners.length > 1;
    let h = `<svg class="art2" viewBox="0 0 600 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${skyline(600, 150)}</svg><h2 id="endH">${tie ? t('endTie') : t('endWin', { p: esc(pname(o.winners[0])) })}</h2><p>${t(o.why === 'last' ? 'endLast' : 'endTime')}</p><div class="rank">`;
    o.rank.forEach((r) => { h += `<div><span>${esc(pname(r.i))}</span><strong>${money(r.w)}</strong></div>`; });
    h += `</div><div class="row"><button type="button" class="btn pri" id="bAgain">${t('again')}</button><button type="button" class="btn" data-close="dEnd">${t('seeBoard')}</button></div>`;
    $('dEnd').innerHTML = h;
    if (!$('dEnd').open) $('dEnd').showModal();
  }
  $('dEnd').addEventListener('click', (e) => { if (e.target.id === 'bAgain') { $('dEnd').close(); showMenu(); } });

  function enterGame() {
    $('ovTitle').hidden = true; $('app').hidden = false;
    buildBoard();
    ensureTokens();
    render();
    if (S.over) showEnd(); else schedule();
  }
  function showMenu() {
    clearTimeout(aiTimer);
    if (S) save();
    $('app').hidden = true; $('ovTitle').hidden = false;
    refreshResume();
  }
  function refreshResume() { const g = Store.get('poaEmJogo.game'); $('bResume').hidden = !(g && !g.over && g.players); }

  let setupRows = [];
  const CPU_NAMES = ['Tchê', 'Guria', 'Piá', 'Gaudério', 'Prenda', 'Bagual'];
  function defaultRows() { return [{ name: '', kind: 'human' }, { name: CPU_NAMES[0], kind: 1 }, { name: CPU_NAMES[1], kind: 1 }, { name: CPU_NAMES[2], kind: 1 }]; }
  function renderSetup() {
    $('setup').innerHTML = setupRows.map((r, i) => `<div class="ln"><span class="ptk" style="background:${COLORS[i]}">${tokenSvg(i)}</span><input type="text" maxlength="16" data-sn="${i}" value="${esc(r.name)}" placeholder="${esc(t('playerN', { n: i + 1 }))}" aria-label="${esc(t('playerN', { n: i + 1 }))}"><select data-sk="${i}" aria-label="${esc(t('playerN', { n: i + 1 }))}">${['human', 0, 1, 2].map((k) => `<option value="${k}" ${String(r.kind) === String(k) ? 'selected' : ''}>${t(k === 'human' ? 'human' : 'cpu' + k)}</option>`).join('')}</select>${setupRows.length > 2 ? `<button type="button" class="iconbtn" data-rm="${i}" aria-label="${esc(t('remove'))}">×</button>` : '<span></span>'}</div>`).join('');
    $('bAdd').hidden = setupRows.length >= 6;
  }
  $('setup').addEventListener('input', (e) => { const x = e.target; if (x.dataset.sn != null) setupRows[+x.dataset.sn].name = x.value; });
  $('setup').addEventListener('change', (e) => {
    const x = e.target;
    if (x.dataset.sk != null) { const r = setupRows[+x.dataset.sk]; r.kind = x.value === 'human' ? 'human' : +x.value; if (r.kind !== 'human' && !r.name) r.name = CPU_NAMES[+x.dataset.sk]; }
    renderSetup();
  });
  $('setup').addEventListener('click', (e) => { const x = e.target.closest('[data-rm]'); if (x) { setupRows.splice(+x.dataset.rm, 1); renderSetup(); } });
  $('bAdd').addEventListener('click', () => { if (setupRows.length < 6) { const i = setupRows.length; setupRows.push({ name: CPU_NAMES[i], kind: 1 }); renderSetup(); } });
  function startGame() {
    const players = setupRows.map((r, i) => ({ name: r.name.trim() || t('playerN', { n: i + 1 }), kind: r.kind }));
    Store.set('poaEmJogo.prefs', Object.assign({}, Store.get('poaEmJogo.prefs') || {}, { rows: setupRows, dur: +$('durSel').value }));
    S = E.newGame({ players, maxRounds: +$('durSel').value, seed: (Math.random() * 2147483647) | 0 });
    save();
    enterGame();
  }
  function resumeGame() { const g = Store.get('poaEmJogo.game'); if (g && !g.over) { S = g; S.fx = []; enterGame(); } }
  const savePref = (o) => Store.set('poaEmJogo.prefs', Object.assign({}, Store.get('poaEmJogo.prefs') || {}, o));
  function applySoundSpeed() { $('bSound').textContent = t(soundOn ? 'soundOn' : 'soundOff'); $('bSpeed').textContent = t(fast ? 'speedF' : 'speedN'); document.body.classList.toggle('fast', fast); }
  function applyLang() {
    document.documentElement.lang = TAG[lang];
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('rulesList').innerHTML = t('rulesList').map((x) => `<li>${x}</li>`).join('');
    $('langSel').value = lang;
    $('backLink').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    $('heroArt').innerHTML = skyline(640, 170);
    renderSetup(); applySoundSpeed();
    if (S && !$('app').hidden) render();
  }

  // ---------------------------------------------------------------- cliques
  $('action').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'tradeOpen') openTrade();
    else if (a === 'mineOpen') openMine();
    else if (a === 'deedOpen') openDeed(+b.dataset.sq);
    else if (a === 'showEnd') showEnd();
    else if (a === 'bid') dispatch({ type: 'bid', amount: +b.dataset.amt });
    else if (a === 'bankrupt') { if (window.confirm(t('confirmBankrupt'))) dispatch({ type: 'bankrupt' }); }
    else dispatch({ type: a });
  });
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-close]');
    if (c) { $(c.dataset.close).close(); if (c.dataset.close === 'dDeed') deedSq = null; return; }
    const m = e.target.closest('[data-m]');
    if (m && !m.disabled) dispatch({ type: m.dataset.m, sq: +m.dataset.sq });
  });
  $('board').addEventListener('click', (e) => { const c = e.target.closest('[data-sq]'); if (c) openDeed(+c.dataset.sq); });
  $('dDeed').addEventListener('close', () => { deedSq = null; });
  $('bMine').addEventListener('click', () => { if (S) openMine(); });
  const openRules = () => { $('dRules').showModal(); $('dRules').scrollTop = 0; };
  $('bRules').addEventListener('click', openRules);
  $('bRules2').addEventListener('click', openRules);
  $('bRulesClose').addEventListener('click', () => $('dRules').close());
  $('bMenu').addEventListener('click', showMenu);
  $('bPlay').addEventListener('click', startGame);
  $('bResume').addEventListener('click', resumeGame);
  $('bSound').addEventListener('click', () => { soundOn = !soundOn; savePref({ sound: soundOn }); applySoundSpeed(); });
  $('bSpeed').addEventListener('click', () => { fast = !fast; savePref({ fast }); applySoundSpeed(); });
  $('langSel').addEventListener('change', () => { lang = $('langSel').value; savePref({ lang }); applyLang(); });
  window.addEventListener('resize', placeTokens);

  // ---------------------------------------------------------------- início
  const prefs = Store.get('poaEmJogo.prefs') || {};
  const hashLang = location.hash.slice(1), navLang = ((navigator.language || 'pt').slice(0, 2)).toLowerCase();
  lang = I18N[hashLang] ? hashLang : (prefs.lang && I18N[prefs.lang] ? prefs.lang : (I18N[navLang] ? navLang : 'pt'));
  soundOn = prefs.sound !== false;
  fast = !!prefs.fast;
  setupRows = Array.isArray(prefs.rows) && prefs.rows.length >= 2 ? prefs.rows : defaultRows();
  if (prefs.dur != null) $('durSel').value = String(prefs.dur);
  applyLang();
  refreshResume();
})();
</script>
</body>
</html>
