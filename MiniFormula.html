<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Mini Fórmula 1990 · Giovani Perotto Mesquita</title>
<meta name="description" content="Corrida de mini carros de fórmula vistos de cima, nas 16 pistas do campeonato de 1990. Direção pelo mouse, acelerador na tecla A e freio na Z. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<style>
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --surface-2:#FBF1E3; --ink:#2B1B3D; --text:#3E3350; --muted:#756986; --line:#F1E2CF;
  --accent:#0E8074; --accent-ink:#FFFFFF; --accent-soft:#E2F6F2; --gold:#FFB703; --gold-ink:#B35300; --gold-soft:#FFF1C9; --bad:#C62828;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif; --serif:Georgia,"Times New Roman",serif; --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#1A1328; --surface:#241A36; --surface-2:#2D2244; --ink:#F7F0FF; --text:#E2D8F0; --muted:#A898C0; --line:#3A2D52;
  --accent:#5FD3C4; --accent-ink:#10231F; --accent-soft:#1D3A38; --gold:#FFC94D; --gold-ink:#FFC94D; --gold-soft:#3A2E12; --bad:#FF8A8A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;padding:.45rem .8rem;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--serif);font-size:1.2rem;margin:0;color:var(--ink);line-height:1.1}
.brand p{margin:0;font-size:.78rem;color:var(--muted)}
.tools{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem .75rem;min-height:38px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.big{font-size:1.05rem;padding:.6rem 1.3rem;min-height:48px}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.35rem .5rem;min-height:38px;color:var(--ink)}
.stage{position:relative;flex:1;min-height:0;background:#2F6B2F}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.touch{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:12px}
.touch button{width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(0,0,0,.42);color:#fff;font-weight:800;font-size:1.05rem;line-height:1.1;touch-action:none;user-select:none;-webkit-user-select:none}
.touch button.on{background:rgba(255,183,3,.75);color:#1a1000}
.touch #tBrake.on{background:rgba(198,40,40,.85);color:#fff}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:.4rem .8rem;border-radius:10px;font-size:.85rem;pointer-events:none;max-width:calc(100% - 200px);text-align:center}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:0;width:min(760px,calc(100vw - 20px));max-height:calc(100vh - 20px)}
dialog::backdrop{background:rgba(10,20,15,.6)}
.dlg{padding:1rem 1.1rem 1.1rem;overflow:auto}
.dlg h2{font-family:var(--serif);color:var(--ink);margin:0 0 .7rem;font-size:1.3rem}
.dlg h3{color:var(--ink);margin:1rem 0 .3rem;font-size:1rem}
.dlg p,.dlg li{line-height:1.5;max-width:68ch}
.dlg table{width:100%;border-collapse:collapse;font-size:.88rem}
.dlg th,.dlg td{border-bottom:1px solid var(--line);padding:.3rem .4rem;text-align:left}
.dlg td.n,.dlg th.n{text-align:right;font-variant-numeric:tabular-nums}
.dlg tr.me td,.dlg tr.me th{background:var(--gold-soft);font-weight:700}
.setup{display:grid;grid-template-columns:1.1fr 1fr;gap:1rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem;align-content:start}
.form label{display:flex;flex-direction:column;gap:.2rem;font-size:.84rem;font-weight:600;color:var(--ink);min-width:0}
.form select,.form input{width:100%;min-width:0;max-width:100%}
.form .full{grid-column:1/-1}
.form small{font-weight:400;color:var(--muted)}
.preview{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:.6rem;display:flex;flex-direction:column;gap:.4rem;min-width:0}
.preview canvas{width:100%;aspect-ratio:1/1;background:#2F6B2F;border-radius:10px}
.preview dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.15rem .7rem;font-size:.84rem}
.preview dt{color:var(--muted)}
.preview dd{margin:0;color:var(--ink);font-weight:600}
.colors{display:flex;gap:.35rem;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.colors button[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px}
.acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 .4rem;font-family:var(--sans);font-weight:700;background:var(--surface-2);color:var(--ink)}
@media (max-width:760px){.setup{grid-template-columns:1fr}.brand p{display:none}.preview canvas{max-width:260px;align-self:center}}
@media (max-width:480px){.form{grid-template-columns:1fr}.tools .btn{padding:.35rem .5rem}.brand h1{font-size:1.05rem}.hint{max-width:calc(100% - 24px);bottom:196px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#2F6B2F"/><path d="M6 34C6 18 14 10 34 8" stroke="#4A4D52" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M6 34C6 18 14 10 34 8" stroke="#fff" stroke-width="1" stroke-dasharray="3 3" fill="none"/><g transform="translate(17 17) rotate(-40)"><rect x="-7" y="-2.2" width="14" height="4.4" rx="2" fill="#E63946"/><rect x="-8" y="-4" width="2.5" height="8" fill="#222"/><rect x="5.5" y="-3.6" width="2" height="7.2" fill="#222"/><circle cx="0" cy="0" r="1.4" fill="#FFB703"/></g></svg>
    <div><h1 data-i="title"></h1><p data-i="subtitle"></p></div>
  </div>
  <div class="tools">
    <button type="button" class="btn primary" id="bNew" data-i="newRace"></button>
    <button type="button" class="btn" id="bPause" data-i="pause"></button>
    <button type="button" class="btn" id="bHelp" data-i="help"></button>
    <button type="button" class="btn" id="bMouse" aria-pressed="true" data-ta="mouseToggle">🖱️</button>
    <button type="button" class="btn" id="bSound" aria-pressed="true" data-ta="sound">🔊</button>
    <button type="button" class="btn" id="bTheme" data-ta="theme">◐</button>
    <select id="sLang" data-ta="lang"><option value="pt">🇧🇷 PT</option><option value="en">🇬🇧 EN</option><option value="it">🇮🇹 IT</option><option value="es">🇪🇸 ES</option></select>
  </div>
</header>
<main class="stage" id="stage">
  <canvas id="cv" tabindex="0" role="application" aria-describedby="live"></canvas>
  <div class="touch" id="touch" hidden><button type="button" id="tBrake" aria-label="Z">Z<br><small data-i="brakeShort"></small></button><button type="button" id="tGas" aria-label="A">A<br><small data-i="gasShort"></small></button></div>
  <p class="hint" id="hint" hidden></p>
  <p class="sr" id="live" aria-live="polite"></p>
</main>

<dialog id="dSetup" aria-labelledby="hSetup"><div class="dlg">
  <h2 id="hSetup" data-i="setupTitle"></h2>
  <div class="setup">
    <div class="form">
      <label class="full"><span data-i="track"></span><select id="fTrack"></select></label>
      <label><span data-i="mode"></span><select id="fMode"><option value="race" data-i="mRace"></option><option value="practice" data-i="mPractice"></option></select></label>
      <label><span data-i="laps"></span><select id="fLaps"><option>1</option><option selected>3</option><option>5</option><option>10</option><option>20</option></select></label>
      <label><span data-i="opponents"></span><select id="fOpp"><option>1</option><option>3</option><option>5</option><option selected>7</option><option>9</option></select></label>
      <label><span data-i="level"></span><select id="fLevel"><option value="easy" data-i="lvEasy"></option><option value="normal" data-i="lvNormal"></option><option value="hard" data-i="lvHard"></option></select></label>
      <label><span data-i="grid"></span><select id="fGrid"><option value="last" data-i="gLast"></option><option value="mid" data-i="gMid"></option><option value="pole" data-i="gPole"></option></select></label>
      <label><span data-i="steer"></span><select id="fSteer"><option value="aim" data-i="stAim"></option><option value="wheel" data-i="stWheel"></option></select></label>
      <label><span data-i="camera"></span><select id="fCam"><option value="north" data-i="camNorth"></option><option value="follow" data-i="camFollow"></option></select></label>
      <label><span data-i="mouseOpt"></span><select id="fMouse"><option value="on" data-i="mouseOn"></option><option value="off" data-i="mouseOff"></option></select></label>
      <label><span data-i="lineOpt"></span><select id="fLine"><option value="off" data-i="lineOff"></option><option value="on" data-i="lineOn"></option></select></label>
      <label><span data-i="pedalOpt"></span><select id="fPedal"><option value="manual" data-i="pManual"></option><option value="auto" data-i="pAuto"></option></select></label>
      <label><span data-i="seed"></span><input type="text" id="fSeed" inputmode="numeric" maxlength="9" autocomplete="off"></label>
      <div class="full"><span style="font-size:.84rem;font-weight:600;color:var(--ink)" data-i="color" id="lColor"></span><div class="colors" id="colors" role="group" aria-labelledby="lColor"></div></div>
    </div>
    <div class="preview">
      <canvas id="pv" width="320" height="320" role="img" aria-labelledby="pvCap"></canvas>
      <p id="pvCap" class="sr"></p>
      <dl id="pvInfo"></dl>
    </div>
  </div>
  <div class="acts"><button type="button" class="btn" id="bSetupCancel" data-i="cancel"></button><button type="button" class="btn primary big" id="bStart" data-i="start"></button></div>
</div></dialog>

<dialog id="dHelp" aria-labelledby="hHelp"><div class="dlg">
  <h2 id="hHelp" tabindex="-1" data-i="helpTitle"></h2>
  <div id="helpBody"></div>
  <div class="acts"><button type="button" class="btn primary" id="bHelpClose" data-i="close"></button></div>
</div></dialog>

<dialog id="dEnd" aria-labelledby="hEnd"><div class="dlg">
  <h2 id="hEnd"></h2>
  <p id="endText"></p>
  <div style="overflow-x:auto"><table><thead id="endHead"></thead><tbody id="endRows"></tbody></table></div>
  <p id="endMeta" style="color:var(--muted);font-size:.84rem"></p>
  <div class="acts"><button type="button" class="btn" id="bEndView" data-i="viewTrack"></button><button type="button" class="btn" id="bEndSetup" data-i="options"></button><button type="button" class="btn primary big" id="bAgain" data-i="again"></button></div>
</div></dialog>

  helpBody:[`<h3>Controles</h3>
<table><tbody>
<tr><td><strong>Mouse</strong></td><td>No modo <em>Mira</em>, o carro vira em direção ao cursor; deixe o cursor um pouco à frente do carro. No modo <em>Volante</em>, mouse à esquerda ou à direita do centro da tela vira as rodas.</td></tr>
<tr><td><strong>Botões do mouse</strong></td><td>esquerdo acelera, direito freia</td></tr>
<tr><td><kbd>A</kbd></td><td>acelerador</td></tr>
<tr><td><kbd>Z</kbd></td><td>freio; com o carro parado, segure para dar ré</td></tr>
<tr><td><kbd>,</kbd> <kbd>.</kbd></td><td>viram para a esquerda e para a direita (as setas <kbd>←</kbd> <kbd>→</kbd> também)</td></tr>
<tr><td><kbd>P</kbd> ou <kbd>Esc</kbd></td><td>pausa (no treino livre, Esc encerra)</td></tr>
<tr><td>🖱️</td><td>ativa e desativa o mouse, também na opção <em>Mouse</em>. Desativado, você dirige só pelo teclado.</td></tr>
<tr><td>Toque</td><td>toque e arraste na pista para mirar; botões A e Z no canto</td></tr>
</tbody></table>
<h3>Pilotagem</h3>
<ul><li>Frear antes da curva rende mais que frear dentro dela. Os pneus têm um limite: virando e freando forte ao mesmo tempo, o carro escorrega e deixa marcas.</li>
<li>A velocidade aumenta a aderência nas curvas rápidas, como a asa de um carro de verdade, mas nas curvas lentas ela é pequena.</li>
<li>Grama e caixas de brita seguram pouco e freiam o carro. Os muros param o carro, sem causar danos.</li>
<li>O semáforo acende cinco luzes vermelhas. Quando elas apagam, acelere. Sair antes custa 5 segundos.</li></ul>
<h3>Ajudas</h3>
<ul><li><strong>Traçado ideal:</strong> uma linha mostra o caminho mais rápido à frente. Verde: acelere. Amarelo: curva no limite, mantenha. Vermelho: zona de frenagem. Se você chega rápido demais, a linha até a curva fica vermelha e aparece <em>FREIE</em>.</li>
<li><strong>Acelerador e freio automáticos:</strong> o carro acelera e freia sozinho conforme a curva à frente, e você só dirige. A tecla Z continua freando. Voltas feitas assim não contam como recorde pessoal.</li></ul>
<h3>As pistas</h3>
<p>São as 16 corridas do campeonato mundial de 1990, na ordem do calendário, de Phoenix a Adelaide. Cada pista tem o comprimento oficial da volta naquele ano, mas o desenho é <strong>simplificado</strong>: as curvas foram desenhadas à mão para lembrar o traçado, não copiadas de mapas. Em Suzuka, o oito passa por uma ponte. Datas, comprimentos e número de voltas vêm dos artigos da Wikipédia em inglês sobre cada Grande Prêmio de 1990 (consulta em 15/11/2026).</p>
<p>Os pilotos adversários são fictícios, e os carros não reproduzem pintura de nenhuma equipe. As placas de patrocínio também são de marcas inventadas, no estilo da época: as marcas reais de 1990 são registradas, e muitas eram de cigarro.</p>`,
`<h3>Controls</h3>
<table><tbody>
<tr><td><strong>Mouse</strong></td><td>In <em>Aim</em> mode, the car turns toward the cursor; keep the cursor a little ahead of the car. In <em>Wheel</em> mode, moving the mouse left or right of the screen centre turns the wheels.</td></tr>
<tr><td><strong>Mouse buttons</strong></td><td>left accelerates, right brakes</td></tr>
<tr><td><kbd>A</kbd></td><td>throttle</td></tr>
<tr><td><kbd>Z</kbd></td><td>brake; when stopped, hold it to reverse</td></tr>
<tr><td><kbd>,</kbd> <kbd>.</kbd></td><td>steer left and right (the <kbd>←</kbd> <kbd>→</kbd> arrows too)</td></tr>
<tr><td><kbd>P</kbd> or <kbd>Esc</kbd></td><td>pause (in free practice, Esc ends the session)</td></tr>
<tr><td>🖱️</td><td>turns the mouse on and off, also in the <em>Mouse</em> option. When it is off, you drive with the keyboard only.</td></tr>
<tr><td>Touch</td><td>touch and drag on the track to aim; A and Z buttons in the corner</td></tr>
</tbody></table>
<h3>Driving</h3>
<ul><li>Braking before a corner pays off more than braking in it. Tyres have a limit: turn and brake hard at the same time and the car slides and leaves marks.</li>
<li>Speed adds grip in fast corners, like the wing of a real car, but in slow corners there is little of it.</li>
<li>Grass and gravel traps hold little and slow the car down. Walls stop the car, without damage.</li>
<li>The start lights show five red lights. When they go out, accelerate. Leaving early costs 5 seconds.</li></ul>
<h3>Assists</h3>
<ul><li><strong>Racing line:</strong> a line shows the fastest path ahead. Green: accelerate. Yellow: corner at the limit, hold. Red: braking zone. If you arrive too fast, the line up to the corner turns red and <em>BRAKE</em> appears.</li>
<li><strong>Automatic throttle and brake:</strong> the car accelerates and brakes by itself for the corner ahead, and you only steer. The Z key still brakes. Laps driven this way do not count as personal records.</li></ul>
<h3>The tracks</h3>
<p>These are the 16 races of the 1990 world championship, in calendar order, from Phoenix to Adelaide. Each track has the official lap length of that year, but the layout is <strong>simplified</strong>: the corners were drawn by hand to resemble the circuit, not copied from maps. At Suzuka, the figure eight passes over a bridge. Dates, lengths and lap counts come from the English Wikipedia articles on each 1990 Grand Prix (consulted on 15 November 2026).</p>
<p>The rival drivers are fictional, and the cars do not reproduce any team’s livery. The sponsor boards are also made-up brands in the style of the period: the real 1990 brands are registered trademarks, and many were tobacco brands.</p>`,
`<h3>Comandi</h3>
<table><tbody>
<tr><td><strong>Mouse</strong></td><td>In modalità <em>Mira</em>, l’auto gira verso il cursore; tieni il cursore un po’ davanti all’auto. In modalità <em>Volante</em>, il mouse a sinistra o a destra del centro dello schermo gira le ruote.</td></tr>
<tr><td><strong>Tasti del mouse</strong></td><td>sinistro accelera, destro frena</td></tr>
<tr><td><kbd>A</kbd></td><td>acceleratore</td></tr>
<tr><td><kbd>Z</kbd></td><td>freno; ad auto ferma, tienilo premuto per la retromarcia</td></tr>
<tr><td><kbd>,</kbd> <kbd>.</kbd></td><td>sterzano a sinistra e a destra (anche le frecce <kbd>←</kbd> <kbd>→</kbd>)</td></tr>
<tr><td><kbd>P</kbd> o <kbd>Esc</kbd></td><td>pausa (nelle prove libere, Esc termina la sessione)</td></tr>
<tr><td>🖱️</td><td>attiva e disattiva il mouse, anche nell’opzione <em>Mouse</em>. Disattivato, guidi solo con la tastiera.</td></tr>
<tr><td>Tocco</td><td>tocca e trascina sulla pista per mirare; pulsanti A e Z nell’angolo</td></tr>
</tbody></table>
<h3>Guida</h3>
<ul><li>Frenare prima della curva rende più che frenare dentro. Le gomme hanno un limite: sterzando e frenando forte insieme, l’auto scivola e lascia segni.</li>
<li>La velocità aumenta l’aderenza nelle curve veloci, come l’ala di un’auto vera, ma nelle curve lente ce n’è poca.</li>
<li>Erba e ghiaia tengono poco e rallentano l’auto. I muri fermano l’auto, senza danni.</li>
<li>Il semaforo accende cinque luci rosse. Quando si spengono, accelera. Partire prima costa 5 secondi.</li></ul>
<h3>Aiuti</h3>
<ul><li><strong>Traiettoria ideale:</strong> una linea mostra il percorso più veloce davanti. Verde: accelera. Giallo: curva al limite, mantieni. Rosso: zona di frenata. Se arrivi troppo veloce, la linea fino alla curva diventa rossa e compare <em>FRENA</em>.</li>
<li><strong>Acceleratore e freno automatici:</strong> l’auto accelera e frena da sola in base alla curva davanti, e tu sterzi soltanto. Il tasto Z frena comunque. I giri fatti così non valgono come record personale.</li></ul>
<h3>Le piste</h3>
<p>Sono le 16 gare del campionato mondiale del 1990, nell’ordine del calendario, da Phoenix ad Adelaide. Ogni pista ha la lunghezza ufficiale del giro di quell’anno, ma il disegno è <strong>semplificato</strong>: le curve sono state disegnate a mano per ricordare il tracciato, non copiate da mappe. A Suzuka, l’otto passa su un ponte. Date, lunghezze e numero di giri vengono dagli articoli della Wikipedia in inglese su ogni Gran Premio del 1990 (consultati il 15/11/2026).</p>
<p>I piloti avversari sono inventati, e le auto non riproducono la livrea di alcuna squadra. Anche i cartelloni degli sponsor sono marchi inventati, nello stile dell’epoca: i marchi reali del 1990 sono registrati, e molti erano di sigarette.</p>`,

function syncMode() { const pr = $('#fMode').value === 'practice'; for (const id of ['#fLaps', '#fOpp', '#fLevel', '#fGrid']) $(id).closest('label').hidden = pr; }
function readSetup() {
  OPTS = Object.assign(OPTS, { track: $('#fTrack').value, mode: $('#fMode').value, laps: +$('#fLaps').value, opp: +$('#fOpp').value, level: $('#fLevel').value, grid: $('#fGrid').value, steer: $('#fSteer').value, cam: $('#fCam').value, mouse: $('#fMouse').value, line: $('#fLine').value, pedal: $('#fPedal').value, seed: ($('#fSeed').value.match(/\d+/) || [''])[0].slice(0, 9) });
  store.set('opts', OPTS);
}
function openSetup() { if (R && !R.over) R.paused = true; fillSetup(); if ($('#dEnd').open) $('#dEnd').close(); $('#dSetup').showModal(); $('#bStart').focus(); }
function newSeed() { return (Date.now() ^ Math.floor(performance.now() * 1000)) % 1000000000 >>> 0; }
function begin(seed) { syncMouse(); newRace(seed); $('#bPause').textContent = t('pause'); cv.focus({ preventScroll: true }); }
function showEnd(rows) {
  const p = R.player, L = R.tr.T.total, head = $('#endHead'), body = $('#endRows'); head.textContent = ''; body.textContent = '';
  const tr = document.createElement('tr');
  if (R.practice) {
    $('#hEnd').textContent = t('practiceTitle');
    $('#endText').textContent = t('endPractice', p.laps.length, R.def.gp[LI()] + ' (' + R.def.circuit + ')');
    for (const h of ['thLap', 'thTime']) { const th = document.createElement('th'); th.textContent = t(h); if (h === 'thTime') th.className = 'n'; tr.appendChild(th); }
    head.appendChild(tr);
    p.laps.forEach((lt, k) => { const r = document.createElement('tr'); if (lt === p.best) r.className = 'me'; const a = document.createElement('td'); a.textContent = k + 1; const b = document.createElement('td'); b.className = 'n'; b.textContent = fmtTime(lt); r.append(a, b); body.appendChild(r); });
    $('#endMeta').textContent = '';
  } else {
    const pos = rows.indexOf(p) + 1, place = R.def.gp[LI()] + ' (' + R.def.circuit + ')';
    $('#hEnd').textContent = pos === 1 ? t('endWin', R.def.circuit) : t('resultTitle');
    const ordEn = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
    $('#endText').textContent = LANG === 'en' ? t('endPos', ordEn(pos), place) : LANG === 'it' ? t('endPosIt', pos, place) : t('endPos', pos, place);
    for (const h of ['thPos', 'thDriver', 'thLaps', 'thTime', 'thBest']) { const th = document.createElement('th'); th.textContent = t(h); if (h !== 'thDriver') th.className = 'n'; tr.appendChild(th); }
    head.appendChild(tr);
    const win = rows[0];
    rows.forEach((c, k) => {
      const r = document.createElement('tr'); if (c.player) r.className = 'me';
      let time;
      if (c.finished) time = k === 0 ? fmtTime(c.finishT) : '+' + nf(c.finishT - win.finishT, 3) + ' s';
      else { const down = R.laps - Math.max(0, c.lap); time = down > 0 ? t('lapsDown', down) : t('dnf'); }
      for (const [v, cls] of [[k + 1, 'n'], [c.name, ''], [Math.max(0, Math.min(c.lap, R.laps)), 'n'], [time, 'n'], [fmtTime(c.best), 'n']]) { const td = document.createElement(cls ? 'td' : 'th'); if (cls) td.className = cls; td.textContent = v; r.appendChild(td); }
      body.appendChild(r);
    });
    $('#endMeta').textContent = t('endMeta', R.seed, t({ easy: 'lvEasy', normal: 'lvNormal', hard: 'lvHard' }[OPTS.level]), fmtTime(R.fastest.t), R.fastest.who, R.penalty ? '+' + R.penalty + ' s' : t('none'));
  }
  $('#dEnd').showModal(); $('#bAgain').focus();
}
function applyLang() {
  document.documentElement.lang = HTML_LANG[LANG]; document.title = t('title') + ' · Giovani Perotto Mesquita';
  document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-ta]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.ta)); el.title = t(el.dataset.ta); });
  $('#helpBody').innerHTML = t('helpBody'); $('#sLang').value = LANG; cv.setAttribute('aria-label', t('canvasLabel'));
  if ($('#dSetup').open) { fillTracks(); fillColors(); drawPreview(); }
  if (R) { R.player.name = t('you'); R.player.code = t('youShort'); $('#bPause').textContent = R.paused && !R.over ? t('resume') : t('pause'); }
}
function setLang(l, push) { LANG = LANGS.includes(l) ? l : 'pt'; store.set('lang', LANG); if (push) history.replaceState(null, '', LANG === 'pt' ? location.pathname + location.search : '#' + LANG); applyLang(); }
function setTheme(th) { document.documentElement.dataset.theme = th; minimap = null; }
function setSound(on) { SND.on = on; $('#bSound').textContent = on ? '🔊' : '🔇'; $('#bSound').setAttribute('aria-pressed', String(on)); if (on) SND.init(); }

$('#fTrack').addEventListener('change', drawPreview);
$('#fMode').addEventListener('change', syncMode);
$('#bNew').addEventListener('click', () => { if (R && !R.over && R.started && R.time > 3 && !window.confirm(t('confirmNew'))) return; openSetup(); });
$('#bStart').addEventListener('click', () => { SND.init(); readSetup(); $('#dSetup').close(); begin(OPTS.seed ? +OPTS.seed : newSeed()); });
$('#bSetupCancel').addEventListener('click', () => { $('#dSetup').close(); });
$('#dSetup').addEventListener('close', () => { if (!R) begin(OPTS.seed ? +OPTS.seed : newSeed()); else if (!R.over) { R.paused = false; $('#bPause').textContent = t('pause'); } });
$('#bPause').addEventListener('click', () => { togglePause(); cv.focus({ preventScroll: true }); });
$('#bHelp').addEventListener('click', () => { if (R && !R.over && !R.paused) togglePause(); $('#dHelp').showModal(); $('#hHelp').focus(); });
$('#bHelpClose').addEventListener('click', () => $('#dHelp').close());
$('#bTheme').addEventListener('click', () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; setTheme(th); store.set('theme', th); });
$('#bMouse').addEventListener('click', () => {
  OPTS.mouse = mouseOn() ? 'off' : 'on'; store.set('opts', OPTS); syncMouse();
  $('#hint').textContent = hintText();
  if (R && !R.over) { flash(mouseOn() ? t('mouseIsOn') : t('mouseIsOff'), 2); say(mouseOn() ? t('mouseIsOn') : t('mouseIsOff')); }
  cv.focus({ preventScroll: true });
});
$('#bSound').addEventListener('click', () => { const on = !SND.on; store.set('sound', on); setSound(on); });
$('#sLang').addEventListener('change', (e) => setLang(e.target.value, true));
$('#bAgain').addEventListener('click', () => { $('#dEnd').close(); begin(OPTS.seed ? (R.seed + 1) >>> 0 : newSeed()); });
$('#bEndSetup').addEventListener('click', openSetup);
$('#bEndView').addEventListener('click', () => $('#dEnd').close());
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== LANG) setLang(h, false); });

(function init() {
  setTheme(store.get('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const snd = store.get('sound'); SND.on = snd === null ? true : !!snd; $('#bSound').textContent = SND.on ? '🔊' : '🔇';
  const h = location.hash.slice(1), saved = store.get('lang'), nav = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  LANG = LANGS.includes(h) ? h : LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'pt';
  if (COARSE) { $('#touch').hidden = false; $('#bMouse').hidden = true; }
  resize(); applyLang(); syncMouse();
  requestAnimationFrame(frame);
  openSetup();
})();
</script>
</body>
</html>
