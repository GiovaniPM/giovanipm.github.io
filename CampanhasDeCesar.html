<!DOCTYPE html>

<title>As Campanhas de César · Giovani Perotto Mesquita</title>
<meta name="description" content="Jogo de tabuleiro com dados sobre as campanhas de Júlio César, da Guerra das Gálias (58–51 a.C.) à Guerra Civil (49–45 a.C.), com eventos, números e batalhas tirados dos Commentarii. Em português, inglês, italiano e espanhol.">

<style>

  }
  :root[data-theme="dark"] { --panel: #241C15; --panel-2: #30261D; --ink: #F1E7D3; --muted: #BDAA8C; --line: #4A3C2C; --accent: #E0614F; --accent-ink: #1A0E08; --ok: #7CC48A; --sea: #2D4651; --sea-2: #253B45; --land: #5A4C36; --land-2: #4E412E; --road: #D8B888; --river: #86BED0; --searoute: #9CC3E6; --coast: #C9B48E; --mapink: #F1E7D3; --hatch: #C9A574; --tree: #9CC48A; color-scheme: dark; }

  .topbar .date { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: #F7D27A; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: .45rem .8rem; font-weight: 600; min-height: 38px; }

  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #0006; }
  /* mapa */
  .node { cursor: pointer; }
  .node .lbl { font-family: var(--serif); font-size: 9px; fill: #2A1D14; paint-order: stroke; stroke: #F4EAD3; stroke-width: 2.4px; stroke-linejoin: round; pointer-events: none; }
  .rvl { font-size: calc(var(--k, 1) * 10px); font-style: italic; fill: var(--river); paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--k, 1) * 2.4px); }
  .mtl { font-size: calc(var(--k, 1) * 11px); font-style: italic; letter-spacing: .12em; fill: var(--road); paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--k, 1) * 2.4px); }
  .scalebar { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 5px; font-family: var(--serif); font-size: .72rem; color: var(--ink); }

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node circle.dot { stroke: #F1E7D3; } }
  .node.reach circle.dot { stroke: #F7D27A; stroke-width: 3; }

  .army { cursor: pointer; }
  .army.sel rect.bg { stroke: #F7D27A; stroke-width: 3; }
  .army text { font-family: var(--sans); font-weight: 700; pointer-events: none; }
  /* painel */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stats div { background: var(--panel-2); border-radius: 8px; padding: 4px; }
  .stats b { display: block; font-family: var(--serif); font-size: 1.15rem; }
  .stats span { font-size: .72rem; color: var(--muted); }
  .armies { display: flex; flex-direction: column; gap: 4px; }
  .armies button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 8px; display: flex; justify-content: space-between; gap: 6px; font-size: .84rem; }
  .armies button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  .cp { font-weight: 700; color: var(--accent); }

  .logbox li.h { font-weight: 700; color: var(--accent); font-family: var(--serif); border-bottom: 0; padding-top: 6px; }
  .logbox li.q { font-style: italic; color: var(--muted); }

  .dice { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; align-items: center; }
  .die { width: 28px; height: 28px; border-radius: 6px; background: #FBF7EE; border: 1px solid #8A7556; box-shadow: inset 0 -2px 0 #0002, 0 1px 2px #0004; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 3px; }
  .die.red { background: #8E1B1B; border-color: #5A0F0F; }
  .die.red i { background: #FBF0D8; }
  .die.grn { background: #3E6B3A; border-color: #24401F; }
  .die.grn i { background: #F3EBD3; }
  .die.pur { background: #5B2D6E; border-color: #3A1B47; }
  .die.pur i { background: #F3EBD3; }
  .die i { width: 5px; height: 5px; border-radius: 50%; background: #2A1D14; place-self: center; visibility: hidden; }
  .die.hit { box-shadow: 0 0 0 2px var(--gold), 0 1px 2px #0004; }
  .die.miss { opacity: .55; }
  .die.roll { animation: roll .45s ease-out; }
  @keyframes roll { 0% { transform: rotate(-200deg) scale(.6); } 70% { transform: rotate(20deg) scale(1.1); } 100% { transform: none; } }
  /* diálogos */
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); width: min(760px, calc(100vw - 20px)); max-height: calc(100dvh - 30px); padding: 1rem 1.1rem; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-family: var(--serif); margin: 0 0 .5rem; }
  dialog h3 { margin: .9rem 0 .3rem; font-size: 1rem; font-family: var(--serif); }
  dialog p, dialog li { line-height: 1.5; font-size: .92rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .6rem; }
  .bt-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bt-sides > div { background: var(--panel-2); border-radius: 10px; padding: 8px; }
  .bt-sides h3 { margin: 0 0 4px; }
  .bt-sides ul { margin: 4px 0; padding-left: 1.1rem; font-size: .82rem; }
  .bt-val { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; }
  .bt-log { max-height: 200px; overflow: auto; font-size: .85rem; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .bt-log p { margin: .2rem 0; }
  .quote { font-family: var(--serif); font-style: italic; color: var(--muted); border-left: 3px solid var(--gold); padding-left: .7rem; margin: .5rem 0; }
  .ev-src { font-size: .78rem; color: var(--muted); }
  .overlay { position: fixed; inset: 0; z-index: 50; overflow: auto; background: radial-gradient(ellipse at 50% 25%, #5A3A20, #1A120B 75%); display: flex; align-items: flex-start; justify-content: center; padding: 16px; }
  .sheet { width: min(860px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.2rem 1.2rem; margin: auto 0; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .sheet h1 { font-family: var(--serif); margin: .2rem 0; font-size: clamp(1.7rem, 5vw, 2.5rem); letter-spacing: .02em; }
  .sheet .tag2 { margin: 0 0 .6rem; color: var(--muted); }
  .sheet .back { color: var(--accent); font-weight: 600; text-decoration: none; font-size: .9rem; }
  .hero { font-family: var(--serif); text-align: center; letter-spacing: .3em; color: var(--accent); font-size: .9rem; margin: .3rem 0; }
  .scen { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: .6rem 0; }
  .scen label { border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; background: var(--panel-2); display: flex; gap: .5rem; align-items: flex-start; cursor: pointer; }

  .field { display: flex; flex-direction: column; gap: .2rem; font-size: .85rem; font-weight: 600; }
  .field select, .field input { font-weight: 400; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: .4rem .5rem; min-height: 38px; }

</head>
<body>
<div class="app" id="app" hidden>

    </div>
  </main>
  <aside class="side">
    <section class="box"><div class="stats"><div><b id="sGloria">0</b><span data-t="gloria"></span></div><div><b id="sAuct">0</b><span data-t="auctoritas"></span></div><div><b id="sMil">0</b><span data-t="soldiers"></span></div></div></section>
    <section class="box"><h2 data-t="yourArmies"></h2><div class="armies" id="armyList"></div></section>
    <section class="box" id="selBox"></section>
    <section class="box"><h2 data-t="diceT"></h2><div class="dice" id="diceTray" aria-live="polite"></div><p class="muted" id="diceTxt"></p>
      <div class="row"><button type="button" class="btn pri" id="bEnd" data-t="endSeason"></button></div></section>
    <section class="box logbox"><h2 data-t="logT"></h2><ol id="log"></ol></section>
  </aside>
</div>

<section class="overlay" id="ovSetup" aria-labelledby="ttl">
  <div class="sheet">
    <a class="back" id="backLink" href="projects.html" data-t="back"></a>
    <p class="hero">S · P · Q · R</p>
    <h1 id="ttl" data-t="title"></h1>
    <p class="tag2" data-t="tagline"></p>
    <p class="quote" data-t="openQuote"></p>
    <div class="scen" id="scenList" role="radiogroup"></div>
    <div class="grid">
      <label class="field"><span data-t="difficulty"></span><select id="sDiff"><option value="0" data-t="d0"></option><option value="1" data-t="d1"></option><option value="2" data-t="d2"></option></select></label>

      <label class="field"><span data-t="seed"></span><input id="sSeed" inputmode="numeric" autocomplete="off"></label>
    </div>
    <div class="row">
      <button type="button" class="btn pri" id="bPlay" data-t="play"></button>
      <button type="button" class="btn" id="bResume" data-t="resume" hidden></button>
      <button type="button" class="btn" id="bRules2" data-t="rules"></button>
      <button type="button" class="btn" id="bTheme2"></button>
    </div>
  </div>
</section>

<dialog id="dRules" aria-labelledby="rulesH"><h2 id="rulesH" data-t="rules"></h2><div id="rulesBody"></div><div class="row"><button type="button" class="btn pri" id="bRulesClose" data-t="close"></button></div></dialog>
<dialog id="dEvent" aria-labelledby="evH"><h2 id="evH"></h2><div id="evBody"></div><div class="row" id="evBtns"></div></dialog>
<dialog id="dBattle" aria-labelledby="btH"><h2 id="btH"></h2><div id="btBody"></div><div class="dice" id="btDice"></div><div class="bt-log" id="btLog" aria-live="polite"></div><div class="row" id="btBtns"></div></dialog>

    deceitP: ['O chefe dos eburões jura que toda a Gália se levantou e que os germanos atravessaram o Reno. Oferece passagem livre se as coortes deixarem o acampamento. Sabino aceitou; Cota queria resistir (BG V.27–31).', 'The Eburonian chief swears that all Gaul has risen and the Germans have crossed the Rhine. He offers safe passage if the cohorts leave the camp. Sabinus accepted; Cotta wanted to hold out (BG V.27–31).', 'Il capo degli Eburoni giura che tutta la Gallia è insorta e che i Germani hanno passato il Reno. Offre libero passaggio se le coorti lasciano il campo. Sabino accettò; Cotta voleva resistere (BG V.27–31).', 'El jefe de los eburones jura que toda la Galia se ha alzado y que los germanos han cruzado el Rin. Ofrece paso libre si las cohortes dejan el campamento. Sabino aceptó; Cota quería resistir (BG V.27–31).'],

    lostAuct: ['A Auctoritas de César chegou ao fim. O Senado o chama de volta a Roma para responder em juízo.', 'Caesar’s Auctoritas is spent. The Senate recalls him to Rome to stand trial.', 'L’Auctoritas di Cesare è esaurita. Il Senato lo richiama a Roma per essere processato.', 'La Auctoritas de César se agotó. El Senado lo llama a Roma para ser juzgado.'],

    histCmp: ['Na história, César recebeu ações de graças de 15 dias em 57, de 20 em 55 e de 20 em 52, e celebrou quatro triunfos em 46 a.C.', 'In history, Caesar received thanksgivings of 15 days in 57, 20 in 55 and 20 in 52, and celebrated four triumphs in 46 BC.', 'Nella storia, Cesare ricevette ringraziamenti di 15 giorni nel 57, di 20 nel 55 e di 20 nel 52, e celebrò quattro trionfi nel 46 a.C.', 'En la historia, César recibió acciones de gracias de 15 días en el 57, de 20 en el 55 y de 20 en el 52, y celebró cuatro triunfos en el 46 a. C.'],

  // eventos históricos: título e texto; a fonte é dada à parte
  const EV = {
    helvetii: [['Os helvécios migram', 'Os helvécios queimam suas aldeias e partem rumo às terras dos sântonos: 368.000 pessoas, 92.000 em armas, segundo as tabuletas achadas no acampamento deles. Barre a passagem antes que cheguem.'], ['The Helvetii migrate', 'The Helvetii burn their villages and set out for the land of the Santones: 368,000 people, 92,000 under arms, according to the tablets found in their camp. Bar the way before they arrive.'], ['Gli Elvezi migrano', 'Gli Elvezi bruciano i villaggi e partono verso le terre dei Santoni: 368.000 persone, 92.000 in armi, secondo le tavolette trovate nel loro accampamento. Sbarra loro la strada prima che arrivino.'], ['Los helvecios emigran', 'Los helvecios queman sus aldeas y parten hacia las tierras de los sántonos: 368.000 personas, 92.000 en armas, según las tablillas halladas en su campamento. Cierra el paso antes de que lleguen.'], 'BG I.5–29'],
    ariovistus: [['Ariovisto, rei dos suevos', 'Os éduos e os séquanos pedem ajuda contra Ariovisto: cerca de 120.000 germanos já atravessaram o Reno. Ele traz 6.000 cavaleiros e outros tantos infantes ligeiros.'], ['Ariovistus, king of the Suebi', 'The Aedui and Sequani ask for help against Ariovistus: about 120,000 Germans have already crossed the Rhine. He brings 6,000 horsemen and as many light infantry.'], ['Ariovisto, re degli Suebi', 'Edui e Sequani chiedono aiuto contro Ariovisto: circa 120.000 Germani hanno già passato il Reno. Porta 6.000 cavalieri e altrettanti fanti leggeri.'], ['Ariovisto, rey de los suevos', 'Los eduos y los sécuanos piden ayuda contra Ariovisto: unos 120.000 germanos ya han cruzado el Rin. Trae 6.000 jinetes y otros tantos infantes ligeros.'], 'BG I.31–53'],
    belgae: [['A coalizão belga', 'Os belgas juram guerra contra Roma. Os remos se entregam a César e contam o que cada povo prometeu: suessiões 50.000, nérvios 50.000, belóvacos 60.000 escolhidos, e muitos outros. Os nérvios esperam nas florestas do Sabis.'], ['The Belgic coalition', 'The Belgae swear war on Rome. The Remi submit to Caesar and report what each people has promised: Suessiones 50,000, Nervii 50,000, Bellovaci 60,000 picked men, and many more. The Nervii wait in the forests by the Sabis.'], ['La coalizione belga', 'I Belgi giurano guerra a Roma. I Remi si consegnano a Cesare e riferiscono ciò che ogni popolo ha promesso: Suessioni 50.000, Nervi 50.000, Bellovaci 60.000 scelti, e molti altri. I Nervi attendono nelle foreste del Sabis.'], ['La coalición belga', 'Los belgas juran guerra a Roma. Los remos se entregan a César y cuentan lo que cada pueblo ha prometido: suesiones 50.000, nervios 50.000, belóvacos 60.000 escogidos y muchos más. Los nervios esperan en los bosques del Sabis.'], 'BG II.3–4, II.16–28'],
    veneti: [['A revolta dos vênetos', 'Os vênetos prendem os oficiais romanos enviados para buscar trigo. Seus oppida ficam em promontórios: quando cercados, fogem pelo mar. Sem uma frota, não há como vencê-los. Na Aquitânia, os povos também se armam.'], ['The revolt of the Veneti', 'The Veneti seize the Roman officers sent to collect grain. Their oppida stand on headlands: when besieged, they escape by sea. Without a fleet they cannot be beaten. In Aquitania the peoples are arming too.'], ['La rivolta dei Veneti', 'I Veneti catturano gli ufficiali romani mandati a raccogliere grano. I loro oppida sorgono su promontori: se assediati, fuggono per mare. Senza una flotta non si possono vincere. Anche in Aquitania i popoli si armano.'], ['La revuelta de los vénetos', 'Los vénetos apresan a los oficiales romanos enviados a buscar trigo. Sus oppida están en promontorios: cuando los asedian, huyen por mar. Sin una flota no hay forma de vencerlos. En Aquitania los pueblos también se arman.'], 'BG III.7–16, III.20–27'],
    usipetes: [['Usípetes e tencteros', 'Expulsos pelos suevos, usípetes e tencteros atravessam o Reno: 430.000 pessoas. César decide que não haverá lugar para eles na Gália. Depois, a Germânia e a Britânia esperam: uma ponte sobre o Reno ou uma travessia do oceano renderiam glória imensa.'], ['Usipetes and Tencteri', 'Driven out by the Suebi, the Usipetes and Tencteri cross the Rhine: 430,000 people. Caesar decides there will be no room for them in Gaul. Then Germany and Britain beckon: a Rhine bridge or an ocean crossing would bring immense glory.'], ['Usipeti e Tencteri', 'Cacciati dagli Suebi, Usipeti e Tencteri passano il Reno: 430.000 persone. Cesare decide che per loro non ci sarà posto in Gallia. Poi Germania e Britannia attendono: un ponte sul Reno o una traversata dell’oceano porterebbero gloria immensa.'], ['Usípetes y tencteros', 'Expulsados por los suevos, usípetes y tencteros cruzan el Rin: 430.000 personas. César decide que no habrá sitio para ellos en la Galia. Después esperan Germania y Britania: un puente sobre el Rin o una travesía del océano darían una gloria inmensa.'], 'BG IV.1–19'],
    cassivellaunus: [['Cassivelauno', 'Os bretões escolhem Cassivelauno para comandar a guerra. Ele dispensa o grosso das tropas e fica com cerca de 4.000 carros de guerra, que atacam e somem nas florestas. Desembarque em Câncio e marche até o Tâmisa.'], ['Cassivellaunus', 'The Britons choose Cassivellaunus to lead the war. He dismisses most of his troops and keeps about 4,000 chariots, which strike and vanish into the forests. Land in Cantium and march to the Thames.'], ['Cassivellauno', 'I Britanni scelgono Cassivellauno come capo della guerra. Congeda il grosso delle truppe e tiene circa 4.000 carri da guerra, che colpiscono e spariscono nelle foreste. Sbarca nel Cantium e marcia fino al Tamigi.'], ['Casivelauno', 'Los britanos eligen a Casivelauno para dirigir la guerra. Despide al grueso de sus tropas y se queda con unos 4.000 carros de guerra, que atacan y desaparecen en los bosques. Desembarca en Cantium y marcha hasta el Támesis.'], 'BG V.8–22'],
    ambiorix: [['Os acampamentos de inverno são atacados', 'A colheita foi ruim, e as legiões invernam separadas. Ambiórix, dos eburões, ataca as coortes de Sabino e Cota; os nérvios, com cerca de 60.000 homens, cercam o acampamento de Quinto Cícero.'], ['The winter camps are attacked', 'The harvest was poor and the legions winter apart. Ambiorix of the Eburones attacks the cohorts of Sabinus and Cotta; the Nervii, about 60,000 strong, besiege the camp of Quintus Cicero.'], ['I campi invernali sono attaccati', 'Il raccolto è stato scarso e le legioni svernano separate. Ambiorige degli Eburoni attacca le coorti di Sabino e Cotta; i Nervi, circa 60.000, assediano il campo di Quinto Cicerone.'], ['Atacan los campamentos de invierno', 'La cosecha fue mala y las legiones invernan separadas. Ambiórix, de los eburones, ataca las cohortes de Sabino y Cota; los nervios, unos 60.000, cercan el campamento de Quinto Cicerón.'], 'BG V.24–52'],
    treveri: [['Os tréveros e a segunda ponte', 'Induciomaro, dos tréveros, reúne guerreiros e chama os germanos. Os eburões ainda estão livres. Uma segunda ponte sobre o Reno mostraria aos germanos o alcance de Roma.'], ['The Treveri and the second bridge', 'Indutiomarus of the Treveri gathers warriors and calls on the Germans. The Eburones are still free. A second Rhine bridge would show the Germans how far Rome can reach.'], ['I Treveri e il secondo ponte', 'Induziomaro dei Treveri raduna guerrieri e chiama i Germani. Gli Eburoni sono ancora liberi. Un secondo ponte sul Reno mostrerebbe ai Germani fin dove arriva Roma.'], ['Los tréveros y el segundo puente', 'Induciomaro, de los tréveros, reúne guerreros y llama a los germanos. Los eburones siguen libres. Un segundo puente sobre el Rin mostraría a los germanos el alcance de Roma.'], 'BG V.55–58, VI.9–35'],
    vercingetorix: [['Vercingetórix', 'Em Cenabo, os carnutos matam os mercadores romanos. Vercingetórix, dos arvernos, é proclamado rei e chefe da guerra de quase toda a Gália. Ele queima aldeias e celeiros para deixar as legiões sem trigo. Avárico tem cerca de 40.000 pessoas dentro das muralhas.'], ['Vercingetorix', 'At Cenabum the Carnutes massacre the Roman traders. Vercingetorix of the Arverni is proclaimed king and war leader of almost all Gaul. He burns villages and granaries to starve the legions of grain. Avaricum holds about 40,000 people within its walls.'], ['Vercingetorige', 'A Cenabum i Carnuti massacrano i mercanti romani. Vercingetorige degli Arverni è proclamato re e capo della guerra di quasi tutta la Gallia. Brucia villaggi e granai per lasciare le legioni senza grano. Avarico ha circa 40.000 persone dentro le mura.'], ['Vercingétorix', 'En Cenabo, los carnutos matan a los mercaderes romanos. Vercingétorix, de los arvernos, es proclamado rey y jefe de la guerra de casi toda la Galia. Quema aldeas y graneros para dejar a las legiones sin trigo. Avárico tiene unas 40.000 personas tras sus murallas.'], 'BG VII.3–28'],
    aedui: [['Os éduos mudam de lado', 'Depois do fracasso romano diante de Gergóvia, onde caíram 46 centuriões e quase 700 soldados, Litavico leva os éduos para o lado da revolta. Bibracte, a velha aliada, fecha as portas.'], ['The Aedui change sides', 'After the Roman failure before Gergovia, where 46 centurions and nearly 700 soldiers fell, Litaviccus takes the Aedui over to the revolt. Bibracte, the old ally, shuts its gates.'], ['Gli Edui cambiano parte', 'Dopo il fallimento romano davanti a Gergovia, dove caddero 46 centurioni e quasi 700 soldati, Litavicco porta gli Edui dalla parte della rivolta. Bibracte, la vecchia alleata, chiude le porte.'], ['Los eduos cambian de bando', 'Tras el fracaso romano ante Gergovia, donde cayeron 46 centuriones y casi 700 soldados, Litavico lleva a los eduos al lado de la revuelta. Bibracte, la vieja aliada, cierra sus puertas.'], 'BG VII.37–55'],
    relief: [['O exército de socorro', 'A Gália inteira manda socorro aos sitiados: 8.000 cavaleiros e cerca de 250.000 infantes, sob Cômio, Vercassivelauno e outros chefes. Quem cerca agora está cercado. As obras de cerco viram duas linhas: uma de 11 milhas para dentro, outra de 14 para fora.'], ['The relief army', 'All Gaul sends help to the besieged: 8,000 horsemen and about 250,000 foot, under Commius, Vercassivellaunus and other chiefs. The besiegers are now besieged. The siege works become two lines: one of 11 miles facing in, another of 14 facing out.'], ['L’esercito di soccorso', 'Tutta la Gallia manda soccorso agli assediati: 8.000 cavalieri e circa 250.000 fanti, sotto Commio, Vercassivellauno e altri capi. Chi assedia ora è assediato. Le opere diventano due linee: una di 11 miglia verso l’interno, un’altra di 14 verso l’esterno.'], ['El ejército de socorro', 'Toda la Galia envía socorro a los sitiados: 8.000 jinetes y unos 250.000 infantes, al mando de Comio, Vercasivelauno y otros jefes. Los sitiadores están ahora sitiados. Las obras se convierten en dos líneas: una de 11 millas hacia dentro y otra de 14 hacia fuera.'], 'BG VII.69–76'],
    uxellodunum: [['Uxeloduno', 'Os últimos rebeldes, sob Drapes e Lutério, se fecham em Uxeloduno. Os belóvacos voltam a pegar em armas. Os sitiados têm víveres; César secou a fonte deles com galerias subterrâneas.'], ['Uxellodunum', 'The last rebels, under Drappes and Lucterius, shut themselves in Uxellodunum. The Bellovaci take up arms again. The besieged have food; Caesar dried up their spring with underground tunnels.'], ['Uxelloduno', 'Gli ultimi ribelli, sotto Drappete e Lutterio, si chiudono a Uxelloduno. I Bellovaci riprendono le armi. Gli assediati hanno viveri; Cesare prosciugò la loro fonte con gallerie sotterranee.'], ['Uxeloduno', 'Los últimos rebeldes, al mando de Drapes y Lucterio, se encierran en Uxeloduno. Los belóvacos vuelven a tomar las armas. Los sitiados tienen víveres; César les secó la fuente con galerías subterráneas.'], 'BG VIII.7–23, VIII.32–44'],
    civil: [['O Senado declara guerra', 'O Senado ordena que César entregue o exército. Ele está em Ravena com a legião XIII; do outro lado do Rubicão começa a Itália. Domício, com mais de 30 coortes, guarda Corfínio; Pompeu marcha para Brundísio. Na Hispânia, Afrânio e Petreio têm cinco legiões.'], ['The Senate declares war', 'The Senate orders Caesar to give up his army. He is at Ravenna with legion XIII; across the Rubicon lies Italy. Domitius, with over 30 cohorts, holds Corfinium; Pompey marches to Brundisium. In Spain Afranius and Petreius have five legions.'], ['Il Senato dichiara guerra', 'Il Senato ordina a Cesare di cedere l’esercito. È a Ravenna con la legione XIII; oltre il Rubicone comincia l’Italia. Domizio, con più di 30 coorti, tiene Corfinio; Pompeo marcia verso Brindisi. In Spagna Afranio e Petreio hanno cinque legioni.'], ['El Senado declara la guerra', 'El Senado ordena a César que entregue el ejército. Está en Rávena con la legión XIII; al otro lado del Rubicón empieza Italia. Domicio, con más de 30 cohortes, guarda Corfinio; Pompeyo marcha hacia Brundisio. En Hispania, Afranio y Petreyo tienen cinco legiones.'], 'BC I.1–39; Suet. Iul. 31–32'],
    epirus: [['Pompeu no Epiro', 'Pompeu reúne no Epiro as forças do Oriente. Em Farsália terá 110 coortes, cerca de 45.000 homens, e 7.000 cavaleiros contra os 1.000 de César. A frota de Bíbulo vigia o Adriático: atravessar será arriscado.'], ['Pompey in Epirus', 'Pompey gathers the forces of the East in Epirus. At Pharsalus he will have 110 cohorts, about 45,000 men, and 7,000 horsemen against Caesar’s 1,000. Bibulus’ fleet watches the Adriatic: crossing will be risky.'], ['Pompeo in Epiro', 'Pompeo raduna in Epiro le forze dell’Oriente. A Farsalo avrà 110 coorti, circa 45.000 uomini, e 7.000 cavalieri contro i 1.000 di Cesare. La flotta di Bibulo sorveglia l’Adriatico: attraversare sarà rischioso.'], ['Pompeyo en el Epiro', 'Pompeyo reúne en el Epiro las fuerzas de Oriente. En Farsalia tendrá 110 cohortes, unos 45.000 hombres, y 7.000 jinetes contra los 1.000 de César. La flota de Bíbulo vigila el Adriático: cruzar será arriesgado.'], 'BC III.4–8, III.84–89'],
    pompeydeath: [['A morte de Pompeu', 'Vencido, Pompeu foge para o Egito e é morto ao desembarcar, por ordem dos conselheiros do jovem Ptolomeu. Em Alexandria, Áquilas comanda um exército treinado à romana. César chegou ao Egito, na história, com só 3.200 homens e 800 cavaleiros.'], ['The death of Pompey', 'Defeated, Pompey flees to Egypt and is killed as he lands, on the orders of young Ptolemy’s advisers. At Alexandria Achillas commands an army trained the Roman way. In history Caesar reached Egypt with only 3,200 men and 800 horsemen.'], ['La morte di Pompeo', 'Sconfitto, Pompeo fugge in Egitto e viene ucciso allo sbarco, per ordine dei consiglieri del giovane Tolomeo. Ad Alessandria Achilla comanda un esercito addestrato alla romana. Nella storia Cesare giunse in Egitto con soli 3.200 uomini e 800 cavalieri.'], ['La muerte de Pompeyo', 'Vencido, Pompeyo huye a Egipto y es asesinado al desembarcar, por orden de los consejeros del joven Ptolomeo. En Alejandría, Aquilas manda un ejército entrenado a la romana. En la historia, César llegó a Egipto con solo 3.200 hombres y 800 jinetes.'], 'BC III.103–112'],
    pharnaces: [['Fárnaces no Ponto', 'Fárnaces, filho de Mitrídates, invade a Ásia Menor aproveitando a guerra civil. Vença-o depressa: a vitória de Zela entrou para a história em três palavras.'], ['Pharnaces in Pontus', 'Pharnaces, son of Mithridates, invades Asia Minor while Rome fights itself. Beat him quickly: the victory at Zela went down in history in three words.'], ['Farnace nel Ponto', 'Farnace, figlio di Mitridate, invade l’Asia Minore approfittando della guerra civile. Sconfiggilo in fretta: la vittoria di Zela è passata alla storia in tre parole.'], ['Fárnaces en el Ponto', 'Fárnaces, hijo de Mitrídates, invade Asia Menor aprovechando la guerra civil. Véncelo deprisa: la victoria de Zela pasó a la historia en tres palabras.'], 'Bellum Alexandrinum 34–77; Suet. Iul. 35–37'],
    africa: [['A guerra da África', 'Os pompeianos se reagrupam na África sob Metelo Cipião, com Labieno, Catão em Útica e os elefantes e a cavalaria númida do rei Juba.'], ['The African war', 'The Pompeians regroup in Africa under Metellus Scipio, with Labienus, Cato at Utica and King Juba’s elephants and Numidian cavalry.'], ['La guerra d’Africa', 'I pompeiani si riorganizzano in Africa sotto Metello Scipione, con Labieno, Catone a Utica e gli elefanti e la cavalleria numida del re Giuba.'], ['La guerra de África', 'Los pompeyanos se reagrupan en África al mando de Metelo Escipión, con Labieno, Catón en Útica y los elefantes y la caballería númida del rey Juba.'], 'Bellum Africum'],
    munda: [['Munda', 'Os filhos de Pompeu e Labieno levantam a Hispânia Ulterior. Depois de Munda, César disse que muitas vezes lutara pela vitória, mas ali pela primeira vez lutara pela vida.'], ['Munda', 'Pompey’s sons and Labienus raise Further Spain. After Munda Caesar said he had often fought for victory, but there for the first time he fought for his life.'], ['Munda', 'I figli di Pompeo e Labieno sollevano la Spagna Ulteriore. Dopo Munda Cesare disse di aver spesso combattuto per la vittoria, ma lì per la prima volta per la vita.'], ['Munda', 'Los hijos de Pompeyo y Labieno sublevan la Hispania Ulterior. Tras Munda, César dijo que muchas veces había luchado por la victoria, pero allí por primera vez luchó por la vida.'], 'Bellum Hispaniense; Plut. Caes. 56'],

  const RULES = {
    pt: `<p>Você comanda César e seus legados. O ano tem três estações de campanha (primavera, verão e outono) e um inverno nos quartéis. Os inimigos agem pelas regras do jogo e pelos dados, seguindo o calendário dos relatos antigos.</p>
<h3>Estação</h3><ol><li><b>Fortuna:</b> um dado decide chuvas, comboios de trigo, batedores ou bons auspícios.</li><li><b>Comando:</b> cada exército rola um dado. César recebe 2 + metade do dado (arredondada para cima); um legado, 1 + metade. É a famosa <i>celeritas</i> de César.</li><li><b>Ordens:</b> marchar custa o número da estrada (montanhas custam 2). Navegar custa 2 ou 3 e exige um porto; o mar pode trazer tempestades e, na Guerra Civil, a frota pompeiana. O Reno só se atravessa depois de construir a ponte. Entrar onde há um exército inimigo em campo abre a batalha.</li><li><b>Inimigos:</b> migrantes seguem sua rota e saqueiam aliados; exércitos de campo atacam quando se acham mais fortes; guarnições ficam atrás das muralhas; Pompeu e Vercingetórix evitam batalhas desiguais.</li><li><b>Trigo:</b> no fim da estação, quem está em terra romana, aliada ou submetida recebe trigo; fora dela perde 1. Com 0, as coortes desertam ou morrem de fome. Em 52 a.C., a terra queimada de Vercingetórix dificulta a busca de trigo.</li></ol>
<h3>Batalha</h3><p>Cada coorte vale 1 ponto (veteranos 1,35; elite 1,7). Mil guerreiros gauleses valem 0,6 vezes a qualidade deles; mil legionários pompeianos valem 2. Cada lado rola um dado para cada 7 pontos, mais os modificadores de terreno, muralhas, acampamento, cavalaria e César. Legiões veteranas acertam com 4 a 6; recrutas e bárbaros, com 5 ou 6. Cada acerto tira 3 pontos do inimigo. Depois de cada rodada, quem sofreu mais rola 2d6 de moral: acima do valor, foge e sofre a perseguição da cavalaria. São no máximo três rodadas. Se o exército de César foge, ele pode morrer: 1 em 6.</p>
<h3>Cercos</h3><p>Inimigos dentro de muralhas precisam ser cercados: cada ordem de cerco soma um dado mais metade das legiões (e 2 com César). Quando o cerco chega a 6 vezes a fortificação, a cidade cai. A cada estação os sitiados comem os víveres; sem víveres, rendem-se. Com o cerco em 2 vezes a fortificação, as linhas de circunvalação dão +4 dados contra exércitos de socorro, como em Alésia. Cidades costeiras dos vênetos e Massília só podem ser cercadas por um exército com frota.</p>
<h3>Inverno</h3><p>Exércitos em território amigo recuperam coortes; fora dele, perdem. Legiões que venceram podem virar veteranas. Gaste Auctoritas para reforçar legiões ou alistar novas. Regiões submetidas podem se revoltar, sobretudo de 54 a 52 a.C. Se a Auctoritas cair abaixo de −3, o Senado chama César de volta e a campanha termina.</p>
<h3>Vitória</h3><p>Glória vem de batalhas, cidades tomadas, regiões submetidas e façanhas (a ponte do Reno, a Britânia, Zela). Cada cenário tem um objetivo histórico. César morto ou sem legiões encerra o jogo.</p>
<h3>Fontes e realismo</h3><p>Datas, chefes, exércitos e números vêm de César, <i>Commentarii de Bello Gallico</i> (BG, com o livro VIII de Hírcio) e <i>de Bello Civili</i> (BC); dos <i>Bellum Alexandrinum</i>, <i>Africum</i> e <i>Hispaniense</i>; de Suetônio, <i>Divus Iulius</i>; e de Plutarco, <i>César</i>. Os números de César são os dele: muitos historiadores os consideram exagerados. O mapa usa as coordenadas reais das cidades e o relevo, os rios, os lagos e os litorais do Natural Earth (domínio público). Os litorais são os de hoje: na Antiguidade, a laguna de Ravena, o delta do Reno e a costa de Flandres eram diferentes. Os nomes de montes, rios e mares estão em latim. As regras de combate são um modelo de jogo, não uma reconstrução militar.</p>`,
    en: `<p>You command Caesar and his legates. Each year has three campaign seasons (spring, summer and autumn) and a winter in quarters. The enemy acts by the game’s rules and the dice, following the calendar of the ancient accounts.</p>
<h3>Season</h3><ol><li><b>Fortuna:</b> one die decides rain, grain convoys, scouts or good omens.</li><li><b>Command:</b> each army rolls a die. Caesar gets 2 + half the die (rounded up); a legate gets 1 + half. This is Caesar’s famous <i>celeritas</i>.</li><li><b>Orders:</b> marching costs the road’s number (mountains cost 2). Sailing costs 2 or 3 and needs a port; the sea may bring storms and, in the Civil War, the Pompeian fleet. The Rhine can only be crossed once the bridge is built. Entering a place with an enemy army in the field starts a battle.</li><li><b>Enemy:</b> migrants follow their route and plunder allies; field armies attack when they think they are stronger; garrisons stay behind their walls; Pompey and Vercingetorix avoid uneven battles.</li><li><b>Grain:</b> at the end of the season, armies in Roman, allied or subdued land get grain; elsewhere they lose 1. At 0 the cohorts desert or starve. In 52 BC Vercingetorix’s scorched earth makes foraging harder.</li></ol>
<h3>Battle</h3><p>Each cohort is worth 1 point (veterans 1.35, elite 1.7). A thousand Gallic warriors are worth 0.6 times their quality; a thousand Pompeian legionaries are worth 2. Each side rolls one die per 7 points, plus the modifiers for terrain, walls, camp, cavalry and Caesar. Veteran legions hit on 4 to 6; recruits and barbarians on 5 or 6. Each hit removes 3 points from the enemy. After each round, the side that suffered more rolls 2d6 for morale: above the value, it flees and suffers the cavalry pursuit. There are at most three rounds. If Caesar’s army flees, he may die: 1 in 6.</p>
<h3>Sieges</h3><p>Enemies behind walls must be besieged: each siege order adds a die plus half the legions (and 2 with Caesar). When the siege reaches 6 times the fortification, the town falls. Each season the besieged eat their food; without food they surrender. With the siege at twice the fortification, the circumvallation lines give +4 dice against relief armies, as at Alesia. The coastal towns of the Veneti and Massilia can only be besieged by an army with a fleet.</p>
<h3>Winter</h3><p>Armies in friendly land recover cohorts; elsewhere they lose them. Victorious legions may become veterans. Spend Auctoritas to reinforce legions or enlist new ones. Subdued regions may revolt, especially in 54–52 BC. If Auctoritas falls below −3, the Senate recalls Caesar and the campaign ends.</p>
<h3>Victory</h3><p>Gloria comes from battles, captured towns, subdued regions and feats (the Rhine bridge, Britain, Zela). Each scenario has a historical goal. If Caesar dies or has no legions left, the game ends.</p>
<h3>Sources and realism</h3><p>Dates, leaders, armies and numbers come from Caesar, <i>Commentarii de Bello Gallico</i> (BG, with Hirtius’ book VIII) and <i>de Bello Civili</i> (BC); the <i>Bellum Alexandrinum</i>, <i>Africum</i> and <i>Hispaniense</i>; Suetonius, <i>Divus Iulius</i>; and Plutarch, <i>Caesar</i>. Caesar’s figures are his own: many historians consider them inflated. The map uses the real coordinates of the towns and the relief, rivers, lakes and coastlines of Natural Earth (public domain). The coastlines are today’s: in antiquity the Ravenna lagoon, the Rhine delta and the Flemish coast were different. Mountains, rivers and seas carry their Latin names. The combat rules are a game model, not a military reconstruction.</p>`,
    it: `<p>Comandi Cesare e i suoi legati. Ogni anno ha tre stagioni di campagna (primavera, estate e autunno) e un inverno nei quartieri. Il nemico agisce secondo le regole del gioco e i dadi, seguendo il calendario dei racconti antichi.</p>
<h3>Stagione</h3><ol><li><b>Fortuna:</b> un dado decide piogge, convogli di grano, esploratori o buoni auspici.</li><li><b>Comando:</b> ogni esercito tira un dado. Cesare riceve 2 + metà del dado (arrotondata per eccesso); un legato 1 + metà. È la famosa <i>celeritas</i> di Cesare.</li><li><b>Ordini:</b> marciare costa il numero della strada (le montagne costano 2). Navigare costa 2 o 3 e richiede un porto; il mare può portare tempeste e, nella guerra civile, la flotta pompeiana. Il Reno si attraversa solo dopo aver costruito il ponte. Entrare dove c’è un esercito nemico in campo apre la battaglia.</li><li><b>Nemici:</b> i migranti seguono la loro rotta e saccheggiano gli alleati; gli eserciti in campo attaccano quando si credono più forti; le guarnigioni restano dietro le mura; Pompeo e Vercingetorige evitano battaglie impari.</li><li><b>Grano:</b> a fine stagione chi è in terra romana, alleata o sottomessa riceve grano; altrove ne perde 1. A 0 le coorti disertano o muoiono di fame. Nel 52 a.C. la terra bruciata di Vercingetorige rende più difficile il foraggiamento.</li></ol>
<h3>Battaglia</h3><p>Ogni coorte vale 1 punto (veterani 1,35; élite 1,7). Mille guerrieri galli valgono 0,6 volte la loro qualità; mille legionari pompeiani valgono 2. Ogni parte tira un dado ogni 7 punti, più i modificatori di terreno, mura, campo, cavalleria e Cesare. Le legioni veterane colpiscono con 4–6; reclute e barbari con 5 o 6. Ogni colpo toglie 3 punti al nemico. Dopo ogni round chi ha subito di più tira 2d6 di morale: sopra il valore fugge e subisce l’inseguimento della cavalleria. I round sono al massimo tre. Se l’esercito di Cesare fugge, lui può morire: 1 su 6.</p>
<h3>Assedi</h3><p>I nemici dietro le mura vanno assediati: ogni ordine di assedio aggiunge un dado più metà delle legioni (e 2 con Cesare). Quando l’assedio arriva a 6 volte la fortificazione, la città cade. Ogni stagione gli assediati consumano i viveri; senza viveri si arrendono. Con l’assedio al doppio della fortificazione, le linee di circonvallazione danno +4 dadi contro gli eserciti di soccorso, come ad Alesia. Le città costiere dei Veneti e Massilia si possono assediare solo con un esercito dotato di flotta.</p>
<h3>Inverno</h3><p>Gli eserciti in terra amica recuperano coorti; altrove le perdono. Le legioni vittoriose possono diventare veterane. Spendi Auctoritas per rinforzare legioni o arruolarne di nuove. Le regioni sottomesse possono ribellarsi, soprattutto nel 54–52 a.C. Se l’Auctoritas scende sotto −3, il Senato richiama Cesare e la campagna finisce.</p>
<h3>Vittoria</h3><p>La Gloria viene da battaglie, città prese, regioni sottomesse e imprese (il ponte sul Reno, la Britannia, Zela). Ogni scenario ha un obiettivo storico. Se Cesare muore o resta senza legioni, il gioco finisce.</p>
<h3>Fonti e realismo</h3><p>Date, capi, eserciti e numeri vengono da Cesare, <i>Commentarii de Bello Gallico</i> (BG, con il libro VIII di Irzio) e <i>de Bello Civili</i> (BC); dai <i>Bellum Alexandrinum</i>, <i>Africum</i> e <i>Hispaniense</i>; da Svetonio, <i>Divus Iulius</i>; e da Plutarco, <i>Cesare</i>. I numeri di Cesare sono i suoi: molti storici li ritengono gonfiati. La mappa usa le coordinate reali delle città e il rilievo, i fiumi, i laghi e le coste di Natural Earth (pubblico dominio). Le coste sono quelle di oggi: nell’antichità la laguna di Ravenna, il delta del Reno e la costa delle Fiandre erano diversi. Monti, fiumi e mari hanno i nomi latini. Le regole di combattimento sono un modello di gioco, non una ricostruzione militare.</p>`,
    es: `<p>Mandas a César y a sus legados. Cada año tiene tres estaciones de campaña (primavera, verano y otoño) y un invierno en los cuarteles. El enemigo actúa según las reglas del juego y los dados, siguiendo el calendario de los relatos antiguos.</p>
<h3>Estación</h3><ol><li><b>Fortuna:</b> un dado decide lluvias, convoyes de trigo, exploradores o buenos auspicios.</li><li><b>Mando:</b> cada ejército tira un dado. César recibe 2 + la mitad del dado (redondeada hacia arriba); un legado, 1 + la mitad. Es la famosa <i>celeritas</i> de César.</li><li><b>Órdenes:</b> marchar cuesta el número del camino (las montañas cuestan 2). Navegar cuesta 2 o 3 y exige un puerto; el mar puede traer tormentas y, en la Guerra Civil, la flota pompeyana. El Rin solo se cruza después de construir el puente. Entrar donde hay un ejército enemigo en campo abre la batalla.</li><li><b>Enemigos:</b> los migrantes siguen su ruta y saquean a los aliados; los ejércitos en campo atacan cuando se creen más fuertes; las guarniciones se quedan tras las murallas; Pompeyo y Vercingétorix evitan batallas desiguales.</li><li><b>Trigo:</b> al final de la estación, quien está en tierra romana, aliada o sometida recibe trigo; fuera de ella pierde 1. Con 0, las cohortes desertan o mueren de hambre. En el 52 a. C., la tierra quemada de Vercingétorix dificulta buscar trigo.</li></ol>
<h3>Batalla</h3><p>Cada cohorte vale 1 punto (veteranos 1,35; élite 1,7). Mil guerreros galos valen 0,6 veces su calidad; mil legionarios pompeyanos valen 2. Cada bando tira un dado por cada 7 puntos, más los modificadores de terreno, murallas, campamento, caballería y César. Las legiones veteranas aciertan con 4 a 6; reclutas y bárbaros, con 5 o 6. Cada acierto quita 3 puntos al enemigo. Tras cada ronda, quien sufrió más tira 2d6 de moral: por encima del valor, huye y sufre la persecución de la caballería. Hay como máximo tres rondas. Si el ejército de César huye, él puede morir: 1 de cada 6.</p>
<h3>Asedios</h3><p>Los enemigos tras murallas deben ser asediados: cada orden de asedio suma un dado más la mitad de las legiones (y 2 con César). Cuando el asedio llega a 6 veces la fortificación, la ciudad cae. Cada estación los sitiados consumen víveres; sin víveres, se rinden. Con el asedio al doble de la fortificación, las líneas de circunvalación dan +4 dados contra ejércitos de socorro, como en Alesia. Las ciudades costeras de los vénetos y Massilia solo pueden ser asediadas por un ejército con flota.</p>
<h3>Invierno</h3><p>Los ejércitos en territorio amigo recuperan cohortes; fuera de él, las pierden. Las legiones vencedoras pueden volverse veteranas. Gasta Auctoritas para reforzar legiones o alistar nuevas. Las regiones sometidas pueden sublevarse, sobre todo entre el 54 y el 52 a. C. Si la Auctoritas baja de −3, el Senado llama a César a Roma y la campaña termina.</p>
<h3>Victoria</h3><p>La Gloria viene de batallas, ciudades tomadas, regiones sometidas y hazañas (el puente del Rin, Britania, Zela). Cada escenario tiene un objetivo histórico. Si César muere o se queda sin legiones, el juego termina.</p>
<h3>Fuentes y realismo</h3><p>Fechas, jefes, ejércitos y cifras vienen de César, <i>Commentarii de Bello Gallico</i> (BG, con el libro VIII de Hircio) y <i>de Bello Civili</i> (BC); de los <i>Bellum Alexandrinum</i>, <i>Africum</i> e <i>Hispaniense</i>; de Suetonio, <i>Divus Iulius</i>; y de Plutarco, <i>César</i>. Las cifras de César son las suyas: muchos historiadores las consideran exageradas. El mapa usa las coordenadas reales de las ciudades y el relieve, los ríos, los lagos y las costas de Natural Earth (dominio público). Las costas son las de hoy: en la Antigüedad, la laguna de Rávena, el delta del Rin y la costa de Flandes eran distintos. Montes, ríos y mares llevan sus nombres latinos. Las reglas de combate son un modelo de juego, no una reconstrucción militar.</p>`,

  function actCamp(a) { if (a.cp < 1) return; a.cp -= 1; a.camp = true; log('l_camp', { a: a.name }); }

    if (FRIENDLY[s] || r >= need) { a.sup = Math.min(3, a.sup + 2); a.fed = true; log('l_forage_ok', { a: a.name }); } else log('l_forage_no', { a: a.name });

  // ---------------------------------------------------------------- batalha
  function ename(e) { return e.leader ? `${e.name} (${e.leader})` : e.name; }
  function battle(a, e, attacker, opt) {
    opt = opt || {};
    const node = NODES[a.at];
    const rep = { node: node.id, attacker, rName: a.name, eName: ename(e), rMods: [], eMods: [], rounds: [], msgs: [] };
    let rv = rVal(a), ev = eVal(e);
    // reforço dos sitiados quando o socorro ataca
    const garrison = opt.relief ? enemiesAt(a.at).find((x) => x.inTown && x !== e) : null;
    if (garrison) ev += eVal(garrison) * 0.4;
    rep.rV0 = rv; rep.eV0 = ev;
    let rN = clamp(Math.round(rv / 7), 1, 14), eN = clamp(Math.round(ev / 7), 1, 16);
    const T = (k, v) => ({ k, v: v || {} });
    if (a.caesar) { rN += 1; rep.rMods.push(T('m_caesar')); }
    if (a.sup === 0) { rN -= 2; rep.rMods.push(T('m_hunger')); }
    if (a.cav > e.cav * 1.5 && a.cav > 0.5) { rN += 1; rep.rMods.push(T('m_cav')); }
    if (e.cav > a.cav * 1.5 && e.cav > 0.5) { eN += 1; rep.eMods.push(T('m_cav')); }
    const tb = { hill: 2, forest: 1 }[node.t] || 0;
    if (attacker === 'e') {
      if (tb) { rN += tb; rep.rMods.push(T('m_terrain', { t: 'tr_' + node.t, n: tb })); }
      if (a.camp && !opt.marchOut) { rN += 3; rep.rMods.push(T('m_camp')); }
      if (FRIENDLY[st(node.id)] && node.f >= 2 && !opt.marchOut) { rN += node.f + 1; rep.rMods.push(T('m_walls', { n: node.f + 1 })); }
      if (opt.relief && G.ns[node.id].prog >= node.f * 2) { rN += 4; rep.rMods.push(T('m_circ')); }
    } else {
      if (tb && !opt.walls) { eN += tb; rep.eMods.push(T('m_terrain', { t: 'tr_' + node.t, n: tb })); }
      if (opt.walls) { eN += node.f + 1; rep.eMods.push(T('m_walls', { n: node.f + 1 })); }
    }
    const ambush = opt.ambush || opt.marchOut;
    if (ambush) rep.eMods.push(T('m_ambush'));
    if (G.diff === 0) rN += 1; if (G.diff === 2) eN += 1;
    rN = Math.max(1, rN); eN = Math.max(1, eN);
    const avgE = a.legs.reduce((s, l) => s + l.e * l.c, 0) / Math.max(1, cohorts(a));
    const rH = avgE >= 0.8 ? 4 : 5, eH = (e.type === 'leg' && e.q >= 1.05) ? 4 : 5;
    const rM = 8 + Math.round(avgE) + (a.caesar ? 1 : 0) + (G.diff === 0 ? 1 : 0) - (a.sup === 0 ? 1 : 0);
    const eM = (e.type === 'leg' ? 8 : 7) + (e.mor || 0) + (opt.walls ? 1 : 0);
    Object.assign(rep, { rN, eN, rH, eH, rM, eM });
    let rLoss = 0, eLoss = 0, rout = null, rallied = false;

  // zoom e arraste

  function setVB() { svg.setAttribute('viewBox', vb.join(' ')); const k = clamp(vb[2] / W, 0.25, 1.1); svg.style.setProperty('--k', k.toFixed(3)); ['waves', 'hatchM', 'hatchF'].forEach((id) => { const p = document.getElementById(id); if (p) p.setAttribute('patternTransform', `scale(${Math.max(0.6, k)})`); }); const ns = clamp(vb[2] / W * 1.35, 0.42, 1.15); Object.values(NODES).forEach((n) => { const g = nodeEls[n.id]; if (g) g.setAttribute('transform', `translate(${n.x} ${n.y}) scale(${ns})`); }); updateScale(); }

    const e = EV[id], li = LANGS.indexOf(lang);
    $('evH').textContent = e[li][0];
    $('evBody').innerHTML = `<p>${esc(e[li][1])}</p><p class="ev-src">${SRC_LABEL[li]}: ${esc(e[4])}</p>`;
    $('evBtns').innerHTML = `<button type="button" class="btn pri" value="ok">${t('bt_ok')}</button>`;
    $('evBtns').firstChild.addEventListener('click', () => $('dEvent').close('ok'));
    await openDialog($('dEvent'));
  }
  async function deceitDialog() {
    $('evH').textContent = t('deceitT');
    $('evBody').innerHTML = `<p>${esc(t('deceitP'))}</p>`;
    $('evBtns').innerHTML = `<button type="button" class="btn pri" data-v="hold">${t('deceitHold')}</button><button type="button" class="btn" data-v="go">${t('deceitGo')}</button>`;
    $('evBtns').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => $('dEvent').close(b.dataset.v)));
    const v = await openDialog($('dEvent'));
    resolveDeceit(v === 'go' ? 'go' : 'hold');
  }
  async function showBattle(rep) {
    const d = $('dBattle');
    $('btH').textContent = t('bt_title', { p: NODES[rep.node].n });
    const side = (title, v, n, h, m, mods, cls) => `<div><h3>${esc(title)}</h3><div class="bt-val">${Math.round(v)}</div><div class="muted">${t('bt_val')}</div><p>${t('bt_dice', { n, h })}<br>${t('bt_morale', { m })}</p><ul>${mods.map((x) => `<li>${esc(t(x.k, x.v))}</li>`).join('')}</ul></div>`;
    $('btBody').innerHTML = `<div class="bt-sides">${side(t('bt_rom') + ': ' + rep.rName, rep.rV0, rep.rN, rep.rH, rep.rM, rep.rMods)}${side(t('hostes') + ': ' + rep.eName, rep.eV0, rep.eN, rep.eH, rep.eM, rep.eMods)}</div>`;
    $('btDice').innerHTML = ''; $('btLog').innerHTML = '';
    $('btBtns').innerHTML = `<button type="button" class="btn pri" id="btGo">${t('bt_auto')}</button>`;
    const p = openDialog(d);
    await new Promise((r) => $('btGo').addEventListener('click', r, { once: true }));
    $('btBtns').innerHTML = '';
    const L = (s) => { $('btLog').insertAdjacentHTML('beforeend', `<p>${esc(s)}</p>`); $('btLog').scrollTop = $('btLog').scrollHeight; };
    for (let i = 0; i < rep.rounds.length; i++) {
      const r = rep.roundsDone = rep.rounds[i];
      $('btDice').innerHTML = `<div class="dice">${r.rd.map((v) => dieHTML(v, 'red', 'roll ' + (v >= rep.rH ? 'hit' : 'miss'))).join('')}</div><div class="dice" style="margin-top:4px">${r.ed.map((v) => dieHTML(v, 'grn', 'roll ' + (v >= rep.eH ? 'hit' : 'miss'))).join('')}</div>`;
      await sleep(650);
      L(t('bt_round', { n: i + 1, a: r.rh, b: r.eh }));
      for (const m of r.mor) {
        const sum = m.roll[0] + m.roll[1];
        if (m.rally) L(t('bt_rally', { r: m.rally[0] + m.rally[1] }));
        L(t((m.ok ? 'bt_mok_' : 'bt_mfail_') + m.side, { r: m.rally ? m.rally[0] + m.rally[1] : sum }));
        await sleep(300);
      }
    }
    if (rep.result === 'rwin') L(t('bt_win', { n: rep.eLostK }) + (rep.gloria ? ' ' + t('l_gloria', { n: rep.gloria }) : ''));
    else if (rep.result === 'ewin') L(t('bt_loss', { n: rep.rLostCoh }));
    else L(t('bt_draw', { s: rep.attacker === 'r' ? rep.eName : rep.rName }));
    if (rep.result !== 'ewin') L(t('bt_rlost', { n: rep.rLostCoh }));
    rep.msgs.forEach((m) => L(t(m.k, m.v)));
    if (rep.caesarDead) L(t('bt_caesarDead'));
    $('btBtns').innerHTML = `<button type="button" class="btn pri" id="btOk">${t('bt_ok')}</button>`;
    $('btOk').addEventListener('click', () => d.close('ok'));
    $('btOk').focus();
    await p;
  }

  // ---------------------------------------------------------------- estação, inverno e fim
  async function endSeason() {
    if (!G || busy || G.phase !== 'player' || G.over) return;
    busy = true; G.sel = G.sel; renderAll();
    beginEnemyPhase();
    for (;;) {
      const more = enemyStep();
      renderAll(); busy = false; await flush(); busy = true;
      if (G.pending) { busy = false; await deceitDialog(); await flush(); busy = true; }
      if (G.over || !more) break;
      await sleep(120);
    }
    if (!G.over) advance();
    busy = false;
    renderAll(); await flush(); saveGame();
    if (G.over) { showEnd(); return; }
    if (G.phase === 'winter') await winterDialog();
  }
  async function winterDialog() {
    const draw = () => {
      $('evH').textContent = t('winterT', { y: G.year });
      let h = `<p>${esc(t('winterP'))}</p><p><b>${t('auctoritas')}: ${G.auct}</b></p>`;
      G.armies.forEach((a) => { h += `<h3>${esc(a.name)} · ${esc(NODES[a.at].n)}</h3><div class="moves">${a.legs.map((l, i) => `<button type="button" class="btn sm" data-w="${a.id}:${i}" ${G.auct >= 1 && l.c < 10 ? '' : 'disabled'}>${esc(t('w_reinf', { l: l.n }))} · ${l.c}/10</button>`).join('')}</div>`; });
      h += `<div class="row"><button type="button" class="btn" id="wRec" ${G.auct >= 3 && G.legPool.length ? '' : 'disabled'}>${esc(t('w_recruit', { l: G.legPool[0] || '—', p: NODES[recruitSpot()].n }))}</button></div>`;
      $('evBody').innerHTML = h;
      $('evBody').querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => { const [aid, li] = b.dataset.w.split(':'); winterReinforce(G.armies.find((x) => x.id === aid), +li); draw(); renderAll(); }));
      $('wRec').addEventListener('click', () => { winterRecruit(); draw(); renderAll(); });
    };
    draw();
    $('evBtns').innerHTML = `<button type="button" class="btn pri">${t('w_done')}</button>`;
    $('evBtns').firstChild.addEventListener('click', () => $('dEvent').close('ok'));
    await openDialog($('dEvent'));
    endWinter();
    renderAll(); await flush(); saveGame();
    if (G.over) showEnd();
  }
  function showEnd() {
    const r = finalResult();
    let msg = '';
    if (G.over === 'caesar') msg = t('lostCaesar'); else if (G.over === 'army') msg = t('lostArmy'); else if (G.over === 'auct') msg = t('lostAuct');
    const goal = t(SCEN[G.scen].goal);
    $('evH').textContent = t('endT');
    $('evBody').innerHTML = `${msg ? `<p>${esc(msg)}</p>` : ''}<p><b>${esc(t(r.ok ? 'goalOk' : 'goalNo', { g: goal }))}</b></p><p>${esc(t('finalScore', { g: r.g, r: t(r.rk) }))}</p><p class="quote">${esc(t('histCmp'))}</p>`;
    $('evBtns').innerHTML = `<button type="button" class="btn pri" id="eNew">${t('newGame')}</button><button type="button" class="btn" id="eMenu">${t('menu')}</button>`;
    $('eNew').addEventListener('click', () => { $('dEvent').close(); startFromSetup(); });
    $('eMenu').addEventListener('click', () => { $('dEvent').close(); toMenu(true); });
    Store.del('cesar.save');
    if (!$('dEvent').open) $('dEvent').showModal();
  }

  // ---------------------------------------------------------------- tela inicial, idioma e tema
  function renderSetup() {
    const cur = prefs.scen || 'alesia';
    $('scenList').innerHTML = Object.keys(SCEN).map((k) => `<label><input type="radio" name="scen" value="${k}" ${k === cur ? 'checked' : ''}><span><b>${esc(t(SCEN[k].name))}</b><small>${esc(t(SCEN[k].desc))}</small></span></label>`).join('');
    $('sDiff').value = String(prefs.diff != null ? prefs.diff : 1);
    $('bResume').hidden = !Store.get('cesar.save');
  }
  function startFromSetup() {
    const scen = (document.querySelector('input[name="scen"]:checked') || {}).value || 'alesia';
    const diff = +$('sDiff').value;
    let seed = parseInt($('sSeed').value, 10); if (!Number.isFinite(seed)) seed = (Math.random() * 2147483647) | 0;
    savePref({ scen, diff });
    newGame(scen, diff, seed);
    G.sel = (caesarArmy() || G.armies[0]).id;
    openGame();
  }
  function openGame() {
    $('ovSetup').hidden = true; $('app').hidden = false;
    vb = SCEN[G.scen].view.slice(); vb[3] = vb[2] * H / W;
    buildMap(); renderAll();
    afterAction();
  }
  function toMenu(noAsk) {
    if (!noAsk && G && !G.over && !confirm(t('confirmMenu'))) return;
    saveGame();
    $('app').hidden = true; $('ovSetup').hidden = false; renderSetup();
  }
  function applyLang() {
    document.documentElement.lang = TAG[lang];
    document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = t(n.dataset.t); });
    $('sLang').value = lang;
    $('backLink').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    $('rulesBody').innerHTML = RULES[lang];
    document.title = t('title') + ' · Giovani Perotto Mesquita';
    if (history.replaceState) history.replaceState(null, '', lang === 'pt' ? location.pathname + location.search : '#' + lang);
    applyTheme(); $('bSpeed').textContent = t(fast ? 'speedF' : 'speedN');
    renderSetup();
    if (G && !$('app').hidden) renderAll();
  }
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
    const k = { auto: 'themeAuto', light: 'themeLight', dark: 'themeDark' }[theme];
    $('bTheme').textContent = t(k); $('bTheme2').textContent = t(k);
  }
  $('bPlay').addEventListener('click', startFromSetup);
  $('bResume').addEventListener('click', () => { const s = Store.get('cesar.save'); if (!s) return; G = s; G.queue = []; if (!G.armies.find((a) => a.id === G.sel)) G.sel = (G.armies[0] || {}).id; openGame(); if (G.phase === 'winter') winterDialog(); });
  $('bMenu').addEventListener('click', () => toMenu(false));
  $('bEnd').addEventListener('click', endSeason);
  const openRules = () => { $('rulesBody').innerHTML = RULES[lang]; $('dRules').showModal(); };
  $('bRules').addEventListener('click', openRules); $('bRules2').addEventListener('click', openRules);
  $('bRulesClose').addEventListener('click', () => $('dRules').close());
  const cycleTheme = () => { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme]; savePref({ theme }); applyTheme(); };
  $('bTheme').addEventListener('click', cycleTheme); $('bTheme2').addEventListener('click', cycleTheme);
  $('bSpeed').addEventListener('click', () => { fast = !fast; savePref({ fast }); $('bSpeed').textContent = t(fast ? 'speedF' : 'speedN'); });
  $('sLang').addEventListener('change', () => { lang = $('sLang').value; savePref({ lang }); applyLang(); });
  ['dEvent', 'dBattle'].forEach((id) => $(id).addEventListener('cancel', (ev) => ev.preventDefault()));
  document.addEventListener('keydown', (ev) => {
    if ($('app').hidden || document.querySelector('dialog[open]') || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.target && /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
    if (ev.key === 'e' || ev.key === 'E') { ev.preventDefault(); endSeason(); }
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== lang) { lang = h; savePref({ lang }); applyLang(); } });

  const hashLang = location.hash.slice(1), navLang = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  lang = LANGS.includes(hashLang) ? hashLang : (LANGS.includes(prefs.lang) ? prefs.lang : (LANGS.includes(navLang) ? navLang : 'pt'));
  theme = ['auto', 'light', 'dark'].includes(prefs.theme) ? prefs.theme : 'auto';
  fast = !!prefs.fast;
  applyLang();
  $('ovSetup').hidden = false;
  // ganchos de leitura para testes automatizados
  // simulação de batalhas para medir táticas (não altera a partida em curso)
  function simBattle(spec, n, seed) {
    const keep = G; const out = { rwin: 0, ewin: 0, draw: 0, rLost: 0, eLost: 0, dead: 0 };
    G = { rs: seed | 0, diff: spec.diff == null ? 1 : spec.diff, armies: [], enemies: [], ns: {}, flags: {}, log: [], queue: [], nid: 1, gloria: 0, auct: 0, legates: [], legPool: [], yearWins: 0, fired: {}, year: 52, season: 0, scen: 'alesia' };
    Object.values(NODES).forEach((x) => { G.ns[x.id] = { s: x.s0, prog: 0 }; });
    if (spec.status) G.ns[spec.at].s = spec.status;
    for (let i = 0; i < n; i++) {
      G.armies = []; G.enemies = []; G.queue = []; G.log = []; G.over = null; G.ns[spec.at].prog = spec.prog || 0;
      const a = mkArmy(spec.caesar ? 'C. Iulius Caesar' : 'Legatus', spec.at, !!spec.caesar, spec.legs, spec.cav || 0);
      a.camp = !!spec.camp; a.sup = spec.sup == null ? 3 : spec.sup;
      const e = mkEnemy(Object.assign({ at: spec.at }, spec.enemy));
      const rep = battle(a, e, spec.attacker || 'r', spec.opt || {});
      out[rep.result]++; out.rLost += rep.rLostCoh; out.eLost += rep.eLostK; if (rep.caesarDead) out.dead++;
    }
    G = keep;
    return out;
  }
  window.__cesar = { state: () => G, I18N, EV, NODES, ADJ, LANGS, simBattle };
})();
</script>
