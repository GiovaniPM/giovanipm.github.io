<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Batalha Naval · Giovani Perotto Mesquita</title>
<meta name="description" content="Batalha Naval contra o computador, com mar animado, navios desenhados, tiros, explosões, incêndios e naufrágios. Três níveis, regra de salva e semente. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<style>
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --surface-2:#FBF1E3; --ink:#2B1B3D; --text:#3E3350; --muted:#756986; --line:#F1E2CF;
  --accent:#0E8074; --accent-ink:#FFFFFF; --accent-soft:#E2F6F2; --navy:#5B2A86; --gold:#FFB703; --gold-ink:#B35300; --gold-soft:#FFF1C9;
  --coral:#C2185B; --ok:#1E7B3A; --bad:#C62828;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif; --serif:Georgia,"Times New Roman",serif; --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#1A1328; --surface:#241A36; --surface-2:#2D2244; --ink:#F7F0FF; --text:#E2D8F0; --muted:#A898C0; --line:#3A2D52;
  --accent:#5FD3C4; --accent-ink:#10231F; --accent-soft:#1D3A38; --navy:#C9A7F5; --gold:#FFC94D; --gold-ink:#FFC94D; --gold-soft:#3A2E12;
  --coral:#FF6F91; --ok:#6FD38A; --bad:#FF8A8A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand h1{font-family:var(--serif);font-size:1.35rem;margin:0;color:var(--ink);line-height:1.1}
.brand p{margin:0;font-size:.82rem;color:var(--muted)}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.45rem .8rem;min-height:40px;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.big{font-size:1.05rem;padding:.6rem 1.3rem;min-height:48px}
.btn.fire{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
:root[data-theme="dark"] .btn.fire{color:#2a0d0d}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem .5rem;min-height:40px;color:var(--ink)}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem;flex:1}

.hud{display:flex;align-items:center;gap:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.55rem .8rem}
.chip{flex:none;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.3rem .6rem;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.me{background:var(--accent-soft);color:var(--accent)}
.chip.foe{background:var(--gold-soft);color:var(--gold-ink)}
.status{margin:0;min-height:1.4em;color:var(--ink);font-weight:600;line-height:1.35}

.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.6rem .8rem}
.bar h2{font-size:1rem;margin:0 .4rem 0 0;color:var(--ink)}
.bar .hint{flex-basis:100%;margin:0;font-size:.82rem;color:var(--muted)}
.dock{display:flex;flex-wrap:wrap;gap:.4rem;flex-basis:100%}
.shipbtn{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;min-height:44px;font-size:.8rem;color:var(--ink)}
.shipbtn[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.shipbtn.done{opacity:.7}
.shipbtn .cells{display:inline-flex;gap:2px}
.shipbtn .cells i{width:12px;height:10px;border-radius:2px;background:#7F8A92}
.shipbtn.done .cells i{background:var(--accent)}
.grow{flex:1}

.boards{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
.bwrap{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:.6rem .7rem .7rem;min-width:0;transition:border-color .25s,box-shadow .25s}
.bwrap.active{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
body.cine .bwrap:not(.cinema),body.cine .hud,body.cine .bar,body.cine .legend,body.cine details.log{opacity:.4;filter:saturate(.5);transition:opacity .6s,filter .6s}
body.cine .bwrap.cinema{border-color:#111;box-shadow:0 10px 40px rgba(0,0,0,.45);transition:box-shadow .6s,border-color .6s}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.bhead h2{margin:0;font-size:1.05rem;color:var(--ink);font-family:var(--serif)}
.bhead span{font-size:.8rem;color:var(--muted)}
.cvbox{display:flex;justify-content:center}
canvas.board{display:block;touch-action:manipulation;border-radius:12px;cursor:crosshair;max-width:100%}
.fleet{list-style:none;padding:0;margin:.55rem 0 0;display:flex;flex-wrap:wrap;gap:.25rem .9rem;font-size:.8rem}
.fleet li{display:flex;align-items:center;gap:.35rem;color:var(--ink)}
.pips{display:inline-flex;gap:2px}
.pips i{width:9px;height:9px;border:1px solid var(--muted);border-radius:2px}
.pips i.h{background:var(--bad);border-color:var(--bad)}
.fleet li.sunk .nm{text-decoration:line-through;color:var(--muted)}
.fleet li .tag{font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--bad)}
.legend{margin:0;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:center;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.legend svg{width:18px;height:18px;flex:none}

details.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.5rem .8rem}
details.log summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.log ol{margin:.5rem 0 0;padding-left:1.6rem;max-height:220px;overflow:auto;font-size:.88rem}

dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,20,35,.6)}
.dlg{padding:1rem 1.1rem 1.1rem;overflow:auto}
.dlg h2{font-family:var(--serif);color:var(--ink);margin:0 0 .7rem;font-size:1.35rem}
.dlg h3{color:var(--ink);margin:1rem 0 .3rem;font-size:1rem}
.dlg p,.dlg li{line-height:1.5;max-width:68ch}
.dlg table{width:100%;border-collapse:collapse;font-size:.9rem}
.dlg th,.dlg td{border-bottom:1px solid var(--line);padding:.32rem .4rem;text-align:left}
.dlg td.n,.dlg th.n{text-align:right;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;gap:.7rem .9rem}
.form label{display:flex;flex-direction:column;gap:.25rem;font-size:.86rem;font-weight:600;color:var(--ink);min-width:0}
.form select,.form input{width:100%;min-width:0;max-width:100%}
.form label small{font-weight:400;color:var(--muted)}
.form .full{grid-column:1/-1}
.acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
.endbig{font-size:2.6rem;line-height:1;text-align:center}
.endbig svg{width:72px;height:72px}
.foot{text-align:center;font-size:.8rem;color:var(--muted);padding:1rem}
.foot a{color:var(--accent)}

@media (max-width:960px){.brand p{display:none}}
@media (max-width:760px){
  .boards{grid-template-columns:1fr}
  .boards.battle #wFoe{order:-1}
}
@media (max-width:720px){
  .wrap{padding:.6rem}
  .top{padding:.5rem .6rem}
  .brand h1{font-size:1.15rem}
  .btn{padding:.4rem .6rem}
}
@media (max-width:480px){
  .form{grid-template-columns:1fr}
  .tools{width:100%}
  .tools .btn{flex:1 1 auto}
  .hud{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.tools,.bar,details.log{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#123F63"/><path d="M4 24h32l-5 6H9z" fill="#C9D0D4"/><rect x="13" y="18" width="11" height="6" fill="#9AA3A9"/><rect x="17" y="12" width="3" height="6" fill="#9AA3A9"/><path d="M26 21h7" stroke="#C9D0D4" stroke-width="2"/><path d="M3 34q4-2.5 8.5 0t8.5 0 8.5 0 8.5 0" stroke="#7FC4FF" stroke-width="2" fill="none"/></svg>
    <div><h1 data-i="title"></h1><p data-i="subtitle"></p></div>
  </div>
  <div class="tools">
    <button type="button" class="btn primary" id="bNew" data-i="newGame"></button>
    <button type="button" class="btn" id="bRules" data-i="rules"></button>
    <button type="button" class="btn" id="bSound" aria-pressed="true" data-ta="sound">🔊</button>
    <button type="button" class="btn" id="bTheme" data-ta="theme">◐</button>
    <select id="sLang" data-ta="lang">
      <option value="pt">🇧🇷 PT</option><option value="en">🇬🇧 EN</option><option value="it">🇮🇹 IT</option><option value="es">🇪🇸 ES</option>
    </select>
  </div>
</header>

<main class="wrap">
  <div class="hud"><span class="chip" id="chip"></span><p class="status" id="status" aria-live="polite"></p></div>

  <section class="bar" id="placeBar" aria-labelledby="hPlace">
    <h2 id="hPlace" data-i="placeTitle"></h2>
    <div class="dock" id="dock" role="group" aria-labelledby="hPlace"></div>
    <button type="button" class="btn" id="bRotate"></button>
    <button type="button" class="btn" id="bRandom" data-i="random"></button>
    <button type="button" class="btn" id="bClear" data-i="clear"></button>
    <span class="grow"></span>
    <button type="button" class="btn primary big" id="bBattle" data-i="startBattle"></button>
    <p class="hint" data-i="placeHint"></p>
  </section>

  <section class="bar" id="salvoBar" aria-live="polite" hidden>
    <strong id="salvoInfo"></strong>
    <span class="grow"></span>
    <button type="button" class="btn" id="bSalvoClear" data-i="clearTargets"></button>
    <button type="button" class="btn fire big" id="bSalvoFire" data-i="fire"></button>
  </section>

  <div class="boards" id="boards">
    <section class="bwrap" id="wMe" aria-labelledby="hMe">
      <div class="bhead"><h2 id="hMe" data-i="yourFleet"></h2><span id="cntMe"></span></div>
      <div class="cvbox"><canvas class="board" id="cvMe" tabindex="0" role="application" aria-describedby="curLive"></canvas></div>
      <ul class="fleet" id="fleetMe"></ul>
    </section>
    <section class="bwrap" id="wFoe" aria-labelledby="hFoe">
      <div class="bhead"><h2 id="hFoe" data-i="enemyWaters"></h2><span id="cntFoe"></span></div>
      <div class="cvbox"><canvas class="board" id="cvFoe" tabindex="0" role="application" aria-describedby="curLive"></canvas></div>
      <ul class="fleet" id="fleetFoe"></ul>
    </section>
  </div>
  <p class="legend" aria-hidden="false">
    <span><svg viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="3" fill="#1F6797"/><circle cx="9" cy="9" r="5" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="9" cy="9" r="2" fill="#fff"/></svg><span data-i="lgMiss"></span></span>
    <span><svg viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="3" fill="#1F6797"/><circle cx="9" cy="9" r="6" fill="#FF7A1F" opacity=".55"/><path d="M5 5l8 8M13 5l-8 8" stroke="#1a0d05" stroke-width="4" stroke-linecap="round"/><path d="M5 5l8 8M13 5l-8 8" stroke="#FFB15C" stroke-width="2" stroke-linecap="round"/></svg><span data-i="lgHit"></span></span>
    <span><svg viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="3" fill="#1F6797"/><path d="M2 7h11l3 2-3 2H2z" fill="#3B4650"/><path d="M2 9h14" stroke="#0C3454" stroke-width="3" opacity=".6"/></svg><span data-i="lgSunk"></span></span>
  </p>
  <p class="sr" id="curLive" aria-live="polite"></p>
  <details class="log"><summary data-i="log"></summary><ol id="log"></ol></details>
</main>
<footer class="foot"><span data-i="foot"></span> · <a id="lnkMore" href="projects.html" data-i="more"></a></footer>

<dialog id="dSetup" aria-labelledby="hSetup"><div class="dlg">
  <h2 id="hSetup" data-i="setupTitle"></h2>
  <div class="form">
    <label><span data-i="level"></span><select id="fLevel"><option value="easy" data-i="lvEasy"></option><option value="normal" data-i="lvNormal"></option><option value="hard" data-i="lvHard"></option></select></label>
    <label><span data-i="mode"></span><select id="fMode"><option value="classic" data-i="mdClassic"></option><option value="extra" data-i="mdExtra"></option><option value="salvo" data-i="mdSalvo"></option></select></label>
    <label><span data-i="fleet"></span><select id="fFleet"><option value="classic" data-i="flClassic"></option><option value="big" data-i="flBig"></option></select></label>
    <label><span data-i="touch"></span><select id="fTouch"><option value="no" data-i="tcNo"></option><option value="yes" data-i="tcYes"></option></select></label>
    <label><span data-i="first"></span><select id="fFirst"><option value="me" data-i="ftMe"></option><option value="foe" data-i="ftFoe"></option><option value="rand" data-i="ftRand"></option></select></label>
    <label><span data-i="speed"></span><select id="fSpeed"><option value="normal" data-i="spNormal"></option><option value="fast" data-i="spFast"></option><option value="off" data-i="spOff"></option></select></label>
    <label class="full"><span data-i="seed"></span><input type="text" id="fSeed" inputmode="numeric" maxlength="10" autocomplete="off"><small data-i="seedHint"></small></label>
  </div>
  <div class="acts"><button type="button" class="btn" id="bSetupCancel" data-i="cancel"></button><button type="button" class="btn primary big" id="bStart" data-i="start"></button></div>
</div></dialog>

<dialog id="dRules" aria-labelledby="hRules"><div class="dlg">
  <h2 id="hRules" tabindex="-1" data-i="rulesTitle"></h2>
  <div id="rulesBody"></div>
  <div class="acts"><button type="button" class="btn primary" id="bRulesClose" data-i="close"></button></div>
</div></dialog>

<dialog id="dEnd" aria-labelledby="hEnd"><div class="dlg">
  <div class="endbig" id="endIcon" aria-hidden="true"></div>
  <h2 id="hEnd" style="text-align:center"></h2>
  <p id="endText"></p>
  <table><thead><tr><th></th><th class="n" data-i="shots"></th><th class="n" data-i="hits"></th><th class="n" data-i="accuracy"></th></tr></thead><tbody id="endRows"></tbody></table>
  <p id="endMeta" style="color:var(--muted);font-size:.84rem"></p>
  <div class="acts"><button type="button" class="btn" id="bEndView" data-i="viewBoard"></button><button type="button" class="btn" id="bEndSetup" data-i="options"></button><button type="button" class="btn primary big" id="bAgain" data-i="again"></button></div>
</div></dialog>

<h3>Preparação</h3>
<p>Os navios ficam em linha reta, na horizontal ou na vertical. Na opção padrão eles não podem encostar, nem pela diagonal. Use <em>Aleatório</em> se quiser começar logo.</p>
<h3>Batalha</h3>
<ul><li>Na sua vez, escolha uma casa das águas inimigas. A resposta é <strong>água</strong> (círculo branco) ou <strong>acerto</strong> (cruz e fogo).</li>

<li>Vence quem afundar primeiro toda a frota do outro.</li></ul>
<h3>Regras de tiro</h3>
<ul><li><strong>Um tiro por vez:</strong> cada lado dá um tiro e passa a vez.</li>
<li><strong>Acertou, atira de novo:</strong> a vez continua enquanto você acertar.</li>
<li><strong>Salva:</strong> você dá, de uma vez, um tiro para cada navio seu ainda na água. Quanto mais navios perde, menos tiros tem.</li></ul>
<h3>O inimigo</h3>
<ul><li><strong>Recruta</strong> atira quase ao acaso.</li><li><strong>Oficial</strong> procura em xadrez e, depois de um acerto, segue a linha do navio.</li><li><strong>Almirante</strong> calcula em que casas os navios que restam ainda cabem e atira onde cabem mais.</li></ul>
<p>O computador só usa o que você também saberia: onde atirou, o que acertou e quais navios afundaram.</p>
<h3>Controles</h3>
<p>Mouse ou toque. No teclado, Tab chega ao tabuleiro, as setas movem a mira, Enter atira, R gira o navio e F dispara a salva.</p>`,
`<p>Each side has a 10 by 10 sea, with columns A to J and rows 1 to 10. You see your own fleet and not the enemy’s.</p>
<h3>Fleet</h3>
<table><thead><tr><th>Ship</th><th class="n">Squares</th><th class="n">Classic</th><th class="n">Large</th></tr></thead><tbody>
<tr><td>Aircraft carrier</td><td class="n">5</td><td class="n">1</td><td class="n">1</td></tr><tr><td>Battleship</td><td class="n">4</td><td class="n">1</td><td class="n">1</td></tr><tr><td>Cruiser</td><td class="n">3</td><td class="n">1</td><td class="n">2</td></tr><tr><td>Submarine</td><td class="n">3</td><td class="n">1</td><td class="n">2</td></tr><tr><td>Destroyer</td><td class="n">2</td><td class="n">1</td><td class="n">3</td></tr></tbody></table>
<h3>Setup</h3>
<p>Ships lie in a straight line, horizontal or vertical. By default they may not touch, not even diagonally. Use <em>Random</em> to start right away.</p>
<h3>Battle</h3>
<ul><li>On your turn, choose a square in enemy waters. The answer is <strong>miss</strong> (white circle) or <strong>hit</strong> (cross and fire).</li>
<li>When every square of a ship has been hit, it <strong>sinks</strong>: its name is announced and the hull shows dark on the board.</li>
<li>The first side to sink the whole opposing fleet wins.</li></ul>
<h3>Firing rules</h3>
<ul><li><strong>One shot per turn:</strong> each side fires once and passes.</li>
<li><strong>Hit and fire again:</strong> your turn goes on as long as you keep hitting.</li>
<li><strong>Salvo:</strong> you fire, all at once, one shot for each of your ships still afloat. The more ships you lose, the fewer shots you get.</li></ul>
<h3>The enemy</h3>
<ul><li><strong>Recruit</strong> fires almost at random.</li><li><strong>Officer</strong> searches in a checkerboard pattern and, after a hit, follows the line of the ship.</li><li><strong>Admiral</strong> works out where the remaining ships could still fit and fires where most of them fit.</li></ul>
<p>The computer only uses what you would also know: where it fired, what it hit and which ships sank.</p>
<h3>Controls</h3>
<p>Mouse or touch. On the keyboard, Tab reaches the board, arrows move the sight, Enter fires, R rotates the ship and F fires the salvo.</p>`,

/* ===================== Estado e interface ===================== */
const DEF = { level: 'normal', mode: 'classic', fleet: 'classic', touch: 'no', first: 'rand', speed: 'normal', seed: '' };
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let OPTS = Object.assign({}, DEF, reduced() ? { speed: 'fast' } : {}, store.get('opts') || {});
let G = null;
const sp = () => SPEED[G ? G.opts.speed : 'normal'];
const anim = () => G && G.opts.speed !== 'off';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function setStatus(s) { $('#status').textContent = s; }
function log(s) { const li = document.createElement('li'); li.textContent = s; const ol = $('#log'); ol.appendChild(li); ol.scrollTop = ol.scrollHeight; }

function newGame(seed) {
  const opts = Object.assign({}, OPTS);
  G = { seed, rng: mulberry(seed), opts, phase: 'place', turn: null, busy: false, over: false, sel: 0, dir: 0, salvo: [], par: 0, turns: 0,
    st: { me: { shots: 0, hits: 0 }, foe: { shots: 0, hits: 0 } } };
  fxr = mulberry(seed ^ 0x5BD1E995);
  const fleet = FLEETS[opts.fleet];
  G.me = makeBoard('me', fleet); G.foe = makeBoard('foe', fleet);
  randomFleet(G.foe, G.rng, opts.touch === 'yes');
  G.par = G.rng() < 0.5 ? 0 : 1;
  bindBoard(G.me, $('#cvMe'), $('#wMe')); bindBoard(G.foe, $('#cvFoe'), $('#wFoe'));
  document.body.classList.remove('cine'); $('#wMe').classList.remove('cinema'); $('#wFoe').classList.remove('cinema');
  $('#log').textContent = '';

}
function bindBoard(b, cv, wrap) { b.cv = cv; b.ctx = cv.getContext('2d'); b.wrap = wrap; }

function resizeBoards() {
  if (!G) return;
  const narrow = window.innerWidth <= 760, dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (const b of [G.me, G.foe]) {
    const box = b.cv.parentElement, w = box.clientWidth;
    let S = Math.max(220, Math.min(w, 520));
    if (narrow && G.phase !== 'place' && b.owner === 'me') S = Math.max(220, Math.min(w * 0.7, 300));
    b.S = S; b.cell = (S - 4) / (N + 0.6); b.g = b.cell * 0.6; b.ox = b.g; b.oy = b.g; b.dpr = dpr;
    b.cv.style.width = S + 'px'; b.cv.style.height = S + 'px';
    b.cv.width = Math.round(S * dpr); b.cv.height = Math.round(S * dpr);
    b.cv.dataset.geo = b.g.toFixed(3) + ',' + b.cell.toFixed(3);
  }
}

function ui() {
  if (!G) return;
  const place = G.phase === 'place', battle = G.phase === 'battle';
  $('#placeBar').hidden = !place;
  $('#boards').classList.toggle('battle', !place);
  $('#wMe').classList.toggle('active', battle && G.turn === 'foe');
  $('#wFoe').classList.toggle('active', battle && G.turn === 'me');
  const chip = $('#chip');
  chip.className = 'chip' + (battle ? (G.turn === 'me' ? ' me' : ' foe') : '');
  chip.textContent = place ? t('placing') : G.over ? t('chipOver') : G.turn === 'me' ? t('chipMe') : t('chipFoe');
  if (place) renderDock();
  document.body.dataset.ready = String(battle && G.turn === 'me' && !G.busy);
  const salvo = battle && G.opts.mode === 'salvo' && G.turn === 'me' && !G.busy;
  $('#salvoBar').hidden = !salvo;
  if (salvo) { const n = salvoN(); $('#salvoInfo').textContent = t('salvoInfo', G.salvo.length, n); $('#bSalvoFire').disabled = G.salvo.length < n; $('#bSalvoClear').disabled = !G.salvo.length; }
  renderFleet(G.me, $('#fleetMe'), true); renderFleet(G.foe, $('#fleetFoe'), G.foe.reveal);
  $('#cntMe').textContent = t('afloat', afloat(G.me), G.me.ships.length);
  $('#cntFoe').textContent = t('afloat', afloat(G.foe), G.foe.ships.length);
  $('#cvMe').setAttribute('aria-label', t('yourFleet') + '. ' + t('boardMe'));
  $('#cvFoe').setAttribute('aria-label', t('enemyWaters') + '. ' + t('boardFoe'));
}
function salvoN() { let free = 0; for (let c = 0; c < N * N; c++) if (!G.foe.shot[c]) free++; return Math.min(afloat(G.me), free); }
function renderDock() {
  const dock = $('#dock'); dock.textContent = '';
  G.me.ships.forEach((s) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'shipbtn' + (s.x >= 0 ? ' done' : '');
    b.setAttribute('aria-pressed', String(G.sel === s.idx));
    const nm = document.createElement('span'); nm.textContent = (s.x >= 0 ? '✓ ' : '') + shipName(s) + ' (' + s.len + ')';
    const cells = document.createElement('span'); cells.className = 'cells'; cells.setAttribute('aria-hidden', 'true');
    for (let k = 0; k < s.len; k++) cells.appendChild(document.createElement('i'));
    b.append(nm, cells);
    b.addEventListener('click', () => { SND.init(); if (s.x >= 0) { G.dir = s.d; unplace(G.me, s); setStatus(t('pickedUp', shipName(s))); } G.sel = s.idx; renderDock(); $('#cvMe').focus({ preventScroll: true }); });
    dock.appendChild(b);

}
function renderFleet(b, el, show) {
  el.textContent = '';
  b.ships.forEach((s) => {
    const li = document.createElement('li'); if (s.sunk) li.className = 'sunk';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = shipName(s);
    const p = document.createElement('span'); p.className = 'pips'; p.setAttribute('aria-hidden', 'true');
    for (let k = 0; k < s.len; k++) { const i = document.createElement('i'); if ((show || s.sunk) && (s.sunk || s.mask[k])) i.className = 'h'; p.appendChild(i); }
    li.append(nm, p);
    if (s.sunk) { const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = '✕ ' + t('sunkTag'); li.appendChild(tg); }
    else if (show && s.hits) { const tg = document.createElement('span'); tg.className = 'sr'; tg.textContent = s.hits + '/' + s.len; li.appendChild(tg); }

/* ---------- Posicionamento ---------- */
function anchor(c, s, d) { let x = c % N, y = Math.floor(c / N); if (d) y = Math.min(y, N - s.len); else x = Math.min(x, N - s.len); return [x, y]; }

function placeAt(c) {
  const b = G.me, touch = G.opts.touch === 'yes';
  if (G.sel < 0 || G.me.ships[G.sel].x >= 0) {
    if (b.occ[c] >= 0) { const s = b.ships[b.occ[c]]; G.sel = s.idx; G.dir = s.d; unplace(b, s); setStatus(t('pickedUp', shipName(s))); renderDock(); }
    else setStatus(t('selectShip'));
    return;
  }
  const s = b.ships[G.sel], [x, y] = anchor(c, s, G.dir), f = fits(b, s, x, y, G.dir, touch);
  if (f !== 1) {
    if (b.occ[c] >= 0 && b.occ[c] !== s.idx) { const o = b.ships[b.occ[c]]; G.sel = o.idx; G.dir = o.d; unplace(b, o); setStatus(t('pickedUp', shipName(o))); renderDock(); return; }
    setStatus(f === -1 ? t('cantTouch') : t('cantPlace')); return;
  }
  place(b, s, x, y, G.dir); SND.clank();
  if (anim()) { const [cx, cy] = shipCenter(b, s); for (let k = 0; k < 14; k++) foam(b, cx + (fxr() - .5) * b.cell * (G.dir ? 0.8 : s.len), cy + (fxr() - .5) * b.cell * (G.dir ? s.len : 0.8)); }
  G.sel = nextUnplaced();
  setStatus(G.sel < 0 ? t('fleetReady') : t('placed', shipName(s), cellName(idx(x, y))));
  renderDock();
  if (G.sel < 0) $('#bBattle').focus({ preventScroll: true });
}
function rotate() { if (!G || G.phase !== 'place') return; G.dir ^= 1; renderDock(); }

function startBattle() {
  if (!G || G.phase !== 'place' || G.me.ships.some((s) => s.x < 0)) return;
  G.phase = 'battle'; G.sel = -1; resizeBoards();
  const first = G.opts.first === 'rand' ? (G.rng() < 0.5 ? 'me' : 'foe') : G.opts.first;
  const msg = first === 'me' ? t('youStart') : t('foeStart'); log(msg);
  if (first === 'me') playerTurn(msg); else enemyTurn();
  if (window.innerWidth <= 760) $('#boards').scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });
}

/* ---------- Batalha ---------- */
function playerTurn(prefix) {
  G.turn = 'me'; G.busy = false; G.salvo = [];
  ui(); SND.ping();
  const m = G.opts.mode === 'salvo' ? t('yourTurnSalvo', salvoN()) : t('yourTurn');
  setStatus(prefix ? prefix + ' ' + m : m);
}
function foeAction(c) {
  if (!G || G.phase !== 'battle' || G.turn !== 'me' || G.busy) return;
  if (G.foe.shot[c]) { setStatus(t('alreadyShot', cellName(c))); return; }
  if (G.opts.mode === 'salvo') {
    const i = G.salvo.indexOf(c), n = salvoN();
    if (i >= 0) G.salvo.splice(i, 1); else if (G.salvo.length < n) G.salvo.push(c);
    ui(); if (G.salvo.length >= n) setStatus(t('salvoFull'));
    announce(G.foe); return;
  }
  volley([c]);
}
async function volley(cells) {
  const g = G; G.busy = true; G.turns++; ui();
  muzzle(G.me, cells.length);
  const res = await Promise.all(cells.map((c, i) => sleep(i * sp().stagger).then(() => shotAt(g, g.foe, c, 'me'))));
  if (G !== g) return;
  if (allSunk(g.foe)) { endGame(g, true); return; }
  if (g.opts.mode === 'extra' && res.some((r) => r.hit)) { g.busy = false; ui(); setStatus($('#status').textContent + ' ' + t('extraShot')); return; }
  enemyTurn();
}
async function enemyTurn() {
  const g = G; g.turn = 'foe'; g.busy = true; g.salvo = []; ui(); setStatus(t('enemyTurn'));
  for (;;) {
    await sleep(sp().delay);
    if (G !== g) return;
    const n = g.opts.mode === 'salvo' ? afloat(g.foe) : 1, cells = aiPick(n);
    if (!cells.length) break;
    SND.cannon(false);
    const res = await Promise.all(cells.map((c, i) => sleep(i * sp().stagger).then(() => shotAt(g, g.me, c, 'foe'))));
    if (G !== g) return;
    if (allSunk(g.me)) { endGame(g, false); return; }
    if (!(g.opts.mode === 'extra' && res.some((r) => r.hit))) break;
  }
  const last = $('#status').textContent;
  playerTurn(last);
}
async function shotAt(g, b, c, who) {
  const st = g.st[who]; st.shots++;

  if (G !== g) return { hit: false };
  const r = resolve(b, c), [x, y] = center(b, c), nm = cellName(c);
  let msg;
  if (!r.hit) { splash(b, x, y); msg = who === 'me' ? t('youMiss', nm) : t('foeMiss', nm); }
  else {
    st.hits++; explode(b, x, y, r.sunk); b.fires.push({ x, y, c, s: r.s, acc: 0 });
    if (r.sunk) { msg = who === 'me' ? t('youSunk', nm, shipName(r.s)) : t('foeSunk', nm, shipName(r.s)); setStatus(msg); log(msg); ui(); await sinkShip(b, r.s); return r; }
    else msg = who === 'me' ? t('youHit', nm) : t('foeHit', nm, shipName(r.s));

}
async function endGame(g, win) {
  g.over = true; g.phase = 'over'; g.turn = null; g.busy = true; g.foe.reveal = true;
  const S = store.get('stats') || { games: 0, wins: 0 }; S.games++; if (win) S.wins++; store.set('stats', S);
  ui(); log(win ? t('win') : t('lose'));
  await sleep(sp().end);

    if (!s.sunk) { const m = b.owner === 'foe' ? c * .2 : c * .11, mx = b.owner === 'foe' ? x : x + c * .28, my = b.owner === 'foe' ? y : y - c * .28; ctx.lineCap = 'round'; for (const [w, col] of [[Math.max(3, c * .14), 'rgba(20,10,5,.9)'], [Math.max(1.5, c * .07), '#FFB15C']]) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(mx - m, my - m); ctx.lineTo(mx + m, my + m); ctx.moveTo(mx + m, my - m); ctx.lineTo(mx - m, my + m); ctx.stroke(); } }
  }
  // partículas
  for (const p of b.parts) {
    const k = p.t / p.life;
    if (p.k === 'smoke') { const r = p.r0 + (p.r1 - p.r0) * Math.sqrt(k), a = p.a * (1 - k) * Math.min(1, k * 6); ctx.fillStyle = 'rgba(' + p.g + ',' + p.g + ',' + (p.g + 4) + ',' + a + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.fill(); }
    else if (p.k === 'foam') { const r = p.r0 + (p.r1 - p.r0) * k; ctx.fillStyle = 'rgba(240,250,255,' + .5 * (1 - k) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.fill(); }
    else if (p.k === 'drop') { ctx.fillStyle = 'rgba(235,248,255,' + (1 - k) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + k), 0, 6.2832); ctx.fill(); }
    else if (p.k === 'debris') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = 'rgba(25,20,18,' + (1 - k * .7) + ')'; ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); ctx.restore(); }

  }

    const k = p.t / p.life, r = p.r * (1 - k * .5);
    const col = k < .25 ? '255,236,170' : k < .5 ? '255,170,60' : k < .8 ? '230,80,20' : '120,30,10';
    const rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); rg.addColorStop(0, 'rgba(' + col + ',' + (.9 * (1 - k)) + ')'); rg.addColorStop(1, 'rgba(' + col + ',0)');

  }

    if (f.t < 0) continue; const k = f.t / f.life;
    if (f.k === 'flash') { const rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * (.5 + k * .7)); rg.addColorStop(0, 'rgba(255,250,220,' + (1 - k) + ')'); rg.addColorStop(.4, 'rgba(255,190,90,' + .7 * (1 - k) + ')'); rg.addColorStop(1, 'rgba(255,120,30,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.2, 0, 6.2832); ctx.fill(); }
  }
  ctx.globalCompositeOperation = 'source-over';

    if (f.k === 'ring') { ctx.strokeStyle = 'rgba(' + f.col + ',' + .7 * (1 - k) + ')'; ctx.lineWidth = f.w * (1 - k * .6); ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - Math.pow(1 - k, 2)), 0, 6.2832); ctx.stroke(); }
    else if (f.k === 'column') { const up = k < .3 ? k / .3 : 1 - (k - .3) / .7, r = f.r * (.4 + .6 * up); const rg = ctx.createRadialGradient(f.x, f.y - r * .2, 0, f.x, f.y, r); rg.addColorStop(0, 'rgba(255,255,255,' + .95 * up + ')'); rg.addColorStop(.6, 'rgba(210,235,250,' + .6 * up + ')'); rg.addColorStop(1, 'rgba(210,235,250,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 6.2832); ctx.fill(); }
  }
  // projéteis
  for (const s of b.shells) {
    const k = Math.min(1, s.t / s.dur), x = s.sx + (s.tx - s.sx) * k, y = s.sy + (s.ty - s.sy) * k, hgt = s.h * 4 * k * (1 - k);
    ctx.fillStyle = 'rgba(0,10,20,' + (.25 + .35 * k) + ')'; ctx.beginPath(); ctx.ellipse(x, y, c * .1 * (1 + hgt / s.h * .6), c * .06, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,160,.45)'; ctx.lineWidth = 2; ctx.beginPath(); s.trail.forEach(([a, bb], i) => ctx[i ? 'lineTo' : 'moveTo'](a, bb)); ctx.stroke();
    const r = c * (.07 + .05 * hgt / s.h); const rg = ctx.createRadialGradient(x, y - hgt, 0, x, y - hgt, r * 2.2); rg.addColorStop(0, 'rgba(255,245,210,1)'); rg.addColorStop(.4, 'rgba(255,180,80,.9)'); rg.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y - hgt, r * 2.2, 0, 6.2832); ctx.fill();
  }
  // alvos marcados da salva
  if (b.owner === 'foe' && G.salvo.length) G.salvo.forEach((cc, i) => {
    const [x, y] = center(b, cc); ctx.strokeStyle = '#FF5A4F'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, c * .34, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = '#FF5A4F'; ctx.font = '700 ' + c * .34 + 'px "Segoe UI",Arial,sans-serif'; ctx.fillText(String(i + 1), x, y + 1);
  });
  // fantasma do posicionamento
  if (G.phase === 'place' && b.owner === 'me' && G.sel >= 0 && act >= 0 && b.ships[G.sel].x < 0) {
    const s = b.ships[G.sel], [gx, gy] = anchor(act, s, G.dir), ok = fits(b, s, gx, gy, G.dir, G.opts.touch === 'yes') === 1;
    for (const cc of cellsOf(s, gx, gy, G.dir)) { const x = ox + (cc % N) * c, y = oy + Math.floor(cc / N) * c; ctx.fillStyle = ok ? 'rgba(60,220,120,.32)' : 'rgba(240,70,60,.42)'; ctx.fillRect(x + 1, y + 1, c - 2, c - 2); }
    drawShip(ctx, b, s, 'ghost', gx, gy, G.dir);
    const [cx, cy] = [ox + gx * c + (G.dir ? c / 2 : s.len * c / 2), oy + gy * c + (G.dir ? s.len * c / 2 : c / 2)];
    ctx.fillStyle = ok ? '#1E7B3A' : '#B3261E'; ctx.beginPath(); ctx.arc(cx, cy, c * .26, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 ' + c * .32 + 'px "Segoe UI",Arial,sans-serif'; ctx.fillText(ok ? '✓' : '✕', cx, cy + 1);
  }
  // mira
  const aim = (b.owner === 'foe' && G.phase === 'battle') || (b.owner === 'me' && G.phase === 'place' && (G.sel < 0 || b.ships[G.sel].x >= 0));
  if (act >= 0 && aim && !b.cine) {
    const [x, y] = center(b, act), r = c * .46, sp2 = ANIM ? Math.sin(T * 5) * c * .04 : 0, live = b.owner === 'foe' && G.turn === 'me' && !G.busy;
    ctx.strokeStyle = live ? (b.shot[act] ? 'rgba(255,255,255,.6)' : '#FFD25A') : 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    if (b.owner === 'foe') { ctx.save(); ctx.globalAlpha = .25; ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + gw, y); ctx.moveTo(x, oy); ctx.lineTo(x, oy + gw); ctx.stroke(); ctx.restore(); }
    const e = r + sp2, l = c * .16; ctx.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { ctx.moveTo(x + sx * e, y + sy * (e - l)); ctx.lineTo(x + sx * e, y + sy * e); ctx.lineTo(x + sx * (e - l), y + sy * e); }

  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; rr(ctx, ox + .5, oy + .5, gw - 1, gw - 1, 10); ctx.stroke();

  ctx.setTransform(b.dpr, 0, 0, b.dpr, 0, 0);
  if (b.white > 0) { ctx.fillStyle = 'rgba(255,246,225,' + (b.white * .75) + ')'; ctx.fillRect(0, 0, S, S); }
  if (env > 0) {
    const vg = ctx.createRadialGradient(S / 2, S / 2, S * .25, S / 2, S / 2, S * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + .6 * env + ')');

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,232,176,' + ta + ')'; ctx.font = '700 ' + Math.max(13, S * .046) + 'px Georgia,"Times New Roman",serif';
      ctx.fillText(t('cineSunk', shipName(C.s).toUpperCase()), S / 2, S - h / 2);
      ctx.fillStyle = 'rgba(255,255,255,' + .7 * ta + ')'; ctx.font = '600 ' + Math.max(10, S * .026) + 'px "Segoe UI",Arial,sans-serif';
      ctx.fillText((b.owner === 'me' ? t('yourFleet') : t('enemyWaters')).toUpperCase() + ' · ' + cellName(idx(C.s.x, C.s.y)) + '–' + cellName(cellsOf(C.s)[C.s.len - 1]), S / 2, h / 2);
    }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T = now / 1000;
  if (G && G.me.ctx) for (const b of [G.me, G.foe]) { update(b, dt); drawBoard(b); }
  requestAnimationFrame(frame);
}

/* ===================== Entrada ===================== */
function cellAt(b, e) {
  const r = b.cv.getBoundingClientRect(), x = (e.clientX - r.left) * (b.S / r.width) - b.ox, y = (e.clientY - r.top) * (b.S / r.height) - b.oy;
  const cx = Math.floor(x / b.cell), cy = Math.floor(y / b.cell);
  return inb(cx, cy) ? idx(cx, cy) : -1;
}
function describe(b, c) {
  let st;
  if (b.owner === 'foe') st = G.salvo.includes(c) ? t('stTarget') : b.shot[c] === 1 ? t('stMiss') : b.shot[c] === 2 ? (b.ships[b.occ[c]].sunk ? t('stSunk') : t('stHit')) : t('stUnknown');
  else st = b.shot[c] === 1 ? t('stMiss') : b.shot[c] === 2 ? (b.ships[b.occ[c]].sunk ? t('stSunk') : t('stHit') + ', ' + t('stShip', shipName(b.ships[b.occ[c]]))) : b.occ[c] >= 0 ? t('stShip', shipName(b.ships[b.occ[c]])) : t('stSea');
  return cellName(c) + ': ' + st;
}
function announce(b) { $('#curLive').textContent = describe(b, b.cur); }
function act(b, c) { SND.init(); if (G.phase === 'place' && b === G.me) placeAt(c); else if (b === G.foe) foeAction(c); }
function boardFor(cv) { return G ? (cv.id === 'cvMe' ? G.me : G.foe) : null; }
for (const id of ['cvMe', 'cvFoe']) {
  const cv = document.getElementById(id);
  cv.addEventListener('pointermove', (e) => { const b = boardFor(cv); if (!b) return; b.hover = cellAt(b, e); if (b.hover >= 0) b.cur = b.hover; });
  cv.addEventListener('pointerleave', () => { const b = boardFor(cv); if (b) b.hover = -1; });
  cv.addEventListener('click', (e) => { const b = boardFor(cv); if (!b) return; const c = cellAt(b, e); if (c < 0) return; b.cur = c; act(b, c); });
  cv.addEventListener('focus', () => { const b = boardFor(cv); if (b) { b.kb = true; announce(b); } });
  cv.addEventListener('blur', () => { const b = boardFor(cv); if (b) b.kb = false; });
  cv.addEventListener('keydown', (e) => {
    const b = boardFor(cv); if (!b) return;
    let x = b.cur % N, y = Math.floor(b.cur / N), mv = true;
    if (e.key === 'ArrowLeft') x = Math.max(0, x - 1); else if (e.key === 'ArrowRight') x = Math.min(N - 1, x + 1);
    else if (e.key === 'ArrowUp') y = Math.max(0, y - 1); else if (e.key === 'ArrowDown') y = Math.min(N - 1, y + 1);
    else if (e.key === 'Home') x = 0; else if (e.key === 'End') x = N - 1;
    else mv = false;
    if (mv) { e.preventDefault(); b.hover = -1; b.kb = true; b.cur = idx(x, y); announce(b); return; }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.hover = -1; act(b, b.cur); announce(b); }
  });
}
document.addEventListener('keydown', (e) => {
  if (!G || e.ctrlKey || e.metaKey || e.altKey || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || document.querySelector('dialog[open]')) return;
  if ((e.key === 'r' || e.key === 'R') && G.phase === 'place') { e.preventDefault(); rotate(); }
  if ((e.key === 'f' || e.key === 'F') && !$('#salvoBar').hidden && !$('#bSalvoFire').disabled) { e.preventDefault(); $('#bSalvoFire').click(); }
});

/* ===================== Idioma, tema, opções ===================== */
function applyLang() {
  document.documentElement.lang = HTML_LANG[LANG];
  document.title = t('title') + ' · Giovani Perotto Mesquita';
  document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-ta]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.ta)); el.title = t(el.dataset.ta); });
  $('#rulesBody').innerHTML = t('rulesBody');
  $('#sLang').value = LANG;
  $('#lnkMore').href = 'projects.html' + (LANG === 'pt' ? '' : '#' + LANG);
  if (!G) return;
  ui();
  if (G.phase === 'place') setStatus(G.sel < 0 ? t('fleetReady') : t('selectShip'));
  else if (G.over) { setStatus(allSunk(G.foe) ? t('win') : t('lose')); if ($('#dEnd').open) showEnd(); }
  else if (G.turn === 'me' && !G.busy) setStatus(G.opts.mode === 'salvo' ? t('yourTurnSalvo', salvoN()) : t('yourTurn'));
  else if (G.turn === 'foe') setStatus(t('enemyTurn'));
}
function setLang(l, push) {
  LANG = LANGS.includes(l) ? l : 'pt'; store.set('lang', LANG);
  if (push) history.replaceState(null, '', LANG === 'pt' ? location.pathname + location.search : '#' + LANG);
  applyLang();
}
function setTheme(th) { document.documentElement.dataset.theme = th; readColors(); }
function setSound(on) { SND.on = on; const b = $('#bSound'); b.textContent = on ? '🔊' : '🔇'; b.setAttribute('aria-pressed', String(on)); if (SND.ctx) { if (on) { SND.ctx.resume(); SND.ambient(true); } else SND.ambient(false); } }
function fillSetup() { $('#fLevel').value = OPTS.level; $('#fMode').value = OPTS.mode; $('#fFleet').value = OPTS.fleet; $('#fTouch').value = OPTS.touch; $('#fFirst').value = OPTS.first; $('#fSpeed').value = OPTS.speed; $('#fSeed').value = OPTS.seed; }
function openSetup() { fillSetup(); if ($('#dEnd').open) $('#dEnd').close(); $('#dSetup').showModal(); $('#bStart').focus(); }
function readSetup() {
  OPTS = { level: $('#fLevel').value, mode: $('#fMode').value, fleet: $('#fFleet').value, touch: $('#fTouch').value, first: $('#fFirst').value, speed: $('#fSpeed').value, seed: ($('#fSeed').value.match(/\d+/) || [''])[0].slice(0, 9) };
  store.set('opts', OPTS);
}
function begin() { newGame(OPTS.seed ? +OPTS.seed : newSeed()); }

$('#bNew').addEventListener('click', () => { SND.init(); if (G && G.phase === 'battle' && !G.over && !window.confirm(t('confirmNew'))) return; openSetup(); });
$('#bStart').addEventListener('click', () => { SND.init(); readSetup(); $('#dSetup').close(); begin(); });
$('#bSetupCancel').addEventListener('click', () => $('#dSetup').close());

$('#bRules').addEventListener('click', () => { $('#dRules').showModal(); $('#dRules').querySelector('.dlg').scrollTop = 0; $('#hRules').focus(); });
$('#bRulesClose').addEventListener('click', () => $('#dRules').close());
$('#bTheme').addEventListener('click', () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; setTheme(th); store.set('theme', th); });
$('#bSound').addEventListener('click', () => { const on = !SND.on; store.set('sound', on); setSound(on); if (on) SND.init(); });
$('#sLang').addEventListener('change', (e) => setLang(e.target.value, true));
$('#bRotate').addEventListener('click', rotate);
$('#bRandom').addEventListener('click', () => { SND.init(); const r = mulberry(Math.floor(fxr() * 4294967296)); if (randomFleet(G.me, r, G.opts.touch === 'yes')) { G.sel = -1; SND.clank(); renderDock(); setStatus(t('fleetReady')); } });
$('#bClear').addEventListener('click', () => { G.me.ships.forEach((s) => unplace(G.me, s)); G.sel = 0; renderDock(); setStatus(t('selectShip')); });
$('#bBattle').addEventListener('click', () => { SND.init(); startBattle(); });
$('#bSalvoFire').addEventListener('click', () => { if (G && G.salvo.length && !G.busy) volley(G.salvo.slice()); });
$('#bSalvoClear').addEventListener('click', () => { G.salvo = []; ui(); });
$('#bAgain').addEventListener('click', () => { $('#dEnd').close(); newGame(OPTS.seed ? (G.seed + 1) >>> 0 : newSeed()); });
$('#bEndSetup').addEventListener('click', openSetup);
$('#bEndView').addEventListener('click', () => $('#dEnd').close());
window.addEventListener('resize', () => { resizeBoards(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== LANG) setLang(h, false); });

(function init() {
  setTheme(store.get('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const snd = store.get('sound'); setSound(snd === null ? true : !!snd);
  const h = location.hash.slice(1), saved = store.get('lang'), nav = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  LANG = LANGS.includes(h) ? h : LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'pt';
  TILE1 = makeTile(11, 9, 'caustic'); TILE2 = makeTile(23, 6, 'swell');
  applyLang();
  requestAnimationFrame(frame);
  openSetup();
})();
</script>
