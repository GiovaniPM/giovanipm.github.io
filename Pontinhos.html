<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Pontinhos · Giovani Perotto Mesquita</title>
<meta name="description" content="Pontinhos (Dots and Boxes): ligue os pontos, feche quadrados e marque com a sua inicial. Tabuleiros de 2×2 a 15×15, de 2 a 4 jogadores, contra o computador ou entre amigos. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<style>
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --surface-2:#FBF1E3; --ink:#2B1B3D; --text:#3E3350; --muted:#756986; --line:#F1E2CF;
  --accent:#0E8074; --accent-ink:#FFFFFF; --accent-soft:#E2F6F2; --gold:#FFB703; --gold-ink:#B35300; --gold-soft:#FFF1C9; --bad:#B3261E;
  --paper:#FFFDF8; --grid:#E9DDF3; --dot:#2B1B3D; --pen:#2B1B3D; --hover:rgba(14,128,116,.55);
  --c0:#0E8074; --s0:#CDEFE9; --c1:#C2185B; --s1:#FAD3E3; --c2:#5B2A86; --s2:#E6D8F5; --c3:#B35300; --s3:#FFE2C2;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif; --serif:Georgia,"Times New Roman",serif; --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#1A1328; --surface:#241A36; --surface-2:#2D2244; --ink:#F7F0FF; --text:#E2D8F0; --muted:#A898C0; --line:#3A2D52;
  --accent:#5FD3C4; --accent-ink:#10231F; --accent-soft:#1D3A38; --gold:#FFC94D; --gold-ink:#FFC94D; --gold-soft:#3A2E12; --bad:#FF8A80;
  --paper:#201733; --grid:#33264A; --dot:#F7F0FF; --pen:#EDE3FA; --hover:rgba(95,211,196,.6);
  --c0:#5FD3C4; --s0:#17423D; --c1:#FF6F91; --s1:#4A1E33; --c2:#C9A7F5; --s2:#3A2A55; --c3:#FFB066; --s3:#4A3018;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand h1{font-family:var(--serif);font-size:1.35rem;margin:0;color:var(--ink);line-height:1.1}
.brand p{margin:0;font-size:.82rem;color:var(--muted)}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.45rem .8rem;min-height:40px;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
select,input[type="number"],input[type="text"]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem .5rem;min-height:40px;color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:1rem;max-width:1180px;margin:0 auto;padding:1rem;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;min-width:0}
.play{display:flex;flex-direction:column;gap:.7rem}
.status{min-height:2.7em;color:var(--ink);font-weight:600;line-height:1.35}
.status small{display:block;font-weight:400;color:var(--muted)}
.score{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.45rem}
.score li{display:flex;align-items:center;gap:.45rem;padding:.3rem .65rem .3rem .35rem;border-radius:999px;background:var(--surface-2);border:2px solid transparent;font-size:.92rem}
.score li.cur{border-color:var(--gold);background:var(--gold-soft)}
.score .sw{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border-radius:7px;font-weight:800;font-size:.82rem;color:var(--ink);background:var(--sw-s);border:2px solid var(--sw-c)}
.score .nm{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600}
.score .kd{font-size:.74rem;color:var(--muted)}
.score b{font-size:1.05rem;color:var(--ink);min-width:1.4em;text-align:right}
.score .turn{font-size:.72rem;font-weight:700;color:var(--gold-ink);text-transform:uppercase;letter-spacing:.04em}
.boardwrap{overflow:auto;border-radius:12px;background:var(--paper);border:1px solid var(--line);touch-action:manipulation}
#board{display:block;width:100%;height:auto;margin:0 auto;user-select:none;-webkit-user-select:none}
#board:focus{outline:none}
.boardwrap:focus-within{outline:3px solid var(--gold);outline-offset:2px}
#board .gridln{stroke:var(--grid);stroke-width:1.2;stroke-dasharray:3 6}
#board .dot{fill:var(--dot)}
#board .ln{stroke:var(--pen);stroke-width:5.5;stroke-linecap:round}
#board .ln.last{stroke:var(--gold-ink);stroke-width:7}
#board .ln.new{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#board .hit{stroke:transparent;stroke-linecap:round;cursor:pointer}
#board .prev{stroke:var(--hover);stroke-width:6;stroke-linecap:round;stroke-dasharray:2 10;opacity:0;pointer-events:none}
#board.live .hit:hover + .prev{opacity:1}
#board .kcur{stroke:var(--gold);stroke-width:12;stroke-linecap:round;opacity:.9;pointer-events:none}
#board .hint{stroke:var(--accent);stroke-width:10;stroke-linecap:round;pointer-events:none;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
#board .box{stroke:none}
#board .box.new{animation:pop .45s ease-out}
@keyframes pop{from{opacity:0}to{opacity:1}}
#board .ini{font-family:var(--sans);font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.actions .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.side h2{font-size:.98rem;margin:0 0 .45rem;color:var(--ink)}
.side h2+p{margin-top:0}
.facts{list-style:none;margin:0 0 .9rem;padding:0;display:grid;gap:.25rem;font-size:.9rem}
.facts b{color:var(--ink)}
.log{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto;font-size:.88rem;display:flex;flex-direction:column-reverse;gap:.2rem}
.log li{padding:.25rem .45rem;border-radius:6px;background:var(--surface-2)}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:1.1rem 1.2rem;width:min(660px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
dialog::backdrop{background:rgba(20,10,30,.55)}
dialog h2{font-family:var(--serif);margin:0 0 .7rem;color:var(--ink)}
dialog h3{font-size:1rem;margin:1rem 0 .35rem;color:var(--ink)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin:0 0 .8rem;min-width:0}
legend{font-weight:700;color:var(--ink);padding:0 .3rem}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.4rem}
.sizes label{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.45rem .3rem;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;text-align:center;font-size:.86rem}
.sizes label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sizes input{position:absolute;opacity:0;pointer-events:none}
.sizes label:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.sizes svg{width:40px;height:40px}
.sizes b{color:var(--ink)}
.sizes small{color:var(--muted);font-size:.74rem}
.custom{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
.custom label{display:flex;gap:.35rem;align-items:center}
.custom input{width:5em}
.sizeinfo{font-size:.84rem;color:var(--muted);margin:.5rem 0 0}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:.4rem;margin-bottom:.45rem;align-items:center}
.prow .sw{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;font-weight:800;color:var(--ink);background:var(--sw-s);border:2px solid var(--sw-c);font-size:.85rem}
.prow input{width:100%}
.opt{display:flex;gap:.55rem;align-items:flex-start;padding:.35rem 0}
.opt input{margin-top:.25rem;width:18px;height:18px;flex:none}
.opt span small{display:block;color:var(--muted);font-size:.82rem}
.seed{display:grid;gap:.25rem;font-size:.9rem}
.seed input{width:100%}
.row{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;margin-top:.8rem}
.rules{padding-left:1.15rem;margin:.2rem 0;display:grid;gap:.35rem;line-height:1.45;font-size:.93rem}
.rank{list-style:none;padding:0;margin:.4rem 0;display:grid;gap:.35rem}
.rank li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.45rem .7rem;border-radius:9px;background:var(--surface-2);font-weight:600}
.rank li.win{background:var(--gold-soft);color:var(--ink)}
.note{background:var(--gold-soft);border-radius:10px;padding:.55rem .75rem;font-size:.88rem;color:var(--ink)}
a{color:var(--accent)}
kbd{font-family:inherit;font-size:.85em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .3em;background:var(--surface-2)}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);padding:.6rem}}
@media (max-width:480px){
  .top{padding:.5rem .6rem}.brand p{display:none}.btn{padding:.4rem .55rem}
  .card{padding:.7rem}.score li{font-size:.85rem}.score .kd{display:none}.score .nm{max-width:6.5em}
  .prow{grid-template-columns:auto minmax(0,1fr);padding-bottom:.45rem;border-bottom:1px solid var(--line)}
  .prow select{grid-column:1/2}.prow button{grid-column:2/3;justify-self:end}
}
@media (prefers-reduced-motion:reduce){#board .ln.new,#board .box.new,#board .hint{animation:none}#board .ln.new{stroke-dashoffset:0}}
@media print{.tools,.actions,.side{display:none}body{background:#fff}.layout{display:block}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="8" fill="#FFF1C9"/><rect x="9" y="9" width="11" height="11" fill="#CDEFE9"/><text x="14.5" y="15.2" font-size="8" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="#2B1B3D" font-family="Arial">A</text><path d="M9 9h22M9 9v22M20 9v11H9" stroke="#2B1B3D" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M20 20h11" stroke="#B35300" stroke-width="2.4" stroke-linecap="round"/><g fill="#2B1B3D"><circle cx="9" cy="9" r="2.2"/><circle cx="20" cy="9" r="2.2"/><circle cx="31" cy="9" r="2.2"/><circle cx="9" cy="20" r="2.2"/><circle cx="20" cy="20" r="2.2"/><circle cx="31" cy="20" r="2.2"/><circle cx="9" cy="31" r="2.2"/><circle cx="20" cy="31" r="2.2"/><circle cx="31" cy="31" r="2.2"/></g></svg>
    <div><h1 data-t="title">Pontinhos</h1><p data-t="subtitle"></p></div>
  </div>
  <div class="tools">
    <button type="button" class="btn" id="bNew" data-t="btn.new"></button>
    <button type="button" class="btn" id="bRules" data-t="btn.rules"></button>
    <label class="sr" for="lang" data-t="lang"></label>
    <select id="lang"><option value="pt">PT</option><option value="en">EN</option><option value="it">IT</option><option value="es">ES</option></select>
    <button type="button" class="btn" id="bTheme" aria-label="" data-ta="btn.theme">◐</button>
  </div>
</header>

<main class="layout" id="game">
  <section class="card play" aria-labelledby="hPlay">
    <h2 class="sr" id="hPlay" data-t="board"></h2>
    <div class="status" id="status" aria-live="polite"></div>
    <ul class="score" id="score" aria-label=""></ul>
    <div class="boardwrap" id="bwrap"><svg id="board" tabindex="0" role="application" aria-roledescription="" aria-describedby="kbdHelp"></svg></div>
    <p class="sr" id="kbdHelp" data-t="kbd.help"></p>
    <p class="sr" aria-live="polite" id="cursorLive"></p>
    <div class="actions">
      <button type="button" class="btn" id="bHint" data-t="btn.hint"></button>
      <button type="button" class="btn" id="bUndo" data-t="btn.undo"></button>
      <span class="sp"></span>
      <span class="muted small" id="left"></span>
    </div>
    <p class="muted small" id="help"></p>
  </section>
  <section class="card side" aria-labelledby="hSide">
    <h2 id="hSide" data-t="side"></h2>
    <ul class="facts" id="facts"></ul>
    <h2 data-t="log"></h2>
    <ol class="log" id="log" aria-live="polite"></ol>
    <p class="muted small" id="seedInfo"></p>
  </section>
</main>

<dialog id="dSetup" aria-labelledby="hSetup">
  <form method="dialog" id="fSetup">
    <h2 id="hSetup" data-t="setup.title"></h2>
    <fieldset><legend data-t="setup.size"></legend>
      <div class="sizes" id="sizes"></div>
      <div class="custom" id="custom">
        <label><span data-t="setup.rows"></span><input type="number" name="rows" min="1" max="15" value="6"></label>
        <span aria-hidden="true">×</span>
        <label><span data-t="setup.cols"></span><input type="number" name="cols" min="1" max="15" value="9"></label>
      </div>
      <p class="sizeinfo" id="sizeInfo" aria-live="polite"></p>
    </fieldset>
    <fieldset><legend data-t="setup.players"></legend>
      <div id="pList"></div>
      <button type="button" class="btn" id="bAddP" data-t="p.add"></button>
    </fieldset>
    <fieldset><legend data-t="setup.rule"></legend>
      <label class="opt"><input type="checkbox" name="extra" checked><span><span data-t="opt.extra"></span><small data-t="opt.extraD"></small></span></label>
    </fieldset>
    <label class="seed"><span data-t="setup.seed"></span><input type="text" name="seed" inputmode="numeric" autocomplete="off"><small class="muted" data-t="setup.seedHelp"></small></label>
    <div class="row"><button type="button" class="btn" id="bCancel" data-t="close"></button><button type="submit" class="btn primary" data-t="setup.start"></button></div>
  </form>
</dialog>

<dialog id="dRules" aria-labelledby="hRules">
  <h2 id="hRules" data-t="btn.rules" tabindex="-1" autofocus></h2>
  <ul class="rules" id="rList"></ul>
  <h3 data-t="rd.stratH"></h3>
  <ul class="rules" id="rStrat"></ul>
  <h3 data-t="rd.cpuH"></h3>
  <ul class="rules" id="rCpu"></ul>
  <h3 data-t="rd.keysH"></h3>
  <ul class="rules" id="rKeys"></ul>
  <h3 data-t="rd.src"></h3>
  <ul class="rules small">
    <li><a href="https://pt.wikipedia.org/wiki/Timbiriche_(jogo)" rel="noopener" target="_blank">Wikipédia, “Timbiriche (jogo)”</a></li>
    <li><a href="https://en.wikipedia.org/wiki/Dots_and_boxes" rel="noopener" target="_blank">Wikipedia, “Dots and boxes”</a></li>
    <li><a href="https://fr.wikipedia.org/wiki/La_Pipopipette" rel="noopener" target="_blank">Wikipédia, “La Pipopipette”</a></li>
    <li><a href="https://www.math.ucla.edu/~tom/Games/dots&amp;boxes_hints.html" rel="noopener" target="_blank">UCLA Mathematics, “Dots and Boxes hints”</a></li>
  </ul>
  <div class="row"><button type="button" class="btn primary" id="bRulesClose" data-t="close"></button></div>
</dialog>

<dialog id="dEnd" aria-labelledby="hEnd">
  <h2 id="hEnd" data-t="e.title"></h2>
  <p id="endMsg" class="note"></p>
  <ol class="rank" id="endRank"></ol>
  <p id="endInfo" class="muted small"></p>
  <div class="row"><button type="button" class="btn" id="bEndClose" data-t="close"></button><button type="button" class="btn" id="bEndNew" data-t="e.new"></button><button type="button" class="btn primary" id="bEndAgain" data-t="e.again"></button></div>
</dialog>

function rand(st) {

  let x = Math.imul(st.rng ^ (st.rng >>> 15), 1 | st.rng);

/* ===================== Geometria do tabuleiro =====================
   R linhas e C colunas de quadrados. Linhas horizontais: e = r*C + c (r de 0 a R).
   Linhas verticais: e = nH + r*(C+1) + c (c de 0 a C). Quadrado b = r*C + c. */
const U = 60, M = 26;
const GEO = {};
function geo(R, C) {
  const key = R + 'x' + C; if (GEO[key]) return GEO[key];
  const nH = (R + 1) * C, nV = R * (C + 1), nE = nH + nV, nB = R * C;
  const hE = (r, c) => r * C + c, vE = (r, c) => nH + r * (C + 1) + c;
  const BE = [], ADJ = Array.from({ length: nE }, () => []), EG = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const b = r * C + c, es = [hE(r, c), hE(r + 1, c), vE(r, c), vE(r, c + 1)];
    BE[b] = es; es.forEach((e) => ADJ[e].push(b));
  }
  for (let r = 0; r <= R; r++) for (let c = 0; c < C; c++) EG[hE(r, c)] = { h: true, r, c, x1: M + c * U, y1: M + r * U, x2: M + (c + 1) * U, y2: M + r * U };
  for (let r = 0; r < R; r++) for (let c = 0; c <= C; c++) EG[vE(r, c)] = { h: false, r, c, x1: M + c * U, y1: M + r * U, x2: M + c * U, y2: M + (r + 1) * U };
  EG.forEach((g) => { g.cx = (g.x1 + g.x2) / 2; g.cy = (g.y1 + g.y2) / 2; });
  return (GEO[key] = { R, C, nH, nV, nE, nB, BE, ADJ, EG, W: 2 * M + C * U, H: 2 * M + R * U });
}

function newPos(g) { return { g, E: new Int8Array(g.nE).fill(-1), B: new Int8Array(g.nB).fill(-1), sd: new Uint8Array(g.nB) }; }

function unapply(P, e) { for (const b of P.g.ADJ[e]) { if (P.sd[b] === 4) P.B[b] = -1; P.sd[b]--; } P.E[e] = -1; }

const completes = (P, e) => { let k = 0; for (const b of P.g.ADJ[e]) if (P.sd[b] === 3) k++; return k; };

/* ===================== Fim de jogo: cadeias e ciclos =====================
   Sem linha segura e sem quadrado para fechar, todo quadrado livre tem dois lados traçados:
   os quadrados formam cadeias (que terminam na borda) e ciclos. decompose devolve as peças,
   ou null se a posição tiver outro formato (por exemplo, um quadrado com três saídas). */
function decompose(P) {
  const g = P.g, seen = new Uint8Array(g.nB), comps = [];

  for (let s = 0; s < g.nB; s++) {
    if (P.B[s] >= 0 || seen[s]) continue;
    // anda pela peça a partir de s nos dois sentidos
    const fr = g.BE[s].filter((e) => P.E[e] < 0);
    const walk = (start, e0) => { const path = []; let b = start, e = e0; for (;;) { const n = other(g, e, b); if (n < 0) return { path, ground: true, end: e }; if (n === s) return { path, ground: false, end: e }; path.push({ b: n, via: e }); seen[n] = 1; e = g.BE[n].find((x) => P.E[x] < 0 && x !== e); b = n; } };
    seen[s] = 1;
    const a = walk(s, fr[0]);
    if (!a.ground) { const boxes = [s, ...a.path.map((x) => x.b)]; comps.push({ loop: true, len: boxes.length, boxes, open: fr[0] }); continue; }
    const z = walk(s, fr[1]);
    const order = [...z.path.map((x) => x.b).reverse(), s, ...a.path.map((x) => x.b)];
    const inner = [...z.path.map((x) => x.via).reverse(), ...a.path.map((x) => x.via)];
    comps.push({ loop: false, len: order.length, boxes: order, ends: [z.end, a.end], inner });

}
/* valor do fim de jogo simples para quem precisa abrir uma peça (2 jogadores, quem fecha joga de novo).

/* linha que abre cada peça: cadeia de 2 pelo meio; demais por uma ponta */

/* recusa dupla: o quadrado A tem 3 lados, a linha que falta (x) leva a B, com 2 lados, e a outra linha livre de B (y)
   não dá a terceira linha a mais ninguém. Traçar y deixa A e B para o adversário fechar com uma linha só. */
function ddChance(P) {
  const g = P.g;
  for (let A = 0; A < g.nB; A++) {
    if (P.B[A] >= 0 || P.sd[A] !== 3) continue;
    const x = missing(P, A), B = other(g, x, A);
    if (B < 0 || P.sd[B] !== 2) continue;
    const y = missing(P, B, x), C = other(g, y, B);
    if (C >= 0 && P.sd[C] >= 2) continue;
    return { A, B, x, y };

}

/* ===================== Busca exata (2 jogadores) =====================
   Com poucas linhas livres, testa todas as sequências (com memória) e devolve a melhor linha.
   Valor = quadrados de quem joga menos os do adversário, daqui até o fim. */
const EXACT_MAX = 18, NODE_CAP = 600000;

  const P = clonePos(P0), F = freeEdges(P), n = F.length; if (!n) return null;
  const memo = new Map(); let nodes = 0; const full = 2 ** n - 1;

  const rec = (mask) => {
    if (mask === full) return 0;
    const m = memo.get(mask); if (m !== undefined) return m;
    if (++nodes > NODE_CAP) throw new Error('cap');
    let best = -Infinity;
    for (const i of ord(mask)) {
      const e = F[i], k = apply(P, e, 0).length, sub = rec(mask + 2 ** i); unapply(P, e);
      const v = k ? (extra ? k + sub : k - sub) : -sub;
      if (v > best) best = v;

    let best = -Infinity, list = [];

      const v = k ? (extra ? k + sub : k - sub) : -sub;

}

/* ===================== Computador ===================== */

function aiMove(P, level, rnd, nP, extra) {

    if (caps.length && rnd() < 0.85) return { e: pick(caps, rnd), why: 'capture' };
    if (safe.length && rnd() < 0.5) return { e: pick(safe, rnd), why: 'safe' };

  }

      // fecha primeiro o que não faz parte da decisão de recusar
      const firstCaps = dd ? caps.filter((e) => e !== dd.x) : caps;
      if (firstCaps.length) return { e: pick(firstCaps, rnd), why: 'capture' };
      if (dd) {
        const Q = clonePos(P); apply(Q, dd.x, 9); apply(Q, dd.y, 9);
        const QF = freeEdges(Q);
        if (QF.length && !QF.some((e) => isSafe(Q, e) && !completes(Q, e))) {
          const comps = decompose(Q);
          if (comps && comps.length) { const f = endValue(comps); if (-2 - f > 2 + f) return { e: dd.y, why: 'dd', dd: true }; }
          else if (!comps) {
            // posição com junções: recusa se, pegando tudo, a entrega mais barata que sobraria já fosse de 3 ou mais
            let minGive = Infinity; for (const e of QF) { const n = greedyGive(Q, e); if (n < minGive) minGive = n; if (minGive < 3) break; }
            let left = 0; for (let b = 0; b < Q.g.nB; b++) if (Q.B[b] < 0) left++;
            if (minGive >= 3 && left > 4) return { e: dd.y, why: 'dd', dd: true };
          }
        }
      }
    }
    return { e: pick(caps, rnd), why: 'capture' };
  }
  if (safe.length) return { e: pick(safe, rnd), why: 'safe' };

  if (level === 'hard' && extra) {
    const comps = decompose(P);
    if (comps && comps.length) {
      let best = -Infinity, list = [];
      comps.forEach((c, i) => {
        const rest = comps.filter((_, j) => j !== i), f = endValue(rest), L = c.len;
        let opp = L + f; if (c.loop) opp = Math.max(opp, L - 8 - f); else if (L >= 3) opp = Math.max(opp, L - 4 - f);
        if (-opp > best) { best = -opp; list = [c]; } else if (-opp === best) list.push(c);
      });
      const c = list.sort((a, b) => a.len - b.len)[0], e = openEdge(c);
      return { e, why: !c.loop && c.len === 2 ? 'handout' : 'give', give: c.len };
    }
  }
  let best = Infinity, list = [];
  for (const e of F) { const n = greedyGive(P, e); if (n < best) { best = n; list = [e]; } else if (n === best) list.push(e); }
  if (level === 'hard' && extra && best === 2) {
    // entre as que dão 2, prefere as que não deixam o adversário recusar
    const strict = list.filter((e) => { const Q = clonePos(P); apply(Q, e, 9); return !ddChance(Q); });
    if (strict.length) return { e: pick(strict, rnd), why: 'handout', give: 2 };
  }

}

/* ===================== Estado da partida ===================== */
let S = null, P = null, aiTimer = null;

function initials(players) {

  out.forEach((v, i) => { if (dup[i]) out[i] = raw[i].two || v; });

function addLog(k, a) { S.log.push({ k, a }); if (S.log.length > 300) S.log.splice(0, S.log.length - 300); }

    if (!S || S.over || isHuman(curP())) return;
    const st = { rng: S.rng }, r = () => rand(st);

/* ===================== Desenho ===================== */
function boardSVG(g, Pp, opt) {

    const b = r * g.C + c, o = Pp.B[b], x = M + c * U, y = M + r * U;
    if (o >= 0) s.push(`<rect class="box${opt.newBoxes && opt.newBoxes.includes(b) ? ' new' : ''}" x="${x + 3}" y="${y + 3}" width="${U - 6}" height="${U - 6}" rx="4" fill="var(--s${o})"/><text class="ini" x="${x + U / 2}" y="${y + U / 2 + 1}" font-size="${opt.ini[o].length > 1 ? U * 0.34 : U * 0.42}" fill="var(--c${o})">${esc(opt.ini[o])}</text>`);
  }
  for (let e = 0; e < g.nE; e++) {
    const G = g.EG[e];
    if (Pp.E[e] >= 0) {
      const len = U;
      s.push(`<line class="ln${e === opt.last ? ' last' : ''}${e === opt.newEdge ? ' new' : ''}" style="--len:${len}" x1="${G.x1}" y1="${G.y1}" x2="${G.x2}" y2="${G.y2}"/>`);
    } else {
      s.push(`<line class="gridln" x1="${G.x1}" y1="${G.y1}" x2="${G.x2}" y2="${G.y2}"/>`);
      if (opt.live) s.push(`<line class="hit" data-e="${e}" stroke-width="${U * 0.44}" x1="${G.x1 + (G.h ? 9 : 0)}" y1="${G.y1 + (G.h ? 0 : 9)}" x2="${G.x2 - (G.h ? 9 : 0)}" y2="${G.y2 - (G.h ? 0 : 9)}"/><line class="prev" x1="${G.x1}" y1="${G.y1}" x2="${G.x2}" y2="${G.y2}"/>`);
    }
  }
  if (opt.hint >= 0) { const G = g.EG[opt.hint]; s.push(`<line class="hint" x1="${G.x1}" y1="${G.y1}" x2="${G.x2}" y2="${G.y2}"/>`); }
  if (opt.cur >= 0) { const G = g.EG[opt.cur]; s.push(`<line class="kcur" x1="${G.x1}" y1="${G.y1}" x2="${G.x2}" y2="${G.y2}"/>`); }
  for (let r = 0; r <= g.R; r++) for (let c = 0; c <= g.C; c++) s.push(`<circle class="dot" cx="${M + c * U}" cy="${M + r * U}" r="6"/>`);

}

/* ===================== Teclado no tabuleiro ===================== */
function nearestFree(from) {

  if (v !== 'custom') { const [r, c] = v.split('x').map(Number); return { R: r, C: c, ok: true }; }
  const R = Math.round(+f.rows.value), C = Math.round(+f.cols.value);
  return { R, C, ok: R >= 1 && C >= 1 && R <= 15 && C <= 15 && R * C >= 2 };
}
function syncSize() {
  const z = readSize(), f = $('#fSetup'), custom = ((f.querySelector('input[name="size"]:checked') || {}).value === 'custom');
  $('#custom').hidden = !custom;
  $('#sizeInfo').textContent = z.ok ? t('setup.sizeInfo', z.R * z.C, (z.R + 1) * (z.C + 1), (z.R + 1) * z.C + z.R * (z.C + 1)) : t('setup.sizeBad');
  f.querySelector('button[type="submit"]').disabled = !z.ok;
}
function readPlayers() {
  return [...document.querySelectorAll('#pList .prow')].map((r) => ({ name: r.querySelector('input').value, kind: r.querySelector('select').value }));
}
function renderPlayers(list) {
  const ini = initials(list.map((p, i) => ({ name: p.name.trim() || t('def.player', i + 1) })));
  $('#pList').innerHTML = list.map((p, i) => `<div class="prow"><span class="sw" style="--sw-c:var(--c${i});--sw-s:var(--s${i})" aria-hidden="true">${esc(ini[i])}</span><input type="text" aria-label="${esc(t('p.name', i + 1))}" maxlength="18" value="${esc(p.name)}"><select aria-label="${esc(t('p.type', i + 1))}">${['human','easy','medium','hard'].map((k) => `<option value="${k}"${p.kind === k ? ' selected' : ''}>${esc(t('p.' + k))}</option>`).join('')}</select><button type="button" class="btn" data-rm="${i}" aria-label="${esc(t('p.removeA', i + 1))}" ${list.length <= 2 ? 'disabled' : ''}>${esc(t('p.remove'))}</button></div>`).join('');
  $('#bAddP').disabled = list.length >= 4;
}
function openSetup() {
  const cfg = store.get('setup'), f = $('#fSetup');
  renderSizes();
  let v = '5x5';
  if (cfg && cfg.R && cfg.C) { v = PRESETS.some(([r, c]) => r === cfg.R && c === cfg.C) ? cfg.R + 'x' + cfg.C : 'custom'; if (v === 'custom') { f.rows.value = cfg.R; f.cols.value = cfg.C; } }
  f.querySelector(`input[name="size"][value="${v}"]`).checked = true;
  f.extra.checked = !(cfg && cfg.extra === false);
  f.seed.value = '';
  renderPlayers(cfg && cfg.players && cfg.players.length >= 2 ? cfg.players : [{ name: t('def.you'), kind: 'human' }, { name: t('def.cpu'), kind: 'medium' }]);
  syncSize();
  $('#bCancel').hidden = !S;
  $('#dSetup').showModal();
}
function showEnd() {
  const sc = scores(), order = S.players.map((p, i) => ({ p, i, s: sc[i] })).sort((a, b) => b.s - a.s), top = order[0].s;
  const w = order.filter((x) => x.s === top).map((x) => x.p.name);
  $('#endMsg').textContent = w.length > 1 ? t('e.tie', w.join(t('e.and')), nBoxes(top)) : t('e.win', w[0], nBoxes(top));
  $('#endRank').innerHTML = order.map((x) => `<li class="${x.s === top ? 'win' : ''}"><span><span class="sw" style="display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:7px;margin-right:.5rem;border:2px solid var(--c${x.i});background:var(--s${x.i});font-size:.8rem">${esc(x.p.ini)}</span>${x.s === top ? '🏆 ' : ''}${esc(x.p.name)} <small class="muted">${esc(t('k.' + x.p.kind))}</small></span><span>${esc(nBoxes(x.s))}</span></li>`).join('');
  $('#endInfo').textContent = t('e.info', S.R, S.C, S.seed);
  if (!$('#dEnd').open) $('#dEnd').showModal();
}

/* ===================== Eventos ===================== */
$('#board').addEventListener('click', (e) => {
  const h = e.target.closest('.hit'); if (!h || !S || S.over || !isHuman(curP())) return;
  play(+h.dataset.e);
});
/* clique ou toque: sem cursor de teclado e sem redesenhar no foco (o redesenho trocaria a linha sob o dedo) */
$('#board').addEventListener('pointerdown', () => { UI.kbd = false; UI.ptr = true; setTimeout(() => { UI.ptr = false; }, 400); });
$('#board').addEventListener('focus', () => { if (UI.ptr) return; UI.kbd = true; if (S && !S.over) { if (UI.cur < 0 || P.E[UI.cur] >= 0) UI.cur = nearestFree(-1); render(); announce(); } });
$('#board').addEventListener('blur', () => { if (S && UI.kbd) render(); });
$('#board').addEventListener('keydown', (e) => {
  if (!S || S.over) return;
  const k = e.key, d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (d || k === 'Enter' || k === ' ') UI.kbd = true;
  if (d) { e.preventDefault(); moveCursor(d[0], d[1]); render(); announce(); return; }
  if ((k === 'Enter' || k === ' ') && isHuman(curP())) { e.preventDefault(); if (UI.cur >= 0 && P.E[UI.cur] < 0) { play(UI.cur); $('#board').focus(); announce(); } }
});
$('#bHint').addEventListener('click', hint);
$('#bUndo').addEventListener('click', undo);
$('#bNew').addEventListener('click', () => { if (S && !S.over && S.moves.length && !confirm(t('confirmNew'))) return; openSetup(); });
$('#bRules').addEventListener('click', () => { $('#dRules').showModal(); $('#dRules').scrollTop = 0; $('#hRules').focus(); });
$('#bRulesClose').addEventListener('click', () => $('#dRules').close());
$('#bTheme').addEventListener('click', () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; setTheme(th); store.set('theme', th); });
$('#lang').addEventListener('change', (e) => setLang(e.target.value));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== LANG) setLang(h, false); });
$('#fSetup').addEventListener('change', (e) => { if (e.target.name === 'size' || e.target.name === 'rows' || e.target.name === 'cols') syncSize(); });
$('#fSetup').addEventListener('input', (e) => { if (e.target.name === 'rows' || e.target.name === 'cols') syncSize(); if (e.target.closest('.prow')) { const l = readPlayers(); const ini = initials(l.map((p, i) => ({ name: p.name.trim() || t('def.player', i + 1) }))); document.querySelectorAll('#pList .sw').forEach((s, i) => { s.textContent = ini[i]; }); } });
$('#bAddP').addEventListener('click', () => { const l = readPlayers(); if (l.length < 4) { l.push({ name: t('def.cpuN', l.filter((x) => x.kind !== 'human').length + 1), kind: 'medium' }); renderPlayers(l); } });
$('#pList').addEventListener('click', (e) => { const b = e.target.closest('[data-rm]'); if (!b) return; const l = readPlayers(); l.splice(+b.dataset.rm, 1); renderPlayers(l); });
$('#bCancel').addEventListener('click', () => $('#dSetup').close());
$('#dSetup').addEventListener('cancel', (e) => { if (!S) e.preventDefault(); });
$('#fSetup').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, z = readSize(); if (!z.ok) return;
  const players = readPlayers().map((p, i) => ({ name: p.name.trim().slice(0, 18) || t('def.player', i + 1), kind: ['human','easy','medium','hard'].includes(p.kind) ? p.kind : 'human' }));
  $('#dSetup').close();
  newGame({ R: z.R, C: z.C, extra: f.extra.checked, players, seed: f.seed.value.trim(), first: 0 });
});
$('#bEndClose').addEventListener('click', () => $('#dEnd').close());
$('#bEndNew').addEventListener('click', () => { $('#dEnd').close(); openSetup(); });
$('#bEndAgain').addEventListener('click', () => {
  $('#dEnd').close();
  const c = store.get('setup'); if (!c) { openSetup(); return; }
  newGame(Object.assign({}, c, { seed: '', first: ((c.first || 0) + 1) % c.players.length }));
});
document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'z' || e.key === 'Z')) { if (canUndo()) { e.preventDefault(); undo(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.toLowerCase() === t('kbd.hintKey')) { e.preventDefault(); hint(); }
});

/* ===================== Início ===================== */
(function init() {
  const th = store.get('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  setTheme(th);
  const h = location.hash.slice(1), saved = store.get('lang'), nav = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  LANG = LANGS.includes(h) ? h : LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'pt';
  applyStatic();
  const g = store.get('game');
  if (g && g.v === 1 && g.R >= 1 && g.C >= 1 && g.R <= 15 && g.C <= 15 && Array.isArray(g.players) && g.players.length >= 2 && Array.isArray(g.moves)) {
    S = g; S.log = S.log || []; replay();
    if (S.moves.length === P.g.nE) S.over = true;
    render();
    if (S.over) showEnd(); else schedule();
  } else { S = null; openSetup(); }
})();
</script>
</body>
</html>
