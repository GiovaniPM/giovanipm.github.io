<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>As Guerras Púnicas · Giovani Perotto Mesquita</title>
<meta name="description" content="Jogo de tabuleiro com dados sobre as Guerras Púnicas: Aníbal dos Alpes a Canas, Cipião da Hispânia a Zama e o último cerco de Cartago, com eventos, números e batalhas tirados de Políbio, Lívio e Apiano. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#24170F">
<style>
  :root {
    --bg: #24170F; --panel: #F6EEDC; --panel-2: #EBDDBF; --ink: #2A1D14; --muted: #6E5B47; --line: #D3BF97;
    --accent: #8E1B1B; --sand: rgba(201,154,46,.14); --accent-ink: #FFFFFF; --gold: #C99A2E; --ok: #2F6B3A; --sea: #9DB8C2; --sea-2: #86A6B2; --land: #E9DDBE; --land-2: #DCCBA2;
    --road: #6B4A2A; --river: #4F7F91; --searoute: #2F5E8F; --coast: #5E4A32; --mapink: #2A1D14; --hatch: #7A5530; --tree: #4E6B38;
    --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif; --serif: Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: #241C15; --panel-2: #30261D; --ink: #F1E7D3; --muted: #BDAA8C; --line: #4A3C2C; --accent: #E0614F; --accent-ink: #1A0E08; --ok: #7CC48A; --sea: #2D4651; --sea-2: #253B45; --land: #5A4C36; --land-2: #4E412E; --road: #D8B888; --river: #86BED0; --searoute: #9CC3E6; --coast: #C9B48E; --mapink: #F1E7D3; --hatch: #C9A574; --tree: #9CC48A; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --panel: #241C15; --panel-2: #30261D; --ink: #F1E7D3; --muted: #BDAA8C; --line: #4A3C2C; --accent: #E0614F; --accent-ink: #1A0E08; --ok: #7CC48A; --sea: #2D4651; --sea-2: #253B45; --land: #5A4C36; --land-2: #4E412E; --road: #D8B888; --river: #86BED0; --searoute: #9CC3E6; --coast: #C9B48E; --mapink: #F1E7D3; --hatch: #C9A574; --tree: #9CC48A; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { overflow-x: hidden; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 8px; padding: 8px; height: 100dvh; }
  .stage { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .side { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .75rem; }
  .box h2 { font-family: var(--serif); font-size: 1rem; margin: 0 0 .4rem; }
  .topbar { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; color: #F3E6CC; font-size: .86rem; }
  .topbar .info { display: flex; gap: .3rem .9rem; flex-wrap: wrap; flex: 1; min-width: 0; align-items: baseline; }
  .topbar .date { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: #F7D27A; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: .45rem .8rem; font-weight: 600; min-height: 38px; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.sm { padding: .25rem .55rem; min-height: 30px; font-size: .8rem; }
  .topbar .btn.sm { background: rgba(0,0,0,.3); color: #F3E6CC; border-color: rgba(255,255,255,.25); }
  .mapwrap { position: relative; flex: 1; min-height: 260px; border-radius: 14px; overflow: hidden; border: 4px solid #6B4A2A; background: var(--sea); touch-action: none; }
  #map { width: 100%; height: 100%; display: block; user-select: none; }
  .zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .zoom .btn { width: 36px; padding: 0; background: var(--panel); }
  .legend { position: absolute; left: 8px; bottom: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: .72rem; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 60px); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #0006; }
  /* mapa */
  .node { cursor: pointer; }
  .node .lbl { font-family: var(--serif); font-size: 9px; fill: #2A1D14; paint-order: stroke; stroke: #F4EAD3; stroke-width: 2.4px; stroke-linejoin: round; pointer-events: none; }
  .rvl { font-size: calc(var(--k, 1) * 10px); font-style: italic; fill: var(--river); paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--k, 1) * 2.4px); }
  .mtl { font-size: calc(var(--k, 1) * 11px); font-style: italic; letter-spacing: .12em; fill: var(--road); paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--k, 1) * 2.4px); }
  .scalebar { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 5px; font-family: var(--serif); font-size: .72rem; color: var(--ink); }
  .scalebar i { display: block; height: 6px; margin-top: 3px; border: 1px solid var(--ink); border-top: 0; background: repeating-linear-gradient(90deg, var(--ink) 0 25%, transparent 25% 50%); }
  .compass { color: var(--mapink); position: absolute; right: 56px; top: 8px; width: 54px; height: 54px; pointer-events: none; opacity: .9; }
  .rl { font-size: calc(var(--k, 1) * 22px); } .sl { font-size: calc(var(--k, 1) * 13px); }
  :root[data-theme="dark"] .node .lbl { fill: #F1E7D3; stroke: #2A2117; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node .lbl { fill: #F1E7D3; stroke: #2A2117; } }
  :root[data-theme="dark"] .node circle.dot { stroke: #F1E7D3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node circle.dot { stroke: #F1E7D3; } }
  .node.reach circle.dot { stroke: #F7D27A; stroke-width: 3; }
  .node.reach .ring { display: block; }
  .node .ring { display: none; fill: none; stroke: #F7D27A; stroke-width: 1.5; stroke-dasharray: 3 2; }
  .node:focus-visible { outline: none; }
  .node:focus-visible circle.dot { stroke: #F7D27A; stroke-width: 4; }
  .army { cursor: pointer; }
  .army.sel rect.bg { stroke: #F7D27A; stroke-width: 3; }
  .army text { font-family: var(--sans); font-weight: 700; pointer-events: none; }
  /* painel */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stats div { background: var(--panel-2); border-radius: 8px; padding: 4px; }
  .stats b { display: block; font-family: var(--serif); font-size: 1.15rem; }
  .stats span { font-size: .72rem; color: var(--muted); }
  .armies { display: flex; flex-direction: column; gap: 4px; }
  .armies button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 8px; display: flex; justify-content: space-between; gap: 6px; font-size: .84rem; }
  .armies button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .armies button.done { opacity: .6; }
  .leg { display: grid; grid-template-columns: 9.4em 1fr 7.4em; white-space: nowrap; gap: 6px; align-items: center; font-size: .8rem; padding: 2px 0; }
  .leg .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .leg .bar i { display: block; height: 100%; background: var(--accent); }
  .leg b { font-family: var(--serif); }
  .leg label { display: flex; align-items: center; gap: 4px; }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .acts .btn { flex: 1 1 46%; font-size: .82rem; }
  .moves { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .moves .btn { font-size: .78rem; }
  .muted { color: var(--muted); font-size: .8rem; }
  .cp { font-weight: 700; color: var(--accent); }
  .logbox ol { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; font-size: .8rem; line-height: 1.4; }
  .logbox li { padding: 2px 0; border-bottom: 1px dotted var(--line); }
  .logbox li.h { font-weight: 700; color: var(--accent); font-family: var(--serif); border-bottom: 0; padding-top: 6px; }
  .logbox li.q { font-style: italic; color: var(--muted); }
  /* dados */
  .dice { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; align-items: center; }
  .die { width: 28px; height: 28px; border-radius: 6px; background: #FBF7EE; border: 1px solid #8A7556; box-shadow: inset 0 -2px 0 #0002, 0 1px 2px #0004; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 3px; }
  .die.red { background: #8E1B1B; border-color: #5A0F0F; }
  .die.red i { background: #FBF0D8; }
  .die.grn { background: #3E6B3A; border-color: #24401F; }
  .die.grn i { background: #F3EBD3; }
  .die.pur { background: #5B2D6E; border-color: #3A1B47; }
  .die.pur i { background: #F3EBD3; }
  .die i { width: 5px; height: 5px; border-radius: 50%; background: #2A1D14; place-self: center; visibility: hidden; }
  .die.hit { box-shadow: 0 0 0 2px var(--gold), 0 1px 2px #0004; }
  .die.miss { opacity: .55; }
  .die.roll { animation: roll .45s ease-out; }
  @keyframes roll { 0% { transform: rotate(-200deg) scale(.6); } 70% { transform: rotate(20deg) scale(1.1); } 100% { transform: none; } }
  /* diálogos */
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); width: min(760px, calc(100vw - 20px)); max-height: calc(100dvh - 30px); padding: 1rem 1.1rem; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-family: var(--serif); margin: 0 0 .5rem; }
  dialog h3 { margin: .9rem 0 .3rem; font-size: 1rem; font-family: var(--serif); }
  dialog p, dialog li { line-height: 1.5; font-size: .92rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .6rem; }
  .bt-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bt-sides > div { background: var(--panel-2); border-radius: 10px; padding: 8px; }
  .bt-sides h3 { margin: 0 0 4px; }
  .bt-sides ul { margin: 4px 0; padding-left: 1.1rem; font-size: .82rem; }
  .bt-val { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; }
  .bt-log { max-height: 200px; overflow: auto; font-size: .85rem; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .bt-log p { margin: .2rem 0; }
  .quote { font-family: var(--serif); font-style: italic; color: var(--muted); border-left: 3px solid var(--gold); padding-left: .7rem; margin: .5rem 0; }
  .ev-src { font-size: .78rem; color: var(--muted); }
  .overlay { position: fixed; inset: 0; z-index: 50; overflow: auto; background: radial-gradient(ellipse at 50% 25%, #5A3220, #170E09 75%); display: flex; align-items: flex-start; justify-content: center; padding: 16px; }
  .sheet { width: min(860px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.2rem 1.2rem; margin: auto 0; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .sheet h1 { font-family: var(--serif); margin: .2rem 0; font-size: clamp(1.7rem, 5vw, 2.5rem); letter-spacing: .02em; }
  .sheet .tag2 { margin: 0 0 .6rem; color: var(--muted); }
  .sheet .back { color: var(--accent); font-weight: 600; text-decoration: none; font-size: .9rem; }
  .hero { font-family: var(--serif); text-align: center; letter-spacing: .3em; color: var(--accent); font-size: .9rem; margin: .3rem 0; }
  .scen { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: .6rem 0; }
  .scen label { border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; background: var(--panel-2); display: flex; gap: .5rem; align-items: flex-start; cursor: pointer; }
  .scen label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .scen b { font-family: var(--serif); display: block; }
  .scen small { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .5rem .8rem; }
  .field { display: flex; flex-direction: column; gap: .2rem; font-size: .85rem; font-weight: 600; }
  .field select, .field input { font-weight: 400; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: .4rem .5rem; min-height: 38px; }
  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; height: auto; min-height: 100dvh; }
    .mapwrap { flex: none; height: min(70dvh, 560px); }
    .side { overflow: visible; }
  }
  @media (max-width: 560px) {
    .topbar .info { flex-basis: 100%; }
    .mapwrap { overflow: visible; margin-bottom: 92px; height: 62dvh; }
    #map { border-radius: 10px; }
    .compass { width: 40px; height: 40px; }
    .legend { top: calc(100% + 8px); bottom: auto; left: -4px; max-width: calc(100% + 8px); font-size: .68rem; }
    .bt-sides { grid-template-columns: 1fr; }
    .acts .btn { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .die.roll { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <main class="stage">
    <div class="topbar">
      <div class="info"><span class="date" id="date"></span><span id="scenName"></span></div>
      <button type="button" class="btn sm" id="bRules" data-t="rules"></button>
      <button type="button" class="btn sm" id="bTheme"></button>
      <button type="button" class="btn sm" id="bSpeed"></button>
      <button type="button" class="btn sm" id="bMenu" data-t="menu"></button>
    </div>
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="group" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="zoom"><button type="button" class="btn sm" id="zIn" aria-label="+">+</button><button type="button" class="btn sm" id="zOut" aria-label="−">−</button><button type="button" class="btn sm" id="zFit" aria-label="⤢">⤢</button></div>
      <div class="legend" id="legend"></div>
      <div class="scalebar" id="scalebar" aria-hidden="true"><span id="scaleTxt">C milia passuum</span><i id="scaleBar"></i></div>
      <svg class="compass" viewBox="-30 -30 60 60" aria-hidden="true"><circle r="22" fill="none" stroke="currentColor" stroke-width="1"/><circle r="17" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="1.5 1.5"/><path d="M0-27L4 0L0 27L-4 0Z" fill="#8E1B1B"/><path d="M-27 0L0-4L27 0L0 4Z" fill="currentColor"/><path d="M0-27L4 0L-4 0Z" fill="var(--land)" opacity=".5"/><text y="-23" text-anchor="middle" font-family="Georgia" font-size="7" fill="currentColor" dy="-6">S</text><text y="31" text-anchor="middle" font-family="Georgia" font-size="7" fill="currentColor" dy="2">M</text><text x="31" y="2.5" text-anchor="middle" font-family="Georgia" font-size="6.5" fill="currentColor">Or</text><text x="-31" y="2.5" text-anchor="middle" font-family="Georgia" font-size="6.5" fill="currentColor">Oc</text></svg>
    </div>
  </main>
  <aside class="side">
    <section class="box"><div class="stats"><div><b id="sGloria">0</b><span data-t="gloria"></span></div><div><b id="sAuct">0</b><span data-t="auctoritas"></span></div><div><b id="sMil">0</b><span data-t="soldiers"></span></div></div></section>
    <section class="box"><h2 data-t="yourArmies"></h2><div class="armies" id="armyList"></div></section>
    <section class="box" id="selBox"></section>
    <section class="box"><h2 data-t="diceT"></h2><div class="dice" id="diceTray" aria-live="polite"></div><p class="muted" id="diceTxt"></p>
      <div class="row"><button type="button" class="btn pri" id="bEnd" data-t="endSeason"></button></div></section>
    <section class="box logbox"><h2 data-t="logT"></h2><ol id="log"></ol></section>
  </aside>
</div>

<section class="overlay" id="ovSetup" aria-labelledby="ttl">
  <div class="sheet">
    <a class="back" id="backLink" href="projects.html" data-t="back"></a>
    <p class="hero">ROMA · CARTHAGO</p>
    <h1 id="ttl" data-t="title"></h1>
    <p class="tag2" data-t="tagline"></p>
    <p class="quote" data-t="openQuote"></p>
    <div class="scen" id="scenList" role="radiogroup"></div>
    <div class="grid">
      <label class="field"><span data-t="difficulty"></span><select id="sDiff"><option value="0" data-t="d0"></option><option value="1" data-t="d1"></option><option value="2" data-t="d2"></option></select></label>
      <label class="field"><span data-t="lang"></span><select id="sLang"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
      <label class="field"><span data-t="seed"></span><input id="sSeed" inputmode="numeric" autocomplete="off"></label>
    </div>
    <div class="row">
      <button type="button" class="btn pri" id="bPlay" data-t="play"></button>
      <button type="button" class="btn" id="bResume" data-t="resume" hidden></button>
      <button type="button" class="btn" id="bRules2" data-t="rules"></button>
      <button type="button" class="btn" id="bTheme2"></button>
    </div>
  </div>
</section>

<dialog id="dRules" aria-labelledby="rulesH"><h2 id="rulesH" data-t="rules"></h2><div id="rulesBody"></div><div class="row"><button type="button" class="btn pri" id="bRulesClose" data-t="close"></button></div></dialog>
<dialog id="dEvent" aria-labelledby="evH"><h2 id="evH"></h2><div id="evBody"></div><div class="row" id="evBtns"></div></dialog>
<dialog id="dBattle" aria-labelledby="btH"><h2 id="btH"></h2><div id="btBody"></div><div class="dice" id="btDice"></div><div class="bt-log" id="btLog" aria-live="polite"></div><div class="row" id="btBtns"></div></dialog>

    deceitP: ['Cavaleiros númidas chegam até a paliçada, lançam dardos e fogem. Os oficiais querem sair e persegui-los antes que escapem. Fora do acampamento, o exército pode cair numa emboscada.', 'Numidian horsemen ride up to the palisade, throw javelins and flee. The officers want to march out and pursue them before they escape. Outside the camp the army may run into an ambush.', 'Cavalieri numidi arrivano alla palizzata, lanciano giavellotti e fuggono. Gli ufficiali vogliono uscire e inseguirli prima che scappino. Fuori dal campo l’esercito può cadere in un’imboscata.', 'Jinetes númidas llegan hasta la empalizada, lanzan dardos y huyen. Los oficiales quieren salir a perseguirlos antes de que escapen. Fuera del campamento, el ejército puede caer en una emboscada.'],

    lostAuct_car: ['O Apoio de Cartago acabou: o conselho para de mandar ajuda e chama Aníbal de volta.', 'Carthage’s support is gone: the council stops sending help and recalls Hannibal.', 'L’Appoggio di Cartagine è finito: il consiglio smette di mandare aiuti e richiama Annibale.', 'El Apoyo de Cartago se acabó: el consejo deja de enviar ayuda y llama a Aníbal de vuelta.'],

    r0_car: ['General esquecido', 'Forgotten general', 'Generale dimenticato', 'General olvidado'], r1_car: ['General de Cartago', 'General of Carthage', 'Generale di Cartagine', 'General de Cartago'], r2_car: ['Flagelo de Roma', 'Scourge of Rome', 'Flagello di Roma', 'Azote de Roma'], r3_car: ['Pai da estratégia', 'Father of strategy', 'Padre della strategia', 'Padre de la estrategia'],
    hist_hannibal: ['Na história, Aníbal venceu no Ticino e no Trébia (218), no Trasimeno (217) e em Canas (216), mas não atacou Roma. Ficou na Itália até ser chamado de volta em 203.', 'In history Hannibal won at the Ticinus and the Trebia (218), Trasimene (217) and Cannae (216), but did not attack Rome. He stayed in Italy until he was recalled in 203.', 'Nella storia Annibale vinse al Ticino e alla Trebbia (218), al Trasimeno (217) e a Canne (216), ma non attaccò Roma. Restò in Italia finché fu richiamato nel 203.', 'En la historia, Aníbal venció en el Tesino y el Trebia (218), el Trasimeno (217) y Cannas (216), pero no atacó Roma. Se quedó en Italia hasta que lo llamaron de vuelta en 203.'],
    hist_scipio: ['Na história, Cipião tomou Cartago Nova (209), venceu em Bécula (208) e em Ilipa (206) e derrotou Aníbal em Zama (202), onde caíram mais de 1.500 romanos e 20.000 cartagineses (Políbio XV.14).', 'In history Scipio took New Carthage (209), won at Baecula (208) and Ilipa (206) and defeated Hannibal at Zama (202), where more than 1,500 Romans and 20,000 Carthaginians fell (Polybius XV.14).', 'Nella storia Scipione prese Cartagine Nuova (209), vinse a Becula (208) e a Ilipa (206) e sconfisse Annibale a Zama (202), dove caddero più di 1.500 Romani e 20.000 Cartaginesi (Polibio XV.14).', 'En la historia, Escipión tomó Cartago Nova (209), venció en Baecula (208) y en Ilipa (206) y derrotó a Aníbal en Zama (202), donde cayeron más de 1.500 romanos y 20.000 cartagineses (Polibio XV.14).'],
    hist_carthago: ['Na história, Cartago caiu em 146 a.C., depois de três anos de cerco, e foi destruída.', 'In history Carthage fell in 146 BC after a three-year siege and was destroyed.', 'Nella storia Cartagine cadde nel 146 a.C., dopo tre anni di assedio, e fu distrutta.', 'En la historia, Cartago cayó en 146 a. C., tras tres años de asedio, y fue destruida.'],

  // eventos históricos: título e texto; a fonte é dada à parte
  const EV = {
    ebro: [['Aníbal atravessa o Ebro', 'Aníbal cruzou o Ebro com cerca de 90.000 infantes e 12.000 cavaleiros. Deixa Hanão ao norte do rio com 10.000 infantes e 1.000 cavaleiros; segue para o Ródano com 50.000 infantes, cerca de 9.000 cavaleiros e 37 elefantes. Na Hispânia fica Asdrúbal, com 21 elefantes.'], ['Hannibal crosses the Ebro', 'Hannibal has crossed the Ebro with about 90,000 foot and 12,000 horse. He leaves Hanno north of the river with 10,000 foot and 1,000 horse, and goes on towards the Rhône with 50,000 foot, about 9,000 horse and 37 elephants. Hasdrubal stays in Spain with 21 elephants.'], ['Annibale attraversa l’Ebro', 'Annibale ha passato l’Ebro con circa 90.000 fanti e 12.000 cavalieri. Lascia Annone a nord del fiume con 10.000 fanti e 1.000 cavalieri e prosegue verso il Rodano con 50.000 fanti, circa 9.000 cavalieri e 37 elefanti. In Spagna resta Asdrubale, con 21 elefanti.'], ['Aníbal cruza el Ebro', 'Aníbal ha cruzado el Ebro con unos 90.000 infantes y 12.000 jinetes. Deja a Hanón al norte del río con 10.000 infantes y 1.000 jinetes y sigue hacia el Ródano con 50.000 infantes, unos 9.000 jinetes y 37 elefantes. En Hispania queda Asdrúbal, con 21 elefantes.'], 'Políbio III.33, III.35, III.42'],
    scipio218: [['O cônsul em Massília', 'O cônsul Públio Cornélio Cipião desembarca perto de Massília para barrar a passagem. Para atravessar o Ródano, os cartagineses precisam de barcos e de grandes jangadas cobertas de terra, onde os elefantes entram atrás de duas fêmeas.'], ['The consul at Massilia', 'The consul Publius Cornelius Scipio lands near Massilia to block the way. To cross the Rhône the Carthaginians need boats and great rafts covered with earth, onto which the elephants are led behind two females.'], ['Il console a Massilia', 'Il console Publio Cornelio Scipione sbarca vicino a Massilia per sbarrare il passaggio. Per attraversare il Rodano i Cartaginesi hanno bisogno di barche e di grandi zattere coperte di terra, su cui gli elefanti salgono dietro a due femmine.'], ['El cónsul en Massilia', 'El cónsul Publio Cornelio Escipión desembarca cerca de Massilia para cerrar el paso. Para cruzar el Ródano, los cartagineses necesitan barcas y grandes balsas cubiertas de tierra, a las que los elefantes suben detrás de dos hembras.'], 'Políbio III.41–46'],
    trebia: [['O Trébia', 'O cônsul Tibério Semprônio traz o seu exército da Sicília e se junta ao colega perto de Placência: são cerca de 16.000 romanos e 20.000 aliados. Os gauleses do vale do Pó passam para o lado de Aníbal. Na história, Magão esperou escondido com 1.000 cavaleiros e 1.000 infantes; depois da batalha, todos os elefantes morreram, menos um.'], ['The Trebia', 'The consul Tiberius Sempronius brings his army from Sicily and joins his colleague near Placentia: about 16,000 Romans and 20,000 allies. The Gauls of the Po valley go over to Hannibal. In history Mago lay hidden with 1,000 horse and 1,000 foot; after the battle all the elephants died but one.'], ['La Trebbia', 'Il console Tiberio Sempronio porta il suo esercito dalla Sicilia e si unisce al collega vicino a Piacenza: circa 16.000 Romani e 20.000 alleati. I Galli della valle del Po passano dalla parte di Annibale. Nella storia Magone attese nascosto con 1.000 cavalieri e 1.000 fanti; dopo la battaglia morirono tutti gli elefanti tranne uno.'], ['El Trebia', 'El cónsul Tiberio Sempronio trae su ejército de Sicilia y se une a su colega cerca de Placentia: unos 16.000 romanos y 20.000 aliados. Los galos del valle del Po se pasan al lado de Aníbal. En la historia, Magón esperó escondido con 1.000 jinetes y 1.000 infantes; tras la batalla murieron todos los elefantes menos uno.'], 'Políbio III.71–74'],
    flaminius: [['Flamínio em Arrécio', 'O cônsul Caio Flamínio espera em Arrécio; Servílio guarda Arímino. Na história, Aníbal atravessou os pântanos, perdeu um olho por uma inflamação e armou uma emboscada junto ao lago Trasimeno: caíram cerca de 15.000 romanos, entre eles Flamínio, e Aníbal perdeu cerca de 1.500 homens, a maioria celtas.'], ['Flaminius at Arretium', 'The consul Gaius Flaminius waits at Arretium; Servilius guards Ariminum. In history Hannibal crossed the marshes, lost an eye to an inflammation and laid an ambush by Lake Trasimene: about 15,000 Romans fell, Flaminius among them, and Hannibal lost about 1,500 men, most of them Celts.'], ['Flaminio ad Arezzo', 'Il console Gaio Flaminio attende ad Arezzo; Servilio guarda Rimini. Nella storia Annibale attraversò le paludi, perse un occhio per un’infiammazione e tese un’imboscata presso il lago Trasimeno: caddero circa 15.000 Romani, tra cui Flaminio, e Annibale perse circa 1.500 uomini, quasi tutti Celti.'], ['Flaminio en Arretium', 'El cónsul Cayo Flaminio espera en Arretium; Servilio guarda Ariminum. En la historia, Aníbal cruzó los pantanos, perdió un ojo por una inflamación y tendió una emboscada junto al lago Trasimeno: cayeron unos 15.000 romanos, entre ellos Flaminio, y Aníbal perdió unos 1.500 hombres, la mayoría celtas.'], 'Políbio III.79–85'],
    fabius: [['Fábio, ditador', 'Roma nomeia Quinto Fábio Máximo ditador. Ele decide não se expor a riscos nem aceitar batalha: segue Aníbal de perto, pelas colinas, contando com os recursos inesgotáveis de Roma em víveres e em homens.'], ['Fabius, dictator', 'Rome appoints Quintus Fabius Maximus dictator. He resolves not to expose himself to any risk or to venture on a battle: he shadows Hannibal along the hills, relying on Rome’s inexhaustible supplies of provisions and men.'], ['Fabio, dittatore', 'Roma nomina dittatore Quinto Fabio Massimo. Decide di non esporsi a rischi né accettare battaglia: segue Annibale da vicino lungo le colline, contando sulle risorse inesauribili di Roma in viveri e uomini.'], ['Fabio, dictador', 'Roma nombra dictador a Quinto Fabio Máximo. Decide no exponerse a riesgos ni aceptar batalla: sigue a Aníbal de cerca por las colinas, contando con los recursos inagotables de Roma en víveres y hombres.'], 'Políbio III.87–90'],
    cannae: [['As oito legiões', 'O Senado decide pôr em campo oito legiões, de cerca de 5.000 homens cada, com os aliados: ao todo, cerca de 80.000 infantes e pouco mais de 6.000 cavaleiros, sob Varrão e Paulo. Aníbal tem cerca de 10.000 cavaleiros e pouco mais de 40.000 infantes. Na história, caíram cerca de 70.000 romanos; Aníbal perdeu cerca de 4.000 celtas, 1.500 iberos e africanos e 200 cavaleiros.'], ['The eight legions', 'The Senate decides to put eight legions in the field, of about 5,000 men each, with the allies: in all about 80,000 foot and rather more than 6,000 horse, under Varro and Paullus. Hannibal has about 10,000 horse and not much more than 40,000 foot. In history about 70,000 Romans fell; Hannibal lost about 4,000 Celts, 1,500 Spaniards and Africans and 200 horse.'], ['Le otto legioni', 'Il Senato decide di mettere in campo otto legioni, di circa 5.000 uomini ciascuna, con gli alleati: in tutto circa 80.000 fanti e poco più di 6.000 cavalieri, sotto Varrone e Paolo. Annibale ha circa 10.000 cavalieri e poco più di 40.000 fanti. Nella storia caddero circa 70.000 Romani; Annibale perse circa 4.000 Celti, 1.500 Iberi e Africani e 200 cavalieri.'], ['Las ocho legiones', 'El Senado decide poner en campaña ocho legiones, de unos 5.000 hombres cada una, con los aliados: en total unos 80.000 infantes y algo más de 6.000 jinetes, bajo Varrón y Paulo. Aníbal tiene unos 10.000 jinetes y poco más de 40.000 infantes. En la historia cayeron unos 70.000 romanos; Aníbal perdió unos 4.000 celtas, 1.500 iberos y africanos y 200 jinetes.'], 'Políbio III.107, III.113–117'],
    capua: [['Cápua', 'Depois de Canas, Cápua manda embaixadores a Aníbal e faz a paz com ele. Se o exército de Canas foi desfeito, Cápua passa para o seu lado.'], ['Capua', 'After Cannae, Capua sends envoys to Hannibal and makes peace with him. If the army of Cannae was broken, Capua comes over to your side.'], ['Capua', 'Dopo Canne, Capua manda ambasciatori ad Annibale e fa la pace con lui. Se l’esercito di Canne è stato disfatto, Capua passa dalla tua parte.'], ['Capua', 'Tras Cannas, Capua envía embajadores a Aníbal y hace la paz con él. Si el ejército de Cannas fue deshecho, Capua se pasa a tu lado.'], 'Lívio XXIII.7'],
    scipio210: [['Cipião na Hispânia', 'O jovem Públio Cornélio Cipião assume o comando na Hispânia. Três exércitos cartagineses estão na península; Cartago Nova, a base deles, tem pouca guarnição.'], ['Scipio in Spain', 'The young Publius Cornelius Scipio takes command in Spain. Three Carthaginian armies are in the peninsula; New Carthage, their base, is lightly held.'], ['Scipione in Spagna', 'Il giovane Publio Cornelio Scipione assume il comando in Spagna. Tre eserciti cartaginesi sono nella penisola; Cartagine Nuova, la loro base, ha poca guarnigione.'], ['Escipión en Hispania', 'El joven Publio Cornelio Escipión asume el mando en Hispania. Tres ejércitos cartagineses están en la península; Cartago Nova, su base, tiene poca guarnición.'], 'Políbio X.8'],
    cnova: [['Cartago Nova', 'Na cidadela há só cerca de 1.000 soldados treinados. A laguna atrás da cidade é rasa e quase toda vadeável, e a água costuma baixar ao fim do dia. Cipião marcha com cerca de 25.000 infantes e 2.500 cavaleiros.'], ['New Carthage', 'The citadel holds only about a thousand trained soldiers. The lagoon behind the city is shallow and mostly fordable, and the water usually recedes towards evening. Scipio marches with about 25,000 foot and 2,500 horse.'], ['Cartagine Nuova', 'Nella cittadella ci sono solo circa 1.000 soldati addestrati. La laguna dietro la città è bassa e in gran parte guadabile, e l’acqua di solito si ritira verso sera. Scipione marcia con circa 25.000 fanti e 2.500 cavalieri.'], ['Cartago Nova', 'En la ciudadela solo hay unos 1.000 soldados entrenados. La laguna detrás de la ciudad es poco profunda y casi toda vadeable, y el agua suele bajar al atardecer. Escipión marcha con unos 25.000 infantes y 2.500 jinetes.'], 'Políbio X.8–15'],
    baecula: [['Bécula', 'Asdrúbal Barca se instala numa colina perto de Bécula. Na história, depois da batalha, Cipião recolheu cerca de 10.000 infantes e mais de 2.000 cavaleiros prisioneiros; Asdrúbal escapou com parte do exército.'], ['Baecula', 'Hasdrubal Barca takes position on a hill near Baecula. In history, after the battle, Scipio collected about 10,000 foot and more than 2,000 horse as prisoners; Hasdrubal escaped with part of his army.'], ['Becula', 'Asdrubale Barca si attesta su una collina vicino a Becula. Nella storia, dopo la battaglia, Scipione raccolse circa 10.000 fanti e più di 2.000 cavalieri prigionieri; Asdrubale fuggì con parte dell’esercito.'], ['Baecula', 'Asdrúbal Barca se instala en una colina cerca de Baecula. En la historia, tras la batalla, Escipión reunió unos 10.000 infantes y más de 2.000 jinetes prisioneros; Asdrúbal escapó con parte del ejército.'], 'Políbio X.38–40'],
    metaurus: [['O Metauro', 'Se Asdrúbal Barca ainda tem exército, ele parte para a Itália para se juntar ao irmão (−1 Auctoritas, por tê-lo deixado escapar). Na história, foi vencido no Metauro: caiu lutando, com pelo menos 10.000 cartagineses e gauleses; os romanos perderam 2.000.'], ['The Metaurus', 'If Hasdrubal Barca still has an army, he leaves for Italy to join his brother (−1 Auctoritas for letting him slip away). In history he was defeated at the Metaurus: he fell fighting, with not fewer than 10,000 Carthaginians and Gauls; the Romans lost 2,000.'], ['Il Metauro', 'Se Asdrubale Barca ha ancora un esercito, parte per l’Italia per unirsi al fratello (−1 Auctoritas, per averlo lasciato fuggire). Nella storia fu vinto al Metauro: cadde combattendo, con almeno 10.000 Cartaginesi e Galli; i Romani persero 2.000 uomini.'], ['El Metauro', 'Si Asdrúbal Barca aún tiene ejército, parte hacia Italia para unirse a su hermano (−1 Auctoritas, por dejarlo escapar). En la historia fue vencido en el Metauro: cayó luchando, con no menos de 10.000 cartagineses y galos; los romanos perdieron 2.000.'], 'Políbio XI.1–3'],
    ilipa: [['Ilipa', 'Asdrúbal, filho de Giscão, e Magão juntam forças em Ilipa: cerca de 70.000 infantes, 4.000 cavaleiros e 32 elefantes. Na história, Cipião tinha cerca de 45.000 infantes e 3.000 cavaleiros.'], ['Ilipa', 'Hasdrubal son of Gisco and Mago join forces at Ilipa: about 70,000 foot, 4,000 horse and 32 elephants. In history Scipio had about 45,000 foot and 3,000 horse.'], ['Ilipa', 'Asdrubale figlio di Gisgone e Magone uniscono le forze a Ilipa: circa 70.000 fanti, 4.000 cavalieri e 32 elefanti. Nella storia Scipione aveva circa 45.000 fanti e 3.000 cavalieri.'], ['Ilipa', 'Asdrúbal, hijo de Giscón, y Magón juntan fuerzas en Ilipa: unos 70.000 infantes, 4.000 jinetes y 32 elefantes. En la historia, Escipión tenía unos 45.000 infantes y 3.000 jinetes.'], 'Políbio XI.20'],
    sicily: [['Rumo à África', 'Cipião prepara na Sicília a invasão da África. Lívio diz que cada legião tinha 6.200 homens e 300 cavaleiros, mas não sabe quantos embarcaram: uns falam em 10.000 infantes e 2.200 cavaleiros, outros em 16.000 e 1.600, outros no dobro. Eram 40 navios de guerra e 400 transportes. A partir de agora, os reforços chegam a Lilibeu.'], ['Towards Africa', 'In Sicily Scipio prepares the invasion of Africa. Livy says each legion had 6,200 men and 300 horse, but does not know how many sailed: some say 10,000 foot and 2,200 horse, others 16,000 and 1,600, others twice as many. There were 40 warships and 400 transports. From now on reinforcements arrive at Lilybaeum.'], ['Verso l’Africa', 'In Sicilia Scipione prepara l’invasione dell’Africa. Livio dice che ogni legione aveva 6.200 uomini e 300 cavalieri, ma non sa quanti si imbarcarono: alcuni parlano di 10.000 fanti e 2.200 cavalieri, altri di 16.000 e 1.600, altri del doppio. Erano 40 navi da guerra e 400 trasporti. D’ora in poi i rinforzi arrivano a Lilibeo.'], ['Rumbo a África', 'En Sicilia, Escipión prepara la invasión de África. Livio dice que cada legión tenía 6.200 hombres y 300 jinetes, pero no sabe cuántos embarcaron: unos hablan de 10.000 infantes y 2.200 jinetes, otros de 16.000 y 1.600, otros del doble. Eran 40 naves de guerra y 400 transportes. Desde ahora los refuerzos llegan a Lilibeo.'], 'Lívio XXIX.24–26'],
    syphax: [['Sífax e os acampamentos', 'O rei númida Sífax passa para o lado de Cartago. Asdrúbal acampa com 30.000 infantes e 3.000 cavaleiros; Sífax, ao lado, com cerca de 10.000 cavaleiros e 50.000 infantes. Na história, Cipião incendiou de noite os dois acampamentos, e depois venceu nos Campos Magnos.'], ['Syphax and the camps', 'The Numidian king Syphax goes over to Carthage. Hasdrubal camps with 30,000 foot and 3,000 horse; Syphax, nearby, with about 10,000 horse and 50,000 foot. In history Scipio set fire to both camps by night, and then won at the Great Plains.'], ['Siface e gli accampamenti', 'Il re numida Siface passa dalla parte di Cartagine. Asdrubale si accampa con 30.000 fanti e 3.000 cavalieri; Siface, accanto, con circa 10.000 cavalieri e 50.000 fanti. Nella storia Scipione incendiò di notte i due accampamenti e poi vinse ai Campi Magni.'], ['Sífax y los campamentos', 'El rey númida Sífax se pasa al lado de Cartago. Asdrúbal acampa con 30.000 infantes y 3.000 jinetes; Sífax, al lado, con unos 10.000 jinetes y 50.000 infantes. En la historia, Escipión incendió de noche ambos campamentos y después venció en los Grandes Llanos.'], 'Políbio XIV.1–8'],
    recall: [['Aníbal volta à África', 'No décimo sexto ano da guerra, Cartago chama Aníbal de volta da Itália. Ele volta para a África com os seus veteranos.'], ['Hannibal returns to Africa', 'In the sixteenth year of the war Carthage recalls Hannibal from Italy. He returns to Africa with his veterans.'], ['Annibale torna in Africa', 'Nel sedicesimo anno della guerra Cartagine richiama Annibale dall’Italia. Torna in Africa con i suoi veterani.'], ['Aníbal vuelve a África', 'En el decimosexto año de la guerra, Cartago llama a Aníbal de vuelta de Italia. Vuelve a África con sus veteranos.'], 'Lívio XXX.1, XXX.19–20'],
    masinissa: [['Masinissa e Zama', 'Masinissa chega com 6.000 infantes e 4.000 cavaleiros. Aníbal tem mais de 80 elefantes e cerca de 12.000 mercenários.'], ['Masinissa and Zama', 'Masinissa arrives with 6,000 foot and 4,000 horse. Hannibal has over eighty elephants and about 12,000 mercenaries.'], ['Massinissa e Zama', 'Massinissa arriva con 6.000 fanti e 4.000 cavalieri. Annibale ha più di 80 elefanti e circa 12.000 mercenari.'], ['Masinisa y Zama', 'Masinisa llega con 6.000 infantes y 4.000 jinetes. Aníbal tiene más de 80 elefantes y unos 12.000 mercenarios.'], 'Políbio XV.5, XV.11'],
    delenda: [['Carthago delenda est', 'Útica se entrega a Roma. Os cônsules chegam com 50 quinquerremes e 100 hemíolias, 80.000 infantes e cerca de 4.000 cavaleiros. Cartago entregou armas para 200.000 homens e 2.000 catapultas, mas decide resistir; fora da cidade, Asdrúbal tem 20.000 homens. Pelo porto, a cidade continua a receber víveres.'], ['Carthago delenda est', 'Utica surrenders to Rome. The consuls arrive with 50 quinqueremes and 100 hemioliae, 80,000 foot and about 4,000 horse. Carthage has handed over armour for 200,000 men and 2,000 catapults, but decides to resist; outside the city Hasdrubal has 20,000 men. Through the harbour the city keeps receiving supplies.'], ['Carthago delenda est', 'Utica si arrende a Roma. I consoli arrivano con 50 quinqueremi e 100 emiolie, 80.000 fanti e circa 4.000 cavalieri. Cartagine ha consegnato armi per 200.000 uomini e 2.000 catapulte, ma decide di resistere; fuori della città Asdrubale ha 20.000 uomini. Dal porto la città continua a ricevere viveri.'], ['Carthago delenda est', 'Útica se rinde a Roma. Los cónsules llegan con 50 quinquerremes y 100 hemiolias, 80.000 infantes y unos 4.000 jinetes. Cartago entregó armas para 200.000 hombres y 2.000 catapultas, pero decide resistir; fuera de la ciudad, Asdrúbal tiene 20.000 hombres. Por el puerto, la ciudad sigue recibiendo víveres.'], 'Apiano, Guerras Púnicas 75, 80'],
    aemilianus: [['Cipião Emiliano', 'Públio Cornélio Cipião Emiliano chega à África. Ele manda construir um molhe para fechar a entrada do porto; os cartagineses respondem abrindo uma nova saída e lançando ao mar cinquenta trirremes. +2 Auctoritas.'], ['Scipio Aemilianus', 'Publius Cornelius Scipio Aemilianus arrives in Africa. He has a mole built to close the harbour mouth; the Carthaginians reply by cutting a new entrance and putting fifty triremes to sea. +2 Auctoritas.'], ['Scipione Emiliano', 'Publio Cornelio Scipione Emiliano arriva in Africa. Fa costruire un molo per chiudere l’ingresso del porto; i Cartaginesi rispondono aprendo una nuova uscita e mettendo in mare cinquanta triremi. +2 Auctoritas.'], ['Escipión Emiliano', 'Publio Cornelio Escipión Emiliano llega a África. Manda construir un muelle para cerrar la entrada del puerto; los cartagineses responden abriendo una nueva salida y echando al mar cincuenta trirremes. +2 Auctoritas.'], 'Apiano, Guerras Púnicas 121'],

  const RULES = {
    pt: `<p>Você comanda um dos lados: Cartago no cenário de Aníbal, Roma nos outros dois. O ano tem três estações de campanha (primavera, verão e outono) e um inverno nos quartéis. Os inimigos agem pelas regras do jogo e pelos dados, seguindo o calendário dos relatos antigos.</p>
<h3>Estação</h3><ol><li><b>Fortuna:</b> um dado decide chuvas, comboios de trigo, batedores ou bons auspícios.</li><li><b>Comando:</b> cada exército rola um dado. Aníbal recebe 3 + metade do dado (arredondada para cima); Cipião, 2 + metade; os outros comandantes, 1 + metade.</li><li><b>Ordens:</b> marchar custa o número da estrada (montanhas custam 2 ou 3). O Ródano só se atravessa depois de reunir barcos e jangadas numa das margens. Os Alpes custam muitos homens e parte da cavalaria. Navegar exige portos e pode trazer tempestades e, no cenário de Aníbal, a frota romana. No cenário de Cipião, a África só pode ser invadida a partir de 205 a.C. Entrar onde há um exército inimigo em campo abre a batalha.</li><li><b>Inimigos:</b> exércitos de campo atacam quando se acham mais fortes; guarnições ficam atrás das muralhas; Fábio evita a batalha e segue o inimigo de perto; a cavalaria númida provoca os acampamentos.</li><li><b>Trigo:</b> no fim da estação, quem está em terra amiga, aliada ou submetida recebe trigo; fora dela perde 1. Com 0, os homens desertam ou morrem de fome.</li></ol>
<h3>Unidades</h3><p>Cada unidade tem 10 companhias e um número de homens. O exército de Aníbal começa com os 50.000 infantes, os cerca de 9.000 cavaleiros e os 37 elefantes que, segundo Políbio, seguiram do Ebro para o Ródano. O de Cipião começa com os 25.000 infantes e 2.500 cavaleiros com que ele marchou sobre Cartago Nova. A cavalaria conta em milhares.</p>
<h3>Batalha</h3><p>Cada 480 homens valem 1 ponto (veteranos 1,35; elite 1,7); mil cavaleiros valem 1,2 no exército de Aníbal e 0,8 no romano. Mil guerreiros inimigos valem 0,6 vezes a qualidade deles; mil legionários valem 2. Cada lado rola um dado para cada 7 pontos, mais os modificadores de terreno, muralhas, acampamento, cavalaria, elefantes e comandante. Tropas veteranas acertam com 4 a 6; novatos e a maioria dos inimigos, com 5 ou 6. Cada acerto tira 3 pontos. Depois de cada rodada, quem sofreu mais rola 2d6 de moral: acima do valor, foge e sofre a perseguição da cavalaria. São no máximo três rodadas. Se o exército do comandante foge, ele pode morrer: 1 em 12. Aníbal pode preparar uma emboscada (+3 dados na primeira rodada se o inimigo atacar), e a cavalaria dele, quando é bem superior, envolve os flancos (+2 dados).</p>
<h3>Cercos</h3><p>Inimigos dentro de muralhas precisam ser cercados: cada ordem de cerco soma um dado mais metade das unidades (e 2 com o comandante). Quando o cerco chega a 6 vezes a fortificação, a cidade cai. A cada estação os sitiados comem os víveres; sem víveres, rendem-se. Cartago, em 149, recebe víveres pelo porto: é preciso fechá-lo com um molhe (3 pontos), obra que só Cipião Emiliano consegue fazer, a partir de 147.</p>
<h3>Inverno</h3><p>Exércitos em território amigo recuperam companhias; fora dele, perdem. Unidades que venceram podem virar veteranas. Gaste Auctoritas (ou o Apoio de Cartago) para completar unidades ou receber reforços. Regiões submetidas podem se revoltar. Se o apoio cair abaixo de −3, o comandante é chamado de volta e a campanha termina. No primeiro inverno na Itália, os elefantes de Aníbal morrem, menos um.</p>
<h3>Vitória</h3><p>Glória vem de batalhas, cidades tomadas, regiões submetidas e façanhas (os Alpes, o desembarque na África). Cada cenário tem um objetivo histórico. O comandante morto ou sem exércitos encerra o jogo.</p>
<h3>Fontes e realismo</h3><p>Datas, chefes, exércitos e números vêm de Políbio, <i>Histórias</i> (tradução de W. R. Paton), de Tito Lívio, <i>Ab Urbe Condita</i> (tradução de Canon Roberts), e de Apiano, <i>Guerras Púnicas</i> (tradução de Horace White). Onde os autores divergem, o texto do evento diz. Lívio não sabe quantos soldados Cipião levou para a África e dá três versões. As forças inimigas do jogo seguem esses números, mas com quantidades ajustadas para a partida ser jogável. Algumas localizações são incertas: o passo dos Alpes usado por Aníbal, Baécula, Néferis, Zama e os Campos Magnos estão em posições aproximadas. O mapa usa o relevo, os rios, os lagos e os litorais do Natural Earth (domínio público); os litorais são os de hoje, e a costa de Cartago e de Útica, o delta do Ródano e a laguna de Cartago Nova eram diferentes. As regras de combate são um modelo de jogo, não uma reconstrução militar.</p>`,
    en: `<p>You command one side: Carthage in the Hannibal scenario, Rome in the other two. Each year has three campaign seasons (spring, summer and autumn) and a winter in quarters. The enemies act by the game rules and the dice, following the calendar of the ancient accounts.</p>
<h3>Season</h3><ol><li><b>Fortuna:</b> one die decides rain, grain convoys, scouts or good omens.</li><li><b>Command:</b> each army rolls a die. Hannibal gets 3 + half the die (rounded up); Scipio 2 + half; the other commanders 1 + half.</li><li><b>Orders:</b> marching costs the number on the road (mountains cost 2 or 3). The Rhône can only be crossed after gathering boats and rafts on one bank. The Alps cost many men and part of the cavalry. Sailing needs ports and may bring storms and, in the Hannibal scenario, the Roman fleet. In the Scipio scenario Africa can only be invaded from 205 BC on. Entering a place with an enemy army in the field starts a battle.</li><li><b>Enemies:</b> field armies attack when they think they are stronger; garrisons stay behind their walls; Fabius avoids battle and shadows the enemy; the Numidian cavalry taunts camps.</li><li><b>Grain:</b> at the end of the season, armies in friendly, allied or subdued land get grain; elsewhere they lose 1. At 0, men desert or starve.</li></ol>
<h3>Units</h3><p>Each unit has 10 companies and a number of men. Hannibal’s army starts with the 50,000 foot, about 9,000 horse and 37 elephants that, according to Polybius, went on from the Ebro to the Rhône. Scipio’s starts with the 25,000 foot and 2,500 horse with which he marched on New Carthage. Cavalry counts in thousands.</p>
<h3>Battle</h3><p>Every 480 men are worth 1 point (veterans 1.35, elite 1.7); a thousand horsemen are worth 1.2 in Hannibal’s army and 0.8 in the Roman one. A thousand enemy warriors are worth 0.6 times their quality; a thousand legionaries are worth 2. Each side rolls one die per 7 points, plus modifiers for terrain, walls, camp, cavalry, elephants and commander. Veteran troops hit on 4 to 6; raw troops and most enemies on 5 or 6. Each hit removes 3 points. After each round, the side that suffered more rolls 2d6 for morale: above the value, it flees and suffers the cavalry pursuit. There are at most three rounds. If the commander’s army flees he may die: 1 in 12. Hannibal can lay an ambush (+3 dice in the first round if the enemy attacks), and his cavalry, when clearly superior, envelops the flanks (+2 dice).</p>
<h3>Sieges</h3><p>Enemies behind walls must be besieged: each siege order adds a die plus half the units (and 2 with the commander). When the siege reaches 6 times the fortification, the city falls. Each season the besieged eat their food; without food, they surrender. Carthage, in 149, is supplied through its harbour: it must be closed with a mole (3 points), a work only Scipio Aemilianus can carry out, from 147 on.</p>
<h3>Winter</h3><p>Armies in friendly land recover companies; elsewhere they lose them. Victorious units may become veterans. Spend Auctoritas (or Carthage’s support) to bring units up to strength or receive reinforcements. Subdued regions may revolt. If support falls below −3 the commander is recalled and the campaign ends. In the first winter in Italy Hannibal’s elephants die, all but one.</p>
<h3>Victory</h3><p>Glory comes from battles, captured cities, subdued regions and feats (the Alps, the landing in Africa). Each scenario has a historical goal. The commander dead or without armies ends the game.</p>
<h3>Sources and realism</h3><p>Dates, leaders, armies and numbers come from Polybius, <i>Histories</i> (translated by W. R. Paton), Livy, <i>Ab Urbe Condita</i> (translated by Canon Roberts), and Appian, <i>Punic Wars</i> (translated by Horace White). Where the authors disagree, the event text says so. Livy does not know how many soldiers Scipio took to Africa and gives three versions. The enemy forces in the game follow these numbers, with amounts adjusted so the game stays playable. Some locations are uncertain: Hannibal’s Alpine pass, Baecula, Nepheris, Zama and the Great Plains are placed approximately. The map uses the relief, rivers, lakes and coastlines of Natural Earth (public domain); coasts are today’s, and the shores of Carthage and Utica, the Rhône delta and the lagoon of New Carthage were different. The combat rules are a game model, not a military reconstruction.</p>`,
    it: `<p>Comandi una delle parti: Cartagine nello scenario di Annibale, Roma negli altri due. Ogni anno ha tre stagioni di campagna (primavera, estate e autunno) e un inverno nei quartieri. I nemici agiscono secondo le regole del gioco e i dadi, seguendo il calendario dei racconti antichi.</p>
<h3>Stagione</h3><ol><li><b>Fortuna:</b> un dado decide piogge, convogli di grano, esploratori o buoni auspici.</li><li><b>Comando:</b> ogni esercito tira un dado. Annibale riceve 3 + metà del dado (arrotondata per eccesso); Scipione 2 + metà; gli altri comandanti 1 + metà.</li><li><b>Ordini:</b> marciare costa il numero della strada (le montagne costano 2 o 3). Il Rodano si attraversa solo dopo aver radunato barche e zattere su una riva. Le Alpi costano molti uomini e parte della cavalleria. Navigare richiede porti e può portare tempeste e, nello scenario di Annibale, la flotta romana. Nello scenario di Scipione l’Africa si può invadere solo dal 205 a.C. Entrare dove c’è un esercito nemico in campo apre la battaglia.</li><li><b>Nemici:</b> gli eserciti in campo attaccano quando si credono più forti; le guarnigioni restano dietro le mura; Fabio evita la battaglia e segue il nemico da vicino; la cavalleria numida provoca gli accampamenti.</li><li><b>Grano:</b> alla fine della stagione, chi è in terra amica, alleata o sottomessa riceve grano; altrove perde 1. A 0, gli uomini disertano o muoiono di fame.</li></ol>
<h3>Unità</h3><p>Ogni unità ha 10 compagnie e un numero di uomini. L’esercito di Annibale comincia con i 50.000 fanti, i circa 9.000 cavalieri e i 37 elefanti che, secondo Polibio, proseguirono dall’Ebro verso il Rodano. Quello di Scipione comincia con i 25.000 fanti e i 2.500 cavalieri con cui marciò su Cartagine Nuova. La cavalleria si conta in migliaia.</p>
<h3>Battaglia</h3><p>Ogni 480 uomini valgono 1 punto (veterani 1,35; élite 1,7); mille cavalieri valgono 1,2 nell’esercito di Annibale e 0,8 in quello romano. Mille guerrieri nemici valgono 0,6 volte la loro qualità; mille legionari valgono 2. Ogni parte tira un dado ogni 7 punti, più i modificatori di terreno, mura, campo, cavalleria, elefanti e comandante. Le truppe veterane colpiscono con 4–6; i novizi e la maggior parte dei nemici con 5 o 6. Ogni colpo toglie 3 punti. Dopo ogni turno, chi ha sofferto di più tira 2d6 per il morale: sopra il valore, fugge e subisce l’inseguimento della cavalleria. I turni sono al massimo tre. Se l’esercito del comandante fugge, lui può morire: 1 su 12. Annibale può preparare un’imboscata (+3 dadi nel primo turno se il nemico attacca), e la sua cavalleria, quando è nettamente superiore, avvolge i fianchi (+2 dadi).</p>
<h3>Assedi</h3><p>I nemici dietro le mura vanno assediati: ogni ordine d’assedio aggiunge un dado più metà delle unità (e 2 con il comandante). Quando l’assedio arriva a 6 volte la fortificazione, la città cade. A ogni stagione gli assediati consumano i viveri; senza viveri si arrendono. Cartagine, nel 149, riceve viveri dal porto: bisogna chiuderlo con un molo (3 punti), opera che solo Scipione Emiliano riesce a fare, dal 147.</p>
<h3>Inverno</h3><p>Gli eserciti in terra amica recuperano compagnie; altrove le perdono. Le unità vittoriose possono diventare veterane. Spendi Auctoritas (o l’Appoggio di Cartagine) per completare le unità o ricevere rinforzi. Le regioni sottomesse possono ribellarsi. Se l’appoggio scende sotto −3, il comandante viene richiamato e la campagna finisce. Nel primo inverno in Italia gli elefanti di Annibale muoiono, tranne uno.</p>
<h3>Vittoria</h3><p>La Gloria viene da battaglie, città prese, regioni sottomesse e imprese (le Alpi, lo sbarco in Africa). Ogni scenario ha un obiettivo storico. Il comandante morto o senza eserciti chiude la partita.</p>
<h3>Fonti e realismo</h3><p>Date, capi, eserciti e numeri vengono da Polibio, <i>Storie</i> (traduzione di W. R. Paton), da Tito Livio, <i>Ab Urbe Condita</i> (traduzione di Canon Roberts), e da Appiano, <i>Guerre puniche</i> (traduzione di Horace White). Dove gli autori divergono, il testo dell’evento lo dice. Livio non sa quanti soldati Scipione portò in Africa e dà tre versioni. Le forze nemiche del gioco seguono questi numeri, con quantità adattate perché la partita resti giocabile. Alcune posizioni sono incerte: il passo alpino di Annibale, Becula, Nefèri, Zama e i Campi Magni sono collocati in modo approssimativo. La mappa usa il rilievo, i fiumi, i laghi e le coste di Natural Earth (pubblico dominio); le coste sono quelle di oggi, e le rive di Cartagine e di Utica, il delta del Rodano e la laguna di Cartagine Nuova erano diversi. Le regole di combattimento sono un modello di gioco, non una ricostruzione militare.</p>`,
    es: `<p>Mandas uno de los bandos: Cartago en el escenario de Aníbal, Roma en los otros dos. Cada año tiene tres estaciones de campaña (primavera, verano y otoño) y un invierno en los cuarteles. Los enemigos actúan según las reglas del juego y los dados, siguiendo el calendario de los relatos antiguos.</p>
<h3>Estación</h3><ol><li><b>Fortuna:</b> un dado decide lluvias, convoyes de trigo, exploradores o buenos auspicios.</li><li><b>Mando:</b> cada ejército tira un dado. Aníbal recibe 3 + la mitad del dado (redondeada hacia arriba); Escipión, 2 + la mitad; los demás comandantes, 1 + la mitad.</li><li><b>Órdenes:</b> marchar cuesta el número del camino (las montañas cuestan 2 o 3). El Ródano solo se cruza después de reunir barcas y balsas en una orilla. Los Alpes cuestan muchos hombres y parte de la caballería. Navegar exige puertos y puede traer tormentas y, en el escenario de Aníbal, la flota romana. En el escenario de Escipión, África solo puede invadirse a partir de 205 a. C. Entrar donde hay un ejército enemigo en campo abre la batalla.</li><li><b>Enemigos:</b> los ejércitos en campo atacan cuando se creen más fuertes; las guarniciones se quedan tras las murallas; Fabio evita la batalla y sigue al enemigo de cerca; la caballería númida provoca los campamentos.</li><li><b>Trigo:</b> al final de la estación, quien está en tierra amiga, aliada o sometida recibe trigo; fuera de ella pierde 1. Con 0, los hombres desertan o mueren de hambre.</li></ol>
<h3>Unidades</h3><p>Cada unidad tiene 10 compañías y un número de hombres. El ejército de Aníbal empieza con los 50.000 infantes, los unos 9.000 jinetes y los 37 elefantes que, según Polibio, siguieron del Ebro hacia el Ródano. El de Escipión empieza con los 25.000 infantes y 2.500 jinetes con que marchó sobre Cartago Nova. La caballería se cuenta en miles.</p>
<h3>Batalla</h3><p>Cada 480 hombres valen 1 punto (veteranos 1,35; élite 1,7); mil jinetes valen 1,2 en el ejército de Aníbal y 0,8 en el romano. Mil guerreros enemigos valen 0,6 veces su calidad; mil legionarios valen 2. Cada bando tira un dado por cada 7 puntos, más los modificadores de terreno, murallas, campamento, caballería, elefantes y comandante. Las tropas veteranas aciertan con 4 a 6; los novatos y la mayoría de los enemigos, con 5 o 6. Cada acierto quita 3 puntos. Tras cada ronda, quien sufrió más tira 2d6 de moral: por encima del valor, huye y sufre la persecución de la caballería. Son tres rondas como máximo. Si el ejército del comandante huye, él puede morir: 1 de cada 12. Aníbal puede preparar una emboscada (+3 dados en la primera ronda si el enemigo ataca), y su caballería, cuando es claramente superior, envuelve los flancos (+2 dados).</p>
<h3>Asedios</h3><p>Los enemigos tras murallas deben ser asediados: cada orden de asedio suma un dado más la mitad de las unidades (y 2 con el comandante). Cuando el asedio llega a 6 veces la fortificación, la ciudad cae. Cada estación los sitiados consumen sus víveres; sin víveres, se rinden. Cartago, en 149, recibe víveres por el puerto: hay que cerrarlo con un muelle (3 puntos), obra que solo Escipión Emiliano consigue hacer, a partir de 147.</p>
<h3>Invierno</h3><p>Los ejércitos en territorio amigo recuperan compañías; fuera de él, las pierden. Las unidades vencedoras pueden volverse veteranas. Gasta Auctoritas (o el Apoyo de Cartago) para completar unidades o recibir refuerzos. Las regiones sometidas pueden rebelarse. Si el apoyo cae por debajo de −3, el comandante es llamado de vuelta y la campaña termina. En el primer invierno en Italia mueren los elefantes de Aníbal, menos uno.</p>
<h3>Victoria</h3><p>La Gloria viene de batallas, ciudades tomadas, regiones sometidas y hazañas (los Alpes, el desembarco en África). Cada escenario tiene un objetivo histórico. El comandante muerto o sin ejércitos termina el juego.</p>

  }
  function zoom(f, cx, cy) {

  }
  function svgPoint(ev) { const r = svg.getBoundingClientRect(); const s = Math.max(vb[2] / r.width, vb[3] / r.height); const ox = (r.width * s - vb[2]) / 2, oy = (r.height * s - vb[3]) / 2; return [vb[0] - ox + (ev.clientX - r.left) * s, vb[1] - oy + (ev.clientY - r.top) * s, s]; }
  svg.addEventListener('wheel', (ev) => { ev.preventDefault(); const [x, y] = svgPoint(ev); zoom(ev.deltaY > 0 ? 1.15 : 1 / 1.15, x, y); }, { passive: false });
  svg.addEventListener('pointerdown', (ev) => { drag = { x: ev.clientX, y: ev.clientY, vb: vb.slice(), s: svgPoint(ev)[2] }; panMoved = false; });

  async function afterAction() { renderAll(); await flush(); saveGame(); renderAll(); if (G.over) showEnd(); }

  // ---------------------------------------------------------------- dados e diálogos
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const DCLS = { red: 'red', grn: 'grn', pur: 'pur', gold: '', blue: '' };
  function dieHTML(v, c, extra) { return `<span class="die ${DCLS[c] || ''} ${extra || ''}" role="img" aria-label="${v}">${Array.from({ length: 9 }, (_, i) => `<i style="visibility:${PIPS[v].includes(i) ? 'visible' : 'hidden'}"></i>`).join('')}</span>`; }
  function openDialog(d) { return new Promise((res) => { const onClose = () => { d.removeEventListener('close', onClose); res(d.returnValue); }; d.addEventListener('close', onClose); if (!d.open) d.showModal(); }); }
  async function flush() {
    busy = true;

      const it = G.queue.shift();
      if (it.k === 'event') await showEvent(it.id);

  async function showBattle(rep) {
    const d = $('dBattle');
    $('btH').textContent = t('bt_title', { p: NODES[rep.node].n });
    const side = (title, v, n, h, m, mods, cls) => `<div><h3>${esc(title)}</h3><div class="bt-val">${Math.round(v)}</div><div class="muted">${t('bt_val')}</div><p>${t('bt_dice', { n, h })}<br>${t('bt_morale', { m })}</p><ul>${mods.map((x) => `<li>${esc(t(x.k, x.v))}</li>`).join('')}</ul></div>`;
    $('btBody').innerHTML = `<div class="bt-sides">${side(t('bt_rom') + ': ' + rep.rName, rep.rV0, rep.rN, rep.rH, rep.rM, rep.rMods)}${side(t('hostes') + ': ' + rep.eName, rep.eV0, rep.eN, rep.eH, rep.eM, rep.eMods)}</div>`;

      await sleep(650);
      L(t('bt_round', { n: i + 1, a: r.rh, b: r.eh }));
      for (const m of r.mor) {
        const sum = m.roll[0] + m.roll[1];
        if (m.rally) L(t('bt_rally', { r: m.rally[0] + m.rally[1] }));
        L(t((m.ok ? 'bt_mok_' : 'bt_mfail_') + m.side, { r: m.rally ? m.rally[0] + m.rally[1] : sum }));

  }

  // ---------------------------------------------------------------- estação, inverno e fim
  async function endSeason() {
    if (!G || busy || G.phase !== 'player' || G.over) return;
    busy = true; G.sel = G.sel; renderAll();
    beginEnemyPhase();
    for (;;) {
      const more = enemyStep();
      renderAll(); busy = false; await flush(); busy = true;
      if (G.pending) { busy = false; await deceitDialog(); await flush(); busy = true; }
      if (G.over || !more) break;
      await sleep(120);
    }
    if (!G.over) advance();
    busy = false;
    renderAll(); await flush(); saveGame();
    if (G.over) { showEnd(); return; }
    if (G.phase === 'winter') await winterDialog();
  }

      G.armies.forEach((a) => { h += `<h3>${esc(a.name)} · ${esc(NODES[a.at].n)}</h3><div class="moves">${a.legs.map((l, i) => `<button type="button" class="btn sm" data-w="${a.id}:${i}" ${G.auct >= 1 && l.c < 10 ? '' : 'disabled'}>${esc(t('w_reinf', { l: l.n }))} · ${l.c}/10</button>`).join('')}</div>`; });

      $('evBody').innerHTML = h;
      $('evBody').querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => { const [aid, li] = b.dataset.w.split(':'); winterReinforce(G.armies.find((x) => x.id === aid), +li); draw(); renderAll(); }));

  $('bSpeed').addEventListener('click', () => { fast = !fast; savePref({ fast }); $('bSpeed').textContent = t(fast ? 'speedF' : 'speedN'); });
  $('sLang').addEventListener('change', () => { lang = $('sLang').value; savePref({ lang }); applyLang(); });
  ['dEvent', 'dBattle'].forEach((id) => $(id).addEventListener('cancel', (ev) => ev.preventDefault()));
  document.addEventListener('keydown', (ev) => {
    if ($('app').hidden || document.querySelector('dialog[open]') || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.target && /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
    if (ev.key === 'e' || ev.key === 'E') { ev.preventDefault(); endSeason(); }
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== lang) { lang = h; savePref({ lang }); applyLang(); } });

  const hashLang = location.hash.slice(1), navLang = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  lang = LANGS.includes(hashLang) ? hashLang : (LANGS.includes(prefs.lang) ? prefs.lang : (LANGS.includes(navLang) ? navLang : 'pt'));
  theme = ['auto', 'light', 'dark'].includes(prefs.theme) ? prefs.theme : 'auto';
  fast = !!prefs.fast;
  applyLang();
  $('ovSetup').hidden = false;
  // ganchos de leitura para testes automatizados
  // simulação de batalhas para medir táticas (não altera a partida em curso)
  function simBattle(spec, n, seed) {
    const keep = G; const out = { rwin: 0, ewin: 0, draw: 0, rLost: 0, eLost: 0, dead: 0 };
    G = { rs: seed | 0, diff: spec.diff == null ? 1 : spec.diff, armies: [], enemies: [], ns: {}, flags: {}, log: [], queue: [], nid: 1, gloria: 0, auct: 0, legates: [], legPool: [], yearWins: 0, fired: {}, year: 216, season: 0, scen: spec.scen || 'hannibal' };
    Object.values(NODES).forEach((x) => { G.ns[x.id] = { s: x.s0, prog: 0 }; });
    if (spec.status) G.ns[spec.at].s = spec.status;
    for (let i = 0; i < n; i++) {
      G.armies = []; G.enemies = []; G.queue = []; G.log = []; G.over = null; G.ns[spec.at].prog = spec.prog || 0;
      const a = mkArmy(spec.caesar ? 'Dux' : 'Legatus', spec.at, !!spec.caesar, spec.legs, spec.cav || 0);
      a.camp = !!spec.camp; a.eleph = spec.eleph || 0; a.sup = spec.sup == null ? 3 : spec.sup;
      const e = mkEnemy(Object.assign({ at: spec.at }, spec.enemy));
      const rep = battle(a, e, spec.attacker || 'r', spec.opt || {});
      out[rep.result]++; out.rLost += rep.rLostCoh; out.eLost += rep.eLostK; if (rep.caesarDead) out.dead++;
    }
    G = keep;
    return out;
  }
  window.__punic = { state: () => G, I18N, EV, NODES, ADJ, LANGS, SCEN, simBattle };
})();
