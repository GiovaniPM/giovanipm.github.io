      GL3.drawStage(W, keys); drawHud(); return;
    }
    const mw = W.m[0].length * TS, mh = W.m.length * TS, p = W.p;
    const camX = clamp(p.x - VW * TS / 2, 0, Math.max(0, mw - VW * TS)), camY = clamp(p.y - VH * TS / 2, 0, Math.max(0, mh - VH * TS));
    cx.save(); cx.translate(0, HUD);
    rect(0, 0, VW * TS, VH * TS, '#000');
    const tx0 = Math.floor(camX / TS), ty0 = Math.floor(camY / TS);
    for (let ty = ty0; ty <= ty0 + VH; ty++) for (let tx = tx0; tx <= tx0 + VW; tx++) if (inMap(W.m, tx, ty)) drawTile(W.m[ty][tx], tx * TS - camX, ty * TS - camY, tx, ty, W.time);
    cx.translate(-Math.round(camX), -Math.round(camY));
    W.ents.filter((e) => !e.dead).sort((a, b) => a.y - b.y).forEach(drawEnt);
    W.proj.forEach((pr) => { cx.strokeStyle = pr.foe ? COL.black : pr.harpoon ? '#C9C2B0' : '#6E4A2A'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(pr.x, pr.y); cx.lineTo(pr.x - Math.sign(pr.vx) * 7, pr.y - Math.sign(pr.vy) * 7); cx.stroke(); });
    person(p.x, p.y, p.face, COL.red, { weapon: W.noMelee ? null : W.weapon, walk: (keys.left || keys.right || keys.up || keys.down) ? p.walk : 0, atk: p.atk > 0, block: p.block, carry: p.carry, flash: p.inv > 0 });
    W.fx.forEach((f) => { if (f.k === 'spark') { rect(f.x - 3, f.y - 3, 6, 6, '#FFF3B0'); } if (f.k === 'hurt' && !reduceMotion) { cx.strokeStyle = '#E06A4A'; cx.strokeRect(f.x - 9, f.y - 15, 18, 26); } });
    cx.restore();
    // HUD
    rect(0, 0, VW * TS, HUD, '#1E140C');
    for (let k = 0; k < G.penas; k++) feather(4 + k * 11, 3, clamp((G.life - k * 2) / 2, 0, 1));
    cx.fillStyle = '#F4E4C1'; cx.font = '9px "Segoe UI", Arial, sans-serif'; cx.textBaseline = 'top';
    const right = `${W.noArrows ? '' : W.id === 'servo' ? '➶∞  ' : `➶${W.ammo}  `}◆${G.prov}`;
    cx.fillText(right, VW * TS - cx.measureText(right).width - 4, 3);
    if (W.timer) { const left = Math.max(0, Math.ceil(W.timer - W.time)); cx.fillText(`${left}s`, VW * TS / 2 - 8, 3); }
    // mensagens
    const m = W.msgs[W.msgs.length - 1];
    if (m) { cx.font = '8px "Segoe UI", Arial, sans-serif'; const w = Math.min(VW * TS - 8, cx.measureText(m.s).width + 8); rect((VW * TS - w) / 2, HUD + VH * TS - 16, w, 13, 'rgba(20,12,6,.85)'); cx.fillStyle = '#FFF6E6'; cx.fillText(m.s.length > 60 ? m.s.slice(0, 58) + '…' : m.s, (VW * TS - w) / 2 + 4, HUD + VH * TS - 14); }
    if (W.paused) { rect(0, HUD, VW * TS, VH * TS, 'rgba(0,0,0,.55)'); cx.fillStyle = '#FFF6E6'; cx.font = '12px Georgia, serif'; const s = t('paused'); cx.fillText(s, (VW * TS - cx.measureText(s).width) / 2, HUD + 70); }
  }

  // ================================================================ entrada: teclado e toque
  const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyL: 'block', ShiftLeft: 'block', ShiftRight: 'block' };
  const PRESSMAP = { KeyJ: 'attack', Space: 'attack', KeyK: 'shoot', KeyE: 'use', Enter: 'use', KeyF: 'eat' };
  document.addEventListener('keydown', (e) => {
    if ($('dlg').open || $('app').hidden) return;
    if (mini) {
      if (mini.kind === 'quick' && ARROWS[e.key]) { e.preventDefault(); quickAnswer(e.key); return; }
      if (e.code === 'Space' || e.code === 'KeyJ') { e.preventDefault(); if (!e.repeat) miniPress(true); return; }
      return;
    }
    if (!W) return;
    if (e.code === 'Escape' || e.code === 'KeyP') { W.paused = !W.paused; return; }
    if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
    if (PRESSMAP[e.code] && !e.repeat) { pressed[PRESSMAP[e.code]] = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', (e) => {
    if (mini && (e.code === 'Space' || e.code === 'KeyJ')) { miniPress(false); return; }
    if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false;
  });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  // botões na tela (toque e mouse)
  $('touch').addEventListener('pointerdown', (e) => { const b = e.target.closest('[data-k]'); if (!b) return; e.preventDefault(); b.setPointerCapture(e.pointerId); const k = b.dataset.k; if (['up', 'down', 'left', 'right', 'block'].includes(k)) keys[k] = true; else pressed[k] = true; });
  const release = (e) => { const b = e.target.closest('[data-k]'); if (b && ['up', 'down', 'left', 'right', 'block'].includes(b.dataset.k)) keys[b.dataset.k] = false; };
  $('touch').addEventListener('pointerup', release); $('touch').addEventListener('pointercancel', release);
  $('txt').addEventListener('pointerdown', (e) => { if (e.target.closest('[data-mini="hold"]')) { e.preventDefault(); miniPress(true); } if (e.target.closest('[data-mini="press"]')) { e.preventDefault(); miniPress(true); } });
  $('txt').addEventListener('pointerup', (e) => { if (e.target.closest('[data-mini="hold"]')) miniPress(false); });

  // ================================================================ interface HTML
  function toast(msgTxt) { const box = $('toasts'); while (box.children.length >= 3) box.firstChild.remove(); const el = document.createElement('div'); el.className = 'toast'; el.textContent = msgTxt; box.appendChild(el); setTimeout(() => el.remove(), 2600); }
  function announce(s) { const a = $('announce'); if (a) a.textContent = s; }
  function renderSheet() {
    const h = [`<h2>${esc(G.name)}${G.alias ? ` <small>(${esc(G.alias)})</small>` : ''}</h2>`];
    h.push(`<p class="life" aria-label="${esc(t('vigor'))}: ${G.life}/${maxLife()}">${Array.from({ length: G.penas }, (_, k) => `<span class="pena ${G.life >= k * 2 + 2 ? 'f' : G.life > k * 2 ? 'h' : ''}"></span>`).join('')}</p>`);
    h.push(`<div class="stats"><div><b>${G.honra}</b><span>${t('honra')}</span></div><div><b>${G.fama}</b><span>${t('fama')}</span></div>${G.met.araci ? `<div><b>${G.afeto}</b><span>${t('afeto')}</span></div>` : ''}</div>`);
    h.push(`<p class="prov">${t('prov', { n: G.prov })} · ${t('arrowsN', { n: W ? W.ammo : G.arrows })} <button type="button" class="btn sm" id="bEat" ${G.prov > 0 && G.life < maxLife() ? '' : 'disabled'}>${t('eat')}</button></p>`);
    if (G.sv && S[G.scene].stage === 'servo') h.push(`<h3>${t('tasks')}</h3><ul class="tasks">${['manati', 'anta', 'roca', 'banho'].map((k) => `<li class="${G.sv[k] ? 'done' : ''}">${G.sv[k] ? '✓' : '○'} ${t('task_' + k)}</li>`).join('')}</ul>`);
    h.push(`<h3>${t('items')}</h3><ul class="items">` + G.items.map((i) => `<li><button type="button" class="linky" data-item="${i}">${esc(pick(ITEMS[i].n))}</button></li>`).join('') + '</ul>');
    h.push(`<p class="muted small">${t('seedShown', { s: G.seed })}</p>`);
    $('sheet').innerHTML = h.join('');
  }
  function srcHTML(src) {
    return src.split(';').map((p) => { const [k, v] = p.split(':'); if (k === 'R') return t('srcNovel', { c: v.split(',').map((x) => (x === 'Intro' ? t('introW') : x === 'Adv' ? t('advW') : x)).join(', ') }); return t('srcWiki', { w: `<a href="https://pt.wikipedia.org/wiki/${SRC_NAME[v] || encodeURIComponent(v)}" rel="noopener" target="_blank">${esc(v)}</a>` }); }).join(' · ');
  }
  function openDlg(h, body) { if (W) W.paused = true; $('dlgH').textContent = h; $('dlgBody').innerHTML = body; $('dlg').showModal(); }
  function openSaberes() { const ids = G ? G.saberes : []; openDlg(t('saberes'), ids.length ? ids.map((id) => `<article class="saber"><h3>${esc(pick(SABER[id].n))}</h3><p>${esc(pick(SABER[id].t))}</p><p class="src">${t('src')}: ${srcHTML(SABER[id].src)}</p></article>`).join('') : `<p>${t('noSaber')}</p>`); }
  function openRules() { openDlg(t('howTo'), RULES[lang]); }
  const choiceBtns = (list) => `<div class="choices">${list.map(([attr, label, dis]) => `<button type="button" class="choice" ${attr} ${dis ? 'disabled' : ''}>${label}</button>`).join('')}</div>`;
  function render() {
    if (!G) return;
    const s = S[G.scene];
    $('hdAct').textContent = `${t('act')} ${['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'][s.act - 1]} · ${t('act' + s.act)}`;
    $('hdDate').textContent = W ? t(W.obj) : '';
    renderSheet();
    const playing = !!W && G.stageOn;
    $('stage').classList.toggle('on', playing);
    $('txt').hidden = playing;
    $('touch').hidden = !playing;
    cv.setAttribute('aria-label', playing ? t(W.obj) : t('mapL'));
    if (playing) { $('cvwrap').focus({ preventScroll: true }); return; }
    if (!W) drawIdle(s);
    let h = '';
    if (s.text) h += `${s.narr ? `<p class="narrlbl">${t('narr')}</p>` : ''}<p class="story${s.narr ? ' narr' : ''}">${esc(pick(s.text))}</p>`;
    if (G.res) h += `<p class="res ${G.res.ok ? 'good' : 'bad'}" role="status">${esc(G.res.line)}</p>` + choiceBtns([['data-next', t(G.res.retry ? 'tryAgain' : 'cont')]]);
    else if (s.end) h += `<div class="ending"><h2>${t('endT')}: ${t('end_' + s.end)}</h2><p>${t('score', { h: G.honra, f: G.fama, a: G.afeto })}</p>${s.end === 'lenda' ? '' : `<p class="muted">${t('novel')}</p>`}</div>` + choiceBtns([...(s.end !== 'lenda' && G.cp ? [['data-retry="1"', t('retryAct')]] : []), ['data-new="1"', t('newGame')], ['data-menu="1"', t('menu')]]);
    else if (s.type === 'stage') h += `<p class="obj">${esc(t(STAGES_OBJ[s.stage]))}</p><p class="muted small">${t('controlsShort')}</p>` + choiceBtns([['data-start="1"', t('btnStart')]]);
    else if (['mash', 'charge', 'quick'].includes(s.type)) h += `<div id="miniBox"></div>` + (G.mini ? '' : choiceBtns([['data-mini-start="1"', t('btnStart')]]));
    else if (s.choices) h += choiceBtns(s.choices.map((c, i) => [`data-ch="${i}"`, esc(pick(c.t))]));
    $('txt').innerHTML = h;
    if (mini) renderMini();
    $('log').innerHTML = G.log.slice(-40).map((e) => `<li>${esc(Array.isArray(e) ? (e[0] === 'renamed' ? t('renamed') : e[0] === 'newPena' ? t('newPena') : t(e[0], { s: pick((e[0] === 'newSaber' ? SABER : ITEMS)[e[1]].n) })) : e)}</li>`).join('');
    const f = $('txt').querySelector('button:not([disabled])'); if (f && !$('dlg').open) f.focus({ preventScroll: true });
  }
  const STAGES_OBJ = { campos: 'o_campos', chase: 'o_chase', seta: 'o_seta', pojuca1: 'o_pojuca1', pojuca2: 'o_pojuca2', rio: 'o_rio', servo: 'o_servo', cori: 'o_cori', toro: 'o_toro', agnina: 'o_agnina' };
  // cena parada atrás do diálogo: uma paisagem simples no canvas
  function drawIdle(s) {
    if (GL3.ok) {
      // maquete 3D do lugar, girando devagar enquanto o texto está na tela (parada se o sistema pede menos movimento)
      if (idleRaf) cancelAnimationFrame(idleRaf);
      let lastT = 0;
      const tick = (ts) => {
        idleRaf = 0;
        if (W || !G || $('app').hidden) return;
        if (!lastT || ts - lastT > 32) { lastT = ts || 1; GL3.drawDiorama(S[G.scene], G.name); }
        if (!reduceMotion) idleRaf = requestAnimationFrame(tick);
      };
      tick(0);
      return;
    }
    const night = s.time === 'noite';
    const g = cx.createLinearGradient(0, 0, 0, HUD + VH * TS); g.addColorStop(0, night ? '#0E1530' : s.time === 'tarde' ? '#E98B5B' : '#7FB7D9'); g.addColorStop(1, night ? '#25305A' : '#F7DDB0');
    cx.fillStyle = g; cx.fillRect(0, 0, VW * TS, HUD + VH * TS);
    cx.fillStyle = night ? '#1C2540' : '#7C9A86'; cx.beginPath(); cx.moveTo(0, 110); [[40, 80], [80, 100], [130, 60], [180, 96], [230, 70], [256, 90], [256, 192], [0, 192]].forEach(([x, y]) => cx.lineTo(x, y)); cx.fill();
    const loc = s.loc || 'campina';
    rect(0, 130, 256, 62, loc === 'rio' ? COL.water : night ? '#1A2A20' : COL.grass);
    if (loc.startsWith('taba')) for (let k = 0; k < 4; k++) { cx.fillStyle = night ? '#3A2E1E' : COL.thatch; cx.beginPath(); cx.arc(30 + k * 64, 134, 20, Math.PI, 0); cx.fill(); }
    if (loc === 'floresta') for (let k = 0; k < 9; k++) { cx.fillStyle = COL.tree; cx.beginPath(); cx.arc(10 + k * 30, 128, 16, 0, 7); cx.fill(); }
    if (night) { cx.fillStyle = '#F4EBC8'; cx.beginPath(); cx.arc(210, 30, 9, 0, 7); cx.fill(); }
    person(128, 150, 'right', COL.red, { weapon: G.name === 'Ubirajara' ? 'lanca' : 'tacape' });
  }

  window.addEventListener('resize', () => { if (G && !W && !$('app').hidden && !idleRaf) drawIdle(S[G.scene]); });
  // ---------------------------------------------------------------- cliques da interface
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || b.disabled || !G || $('app').hidden) return;
    const d = b.dataset;
    if (d.ch != null) choose(+d.ch);
    else if (d.next != null) { const r = G.res; G.res = null; if (r.retry) { render(); return; } go(r.next); }
    else if (d.start) startStage();
    else if (d.miniStart) startMini(S[G.scene].type);
    else if (d.qk) quickAnswer(d.qk);
    else if (d.item) openItem(d.item);
    else if (d.retry) { const c = G.cp; G = JSON.parse(JSON.stringify(c)); G.cp = c; save(); render(); }
    else if (d.new) startFromMenu();
    else if (d.menu) toMenu();
  });
  function openItem(id) { openDlg(pick(ITEMS[id].n), `<p>${esc(pick(ITEMS[id].d))}</p>`); }
  $('sheet').addEventListener('click', (e) => { if (e.target.id === 'bEat') { if (W) pressed.eat = true; else if (G.prov > 0 && G.life < maxLife()) { G.prov--; G.life = Math.min(maxLife(), G.life + 3); save(); renderSheet(); } } });
  $('dlg').addEventListener('close', () => { if (W) W.paused = false; });

  // ---------------------------------------------------------------- menu, idioma e tema
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
    const k = { auto: 'themeAuto', light: 'themeLight', dark: 'themeDark' }[theme];
    document.querySelectorAll('[data-theme-btn]').forEach((b) => { b.textContent = t(k); });
  }
  function applyLang() {
    document.documentElement.lang = TAG[lang];
    document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = t(n.dataset.t); });
    document.querySelectorAll('[data-ta]').forEach((n) => { n.setAttribute('aria-label', t(n.dataset.ta)); });
    $('sLang').value = lang;
    $('backLink').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    document.title = 'Ubirajara · ' + t('subtitle') + ' · Giovani Perotto Mesquita';
    if (history.replaceState) history.replaceState(null, '', lang === 'pt' ? location.pathname + location.search : '#' + lang);
    $('help').innerHTML = t('controlsLong');
    applyTheme();
    $('bResume').hidden = !Store.get('ubirajara.save');
    if (G && !$('app').hidden) render();
  }
  function startFromMenu() {
    let seed = parseInt($('sSeed').value, 10); if (!Number.isFinite(seed)) seed = (Math.random() * 2147483647) | 0;
    const diff = +$('sDiff').value; savePref({ diff });
    stopStage(); newGame(seed, diff);
    $('ovMenu').hidden = true; $('app').hidden = false;
    go('i_intro');
  }
  function toMenu() { if (G && !S[G.scene].end && !confirm(t('confirmMenu'))) return; stopStage(); save(); $('app').hidden = true; $('ovMenu').hidden = false; applyLang(); }
  $('bNew').addEventListener('click', startFromMenu);
  $('bResume').addEventListener('click', () => { const s = Store.get('ubirajara.save'); if (!s || s.v !== 2) { Store.del('ubirajara.save'); $('bResume').hidden = true; return; } G = s; $('ovMenu').hidden = true; $('app').hidden = false; render(); });
  document.querySelectorAll('[data-rules]').forEach((b) => b.addEventListener('click', openRules));
  $('bSaberes').addEventListener('click', openSaberes);
  $('bMenu').addEventListener('click', toMenu);
  $('dlgClose').addEventListener('click', () => $('dlg').close());
  document.querySelectorAll('[data-theme-btn]').forEach((b) => b.addEventListener('click', () => { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme]; savePref({ theme }); applyTheme(); }));
  $('sLang').addEventListener('change', () => { lang = $('sLang').value; savePref({ lang }); applyLang(); });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== lang) { lang = h; savePref({ lang }); applyLang(); } });
  const hashLang = location.hash.slice(1), navLang = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  lang = LANGS.includes(hashLang) ? hashLang : (LANGS.includes(prefs.lang) ? prefs.lang : (LANGS.includes(navLang) ? navLang : 'pt'));
  theme = ['auto', 'light', 'dark'].includes(prefs.theme) ? prefs.theme : 'auto';
  $('sDiff').value = String(prefs.diff != null ? prefs.diff : 1);
  applyLang();
  // ganchos de leitura para testes automatizados
  window.__ubi = { state: () => G, world: () => W, S, I18N, SABER, ITEMS, RULES, mini: () => mini, DEF };
})();
</script>
</body>
</html>
