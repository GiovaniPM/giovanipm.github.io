  :root[data-theme="dark"] { --bg: #14100B; --panel: #211A12; --panel2: #2B2218; --ink: #F2E8D8; --ink2: #BCA98E; --line: #44372A; --accent: #E06A4A; --accent-ink: #1A0E08; --gold: #D8AE5A; --good: #7CC48A; --bad: #F08A70; --map: #2A2218; --water: #2F5F73; color-scheme: dark; }

  @media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }

  /* modo de ação */
  .stagebox { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  #cvwrap { outline: none; }
  #cv { display: block; width: 100%; height: auto; aspect-ratio: 256 / 192; image-rendering: pixelated; image-rendering: crisp-edges; }
  #stage.on #cvwrap:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .obj { font-weight: 600; margin: .2rem 0; }

  .meter i { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 55%, transparent); border-left: 2px solid var(--good); border-right: 2px solid var(--good); z-index: 1; }
  .choice.big { text-align: center; font-weight: 700; min-height: 56px; touch-action: manipulation; user-select: none; }

  .acts { display: grid; grid-template-columns: repeat(3, 54px); gap: 6px; }

  .pena.f { background: var(--accent); } .pena.h { background: linear-gradient(90deg, var(--accent) 50%, var(--panel2) 50%); }

  #stage:not(.on) #cv { width: auto; max-width: 100%; max-height: 30vh; margin: 0 auto; }
  #stage:not(.on) .stagebox { background: transparent; border: 0; }
  /* 3D (WebGL): canvas na resolução da tela e painel em HTML por cima */
  #cv.gl { image-rendering: auto; aspect-ratio: 4 / 3; }
  #stage:not(.on) #cv.gl { width: min(100%, 52vh); border-radius: 14px; }
  #hud { position: absolute; inset: 0; pointer-events: none; color: #FFF6E6; font: 600 clamp(.78rem, 2.4vw, 1.02rem) / 1.25 "Hanken Grotesk", "Segoe UI", Arial, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  #stage:not(.on) #hud { display: none; }
  #hud [hidden] { display: none !important; }
  #hud .bar { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .45rem .7rem .9rem; background: linear-gradient(rgba(18,10,4,.78), rgba(18,10,4,0)); }
  #hud .hp { display: flex; gap: 4px; }
  #hud .hp i { width: .72em; height: 1.2em; border-radius: 50% 50% 30% 30% / 65% 65% 25% 25%; background: #3A2A1E; border: 1.5px solid #F4E4C1; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #hud .hp i.f { background: #C62828; } #hud .hp i.h { background: linear-gradient(90deg, #C62828 50%, #3A2A1E 50%); }
  #hud .tm { font-variant-numeric: tabular-nums; }
  #hud .boss { position: absolute; left: 25%; right: 25%; top: 2.3em; height: 7px; border-radius: 4px; background: rgba(20,12,6,.7); border: 1px solid #F4E4C1; overflow: hidden; }
  #hud .boss b { display: block; height: 100%; background: #E06A4A; }
  #hud .msg { position: absolute; left: 50%; bottom: .7rem; transform: translateX(-50%); max-width: 92%; width: max-content; padding: .35rem .8rem; border-radius: 10px; background: rgba(20,12,6,.84); text-align: center; }
  #hud .msg:empty { display: none; }
  #hud .pause { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.5); font: 700 1.7rem Georgia, "Times New Roman", serif; }
  @media print { #hud { display: none; } }
  #hud::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, transparent 58%, rgba(10,6,2,.38) 100%); z-index: -1; }
  #hud { z-index: 1; isolation: isolate; }
</style>

<script>
(() => {
  'use strict';
  // ================================================================ história (segue os capítulos de Ubirajara, 1874)
  // L(pt, en, it, es). As falas entre aspas no texto em português são de Alencar; nos outros idiomas, tradução livre.
  const L = (...a) => a;
  const S = {};
  const sc = (id, o) => { S[id] = Object.assign({ id }, o); };

  // ---------------------------------------------------------------- Ato I · O caçador (cap. I)
  sc('i_intro', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'Pela margem do grande rio caminha Jaguarê, o jovem caçador. Já não lhe basta vencer o jaguar: chegou à idade em que o mancebo troca a fama do caçador pela glória do guerreiro. Para ganhar um nome de guerra, precisa de uma grande façanha. Deixou a taba dos araguaias e Jandira, a virgem que lhe guarda o seio de esposa, e procura um inimigo digno de seu braço.',
    'Along the bank of the great river walks Jaguarê, the young hunter. Defeating the jaguar no longer satisfies him: he has reached the age when a youth trades a hunter’s fame for a warrior’s glory. To earn a war name he needs a great deed. He has left the village of the Araguaia and Jandira, the maiden who waits to be his wife, and seeks an enemy worthy of his arm.',
    'Lungo la riva del grande fiume cammina Jaguarê, il giovane cacciatore. Vincere il giaguaro non gli basta più: è giunto all’età in cui il giovane scambia la fama del cacciatore con la gloria del guerriero. Per guadagnare un nome di guerra gli serve una grande impresa. Ha lasciato il villaggio degli araguaia e Jandira, la fanciulla che lo attende come sposa, e cerca un nemico degno del suo braccio.',
    'Por la orilla del gran río camina Jaguarê, el joven cazador. Ya no le basta vencer al jaguar: llegó a la edad en que el mozo cambia la fama del cazador por la gloria del guerrero. Para ganar un nombre de guerra necesita una gran hazaña. Dejó la aldea de los araguaias y a Jandira, la doncella que lo espera como esposa, y busca un enemigo digno de su brazo.'),
    choices: [{ t: L('Seguir pelos campos', 'Go on across the fields', 'Proseguire per i campi', 'Seguir por los campos'), go: 'i_explora' }] });
  sc('i_explora', { act: 1, type: 'explore', start: 'campina', slots: 6, title: L('Três sóis sem inimigo', 'Three suns without an enemy', 'Tre soli senza nemico', 'Tres soles sin enemigo'),
    text: L('Cace, pesque e colha para não passar fome. Quando quiser, solte o grito de guerra na campina.', 'Hunt, fish and gather so as not to go hungry. Whenever you wish, raise your war cry in the field.', 'Caccia, pesca e raccogli per non soffrire la fame. Quando vuoi, lancia il grido di guerra nella prateria.', 'Caza, pesca y recolecta para no pasar hambre. Cuando quieras, lanza el grito de guerra en la llanura.'),
    finish: { at: 'campina', label: L('Soltar o grito de guerra', 'Raise the war cry', 'Lanciare il grido di guerra', 'Lanzar el grito de guerra'), go: 'i_grito' } });
  sc('i_grito', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'Jaguarê para no meio da campina e solta seu grito de guerra. Respondem o ronco da sucuri no rio e o urro da onça na furna, mas nenhum outro grito de guerra. Ele arremessa a lança de duas pontas, que vai cravar-se no tronco da emburana, e repousa à sombra dela. Então salta uma corça da mata, perseguida por uma caçadora com a seta no arco. A corça cai aos pés de Jaguarê. Pela faixa de penas de tucano, ele conhece uma filha dos tocantins; a liga vermelha na perna diz que é virgem.',
    'Jaguarê stops in the middle of the field and raises his war cry. The anaconda answers from the river and the jaguar from its den, but no other war cry. He hurls the two-pointed spear, which sinks into the trunk of an emburana tree, and rests in its shade. A doe leaps from the woods, chased by a huntress with an arrow on her bow. The doe falls at Jaguarê’s feet. By her sash of toucan feathers he knows a daughter of the Tocantins; the red band on her leg says she is unmarried.',
    'Jaguarê si ferma in mezzo alla prateria e lancia il suo grido di guerra. Rispondono l’anaconda dal fiume e il giaguaro dalla tana, ma nessun altro grido di guerra. Scaglia la lancia a due punte, che si conficca nel tronco di un’emburana, e riposa alla sua ombra. Allora una cerva balza dal bosco, inseguita da una cacciatrice con la freccia sull’arco. La cerva cade ai piedi di Jaguarê. Dalla fascia di piume di tucano riconosce una figlia dei tocantins; la giarrettiera rossa dice che è nubile.',
    'Jaguarê se detiene en medio de la llanura y lanza su grito de guerra. Responden la sucuri desde el río y el jaguar desde su cueva, pero ningún otro grito de guerra. Arroja la lanza de dos puntas, que se clava en el tronco de una emburana, y descansa a su sombra. Entonces salta una corza del monte, perseguida por una cazadora con la flecha en el arco. La corza cae a los pies de Jaguarê. Por la faja de plumas de tucán reconoce a una hija de los tocantins; la liga roja en la pierna dice que es doncella.'),
    choices: [{ t: L('Ouvir a caçadora', 'Listen to the huntress', 'Ascoltare la cacciatrice', 'Escuchar a la cazadora'), go: 'i_araci' }] });
  sc('i_araci', { act: 1, loc: 'campina', time: 'tarde', met: 'araci', text: L(
    '— “Guerreiro araguaia, pois vejo pela pena vermelha de teu cocar que pertences a essa nação valente; se pisas os campos dos tocantins como hóspede, bem-vindo sejas; mas se vens como inimigo, foge.”',
    '“Araguaia warrior — for I see by the red feather of your headdress that you belong to that brave nation — if you tread the fields of the Tocantins as a guest, be welcome; but if you come as an enemy, flee.”',
    '«Guerriero araguaia, poiché vedo dalla piuma rossa del tuo copricapo che appartieni a quella nazione valorosa: se calpesti i campi dei tocantins come ospite, sii il benvenuto; ma se vieni da nemico, fuggi.»',
    '«Guerrero araguaia, pues veo por la pluma roja de tu penacho que perteneces a esa nación valiente: si pisas los campos de los tocantins como huésped, bienvenido seas; pero si vienes como enemigo, huye.»'),
    choices: [
      { t: L('“Tu és minha prisioneira; chamarás o inimigo que espero.”', '“You are my prisoner; you will call the enemy I await.”', '«Sei mia prigioniera; chiamerai il nemico che attendo.»', '«Eres mi prisionera; llamarás al enemigo que espero.»'), go: 'i_corrida', fx: { fama: 1 } },
      { t: L('“Venho como hóspede, virgem dos tocantins.”', '“I come as a guest, maiden of the Tocantins.”', '«Vengo come ospite, fanciulla dei tocantins.»', '«Vengo como huésped, doncella de los tocantins.»'), go: 'i_hospede', fx: { afeto: 1 } },
    ] });
  sc('i_hospede', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'A virgem sorri, mas olha a lança cravada na emburana e o grito que ainda ecoa na serra. — Quem chega como hóspede não solta o grito de guerra. Se queres provar quem és, alcança-me. E dispara pela campina.',
    'The maiden smiles, but looks at the spear in the emburana and the cry still echoing on the hills. “A guest does not raise the war cry. If you want to show who you are, catch me.” And she races off across the field.',
    'La fanciulla sorride, ma guarda la lancia nell’emburana e il grido che ancora echeggia sui monti. «Chi arriva come ospite non lancia il grido di guerra. Se vuoi mostrare chi sei, raggiungimi.» E corre via per la prateria.',
    'La doncella sonríe, pero mira la lanza clavada en la emburana y el grito que aún resuena en la sierra. —Quien llega como huésped no lanza el grito de guerra. Si quieres probar quién eres, alcánzame. Y echa a correr por la llanura.'),
    choices: [{ t: L('Correr atrás dela', 'Run after her', 'Correrle dietro', 'Correr tras ella'), go: 'i_corrida' }] });
  sc('i_corrida', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'A linda caçadora desfere a corrida. Jaguarê, que muitas vezes vencera a anta na carreira, lança-se atrás dela; mas a virgem corre como a ema no deserto.',
    'The lovely huntress breaks into a run. Jaguarê, who has often outrun the tapir, dashes after her; but the maiden runs like the rhea on the plain.',
    'La bella cacciatrice si lancia nella corsa. Jaguarê, che tante volte ha battuto il tapiro nella corsa, si getta dietro di lei; ma la fanciulla corre come il nandù nella pianura.',
    'La hermosa cazadora echa a correr. Jaguarê, que muchas veces venció al tapir en la carrera, se lanza tras ella; pero la doncella corre como el ñandú en el desierto.'),
    choices: [{ t: L('Correr com toda a força', 'Run with all your strength', 'Correre con tutte le forze', 'Correr con todas las fuerzas'), test: { a: 'agi', dc: 15, ok: 'i_corrida_ok', fail: 'i_corrida_no' } }] });
  sc('i_corrida_ok', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'Por um instante Jaguarê chega a sentir o vento das tranças dela; mas ela muda de rumo como o beija-flor e torna a se afastar. Seu braço nunca a alcançará. Resta o arco.',
    'For a moment Jaguarê feels the wind of her braids; but she turns like a hummingbird and pulls away again. His arm will never reach her. There is still the bow.',
    'Per un istante Jaguarê sente il vento delle sue trecce; ma lei cambia direzione come il colibrì e si allontana di nuovo. Il suo braccio non la raggiungerà mai. Resta l’arco.',
    'Por un instante Jaguarê llega a sentir el viento de sus trenzas; pero ella cambia de rumbo como el colibrí y vuelve a alejarse. Su brazo nunca la alcanzará. Queda el arco.'),
    choices: [{ t: L('Tomar o arco', 'Take up the bow', 'Prendere l’arco', 'Tomar el arco'), go: 'i_seta' }] });
  sc('i_corrida_no', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'A distância cresce a cada passo. O caçador conhece que seu braço nunca a poderia alcançar. Resta o arco.',
    'The distance grows with every stride. The hunter knows his arm could never reach her. There is still the bow.',
    'La distanza cresce a ogni passo. Il cacciatore capisce che il suo braccio non potrebbe mai raggiungerla. Resta l’arco.',
    'La distancia crece a cada paso. El cazador comprende que su brazo nunca podría alcanzarla. Queda el arco.'),
    choices: [{ t: L('Tomar o arco', 'Take up the bow', 'Prendere l’arco', 'Tomar el arco'), go: 'i_seta' }] });
  sc('i_seta', { act: 1, loc: 'campina', time: 'tarde', type: 'archery', a: 'des', size: 0.16, text: L(
    'A faixa de penas flutua ao vento atrás da caçadora. Uma seta certeira pode pregá-la no tronco do açaí sem ferir a virgem. Solte a flecha quando a marca passar pelo alvo.',
    'The feather sash streams in the wind behind the huntress. A true arrow can pin it to the trunk of an açaí palm without hurting the maiden. Release when the mark crosses the target.',
    'La fascia di piume ondeggia al vento dietro la cacciatrice. Una freccia precisa può inchiodarla al tronco dell’açaí senza ferire la fanciulla. Scocca quando il segno passa sul bersaglio.',
    'La faja de plumas flota al viento detrás de la cazadora. Una flecha certera puede clavarla en el tronco del asaí sin herir a la doncella. Suelta la flecha cuando la marca pase por el blanco.'),
    ok: 'i_seta_ok', fail: 'i_seta_no' });
  sc('i_seta_ok', { act: 1, loc: 'campina', time: 'tarde', fx: { afeto: 2, fama: 1 }, text: L(
    'A seta obedece, pregando no tronco do açaí a faixa que flutuava ao vento. — “A filha dos tocantins tem no pé as asas do beija-flor; mas a seta de Jaguarê voa como o gavião.” A virgem volta, admirada.',
    'The arrow obeys, pinning to the açaí trunk the sash that streamed in the wind. “The daughter of the Tocantins has hummingbird wings on her feet; but Jaguarê’s arrow flies like the hawk.” The maiden returns, amazed.',
    'La freccia obbedisce e inchioda al tronco dell’açaí la fascia che ondeggiava al vento. «La figlia dei tocantins ha ai piedi le ali del colibrì; ma la freccia di Jaguarê vola come lo sparviero.» La fanciulla torna, ammirata.',
    'La flecha obedece y clava en el tronco del asaí la faja que flotaba al viento. «La hija de los tocantins tiene en el pie las alas del colibrí; pero la flecha de Jaguarê vuela como el gavilán.» La doncella vuelve, admirada.'),
    choices: [{ t: L('Ouvir seu nome', 'Hear her name', 'Ascoltare il suo nome', 'Oír su nombre'), go: 'i_nome_araci' }] });
  sc('i_seta_no', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'A seta passa rente às penas e some no capim. A caçadora para à beira da mata e ri do caçador. Mas volta, curiosa de conhecer o guerreiro que a seguiu tão longe.',
    'The arrow skims the feathers and vanishes in the grass. The huntress stops at the edge of the woods and laughs at the hunter. But she comes back, curious to know the warrior who followed her so far.',
    'La freccia sfiora le piume e sparisce nell’erba. La cacciatrice si ferma al limite del bosco e ride del cacciatore. Ma torna, curiosa di conoscere il guerriero che l’ha seguita così lontano.',
    'La flecha roza las plumas y se pierde en el pasto. La cazadora se detiene al borde del monte y se ríe del cazador. Pero vuelve, curiosa de conocer al guerrero que la siguió tan lejos.'),
    choices: [{ t: L('Ouvir seu nome', 'Hear her name', 'Ascoltare il suo nome', 'Oír su nombre'), go: 'i_nome_araci' }] });
  sc('i_nome_araci', { act: 1, loc: 'campina', time: 'tarde', text: L(
    '— “Eu sou Araci, a estrela do dia, filha de Itaquê, pai da grande nação tocantim. Cem dos melhores guerreiros o servem em sua cabana para merecer que ele o escolha por filho. O mais forte e valente me terá por esposa. Vem comigo, guerreiro araguaia.”',
    '“I am Araci, the star of the day, daughter of Itaquê, father of the great Tocantin nation. A hundred of the best warriors serve him in his lodge to earn his choice as a son. The strongest and bravest will have me as his wife. Come with me, Araguaia warrior.”',
    '«Io sono Araci, la stella del giorno, figlia di Itaquê, padre della grande nazione tocantin. Cento dei migliori guerrieri lo servono nella sua capanna per meritare che li scelga come figli. Il più forte e valoroso mi avrà in sposa. Vieni con me, guerriero araguaia.»',
    '«Yo soy Araci, la estrella del día, hija de Itaquê, padre de la gran nación tocantín. Cien de los mejores guerreros lo sirven en su cabaña para merecer que los elija por hijo. El más fuerte y valiente me tendrá por esposa. Ven conmigo, guerrero araguaia.»'),
    choices: [
      { t: L('“Jaguarê veio combater e ganhar um nome de guerra. Desafia os teus cem guerreiros.”', '“Jaguarê came to fight and win a war name. He challenges your hundred warriors.”', '«Jaguarê è venuto a combattere e a guadagnare un nome di guerra. Sfida i tuoi cento guerrieri.»', '«Jaguarê vino a combatir y ganar un nombre de guerra. Desafía a tus cien guerreros.»'), go: 'i_pojuca', fx: { honra: 1 } },
      { t: L('“Irei contigo servir teu pai.”', '“I will go with you and serve your father.”', '«Verrò con te a servire tuo padre.»', '«Iré contigo a servir a tu padre.»'), go: 'i_ainda_nao' },
    ] });
  sc('i_ainda_nao', { act: 1, loc: 'campina', time: 'tarde', fx: { afeto: 1 }, text: L(
    'Araci baixa os olhos. — Um caçador sem nome de guerra não entra entre os servos do amor. Ganha primeiro o teu nome, Jaguarê. E some na selva. Pouco depois, do outro lado da campina, assoma um guerreiro.',
    'Araci lowers her eyes. “A hunter without a war name cannot join the servants of love. Win your name first, Jaguarê.” And she vanishes into the forest. Soon after, on the far side of the field, a warrior appears.',
    'Araci abbassa gli occhi. «Un cacciatore senza nome di guerra non entra tra i servi dell’amore. Guadagna prima il tuo nome, Jaguarê.» E sparisce nella selva. Poco dopo, dall’altro lato della prateria, compare un guerriero.',
    'Araci baja los ojos. —Un cazador sin nombre de guerra no entra entre los siervos del amor. Gana primero tu nombre, Jaguarê. Y desaparece en la selva. Poco después, al otro lado de la llanura, asoma un guerrero.'),
    choices: [{ t: L('Encarar o guerreiro', 'Face the warrior', 'Affrontare il guerriero', 'Encarar al guerrero'), go: 'i_pojuca' }] });
  sc('i_pojuca', { act: 1, loc: 'campina', time: 'tarde', met: 'pojuca', text: L(
    'Tem na cabeça o canitar de plumas de tucano e no punho do tacape uma franja das mesmas penas: é um guerreiro tocantim. As duas nações não estão em guerra; mas, sem quebra da fé, um guerreiro pode oferecer a outro combate leal.',
    'He wears a headdress of toucan plumes and a fringe of the same feathers on the grip of his war club: a Tocantin warrior. The two nations are not at war; but, without breach of faith, one warrior may offer another a fair fight.',
    'Porta in capo il copricapo di piume di tucano e sull’impugnatura della mazza una frangia delle stesse piume: è un guerriero tocantin. Le due nazioni non sono in guerra; ma, senza rompere la fede, un guerriero può offrire a un altro un combattimento leale.',
    'Lleva en la cabeza el penacho de plumas de tucán y en el puño del tacape un fleco de las mismas plumas: es un guerrero tocantín. Las dos naciones no están en guerra; pero, sin quebrar la fe, un guerrero puede ofrecer a otro un combate leal.'),
    choices: [
      { t: L('Disparar uma seta no ar, mensageira do desafio', 'Shoot an arrow into the air, messenger of the challenge', 'Scoccare una freccia in aria, messaggera della sfida', 'Disparar una flecha al aire, mensajera del desafío'), go: 'i_bravatas', fx: { honra: 1 }, saber: 'desafio' },
      { t: L('Atacar de surpresa', 'Attack by surprise', 'Attaccare di sorpresa', 'Atacar por sorpresa'), go: 'i_surpresa', fx: { honra: -3 } },
    ] });
  sc('i_surpresa', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'O tocantim salta de lado e baixa o tacape com desprezo. — As nações não estão em guerra. Quem ataca sem a seta do desafio não é guerreiro: é matador de caça. Mesmo assim, ele dispara uma seta no ar: aceita o combate, para ensinar-te a lei.',
    'The Tocantin leaps aside and lowers his club in contempt. “Our nations are not at war. Whoever attacks without the arrow of challenge is no warrior but a killer of game.” Even so, he shoots an arrow into the air: he accepts the fight, to teach you the law.',
    'Il tocantin balza di lato e abbassa la mazza con disprezzo. «Le nazioni non sono in guerra. Chi attacca senza la freccia della sfida non è guerriero: è uccisore di selvaggina.» Ciononostante scocca una freccia in aria: accetta il combattimento, per insegnarti la legge.',
    'El tocantín salta a un lado y baja el tacape con desprecio. —Las naciones no están en guerra. Quien ataca sin la flecha del desafío no es guerrero: es matador de caza. Aun así, dispara una flecha al aire: acepta el combate, para enseñarte la ley.'),
    choices: [{ t: L('Ouvir o tocantim', 'Hear the Tocantin', 'Ascoltare il tocantin', 'Oír al tocantín'), go: 'i_bravatas' }] });
  sc('i_bravatas', { act: 1, loc: 'campina', time: 'tarde', text: L(
    '— “O caraíba guiou teu passo ao encontro de Pojucã, o matador de gente, guerreiro chefe da terrível nação tocantim. Tu não és digno dos golpes de um guerreiro chefe; mas Pojucã se compadece de tua mocidade e consente em combater contigo.”',
    '“The spirit guided your steps to Pojucã, the slayer of men, war chief of the terrible Tocantin nation. You are not worthy of a war chief’s blows; but Pojucã pities your youth and consents to fight you.”',
    '«Il caraíba ha guidato il tuo passo verso Pojucã, l’uccisore di uomini, capo guerriero della terribile nazione tocantin. Non sei degno dei colpi di un capo guerriero; ma Pojucã ha pietà della tua giovinezza e accetta di combattere con te.»',
    '«El caraíba guió tu paso al encuentro de Pojucã, el matador de gente, guerrero jefe de la terrible nación tocantín. No eres digno de los golpes de un guerrero jefe; pero Pojucã se compadece de tu juventud y consiente en combatir contigo.»'),
    choices: [
      { t: L('“Tua morte será a primeira façanha do caçador araguaia.”', '“Your death will be the Araguaia hunter’s first deed.”', '«La tua morte sarà la prima impresa del cacciatore araguaia.»', '«Tu muerte será la primera hazaña del cazador araguaia.»'), go: 'i_duelo1', fx: { fama: 1 } },
      { t: L('“Jaguarê agradece a Tupã que te fez um grande guerreiro.”', '“Jaguarê thanks Tupã, who made you a great warrior.”', '«Jaguarê ringrazia Tupã che ti ha fatto grande guerriero.»', '«Jaguarê agradece a Tupã que te hizo un gran guerrero.»'), go: 'i_duelo1', fx: { honra: 1 } },
    ] });
  sc('i_duelo1', { act: 1, loc: 'campina', time: 'tarde', type: 'combat', foe: 'pojuca1', text: L(
    'Os dois campeões recuam a um tiro de arco, soltam o grito de guerra e se arremessam um contra o outro brandindo o tacape.',
    'The two champions draw back a bowshot apart, raise the war cry and hurl themselves at each other swinging their clubs.',
    'I due campioni arretrano a un tiro d’arco, lanciano il grido di guerra e si scagliano l’uno contro l’altro brandendo la mazza.',
    'Los dos campeones retroceden a un tiro de arco, lanzan el grito de guerra y se arrojan uno contra otro blandiendo el tacape.'),
    win: 'i_tacapes', lose: 'end_cativo' });
  sc('i_tacapes', { act: 1, loc: 'campina', time: 'tarde', text: L(
    'Ainda uma vez os tacapes se encontram e voam em lascas pelos ares. Pojucã estende os braços e estreita os rins de Jaguarê, que por sua vez cinge os lombos do guerreiro. Cada um põe na luta todas as suas forças.',
    'Once more the clubs meet and fly to splinters. Pojucã reaches out and clasps Jaguarê round the waist, and Jaguarê grips the warrior in turn. Each puts all his strength into the struggle.',
    'Ancora una volta le mazze si scontrano e volano in schegge. Pojucã tende le braccia e stringe i fianchi di Jaguarê, che a sua volta cinge il guerriero. Ognuno mette nella lotta tutte le sue forze.',
    'Una vez más los tacapes se encuentran y vuelan en astillas. Pojucã extiende los brazos y aprieta la cintura de Jaguarê, que a su vez ciñe al guerrero. Cada uno pone en la lucha todas sus fuerzas.'),
    choices: [{ t: L('Lutar corpo a corpo', 'Wrestle', 'Lottare corpo a corpo', 'Luchar cuerpo a cuerpo'), test: { a: 'for', dc: 13, ok: 'i_luta', fail: 'i_luta', okFx: { fama: 1 }, failFx: { vigor: -2 } } }] });
  sc('i_luta', { act: 1, loc: 'campina', time: 'noite', text: L(
    'Ambos ficam imóveis, como dois jatobás que nasceram juntos. Um pajé que passa na orla da mata os esconjura, pensando que são almas presas no abraço da morte. A noite os acha na mesma posição. Conhecem que nenhum derrubará o outro. Jaguarê arranca da emburana a lança de duas pontas e a oferece a Pojucã, que a repele: um guerreiro tocantim não ataca adversário desarmado.',
    'Both stand motionless, like two jatobá trees that grew up together. A shaman passing at the forest’s edge makes a sign against them, thinking they are souls locked in death’s embrace. Night finds them in the same position. They know neither will throw the other. Jaguarê pulls the two-pointed spear from the emburana and offers it to Pojucã, who refuses: a Tocantin warrior never attacks an unarmed opponent.',
    'Restano entrambi immobili, come due jatobá nati insieme. Uno sciamano che passa al limite del bosco li scongiura, credendoli anime prese nell’abbraccio della morte. La notte li trova nella stessa posizione. Capiscono che nessuno dei due abbatterà l’altro. Jaguarê strappa dall’emburana la lancia a due punte e la offre a Pojucã, che la respinge: un guerriero tocantin non attacca un avversario disarmato.',
    'Ambos quedan inmóviles, como dos jatobás que nacieron juntos. Un pajé que pasa por la orilla del monte los conjura, creyendo que son almas presas en el abrazo de la muerte. La noche los halla en la misma posición. Saben que ninguno derribará al otro. Jaguarê arranca de la emburana la lanza de dos puntas y se la ofrece a Pojucã, que la rechaza: un guerrero tocantín no ataca a un adversario desarmado.'),
    saber: 'lanca',
    choices: [{ t: L('Aceitar a proposta de Pojucã: correr até a lança', 'Accept Pojucã’s proposal: race to the spear', 'Accettare la proposta di Pojucã: correre fino alla lancia', 'Aceptar la propuesta de Pojucã: correr hasta la lanza'), go: 'i_lanca' }] });
  sc('i_lanca', { act: 1, loc: 'rio', time: 'noite', text: L(
    '— “Finca no chão a lança e caminhemos até a margem do rio. Aquele que primeiro chegar será o senhor da lança e da vida do outro.” Os dois disparam a corrida.',
    '“Plant the spear in the ground and let us walk to the riverbank. Whoever reaches it first will be master of the spear and of the other’s life.” The two break into a run.',
    '«Pianta la lancia nel terreno e camminiamo fino alla riva del fiume. Chi arriverà per primo sarà signore della lancia e della vita dell’altro.» I due si lanciano nella corsa.',
    '«Clava la lanza en el suelo y caminemos hasta la orilla del río. Quien llegue primero será señor de la lanza y de la vida del otro.» Los dos echan a correr.'),
    choices: [{ t: L('Correr', 'Run', 'Correre', 'Correr'), test: { a: 'agi', dc: 11, ok: 'i_lanca2', fail: 'i_lanca2', okFx: { fama: 1 } } }] });
  sc('i_lanca2', { act: 1, loc: 'rio', time: 'noite', type: 'combat', foe: 'pojuca2', text: L(
    'Ao mesmo tempo a mão de ambos toca a haste; mas Jaguarê, arremessado pelo ímpeto, não consegue arrancá-la, e a arma fica na mão de Pojucã. O guerreiro chefe enrista desdenhosamente a lança e caminha para Jaguarê. Mas a lança conhece quem a fez.',
    'Both hands touch the shaft at the same moment; but Jaguarê, carried by his momentum, cannot wrench it free, and the weapon stays in Pojucã’s hand. The war chief levels the spear with disdain and walks toward Jaguarê. But the spear knows who made it.',
    'Nello stesso istante le mani di entrambi toccano l’asta; ma Jaguarê, trascinato dallo slancio, non riesce a strapparla, e l’arma resta in mano a Pojucã. Il capo guerriero punta con sdegno la lancia e avanza verso Jaguarê. Ma la lancia conosce chi l’ha fatta.',
    'Al mismo tiempo la mano de ambos toca el asta; pero Jaguarê, arrastrado por el ímpetu, no logra arrancarla, y el arma queda en la mano de Pojucã. El guerrero jefe apunta con desdén la lanza y camina hacia Jaguarê. Pero la lanza conoce a quien la hizo.'),
    win: 'i_vitoria', lose: 'end_cativo' });
  sc('i_vitoria', { act: 1, loc: 'rio', time: 'noite', fx: { fama: 3 }, text: L(
    'Pojucã desfecha o golpe; mas a lança roda e é o chefe tocantim quem recebe no peito a ponta farpada. Quando o corpo robusto tomba, Jaguarê calca a mão direita sobre o ombro esquerdo do vencido e solta o grito do triunfo: — “Eu sou Ubirajara, o senhor da lança, o guerreiro invencível que tem por arma a serpente.”',
    'Pojucã strikes; but the spear turns and it is the Tocantin chief who takes the barbed point in his chest. As the mighty body falls, Jaguarê presses his right hand on the left shoulder of the defeated and raises the cry of triumph: “I am Ubirajara, lord of the spear, the invincible warrior whose weapon is a serpent.”',
    'Pojucã sferra il colpo; ma la lancia ruota ed è il capo tocantin a ricevere nel petto la punta uncinata. Quando il corpo robusto cade, Jaguarê preme la mano destra sulla spalla sinistra del vinto e lancia il grido del trionfo: «Io sono Ubirajara, il signore della lancia, il guerriero invincibile che ha per arma il serpente.»',
    'Pojucã descarga el golpe; pero la lanza gira y es el jefe tocantín quien recibe en el pecho la punta dentada. Cuando el cuerpo robusto cae, Jaguarê pone la mano derecha sobre el hombro izquierdo del vencido y lanza el grito de triunfo: «Yo soy Ubirajara, el señor de la lanza, el guerrero invencible que tiene por arma la serpiente.»'),
    rename: true, saber: 'ombro',
    choices: [
      { t: L('Levar Pojucã como prisioneiro à festa da vitória', 'Take Pojucã as a prisoner to the victory feast', 'Portare Pojucã prigioniero alla festa della vittoria', 'Llevar a Pojucã como prisionero a la fiesta de la victoria'), go: 'ii_festa', fx: { ponto: 1 } },
    ] });
  // ---------------------------------------------------------------- Ato II · O guerreiro (cap. II)
  sc('ii_festa', { act: 2, loc: 'taba_ara', time: 'noite', text: L(
    'Retumba a festa na taba dos araguaias. As fogueiras circulam a ocara; o trocano chamou os guerreiros das outras tabas. No fundo, preside o conselho dos anciões. Suspenso diante deles está o grande arco da nação, ornado com penas vermelhas da arara. Por trás da estacada estão as mulheres, que pelo rito não entram nas festas guerreiras; entre elas, Jandira. Camacã troa a inúbia para pedir silêncio. É a hora do teu canto de guerra.',
    'The feast thunders in the Araguaia village. Fires ring the central plaza; the great drum has called the warriors of the other villages. At the far end sits the council of elders. Hanging before them is the nation’s great bow, adorned with red macaw feathers. Behind the palisade stand the women, who by custom do not enter war feasts; among them, Jandira. Camacã sounds the horn for silence. It is time for your war song.',
    'Rimbomba la festa nel villaggio degli araguaia. I fuochi circondano la piazza; il grande tamburo ha chiamato i guerrieri degli altri villaggi. In fondo presiede il consiglio degli anziani. Appeso davanti a loro c’è il grande arco della nazione, ornato di piume rosse d’ara. Dietro la palizzata stanno le donne, che per rito non entrano nelle feste guerriere; tra loro, Jandira. Camacã suona il corno per chiedere silenzio. È l’ora del tuo canto di guerra.',
    'Retumba la fiesta en la aldea de los araguaias. Las hogueras rodean la plaza; el gran tambor llamó a los guerreros de las otras aldeas. Al fondo preside el consejo de los ancianos. Colgado delante de ellos está el gran arco de la nación, adornado con plumas rojas de guacamayo. Detrás de la empalizada están las mujeres, que por el rito no entran en las fiestas guerreras; entre ellas, Jandira. Camacã toca la inúbia para pedir silencio. Es la hora de tu canto de guerra.'),
    saber: 'trocano',
    choices: [
      { t: L('Cantar a grandeza de Pojucã, o vencido', 'Sing the greatness of Pojucã, the defeated', 'Cantare la grandezza di Pojucã, il vinto', 'Cantar la grandeza de Pojucã, el vencido'), go: 'ii_pojuca_fala', fx: { honra: 2 } },
      { t: L('Cantar a força do próprio braço', 'Sing the strength of your own arm', 'Cantare la forza del proprio braccio', 'Cantar la fuerza del propio brazo'), go: 'ii_pojuca_fala', fx: { fama: 2 } },
    ] });
  sc('ii_pojuca_fala', { act: 2, loc: 'taba_ara', time: 'noite', text: L(
    'Pojucã, no corpo que a ferida não abateu, mostra a grande alma. Ergue a mão e fala: — “Tupã, cansado de ouvir celebrar em todas as festas o nome de Pojucã como vencedor, emprestou sua força a Jaguarê, o maior guerreiro que já pisou a terra.” A multidão clama: — “Tu és Ubirajara, o senhor da lança!” O trocano ribomba e os tacapes batem nos escudos.',
    'Pojucã, his body unbowed by the wound, shows his great soul. He raises his hand and speaks: “Tupã, tired of hearing Pojucã’s name sung as victor at every feast, lent his strength to Jaguarê, the greatest warrior who ever walked the earth.” The crowd cries: “You are Ubirajara, lord of the spear!” The drum booms and clubs strike shields.',
    'Pojucã, nel corpo che la ferita non ha piegato, mostra la sua grande anima. Alza la mano e parla: «Tupã, stanco di sentir celebrare in ogni festa il nome di Pojucã vincitore, ha prestato la sua forza a Jaguarê, il più grande guerriero che abbia calcato la terra.» La folla grida: «Tu sei Ubirajara, il signore della lancia!» Il tamburo rimbomba e le mazze battono sugli scudi.',
    'Pojucã, en el cuerpo que la herida no abatió, muestra su gran alma. Alza la mano y habla: «Tupã, cansado de oír celebrar en todas las fiestas el nombre de Pojucã como vencedor, prestó su fuerza a Jaguarê, el mayor guerrero que ha pisado la tierra.» La multitud clama: «¡Tú eres Ubirajara, el señor de la lanza!» Retumba el tambor y los tacapes golpean los escudos.'),
    choices: [{ t: L('Ouvir Camacã', 'Listen to Camacã', 'Ascoltare Camacã', 'Escuchar a Camacã'), go: 'ii_arco' }] });
  sc('ii_arco', { act: 2, loc: 'taba_ara', time: 'noite', text: L(
    'O velho Camacã alcança o grande arco, insígnia do chefe na guerra. É de ubiratã, grosso como o braço do mais robusto guerreiro; a corda trançada de crautá tem a grossura do dedo. — “Ubirajara, senhor da lança, é tempo de empunhares o grande arco da nação araguaia, que deve estar na mão do mais possante.”',
    'Old Camacã takes down the great bow, the war chief’s insignia. It is of ubiratã wood, as thick as the arm of the strongest warrior; its braided crautá cord is as thick as a finger. “Ubirajara, lord of the spear, it is time you held the great bow of the Araguaia nation, which must be in the hand of the mightiest.”',
    'Il vecchio Camacã prende il grande arco, insegna del capo in guerra. È di ubiratã, spesso come il braccio del guerriero più robusto; la corda intrecciata di crautá è grossa come un dito. «Ubirajara, signore della lancia, è tempo che tu impugni il grande arco della nazione araguaia, che deve stare nella mano del più possente.»',
    'El viejo Camacã alcanza el gran arco, insignia del jefe en la guerra. Es de ubiratã, grueso como el brazo del guerrero más robusto; la cuerda trenzada de crautá tiene el grosor de un dedo. «Ubirajara, señor de la lanza, es tiempo de que empuñes el gran arco de la nación araguaia, que debe estar en la mano del más poderoso.»'),
    saber: 'arco',
    choices: [
      { t: L('Atirar o arco no meio da ocara e desafiar quem o quiser disputar', 'Throw the bow into the plaza and challenge anyone to contest it', 'Gettare l’arco in mezzo alla piazza e sfidare chi voglia contenderlo', 'Arrojar el arco en medio de la plaza y desafiar a quien quiera disputarlo'), go: 'ii_arco2', fx: { fama: 2, honra: 1 } },
      { t: L('Receber o arco das mãos do pai', 'Receive the bow from your father’s hands', 'Ricevere l’arco dalle mani del padre', 'Recibir el arco de manos del padre'), go: 'ii_arco2' },
    ] });
  sc('ii_arco2', { act: 2, loc: 'taba_ara', time: 'noite', text: L(
    'Nenhuma voz se ergue; nenhum campeão avança. Os mais possantes varões, a custo, empunham o grande arco; só um tinha força para disparar a seta: Camacã. Agora é a tua vez.',
    'No voice is raised; no champion steps forward. The mightiest men can barely hold the great bow; only one had the strength to loose an arrow: Camacã. Now it is your turn.',
    'Nessuna voce si alza; nessun campione avanza. I più possenti a fatica impugnano il grande arco; uno solo aveva la forza di scoccare la freccia: Camacã. Ora tocca a te.',
    'Ninguna voz se alza; ningún campeón avanza. Los más poderosos apenas empuñan el gran arco; solo uno tenía fuerza para disparar la flecha: Camacã. Ahora es tu turno.'),
    choices: [{ t: L('Vergar o grande arco', 'Draw the great bow', 'Tendere il grande arco', 'Tensar el gran arco'), test: { a: 'for', dc: 11, bonus: 'fama', ok: 'ii_arco_ok', fail: 'ii_arco_no' } }] });
  sc('ii_arco_no', { act: 2, loc: 'taba_ara', time: 'noite', fx: { vigor: -2 }, text: L(
    'A corda de crautá geme, mas a seta não parte. A ferida do combate ainda pesa no braço. Os guerreiros esperam em silêncio. Respire e tente outra vez.',
    'The crautá cord groans, but the arrow does not fly. The wound of the duel still weighs on your arm. The warriors wait in silence. Breathe and try again.',
    'La corda di crautá geme, ma la freccia non parte. La ferita del duello pesa ancora sul braccio. I guerrieri aspettano in silenzio. Respira e riprova.',
    'La cuerda de crautá gime, pero la flecha no parte. La herida del combate aún pesa en el brazo. Los guerreros esperan en silencio. Respira e inténtalo otra vez.'),
    choices: [{ t: L('Vergar o grande arco', 'Draw the great bow', 'Tendere il grande arco', 'Tensar el gran arco'), test: { a: 'for', dc: 9, bonus: 'fama', ok: 'ii_arco_ok', fail: 'ii_arco_no' } }] });
  sc('ii_arco_ok', { act: 2, loc: 'taba_ara', time: 'noite', fx: { fama: 2, ponto: 1 }, item: 'grande_arco', text: L(
    'Ubirajara levanta o grande arco, e a corda zune como o vento na floresta. É a primeira seta, mensageira do chefe, que leva às nuvens a sua fama. As mulheres trazem vasos de cauim aos guerreiros. Jandira suspira: ainda virgem, não pode encher a taça do seu herói. A dança guerreira dura até perto da alvorada.',
    'Ubirajara lifts the great bow and the cord hums like wind in the forest. It is the first arrow, the chief’s messenger, carrying his fame to the clouds. The women bring jars of cauim to the warriors. Jandira sighs: still unmarried, she may not fill her hero’s cup. The war dance lasts until nearly dawn.',
    'Ubirajara solleva il grande arco e la corda sibila come il vento nella foresta. È la prima freccia, messaggera del capo, che porta la sua fama alle nuvole. Le donne portano vasi di cauim ai guerrieri. Jandira sospira: ancora nubile, non può riempire la coppa del suo eroe. La danza guerriera dura fin quasi all’alba.',
    'Ubirajara levanta el gran arco y la cuerda zumba como el viento en el bosque. Es la primera flecha, mensajera del jefe, que lleva a las nubes su fama. Las mujeres traen vasijas de cauim a los guerreros. Jandira suspira: todavía doncella, no puede llenar la copa de su héroe. La danza guerrera dura hasta cerca del alba.'),
    saber: 'cauim',
    choices: [{ t: L('Descansar na rede', 'Rest in the hammock', 'Riposare nell’amaca', 'Descansar en la hamaca'), go: 'iii_sonho', fx: { vigor: 99 } }] });

  // ---------------------------------------------------------------- Ato III · A noiva (cap. III)
  sc('iii_sonho', { act: 3, loc: 'floresta', time: 'manha', text: L(
    'Jandira acorda certa de que dormiu a última noite na cabana paterna: arrumou no uru a louça que fez para o guerreiro e perfumou a rede de casamento. Mas Ubirajara não vem. À noite, Araci lhe apareceu em sonho e o chamou. Ao raiar da luz ele vaga no mais escuro da mata, para as bandas do grande rio. Jandira segue seu rastro e o encontra.',
    'Jandira wakes sure she has slept her last night in her father’s lodge: she has packed the pottery she made for the warrior and perfumed the wedding hammock. But Ubirajara does not come. In the night Araci appeared to him in a dream and called him. At first light he wanders in the darkest part of the forest, toward the great river. Jandira follows his trail and finds him.',
    'Jandira si sveglia certa di aver dormito l’ultima notte nella capanna paterna: ha riposto le stoviglie fatte per il guerriero e profumato l’amaca nuziale. Ma Ubirajara non viene. Di notte Araci gli è apparsa in sogno e lo ha chiamato. All’alba vaga nel punto più buio del bosco, verso il grande fiume. Jandira segue la sua traccia e lo trova.',
    'Jandira despierta segura de haber dormido la última noche en la cabaña paterna: guardó la loza que hizo para el guerrero y perfumó la hamaca de bodas. Pero Ubirajara no viene. De noche, Araci se le apareció en sueños y lo llamó. Al rayar el día vaga por lo más oscuro del monte, hacia el gran río. Jandira sigue su rastro y lo encuentra.'),
    met: 'jandira',
    choices: [
      { t: L('Dizer a verdade com cuidado: a tristeza entrou em seu coração', 'Tell the truth gently: sadness has entered his heart', 'Dire la verità con delicatezza: la tristezza gli è entrata nel cuore', 'Decir la verdad con cuidado: la tristeza entró en su corazón'), go: 'iii_jandira', fx: { honra: 1 } },
      { t: L('Calar e seguir para o rio', 'Say nothing and go on to the river', 'Tacere e proseguire verso il fiume', 'Callar y seguir hacia el río'), go: 'iii_jandira' },
    ] });
  sc('iii_jandira', { act: 3, loc: 'floresta', time: 'manha', text: L(
    'Jandira esconde a dor e chama o riso aos lábios: — “Teu amor, Ubirajara, ficará em meu seio como a flor no vale.” Ele responde que ela é a mais bela das virgens araguaias e merece um guerreiro que tenha olhos para sua formosura; mas a noite desceu em sua alma, e só a estrela do dia pode restituir-lhe a alegria.',
    'Jandira hides her pain and calls a smile to her lips: “Your love, Ubirajara, will stay in my heart like a flower in the valley.” He replies that she is the most beautiful of the Araguaia maidens and deserves a warrior with eyes for her beauty; but night has fallen on his soul, and only the star of the day can bring back his joy.',
    'Jandira nasconde il dolore e chiama il sorriso alle labbra: «Il tuo amore, Ubirajara, resterà nel mio seno come il fiore nella valle.» Lui risponde che è la più bella delle fanciulle araguaia e merita un guerriero che abbia occhi per la sua bellezza; ma la notte è scesa nella sua anima, e solo la stella del giorno può rendergli la gioia.',
    'Jandira esconde el dolor y llama la sonrisa a sus labios: «Tu amor, Ubirajara, quedará en mi pecho como la flor en el valle.» Él responde que ella es la más bella de las doncellas araguaias y merece un guerrero que tenga ojos para su hermosura; pero la noche bajó a su alma, y solo la estrella del día puede devolverle la alegría.'),
    choices: [{ t: L('Voltar à taba, onde Pojucã espera', 'Return to the village, where Pojucã waits', 'Tornare al villaggio, dove Pojucã attende', 'Volver a la aldea, donde Pojucã espera'), go: 'iii_pojuca' }] });
  sc('iii_pojuca', { act: 3, loc: 'taba_ara', time: 'manha', text: L(
    'Pojucã está sentado à porta da cabana. Nada o arranca dali: a mão do vencedor sobre o ombro o prende mais do que a multidão dos guerreiros. Não é a ferida que o faz sofrer: o bálsamo da embaíba a sara depressa. Teme ser mantido escravo. — “Por que Ubirajara não concede a Pojucã a morte gloriosa, que os tocantins jamais recusaram a um guerreiro valente?”',
    'Pojucã sits at the door of the lodge. Nothing moves him from there: the victor’s hand on his shoulder binds him more than a crowd of guards. It is not the wound that pains him: embaíba balm heals it quickly. He fears being kept as a slave. “Why does Ubirajara not grant Pojucã the glorious death the Tocantins never refused a brave warrior?”',
    'Pojucã siede alla porta della capanna. Niente lo smuove: la mano del vincitore sulla spalla lo lega più di una folla di guardie. Non è la ferita a farlo soffrire: il balsamo dell’embaíba la guarisce presto. Teme di essere tenuto schiavo. «Perché Ubirajara non concede a Pojucã la morte gloriosa che i tocantins non hanno mai negato a un guerriero valoroso?»',
    'Pojucã está sentado a la puerta de la cabaña. Nada lo saca de allí: la mano del vencedor sobre el hombro lo ata más que una multitud de guardias. No es la herida lo que le hace sufrir: el bálsamo de la embaíba la sana pronto. Teme que lo retengan como esclavo. «¿Por qué Ubirajara no concede a Pojucã la muerte gloriosa que los tocantins nunca negaron a un guerrero valiente?»'),
    saber: 'embaiba',
    choices: [{ t: L('Prometer o combate da morte quando a ferida fechar', 'Promise the death combat when the wound has closed', 'Promettere il combattimento della morte quando la ferita si sarà chiusa', 'Prometer el combate de la muerte cuando la herida cierre'), go: 'iii_tumulo', fx: { honra: 1 } }] });
  sc('iii_tumulo', { act: 3, loc: 'taba_ara', time: 'manha', narr: true, text: L(
    'No romance, Ubirajara dá Jandira a Pojucã como “esposa do túmulo”, segundo o costume que Alencar atribui às nações: a mais nobre virgem acompanha o prisioneiro até o suplício. Jandira recusa — “no amor de Jandira, ninguém manda, nem Tupã” — e Pojucã, generoso, a manda fugir da cólera dos anciões. Ela foge para a floresta e canta sua dor à sombra de um manacá. O jogo narra este episódio como está no livro e não o deixa à escolha do jogador.',
    'In the novel, Ubirajara gives Jandira to Pojucã as a “wife of the grave”, following the custom Alencar attributes to these nations: the noblest maiden accompanies the prisoner until his execution. Jandira refuses — “in Jandira’s love no one commands, not even Tupã” — and Pojucã, generously, tells her to flee the elders’ anger. She flees into the forest and sings her grief in the shade of a manacá tree. The game narrates this episode as it is in the book and does not leave it to the player.',
    'Nel romanzo Ubirajara dà Jandira a Pojucã come «sposa della tomba», secondo il costume che Alencar attribuisce a queste nazioni: la fanciulla più nobile accompagna il prigioniero fino al supplizio. Jandira rifiuta — «nell’amore di Jandira nessuno comanda, nemmeno Tupã» — e Pojucã, generoso, la manda a fuggire dall’ira degli anziani. Lei fugge nella foresta e canta il suo dolore all’ombra di un manacá. Il gioco narra questo episodio com’è nel libro e non lo lascia alla scelta del giocatore.',
    'En la novela, Ubirajara entrega a Jandira a Pojucã como «esposa de la tumba», según la costumbre que Alencar atribuye a estas naciones: la doncella más noble acompaña al prisionero hasta el suplicio. Jandira se niega —«en el amor de Jandira nadie manda, ni Tupã»— y Pojucã, generoso, le dice que huya de la ira de los ancianos. Ella huye al bosque y canta su dolor a la sombra de un manacá. El juego narra este episodio como está en el libro y no lo deja a elección del jugador.'),
    choices: [{ t: L('Ir ao conselho dos anciões', 'Go to the council of elders', 'Andare al consiglio degli anziani', 'Ir al consejo de los ancianos'), go: 'iii_conselho' }] });
  sc('iii_conselho', { act: 3, loc: 'taba_ara', time: 'tarde', text: L(
    'Os anciões ouvem o chefe dos chefes. Ubirajara parte e só voltará na próxima lua para o suplício de Pojucã. Antes, deixa a ordem para a guerra: se na sua ausência cair na taba a flecha núncia da guerra, que levem o trocano ao sítio onde se abraçam os grandes rios e soltem a voz da nação. — “Nesse dia Ubirajara será convosco.” — “Ela entrou no espírito dos anciões como a raiz no seio da terra”, responde o velho Majé.',
    'The elders hear the chief of chiefs. Ubirajara is leaving and will return only at the next moon for Pojucã’s execution. First he leaves his orders for war: if in his absence the arrow that announces war falls in the village, they must carry the great drum to the place where the great rivers embrace and let the nation’s voice ring out. “On that day Ubirajara will be with you.” “It has entered the elders’ minds as a root enters the earth,” answers old Majé.',
    'Gli anziani ascoltano il capo dei capi. Ubirajara parte e tornerà solo alla prossima luna per il supplizio di Pojucã. Prima lascia l’ordine per la guerra: se in sua assenza cadrà nel villaggio la freccia che annuncia la guerra, portino il grande tamburo al luogo dove si abbracciano i grandi fiumi e facciano risuonare la voce della nazione. «Quel giorno Ubirajara sarà con voi.» «È entrata nello spirito degli anziani come la radice nel seno della terra», risponde il vecchio Majé.',
    'Los ancianos escuchan al jefe de jefes. Ubirajara parte y solo volverá en la próxima luna para el suplicio de Pojucã. Antes deja la orden para la guerra: si en su ausencia cae en la aldea la flecha que anuncia la guerra, que lleven el gran tambor al lugar donde se abrazan los grandes ríos y suelten la voz de la nación. «Ese día Ubirajara estará con vosotros.» «Entró en el espíritu de los ancianos como la raíz en el seno de la tierra», responde el viejo Majé.'),
    choices: [{ t: L('Partir para o vale dos tocantins, sem o cocar araguaia', 'Leave for the valley of the Tocantins, without the Araguaia headdress', 'Partire per la valle dei tocantins, senza il copricapo araguaia', 'Partir hacia el valle de los tocantins, sin el penacho araguaia'), go: 'iv_viagem', fx: { ponto: 1 } }] });

  // ---------------------------------------------------------------- Ato IV · A hospitalidade (cap. IV)
  sc('iv_viagem', { act: 4, type: 'explore', start: 'confluencia', slots: 4, title: L('Pelo caminho do grande rio', 'Along the great river', 'Lungo il grande fiume', 'Por el camino del gran río'),
    text: L('O vale dos tocantins fica rio acima. Caminhe até lá, caçando e pescando pelo caminho.', 'The valley of the Tocantins lies upriver. Walk there, hunting and fishing along the way.', 'La valle dei tocantins è risalendo il fiume. Cammina fin là, cacciando e pescando lungo la strada.', 'El valle de los tocantins queda río arriba. Camina hasta allí, cazando y pescando por el camino.'),
    finish: { at: 'taba_toc', label: L('Aproximar-se da taba dos tocantins', 'Approach the Tocantin village', 'Avvicinarsi al villaggio dei tocantins', 'Acercarse a la aldea de los tocantins'), go: 'iv_chegada' } });
  sc('iv_chegada', { act: 4, loc: 'taba_toc', time: 'dia', text: L(
    'Na entrada do vale ergue-se a grande taba dos tocantins. É a hora em que o sol descansa no meio da carreira e a floresta emudece. Você está à distância de um tiro de flecha despedida pelo mais robusto guerreiro. Como se anunciar?',
    'At the mouth of the valley stands the great Tocantin village. It is the hour when the sun rests at mid-course and the forest falls silent. You are an arrow’s flight away, as shot by the strongest warrior. How do you announce yourself?',
    'All’ingresso della valle sorge il grande villaggio dei tocantins. È l’ora in cui il sole riposa a metà corsa e la foresta tace. Sei alla distanza di un tiro di freccia scoccata dal guerriero più robusto. Come annunciarti?',
    'A la entrada del valle se alza la gran aldea de los tocantins. Es la hora en que el sol descansa en medio de su carrera y el bosque enmudece. Estás a la distancia de un tiro de flecha lanzada por el guerrero más robusto. ¿Cómo anunciarte?'),
    choices: [
      { t: L('Tocar a inúbia, quebrar a seta e alçar a mão direita', 'Sound the horn, break an arrow and raise the right hand', 'Suonare il corno, spezzare la freccia e alzare la mano destra', 'Tocar la inúbia, quebrar la flecha y alzar la mano derecha'), go: 'iv_entrada', fx: { honra: 1 }, saber: 'hospitalidade' },
      { t: L('Entrar calado, de arco na mão', 'Walk in silently, bow in hand', 'Entrare in silenzio, arco in mano', 'Entrar callado, con el arco en la mano'), go: 'iv_suspeita', fx: { honra: -1 } },
    ] });
  sc('iv_suspeita', { act: 4, loc: 'taba_toc', time: 'dia', text: L(
    'Os vigias erguem os arcos. Um velho guerreiro grita que só o inimigo chega sem a senha da paz. Você para, toca a inúbia, quebra a seta e alça a mão direita. Os arcos baixam, mas os olhares ficam desconfiados.',
    'The watchmen raise their bows. An old warrior shouts that only an enemy arrives without the sign of peace. You stop, sound the horn, break an arrow and raise your right hand. The bows are lowered, but the looks stay wary.',
    'Le sentinelle alzano gli archi. Un vecchio guerriero grida che solo il nemico arriva senza il segno della pace. Ti fermi, suoni il corno, spezzi la freccia e alzi la mano destra. Gli archi si abbassano, ma gli sguardi restano diffidenti.',
    'Los vigías alzan los arcos. Un viejo guerrero grita que solo el enemigo llega sin la señal de la paz. Te detienes, tocas la inúbia, quiebras la flecha y alzas la mano derecha. Los arcos bajan, pero las miradas siguen desconfiadas.'),
    choices: [{ t: L('Seguir para a entrada', 'Go on to the entrance', 'Proseguire verso l’ingresso', 'Seguir hacia la entrada'), go: 'iv_entrada' }] });
  sc('iv_entrada', { act: 4, loc: 'taba_toc', time: 'dia', text: L(
    'Na entrada da caiçara você atira ao chão a seta partida. Os guerreiros deixam passar o estrangeiro sem perguntar de onde vem: o hóspede manda na taba aonde Tupã o conduz. A figura de um tucano de barro pintado sobre a porta indica a cabana do grande chefe. — “O estrangeiro chegou.” Itaquê tece uma rede de penas de galo-da-serra à sombra da gameleira. Entrega a lançadeira a Pirajá e vem ao encontro do hóspede. Jacamim prepara o cachimbo.',
    'At the entrance of the stockade you throw the broken arrow to the ground. The warriors let the stranger pass without asking where he comes from: the guest commands in the village to which Tupã leads him. A painted clay toucan above a door marks the great chief’s lodge. “The stranger has arrived.” Itaquê is weaving a hammock of cock-of-the-rock feathers in the shade of a gameleira tree. He hands the shuttle to Pirajá and comes to meet his guest. Jacamim prepares the pipe.',
    'All’ingresso della palizzata getti a terra la freccia spezzata. I guerrieri lasciano passare lo straniero senza chiedergli da dove venga: l’ospite comanda nel villaggio dove Tupã lo conduce. Un tucano di argilla dipinta sopra una porta indica la capanna del grande capo. «Lo straniero è arrivato.» Itaquê tesse un’amaca di piume di galletto di roccia all’ombra di una gameleira. Consegna la spola a Pirajá e viene incontro all’ospite. Jacamim prepara la pipa.',
    'En la entrada de la empalizada arrojas al suelo la flecha partida. Los guerreros dejan pasar al extranjero sin preguntarle de dónde viene: el huésped manda en la aldea adonde Tupã lo conduce. Un tucán de barro pintado sobre una puerta señala la cabaña del gran jefe. «El extranjero llegó.» Itaquê teje una hamaca de plumas de gallito de roca a la sombra de una gameleira. Entrega la lanzadera a Pirajá y viene al encuentro del huésped. Jacamim prepara la pipa.'),
    saber: 'rede',
    choices: [{ t: L('Trocar a fumaça da hospitalidade', 'Share the smoke of hospitality', 'Scambiare il fumo dell’ospitalità', 'Intercambiar el humo de la hospitalidad'), go: 'iv_banquete' }] });
  sc('iv_banquete', { act: 4, loc: 'taba_toc', time: 'dia', fx: { vigor: 99, fome: -99 }, text: L(
    'Os cantores entoam a saudação: o hóspede é mensageiro de Tupã. As servas estendem esteiras de palmas de airi à sombra da gameleira e trazem urus cheios de farinha-d’água, moquecas envoltas em folhas, carne assada no biaribi e frutas: cachos de açaí, croás, abacaxis. Penduram a caça mais volumosa nos ramos e as igaçabas de cauim. Os guerreiros comem em silêncio. Depois, os anciões passam o cachimbo e discutem que nome dar ao hóspede, pois a lei da hospitalidade não deixa perguntar seu nome nem sua nação.',
    'The singers raise the greeting: the guest is Tupã’s messenger. The servants spread mats of airi palm in the shade of the gameleira and bring baskets of farinha-d’água, fish wrapped in leaves, meat roasted in the earth oven and fruit: bunches of açaí, croás, pineapples. They hang the largest game and the jars of cauim from the branches. The warriors eat in silence. Then the elders pass the pipe and discuss what name to give the guest, for the law of hospitality forbids asking his name or his nation.',
    'I cantori intonano il saluto: l’ospite è messaggero di Tupã. Le serve stendono stuoie di palma airi all’ombra della gameleira e portano ceste di farinha-d’água, pesce avvolto in foglie, carne arrostita nel forno di terra e frutta: grappoli di açaí, croás, ananas. Appendono ai rami la selvaggina più grossa e le giare di cauim. I guerrieri mangiano in silenzio. Poi gli anziani si passano la pipa e discutono che nome dare all’ospite, perché la legge dell’ospitalità vieta di chiedergli il nome o la nazione.',
    'Los cantores entonan el saludo: el huésped es mensajero de Tupã. Las siervas extienden esteras de palma de airi a la sombra de la gameleira y traen cestos llenos de farinha-d’água, moquecas envueltas en hojas, carne asada en el horno de tierra y frutas: racimos de asaí, croás, piñas. Cuelgan de las ramas la caza más grande y las tinajas de cauim. Los guerreros comen en silencio. Después los ancianos pasan la pipa y discuten qué nombre dar al huésped, pues la ley de la hospitalidad no permite preguntar su nombre ni su nación.'),
    saber: ['farinha', 'urucum'],
    choices: [
      { t: L('“Eu sou aquele que veio trazido pela luz do céu. Chama-me Jurandir.”', '“I am he who was brought by the light of the sky. Call me Jurandir.”', '«Io sono colui che è venuto portato dalla luce del cielo. Chiamami Jurandir.»', '«Yo soy aquel que vino traído por la luz del cielo. Llámame Jurandir.»'), go: 'iv_maranduba', fx: { alias: 'Jurandir', afeto: 1 } },
      { t: L('Aceitar o nome que Ipê propõe: Jutaí, o grande pinheiro', 'Accept the name Ipê proposes: Jutaí, the great tree', 'Accettare il nome proposto da Ipê: Jutaí, il grande albero', 'Aceptar el nombre que propone Ipê: Jutaí, el gran árbol'), go: 'iv_maranduba', fx: { alias: 'Jutaí' } },
    ] });
  sc('iv_maranduba', { act: 4, loc: 'taba_toc', time: 'tarde', text: L(
    'Araci chega entre as palmeiras com os servos do seu amor. Reconhece o caçador araguaia, mas a lei da hospitalidade a obriga a guardar o segredo. Os anciões esperam a maranduba, o relato do hóspede. Que histórias contar?',
    'Araci arrives among the palms with the servants of her love. She recognizes the Araguaia hunter, but the law of hospitality obliges her to keep his secret. The elders wait for the maranduba, the guest’s tale. Which stories will you tell?',
    'Araci arriva tra le palme con i servi del suo amore. Riconosce il cacciatore araguaia, ma la legge dell’ospitalità la obbliga a custodire il segreto. Gli anziani aspettano la maranduba, il racconto dell’ospite. Quali storie raccontare?',
    'Araci llega entre las palmeras con los siervos de su amor. Reconoce al cazador araguaia, pero la ley de la hospitalidad la obliga a guardar el secreto. Los ancianos esperan la maranduba, el relato del huésped. ¿Qué historias contar?'),
    choices: [
      { t: L('A pororoca: o grande rio combatendo o mar', 'The pororoca: the great river battling the sea', 'La pororoca: il grande fiume che combatte il mare', 'La pororoca: el gran río combatiendo al mar'), test: { a: 'pal', dc: 9, ok: 'iv_maranduba_ok', fail: 'iv_maranduba_meh' } },
      { t: L('As mulheres guerreiras que vivem sob as águas', 'The warrior women who live beneath the waters', 'Le donne guerriere che vivono sotto le acque', 'Las mujeres guerreras que viven bajo las aguas'), test: { a: 'pal', dc: 10, ok: 'iv_maranduba_ok', fail: 'iv_maranduba_meh', okFx: { afeto: 1 } } },
      { t: L('Os tupinambás e a resina amarela das praias', 'The Tupinambá and the yellow resin of the beaches', 'I tupinambá e la resina gialla delle spiagge', 'Los tupinambás y la resina amarilla de las playas'), test: { a: 'pal', dc: 9, ok: 'iv_maranduba_ok', fail: 'iv_maranduba_meh' }, saber: 'tupinamba' },
    ] });
  sc('iv_maranduba_ok', { act: 4, loc: 'taba_toc', time: 'tarde', fx: { fama: 2 }, text: L(
    'Os anciões admiram o juízo prudente de um ancião no corpo de tão forte guerreiro. Os mais velhos acreditam que o hóspede é filho de Sumé, o sábio que ensinou as nações a plantar a mandioca. Araci responde ao relato com um canto.',
    'The elders marvel at an old man’s prudent judgement in the body of so strong a warrior. The eldest believe the guest is a son of Sumé, the sage who taught the nations to plant manioc. Araci answers the tale with a song.',
    'Gli anziani ammirano il giudizio prudente di un vecchio nel corpo di un guerriero così forte. I più vecchi credono che l’ospite sia figlio di Sumé, il saggio che insegnò alle nazioni a piantare la manioca. Araci risponde al racconto con un canto.',
    'Los ancianos admiran el juicio prudente de un anciano en el cuerpo de tan fuerte guerrero. Los más viejos creen que el huésped es hijo de Sumé, el sabio que enseñó a las naciones a plantar la mandioca. Araci responde al relato con un canto.'),
    saber: 'mandioca',
    choices: [{ t: L('Continuar', 'Continue', 'Continua', 'Continuar'), go: 'iv_mulheres' }] });
  sc('iv_maranduba_meh', { act: 4, loc: 'taba_toc', time: 'tarde', text: L(
    'As palavras saem curtas; o hóspede é moço e ainda conta os anos pelos dedos. Os anciões escutam com respeito, como manda a lei, mas o velho Guaribu fecha os olhos e cochila. Araci sorri.',
    'The words come out short; the guest is young and still counts his years on his fingers. The elders listen respectfully, as the law commands, but old Guaribu closes his eyes and dozes. Araci smiles.',
    'Le parole escono brevi; l’ospite è giovane e conta ancora gli anni sulle dita. Gli anziani ascoltano con rispetto, come vuole la legge, ma il vecchio Guaribu chiude gli occhi e sonnecchia. Araci sorride.',
    'Las palabras salen cortas; el huésped es joven y aún cuenta los años con los dedos. Los ancianos escuchan con respeto, como manda la ley, pero el viejo Guaribu cierra los ojos y dormita. Araci sonríe.'),
    choices: [{ t: L('Continuar', 'Continue', 'Continua', 'Continuar'), go: 'iv_mulheres' }] });
  sc('iv_mulheres', { act: 4, loc: 'taba_toc', time: 'tarde', text: L(
    'À tarde, os jovens pescadores e caçadores vêm saber o que o hóspede deseja. O rito da hospitalidade manda dar ao estrangeiro tudo o que alegra o guerreiro, e as moças livres da taba vêm dançar para ele e oferecer companhia. Araci, à porta da cabana, enfia sementes de jequiriti num colar e finge olhar para a floresta.',
    'In the evening the young fishers and hunters come to ask what the guest desires. The rite of hospitality requires giving the stranger all that pleases a warrior, and the free young women of the village come to dance for him and offer their company. Araci, at the lodge door, strings jequiriti seeds into a necklace and pretends to look at the forest.',
    'La sera i giovani pescatori e cacciatori vengono a chiedere che cosa desideri l’ospite. Il rito dell’ospitalità vuole che si dia allo straniero tutto ciò che allieta il guerriero, e le giovani libere del villaggio vengono a danzare per lui e a offrirgli compagnia. Araci, alla porta della capanna, infila semi di jequiriti in una collana e finge di guardare la foresta.',
    'Por la tarde, los jóvenes pescadores y cazadores vienen a saber qué desea el huésped. El rito de la hospitalidad manda dar al extranjero todo lo que alegra al guerrero, y las mozas libres de la aldea vienen a bailar para él y a ofrecerle compañía. Araci, a la puerta de la cabaña, ensarta semillas de jequiriti en un collar y finge mirar el bosque.'),
    choices: [{ t: L('“Não vim gozar o amor de uma noite: vim buscar a esposa e a mãe de meus filhos.”', '“I did not come for one night’s love: I came to seek a wife and the mother of my children.”', '«Non sono venuto per l’amore di una notte: sono venuto a cercare la sposa e la madre dei miei figli.»', '«No vine a gozar el amor de una noche: vine a buscar a la esposa y madre de mis hijos.»'), go: 'iv_revelar', fx: { afeto: 2, honra: 1 } }] });
  sc('iv_revelar', { act: 4, loc: 'taba_toc', time: 'tarde', text: L(
    'Araci se cobre de sorrisos. — “Os sonhos disseram a Araci, duas noites seguidas, que o jovem caçador chegaria à cabana de Itaquê; ela te esperou.” Você pede que ela o conduza ao pai.',
    'Araci is covered in smiles. “Dreams told Araci, two nights in a row, that the young hunter would come to Itaquê’s lodge; she waited for you.” You ask her to lead you to her father.',
    'Araci si copre di sorrisi. «I sogni hanno detto ad Araci, per due notti di seguito, che il giovane cacciatore sarebbe arrivato alla capanna di Itaquê; lei ti ha atteso.» Le chiedi di condurti dal padre.',
    'Araci se cubre de sonrisas. «Los sueños le dijeron a Araci, dos noches seguidas, que el joven cazador llegaría a la cabaña de Itaquê; ella te esperó.» Le pides que te lleve ante su padre.'),
    choices: [{ t: L('Pedir a Itaquê para servi-lo como servo do amor', 'Ask Itaquê to serve him as a servant of love', 'Chiedere a Itaquê di servirlo come servo dell’amore', 'Pedir a Itaquê servirlo como siervo del amor'), go: 'v_servo', fx: { ponto: 1 } }] });

  // ---------------------------------------------------------------- Ato V · Servo do amor (cap. V)
  sc('v_servo', { act: 5, loc: 'taba_toc', time: 'tarde', text: L(
    '— “Araci é a filha de minha velhice”, diz Itaquê. “O guerreiro que conquistar uma esposa como Araci terá a glória de gerar seu valor no seio da virtude.” Desde esse momento você não é mais estrangeiro: pertence à oca de Itaquê e deve, como servo do amor, trabalhar para o pai da noiva. Os outros pretendentes conhecem que têm um adversário formidável.',
    '“Araci is the daughter of my old age,” says Itaquê. “The warrior who wins a wife like Araci will have the glory of begetting his valour in the bosom of virtue.” From this moment you are no longer a stranger: you belong to Itaquê’s lodge and must, as a servant of love, work for your bride’s father. The other suitors know they face a formidable rival.',
    '«Araci è la figlia della mia vecchiaia», dice Itaquê. «Il guerriero che conquisterà una sposa come Araci avrà la gloria di generare il suo valore nel seno della virtù.» Da questo momento non sei più straniero: appartieni alla capanna di Itaquê e devi, come servo dell’amore, lavorare per il padre della sposa. Gli altri pretendenti capiscono di avere un avversario formidabile.',
    '«Araci es la hija de mi vejez», dice Itaquê. «El guerrero que conquiste una esposa como Araci tendrá la gloria de engendrar su valor en el seno de la virtud.» Desde ese momento ya no eres extranjero: perteneces a la casa de Itaquê y debes, como siervo del amor, trabajar para el padre de la novia. Los otros pretendientes saben que tienen un adversario formidable.'),
    choices: [{ t: L('Começar o trabalho', 'Begin the work', 'Cominciare il lavoro', 'Empezar el trabajo'), go: 'v_trabalho' }] });
  sc('v_trabalho', { act: 5, type: 'service', days: 4, title: L('Servo do amor', 'Servant of love', 'Servo dell’amore', 'Siervo del amor'),
    text: L('Por quatro sóis, escolha dois trabalhos em cada dia. A provisão da cabana de Itaquê e o afeto de Araci contam para as provas do casamento.', 'For four suns, choose two tasks each day. The provisions for Itaquê’s lodge and Araci’s affection count for the wedding trials.', 'Per quattro soli, scegli due lavori ogni giorno. Le provviste per la capanna di Itaquê e l’affetto di Araci contano per le prove del matrimonio.', 'Durante cuatro soles, elige dos trabajos cada día. La provisión de la cabaña de Itaquê y el afecto de Araci cuentan para las pruebas de la boda.'),
    event: { day: 3, go: 'v_jandira' }, done: 'vi_campo' });
  sc('v_jandira', { act: 5, loc: 'floresta', time: 'manha', text: L(
    'Na véspera você viu na floresta um rastro conhecido. Hoje, Araci entra na mata atrás de uma arara para tirar as plumas vermelhas do cocar que tece em segredo. Um rumor ao lado: você segura o braço de uma mulher que ainda tem na mão a macana afiada. Pela faixa de algodão com penas na perna, Araci reconhece a virgem araguaia: é Jandira.',
    'The day before, you saw a familiar trail in the forest. Today Araci goes into the woods after a macaw, for the red plumes of the headdress she is weaving in secret. A sound beside her: you seize the arm of a woman who still holds a sharpened macana. By the cotton band with feathers on her leg Araci recognizes the Araguaia maiden: it is Jandira.',
    'Il giorno prima hai visto nella foresta una traccia conosciuta. Oggi Araci entra nel bosco dietro un’ara, per le piume rosse del copricapo che tesse in segreto. Un rumore accanto: afferri il braccio di una donna che ha ancora in mano la macana affilata. Dalla fascia di cotone con piume sulla gamba Araci riconosce la fanciulla araguaia: è Jandira.',
    'La víspera viste en el bosque un rastro conocido. Hoy Araci entra en el monte tras un guacamayo, por las plumas rojas del penacho que teje en secreto. Un ruido al lado: sujetas el brazo de una mujer que aún tiene en la mano la macana afilada. Por la faja de algodón con plumas en la pierna Araci reconoce a la doncella araguaia: es Jandira.'),
    choices: [
      { t: L('Atar-lhe as mãos e deixá-la à decisão de Araci, como no romance', 'Bind her hands and leave her to Araci’s decision, as in the novel', 'Legarle le mani e lasciarla alla decisione di Araci, come nel romanzo', 'Atarle las manos y dejarla a la decisión de Araci, como en la novela'), go: 'v_jandira2' },
      { t: L('Soltá-la e mandá-la de volta à taba dos araguaias', 'Let her go and send her back to the Araguaia village', 'Lasciarla andare e rimandarla al villaggio degli araguaia', 'Soltarla y mandarla de vuelta a la aldea de los araguaias'), go: 'v_jandira2', fx: { honra: 1 } },
    ] });
  sc('v_jandira2', { act: 5, loc: 'floresta', time: 'manha', narr: true, text: L(
    'As duas virgens ficam sós no claro da floresta. No romance, Araci canta que o amor do guerreiro é como o orvalho, que volta a cobrir a várzea; oferece a Jandira ser sua irmã, desata-lhe os pulsos e lhe estende o arco para um combate leal. Jandira recusa a liberdade dada pela rival: — “Araci pode ser preferida; porém não será mais generosa do que a filha de Majé.”',
    'The two maidens are left alone in the forest clearing. In the novel, Araci sings that a warrior’s love is like the dew, which returns to cover the floodplain; she offers to make Jandira her sister, unties her wrists and holds out a bow for a fair fight. Jandira refuses freedom from her rival: “Araci may be preferred; but she will not be more generous than Majé’s daughter.”',
    'Le due fanciulle restano sole nella radura. Nel romanzo Araci canta che l’amore del guerriero è come la rugiada, che torna a coprire la pianura; offre a Jandira di essere sua sorella, le scioglie i polsi e le porge l’arco per un duello leale. Jandira rifiuta la libertà data dalla rivale: «Araci può essere preferita; ma non sarà più generosa della figlia di Majé.»',
    'Las dos doncellas quedan solas en el claro del bosque. En la novela, Araci canta que el amor del guerrero es como el rocío, que vuelve a cubrir la vega; ofrece a Jandira ser su hermana, le desata las muñecas y le tiende el arco para un combate leal. Jandira rechaza la libertad dada por su rival: «Araci puede ser preferida; pero no será más generosa que la hija de Majé.»'),
    choices: [{ t: L('Voltar ao trabalho', 'Go back to work', 'Tornare al lavoro', 'Volver al trabajo'), go: 'v_trabalho' }] });
  // ---------------------------------------------------------------- Ato VI · O combate nupcial (cap. VI)
  sc('vi_campo', { act: 6, loc: 'campo_toc', time: 'manha', text: L(
    'Chegou o dia em que os noivos de Araci disputam a virgem. A nação tocantim cerca a campina; no centro, o carbeto dos anciões. É a única festa guerreira em que o rito consente a presença das mulheres. Os noivos se distinguem pelo bracelete de contas verdes. Lá estão Pirajá, o grande pescador; Uiraçu; Araribóia; Cauatá, o corredor; Cori, o altivo pinheiro. Na primeira prova, cada campeão defende seu lugar de tacape: quem recua um passo, sai do campo.',
    'The day has come when Araci’s suitors contend for her. The Tocantin nation rings the field; in the centre, the council of elders. It is the only war feast at which custom allows women to be present. The suitors are marked by bracelets of green beads. There stand Pirajá, the great fisher; Uiraçu; Araribóia; Cauatá, the runner; Cori, the proud pine. In the first trial each champion defends his place with the club: whoever steps back leaves the field.',
    'È giunto il giorno in cui i pretendenti di Araci si contendono la fanciulla. La nazione tocantin circonda la prateria; al centro il consiglio degli anziani. È l’unica festa guerriera in cui il rito ammette la presenza delle donne. I pretendenti si distinguono per il braccialetto di perle verdi. Ecco Pirajá, il grande pescatore; Uiraçu; Araribóia; Cauatá, il corridore; Cori, l’altero pino. Nella prima prova ogni campione difende il suo posto con la mazza: chi arretra di un passo esce dal campo.',
    'Llegó el día en que los novios de Araci se disputan a la doncella. La nación tocantín rodea la llanura; en el centro, el consejo de los ancianos. Es la única fiesta guerrera en que el rito consiente la presencia de las mujeres. Los novios se distinguen por el brazalete de cuentas verdes. Allí están Pirajá, el gran pescador; Uiraçu; Araribóia; Cauatá, el corredor; Cori, el altivo pino. En la primera prueba cada campeón defiende su lugar con el tacape: quien retrocede un paso sale del campo.'),
    saber: 'casamento',
    choices: [{ t: L('Esperar, enquanto os outros combatem', 'Wait while the others fight', 'Aspettare mentre gli altri combattono', 'Esperar mientras los otros combaten'), go: 'vi_cori' }] });
  sc('vi_cori', { act: 6, loc: 'campo_toc', time: 'manha', text: L(
    'Pirajá recua diante de Uiraçu; Araribóia toma o lugar; o combate segue com vária fortuna até Cori, que expulsa o vencedor e se mantém firme contra todos. Falta Jurandir. Cori está cansado de tantos combates.',
    'Pirajá steps back before Uiraçu; Araribóia takes his place; the fight goes on with varying fortune until Cori, who drives out the victor and holds firm against all. Jurandir remains. Cori is tired from so many bouts.',
    'Pirajá arretra davanti a Uiraçu; Araribóia prende il posto; il combattimento prosegue con varia fortuna fino a Cori, che scaccia il vincitore e resiste a tutti. Manca Jurandir. Cori è stanco di tanti scontri.',
    'Pirajá retrocede ante Uiraçu; Araribóia toma el lugar; el combate sigue con suerte variada hasta Cori, que expulsa al vencedor y se mantiene firme contra todos. Falta Jurandir. Cori está cansado de tantos combates.'),
    choices: [
      { t: L('Atirar o tacape aos pés de Cori e lutar só com a mão', 'Throw your club at Cori’s feet and fight bare-handed', 'Gettare la mazza ai piedi di Cori e lottare a mani nude', 'Arrojar el tacape a los pies de Cori y luchar solo con la mano'), go: 'vi_cori_luta', fx: { honra: 2, flag: 'maoNua' } },
      { t: L('Combater de tacape', 'Fight with the club', 'Combattere con la mazza', 'Combatir con el tacape'), go: 'vi_cori_luta' },
    ] });
  sc('vi_cori_luta', { act: 6, loc: 'campo_toc', time: 'manha', type: 'combat', foe: 'cori', text: L(
    '— “Para merecer Araci, Jurandir queria vencer a cem guerreiros, e não combater um guerreiro fatigado.” Cori desfecha o golpe.',
    '“To deserve Araci, Jurandir would defeat a hundred warriors, not fight a tired one.” Cori strikes.',
    '«Per meritare Araci, Jurandir vorrebbe vincere cento guerrieri, non combattere un guerriero affaticato.» Cori sferra il colpo.',
    '«Para merecer a Araci, Jurandir querría vencer a cien guerreros, y no combatir a un guerrero fatigado.» Cori descarga el golpe.'),
    win: 'vi_toro', lose: 'vi_cori_perde' });
  sc('vi_cori_perde', { act: 6, loc: 'campo_toc', time: 'manha', fx: { merito: -1, vigor: 6 }, text: L(
    'Você recua um passo e, pela lei do combate, sai do campo nesta prova. Mas todos os noivos se mostraram valentes; ainda há outras provas.',
    'You step back and, by the law of the contest, leave the field in this trial. But all the suitors have shown courage; there are still other trials.',
    'Arretri di un passo e, per la legge del combattimento, esci dal campo in questa prova. Ma tutti i pretendenti si sono mostrati valorosi; ci sono ancora altre prove.',
    'Retrocedes un paso y, por la ley del combate, sales del campo en esta prueba. Pero todos los novios se mostraron valientes; aún quedan otras pruebas.'),
    choices: [{ t: L('Ir à segunda prova', 'Go to the second trial', 'Andare alla seconda prova', 'Ir a la segunda prueba'), go: 'vi_toro' }] });
  sc('vi_toro', { act: 6, loc: 'campo_toc', time: 'dia', fx: { merito: 1, cnt: ['dist', 3] }, text: L(
    'Os jovens caçadores trazem a figura da noiva: um toro de madeira com uma cabeça de mulher entalhada, que o pajé untou com banha de teiú para escorregar da mão. Pelo campo espalharam troncos, barrancos e estacadas. É preciso levantar o toro na carreira e levá-lo até o carbeto dos anciões sem que os rivais o tomem.',
    'The young hunters bring the bride’s figure: a log with a woman’s head carved on it, which the shaman has greased with tegu lizard fat so it slips from the hand. Trunks, gullies and stockades are scattered across the field. You must lift the log on the run and carry it to the elders’ council without the rivals taking it.',
    'I giovani cacciatori portano la figura della sposa: un ceppo di legno con una testa di donna intagliata, che lo sciamano ha unto con grasso di teiú perché scivoli di mano. Sul campo hanno sparso tronchi, fossi e palizzate. Bisogna sollevare il ceppo in corsa e portarlo fino al consiglio degli anziani senza che i rivali lo prendano.',
