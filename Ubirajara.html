    'Los jóvenes cazadores traen la figura de la novia: un tronco de madera con una cabeza de mujer tallada, que el pajé untó con grasa de teyú para que resbale de la mano. Por el campo esparcieron troncos, barrancos y empalizadas. Hay que levantar el tronco a la carrera y llevarlo hasta el consejo de los ancianos sin que los rivales lo tomen.'),
    choices: [{ t: L('Disparar à frente e erguer o toro sem parar', 'Dash ahead and lift the log without stopping', 'Scattare avanti e sollevare il ceppo senza fermarsi', 'Lanzarse adelante y alzar el tronco sin parar'), test: { a: 'agi', dc: 9, ok: 'vi_toro2', fail: 'vi_toro2', failFx: { cnt: ['dist', -1] } } }] });
  sc('vi_toro2', { act: 6, loc: 'campo_toc', time: 'dia', text: L(
    'Com o toro nos braços, você encontra os troncos derrubados e os barrancos fundos. Os rivais vêm atrás.',
    'With the log in your arms you reach the felled trunks and deep gullies. The rivals come after you.',
    'Con il ceppo tra le braccia raggiungi i tronchi abbattuti e i fossi profondi. I rivali ti inseguono.',
    'Con el tronco en los brazos llegas a los troncos derribados y los barrancos hondos. Los rivales vienen detrás.'),
    choices: [
      { t: L('Saltar as corcovas e galgar os galhos', 'Leap the mounds and climb over the branches', 'Saltare i dossi e scavalcare i rami', 'Saltar los montículos y trepar por las ramas'), test: { a: 'agi', dc: 10, ok: 'vi_toro3', fail: 'vi_toro3', failFx: { cnt: ['dist', -1] } } },
      { t: L('Atravessar à força, empurrando os galhos', 'Force your way through, pushing the branches aside', 'Passare con la forza, spingendo i rami', 'Atravesar a la fuerza, apartando las ramas'), test: { a: 'for', dc: 10, ok: 'vi_toro3', fail: 'vi_toro3', failFx: { cnt: ['dist', -1] } } },
    ] });
  sc('vi_toro3', { act: 6, loc: 'campo_toc', time: 'dia', text: L(
    'Os guerreiros chegam tão perto que você sente nos cabelos a respiração ofegante. Em frente ergue-se a alta estacada. Se tentar subir carregado, eles o alcançarão.',
    'The warriors come so close you feel their panting breath in your hair. Ahead rises the tall stockade. If you try to climb it laden, they will catch you.',
    'I guerrieri si avvicinano tanto che senti nei capelli il loro respiro affannoso. Davanti si alza l’alta palizzata. Se provi a salire carico, ti raggiungeranno.',
    'Los guerreros se acercan tanto que sientes en el cabello su respiración jadeante. Enfrente se alza la alta empalizada. Si intentas subir cargado, te alcanzarán.'),
    choices: [
      { t: L('Arremessar o toro por cima da estacada e saltar atrás dele', 'Hurl the log over the stockade and leap after it', 'Scagliare il ceppo oltre la palizzata e saltargli dietro', 'Arrojar el tronco por encima de la empalizada y saltar tras él'), test: { a: 'for', dc: 10, ok: 'vi_toro_fim', fail: 'vi_toro_fim', okFx: { cnt: ['dist', 1] }, failFx: { cnt: ['dist', -1] } } },
      { t: L('Contornar a estacada', 'Go round the stockade', 'Aggirare la palizzata', 'Rodear la empalizada'), go: 'vi_toro_fim', fx: { cnt: ['dist', -1] } },
    ] });
  sc('vi_toro_fim', { act: 6, loc: 'campo_toc', time: 'dia', branch: [{ cnt: ['dist', 1], go: 'vi_toro_ok' }], go: 'vi_toro_no' });
  sc('vi_toro_ok', { act: 6, loc: 'campo_toc', time: 'dia', fx: { merito: 2, fama: 2 }, text: L(
    'Você põe a figura da esposa no meio do carbeto dos anciões. Mostrou como arrebataria a esposa do meio dos inimigos e a defenderia até um abrigo seguro. Na disputa final entre os três vencedores, o triunfo não demora: Jurandir o arrebata, como o gavião arrebata a presa que duas serpentes disputam.',
    'You set the bride’s figure in the midst of the elders’ council. You have shown how you would carry your wife out from among enemies and defend her to a safe shelter. In the final contest among the three winners, triumph comes quickly: Jurandir snatches it as the hawk snatches the prey two serpents fight over.',
    'Metti la figura della sposa in mezzo al consiglio degli anziani. Hai mostrato come strapperesti la sposa ai nemici e la difenderesti fino a un rifugio sicuro. Nella sfida finale tra i tre vincitori, il trionfo non tarda: Jurandir lo afferra come lo sparviero afferra la preda che due serpenti si contendono.',
    'Pones la figura de la esposa en medio del consejo de los ancianos. Mostraste cómo arrebatarías a la esposa de entre los enemigos y la defenderías hasta un refugio seguro. En la disputa final entre los tres vencedores, el triunfo no tarda: Jurandir lo arrebata como el gavilán arrebata la presa que se disputan dos serpientes.'),
    choices: [{ t: L('Ouvir o grande pajé', 'Listen to the great shaman', 'Ascoltare il grande sciamano', 'Escuchar al gran pajé'), go: 'vi_camucim' }] });
  sc('vi_toro_no', { act: 6, loc: 'campo_toc', time: 'dia', text: L(
    'Uiraçu arranca-lhe o toro na confusão e só Cori e ele chegam ao carbeto. Você perdeu a prova, mas a constância ainda pode falar por você.',
    'Uiraçu wrests the log from you in the confusion and only he and Cori reach the council. You have lost the trial, but constancy can still speak for you.',
    'Uiraçu ti strappa il ceppo nella confusione e solo lui e Cori arrivano al consiglio. Hai perso la prova, ma la costanza può ancora parlare per te.',
    'Uiraçu te arranca el tronco en la confusión y solo él y Cori llegan al consejo. Perdiste la prueba, pero la constancia aún puede hablar por ti.'),
    choices: [{ t: L('Ouvir o grande pajé', 'Listen to the great shaman', 'Ascoltare il grande sciamano', 'Escuchar al gran pajé'), go: 'vi_camucim' }] });
  sc('vi_camucim', { act: 6, loc: 'campo_toc', time: 'dia', type: 'endure', rounds: 4, need: 3, saber: 'sauva', text: L(
    'Ogib, o grande pajé, ergue o camucim da constância, de bojo pintado de vermelho. — “É preciso que tenha a constância do varão, e não se perturbe com o sofrimento.” Dentro há um formigueiro de saúvas fechado desde a última lua. Você mete a mão no vaso. Todos os olhos espreitam teu rosto à procura do menor sinal de dor.',
    'Ogib, the great shaman, raises the jar of constancy, its belly painted red. “He must have a man’s constancy and not be troubled by suffering.” Inside is a nest of leafcutter ants, shut in since the last moon. You put your hand into the jar. Every eye searches your face for the slightest sign of pain.',
    'Ogib, il grande sciamano, alza il vaso della costanza, dal ventre dipinto di rosso. «Bisogna che abbia la costanza dell’uomo e non si turbi per la sofferenza.» Dentro c’è un formicaio di saúvas chiuso dall’ultima luna. Infili la mano nel vaso. Tutti gli occhi spiano il tuo volto in cerca del minimo segno di dolore.',
    'Ogib, el gran pajé, alza el cántaro de la constancia, de vientre pintado de rojo. «Es preciso que tenga la constancia del varón y no se turbe con el sufrimiento.» Dentro hay un hormiguero de saúvas encerrado desde la última luna. Metes la mano en el cántaro. Todos los ojos espían tu rostro buscando la menor señal de dolor.'),
    ok: 'vi_camucim_ok', fail: 'vi_camucim_no' });
  sc('vi_camucim_ok', { act: 6, loc: 'campo_toc', time: 'dia', fx: { merito: 2, honra: 1, vigor: -3 }, text: L(
    'Os anciões dão sinal para concluir a prova, mas o guerreiro continua seu canto de amor. É preciso quebrar o camucim para tirar a mão, de inflamada que ficou. O pajé esfrega na pele vermelha o suco de uma erva, e a inchação desaparece.',
    'The elders signal the end of the trial, but the warrior goes on with his love song. The jar must be broken to free his hand, so swollen has it become. The shaman rubs the juice of a herb on the red skin, and the swelling goes down.',
    'Gli anziani danno il segnale di concludere la prova, ma il guerriero continua il suo canto d’amore. Bisogna rompere il vaso per estrarre la mano, tanto è gonfia. Lo sciamano strofina sulla pelle arrossata il succo di un’erba, e il gonfiore scompare.',
    'Los ancianos dan la señal de concluir la prueba, pero el guerrero sigue con su canto de amor. Hay que romper el cántaro para sacar la mano, de tan inflamada. El pajé frota en la piel roja el jugo de una hierba y la hinchazón desaparece.'),
    choices: [{ t: L('A última prova: a prova da virgem', 'The last trial: the maiden’s trial', 'L’ultima prova: la prova della fanciulla', 'La última prueba: la prueba de la doncella'), go: 'vi_virgem' }] });
  sc('vi_camucim_no', { act: 6, loc: 'campo_toc', time: 'dia', fx: { merito: -1, vigor: -3 }, text: L(
    'Um tremor passa pelo teu rosto, e os anciões o veem. Você não tira a mão do vaso até o sinal, mas a prova da constância não foi perfeita. O pajé quebra o camucim e alivia a inchação com o suco de uma erva.',
    'A tremor crosses your face, and the elders see it. You keep your hand in the jar until the signal, but the trial of constancy was not flawless. The shaman breaks the jar and eases the swelling with a herb’s juice.',
    'Un tremito passa sul tuo volto, e gli anziani lo vedono. Non togli la mano dal vaso fino al segnale, ma la prova della costanza non è stata perfetta. Lo sciamano rompe il vaso e allevia il gonfiore con il succo di un’erba.',
    'Un temblor pasa por tu rostro y los ancianos lo ven. No sacas la mano del cántaro hasta la señal, pero la prueba de la constancia no fue perfecta. El pajé rompe el cántaro y alivia la hinchazón con el jugo de una hierba.'),
    choices: [{ t: L('A última prova: a prova da virgem', 'The last trial: the maiden’s trial', 'L’ultima prova: la prova della fanciulla', 'La última prueba: la prueba de la doncella'), go: 'vi_virgem' }] });
  sc('vi_virgem', { act: 6, loc: 'campo_toc', time: 'tarde', text: L(
    'Nesta prova é a virgem quem mostra seu agrado pelo vencedor, ou se livra de um esposo que não soube ganhar-lhe o afeto. O pajé põe você à distância de uma muçurana que cinge dez vezes a cintura de um guerreiro. Araci lança as tranças para as costas e, ao sinal, desfere a corrida. Você não quer alcançá-la à força: a quer rendida, e não vencida.',
    'In this trial it is the maiden who shows her favour for the winner, or frees herself of a husband who failed to win her affection. The shaman places you a cord’s length away, a cord that goes ten times round a warrior’s waist. Araci throws her braids behind her and, at the signal, breaks into a run. You do not wish to catch her by force: you want her to yield, not to be conquered.',
    'In questa prova è la fanciulla a mostrare il suo favore per il vincitore, o a liberarsi di uno sposo che non ha saputo conquistarne l’affetto. Lo sciamano ti pone alla distanza di una corda che cinge dieci volte la vita di un guerriero. Araci getta le trecce dietro le spalle e, al segnale, si lancia nella corsa. Non vuoi raggiungerla con la forza: la vuoi arresa, non vinta.',
    'En esta prueba es la doncella quien muestra su agrado por el vencedor, o se libra de un esposo que no supo ganar su afecto. El pajé te pone a la distancia de una cuerda que ciñe diez veces la cintura de un guerrero. Araci echa las trenzas a la espalda y, a la señal, echa a correr. No quieres alcanzarla a la fuerza: la quieres rendida, y no vencida.'),
    branch: [{ score: 9, go: 'vi_virgem_ok' }], go: 'end_rejeitado',
    choices: [{ t: L('Seguir Araci', 'Follow Araci', 'Seguire Araci', 'Seguir a Araci'), branchGo: true }] });
  sc('vi_virgem_ok', { act: 6, loc: 'rio', time: 'tarde', fx: { fama: 2, ponto: 1 }, text: L(
    'Quando mostra a todos que Jurandir não a alcançaria nunca, Araci reclina a cabeça para esconder o rubor. Você abre os braços e recebe a esposa que se entrega a seu amor, e a leva à cabana que construiu à margem do rio. Antes de passar a soleira, revela-lhe quem é: Ubirajara, chefe dos araguaias. Araci orna tua fronte com o cocar de plumas vermelhas que teceu em segredo. Nesse momento soa um clamor: os anciões decidiram que o vencedor, antes de receber a esposa, deve declarar quem é.',
    'Having shown everyone that Jurandir could never catch her, Araci bows her head to hide her blush. You open your arms and receive the bride who gives herself to your love, and carry her to the lodge you built by the river. Before crossing the threshold you reveal who you are: Ubirajara, chief of the Araguaia. Araci crowns you with the red-plumed headdress she wove in secret. At that moment a shout rings out: the elders have decided that the winner, before receiving his bride, must declare who he is.',
    'Dopo aver mostrato a tutti che Jurandir non l’avrebbe mai raggiunta, Araci china il capo per nascondere il rossore. Apri le braccia e ricevi la sposa che si dona al tuo amore, e la porti alla capanna che hai costruito sulla riva del fiume. Prima di varcare la soglia le riveli chi sei: Ubirajara, capo degli araguaia. Araci ti orna la fronte con il copricapo di piume rosse tessuto in segreto. In quel momento risuona un clamore: gli anziani hanno deciso che il vincitore, prima di ricevere la sposa, deve dichiarare chi è.',
    'Cuando muestra a todos que Jurandir nunca la alcanzaría, Araci inclina la cabeza para esconder el rubor. Abres los brazos y recibes a la esposa que se entrega a tu amor, y la llevas a la cabaña que construiste a orillas del río. Antes de cruzar el umbral le revelas quién eres: Ubirajara, jefe de los araguaias. Araci adorna tu frente con el penacho de plumas rojas que tejió en secreto. En ese momento suena un clamor: los ancianos decidieron que el vencedor, antes de recibir a la esposa, debe declarar quién es.'),
    item: 'cocar_araci',
    choices: [{ t: L('Ir à cabana de Itaquê', 'Go to Itaquê’s lodge', 'Andare alla capanna di Itaquê', 'Ir a la cabaña de Itaquê'), go: 'vii_revela' }] });

  // ---------------------------------------------------------------- Ato VII · A guerra (cap. VII)
  sc('vii_revela', { act: 7, loc: 'taba_toc', time: 'tarde', text: L(
    'Diante do carbeto você conta a maranduba de guerra: o encontro com Pojucã, o combate, a festa do triunfo, e que no sol seguinte partirá para o combate da morte que prometeu ao prisioneiro. Itaquê arqueja como o rio sob a borrasca. — “Tu és Ubirajara, senhor da lança. Eu sou Itaquê, pai de Pojucã. Tenho em face o matador de meu filho; mas ele é meu hóspede!”',
    'Before the council you tell your war tale: the meeting with Pojucã, the fight, the victory feast, and that at the next sun you will leave for the death combat you promised the prisoner. Itaquê gasps like a river under a storm. “You are Ubirajara, lord of the spear. I am Itaquê, father of Pojucã. Before me stands my son’s slayer; but he is my guest!”',
    'Davanti al consiglio racconti la maranduba di guerra: l’incontro con Pojucã, il combattimento, la festa del trionfo, e che al sole seguente partirai per il combattimento della morte promesso al prigioniero. Itaquê ansima come il fiume sotto la burrasca. «Tu sei Ubirajara, signore della lancia. Io sono Itaquê, padre di Pojucã. Ho davanti l’uccisore di mio figlio; ma è mio ospite!»',
    'Ante el consejo cuentas la maranduba de guerra: el encuentro con Pojucã, el combate, la fiesta del triunfo, y que al sol siguiente partirás al combate de la muerte que prometiste al prisionero. Itaquê jadea como el río bajo la borrasca. «Tú eres Ubirajara, señor de la lanza. Yo soy Itaquê, padre de Pojucã. Tengo ante mí al matador de mi hijo; ¡pero es mi huésped!»'),
    choices: [{ t: L('“Ubirajara venceu Pojucã em combate leal e aceita o desafio de Itaquê.”', '“Ubirajara defeated Pojucã in fair combat and accepts Itaquê’s challenge.”', '«Ubirajara ha vinto Pojucã in combattimento leale e accetta la sfida di Itaquê.»', '«Ubirajara venció a Pojucã en combate leal y acepta el desafío de Itaquê.»'), go: 'vii_guerra', fx: { honra: 1 } }] });
  sc('vii_guerra', { act: 7, loc: 'taba_toc', time: 'tarde', text: L(
    '— “Tu és meu hóspede; enquanto Itaquê brandir o grande arco da nação tocantim, ninguém ofenderá o amigo de Tupã.” Os dois trocam a fumaça da despedida. Você caminha até o fim da taba, volta apagando o rastro dos próprios passos e, no centro da ocara, bate com o tacape no largo escudo: o hóspede saiu; quem está ali é um guerreiro armado. A seta de Ubirajara se crava na figura do tucano. Itaquê aceita a guerra, e sua seta morde o teu escudo.',
    '“You are my guest; while Itaquê wields the great bow of the Tocantin nation, no one will harm the friend of Tupã.” The two share the smoke of farewell. You walk to the edge of the village, come back erasing your own footprints and, in the middle of the plaza, strike your broad shield with your club: the guest has left; the man standing there is an armed warrior. Ubirajara’s arrow sinks into the toucan figure. Itaquê accepts the war, and his arrow bites into your shield.',
    '«Tu sei mio ospite; finché Itaquê brandirà il grande arco della nazione tocantin, nessuno offenderà l’amico di Tupã.» I due si scambiano il fumo del congedo. Cammini fino al limite del villaggio, torni cancellando le tue stesse orme e, al centro della piazza, batti la mazza sul largo scudo: l’ospite è uscito; chi sta lì è un guerriero armato. La freccia di Ubirajara si conficca nella figura del tucano. Itaquê accetta la guerra, e la sua freccia morde il tuo scudo.',
    '«Eres mi huésped; mientras Itaquê blanda el gran arco de la nación tocantín, nadie ofenderá al amigo de Tupã.» Ambos intercambian el humo de la despedida. Caminas hasta el final de la aldea, vuelves borrando el rastro de tus propios pasos y, en el centro de la plaza, golpeas con el tacape el ancho escudo: el huésped salió; quien está allí es un guerrero armado. La flecha de Ubirajara se clava en la figura del tucán. Itaquê acepta la guerra, y su flecha muerde tu escudo.'),
    choices: [{ t: L('Partir pela floresta', 'Leave through the forest', 'Partire attraverso la foresta', 'Partir por el bosque'), go: 'vii_araci' }] });
  sc('vii_araci', { act: 7, loc: 'floresta', time: 'noite', text: L(
    'No seio da floresta Araci o espera, com a rede nupcial. — “A esposa te acompanha. Teu braço valente já a conquistou; Araci te pertence; deves levá-la.” Partindo, ela espera também que o amor o mova a salvar Pojucã, seu irmão.',
    'In the heart of the forest Araci awaits you, with the wedding hammock. “Your wife goes with you. Your brave arm has won her; Araci belongs to you; you must take her.” By leaving, she also hopes love will move you to save Pojucã, her brother.',
    'Nel cuore della foresta Araci ti aspetta, con l’amaca nuziale. «La sposa ti accompagna. Il tuo braccio valoroso l’ha già conquistata; Araci ti appartiene; devi portarla con te.» Partendo, spera anche che l’amore ti spinga a salvare Pojucã, suo fratello.',
    'En el corazón del bosque Araci te espera, con la hamaca nupcial. «La esposa te acompaña. Tu brazo valiente ya la conquistó; Araci te pertenece; debes llevarla.» Al partir, espera también que el amor te mueva a salvar a Pojucã, su hermano.'),
    choices: [
      { t: L('“Itaquê respeitou a hospitalidade no corpo de Ubirajara; Ubirajara não deixará a traição na terra hospedeira.”', '“Itaquê respected hospitality in Ubirajara’s person; Ubirajara will not leave treachery in the land that hosted him.”', '«Itaquê ha rispettato l’ospitalità nella persona di Ubirajara; Ubirajara non lascerà il tradimento nella terra che lo ha accolto.»', '«Itaquê respetó la hospitalidad en la persona de Ubirajara; Ubirajara no dejará la traición en la tierra hospedera.»'), go: 'vii_volta', fx: { honra: 2, afeto: 1 } },
      { t: L('Levar Araci consigo esta noite', 'Take Araci with you tonight', 'Portare Araci con te questa notte', 'Llevar a Araci contigo esta noche'), go: 'end_traicao', fx: { honra: -4 } },
    ] });
  sc('vii_volta', { act: 7, loc: 'taba_ara', time: 'manha', text: L(
    'Dois sóis depois, Ubirajara fere o trocano na taba dos araguaias. Ao primeiro raio de sol chegam os chefes das cem tabas com seus guerreiros. Ele manda trazer Pojucã. — “Vê o mar de meus guerreiros. A nação tocantim carece neste momento do braço de seus maiores guerreiros.”',
    'Two suns later Ubirajara strikes the great drum in the Araguaia village. At the first ray of sun the chiefs of the hundred villages arrive with their warriors. He sends for Pojucã. “See the sea of my warriors. The Tocantin nation needs the arm of its greatest warriors right now.”',
    'Due soli dopo Ubirajara percuote il grande tamburo nel villaggio degli araguaia. Al primo raggio di sole arrivano i capi dei cento villaggi con i loro guerrieri. Fa chiamare Pojucã. «Guarda il mare dei miei guerrieri. La nazione tocantin ha bisogno in questo momento del braccio dei suoi più grandi guerrieri.»',
    'Dos soles después, Ubirajara golpea el gran tambor en la aldea de los araguaias. Con el primer rayo de sol llegan los jefes de las cien aldeas con sus guerreros. Manda traer a Pojucã. «Mira el mar de mis guerreros. La nación tocantín necesita en este momento el brazo de sus mayores guerreros.»'),
    choices: [
      { t: L('“Tu és livre, Pojucã; parte, que a guerra dos araguaias te segue os passos.”', '“You are free, Pojucã; go, for the Araguaia war follows in your steps.”', '«Sei libero, Pojucã; parti, che la guerra degli araguaia segue i tuoi passi.»', '«Eres libre, Pojucã; parte, que la guerra de los araguaias sigue tus pasos.»'), go: 'vii_pojuca_livre', fx: { honra: 2 } },
      { t: L('Mantê-lo cativo para o combate da morte prometido', 'Keep him captive for the promised death combat', 'Tenerlo prigioniero per il combattimento della morte promesso', 'Mantenerlo cautivo para el combate de la muerte prometido'), go: 'vii_pojuca_preso', fx: { honra: -2 } },
    ] });
  sc('vii_pojuca_preso', { act: 7, loc: 'taba_ara', time: 'manha', text: L(
    'Pojucã baixa a cabeça. Mas os anciões lembram que Ubirajara foi hóspede de seu pai sem saber: reter o filho de quem o acolheu seria surpreender a hospitalidade. Você cede e o liberta, mas a hesitação corre de boca em boca.',
    'Pojucã bows his head. But the elders recall that Ubirajara was unknowingly his father’s guest: holding the son of the man who received him would be abusing hospitality. You give way and free him, but the hesitation passes from mouth to mouth.',
    'Pojucã china il capo. Ma gli anziani ricordano che Ubirajara è stato ospite di suo padre senza saperlo: trattenere il figlio di chi lo ha accolto sarebbe tradire l’ospitalità. Cedi e lo liberi, ma l’esitazione passa di bocca in bocca.',
    'Pojucã baja la cabeza. Pero los ancianos recuerdan que Ubirajara fue huésped de su padre sin saberlo: retener al hijo de quien lo acogió sería sorprender la hospitalidad. Cedes y lo liberas, pero la vacilación corre de boca en boca.'),
    choices: [{ t: L('Abrir o caminho da guerra', 'Open the road of war', 'Aprire la via della guerra', 'Abrir el camino de la guerra'), go: 'vii_tapuias' }] });
  sc('vii_pojuca_livre', { act: 7, loc: 'taba_ara', time: 'manha', text: L(
    'Pojucã exige a morte dos bravos, mas reconhece que a honra do vencedor exige sua volta. — “Se Tupã não consente que Pojucã seja vencedor, ele não quer maior glória do que a de morrer combatendo Ubirajara.” — “Tu és irmão de Araci e vais para junto dela. Dize à estrela do dia que seu esposo está com ela.”',
    'Pojucã demands a brave man’s death, but recognizes that the victor’s honour requires his return. “If Tupã does not allow Pojucã to be the victor, he wants no greater glory than to die fighting Ubirajara.” “You are Araci’s brother and you go to her side. Tell the star of the day that her husband is with her.”',
    'Pojucã esige la morte dei valorosi, ma riconosce che l’onore del vincitore esige il suo ritorno. «Se Tupã non consente che Pojucã sia vincitore, egli non vuole gloria maggiore che morire combattendo Ubirajara.» «Tu sei fratello di Araci e vai accanto a lei. Di’ alla stella del giorno che il suo sposo è con lei.»',
    'Pojucã exige la muerte de los bravos, pero reconoce que el honor del vencedor exige su regreso. «Si Tupã no consiente que Pojucã sea vencedor, no quiere mayor gloria que morir combatiendo a Ubirajara.» «Tú eres hermano de Araci y vas junto a ella. Dile a la estrella del día que su esposo está con ella.»'),
    choices: [{ t: L('Abrir o caminho da guerra', 'Open the road of war', 'Aprire la via della guerra', 'Abrir el camino de la guerra'), go: 'vii_tapuias' }] });
  sc('vii_tapuias', { act: 7, loc: 'campo_toc', time: 'dia', text: L(
    'Pela margem do grande rio você vê que uma nação tapuia se prepara para assaltar a taba dos tocantins. Murinhém, o primeiro dos cantores, leva a mensagem: os cantores são respeitados por todas as nações como mensageiros entre os povos em guerra. Canicrã, chefe tapuia, responde que veio trazido pela vingança — Pojucã queimou a cabana do seu pajé — e manda, como penhor de aliança, uma flecha sem farpa com as asas negras do anum.',
    'Along the great river you see a Tapuia nation preparing to attack the Tocantin village. Murinhém, first of the singers, carries your message: singers are respected by all nations as messengers between peoples at war. Canicrã, the Tapuia chief, answers that he came for vengeance — Pojucã burned his shaman’s lodge — and sends, as a pledge of alliance, an arrow without its point, fletched with the black wings of the ani.',
    'Lungo il grande fiume vedi che una nazione tapuia si prepara ad assalire il villaggio dei tocantins. Murinhém, il primo dei cantori, porta il messaggio: i cantori sono rispettati da tutte le nazioni come messaggeri tra i popoli in guerra. Canicrã, capo tapuia, risponde che è venuto per vendetta — Pojucã ha bruciato la capanna del suo sciamano — e manda, come pegno d’alleanza, una freccia senza punta con le ali nere dell’anù.',
    'Por la orilla del gran río ves que una nación tapuia se prepara para asaltar la aldea de los tocantins. Murinhém, el primero de los cantores, lleva el mensaje: los cantores son respetados por todas las naciones como mensajeros entre los pueblos en guerra. Canicrã, jefe tapuia, responde que vino traído por la venganza —Pojucã quemó la cabaña de su pajé— y envía, como prenda de alianza, una flecha sin punta con las alas negras del anó.'),
    saber: 'tapuias',
    choices: [
      { t: L('Devolver o penhor: Ubirajara respeita a vingança tapuia, mas não carece de aliados', 'Return the pledge: Ubirajara respects the Tapuia vengeance but needs no allies', 'Restituire il pegno: Ubirajara rispetta la vendetta tapuia, ma non ha bisogno di alleati', 'Devolver la prenda: Ubirajara respeta la venganza tapuia, pero no necesita aliados'), go: 'viii_batalha', fx: { honra: 1 } },
      { t: L('Aceitar a aliança com Canicrã contra os tocantins', 'Accept the alliance with Canicrã against the Tocantins', 'Accettare l’alleanza con Canicrã contro i tocantins', 'Aceptar la alianza con Canicrã contra los tocantins'), go: 'viii_batalha', fx: { honra: -3, flag: 'alianca' } },
    ] });

  // ---------------------------------------------------------------- Ato VIII · A batalha (cap. VIII)
  sc('viii_batalha', { act: 8, loc: 'campo_toc', time: 'dia', text: L(
    'Tocantins e tapuias travam a batalha. Itaquê e Canicrã se encontram; dez vezes já tinham combatido, e nenhum fora vencido. Os guerreiros param para olhar. O golpe de Itaquê espedaça o tacape e o escudo de Canicrã. Então Pahã, o filho menino de Canicrã, dispara duas setas de espinho de ouriço: os olhos de Itaquê choram sangue. Cego, Itaquê agarra o inimigo e lhe abre a cabeça com as mãos. Ao pôr do sol não há na campina a sombra de um tapuia.',
    'Tocantins and Tapuia join battle. Itaquê and Canicrã meet; they had fought ten times before, and neither had been beaten. The warriors stop to watch. Itaquê’s blow shatters Canicrã’s club and shield. Then Pahã, Canicrã’s young son, looses two arrows tipped with porcupine quills: Itaquê’s eyes weep blood. Blinded, Itaquê seizes his enemy and splits his head with his bare hands. At sunset there is not the shadow of a Tapuia on the field.',
    'Tocantins e tapuia si scontrano. Itaquê e Canicrã si incontrano; dieci volte avevano già combattuto, e nessuno era stato vinto. I guerrieri si fermano a guardare. Il colpo di Itaquê spezza la mazza e lo scudo di Canicrã. Allora Pahã, il figlio bambino di Canicrã, scocca due frecce di aculei di porcospino: gli occhi di Itaquê piangono sangue. Cieco, Itaquê afferra il nemico e gli spacca la testa con le mani. Al tramonto non c’è nella prateria l’ombra di un tapuia.',
    'Tocantins y tapuias traban la batalla. Itaquê y Canicrã se encuentran; diez veces habían combatido, y ninguno había sido vencido. Los guerreros se detienen a mirar. El golpe de Itaquê destroza el tacape y el escudo de Canicrã. Entonces Pahã, el hijo niño de Canicrã, dispara dos flechas de púas de erizo: los ojos de Itaquê lloran sangre. Ciego, Itaquê agarra al enemigo y le abre la cabeza con las manos. Al ponerse el sol no queda en la llanura la sombra de un tapuia.'),
    choices: [{ t: L('Olhar o campo', 'Look across the field', 'Guardare il campo', 'Mirar el campo'), go: 'viii_paha' }] });
  sc('viii_paha', { act: 8, loc: 'campo_toc', time: 'tarde', text: L(
    'Seus olhos descobrem Pahã, que foge no meio dos destroços de sua nação. Sua mão se ergue para o arco.',
    'Your eyes find Pahã, fleeing amid the wreck of his nation. Your hand rises toward the bow.',
    'I tuoi occhi scorgono Pahã, che fugge tra i resti della sua nazione. La tua mano si alza verso l’arco.',
    'Tus ojos descubren a Pahã, que huye entre los restos de su nación. Tu mano se alza hacia el arco.'),
    choices: [
      { t: L('“A águia não persegue a andorinha.” Mandar Tubim, o jovem caçador, alcançá-lo vivo', '“The eagle does not hunt the swallow.” Send Tubim, the young hunter, to catch him alive', '«L’aquila non insegue la rondine.» Mandare Tubim, il giovane cacciatore, a prenderlo vivo', '«El águila no persigue a la golondrina.» Mandar a Tubim, el joven cazador, a alcanzarlo vivo'), go: 'viii_tubim', fx: { honra: 2 } },
      { t: L('Deixá-lo fugir', 'Let him escape', 'Lasciarlo fuggire', 'Dejarlo huir'), go: 'viii_arco', fx: { honra: 1 } },
      { t: L('Disparar contra o menino', 'Shoot at the boy', 'Tirare contro il bambino', 'Disparar contra el niño'), go: 'viii_vergonha', fx: { honra: -4 } },
    ] });
  sc('viii_vergonha', { act: 8, loc: 'campo_toc', time: 'tarde', text: L(
    'A corda zune, mas a seta erra: talvez tua mão não quisesse acertar. Os guerreiros araguaias se calam. Empregar o valor contra um menino é indigno de um guerreiro, e mais ainda de um chefe. A vergonha vai com você para o carbeto.',
    'The cord hums, but the arrow misses: perhaps your hand did not wish to hit. The Araguaia warriors fall silent. Turning one’s valour against a boy is unworthy of a warrior, still more of a chief. The shame goes with you to the council.',
    'La corda sibila, ma la freccia manca il bersaglio: forse la tua mano non voleva colpire. I guerrieri araguaia tacciono. Usare il proprio valore contro un bambino è indegno di un guerriero, e ancor più di un capo. La vergogna ti accompagna al consiglio.',
    'La cuerda zumba, pero la flecha falla: tal vez tu mano no quería acertar. Los guerreros araguaias callan. Emplear el valor contra un niño es indigno de un guerrero, y más aún de un jefe. La vergüenza va contigo al consejo.'),
    choices: [{ t: L('Continuar', 'Continue', 'Continua', 'Continuar'), go: 'viii_arco' }] });
  sc('viii_tubim', { act: 8, loc: 'campo_toc', time: 'noite', text: L(
    'Tubim some num turbilhão de poeira. Quando os vaga-lumes começam a luzir, ele volta trazendo o curumim nos braços, e recebe o nome de Abeguar, senhor do voo. Ao raiar da manhã, Murinhém leva Pahã a Itaquê: — “Faze do curumim tapuia um mancebo tocantim.” O menino recusa ser escravo. Itaquê pousa a mão em sua cabeça: — “O curumim que ama seu pai é filho de Itaquê. Tu és livre, Pahã.”',
    'Tubim vanishes in a whirl of dust. As the fireflies begin to glow he returns carrying the boy in his arms, and receives the name Abeguar, lord of flight. At daybreak Murinhém takes Pahã to Itaquê: “Make the Tapuia boy a Tocantin youth.” The boy refuses to be a slave. Itaquê lays his hand on his head: “The boy who loves his father is Itaquê’s son. You are free, Pahã.”',
    'Tubim sparisce in un turbine di polvere. Quando le lucciole cominciano a brillare torna portando il bambino tra le braccia, e riceve il nome di Abeguar, signore del volo. All’alba Murinhém porta Pahã da Itaquê: «Fa’ del bambino tapuia un giovane tocantin.» Il bambino rifiuta di essere schiavo. Itaquê gli posa la mano sul capo: «Il bambino che ama suo padre è figlio di Itaquê. Sei libero, Pahã.»',
    'Tubim desaparece en un torbellino de polvo. Cuando las luciérnagas empiezan a brillar, vuelve con el niño en brazos y recibe el nombre de Abeguar, señor del vuelo. Al rayar la mañana, Murinhém lleva a Pahã ante Itaquê: «Haz del niño tapuia un mozo tocantín.» El niño se niega a ser esclavo. Itaquê le pone la mano en la cabeza: «El niño que ama a su padre es hijo de Itaquê. Eres libre, Pahã.»'),
    choices: [{ t: L('Continuar', 'Continue', 'Continua', 'Continuar'), go: 'viii_arco' }] });
  sc('viii_arco', { act: 8, loc: 'taba_toc', time: 'dia', narr: true, text: L(
    'Na taba dos tocantins, os anciões cercam o herói cego. O grande arco da nação, que o pai da nação passou a Javari e Javari a Itaquê, precisa de uma mão robusta e de um olho seguro. Os mais famosos guerreiros tentam: muitos o vergam, mas a seta não parte. Pojucã consegue disparar, mas depõe o arco: — “Só há um guerreiro na terra que o possa brandir como Itaquê, e esse não cinge a fronte com o cocar das penas de tucano.”',
    'In the Tocantin village the elders gather around the blind hero. The nation’s great bow, which the nation’s founder passed to Javari and Javari to Itaquê, needs a strong hand and a sure eye. The most famous warriors try: many bend it, but the arrow does not fly. Pojucã manages to shoot, but lays the bow down: “There is only one warrior on earth who can wield it as Itaquê did, and he does not wear the toucan-feather headdress.”',
    'Nel villaggio dei tocantins gli anziani circondano l’eroe cieco. Il grande arco della nazione, che il fondatore passò a Javari e Javari a Itaquê, ha bisogno di una mano robusta e di un occhio sicuro. I guerrieri più famosi ci provano: molti lo piegano, ma la freccia non parte. Pojucã riesce a scoccare, ma depone l’arco: «C’è un solo guerriero sulla terra che possa brandirlo come Itaquê, e non porta il copricapo di piume di tucano.»',
    'En la aldea de los tocantins, los ancianos rodean al héroe ciego. El gran arco de la nación, que el fundador pasó a Javari y Javari a Itaquê, necesita una mano robusta y un ojo seguro. Los guerreros más famosos lo intentan: muchos lo doblan, pero la flecha no parte. Pojucã logra disparar, pero deja el arco: «Solo hay un guerrero en la tierra que pueda blandirlo como Itaquê, y ese no ciñe la frente con el penacho de plumas de tucán.»'),
    choices: [{ t: L('Continuar', 'Continue', 'Continua', 'Continuar'), go: 'ix_itaque' }] });

  // ---------------------------------------------------------------- Ato IX · União dos arcos (cap. IX)
  sc('ix_itaque', { act: 9, loc: 'campo_toc', time: 'manha', branch: [{ honraMin: 5, go: 'ix_itaque_ok' }], go: 'end_desonra' });
  sc('ix_itaque_ok', { act: 9, loc: 'campo_toc', time: 'manha', text: L(
    'Os tapuias voltam com Agniná, irmão de Canicrã, para vingá-lo. Sem chefe, a nação tocantim está como o bando de caititus que perdeu o pai. O velho herói atravessa a taba guiado por Araci, e os cantores vão adiante com um canto de paz. — “Empunha o arco de Itaquê, chefe dos araguaias, e tu conquistarás por teu heroísmo uma esposa e uma nação.” Itaquê palpa o teu arco e o verga até o ombro, como se fosse de taquari.',
    'The Tapuia return with Agniná, Canicrã’s brother, to avenge him. Without a chief, the Tocantin nation is like a herd of peccaries that has lost its leader. The old hero crosses the village guided by Araci, with the singers going ahead with a song of peace. “Take up Itaquê’s bow, chief of the Araguaia, and by your heroism you will win a wife and a nation.” Itaquê feels your bow and bends it to his shoulder as if it were made of cane.',
    'I tapuia tornano con Agniná, fratello di Canicrã, per vendicarlo. Senza capo, la nazione tocantin è come il branco di pecari che ha perso il padre. Il vecchio eroe attraversa il villaggio guidato da Araci, e i cantori lo precedono con un canto di pace. «Impugna l’arco di Itaquê, capo degli araguaia, e conquisterai con il tuo eroismo una sposa e una nazione.» Itaquê tasta il tuo arco e lo piega fino alla spalla come se fosse di canna.',
    'Los tapuias vuelven con Agniná, hermano de Canicrã, para vengarlo. Sin jefe, la nación tocantín está como la manada de pecaríes que perdió a su padre. El viejo héroe cruza la aldea guiado por Araci, y los cantores van delante con un canto de paz. «Empuña el arco de Itaquê, jefe de los araguaias, y conquistarás por tu heroísmo una esposa y una nación.» Itaquê palpa tu arco y lo dobla hasta el hombro, como si fuera de caña.'),
    choices: [{ t: L('Erguer o arco de Itaquê acima da fronte e disparar', 'Raise Itaquê’s bow above your head and shoot', 'Alzare l’arco di Itaquê sopra la fronte e scoccare', 'Alzar el arco de Itaquê por encima de la frente y disparar'), test: { a: 'for', dc: 12, bonus: 'fama', ok: 'ix_uniao', fail: 'ix_arco_no' } }] });
  sc('ix_arco_no', { act: 9, loc: 'campo_toc', time: 'manha', fx: { vigor: -2 }, text: L(
    'O grande arco do Tocantim resiste; a seta parte torta. Itaquê inclina a cabeça para ouvir. Firme os pés e tente de novo.',
    'The great bow of Tocantim resists; the arrow flies crooked. Itaquê tilts his head to listen. Plant your feet and try again.',
    'Il grande arco di Tocantim resiste; la freccia parte storta. Itaquê china il capo per ascoltare. Pianta bene i piedi e riprova.',
    'El gran arco del Tocantim resiste; la flecha sale torcida. Itaquê inclina la cabeza para escuchar. Afirma los pies e inténtalo de nuevo.'),
    choices: [{ t: L('Disparar outra vez', 'Shoot again', 'Scoccare di nuovo', 'Disparar otra vez'), test: { a: 'for', dc: 10, bonus: 'fama', ok: 'ix_uniao', fail: 'ix_arco_no' } }] });
  sc('ix_uniao', { act: 9, loc: 'campo_toc', time: 'manha', fx: { fama: 3 }, item: 'arco_gemeo', text: L(
    'O semblante de Itaquê remoça ao ouvir o zunido que lhe recorda o tempo do seu vigor. Ubirajara toma o arco de Camacã: a flecha araguaia atravessa no ar a tocantim que voltava à terra, e as duas descem trespassadas, como braços cruzados em amizade. — “Este é o emblema da união.” Três guerreiros de cada nação atam com fio de crautá as hastes dos dois arcos. Araci rompe a liga vermelha e a ata ao pulso do seu guerreiro.',
    'Itaquê’s face grows young at the hum that recalls the days of his strength. Ubirajara takes Camacã’s bow: the Araguaia arrow pierces in the air the Tocantin arrow falling back to earth, and the two come down transfixed, like arms crossed in friendship. “This is the emblem of union.” Three warriors of each nation bind the shafts of the two bows with crautá cord. Araci breaks her red band and ties it to her warrior’s wrist.',
    'Il volto di Itaquê ringiovanisce al sibilo che gli ricorda il tempo del suo vigore. Ubirajara prende l’arco di Camacã: la freccia araguaia trafigge in aria quella tocantin che tornava a terra, e le due scendono infilate, come braccia incrociate in amicizia. «Questo è l’emblema dell’unione.» Tre guerrieri di ciascuna nazione legano con filo di crautá le aste dei due archi. Araci rompe la giarrettiera rossa e la lega al polso del suo guerriero.',
    'El semblante de Itaquê rejuvenece al oír el zumbido que le recuerda el tiempo de su vigor. Ubirajara toma el arco de Camacã: la flecha araguaia atraviesa en el aire a la tocantín que volvía a la tierra, y ambas bajan traspasadas, como brazos cruzados en amistad. «Este es el emblema de la unión.» Tres guerreros de cada nación atan con hilo de crautá las astas de los dos arcos. Araci rompe la liga roja y la ata a la muñeca de su guerrero.'),
    choices: [{ t: L('Sair ao encontro de Agniná', 'Go out to meet Agniná', 'Andare incontro ad Agniná', 'Salir al encuentro de Agniná'), go: 'ix_setas' }] });
  sc('ix_setas', { act: 9, loc: 'campo_toc', time: 'dia', type: 'archery', a: 'des', size: 0.14, text: L(
    'Com mil guerreiros araguaias e mil tocantins, Ubirajara caminha só para o inimigo. Um turbilhão de setas crava o seu longo escudo. Com o pé ele brande sete vezes a corda do grande arco gêmeo: as setas vermelhas e amarelas sobem direitas ao céu, para voltar sobre os chefes tapuias como desafio.',
    'With a thousand Araguaia and a thousand Tocantin warriors behind him, Ubirajara walks alone toward the enemy. A storm of arrows riddles his long shield. Using his foot, he draws the cord of the great twin bow seven times: the red and yellow arrows climb straight into the sky, to fall back on the Tapuia chiefs as a challenge.',
    'Con mille guerrieri araguaia e mille tocantins, Ubirajara cammina da solo verso il nemico. Un turbine di frecce crivella il suo lungo scudo. Con il piede tende sette volte la corda del grande arco gemello: le frecce rosse e gialle salgono dritte al cielo, per ricadere sui capi tapuia come sfida.',
    'Con mil guerreros araguaias y mil tocantins, Ubirajara camina solo hacia el enemigo. Un torbellino de flechas acribilla su largo escudo. Con el pie tensa siete veces la cuerda del gran arco gemelo: las flechas rojas y amarillas suben rectas al cielo, para caer sobre los jefes tapuias como desafío.'),

  sc('end_lenda', { act: 9, loc: 'taba_toc', time: 'tarde', end: 'lenda', text: L(
    'Cai Agniná ao primeiro bote; após ele caem os chefes tapuias. Desde esse dia nenhum tapuia pisa as margens do grande rio. Araci despe as armas do guerreiro, cobre-o do bálsamo da embaíba e lhe dá cauim na taça vermelha de coco de sapucaia. Depois volta conduzindo Jandira pela mão: — “Jandira é irmã de Araci.” As duas nações, dos araguaias e dos tocantins, formam a grande nação dos Ubirajaras, que toma o nome do herói. “Mais tarde, quando vieram os caramurus, guerreiros do mar, ela campeava ainda nas margens do grande rio.”',
    'Agniná falls at the first thrust; after him fall the Tapuia chiefs. From that day no Tapuia treads the banks of the great river. Araci removes the warrior’s weapons, covers him with embaíba balm and gives him cauim in the red cup made of a sapucaia shell. Then she returns leading Jandira by the hand: “Jandira is Araci’s sister.” The two nations, Araguaia and Tocantin, form the great nation of the Ubirajaras, which takes the hero’s name. “Later, when the caramurus came, warriors from the sea, it still roamed the banks of the great river.”',

    'Cae Agniná al primer golpe; tras él caen los jefes tapuias. Desde ese día ningún tapuia pisa las orillas del gran río. Araci quita las armas al guerrero, lo cubre con el bálsamo de la embaíba y le da cauim en la copa roja de coco de sapucaia. Después vuelve llevando a Jandira de la mano: «Jandira es hermana de Araci.» Las dos naciones, araguaias y tocantins, forman la gran nación de los Ubirajaras, que toma el nombre del héroe. «Más tarde, cuando vinieron los caramurus, guerreros del mar, ella aún campeaba por las orillas del gran río.»') });

  sc('end_traicao', { act: 7, loc: 'floresta', time: 'noite', end: 'traicao', text: L(
    'Você leva Araci pela noite. Mas quem rompe a hospitalidade leva a traição para a terra que o acolheu: os mil guerreiros de Itaquê partem com a sombra, e nem os araguaias recebem com orgulho um chefe que roubou a filha do seu anfitrião. A guerra que vem não terá cantores.',

    'Porti via Araci nella notte. Ma chi rompe l’ospitalità porta il tradimento nella terra che lo ha accolto: i mille guerrieri di Itaquê partono con l’ombra, e nemmeno gli araguaia accolgono con orgoglio un capo che ha rapito la figlia del suo ospite. La guerra che verrà non avrà cantori.',

  sc('end_rejeitado', { act: 6, loc: 'campo_toc', time: 'tarde', end: 'rejeitado', text: L(

  sc('end_desonra', { act: 9, loc: 'campo_toc', time: 'manha', end: 'desonra', text: L(

  // códice: costumes e objetos, com a fonte de cada verbete (R = romance, cap.; W = Wikipédia)
  const SABER = {
    nacoes: { n: L('As nações do romance', 'The nations of the novel', 'Le nazioni del romanzo', 'Las naciones de la novela'), src: 'R:Intro,II,IX', t: L(
      'O romance chama as nações de araguaias e tocantins, nomes dos dois rios, e põe a união no sítio onde eles se abraçam. Na introdução, Alencar cita uma nação real chamada Ubirajara, que Gabriel Soares de Sousa situou nas cabeceiras do rio São Francisco.',
      'The novel calls the nations Araguaia and Tocantin, the names of two rivers, and places their union where the rivers embrace. In the introduction Alencar cites a real nation called Ubirajara, which Gabriel Soares de Sousa placed at the headwaters of the São Francisco river.',
      'Il romanzo chiama le nazioni araguaia e tocantin, nomi di due fiumi, e colloca l’unione dove i fiumi si abbracciano. Nell’introduzione Alencar cita una nazione reale chiamata Ubirajara, che Gabriel Soares de Sousa collocò alle sorgenti del fiume São Francisco.',
      'La novela llama a las naciones araguaias y tocantins, nombres de dos ríos, y sitúa la unión donde los ríos se abrazan. En la introducción, Alencar cita una nación real llamada Ubirajara, que Gabriel Soares de Sousa situó en las cabeceras del río São Francisco.') },
    desafio: { n: L('A seta do desafio', 'The arrow of challenge', 'La freccia della sfida', 'La flecha del desafío'), src: 'R:I', t: L(
      'No romance, guerreiros de nações em paz podem oferecer combate leal: um dispara uma seta no ar, e quem aceita responde com outra.',
      'In the novel, warriors of nations at peace may offer a fair fight: one shoots an arrow into the air, and whoever accepts answers with another.',
      'Nel romanzo, guerrieri di nazioni in pace possono offrire un combattimento leale: uno scocca una freccia in aria, e chi accetta risponde con un’altra.',
      'En la novela, guerreros de naciones en paz pueden ofrecer combate leal: uno dispara una flecha al aire y quien acepta responde con otra.') },
    lanca: { n: L('A lança de duas pontas', 'The two-pointed spear', 'La lancia a due punte', 'La lanza de dos puntas'), src: 'R:Intro,I', t: L(
      'Jaguarê a fabrica de craúba endurecida ao fogo. Na introdução, Alencar cita Gabriel Soares de Sousa (Roteiro do Brasil, cap. 182): os Ubirajaras lutavam com “paus tostados muito agudos, de comprimento de três palmos”, pontudos nas duas pontas e atirados como punhais; daí o nome de bilreiros que lhes deram os sertanistas.',
      'Jaguarê makes it from fire-hardened craúba. In the introduction Alencar quotes Gabriel Soares de Sousa (Roteiro do Brasil, ch. 182): the Ubirajaras fought with “very sharp fire-toasted sticks, three spans long”, pointed at both ends and thrown like daggers; hence the name bilreiros given them by the backwoodsmen.',
      'Jaguarê la fabbrica di craúba indurita al fuoco. Nell’introduzione Alencar cita Gabriel Soares de Sousa (Roteiro do Brasil, cap. 182): gli Ubirajara combattevano con «bastoni tostati molto aguzzi, lunghi tre palmi», appuntiti alle due estremità e lanciati come pugnali; da qui il nome di bilreiros datogli dai sertanistas.',
      'Jaguarê la fabrica de craúba endurecida al fuego. En la introducción, Alencar cita a Gabriel Soares de Sousa (Roteiro do Brasil, cap. 182): los Ubirajaras luchaban con «palos tostados muy agudos, de tres palmos de largo», puntiagudos en ambos extremos y arrojados como puñales; de ahí el nombre de bilreiros que les dieron los sertanistas.') },
    ombro: { n: L('O sinal da conquista', 'The sign of conquest', 'Il segno della conquista', 'La señal de la conquista'), src: 'R:I,III', t: L(
      'A mão direita calcada no ombro esquerdo do vencido o prende ao vencedor. No romance, quem violasse essa lei perderia para sempre o título de guerreiro, e por isso Pojucã não foge.',
      'The right hand pressed on the defeated man’s left shoulder binds him to the victor. In the novel, whoever broke that law would lose the title of warrior forever, which is why Pojucã does not flee.',
      'La mano destra premuta sulla spalla sinistra del vinto lo lega al vincitore. Nel romanzo chi violava questa legge perdeva per sempre il titolo di guerriero, ed è per questo che Pojucã non fugge.',
      'La mano derecha apoyada en el hombro izquierdo del vencido lo ata al vencedor. En la novela, quien violara esa ley perdería para siempre el título de guerrero, y por eso Pojucã no huye.') },
    trocano: { n: L('Trocano e inúbia', 'Drum and horn', 'Tamburo e corno', 'Trocano e inúbia'), src: 'R:II,VII;W:Inúbia', t: L(
      'No romance, o trocano é o grande tambor que chama as tabas à festa e à guerra, e a inúbia, a trombeta do chefe. A Wikipédia observa que “inúbia” e “boré” são nomes dados pelos poetas: não aparecem nos escritos dos cronistas coloniais nem no vocabulário tupi dos jesuítas.',
      'In the novel, the trocano is the great drum that calls the villages to feast and war, and the inúbia is the chief’s horn. Wikipedia notes that “inúbia” and “boré” are names given by poets: they do not appear in colonial chroniclers’ writings or in the Jesuits’ Tupi vocabulary.',
      'Nel romanzo il trocano è il grande tamburo che chiama i villaggi alla festa e alla guerra, e l’inúbia è il corno del capo. Wikipedia osserva che «inúbia» e «boré» sono nomi dati dai poeti: non compaiono negli scritti dei cronisti coloniali né nel vocabolario tupi dei gesuiti.',
      'En la novela, el trocano es el gran tambor que llama a las aldeas a la fiesta y a la guerra, y la inúbia, la trompeta del jefe. La Wikipedia observa que «inúbia» y «boré» son nombres dados por los poetas: no aparecen en los escritos de los cronistas coloniales ni en el vocabulario tupí de los jesuitas.') },
    arco: { n: L('O grande arco da nação', 'The nation’s great bow', 'Il grande arco della nazione', 'El gran arco de la nación'), src: 'R:II,VIII', t: L(
      'De ubiratã, grosso como o braço do mais robusto guerreiro, com corda trançada de crautá da grossura de um dedo. É a insígnia do chefe na guerra e passa ao mais forte. O arco de Itaquê veio do fundador Tocantim, passando por Javari.',
      'Of ubiratã wood, as thick as the strongest warrior’s arm, with a braided crautá cord as thick as a finger. It is the war chief’s insignia and passes to the strongest. Itaquê’s bow came from the founder Tocantim, through Javari.',
      'Di ubiratã, spesso come il braccio del guerriero più robusto, con corda intrecciata di crautá grossa come un dito. È l’insegna del capo in guerra e passa al più forte. L’arco di Itaquê venne dal fondatore Tocantim, attraverso Javari.',
      'De ubiratã, grueso como el brazo del guerrero más robusto, con cuerda trenzada de crautá del grosor de un dedo. Es la insignia del jefe en la guerra y pasa al más fuerte. El arco de Itaquê vino del fundador Tocantim, pasando por Javari.') },
    cauim: { n: L('Cauim', 'Cauim', 'Cauim', 'Cauim'), src: 'R:II,IV,IX;W:Cauim', t: L(
      'No romance, as mulheres servem o cauim nas festas, e Alencar o faz de caju e ananás. Segundo a Wikipédia, o cauim tradicional é fermentado de mandioca ou milho, às vezes com sucos de fruta: a matéria-prima é cozida, mastigada e recozida, para que a saliva quebre o amido em açúcares.',
      'In the novel, women serve cauim at feasts, and Alencar makes it from cashew and pineapple. According to Wikipedia, traditional cauim is fermented from manioc or maize, sometimes with fruit juice: the raw material is cooked, chewed and cooked again so that saliva breaks the starch into sugars.',
      'Nel romanzo le donne servono il cauim alle feste, e Alencar lo fa di anacardio e ananas. Secondo Wikipedia, il cauim tradizionale è fermentato da manioca o mais, a volte con succhi di frutta: la materia prima è cotta, masticata e ricotta perché la saliva scomponga l’amido in zuccheri.',
      'En la novela, las mujeres sirven el cauim en las fiestas, y Alencar lo hace de cajú y piña. Según la Wikipedia, el cauim tradicional se fermenta de mandioca o maíz, a veces con jugos de fruta: la materia prima se cuece, se mastica y se vuelve a cocer para que la saliva rompa el almidón en azúcares.') },
    embaiba: { n: L('Bálsamo da embaíba', 'Embaíba balm', 'Balsamo di embaíba', 'Bálsamo de embaíba'), src: 'R:III,IX;W:Embaúba', t: L(
      'No romance, o bálsamo da embaíba sara depressa os golpes mais profundos e é passado no corpo do guerreiro depois do combate. Embaúba é o nome comum de várias espécies de árvores.',
      'In the novel, embaíba balm quickly heals the deepest wounds and is rubbed on the warrior’s body after battle. Embaúba is the common name of several tree species.',
      'Nel romanzo il balsamo di embaíba guarisce presto le ferite più profonde ed è spalmato sul corpo del guerriero dopo il combattimento. Embaúba è il nome comune di varie specie di alberi.',
      'En la novela, el bálsamo de la embaíba sana pronto las heridas más profundas y se unta en el cuerpo del guerrero después del combate. Embaúba es el nombre común de varias especies de árboles.') },
    hospitalidade: { n: L('A lei da hospitalidade', 'The law of hospitality', 'La legge dell’ospitalità', 'La ley de la hospitalidad'), src: 'R:IV,VII', t: L(
      'O estrangeiro chega à distância de um tiro de flecha, toca a inúbia, quebra a seta e alça a mão direita. Ninguém pergunta seu nome nem sua nação; o chefe que o recebe escolhe-lhe um nome, e o hóspede “manda na taba”. Por essa lei, Itaquê não se vinga no hóspede que matou seu filho.',
      'The stranger arrives an arrow’s flight away, sounds the horn, breaks an arrow and raises his right hand. No one asks his name or nation; the chief who receives him chooses a name for him, and the guest “commands in the village”. By this law Itaquê takes no revenge on the guest who killed his son.',
      'Lo straniero arriva a un tiro di freccia, suona il corno, spezza la freccia e alza la mano destra. Nessuno chiede il suo nome né la sua nazione; il capo che lo accoglie gli sceglie un nome, e l’ospite «comanda nel villaggio». Per questa legge Itaquê non si vendica sull’ospite che ha ucciso suo figlio.',
      'El extranjero llega a la distancia de un tiro de flecha, toca la inúbia, quiebra la flecha y alza la mano derecha. Nadie pregunta su nombre ni su nación; el jefe que lo recibe le elige un nombre, y el huésped «manda en la aldea». Por esa ley Itaquê no se venga en el huésped que mató a su hijo.') },
    rede: { n: L('A rede', 'The hammock', 'L’amaca', 'La hamaca'), src: 'R:III,IV;W:Rede de dormir', t: L(
      'Itaquê tece uma rede de penas de galo-da-serra com a lançadeira, enquanto as mulheres urdem os fios de algodão nos dedos; Jandira prepara a rede de casamento de algodão e penas de guará. A Wikipédia registra que a rede foi concebida pelos povos indígenas das Américas a partir de fibras naturais.',
      'Itaquê weaves a hammock of cock-of-the-rock feathers with a shuttle while the women warp the cotton threads on their fingers; Jandira prepares a wedding hammock of cotton and scarlet ibis feathers. Wikipedia records that the hammock was devised by the indigenous peoples of the Americas from natural fibres.',
      'Itaquê tesse un’amaca di piume di galletto di roccia con la spola, mentre le donne ordiscono i fili di cotone sulle dita; Jandira prepara l’amaca nuziale di cotone e piume di ibis scarlatto. Wikipedia registra che l’amaca fu ideata dai popoli indigeni delle Americhe con fibre naturali.',
      'Itaquê teje una hamaca de plumas de gallito de roca con la lanzadera, mientras las mujeres urden los hilos de algodón en los dedos; Jandira prepara la hamaca de bodas de algodón y plumas de corocoro. La Wikipedia registra que la hamaca fue concebida por los pueblos indígenas de las Américas a partir de fibras naturales.') },
    farinha: { n: L('O banquete da chegada', 'The welcome feast', 'Il banchetto dell’arrivo', 'El banquete de la llegada'), src: 'R:IV;W:Mandioca;W:Farinha de mandioca', t: L(
      'Farinha-d’água em urus, moquecas envoltas em folhas, carne assada no biaribi, um forno cavado na terra, e frutas. A farinha de mandioca é de origem ameríndia; a mandioca só pode ser comida depois de cozida, para reduzir o cianeto que contém.',
      'Farinha-d’água in baskets, fish wrapped in leaves, meat roasted in the biaribi, an oven dug in the earth, and fruit. Manioc flour is of Amerindian origin; manioc can only be eaten after cooking, to reduce the cyanide it contains.',
      'Farinha-d’água in ceste, pesce avvolto in foglie, carne arrostita nel biaribi, un forno scavato nella terra, e frutta. La farina di manioca è di origine amerindia; la manioca si può mangiare solo dopo la cottura, per ridurre il cianuro che contiene.',
      'Farinha-d’água en cestos, moquecas envueltas en hojas, carne asada en el biaribi, un horno cavado en la tierra, y frutas. La harina de mandioca es de origen amerindio; la mandioca solo puede comerse después de cocida, para reducir el cianuro que contiene.') },
    moquem: { n: L('O moquém', 'The moquém', 'Il moquém', 'El moquém'), src: 'R:VI;W:Moquém', t: L(
      'Grelha de madeira apoiada em forquilhas fincadas no chão, usada para defumar carne ou peixe. No romance, Jurandir canta a carne do veado assado no moquém.',
      'A wooden grill on forked sticks driven into the ground, used to smoke meat or fish. In the novel, Jurandir sings of venison roasted on the moquém.',
      'Graticola di legno appoggiata su forcelle piantate nel terreno, usata per affumicare carne o pesce. Nel romanzo Jurandir canta la carne di cervo arrostita sul moquém.',
      'Parrilla de madera apoyada en horquetas clavadas en el suelo, usada para ahumar carne o pescado. En la novela, Jurandir canta la carne de venado asada en el moquém.') },
    tupinamba: { n: L('Tupinambás', 'Tupinambá', 'Tupinambá', 'Tupinambás'), src: 'R:IV;W:Tupinambás', t: L(
      'No romance, nação das praias do mar, “descendentes da mais antiga geração de Tupi”. A Wikipédia descreve os tupinambás do século XVI em dois trechos da costa, um na Bahia e outro do Rio de Janeiro a São Paulo, com cerca de 100 mil pessoas, e o uso mais amplo do nome para os falantes de tupi antigo.',
      'In the novel, a nation of the seashore, “descendants of the oldest generation of Tupi”. Wikipedia describes the 16th-century Tupinambá on two stretches of coast, one in Bahia and another from Rio de Janeiro to São Paulo, about 100,000 people, and the wider use of the name for speakers of Old Tupi.',
      'Nel romanzo, nazione delle spiagge del mare, «discendenti della più antica generazione di Tupi». Wikipedia descrive i tupinambá del XVI secolo su due tratti di costa, uno a Bahia e l’altro da Rio de Janeiro a San Paolo, circa 100.000 persone, e l’uso più ampio del nome per i parlanti di tupi antico.',
      'En la novela, nación de las playas del mar, «descendientes de la más antigua generación de Tupí». La Wikipedia describe a los tupinambás del siglo XVI en dos tramos de costa, uno en Bahía y otro de Río de Janeiro a São Paulo, unas 100.000 personas, y el uso más amplio del nombre para los hablantes de tupí antiguo.') },
    mandioca: { n: L('Sumé e a mandioca', 'Sumé and manioc', 'Sumé e la manioca', 'Sumé y la mandioca'), src: 'R:IV;W:Mandioca', t: L(
      'No canto da hospitalidade, Sumé, o primeiro hóspede, ensina as nações a plantar a mandioca para fazer a farinha. A mandioca (Manihot esculenta) é nativa da América do Sul.',
      'In the song of hospitality, Sumé, the first guest, teaches the nations to plant manioc to make flour. Manioc (Manihot esculenta) is native to South America.',
      'Nel canto dell’ospitalità Sumé, il primo ospite, insegna alle nazioni a piantare la manioca per fare la farina. La manioca (Manihot esculenta) è originaria del Sud America.',
      'En el canto de la hospitalidad, Sumé, el primer huésped, enseña a las naciones a plantar la mandioca para hacer harina. La mandioca (Manihot esculenta) es nativa de América del Sur.') },
    roca: { n: L('A roça', 'The field', 'Il campo coltivato', 'La roza'), src: 'R:V', t: L(
      'Jurandir prepara os matumbos para Jacamim enterrar as estacas da maniva e semear feijão, milho e fumo. Segundo o romance, a plantação devia ser feita pela mão da mulher mãe de muitos filhos, que transmitia à terra sua fecundidade.',
      'Jurandir prepares the mounds for Jacamim to bury the manioc cuttings and sow beans, maize and tobacco. According to the novel, planting had to be done by a woman who was a mother of many children, for she passed her fertility to the earth.',
      'Jurandir prepara i cumuli perché Jacamim interri le talee di manioca e semini fagioli, mais e tabacco. Secondo il romanzo, la semina doveva essere fatta dalla mano della donna madre di molti figli, che trasmetteva alla terra la sua fecondità.',
      'Jurandir prepara los montículos para que Jacamim entierre las estacas de maniva y siembre frijol, maíz y tabaco. Según la novela, la siembra debía hacerla la mano de la mujer madre de muchos hijos, que transmitía a la tierra su fecundidad.') },
    casamento: { n: L('O combate nupcial', 'The wedding contest', 'Il combattimento nuziale', 'El combate nupcial'), src: 'R:Adv,VI', t: L(
      'Os noivos disputam a virgem em provas de tacape, corrida com o toro e constância; na última, a prova da virgem, ela pode fugir de quem não quer. Na Advertência, Alencar critica Barlaeus, que comentou com desdém as justas indígenas pela virgem mais formosa.',
      'The suitors contend for the maiden in trials of the club, the log race and constancy; in the last, the maiden’s trial, she may run from a man she does not want. In the Foreword, Alencar criticizes Barlaeus, who commented with contempt on the indigenous contests for the most beautiful maiden.',
      'I pretendenti si contendono la fanciulla in prove di mazza, corsa con il ceppo e costanza; nell’ultima, la prova della fanciulla, lei può fuggire da chi non vuole. Nell’Avvertenza Alencar critica Barlaeus, che commentò con disprezzo le giostre indigene per la fanciulla più bella.',
      'Los novios se disputan a la doncella en pruebas de tacape, carrera con el tronco y constancia; en la última, la prueba de la doncella, ella puede huir de quien no quiere. En la Advertencia, Alencar critica a Barlaeus, que comentó con desdén las justas indígenas por la doncella más hermosa.') },
    sauva: { n: L('O camucim das saúvas', 'The jar of leafcutter ants', 'Il vaso delle saúvas', 'El cántaro de las saúvas'), src: 'R:VI;W:Saúva', t: L(
      'O pajé fecha num vaso, desde a última lua, um formigueiro de saúvas, e o noivo mete a mão ali sem mostrar dor. Saúvas são formigas-cortadeiras do gênero Atta, que cultivam um fungo nas folhas que cortam.',
      'Since the last moon the shaman has kept a nest of leafcutter ants in a jar, and the suitor puts his hand into it without showing pain. Saúvas are leafcutter ants of the genus Atta, which grow a fungus on the leaves they cut.',
      'Dall’ultima luna lo sciamano tiene chiuso in un vaso un formicaio di saúvas, e il pretendente vi infila la mano senza mostrare dolore. Le saúvas sono formiche tagliafoglie del genere Atta, che coltivano un fungo sulle foglie che tagliano.',
      'El pajé encierra en un cántaro, desde la última luna, un hormiguero de saúvas, y el novio mete allí la mano sin mostrar dolor. Las saúvas son hormigas cortadoras del género Atta, que cultivan un hongo en las hojas que cortan.') },
    tapuias: { n: L('Tapuias', 'Tapuia', 'Tapuia', 'Tapuias'), src: 'R:I,VII-IX;W:Tapuias', t: L(
      'No romance, os “bárbaros tapuias” de Canicrã e Agniná usam flechas com asas negras de anum. Tapuia é um termo tupi usado no começo da colonização para os indígenas que não falavam o tupi antigo, em geral falantes de línguas macro-jê: um nome dado pelos rivais, não por eles mesmos.',
      'In the novel, the “barbarian Tapuia” of Canicrã and Agniná use arrows fletched with black ani wings. Tapuia is a Tupi term used early in colonization for indigenous people who did not speak Old Tupi, mostly speakers of Macro-Jê languages: a name given by rivals, not by themselves.',
      'Nel romanzo i «barbari tapuia» di Canicrã e Agniná usano frecce con ali nere di anù. Tapuia è un termine tupi usato all’inizio della colonizzazione per gli indigeni che non parlavano il tupi antico, per lo più parlanti di lingue macro-jê: un nome dato dai rivali, non da loro stessi.',
      'En la novela, los «bárbaros tapuias» de Canicrã y Agniná usan flechas con alas negras de anó. Tapuia es un término tupí usado al comienzo de la colonización para los indígenas que no hablaban tupí antiguo, en general hablantes de lenguas macro-jê: un nombre dado por los rivales, no por ellos mismos.') },
    anta: { n: L('A anta', 'The tapir', 'Il tapiro', 'El tapir'), src: 'R:V;W:Anta', t: L(
      'Maior mamífero terrestre do Brasil, com até 300 quilos. No romance, Jurandir segura pelo pé a anta velha que rompera a sucuri como uma corda.',
      'Brazil’s largest land mammal, weighing up to 300 kilograms. In the novel, Jurandir holds by the foot the old tapir that had snapped an anaconda like a rope.',
      'Il più grande mammifero terrestre del Brasile, fino a 300 chili. Nel romanzo Jurandir trattiene per una zampa il vecchio tapiro che aveva spezzato l’anaconda come una corda.',
      'El mayor mamífero terrestre de Brasil, de hasta 300 kilos. En la novela, Jurandir sujeta por la pata al viejo tapir que había roto a la sucuri como una cuerda.') },
    urucum: { n: L('Tintas vermelhas', 'Red dyes', 'Tinture rosse', 'Tintes rojos'), src: 'R:IV;W:Urucum', t: L(
      'O romance cita o crajuru, que dá às cumbucas “o mais brilhante carmim”. O urucum (Bixa orellana), de sementes envoltas em arilo vermelho, é nativo da América tropical.',
      'The novel mentions crajuru, which gives the bowls “the most brilliant carmine”. Annatto (Bixa orellana), whose seeds are wrapped in a red aril, is native to tropical America.',
      'Il romanzo cita il crajuru, che dà alle ciotole «il carminio più brillante». L’annatto (Bixa orellana), dai semi avvolti in un arillo rosso, è originario dell’America tropicale.',
      'La novela cita el crajuru, que da a las cuencas «el más brillante carmín». El achiote (Bixa orellana), de semillas envueltas en un arilo rojo, es nativo de la América tropical.') },
    jenipapo: { n: L('Jenipapo', 'Genipap', 'Genipapo', 'Jagua'), src: 'W:Jenipapo', t: L(
      'O fruto verde do jenipapeiro (Genipa americana) é usado por muitas etnias da América do Sul na pintura corporal azul-escura, que some em cerca de duas semanas.',
      'The green fruit of the genipap tree (Genipa americana) is used by many South American peoples for dark blue body paint, which fades after about two weeks.',
      'Il frutto verde del genipapo (Genipa americana) è usato da molti popoli del Sud America per la pittura corporea blu scuro, che scompare in circa due settimane.',
      'El fruto verde de la jagua (Genipa americana) es usado por muchos pueblos de América del Sur en la pintura corporal azul oscura, que desaparece en unas dos semanas.') },
    cocar: { n: L('Cocares e penas', 'Headdresses and feathers', 'Copricapi e piume', 'Penachos y plumas'), src: 'R:I,IV,VII;W:Cocar', t: L(
      'No romance, a pena vermelha da arara marca os araguaias; as plumas de tucano, os tocantins; as asas negras do anum, os tapuias. O cocar podia ser adorno ou sinal de status, conforme a etnia.',
      'In the novel, the red macaw feather marks the Araguaia; toucan plumes, the Tocantins; black ani wings, the Tapuia. A headdress could be an ornament or a sign of status, depending on the people.',
      'Nel romanzo la piuma rossa dell’ara contraddistingue gli araguaia; le piume di tucano, i tocantins; le ali nere dell’anù, i tapuia. Il copricapo poteva essere ornamento o segno di rango, secondo il popolo.',
      'En la novela, la pluma roja del guacamayo distingue a los araguaias; las plumas de tucán, a los tocantins; las alas negras del anó, a los tapuias. El penacho podía ser adorno o señal de estatus, según el pueblo.') },

  const RULES = {
    pt: `<h3>Como jogar</h3><p>Leia a cena e escolha. Algumas escolhas pedem um <b>teste</b>: dois dados de seis faces mais um atributo, contra uma dificuldade. Os atributos são Força, Agilidade, Destreza, Constância e Palavra; em alguns marcos você ganha pontos para aumentá-los. A <b>Fama</b> ajuda a vergar os grandes arcos. A <b>Honra</b> sobe quando você respeita as leis dos guerreiros e da hospitalidade, e sem ela as nações não se unem. O <b>Afeto de Araci</b> e o mérito nas provas decidem a prova da virgem.</p><p>Na exploração, cada ação gasta parte do dia e aumenta a fome; coma a provisão para não perder vigor. No combate, escolha a ação a cada rodada: veja a nota do adversário. No tiro com arco, solte a flecha com a barra de espaço quando a marca passar pelo alvo. A mesma semente dá sempre os mesmos dados. Se perder, você pode recomeçar o ato.</p><p>Teclado: Tab percorre as escolhas e Enter escolhe.</p>
<h3>Sobre o livro</h3><p><i>Ubirajara: lenda tupi</i>, de José de Alencar, foi publicado em 1874 e é, nas palavras do autor, “irmão de Iracema”. É um romance indianista, escrito no Romantismo para responder aos cronistas que pintavam os indígenas como feras; idealiza os povos que retrata e põe na boca deles a fala de heróis de cavalaria. Os nomes de nações araguaia e tocantim são os dos rios. O jogo segue os nove capítulos e cita frases do autor. Episódios em que mulheres são dadas ou disputadas pelos guerreiros são narrados como estão no livro, sem passar a decisão ao jogador.</p>
<h3>Componentes de época</h3><p>Armas, objetos, comidas e costumes vêm do texto do romance, citado por capítulo, e de verbetes da Wikipédia em português sobre a cultura material indígena. Onde o romance e as fontes divergem, o códice de <b>Saberes</b> diz isso: por exemplo, o cauim de Alencar é de caju e ananás, e o verbete descreve cauim de mandioca ou milho; “inúbia” é um nome dado pelos poetas. As notas que Alencar pôs no fim do livro não foram usadas, porque não estão transcritas na edição consultada.</p>
<h3>Fontes</h3><ul><li>José de Alencar, <i>Ubirajara</i> (1874), texto no Wikisource: pt.wikisource.org/wiki/Ubirajara, consultado em 22/11/2026.</li><li>Wikipédia em português, consultada em 22/11/2026: Cauim, Moquém, Inúbia, Rede de dormir, Urucum, Mandioca, Farinha de mandioca, Tupinambás, Jenipapo, Anta, Saúva, Tapuias, Embaúba, Cocar.</li></ul>`,
    en: `<h3>How to play</h3><p>Read the scene and choose. Some choices call for a <b>check</b>: two six-sided dice plus an attribute, against a difficulty. The attributes are Strength, Agility, Dexterity, Constancy and Word; at some milestones you earn points to raise them. <b>Fame</b> helps you draw the great bows. <b>Honour</b> rises when you respect the laws of warriors and of hospitality, and without it the nations will not unite. <b>Araci’s affection</b> and your merit in the trials decide the maiden’s trial.</p><p>When exploring, each action uses part of the day and increases hunger; eat your provisions so as not to lose vigour. In combat, choose an action each round: read the opponent’s note. In archery, release with the space bar when the mark crosses the target. The same seed always gives the same dice. If you lose, you can restart the act.</p><p>Keyboard: Tab moves through the choices and Enter selects.</p>
<h3>About the book</h3><p><i>Ubirajara: a Tupi legend</i>, by José de Alencar, was published in 1874 and is, in the author’s words, “Iracema’s brother”. It is an Indianist novel, written during Romanticism to answer the chroniclers who painted indigenous people as beasts; it idealizes the peoples it portrays and gives them the speech of chivalric heroes. The nation names Araguaia and Tocantin are the names of rivers. The game follows the nine chapters and quotes the author. Episodes in which women are given or contested by warriors are narrated as in the book, without handing the decision to the player.</p>
<h3>Period components</h3><p>Weapons, objects, foods and customs come from the novel’s text, cited by chapter, and from Portuguese Wikipedia articles on indigenous material culture. Where the novel and the sources differ, the <b>Lore</b> codex says so: for example, Alencar’s cauim is made of cashew and pineapple, while the article describes cauim of manioc or maize; “inúbia” is a name given by poets. The notes Alencar placed at the end of the book were not used, because they are not transcribed in the edition consulted.</p>
<h3>Sources</h3><ul><li>José de Alencar, <i>Ubirajara</i> (1874), text on Wikisource: pt.wikisource.org/wiki/Ubirajara, consulted on 22/11/2026.</li><li>Portuguese Wikipedia, consulted on 22/11/2026: Cauim, Moquém, Inúbia, Rede de dormir, Urucum, Mandioca, Farinha de mandioca, Tupinambás, Jenipapo, Anta, Saúva, Tapuias, Embaúba, Cocar.</li></ul>`,
    it: `<h3>Come si gioca</h3><p>Leggi la scena e scegli. Alcune scelte richiedono una <b>prova</b>: due dadi a sei facce più un attributo, contro una difficoltà. Gli attributi sono Forza, Agilità, Destrezza, Costanza e Parola; in alcune tappe guadagni punti per aumentarli. La <b>Fama</b> aiuta a tendere i grandi archi. L’<b>Onore</b> sale quando rispetti le leggi dei guerrieri e dell’ospitalità, e senza di esso le nazioni non si uniscono. L’<b>Affetto di Araci</b> e il merito nelle prove decidono la prova della fanciulla.</p><p>Nell’esplorazione ogni azione consuma parte del giorno e aumenta la fame; mangia le provviste per non perdere vigore. In combattimento scegli un’azione a ogni turno: leggi la nota dell’avversario. Nel tiro con l’arco, scocca con la barra spaziatrice quando il segno passa sul bersaglio. Lo stesso seme dà sempre gli stessi dadi. Se perdi, puoi ricominciare l’atto.</p><p>Tastiera: Tab scorre le scelte e Invio sceglie.</p>
<h3>Sul libro</h3><p><i>Ubirajara: leggenda tupi</i>, di José de Alencar, fu pubblicato nel 1874 ed è, con le parole dell’autore, «fratello di Iracema». È un romanzo indianista, scritto nel Romanticismo per rispondere ai cronisti che dipingevano gli indigeni come belve; idealizza i popoli che ritrae e mette loro in bocca il linguaggio degli eroi cavallereschi. I nomi delle nazioni araguaia e tocantin sono quelli dei fiumi. Il gioco segue i nove capitoli e cita frasi dell’autore. Gli episodi in cui le donne sono date o contese dai guerrieri sono narrati come nel libro, senza affidare la decisione al giocatore.</p>
<h3>Componenti d’epoca</h3><p>Armi, oggetti, cibi e costumi vengono dal testo del romanzo, citato per capitolo, e da voci della Wikipedia in portoghese sulla cultura materiale indigena. Dove romanzo e fonti divergono, il codice dei <b>Saperi</b> lo dice: per esempio, il cauim di Alencar è di anacardio e ananas, mentre la voce descrive cauim di manioca o mais; «inúbia» è un nome dato dai poeti. Le note che Alencar pose alla fine del libro non sono state usate, perché non sono trascritte nell’edizione consultata.</p>
<h3>Fonti</h3><ul><li>José de Alencar, <i>Ubirajara</i> (1874), testo su Wikisource: pt.wikisource.org/wiki/Ubirajara, consultato il 22/11/2026.</li><li>Wikipedia in portoghese, consultata il 22/11/2026: Cauim, Moquém, Inúbia, Rede de dormir, Urucum, Mandioca, Farinha de mandioca, Tupinambás, Jenipapo, Anta, Saúva, Tapuias, Embaúba, Cocar.</li></ul>`,
    es: `<h3>Cómo jugar</h3><p>Lee la escena y elige. Algunas elecciones piden una <b>prueba</b>: dos dados de seis caras más un atributo, contra una dificultad. Los atributos son Fuerza, Agilidad, Destreza, Constancia y Palabra; en algunos hitos ganas puntos para aumentarlos. La <b>Fama</b> ayuda a tensar los grandes arcos. El <b>Honor</b> sube cuando respetas las leyes de los guerreros y de la hospitalidad, y sin él las naciones no se unen. El <b>Afecto de Araci</b> y el mérito en las pruebas deciden la prueba de la doncella.</p><p>En la exploración, cada acción gasta parte del día y aumenta el hambre; come la provisión para no perder vigor. En el combate, elige la acción en cada ronda: lee la nota del adversario. En el tiro con arco, suelta la flecha con la barra espaciadora cuando la marca pase por el blanco. La misma semilla da siempre los mismos dados. Si pierdes, puedes recomenzar el acto.</p><p>Teclado: Tab recorre las elecciones e Intro elige.</p>
<h3>Sobre el libro</h3><p><i>Ubirajara: leyenda tupí</i>, de José de Alencar, se publicó en 1874 y es, en palabras del autor, «hermano de Iracema». Es una novela indianista, escrita en el Romanticismo para responder a los cronistas que pintaban a los indígenas como fieras; idealiza a los pueblos que retrata y les pone en la boca el habla de héroes de caballería. Los nombres de naciones araguaia y tocantín son los de los ríos. El juego sigue los nueve capítulos y cita frases del autor. Los episodios en que las mujeres son entregadas o disputadas por los guerreros se narran como en el libro, sin pasar la decisión al jugador.</p>
<h3>Componentes de época</h3><p>Armas, objetos, comidas y costumbres vienen del texto de la novela, citado por capítulo, y de artículos de la Wikipedia en portugués sobre la cultura material indígena. Donde la novela y las fuentes difieren, el códice de <b>Saberes</b> lo dice: por ejemplo, el cauim de Alencar es de cajú y piña, y el artículo describe cauim de mandioca o maíz; «inúbia» es un nombre dado por los poetas. Las notas que Alencar puso al final del libro no se usaron, porque no están transcritas en la edición consultada.</p>
<h3>Fuentes</h3><ul><li>José de Alencar, <i>Ubirajara</i> (1874), texto en Wikisource: pt.wikisource.org/wiki/Ubirajara, consultado el 22/11/2026.</li><li>Wikipedia en portugués, consultada el 22/11/2026: Cauim, Moquém, Inúbia, Rede de dormir, Urucum, Mandioca, Farinha de mandioca, Tupinambás, Jenipapo, Anta, Saúva, Tapuias, Embaúba, Cocar.</li></ul>`,

  const HOW = {
    pt: '<h3>Como jogar</h3><p>A história segue os nove capítulos do romance em quadros de diálogo; entre eles, você joga fases de ação vistas de cima: caçar nos campos do Taari, subir o rio até os tocantins, servir Itaquê, as provas do combate nupcial e os duelos. A vida são as penas do cocar; algumas façanhas dão uma pena a mais. Frutos e provisão devolvem vigor. Nos duelos, cada adversário tem um padrão: observe quando ele ergue a arma e use o escudo na hora certa. A <b>Honra</b> sobe quando você respeita as leis dos guerreiros e da hospitalidade, e sem ela as nações não se unem; o <b>Afeto de Araci</b> e o mérito nas provas decidem a prova da virgem. Se cair numa fase de caminho, você tenta de novo; se perder um duelo decisivo, pode recomeçar o ato. A semente define o mapa e as aparições.</p>',

  // gerador semeado (mulberry32): mapas, aparições e sorteios usam G.rs

    render();
  }
  function choose(i) {

  function startMini(kind) {

    if (kind === 'quick') { const keys = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft']; mini = { kind, r: 1, ok: 0, want: keys[Math.floor(rnd() * 4)], deadline: performance.now() + 1700, keys }; }
