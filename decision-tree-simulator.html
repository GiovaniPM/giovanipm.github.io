<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Nenhum dado sai deste arquivo: sem rede e sem eval. As expressões passam por um interpretador próprio. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Decision Tree Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f5f99'/%3E%3Cpath d='M4 8H7M7 4V12M7 4H10M7 12H10' fill='none' stroke='white' stroke-width='1.3'/%3E%3Crect x='2.5' y='6.5' width='3' height='3' fill='white'/%3E%3Ccircle cx='11.5' cy='4' r='1.7' fill='white'/%3E%3Cpath d='M10 10.2 13.4 12 10 13.8z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f1;--panel:#fff;--panel2:#f8f8f6;--text:#1b2022;--muted:#60686c;--line:#d9dcd6;--line2:#e9ebe6;
  --accent:#1f5f99;--accent-text:#fff;--accent-soft:#e0ecf7;--danger:#b3261e;--danger-soft:#fbe9e7;--warn:#8a5a00;--warn-soft:#fdf3dc;--ok:#1f7a3d;--ok-soft:#e2f3e7;
  --canvas:#fbfbf9;--dot:#d5d8d1;--flow:#4a5358;--sel:#d9480f;--token:#d9480f;--walk:#d9480f;
  --c-bar:#2a78d6;--c-grid:#e1e0d9;--c-base:#c3c2b7;--c-muted:#6f6d68;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --de-f:#e4f0fb;--de-l:#1f5f99;--ch-f:#efeafa;--ch-l:#65509c;--ru-f:#fdf0d0;--ru-l:#9a6a00;--ou-f:#dff3e4;--ou-l:#2b7a45;
  --n-text:#1b2022;--n-muted:#60686c;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#14171a;--panel:#1b1f23;--panel2:#21262a;--text:#e5e8ea;--muted:#9aa2a8;--line:#343a40;--line2:#2a2f34;
  --accent:#6db5ee;--accent-text:#0b1a26;--accent-soft:#1c3247;--danger:#ef8a80;--danger-soft:#3b211f;--warn:#e3b45a;--warn-soft:#352a14;--ok:#6cc98a;--ok-soft:#1c3522;
  --canvas:#171a1d;--dot:#30363b;--flow:#a7afb5;--sel:#ff8f5a;--token:#ff8f5a;--walk:#ff8f5a;
  --c-bar:#3987e5;--c-grid:#2c2c2a;--c-base:#383835;--c-muted:#9a9890;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --de-f:#1c3247;--de-l:#6db5ee;--ch-f:#2b2640;--ch-l:#a795dd;--ru-f:#352a14;--ru-l:#e3b45a;--ou-f:#1c3522;--ou-l:#74c98b;
  --n-text:#e5e8ea;--n-muted:#9aa2a8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--sans);color:var(--text);background:var(--bg);display:grid;grid-template-rows:minmax(46px,auto) minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--panel2);border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.danger{color:var(--danger)}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--accent);margin:0}
textarea{resize:vertical}
textarea.mono,input.mono{font:12px/1.5 var(--mono)}
code,.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.spacer{flex:1}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}

#topbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
#brand{font-weight:650;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:4px}
#brand svg{width:18px;height:18px;flex:none}
.tools{display:flex;align-items:center;gap:5px}
#modes{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
#modes button{border:none;border-radius:0;padding:5px 13px;background:var(--panel)}
#modes button+button{border-left:1px solid var(--line)}
#modes button[aria-selected=true]{background:var(--accent);color:var(--accent-text);font-weight:600}
.menu{position:relative}
.menu-list{position:absolute;left:0;top:calc(100% + 3px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:40;min-width:230px;padding:4px}
.menu-list button{display:block;width:100%;text-align:left;border:none;background:none;padding:5px 9px;border-radius:4px}
.menu-list button:hover:not(:disabled){background:var(--accent-soft)}
.menu-list hr{border:none;border-top:1px solid var(--line2);margin:4px 0}
.menu-list .mh{font-size:11px;color:var(--muted);padding:4px 9px 2px;font-weight:650}
#status{color:var(--muted);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#speed,#lang{width:auto}

#main{display:grid;grid-template-columns:186px minmax(0,1fr) 300px;min-height:0}
#left,#right{background:var(--panel2);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.side-title{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:10px 12px 4px}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px 10px 8px}
.pal{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;touch-action:none;font-size:11px;white-space:normal;line-height:1.12;cursor:grab;min-height:54px}
.pal svg{width:22px;height:22px;pointer-events:none;flex:none}
#outline{overflow:auto;flex:1;padding-bottom:10px;min-height:0}
.out{display:flex;gap:6px;width:100%;border:none;border-radius:0;background:none;text-align:left;padding:3px 12px;font-size:12px;align-items:center}
.out:hover:not(:disabled){background:var(--line2)}
.out.active{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.out svg{width:10px;height:10px;flex:none}
.out span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#center{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--canvas)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;outline:none}
#stage:has(#svg:focus-visible){box-shadow:inset 0 0 0 2px var(--accent)}
#zoombar{position:absolute;left:10px;bottom:10px;display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px;align-items:center}
#zoombar button{border:none;background:none;padding:2px 8px}
#zoombar span{font:11px var(--mono);color:var(--muted);min-width:40px;text-align:center}
#zoombar label{display:flex;gap:5px;align-items:center;padding:0 6px;border-left:1px solid var(--line2);white-space:nowrap;font-size:12px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:20px}
#empty>div{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 30px;width:min(560px,100%);text-align:center}
#empty h1{font-size:18px;margin:0 0 6px;font-weight:650}
#empty p{margin:0 0 16px;color:var(--muted)}
#empty .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#empty .row+.row{margin-top:8px}
#renamer{position:absolute;z-index:20;text-align:center;font:13px/1.25 var(--sans);border:2px solid var(--accent);border-radius:4px;padding:3px;background:var(--panel);resize:none;overflow:hidden}
#quick{position:absolute;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:5px;display:grid;grid-template-columns:1fr 1fr;gap:3px;width:206px}
#quick button{font-size:12px;padding:5px;display:flex;gap:6px;align-items:center;justify-content:flex-start}
#quick svg{width:12px;height:12px;flex:none}
#ghost{position:fixed;z-index:60;pointer-events:none;background:var(--panel);border:1px solid var(--accent);border-radius:5px;padding:3px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* desenho */
.grid-dot{fill:var(--dot)}
.n-shape{stroke-width:1.8}
.n-txt{fill:var(--n-text);font:13px var(--sans)}
.n-num{fill:var(--n-muted);font:600 10px var(--mono)}
.n-val{fill:var(--n-text);font:600 12px var(--mono)}
.n-inner{fill:none;stroke-width:1}
.t-decision .n-shape{fill:var(--de-f);stroke:var(--de-l)}.t-decision .n-glyph{fill:var(--de-l)}
.t-chance .n-shape{fill:var(--ch-f);stroke:var(--ch-l)}.t-chance .n-glyph{fill:var(--ch-l)}
.t-rule .n-shape{fill:var(--ru-f);stroke:var(--ru-l)}.t-rule .n-glyph{fill:var(--ru-l)}
.t-outcome .n-shape{fill:var(--ou-f);stroke:var(--ou-l)}.t-outcome .n-glyph{fill:var(--ou-l)}.t-outcome .n-inner{stroke:var(--ou-l)}
.e-line{fill:none;stroke:var(--flow);stroke-width:1.6;stroke-linejoin:round}
.e-mark{fill:none;stroke:var(--flow);stroke-width:1.8}
.e-lab{fill:var(--n-text);font:12px var(--sans);paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}
.edge.best .e-line{stroke:var(--ok);stroke-width:3}
.edge.rej .e-line{opacity:.55}
.edge.rej .e-lab{fill:var(--n-muted)}
.node{cursor:move}
.mode-sim .node{cursor:pointer}
.mode-sim .port{display:none}
.port{cursor:crosshair;opacity:0}
.port circle{fill:var(--accent);stroke:var(--canvas);stroke-width:1.5}
.port path{stroke:var(--accent-text);stroke-width:1.6;fill:none}
.node:hover .port,.node.sel .port,.node:focus-within .port{opacity:1}
.col{cursor:pointer}
.col rect{fill:var(--panel);stroke:var(--line)}
.col text{fill:var(--n-muted);font:600 10px var(--mono)}
.bp{fill:var(--danger);stroke:var(--canvas);stroke-width:1.5}
.preview{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.e-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.tok{fill:var(--token);stroke:var(--canvas);stroke-width:2;pointer-events:none}
.node.tgt .n-shape{stroke:var(--accent);stroke-width:3.5}
.node.bad .n-shape{stroke:var(--danger);stroke-dasharray:5 3}
.node.sel .n-shape{stroke:var(--sel);stroke-width:3}
.node.active .n-shape{stroke:var(--token);stroke-width:4}
.node.err .n-shape{stroke:var(--danger);stroke-width:4}
.node.dim{opacity:.42}
.node.opt .n-shape{stroke:var(--token);stroke-width:2.6;stroke-dasharray:6 3}
.node.loose{opacity:.8}
.edge.sel .e-line{stroke:var(--sel);stroke-width:2.6}
.edge.walked .e-line{stroke:var(--walk);stroke-width:3;opacity:1}
.edge.hl .e-line{stroke:var(--walk);stroke-width:3;opacity:1}
.edge.opt .e-line{stroke:var(--token);stroke-dasharray:6 4;stroke-width:2.2;opacity:1}
.edge.dim{opacity:.35}

/* inspetor */
#inspector{overflow:auto;flex:1;padding:10px 12px 16px;display:flex;flex-direction:column;gap:9px;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 8px 0;gap:2px;flex:none}
.rt{border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:none;color:var(--muted);padding:4px 9px;margin-bottom:-1px}
.rt[aria-selected=true]{background:var(--panel2);border-color:var(--line);border-bottom-color:var(--panel2);color:var(--text);font-weight:600}
.rt b{background:var(--danger);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:3px}
.rt b.w{background:var(--warn);color:var(--panel)}
.field{display:flex;flex-direction:column;gap:3px}
.field>span,.lab{font-size:12px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted);line-height:1.35}
.ferr{font:11px var(--mono);color:var(--danger);white-space:pre-wrap}
.ferr:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h4{margin:6px 0 0;font-size:13px;font-weight:650}
.type{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.issue{display:block;width:100%;text-align:left;white-space:normal;padding:6px 8px;border-left:3px solid var(--warn);border-radius:0 5px 5px 0;font-size:12px}
.issue.error{border-left-color:var(--danger)}
.issue small{display:block;color:var(--muted)}
.ok-msg{color:var(--ok)}
.card{border:1px solid var(--line2);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center}
.brow .acts{display:flex;gap:1px}
.brow .acts button{padding:1px 6px}
.vcard summary{cursor:pointer;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard>div{display:flex;flex-direction:column;gap:6px;margin-top:6px}

/* simulação */
#now{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:9px;display:flex;flex-direction:column;gap:7px}
#now.ask{border-color:var(--token);box-shadow:0 0 0 1px var(--token)}
#now.done{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
#now.fail{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
#now b{font-size:14px;font-weight:650}
.opt-btn{display:flex;gap:8px;width:100%;text-align:left;white-space:normal;align-items:baseline}
.opt-btn kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--panel2);flex:none}
.opt-btn span{flex:1}
.opt-btn small{font:11px var(--mono);color:var(--muted);flex:none}
.rec{font-size:11px;font-weight:650;color:var(--ok)}
.vars{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:2px 10px;font-size:12px;margin:0}
.vars dt{font-family:var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.vars dd{margin:0;font-family:var(--mono);word-break:break-word}
.vars dd.chg{color:var(--token);font-weight:700}
#simpanel{height:290px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative}
#simgrip{position:absolute;left:0;right:0;top:-3px;height:6px;cursor:ns-resize;z-index:3;touch-action:none}
#simtabs{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line2);align-items:center;flex:none;overflow-x:auto}
.st{padding:2px 10px;font-size:12px}
.st[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent)}
#simbody{overflow:auto;flex:1;min-height:0}
table.t{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:3px 9px;text-align:left;vertical-align:top}
table.t th{position:sticky;top:0;background:var(--panel2);font-weight:600;font-size:11px;color:var(--muted);z-index:1;white-space:nowrap}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.m{font-family:var(--mono)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}
table.t tr.cur td{background:var(--accent-soft)}
table.t tr.err td{background:var(--danger-soft);color:var(--danger)}
.pad{padding:12px}
.bar-row{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.bar-row .field{width:110px}
.bar-row .field.w{width:240px}
.tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.neutral{background:var(--line2);color:var(--muted)}
.kpis{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px}
.kpi{border:1px solid var(--line2);border-radius:7px;padding:6px 12px;min-width:86px;background:var(--panel2)}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.an-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 16px;padding:0 12px 12px}
.an-grid h4{margin:4px 0 5px}
.chart-wrap{position:relative;min-width:0}
.chart-wrap svg{display:block;width:100%;height:auto;max-width:680px}
.an-grid>div{min-width:0}
.ht-bar{fill:var(--c-bar)}
.ht-hit{fill:transparent}
.ht-col:hover .ht-bar{filter:brightness(.88)}
.c-grid{stroke:var(--c-grid);stroke-width:1}.c-base{stroke:var(--c-base);stroke-width:1}
.c-tick{fill:var(--c-muted);font:11px var(--sans);font-variant-numeric:tabular-nums}
.c-lab{fill:var(--text);font:11px var(--sans);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.lc-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lc-dot{stroke:var(--panel);stroke-width:2}
.lc-hit{fill:transparent}
.lc-x{stroke:var(--c-muted);stroke-width:1;opacity:0}
.lc-col:hover .lc-x{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin:0 0 5px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:block}
.c-tip{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;white-space:pre;z-index:5}
.mini{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px}
.mini>span:first-child{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .tr{flex:1;height:10px;background:var(--line2);border-radius:3px;overflow:hidden}
.mini .tr i{display:block;height:100%;background:var(--c-bar);border-radius:0 3px 3px 0}
.mini b{font-weight:600;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
details.tv{padding:0 12px 12px}
details.tv summary{cursor:pointer;color:var(--accent);font-size:12px;margin-bottom:4px}

/* documentação */
#docview{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
#docside{background:var(--panel2);border-right:1px solid var(--line);overflow:auto;padding:10px 12px 18px;display:flex;flex-direction:column;gap:8px}
#docscroll{overflow:auto;background:var(--bg);padding:22px}
#paper{background:#fff;max-width:920px;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.18);border-radius:3px;overflow:hidden}
.doc-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sec-check{display:flex;align-items:center;gap:7px;padding:2px 0}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0;width:min(480px,94vw);max-height:90vh;box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog.wide{width:min(760px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg header{padding:12px 16px;font-weight:650;font-size:14px;border-bottom:1px solid var(--line2)}
.dlg .b{padding:14px 16px;overflow:auto;flex:1}
.dlg .b h4{margin:14px 0 4px}.dlg .b h4:first-child{margin-top:0}
.dlg .b p{margin:0 0 8px}
.dlg .b ul{margin:0 0 8px;padding-left:18px}
.dlg .b table{border-collapse:collapse;width:100%;font-size:12px;margin:0 0 8px}
.dlg .b td{border-bottom:1px solid var(--line2);padding:2px 6px 2px 0;vertical-align:top}
.dlg footer{padding:10px 16px;display:flex;justify-content:flex-end;gap:6px;border-top:1px solid var(--line2)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:54px;z-index:9999;display:flex;flex-direction:column;gap:6px;max-width:min(520px,90vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:5px;padding:7px 10px;box-shadow:0 4px 18px rgba(0,0,0,.2);display:flex;gap:10px;white-space:pre-wrap}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
.toast span{flex:1}.toast button{border:none;background:none;padding:0 3px;color:var(--muted)}

@media (max-width:1100px){
  #main{grid-template-columns:150px minmax(0,1fr) 250px}
  #brand span,#status{display:none}
  #modes button{padding:5px 9px}
  .an-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  html,body{height:auto;min-height:100%}
  body{display:block;overflow:auto}
  #topbar{flex-wrap:wrap;position:sticky;top:0;z-index:30}
  #topbar .spacer{display:none}
  #topbar .tools{flex-wrap:wrap}
  #main{display:flex;flex-direction:column}
  #left{border-right:none;border-bottom:1px solid var(--line)}
  #palette{grid-template-columns:repeat(4,minmax(0,1fr))}
  #outline{display:none}
  .side-outline{display:none}
  #center{display:contents}
  #left{order:1}
  #stage{height:58vh;flex:none;order:2}
  #right{order:3}
  #simpanel{order:4}
  #simpanel{height:auto;max-height:none}
  #simgrip{display:none}
  #simbody{overflow:auto;max-height:70vh}
  #right{border-left:none;border-top:1px solid var(--line)}
  #inspector{overflow:visible}
  #docview{display:block}
  #docscroll{padding:8px}
  #paper{overflow-x:auto}
  .bar-row .field,.bar-row .field.w{width:calc(50% - 4px)}
  #zoombar label{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  #topbar,#docside,#toasts{display:none!important}
  body.mode-doc #main{display:none!important}
  body:not(.mode-doc) #left,body:not(.mode-doc) #right,#zoombar,#simpanel{display:none!important}
  body:not(.mode-doc) #main{display:block}
  body:not(.mode-doc) #stage{position:fixed;inset:0;background:#fff}
  body.mode-doc #docview{display:block}
  #docscroll{overflow:visible;background:#fff;padding:0}
  #paper{box-shadow:none;max-width:none;overflow:visible}
}
</style>
</head>
<body>
<header id="topbar">
  <div id="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#1f5f99"/><path d="M4 8H7M7 4V12M7 4H10M7 12H10" fill="none" stroke="#fff" stroke-width="1.3"/><rect x="2.5" y="6.5" width="3" height="3" fill="#fff"/><circle cx="11.5" cy="4" r="1.7" fill="#fff"/><path d="M10 10.2 13.4 12 10 13.8z" fill="#fff"/></svg><span>Decision Tree Simulator</span></div>
  <div id="modes" role="tablist" data-aria="modeBar">
    <button role="tab" data-mode="edit" data-tx="mEdit"></button>

    <button role="tab" data-mode="doc" data-tx="mDoc"></button>
  </div>
  <div class="sep"></div>
  <div class="tools">
    <div class="menu"><button id="b-file" aria-haspopup="true" data-tx="file"></button></div>
    <div class="tools" id="edit-tools">
      <button id="b-undo" data-title="undoKey" aria-label="↶">↶</button>
      <button id="b-redo" data-title="redoKey" aria-label="↷">↷</button>
      <div class="menu"><button id="b-layout" aria-haspopup="true" data-tx="arrange"></button></div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="tools hidden" id="sim-tools">
    <span id="status" role="status"></span>
    <button id="b-play" class="primary"></button>
    <button id="b-step" data-tx="step" data-title="stepKey"></button>
    <button id="b-back" data-tx="back" data-title="backKey"></button>
    <button id="b-reset" data-tx="restart" data-title="restartKey"></button>
    <select id="speed" data-aria="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  </div>
  <div class="sep"></div>
  <select id="lang" aria-label="Idioma / Language / Lingua"><option value="pt">PT</option><option value="en">EN</option><option value="it">IT</option><option value="es">ES</option></select>
  <button id="b-help" aria-label="?" data-title="help">?</button>
  <button id="b-theme" data-title="theme" aria-label="◐">◐</button>
</header>

<div id="main">
  <aside id="left">
    <div id="palette-wrap">
      <div class="side-title" data-tx="shapes"></div>
      <div id="palette"></div>
    </div>
    <div class="side-title side-outline" data-tx="structure"></div>
    <div id="outline" role="tree" data-aria="structure"></div>
  </aside>
  <section id="center">
    <div id="stage">
      <svg id="svg" role="application" tabindex="0" xmlns="http://www.w3.org/2000/svg">
        <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="grid-dot" cx="1" cy="1" r="1"/></pattern></defs>
        <rect id="bg" width="100%" height="100%" fill="url(#dots)"/>
        <g id="world"><g id="g-edges"></g><g id="g-nodes"></g><g id="g-sim"></g><g id="g-over"></g></g>
      </svg>
      <div id="empty" class="hidden"><div>
        <h1 data-tx="emptyTitle"></h1>
        <p data-tx="emptyText"></p>
        <div class="row" id="empty-start"></div>
        <div class="row" id="empty-samples"></div>
      </div></div>
      <div id="zoombar">
        <button id="z-out" aria-label="−">−</button><span id="z-label">100%</span><button id="z-in" aria-label="+">+</button><button id="z-fit" data-tx="fit"></button>
        <label><input type="checkbox" id="z-values" checked><span data-tx="showValues"></span></label>
      </div>
    </div>
    <div id="simpanel" class="hidden">
      <div id="simgrip"></div>
      <div id="simtabs" role="tablist" data-aria="simPanels"></div>
      <div id="simbody"></div>
    </div>
  </section>
  <aside id="right">
    <div id="tabs" role="tablist"></div>
    <div id="inspector"></div>
  </aside>
</div>
<div id="docview" class="hidden">

  <div id="docscroll"><div id="paper"></div></div>
</div>

const HELP={
pt:`<h4>Os quatro nós</h4><table><tr><td>■ Decisão</td><td>Alguém escolhe. A análise indica a melhor opção.</td></tr><tr><td>● Incerteza</td><td>O acaso escolhe, pelas probabilidades. Probabilidade vazia divide o que falta para 100%.</td></tr><tr><td>◆ Regra</td><td>A primeira condição verdadeira escolhe o ramo. Condição vazia é o "senão".</td></tr><tr><td>▶ Resultado</td><td>Fim do caminho, com valor, categoria e ação.</td></tr></table>
<h4>Editar</h4><ul><li>Clique no <b>+</b> da borda de um nó para criar um filho, ou arraste o + até outro nó para ligá-lo ali.</li><li>Arraste um nó sobre outro para mudá-lo de pai. Arrastar para um espaço vazio liga o layout manual.</li><li>Clique duplo edita o texto do nó ou o rótulo do ramo.</li><li>Um ramo pertence ao nó filho: seus campos ficam nas propriedades do filho.</li></ul>
<h4>Teclado no diagrama</h4><table><tr><td>Setas</td><td>navegam na árvore; Alt+setas reordenam irmãos</td></tr><tr><td>D, C, R, O</td><td>criam filho: decisão, incerteza (chance), regra, resultado (outcome)</td></tr><tr><td>S</td><td>cria irmão</td></tr><tr><td>Enter ou F2</td><td>editam o texto</td></tr><tr><td>Espaço</td><td>recolhe ou expande</td></tr><tr><td>Delete</td><td>exclui o nó e tudo abaixo</td></tr><tr><td>Ctrl+C, X, V, D, Z, Y</td><td>copiar, recortar, colar, duplicar, desfazer, refazer</td></tr><tr><td>F, +, −</td><td>ajustar e zoom</td></tr></table>
<h4>Simular</h4><ul><li><b>Passo a passo:</b> Passo, Voltar, Executar e pausas nos nós. Cada linha do rastreamento explica o motivo e permite voltar até ela.</li><li><b>Valor esperado:</b> calcula de trás para frente e marca o plano recomendado.</li><li><b>Caminhos:</b> todos os caminhos, com probabilidade e total.</li><li><b>Monte Carlo:</b> muitas execuções, com semente reproduzível.</li><li><b>Sensibilidade:</b> varia uma variável e mostra quando a melhor alternativa muda.</li></ul>
<h4>Expressões</h4><p><code>+ - * / % ^</code>, <code>== != &lt; &lt;= &gt; &gt;=</code>, <code>and or not</code>, <code>cond ? a : b</code>; funções <code>min max abs round floor ceil sqrt pow</code> e sorteios <code>random normal triangular exponential randint chance</code>. Na análise, um sorteio vale sua média.</p>
<h4>Seus dados</h4><p>Tudo fica neste navegador. O app não usa rede. Salve uma cópia em Arquivo.</p>`,
en:`<h4>The four nodes</h4><table><tr><td>■ Decision</td><td>Someone chooses. The analysis points to the best option.</td></tr><tr><td>● Chance</td><td>Chance chooses, by the probabilities. An empty probability shares what is left up to 100%.</td></tr><tr><td>◆ Rule</td><td>The first true condition picks the branch. An empty condition is the "otherwise".</td></tr><tr><td>▶ Outcome</td><td>End of the path, with value, category and action.</td></tr></table>
<h4>Editing</h4><ul><li>Click the <b>+</b> on a node's edge to add a child, or drag the + to another node to attach it there.</li><li>Drag a node onto another to change its parent. Dragging to an empty space turns on manual layout.</li><li>Double-click edits a node's text or a branch's label.</li><li>A branch belongs to the child node: its fields are in the child's properties.</li></ul>
<h4>Keyboard on the diagram</h4><table><tr><td>Arrows</td><td>navigate the tree; Alt+arrows reorder siblings</td></tr><tr><td>D, C, R, O</td><td>add a child: decision, chance, rule, outcome</td></tr><tr><td>S</td><td>adds a sibling</td></tr><tr><td>Enter or F2</td><td>edit the text</td></tr><tr><td>Space</td><td>collapses or expands</td></tr><tr><td>Delete</td><td>deletes the node and everything below</td></tr><tr><td>Ctrl+C, X, V, D, Z, Y</td><td>copy, cut, paste, duplicate, undo, redo</td></tr><tr><td>F, +, −</td><td>fit and zoom</td></tr></table>
<h4>Simulating</h4><ul><li><b>Step by step:</b> Step, Back, Run and pauses on nodes. Each trace row explains the reason and lets you go back to it.</li><li><b>Expected value:</b> calculates backwards and marks the recommended plan.</li><li><b>Paths:</b> every path, with probability and total.</li><li><b>Monte Carlo:</b> many runs, with a reproducible seed.</li><li><b>Sensitivity:</b> varies one variable and shows when the best alternative changes.</li></ul>
<h4>Expressions</h4><p><code>+ - * / % ^</code>, <code>== != &lt; &lt;= &gt; &gt;=</code>, <code>and or not</code>, <code>cond ? a : b</code>; functions <code>min max abs round floor ceil sqrt pow</code> and draws <code>random normal triangular exponential randint chance</code>. In the analysis, a draw counts as its mean.</p>
<h4>Your data</h4><p>Everything stays in this browser. The app uses no network. Save a copy under File.</p>`,
it:`<h4>I quattro nodi</h4><table><tr><td>■ Decisione</td><td>Qualcuno sceglie. L'analisi indica l'opzione migliore.</td></tr><tr><td>● Incertezza</td><td>Sceglie il caso, secondo le probabilità. Una probabilità vuota divide ciò che manca al 100%.</td></tr><tr><td>◆ Regola</td><td>La prima condizione vera sceglie il ramo. Una condizione vuota è l'"altrimenti".</td></tr><tr><td>▶ Esito</td><td>Fine del percorso, con valore, categoria e azione.</td></tr></table>
<h4>Modificare</h4><ul><li>Fai clic sul <b>+</b> sul bordo di un nodo per aggiungere un figlio, o trascina il + su un altro nodo per collegarlo lì.</li><li>Trascina un nodo su un altro per cambiarne il padre. Trascinare in uno spazio vuoto attiva il layout manuale.</li><li>Il doppio clic modifica il testo del nodo o l'etichetta del ramo.</li><li>Un ramo appartiene al nodo figlio: i suoi campi sono nelle proprietà del figlio.</li></ul>
<h4>Tastiera sul diagramma</h4><table><tr><td>Frecce</td><td>navigano nell'albero; Alt+frecce riordinano i fratelli</td></tr><tr><td>D, C, R, O</td><td>aggiungono un figlio: decisione, incertezza (chance), regola, esito (outcome)</td></tr><tr><td>S</td><td>aggiunge un fratello</td></tr><tr><td>Invio o F2</td><td>modificano il testo</td></tr><tr><td>Spazio</td><td>comprime o espande</td></tr><tr><td>Canc</td><td>elimina il nodo e tutto ciò che sta sotto</td></tr><tr><td>Ctrl+C, X, V, D, Z, Y</td><td>copia, taglia, incolla, duplica, annulla, ripeti</td></tr><tr><td>F, +, −</td><td>adatta e zoom</td></tr></table>
<h4>Simulare</h4><ul><li><b>Passo per passo:</b> Passo, Indietro, Esegui e pause sui nodi. Ogni riga della traccia spiega il motivo e permette di tornarci.</li><li><b>Valore atteso:</b> calcola a ritroso e segna il piano consigliato.</li><li><b>Percorsi:</b> tutti i percorsi, con probabilità e totale.</li><li><b>Monte Carlo:</b> molte esecuzioni, con seme riproducibile.</li><li><b>Sensibilità:</b> fa variare una variabile e mostra quando cambia l'alternativa migliore.</li></ul>
<h4>Espressioni</h4><p><code>+ - * / % ^</code>, <code>== != &lt; &lt;= &gt; &gt;=</code>, <code>and or not</code>, <code>cond ? a : b</code>; funzioni <code>min max abs round floor ceil sqrt pow</code> ed estrazioni <code>random normal triangular exponential randint chance</code>. Nell'analisi, un'estrazione vale la sua media.</p>
<h4>I tuoi dati</h4><p>Tutto resta in questo browser. L'app non usa la rete. Salva una copia da File.</p>`,

  else if(!m.root)m.root=n.id;
  return n;
}
function removeSubtree(m,id){
  const n=m.nodes[id];if(!n)return;
  if(n.parent){const p=m.nodes[n.parent];p.kids=p.kids.filter(k=>k!==id)}
  subtreeIds(m,id).forEach(x=>delete m.nodes[x]);
  if(m.root===id){const o=orphans(m);m.root=o.length?o[0].id:null}
}
function linkProblem(m,pid,id){
  const p=m.nodes[pid],n=m.nodes[id];
  if(!p||!n||pid===id)return t('lkSelf');
  if(p.type==='outcome')return t('lkOutcome');
  if(isAncestor(m,id,pid))return t('lkCycle');
  return'';
}
function reparent(m,id,pid,index){
  const n=m.nodes[id];
  if(n.parent){const old=m.nodes[n.parent];old.kids=old.kids.filter(k=>k!==id)}
  else if(m.root===id){const o=orphans(m).filter(x=>x.id!==id&&!isAncestor(m,id,x.id));m.root=o.length?o[0].id:pid}
  n.parent=pid;const kids=m.nodes[pid].kids;
  if(index==null||index>kids.length)kids.push(id);else kids.splice(index,0,id);
  if(!m.root||m.root===id)m.root=pid;
}
function cloneSubtree(m,src,into){
  /* src é uma lista plana {id,...,kids}; devolve o id da nova raiz */
  const map=Object.create(null);src.nodes.forEach(n=>map[n.id]=uid('n'));
  src.nodes.forEach(n=>{into.nodes[map[n.id]]={...n,id:map[n.id],parent:n.parent&&map[n.parent]?map[n.parent]:null,kids:n.kids.map(k=>map[k])}});
  return map[src.root];
}
function copyOf(m,id){return{root:id,nodes:subtreeIds(m,id).map(x=>JSON.parse(JSON.stringify(m.nodes[x])))}}
function loadModel(o){
  if(!o||typeof o!=='object'||o.app!==APP||!o.nodes||typeof o.nodes!=='object')throw new Error(t('notModel'));
  const m=newModel(String(o.name||''));
  m.desc=String(o.desc||'');m.objective=o.objective==='min'?'min':'max';m.unit=String(o.unit||'');m.orient=o.orient==='TD'?'TD':'LR';m.auto=o.auto!==false;
  const ids=Object.keys(o.nodes).filter(k=>/^[\w-]+$/.test(k)&&k!=='__proto__'&&k!=='constructor'&&k!=='prototype');
  if(ids.length>MAX_NODES)throw new Error(t('tooMany',MAX_NODES));
  const set=new Set(ids);
  for(const id of ids){
    const r=o.nodes[id];if(!r||typeof r!=='object'||!TYPE_ORDER.includes(r.type))throw new Error(t('notModel'));
    const n=makeNode(r.type);n.id=id;
    for(const k of Object.keys(NODE_DEFAULTS))n[k]=typeof NODE_DEFAULTS[k]==='boolean'?!!r[k]:String(r[k]??'');
    n.x=Number.isFinite(r.x)?r.x:0;n.y=Number.isFinite(r.y)?r.y:0;
    n.parent=set.has(r.parent)?r.parent:null;
    n.kids=Array.isArray(r.kids)?r.kids.filter(k=>set.has(k)):[];
    m.nodes[id]=n;
  }
  /* a estrutura precisa ser árvore: um pai só e sem ciclos */
  for(const id of ids){const n=m.nodes[id];n.kids=[...new Set(n.kids)].filter(k=>m.nodes[k].parent===id&&k!==id)}
  for(const id of ids){const n=m.nodes[id];if(n.parent&&!m.nodes[n.parent].kids.includes(id))n.parent=null}
  for(const id of ids){
    const seen=new Set([id]);
    for(let c=m.nodes[id].parent;c;c=m.nodes[c].parent){
      if(seen.has(c)){const n=m.nodes[id];m.nodes[n.parent].kids=m.nodes[n.parent].kids.filter(k=>k!==id);n.parent=null;break}
      seen.add(c);
    }
  }
  m.root=set.has(o.root)&&!m.nodes[o.root].parent?o.root:(ids.find(i=>!m.nodes[i].parent)||null);
  m.vars=(Array.isArray(o.vars)?o.vars:[]).filter(v=>v&&typeof v==='object').map(v=>makeVar({name:String(v.name||''),value:String(v.value??''),ask:!!v.ask,prompt:String(v.prompt||''),dist:String(v.dist||''),desc:String(v.desc||'')}));
  const d=o.doc&&typeof o.doc==='object'?o.doc:{};
  for(const k of['version','date','author','owner','purpose','scope','notes','revisions'])if(d[k]!=null)m.doc[k]=String(d[k]);
  m.doc.off=Array.isArray(d.off)?d.off.filter(x=>DOC_SECTIONS.includes(x)):[];
  return m;
}
function logicKey(m){
  const nodes={};for(const id of orderedIds(m)){const n=m.nodes[id];nodes[id]=[n.type,n.kids,n.value,n.label,n.prob,n.guard,n.cash,n.set]}
  return JSON.stringify([m.root,m.objective,m.vars.map(v=>[v.name,v.value,v.dist]),nodes]);
}

/* ========== campos e expressões do modelo ========== */
function normNum(s){
  const v=String(s??'').trim();
  if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(v))return v.replace(/\./g,'').replace(',','.');
  if(/^[-+]?\d+,\d+$/.test(v))return v.replace(',','.');
  return v;
}
function normProb(s){
  const v=String(s??'').trim();
  const m=/^(\d+(?:[.,]\d+)?)\s*%$/.exec(v);
  if(m)return String(Number(m[1].replace(',','.'))/100);
  return normNum(v);
}
const ctxOf=(vars,rng,expect)=>({vars,rng,expect:!!expect,time:0});
const copyVars=v=>Object.assign(Object.create(null),v);
function evalNum(src,ctx,label){return num(evalAst(parseExpr(normNum(src)),ctx),label)}
function applySet(src,ctx,changes){
  for(const st of parseStatements(src)){
    const v=evalAst(st.expr,ctx);if(!st.target)continue;
    if(st.target.k!=='var')throw new ExprError(t('xTarget'));
    const name=st.target.n,old=ctx.vars[name];
    let nv=v;
    if(st.op!=='='){if(!(name in ctx.vars))throw new ExprError(t('xUndef',name));nv=binOp(st.op[0],old,v)}
    ctx.vars[name]=nv;
    if(changes)changes.push({name,old,val:nv});
  }
}
function initialVars(m,inputs,{rng=null,sample=false,errors=null}={}){
  const vars=Object.create(null);
  for(const v of m.vars){
    if(!v.name)continue;
    try{
      if(inputs&&v.name in inputs){vars[v.name]=inputs[v.name];continue}
      if(sample&&rng&&v.dist.trim()){vars[v.name]=evalAst(parseExpr(v.dist),ctxOf(vars,rng));continue}
      if(v.value.trim()){vars[v.name]=parseLiteral(v.value);continue}
      if(v.dist.trim())vars[v.name]=rng?evalAst(parseExpr(v.dist),ctxOf(vars,rng)):evalAst(parseExpr(v.dist),ctxOf(vars,null,true));
    }catch(e){if(errors)errors.push({name:v.name,msg:e.message});else throw e}
  }
  return vars;
}
function probsOf(m,n,ctx){
  let sum=0,blanks=0;
  const ps=n.kids.map(id=>{
    const k=m.nodes[id];
    if(!k.prob.trim()){blanks++;return null}
    const p=num(evalAst(parseExpr(normProb(k.prob)),ctx),t('probability'));
    if(!(p>=0&&p<=1))throw new ExprError(t('rBadProb',nodeName(n),fmtPlain(p)));
    sum+=p;return p;
  });
  if(blanks){
    const r=1-sum;
    if(r<-1e-9)throw new ExprError(t('rProbSum',nodeName(n),fmtNum(sum*100,2)));
    const each=Math.max(r,0)/blanks;
    return ps.map(p=>p==null?each:p);
  }
  if(n.kids.length&&Math.abs(sum-1)>1e-6)throw new ExprError(t('rProbSum',nodeName(n),fmtNum(sum*100,2)));
  return ps;
}
function pickRule(m,n,ctx){
  let other=null;const evals=[];
  for(const id of n.kids){
    const k=m.nodes[id];
    if(!k.guard.trim()){if(!other)other=id;evals.push({id,src:'',res:null});continue}
    const res=!!evalAst(parseExpr(k.guard),ctx);
    evals.push({id,src:k.guard,res});
    if(res)return{kid:id,evals,other:false};
  }
  if(other)return{kid:other,evals,other:true};
  throw new ExprError(t('rNoBranch',nodeName(n)));
}
function availOf(m,n,ctx){
  return n.kids.filter(id=>{const g=m.nodes[id].guard;return!g.trim()||!!evalAst(parseExpr(g),ctx)});
}

/* ========== análise por valor esperado (rollback) ==========
   Cada nó tem um único caminho desde a raiz, logo um único estado de variáveis. */
const better=(obj,a,b)=>obj==='min'?a<b-1e-9:a>b+1e-9;
function rollback(m,inputs){
  const R={by:Object.create(null),dist:[],varErrors:[],ev:NaN,sd:NaN,min:NaN,max:NaN,err:'',inputs:inputs||null};
  const base=initialVars(m,inputs,{errors:R.varErrors});
  R.base=base;
  function go(id,vars,acc){
    const n=m.nodes[id],r={id,ev:NaN,tot:NaN,best:null,err:'',reach:0,acc,alts:[],vars};R.by[id]=r;
    const ctx=ctxOf(vars,null,true);
    /* calcula os filhos antes de decidir: assim todo nó recebe seu valor, mesmo fora do plano */
    const kidsCalc=[];
    for(const kid of n.kids){
      const k=m.nodes[kid],kv=copyVars(vars),kc=ctxOf(kv,null,true);let cash=0,berr='';
      try{if(k.cash.trim())cash=evalNum(k.cash,ctxOf(vars,null,true),t('cash'));applySet(k.set,kc)}catch(e){berr=e.message}
      const sub=go(kid,kv,acc+cash);
      kidsCalc.push({id:kid,cash,berr,sub});
    }
    try{
      if(n.type==='outcome'){
        r.ev=n.value.trim()?evalNum(n.value,ctx,t('value')):0;
      }else if(!n.kids.length){
        throw new ExprError(t('rDead',nodeName(n)));
      }else if(n.type==='decision'){
        const av=new Set(availOf(m,n,ctx));
        for(const c of kidsCalc)r.alts.push({id:c.id,cash:c.cash,avail:av.has(c.id),total:c.berr||c.sub.err?NaN:c.cash+c.sub.ev,err:c.berr||c.sub.err,p:null});
        const open=r.alts.filter(a=>a.avail);
        if(!open.length)throw new ExprError(t('rNoOption',nodeName(n)));
        const bad=open.find(a=>a.err);if(bad)throw new ExprError(bad.err);
        let b=open[0];for(const a of open)if(better(m.objective,a.total,b.total))b=a;
        r.best=b.id;r.ev=b.total;
      }else if(n.type==='chance'){
        const ps=probsOf(m,n,ctx);let ev=0;
        kidsCalc.forEach((c,i)=>{r.alts.push({id:c.id,cash:c.cash,avail:true,total:c.berr||c.sub.err?NaN:c.cash+c.sub.ev,err:c.berr||c.sub.err,p:ps[i]})});
        r.alts.forEach(a=>{if(a.p>0){if(a.err)throw new ExprError(a.err);ev+=a.p*a.total}});
        r.ev=ev;
      }else{
        const pick=pickRule(m,n,ctx);
        for(const c of kidsCalc)r.alts.push({id:c.id,cash:c.cash,avail:c.id===pick.kid,total:c.berr||c.sub.err?NaN:c.cash+c.sub.ev,err:c.berr||c.sub.err,p:null});
        const a=r.alts.find(x=>x.id===pick.kid);
        if(a.err)throw new ExprError(a.err);
        r.best=pick.kid;r.ev=a.total;
      }
    }catch(e){r.err=e.message;r.ev=NaN}
    r.tot=acc+r.ev;
    return r;
  }
  if(!m.root)return R;
  const rr=go(m.root,base,0);
  R.ev=rr.ev;R.err=rr.err;
  (function walk(id,reach){
    const r=R.by[id],n=m.nodes[id];r.reach=reach;
    if(r.err)return;
    if(n.type==='outcome'){R.dist.push({id,total:r.tot,p:reach});return}
    for(const a of r.alts){
      const share=n.type==='chance'?a.p:(a.id===r.best?1:0);
      if(share>0)walk(a.id,reach*share);
    }
  })(m.root,1);
  if(R.dist.length&&!R.err){
    const mean=R.dist.reduce((s,d)=>s+d.p*d.total,0);
    R.sd=Math.sqrt(Math.max(0,R.dist.reduce((s,d)=>s+d.p*(d.total-mean)**2,0)));
    R.min=Math.min(...R.dist.filter(d=>d.p>0).map(d=>d.total));
    R.max=Math.max(...R.dist.filter(d=>d.p>0).map(d=>d.total));
    R.loss=R.dist.reduce((s,d)=>s+(d.total<0?d.p:0),0);
  }
  return R;
}
function firstDecision(m){
  const q=m.root?[m.root]:[];
  while(q.length){const id=q.shift(),n=m.nodes[id];if(n.type==='decision')return id;q.push(...n.kids)}
  return null;
}
/* distribuição de uma alternativa, seguindo o plano a partir dela */
function altDist(m,R,id){
  const out=[];
  (function walk(i,reach){
    const r=R.by[i],n=m.nodes[i];if(r.err)return;
    if(n.type==='outcome'){out.push({total:r.tot,p:reach});return}
    for(const a of r.alts){const share=n.type==='chance'?a.p:(a.id===r.best?1:0);if(share>0)walk(a.id,reach*share)}
  })(id,1);
  return out;
}
function enumPaths(m,R,cap=500){
  const out=[];let truncated=false;
  if(!m.root)return{paths:out,truncated};
  (function go(id,steps,p,active,inPlan){
    if(truncated)return;
    const n=m.nodes[id],r=R.by[id];
    if(!n.kids.length){
      if(out.length>=cap){truncated=true;return}
      out.push({leaf:id,steps,p,active,inPlan:inPlan&&active&&!r.err,total:r?r.tot:NaN,dead:n.type!=='outcome'});return;
    }
    for(const kid of n.kids){
      const a=r&&r.alts.find(x=>x.id===kid);
      const isActive=n.type!=='rule'||!a||a.avail,isOpen=n.type!=='decision'||!a||a.avail;
      const chosen=n.type==='chance'?(a&&a.p>0):r&&r.best===kid;
      go(kid,[...steps,{node:id,kid}],n.type==='chance'&&a?p*a.p:p,active&&isActive&&isOpen,inPlan&&!!chosen);
    }
  })(m.root,[],1,true,true);
  return{paths:m.root?out:[],truncated};
}

/* ========== verificação ========== */
function checkModel(m){
  const out=[];
  const add=(sev,id,msg)=>out.push({sev,id,msg});
  if(!m.root)return out;
  const fieldErr=(id,label,src,kind='expr')=>{
    if(!String(src||'').trim())return null;
    const e=kind==='stmt'?stmtError(src):kind==='tpl'?tplError(src):exprError(kind==='prob'?normProb(src):normNum(src));
    if(e)add('error',id,t('iExpr',nodeName(m.nodes[id]),label,e));
    return e;
  };
  const known=new Set(m.vars.map(v=>v.name).filter(Boolean));
  const seenNames=new Set();
  for(const v of m.vars){
    if(!/^[\p{L}_][\p{L}\p{N}_]*$/u.test(v.name))add('error',null,t('iVarName',v.name||'—'));
    else if(seenNames.has(v.name))add('error',null,t('iVarDup',v.name));
    seenNames.add(v.name);
    if(!v.value.trim()&&!v.dist.trim()&&!v.ask)add('warn',null,t('iVarEmpty',v.name||'—'));
    if(v.dist.trim()){const e=exprError(v.dist);if(e)add('error',null,t('iVarDist',v.name,e))}
  }
  const undef=(id,src,kind,scope)=>{
    if(!String(src||'').trim())return;
    try{
      if(kind==='stmt'){
        for(const st of parseStatements(src)){for(const nm of astVars(st.expr))if(!scope.has(nm))add('error',id,t('iUndefVar',nm,nodeName(m.nodes[id])));if(st.target&&st.target.k==='var')scope.add(st.target.n)}
      }else if(kind==='tpl'){
        for(const p of parseTemplate(src))if(p.ast)for(const nm of astVars(p.ast))if(!scope.has(nm))add('error',id,t('iUndefVar',nm,nodeName(m.nodes[id])));
      }else for(const nm of astVars(parseExpr(kind==='prob'?normProb(src):normNum(src))))if(!scope.has(nm))add('error',id,t('iUndefVar',nm,nodeName(m.nodes[id])));
    }catch{}
  };
  (function walk(id,scope){
    const n=m.nodes[id],name=nodeName(n);
    if(!n.text.trim())add('warn',id,t('iNoText',typeName(n.type)));
    if(n.parent){
      const p=m.nodes[n.parent];
      if(p.type==='chance'&&!fieldErr(id,t('probability'),n.prob,'prob'))undef(id,n.prob,'prob',scope);
      if(p.type!=='chance'&&!fieldErr(id,t(p.type==='rule'?'guard':'avail'),n.guard))undef(id,n.guard,'expr',scope);
      if(!fieldErr(id,t('cash'),n.cash))undef(id,n.cash,'expr',scope);
      if(!fieldErr(id,t('setVars'),n.set,'stmt'))undef(id,n.set,'stmt',scope);
      if(!n.label.trim()&&!(p.type==='rule'&&n.guard.trim()))add('warn',n.parent,t('iNoLabel',nodeName(p)));
    }
    if(n.type==='outcome'){
      if(n.kids.length)add('error',id,t('iOutcomeKids',name));
      if(!n.value.trim())add('warn',id,t('iNoValue',name));
      else if(!fieldErr(id,t('value'),n.value))undef(id,n.value,'expr',scope);
      if(!fieldErr(id,t('message'),n.msg,'tpl'))undef(id,n.msg,'tpl',scope);
    }else{
      if(!n.kids.length)add('error',id,t('iDead',name));
      else if(n.kids.length<2&&n.type!=='rule')add('warn',id,t('iFew',name));
      const labels=new Set();
      for(const k of n.kids){const l=m.nodes[k].label.trim().toLowerCase();if(l&&labels.has(l))add('warn',id,t('iDupLabel',name,m.nodes[k].label));labels.add(l)}
      if(n.type==='rule'&&n.kids.length&&!n.kids.some(k=>!m.nodes[k].guard.trim()))add('warn',id,t('iNoElse',name));
      if(n.type==='rule'){const elses=n.kids.filter(k=>!m.nodes[k].guard.trim());if(elses.length>1)add('warn',id,t('iManyElse',name))}
    }
    n.kids.forEach(k=>walk(k,new Set(scope)));
  })(m.root,known);
  for(const o of orphans(m))add('warn',o.id,t('iLoose',nodeName(o)));
  /* erros de cálculo: probabilidades que não fecham, divisões por zero etc. */
  const R=rollback(m);
  for(const v of R.varErrors)add('error',null,t('iVarDist',v.name,v.msg));
  const already=new Set(out.filter(i=>i.sev==='error').map(i=>i.id));
  for(const id of orderedIds(m)){
    const r=R.by[id];
    if(!r||!r.err||already.has(id))continue;
    const n=m.nodes[id];
    /* o erro subiu de um filho: basta relatar no nó que o causou */
    if(n.kids.some(k=>R.by[k]&&R.by[k].err===r.err))continue;
    if(!n.kids.length&&n.type!=='outcome')continue;
    add('error',id,r.err.includes(nodeName(n))?r.err:t('iCalc',nodeName(n),r.err));
  }
  return out;
}

/* ========== motor de simulação ========== */
class Run{
  constructor(m,opts){
    this.m=m;this.seed=opts.seed;this.rng=new RNG(opts.seed);this.decisions=opts.decisions||'ask';this.chances=opts.chances||'draw';
    this.inputs=opts.inputs||null;this.asked=m.vars.filter(v=>v.name&&v.ask);
    this.plan=rollback(m,this.inputs);
    this.reset(opts.started);
  }
  reset(started){
    this.rng=new RNG(this.seed);
    this.status=this.asked.length&&!started?'input':'ready';
    this.cur=this.m.root;this.acc=0;this.pathP=1;this.log=[];this.snaps=[];this.result=null;this.err='';this.lastChanges=[];
    this.path=this.cur?[this.cur]:[];
    if(this.status==='ready'){
      const errs=[];this.vars=initialVars(this.m,this.inputs,{rng:this.rng,errors:errs});
      if(errs.length){this.status='error';this.err=errs[0].name+': '+errs[0].msg}
      else if(!this.cur){this.status='error';this.err=t('rNoRoot')}
    }else this.vars=Object.create(null);
    this.settle();
  }
  start(inputs){this.inputs=inputs;this.plan=rollback(this.m,inputs);this.reset(true)}
  needsUser(n){return n.type==='decision'?this.decisions==='ask':n.type==='chance'&&this.chances==='manual'}
  settle(){
    if(this.status!=='ready'&&this.status!=='ask')return;
    const n=this.m.nodes[this.cur];
    this.status=n&&n.type!=='outcome'&&this.needsUser(n)?'ask':'ready';
  }
  snapshot(){return{cur:this.cur,acc:this.acc,pathP:this.pathP,vars:copyVars(this.vars),rng:this.rng.s,logLen:this.log.length,path:[...this.path],status:this.status,lastChanges:this.lastChanges}}
  restore(s){this.cur=s.cur;this.acc=s.acc;this.pathP=s.pathP;this.vars=copyVars(s.vars);this.rng.s=s.rng;this.log.length=s.logLen;this.path=[...s.path];this.status=s.status==='ask'||s.status==='ready'?'ready':s.status;this.result=null;this.err='';this.lastChanges=s.lastChanges;this.settle()}
  back(){if(!this.snaps.length)return false;this.restore(this.snaps.pop());return true}
  jump(i){if(i<0||i>=this.snaps.length)return;const s=this.snaps[i];this.snaps.length=i;this.restore(s)}
  options(n){
    const ctx=ctxOf(this.vars,this.rng);const r=this.plan.by[n.id];
    if(n.type==='chance'){const ps=probsOf(this.m,n,ctx);return n.kids.map((id,i)=>({id,open:ps[i]>0,p:ps[i],best:false,total:r&&r.alts[i]?r.alts[i].total:NaN}))}
    const av=new Set(availOf(this.m,n,ctx));
    return n.kids.map((id,i)=>({id,open:av.has(id),p:null,total:r&&r.alts[i]?r.alts[i].total:NaN,best:r&&r.best===id}));
  }
  fail(e){this.status='error';this.err=e.message||String(e);return{moved:false}}
  /* avança um passo; kid só vem quando a pessoa escolheu */
  step(kid){
    if(this.status==='done'||this.status==='error'||this.status==='input')return{moved:false};

    l=Math.min(l,n.x-NODE_W/2);r=Math.max(r,n.x+NODE_W/2);t2=Math.min(t2,n.y-h/2);b=Math.max(b,n.y+h/2);

function altRows(m,R,id){

  return r.alts.map(a=>{
    const kid=R.by[a.id],d=a.avail?altDist(m,R,a.id).filter(x=>x.p>0):[];
    const tot=a.avail&&Number.isFinite(a.total)?r.acc+a.total:NaN;
    return{id:a.id,label:nodeLabelFor(m,a.id),total:tot,avail:a.avail,best:r.best===a.id,regret:Number.isFinite(tot)?Math.abs(a.total-bestV):NaN,min:d.length?Math.min(...d.map(x=>x.total)):NaN,max:d.length?Math.max(...d.map(x=>x.total)):NaN,kid};
  });
}

function drawsChangeBranches(m){
  const drawn=new Set(m.vars.filter(v=>v.dist.trim()).map(v=>v.name));if(!drawn.size)return false;
  const used=new Set();
  for(const n of Object.values(m.nodes)){
    try{
      if(n.prob.trim())astVars(parseExpr(normProb(n.prob)),used);
      if(n.guard.trim())astVars(parseExpr(n.guard),used);
      for(const st of parseStatements(n.set))astVars(st.expr,used);
    }catch{}
  }
  return[...drawn].some(x=>used.has(x));
}
function mcRows(m,R,mc){
  const exact=Object.create(null);(R.dist||[]).forEach(d=>exact[d.id]=d.p);
  const valid=mc.policy==='plan'&&!drawsChangeBranches(m);
  return Object.keys(mc.ends).map(id=>{const e=mc.ends[id],n=m.nodes[id];return{id,name:n?`${numbersOf(m)[id]} ${nodeName(n)}`:id,n:e.n,freq:e.n/mc.done,mean:e.sum/e.n,exact:valid?(exact[id]||0):NaN}}).sort((a,b)=>b.n-a.n);
}

}

const mdEsc=s=>String(s??'').replace(/\|/g,'\\|').replace(/\r?\n/g,' ');

function procMd(nd,depth){
  const pad='  '.repeat(depth),h_=nd.head;
  let s=`**${h_.num}. ${t('glyph_'+h_.type)} ${h_.text}** (${typeName(h_.type)})`;
  if(h_.desc)s+=` ${h_.desc}`;
  if(h_.extra)s+=` ${h_.extra}`;
  let out=s+'\n';
  for(const it of nd.items)out+=`${pad}- *${it.branch||'—'}* → ${procMd(it.node,depth+1)}`;
  return out;
}
function blockMd(b){
  switch(b.k){
    case'p':return b.v+'\n\n';
    case'h3':return`### ${b.v}\n\n`;
    case'kpis':return b.items.map(([l,v])=>`- **${l}:** ${v}`).join('\n')+'\n\n';
    case'table':{
      const nums=b.head.map(x=>x&&x.num!=null);
      return`| ${b.head.map(cellMd).join(' | ')} |\n| ${nums.map(n=>n?'---:':'---').join(' | ')} |\n${b.rows.map(r=>`| ${r.map(cellMd).join(' | ')} |`).join('\n')}\n\n`;
    }
    case'figure':return'```mermaid\n'+b.mermaid+'\n```\n\n'+`*${b.caption}*\n\n`;
    case'chart':return`*${b.caption}*: ${t('dSeeHtml')}\n\n`;
    case'list':return b.items.map(i=>`- ${i}`).join('\n')+'\n\n';
    case'proc':return`- ${procMd(b.root,1)}\n`;
  }
  return'';
}

const svg=$('#svg'),world=$('#world');

  run:null,simTab:'trace',seed:12345,decisions:'ask',chances:'draw',playing:false,playT:null,speed:1,overlay:true,heat:false,hl:null,
  mc:null,mcCfg:{runs:5000,seed:12345,policy:'plan'},mcBusy:false,sens:null,sensCfg:null,menuClose:null};

  if(m.auto)relayout();

/* ========== desenho no palco ========== */
function curPlan(){return S.mode==='sim'&&S.run?S.run.plan:S.plan}
function renderCanvas(){
  const m=S.m,R=curPlan(),nums=numbersOf(m),ids=visibleIds(m),run=S.mode==='sim'?S.run:null;
  $('#empty').classList.toggle('hidden',ids.length>0);
  document.body.classList.toggle('mode-sim',S.mode==='sim');
  svg.classList.toggle('mode-sim',S.mode==='sim');
  const errIds=new Set(S.issues.filter(i=>i.sev==='error'&&i.id).map(i=>i.id));
  let walked=new Set(),optIds=new Set(),inFuture=null;
  if(run&&run.status!=='input'){
    for(let i=1;i<run.path.length;i++)walked.add(run.path[i]);
    if(run.status==='ask'){try{run.options(m.nodes[run.cur]).forEach(o=>{if(o.open)optIds.add(o.id)})}catch{}}
    inFuture=new Set(subtreeIds(m,run.cur));
  }
  const hl=S.hl?new Set(S.hl):null;
  const heat=S.mode==='sim'&&S.heat&&S.mc&&S.mc.key===logicKey(m)?S.mc:null;
  let ed='',no='';
  for(const id of ids){
    const n=m.nodes[id];
    if(n.parent){
      const st=S.overlay&&!heat?edgeState(m,n,m.nodes[n.parent],R):{};
      const cls=[];
      if(S.mode==='edit'&&S.sel===id)cls.push('sel');
      if(st.best)cls.push('best');if(st.rejected)cls.push('rej');
      if(walked.has(id))cls.push('walked');
      if(optIds.has(id))cls.push('opt');
      if(hl&&hl.has(id))cls.push('hl');
      if(run&&run.status!=='input'&&!walked.has(id)&&!inFuture.has(id))cls.push('dim');
      const o={cls,rejected:st.rejected&&!walked.has(id)};
      if(heat)o.width=1.2+7*((heat.visits[id]||0)/(heat.done||1));
      ed+=edgeMarkup(m,n,m.nodes[n.parent],R,o);
    }
    const cls=[];
    if(S.mode==='edit'&&S.sel===id)cls.push('sel');
    if(S.mode==='edit'&&errIds.has(id))cls.push('bad');
    if(run&&run.cur===id&&run.status!=='input')cls.push(run.status==='error'?'err':'active');
    if(optIds.has(id))cls.push('opt');
    if(run&&run.status!=='input'&&!walked.has(id)&&!inFuture.has(id)&&id!==m.root)cls.push('dim');
    if(!n.parent&&id!==m.root)cls.push('loose');
    no+=nodeMarkup(m,n,{num:nums[id],cls,valText:nodeValueText(m,n,R,{values:S.overlay,heat})});
  }
  $('#g-edges').innerHTML=ed;$('#g-nodes').innerHTML=no;
  applyView();
}
function applyView(){const v=S.view;world.setAttribute('transform',`translate(${v.x} ${v.y}) scale(${v.k})`);$('#z-label').textContent=Math.round(v.k*100)+'%';$('#dots').setAttribute('patternTransform',`translate(${v.x} ${v.y}) scale(${v.k})`)}
function toWorld(e){const r=svg.getBoundingClientRect(),v=S.view;return{x:(e.clientX-r.left-v.x)/v.k,y:(e.clientY-r.top-v.y)/v.k}}
function zoomAt(px,py,f){const v=S.view,k=Math.min(3,Math.max(.05,v.k*f));v.x=px-(px-v.x)*k/v.k;v.y=py-(py-v.y)*k/v.k;v.k=k;applyView()}
function fitView(){
  const ids=visibleIds(S.m),r=svg.getBoundingClientRect();
  if(!ids.length||!r.width){S.view={x:40,y:40,k:1};applyView();return}
  const b=boundsOf(S.m,ids,S.plan),pad=44,bw=b.r-b.l+80,bh=b.b-b.t+60;
  const k=Math.min(1.15,Math.max(.05,Math.min((r.width-2*pad)/bw,(r.height-2*pad)/bh)));
  /* em tela estreita a árvore inteira ficaria ilegível: abre legível a partir da raiz; arrastar mostra o resto */
  if(r.width<760&&k<.6){const root=S.m.nodes[S.m.root]||S.m.nodes[ids[0]];S.view={k:.6,x:14+NODE_W*.3-root.x*.6,y:r.height/2-root.y*.6};applyView();return}
  S.view={k,x:r.width/2-(b.l+b.r)/2*k,y:r.height/2-(b.t+b.b)/2*k};applyView();
}
function ensureVisible(id){
  const n=S.m.nodes[id];if(!n)return;
  const r=svg.getBoundingClientRect(),v=S.view,sx=n.x*v.k+v.x,sy=n.y*v.k+v.y,mx=NODE_W*v.k/2+10,my=50*v.k;
  if(sx<mx||sx>r.width-mx||sy<my||sy>r.height-my){v.x=r.width/2-n.x*v.k;v.y=r.height/2-n.y*v.k;applyView()}
}
function nodeAt(p,exclude){
  for(const id of visibleIds(S.m).reverse()){
    if(exclude&&exclude.has(id))continue;
    const n=S.m.nodes[id],h=nodeH(n);
    if(Math.abs(p.x-n.x)<=NODE_W/2+4&&Math.abs(p.y-n.y)<=h/2+4)return n;
  }
  return null;
}

/* ========== interação com o diagrama ========== */
const pointers=new Map();
let drag=null,pinch=null;
svg.addEventListener('pointerdown',e=>{
  closeQuick();finishRename(true);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const[a,b]=[...pointers.values()];
    const r=svg.getBoundingClientRect();
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2-r.left,cy:(a.y+b.y)/2-r.top};drag=null;return;
  }
  if(e.button!==0&&e.pointerType==='mouse'){drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y,moved:false};svg.setPointerCapture(e.pointerId);return}
  const tg=e.target,p=toWorld(e);
  svg.focus({preventScroll:true});
  svg.setPointerCapture(e.pointerId);
  const col=tg.closest&&tg.closest('[data-col]');
  if(col){drag={kind:'col',id:col.dataset.col,moved:false};return}
  const edit=S.mode==='edit';
  const port=tg.closest&&tg.closest('[data-port]');
  if(port&&edit){drag={kind:'port',id:port.dataset.port,sx:e.clientX,sy:e.clientY,moved:false,p};return}
  const nodeEl=tg.closest&&tg.closest('.node');
  if(nodeEl){
    const id=nodeEl.dataset.id,n=S.m.nodes[id];
    if(!edit){drag={kind:'simnode',id,sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y,moved:false};return}
    select(id);
    const ids=new Set(subtreeIds(S.m,id));
    const start=new Map([...ids].map(x=>[x,{x:S.m.nodes[x].x,y:S.m.nodes[x].y}]));
    drag={kind:'node',id,ids,start,p0:p,sx:e.clientX,sy:e.clientY,moved:false,tgt:null};return;
  }
  const edgeEl=tg.closest&&tg.closest('[data-edge]');
  if(edgeEl){
    if(!edit){drag={kind:'simnode',id:edgeEl.dataset.edge,sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y,moved:false};return}
    select(edgeEl.dataset.edge);drag={kind:'edge',id:edgeEl.dataset.edge};return;
  }
  drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y,moved:false,bg:true};
});
svg.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size===2){
    const[a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt(pinch.cx,pinch.cy,d/pinch.d);pinch.d=d;return;
  }
  if(!drag)return;
  const dist=Math.hypot(e.clientX-(drag.sx||0),e.clientY-(drag.sy||0));
  if(drag.kind==='pan'||drag.kind==='simnode'){
    if(dist>4)drag.moved=true;
    if(drag.moved){S.view.x=drag.vx+e.clientX-drag.sx;S.view.y=drag.vy+e.clientY-drag.sy;applyView()}
  }else if(drag.kind==='node'){
    if(dist>4)drag.moved=true;
    if(!drag.moved)return;
    const p=toWorld(e),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;
    drag.ids.forEach(x=>{const s=drag.start.get(x);S.m.nodes[x].x=s.x+dx;S.m.nodes[x].y=s.y+dy});
    const near=nodeAt(p,drag.ids);
    drag.tgt=near&&!linkProblem(S.m,near.id,drag.id)&&near.id!==S.m.nodes[drag.id].parent?near.id:null;
    renderCanvas();
    if(drag.tgt)$(`.node[data-id="${drag.tgt}"]`)?.classList.add('tgt');
  }else if(drag.kind==='port'){
    if(dist>4)drag.moved=true;
    if(!drag.moved)return;
    const p=toWorld(e),a=S.m.nodes[drag.id];
    const near=nodeAt(p,new Set([drag.id]));
    const ok=near&&!linkProblem(S.m,drag.id,near.id)&&near.parent!==drag.id;
    drag.tgt=ok?near.id:null;drag.end=p;
    const sx=S.m.orient==='LR'?a.x+NODE_W/2:a.x,sy=S.m.orient==='LR'?a.y:a.y+nodeH(a)/2;
    $('#g-over').innerHTML=`<path class="preview" d="M${sx} ${sy}L${p.x} ${p.y}"/>`;
    $$('.node.tgt').forEach(x=>x.classList.remove('tgt'));
    if(drag.tgt)$(`.node[data-id="${drag.tgt}"]`)?.classList.add('tgt');
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pinch){if(pointers.size<2)pinch=null;return}
  const d=drag;drag=null;if(!d)return;
  if(d.kind==='col'){const n=S.m.nodes[d.id];if(n){n.collapsed=!n.collapsed;commit();if(S.sel&&!isVisible(S.m,S.sel))select(d.id)}return}
  if(d.kind==='pan'){if(!d.moved&&d.bg&&S.mode==='edit'&&S.sel)select(null);return}
  if(d.kind==='simnode'){if(!d.moved)simClick(d.id);return}
  if(d.kind==='edge'){tapped(d.id,'label');return}
  if(d.kind==='node'){
    if(!d.moved){tapped(d.id,'text');return}
    if(d.tgt){
      d.ids.forEach(x=>{const s=d.start.get(x);S.m.nodes[x].x=s.x;S.m.nodes[x].y=s.y});
      const was=S.m.nodes[d.id];
      reparent(S.m,d.id,d.tgt);
      if(!S.m.auto)placeNew(S.m,was);
      commit();renderInspector();toast(t('moved',nodeName(was),nodeName(S.m.nodes[d.tgt])));return;
    }
    if(S.m.auto){S.m.auto=false;toast(t('manualOn'),'warn',5000)}
    commit();return;
  }
  if(d.kind==='port'){
    $('#g-over').innerHTML='';
    if(!d.moved){openQuick(d.id,e);return}
    if(d.tgt){reparent(S.m,d.tgt,d.id);commit();select(d.tgt);return}
    const near=d.end&&nodeAt(d.end,new Set([d.id]));
    if(near){toast(t('badLink',linkProblem(S.m,d.id,near.id)||t('lkAlready')),'err');renderCanvas();return}
    openQuick(d.id,e);
  }
}
svg.addEventListener('pointerup',endPointer);
svg.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=null;$('#g-over').innerHTML='';drag=null;renderCanvas()});
svg.addEventListener('contextmenu',e=>e.preventDefault());
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12)},{passive:false});
/* o clique redesenha o nó e o navegador deixa de gerar dblclick: duplo clique e duplo toque saem daqui */
let lastTap={};
function tapped(id,field){
  const now=performance.now();
  if(lastTap.id===id&&lastTap.field===field&&now-lastTap.t<450){lastTap={};startRename(id,field)}
  else lastTap={id,field,t:now};
}
function select(id){S.sel=id;S.right=id&&S.right==='check'?'check':S.right==='vars'&&id?'props':S.right;renderCanvas();renderLeft();renderTabs();renderInspector();if(id&&S.m.nodes[id])say(typeName(S.m.nodes[id].type)+': '+nodeName(S.m.nodes[id]))}
function placeNew(m,n){
  const p=m.nodes[n.parent];if(!p)return;
  const sib=p.kids.filter(k=>k!==n.id).map(k=>m.nodes[k]);
  const LR=m.orient==='LR',ox=n.x,oy=n.y;
  if(LR){n.x=p.x+NODE_W+90;n.y=sib.length?Math.max(...sib.map(s=>s.y))+nodeH(sib[0])+30:p.y}
  else{n.y=p.y+nodeH(p)/2+nodeH(n)/2+70;n.x=sib.length?Math.max(...sib.map(s=>s.x))+NODE_W+30:p.x}
  const mx=n.x-ox,my=n.y-oy;
  subtreeIds(m,n.id).slice(1).forEach(x=>{m.nodes[x].x+=mx;m.nodes[x].y+=my});
}
function defaultBranch(p){
  const c=p.kids.length+1;
  if(p.type==='decision')return{label:t('defOption',c)};
  if(p.type==='chance')return{label:t('defCase',c)};
  return{label:t('defRule',c)};
}
function addChildOf(pid,type,rename=true,pos){
  const m=S.m;
  if(nodeCount(m)>=MAX_NODES){toast(t('tooMany',MAX_NODES),'err');return null}
  const p=pid?m.nodes[pid]:null;
  if(p&&p.type==='outcome'){toast(t('badLink',t('lkOutcome')),'err');return null}
  const n=addChild(m,pid,type,{text:t('def_'+type),...(p?defaultBranch(p):{})});
  if(p)p.collapsed=false;
  if(pos){n.x=pos.x;n.y=pos.y}
  if(p&&!m.auto)placeNew(m,n);
  commit();S.sel=n.id;if(S.right==='vars')S.right='props';renderCanvas();renderLeft();renderTabs();renderInspector();ensureVisible(n.id);
  if(rename)startRename(n.id,'text');
  return n;
}
function openQuick(pid,e){
  closeQuick();
  const st=$('#stage').getBoundingClientRect();
  const q=h('div',{id:'quick',role:'menu'},TYPE_ORDER.map(ty=>{
    const b=h('button',{role:'menuitem',onclick(){closeQuick();addChildOf(pid,ty)}},typeName(ty));
    b.insertAdjacentHTML('afterbegin',glyphSvg(ty));return b;
  }));
  q.style.left=Math.max(4,Math.min(st.width-212,e.clientX-st.left+6))+'px';

  $('#stage').append(q);q.querySelector('button').focus();
}
function closeQuick(){$('#quick')?.remove()}
let renamer=null;
function startRename(id,field){
  finishRename(true);
  const n=S.m.nodes[id];if(!n)return;
  if(field==='label'&&!n.parent)return;
  const v=S.view,st=$('#stage'),w=(field==='text'?NODE_W:200);
  const g=field==='label'?edgeGeom(S.m,n,S.m.nodes[n.parent]):null;
  const cx=field==='text'?n.x:g.mid.x+w/2*(g.mark.dir==='h'?1:0),cy=field==='text'?n.y:g.end.y-(g.mark.dir==='h'?14:30);
  const hh=field==='text'?Math.max(46,nodeH(n)-20):26;
  const box=h('textarea',{id:'renamer','aria-label':t(field==='text'?'text':'branchLabel')});
  box.value=n[field];
  box.style.width=w*v.k+'px';box.style.height=hh*v.k+'px';box.style.left=(cx*v.k+v.x-w*v.k/2)+'px';box.style.top=(cy*v.k+v.y-hh*v.k/2)+'px';
  box.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();finishRename(true);svg.focus({preventScroll:true})}
    else if(e.key==='Escape'){e.preventDefault();finishRename(false);svg.focus({preventScroll:true})}
  });
  box.addEventListener('blur',()=>finishRename(true));
  st.append(box);box.focus();box.select();
  renamer={box,id,field};
}
function finishRename(save){
  if(!renamer)return;
  const{box,id,field}=renamer;renamer=null;
  const n=S.m.nodes[id];
  if(save&&n&&n[field]!==box.value){n[field]=box.value;box.remove();commit();renderInspector();return}
  box.remove();
}
function deleteNode(id){
  const n=S.m.nodes[id];if(!n)return;
  const c=subtreeIds(S.m,id).length;
  const parent=n.parent,name=nodeName(n);
  removeSubtree(S.m,id);S.sel=parent&&S.m.nodes[parent]?parent:null;
  commit();renderInspector();toast(c>1?t('deletedMany',name,c-1):t('deleted',name));
}
function copyNode(id){S.clip=copyOf(S.m,id);toast(t('copiedBranch',subtreeIds(S.m,id).length))}
function pasteUnder(pid){
  if(!S.clip)return;
  const m=S.m;
  if(pid&&m.nodes[pid].type==='outcome'){toast(t('badLink',t('lkOutcome')),'err');return}
  if(nodeCount(m)+S.clip.nodes.length>MAX_NODES){toast(t('tooMany',MAX_NODES),'err');return}
  const nr=cloneSubtree(m,S.clip,m),n=m.nodes[nr];
  n.parent=null;
  if(pid){n.parent=pid;m.nodes[pid].kids.push(nr);m.nodes[pid].collapsed=false;if(!m.auto)placeNew(m,n)}
  else if(!m.root)m.root=nr;
  commit();select(nr);
}
function moveSibling(id,d){
  const n=S.m.nodes[id];if(!n||!n.parent)return;

function renderPalette(){
  const box=$('#palette');box.textContent='';
  for(const ty of TYPE_ORDER){
    const b=h('button',{class:'pal',title:t('tip_'+ty)},h('span',null,typeName(ty)));
    b.insertAdjacentHTML('afterbegin',glyphSvg(ty));
    let g=null,start=null,moved=false;
    b.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};moved=false;b.setPointerCapture(e.pointerId)});
    b.addEventListener('pointermove',e=>{
      if(!start)return;
      if(!moved&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>5){moved=true;g=h('div',{id:'ghost'},typeName(ty));document.body.append(g)}
      if(g){g.style.left=e.clientX+8+'px';g.style.top=e.clientY+8+'px'}
    });
    const finish=e=>{
      if(!start)return;start=null;
      if(g){g.remove();g=null}
      if(!moved)return;
      if(S.mode!=='edit')return;
      const r=svg.getBoundingClientRect();
      if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;
      const p=toWorld(e),near=nodeAt(p);
      if(near){addChildOf(near.id,ty)}
      else addChildOf(null,ty,true,p);
      moved='done';
    };
    b.addEventListener('pointerup',finish);
    b.addEventListener('pointercancel',()=>{start=null;if(g){g.remove();g=null}});
    b.addEventListener('click',()=>{if(moved){moved=false;return}if(S.mode==='edit')paletteClick(ty)});
    box.append(b);
  }

/* ========== simulação passo a passo ========== */
function startSim(){
  stopPlay();
  S.run=new Run(S.m,{seed:S.seed,decisions:S.decisions,chances:S.chances});
  renderSim();renderCanvas();
}
function setStatus(s){$('#status').textContent=s}
function stopPlay(){S.playing=false;clearTimeout(S.playT);updateSimButtons()}
function updateSimButtons(){
  const r=S.run;if(!r)return;
  const b=$('#b-play');b.textContent=t(S.playing?'pause':'play');
  const over=r.status==='done'||r.status==='error'||r.status==='input';
  b.disabled=over;$('#b-step').disabled=over;$('#b-back').disabled=!r.snaps.length;
}
function simStep(kid,fromPlay){
  const r=S.run;if(!r)return;
  const res=r.step(kid);
  if(res.waiting){setStatus(t('waitingYou'));afterStep(res);return}
  afterStep(res);
  if(res.moved&&S.m.nodes[res.to].bp&&fromPlay){stopPlay();setStatus(t('bpHit',nodeName(S.m.nodes[res.to])))}
  if(r.status==='done'||r.status==='error')stopPlay();
}
function afterStep(res){
  renderCanvas();renderSim();
  ensureVisible(S.run.cur);
  if(res.moved)animateToken(res.from,res.to);
  const r=S.run,n=S.m.nodes[r.cur];
  if(r.status==='done')say(t('finished')+': '+nodeName(n)+' '+fmtMoney(S.m,r.result.total));
  else if(n)say(nodeName(n));
  if(r.status==='done')setStatus(t('finished'));
  else if(r.status==='ask')setStatus(t('waitingYou'));
  else if(r.status==='error')setStatus(t('runError'));
  else setStatus(n?nodeName(n):'');
}
function animateToken(from,to){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const m=S.m,a=m.nodes[from],b=m.nodes[to];if(!a||!b||!isVisible(m,to))return;
  const g=edgeGeom(m,b,a),pts=[g.start,{x:g.mark.dir==='h'?g.mid.x:g.start.x,y:g.mark.dir==='h'?g.start.y:g.mid.y},g.mark.dir==='h'?g.mid:{x:g.end.x,y:g.mid.y},g.end];
  const lens=[];let total=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);lens.push(l);total+=l}
  const dur=380/S.speed,t0=performance.now();
  const tok=$('#g-sim');tok.innerHTML='<circle class="tok" r="7"/>';const c=tok.firstChild;
  const frame=now=>{
    if(tok.firstChild!==c)return;
    const f=Math.min(1,(now-t0)/dur);let d=f*total,i=0;
    while(i<lens.length-1&&d>lens[i]){d-=lens[i];i++}
    const q=lens[i]?d/lens[i]:0;
    c.setAttribute('cx',pts[i].x+(pts[i+1].x-pts[i].x)*q);c.setAttribute('cy',pts[i].y+(pts[i+1].y-pts[i].y)*q);
    if(f<1)requestAnimationFrame(frame);else tok.innerHTML='';
  };
  requestAnimationFrame(frame);
}
function playLoop(){
  if(!S.playing)return;
  const r=S.run;
  if(r.status==='ask'){setStatus(t('waitingYou'));S.playT=setTimeout(playLoop,200);return}
  simStep(null,true);
  if(S.playing)S.playT=setTimeout(playLoop,900/S.speed);
}

function openMenu(btn,items){
  if(S.menuClose){const same=S.menuBtn===btn;S.menuClose();if(same)return}
  const list=h('div',{class:'menu-list',role:'menu'},items.map(i=>{
    if(i==='-')return h('hr');
    if(i.head)return h('div',{class:'mh'},i.head);
    return h('button',{role:'menuitem',disabled:i.disabled,onclick(){close();i.run()}},i.label);
  }));
  const close=()=>{list.remove();document.removeEventListener('pointerdown',away,true);document.removeEventListener('keydown',esc_,true);S.menuClose=null;S.menuBtn=null};
  const away=e=>{if(!list.contains(e.target)&&e.target!==btn)close()};
  const esc_=e=>{if(e.key==='Escape'){e.stopPropagation();close();btn.focus()}};
  btn.parentElement.append(list);
  document.addEventListener('pointerdown',away,true);document.addEventListener('keydown',esc_,true);
  S.menuClose=close;S.menuBtn=btn;
  list.querySelector('button')?.focus();
}
