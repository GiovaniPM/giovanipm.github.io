    '-',
    {label:(m.orient==='LR'?'✓ ':'')+t('layoutH'),run(){m.orient='LR';m.auto=true;commit();fitView();renderInspector()}},
    {label:(m.orient==='TD'?'✓ ':'')+t('layoutV'),run(){m.orient='TD';m.auto=true;commit();fitView();renderInspector()}},
    '-',
    {label:t('expandAll'),run(){Object.values(m.nodes).forEach(n=>n.collapsed=false);m.auto=true;commit();fitView()}},
    {label:t('collapseAll'),run(){Object.values(m.nodes).forEach(n=>{n.collapsed=n.parent&&n.kids.length>0});m.auto=true;S.sel=null;commit();renderInspector();fitView()}},
  ]);
}
function saveJson(){download(JSON.stringify(S.m,null,2),slug(S.m.name)+'.json','application/json');toast(t('saved'))}
function exportSvg(){const s=treeSvg(S.m,S.plan,{standalone:true,values:S.overlay});download(s,slug(S.m.name)+'.svg','image/svg+xml');toast(t('saved'))}
function exportPng(){
  const s=treeSvg(S.m,S.plan,{standalone:true,values:S.overlay});
  const u=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'})),img=new Image();
  img.onload=()=>{
    try{
      const scale=2,W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
      const k=Math.min(scale,8000/Math.max(W,H));
      const c=h('canvas');c.width=Math.ceil(W*k);c.height=Math.ceil(H*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{if(b){download(b,slug(S.m.name)+'.png','image/png');toast(t('saved'))}else toast(t('pngFail'),'err');URL.revokeObjectURL(u)},'image/png');
    }catch{toast(t('pngFail'),'err');URL.revokeObjectURL(u)}
  };
  img.onerror=()=>{toast(t('pngFail'),'err');URL.revokeObjectURL(u)};
  img.src=u;
}
$('#file-json').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    if(f.size>20*1024*1024)throw new Error(t('tooBig'));
    const m=loadModel(JSON.parse(await f.text()));
    confirmReplace(()=>{setModel(m);toast(t('opened',f.name))});
  }catch(err){toast(t('badFile',err.message),'err')}
});

/* ========== modo, idioma, tema, teclado ========== */
function setMode(mode){
  finishRename(true);closeQuick();stopPlay();S.mode=mode;S.hl=null;
  document.body.classList.toggle('mode-doc',mode==='doc');
  $$('#modes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===mode?'true':'false'));
  $('#main').classList.toggle('hidden',mode==='doc');
  $('#docview').classList.toggle('hidden',mode!=='doc');
  $('#left').style.display=mode==='sim'?'none':'';
  $('#main').style.gridTemplateColumns=mode==='sim'?'minmax(0,1fr) 300px':'';
  $('#edit-tools').classList.toggle('hidden',mode!=='edit');
  $('#sim-tools').classList.toggle('hidden',mode!=='sim');
  $('#simpanel').classList.toggle('hidden',mode!=='sim');
  if(mode==='sim'){startSim();const n=S.m.nodes[S.run.cur];setStatus(n?nodeName(n):'')}else{S.run=null;$('#g-sim').innerHTML='';renderInspector()}
  if(mode==='doc')renderDoc();
  renderTabs();refresh();
  requestAnimationFrame(()=>{if(mode!=='doc')fitView()});
}
function setLang(l,keep){
  LANG=LANGS.includes(l)?l:'pt';
  store.set('lang',LANG);
  document.documentElement.lang=HTML_LANG[LANG];
  $('#lang').value=LANG;
  if(!keep){const want=LANG==='pt'?'':'#'+LANG;if(location.hash!==want)history.replaceState(null,'',location.pathname+location.search+want)}
  exprCache.clear();stmtCache.clear();tplCache.clear();
  renderAll();
}
function applyStaticText(){
  document.title='Decision Tree Simulator';
  $$('[data-tx]').forEach(e=>{e.textContent=t(e.dataset.tx)});
  $$('[data-title]').forEach(e=>{e.title=t(e.dataset.title)});
  $$('[data-aria]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.aria))});
  svg.setAttribute('aria-label',t('canvasAria'));
  if(S.mode==='sim')updateSimButtons();
}
function setTheme(x){document.documentElement.dataset.theme=x;store.set('theme',x)}
function typing(e){const g=e.target;return g&&(g.tagName==='INPUT'||g.tagName==='TEXTAREA'||g.tagName==='SELECT'||g.isContentEditable)}
function navKey(k){
  const m=S.m;
  if(!S.sel||!m.nodes[S.sel]){if(m.root)select(m.root);return}
  const n=m.nodes[S.sel],LR=m.orient==='LR';
  const dir=LR?{ArrowLeft:'up',ArrowRight:'down',ArrowUp:'prev',ArrowDown:'next'}[k]:{ArrowUp:'up',ArrowDown:'down',ArrowLeft:'prev',ArrowRight:'next'}[k];
  let to=null;
  if(dir==='up')to=n.parent;
  else if(dir==='down'){if(n.collapsed&&n.kids.length){n.collapsed=false;commit()}to=n.kids[0]}
  else if(n.parent){const s=m.nodes[n.parent].kids,i=s.indexOf(S.sel);to=s[i+(dir==='prev'?-1:1)]}
  if(to){select(to);ensureVisible(to)}
}
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.key==='Escape'){if($('#quick')){closeQuick();svg.focus({preventScroll:true})}return}
  const ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&e.key.toLowerCase()==='s'){e.preventDefault();saveJson();return}
  if(typing(e))return;
  const onCanvas=e.target===svg||e.target===document.body;
  if(S.mode==='sim'){
    if(ctrl||e.altKey)return;
    const k=e.key.toLowerCase();
    if(k==='n'||(k==='arrowright'&&onCanvas)){e.preventDefault();if(!$('#b-step').disabled)simStep();return}
    if(k==='b'||(k==='arrowleft'&&onCanvas)){e.preventDefault();simBack();return}
    if(k==='r'&&!ctrl){e.preventDefault();simRestart();return}
    if(e.key===' '&&onCanvas){e.preventDefault();if(!$('#b-play').disabled)$('#b-play').click();return}
    if(/^[1-9]$/.test(e.key)&&S.run&&S.run.status==='ask'){
      const n=S.m.nodes[S.run.cur],id=n.kids[Number(e.key)-1];
      if(id){e.preventDefault();simStep(id)}
    }
    return;
  }
  if(S.mode!=='edit')return;
  if(ctrl&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(ctrl&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(!onCanvas)return;
  if(ctrl&&e.key.toLowerCase()==='c'&&S.sel){e.preventDefault();copyNode(S.sel);return}
  if(ctrl&&e.key.toLowerCase()==='x'&&S.sel){e.preventDefault();copyNode(S.sel);deleteNode(S.sel);return}
  if(ctrl&&e.key.toLowerCase()==='v'){e.preventDefault();pasteUnder(S.sel||null);return}
  if(ctrl&&e.key.toLowerCase()==='d'&&S.sel){e.preventDefault();const p=S.m.nodes[S.sel].parent;const c=S.clip;S.clip=copyOf(S.m,S.sel);pasteUnder(p);S.clip=c;return}
  if(e.key.startsWith('Arrow')){e.preventDefault();if(e.altKey&&S.sel){const LR=S.m.orient==='LR';if((LR&&e.key==='ArrowUp')||(!LR&&e.key==='ArrowLeft'))moveSibling(S.sel,-1);else if((LR&&e.key==='ArrowDown')||(!LR&&e.key==='ArrowRight'))moveSibling(S.sel,1);return}navKey(e.key);return}
  if(e.key==='Delete'&&S.sel){e.preventDefault();deleteNode(S.sel);return}
  if((e.key==='F2'||e.key==='Enter')&&S.sel){e.preventDefault();startRename(S.sel,'text');return}
  if(e.key==='+'||e.key==='='){const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.2);return}
  if(e.key==='-'){const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.2);return}
  if(ctrl||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='f'){fitView();return}
  if(k===' '&&S.sel){e.preventDefault();const n=S.m.nodes[S.sel];if(n.kids.length){n.collapsed=!n.collapsed;commit()}return}
  if(!S.sel&&!S.m.root){const ty={d:'decision',c:'chance',r:'rule',o:'outcome'}[k];if(ty){e.preventDefault();addChildOf(null,ty)}return}
  if(!S.sel)return;
  const ty={d:'decision',c:'chance',r:'rule',o:'outcome'}[k];
  if(ty){e.preventDefault();addChildOf(S.sel,ty);return}
  if(k==='s'){e.preventDefault();const p=S.m.nodes[S.sel].parent;if(p)addChildOf(p,S.m.nodes[S.sel].type);return}
});

  modal({title:t('help'),wide:true,body:h('div',{html:HELP[LANG]})});
}

$$('#modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$('#b-file').addEventListener('click',fileMenu);
$('#b-layout').addEventListener('click',layoutMenu);
$('#b-undo').addEventListener('click',undo);
$('#b-redo').addEventListener('click',redo);

$('#lang').addEventListener('change',e=>setLang(e.target.value));

$('#z-out').addEventListener('click',()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.2)});
$('#z-fit').addEventListener('click',fitView);
$('#z-values').addEventListener('change',e=>{S.overlay=e.target.checked;renderCanvas();if(S.mode==='sim')renderNow()});
$('#b-play').addEventListener('click',()=>{
  if(S.playing){stopPlay();return}
  S.playing=true;updateSimButtons();playLoop();
});
$('#b-step').addEventListener('click',()=>simStep());
$('#b-back').addEventListener('click',simBack);
$('#b-reset').addEventListener('click',simRestart);
$('#speed').addEventListener('change',e=>{S.speed=Number(e.target.value)||1});
window.addEventListener('hashchange',()=>{const l=location.hash.slice(1);if(LANGS.includes(l)||!l)setLang(l||'pt',true)});
window.addEventListener('pagehide',()=>{clearTimeout(saveT);if(S.m)store.set('model',S.m)});
window.addEventListener('resize',()=>{if(S.mode!=='doc')applyView()});
{
  const grip=$('#simgrip');let sy=0,sh=0,on=false;
  grip.addEventListener('pointerdown',e=>{on=true;sy=e.clientY;sh=$('#simpanel').offsetHeight;grip.setPointerCapture(e.pointerId)});
  grip.addEventListener('pointermove',e=>{if(on)$('#simpanel').style.height=Math.max(90,Math.min(window.innerHeight*.75,sh+sy-e.clientY))+'px'});
  grip.addEventListener('pointerup',()=>{on=false});
}
(function boot(){
  const hashLang=location.hash.slice(1);
  const nav=(navigator.language||'pt').slice(0,2).toLowerCase();
  LANG=LANGS.includes(hashLang)?hashLang:(store.get('lang')||(LANGS.includes(nav)?nav:'pt'));
  document.documentElement.lang=HTML_LANG[LANG];$('#lang').value=LANG;
  setTheme(store.get('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  let m=null;
  try{const saved=store.get('model');if(saved)m=loadModel(saved)}catch{}
  S.m=m||newModel();
  if(S.m.auto)relayout();
  record();
  applyStaticText();renderPalette();renderEmptyButtons();
  setMode('edit');
})();
</script>
