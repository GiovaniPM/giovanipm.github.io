<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planejador 5W3H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calma, paciente, como um amigo que ajuda a planejar
   IDEA: uma ficha de planejamento que se preenche pergunta por pergunta
   PICTURE: o próprio assistente — trilha de 8 passos + cartão da pergunta
   COLOUR and TYPE: gelo #dff1f7, tinta #06222e, rosa #ff2e7e; Space Grotesk + Inter
   LAYOUT: trilha à esquerda, cartão grande ao centro; empilha no celular */
:root{color-scheme:light dark;
--bg:light-dark(#dff1f7,#06222e);--card:light-dark(#ffffff,#0c3040);--ink:light-dark(#06222e,#e6f4f9);
--soft:light-dark(#4a6470,#9fbcc8);--line:light-dark(#b9dbe6,#1d4a5c);--acc:#ff2e7e;--accInk:#fff;
--ok:light-dark(#0b7a55,#5fd3a4);--warn:light-dark(#a3530b,#ffb45e);--tint:light-dark(#eef8fb,#0a2a38)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
header h1{font-size:clamp(28px,4vw,40px)}
header p{margin:.5em 0 0;color:var(--soft);max-width:62ch}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;margin-top:22px}
.rail{background:var(--card);border-radius:18px;padding:12px;align-self:start;position:sticky;top:12px}
.rail button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;min-height:48px;padding:6px 10px;border-radius:12px;cursor:pointer}
.rail button:hover{background:var(--tint)}
.rail button:focus-visible{outline:3px solid var(--acc)}
.rail button.on{background:var(--ink);color:var(--bg)}
.dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px "Space Grotesk";border:2px solid var(--line)}
.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.on .dot{border-color:var(--acc)}
.rail small{display:block;font-size:13px;opacity:.7}
.rail .lab{font-weight:600;line-height:1.2}
.card{background:var(--card);border-radius:22px;padding:clamp(18px,3vw,36px);box-shadow:0 18px 40px -28px #06222e88}
.meter{height:8px;background:var(--tint);border-radius:9px;overflow:hidden;margin-bottom:18px}
.meter i{display:block;height:100%;background:var(--acc);transition:width .4s}
.tag{display:inline-block;font:600 13px "Space Grotesk";padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--soft)}
.card h2{font-size:clamp(28px,3.6vw,44px);margin:10px 0 8px}
.lead{font-size:17px;max-width:62ch;margin:0 0 14px}
.why{background:var(--tint);border-radius:14px;padding:12px 16px;margin:0 0 18px;font-size:15px;color:var(--soft)}
.why b{color:var(--ink)}
label.big{display:block;font-weight:600;margin-bottom:6px}
textarea,input{width:100%;font:16px/1.5 Inter,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{all:unset;cursor:pointer;font-size:14px;padding:8px 12px;min-height:28px;border-radius:99px;border:1.5px dashed var(--line);color:var(--soft)}
.chip:hover,.chip:focus-visible{border-color:var(--acc);color:var(--ink)}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:4px;font-size:15px}
.checks li::before{content:"○ ";color:var(--warn);font-weight:700}
.checks li.ok::before{content:"✓ ";color:var(--ok)}
.btn{font:600 16px Inter,sans-serif;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.help{border-style:dashed}
.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.row .sp{flex:1}
.helper{margin-top:16px;border:2px solid var(--acc);border-radius:16px;padding:16px;display:none}
.helper.open{display:block}
.helper h3{font-size:20px;margin-bottom:4px}
.helper p{margin:0 0 12px;color:var(--soft);font-size:15px}
.helper .f{margin-bottom:12px}
.helper .f label{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
.preview{background:var(--tint);border-radius:12px;padding:10px 14px;font-size:15px;min-height:44px}
.sum{display:grid;gap:12px;margin-top:8px}
.sum .it{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sum .k b{font-family:"Space Grotesk";display:block}
.sum .k small{color:var(--soft)}
.sum .v{white-space:pre-wrap}
.empty{color:var(--warn);font-style:italic}
.story{font-size:18px;background:var(--tint);border-radius:16px;padding:16px 20px;margin:6px 0 10px}
.plans{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--soft);margin-top:8px}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.rail{position:static;display:flex;overflow-x:auto;gap:4px;scroll-snap-type:x mandatory}.rail button{flex:none;width:auto;scroll-snap-align:start}.rail small{display:none}}
@media(max-width:600px){.sum .it{grid-template-columns:minmax(0,1fr);gap:2px}.row .sp{display:none}.row .btn{flex:1 1 140px}}
@media(prefers-reduced-motion:reduce){.meter i,.toast{transition:none}}
</style>
</head>
<body>
<div class="band"><div class="wrap">
<header>
<h1>Planejador 5W3H</h1>
<p>Responda 8 perguntas simples, uma de cada vez, e transforme uma ideia em um plano claro. Se travar em alguma, toque em <b>“Me ajude a responder”</b>. Quer ir mais rápido? Use <b>“Montar com IA”</b> para criar o plano a partir dos seus e-mails, do SharePoint e do Teams.</p>
</header>
<div class="app">
<nav class="rail" id="rail" aria-label="Etapas"></nav>
<main class="card" id="card" aria-live="polite"></main>
</div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const S=[
{k:'what',en:'What',pt:'O quê?',q:'O que vai ser feito?',
 lead:'Escreva a ação principal em uma frase curta. Comece com um verbo: organizar, comprar, consertar, aprender, economizar…',
 why:'É o coração do plano. Se o “o quê” não estiver claro, todo o resto fica confuso.',
 ph:'Ex.: Organizar o armário da cozinha',
 ex:['Pintar o quarto das crianças','Juntar dinheiro para uma viagem','Começar a caminhar 3 vezes por semana'],
 help:[{l:'Qual problema ou desejo você tem hoje?',ph:'a cozinha vive bagunçada e perco tempo procurando as coisas'},{l:'Que ação concreta vai resolver isso?',ph:'organizar o armário da cozinha'}],
 make:v=>v[1]?cap(v[1])+(v[0]?'\n(Situação atual: '+v[0]+')':''):'',
 chk:t=>[[t.trim().length>=10,'Tem pelo menos uma frase curta'],[/^\s*\S+(ar|er|ir|or)\b/i.test(t),'Começa com uma ação (verbo terminado em -ar, -er, -ir)']]},
{k:'why',en:'Why',pt:'Por quê?',q:'Por que isso precisa ser feito?',
 lead:'Conte o motivo. Pense no benefício que vai ganhar e no que acontece se nada for feito.',
 why:'O motivo dá energia para continuar quando ficar difícil, e ajuda a convencer outras pessoas.',
 ph:'Ex.: Para ganhar tempo ao cozinhar e parar de comprar coisas repetidas',
 ex:['Para ter mais saúde e disposição','Para não pagar juros no fim do ano','Para as crianças terem um quarto mais alegre'],
 help:[{l:'O que vai melhorar quando estiver pronto?',ph:'vou achar tudo rápido'},{l:'E se você não fizer nada, o que acontece?',ph:'continuo perdendo tempo e comprando repetido'}],
 make:v=>[v[0]&&'Porque '+v[0]+'.',v[1]&&'Se nada for feito, '+v[1]+'.'].filter(Boolean).join(' '),
 chk:t=>[[t.trim().length>=10,'Explica um motivo'],[/(porque|para|pois|evitar|melhorar|se n[aã]o)/i.test(t),'Mostra um benefício ou consequência']]},
{k:'who',en:'Who',pt:'Quem?',q:'Quem vai fazer?',
 lead:'Diga o nome de quem é o responsável principal e, se houver, quem vai ajudar.',
 why:'Quando “todo mundo” é responsável, ninguém é. Um nome claro evita que a tarefa fique esquecida.',
 ph:'Ex.: Responsável: Ana. Ajuda: Pedro, no sábado',
 ex:['Responsável: eu mesmo','Responsável: Maria. Apoio: o síndico','Responsável: João. Ajuda: os filhos'],
 help:[{l:'Quem é o responsável principal? (um nome só)',ph:'Ana'},{l:'Quem pode ajudar? (opcional)',ph:'Pedro e a vizinha'}],
 make:v=>[v[0]&&'Responsável: '+v[0]+'.',v[1]&&'Ajuda: '+v[1]+'.'].filter(Boolean).join(' '),
 chk:t=>[[t.trim().length>=2,'Tem pelo menos um nome'],[!/\b(todos|todo mundo|a gente|algu[eé]m)\b/i.test(t),'Evita respostas vagas como “todos” ou “alguém”']]},
{k:'where',en:'Where',pt:'Onde?',q:'Onde vai acontecer?',
 lead:'Pode ser um lugar físico (casa, escola, loja) ou online (site, aplicativo, WhatsApp).',
 why:'Saber o lugar ajuda a prever o que levar, como chegar e o que preparar.',
 ph:'Ex.: Na cozinha de casa',
 ex:['Em casa, na sala','No parque perto de casa','Online, pelo aplicativo do banco'],
 help:[{l:'É em um lugar físico ou online?',ph:'físico'},{l:'Qual lugar, exatamente?',ph:'na cozinha de casa'}],
 make:v=>v[1]?cap(v[1])+(v[0]&&/online/i.test(v[0])?' (online)':''):'',
 chk:t=>[[t.trim().length>=3,'Indica um lugar']]},
{k:'when',en:'When',pt:'Quando?',q:'Quando vai começar e terminar?',
 lead:'Coloque datas. Se for algo que se repete, diga com que frequência (ex.: toda segunda).',
 why:'Sem prazo, a tarefa fica para “depois” para sempre. Uma data transforma vontade em compromisso.',
 ph:'Ex.: Começa no sábado 05/12 e termina no domingo 06/12',
 ex:['Começa hoje e termina em 30 dias','Toda segunda, quarta e sexta, às 7h','Até o dia 20 do mês que vem'],
 help:[{l:'Data de início',type:'date'},{l:'Data de término',type:'date'},{l:'Repete? Com que frequência? (opcional)',ph:'todo sábado de manhã'}],
 make:v=>[v[0]&&'Início: '+br(v[0]),v[1]&&'Término: '+br(v[1]),v[2]&&'Frequência: '+v[2]].filter(Boolean).join('\n'),
 chk:t=>[[/\d/.test(t)||/(segunda|terça|quarta|quinta|sexta|s[aá]bado|domingo|hoje|amanh[aã])/i.test(t),'Tem uma data, dia ou número'],[/(at[eé]|t[eé]rmin|prazo|dias|semana|m[eê]s|toda|todo)/i.test(t),'Diz quando termina ou com que frequência']]},
{k:'how',en:'How',pt:'Como?',q:'Como vai ser feito?',
 lead:'Liste os passos em ordem. Pense: o que faço primeiro, depois e por último?',
 why:'Dividir em passos pequenos torna qualquer tarefa menos assustadora e mais fácil de começar.',
 ph:'Ex.: 1. Tirar tudo do armário  2. Jogar fora o vencido  3. Guardar por tipo',
 ex:['1. Pesquisar preços  2. Comprar  3. Instalar','1. Separar 10% do salário  2. Guardar na poupança','1. Alongar  2. Caminhar 30 min  3. Anotar'],
 help:[{l:'Primeiro passo',ph:'tirar tudo do armário'},{l:'Segundo passo',ph:'jogar fora o que venceu'},{l:'Terceiro passo',ph:'guardar separado por tipo'},{l:'Mais algum? (opcional)',ph:'colocar etiquetas'}],
 make:v=>v.filter(Boolean).map((s,i)=>(i+1)+'. '+cap(s)).join('\n'),
 chk:t=>[[t.trim().length>=10,'Descreve como fazer'],[(t.match(/(\d+\.|\n|;|,|depois|então)/g)||[]).length>=2,'Tem pelo menos 2 passos']]},
{k:'much',en:'How much',pt:'Quanto custa?',q:'Quanto vai custar?',
 lead:'Pense em dinheiro e também em tempo. Se não custar nada, escreva “sem custo”.',
 why:'Saber o custo antes evita surpresas e ajuda a decidir se dá para fazer agora.',
 ph:'Ex.: R$ 60 em potes organizadores e cerca de 4 horas de trabalho',
 ex:['Sem custo em dinheiro, só 30 min por dia','R$ 300 por mês','R$ 150 de tinta + 1 fim de semana'],
 help:[{l:'Quanto em dinheiro? (R$)',ph:'60',type:'number'},{l:'Com o quê? (opcional)',ph:'potes organizadores'},{l:'Quanto tempo vai levar?',ph:'4 horas'}],
 make:v=>[v[0]!==''?(Number(v[0])>0?'R$ '+Number(v[0]).toLocaleString('pt-BR',{minimumFractionDigits:2})+(v[1]?' em '+v[1]:''):'Sem custo em dinheiro'):'',v[2]&&'Tempo: '+v[2]].filter(Boolean).join('\n'),
 chk:t=>[[/\d/.test(t)||/sem custo|gr[aá]tis|nada/i.test(t),'Tem um valor ou diz “sem custo”'],[/(hora|min|dia|semana|tempo|m[eê]s)/i.test(t),'Fala do tempo necessário']]},
{k:'measure',en:'How to measure',pt:'Como medir?',q:'Como você vai saber que deu certo?',
 lead:'Escolha algo que dá para contar ou ver. Um número ajuda muito: quantos, quanto, com que frequência.',
 why:'Sem uma forma de medir, fica difícil saber se o plano funcionou ou se é preciso mudar algo.',
 ph:'Ex.: Achar qualquer item em menos de 1 minuto, verificado no fim de cada semana',
 ex:['Ter R$ 3.000 guardados até dezembro','Caminhar pelo menos 12 vezes no mês','Nenhuma compra repetida no mês'],
 help:[{l:'O que vai mostrar que deu certo?',ph:'acho tudo rápido'},{l:'Qual é a meta em número?',ph:'menos de 1 minuto para achar qualquer item'},{l:'Quando e como vai conferir?',ph:'todo domingo, faço um teste'}],
 make:v=>[v[0]&&'Sinal de sucesso: '+v[0],v[1]&&'Meta: '+v[1],v[2]&&'Conferência: '+v[2]].filter(Boolean).join('\n'),
 chk:t=>[[/\d/.test(t),'Tem um número ou meta'],[/(todo|toda|semana|m[eê]s|dia|final|fim|conferir|verificar|anotar)/i.test(t),'Diz quando vai conferir']]}
];
const SAMPLE={what:'Organizar o armário da cozinha',why:'Porque perco tempo procurando as coisas. Se nada for feito, continuo comprando itens repetidos.',who:'Responsável: Ana. Ajuda: Pedro.',where:'Na cozinha de casa',when:'Início: sábado, 05/12\nTérmino: domingo, 06/12',how:'1. Tirar tudo do armário\n2. Jogar fora o que venceu\n3. Guardar separado por tipo\n4. Colocar etiquetas',much:'R$ 60,00 em potes organizadores\nTempo: cerca de 4 horas',measure:'Sinal de sucesso: acho tudo rápido\nMeta: menos de 1 minuto para achar qualquer item\nConferência: todo domingo, durante um mês'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cap(s){s=String(s).trim();return s.charAt(0).toUpperCase()+s.slice(1)}
function br(d){const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y}
const KEY='plan5w3h.v1';
let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!st||!Array.isArray(st.plans)||!st.plans.length)st={plans:[{a:{}}],cur:0,step:0};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const P=()=>st.plans[st.cur];
const filled=k=>!!(P().a[k]||'').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

function rail(){
 $('#rail').innerHTML=S.map((s,i)=>`<button data-go="${i}" class="${i===st.step?'on':''} ${filled(s.k)?'done':''}" aria-current="${i===st.step?'step':'false'}"><span class="dot">${filled(s.k)?'✓':i+1}</span><span><span class="lab">${s.pt}</span><small>${s.en}</small></span></button>`).join('')
 +`<button data-go="8" class="${st.step===8?'on':''}"><span class="dot">★</span><span><span class="lab">Meu plano</span><small>Resumo final</small></span></button>`
 +`<button data-go="9" class="${st.step===9?'on':''}"><span class="dot">IA</span><span><span class="lab">Montar com IA</span><small>E-mails, SharePoint, Teams</small></span></button>`;
}
const AI_F=[
 {id:'tema',l:'Sobre qual assunto é o plano?',ph:'Ex.: mudança do escritório para o novo prédio',req:1},
 {id:'periodo',l:'De qual período devo olhar as mensagens?',ph:'Ex.: últimos 30 dias'},
 {id:'pessoas',l:'Pessoas envolvidas (opcional)',ph:'Ex.: Ana Souza, equipe de Facilities'},
 {id:'locais',l:'Onde procurar com prioridade? (opcional)',ph:'Ex.: site “Projetos 2026” no SharePoint, canal “Mudança” no Teams'}
];
function buildPrompt(){
 const f=st.ai||{},t=(f.tema||'').trim()||'[ESCREVA O ASSUNTO AQUI]';
 return `Você é um assistente de planejamento. Monte um plano de ação usando o método 5W3H sobre o assunto: "${t}".

FONTES (use como subsídio):
- Meus e-mails do Outlook
- Arquivos e páginas do SharePoint e do OneDrive
- Conversas, canais, chats e reuniões (transcrições e anotações) do Microsoft Teams
Considere o período: ${(f.periodo||'').trim()||'últimos 30 dias'}.${(f.pessoas||'').trim()?`
Dê prioridade ao que envolve: ${f.pessoas.trim()}.`:''}${(f.locais||'').trim()?`
Procure primeiro em: ${f.locais.trim()}.`:''}

COMO PREENCHER CADA ITEM:
- what (O quê?): a ação principal, em uma frase que começa com verbo.
- why (Por quê?): o motivo, o benefício e o que acontece se nada for feito.
- who (Quem?): UM responsável principal com nome, e quem vai ajudar.
- where (Onde?): local físico ou online.
- when (Quando?): data de início e de término (dd/mm/aaaa) ou a frequência.
- how (Como?): passos numerados, em ordem (1., 2., 3.…).
- much (Quanto custa?): valor em R$ e tempo necessário. Se não houver custo, escreva "Sem custo em dinheiro".
- measure (Como medir?): como saber que deu certo, com pelo menos uma meta em número e quando conferir.

REGRAS:
1. Use somente o que estiver nas fontes. Não invente nomes, datas nem valores.
2. Se não encontrar uma informação, escreva "A CONFIRMAR" no item e explique o que falta em "pendencias".
3. Se as fontes se contradizem, use a mais recente e registre o conflito em "pendencias".
4. Escreva em linguagem simples, para quem não conhece o método.
5. Em "fontes", liste cada fonte usada: tipo (e-mail, SharePoint ou Teams), título ou assunto, e data.

Responda APENAS com o JSON abaixo, preenchido, sem nenhum texto antes ou depois:
{"what":"","why":"","who":"","where":"","when":"","how":"","much":"","measure":"","fontes":"","pendencias":""}`;
}
function ai(){
 const f=st.ai||{};
 $('#card').innerHTML=`
 <span class="tag">Atalho com inteligência artificial</span>
 <h2>Montar o plano com IA</h2>
 <p class="lead">Uma IA com acesso ao seu Microsoft 365 pode ler seus e-mails, arquivos do SharePoint e conversas do Teams e montar o plano para você.</p>
 <p class="why"><b>Como funciona, em 3 passos:</b><br>1. Preencha os campos abaixo. O pedido (prompt) é montado sozinho.<br>2. Copie o pedido e cole numa IA conectada ao seu Microsoft 365, como o Microsoft 365 Copilot Chat.<br>3. Copie a resposta da IA, cole no passo 3 e toque em “Importar”.</p>
 <h3 style="font-size:20px;margin:6px 0 10px">Passo 1 · Conte um pouco sobre o plano</h3>
 ${AI_F.map(x=>`<div class="f" style="margin-bottom:12px"><label class="big" for="ai_${x.id}">${x.l}</label><input id="ai_${x.id}" data-ai="${x.id}" placeholder="${esc(x.ph)}" value="${esc(f[x.id]||'')}"></div>`).join('')}
 <h3 style="font-size:20px;margin:22px 0 10px">Passo 2 · Copie o pedido</h3>
 <textarea id="prompt" readonly style="min-height:260px;font-size:14px">${esc(buildPrompt())}</textarea>
 <div class="row" style="margin-top:10px"><button class="btn pri" id="copyPrompt">Copiar pedido</button></div>
 <p class="note">A IA só vê o que você já tem permissão para ver. Confira sempre a resposta antes de usar o plano.</p>
 <h3 style="font-size:20px;margin:22px 0 10px">Passo 3 · Cole a resposta da IA</h3>
 <textarea id="aiIn" placeholder='Cole aqui a resposta, que começa com { "what": ...'></textarea>
 <div class="row" style="margin-top:10px"><button class="btn pri" id="importAI">Importar para um novo plano</button></div>
 <p class="note" id="aiMsg"></p>`;
}
function parseAI(t){
 const m=t.match(/\{[\s\S]*\}/);if(!m)return null;
 let o;try{o=JSON.parse(m[0])}catch(e){try{o=JSON.parse(m[0].replace(/[“”]/g,'"').replace(/,\s*}/g,'}'))}catch(e2){return null}}
 const norm=v=>Array.isArray(v)?v.map(x=>typeof x==='object'?Object.values(x).join(' — '):x).join('\n'):(v&&typeof v==='object'?Object.entries(v).map(([k,x])=>k+': '+x).join('\n'):String(v??''));
 const a={};[...S.map(s=>s.k),'fontes','pendencias'].forEach(k=>{if(o[k]!=null)a[k]=norm(o[k]).trim()});
 return S.some(s=>a[s.k])?a:null;
}
function render(){
 rail();save();
 if(st.step===8)return summary();
 if(st.step===9)return ai();
 const s=S[st.step],v=P().a[s.k]||'',n=S.filter(x=>filled(x.k)).length;
 $('#card').innerHTML=`
 <div class="meter" aria-hidden="true"><i style="width:${n/8*100}%"></i></div>
 <span class="tag">Pergunta ${st.step+1} de 8 · ${s.en}</span>
 <h2>${s.q}</h2>
 <p class="lead">${s.lead}</p>
 <p class="why"><b>Por que isso importa?</b> ${s.why}</p>
 <label class="big" for="ans">Sua resposta</label>
 <textarea id="ans" placeholder="${esc(s.ph)}">${esc(v)}</textarea>
 <div class="chips" aria-label="Exemplos">${s.ex.map(e=>`<button class="chip" data-ex="${esc(e)}">Exemplo: ${esc(e)}</button>`).join('')}</div>
 <ul class="checks" id="checks"></ul>
 <div class="row"><button class="btn help" id="openHelp" aria-expanded="false">💬 Me ajude a responder</button></div>
 <div class="helper" id="helper">
  <h3>Vamos responder juntos</h3>
  <p>Preencha o que souber. Eu monto a resposta para você.</p>
  ${s.help.map((h,i)=>`<div class="f"><label for="h${i}">${h.l}</label><input id="h${i}" type="${h.type||'text'}" placeholder="${esc(h.ph||'')}"></div>`).join('')}
  <div class="preview" id="prev">Sua resposta vai aparecer aqui…</div>
  <div class="row"><button class="btn pri" id="useHelp">Usar esta resposta</button></div>
 </div>
 <div class="row">
  <button class="btn" id="back" ${st.step===0?'disabled':''}>← Voltar</button><span class="sp"></span>
  <button class="btn" id="skip">Pular por enquanto</button>
  <button class="btn pri" id="next">${st.step===7?'Ver meu plano →':'Próxima →'}</button>
 </div>
 ${st.step===0&&!n?'<p class="note">Primeira vez? <button class="chip" id="sample">Ver um plano de exemplo preenchido</button> <button class="chip" data-go="9">Montar automaticamente com IA</button></p>':''}`;
 checks();
}
function checks(){
 const s=S[st.step],t=$('#ans').value;
 $('#checks').innerHTML=t.trim()?s.chk(t).map(([ok,m])=>`<li class="${ok?'ok':''}">${m}</li>`).join(''):'<li>Escreva algo — não precisa ser perfeito, dá para mudar depois.</li>';
}
function helperVals(){return S[st.step].help.map((h,i)=>($('#h'+i).value||'').trim())}
function summary(){
 const a=P().a,n=S.filter(x=>filled(x.k)).length,g=k=>esc((a[k]||'').trim());
 const one=n===8?`<div class="story"><b>${g('what')}</b>. ${g('why')} ${g('who')} Local: ${g('where')}. Prazo: ${g('when').replace(/\n/g,'; ')}.</div>`:'';
 $('#card').innerHTML=`
 <div class="meter" aria-hidden="true"><i style="width:${n/8*100}%"></i></div>
 <span class="tag">${n} de 8 respondidas</span>
 <h2>${n===8?'Seu plano está pronto!':'Seu plano até agora'}</h2>
 <p class="lead">${n===8?'Confira tudo abaixo. Você pode copiar e colar no WhatsApp, e-mail ou numa planilha.':'Faltam algumas respostas (marcadas em laranja). Toque nelas para completar.'}</p>
 ${one}
 <div class="sum">${S.map((s,i)=>`<div class="it"><div class="k"><b>${s.pt}</b><small>${s.en}</small></div><div class="v">${filled(s.k)?(/A CONFIRMAR/i.test(a[s.k])?`<span style="color:var(--warn)">${g(s.k)}</span>`:g(s.k)):`<button class="chip empty" data-go="${i}">Ainda sem resposta — responder agora</button>`}</div></div>`).join('')}
 ${a.pendencias?`<div class="it"><div class="k"><b>A confirmar</b><small>Apontado pela IA</small></div><div class="v" style="color:var(--warn)">${g('pendencias')}</div></div>`:''}
 ${a.fontes?`<div class="it"><div class="k"><b>Fontes</b><small>E-mails, SharePoint, Teams</small></div><div class="v">${g('fontes')}</div></div>`:''}</div>
 <div class="row">
  <button class="btn pri" id="copyTxt">Copiar como texto</button>
  <button class="btn" id="copyTab">Copiar para planilha</button>
  <button class="btn" id="edit">Editar respostas</button>
 </div>
 <h3 style="margin-top:28px;font-size:20px">Seus planos</h3>
 <div class="plans">${st.plans.map((p,i)=>`<button class="chip" data-plan="${i}" ${i===st.cur?'style="border-style:solid;border-color:var(--acc);color:var(--ink)"':''}>${esc((p.a.what||'Plano sem nome').slice(0,40))}</button>`).join('')}
 <button class="chip" id="newPlan">+ Novo plano</button>${st.plans.length>1?'<button class="chip" id="delPlan">Apagar este plano</button>':''}</div>
 <p class="note" id="confirm"></p>
 <p class="note">Seus planos ficam guardados apenas neste navegador.</p>`;
}
const asText=()=>S.map(s=>`${s.pt.toUpperCase()} (${s.en})\n${(P().a[s.k]||'—').trim()}`).join('\n\n')+(P().a.pendencias?`\n\nA CONFIRMAR\n${P().a.pendencias}`:'')+(P().a.fontes?`\n\nFONTES\n${P().a.fontes}`:'');
const asTab=()=>S.map(s=>s.pt).join('\t')+'\n'+S.map(s=>'"'+(P().a[s.k]||'').replace(/"/g,'""')+'"').join('\t');
async function copy(t,m){try{await navigator.clipboard.writeText(t);toast(m)}catch(e){toast('Não consegui copiar. Selecione o texto e copie manualmente.')}}

document.addEventListener('input',e=>{
 if(e.target.dataset.ai){st.ai=st.ai||{};st.ai[e.target.dataset.ai]=e.target.value;$('#prompt').value=buildPrompt();save();return}
 if(e.target.id==='ans'){P().a[S[st.step].k]=e.target.value;checks();save();rail()}
 else if(/^h\d/.test(e.target.id)){const r=S[st.step].make(helperVals());$('#prev').textContent=r||'Sua resposta vai aparecer aqui…'}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.go){st.step=+b.dataset.go;render();$('#card').scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.ex){const t=$('#ans');t.value=b.dataset.ex;t.dispatchEvent(new Event('input',{bubbles:true}));t.focus();toast('Exemplo colocado. Agora adapte para o seu caso!');return}
 if(b.dataset.plan){st.cur=+b.dataset.plan;render();return}
 switch(b.id){
  case 'next':st.step=Math.min(8,st.step+1);render();break;
  case 'skip':st.step=Math.min(8,st.step+1);render();break;
  case 'back':st.step=Math.max(0,st.step-1);render();break;
  case 'openHelp':{const h=$('#helper'),o=h.classList.toggle('open');b.setAttribute('aria-expanded',o);if(o)$('#h0').focus();break}
  case 'useHelp':{const r=S[st.step].make(helperVals());if(!r){toast('Preencha pelo menos um campo acima.');break}const t=$('#ans');t.value=r;t.dispatchEvent(new Event('input',{bubbles:true}));$('#helper').classList.remove('open');toast('Pronto! Resposta colocada. Ajuste se quiser.');break}
  case 'sample':P().a={...SAMPLE};st.step=8;render();toast('Este é um plano de exemplo. Crie o seu com “+ Novo plano”.');break;
  case 'copyPrompt':if(!((st.ai||{}).tema||'').trim()){toast('Antes, escreva o assunto do plano no passo 1.');$('#ai_tema').focus();break}copy(buildPrompt(),'Pedido copiado! Cole na IA do seu Microsoft 365.');break;
  case 'importAI':{const a=parseAI($('#aiIn').value);if(!a){$('#aiMsg').textContent='Não reconheci a resposta. Confira se você copiou tudo, do “{” até o “}”, ou peça à IA: “responda só com o JSON”.';break}
   const cur=P().a,empty=!S.some(s=>(cur[s.k]||'').trim());if(empty)P().a=a;else{st.plans.push({a});st.cur=st.plans.length-1}
   st.step=8;render();toast('Plano importado! Revise os itens em laranja.');break}
  case 'copyTxt':copy(asText(),'Plano copiado! Cole onde quiser.');break;
  case 'copyTab':copy(asTab(),'Copiado! Cole na primeira célula da planilha.');break;
  case 'edit':st.step=0;render();break;
  case 'newPlan':st.plans.push({a:{}});st.cur=st.plans.length-1;st.step=0;render();break;
  case 'delPlan':$('#confirm').innerHTML='Apagar este plano? <button class="chip" id="delYes">Sim, apagar</button> <button class="chip" id="delNo">Não</button>';break;
  case 'delYes':st.plans.splice(st.cur,1);st.cur=0;render();toast('Plano apagado.');break;
  case 'delNo':$('#confirm').innerHTML='';break;
 }
});
render();
}
</script>
</body>
</html>
