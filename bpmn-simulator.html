function makeSim(){return new Sim({seed:SU.script?(+SU.script.seed||1):SU.seed,manual:SU.manual,fine:SU.stepMode,script:SU.script,maxCycle:10})}
function newRun(){
  stopPlay();cancelAnim();
  SU.sim=makeSim();SU.actions=[];SU.sim.newCase();SU.simT=0;
  drawSim();renderSimPanel();updateSimBar();refreshSide();
}
function replayTo(steps){
  /* volta um passo refazendo a execução: o motor é determinístico pela semente */
  const sim=makeSim();sim.newCase();
  let i=0;
  const apply=at=>{for(const a of SU.actions)if(a.at===at){if(a.type==='choose')sim.choose(a.tok,a.flows);if(a.type==='fire')sim.manualFire(a.sub);if(a.type==='case'){sim.done=false;sim.newCase()}}};
  apply(0);
  for(;i<steps&&!sim.done;i++){const r=sim.step();apply(sim.step_)}
  SU.sim=sim;SU.simT=sim.t;
}
function stepOnce(animated=true){
  const sim=SU.sim;if(!sim||sim.done)return null;
  const before=sim.t,r=sim.step();
  if(animated&&!matchMedia('(prefers-reduced-motion: reduce)').matches)return animateStep(r,before);
  SU.simT=sim.t;drawSim();renderSimPanel();updateSimBar();
  return Promise.resolve(r);
}
function animateStep(r,before){
  const speed=+$('#speed').value||1;
  return new Promise(res=>{
    const finish=()=>{SU.anim=null;SU.simT=SU.sim.t;drawSim();renderSimPanel();updateSimBar();res(r)};
    const moves=(r.moves||[]).filter(m=>m.kind==='flow'||m.kind==='msg');
    if(r.kind==='hop'&&moves.length){
      const dur=420/speed,t0=performance.now();
      drawSim(new Set(moves.filter(m=>m.tok).map(m=>m.tok)));
      const layer=$('#g-sim'),marks=moves.map(m=>{
        const e=byId(m.flow||m.edge),pts=visiblePath(e);if(!pts)return null;
        const tk=m.tok?SU.sim.tokens.get(m.tok):null;
        const c=s('circle',{r:m.kind==='msg'?5:6.5,class:'tok '+tokClass(tk)});
        layer.append(c);return{c,pts};
      }).filter(Boolean);
      const frame=now=>{
        const f=Math.min(1,(now-t0)/dur);
        for(const m of marks){const p=pointAt(m.pts,f);m.c.setAttribute('cx',p.x);m.c.setAttribute('cy',p.y)}
        if(f<1)SU.anim=requestAnimationFrame(frame);else finish();
      };
      SU.anim=requestAnimationFrame(frame);
    }else if(r.kind==='time'&&r.dt>0){
      const dur=Math.min(1600,Math.max(260,r.dt*60))/speed,t0=performance.now(),to=SU.sim.t;
      const frame=now=>{
        const f=Math.min(1,(now-t0)/dur);SU.simT=before+(to-before)*f;
        $('#clock').textContent='t = '+fmt(SU.simT,1);updateProgress();
        if(f<1)SU.anim=requestAnimationFrame(frame);else finish();
      };
      SU.anim=requestAnimationFrame(frame);
    }else finish();
  });
}
function cancelAnim(){if(SU.anim)cancelAnimationFrame(SU.anim);SU.anim=null}
async function play(){
  if(SU.playing){stopPlay();return}

  if(SU.sim.done)newRun();
  SU.playing=true;updateSimBar();

    const r=await stepOnce();

}

const tokClass=tk=>{if(!tk||!SU.sim)return'';const i=SU.sim.insts.get(tk.inst),c=i?(i.case-1)%5:0;return c?'tok'+(c+1):''};

function drawSim(hideToks){
  const g=$('#g-sim'),u=$('#g-sim-under');g.replaceChildren();u.replaceChildren();
  const sim=SU.sim;if(!sim)return;
  /* mapa de calor do lote */
  if(SU.batch&&SU.tab==='batch'){
    const max=Math.max(1,...SU.batch.flows.values());
    for(const[id,c]of SU.batch.flows){const pts=visiblePath(byId(id));if(pts)u.append(s('path',{class:'heat',d:pathD(pts),style:`stroke-width:${2+c/max*14}px`}));
      if(pts){const m=pointAt(pts,.5);g.append(s('text',{class:'f-count',x:m.x,y:m.y-7},String(c)))}}
    return;
  }
  if(SU.tab==='scen')drawCoverage(u);
  for(const[id,c]of sim.flowCount){const pts=visiblePath(byId(id));if(pts&&c){const m=pointAt(pts,.5);u.append(s('text',{class:'f-count',x:m.x+9,y:m.y+13},String(c)))}}
  const perNode=new Map();
  const bump=(id,k)=>{const a=anchorOf(id);if(!a)return;const r=perNode.get(a.id)||{active:0,queue:0,toks:0,join:0,wait:0,prog:null};r[k]++;perNode.set(a.id,r);return r};
  for(const tk of sim.tokens.values()){
    if(hideToks&&hideToks.has(tk.id))continue;
    if(tk.flow){
      const pts=visiblePath(byId(tk.flow));
      if(pts){const p=pts[pts.length-1];g.append(s('circle',{cx:p.x,cy:p.y,r:6.5,class:'tok '+tokClass(tk)}))}
      continue;
    }
    if(!tk.at)continue;
    if(tk.act){
      const n=byId(tk.at);
      for(const w of tk.act.workers){
        const r=bump(tk.at,w.state==='queue'?'queue':'active');
        if(r&&w.state==='work'&&w.dur>0&&n.kind!=='sub'&&!r.prog)r.prog=w;
      }
      if(!tk.act.workers.size)bump(tk.at,'active');
    }else if(tk.phase==='join')bump(tk.at,'join');
    else bump(tk.at,tk.phase==='event'||tk.phase==='decide'?'wait':'toks');
  }
  for(const[id,r]of perNode){
    const n=byId(id),c=center(n),pad=isEvent(n)||n.kind==='gateway'?5:3;

  }
  updateProgress();
  if(SU.stepMode&&SU.tab==='step')highlightStep(u);
  highlightDecisions(g);
  renderDecide();
}

/* sugestão: percorre os caminhos das decisões e fica com os que acrescentam cobertura */
function suggestScenarios(){
  const seen=new Set(),paths=[];let guard=0;
  const stack=[[]];
  while(stack.length&&guard++<80){
    const prefix=stack.pop(),sim=new Sim({seed:1,explore:true,prefix,noLog:true,maxTicks:30000,maxTokens:3000,maxCycle:2});
    sim.newCase();while(!sim.done)sim.step();
    if(!sim.limit)paths.push(sim);
    for(let i=prefix.length;i<sim.choices.length&&i<14;i++){
      for(let a=0;a<sim.choices[i].opts.length;a++){
        if(a===sim.choices[i].pick)continue;
        const next=[...sim.choices.slice(0,i).map(c=>c.pick),a],key=next.join();
        if(!seen.has(key)){seen.add(key);stack.push(next)}
      }
    }
  }
  const covered=new Set(),existing=new Set(scenList().map(sc=>JSON.stringify(sc.decisions)+JSON.stringify(sc.triggers)));
  for(const sc of scenList()){const r=SU.scenResults[sc.id];if(r){r.nodes.forEach(x=>covered.add(x));r.flows.forEach(x=>covered.add(x))}}
  const added=[];
  paths.sort((a,b)=>a.choices.length-b.choices.length);
  for(const p of paths){
    const ids=[...[...p.nodeStat].filter(([,x])=>x.count).map(([k])=>k),...[...p.flowCount.keys()]];
    if(!ids.some(x=>!covered.has(x)))continue;
    ids.forEach(x=>covered.add(x));
    const sc=newScenario();sc.decisions=p.taken;
    const key=JSON.stringify(sc.decisions)+JSON.stringify(sc.triggers);
    if(existing.has(key))continue;
    const labels=Object.values(p.taken).flat().filter(Boolean).map(v=>{const f=byId(v.split(',')[0]);return f?(f.name||nameOf(byId(f.tgt))):t('c_all')});
    sc.name=t('c_path',added.length+1,labels.join(', ')||t('c_mainPath'));
    fillExpectFrom(sc,p);
    added.push(sc);
  }
  /* evento de borda que nenhum caminho alcançou: um cenário em que ele ocorre */
  for(const b of triggerNodes().filter(n=>n.kind==='boundary'&&!covered.has(n.id)&&!hasDef(n,'cancel'))){
    if(new Sim({noLog:true}).hasInternalSource(b))continue;
    if(hasDef(b,'error')&&byId(b.attachedTo).kind==='sub')continue;
    const sc=newScenario();sc.triggers={[b.id]:{mode:'at',at:0}};sc.name=t('c_eventOccurs',nameOf(b));
    const sim=new Sim({seed:1,script:sc,noLog:true,maxTicks:30000,maxTokens:3000,maxCycle:2});sim.newCase();while(!sim.done)sim.step();
    fillExpectFrom(sc,sim);sc.expect.items.push({el:b.id,mode:'yes',times:1});
    for(const[id,x]of sim.nodeStat)if(x.count)covered.add(id);for(const id of sim.flowCount.keys())covered.add(id);
    added.push(sc);
  }
  /* evento que ocorreu por sorteio escondeu o caminho normal: um cenário em que ele não ocorre */
  for(const b of triggerNodes().filter(n=>n.kind==='boundary'&&covered.has(n.id)&&!hasDef(n,'cancel'))){
    if(new Sim({noLog:true}).hasInternalSource(b))continue;
    if(hasDef(b,'error')&&byId(b.attachedTo).kind==='sub')continue;
    const base=paths.find(p=>(p.nodeStat.get(b.id)||{}).count);
    if(!base)continue;
    const sc=newScenario();sc.decisions=base.taken;sc.triggers={[b.id]:{mode:'never',at:0}};sc.name=t('c_eventNot',nameOf(b));
    const sim=new Sim({seed:1,script:sc,noLog:true,maxTicks:30000,maxTokens:3000,maxCycle:2});sim.newCase();while(!sim.done)sim.step();
    const ids=[...[...sim.nodeStat].filter(([,x])=>x.count).map(([k])=>k),...sim.flowCount.keys()];
    if(!ids.some(x=>!covered.has(x)))continue;
    ids.forEach(x=>covered.add(x));
    fillExpectFrom(sc,sim);sc.expect.items.push({el:b.id,mode:'no',times:1});
    added.push(sc);
  }
  if(!added.length){toast(t('c_genNone'),'warn');return}
  scenList().push(...added);commit();
  toast(t('c_gen',added.length),'ok',8000);
  SU.tab='scen';runAllScenarios();
}
function fillExpectFrom(sc,sim){
  const c=[...sim.cases.values()][0];
  sc.expect.status='ok';
  sc.expect.items=[...new Set(c?c.ends:[])].filter(id=>byId(id)).map(id=>({el:id,mode:'yes',times:1}));

  else if(k==='dataObject'){fake.w=20;fake.h=27;fake.x=10;fake.y=1;fake.dataKind='object';add(...dataShape(fake))}
  else if(k==='dataStore'){fake.w=26;fake.h=26;fake.x=7;fake.y=1;add(...dataShape(fake))}
  else if(k==='annotation')add(s('path',{d:'M16 3H8V26H16',class:'b-line'}),s('path',{d:'M13 11H34M13 18H28',class:'b-thin'}));
  else if(k==='group')add(s('rect',{x:3,y:3,width:34,height:23,rx:5,class:'b-group',style:'stroke-dasharray:6 3 1.5 3'}));
  else if(k==='pool')add(s('rect',{x:1,y:4,width:38,height:20,class:'b-fill'}),s('path',{d:'M8 4V24',class:'b-line'}));
  else if(k==='lane')add(s('rect',{x:1,y:4,width:38,height:20,class:'b-thin'}),s('path',{d:'M8 4V24M8 14H39',class:'b-thin'}));
  return svg;
}
function buildPalette(){
  const box=$('#palette');
  box.replaceChildren(...PALETTE.map(([k,l])=>{
    const b=h('button',{class:'pal',title:t(l),'data-kind':k},palIcon(k),h('span',null,t(l)));
    b.style.setProperty('--b-fill','var(--panel)');
    b.addEventListener('pointerdown',ev=>{ev.preventDefault();beginPaletteDrag(ev,k)});
    b.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();placeCentered(k)}});
    return b;
  }));
}
function placeCentered(k){
  if(UI.mode!=='edit')return;
  const r=$('#svg').getBoundingClientRect(),v=UI.view;
  const cx=(r.width/2-v.x)/v.k,cy=(r.height/2-v.y)/v.k;
  /* evita empilhar elementos no mesmo ponto */
  let pt={x:cx,y:cy},g=0;
  while(g++<20&&planeNodes().some(n=>!isContainer(n)&&n.kind!=='lane'&&Math.abs(n.x+n.w/2-pt.x)<40&&Math.abs(n.y+n.h/2-pt.y)<40)){pt={x:pt.x+36,y:pt.y+36}}
  createAt(k,pt);
}
function beginPaletteDrag(ev,k){
  if(UI.mode!=='edit')return;
  let moved=false,ghost=null;
  const start={x:ev.clientX,y:ev.clientY},id=ev.pointerId;
  const move=e=>{
    if(e.pointerId!==id)return;
    if(!moved&&Math.hypot(e.clientX-start.x,e.clientY-start.y)<5)return;
    moved=true;
    if(!ghost){ghost=h('div',{style:'position:fixed;width:36px;height:28px;border:2px dashed var(--accent);border-radius:6px;pointer-events:none;z-index:99'});document.body.append(ghost)}
    ghost.style.left=e.clientX-18+'px';ghost.style.top=e.clientY-14+'px';
  };
  const up=e=>{
    if(e.pointerId!==id)return;
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);ghost?.remove();
    if(!moved){placeCentered(k);return}
    const r=$('#svg').getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)createAt(k,toWorld(e));
  };
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
}
function menuFor(btn,build){
  const wasOpen=!!btn.parentElement.querySelector('.menu-list');
  closeMenus();
  if(wasOpen)return;
  const m=h('div',{class:'menu-list',role:'menu'},build());
  btn.parentElement.append(m);
  /* o item fecha o menu depois do próprio clique; removê-lo antes faria o clique se perder */
  m.addEventListener('click',e=>{if(e.target.closest('button'))closeMenus()});
  const outside=e=>{if(!m.contains(e.target)&&!btn.contains(e.target))closeMenus()};
  const onKey=e=>{if(e.key==='Escape')closeMenus()};
  document.addEventListener('pointerdown',outside,true);
  document.addEventListener('keydown',onKey,true);
  menuCleanup=()=>{document.removeEventListener('pointerdown',outside,true);document.removeEventListener('keydown',onKey,true)};
}
let menuCleanup=null;
function closeMenus(){
  document.querySelectorAll('.menu-list').forEach(m=>m.remove());
  if(menuCleanup){menuCleanup();menuCleanup=null}
}
const mi=(label,fn,disabled)=>h('button',{role:'menuitem',disabled,onclick:fn},label);
function fileMenu(){
  const idx=LANGS.indexOf(LANG);
  return[mi(t('new'),newDoc),mi(t('open'),()=>$('#file-in').click()),mi(t('save'),saveFile),mi(t('viewXml'),xmlDialog),h('hr'),
    mi(t('exportSvg'),()=>download(diagramSVG().markup,fileBase()+'.svg','image/svg+xml')),mi(t('exportPng'),exportPNG),mi(t('print'),()=>{UI.sel.clear();renderAll();fitView();setTimeout(()=>print(),50)}),h('hr'),
    h('div',{class:'mh'},t('samples')),...Object.keys(SAMPLES).map(k=>mi(SAMPLES[k].title[idx],()=>askLoadSample(k)))];
}
function arrangeMenu(){
  return[mi(t('autoLayout'),async()=>{if(hasContent()&&!await confirmDlg(t('autoLayout'),t('autoLayoutConfirm'),t('confirm')))return;autoLayout();commit();fitView()}),
    mi(t('resetRoutes'),()=>{for(const e of planeEdges()){e.manual=false;delete e.label;rerouteEdge(e)}commit()}),
    mi(t('fit'),fitView)];
}
const hasContent=()=>D.model.nodes.length>0;
async function newDoc(){
  if(hasContent()&&!await confirmDlg(t('new'),t('confirmNew'),t('confirm')))return;
  D.model=newModel();D.plane='Plane_1';reindex();UI.sel.clear();resetHistory();UI.view={x:40,y:40,k:1};applyView();renderAll();refreshSide();refreshPlanes();
}
async function askLoadSample(k){
  if(hasContent()&&!await confirmDlg(t('samples'),t('confirmNew'),t('confirm')))return;
  loadSample(k);toast(SAMPLES[k].desc[LANGS.indexOf(LANG)],'ok',6000);
}
function saveFile(){
  const v=UI.issues.filter(i=>i.sev==='error').length;
  download(exportXML(),fileBase()+'.bpmn','application/xml');
  if(v)toast(t('savedWithErrors',v),'warn',6000);else toast(t('saved'));
}
function xmlDialog(){
  const ta=h('textarea',{rows:22,style:'width:100%;font:11.5px/1.45 var(--mono);white-space:pre;overflow:auto',spellcheck:'false','aria-label':'XML'});
  ta.value=exportXML();
  modal({title:t('viewXml'),wide:true,body:[h('p',{class:'hint'},t('xmlHint')),ta],actions:[{label:t('close')},{label:t('applyXml'),kind:'primary',run(){loadXmlText(ta.value)}}]});
}
function loadXmlText(text){
  const backup=JSON.stringify(D.model),plane=D.plane;
  try{
    const rep=importXML(text);
    UI.sel.clear();UI.tab='props';resetHistory();renderAll();refreshSide();refreshPlanes();
    requestAnimationFrame(fitView);
    const notes=[];
    const ign=Object.entries(rep.ignored);
    if(ign.length)notes.push(t('importIgnored',ign.map(([k,c])=>k+' ('+c+')').join(', ')));
    if(rep.warnings.length)notes.push(rep.warnings.slice(0,5).join('\n'));
    if(rep.layout)notes.push(t('importLayout'));
    if(notes.length)toast(notes.join('\n'),'warn',12000);else toast(t('imported'));
    return rep;
  }catch(e){
    D.model=JSON.parse(backup);D.plane=plane;reindex();
    toast(t('importFail',e.message),'err');
    return null;
  }
}
async function readXmlFile(file){
  const buf=await file.arrayBuffer(),bytes=new Uint8Array(buf);
  const head=new TextDecoder('latin1').decode(bytes.slice(0,200));
  const m=/encoding=["']([\w-]+)["']/i.exec(head);
  let enc='utf-8';
  if(bytes[0]===0xFF&&bytes[1]===0xFE)enc='utf-16le';else if(bytes[0]===0xFE&&bytes[1]===0xFF)enc='utf-16be';else if(m)enc=m[1];
  let txt;try{txt=new TextDecoder(enc).decode(bytes)}catch{txt=new TextDecoder().decode(bytes)}
  return txt.replace(/^﻿/,'');
}
async function openFile(file){
  if(!file)return;
  if(hasContent()&&!await confirmDlg(t('open'),t('confirmNew'),t('confirm')))return;
  if(file.size>20*1024*1024){toast(t('fileBig'),'err');return}
  const text=await readXmlFile(file);
  if(loadXmlText(text)&&!D.model.name)D.model.name=file.name.replace(/\.[^.]+$/,''),refreshPlanes();
}
function helpDialog(){
  const sec=(k)=>[h('h4',null,t('h_'+k+'T')),...t('h_'+k).split('\n').map(l=>l.startsWith('- ')?h('ul',null,h('li',null,l.slice(2))):h('p',null,l))];
  const merge=els=>{const out=[];for(const e of els){const last=out[out.length-1];if(e.tagName==='UL'&&last&&last.tagName==='UL')last.append(...e.children);else out.push(e)}return out};
  modal({title:t('help'),wide:true,body:merge(['edit','connect','sim','scen','batch','norm','limits','keys'].flatMap(sec)),actions:[{label:t('close')}]});
}
function applyLang(){
  document.documentElement.lang=t('lang');
  document.querySelectorAll('[data-tx]').forEach(e=>{e.textContent=t(e.dataset.tx)});
  document.querySelectorAll('[data-title]').forEach(e=>{e.title=t(e.dataset.title);e.setAttribute('aria-label',t(e.dataset.title))});
  document.querySelectorAll('[data-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.aria)));
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});
  $('#svg').setAttribute('aria-label',t('canvasLabel'));
  $('#lang').value=LANG;
  buildPalette();
  const row=$('#empty-samples'),idx=LANGS.indexOf(LANG);
  row.replaceChildren(...Object.keys(SAMPLES).map(k=>h('button',{onclick(){loadSample(k);toast(SAMPLES[k].desc[idx],'ok',6000)}},SAMPLES[k].title[idx])));
  renderAll();refreshSide();refreshPlanes();
  if(UI.mode==='sim'){renderSimPanel();updateSimBar();drawSim()}
}
function setLang(l){if(!LANGS.includes(l))return;LANG=l;store.set('lang',l);if(location.hash.slice(1)!==l&&LANGS.includes(location.hash.slice(1)))history.replaceState(null,'','#'+l);applyLang()}
function init(){
  const svg=$('#svg');
  svg.addEventListener('pointerdown',onDown);
  svg.addEventListener('pointermove',onMove);
  svg.addEventListener('pointerup',onUp);
  svg.addEventListener('pointercancel',onUp);
  svg.addEventListener('contextmenu',e=>e.preventDefault());
  svg.addEventListener('dblclick',ev=>{
    if(UI.mode!=='edit')return;
    /* o primeiro clique redesenha o elemento e o alvo original some: procura pelo ponto */
    const el=document.elementFromPoint(ev.clientX,ev.clientY),g=el&&el.closest&&el.closest('[data-id]');
    if(g){const x=byId(g.dataset.id);if(x)startRename(x)}
  });
  svg.addEventListener('wheel',ev=>{
    ev.preventDefault();
    const r=svg.getBoundingClientRect();
    if(ev.ctrlKey||ev.metaKey)zoomAt(UI.view.k*Math.exp(-ev.deltaY*.0022),ev.clientX-r.left,ev.clientY-r.top);
    else{UI.view.x-=ev.shiftKey?ev.deltaY:ev.deltaX;UI.view.y-=ev.shiftKey?0:ev.deltaY;applyView()}
  },{passive:false});
  window.addEventListener('keydown',onKey);
  window.addEventListener('keyup',e=>{if(e.key===' ')UI.space=false});
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.rt');if(b){UI.tab=b.dataset.r;refreshSide()}});
  $('#b-undo').onclick=undo;$('#b-redo').onclick=redo;
  $('#b-undo').textContent='↶';$('#b-redo').textContent='↷';
  $('#b-file').onclick=e=>menuFor(e.currentTarget,fileMenu);
  $('#b-arrange').onclick=e=>menuFor(e.currentTarget,arrangeMenu);
  $('#b-sim').onclick=enterSim;$('#b-stop').onclick=exitSim;$('#b-play').onclick=play;$('#b-step').onclick=doStep;$('#b-back').onclick=doBack;$('#b-reset').onclick=newRun;
  $('#b-help').onclick=helpDialog;
  $('#b-theme').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;store.set('theme',n)};
  $('#lang').onchange=e=>setLang(e.target.value);
  $('#z-in').onclick=()=>zoomAt(UI.view.k*1.2);$('#z-out').onclick=()=>zoomAt(UI.view.k/1.2);$('#z-fit').onclick=fitView;
  $('#docname').addEventListener('change',e=>{D.model.name=e.target.value;commit()});
  $('#plane').onchange=e=>{D.plane=e.target.value;UI.sel.clear();renderAll();refreshSide();fitView()};
  $('#file-in').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
  $('#m-drawer').onclick=()=>document.body.classList.toggle('drawer');
  const stage=$('#stage');
  stage.addEventListener('dragover',e=>{e.preventDefault()});
  stage.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0]&&UI.mode==='edit')openFile(e.dataTransfer.files[0])});
  window.addEventListener('resize',()=>applyView());
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(LANGS.includes(v))setLang(v)});
  document.documentElement.dataset.theme=store.get('theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nav=(navigator.language||'pt').slice(0,2),hash=location.hash.slice(1);
  LANG=LANGS.includes(hash)?hash:store.get('lang',LANGS.includes(nav)?nav:'pt');
  if(!LANGS.includes(LANG))LANG='pt';
  const saved=store.get('doc',null);
  if(saved){try{const o=JSON.parse(saved);if(o&&o.m&&o.m.planes&&o.m.nodes){D.model=o.m;D.plane=o.p}}catch{}}
  reindex();UI.last=snapshot();
  applyView();applyLang();
  if(D.model.nodes.length)requestAnimationFrame(fitView);
}
init();

</script>
