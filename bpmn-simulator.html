<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nenhum dado sai deste arquivo: sem rede e sem eval. As expressões dos modelos passam por um interpretador próprio. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>BPMN Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23176b5b'/%3E%3Cpath d='M8 3.2 12.8 8 8 12.8 3.2 8z' fill='none' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f1;--panel:#fff;--panel2:#f8f8f6;--text:#1b2022;--muted:#60686c;--line:#d9dcd6;--line2:#e9ebe6;
  --accent:#176b5b;--accent-text:#fff;--accent-soft:#dfefeb;--danger:#b3261e;--danger-soft:#fbe9e7;--warn:#8a5a00;--warn-soft:#fdf3dc;--ok:#1f7a3d;
  --canvas:#fbfbf9;--dot:#d5d8d1;--sel:#d9480f;--token:#d9480f;--c-grid:#e1e0d9;--c-base:#c3c2b7;--c-muted:#6f6d68;--bar:#2a78d6;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#14171a;--panel:#1b1f23;--panel2:#21262a;--text:#e5e8ea;--muted:#9aa2a8;--line:#343a40;--line2:#2a2f34;
  --accent:#58c4ad;--accent-text:#0b1f1a;--accent-soft:#1b3a33;--danger:#ef8a80;--danger-soft:#3b211f;--warn:#e3b45a;--warn-soft:#352a14;--ok:#6cc98a;
  --canvas:#171a1d;--dot:#30363b;--sel:#ff8f5a;--token:#ff8f5a;--c-grid:#2c2c2a;--c-base:#383835;--c-muted:#9a9890;--bar:#3987e5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--sans);color:var(--text);background:var(--bg);display:grid;grid-template-rows:46px minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--panel2);border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.danger{color:var(--danger)}
button.danger-solid{background:var(--danger);border-color:var(--danger);color:var(--panel)}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
button.on{background:var(--accent-soft);border-color:var(--accent)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;width:100%}
input[type=checkbox]{accent-color:var(--accent);margin:0}
textarea{font:12px/1.5 var(--mono);resize:vertical}
textarea.plain{font:13px/1.4 var(--sans)}
code,.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.spacer{flex:1}
.hidden{display:none!important}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}

#topbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
#brand{font-weight:650;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:4px}
#brand svg{width:18px;height:18px;flex:none}
#docname{border:1px solid transparent;background:none;width:190px;font-weight:500;text-overflow:ellipsis}
#docname:hover,#docname:focus{border-color:var(--line);background:var(--panel)}
#plane{width:auto;max-width:170px}
.tools{display:flex;align-items:center;gap:5px;min-width:0}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 3px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:40;min-width:240px;padding:4px;max-height:80vh;overflow:auto}
.menu-list button{display:block;width:100%;text-align:left;border:none;background:none;padding:5px 9px;border-radius:4px}
.menu-list button:hover:not(:disabled){background:var(--accent-soft)}
.menu-list hr{border:none;border-top:1px solid var(--line2);margin:4px 2px}
.menu-list .mh{font-size:11px;color:var(--muted);padding:4px 9px 2px;font-weight:650}
#clock{font:600 13px var(--mono);min-width:92px;text-align:right}
#status{color:var(--muted);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#speed,#lang{width:auto}

#main{display:grid;grid-template-columns:186px minmax(0,1fr) 310px;min-height:0}
#left,#right{background:var(--panel2);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.side-title{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:10px 12px 4px}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px 10px 8px}
.pal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;touch-action:none;font-size:11px;white-space:normal;line-height:1.15;cursor:grab}
.pal svg{width:40px;height:28px;pointer-events:none}
#outline{overflow:auto;flex:1;padding-bottom:10px}
.out{display:flex;gap:6px;width:100%;border:none;border-radius:0;background:none;text-align:left;padding:3px 12px;font-size:12px;align-items:baseline}
.out:hover:not(:disabled){background:var(--line2)}
.out.active{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.out i{font:600 10px var(--mono);color:var(--muted);font-style:normal;flex:none;min-width:22px}
.out span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#center{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--canvas)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;outline:none}
#zoombar{position:absolute;left:10px;bottom:10px;display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px}
#zoombar button{border:none;background:none;padding:2px 8px}
#zoombar span{align-self:center;font:11px var(--mono);color:var(--muted);min-width:40px;text-align:center}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:20px}
#empty>div{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 28px;width:min(560px,100%);text-align:center}
#empty h1{font-size:18px;margin:0 0 6px;font-weight:650}
#empty p{margin:0 0 14px;color:var(--muted)}
#empty .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#renamer{position:absolute;z-index:20;text-align:center;font:13px var(--sans);border:2px solid var(--accent);border-radius:4px;padding:3px;background:var(--panel);resize:none;overflow:hidden}
#decide{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.2);max-width:300px;z-index:15}
#decide h5{margin:0 0 5px;font-size:12px}
#decide .row{display:flex;flex-direction:column;gap:4px}
#decide button{white-space:normal;text-align:left}

/* inspetor */
#tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 8px 0;gap:2px;flex:none}
.rt{border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:none;color:var(--muted);padding:4px 11px;margin-bottom:-1px}
.rt[aria-selected=true]{background:var(--panel2);border-color:var(--line);border-bottom-color:var(--panel2);color:var(--text);font-weight:600}
.rt b{background:var(--danger);color:var(--panel);border-radius:8px;padding:0 5px;font-size:10px;margin-left:3px}
.rt b.w{background:var(--warn)}
.rt b.k{background:var(--ok)}
#inspector{overflow:auto;flex:1;padding:10px 12px 16px;display:flex;flex-direction:column;gap:9px;min-height:0}
.field{display:flex;flex-direction:column;gap:3px}
.field>span,.lab{font-size:12px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted);line-height:1.35}
.ferr{font:11px var(--mono);color:var(--danger);white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
label.inl{cursor:pointer}
h4{margin:6px 0 0;font-size:13px;font-weight:650}
.type{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.issue{display:block;width:100%;text-align:left;white-space:normal;padding:6px 8px;border-left:3px solid var(--warn);border-radius:0 5px 5px 0;font-size:12px}
.issue.error{border-left-color:var(--danger)}
.issue.info{border-left-color:var(--muted)}
.issue small{display:block;color:var(--muted)}
.ok-msg{color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono)}
.evgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.evgrid button{padding:3px 1px;display:flex;flex-direction:column;align-items:center;font-size:10px;line-height:1.1;white-space:normal;min-height:52px;gap:2px}
.evgrid svg{width:26px;height:26px;flex:none}
.evgrid button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.defbox{border:1px solid var(--line);border-radius:6px;padding:7px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
#m-drawer{display:none}

/* painel da simulação */
#simpanel.big{height:46vh}
.stepv{padding:10px 14px;display:flex;flex-direction:column;gap:7px;max-width:820px}
.stepv h5{margin:0;font-size:13px;font-weight:650}
.stepv h6{margin:4px 0 0;font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.stepv ul{margin:0;padding-left:18px}
.stepv p{margin:0}
.stepv .row{display:flex;gap:6px;margin-top:4px}
.mode-sim #palette{opacity:.45;pointer-events:none}
#simpanel{height:270px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#simtabs{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line2);align-items:center;flex:none;overflow-x:auto}
.st{padding:2px 10px;font-size:12px}
.st[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent)}
#simbody{overflow:auto;flex:1;min-height:0}
table.t{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:3px 9px;text-align:left;white-space:nowrap}
table.t th{position:sticky;top:0;background:var(--panel2);font-weight:600;font-size:11px;color:var(--muted);z-index:1}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.w{white-space:normal;min-width:240px}
table.t tr.warn td{background:var(--warn-soft);color:var(--warn)}
table.t tr.err td{background:var(--danger-soft);color:var(--danger)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:12px}
.summary b{font:600 13px var(--mono)}
.storeh{padding:8px 12px 3px;font-weight:600}
.pad{padding:12px}
.sc-bar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.sc-bar .field{width:112px}.sc-bar .field.wide{width:170px}
.chart-wrap{position:relative;padding:0 10px}
.qchart{display:block;max-width:100%}
.c-grid{stroke:var(--c-grid);stroke-width:1}.c-base{stroke:var(--c-base);stroke-width:1}
.c-tick{fill:var(--c-muted);font:11px var(--sans);font-variant-numeric:tabular-nums}
.c-bar{fill:var(--bar)}.c-hit{fill:transparent}.c-hit:hover{fill:color-mix(in srgb,var(--text) 8%,transparent)}
.c-tip{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0;width:min(480px,94vw);max-height:90vh;box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog.wide{width:min(760px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg header{padding:12px 16px;font-weight:650;font-size:14px;border-bottom:1px solid var(--line2)}
.dlg .b{padding:14px 16px;overflow:auto;flex:1}
.dlg .b h4{margin:14px 0 4px}.dlg .b h4:first-child{margin-top:0}
.dlg .b p{margin:0 0 8px}
.dlg .b ul{margin:0 0 8px;padding-left:18px}
.dlg footer{padding:10px 16px;display:flex;justify-content:flex-end;gap:6px;border-top:1px solid var(--line2)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:54px;z-index:9999;display:flex;flex-direction:column;gap:6px;max-width:min(520px,90vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:5px;padding:7px 10px;box-shadow:0 4px 18px rgba(0,0,0,.2);display:flex;gap:10px;white-space:pre-wrap}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
.toast span{flex:1}.toast button{border:none;background:none;padding:0 3px;color:var(--muted)}

@media (max-width:1100px){
  #main{grid-template-columns:150px minmax(0,1fr) 260px}
  #brand span,#status{display:none}
  #docname{width:120px}
}
/* celular: paleta em faixa no alto, inspetor em gaveta */
@media (max-width:760px){
  #topbar{overflow-x:auto}
  #docname,#plane,#brand,#topbar>.spacer{display:none}
  .tools{flex:none}
  #b-sim{order:-1}
  #m-drawer{order:-1}
  .menu-list{position:fixed;top:48px;right:8px;left:8px;min-width:0}
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #left{border:none;border-bottom:1px solid var(--line)}
  #left .side-title,#outline{display:none}
  #palette{display:flex;overflow-x:auto;padding:5px 8px}
  .pal{flex:none;width:68px}
  #right{position:fixed;right:0;top:46px;bottom:0;width:min(320px,88vw);z-index:30;box-shadow:-6px 0 20px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .15s}
  body.drawer #right{transform:none}
  #m-drawer{display:inline-block}
  #simpanel,#simpanel.big{height:44vh}
  #simtabs input[type=checkbox]{width:18px;height:18px}
  #simtabs label{padding:5px 3px;flex:none}
  #simtabs .st{flex:none;padding:5px 10px}
  #sim-tools{padding-right:6px}
  body.mode-sim #left{display:none}
  #c-table thead{display:none}
  #c-table tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline}
  #c-table td{border-bottom:none}
  #c-table td:nth-child(2){white-space:normal;min-width:0}
  #c-table td:nth-child(4),#c-table td[colspan]{grid-column:1/-1}
  #c-table td:nth-child(4){border-bottom:1px solid var(--line2);overflow-x:auto}
  body.mode-sim #main{grid-template-rows:minmax(0,1fr)}
  #decide{left:10px;right:10px;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  #topbar,#left,#right,#zoombar,#simpanel,#toasts,#decide,#empty{display:none!important}
  body,#main{display:block}
  #stage{position:fixed;inset:0;background:#fff}
  .grid-bg{display:none}
}
</style>
<style id="render-css">
.grid-dot{fill:var(--dot)}
.b-fill{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-line{fill:none;stroke:var(--b-line);stroke-width:1.6}
.b-thin{fill:none;stroke:var(--b-line);stroke-width:1.2}
.b-ink{fill:var(--b-line);stroke:none}
.b-blank{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.2}
.b-text{fill:var(--b-line);font:12px var(--b-font);text-anchor:middle;pointer-events:none}
.b-note{fill:var(--b-line);font:12px var(--b-font);text-anchor:start;pointer-events:none}
.b-small{fill:var(--b-muted);font:10.5px var(--b-mono);text-anchor:middle;pointer-events:none}
.b-event{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-end{fill:var(--b-fill);stroke:var(--b-line);stroke-width:3.4}
.b-gw{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-pool{fill:var(--b-pool);stroke:var(--b-line);stroke-width:1.6}
.b-lane{fill:none;stroke:var(--b-line);stroke-width:1}
.b-group{fill:none;stroke:var(--b-line);stroke-width:1.4;stroke-dasharray:9 4 2 4}
.b-seq{fill:none;stroke:var(--b-line);stroke-width:1.5;marker-end:url(#m-seq)}
.b-msg{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:7 5;marker-start:url(#m-msg-start);marker-end:url(#m-msg-end)}
.b-assoc{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.b-assoc.one{marker-end:url(#m-open)}
.b-assoc.both{marker-start:url(#m-open-s);marker-end:url(#m-open)}
.b-data{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round;marker-end:url(#m-open)}
</style>
<style>
:root{--b-fill:#fff;--b-line:#1d2527;--b-muted:#60686c;--b-pool:#fff;--b-font:var(--sans);--b-mono:var(--mono)}
:root[data-theme=dark]{--b-fill:#20252a;--b-line:#d7dde0;--b-muted:#9aa2a8;--b-pool:#1b1f23}
.node{cursor:move}
.node.lane-n,.node.pool-n{cursor:default}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.node.sel>.outline{display:block}
.outline{display:none;fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}
.edge.sel>.b-seq,.edge.sel>.b-msg,.edge.sel>.b-assoc,.edge.sel>.b-data{stroke:var(--sel);stroke-width:2.2}
.has-err .b-fill,.has-err .b-event,.has-err .b-end,.has-err .b-gw{stroke:var(--danger)}
.handle{fill:var(--panel);stroke:var(--sel);stroke-width:1.5}
.h-se{cursor:nwse-resize}.h-sw{cursor:nesw-resize}.h-ne{cursor:nesw-resize}.h-nw{cursor:nwse-resize}
.bend{fill:var(--sel);stroke:var(--panel);stroke-width:1.5;cursor:grab}
.bend.new{fill:var(--panel);stroke:var(--sel)}
.preview{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.marquee{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-dasharray:4 3;pointer-events:none}
.tgt-ok>*:first-child{stroke:var(--accent)!important;stroke-width:3!important}
.drop-host{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);stroke-width:2;pointer-events:none}
.pad-b rect{fill:var(--panel);stroke:var(--line);cursor:pointer;stroke-width:1}
.pad-b:hover rect{stroke:var(--accent);stroke-width:1.6}
.pad-b .ic{pointer-events:none}
.lbl-hit{cursor:move;fill:transparent}
.expander{cursor:pointer}
.mode-sim .node,.mode-sim .edge-hit{cursor:default}
.tok{fill:var(--token);stroke:var(--panel);stroke-width:1.5;pointer-events:none}
.tok2{fill:#2a78d6}.tok3{fill:#1baf7a}.tok4{fill:#c98500}.tok5{fill:#d55181}
.act-bg{fill:color-mix(in srgb,var(--token) 14%,transparent);stroke:var(--token);stroke-width:2.5;pointer-events:none}
.prog{fill:none;stroke:var(--token);stroke-width:4;pointer-events:none}
.bdg rect{fill:var(--text)}.bdg text{fill:var(--panel);font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central}
.bdg{pointer-events:none}.bdg.q rect{fill:var(--sel)}
.done-mark{fill:color-mix(in srgb,var(--ok) 16%,transparent);stroke:var(--ok);stroke-width:1.5;pointer-events:none}
.heat{fill:none;stroke:var(--token);opacity:.28;stroke-linecap:round;pointer-events:none}
.f-count{fill:var(--accent);font:700 10.5px var(--mono);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--canvas);stroke-width:3px}
.pick{fill:none;stroke:var(--accent);stroke-width:6;opacity:.45;cursor:pointer}
.step-node{fill:none;stroke:var(--accent);stroke-width:3;pointer-events:none}
.step-flow{fill:none;stroke:var(--accent);stroke-width:4;opacity:.55;stroke-linecap:round;pointer-events:none}
.uncov{fill:none;stroke:var(--danger);stroke-width:2.5;stroke-dasharray:6 4;pointer-events:none}
.env{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.1}
.env.non{fill:var(--b-muted)}
</style>
</head>
<body>
<header id="topbar">
  <div id="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#176b5b"/><path d="M8 3.2 12.8 8 8 12.8 3.2 8z" fill="none" stroke="#fff" stroke-width="1.4"/></svg><span>BPMN Simulator</span></div>
  <input id="docname" type="text" data-aria="docName" data-ph="docName">
  <select id="plane" data-aria="diagram"></select>
  <div class="spacer"></div>
  <div class="tools" id="edit-tools">
    <button id="b-undo" data-title="undoKey">↶</button>
    <button id="b-redo" data-title="redoKey">↷</button>
    <div class="sep"></div>
    <div class="menu"><button id="b-file" aria-haspopup="true" data-tx="file"></button></div>
    <div class="menu"><button id="b-arrange" aria-haspopup="true" data-tx="arrange"></button></div>
    <div class="sep"></div>
    <button id="b-sim" class="primary" data-tx="simulate"></button>
  </div>
  <div class="tools hidden" id="sim-tools">
    <span id="status" role="status"></span>
    <span id="clock">t = 0.0</span>
    <button id="b-play" class="primary"></button>
    <button id="b-back" data-tx="back" data-title="backKey"></button>
    <button id="b-step" data-tx="step" data-title="stepKey"></button>
    <button id="b-reset" data-tx="restart"></button>
    <select id="speed" data-aria="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
    <div class="sep"></div>
    <button id="b-stop" data-tx="backToEdit"></button>
  </div>
  <div class="sep"></div>
  <select id="lang" aria-label="Idioma / Language / Lingua"><option value="pt">PT</option><option value="en">EN</option><option value="it">IT</option><option value="es">ES</option></select>
  <button id="b-help" aria-label="?" data-title="help">?</button>
  <button id="b-theme" data-title="theme">◐</button>
  <button id="m-drawer" data-tx="properties"></button>
</header>

<div id="main">
  <aside id="left">
    <div class="side-title" data-tx="elements"></div>
    <div id="palette"></div>
    <div class="side-title" data-tx="thisDiagram"></div>
    <div id="outline"></div>
  </aside>
  <section id="center">
    <div id="stage">
      <svg id="svg" role="application" tabindex="0" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs">
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="grid-dot" cx="1" cy="1" r="1"/></pattern>
          <marker id="m-seq" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
          <marker id="m-msg-end" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11z" fill="var(--b-fill)" stroke="context-stroke" stroke-width="1.2"/></marker>
          <marker id="m-msg-start" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4.5" fill="var(--b-fill)" stroke="context-stroke" stroke-width="1.4"/></marker>
          <marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="context-stroke" stroke-width="1.3"/></marker>
          <marker id="m-open-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 1 6 11 11" fill="none" stroke="context-stroke" stroke-width="1.3"/></marker>
        </defs>
        <rect id="bg" class="grid-bg" width="100%" height="100%" fill="url(#dots)"/>
        <g id="world"><g id="g-back"></g><g id="g-sim-under"></g><g id="g-edges"></g><g id="g-nodes"></g><g id="g-sim"></g><g id="g-over"></g></g>
      </svg>
      <div id="empty" class="hidden"><div>
        <h1 data-tx="emptyTitle"></h1>
        <p data-tx="emptyText"></p>
        <div class="row" id="empty-samples"></div>
      </div></div>
      <div id="decide" class="hidden" role="dialog"></div>
      <div id="zoombar">
        <button id="z-out" aria-label="−">−</button><span id="z-label">100%</span><button id="z-in" aria-label="+">+</button><button id="z-fit" data-tx="fit"></button>
      </div>
    </div>
    <div id="simpanel" class="hidden">
      <div id="simtabs" role="tablist"></div>
      <div id="simbody"></div>
    </div>
  </section>
  <aside id="right">
    <div id="tabs" role="tablist">
      <button class="rt" role="tab" data-r="props" data-tx="properties"></button>
      <button class="rt" role="tab" data-r="check"></button>
    </div>
    <div id="inspector"></div>
  </aside>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

soundTitle:['Análise de fichas','Token analysis','Analisi dei token','Análisis de fichas'],soundHint:['Explora todos os estados de cada escopo, supondo que qualquer caminho é possível (ignora dados). Procura impasses, fichas duplicadas e elementos que nunca executam.','Explores all states of each scope, assuming any path is possible (ignores data). It looks for deadlocks, duplicated tokens and elements that never run.','Esplora tutti gli stati di ogni ambito, supponendo che ogni percorso sia possibile (ignora i dati). Cerca stalli, token duplicati ed elementi mai eseguiti.','Explora todos los estados de cada ámbito, suponiendo que cualquier camino es posible (ignora los datos). Busca bloqueos, fichas duplicadas y elementos que nunca se ejecutan.'],soundRun:['Analisar','Analyze','Analizza','Analizar'],soundNone:['Nada para analisar neste diagrama.','Nothing to analyze in this diagram.','Niente da analizzare in questo diagramma.','Nada que analizar en este diagrama.'],soundStates:['{0} estado(s) explorado(s)','{0} state(s) explored','{0} stato/i esplorato/i','{0} estado(s) explorado(s)'],soundOk:['Sem impasses: toda ficha pode chegar ao fim.','No deadlocks: every token can reach the end.','Nessuno stallo: ogni token può arrivare alla fine.','Sin bloqueos: toda ficha puede llegar al final.'],soundTrunc:['Análise interrompida no limite de estados: o resultado é parcial.','Analysis stopped at the state limit: the result is partial.','Analisi interrotta al limite di stati: risultato parziale.','Análisis detenido en el límite de estados: el resultado es parcial.'],soundDead:['Impasse: fichas presas em {0}.','Deadlock: tokens stuck at {0}.','Stallo: token bloccati in {0}.','Bloqueo: fichas atascadas en {0}.'],soundLive:['Laço sem saída: fichas em {0} nunca chegam ao fim.','Endless loop: tokens at {0} never reach the end.','Ciclo senza uscita: i token in {0} non arrivano mai alla fine.','Bucle sin salida: las fichas en {0} nunca llegan al final.'],soundUnsafe:['Falta de sincronização: mais de uma ficha pode chegar junta a {0}.','Lack of synchronization: more than one token can reach {0} together.','Mancata sincronizzazione: più token possono arrivare insieme a {0}.','Falta de sincronización: más de una ficha puede llegar junta a {0}.'],soundDeadNode:['Nunca executa: {0}.','Never runs: {0}.','Mai eseguito: {0}.','Nunca se ejecuta: {0}.'],

ay.','Do not mix receive tasks and message events on one gateway.','Non mescolare attività di ricezione ed eventi di messaggio sullo stesso gateway.','No mezcles tarea de recepción y evento de mensaje en el mismo gateway.'],v_evGwInst:['Gateway que inicia o processo não tem entradas.','A gateway that starts the process has no inputs.','Il gateway che avvia il processo non ha ingressi.','El gateway que inicia el proceso no tiene entradas.'],v_gwNoCond:['Fluxo sem condição ao lado de fluxos condicionais: defina uma condição ou o padrão.','A flow with no condition beside conditional flows: set a condition or the default.','Flusso senza condizione accanto a flussi condizionali: imposta una condizione o il predefinito.','Flujo sin condición junto a flujos condicionales: define una condición o el predeterminado.'],v_gwNoDefault:['Sem fluxo padrão: se nenhuma condição valer, há exceção em execução.','No default flow: if no condition holds, execution raises an exception.','Nessun flusso predefinito: se nessuna condizione vale, si ha un’eccezione.','Sin flujo predeterminado: si ninguna condición vale, hay una excepción.'],v_gwName:['Gateway de decisão sem nome: uma pergunta ajuda quem lê.','Unnamed decision gateway: a question helps the reader.','Gateway di decisione senza nome: una domanda aiuta chi legge.','Gateway de decisión sin nombre: una pregunta ayuda a quien lee.'],v_compSeq:['Atividade de compensação não usa fluxos de sequência.','A compensation activity uses no sequence flows.','L’attività di compensazione non usa flussi di sequenza.','La actividad de compensación no usa flujos de secuencia.'],v_noName:['Sem nome.','No name.','Senza nome.','Sin nombre.'],v_evSubSeq:['Subprocesso de evento não se liga ao fluxo.','An event sub-process does not join the flow.','Il sottoprocesso di evento non si collega al flusso.','El subproceso de evento no se une al flujo.'],v_evSubBoundary:['Subprocesso de evento não tem evento de borda.','An event sub-process has no boundary even era.','Pool vacío: si es una parte externa, márcalo como caja negra.'],v_annEmpty:['Anotação vazia.','Empty annotation.','Annotazione vuota.','Anotación vacía.'],v_outsidePool:['Elemento fora dos pools num diagrama com pools.','Element outside the pools in a diagram with pools.','Elemento fuori dai pool in un diagramma con pool.','Elemento fuera de los pools en un diagrama con pools.'],v_dangling:['{0} aponta para elemento inexistente.','{0} points to a missing element.','{0} punta a un elemento inesistente.','{0} apunta a un elemento inexistente.'],v_seqCross:['Fluxo de sequência cruzando pool ou subprocesso.','Sequence flow crossing a pool or sub-process.','Flusso di sequenza che attraversa pool o sottoprocesso.','Flujo de secuencia que cruza pool o subproceso.'],v_defaultCond:['Fluxo padrão não leva condição.','A default flow has no condition.','Il flusso predefinito non ha condizione.','El flujo predeterminado no lleva condición.'],v_condFromEvent:['Fluxo que sai de evento não leva condição.','A flow leaving an event has no condition.','Un flusso che esce da un evento non ha condizione.','Un flujo que sale de un evento no lleva condición.'],v_prob:['Probabilidade fora de 0 a 100: {0}','Probability outside 0 to 100: {0}','Probabilità fuori da 0 a 100: {0}','Probabilidad fuera de 0 a 100: {0}'],v_msgSame:['Fluxo de mensagem dentro do mesmo pool.','Message flow within one pool.','Flusso di messaggi nello stesso pool.','Flujo de mensaje dentro del mismo pool.'],v_msgGw:['Gateway em fluxo de mensagem.','Gateway on a message flow.','Gateway su un flusso di messaggi.','Gateway en un flujo de mensaje.'],v_msgSrc:['Evento de captura como origem de mensagem.','Catch event as a message source.','Evento di ricezione come origine del messaggio.','Evento de captura como origen de mensaje.'],v_msgTgt:['Evento de disparo como destino de mensagem.','Throw event as a message target.','Evento di invio come destinazione del messaggio.','Evento de disparo como destino de mensaje.'], s_why_task:['A ficha fica na atividade durante a duração; ao concluir, segue pelos fluxos de saída.','The token stays in the activity for its duration; on completion it follows the outgoing flows.','Il token resta nell’attività per la sua durata; al termine segue i flussi in uscita.','La ficha permanece en la actividad durante su duración; al terminar sigue los flujos de salida.'],s_why_sub:['O subprocesso cria um escopo próprio com fichas internas e só termina quando todas acabam.','The sub-process creates its own scope with inner tokens and ends only when they all finish.','Il sottoprocesso crea un ambito proprio con token interni e termina solo quando finiscono tutti.','El subproceso crea un ámbito propio con fichas internas y solo termina cuando acaban todas.'],s_why_start:['Cada ocorrência do evento de início cria uma instância e uma ficha em cada fluxo de saída.','Each occurrence of the start event creates an instance and a token on each outgoing flow.','Ogni occorrenza dell’evento di inizio crea un’istanza e un token su ogni flusso in uscita.','Cada ocurrencia del evento de inicio crea una instancia y una ficha en cada flujo de salida.'],s_why_catch:['A ficha espera aqui até o evento ocorrer.','The token waits here until the event occurs.','Il token attende qui finché l’evento non avviene.','La ficha espera aquí hasta que ocurre el evento.'],s_why_throw:['O evento dispara seu resultado e a ficha segue em frente.','The event throws its result and the token moves on.','L’evento invia il suo risultato e il token prosegue.','El evento dispara su resultado y la ficha sigue adelante.'],s_why_boundary:['O evento de borda cancela a atividade e a ficha sai por ele.','The boundary event cancels the activity and the token leaves through it.','L’evento di bordo annulla l’attività e il token esce da esso.','El evento de borde cancela la actividad y la ficha sale por él.'],s_why_boundaryNon:['Este evento de borda não interrompe: a atividade continua e uma nova ficha sai por ele.','This boundary event does not interrupt: the activity continues and a new token leaves through it.','Questo evento di bordo non interrompe: l’attività continua e un nuovo token esce da esso.','Este evento de borde no interrumpe: la actividad continúa y una nueva ficha sale por él.'],s_why_end:['O evento de fim consome a ficha. A instância termina quando não restam fichas nem atividades.','The end event consumes the token. The instance ends when no tokens or activities remain.','L’evento di fine consuma il token. L’istanza termina quando non restano token né attività.','El evento de fin consume la ficha. La instancia termina cuando no quedan fichas ni actividades.'],

c_empty:['Nenhum cenário ainda. Crie um, peça uma sugestão ou termine uma execução e salve-a como cenário. Cada cenário define as entradas e o resultado esperado, e o app diz se passou ou falhou.','No scenarios yet. Create one, ask for a suggestion or finish a run and save it as a scenario. Each scenario sets the inputs and the expected result, and the app says whether it passed or failed.','Nessuno scenario. Creane uno, chiedi un suggerimento o termina un’esecuzione e salvala come scenario. Ogni scenario definisce gli ingressi e il risultato atteso, e l’app dice se è passato o fallito.','Aún no hay escenarios. Crea uno, pide una sugerencia o termina una ejecución y guárdala como escenario. Cada escenario define las entradas y el resultado esperado, y la app dice si pasó o falló.'],

h_scenT:['Cenários de teste','Test scenarios','Scenari di test','Escenarios de prueba'],h_scen:['A aba Cenários de teste confere se o processo faz o que deveria. Cada cenário tem três partes: dado que (os dados do caso), quando (as decisões e os eventos) e então (o resultado esperado).\n- Rodar todos mostra o que passou, o que falhou e por quê, além da cobertura somada. O que nunca executou fica tracejado no diagrama.\n- Ver reproduz o cenário com a animação, ou no Passo a passo se essa opção estiver ligada.\n- Sugerir cenários cria um cenário por caminho que acrescenta cobertura. Ele força as decisões, ignorando as condições, e preenche o esperado com o que aconteceu: revise.\n- Salvar execução como cenário guarda uma execução terminada.\nOs cenários ficam no diagrama e no arquivo .bpmn, em extensionElements.','The Test scenarios tab checks that the process does what it should. Each scenario has three parts: given (the case data), when (the decisions and events) and then (the expected result).\n- Run all shows what passed, what failed and why, plus the combined coverage. What never ran is dashed on the diagram.\n- Watch replays the scenario with animation, or in Step by step if that option is on.\n- Suggest scenarios creates one scenario per path that adds coverage. It forces the decisions, ignoring conditions, and fills in the expected result with what happened: review it.\n- Save run as scenario keeps a finished run.\nScenarios live in the diagram and in the .bpmn file, in extensionElements.','La scheda Scenari di test verifica che il processo faccia ciò che deve. Ogni scenario ha tre parti: dato che (i dati del caso), quando (decisioni ed eventi) e allora (il risultato atteso).\n- Esegui tutti mostra cosa è passato, cosa è fallito e perché, oltre alla copertura complessiva. Ciò che non è mai stato eseguito è tratteggiato nel diagramma.\n- Guarda riproduce lo scenario con l’animazione, o in Passo dopo passo se l’opzione è attiva.\n- Suggerisci scenari crea uno scenario per ogni percorso che aumenta la copertura. Forza le decisioni, ignorando le condizioni, e compila l’atteso con ciò che è successo: rivedilo.\n- Salva esecuzione come scenario conserva un’esecuzione terminata.\nGli scenari restano nel diagramma e nel file .bpmn, in extensionElements.','La pestaña Escenarios de prueba comprueba que el proceso hace lo que debe. Cada escenario tiene tres partes: dado que (los datos del caso), cuando (las decisiones y los eventos) y entonces (el resultado esperado).\n- Ejecutar todos muestra qué pasó, qué falló y por qué, además de la cobertura total. Lo que nunca se ejecutó queda punteado en el diagrama.\n- Ver reproduce el escenario con animación, o en Paso a paso si esa opción está activa.\n- Sugerir escenarios crea un escenario por cada camino que añade cobertura. Fuerza las decisiones, ignorando las condiciones, y rellena lo esperado con lo que ocurrió: revísalo.\n- Guardar ejecución como escenario conserva una ejecución terminada.\nLos escenarios quedan en el diagrama y en el archivo .bpmn, en extensionElements.'],

} com {1}.','Compensating {0} with {1}.','Compensa {0} con {1}.','Compensa {0} con {1}.'],l_compStart:['Compensação de {0} atividade(s).','Compensation of {0} activity(ies).','Compensazione di {0} attività.','Compensación de {0} actividad(es).'],l_noTimer:['{0}: temporizador sem valor dispara na hora.','{0}: a timer with no value fires at once.','{0}: un timer senza valore scatta subito.','{0}: un temporizador sin valor se dispara al instante.'],l_exprErr:['Expressão "{0}": {1}','Expression "{0}": {1}','Espressione "{0}": {1}','Expresión "{0}": {1}'],l_rule:['Regra inválida: {0}','Invalid rule: {0}','Regola non valida: {0}','Regla no válida: {0}'],l_recursion:['{0}: chamada recursiva longa demais.','{0}: recursive call too deep.','{0}: chiamata ricorsiva troppo profonda.','{0}: llamada recursiva demasiado profunda.'],l_stuck:['Fichas travadas em: {0}.','Tokens stuck at: {0}.','Token bloccati in: {0}.','Fichas atascadas en: {0}.'],
h_editT:['Desenhar','Drawing','Disegnare','Dibujar'],h_edit:['Arraste um elemento da esquerda até a área de desenho, ou clique nele para colocá-lo no centro. Solte dentro de um subprocesso expandido ou de um pool para ele pertencer àquele escopo.\n- Selecione um elemento para ver as ações ao lado dele: acrescentar o próximo passo, conectar ou excluir.\n- Duplo clique ou F2 escreve o nome. O tipo muda em Propriedades.\n- Solte um evento intermediário na borda de uma atividade para criar um evento de borda.\n- Solte uma tarefa ou gateway sobre um fluxo para inseri-los no meio dele.\n- Arraste o fundo para mover a vista. Ctrl + roda do mouse dá zoom. Shift + arraste seleciona vários.','Drag an element from the left onto the canvas, or click it to place it at the center. Drop it inside an expanded sub-process or a pool to make it part of that scope.\n- Select an element to see its actions beside it: append the next step, connect or delete.\n- Double-click or F2 edits the name. The type changes in Properties.\n- Drop an intermediate event on an activity’s border to create a boundary event.\n- Drop a task or gateway on a flow to insert it into the flow.\n- Drag the background to pan. Ctrl + wheel zooms. Shift + drag selects several.','Trascina un elemento da sinistra sull’area di disegno, o fai clic per metterlo al centro. Rilascialo in un sottoprocesso espanso o in un pool per farlo appartenere a quell’ambito.\n- Seleziona un elemento per vedere le azioni accanto: aggiungere il passo successivo, collegare o eliminare.\n- Doppio clic o F2 modifica il nome. Il tipo cambia in Proprietà.\n- Rilascia un evento intermedio sul bordo di un’attività per creare un evento di bordo.\n- Rilascia un’attività o un gateway su un flusso per inserirli nel flusso.\n- Trascina lo sfondo per spostare la vista. Ctrl + rotella per lo zoom. Shift + trascina seleziona più elementi.','Arrastra un elemento desde la izquierda al área de dibujo, o haz clic para ponerlo en el centro. Suéltalo dentro de un subproceso expandido o de un pool para que pertenezca a ese ámbito.\n- Selecciona un elemento para ver sus acciones al lado: añadir el siguiente paso, conectar o eliminar.\n- Doble clic o F2 edita el nombre. El tipo cambia en Propiedades.\n- Suelta un evento intermedio en el borde de una actividad para crear un evento de borde.\n- Suelta una tarea o gateway sobre un flujo para insertarlos en él.\n- Arrastra el fondo para mover la vista. Ctrl + rueda hace zoom. Shift + arrastrar selecciona varios.'],
h_connectT:['Conexões','Connections','Collegamenti','Conexiones'],h_connect:['O tipo de conexão é escolhido pela regra da norma: fluxo de sequência no mesmo pool, fluxo de mensagem entre pools, associação com anotações e associação de dados com objetos de dados. Ligações proibidas são recusadas com o motivo.','The connection type follows the standard: sequence flow within a pool, message flow between pools, association with annotations, data association with data objects. Forbidden links are refused, with the reason.','Il tipo di collegamento segue la norma: flusso di sequenza nello stesso pool, flusso di messaggi tra pool, associazione con annotazioni e associazione dati con oggetti dati. I collegamenti vietati sono rifiutati con il motivo.','El tipo de conexión sigue la norma: flujo de secuencia en el mismo pool, flujo de mensaje entre pools, asociación con anotaciones y asociación de datos con objetos de datos. Las conexiones prohibidas se rechazan con el motivo.'],
h_simT:['Simular um caso','Simulating a case','Simulare un caso','Simular un caso'],h_sim:['Simular abre a execução: Executar anima as fichas; Passo e Voltar avançam e recuam. Em "Decidir eu mesmo" você escolhe o caminho em cada gateway.\n- Decisões automáticas: condição, depois probabilidade do fluxo, depois fluxo padrão.\n- Expressões usam os dados do caso, como valor > 500 and urgente. Funções: random, exponential, normal, chance, pick, round, min, max.\n- Mensagens entre pools correlacionam pelo caso e levam uma cópia dos dados de quem enviou.\n- Na aba Aguardando dá para disparar à mão mensagens, sinais e eventos de borda.\n- A opção Passo a passo avança uma ficha ou um evento por clique e explica o que aconteceu, por quê e o que vem depois. O botão Passo sem essa opção move todas as fichas prontas de uma vez.','Simulate opens the run: Run animates the tokens; Step and Back move forward and backward. With "Decide myself" you choose the path at each gateway.\n- Automatic decisions: condition, then flow probability, then default flow.\n- Expressions use the case data, such as valor > 500 and urgente. Functions: random, exponential, normal, chance, pick, round, min, max.\n- Messages between pools correlate by case and carry a copy of the sender’s data.\n- In the Waiting tab you can fire messages, signals and boundary events by hand.\n- The Step by step option advances one token or event per click and explains what happened, why and what comes next. Without it, the Step button moves all ready tokens at once.','Simula apre l’esecuzione: Esegui anima i token; Passo e Indietro avanzano e arretrano. Con "Decido io" scegli il percorso a ogni gateway.\n- Decisioni automatiche: condizione, poi probabilità del flusso, poi flusso predefinito.\n- Le espressioni usano i dati del caso, come valor > 500 and urgente. Funzioni: random, exponential, normal, chance, pick, round, min, max.\n- I messaggi tra pool sono correlati per caso e portano una copia dei dati del mittente.\n- Nella scheda In attesa puoi attivare a mano messaggi, segnali ed eventi di bordo.\n- L’opzione Passo dopo passo avanza di un token o evento per clic e spiega cosa è successo, perché e cosa viene dopo. Senza di essa, il pulsante Passo muove insieme tutti i token pronti.','Simular abre la ejecución: Ejecutar anima las fichas; Paso y Atrás avanzan y retroceden. Con "Decidir yo" eliges el camino en cada gateway.\n- Decisiones automáticas: condición, luego probabilidad del flujo, luego flujo predeterminado.\n- Las expresiones usan los datos del caso, como valor > 500 and urgente. Funciones: random, exponential, normal, chance, pick, round, min, max.\n- Los mensajes entre pools se correlacionan por caso y llevan una copia de los datos del remitente.\n- En la pestaña Esperando puedes disparar a mano mensajes, señales y eventos de borde.\n- La opción Paso a paso avanza una ficha o un evento por clic y explica qué pasó, por qué y qué viene después. Sin ella, el botón Paso mueve todas las fichas listas a la vez.'],
h_batchT:['Muitas execuções','Many runs','Molte esecuzioni','Muchas ejecuciones'],h_batch:['A aba Muitas execuções roda até 20.000 casos e mostra tempo de ciclo, filas, ocupação das raias e o volume em cada fluxo, desenhado sobre o diagrama. Tarefas humanas (tarefa, usuário, manual) ocupam a capacidade da raia. Os números dependem das durações e probabilidades que você informou.','The Many runs tab runs up to 20,000 cases and shows cycle time, queues, lane utilization and the volume on each flow, drawn over the diagram. Human tasks (task, user, manual) use lane capacity. The figures depend on the durations and probabilities you entered.','La scheda Molte esecuzioni esegue fino a 20.000 casi e mostra tempo di ciclo, code, occupazione delle corsie e volume di ogni flusso, disegnato sul diagramma. Le attività umane (attività, utente, manuale) usano la capacità della corsia. I numeri dipendono da durate e probabilità inserite.','La pestaña Muchas ejecuciones ejecuta hasta 20.000 casos y muestra tiempo de ciclo, colas, ocupación de los carriles y el volumen de cada flujo, dibujado sobre el diagrama. Las tareas humanas (tarea, usuario, manual) usan la capacidad del carril. Los números dependen de las duraciones y probabilidades indicadas.'],
h_normT:['O que segue a norma OMG','What follows the OMG standard','Cosa segue la norma OMG','Qué sigue la norma OMG'],h_norm:['Referência: BPMN 2.0.2, documento formal/13-12-09.\n- Notação: formas e marcadores da cláusula 7 e da Tabela 10.93, com os tipos de evento permitidos em cada posição.\n- Conexões: Tabelas 7.3 e 7.4, aplicadas ao desenhar e na aba Verificar.\n- Arquivo: BPMN 2.0 XML com BPMN DI, nos namespaces normativos. Os dados da simulação ficam em extensionElements, o mecanismo de extensão previsto.\n- Simulação: fichas e regras de gateways, eventos, compensação e subprocessos de evento conforme a cláusula 13.','Reference: BPMN 2.0.2, document formal/13-12-09.\n- Notation: shapes and markers from clause 7 and Table 10.93, with the event types allowed in each position.\n- Connections: Tables 7.3 and 7.4, applied while drawing and in the Check tab.\n- File: BPMN 2.0 XML with BPMN DI, in the normative namespaces. Simulation data goes in extensionElements, the extension mechanism the standard provides.\n- Simulation: tokens and the rules for gateways, events, compensation and event sub-processes follow clause 13.','Riferimento: BPMN 2.0.2, documento formal/13-12-09.\n- Notazione: forme e marcatori della clausola 7 e della Tabella 10.93, con i tipi di evento consentiti in ogni posizione.\n- Collegamenti: Tabelle 7.3 e 7.4, applicate nel disegno e nella scheda Verifica.\n- File: BPMN 2.0 XML con BPMN DI, nei namespace normativi. I dati di simulazione sono in extensionElements, il meccanismo di estensione previsto.\n- Simulazione: token e regole di gateway, eventi, compensazione e sottoprocessi di evento seguono la clausola 13.','Referencia: BPMN 2.0.2, documento formal/13-12-09.\n- Notación: formas y marcadores de la cláusula 7 y de la Tabla 10.93, con los tipos de evento permitidos en cada posición.\n- Conexiones: Tablas 7.3 y 7.4, aplicadas al dibujar y en la pestaña Verificar.\n- Archivo: BPMN 2.0 XML con BPMN DI, en los namespaces normativos. Los datos de simulación van en extensionElements, el mecanismo de extensión previsto.\n- Simulación: fichas y reglas de gateways, eventos, compensación y subprocesos de evento siguen la cláusula 13.'],
h_limitsT:['Limites','Limits','Limiti','Límites'],h_limits:['Este app não é certificado pela OMG e não é um motor de produção.\n- Fora do escopo: diagramas de conversa e de coreografia. Se o arquivo os tiver, a importação avisa e eles não são salvos.\n- Atribuição de recursos a pessoas, correlação por propriedades, serviços e WSDL não são executados; a correlação de mensagens usa o caso.\n- A norma considera tarefas manuais, tarefas abstratas e subprocessos ad hoc como não operacionais: aqui eles ganham comportamento simples (duração; atividades ad hoc rodam uma vez cada).\n- Expressões seguem a linguagem própria do simulador, não XPath. Scripts em outras linguagens são preservados, mas não executados.\n- Associação com fluxo como origem ou destino é ignorada na importação, com aviso. Fontes de rótulos (BPMNLabelStyle) e cores de ferramentas não são preservadas. O início múltiplo paralelo dispara no primeiro gatilho.','This app is not certified by the OMG and is not a production engine.\n- Out of scope: conversation and choreography diagrams. If a file has them, the import warns and they are not saved.\n- Resource assignment to people, property-based correlation, services and WSDL are not executed; message correlation uses the case.\n- The standard treats manual tasks, abstract tasks and ad-hoc sub-processes as non-operational: here they get simple behavior (a duration; ad-hoc activities run once each).\n- Expressions use the simulator’s own language, not XPath. Scripts in other languages are kept but not run.\n- An association with a flow as source or target is ignored on import, with a warning. Label fonts (BPMNLabelStyle) and tool-specific colors are not kept. A parallel multiple start fires on its first trigger.','Questa app non è certificata da OMG e non è un motore di produzione.\n- Fuori ambito: diagrammi di conversazione e coreografia. Se il file li contiene, l’importazione avvisa e non vengono salvati.\n- Assegnazione di risorse a persone, correlazione per proprietà, servizi e WSDL non sono eseguiti; la correlazione dei messaggi usa il caso.\n- La norma considera non operative attività manuali, attività astratte e sottoprocessi ad hoc: qui hanno un comportamento semplice (una durata; le attività ad hoc girano una volta ciascuna).\n- Le espressioni usano il linguaggio del simulatore, non XPath. Gli script in altri linguaggi sono conservati ma non eseguiti.\n- Un’associazione con un flusso come origine o destinazione è ignorata all’importazione, con avviso. Font delle etichette (BPMNLabelStyle) e colori specifici degli strumenti non sono conservati. L’inizio multiplo parallelo scatta al primo trigger.','Esta app no está certificada por la OMG y no es un motor de producción.\n- Fuera de alcance: diagramas de conversación y de coreografía. Si el archivo los tiene, la importación avisa y no se guardan.\n- La asignación de recursos a personas, la correlación por propiedades, los servicios y WSDL no se ejecutan; la correlación de mensajes usa el caso.\n- La norma considera no operativas las tareas manuales, las tareas abstractas y los subprocesos ad hoc: aquí tienen un comportamiento simple (una duración; las actividades ad hoc se ejecutan una vez cada una).\n- Las expresiones usan el lenguaje del simulador, no XPath. Los scripts en otros lenguajes se conservan pero no se ejecutan.\n- Una asociación con un flujo como origen o destino se ignora al importar, con aviso. Las fuentes de etiquetas (BPMNLabelStyle) y los colores de otras herramientas no se conservan. El inicio múltiple paralelo se dispara con el primer disparador.'],
h_keysT:['Atalhos','Shortcuts','Scorciatoie','Atajos'],h_keys:['Editar: Ctrl+Z, Ctrl+Y, Ctrl+C, Ctrl+X, Ctrl+V, Ctrl+A, Ctrl+S, Delete, F2, setas (move), Esc. Espaço + arraste move a vista.\nSimular: Espaço (executar ou pausar), → (passo), ← (voltar), Esc (sair).\nO diagrama fica salvo neste navegador; nada sai deste arquivo.','Edit: Ctrl+Z, Ctrl+Y, Ctrl+C, Ctrl+X, Ctrl+V, Ctrl+A, Ctrl+S, Delete, F2, arrows (move), Esc. Space + drag pans.\nSimulate: Space (run or pause), → (step), ← (back), Esc (exit).\nThe diagram is saved in this browser; nothing leaves this file.','Modifica: Ctrl+Z, Ctrl+Y, Ctrl+C, Ctrl+X, Ctrl+V, Ctrl+A, Ctrl+S, Canc, F2, frecce (sposta), Esc. Spazio + trascina sposta la vista.\nSimula: Spazio (esegui o pausa), → (passo), ← (indietro), Esc (esci).\nIl diagramma resta salvato in questo browser; nulla esce da questo file.','Editar: Ctrl+Z, Ctrl+Y, Ctrl+C, Ctrl+X, Ctrl+V, Ctrl+A, Ctrl+S, Supr, F2, flechas (mover), Esc. Espacio + arrastrar mueve la vista.\nSimular: Espacio (ejecutar o pausar), → (paso), ← (atrás), Esc (salir).\nEl diagrama queda guardado en este navegador; nada sale de este archivo.'],
};
function t(key,...a){const e=I18N[key];let s=e?e[LANGS.indexOf(LANG)]:key;a.forEach((v,i)=>{s=s.split('{'+i+'}').join(String(v))});return s}

/* ========== utilitários ========== */
const $=(s,r=document)=>r.querySelector(s);
const SVGNS='http://www.w3.org/2000/svg';
function h(tag,attrs,...kids){
  const e=document.createElement(tag);let val;
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')val=v;
    else if(k==='checked'||k==='disabled'||k==='selected')e[k]=!!v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}
  if(val!==undefined)e.value=val;
  return e;
}
function s(tag,attrs,...kids){
  const e=document.createElementNS(SVGNS,tag);
  for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.setAttribute('class',v);else e.setAttribute(k,v)}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}
  return e;
}
function toast(msg,kind='ok',ms){
  const x=h('button',{'aria-label':t('close')},'×');
  const el=h('div',{class:'toast '+kind},h('span',null,msg),x);x.onclick=()=>el.remove();
  const box=$('#toasts');box.append(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>el.remove(),ms??(kind==='err'?9000:kind==='warn'?7000:3000));
}
function download(data,name,type='application/octet-stream'){
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=h('a',{href:url,download:name});document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
const store={get(k,d){try{const v=localStorage.getItem('bpmnsim.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('bpmnsim.'+k,JSON.stringify(v))}catch{}}};
function modal({title,body,actions,wide,onclose}){
  const d=h('dialog',{class:wide?'wide':null});
  const foot=h('footer');
  for(const a of actions||[])foot.append(h('button',{class:a.kind||null,type:'button',onclick(){if(a.run)a.run();d.close()}},a.label));
  d.append(h('div',{class:'dlg'},h('header',null,title),h('div',{class:'b'},body),foot));
  d.addEventListener('close',()=>{d.remove();onclose&&onclose()});
  document.body.append(d);d.showModal();return d;
}
const confirmDlg=(title,msg,label=t('confirm'))=>new Promise(res=>{let v=false;modal({title,body:h('p',{style:'margin:0'},msg),actions:[{label:t('cancel')},{label,kind:'danger-solid',run(){v=true}}],onclose(){res(v)}})});
const fmt=(n,d=1)=>Number(n).toLocaleString(t('lang'),{maximumFractionDigits:d,minimumFractionDigits:d});
const FORBIDDEN=new Set(['__proto__','constructor','prototype']);
function clean(o){
  if(Array.isArray(o))return o.map(clean);
  if(o&&typeof o==='object'){const r={};for(const k of Object.keys(o))if(!FORBIDDEN.has(k))r[k]=clean(o[k]);return r}
  return o;
}

/* ========== linguagem de expressões ========== */
const TOKEN_RE=/\s*(?:(\d+(?:\.\d+)?(?:[eE][-+]?\d+)?)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|([\p{L}_][\p{L}\p{N}_]*)|(&&|\|\||==|!=|<=|>=|[-+*/%<>!?:().,]))/uy;
function tokenize(src){
  const out=[];let i=0;
  for(;;){
    while(i<src.length&&/\s/.test(src[i]))i++;
    if(i>=src.length)break;
    TOKEN_RE.lastIndex=i;const m=TOKEN_RE.exec(src);
    if(!m)throw new Error(`"${src.slice(i,i+12)}"`);
    i=TOKEN_RE.lastIndex;

/* criação */
function findContainer(pt,excl){
  /* contêiner mais interno sob o ponto: subprocesso expandido ou pool */
  const skip=new Set(excl||[]);
  let best=null,bd=-1;
  for(const n of planeNodes()){
    if(!isContainer(n)||skip.has(n.id)||isHidden(n)||!inside(pt,n))continue;
    let d=0,p=parentOf(n);while(p){d++;p=parentOf(p)}
    if(n.kind==='sub')d+=1;
    if(d>bd){bd=d;best=n}
  }

}
const activityAtBorder=(pt,excl)=>{

};
const snap=v=>Math.round(v/GRID)*GRID;
function createAt(kind,pt,extra){

  if(isFlowNode(n)&&n.kind!=='start'&&n.kind!=='end'&&n.kind!=='boundary'){
    const e=planeEdges().find(x=>x.kind==='seq'&&distToPath(center(n),x.wp)<10&&connRule(byId(x.src),n).kind==='seq'&&connRule(n,byId(x.tgt)).kind==='seq');

/* teclado */
function onKey(ev){
  const tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||ev.target.isContentEditable)return;
  if(document.querySelector('dialog[open]'))return;
  if(UI.mode==='sim')return simKey(ev);
  const mod=ev.ctrlKey||ev.metaKey;
  if(mod&&ev.key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}
  if(mod&&ev.key.toLowerCase()==='y'){ev.preventDefault();redo();return}
  if(mod&&ev.key.toLowerCase()==='a'){ev.preventDefault();UI.sel=new Set(planeNodes().filter(n=>n.kind!=='lane'&&!isHidden(n)).map(n=>n.id));renderAll();refreshSide();return}
  if(mod&&ev.key.toLowerCase()==='c'){ev.preventDefault();copySel();return}
  if(mod&&ev.key.toLowerCase()==='x'){ev.preventDefault();if(copySel())removeIds([...UI.sel]);return}
  if(mod&&ev.key.toLowerCase()==='v'){ev.preventDefault();pasteClip();return}
  if(mod&&ev.key.toLowerCase()==='s'){ev.preventDefault();saveFile();return}
  if(ev.key==='Delete'||ev.key==='Backspace'){if(UI.sel.size){ev.preventDefault();removeIds([...UI.sel])}return}
  if(ev.key==='Escape'){if(UI.conn){UI.conn=null;renderAll()}else clearSel();return}
  if(ev.key==='F2'||(ev.key==='Enter'&&UI.sel.size===1)){const x=byId([...UI.sel][0]);if(x){ev.preventDefault();startRename(x)}return}
  if(ev.key===' '){UI.space=true;ev.preventDefault();return}
  if(ev.key.startsWith('Arrow')&&UI.sel.size){
    ev.preventDefault();
    const st=ev.shiftKey?GRID*2:GRID,dx=ev.key==='ArrowLeft'?-st:ev.key==='ArrowRight'?st:0,dy=ev.key==='ArrowUp'?-st:ev.key==='ArrowDown'?st:0;
    const set=new Set();const add=id=>{if(set.has(id))return;const n=byId(id);if(!n||n.src||n.kind==='lane')return;set.add(id);kidsOf(id).forEach(k=>add(k.id));boundariesOf(id).forEach(b=>add(b.id))};
    UI.sel.forEach(add);
    for(const id of set){const n=byId(id);n.x+=dx;n.y+=dy;if(n.label){n.label.x+=dx;n.label.y+=dy}}
    for(const e of D.model.edges){if(set.has(e.src)&&set.has(e.tgt)){e.wp.forEach(p=>{p.x+=dx;p.y+=dy});if(e.label){e.label.x+=dx;e.label.y+=dy}}else if(set.has(e.src)||set.has(e.tgt))rerouteEdge(e)}
    commit();return;
  }
  if(!mod&&ev.key==='+'){zoomAt(UI.view.k*1.2)}
  if(!mod&&ev.key==='-'){zoomAt(UI.view.k/1.2)}
}

function setEventType(n,type){

    const pool=allowedEvents(n).filter(x=>!['none','multiple','parallelMultiple','link','terminate','cancel','compensate'].includes(x));
    n.defs=cur.length>=2?cur:[newDef(pool[0]),newDef(pool[1]||pool[0])];
    if(type==='parallelMultiple'){n.parallelMultiple=true;n.defs=n.defs.filter(d=>['message','timer','conditional','signal'].includes(d.t));while(n.defs.length<2)n.defs.push(newDef(n.defs.length?'signal':'message'))}
  }else n.defs=[newDef(type)];
}
function newDef(t){const d={t};if(t==='timer'){d.kind='duration';d.value='PT1H'}if(t==='message'||t==='signal'||t==='error'||t==='escalation'||t==='link')d.name='';if(t==='error'||t==='escalation')d.code='';if(t==='conditional')d.cond='';if(t==='compensate'){d.activity='';d.wait=true}return d}
function morphActivity(n,val){

  if(k==='task'){n.kind='task';n.taskType=v;if(n.w>200||n.h>160){n.w=SIZES.task[0];n.h=SIZES.task[1]}delete n.variant;delete n.expanded}
  else if(k==='call'){n.kind='call';delete n.taskType;delete n.variant;delete n.expanded;if(n.w>200){n.w=SIZES.call[0];n.h=SIZES.call[1]}}
  else{
    const was=n.kind;n.kind='sub';delete n.taskType;n.variant=v;
    if(was!=='sub'){n.expanded=false;n.w=COLLAPSED[0];n.h=COLLAPSED[1]}
    if(v==='event'){
      /* subprocesso de evento não tem fluxos de sequência nem bordas (13.5.4) */
      const rem=edgesOf(n.id).filter(e=>e.kind==='seq').map(e=>e.id);D.model.edges=D.model.edges.filter(e=>!rem.includes(e.id));
      D.model.nodes=D.model.nodes.filter(b=>!(b.kind==='boundary'&&b.attachedTo===n.id));
      const st=kidsOf(n.id).find(x=>x.kind==='start');if(st&&evType(st)==='none')st.defs=[newDef('message')];
    }else{const st=kidsOf(n.id).find(x=>x.kind==='start');if(st){st.defs=[];st.isInterrupting=true}}

function validateModel(){

  const m=D.model;

        if(d.t==='conditional'&&d.cond&&compile(stripJuel(d.cond)).error)add('warning','v_expr',n,null,d.cond);
        if(d.t==='signal'&&!d.name)add('info','v_signalName',n,'10.5.5');
        if(d.t==='link'&&!d.name)add('warning','v_linkName',n,'10.5.5');

  const add=(mk,pred,via,done)=>{const k=key_(mk)+(done?'T':'');if(parent.has(k))return k;parent.set(k,{pred,via});queue.push({mk,k,done});stateList.push(k);return k};
  for(const i of initials){let mk=i.mk;if(i.extra){for(const id of i.extra){const x=byId(id);fired.add(id);for(const f of outs(id))if(flowIdx.has(f.id))mk=mk.slice(),mk[flowIdx.get(f.id)]++}}add(mk,null,i.from||null,false)}

    const msgOut=(this.graph.msgOut.get(n.id)||[]).filter(()=>!(n.kind==='task'&&n.taskType==='send'));
    if(msgOut.length)this.sendMessage(n,tok,'',msgOut);

    this.finishSimple(tok,n);

  finishSimple(tok,n){
    const out=this.graph.out(n.id);
    if(out.length<=1||!out.some(f=>f.cond||f.id===n.defaultFlow))return this.leave(tok,n,out);
    const sc=this.scripted(n,out);
    if(sc){this.note(n,sc,out);return this.leave(tok,n,sc)}
    if(this.o.manual)return this.askUser(tok,n,out);
    /* fluxos condicionais e padrão saindo de atividade */
    const dflt=out.find(f=>f.id===n.defaultFlow),r=[];
    for(const f of out)if(f!==dflt&&(!f.cond||condTrue(this.condValue(f,tok))))r.push(f);
    const flows=r.length?r:(dflt?[dflt]:[]);

  leaveActivity(tok,n,flows){this.leave(tok,n,flows)}
  /* ---- subprocessos ---- */
  startChild(tok,n,w){
    const parent=this.insts.get(tok.inst);
    let scope,starts,noStart;
    if(n.kind==='call'){const p=this.graph.processById(n.called);scope=p.key;starts=p.starts;noStart=p.noStartNodes}
    else{scope=n.id;const s=this.graph.scope(n.id);starts=s.starts;noStart=s.noStartNodes}
    const depth=this.scopeDepth(parent);
    if(depth>30){this.say('err',t('l_recursion',nameOf(n)),n.id,tok);this.errors++;return this.workerDone(tok,n,w)}
    const child=this.createInst(scope,parent.case,parent,tok,w.vars);

    }else for(const x of noStart){const tk=this.newToken(child.id,{at:x.id,phase:'enter'});this.ready.push(tk)}

  finishInst(inst){

    inst.done=true;inst.endT=this.t;
    for(const id of[...inst.subs])this.dropSub(id);
    if(inst.parent){
      const p=this.insts.get(inst.parent);if(p){p.kids.delete(inst.id);p.completedKids=(p.completedKids||[]);p.completedKids.push(inst.id)}
      const tok=inst.parentTok&&this.tokens.get(inst.parentTok);

        /* subprocesso de evento terminou */

        if(p)this.afterTokenGone(p);return;
      }
      if(tok&&inst.worker&&!inst.worker.dead&&tok.act){
        const n=byId(tok.at);this.say('act',t('l_subEnd',nameOf(n)),n.id,tok);
        this.workerDone(tok,n,inst.worker);
      }else if(p)this.afterTokenGone(p);

    }

  }
  caseCheck(cid){
    const c=this.cases.get(cid);if(!c||c.end!=null||c.pendingStarts>0)return;
    for(const id of c.roots){const i=this.insts.get(id);if(i&&!i.done)return}
    if(this.caseHasWork(cid))return;
    c.end=this.t;if(c.status==='running')c.status='ok';this.open.delete(cid);
    this.say('case',t('l_caseEnd',cid,fmtT(c.end-c.start)));

    for(const x of[...this.subs.values()])if(x.case===cid&&x.kind==='start')this.dropSub(x.id);
  }
  caseHasWork(cid){

  }
  /* ---- bordas e subprocessos de evento ---- */
  armBoundaries(tok,n){

          /* estes são resolvidos pela propagação; o registro permite o disparo manual */
          if(d.t==='compensate')continue;
          const sub=this.addSub({type:d.t,def:d,node:b,kind:'boundary',tok:tok.id,inst:tok.inst,case:this.insts.get(tok.inst).case,passive:true});
          tok.boundarySubs.push(sub.id);

          continue;
        }

  disarmBoundaries(tok){(tok.boundarySubs||[]).forEach(i=>{const x=this.subs.get(i);if(x)this.dropSub(i)});tok.boundarySubs=null}
  fireBoundary(sub){
    const b=sub.node,tok=this.tokens.get(sub.tok);
    if(!tok||!tok.act){this.dropSub(sub.id);return false}
    this.stat(b.id).count++;this.stat(b.id).done++;
    this.say('catch',t('l_boundary',nameOf(b),nameOf(byId(b.attachedTo))),b.id,tok);
    if(b.cancelActivity!==false){
      const host=byId(b.attachedTo);
      const records=[];
      for(const w of tok.act.workers)if(w.child){const c=this.insts.get(w.child);if(c)records.push(c)}
      this.disarmBoundaries(tok);
      this.cancelActivity(tok);

      if(hasDef(b,'error')&&records.length){

        tok.phase='comp';

      }
      this.leave(tok,b,this.graph.out(b.id));
    }else{
      /* não interrompe: nova ficha pelo fluxo do evento */
      const tk=this.newToken(tok.inst,{at:b.id});this.leave(tk,b,this.graph.out(b.id));
      if(sub.every&&(sub.times==null||--sub.times>0)&&tok.act)sub.timer=this.schedule(sub.every,()=>{if(!sub.dead)this.fire(sub,true)},'timer');
      else if(sub.type!=='message'&&sub.type!=='signal'&&sub.type!=='conditional'&&sub.type!=='escalation')this.dropSub(sub.id);

  cancelActivity(tok){

  cancelInst(inst){

  armEventSubs(inst){

      for(const d of st.defs||[]){

  fireEventSub(sub,payload){

      for(const id of[...inst.subs])this.dropSub(id);
      for(const k of[...inst.kids]){const c=this.insts.get(k);if(c&&!c.evsub)this.cancelInst(c)}
      for(const id of[...inst.live]){const tk=this.tokens.get(id);if(!tk)continue;this.disarmToken(tk);this.tokens.delete(id);inst.live.delete(id)}
      inst.joins.clear();
    }else if(!sub.every&&sub.type==='timer')this.dropSub(sub.id);
    this.say('catch',t('l_evsub',nameOf(es)),es.id,{inst:inst.id});

  /* ---- eventos de disparo ---- */
  throwEvent(tok,n){
    tok.phase='idle';this.stat(n.id).done++;
    this.applyEffects(n.effects,tok);
    const defs=n.defs||[];
    const msgOut=this.graph.msgOut.get(n.id)||[];
    const cont=()=>{
      if(n.kind==='end'){this.recordEnd(tok,n);this.say('end',t('l_end',nameOf(n)),n.id,tok);this.killToken(tok)}
      else this.leave(tok,n,this.graph.out(n.id));
    };
    let chain=defs.slice();
    const next=()=>{
      if(!chain.length)return cont();
      const d=chain.shift();
      switch(d.t){
        case'message':this.sendMessage(n,tok,d.name,msgOut);return next();
        case'signal':this.broadcastSignal(d.name,n,tok);return this.tokens.has(tok.id)?next():undefined;
        case'link':{
          const target=this.graph.linkTarget(n,d.name);
          if(!target){this.say('err',t('l_noLink',d.name||'—'),n.id,tok);this.errors++;this.killToken(tok);return}
          this.say('gw',t('l_link',d.name||'—'),n.id,tok);
          tok.at=target.id;this.moves.push({kind:'jump',from:n.id,to:target.id,tok:tok.id});
          this.stat(target.id).count++;this.stat(target.id).done++;
          return this.leave(tok,target,this.graph.out(target.id));
        }
        case'terminate':
          this.recordEnd(tok,n);this.say('end',t('l_terminate',nameOf(n)),n.id,tok);
          return this.terminate(this.insts.get(tok.inst));
        case'error':
          this.recordEnd(tok,n);
          return this.throwError(tok,n,d);
        case'escalation':{
          const caught=this.throwEscalation(tok,n,d);
          if(!this.tokens.has(tok.id))return;
          return next();
        }
        case'cancel':
          this.recordEnd(tok,n);
          return this.throwCancel(tok,n);
        case'compensate':{
          const inst=this.insts.get(tok.inst);
          const scopeInst=inst.evsub?this.insts.get(inst.parent):inst;
          let list=this.collectCompensable(scopeInst,d.activity);
          /* o manipulador de erro compensa também o que já concluiu no escopo acima */
          this.say('catch',t('l_compStart',list.length),n.id,tok);
          if(d.wait===false){this.runCompensations(list,tok,()=>{},true);return next()}
          tok.phase='comp';
          return this.runCompensations(list,tok,()=>{tok.phase='idle';next()});
        }

      }
    };

  }
  recordEnd(tok,n){const c=this.cases.get(this.insts.get(tok.inst).case);if(c)c.ends.push(n.id)}
  terminate(inst){

    for(const k of[...inst.kids]){const c=this.insts.get(k);if(c)this.cancelInst(c)}

  matchCode(h,d){if(!h.code&&!h.name)return true;return(h.code&&h.code===d.code)||(!h.code&&h.name&&h.name===d.name)}

      if(ptok&&ptok.act){

      if(es){this.fireEventSub({esNode:es.id,inst:inst.id,node:this.graph.scope(es.id).starts[0],type:'escalation'});return true}

  collectCompensable(inst,activity){
    const out=[];
    const walk=(i)=>{
      for(const r of i.completed.slice().reverse()){
        if(r.compDone)continue;
        if(activity&&r.node!==activity)continue;
        out.push(r);
      }
    };
    walk(inst);
    return out;
  }
  runCompensations(list,tok,done,detached){
    const queue=list.slice();
    const next=()=>{
      while(queue.length){
        const r=queue.shift();
        if(r.compDone)continue;
        r.compDone=true;
        const handler=this.graph.compHandler(r.node);
        if(handler){
          const inst=this.insts.get(tok.inst)||[...this.insts.values()][0];
          const tk=this.newToken(tok.inst,{at:handler.id,compCb:next,phase:'active'});
          this.say('act',t('l_comp',nameOf(byId(r.node)),nameOf(handler)),handler.id,tk);
          this.moves.push({kind:'node',id:handler.id,tok:tk.id});

        }
        /* subprocesso sem manipulador: compensação padrão do que está dentro */
        if(r.child){const c=this.insts.get(r.child);if(c)queue.unshift(...c.completed.slice().reverse())}

  /* ---- passo ---- */
  flushPost(){let guard=0;while(this.post&&this.post.length&&guard++<10000){const f=this.post.shift();f()}}
  settle(){
    /* condições, junções e pendências até estabilizar */
    let guard=0,any=true;
    while(any&&guard++<200){
      any=false;
      this.flushPost();
      if(this.tryJoins())any=true;
      if(this.checkConditions())any=true;
      this.flushPost();
    }
  }
  step(){
    this.moves=[];this.stepLog=[];this.lastKind=null;this.lastDt=0;this.step_++;
    if(this.done)return{kind:'done',moves:[]};
    this.ticks++;
    if(this.ticks>(this.o.maxTicks||2e6)||this.tokens.size>(this.o.maxTokens||20000)){this.limit=true;this.finish('limit');return{kind:'done',moves:[]}}
    this.settle();
    if(this.ready.length){
      /* passo a passo: uma ficha de cada vez */
      let batch;
      if(this.o.fine){while(this.ready.length&&!this.tokens.has(this.ready[0].id))this.ready.shift();batch=this.ready.splice(0,1)}
      else{batch=this.ready;this.ready=[]}
      for(const tok of batch){
        if(!this.tokens.has(tok.id))continue;
        if(tok.phase==='enter'){tok.phase='idle';this.enter(tok,byId(tok.at));continue}
        if(tok.flow)this.arrive(tok);
      }
      this.settle();
      for(const id of[...this.open])this.caseCheck(id);
      return{kind:'hop',moves:this.moves.slice()};
    }
    if(this.decisions.size){this.status='decide';return{kind:'decide',moves:[]}}
    while(this.timeline.length&&this.timeline[0].dead)this.timeline.shift();
    if(this.timeline.length){
      const at=this.timeline[0].at;
      if(this.o.horizon&&at>this.o.horizon){this.finish('horizon');return{kind:'done',moves:[]}}
      const dt=at-this.t;
      this.t=at;this.lastDt=dt;
      if(this.o.fine){const e=this.timeline.shift();e.fn()}
      else while(this.timeline.length&&this.timeline[0].at<=at){const e=this.timeline.shift();if(!e.dead)e.fn()}
      this.settle();
      for(const id of[...this.open])this.caseCheck(id);
      return{kind:'time',dt,moves:this.moves.slice()};
    }
    for(const id of[...this.open])this.caseCheck(id);
    if(this.settleAgain()){return{kind:'hop',moves:this.moves.slice()}}
    if(this.o.manual&&this.tokens.size&&[...this.subs.values()].some(x=>!x.dead&&x.kind!=='start')){this.status='waiting';return{kind:'waiting',moves:[]}}
    this.finish(this.tokens.size?'stuck':'done');
    return{kind:'done',moves:[]};
  }
  settleAgain(){this.settle();return this.ready.length>0}
  finish(reason){
    this.done=true;this.reason=reason;
    for(const r of this.res.values()){r.busyT+=r.busy*(this.t-r.last);r.last=this.t}
    if(reason==='stuck'){
      for(const c of this.cases.values())if(c.end==null){c.status='stuck';c.stuckAt=this.t}
      const where=[...new Set([...this.tokens.values()].map(k=>k.at).filter(Boolean))].map(i=>nameOf(byId(i)));
      this.say('err',t('l_stuck',where.join(', ')||'—'));
    }
  }
  /* disparo manual de um gatilho que aguarda (botão no painel "Aguardando") */
  manualFire(subId){const x=this.subs.get(subId);if(!x)return false;
    if(x.kind==='boundary'||x.kind==='catch')this.fired[x.node.id]={mode:'at',at:this.t-(x.armedAt??0)};
    if(x.passive&&x.kind==='boundary'){return this.fireBoundary(x)}
    return this.fire(x,true)}
}

function buildGraph(){

    if(n.kind==='task'&&n.taskType==='receive'&&n.message)msgCatchNames.add(n.message);
    if(n.kind==='throw'||n.kind==='end')for(const d of n.defs||[]){if(d.t==='message'&&d.name)msgThrowNames.add(d.name);if(d.t==='signal'&&d.name)signalThrowNames.add(d.name)}

    const nodes=m.nodes.filter(n=>scopeOf(n)===key&&isFlowNode(n));

    s={key,nodes,starts:nodes.filter(n=>n.kind==='start'),noStartNodes:inner.filter(n=>n.kind!=='start'&&n.kind!=='boundary'&&!(inMap.get(n.id)||[]).length&&!n.isForCompensation)};
    scopes.set(key,s);return s};
  const eventSubs=new Map();
  for(const n of m.nodes)if(n.kind==='sub'&&n.variant==='event'){const k=scopeOf(n);(eventSubs.get(k)||eventSubs.set(k,[]).get(k)).push(n)}

    processById:id=>all.find(p=>p.id===id&&p.nodes.length),
    linkTarget:(n,name)=>m.nodes.find(x=>x.kind==='catch'&&scopeOf(x)===scopeOf(n)&&(x.defs||[]).some(d=>d.t==='link'&&d.name===name)),
    compHandler(id){

      for(const es of kidsOf(id))if(es.kind==='sub'&&es.variant==='event'){const st=scope(es.id).starts[0];if(st&&hasDef(st,'compensate'))return es}

    reachFlows(from,gid){

}

function runBatch(cfg,onProgress,done){
  const sim=new Sim({seed:cfg.seed,noLog:true,batch:true,horizon:cfg.horizon||0,maxTicks:5e6,maxTokens:cfg.cases*40+2000,manual:false});
  if(!sim.graph.processes.length){done(null,'noProcess');return}
  const res={cases:cfg.cases};
  let created=0;
  const arrive=()=>{
    if(created>=cfg.cases)return;
    created++;sim.newCase();
    if(created<cfg.cases){const dt=num(sim.ev(cfg.arrival||'0'));sim.schedule(Math.max(0,dt),arrive,'arrival')}
  };
  sim.schedule(0,arrive,'arrival');
  const chunk=()=>{
    const until=performance.now()+25;
    while(!sim.done&&performance.now()<until){for(let i=0;i<200&&!sim.done;i++)sim.step()}
    if(sim.done){done(summarize(sim,cfg));return}
    if(onProgress)onProgress(created/cfg.cases);
    setTimeout(chunk,0);
  };
  if(cfg.sync){while(!sim.done)sim.step();return done(summarize(sim,cfg))}
  setTimeout(chunk,0);
}
function pct(sorted,p){if(!sorted.length)return 0;const i=(sorted.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo)}
function summarize(sim,cfg){
  const cases=[...sim.cases.values()],ok=cases.filter(c=>c.end!=null);
  const times=ok.map(c=>c.end-c.start).sort((a,b)=>a-b);
  const mean=times.length?times.reduce((a,b)=>a+b,0)/times.length:0;
  const ends={};for(const c of cases)for(const e of c.ends)ends[e]=(ends[e]||0)+1;
  const span=sim.t||1;
  const resources=[...sim.res.values()].map(r=>({id:r.id,name:byId(r.id).name,cap:r.cap,util:r.busyT/(r.cap*span),maxQ:r.maxQ,served:r.served,wait:r.served?r.wait/r.served:0}));
  const nodes=[...sim.nodeStat.entries()].filter(([id])=>isActivity(byId(id))).map(([id,x])=>({id,name:nameOf(byId(id)),count:x.count,done:x.done,work:x.done?x.work/x.done:0,wait:x.count?x.wait/x.count:0,cancelled:x.cancelled,maxQ:x.maxQ}));

}
