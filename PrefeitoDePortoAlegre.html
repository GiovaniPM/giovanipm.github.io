<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prefeito de Porto Alegre · Giovani Perotto Mesquita</title>
<meta name="description" content="Prefeito de Porto Alegre: jogo de construção de cidade com a geografia da capital gaúcha. Zoneie bairros, leve energia e água, cuide dos serviços, proteja a cidade das cheias do Guaíba, construa os marcos da cidade e dispute a reeleição. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#12303C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12303C; --panel: #FFF9EF; --panel-2: #F6EBD9; --ink: #27211C; --muted: #6B6055; --line: #E2D3BC;
    --accent: #C2471F; --accent-ink: #FFFFFF; --river: #1D5C70; --gold: #E9A23B; --ok: #1F7A4D; --danger: #B3261E; --warn: #9A6200;
    --r: #2E9E4A; --c: #2F6FC9; --i: #D99A22;
    --sans: "Hanken Grotesk", "Segoe UI", Arial, sans-serif; --serif: "Source Serif 4", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0C1F27; --panel: #1C2A30; --panel-2: #26363D; --ink: #F4EDE2; --muted: #AFA698; --line: #3A4B52; --accent: #E0653A; --ok: #55C48C; --danger: #F2837A; --warn: #E8B35A;
  } }
  :root[data-theme="dark"] { --bg: #0C1F27; --panel: #1C2A30; --panel-2: #26363D; --ink: #F4EDE2; --muted: #AFA698; --line: #3A4B52; --accent: #E0653A; --ok: #55C48C; --danger: #F2837A; --warn: #E8B35A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100dvh; }
  /* barra superior */
  .top { display: flex; align-items: center; gap: .5rem; padding: .4rem .6rem; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: .45rem; text-decoration: none; color: var(--ink); min-width: 0; }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .brand b { font-family: var(--serif); font-size: 1.05rem; white-space: nowrap; }
  .brand small { display: block; font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .stats { display: flex; gap: .35rem; flex-wrap: wrap; margin-left: auto; }
  .stat { display: flex; flex-direction: column; padding: .15rem .55rem; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; min-width: 76px; }
  .stat span { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat b { font-variant-numeric: tabular-nums; font-size: .95rem; white-space: nowrap; }
  .stat b.neg { color: var(--danger); }
  .speed { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .speed button { border: 0; background: var(--panel-2); padding: .35rem .6rem; min-width: 38px; }
  .speed button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .tb { display: flex; gap: .3rem; }
  .btn { display: inline-flex; align-items: center; gap: .35rem; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .35rem .65rem; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  select.btn { padding: .3rem .4rem; }
  .mob { display: none; }

  /* corpo */
  .main { display: grid; grid-template-columns: 236px minmax(0, 1fr) 280px; min-height: 0; position: relative; }
  .side { background: var(--panel); min-height: 0; overflow: auto; }
  .left { border-right: 1px solid var(--line); }
  .right { border-left: 1px solid var(--line); }
  .stitle { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: .8rem .75rem .35rem; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: .5rem .5rem 0; }
  .cat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .35rem .1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font-size: .66rem; line-height: 1.1; text-align: center; }
  .cat svg { width: 22px; height: 22px; }
  .cat[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); }
  .tools { list-style: none; margin: 0; padding: .25rem .5rem .75rem; display: grid; gap: 4px; }
  .tool { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: .45rem; width: 100%; text-align: left; padding: .35rem .45rem; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .tool canvas { width: 30px; height: 30px; border-radius: 5px; }
  .tool b { display: block; font-size: .86rem; font-weight: 600; line-height: 1.15; }
  .tool small { display: block; font-size: .72rem; color: var(--muted); }
  .tool .cost { font-size: .78rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .tool[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tool.locked { opacity: .55; }
  .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #2A6E8A; }
  #map, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fx { pointer-events: none; }
  .hud { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 4px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .hud button { border: 0; background: none; padding: .2rem .55rem; border-radius: 6px; }
  .hud button:hover { background: var(--panel-2); }
  .legend { position: absolute; right: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .45rem .6rem; font-size: .75rem; max-width: 240px; }
  .legend .bar { height: 10px; border-radius: 4px; margin: .3rem 0 .15rem; }
  .legend .ends { display: flex; justify-content: space-between; color: var(--muted); }
  .tip { position: absolute; pointer-events: none; background: rgba(20,24,28,.88); color: #fff; font-size: .78rem; padding: .3rem .5rem; border-radius: 6px; white-space: nowrap; transform: translate(14px, 14px); }
  .tip.bad { background: rgba(160,30,25,.92); }
  .alert { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--danger); color: #fff; padding: .45rem .9rem; border-radius: 20px; font-weight: 600; font-size: .85rem; box-shadow: 0 6px 18px rgba(0,0,0,.3); max-width: calc(100% - 20px); text-align: center; }
  .alert.info { background: var(--river); }

  /* painel direito */
  .box { margin: .5rem .6rem; padding: .6rem .7rem; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
  .box h3 { margin: 0 0 .35rem; font-size: .95rem; }
  .box p { margin: .25rem 0; font-size: .84rem; line-height: 1.4; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .15rem .6rem; font-size: .82rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .rci { display: flex; gap: 10px; align-items: flex-end; height: 74px; padding: 0 .3rem; }
  .rci div { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center; position: relative; }
  .rci .axis { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
  .rci i { position: absolute; width: 60%; left: 20%; border-radius: 3px; }
  .rci b { position: absolute; bottom: -18px; font-size: .78rem; }
  .meter { height: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--ok); }
  .news { list-style: none; margin: 0; padding: 0; font-size: .8rem; display: grid; gap: .3rem; max-height: 260px; overflow: auto; }
  .news li { padding-left: .55rem; border-left: 3px solid var(--line); line-height: 1.35; }
  .news li.bad { border-left-color: var(--danger); }
  .news li.good { border-left-color: var(--ok); }
  .news li time { display: block; font-size: .7rem; color: var(--muted); }

  /* rodapé */
  .ticker { display: flex; align-items: center; gap: .6rem; padding: .3rem .7rem; background: var(--panel); border-top: 1px solid var(--line); font-size: .85rem; min-width: 0; }
  .ticker b { color: var(--accent); white-space: nowrap; }
  .ticker span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* diálogos */
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; width: min(680px, calc(100vw - 20px)); max-height: calc(100dvh - 30px); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  dialog::backdrop { background: rgba(6,16,22,.55); }
  .dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 32px); }
  .dlg h2 { margin: 0; padding: .9rem 1.1rem .6rem; font-family: var(--serif); font-size: 1.3rem; border-bottom: 1px solid var(--line); }
  .dlg .body { padding: .8rem 1.1rem; overflow: auto; }
  .dlg .foot { display: flex; justify-content: flex-end; gap: .4rem; flex-wrap: wrap; padding: .7rem 1.1rem; border-top: 1px solid var(--line); }
  .dlg p, .dlg li { line-height: 1.5; font-size: .92rem; }
  .dlg ul, .dlg ol { padding-left: 1.2rem; }
  .row { display: grid; grid-template-columns: 1fr 140px 56px; align-items: center; gap: .6rem; margin: .45rem 0; font-size: .9rem; }
  .row input[type=range] { width: 100%; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  table.t { width: 100%; border-collapse: collapse; font-size: .86rem; margin: .4rem 0; }
  table.t td, table.t th { padding: .3rem .4rem; border-bottom: 1px solid var(--line); text-align: left; }
  table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  .ov { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .4rem; }
  .ov button { text-align: left; white-space: normal; line-height: 1.25; }
  .ov button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chart { width: 100%; height: 150px; display: block; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
  .chk { display: flex; gap: .5rem; align-items: center; margin: .4rem 0; }
  .field { display: grid; gap: .2rem; margin: .5rem 0; font-size: .9rem; }
  .field input { padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
  .excard { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; margin: .6rem 0; background: var(--panel-2); }
  .excard h3 { margin: 0 0 .2rem; } .excard p { margin: .2rem 0 .5rem; } .excard .exstats { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; }
  .kbd { font-size: .8em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 .3em; background: var(--panel-2); }

  @media (max-width: 1100px) { .main { grid-template-columns: 210px minmax(0, 1fr) 250px; } .brand small { display: none; } }
  @media (max-width: 860px) {
    .main { grid-template-columns: minmax(0, 1fr); }
    .side { position: absolute; top: 0; bottom: 0; z-index: 20; width: min(300px, 88vw); box-shadow: 0 0 30px rgba(0,0,0,.35); display: none; }
    .left { left: 0; } .right { right: 0; }
    body.show-left .left, body.show-right .right { display: block; }
    .mob { display: inline-flex; }
    .tb .lbl { display: none; }
    .stat { min-width: 0; padding: .1rem .4rem; }
    .stat span { font-size: .6rem; }
    .brand b { font-size: .9rem; }
    .legend { display: none; }
  }
  @media (max-width: 520px) { .brand div { display: none; } .stat.hide-s { display: none; } .top { gap: .25rem; padding: .3rem .35rem; } .speed button { min-width: 26px; padding: .3rem .3rem; font-size: .8rem; } #bHelp { display: none; } .tb .btn, .btn.mob { padding: .3rem .45rem; } .stat b { font-size: .85rem; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

  welcome_t: ['Bem-vindo ao Paço Municipal', 'Welcome to City Hall', 'Benvenuto in municipio', 'Bienvenido al Palacio Municipal'],
  welcome: ['<p>Você é o novo prefeito ou prefeita de uma Porto Alegre ainda por construir, entre o Guaíba, o delta do Jacuí, o Gravataí e os morros.</p><ol><li>Construa uma <b>usina</b> e uma <b>estação de tratamento de água</b> (Energia e água). Ligue os bairros com <b>linhas de transmissão</b> e <b>canos de água</b>.</li><li>Abra <b>ruas</b> a partir da Freeway, que já liga a cidade ao resto do estado.</li><li>Marque <b>zonas</b> residenciais, comerciais e industriais junto às ruas. As casas, lojas e fábricas aparecem sozinhas quando há demanda, luz e água.</li><li>Leve <b>serviços</b> aos bairros, cuide do caixa e prepare a cidade para as <b>cheias do Guaíba</b>.</li></ol><p>A eleição é em outubro, a cada quatro anos. Com mais de 50% de aprovação, você continua.</p>', '<p>You are the new mayor of a Porto Alegre yet to be built, between the Guaíba, the Jacuí delta, the Gravataí river and the hills.</p><ol><li>Build a <b>power plant</b> and a <b>water treatment plant</b> (Power & water). Link the neighborhoods with <b>power lines</b> and <b>water pipes</b>.</li><li>Open <b>roads</b> from the Freeway, which already links the city to the rest of the state.</li><li>Mark residential, commercial and industrial <b>zones</b> along the roads. Houses, shops and factories appear by themselves when there is demand, power and water.</li><li>Bring <b>services</b> to the neighborhoods, watch the treasury and prepare the city for the <b>Guaíba floods</b>.</li></ol><p>Elections are held in October every four years. With more than 50% approval, you stay.</p>', '<p>Sei il nuovo sindaco di una Porto Alegre ancora da costruire, tra il Guaíba, il delta del Jacuí, il Gravataí e le colline.</p><ol><li>Costruisci una <b>centrale elettrica</b> e un <b>impianto di trattamento dell\'acqua</b> (Energia e acqua). Collega i quartieri con <b>linee elettriche</b> e <b>tubature</b>.</li><li>Apri <b>strade</b> a partire dalla Freeway, che collega già la città al resto dello stato.</li><li>Segna <b>zone</b> residenziali, commerciali e industriali lungo le strade. Case, negozi e fabbriche compaiono da soli quando c\'è domanda, luce e acqua.</li><li>Porta i <b>servizi</b> nei quartieri, cura la cassa e prepara la città alle <b>piene del Guaíba</b>.</li></ol><p>Le elezioni sono a ottobre, ogni quattro anni. Con più del 50% di gradimento, resti in carica.</p>', '<p>Eres el nuevo alcalde o alcaldesa de una Porto Alegre aún por construir, entre el Guaíba, el delta del Jacuí, el Gravataí y los cerros.</p><ol><li>Construye una <b>central eléctrica</b> y una <b>planta de tratamiento de agua</b> (Energía y agua). Une los barrios con <b>líneas eléctricas</b> y <b>tuberías de agua</b>.</li><li>Abre <b>calles</b> desde la Freeway, que ya une la ciudad con el resto del estado.</li><li>Marca <b>zonas</b> residenciales, comerciales e industriales junto a las calles. Las casas, tiendas y fábricas aparecen solas cuando hay demanda, luz y agua.</li><li>Lleva <b>servicios</b> a los barrios, cuida la caja y prepara la ciudad para las <b>crecidas del Guaíba</b>.</li></ol><p>Las elecciones son en octubre, cada cuatro años. Con más del 50% de aprobación, sigues en el cargo.</p>'],
  help_t: ['Como jogar', 'How to play', 'Come si gioca', 'Cómo jugar'],
  help_body: [
`<h3>Construir</h3><ul><li>Escolha uma categoria e uma ferramenta à esquerda. Ruas, avenidas, trilhos e diques: arraste do início ao fim. Zonas e demolição: arraste um retângulo. Prédios: clique onde quer construir.</li><li>A pré-visualização mostra o custo; em vermelho, o motivo de não poder construir.</li><li>Ruas sobre a água viram pontes e custam mais.</li></ul>
<h3>Como a cidade cresce</h3><ul><li>Zonas precisam de rua a até três quadras, energia (linha de transmissão) e, para crescer além de casas, água (canos).</li><li>As barras R, C e I mostram a demanda por moradias, comércio e indústria. Zoneie o que estiver em alta.</li><li>Valor do solo alto (orla, parques, serviços, pouco crime e poluição) atrai prédios mais altos. Nos morros, só casas e sobrados.</li><li>Ligar as ruas à Freeway ou à ponte do Guaíba ajuda a indústria e o comércio.</li></ul>
<h3>Redes de energia e água</h3><ul><li>A energia sai da usina pelas <b>linhas de transmissão</b>. Construções encostadas passam a energia umas para as outras, e ela pula uma rua de um quarteirão para o vizinho, mas não corre ao longo das ruas: para chegar longe, puxe uma linha.</li><li>A água sai da estação de tratamento pelos <b>canos</b>, que ficam no subsolo e passam por baixo de ruas e prédios. Tudo a até 5 quadras de um cano abastecido recebe água.</li><li>Ao escolher a ferramenta de cano, ou o mapa <b>Rede de água</b>, aparece o subsolo. Nessa vista, <b>Demolir</b> remove só os canos.</li><li>Prédios sem energia mostram um raio amarelo; sem água, uma gota.</li></ul>
<h3>Serviços</h3><p>Polícia, bombeiros, saúde, escolas e lazer atendem um raio em volta. Veja em <b>Mapas</b> onde falta cobertura. O transporte coletivo (ônibus e Trensurb) reduz o trânsito.</p>
<h3>Cheias do Guaíba</h3><p>O Guaíba sobe no inverno e na primavera e, com chuvas fortes, pode invadir as partes baixas. <b>Diques</b> bloqueiam a água e, sobre as ruas, viram <b>comportas</b>; <b>casas de bombas</b> drenam as áreas alagadas por perto. O mapa <b>Risco de cheia</b> mostra o que está abaixo da cota de inundação.</p>
<h3>Dinheiro e eleição</h3><p>Ajuste impostos e verbas em <b>Orçamento</b>. Um ano inteiro com o caixa abaixo de −R$ 100 mil afasta o prefeito. Em outubro de cada quatro anos, você precisa de mais de 50% de aprovação.</p>
<h3>Teclas</h3><p><span class="kbd">Espaço</span> pausa, <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> velocidade, <span class="kbd">+</span> <span class="kbd">−</span> zoom, <span class="kbd">Esc</span> volta a “Ver”, <span class="kbd">B</span> demolir, <span class="kbd">R</span> rua. Com o mapa em foco, as setas movem o cursor e <span class="kbd">Enter</span> usa a ferramenta.</p>
<p>O jogo é salvo neste navegador a cada mês de jogo. Use <b>Jogo › Exportar</b> para guardar uma cópia em arquivo.</p>`,
`<h3>Building</h3><ul><li>Pick a category and a tool on the left. Roads, avenues, rails and dikes: drag from start to end. Zones and demolition: drag a rectangle. Buildings: click where you want them.</li><li>The preview shows the cost; in red, the reason you cannot build.</li><li>Roads over water become bridges and cost more.</li></ul>
<h3>How the city grows</h3><ul><li>Zones need a road within three tiles, power (power lines) and, to grow beyond houses, water (pipes).</li><li>The R, C and I bars show demand for housing, commerce and industry. Zone what is in demand.</li><li>High land value (waterfront, parks, services, little crime and pollution) attracts taller buildings. On hills, only houses and townhouses.</li><li>Linking roads to the Freeway or the Guaíba bridge helps industry and commerce.</li></ul>
<h3>Power and water networks</h3><ul><li>Power leaves the plant through <b>power lines</b>. Buildings that touch pass power to each other, and it hops one street from a block to the next, but it does not run along streets: to reach far, run a line.</li><li>Water leaves the treatment plant through <b>pipes</b>, which lie underground and run under roads and buildings. Everything within 5 tiles of a supplied pipe gets water.</li><li>Choosing the pipe tool, or the <b>Water network</b> map, shows the underground. In that view, <b>Demolish</b> removes only pipes.</li><li>Buildings without power show a yellow bolt; without water, a drop.</li></ul>
<h3>Services</h3><p>Police, fire, health, schools and leisure serve a radius around them. See in <b>Maps</b> where coverage is missing. Public transport (bus and Trensurb) reduces traffic.</p>
<h3>Guaíba floods</h3><p>The Guaíba rises in winter and spring and, with heavy rain, can invade the low areas. <b>Dikes</b> block the water and, over roads, become <b>flood gates</b>; <b>pumping stations</b> drain flooded areas nearby. The <b>Flood risk</b> map shows what lies below the flood level.</p>
<h3>Money and elections</h3><p>Set taxes and funding in <b>Budget</b>. A whole year with the treasury below −R$ 100k removes the mayor. In October every four years, you need more than 50% approval.</p>
<h3>Keys</h3><p><span class="kbd">Space</span> pauses, <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> speed, <span class="kbd">+</span> <span class="kbd">−</span> zoom, <span class="kbd">Esc</span> back to “Inspect”, <span class="kbd">B</span> demolish, <span class="kbd">R</span> road. With the map focused, arrows move the cursor and <span class="kbd">Enter</span> uses the tool.</p>
<p>The game is saved in this browser every game month. Use <b>Game › Export</b> to keep a copy in a file.</p>`,
`<h3>Costruire</h3><ul><li>Scegli una categoria e uno strumento a sinistra. Strade, viali, binari e argini: trascina dall'inizio alla fine. Zone e demolizione: trascina un rettangolo. Edifici: fai clic dove li vuoi.</li><li>L'anteprima mostra il costo; in rosso, il motivo per cui non si può costruire.</li><li>Le strade sull'acqua diventano ponti e costano di più.</li></ul>
<h3>Come cresce la città</h3><ul><li>Le zone hanno bisogno di una strada entro tre caselle, di energia (linee elettriche) e, per andare oltre le case, di acqua (tubature).</li><li>Le barre R, C e I mostrano la domanda di abitazioni, commercio e industria. Zona ciò che è richiesto.</li><li>Un valore del suolo alto (lungolago, parchi, servizi, poca criminalità e inquinamento) attira edifici più alti. Sulle colline, solo case e villette.</li><li>Collegare le strade alla Freeway o al ponte del Guaíba aiuta industria e commercio.</li></ul>
<h3>Reti di energia e acqua</h3><ul><li>L'energia esce dalla centrale lungo le <b>linee elettriche</b>. Gli edifici che si toccano si passano l'energia, che salta una strada da un isolato al successivo, ma non corre lungo le strade: per arrivare lontano, porta una linea.</li><li>L'acqua esce dall'impianto di trattamento lungo le <b>tubature</b>, che stanno nel sottosuolo e passano sotto strade ed edifici. Tutto entro 5 caselle da una tubatura alimentata riceve acqua.</li><li>Scegliendo lo strumento tubatura, o la mappa <b>Rete idrica</b>, appare il sottosuolo. In questa vista, <b>Demolisci</b> rimuove solo le tubature.</li><li>Gli edifici senza energia mostrano un fulmine giallo; senza acqua, una goccia.</li></ul>
<h3>Servizi</h3><p>Polizia, pompieri, salute, scuole e svago servono un raggio intorno. Guarda in <b>Mappe</b> dove manca copertura. Il trasporto pubblico (autobus e Trensurb) riduce il traffico.</p>
<h3>Piene del Guaíba</h3><p>Il Guaíba sale in inverno e in primavera e, con piogge forti, può invadere le zone basse. Gli <b>argini</b> bloccano l'acqua e, sulle strade, diventano <b>paratoie</b>; le <b>idrovore</b> drenano le aree allagate vicine. La mappa <b>Rischio di piena</b> mostra ciò che sta sotto la quota di inondazione.</p>
<h3>Soldi ed elezioni</h3><p>Regola tasse e fondi in <b>Bilancio</b>. Un anno intero con la cassa sotto −R$ 100 mila fa rimuovere il sindaco. A ottobre, ogni quattro anni, serve più del 50% di gradimento.</p>
<h3>Tasti</h3><p><span class="kbd">Spazio</span> pausa, <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> velocità, <span class="kbd">+</span> <span class="kbd">−</span> zoom, <span class="kbd">Esc</span> torna a “Vedi”, <span class="kbd">B</span> demolisci, <span class="kbd">R</span> strada. Con la mappa attiva, le frecce muovono il cursore e <span class="kbd">Invio</span> usa lo strumento.</p>
<p>La partita viene salvata in questo browser a ogni mese di gioco. Usa <b>Gioco › Esporta</b> per conservarne una copia in un file.</p>`,
`<h3>Construir</h3><ul><li>Elige una categoría y una herramienta a la izquierda. Calles, avenidas, vías y diques: arrastra del inicio al final. Zonas y demolición: arrastra un rectángulo. Edificios: haz clic donde los quieras.</li><li>La vista previa muestra el costo; en rojo, el motivo por el que no se puede construir.</li><li>Las calles sobre el agua se convierten en puentes y cuestan más.</li></ul>
<h3>Cómo crece la ciudad</h3><ul><li>Las zonas necesitan una calle a menos de tres casillas, energía (líneas eléctricas) y, para crecer más allá de casas, agua (tuberías).</li><li>Las barras R, C e I muestran la demanda de viviendas, comercio e industria. Zonifica lo que esté en alta.</li><li>Un valor del suelo alto (costanera, parques, servicios, poca criminalidad y contaminación) atrae edificios más altos. En los cerros, solo casas y adosados.</li><li>Unir las calles a la Freeway o al puente del Guaíba ayuda a la industria y al comercio.</li></ul>
<h3>Redes de energía y agua</h3><ul><li>La energía sale de la central por las <b>líneas eléctricas</b>. Los edificios que se tocan se pasan la energía, y esta salta una calle de una manzana a la siguiente, pero no corre a lo largo de las calles: para llegar lejos, tiende una línea.</li><li>El agua sale de la planta de tratamiento por las <b>tuberías</b>, que van bajo tierra y pasan por debajo de calles y edificios. Todo a menos de 5 casillas de una tubería abastecida recibe agua.</li><li>Al elegir la herramienta de tubería, o el mapa <b>Red de agua</b>, aparece el subsuelo. En esa vista, <b>Demoler</b> quita solo las tuberías.</li><li>Los edificios sin energía muestran un rayo amarillo; sin agua, una gota.</li></ul>
<h3>Servicios</h3><p>Policía, bomberos, salud, escuelas y ocio atienden un radio a su alrededor. Mira en <b>Mapas</b> dónde falta cobertura. El transporte público (autobús y Trensurb) reduce el tráfico.</p>
<h3>Crecidas del Guaíba</h3><p>El Guaíba sube en invierno y primavera y, con lluvias fuertes, puede invadir las zonas bajas. Los <b>diques</b> bloquean el agua y, sobre las calles, se vuelven <b>compuertas</b>; las <b>estaciones de bombeo</b> drenan las zonas inundadas cercanas. El mapa <b>Riesgo de crecida</b> muestra lo que queda bajo la cota de inundación.</p>
<h3>Dinero y elecciones</h3><p>Ajusta impuestos y fondos en <b>Presupuesto</b>. Un año entero con la caja por debajo de −R$ 100 mil destituye al alcalde. En octubre, cada cuatro años, necesitas más del 50% de aprobación.</p>
<h3>Teclas</h3><p><span class="kbd">Espacio</span> pausa, <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> velocidad, <span class="kbd">+</span> <span class="kbd">−</span> zoom, <span class="kbd">Esc</span> vuelve a “Ver”, <span class="kbd">B</span> demoler, <span class="kbd">R</span> calle. Con el mapa enfocado, las flechas mueven el cursor e <span class="kbd">Intro</span> usa la herramienta.</p>
<p>La partida se guarda en este navegador cada mes de juego. Usa <b>Juego › Exportar</b> para guardar una copia en un archivo.</p>`],

    w.append(el('div', { class: 'excard' }, el('h3', { text: t('ex_' + k) }), el('p', { text: t('exi_' + k) }), el('p', { class: 'exstats', text: t('ex_stats', fmtN(ex.pop), ex.appr, fmtR(ex.bal), fmtR(ex.cash), t('months')[ex.month % 12] + ' ' + yearOf(ex.month)) }), b));

function startNew(seed) { newGame(seed, { disasters: G ? G.disasters : true, elections: G ? G.elections : true }); selTile = null; setTool('query'); fitAll(); cam.z = clamp(cam.z * 2.2, 4, 64); cam.x = shoreX[30] + 18; cam.y = 22; clampCam(); renderAll(); saveGame(); speed = 1; }
onEnd = (kind2, votes) => {
  const yrs = Math.max(1, Math.round(G.month / 12)), T = STAT.T || totals();
  if (kind2 === 'won') { dialog(t('el_title', yearOf()), `<p>${t('el_won', votes)}</p>`, [[t('cont'), 'primary']]); return; }
  G.over = true; speed = 0;
  const text = kind2 === 'lost' ? t('el_lost', votes) : t('bk_text', fmtR(-100000));
  const title = kind2 === 'lost' ? t('el_title', yearOf()) : t('bk_title');

};
$('#bBudget').addEventListener('click', budgetDialog);
$('#bMaps').addEventListener('click', mapsDialog);
$('#bReport').addEventListener('click', reportDialog);
$('#bMenu').addEventListener('click', menuDialog);
$('#bHelp').addEventListener('click', () => dialog(t('help_t'), t('help_body'), [[t('close'), 'primary']]));
/* ---------- salvar e carregar ---------- */
const b64 = a => { const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s, T) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); };
function snapshot() {
  return { app: 'prefeitopoa', v: 1, G, S: S.map(s => s ? [s.t, s.x, s.y, s.s] : null), ter: b64(ter), elev: b64(elev), tree: b64(tree), kind: b64(kind), rail: b64(rail), lvl: b64(lvl), pop: b64(pop), flg: b64(flg), age: b64(age), lv: b64(Uint8Array.from(lv, v => Math.round(v))), traf: b64(Uint8Array.from(traf, v => Math.round(v))), dw: b64(dw), hsh: b64(hsh), pline: b64(pline), pipe: b64(pipe), gate: b64(gate), shoreX: Array.from(shoreX, v => Math.round(v * 100) / 100) };
}
function restore(d) {
  if (!d || d.app !== 'prefeitopoa' || !d.G || !d.ter) throw new Error('bad');
  alloc();
  ter = unb64(d.ter, Uint8Array); elev = unb64(d.elev, Uint8Array); tree = unb64(d.tree, Uint8Array); kind = unb64(d.kind, Uint8Array); rail = unb64(d.rail, Uint8Array); lvl = unb64(d.lvl, Uint8Array);
  pop = unb64(d.pop, Uint16Array); flg = unb64(d.flg, Uint8Array); age = unb64(d.age, Uint8Array); dw = unb64(d.dw, Uint8Array); hsh = unb64(d.hsh, Uint8Array);
  // jogos salvos antes das redes: linha e cano sob todas as ruas, para a cidade continuar ligada
  if (d.pline && d.pipe) { pline = unb64(d.pline, Uint8Array); pipe = unb64(d.pipe, Uint8Array); } else for (let i = 0; i < NN; i++) if (isRoad(kind[i])) { pline[i] = 1; pipe[i] = 1; }
  if (d.gate) gate = unb64(d.gate, Uint8Array);
  const lv8 = unb64(d.lv, Uint8Array), tr8 = unb64(d.traf, Uint8Array); for (let i = 0; i < NN; i++) { lv[i] = lv8[i]; traf[i] = tr8[i]; }
  if ([ter, elev, kind, pop].some(a => a.length !== NN)) throw new Error('size');
  shoreX = Float32Array.from(d.shoreX); G = d.G; S = [];
  for (const s of d.S) { if (!s || !TOOLS[s[0]]) { S.push(null); continue; } S.push({ t: s[0], x: s[1], y: s[2], s: s[3], pw: false, wt: false, fl: false }); }
  sid.fill(0); S.forEach((s, k) => { if (s) for (let y = s.y; y < s.y + s.s; y++) for (let x = s.x; x < s.x + s.s; x++) sid[idx(x, y)] = k + 1; });
  for (const st of S) if (st) st.fl = !!(flg[idx(st.x, st.y)] & F_FLOOD);
  recalc(true); STAT.T = totals();
}
function saveGame() { return store.set('save', snapshot()); }
function exportGame() { const blob = new Blob([JSON.stringify(snapshot())], { type: 'application/json' }); const a = el('a', { href: URL.createObjectURL(blob), download: 'porto-alegre-' + yearOf() + '.json' }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
$('#fileIn').addEventListener('change', async () => { const f = $('#fileIn').files[0]; $('#fileIn').value = ''; if (!f) return; try { restore(JSON.parse(await f.text())); renderAll(); saveGame(); $('#dlg').open && $('#dlg').close(); showAlert(t('m_loaded'), true); } catch { showAlert(t('m_badFile'), false); } });
window.addEventListener('pagehide', () => { if (G) saveGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G) saveGame(); });
/* ---------- idioma, tema e laço ---------- */
function setLang(i) { LANG = i >= 0 ? i : 0; store.set('lang', LANGS[LANG]); history.replaceState(null, '', LANG ? '#' + LANGS[LANG] : location.pathname + location.search); renderAll(); }
function applyTheme() { const v = store.get('theme', 'auto'); if (v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; }
function renderAll() { applyI18n(); renderCats(); renderTools(); renderStats(); renderNews(); renderInfo(); needStatic = true; }
let acc = 0, lastT = performance.now(), monthsSinceSave = 0;
function loop(now) {
  const dt = Math.min(1000, now - lastT); lastT = now;
  if (speed && !G.over && !$('#dlg').open) { acc += dt; if (acc >= SPEED_MS[speed]) { acc = 0; simMonth(); renderStats(); renderNews(); if (selTile || tool !== 'query') renderInfo(); if (++monthsSinceSave >= 3) { saveGame(); monthsSinceSave = 0; } if (G.news[0] && G.news[0].m === G.month) renderTools(); } }
  if (needStatic) drawStatic();
  drawFx(now);
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { resize(); });
window.addEventListener('hashchange', () => { const i = LANGS.indexOf(location.hash.slice(1)); if (i >= 0 && i !== LANG) { LANG = i; renderAll(); } });
(function init() {
  const h = LANGS.indexOf(location.hash.slice(1)), s = LANGS.indexOf(store.get('lang', '')), n = LANGS.indexOf((navigator.language || 'pt').slice(0, 2).toLowerCase());
  LANG = h >= 0 ? h : s >= 0 ? s : n >= 0 ? n : 0;
  applyTheme(); resize();
  let loaded = false; const sv = store.get('save', null);
  if (sv) { try { restore(sv); loaded = true; } catch { loaded = false; } }
  if (!loaded) { newGame(Math.floor(Math.random() * 99999) + 1); }
  fitAll(); if (!loaded) { cam.z = clamp(cam.z * 2.2, 4, 64); cam.x = shoreX[30] + 18; cam.y = 22; clampCam(); }
  setTool('query'); renderAll();
  if (!loaded) dialog(t('welcome_t'), t('welcome'), [[t('help'), '', () => { setTimeout(() => $('#bHelp').click(), 0); }], [t('ex_btn'), '', () => { setTimeout(() => examplesDialog(true), 0); }], [t('start'), 'primary']]);
  requestAnimationFrame(loop);
