      en: { goal: 'Objective', goalT: 'The Axis (Germany and Japan) wins by holding 10 of the 15 victory cities at the end of a round. The Allies (Soviet Union, United Kingdom and United States) win by holding Berlin and Tokyo. With a round limit, at the end of the last round the Axis wins with 8 cities or more; otherwise the Allies win.', turn: 'Each power’s turn', turnL: ['<b>Purchases:</b> spend accumulated production on units.', '<b>Combat move:</b> send units into enemy territories and seas. Infantry and artillery move 1, tanks 2; they only pass through friendly territory without enemies.', '<b>Battles:</b> each unit rolls a die and hits on its attack (or defence) value or less. Each hit removes one unit on the other side, cheapest first; a battleship takes two hits. Rounds go on until one side is gone or the attacker retreats.', '<b>Free move:</b> units that did not fight go to friendly places. Aircraft land by themselves at the nearest friendly place within range; with nowhere to land, they are lost.', '<b>Mobilisation:</b> purchased units appear at factories (up to the territory’s production, at least 2); ships appear in the sea next to a coastal factory. Then the power collects the production of the territories it controls, if it still holds its capital.'], units: 'Units', sea: 'Sea, transports and landings', seaL: ['A land unit boards by moving from a coastal territory into the neighbouring sea, if one of your transports has room (2 per transport). The transport carries its cargo when it moves.', 'Cargo unloads into a territory next to the sea: if it is an enemy one, it is a landing, with no retreat, and battleships in that sea bombard the coast in the first round.', 'Enemy warships block passage. The Suez and Panama canals only let through whoever controls Egypt and Mexico.'], other: 'Other rules', otherL: ['Taking an enemy capital seizes its stored production. An ally’s territory taken from the enemy goes back to the ally.', 'Submarines fire first in the ione accumulata. Un territorio alleato strappato al nemico torna all’alleato.', 'I sommergibili sparano per primi nel primo round se il nemico non ha cacciatorpediniere, e non colpiscono aerei; gli aerei colpiscono i sommergibili solo se la loro parte ha un cacciatorpediniere.', 'I paesi neutrali (tratteggiati) non si possono attraversare.'], hist: 'Sul gioco', histT: 'Gioco di strategia del genere guerra mondiale, con regole, valori e mappa propri, senza legami con alcun gioco da tavolo. La posizione iniziale ricorda la primavera del 1942, semplificata: territori, produzioni ed eserciti sono del gioco, non cifre storiche. Contorni della mappa: Natural Earth (pubblico dominio).', col: ['Unità', 'Costo', 'Attacco', 'Difesa', 'Movimento', 'Nota'] },

itorio de un aliado tomado al enemigo vuelve al aliado.', 'Los submarinos disparan primero en la primera ronda si el enemigo no tiene destructor, y no alcanzan aviones; los aviones solo alcanzan submarinos si su lado tiene un destructor.', 'Los países neutrales (rayados) no se pueden cruzar.'], hist: 'Sobre el juego', histT: 'Juego de estrategia del género de guerra mundial, con reglas, valores y mapa propios, sin relación con ningún juego de mesa. La posición inicial recuerda la primavera de 1942, simplificada: territorios, producciones y ejércitos son del juego, no cifras históricas. Contornos del mapa: Natural Earth (dominio público).', col: ['Unidad', 'Costo', 'Ataque', 'Defensa', 'Movimiento', 'Nota'] },

    const r = rng(11); for (let k = 0; k < 14; k++) { g.fillStyle = `rgba(30,25,20,${0.15 + r() * 0.2})`; const x = r() * w, y = 30 + r() * 80; for (let j = 0; j < 5; j++) { circle(g, x + j * 22, y + Math.sin(j) * 6, 16 + r() * 12); g.fill(); } }
    g.fillStyle = '#3c3a2c'; g.beginPath(); g.moveTo(0, 170); for (let x = 0; x <= w; x += 20) g.lineTo(x, 160 - Math.sin(x / 80) * 14 - r() * 8); g.lineTo(w, h); g.lineTo(0, h); g.fill();
    g.fillStyle = '#26261d'; g.fillRect(0, 196, w, 40);
    const put = (tp, p, x, y, s, flip) => g.drawImage(icon(tp, p, s, flip), x, y, s, s * 0.6);
    put('bmb', 'usa', 60, 18, 120); put('ftr', 'uk', 220, 40, 80); put('ftr', 'sov', 520, 30, 80, true); put('bmb', 'ger', 610, 60, 110, true);
    put('arm', 'sov', 40, 150, 150); put('inf', 'usa', 200, 160, 110); put('art', 'uk', 300, 168, 100); put('arm', 'ger', 560, 150, 150, true); put('inf', 'jap', 470, 160, 110, true);
    for (let k = 0; k < 18; k++) { const gr = g.createRadialGradient(380 + (r() - 0.5) * 120, 150 + (r() - 0.5) * 40, 0, 380, 150, 70); gr.addColorStop(0, 'rgba(255,200,90,.08)'); gr.addColorStop(1, 'rgba(255,120,40,0)'); g.fillStyle = gr; g.fillRect(250, 80, 260, 140); }
  }
  function startGame() {
    const players = {}; POW.forEach((p) => { players[p] = { kind: seats[p] }; });
    const rounds = +$('roundsSel').value;
    savePref({ seats, rounds });
    S = E.newGame({ players, opts: { rounds }, seed: (Math.random() * 2147483647) | 0 });
    enter(true);
  }
  function enter(fresh) {
    $('ovTitle').hidden = true; $('app').hidden = false;
    if (!TEX) TEX = buildTerrain(1.6);
    resize();
    const first = POW.find((p) => isHuman(p));
    if (fresh || true) { view.z = Math.max(zMin(), Math.min(1.1, cw / 1100)); centerOn(E.CAPITAL[first || 'ger']); }
    selNode = null; S.fx = []; save(); render();
    if (S.phase === 'over') { showEnd(); return; }
    if (isHuman(E.turnPower(S)) && S.phase === 'buy') openBuy();
    if (isHuman(E.turnPower(S)) && S.phase === 'battle' && S.battle && !S.battle.over) { battleScene(S.battle.n, S.battle.p); renderBattle(); }
    schedule();
  }
  function showMenu() {
    clearTimeout(aiTimer); busy = false;
    if (S) save();
    ['dEnd', 'dBuy', 'dBattle', 'dRules'].forEach((id) => { if ($(id).open) $(id).close(); });
    battleUI = null;
    $('app').hidden = true; $('ovTitle').hidden = false;
    refreshResume();
  }
  function refreshResume() { const g = Store.get('frentes.game'); $('bResume').hidden = !(g && g.v === 1 && g.phase !== 'over'); }
  const savePref = (o) => Store.set('frentes.prefs', Object.assign({}, Store.get('frentes.prefs') || {}, o));
  function applyTheme() { if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); const l = t(theme === 'light' ? 'themeLight' : theme === 'dark' ? 'themeDark' : 'themeAuto'); $('bTheme').textContent = l; $('bTheme2').textContent = l; }
  function applyToggles() { $('bSound').textContent = t(soundOn ? 'soundOn' : 'soundOff'); $('bSpeed').textContent = t(fast ? 'speedF' : 'speedN'); $('bWatch').textContent = t(watch ? 'watchOn' : 'watchOff'); }
  function applyLang() {
    document.documentElement.lang = { pt: 'pt-BR', en: 'en', it: 'it', es: 'es' }[lang];
    document.title = t('title') + ' · Giovani Perotto Mesquita';
    $('ttl').textContent = t('title');
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('rulesBody').innerHTML = rulesHtml();
    $('langSel').value = lang;
    $('backLink').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    renderSeats(); applyToggles(); applyTheme(); heroArt();
    if (S && !$('app').hidden) { render(); if ($('dBuy').open) openBuy(); if ($('dBattle').open) renderBattle(); if ($('dEnd').open) showEnd(); }
  }
  $('bPlay').addEventListener('click', () => { audio(); startGame(); });
  $('bResume').addEventListener('click', () => { audio(); const g = Store.get('frentes.game'); if (g && g.v === 1 && g.phase !== 'over') { S = g; enter(false); } });
  const openRules = () => { $('dRules').showModal(); $('dRules').scrollTop = 0; };
  $('bRules').addEventListener('click', openRules); $('bRules2').addEventListener('click', openRules);
  $('bRulesClose').addEventListener('click', () => $('dRules').close());
  $('bMenu').addEventListener('click', showMenu);
  $('bSound').addEventListener('click', () => { soundOn = !soundOn; savePref({ sound: soundOn }); applyToggles(); });
  $('bSpeed').addEventListener('click', () => { fast = !fast; savePref({ fast }); applyToggles(); });
  $('bWatch').addEventListener('click', () => { watch = !watch; savePref({ watch }); applyToggles(); });
  const cycleTheme = () => { theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto'; savePref({ theme }); applyTheme(); };
  $('bTheme').addEventListener('click', cycleTheme); $('bTheme2').addEventListener('click', cycleTheme);
  $('langSel').addEventListener('change', () => { lang = $('langSel').value; savePref({ lang }); applyLang(); });
  window.addEventListener('resize', () => { if (S && !$('app').hidden) resize(); });
  setInterval(() => { if (S && !$('app').hidden && S.phase === 'battle' && !anim) { pulse += 0.5; draw(); } }, 250);

  // ---------------------------------------------------------------- início
  const prefs = Store.get('frentes.prefs') || {};
  const hl = location.hash.slice(1), nl = ((navigator.language || 'pt').slice(0, 2)).toLowerCase(), LANGS = ['pt', 'en', 'it', 'es'];
  lang = LANGS.includes(hl) ? hl : LANGS.includes(prefs.lang) ? prefs.lang : LANGS.includes(nl) ? nl : 'pt';
  soundOn = prefs.sound !== false; fast = !!prefs.fast; watch = prefs.watch !== false; theme = ['light', 'dark'].includes(prefs.theme) ? prefs.theme : 'auto';
  if (prefs.seats) POW.forEach((p) => { const v = prefs.seats[p]; if (v === 'human' || [0, 1, 2].includes(v)) seats[p] = v; });
  $('roundsSel').value = String(prefs.rounds != null ? prefs.rounds : 15);
  applyLang(); refreshResume();
  window.__fg = { get S() { return S; }, set S(v) { S = v; }, E, dispatch, centerOn, view, draw, nodeAt, screenOf: (i) => screenOf(NODES[i].x, NODES[i].y) };
})();
