<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Jogo da forca · Giovani Perotto Mesquita</title>
<meta name="description" content="Jogo da forca com 3.000 substantivos de 8 letras ou mais em cada idioma (português, inglês, italiano e espanhol), em 17 temas. Teclado na tela e físico, dica, estatísticas e semente para repetir a palavra. Interface em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<style>
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --surface-2:#FBF1E3; --ink:#2B1B3D; --text:#3E3350; --muted:#756986; --line:#F1E2CF;
  --accent:#0E8074; --accent-ink:#FFFFFF; --accent-soft:#E2F6F2; --gold:#FFB703; --gold-ink:#B35300; --gold-soft:#FFF1C9;
  --good:#0E8074; --good-soft:#D7F2EC; --bad:#B3261E; --bad-soft:#FBE0DD; --rope:#8A5A2B; --wood:#5B2A86;
  --sky:radial-gradient(circle at 18% 16%,#FFF6D8 0 22px,rgba(255,236,180,.55) 34px,transparent 70px),linear-gradient(180deg,#9ECDF0 0%,#CFE6F5 55%,#FFF1DC 100%);
  --tile-a:#6B3FA0; --tile-b:#4B2775; --tile-edge:#2E1650; --face-a:#FFFFFF; --face-b:#F4EADB; --key-a:#FFFFFF; --key-b:#F3E7D6; --key-edge:#D9C6AE;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif; --serif:Georgia,"Times New Roman",serif; --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#1A1328; --surface:#241A36; --surface-2:#2D2244; --ink:#F7F0FF; --text:#E2D8F0; --muted:#A898C0; --line:#3A2D52;
  --accent:#5FD3C4; --accent-ink:#10231F; --accent-soft:#1D3A38; --gold:#FFC94D; --gold-ink:#FFC94D; --gold-soft:#3A2E12;
  --good:#5FD3C4; --good-soft:#17423D; --bad:#FF8A80; --bad-soft:#4A1E24; --rope:#E0B07A; --wood:#C9A7F5;
  --sky:radial-gradient(circle at 80% 15%,#F4F1E6 0 16px,rgba(230,230,255,.35) 26px,transparent 60px),radial-gradient(1px 1px at 22% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 62% 26%,#fff,transparent),radial-gradient(1px 1px at 12% 52%,#fff,transparent),radial-gradient(1px 1px at 90% 44%,#fff,transparent),linear-gradient(180deg,#070B22 0%,#1B1840 55%,#3A2856 100%);
  --tile-a:#3D2A63; --tile-b:#2A1C47; --tile-edge:#120A22; --face-a:#3A2D55; --face-b:#2D2244; --key-a:#33284B; --key-b:#2A2040; --key-edge:#150E24;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand h1{font-family:var(--serif);font-size:1.35rem;margin:0;color:var(--ink);line-height:1.1}
.brand p{margin:0;font-size:.82rem;color:var(--muted)}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.45rem .8rem;min-height:40px;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
select,input[type="text"]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem .5rem;min-height:40px;color:var(--ink);max-width:100%}
.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr);gap:1rem;max-width:1180px;margin:0 auto;padding:1rem;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;min-width:0}
.play{display:flex;flex-direction:column;gap:.8rem}
.head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.theme{display:inline-flex;align-items:center;gap:.4rem;background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:.3rem .8rem;font-size:.92rem}
.theme b{font-weight:700}
.tries{font-size:.92rem;color:var(--muted)}
.tries b{color:var(--ink)}
.stage{display:grid;grid-template-columns:minmax(200px,330px) minmax(0,1fr);gap:1rem;align-items:center}
.view{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--sky);border:1px solid var(--line);box-shadow:inset 0 -30px 40px -30px rgba(0,0,0,.25)}
#scene{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#scene:active{cursor:grabbing}
.view .drag{position:absolute;right:.5rem;bottom:.4rem;font-size:.72rem;color:#fff;background:rgba(20,10,30,.45);padding:.1rem .45rem;border-radius:999px;pointer-events:none}
.view.flat{background:none;box-shadow:none;border:0;aspect-ratio:auto}
#gallows{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:12px;border:1px solid var(--line)}
#gallows .wood{stroke:var(--wood);stroke-width:6;stroke-linecap:round;fill:none}
#gallows .rope{stroke:var(--rope);stroke-width:3;stroke-linecap:round}
#gallows .part{stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none;opacity:0;transition:opacity .25s}
#gallows .part.on{opacity:1}
#gallows .face{opacity:0}
#gallows.lost .face{opacity:1}
.word{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;min-width:0}
.word .tile{display:inline-block;width:2.1em;height:2.6em;perspective:420px;font-size:clamp(1.05rem,3.2vw,1.6rem);font-weight:800;text-transform:uppercase;font-family:var(--sans)}
.tile .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d}
.tile .f,.tile .b{position:absolute;inset:0;display:grid;place-items:center;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tile .f{background:linear-gradient(160deg,var(--tile-a),var(--tile-b));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -5px 0 var(--tile-edge),0 4px 8px rgba(0,0,0,.22)}
.tile .b{transform:rotateX(180deg);background:linear-gradient(180deg,var(--face-a),var(--face-b));color:var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.2)}
.tile.shown .in{transform:rotateX(180deg)}
.tile.flip .in{animation:flip .55s cubic-bezier(.3,1.35,.5,1) both}
@keyframes flip{from{transform:rotateX(0)}to{transform:rotateX(180deg)}}
.tile.miss .b{color:var(--bad);background:var(--bad-soft)}
.tile.hint .b{color:var(--gold-ink)}
.status{min-height:2.6em;color:var(--ink);font-weight:600;line-height:1.35;text-align:center}
.status.win{color:var(--good)}
.status.lose{color:var(--bad)}
.wrong{text-align:center;font-size:.92rem;color:var(--muted);min-height:1.4em}
.wrong b{color:var(--bad);letter-spacing:.12em}
.kb{display:flex;flex-direction:column;gap:.35rem;align-items:center;user-select:none;-webkit-user-select:none}
.kb .r{display:flex;gap:.3rem;justify-content:center;width:100%}
.kb button{flex:0 1 2.6rem;min-width:0;height:2.9rem;border-radius:9px;border:1px solid var(--key-edge);background:linear-gradient(180deg,var(--key-a),var(--key-b));box-shadow:0 3px 0 var(--key-edge),0 5px 8px rgba(0,0,0,.12);color:var(--ink);font-weight:700;font-size:1.02rem;text-transform:uppercase;touch-action:manipulation;position:relative;transition:transform .06s,box-shadow .06s}
.kb button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--key-edge),0 2px 3px rgba(0,0,0,.12)}
.kb button:disabled{box-shadow:0 1px 0 var(--key-edge);transform:translateY(2px)}
.kb button:hover:not(:disabled){border-color:var(--accent)}
.kb button.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}

.kb button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink);text-decoration:line-through}
.kb button.ok::after,.kb button.bad::after{position:absolute;top:1px;right:3px;font-size:.62rem;font-weight:700}
.kb button.ok::after{content:"✓";color:var(--good)}
.kb button.bad::after{content:"✗";color:var(--bad)}
.kb button:disabled:not(.ok):not(.bad){opacity:.5}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.side h2{font-size:.98rem;margin:0 0 .5rem;color:var(--ink)}
.side section+section{margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--line)}
.side label{display:grid;gap:.3rem;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem;margin:0}
.stats div{background:var(--surface-2);border-radius:10px;padding:.5rem .6rem}
.stats dt{font-size:.78rem;color:var(--muted)}
.stats dd{margin:0;font-size:1.3rem;font-weight:800;color:var(--ink)}
.seedrow{display:flex;gap:.4rem;flex-wrap:wrap}
.seedrow input{flex:1 1 8em;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:1.1rem 1.2rem;width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
dialog::backdrop{background:rgba(20,10,30,.55)}
dialog h2{font-family:var(--serif);margin:0 0 .7rem;color:var(--ink)}
.rules{padding-left:1.15rem;margin:.2rem 0;display:grid;gap:.4rem;line-height:1.45;font-size:.94rem}
.row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.9rem}
kbd{font-family:inherit;font-size:.85em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .3em;background:var(--surface-2)}
footer{max-width:1180px;margin:0 auto;padding:0 1rem 1.2rem;font-size:.82rem;color:var(--muted)}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);padding:.6rem}}
@media (max-width:620px){.stage{grid-template-columns:minmax(0,1fr)}.view{width:min(100%,300px);margin:0 auto}#gallows{max-width:200px;margin:0 auto}}
@media (max-width:480px){
  .top{padding:.5rem .6rem}.brand p{display:none}.btn{padding:.4rem .55rem}
  .card{padding:.7rem}.kb .r{gap:.2rem}.kb button{height:2.7rem;font-size:.95rem;border-radius:7px}
  .word{gap:.22rem}.word .tile{width:1.55em;height:2.15em}
}
@media (prefers-reduced-motion:reduce){#gallows .part{transition:none}.tile.flip .in{animation:none}.kb button{transition:none}}
@media print{.tools,.kb,.actions,.side{display:none}body{background:#fff}.layout{display:block}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="8" fill="#FFF1C9"/><path d="M9 33h16M13 33V7h14v5" stroke="#5B2A86" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="27" cy="16" r="3.4" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M27 19.5v7M27 22l-3.5 2.5M27 22l3.5 2.5M27 26.5l-3 4M27 26.5l3 4" stroke="#2B1B3D" stroke-width="2" stroke-linecap="round"/></svg>
    <div><h1 data-t="title"></h1><p data-t="subtitle"></p></div>
  </div>
  <div class="tools">
    <button type="button" class="btn primary" id="bNew" data-t="btn.new"></button>
    <button type="button" class="btn" id="bRules" data-t="btn.rules"></button>
    <label class="sr" for="lang" data-t="lang"></label>
    <select id="lang"><option value="pt">PT</option><option value="en">EN</option><option value="it">IT</option><option value="es">ES</option></select>
    <button type="button" class="btn" id="bTheme" data-ta="btn.theme">◐</button>
  </div>
</header>

<main class="layout">
  <section class="card play" aria-labelledby="hPlay">
    <h2 class="sr" id="hPlay" data-t="play"></h2>
    <div class="head">
      <span class="theme"><span data-t="theme"></span> <b id="cat"></b></span>
      <span class="tries" id="wlang"></span>
      <span class="tries" id="tries"></span>
    </div>
    <div class="stage">
      <div class="view" id="view"><canvas id="scene" role="img"></canvas><span class="drag" data-t="scene.drag" aria-hidden="true"></span>
      <svg id="gallows" hidden viewBox="0 0 200 220" role="img" aria-labelledby="gTitle"><title id="gTitle"></title>
        <path class="wood" d="M20 205h110M50 205V18h90"/><path class="wood" d="M50 52l34-34"/><line class="rope" x1="140" y1="18" x2="140" y2="48"/>
        <circle class="part" cx="140" cy="66" r="18"/>
        <line class="part" x1="140" y1="84" x2="140" y2="140"/>
        <line class="part" x1="140" y1="98" x2="114" y2="124"/>
        <line class="part" x1="140" y1="98" x2="166" y2="124"/>
        <line class="part" x1="140" y1="140" x2="118" y2="178"/>
        <line class="part" x1="140" y1="140" x2="162" y2="178"/>
        <g class="face" stroke="var(--bad)" stroke-width="2.5" stroke-linecap="round"><path d="M131 59l6 6M137 59l-6 6M143 59l6 6M149 59l-6 6"/><path d="M133 76q7-5 14 0" fill="none"/></g>
      </svg></div>
      <div>
        <div class="word" id="word" aria-hidden="true"></div>
        <p class="sr" id="wordSr"></p>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <p class="wrong" id="wrong"></p>
    <div class="kb" id="kb" role="group"></div>
    <div class="actions">
      <button type="button" class="btn" id="bHint" data-t="btn.hint"></button>
      <button type="button" class="btn" id="bGiveUp" data-t="btn.giveup"></button>
    </div>
  </section>

  <aside class="card side">
    <section>
      <h2 data-t="h.filter"></h2>
      <label><span data-t="filter.label"></span><select id="filter"></select></label>
      <p class="muted small" id="filterInfo"></p>
    </section>
    <section>
      <h2 data-t="h.stats"></h2>
      <dl class="stats">
        <div><dt data-t="st.wins"></dt><dd id="sWins">0</dd></div>
        <div><dt data-t="st.losses"></dt><dd id="sLosses">0</dd></div>
        <div><dt data-t="st.streak"></dt><dd id="sStreak">0</dd></div>
        <div><dt data-t="st.best"></dt><dd id="sBest">0</dd></div>
      </dl>
      <p class="row" style="justify-content:flex-start"><button type="button" class="btn" id="bReset" data-t="btn.reset"></button></p>
    </section>
    <section>
      <h2 data-t="h.seed"></h2>
      <p class="muted small" id="seedInfo"></p>
      <form class="seedrow" id="fSeed"><label class="sr" for="seedIn" data-t="seed.label"></label><input type="text" id="seedIn" inputmode="numeric" autocomplete="off" maxlength="10"><button type="submit" class="btn" data-t="btn.seed"></button></form>
      <p class="muted small" data-t="seed.help"></p>
    </section>
  </aside>
</main>
<footer><p id="foot"></p></footer>

<dialog id="dRules" aria-labelledby="hRules">
  <h2 id="hRules" tabindex="-1" data-t="rules.title"></h2>
  <ol class="rules" id="rulesList"></ol>
  <div class="row"><button type="button" class="btn primary" id="bRulesClose" data-t="btn.close"></button></div>
</dialog>

  function objects(t) {
    const P = PAL[state.theme], W = { t: wood, c: [1, 1, 1], s: 0.15 }, list = [];
    // tablado: tábuas no sentido x, apoiadas em duas travessas
    for (let i = 0; i < 6; i++) list.push([G3.box, M.mul(M.T(0, 0.22, -0.65 + i * 0.26), M.mul(M.Rz(Math.PI / 2), M.S(0.06, 2.5, 0.24))), { t: wood, c: i % 2 ? [0.92, 0.9, 0.88] : [1, 0.97, 0.94], s: 0.1, uv: [1, 3] }]);
    [-1.05, 1.05].forEach((x) => list.push([G3.box, M.mul(M.T(x, 0.095, 0), M.S(0.16, 0.19, 1.6)), W]));
    // poste, viga, mão-francesa
    list.push([G3.box, M.mul(M.T(-0.8, 1.68, 0), M.S(0.17, 2.92, 0.17)), { t: wood, c: [1, 1, 1], s: 0.15, uv: [1, 2.5] }]);
    list.push([G3.box, M.mul(M.T(-0.08, 3.16, 0), M.mul(M.Rz(Math.PI / 2), M.S(0.16, 1.62, 0.16))), { t: wood, c: [1, 1, 1], s: 0.15, uv: [1, 1.6] }]);
    list.push([G3.box, M.mul(M.T(-0.52, 2.84, 0), M.mul(M.Rz(-Math.PI / 4), M.S(0.11, 0.78, 0.11))), W]);
    // balanço suave depois da derrota, em torno do ponto da corda
    const sway = state.lost && !reduced() ? Math.sin((t - lostAt) / 1000 * 1.7) * 0.06 * Math.exp(-(t - lostAt) / 9000) : 0;
    const swing = M.mul(M.T(...PIV), M.mul(M.Rz(sway), M.T(-PIV[0], -PIV[1], -PIV[2])));
    const R = { t: rope, c: [1, 1, 1], s: 0.05, uv: [1, 10] };
    list.push([G3.cyl, M.mul(swing, segment([PIV[0], 3.1, -0.03], [PIV[0], 2.22, -0.03], 0.024, 0.024)), R]);
    list.push([G3.cyl, M.mul(swing, segment([PIV[0], 2.26, -0.03], [PIV[0], 2.0, 0.0], 0.05, 0.05)), R]); // nó, atrás da cabeça
    list.push([G3.tor, M.mul(swing, M.mul(M.T(PIV[0], 1.99, FZ - 0.02), M.mul(M.Rx(0.3), M.S(0.12, 0.12, 0.12)))), { t: rope, c: [1, 1, 1], s: 0.05, uv: [1, 1] }]); // laço no pescoço
    // boneco
    const B = { c: P.body, s: 0.35 };
    parts.forEach((pt, i) => {
      if (born[i] < 0) return;
      const g = reduced() ? 1 : ease((t - born[i]) / 450);
      if (g <= 0.001) return;
      if (pt.k === 'head') {
        const h = fig.head;
        list.push([G3.sph, M.mul(swing, M.mul(M.T(...h), M.S(0.17 * g, 0.19 * g, 0.17 * g))), B]);
        if (g > 0.95) faces(list, swing, P);
      } else {
        list.push([G3.cyl, M.mul(swing, segment(pt.a, pt.b, pt.r[0], pt.r[1], Math.min(g, 1))), B]);
        list.push([G3.sph, M.mul(swing, M.mul(M.T(...pt.a), M.S(pt.r[0], pt.r[0], pt.r[1]))), B]);
        if (g > 0.98) list.push([G3.sph, M.mul(swing, M.mul(M.T(...pt.b), M.S(pt.r[0] * 1.08, pt.r[0] * 1.08, pt.r[1] * 1.08))), B]);
      }
    });
    return list;
  }
  function faces(list, swing, P) {
    const z = FZ + 0.155, h = fig.head;
    if (state.lost) {
      [-0.06, 0.06].forEach((dx) => [Math.PI / 4, -Math.PI / 4].forEach((r) => list.push([G3.box, M.mul(swing, M.mul(M.T(h[0] + dx, h[1] + 0.03, z), M.mul(M.Rz(r), M.S(0.075, 0.016, 0.02)))), { c: P.x, s: 0 }])));
      list.push([G3.box, M.mul(swing, M.mul(M.T(h[0], h[1] - 0.075, z - 0.005), M.S(0.07, 0.014, 0.02))), { c: P.x, s: 0 }]);
    } else {
      [-0.06, 0.06].forEach((dx) => list.push([G3.sph, M.mul(swing, M.mul(M.T(h[0] + dx, h[1] + 0.03, z - 0.01), M.S(0.022, 0.026, 0.012))), { c: P.eye, s: 0.6 }]));
      list.push([G3.box, M.mul(swing, M.mul(M.T(h[0], h[1] - 0.07, z - 0.01), M.S(0.06, 0.012, 0.015))), { c: P.eye, s: 0 }]);
    }
  }

  let lostAt = 0;
  function frame(now) {
    raf = 0;
    const w = Math.max(1, Math.round(cv.clientWidth * Math.min(2, devicePixelRatio || 1))), h = Math.max(1, Math.round(cv.clientHeight * Math.min(2, devicePixelRatio || 1)));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0); gl.clearStencil(0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
    const P = PAL[state.theme], L = norm3(P.L);
    const idle = reduced() ? 0 : Math.sin((now - t0) / 1000 * 0.22) * 0.32;
    const a = az + idle + drag, el = 0.2, dist = 6.1, tg = [0.05, 1.62, 0];
    const eye = [tg[0] + Math.sin(a) * Math.cos(el) * dist, tg[1] + Math.sin(el) * dist + 0.3, tg[2] + Math.cos(a) * Math.cos(el) * dist];
    const VP = M.mul(M.persp(0.62, w / h, 0.1, 50), M.look(eye, tg, [0, 1, 0]));
    gl.uniformMatrix4fv(Un.uVP, false, VP);
    gl.uniform3fv(Un.uL, L); gl.uniform3fv(Un.uLC, P.LC); gl.uniform3fv(Un.uSky, P.sky); gl.uniform3fv(Un.uGnd, P.gnd); gl.uniform3fv(Un.uEye, eye);
    gl.uniform1i(Un.uTex, 0); gl.activeTexture(gl.TEXTURE0);
    [A.p, A.n, A.u].forEach((l) => gl.enableVertexAttribArray(l));
    gl.enable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.CULL_FACE);
    // chão com grama, que some nas bordas
    gl.uniform1f(Un.uShadow, 0);
    draw(G3.disc, M.S(3.2, 1, 3.2), { t: grass, c: state.theme === 'dark' ? [0.55, 0.6, 0.7] : [1, 1, 1], uv: [7, 7], fade: 3.2 }, VP);
    // sombras projetadas no plano y = 0
    const list = objects(now);
    const Sh = [1,0,0,0, -L[0]/L[1],0,-L[2]/L[1],0, 0,0,1,0, 0,0.004,0,1];
    gl.enable(gl.STENCIL_TEST); gl.stencilFunc(gl.EQUAL, 0, 0xff); gl.stencilOp(gl.KEEP, gl.KEEP, gl.INCR);
    gl.depthMask(false); gl.uniform1f(Un.uShadow, P.shadow);
    list.forEach(([m, mm, mat]) => draw(m, mm, mat, VP, Sh));
    gl.depthMask(true); gl.disable(gl.STENCIL_TEST); gl.uniform1f(Un.uShadow, 0);
    list.forEach(([m, mm, mat]) => draw(m, mm, mat, VP));
    // continua animando enquanto houver movimento
    const growing = born.some((b) => b >= 0 && now - b < 500);
    if (visible && (!reduced() || growing || dragging)) raf = requestAnimationFrame(frame);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  // arrastar para girar a cena (mouse, toque ou caneta)
  cv.addEventListener('pointerdown', (e) => { dragging = { x: e.clientX, d: drag }; cv.setPointerCapture(e.pointerId); kick(); });
  cv.addEventListener('pointermove', (e) => { if (!dragging) return; drag = dragging.d + (e.clientX - dragging.x) / 140; kick(); });
  const stop = () => { dragging = null; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; if (visible) kick(); });
  if ('IntersectionObserver' in window) new IntersectionObserver((es) => { visible = es[0].isIntersecting && !document.hidden; if (visible) kick(); }).observe(cv);
  window.addEventListener('resize', kick);

  return {
    update(err, lost, theme, instant) {
      const now = performance.now();
      for (let i = 0; i < 6; i++) {
        const want = i < err || lost;
        if (want && born[i] < 0) born[i] = instant ? now - 1000 : now + (lost && !instant ? (i - Math.min(err, 6)) * 120 : 0);
        if (!want) born[i] = -1;
      }
      if (lost && !state.lost) lostAt = now;
      state = { err, lost, theme };
      kick();
    }
  };
})();

if (!Scene3D) { document.getElementById('scene').hidden = true; document.querySelector('#view .drag').hidden = true; document.getElementById('gallows').hidden = false; document.getElementById('view').classList.add('flat'); }

/* ===================== Lista de palavras ===================== */
const CATS = Object.keys(WORDS.pt);
const LISTS = {};                      // por idioma: [{w, c}] (palavra e tema)
Object.keys(WORDS).forEach((L) => { LISTS[L] = []; CATS.forEach((c) => (WORDS[L][c] || '').split(' ').filter(Boolean).forEach((w) => LISTS[L].push({ w, c }))); });
// sem acentos; em espanhol o Ñ é uma letra própria
function fold(s, L) {
  s = s.toLowerCase();
  if (L === 'es') s = s.replace(/ñ/g, '\u0001');
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return L === 'es' ? s.replace(/\u0001/g, 'ñ') : s;
}
const MAXLEN = Math.max(...Object.values(LISTS).flat().map((x) => x.w.length));
const MAXERR = 6;
const inFilter = (f, L = LANG) => LISTS[L].map((x, i) => i).filter((i) => f === 'all' || LISTS[L][i].c === f);
const cur = () => LISTS[G.lang][G.i];

/* ===================== Estado ===================== */
let G = null;   // {i, seed, filter, guessed:[letras], hints:[índices de posição], over:'win'|'lose'|null, counted}
let ST = { wins: 0, losses: 0, streak: 0, best: 0 };
const played = (L = LANG) => new Set(store.get('played.' + L) || (L === 'pt' ? store.get('played') : null) || []);
const setPlayed = (set, L = LANG) => store.set('played.' + L, [...set]);

function errors() { const f = fold(cur().w, G.lang); return G.guessed.filter((l) => !f.includes(l)).length + G.hints.length; }
function revealedAt(p) { const f = fold(cur().w, G.lang); return G.guessed.includes(f[p]) || G.hints.includes(p); }
function solved() { const w = cur().w; for (let p = 0; p < w.length; p++) if (!revealedAt(p)) return false; return true; }

function pickIndex(filter, seed, avoidPlayed) {
  let pool = inFilter(filter);
  if (avoidPlayed) {
    const pl = played(), rest = pool.filter((i) => !pl.has(LISTS[LANG][i].w));
    if (rest.length) pool = rest; else { pool.forEach((i) => pl.delete(LISTS[LANG][i].w)); setPlayed(pl); }
  }
  const st = { rng: seed | 0 };
  return pool[Math.floor(rand(st) * pool.length)];
}
function startGame(seed, avoidPlayed) {
  const filter = $('#filter').value || 'all';
  if (seed == null) seed = newSeed();
  const i = pickIndex(filter, seed, avoidPlayed);
  G = { lang: LANG, i, w: LISTS[LANG][i].w, seed, filter, guessed: [], hints: [], over: null, counted: false };
  const pl = played(); pl.add(G.w); setPlayed(pl);
  save(); render(t('st.start'));
}
function save() { store.set('game', G); store.set('stats', ST); }

function finish(kind) {
  G.over = kind;
  if (!G.counted) {
    G.counted = true;
    if (kind === 'win') { ST.wins++; ST.streak++; ST.best = Math.max(ST.best, ST.streak); } else { ST.losses++; ST.streak = 0; }
  }
}
function guess(l) {
  if (!G || G.over) return;
  l = fold(l, G.lang);
  if (!(G.lang === 'es' ? /^[a-zñ]$/ : /^[a-z]$/).test(l)) return;
  if (G.guessed.includes(l)) { render(t('st.repeat', l.toUpperCase())); return; }
  G.guessed.push(l);
  const f = fold(cur().w, G.lang), n = [...f].filter((c) => c === l).length;
  let msg = n ? t('st.hit', l.toUpperCase(), t(n === 1 ? 'times' : 'times.n', n)) : t('st.miss', l.toUpperCase(), MAXERR - errors());
  if (solved()) { finish('win'); msg = t('st.win', cur().w.toUpperCase()); }
  else if (errors() >= MAXERR) { finish('lose'); msg = t('st.lose', cur().w.toUpperCase()); }
  save(); render(msg);
  if (G.over) $('#bNew').focus();
}
function hint() {
  if (!G || G.over || errors() >= MAXERR - 1) return;
  const w = cur().w, hidden = [];
  for (let p = 0; p < w.length; p++) if (!revealedAt(p)) hidden.push(p);
  if (!hidden.length) return;
  const st = { rng: (G.seed ^ (G.guessed.length * 31 + G.hints.length * 977)) | 0 };
  const p = hidden[Math.floor(rand(st) * hidden.length)];
  G.hints.push(p);
  let msg = t('st.hint', w[p].toUpperCase());
  if (solved()) { finish('win'); msg = t('st.win', w.toUpperCase()); }
  save(); render(msg);
}
function giveUp() {
  if (!G || G.over) return;
  finish('lose'); save(); render(t('st.lose', cur().w.toUpperCase())); $('#bNew').focus();
}

/* ===================== Desenho ===================== */
let kbLang = null;
function buildKeyboard(L) {
  kbLang = L;
  const ROWS = L === 'es' ? ['qwertyuiop', 'asdfghjklñ', 'zxcvbnm'] : ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  $('#kb').innerHTML = ROWS.map((r) => '<div class="r">' + [...r].map((l) => `<button type="button" data-l="${l}">${l}</button>`).join('') + '</div>').join('');
}
let lastMsg = '';
let shownPrev = { key: null, set: null }, scenePrev = { key: null, err: -1 };
function render(msg) {
  if (msg != null) lastMsg = msg;
  if (kbLang !== G.lang) buildKeyboard(G.lang);
  const w = cur().w, f = fold(w, G.lang), err = errors();
  $('#cat').textContent = t('c.' + cur().c);
  $('#wlang').textContent = t('word.lang', t('ln.' + G.lang));
  $('#word').setAttribute('lang', HTML_LANG[G.lang]); $('#wordSr').setAttribute('lang', HTML_LANG[G.lang]);
  $('#tries').innerHTML = t('tries', err, MAXERR);
  const key = G.seed + ':' + G.i, prev = shownPrev.key === key ? shownPrev.set : null, now = new Set();
  $('#word').innerHTML = [...w].map((ch, p) => {
    const shown = revealedAt(p), miss = !shown && G.over === 'lose', open = shown || miss;
    if (open) now.add(p);
    const cls = 'tile' + (open ? ' shown' : '') + (open && prev && !prev.has(p) ? ' flip' : '') + (miss ? ' miss' : G.hints.includes(p) ? ' hint' : '');
    return `<span class="${cls}"><span class="in"><span class="f"></span><span class="b">${open ? esc(ch) : ''}</span></span></span>`;
  }).join('');
  shownPrev = { key, set: now };
  $('#wordSr').textContent = t('word.sr', w.length, [...w].map((ch, p) => revealedAt(p) || G.over ? ch.toUpperCase() : t('blank')).join(', '));
  const wrongs = G.guessed.filter((l) => !f.includes(l)).map((l) => l.toUpperCase());
  $('#wrong').innerHTML = wrongs.length ? t('wrong', esc(wrongs.join(' '))) : '';
  document.querySelectorAll('#gallows .part').forEach((el, k) => el.classList.toggle('on', k < err || G.over === 'lose'));
  $('#gallows').classList.toggle('lost', G.over === 'lose');
  $('#gTitle').textContent = t('gallows', Math.min(err, MAXERR), MAXERR);
  $('#scene').setAttribute('aria-label', t('gallows', G.over === 'lose' ? MAXERR : Math.min(err, MAXERR), MAXERR));
  if (Scene3D) { const instant = scenePrev.key !== key || err < scenePrev.err; Scene3D.update(Math.min(err, MAXERR), G.over === 'lose', document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', instant); scenePrev = { key, err }; }
  document.querySelectorAll('#kb button').forEach((b) => {
    const l = b.dataset.l, used = G.guessed.includes(l), ok = used && f.includes(l);
    b.className = used ? (ok ? 'ok' : 'bad') : '';
    b.disabled = used || !!G.over;
    b.setAttribute('aria-label', used ? t(ok ? 'key.ok' : 'key.bad', l.toUpperCase()) : l.toUpperCase());
  });
  const s = $('#status'); s.textContent = lastMsg; s.className = 'status' + (G.over ? ' ' + G.over : '');
  $('#bHint').disabled = !!G.over || err >= MAXERR - 1;
  $('#bGiveUp').disabled = !!G.over;
  $('#seedInfo').textContent = t('seed.info', G.seed);
  $('#sWins').textContent = ST.wins; $('#sLosses').textContent = ST.losses; $('#sStreak').textContent = ST.streak; $('#sBest').textContent = ST.best;
  renderFilterInfo();
}
function renderFilter() {
  const sel = $('#filter'), cur = sel.value || (G && G.filter) || store.get('filter') || 'all';
  sel.innerHTML = `<option value="all">${esc(t('filter.all'))} (${LISTS[LANG].length})</option>` + CATS.map((c) => `<option value="${c}">${esc(t('c.' + c))} (${inFilter(c).length})</option>`).join('');
  sel.value = CATS.includes(cur) ? cur : 'all';
}
function renderFilterInfo() {
  const pool = inFilter($('#filter').value || 'all'), pl = played();
  $('#filterInfo').textContent = t('filter.info', pool.length, pool.filter((i) => !pl.has(LISTS[LANG][i].w)).length);
}
function applyStatic() {
  document.documentElement.lang = HTML_LANG[LANG];
  document.title = t('title') + ' · Giovani Perotto Mesquita';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-ta]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.ta)); el.title = t(el.dataset.ta); });
  $('#kb').setAttribute('aria-label', t('kb'));
  $('#rulesList').innerHTML = ['r1','r2','r3','r4','r5','r6'].map((k) => `<li>${t(k)}</li>`).join('');
  $('#foot').textContent = t('foot', LISTS[LANG].length);
  $('#lang').value = LANG;
  renderFilter();
  if (G) { // traduz a última mensagem refazendo o estado
    const w = cur().w.toUpperCase();
    render(G.over === 'win' ? t('st.win', w) : G.over === 'lose' ? t('st.lose', w) : t('st.start'));
  }
}
function setLang(l, push = true) {
  LANG = l; store.set('lang', l);
  if (push && history.replaceState) history.replaceState(null, '', l === 'pt' ? location.pathname : '#' + l);
  applyStatic();
  if (G && G.lang !== LANG) {
    if (!G.over && !G.guessed.length && !G.hints.length) startGame(null, true);
    else if (!G.over) render(t('st.keep', t('ln.' + G.lang)));
  }
}
function setTheme(th) { document.documentElement.dataset.theme = th; if (G) render(); }

/* ===================== Eventos ===================== */
$('#kb').addEventListener('click', (e) => { const b = e.target.closest('button[data-l]'); if (b && !b.disabled) guess(b.dataset.l); });
$('#bHint').addEventListener('click', hint);
$('#bGiveUp').addEventListener('click', giveUp);
function newWord() {
  if (G && !G.over && (G.guessed.length || G.hints.length)) {
    if (!confirm(t('confirm.new'))) return;
    finish('lose');
  }
  startGame(null, true);
}
$('#bNew').addEventListener('click', newWord);
$('#filter').addEventListener('change', () => { store.set('filter', $('#filter').value); if (G && !G.over && !G.guessed.length && !G.hints.length) startGame(null, true); else renderFilterInfo(); });
$('#bReset').addEventListener('click', () => { if (!confirm(t('confirm.reset'))) return; ST = { wins: 0, losses: 0, streak: 0, best: 0 }; save(); render(); });
$('#fSeed').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('#seedIn').value.trim();
  if (!/^\d{1,10}$/.test(v) || +v > 4294967295) { render(t('seed.bad')); $('#seedIn').focus(); return; }
  if (G && !G.over && (G.guessed.length || G.hints.length)) { if (!confirm(t('confirm.new'))) return; finish('lose'); }
  startGame(+v >>> 0, false);
});
$('#bRules').addEventListener('click', () => { $('#dRules').showModal(); $('#hRules').focus(); });
$('#bRulesClose').addEventListener('click', () => $('#dRules').close());
$('#bTheme').addEventListener('click', () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; setTheme(th); store.set('theme', th); });
$('#lang').addEventListener('change', (e) => setLang(e.target.value));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== LANG) setLang(h, false); });
document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter' && G && G.over) { e.preventDefault(); newWord(); return; }
  if (e.key.length === 1 && /^[a-zà-ÿ]$/i.test(e.key)) { e.preventDefault(); guess(e.key); }
});

/* ===================== Início ===================== */
(function init() {
  const th = store.get('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  setTheme(th);
  const h = location.hash.slice(1), saved = store.get('lang'), nav = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  LANG = LANGS.includes(h) ? h : LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'pt';
  const s = store.get('stats'); if (s && typeof s.wins === 'number') ST = Object.assign(ST, s);
  const g = store.get('game');
  if (g && !g.lang) g.lang = 'pt';   // partidas salvas antes das listas em outros idiomas
  if (g && LISTS[g.lang] && Number.isInteger(g.i) && g.i >= 0 && g.i < LISTS[g.lang].length && LISTS[g.lang][g.i].w === g.w && Array.isArray(g.guessed) && Array.isArray(g.hints)) G = g;
  applyStatic();
  if (!G) startGame(null, true);
})();
</script>
</body>
