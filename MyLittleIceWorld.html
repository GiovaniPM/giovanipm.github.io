<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Little Ice World · Giovani Perotto Mesquita</title>
<meta name="description" content="My Little Ice World: um boneco de neve astronauta explora três sistemas estelares, terraforma planetas com nitrogênio líquido e funda colônias geladas com iceovelhas. Jogo em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#070B1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space: #070B1F; --panel: rgba(14, 20, 48, .88); --panel-solid: #111A3C; --line: rgba(160, 200, 255, .2);
    --ink: #F2F7FF; --muted: #A9B8DA; --ice: #8FD3FF; --ice-deep: #2F6FE0; --pink: #FF8FB8;
    --gold: #FFC94D; --danger: #FF6B6B; --ok: #5FD3A4;
    --round: "Fredoka", "Hanken Grotesk", "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: "Hanken Grotesk", "Segoe UI", Arial, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { touch-action: none; }
  #cv { position: fixed; inset: 0; display: block; }
  button, select { font: inherit; }
  button { cursor: pointer; }
  a { color: var(--ice); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* HUD */
  .hud { position: fixed; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; padding: calc(.6rem + env(safe-area-inset-top)) calc(.6rem + env(safe-area-inset-right)) 0 calc(.6rem + env(safe-area-inset-left)); pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud-left { display: flex; flex-direction: column; gap: .4rem; max-width: min(58vw, 340px); }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .35rem .6rem; font-size: .85rem; line-height: 1.35; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .loc strong { font-family: var(--round); font-weight: 700; font-size: 1rem; color: var(--ice); }
  .loc span { color: var(--muted); }
  .res { display: flex; flex-wrap: wrap; gap: .25rem .8rem; }
  .res b { color: var(--ice); font-variant-numeric: tabular-nums; }
  .res .hab b { color: var(--gold); }
  .res .lives b { color: var(--pink); letter-spacing: 1px; }
  .res .lives b.low { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .res .lives b.low { animation: none; } }
  #hLose, #hLife { color: var(--danger); }
  #hWin { color: var(--gold); font-size: 2.2rem; margin-bottom: .3rem; }
  .party { width: min(380px, 100%); aspect-ratio: 380 / 230; height: auto; display: block; margin: 0 auto .4rem; }
  .win-time { font-family: var(--round); font-size: 1.5rem; color: var(--ice) !important; margin: .3rem 0 !important; }
  .res .clock { display: inline-flex; align-items: center; gap: .25rem; }
  .res .clock svg { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
  .res .clock b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .cry { width: 220px; height: 180px; display: block; margin: 0 auto .3rem; }
  .hearts { font-size: 1.6rem; letter-spacing: 4px; margin: 0 0 .3rem !important; color: var(--pink) !important; }
  .bars { display: grid; gap: .3rem; }
  .bar { display: grid; grid-template-columns: 3.4rem 1fr; align-items: center; gap: .4rem; font-size: .75rem; color: var(--muted); }
  .bar i { display: block; height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i b { display: block; height: 100%; width: 100%; border-radius: inherit; background: var(--ice); transition: width .15s linear; }
  .bar.hp i b { background: var(--ok); }
  .bar.low i b { background: var(--danger); }
  .objective { font-size: .82rem; }
  .objective strong { color: var(--gold); }
  .hud-right { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem; max-width: 46vw; }
  .hbtn { display: inline-flex; align-items: center; gap: .35rem; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: .45rem .6rem; font-size: .82rem; font-weight: 600; }
  .hbtn:hover { border-color: var(--ice); }
  .hbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .hbtn kbd { font-family: inherit; font-size: .68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 .25rem; }
  body.touch .hbtn kbd { display: none; }
  body:not([data-scene="surface"]) .surface-only, body:not([data-scene="space"]) .space-only { display: none; }
  @media (max-width: 700px) { .hbtn .lbl { display: none; } .chip { font-size: .78rem; } }

  .prompt { position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 92vw; background: var(--panel); border: 1px solid var(--gold); border-radius: 999px; padding: .5rem 1.1rem; font-weight: 700; font-size: .95rem; text-align: center; pointer-events: none; }
  body.touch .prompt { bottom: calc(10.5rem + env(safe-area-inset-bottom)); }
  .toasts { position: fixed; left: 50%; top: 26%; transform: translateX(-50%); width: min(92vw, 520px); display: grid; gap: .4rem; justify-items: center; pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ice); border-radius: 10px; padding: .5rem .9rem; font-size: .92rem; text-align: center; animation: tin .25s ease-out; }
  .toast.warn { border-left-color: var(--danger); }
  .toast.good { border-left-color: var(--ok); }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } }

  /* controles de toque */
  .stick { position: fixed; left: calc(1.2rem + env(safe-area-inset-left)); bottom: calc(1.2rem + env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.18); touch-action: none; }
  .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(143,211,255,.5); border: 2px solid rgba(255,255,255,.4); }
  .tbtns { position: fixed; right: calc(1.2rem + env(safe-area-inset-right)); bottom: calc(1.2rem + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: .8rem; }
  .tbtn { width: 78px; height: 78px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(47,111,224,.6); color: #fff; font-weight: 700; font-size: .85rem; touch-action: none; }
  .tbtn.alt { width: 64px; height: 64px; background: rgba(255,143,184,.5); margin-bottom: 3.2rem; }

  /* painéis */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; background: rgba(5, 8, 24, .6); overflow: auto; }
  #ovTitle { background: radial-gradient(ellipse at center, rgba(5,8,24,.2), rgba(5,8,24,.75)); }
  .panel { width: min(100%, 560px); max-height: calc(100dvh - 2rem); overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px; padding: 1.4rem clamp(1rem, 4vw, 2rem); box-shadow: 0 30px 80px rgba(0,0,0,.5); -webkit-user-select: text; user-select: text; }
  .panel h2 { font-family: var(--round); font-weight: 700; font-size: 1.6rem; margin: 0 0 .8rem; color: var(--ice); }
  .panel h3 { font-family: var(--round); font-weight: 500; font-size: 1.1rem; margin: 1rem 0 .4rem; color: var(--gold); }
  .panel p, .panel li { color: var(--muted); line-height: 1.5; font-size: .95rem; }
  .panel ol, .panel ul { padding-left: 1.2rem; margin: 0; }
  .title { text-align: center; }
  .title p { margin: .4rem 0; }
  .back { display: inline-block; font-size: .85rem; text-decoration: none; margin-bottom: .2rem; }
  #logo { width: 240px; height: 170px; display: block; margin: 0 auto -.4rem; }
  .logo-text { font-family: var(--round); font-weight: 700; font-size: clamp(2.1rem, 8vw, 3.2rem); line-height: 1.05; margin: 0 0 .4rem; background: linear-gradient(180deg, #FFFFFF 20%, #8FD3FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-family: var(--round); font-size: 1.15rem; color: var(--pink) !important; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1rem; }
  .field { display: grid; gap: .25rem; text-align: left; font-size: .8rem; color: var(--muted); }
  select { background: #0B1230; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .6rem; }
  .btn { border: 0; border-radius: 12px; padding: .7rem 1.2rem; font-weight: 700; font-size: 1rem; color: #fff; background: var(--ice-deep); }
  .btn:hover { filter: brightness(1.12); }
  .btn.alt { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; filter: none; }
  .small { font-size: .8rem !important; }
  .list { list-style: none; padding: 0 !important; display: grid; gap: .6rem; }
  .item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .2rem 1rem; padding: .8rem 1rem; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.03); }
  .item h4 { margin: 0; font-size: 1rem; color: var(--ink); }
  .item p { margin: .1rem 0 0; font-size: .85rem; }
  .item .cost { font-size: .8rem; color: var(--ice); }
  .item .cost.lack { color: var(--danger); }
  .item .state { font-size: .85rem; font-weight: 700; color: var(--ok); }
  .item .need { font-size: .78rem; color: var(--muted); max-width: 9rem; text-align: right; }
  .item .btn { padding: .5rem .9rem; font-size: .9rem; }
  .sys { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .3rem 1rem; }
  .sys .star { width: 34px; height: 34px; border-radius: 50%; }
  .sys h4 { font-family: var(--round); }
  .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: .3rem; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #3A4366; }
  .dots i.c { box-shadow: 0 0 0 2px var(--ok); }
  .here { font-size: .8rem; font-weight: 700; color: var(--gold); }
</style>
</head>
<body data-scene="title">
<canvas id="cv" role="img" aria-label="My Little Ice World"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-left">
    <div class="chip loc" id="loc"></div>
    <div class="chip res">
      <span><span data-t="n2"></span> <b id="rN2">0</b></span>
      <span><span data-t="ice"></span> <b id="rIce">0</b></span>
      <span class="hab"><span data-t="habited"></span> <b id="rHab">0/0</b></span>
      <span class="lives"><span data-t="lives"></span> <b id="rLives" role="img"></b></span>
      <span class="clock"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span class="sr" data-t="clock"></span> <b id="rTime">0:00</b></span>
    </div>
    <div class="chip bars surface-only">
      <div class="bar" id="barCold"><span data-t="cold"></span><i><b></b></i></div>
      <div class="bar hp" id="barHp"><span data-t="suit"></span><i><b></b></i></div>
    </div>
    <div class="chip objective" id="objective" aria-live="polite"></div>
  </div>
  <div class="hud-right" id="hudRight">
    <button type="button" class="hbtn space-only" data-act="scan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1.5"/><path d="M12 4a8 8 0 1 0 8 8M12 8a4 4 0 1 0 4 4"/></svg><span class="lbl" data-t="sensor"></span><kbd>Q</kbd></button>
    <button type="button" class="hbtn" data-act="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4l-5.3 3 1.2-6-4.5-4.1 6-.7z"/></svg><span class="lbl" data-t="map"></span><kbd>M</kbd></button>
    <button type="button" class="hbtn surface-only" data-act="build"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg><span class="lbl" data-t="build"></span><kbd>B</kbd></button>
    <button type="button" class="hbtn" data-act="pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg><span class="lbl" data-t="pause"></span><kbd>Esc</kbd></button>
  </div>
</div>
<div class="prompt" id="prompt" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<div id="touch" hidden>
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="tbtns">
    <button type="button" class="tbtn alt" id="tThrow"></button>
    <button type="button" class="tbtn" id="tAct" data-t="action"></button>
  </div>
</div>

<section class="overlay" id="ovTitle" aria-labelledby="ttl">
  <div class="panel title">
    <a class="back" href="projects.html" id="backLink" data-t="back"></a>
    <canvas id="logo" aria-hidden="true"></canvas>
    <h1 class="logo-text" id="ttl">My Little Ice World</h1>
    <p class="tag" data-t="tagline"></p>
    <p data-t="story1"></p>
    <p data-t="story2"></p>
    <div class="row">
      <label class="field"><span data-t="size"></span>
        <select id="sizeSel"><option value="short" data-t="sizeShort"></option><option value="normal" data-t="sizeNormal"></option><option value="long" data-t="sizeLong"></option></select></label>
      <label class="field"><span data-t="res"></span>
        <select id="resSel"><option value="abundant" data-t="resAbundant"></option><option value="full" data-t="resFull"></option><option value="sufficient" data-t="resSufficient"></option><option value="scarce" data-t="resScarce"></option><option value="rare" data-t="resRare"></option></select></label>
      <label class="field"><span data-t="lang"></span>
        <select class="langSel"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
    </div>
    <div class="row">
      <button type="button" class="btn" data-act="new" data-t="newGame"></button>
      <button type="button" class="btn alt" data-act="continue" id="bCont" data-t="cont"></button>
      <button type="button" class="btn alt" data-act="help" data-t="help"></button>
    </div>
    <p class="small" id="owNote" data-t="overwrite"></p>
  </div>
</section>

<section class="overlay" id="ovHelp" aria-labelledby="hHelp" hidden>
  <div class="panel">
    <h2 id="hHelp" data-t="help"></h2>
    <h3 data-t="h_steps"></h3>
    <ol><li data-t="help1"></li><li data-t="help2"></li><li data-t="help3"></li><li data-t="help4"></li><li data-t="help5"></li></ol>
    <h3 data-t="h_ctl"></h3>
    <ul><li data-t="ctl1"></li><li data-t="ctl2"></li><li data-t="ctl3"></li><li data-t="ctl4"></li></ul>

    <p data-t="sheepInfo"></p>
    <div class="row"><button type="button" class="btn" data-act="closeHelp" data-t="close"></button></div>
  </div>
</section>

<section class="overlay" id="ovPause" aria-labelledby="hPause" hidden>
  <div class="panel title">
    <h2 id="hPause" data-t="pause"></h2>
    <div class="row">
      <label class="field"><span data-t="lang"></span>
        <select class="langSel"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
    </div>
    <div class="row">
      <button type="button" class="btn" data-act="resume" data-t="resume"></button>
      <button type="button" class="btn alt" data-act="help" data-t="help"></button>
      <button type="button" class="btn alt" data-act="menu" data-t="mainMenu"></button>
    </div>
    <p class="small" data-t="savedNote"></p>
  </div>
</section>

<section class="overlay" id="ovBuild" aria-labelledby="hBuild" hidden>
  <div class="panel">
    <h2 id="hBuild" data-t="b_title"></h2>
    <p id="buildMsg"></p>
    <ul class="list" id="buildList"></ul>
    <div class="row"><button type="button" class="btn alt" data-act="close" data-t="close"></button></div>
  </div>
</section>

<section class="overlay" id="ovMap" aria-labelledby="hMap" hidden>
  <div class="panel">
    <h2 id="hMap" data-t="m_title"></h2>
    <p id="mapMsg"></p>
    <ul class="list" id="sysList"></ul>
    <div class="row"><button type="button" class="btn alt" data-act="close" data-t="close"></button></div>
  </div>
</section>

<section class="overlay" id="ovLife" aria-labelledby="hLife" hidden>
  <div class="panel title">
    <canvas class="cry" id="cryLife" aria-hidden="true"></canvas>
    <h2 id="hLife" data-t="lf_title"></h2>
    <p class="hearts" id="lifeHearts" role="img"></p>
    <p id="lifeText"></p>
    <div class="row"><button type="button" class="btn" data-act="toBase" data-t="lf_back"></button></div>
  </div>
</section>

<section class="overlay" id="ovLose" aria-labelledby="hLose" hidden>
  <div class="panel title">
    <canvas class="cry" id="cryLose" aria-hidden="true"></canvas>
    <h2 id="hLose" data-t="l_title"></h2>
    <p id="loseText"></p>
    <p class="small" id="loseCount" aria-live="polite"></p>
    <div class="row"><button type="button" class="btn" data-act="loseMenu" data-t="mainMenu"></button></div>
  </div>
</section>

<section class="overlay" id="ovWin" aria-labelledby="hWin" hidden>
  <div class="panel title">
    <canvas class="party" id="party" aria-hidden="true"></canvas>
    <h2 id="hWin" data-t="w_title"></h2>
    <p id="winText"></p>
    <p class="win-time" id="winTime"></p>
    <p class="small" id="winStats"></p>
    <div class="row"><button type="button" class="btn" data-act="winMenu" data-t="w_menu"></button></div>
  </div>
</section>

        if (s === 0 && i === 0) { if (type !== 'ice') { bag.push(type); bag.splice(bag.indexOf('ice'), 1); } type = 'ice'; }

          name: SYS[s].name + ' ' + ROMAN[i], type, orbit: 330 + i * 200, ang: r() * TAU,
          spd: (0.05 / (1 + i * 0.45)) * (0.8 + r() * 0.4), rad: type === 'gas' ? 60 : 30 + r() * 18,

    const s = G.ship;
    if (fromPi != null) {
      const q = planetPos(sys.planets[fromPi]), d = hyp(q.x, q.y) || 1;
      s.x = q.x + (q.x / d) * (sys.planets[fromPi].rad + 95); s.y = q.y + (q.y / d) * (sys.planets[fromPi].rad + 95);
      s.vx = s.vy = 0; s.a = Math.atan2(q.y, q.x);
    } else if (!keepShip) {
      s.x = 0; s.y = -(sysOuter(sys) + 330); s.vx = s.vy = 0; s.a = Math.PI / 2;
    }
    SF = null;
    scene = 'space';
  }

  function updateSpace(dt) {
    const sys = G.systems[G.sys], s = G.ship;
    sys.planets.forEach((p) => { p.ang += p.spd * dt; });
    const v = inputVec();
    SP.thrust = v.x || v.y ? 1 : 0;
    s.vx += v.x * 520 * dt; s.vy += v.y * 520 * dt;
    if (!SP.thrust) { const k = Math.max(0, 1 - 0.9 * dt); s.vx *= k; s.vy *= k; }
    const sp = hyp(s.vx, s.vy), max = 480;
    if (sp > max) { s.vx *= max / sp; s.vy *= max / sp; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (sp > 25) { let da = Math.atan2(s.vy, s.vx) - s.a; da = Math.atan2(Math.sin(da), Math.cos(da)); s.a += da * Math.min(1, dt * 8); }
    // estrela
    const ds = hyp(s.x, s.y) || 1, SR = 135;
    if (ds < SR) {
      const nx = s.x / ds, ny = s.y / ds; s.x = nx * SR; s.y = ny * SR;
      const dot = s.vx * nx + s.vy * ny; if (dot < 0) { s.vx -= 1.8 * dot * nx; s.vy -= 1.8 * dot * ny; }
      warn('hot', t('t_tooHot')); SP.shake = 0.35;
    }
    const lim = sysOuter(sys) + 700;
    if (ds > lim) { s.vx -= (s.x / ds) * 400 * dt; s.vy -= (s.y / ds) * 400 * dt; }
    // planetas são sólidos
    sys.planets.forEach((p) => {
      const q = planetPos(p), d = hyp(s.x - q.x, s.y - q.y) || 1, m = p.rad + 18;
      if (d < m) { s.x = q.x + ((s.x - q.x) / d) * m; s.y = q.y + ((s.y - q.y) / d) * m; }
    });
    // asteroides
    SP.ast.forEach((a) => {
      a.a += a.spd * dt * 0.3;
      const ax = Math.cos(a.a) * a.d, ay = Math.sin(a.a) * a.d, d = hyp(s.x - ax, s.y - ay) || 1, m = a.r + 18;
      if (d < m) {
        const nx = (s.x - ax) / d, ny = (s.y - ay) / d; s.x = ax + nx * m; s.y = ay + ny * m;
        const dot = s.vx * nx + s.vy * ny;
        if (dot < 0) { s.vx -= 1.8 * dot * nx; s.vy -= 1.8 * dot * ny; if (dot < -90) { warn('ast', t('t_ast'), 2500); SP.shake = 0.35; } }
      }
    });
    if (SP.pulse) { SP.pulse.r += 1100 * dt; if (SP.pulse.r > SCAN_R) SP.pulse = null; }
    SP.scanCd = Math.max(0, SP.scanCd - dt);
    SP.shake = Math.max(0, SP.shake - dt);
    // planeta mais próximo
    SP.near = null; let best = 1e9;
    sys.planets.forEach((p, i) => { const q = planetPos(p), d = hyp(s.x - q.x, s.y - q.y) - p.rad; if (d < 95 && d < best) { best = d; SP.near = i; } });
    if (SP.near != null && actPressed && !fade.dir) {
      const p = sys.planets[SP.near];
      if (p.scanned) land(SP.near); else doScan();
    }
  }

  function doScan() {
    if (scene !== 'space' || anyModal() || !SP || SP.scanCd > 0) return;
    SP.pulse = { r: 0 }; SP.scanCd = 2;
    const s = G.ship, found = [];
    G.systems[G.sys].planets.forEach((p) => {
      const q = planetPos(p);
      if (!p.scanned && hyp(s.x - q.x, s.y - q.y) - p.rad < SCAN_R) { p.scanned = true; found.push(p.name + ' (' + t('ty_' + p.type) + ', ' + fmtTemp(p.temp) + ')'); }
    });
    toast(found.length ? t('t_scanFound', { list: found.join(', ') }) : t('t_scanNone'), found.length ? 'good' : '');
    if (found.length) save();
  }

  function land(i) {
    fadeTo(() => { enterSurface(i); toast(t('t_landed', { name: SF.p.name }) + ' ' + cap(t('ty_' + SF.p.type)) + '.'); save(); });
  }
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  // tempo de jogo: m:ss, ou h:mm:ss a partir de uma hora
  function fmtTime(sec) {
    sec = Math.floor(sec || 0);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = String(sec % 60).padStart(2, '0');
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + s : m + ':' + s;
  }
  const fmtTemp = (c) => (c > 0 ? '+' : c < 0 ? '−' : '') + Math.abs(c) + ' °C';

  // ---------------------------------------------------------------- superfície
  const surfZoom = () => clamp(Math.min(W, H) / 760, 0.62, 1.15);
  const hasB = (k) => SF.p.builds.some((b) => b.k === k);
  const findB = (k) => SF.p.builds.find((b) => b.k === k);
  const countB = (k) => SF.p.builds.filter((b) => b.k === k).length;
  const reqMet = (d) => !d.req || d.req.every(hasB);
  const costOf = (d) => { const n = d.max ? countB(d.k) : 0; return { ice: d.ice + 10 * n, n2: d.n2 + 10 * n }; };
  const canAddMore = (d) => (d.max ? countB(d.k) < d.max : !hasB(d.k));
  // extrator mais próximo do astronauta, se estiver ao alcance de um armazém
  function nearExtractor() {
    let best = null, bd = STORE_R;
    SF.p.builds.forEach((b) => { if (b.k !== 'extractor') return; const d = hyp(SF.pl.x - b.x, SF.pl.y - b.y); if (d <= bd) { bd = d; best = b; } });
    return best;
  }
  // extratores ligados ao armazém (dentro do alcance); os demais ficam parados
  function extractorLinks() {
    const st = findB('storage'), ex = SF.p.builds.filter((b) => b.k === 'extractor');
    const linked = st ? ex.filter((b) => hyp(b.x - st.x, b.y - st.y) <= STORE_R) : [];
    return { st, linked };
  }
  // acumula no armazém a produção de 'n' extratores durante 'secs' segundos, até a capacidade
  function fillStorage(b, secs, n) {
    const k = resLevel().rate * n;
    b.stock = b.stock || { n2: 0, ice: 0 };
    b.stock.ice = Math.min(STORE_CAP.ice, b.stock.ice + 1.5 * k * secs);
    b.stock.n2 = Math.min(STORE_CAP.n2, b.stock.n2 + 1 * k * secs);
    b.t = G.stats.time;
  }
  function collectStore(b) {
    const n = Math.floor(b.stock.n2), i = Math.floor(b.stock.ice);
    G.inv.n2 += n; G.inv.ice += i; b.stock.n2 -= n; b.stock.ice -= i;
    floatText(b.x, b.y - 80, '+' + n + ' N₂ · +' + i + ' ' + t('ice'));
    burst(b.x, b.y - 40, '#8FE3FF', 16, 140);
    toast(t('t_collected', { a: n, b: i }), 'good');
    save();
  }
  function enemyCap() {
    const p = SF.p, T = SF.T;
    if (hasB('defense')) return 0;
    if (!p.terra || p.type === 'ice') return T.foes;
    return Math.ceil(T.foes / 2);
  }

  function enterSurface(pi) {
    const p = G.systems[G.sys].planets[pi], T = TYPES[p.type], r = mulberry(p.seed);
    const ship = { x: WW / 2, y: WH / 2 };
    const rp = (minD, margin) => {
      margin = margin || 90;
      for (let k = 0; k < 80; k++) {
        const x = margin + r() * (WW - 2 * margin), y = margin + r() * (WH - 2 * margin);
        if (hyp(x - ship.x, y - ship.y) > minD) return { x, y };
      }
      return { x: margin, y: margin };
    };
    const decor = [];
    for (let i = 0; i < 170; i++) { const q = rp(130, 20); decor.push({ x: q.x, y: q.y, s: 5 + r() * 16, k: r(), a: r() * TAU }); }
    const hz = [], H0 = HAZ[p.type];
    for (let i = 0; i < H0[1]; i++) {
      const q = rp(H0[0] === 'water' ? 340 : 280);
      hz.push({ k: H0[0], x: q.x, y: q.y, r: H0[2] + r() * (H0[3] - H0[2]), vx: (r() - 0.5) * 40, vy: (r() - 0.5) * 40, cd: r() * 2, ph: r() * TAU });
    }
    // os cristais cobrem a terraformação e o combustível da decolagem
    const RL = resLevel(), deposits = [], nDep = Math.ceil(((p.need + FUEL) * RL.dep) / CRYSTAL);
    for (let i = 0; i < nDep; i++) { const q = rp(230); deposits.push({ x: q.x, y: q.y, amt: CRYSTAL, taken: p.taken.includes(i), regrow: REGROW * (0.5 + r() * 0.5), ph: r() * TAU }); }
    const ices = [];
    for (let i = 0; i < RL.ice; i++) { const q = rp(190); ices.push({ x: q.x, y: q.y, amt: 8, taken: p.iceTaken.includes(i), rot: (r() - 0.5) * 0.6 }); }
    SF = {
      p, pi, T, W: WW, H: WH, ship, decor, hz, deposits, ices,
      enemies: [], balls: [], shots: [], spores: [], sheep: [], colonists: [], parts: [], callShips: [],
      t: 0, stormT: 18 + r() * 10, storm: 0, wind: { x: 0, y: 0 }, respawn: 15, shake: 0,
      pl: { x: ship.x + 70, y: ship.y + 55, fx: 1, fy: 0, hp: 100, cold: 100, cd: 0, hurt: 0, kx: 0, ky: 0, walk: 0 },
      ex: null, target: null, terraAnim: p.terra ? 1 : 0, call: null, camX: 0, camY: 0
    };
    const n = enemyCap();
    for (let i = 0; i < n; i++) spawnEnemy(true);
    p.builds.forEach((b) => { b.cd = 0; if (b.hp == null) b.hp = maxHp(b.k); if (b.k === 'barn') spawnSheep(b); });
    SF.landers = []; SF.raidOn = false; SF.raidT = 45 + Math.random() * 20;
    // produção acumulada no armazém enquanto o astronauta esteve longe
    const lk = extractorLinks();
    if (lk.st && lk.linked.length) fillStorage(lk.st, Math.max(0, G.stats.time - (lk.st.t == null ? G.stats.time : lk.st.t)), lk.linked.length);
    if (p.colony) spawnColonists();
    else if (p.builds.some((b) => b.k === 'comm')) SF.call = { t: 0 }; // retoma a chegada da colônia interrompida
    // áreas já exploradas deste planeta
    SF.seen = new Uint8Array(FCOLS * FROWS); SF.seenN = 0;
    if (typeof p.fog === 'string' && p.fog.length === SF.seen.length) for (let i = 0; i < p.fog.length; i++) if (p.fog[i] === '1') { SF.seen[i] = 1; SF.seenN++; }
    revealAround(ship.x, ship.y, REVEAL_R + 60);
    mapBig = false;
    G.onPlanet = pi;
    scene = 'surface';
  }

  function spawnEnemy(initial) {
    const S = SF, k = S.T.enemy, D = EN[k];
    let x = 0, y = 0, home = null;
    if (k === 'eel') {
      const waters = S.hz.filter((h) => h.k === 'water');
      if (!waters.length) return;
      home = waters[(Math.random() * waters.length) | 0];
      const a = Math.random() * TAU, d = Math.random() * home.r * 0.7;
      x = home.x + Math.cos(a) * d; y = home.y + Math.sin(a) * d;
    } else {
      for (let i = 0; i < 50; i++) {
        x = 60 + Math.random() * (S.W - 120); y = 60 + Math.random() * (S.H - 120);
        if (hyp(x - S.ship.x, y - S.ship.y) > 500 && hyp(x - S.pl.x, y - S.pl.y) > (initial ? 420 : 650)) break;
      }
    }
    S.enemies.push({ k, x, y, hp: D.hp, kx: 0, ky: 0, hit: 0, flash: 0, home, angry: false, wt: 0, wx: 0, wy: 0, t: Math.random() * 10 });
  }
  function spawnSheep(b) {
    for (let i = 0; i < 3; i++) {
      const sp = []; for (let k = 0; k < 7; k++) sp.push({ x: (Math.random() - 0.5) * 22, y: -12 - Math.random() * 12, c: HATS[(Math.random() * HATS.length) | 0] });
      SF.sheep.push({ x: b.x + (Math.random() - 0.5) * 120, y: b.y + 50 + Math.random() * 60, home: b, col: FLAVORS[(Math.random() * FLAVORS.length) | 0], ready: true, regrow: 0, wx: 0, wy: 0, wt: 0, f: 1, walk: 0, sp });
    }
  }
  function spawnColonists() {
    const bs = SF.p.builds;
    if (!bs.length) return;
    for (let i = 0; i < 8; i++) {
      const b = bs[i % bs.length];
      SF.colonists.push({ x: b.x + (Math.random() - 0.5) * 140, y: b.y + 40 + Math.random() * 60, tx: b.x, ty: b.y + 60, wait: Math.random() * 2, f: 1, walk: 0, col: HATS[i % HATS.length] });
    }
  }

  function nearestEnemy(x, y, range) {
    let best = null, bd = range;
    for (const e of SF.enemies) { const d = hyp(e.x - x, e.y - y); if (d < bd) { bd = d; best = e; } }
    return best;
  }
  function burst(x, y, col, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = (spd || 120) * (0.4 + Math.random());
      SF.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.4, max: 1, col, r: 2 + Math.random() * 3 });
    }
  }
  function floatText(x, y, txt, col) { SF.parts.push({ x, y, vx: 0, vy: -40, life: 1.2, max: 1.2, col: col || '#8FD3FF', txt }); }
  function hurt(n, quiet) {
    const P = SF.pl;
    P.hp -= n;
    if (!quiet) { P.hurt = 0.3; SF.shake = 0.25; }
    if (P.hp <= 0) suitFail();
  }
  function suitFail() {
    const S = SF, P = S.pl;
    G.lives = Math.max(0, (G.lives == null ? LIVES : G.lives) - 1);
    Object.assign(P, { hp: 100, cold: 100, x: S.ship.x + 70, y: S.ship.y + 55, kx: 0, ky: 0, hurt: 0 });
    S.spores = [];
    if (G.lives === 0) { gameOver(); return; }
    G.inv.n2 = Math.floor(G.inv.n2 / 2);
    save();
    // tela da vida perdida: o herói chora cubos de gelo até o jogador voltar para a base
    $('lifeText').textContent = t('lf_text', { n: G.lives, m: LIVES });
    const hearts = $('lifeHearts');
    hearts.textContent = '♥'.repeat(G.lives) + '♡'.repeat(LIVES - G.lives);
    hearts.setAttribute('aria-label', G.lives + '/' + LIVES);
    cryStart = performance.now();
    show(OV.life);
  }
  // sem vidas: mensagem de derrota, o jogo salvo é apagado e o menu principal volta sozinho
  let loseTimer = null;
  function gameOver() {
    G.lost = true;
    store.del(SAVE_KEY);
    $('loseText').textContent = t('l_text', { n: LIVES, a: colonized(), b: totalPlanets() });
    let left = 8;
    const tick = () => {
      $('loseCount').textContent = t('l_count', { s: left });
      if (left-- <= 0) { clearInterval(loseTimer); loseTimer = null; toMenu(); }
    };
    tick();
    loseTimer = setInterval(tick, 1000);
    cryStart = performance.now();
    show(OV.lose);
  }
  const maxHp = (k) => (k === 'defense' ? 160 : 100);
  // uma nave de yetis cinzentos pousa longe da nave do herói e solta os invasores
  function startRaid() {
    const S = SF;
    let x = 0, y = 0;
    for (let i = 0; i < 60; i++) {
      x = 150 + Math.random() * (S.W - 300); y = 200 + Math.random() * (S.H - 300);
      if (hyp(x - S.ship.x, y - S.ship.y) > 650 && S.p.builds.every((b) => hyp(x - b.x, y - b.y) > 300)) break;
    }
    S.landers.push({ x, y: y - 900, ty: y, st: 'down', t: 0, n: clamp(3 + Math.floor(colonized() / 2), 3, 8) });
    S.raidOn = true;
    toast(t('t_raid'), 'warn');
  }
  function dropRaiders(l) {
    for (let i = 0; i < l.n; i++) {
      const a = (i / l.n) * TAU;
      SF.enemies.push({ k: 'grayYeti', raid: true, angry: true, x: l.x + Math.cos(a) * 40, y: l.y + 20 + Math.sin(a) * 25, hp: EN.grayYeti.hp, kx: 0, ky: 0, hit: 0, flash: 0, home: null, wt: 0, wx: 0, wy: 0, t: Math.random() * 10, tgt: null });
    }
    burst(l.x, l.y, '#9AA3B5', 18, 160);
  }
  function destroyBuild(b) {
    const S = SF, p = S.p, i = p.builds.indexOf(b);
    if (i < 0) return;
    p.builds.splice(i, 1);
    if (b.k === 'barn') S.sheep = S.sheep.filter((s) => s.home !== b);
    burst(b.x, b.y - 30, '#56627F', 26, 200);
    burst(b.x, b.y - 30, '#FFFFFF', 14, 140);
    S.shake = 0.4;
    toast(t('t_destroyed', { s: t('s_' + b.k) }), 'warn');
    save();
  }
  function killEnemy(e) {
    const S = SF, i = S.enemies.indexOf(e);
    if (i < 0) return;
    S.enemies.splice(i, 1);
    burst(e.x, e.y - 14, '#FFFFFF', 14, 160);
    G.inv.n2 += 2;
    floatText(e.x, e.y - 40, '+2 N₂');
  }
  function throwBall(dx, dy) {
    const P = SF.pl, m = hyp(dx, dy) || 1;
    SF.balls.push({ x: P.x, y: P.y - 30, vx: (dx / m) * 560, vy: (dy / m) * 560, life: 0.85 });
    P.cd = 0.28; G.stats.balls++;
    if (Math.abs(dx) > 1) P.fx = dx > 0 ? 1 : -1;
  }
  const insideHz = (k, x, y) => SF.hz.some((h) => h.k === k && hyp(x - h.x, y - h.y) < h.r);

  function updateSurface(dt) {
    const S = SF, p = S.p, T = S.T, P = S.pl, terra = p.terra;
    S.t += dt;
    if (terra && S.terraAnim < 1) {
      S.terraAnim = Math.min(1, S.terraAnim + dt / 3);
      if (S.terraAnim >= 1) toast(t('t_terraDone', { name: p.name }), 'good');
    }
    // tempestade de areia
    if (p.type === 'desert' && !terra) {
      if (S.storm > 0) { S.storm -= dt; if (S.storm <= 0) S.stormT = 22 + Math.random() * 12; }
      else { S.stormT -= dt; if (S.stormT <= 0) { S.storm = 8; const a = Math.random() * TAU; S.wind = { x: Math.cos(a) * 90, y: Math.sin(a) * 90 }; toast(t('t_storm'), 'warn'); } }
    } else S.storm = 0;

    // movimento
    const v = inputVec();
    let spd = 210;
    const wet = !terra && insideHz('water', P.x, P.y);
    if (wet) spd *= 0.5;
    if (!terra && insideHz('sand', P.x, P.y)) spd *= 0.45;
    if (terra && S.hz.some((h) => (h.k === 'water' || h.k === 'lava') && hyp(P.x - h.x, P.y - h.y) < h.r)) spd *= 1.25;
    if (S.storm > 0) spd *= 0.8;
    const wx = S.storm > 0 ? S.wind.x : 0, wy = S.storm > 0 ? S.wind.y : 0;
    P.x += (v.x * spd + P.kx + wx) * dt; P.y += (v.y * spd + P.ky + wy) * dt;
    const kd = Math.max(0, 1 - 6 * dt); P.kx *= kd; P.ky *= kd;
    if (v.x || v.y) { const m = hyp(v.x, v.y); P.fy = v.y / m; if (Math.abs(v.x) > 0.2) P.fx = v.x > 0 ? 1 : -1; P.walk += dt * 9; }
    P.x = clamp(P.x, 20, S.W - 20); P.y = clamp(P.y, 30, S.H - 10);
    revealAround(P.x, P.y, REVEAL_R);
    const solid = [{ x: S.ship.x, y: S.ship.y, r: 42 }].concat(p.builds.map((b) => ({ x: b.x, y: b.y - 10, r: 40 })));
    solid.forEach((o) => { const d = hyp(P.x - o.x, P.y - o.y) || 1; if (d < o.r) { P.x = o.x + ((P.x - o.x) / d) * o.r; P.y = o.y + ((P.y - o.y) / d) * o.r; } });
    P.hurt = Math.max(0, P.hurt - dt);
    S.shake = Math.max(0, S.shake - dt);

    // temperatura e perigos
    const dShip = hyp(P.x - S.ship.x, P.y - S.ship.y);
    if (dShip < 150) { P.cold = Math.min(100, P.cold + 30 * dt); P.hp = Math.min(100, P.hp + 8 * dt); }
    else if (terra) P.cold = Math.min(100, P.cold + 5 * dt);
    else P.cold = Math.max(0, P.cold - T.drain * dt * (S.storm > 0 ? 1.6 : 1));
    if (P.cold <= 0) { hurt(6 * dt, true); warn('melt', t('t_melting'), 6000); }
    if (!terra && insideHz('lava', P.x, P.y)) { hurt(28 * dt, true); P.cold = Math.max(0, P.cold - 20 * dt); P.hurt = 0.1; warn('lava', t('t_lava')); }
    if (!terra && insideHz('toxic', P.x, P.y)) { hurt(12 * dt, true); P.hurt = 0.1; warn('toxic', t('t_toxic')); }
    if (wet) hurt(2 * dt, true);
    S.hz.forEach((h) => {
      if (h.k === 'toxic' && !terra) {
        h.x += h.vx * dt; h.y += h.vy * dt;
        if (h.x < h.r || h.x > S.W - h.r) h.vx *= -1;
        if (h.y < h.r || h.y > S.H - h.r) h.vy *= -1;
        const d = hyp(h.x - S.ship.x, h.y - S.ship.y) || 1;
        if (d < h.r + 160) { h.vx = ((h.x - S.ship.x) / d) * 30; h.vy = ((h.y - S.ship.y) / d) * 30; }
      }
      if (h.k === 'plant' && !terra) {
        h.cd -= dt;
        const d = hyp(P.x - h.x, P.y - h.y);
        if (h.cd <= 0 && d < 320 && dShip > 150) {
          h.cd = 2.4;
          const a = Math.atan2(P.y - 20 - (h.y - 30), P.x - h.x);
          S.spores.push({ x: h.x, y: h.y - 30, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, life: 2.2 });
        }
      }
    });
    S.spores = S.spores.filter((s) => {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (hyp(s.x - P.x, s.y - (P.y - 25)) < 20) { hurt(9); return false; }
      return s.life > 0;
    });

    // bolas de neve
    P.cd = Math.max(0, P.cd - dt);
    if (throwPressed && P.cd <= 0) {
      const e = nearestEnemy(P.x, P.y, 380);
      if (e) throwBall(e.x - P.x, e.y - 14 - (P.y - 30)); else throwBall(P.fx, P.fy * 0.6);
    }
    if (clickAim && P.cd <= 0) throwBall(clickAim.x - P.x, clickAim.y - (P.y - 30));
    clickAim = null;
    S.balls = S.balls.filter((b) => {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      for (const e of S.enemies) {
        if (hyp(b.x - e.x, b.y - (e.y - EN[e.k].r)) < EN[e.k].r + 8) {
          e.hp--; e.flash = 0.15; e.angry = true;
          const m = hyp(b.vx, b.vy) || 1; e.kx = (b.vx / m) * 260; e.ky = (b.vy / m) * 260;
          burst(b.x, b.y, '#FFFFFF', 6, 90);
          if (e.hp <= 0) killEnemy(e);
          return false;
        }
      }
      if (b.life <= 0) { burst(b.x, b.y, '#FFFFFF', 4, 60); return false; }
      return true;
    });

    // adversários
    const safe = dShip < 150;
    S.enemies.forEach((e) => {
      const D = EN[e.k];
      e.t += dt; e.hit = Math.max(0, e.hit - dt); e.flash = Math.max(0, e.flash - dt);
      const dx = P.x - e.x, dy = P.y - e.y, d = hyp(dx, dy) || 1;
      const hostile = T.hostile || e.angry;
      let tx, ty, sp = D.spd;
      e.atk = false;
      if (e.raid && !(d < 150 && !safe)) {
        // yeti cinzento: vai até a construção mais próxima e a destrói
        if (!e.tgt || !p.builds.includes(e.tgt)) {
          let bd = 1e9; e.tgt = null;
          p.builds.forEach((b) => { const q = hyp(b.x - e.x, b.y - e.y); if (q < bd) { bd = q; e.tgt = b; } });
        }
        if (e.tgt) {
          const bx = e.tgt.x - e.x, by = e.tgt.y + 20 - e.y, bdist = hyp(bx, by) || 1;
          if (bdist > 46) { tx = bx / bdist; ty = by / bdist; }
          else {
            tx = ty = 0; e.atk = true;
            e.tgt.hp = (e.tgt.hp == null ? maxHp(e.tgt.k) : e.tgt.hp) - 14 * dt;
            if (e.tgt.hp <= 0) destroyBuild(e.tgt);
          }
        } else { tx = dx / d; ty = dy / d; }
      } else if (hostile && d < 330 && !safe) { tx = dx / d; ty = dy / d; }
      else {
        e.wt -= dt;
        if (e.wt <= 0) { e.wt = 1.5 + Math.random() * 2; const a = Math.random() * TAU; e.wx = Math.cos(a); e.wy = Math.sin(a); }
        tx = e.wx; ty = e.wy; sp *= 0.35;
      }
      e.x += (tx * sp + e.kx) * dt; e.y += (ty * sp + e.ky) * dt;
      e.kx *= kd; e.ky *= kd;
      const sd = hyp(e.x - S.ship.x, e.y - S.ship.y) || 1;
      const keepOut = e.raid ? 90 : 210;
      if (sd < keepOut) { e.x = S.ship.x + ((e.x - S.ship.x) / sd) * keepOut; e.y = S.ship.y + ((e.y - S.ship.y) / sd) * keepOut; }
      if (e.home) {
        const hd = hyp(e.x - e.home.x, e.y - e.home.y) || 1, lim = e.home.r + 30;
        if (hd > lim) { e.x = e.home.x + ((e.x - e.home.x) / hd) * lim; e.y = e.home.y + ((e.y - e.home.y) / hd) * lim; }
      }
      e.x = clamp(e.x, 30, S.W - 30); e.y = clamp(e.y, 40, S.H - 10);
      if (hostile && d < D.r + 18 && e.hit <= 0 && !safe) { e.hit = 1; hurt(12); P.kx = (dx / d) * 380; P.ky = (dy / d) * 380; }
    });
    S.respawn -= dt;
    if (S.respawn <= 0) { S.respawn = 16; if (S.enemies.filter((e) => !e.raid).length < enemyCap()) spawnEnemy(false); }

    // ataques dos yetis cinzentos depois que a central de comunicação existe
    if (hasB('comm') && !S.call) {
      S.raidT -= dt;
      if (S.raidT <= 0) { S.raidT = 70 + Math.random() * 40; startRaid(); }
    }
    S.landers = S.landers.filter((l) => {
      l.t += dt;
      if (l.st === 'down') { l.y = Math.min(l.ty, l.y + 380 * dt); if (l.y >= l.ty) { l.st = 'drop'; l.t = 0; dropRaiders(l); } }
      else if (l.st === 'drop') { if (l.t > 1.2) l.st = 'up'; }
      else { l.y -= 420 * dt; if (l.y < l.ty - 900) return false; }
      return true;
    });
    const raiders = S.enemies.filter((e) => e.raid).length;
    if (S.raidOn && !raiders && !S.landers.length) { S.raidOn = false; toast(t('t_raidOver'), 'good'); save(); }
    // sem ataque em curso, as construções se reparam aos poucos
    if (!raiders) p.builds.forEach((b) => { const m = maxHp(b.k); if (b.hp == null || b.hp > m) b.hp = m; else if (b.hp < m) b.hp = Math.min(m, b.hp + 2 * dt); });

    // torres de defesa
    p.builds.forEach((b) => {
      if (b.k !== 'defense') return;
      b.cd = (b.cd || 0) - dt;
      const e = nearestEnemy(b.x, b.y, 470);
      if (e) {
        b.aim = Math.atan2(e.y - 14 - (b.y - 26), e.x - b.x);
        if (b.cd <= 0) { b.cd = 0.7; S.shots.push({ x: b.x + Math.cos(b.aim) * 26, y: b.y - 26 + Math.sin(b.aim) * 26, vx: Math.cos(b.aim) * 620, vy: Math.sin(b.aim) * 620, life: 1.1 }); }
      }
    });
    S.shots = S.shots.filter((s) => {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      for (const e of S.enemies) {
        if (hyp(s.x - e.x, s.y - (e.y - EN[e.k].r)) < EN[e.k].r + 8) { e.hp -= 2; e.flash = 0.15; burst(s.x, s.y, '#8FD3FF', 6, 90); if (e.hp <= 0) killEnemy(e); return false; }
      }
      return s.life > 0;
    });

    // produção do extrator
    // os extratores só entregam ao armazém; sem armazém ao alcance, ficam parados
    if (hasB('extractor')) {
      const lk = extractorLinks();
      if (lk.st && lk.linked.length) fillStorage(lk.st, dt, lk.linked.length);
    }

    // iceovelhas e colonos
    S.sheep.forEach((s) => {
      s.wt -= dt;
      if (s.wt <= 0) { s.wt = 1 + Math.random() * 3; const a = Math.random() * TAU, m = Math.random() < 0.4 ? 0 : 1; s.wx = Math.cos(a) * m; s.wy = Math.sin(a) * m; }
      s.x += s.wx * 35 * dt; s.y += s.wy * 35 * dt;
      if (s.wx) { s.f = s.wx > 0 ? 1 : -1; s.walk += dt * 8; }
      const hx = s.home.x, hy = s.home.y + 70, hd = hyp(s.x - hx, s.y - hy) || 1;
      if (hd > 130) { s.x = hx + ((s.x - hx) / hd) * 130; s.y = hy + ((s.y - hy) / hd) * 130; s.wt = 0; }
      if (!s.ready) { s.regrow -= dt; if (s.regrow <= 0) s.ready = true; }
    });
    S.colonists.forEach((c) => {
      if (c.wait > 0) { c.wait -= dt; return; }
      const dx = c.tx - c.x, dy = c.ty - c.y, d = hyp(dx, dy);
      if (d < 6) {
        c.wait = 1 + Math.random() * 3;
        // sem construções (destruídas pelos yetis cinzentos), os colonos ficam perto da nave
        const b = p.builds.length ? p.builds[(Math.random() * p.builds.length) | 0] : S.ship;
        c.tx = b.x + (Math.random() - 0.5) * 160; c.ty = b.y + 40 + Math.random() * 60;
      } else { c.x += (dx / d) * 50 * dt; c.y += (dy / d) * 50 * dt; c.f = dx > 0 ? 1 : -1; c.walk += dt * 8; }
    });

    // chegada da colônia
    if (S.call) {
      S.call.t += dt;
      if (S.call.t > 1 && !S.callShips.length) {
        const targets = p.builds.filter((b) => b.k === 'hab' || b.k === 'comm');
        for (let i = 0; i < 4; i++) { const b = targets[i % targets.length]; const tx = b.x + (i - 1.5) * 70, ty = b.y + 110; S.callShips.push({ x: tx, ty, y: ty - 900 - i * 120 }); }
      }
      S.callShips.forEach((c) => { c.y = Math.min(c.ty, c.y + 300 * dt); });
      if (S.call.t > 5 && !p.colony) {
        p.colony = true;
        spawnColonists();
        toast(t('t_colonized', { name: p.name }), 'good');
        save();
        checkWin();
      }
      if (S.call.t > 7) { S.call = null; S.callShips = []; }
    }

    // cristais extraídos se regeneram com o tempo
    S.deposits.forEach((d, i) => {
      if (!d.taken) return;
      d.regrow -= dt;
      if (d.regrow <= 0) { d.taken = false; p.taken = p.taken.filter((k) => k !== i); }
    });

    // interação
    S.target = null;
    if (dShip < 120) {
      if (!p.terra && G.inv.n2 >= p.need) S.target = { kind: 'terra' };
      else if (!(p.terra && S.terraAnim < 1) && !S.call) S.target = { kind: 'takeoff' };
    }
    if (!S.target) {
      const st = findB('storage');
      if (st && st.stock && hyp(P.x - st.x, P.y - st.y) < 80 && Math.floor(st.stock.n2) + Math.floor(st.stock.ice) > 0) S.target = { kind: 'store', b: st };
    }
    if (!S.target) {
      let bs = null, bd = 48;
      S.sheep.forEach((s) => { const d = hyp(P.x - s.x, P.y - s.y); if (s.ready && d < bd) { bd = d; bs = s; } });
      if (bs) S.target = { kind: 'sheep', s: bs };
    }
    if (!S.target) {
      let best = null, bd = 58;
      S.deposits.forEach((d, i) => { if (d.taken) return; const q = hyp(P.x - d.x, P.y - d.y); if (q < bd) { bd = q; best = { kind: 'n2', i, x: d.x, y: d.y }; } });
      if (terra) S.ices.forEach((d, i) => { if (d.taken) return; const q = hyp(P.x - d.x, P.y - d.y); if (q < bd) { bd = q; best = { kind: 'ice', i, x: d.x, y: d.y }; } });
      if (best) S.target = best;
    }
    const tg = S.target;
    if (tg && actPressed && !fade.dir) {
      if (tg.kind === 'terra') startTerraform();
      else if (tg.kind === 'takeoff') takeoff();
      else if (tg.kind === 'sheep') eatSheep(tg.s);
      else if (tg.kind === 'store') collectStore(tg.b);
    }
    if (tg && (tg.kind === 'n2' || tg.kind === 'ice') && actHeld) {
      if (!S.ex || S.ex.kind !== tg.kind || S.ex.i !== tg.i) S.ex = { kind: tg.kind, i: tg.i, x: tg.x, y: tg.y, prog: 0 };
      S.ex.prog += dt / 0.9;
      if (S.ex.prog >= 1) {
        if (tg.kind === 'n2') { const d = S.deposits[tg.i]; d.taken = true; d.regrow = REGROW; p.taken.push(tg.i); G.inv.n2 += d.amt; floatText(d.x, d.y - 30, '+' + d.amt + ' N₂'); burst(d.x, d.y - 10, '#8FE3FF', 14, 130); }
        else { const d = S.ices[tg.i]; d.taken = true; p.iceTaken.push(tg.i); G.inv.ice += d.amt; floatText(d.x, d.y - 30, '+' + d.amt + ' ' + t('ice'), '#FFFFFF'); burst(d.x, d.y - 10, '#E6F6FF', 12, 120); }
        S.ex = null;
        save();
      }
    } else S.ex = null;

    // partículas
    S.parts = S.parts.filter((q) => { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= q.txt ? 1 : 0.96; q.life -= dt; return q.life > 0; });
  }

  function startTerraform() {
    const S = SF, p = S.p;
    G.inv.n2 -= p.need;
    p.terra = true;
    S.terraAnim = 0.0001;
    S.storm = 0; S.spores = [];
    const keep = enemyCap();
    while (S.enemies.length > keep) { const e = S.enemies.pop(); burst(e.x, e.y - 14, '#FFFFFF', 10, 140); }
    toast(t('t_terraStart'), 'good');
    save();
  }
  function eatSheep(s) {
    const P = SF.pl;
    s.ready = false; s.regrow = 20;
    P.hp = 100; P.cold = 100;
    burst(s.x, s.y - 20, s.col, 14, 120);
    toast(t('t_yum'), 'good');
  }
  function takeoff() {
    if (G.inv.n2 < FUEL) { warn('fuel', t('t_noFuel', { f: FUEL, n: Math.ceil(FUEL - G.inv.n2) }), 2500); return false; }
    const pi = SF.pi;
    G.inv.n2 -= FUEL;
    fadeTo(() => { G.onPlanet = null; enterSpace(pi); save(); });
    return true;
  }
  function tryBuild(k) {
    const S = SF, p = S.p, def = STRUCTS.find((s) => s.k === k);
    if (!p.terra || !canAddMore(def)) return;
    if (!reqMet(def)) return;
    const anchor = k === 'storage' ? nearExtractor() : null;
    if (k === 'storage' && !anchor) { toast(t('b_nearExtractor'), 'warn'); return; }
    const cost = costOf(def);
    if (G.inv.ice < cost.ice || G.inv.n2 < cost.n2) { toast(t('t_noRes'), 'warn'); return; }
    const pos = findSpot(anchor);
    if (!pos) { toast(t('t_noRoom'), 'warn'); return; }
    G.inv.ice -= cost.ice; G.inv.n2 -= cost.n2;
    const b = { k, x: pos.x, y: pos.y, cd: 0, hp: maxHp(k) };
    if (k === 'storage') { b.stock = { n2: 0, ice: 0 }; b.t = G.stats.time; }
    p.builds.push(b);
    burst(b.x, b.y - 30, '#FFFFFF', 20, 160);
    toast(t('t_built', { s: t('s_' + k) }), 'good');
    if (k === 'barn') { spawnSheep(b); G.stats.sheep += 3; toast(t('t_sheepBorn'), 'good'); }
    if (k === 'comm') { S.call = { t: 0 }; toast(t('t_calling')); }
    hide(OV.build);
    save();
  }
  // anchor: o armazém precisa ficar ao alcance do extrator
  function findSpot(anchor) {
    const P = SF.pl, base = Math.atan2(P.fy, P.fx);
    for (let rr = 90; rr <= 330; rr += 40) {
      for (let k = 0; k < 12; k++) {
        const a = base + Math.ceil(k / 2) * (TAU / 12) * (k % 2 ? 1 : -1);
        const x = P.x + Math.cos(a) * rr, y = P.y + Math.sin(a) * rr;
        if (validSpot(x, y) && (!anchor || hyp(x - anchor.x, y - anchor.y) <= STORE_R - 30)) return { x, y };
      }
    }
    return null;
  }
  function validSpot(x, y) {
    const S = SF;
    if (x < 80 || y < 100 || x > S.W - 80 || y > S.H - 40) return false;
    if (hyp(x - S.ship.x, y - S.ship.y) < 140) return false;
    return S.p.builds.every((b) => hyp(x - b.x, y - b.y) > 115);
  }
  function checkWin() {
    if (G.won || !G.systems.every((s) => s.planets.every((p) => p.colony))) return;
    G.won = true;
    store.del(SAVE_KEY); // partida concluída: não há o que continuar
    setTimeout(() => {
      $('winText').textContent = t('w_text', { n: totalPlanets() });
      $('winTime').textContent = t('w_time', { t: fmtTime(G.stats.time) });
      $('winStats').textContent = t('w_stats', { b: G.stats.balls, s: G.stats.sheep, l: G.lives == null ? LIVES : G.lives });
      partyStart = performance.now();
      show(OV.win);
    }, 2600);
  }

  // ---------------------------------------------------------------- dobra espacial
  function startWarp(to) {
    hide(OV.map);
    if (to === G.sys) return;
    toast(t('t_warpTo', { name: SYS[to].name }));
    SP = { warp: { t: 0, to } };
    scene = 'warp';
  }
  function updateWarp(dt) {
    SP.warp.t += dt;
    if (SP.warp.t >= 1.6) {
      const to = SP.warp.to;
      G.sys = to;
      enterSpace(null);
      toast(t('t_arrived', { name: SYS[to].name, n: G.systems[to].planets.length }));
      save();
    }
  }

  function fadeTo(fn) { if (fade.dir) return; fade.dir = 1; fade.fn = fn; }
  function updateFade(dt) {
    if (fade.dir === 1) { fade.a += dt / 0.35; if (fade.a >= 1) { fade.a = 1; fade.dir = -1; const f = fade.fn; fade.fn = null; if (f) f(); } }
    else if (fade.dir === -1) { fade.a -= dt / 0.35; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
  }

  // ---------------------------------------------------------------- desenho: peças
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function shadow(rx, ry) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fill(); }
  function snowball(x, y, r) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.2, x, y, r);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#C9DEF2');
    circle(x, y, r, g);
  }

  function drawSnowman(x, y, fx, walk, o) {
    const s = fx < 0 ? -1 : 1, bob = Math.abs(Math.sin(walk)) * 2, sw = Math.sin(walk) * 0.6;
    ctx.save(); ctx.translate(x, y); ctx.scale(o.scale || 1, o.scale || 1);
    shadow(18, 6);
    ctx.translate(0, -bob);
    if (o.helmet) { ctx.fillStyle = '#8E9BBE'; rrect(-s * 14 - 7, -50, 14, 26, 4); ctx.fill(); ctx.fillStyle = '#5FD3A4'; circle(-s * 14, -44, 2.2, '#5FD3A4'); }
    ctx.strokeStyle = '#7A4E2D'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    if (o.sad) { ctx.moveTo(-10, -28); ctx.lineTo(-20, -14); ctx.moveTo(-18, -17); ctx.lineTo(-23, -15); ctx.moveTo(10, -28); ctx.lineTo(20, -14); ctx.moveTo(18, -17); ctx.lineTo(23, -15); }
    else if (o.cheer) {
      // braços erguidos, comemorando
      const wv = Math.sin(walk) * 5;
      ctx.moveTo(-10, -30); ctx.lineTo(-17, -60 + wv); ctx.moveTo(-15, -53 + wv); ctx.lineTo(-22, -57 + wv);
      ctx.moveTo(10, -30); ctx.lineTo(17, -60 - wv); ctx.moveTo(15, -53 - wv); ctx.lineTo(22, -57 - wv);
    }
    else {
      ctx.moveTo(-10, -30); ctx.lineTo(-25, -38 + sw * 8); ctx.moveTo(-21, -36 + sw * 6); ctx.lineTo(-25, -32 + sw * 6);
      ctx.moveTo(10, -30); ctx.lineTo(25, -38 - sw * 8); ctx.moveTo(21, -36 - sw * 6); ctx.lineTo(25, -32 - sw * 6);
    }
    ctx.stroke();
    snowball(0, -16, 16);
    circle(0, -22, 1.8, '#26223A'); circle(0, -13, 1.8, '#26223A');
    snowball(0, -40, 12);
    ctx.fillStyle = '#E63B5A'; rrect(-11, -31, 22, 6, 3); ctx.fill();
    ctx.save(); ctx.translate(-s * 6, -28); ctx.rotate(-s * (0.2 + Math.sin(walk * 0.7) * 0.15)); rrect(-2.5, 0, 5, 13, 2); ctx.fill(); ctx.restore();
    circle(s * 3 - 3.5, -43, 1.7, '#1B1B2F'); circle(s * 3 + 3.5, -43, 1.7, '#1B1B2F');
    ctx.fillStyle = '#FF8A1F'; ctx.beginPath(); ctx.moveTo(s * 3, -41); ctx.lineTo(s * 15, -39); ctx.lineTo(s * 3, -37); ctx.closePath(); ctx.fill();
    for (let i = -2; i <= 2; i++) circle(s * 2 + i * 2.6, o.sad ? -36 + Math.abs(i) * 0.9 : -34.5 - Math.abs(i) * 0.6, 0.9, '#1B1B2F');
    if (o.sad) {
      // sobrancelhas tristes, com as pontas de dentro levantadas
      const e1 = s * 3 - 3.5, e2 = s * 3 + 3.5;
      ctx.strokeStyle = '#1B1B2F'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(e1 - 3, -46); ctx.lineTo(e1 + 2.5, -48.5); ctx.moveTo(e2 + 3, -46); ctx.lineTo(e2 - 2.5, -48.5); ctx.stroke();
    }
    if (o.hat) {
      ctx.fillStyle = o.hat; ctx.beginPath(); ctx.arc(0, -49, 9, Math.PI, 0); ctx.fill();
      rrect(-10, -50, 20, 4, 2); ctx.fill(); circle(0, -59, 3, '#FFFFFF');
    }
    if (o.helmet) {

    if (!OV.life.hidden) drawCry($('cryLife'));
    if (!OV.lose.hidden) drawCry($('cryLose'));
    if (!OV.win.hidden) drawParty($('party'));
  }

  // ---------------------------------------------------------------- HUD
  const hud = $('hud'), promptEl = $('prompt'), objEl = $('objective'), locEl = $('loc');
  function setText(el, s) { if (el._v !== s) { el._v = s; el.textContent = s; } }
  function setHTML(el, s) { if (el._v !== s) { el._v = s; el.innerHTML = s; } }
  function updateHud() {
    const show = playing();
    hud.hidden = !show;
    $('touch').hidden = !(show && isTouch);
    document.body.dataset.scene = scene;
    if (!show) { promptEl.hidden = true; return; }
    setText($('rN2'), String(Math.floor(G.inv.n2)));
    setText($('rIce'), String(Math.floor(G.inv.ice)));
    setText($('rHab'), colonized() + '/' + totalPlanets());
    const lv = clamp(G.lives == null ? LIVES : G.lives, 0, LIVES), rl = $('rLives');
    setText(rl, '♥'.repeat(lv) + '♡'.repeat(LIVES - lv));
    rl.classList.toggle('low', lv === 1);
    setText($('rTime'), fmtTime(G.stats.time));
    rl.setAttribute('aria-label', lv + '/' + LIVES);
    setText(tThrow, scene === 'space' ? t('sensor') : t('throw'));
    let prompt = '', obj = '';
    if (scene === 'space' || scene === 'warp') {
      setHTML(locEl, '<strong>' + t('sysName', { name: SYS[scene === 'warp' ? SP.warp.to : G.sys].name }) + '</strong>');
      const sys = G.systems[G.sys];
      if (scene === 'space' && SP.near != null) {
        const p = sys.planets[SP.near];
        if (p.scanned) {
          const st = p.colony ? t('st_colony') : p.terra ? t('st_terra') : t('st_wild');
          obj = '<strong>' + p.name + '</strong> · ' + t('ty_' + p.type) + ' · ' + fmtTemp(p.temp) + '<br>' + cap(t('i_threat', { l: t('threat' + TYPES[p.type].threat) })) + ' · ' + st + (p.terra ? '' : '<br>' + t('i_need', { n: p.need }));
          prompt = t('p_land', { k: keyLabel(), name: p.name });
        } else { obj = '<strong>?</strong> ' + t('st_unknown'); prompt = t('p_scanFirst', { k: isTouch ? t('sensor') : 'Q' }); }
      } else if (sys.planets.every((p) => p.colony)) obj = t('o_sys');
      else obj = sys.planets.some((p) => p.scanned && !p.colony) ? t('o_land') : t('o_scan');
    } else if (scene === 'surface') {
      const S = SF, p = S.p, P = S.pl;
      setHTML(locEl, '<strong>' + p.name + '</strong> <span>· ' + t('ty_' + p.type) + ' · ' + fmtTemp(p.terra ? Math.min(p.temp, -60) : p.temp) + '</span>');
      const bc = $('barCold'), bh = $('barHp');
      bc.querySelector('b').style.width = Math.max(0, P.cold) + '%'; bh.querySelector('b').style.width = Math.max(0, P.hp) + '%';
      bc.classList.toggle('low', P.cold < 25); bh.classList.toggle('low', P.hp < 30);
      if (S.raidOn) obj = t('o_raid');
      else if (S.call && !p.colony) obj = t('o_calling');
      else if (p.colony) obj = G.inv.n2 >= FUEL ? t('o_done') : t('o_doneFuel', { n: Math.ceil(FUEL - G.inv.n2), f: FUEL });
      else if (!p.terra) obj = G.inv.n2 >= p.need ? t('o_terra') : t('o_collect', { a: Math.floor(G.inv.n2), b: p.need });
      else if (S.terraAnim < 1) obj = t('o_terraAnim');
      else {
        const missing = STRUCTS.filter((s) => !s.optional && !hasB(s.k));
        obj = missing.length === 1 ? t('o_comm') : t('o_build', { k: isTouch ? t('build') : 'B', list: missing.filter((s) => s.k !== 'comm').map((s) => t('s_' + s.k)).join(', ') });
      }
      const tg = S.target, k = keyLabel();
      if (tg) prompt = tg.kind === 'terra' ? t('p_terra', { k, n: p.need }) : tg.kind === 'takeoff' ? (G.inv.n2 >= FUEL ? t('p_takeoff', { k, f: FUEL }) : t('p_noFuel', { k, n: Math.ceil(FUEL - G.inv.n2) })) : tg.kind === 'sheep' ? t('p_sheep', { k }) : tg.kind === 'store' ? t('p_store', { k, a: Math.floor(tg.b.stock.n2), b: Math.floor(tg.b.stock.ice) }) : tg.kind === 'n2' ? t('p_n2', { k }) : t('p_ice', { k });
    }
    setHTML(objEl, obj);
    objEl.hidden = !obj;
    promptEl.hidden = !prompt || anyModal();
    setText(promptEl, prompt);
  }

  // ---------------------------------------------------------------- painéis
  function show(o) { o.hidden = false; const f = o.querySelector('.btn:not([disabled]), select'); if (f) f.focus({ preventScroll: true }); actHeld = false; for (const k in keys) keys[k] = false; }
  function hide(o) { o.hidden = true; }
  function togglePause() { if (!playing()) return; if (!OV.pause.hidden) { hide(OV.pause); return; } if (anyModal()) return; show(OV.pause); }
  function openHelp() { show(OV.help); }
  function openBuild() { if (scene !== 'surface' || anyModal()) return; renderBuild(); show(OV.build); }
  function openMap() { if (!(scene === 'space' || scene === 'surface') || anyModal()) return; renderMap(); show(OV.map); }

  function renderBuild() {
    const S = SF, p = S.p, list = $('buildList');
    $('buildMsg').textContent = p.terra ? '' : t('b_locked');
    $('buildMsg').hidden = p.terra;
    list.innerHTML = '';
    STRUCTS.forEach((d) => {
      const li = document.createElement('li'); li.className = 'item';
      const built = !canAddMore(d), locked = !reqMet(d), cst = costOf(d);
      const blockMsg = locked ? (d.k === 'storage' ? t('b_needExtractor') : t('b_needAll')) : d.k === 'storage' && !nearExtractor() ? t('b_nearExtractor') : '';
      const lack = G.inv.ice < cst.ice || G.inv.n2 < cst.n2;
      const cost = t('ice') + ' ' + cst.ice + (cst.n2 ? ' · N₂ ' + cst.n2 : '');
      li.innerHTML = '<div><h4></h4><p></p><span class="cost"></span></div><div class="act"></div>';
      li.querySelector('h4').textContent = t('s_' + d.k) + (d.max ? ' · ' + countB(d.k) + '/' + d.max : '');
      li.querySelector('p').textContent = t('d_' + d.k);
      const c = li.querySelector('.cost'); c.textContent = built ? '' : cost; if (lack && !built) c.classList.add('lack');
      const act = li.querySelector('.act');
      if (built) { act.innerHTML = '<span class="state"></span>'; act.firstChild.textContent = '✓ ' + t('b_built'); }
      else if (blockMsg) { act.innerHTML = '<span class="need"></span>'; act.firstChild.textContent = blockMsg; }
      else {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = t('b_build');
        b.disabled = !p.terra || S.terraAnim < 1 || lack;
        b.addEventListener('click', () => tryBuild(d.k));
        act.appendChild(b);
      }
      list.appendChild(li);
    });
  }
  function renderMap() {
    const list = $('sysList');
    $('mapMsg').textContent = scene === 'surface' ? t('t_takeoffFirst') : '';
    $('mapMsg').hidden = scene !== 'surface';
    list.innerHTML = '';
    G.systems.forEach((s, i) => {
      const li = document.createElement('li'); li.className = 'item sys';
      const done = s.planets.filter((p) => p.colony).length;
      li.innerHTML = '<span class="star"></span><div><h4></h4><p></p><div class="dots"></div></div><div class="act"></div>';
      li.querySelector('.star').style.background = `radial-gradient(circle at 35% 35%, #fff, ${SYS[i].core} 45%, rgb(${SYS[i].glow}))`;
      li.querySelector('h4').textContent = t('sysName', { name: SYS[i].name });
      li.querySelector('p').textContent = t('m_hab', { a: done, b: s.planets.length });
      const dots = li.querySelector('.dots');
      s.planets.forEach((p) => { const d = document.createElement('i'); d.style.background = p.colony ? '#E4F2FD' : p.scanned ? TYPES[p.type].g[1] : ''; if (p.colony) d.className = 'c'; d.title = p.name; dots.appendChild(d); });
      const act = li.querySelector('.act');
      if (i === G.sys) { act.innerHTML = '<span class="here"></span>'; act.firstChild.textContent = t('m_here'); }
      else {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = t('m_travel');
        b.disabled = scene !== 'space';
        b.addEventListener('click', () => startWarp(i));
        act.appendChild(b);
      }
      list.appendChild(li);
    });
  }

  function refreshTitle() {
    const has = !!store.get(SAVE_KEY);
    $('bCont').hidden = !has;
    $('owNote').hidden = !has;
  }
  function startNew() {
    store.del(SAVE_KEY);
    G = newGame($('sizeSel').value, $('resSel').value);
    hide(OV.title);
    enterSpace(null);
    toast(t('t_arrived', { name: SYS[0].name, n: G.systems[0].planets.length }));
    toast(t('o_scan'));
    save();
  }
  function continueGame() {
    const g = store.get(SAVE_KEY);
    if (!g || !g.systems) { refreshTitle(); return; }
    G = g;
    // jogos salvos antes da temperatura por planeta
    G.systems.forEach((s) => s.planets.forEach((p, i) => { if (p.temp == null || p.need == null) setClimate(p, i); }));
    if (G.lives == null) G.lives = LIVES;
    hide(OV.title);
    if (G.onPlanet != null) enterSurface(G.onPlanet); else enterSpace(null, true);
  }
  function toMenu() {
    if (loseTimer) { clearInterval(loseTimer); loseTimer = null; }
    save();
    Object.values(OV).forEach(hide);
    G = null; SP = null; SF = null; scene = 'title';
    refreshTitle();
    show(OV.title);
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'new') startNew();
    else if (a === 'continue') continueGame();
    else if (a === 'help') openHelp();
    else if (a === 'closeHelp') hide(OV.help);
    else if (a === 'resume') hide(OV.pause);
    else if (a === 'menu' || a === 'loseMenu') toMenu();
    else if (a === 'toBase') hide(OV.life);
    else if (a === 'close') { hide(OV.build); hide(OV.map); }
    else if (a === 'winMenu') toMenu();
    else if (a === 'scan') doScan();
    else if (a === 'map') openMap();
    else if (a === 'build') openBuild();
    else if (a === 'pause') togglePause();
  });

  // ---------------------------------------------------------------- idioma
  function applyLang() {
    document.documentElement.lang = { pt: 'pt-BR', en: 'en', it: 'it', es: 'es' }[lang];
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('.langSel').forEach((s) => { s.value = lang; });
    $('backLink').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    objEl._v = null; locEl._v = null; promptEl._v = null;
    if (!OV.build.hidden) renderBuild();
    if (!OV.map.hidden) renderMap();
    saveSettings();
  }
  document.querySelectorAll('.langSel').forEach((s) => s.addEventListener('change', () => { lang = s.value; applyLang(); }));
  $('sizeSel').addEventListener('change', saveSettings);
  $('resSel').addEventListener('change', saveSettings);

  const settings = store.get(SET_KEY) || {};
  const hashLang = (location.hash || '').replace('#', '');
  const navLang = ((navigator.language || 'pt').slice(0, 2)).toLowerCase();
  lang = I18N[hashLang] ? hashLang : I18N[settings.lang] ? settings.lang : I18N[navLang] ? navLang : 'pt';
  if (settings.size && COUNTS[settings.size]) $('sizeSel').value = settings.size; else $('sizeSel').value = 'normal';
  $('resSel').value = settings.res && RES[settings.res] ? settings.res : 'sufficient';
  applyLang();
  refreshTitle();

  // ---------------------------------------------------------------- laço principal
  let last = performance.now(), autosave = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (G && !anyModal()) {
      if (scene === 'space') updateSpace(dt);
      else if (scene === 'surface') updateSurface(dt);
      else if (scene === 'warp') updateWarp(dt);
      if (playing() && !G.won) { G.stats.time += dt; autosave += dt; if (autosave > 10) { autosave = 0; save(); } }
    }
    updateFade(dt);
    draw(now / 1000);
    updateHud();
    actPressed = false; throwPressed = false;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
