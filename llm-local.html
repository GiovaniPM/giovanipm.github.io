<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>LLM Local · Giovani Perotto Mesquita</title>
<meta name="description" content="LLM Local: converse com modelos de linguagem GGUF rodando na GPU (WebGPU) ou em todos os núcleos da CPU, e treine um mini-GPT do zero no navegador. Nada sai do computador. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<style>
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --surface-2:#FBF1E3; --ink:#2B1B3D; --text:#3E3350; --muted:#756986; --line:#F1E2CF;
  --accent:#0E8074; --accent-ink:#FFFFFF; --accent-soft:#E2F6F2; --violet:#5B2A86; --gold:#B35300; --gold-soft:#FFF1C9; --bad:#C62828; --ok:#1B7F3B;
  --user:#EFE6FA; --bot:#FFFFFF;
  --sans:"Hanken Grotesk","Segoe UI","Helvetica Neue",Arial,sans-serif; --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace; --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#1A1328; --surface:#241A36; --surface-2:#2D2244; --ink:#F7F0FF; --text:#E2D8F0; --muted:#A898C0; --line:#3A2D52;
  --accent:#5FD3C4; --accent-ink:#10231F; --accent-soft:#1D3A38; --violet:#C9A7F5; --gold:#FFC94D; --gold-soft:#3A2E12; --bad:#FF8A8A; --ok:#7BD88F;
  --user:#33264D; --bot:#241A36;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{min-height:100vh;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;padding:.5rem .9rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand h1{font-family:var(--serif);font-size:1.25rem;margin:0;color:var(--ink);line-height:1.1}
.brand p{margin:0;font-size:.8rem;color:var(--muted)}
.tools{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem .75rem;min-height:38px;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{min-height:32px;padding:.25rem .6rem;font-size:.85rem}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.35rem .5rem;min-height:38px;color:var(--ink);max-width:100%}
textarea{resize:vertical;line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:999px;padding:.25rem .65rem;font-size:.82rem;background:var(--surface-2);color:var(--ink);min-height:34px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.chip .dot.on{background:var(--ok)}
.tabs{display:flex;gap:.3rem;padding:.6rem .9rem 0;max-width:1320px;width:100%;margin:0 auto}
.tabs button{border:1px solid var(--line);border-bottom:none;background:var(--surface-2);border-radius:12px 12px 0 0;padding:.55rem 1rem;font-weight:700;color:var(--muted);min-height:44px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
main{flex:1;max-width:1320px;width:100%;margin:0 auto;padding:0 .9rem 1.2rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);padding:1rem;display:grid;grid-template-columns:330px minmax(0,1fr);gap:1rem;min-height:calc(100vh - 150px)}
aside.side{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.box{border:1px solid var(--line);border-radius:12px;padding:.75rem;background:var(--surface-2);min-width:0}
.box h2{font-size:1rem;margin:0 0 .55rem;color:var(--ink);display:flex;align-items:center;gap:.4rem}
.box h2 small{font-weight:400;color:var(--muted);font-size:.8rem}
.field{display:flex;flex-direction:column;gap:.2rem;font-size:.84rem;font-weight:600;color:var(--ink);margin-bottom:.55rem;min-width:0}
.field select,.field input,.field textarea{width:100%;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.field output{font-weight:400;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:.45rem;font-size:.86rem;margin-bottom:.4rem}
.check input{width:18px;height:18px;accent-color:var(--accent)}
dl.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .7rem;margin:.2rem 0 .3rem;font-size:.83rem}
dl.info dt{color:var(--muted)}
dl.info dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.prog{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:.4rem 0 .2rem}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--violet));transition:width .15s}
.status{font-size:.84rem;color:var(--muted);min-height:1.2em;overflow-wrap:anywhere}
.status.err{color:var(--bad);font-weight:600}
.status.ok{color:var(--ok);font-weight:600}
.hint{font-size:.8rem;color:var(--muted);line-height:1.45;margin:.35rem 0 0}
.hint code{font-family:var(--mono);font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 .25rem}
.hint ul{margin:.3rem 0 0;padding-left:1.1rem}
/* conversa */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.7rem;padding:.3rem .2rem .8rem;min-height:320px;max-height:calc(100vh - 290px)}
.empty{margin:auto;max-width:56ch;text-align:center;color:var(--muted);line-height:1.55;padding:1rem}
.empty strong{color:var(--ink)}
.msg{max-width:min(78ch,92%);border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.msg .who{display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:.15rem;white-space:normal}
.msg .think{display:block;color:var(--muted);font-size:.86rem;border-left:3px solid var(--line);padding-left:.55rem;margin-bottom:.4rem;font-style:italic}
.msg .body code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 .25rem}
.msg .body strong{color:var(--ink)}
.msg .meta{display:block;font-size:.72rem;color:var(--muted);margin-top:.3rem;white-space:normal}
.msg.err{border-color:var(--bad);color:var(--bad)}
.caret::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.compose{display:flex;gap:.5rem;align-items:flex-end;border-top:1px solid var(--line);padding-top:.7rem}
.compose textarea{flex:1;min-height:52px;max-height:200px}
.compose .acts{display:flex;flex-direction:column;gap:.35rem}
.stats{display:flex;flex-wrap:wrap;gap:.35rem;font-size:.8rem;color:var(--muted);margin:.4rem 0 0}
.stats span{border:1px solid var(--line);border-radius:999px;padding:.1rem .55rem;background:var(--surface-2)}
/* treino */
.tmain{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem}
.card{border:1px solid var(--line);border-radius:12px;padding:.5rem .65rem;background:var(--surface-2)}
.card b{display:block;font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.card span{font-size:.76rem;color:var(--muted)}
.chartbox{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:.5rem}
#chart{display:block;width:100%;height:260px}
.legend{display:flex;gap:1rem;font-size:.8rem;color:var(--muted);padding:.2rem .3rem;flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:.3rem}
.legend i.val{border-top:3px dashed var(--gold)}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:.86rem;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;margin:.3rem 0 0;min-height:4.5em;max-height:260px;overflow:auto;color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:.4rem}
.gen{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px auto;gap:.5rem;align-items:end}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:0;width:min(720px,calc(100vw - 20px));max-height:calc(100vh - 20px)}
dialog::backdrop{background:rgba(10,6,20,.6)}
.dlg{padding:1rem 1.2rem 1.2rem;overflow:auto;max-height:calc(100vh - 22px)}
.dlg h2{font-family:var(--serif);color:var(--ink);margin:0 0 .7rem;font-size:1.35rem}
.dlg h3{color:var(--ink);margin:1rem 0 .3rem;font-size:1rem}
.dlg p,.dlg li{line-height:1.55;max-width:68ch}
.dlg table{width:100%;border-collapse:collapse;font-size:.88rem}
.dlg th,.dlg td{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:left;vertical-align:top}
.acts2{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
@media (max-width:960px){.panel{grid-template-columns:1fr;min-height:0}.msgs{max-height:60vh}#pChat aside.side{display:contents}#pChat aside.side>.box:first-child{order:1}#pChat .chat{order:2}#pChat aside.side>.box:last-child{order:3}}
@media (max-width:760px){.brand p{display:none}.gen{grid-template-columns:1fr 1fr}.gen .field:first-child{grid-column:1/-1}}
@media (max-width:480px){.row3{grid-template-columns:1fr 1fr}.tabs{padding:.5rem .5rem 0}main{padding:0 .5rem 1rem}.panel{padding:.7rem}.tools .btn{padding:.35rem .55rem}.chip .lbl{display:none}.compose{flex-direction:column;align-items:stretch}.compose .acts{flex-direction:row}.compose .acts .btn{flex:1}.tabs button{padding:.5rem .7rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.tabs,.compose,aside.side{display:none}.panel{border:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#5B2A86"/><rect x="9" y="9" width="22" height="22" rx="4" fill="#0E8074"/><g fill="#FFB703"><rect x="13" y="4" width="2.4" height="5" rx="1"/><rect x="19" y="4" width="2.4" height="5" rx="1"/><rect x="25" y="4" width="2.4" height="5" rx="1"/><rect x="13" y="31" width="2.4" height="5" rx="1"/><rect x="19" y="31" width="2.4" height="5" rx="1"/><rect x="25" y="31" width="2.4" height="5" rx="1"/><rect x="4" y="13" width="5" height="2.4" rx="1"/><rect x="4" y="19" width="5" height="2.4" rx="1"/><rect x="4" y="25" width="5" height="2.4" rx="1"/><rect x="31" y="13" width="5" height="2.4" rx="1"/><rect x="31" y="19" width="5" height="2.4" rx="1"/><rect x="31" y="25" width="5" height="2.4" rx="1"/></g><path d="M14 16h12M14 20h9M14 24h11" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    <div><h1 data-i="title"></h1><p data-i="subtitle"></p></div>
  </div>
  <div class="tools">
    <button type="button" class="chip" id="bDevice" aria-haspopup="dialog"><span class="dot" id="devDot"></span><span id="devText"></span></button>
    <button type="button" class="btn" id="bHelp" data-i="help"></button>
    <button type="button" class="btn" id="bTheme" data-ta="theme">◐</button>
    <select id="sLang" data-ta="lang"><option value="pt">🇧🇷 PT</option><option value="en">🇬🇧 EN</option><option value="it">🇮🇹 IT</option><option value="es">🇪🇸 ES</option></select>
  </div>
</header>

<nav class="tabs" role="tablist" data-ta="tabsLabel">
  <button type="button" role="tab" id="tab-chat" aria-controls="pChat" aria-selected="true"><span aria-hidden="true">💬 </span><span data-i="tabChat"></span></button>
  <button type="button" role="tab" id="tab-train" aria-controls="pTrain" aria-selected="false" tabindex="-1"><span aria-hidden="true">🧠 </span><span data-i="tabTrain"></span></button>
</nav>

<main>
<section class="panel" id="pChat" role="tabpanel" aria-labelledby="tab-chat">
  <aside class="side">
    <div class="box">
      <h2 data-i="model"></h2>
      <input type="file" id="fGguf" accept=".gguf" hidden>
      <div class="btns"><button type="button" class="btn primary" id="bOpen" data-i="openGguf"></button><button type="button" class="btn" id="bReload" data-i="reload" disabled></button><button type="button" class="btn" id="bUnload" data-i="unload" disabled></button></div>
      <div class="prog" aria-hidden="true"><i id="loadBar"></i></div>
      <p class="status" id="loadStatus" role="status" aria-live="polite"></p>
      <dl class="info" id="modelInfo" hidden></dl>
      <div class="row2">
        <label class="field"><span data-i="backend"></span><select id="sBackend"><option value="auto" data-i="beAuto"></option><option value="gpu" data-i="beGpu"></option><option value="cpu" id="optCpu"></option></select></label>
        <label class="field"><span data-i="context"></span><select id="sCtx"><option>512</option><option>1024</option><option selected>2048</option><option>4096</option><option>8192</option></select></label>
      </div>
      <label class="field"><span data-i="template"></span><select id="sTpl"><option value="auto" id="optTplAuto"></option><option value="chatml">ChatML (Qwen, SmolLM)</option><option value="llama3">Llama 3</option><option value="zephyr">Zephyr (TinyLlama)</option><option value="mistral">Mistral / Llama 2</option><option value="none" data-i="tplNone"></option></select></label>
      <label class="check" hidden><input type="checkbox" id="cThink"><span data-i="think"></span></label>
      <div class="hint" data-i="whereModels"></div>
    </div>
    <div class="box">
      <h2 data-i="genTitle"></h2>
      <label class="field"><span><span data-i="temp"></span> <output id="oTemp"></output></span><input type="range" id="rTemp" min="0" max="1.5" step="0.05" value="0.7"></label>
      <div class="row3">
        <label class="field"><span>Top-k</span><input type="number" id="nTopK" min="0" max="500" value="40"></label>
        <label class="field"><span>Top-p</span><input type="number" id="nTopP" min="0" max="1" step="0.05" value="0.9"></label>
        <label class="field"><span data-i="rep"></span><input type="number" id="nRep" min="1" max="2" step="0.05" value="1.05"></label>
      </div>
      <div class="row2">
        <label class="field"><span data-i="maxTok"></span><input type="number" id="nMax" min="16" max="4096" value="512"></label>
        <label class="field"><span data-i="seed"></span><input type="number" id="nSeed" min="0" max="999999999" value="42"></label>
      </div>
      <label class="field"><span data-i="system"></span><textarea id="tSystem" rows="3"></textarea></label>
    </div>
  </aside>
  <div class="chat">
    <div class="msgs" id="msgs" role="log" aria-live="polite" aria-relevant="additions"><div class="empty" id="empty"></div></div>
    <div class="stats" id="chatStats"></div>
    <form class="compose" id="compose">
      <label class="sr" for="inp" data-i="yourMsg"></label>
      <textarea id="inp" rows="2" disabled></textarea>
      <div class="acts">
        <button type="submit" class="btn primary" id="bSend" data-i="send" disabled></button>
        <button type="button" class="btn" id="bStop" data-i="stop" disabled></button>
        <button type="button" class="btn" id="bClear" data-i="newChat"></button>
      </div>
    </form>
  </div>
</section>

<section class="panel" id="pTrain" role="tabpanel" aria-labelledby="tab-train" hidden>
  <aside class="side">
    <div class="box">
      <h2 data-i="corpus"></h2>
      <div class="btns" style="margin-bottom:.5rem"><button type="button" class="btn small" id="bSample" data-i="sampleText"></button><button type="button" class="btn small" id="bTxt" data-i="openTxt"></button><input type="file" id="fTxt" accept=".txt,text/plain" hidden></div>
      <label class="field"><span class="sr" data-i="corpus"></span><textarea id="tCorpus" rows="8" spellcheck="false"></textarea></label>
      <p class="hint" id="corpusInfo"></p>
    </div>
    <div class="box">
      <h2 data-i="arch"></h2>
      <div class="row3">
        <label class="field"><span data-i="layers"></span><select id="sL"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>6</option></select></label>
        <label class="field"><span data-i="width"></span><select id="sC"><option>32</option><option>64</option><option selected>128</option><option>192</option><option>256</option></select></label>
        <label class="field"><span data-i="heads"></span><select id="sH"><option>2</option><option selected>4</option><option>8</option></select></label>
      </div>
      <div class="row3">
        <label class="field"><span data-i="block"></span><select id="sT"><option>32</option><option selected>64</option><option>128</option><option>256</option></select></label>
        <label class="field"><span data-i="batch"></span><select id="sB"><option>8</option><option>16</option><option selected>32</option><option>64</option></select></label>
        <label class="field"><span data-i="lr"></span><select id="sLr"><option>0.0003</option><option>0.001</option><option selected>0.002</option><option>0.003</option></select></label>
      </div>
      <div class="row2">
        <label class="field"><span data-i="steps"></span><select id="sSteps"><option>300</option><option>1000</option><option selected>2000</option><option>5000</option><option>20000</option></select></label>
        <label class="field"><span data-i="seed"></span><input type="number" id="nTSeed" min="0" max="999999999" value="1234"></label>
      </div>
      <p class="hint" id="archInfo"></p>
      <div class="btns"><button type="button" class="btn primary" id="bTrain" data-i="train"></button><button type="button" class="btn" id="bReset" data-i="reset" disabled></button></div>
      <div class="btns" style="margin-top:.4rem"><button type="button" class="btn small" id="bSaveM" data-i="saveModel" disabled></button><button type="button" class="btn small" id="bLoadM" data-i="loadModel"></button><input type="file" id="fModel" accept=".bin" hidden></div>
      <p class="status" id="trainStatus" role="status" aria-live="polite"></p>
    </div>
  </aside>
  <div class="tmain">
    <div class="cards">
      <div class="card"><b id="kStep">0</b><span data-i="kStep"></span></div>
      <div class="card"><b id="kLoss">—</b><span data-i="kLoss"></span></div>
      <div class="card"><b id="kVal">—</b><span data-i="kVal"></span></div>
      <div class="card"><b id="kRate">—</b><span data-i="kRate"></span></div>
      <div class="card"><b id="kMs">—</b><span data-i="kMs"></span></div>
      <div class="card"><b id="kFlops">—</b><span data-i="kFlops"></span></div>
    </div>
    <div class="chartbox">
      <canvas id="chart" role="img" data-ta="chartLabel"></canvas>
      <div class="legend"><span><i></i><span data-i="lgTrain"></span></span><span><i class="val"></i><span data-i="lgVal"></span></span><span id="lgBase"></span></div>
    </div>
    <div class="box">
      <h2><span data-i="preview"></span> <small data-i="previewHint"></small></h2>
      <pre class="out" id="preview" aria-live="off"></pre>
    </div>
    <div class="box">
      <h2 data-i="generate"></h2>
      <div class="gen">
        <label class="field"><span data-i="start"></span><input type="text" id="gPrompt"></label>
        <label class="field"><span data-i="length"></span><input type="number" id="gLen" min="10" max="5000" value="400"></label>
        <label class="field"><span data-i="temp"></span><input type="number" id="gTemp" min="0" max="2" step="0.05" value="0.8"></label>
        <div class="field"><span>&nbsp;</span><button type="button" class="btn primary" id="bGen" data-i="genBtn" disabled></button></div>
      </div>
      <pre class="out" id="genOut" aria-live="polite"></pre>
    </div>
  </div>
</section>
</main>

<dialog id="dDevice" aria-labelledby="hDevice"><div class="dlg">
  <h2 id="hDevice" data-i="devTitle"></h2>
  <table><tbody id="devTable"></tbody></table>
  <p class="hint" data-i="devNote"></p>
  <div class="acts2"><button type="button" class="btn primary" data-close data-i="close"></button></div>
</div></dialog>

<dialog id="dHelp" aria-labelledby="hHelp"><div class="dlg">
  <h2 id="hHelp" data-i="helpTitle"></h2>
  <div id="helpBody"></div>
  <div class="acts2"><button type="button" class="btn primary" data-close data-i="close"></button></div>
</div></dialog>

<script type="text/plain" id="src-worker">
/* ===================== Worker: dequantização paralela e produto matriz-vetor em int8 =====================
   Recebe o texto do núcleo (GG) antes deste. Mensagens:
   deq   -> dequantiza bytes e devolve f16 (Uint16Array) ou f32
   store -> guarda uma fatia de linhas de uma matriz, requantizada em int8 por blocos de 32
   mv    -> calcula y = W·x para várias matrizes guardadas

const MATS = new Map();

  const nb = cols / 32, q = new Int8Array(rows * cols), s = new Float32Array(rows * nb);
  for (let b = 0, o = 0; b < rows * nb; b++, o += 32) {
    let m = 0; for (let j = 0; j < 32; j++) { const a = Math.abs(f[o + j]); if (a > m) m = a; }
    const d = m / 127, inv = d ? 1 / d : 0; s[b] = d;
    for (let j = 0; j < 32; j++) q[o + j] = Math.round(f[o + j] * inv);

  return { q, s, rows, cols };
}
function mv(M, x, y) {
  const { q, s, rows, cols } = M, nb = cols / 32;
  for (let r = 0; r < rows; r++) {
    let acc = 0, o = r * cols, sb = r * nb;
    for (let b = 0; b < nb; b++, o += 32) {
      let t = 0, k = b * 32;
      for (let j = 0; j < 32; j += 4) t += q[o + j] * x[k + j] + q[o + j + 1] * x[k + j + 1] + q[o + j + 2] * x[k + j + 2] + q[o + j + 3] * x[k + j + 3];
      acc += t * s[sb + b];

}

  const m = ev.data;

    if (m.op === 'deq') {
      const f = GG.dequant(m.type, new Uint8Array(m.buf), m.nel, new Float32Array(m.nel));
      if (m.f16) { const h = new Uint16Array(m.nel); for (let i = 0; i < m.nel; i++) h[i] = GG.toF16(f[i]); self.postMessage({ id: m.id, out: h }, [h.buffer]); }

    } else if (m.op === 'store') {
      const f = GG.dequant(m.type, new Uint8Array(m.buf), m.rows * m.cols, new Float32Array(m.rows * m.cols));
      MATS.set(m.name, toQ8(f, m.rows, m.cols)); self.postMessage({ id: m.id });
    } else if (m.op === 'mv') {
      const outs = m.jobs.map((j) => { const M = MATS.get(j.name); const y = new Float32Array(M.rows); mv(M, m.xs[j.x], y); return y; });
      self.postMessage({ id: m.id, out: outs }, outs.map((o) => o.buffer));

  } catch (e) { self.postMessage({ id: m.id, err: String(e && e.message || e) }); }

<script>
'use strict';
/* ===================== Conjunto de workers, motor de CPU e carregador ===================== */
class Pool {
  constructor(src, n) {
    this.url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    this.ws = []; this.wait = new Map(); this.seq = 0; this.free = [];
    for (let i = 0; i < n; i++) { const w = new Worker(this.url); w.onmessage = (e) => { const r = this.wait.get(e.data.id); this.wait.delete(e.data.id); if (e.data.err) r[1](new Error(e.data.err)); else r[0](e.data.out); }; w.onerror = (e) => { for (const [, r] of this.wait) r[1](new Error(e.message || 'worker')); this.wait.clear(); }; this.ws.push(w); }
    this.rr = 0;
  }
  get n() { return this.ws.length; }
  call(i, msg, transfer) { return new Promise((res, rej) => { const id = ++this.seq; this.wait.set(id, [res, rej]); msg.id = id; this.ws[i].postMessage(msg, transfer || []); }); }
  next() { this.rr = (this.rr + 1) % this.ws.length; return this.rr; }
  terminate() { for (const w of this.ws) w.terminate(); URL.revokeObjectURL(this.url); this.ws = []; }
}
// divisão de linhas entre workers
const split = (rows, n, i) => [Math.floor(rows * i / n), Math.floor(rows * (i + 1) / n)];

class CpuLLM {
  constructor(pool, cfg, nCtx) { this.pool = pool; this.cfg = cfg; this.nCtx = nCtx; this.vec = {}; this.mats = {}; }
  async mvAll(jobs, xs) { // jobs: [{name}], xs: [Float32Array] -> saídas completas
    const n = this.pool.n, parts = await Promise.all(this.pool.ws.map((_, i) => this.pool.call(i, { op: 'mv', jobs: jobs.map((j) => ({ name: j.name, x: j.x || 0 })), xs })));
    return jobs.map((j, k) => { const rows = this.mats[j.name], y = new Float32Array(rows); for (let i = 0; i < n; i++) y.set(parts[i][k], split(rows, n, i)[0]); return y; });
  }
  build() {
    const c = this.cfg, kvd = c.nKv * c.hd;
    this.kc = []; this.vc = []; for (let l = 0; l < c.nLayer; l++) { this.kc.push(new Float32Array(this.nCtx * kvd)); this.vc.push(new Float32Array(this.nCtx * kvd)); }
    this.att = new Float32Array(this.nCtx);
  }
  rms(x, w) { const c = this.cfg; let s = 0; for (let i = 0; i < x.length; i++) s += x[i] * x[i]; const r = 1 / Math.sqrt(s / x.length + c.eps), y = new Float32Array(x.length); for (let i = 0; i < x.length; i++) y[i] = x[i] * r * w[i]; return y; }
  rope(v, off, nh, pos) {
    const c = this.cfg, hp = c.ropeDim / 2;
    for (let h = 0; h < nh; h++) for (let i = 0; i < hp; i++) {
      const ang = pos * Math.pow(c.theta, -2 * i / c.ropeDim), co = Math.cos(ang), si = Math.sin(ang), base = off + h * c.hd;
      const a = c.neox ? base + i : base + 2 * i, b = c.neox ? base + i + hp : a + 1, x0 = v[a], x1 = v[b];
      v[a] = x0 * co - x1 * si; v[b] = x0 * si + x1 * co;
    }
  }
  headnorm(v, off, nh, w) { const c = this.cfg; for (let h = 0; h < nh; h++) { const b = off + h * c.hd; let s = 0; for (let i = 0; i < c.hd; i++) s += v[b + i] * v[b + i]; const r = 1 / Math.sqrt(s / c.hd + c.eps); for (let i = 0; i < c.hd; i++) v[b + i] = v[b + i] * r * w[i]; } }
  async step(tok, pos, want) {
    const c = this.cfg, V = this.vec, kvd = c.nKv * c.hd, grp = c.nHead / c.nKv, sc = 1 / Math.sqrt(c.hd);
    const x = this.embedRow(tok);
    for (let l = 0; l < c.nLayer; l++) {
      const b = (s) => 'blk.' + l + '.' + s;
      const xb = this.rms(x, V[b('attn_norm.weight')]);
      const [q, k, v] = await this.mvAll([{ name: b('attn_q.weight') }, { name: b('attn_k.weight') }, { name: b('attn_v.weight') }], [xb]);
      for (const [y, n] of [[q, 'attn_q.bias'], [k, 'attn_k.bias'], [v, 'attn_v.bias']]) { const bb = V[b(n)]; if (bb) for (let i = 0; i < y.length; i++) y[i] += bb[i]; }
      if (c.qkNorm) { this.headnorm(q, 0, c.nHead, V[b('attn_q_norm.weight')]); this.headnorm(k, 0, c.nKv, V[b('attn_k_norm.weight')]); }
      this.rope(q, 0, c.nHead, pos); this.rope(k, 0, c.nKv, pos);
      const K = this.kc[l], Vc = this.vc[l]; K.set(k, pos * kvd); Vc.set(v, pos * kvd);
      const ao = new Float32Array(c.nHead * c.hd), att = this.att;
      for (let h = 0; h < c.nHead; h++) {

        for (let t = 0; t <= pos; t++) { let s = 0; const o = t * kvd + kb; for (let i = 0; i < c.hd; i++) s += q[qb + i] * K[o + i]; s *= sc; att[t] = s; if (s > mx) mx = s; }
        let sum = 0; for (let t = 0; t <= pos; t++) { att[t] = Math.exp(att[t] - mx); sum += att[t]; }
        for (let t = 0; t <= pos; t++) { const a = att[t] / sum, o = t * kvd + kb; for (let i = 0; i < c.hd; i++) ao[qb + i] += a * Vc[o + i]; }
      }
      const [o] = await this.mvAll([{ name: b('attn_output.weight') }], [ao]);
      for (let i = 0; i < x.length; i++) x[i] += o[i];
      const xf = this.rms(x, V[b('ffn_norm.weight')]);
      const [g, u] = await this.mvAll([{ name: b('ffn_gate.weight') }, { name: b('ffn_up.weight') }], [xf]);
      for (let i = 0; i < g.length; i++) g[i] = g[i] / (1 + Math.exp(-g[i])) * u[i];
      const [dn] = await this.mvAll([{ name: b('ffn_down.weight') }], [g]);
      for (let i = 0; i < x.length; i++) x[i] += dn[i];
    }
    if (!want) return null;
    const xo = this.rms(x, V['output_norm.weight']);
    const [lg] = await this.mvAll([{ name: c.tied ? 'token_embd.weight' : 'output.weight' }], [xo]);
    return lg;
  }
  embedRow(tok) { const t = this.embed, rb = GG.rowBytes(t.type, t.cols); return GG.dequant(t.type, t.u8.subarray(tok * rb, (tok + 1) * rb), t.cols, new Float32Array(t.cols)); }
  destroy() { this.pool.ws.forEach((_, i) => this.pool.call(i, { op: 'free' }).catch(() => {})); }
}

/* carrega os tensores do arquivo para o motor escolhido; onProg(feito, total) */
async function loadTensors(engine, kind, h, read, pool, onProg, cancel) {
  const ts = Object.values(h.tensors).filter((t) => t.name !== 'rope_freqs.weight');
  const total = ts.reduce((a, t) => a + t.bytes, 0); let done = 0;
  const prog = (b) => { done += b; onProg(done, total); };
  const CH = 16 << 20; // bytes por tarefa
  if (kind === 'gpu') {
    const q = []; let inflight = [];
    for (const t of ts) {
      if (t.dims.length === 1 || t.type === 0 && t.dims.length === 1) { // vetores: f32
        const u8 = await read(t.start, t.bytes); const f = GG.dequant(t.type, u8, t.nel, new Float32Array(t.nel));
        engine.dev.queue.writeBuffer(engine.alloc(t.name, t.nel * 4), 0, f); prog(t.bytes); continue;
      }
      const cols = t.dims[0], rows = t.nel / cols, rb = GG.rowBytes(t.type, cols), per = Math.max(1, Math.floor(CH / rb));
      const buf = engine.alloc(t.name, t.nel * 2);
      for (let r0 = 0; r0 < rows; r0 += per) q.push({ t, buf, r0, r1: Math.min(rows, r0 + per), cols, rb });
    }
    let qi = 0;
    const worker = async (wi) => {
      while (qi < q.length) { if (cancel()) throw new Error('cancel');
        const j = q[qi++], u8 = await read(j.t.start + j.r0 * j.rb, (j.r1 - j.r0) * j.rb), nel = (j.r1 - j.r0) * j.cols;
        const buf = u8.byteOffset === 0 && u8.byteLength === u8.buffer.byteLength ? u8.buffer : u8.slice().buffer;
        const out = await pool.call(wi, { op: 'deq', type: j.t.type, buf, nel, f16: true }, [buf]);
        engine.dev.queue.writeBuffer(j.buf, j.r0 * j.cols * 2, out); prog((j.r1 - j.r0) * j.rb); }
    };
    await Promise.all(pool.ws.map((_, i) => worker(i)));
    await engine.dev.queue.onSubmittedWorkDone();
  } else {
    const n = pool.n;
    for (const t of ts) {
      if (cancel()) throw new Error('cancel');
      const u8 = await read(t.start, t.bytes);
      if (t.dims.length === 1) { engine.vec[t.name] = GG.dequant(t.type, u8, t.nel, new Float32Array(t.nel)); prog(t.bytes); continue; }
      const cols = t.dims[0], rows = t.nel / cols, rb = GG.rowBytes(t.type, cols);
      if (t.name === 'token_embd.weight') engine.embed = { type: t.type, cols, u8: u8.slice() };
      if (t.name === 'token_embd.weight' && !engine.cfg.tied) { prog(t.bytes); continue; }
      engine.mats[t.name] = rows;
      await Promise.all(pool.ws.map((_, i) => { const [a, b] = split(rows, n, i); const part = u8.slice(a * rb, b * rb); return pool.call(i, { op: 'store', name: t.name, type: t.type, buf: part.buffer, rows: b - a, cols }, [part.buffer]); }));
      prog(t.bytes);
    }
  }
}

/* ===================== Motor WebGPU: inferência de modelos llama / qwen2 / qwen3 =====================
   Pesos em f16 (dois por u32), ativações e cache KV em f32. Cada passo é uma lista fixa de despachos,
   montada no carregamento; por token só muda o uniforme com a posição e o token. */
const WGSL_COMMON = `

@group(0) @binding(0) var<uniform> p: P;
`;
const WGSL = {
  embed: WGSL_COMMON + `
struct D { half: u32, a: u32, b: u32, c: u32 };
@group(0) @binding(1) var<storage, read> W: array<u32>;
@group(0) @binding(2) var<storage, read_write> X: array<f32>;
@group(0) @binding(3) var<uniform> d: D;
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) g: vec3<u32>) {

  rmsnorm: WGSL_COMMON + `

@group(0) @binding(2) var<storage, read> Wt: array<f32>;
@group(0) @binding(3) var<storage, read_write> Y: array<f32>;
@group(0) @binding(4) var<uniform> d: D;

  headnorm: WGSL_COMMON + `

@group(0) @binding(1) var<storage, read_write> Y: array<f32>;
@group(0) @binding(2) var<storage, read> Wt: array<f32>;
@group(0) @binding(3) var<uniform> d: D;
var<workgroup> red: array<f32, 256>;
@compute @workgroup_size(256) fn main(@builtin(workgroup_id) wg: vec3<u32>, @builtin(local_invocation_index) li: u32) {

  matvec: WGSL_COMMON + `
struct D { rows: u32, half: u32, flags: u32, posMul: u32 };
@group(0) @binding(1) var<storage, read> W: array<u32>;
@group(0) @binding(2) var<storage, read> X: array<vec2<f32>>;

@group(0) @binding(4) var<storage, read> B: array<f32>;
@group(0) @binding(5) var<uniform> d: D;
var<workgroup> red: array<f32, 64>;
@compute @workgroup_size(64) fn main(@builtin(workgroup_id) wg: vec3<u32>, @builtin(local_invocation_index) li: u32) {

class GpuLLM {
  static async device() {
    if (!navigator.gpu) throw new Error('no-webgpu');
    const ad = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!ad) throw new Error('no-adapter');
    const L = ad.limits;
    const dev = await ad.requestDevice({ requiredLimits: { maxStorageBufferBindingSize: L.maxStorageBufferBindingSize, maxBufferSize: L.maxBufferSize, maxStorageBuffersPerShaderStage: Math.min(L.maxStorageBuffersPerShaderStage, 10) } });
    return { ad, dev };
  }
  constructor(dev, cfg, nCtx) {
    this.dev = dev; this.cfg = cfg; this.nCtx = nCtx; this.buf = {}; this.lost = false;
    this.pipes = {}; for (const k in WGSL) this.pipes[k] = dev.createComputePipeline({ layout: 'auto', compute: { module: dev.createShaderModule({ code: WGSL[k] }), entryPoint: 'main' } });
  }
  sbuf(bytes, usage) { return this.dev.createBuffer({ size: Math.max(16, Math.ceil(bytes / 4) * 4), usage: usage || (GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC) }); }
  ubuf(u32s) { const b = this.dev.createBuffer({ size: Math.max(16, u32s.length * 4), usage: GPUBufferUsage.UNIFORM, mappedAtCreation: true }); new Uint32Array(b.getMappedRange()).set(u32s); b.unmap(); return b; }
  f32u(v) { const f = new Float32Array([v]); return new Uint32Array(f.buffer)[0]; }
  // aloca o tensor; o carregador escreve os dados depois
  alloc(name, bytes) { const b = this.sbuf(bytes); this.buf[name] = b; return b; }
  build() {
    const c = this.cfg, dev = this.dev, N = this.nCtx, qd = c.nHead * c.hd, kvd = c.nKv * c.hd, w = (n) => { const b = this.buf[n]; if (!b) throw new Error('missing-tensor:' + n); return b; };
    this.P = this.dev.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const A = this.A = { x: this.sbuf(c.nEmbd * 4), xb: this.sbuf(c.nEmbd * 4), q: this.sbuf(qd * 4), ao: this.sbuf(qd * 4), s: this.sbuf(c.nHead * N * 4), hb: this.sbuf(c.nFF * 4), hb2: this.sbuf(c.nFF * 4), logits: this.sbuf(c.nVocab * 4), dummy: this.sbuf(16) };
    this.kc = []; this.vc = []; for (let l = 0; l < c.nLayer; l++) { this.kc.push(this.sbuf(N * kvd * 4)); this.vc.push(this.sbuf(N * kvd * 4)); }
    this.read = dev.createBuffer({ size: c.nVocab * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const ops = this.ops = [];
    const bg = (pipe, bufs) => dev.createBindGroup({ layout: this.pipes[pipe].getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: this.P } }].concat(bufs.map((b, i) => ({ binding: i + 1, resource: { buffer: b } }))) });
    const op = (pipe, bufs, wg) => ops.push({ pipe: this.pipes[pipe], bg: bg(pipe, bufs), wg });
    const mv = (W, X, Y, rows, cols, opt) => { opt = opt || {}; op('matvec', [W, X, Y, opt.bias || A.dummy, this.ubuf([rows, cols / 2, (opt.bias ? 1 : 0) | (opt.acc ? 2 : 0), opt.posMul || 0])], [Math.min(rows, 32768), Math.ceil(rows / 32768), 1]); };
    const rms = (X, Wt, Y, n) => op('rmsnorm', [X, Wt, Y, this.ubuf([n, 0, this.f32u(c.eps), 0])], [1, 1, 1]);
    const rope = (Y, nh, posMul) => op('rope', [Y, this.ubuf([nh, c.hd, c.ropeDim, c.neox ? 1 : 0, this.f32u(c.theta), posMul, 0, 0])], [Math.ceil(nh * c.ropeDim / 2 / 64), 1, 1]);
    op('embed', [w('token_embd.weight'), A.x, this.ubuf([c.nEmbd / 2, 0, 0, 0])], [Math.ceil(c.nEmbd / 2 / 256), 1, 1]);
    for (let l = 0; l < c.nLayer; l++) {
      const b = (s) => 'blk.' + l + '.' + s, has = (s) => !!this.buf[b(s)];
      rms(A.x, w(b('attn_norm.weight')), A.xb, c.nEmbd);
      mv(w(b('attn_q.weight')), A.xb, A.q, qd, c.nEmbd, { bias: has('attn_q.bias') && w(b('attn_q.bias')) });
      mv(w(b('attn_k.weight')), A.xb, this.kc[l], kvd, c.nEmbd, { bias: has('attn_k.bias') && w(b('attn_k.bias')), posMul: kvd });
      mv(w(b('attn_v.weight')), A.xb, this.vc[l], kvd, c.nEmbd, { bias: has('attn_v.bias') && w(b('attn_v.bias')), posMul: kvd });
      if (c.qkNorm) {
        op('headnorm', [A.q, w(b('attn_q_norm.weight')), this.ubuf([c.hd, 0, this.f32u(c.eps), 0])], [c.nHead, 1, 1]);
        op('headnorm', [this.kc[l], w(b('attn_k_norm.weight')), this.ubuf([c.hd, kvd, this.f32u(c.eps), 0])], [c.nKv, 1, 1]);
      }
      rope(A.q, c.nHead, 0); rope(this.kc[l], c.nKv, kvd);
      op('attn', [A.q, this.kc[l], this.vc[l], A.s, A.ao, this.ubuf([c.nHead, c.nHead / c.nKv, c.hd, kvd, N, this.f32u(1 / Math.sqrt(c.hd)), 0, 0])], [c.nHead, 1, 1]);
      mv(w(b('attn_output.weight')), A.ao, A.x, c.nEmbd, qd, { acc: true });
      rms(A.x, w(b('ffn_norm.weight')), A.xb, c.nEmbd);
      mv(w(b('ffn_gate.weight')), A.xb, A.hb, c.nFF, c.nEmbd);
      mv(w(b('ffn_up.weight')), A.xb, A.hb2, c.nFF, c.nEmbd);
      op('silu', [A.hb, A.hb2, this.ubuf([c.nFF, 0, 0, 0])], [Math.ceil(c.nFF / 256), 1, 1]);
      mv(w(b('ffn_down.weight')), A.hb, A.x, c.nEmbd, c.nFF, { acc: true });
    }
    rms(A.x, w('output_norm.weight'), A.xb, c.nEmbd);
    this.headOp = ops.length;
    mv(w(c.tied ? 'token_embd.weight' : 'output.weight'), A.xb, A.logits, c.nVocab, c.nEmbd);
  }
  // processa um token na posição pos; se want, devolve os logits
  async step(tok, pos, want) {
    if (this.lost) throw new Error('device-lost');
    this.dev.queue.writeBuffer(this.P, 0, new Uint32Array([pos, tok, 0, 0]));
    const enc = this.dev.createCommandEncoder(), pass = enc.beginComputePass();
    const end = want ? this.ops.length : this.headOp;
    for (let i = 0; i < end; i++) { const o = this.ops[i]; pass.setPipeline(o.pipe); pass.setBindGroup(0, o.bg); pass.dispatchWorkgroups(o.wg[0], o.wg[1], o.wg[2]); }
    pass.end();
    if (want) enc.copyBufferToBuffer(this.A.logits, 0, this.read, 0, this.cfg.nVocab * 4);
    this.dev.queue.submit([enc.finish()]);
    if (!want) return null;
    await this.read.mapAsync(GPUMapMode.READ);
    const out = new Float32Array(this.read.getMappedRange().slice(0)); this.read.unmap();
    return out;
  }
  destroy() { for (const b of Object.values(this.buf)) b.destroy(); if (this.A) for (const b of Object.values(this.A)) b.destroy(); for (const b of (this.kc || []).concat(this.vc || [])) b.destroy(); }
}

  helpBody: [`<h3>Conversar com um modelo</h3><p>Abra um arquivo <strong>.gguf</strong>, o formato de modelos do llama.cpp. O app lê o cabeçalho, mostra os dados do modelo e carrega os pesos. Na <strong>GPU</strong>, os pesos são convertidos para meia precisão (16 bits) e cada token passa por kernels WebGPU escritos para este app. Na <strong>CPU</strong>, as linhas de cada matriz são divididas entre os núcleos, em workers, com pesos em 8 bits.</p><p>A conversa é montada no formato que o modelo aprendeu (ChatML, Llama 3, Zephyr ou Mistral). O app reaproveita o que já está no cache de atenção, então só o texto novo é processado a cada mensagem. Temperatura, top-k, top-p e repetição controlam o sorteio do próximo token; com a mesma semente, a resposta se repete.</p><h3>Treinar um mini-GPT</h3><p>Aqui nada vem pronto: um transformer pequeno, que prevê o próximo caractere, é criado com pesos aleatórios e treinado na GPU sobre o texto que você escolher. O avanço, a retropropagação e o otimizador AdamW rodam em kernels WebGPU. O gráfico mostra a perda caindo; a perda de validação, medida em 10% do texto que o modelo não vê no treino, mostra quando ele começa a decorar em vez de generalizar.</p><h3>Privacidade</h3><p>A página proíbe conexões de rede pela política de segurança. Os arquivos são lidos do seu disco e ficam no seu computador.</p><h3>Limites</h3><ul><li>Modelos pequenos (até uns 3 bilhões de parâmetros) cabem melhor: na GPU, cada bilhão de parâmetros ocupa cerca de 2 GB.</li><li>Ainda sem suporte: modelos de visão, outras arquiteturas (Gemma, Phi, Mixtral) e escalas de RoPE estendidas.</li><li>Modelos pequenos erram fatos com frequência. Não confie neles para informação importante.</li></ul>`,
    `<h3>Chat with a model</h3><p>Open a <strong>.gguf</strong> file, the llama.cpp model format. The app reads the header, shows the model's details and loads the weights. On the <strong>GPU</strong>, weights are converted to half precision (16 bits) and each token runs through WebGPU kernels written for this app. On the <strong>CPU</strong>, the rows of each matrix are split across the cores, in workers, with 8-bit weights.</p><p>The chat is built in the format the model learned (ChatML, Llama 3, Zephyr or Mistral). The app reuses what is already in the attention cache, so only the new text is processed on each message. Temperature, top-k, top-p and repetition control how the next token is drawn; with the same seed, the answer repeats.</p><h3>Train a mini-GPT</h3><p>Nothing here comes ready-made: a small transformer that predicts the next character is created with random weights and trained on the GPU on the text you choose. The forward pass, backpropagation and the AdamW optimizer run in WebGPU kernels. The chart shows the loss falling; the validation loss, measured on 10% of the text the model never sees in training, shows when it starts memorising instead of generalising.</p><h3>Privacy</h3><p>The page forbids network connections through its security policy. Files are read from your disk and stay on your computer.</p><h3>Limits</h3><ul><li>Small models (up to about 3 billion parameters) fit best: on the GPU, each billion parameters takes about 2 GB.</li><li>Not supported yet: vision models, other architectures (Gemma, Phi, Mixtral) and extended RoPE scaling.</li><li>Small models often get facts wrong. Don't rely on them for important information.</li></ul>`,
    `<h3>Parlare con un modello</h3><p>Apri un file <strong>.gguf</strong>, il formato dei modelli di llama.cpp. L’app legge l’intestazione, mostra i dati del modello e carica i pesi. Sulla <strong>GPU</strong>, i pesi vengono convertiti in mezza precisione (16 bit) e ogni token passa per kernel WebGPU scritti per questa app. Sulla <strong>CPU</strong>, le righe di ogni matrice vengono divise tra i core, in worker, con pesi a 8 bit.</p><p>La chat viene composta nel formato che il modello ha imparato (ChatML, Llama 3, Zephyr o Mistral). L’app riusa ciò che è già nella cache dell’attenzione, così a ogni messaggio elabora solo il testo nuovo. Temperatura, top-k, top-p e ripetizione controllano l’estrazione del token successivo; con lo stesso seme la risposta si ripete.</p><h3>Addestrare un mini-GPT</h3><p>Qui niente è già pronto: un piccolo transformer che prevede il carattere successivo nasce con pesi casuali e viene addestrato sulla GPU con il testo che scegli. Il passo in avanti, la retropropagazione e l’ottimizzatore AdamW girano in kernel WebGPU. Il grafico mostra la perdita che scende; la perdita di validazione, misurata sul 10% del testo che il modello non vede in addestramento, mostra quando inizia a memorizzare invece di generalizzare.</p><h3>Privacy</h3><p>La pagina vieta le connessioni di rete con la sua politica di sicurezza. I file vengono letti dal tuo disco e restano sul tuo computer.</p><h3>Limiti</h3><ul><li>I modelli piccoli (fino a circa 3 miliardi di parametri) si adattano meglio: sulla GPU ogni miliardo di parametri occupa circa 2 GB.</li><li>Non ancora supportati: modelli di visione, altre architetture (Gemma, Phi, Mixtral) e scale RoPE estese.</li><li>I modelli piccoli sbagliano spesso i fatti. Non affidarti a loro per informazioni importanti.</li></ul>`,
    `<h3>Conversar con un modelo</h3><p>Abre un archivo <strong>.gguf</strong>, el formato de modelos de llama.cpp. La app lee la cabecera, muestra los datos del modelo y carga los pesos. En la <strong>GPU</strong>, los pesos se convierten a media precisión (16 bits) y cada token pasa por kernels WebGPU escritos para esta app. En la <strong>CPU</strong>, las filas de cada matriz se reparten entre los núcleos, en workers, con pesos de 8 bits.</p><p>La conversación se arma en el formato que el modelo aprendió (ChatML, Llama 3, Zephyr o Mistral). La app reaprovecha lo que ya está en la caché de atención, así que en cada mensaje solo se procesa el texto nuevo. La temperatura, top-k, top-p y la repetición controlan el sorteo del siguiente token; con la misma semilla, la respuesta se repite.</p><h3>Entrenar un mini-GPT</h3><p>Aquí nada viene hecho: un transformer pequeño que predice el siguiente carácter se crea con pesos aleatorios y se entrena en la GPU con el texto que elijas. El paso hacia delante, la retropropagación y el optimizador AdamW se ejecutan en kernels WebGPU. El gráfico muestra cómo baja la pérdida; la pérdida de validación, medida en el 10% del texto que el modelo no ve al entrenar, muestra cuándo empieza a memorizar en lugar de generalizar.</p><h3>Privacidad</h3><p>La página prohíbe las conexiones de red mediante su política de seguridad. Los archivos se leen de tu disco y se quedan en tu ordenador.</p><h3>Límites</h3><ul><li>Los modelos pequeños (hasta unos 3 mil millones de parámetros) encajan mejor: en la GPU, cada mil millones de parámetros ocupa unos 2 GB.</li><li>Aún sin soporte: modelos de visión, otras arquitecturas (Gemma, Phi, Mixtral) y escalas de RoPE extendidas.</li><li>Los modelos pequeños se equivocan a menudo con los hechos. No confíes en ellos para información importante.</li></ul>`],

`The island lighthouse always came on at six. The light turned slowly over the sea, and the boats came home by following its glow.

On the second night, the wind changed. The keeper climbed the stairs, counted the steps and wrote: wind from the east, rough sea, two boats far away.
On the third night, the fog came. The keeper climbed the stairs, counted the steps and wrote: no wind, hidden sea, no boat in sight.
Then he rang the bell. He rang it once, waited, and rang it again. From the middle of the fog a whistle answered, then another, and one more.

The keeper showed them the notebook. Each page held one night: the wind, the sea and the boats. The children read it aloud, one page at a time.
Since then, every afternoon, someone climbs the stairs with the keeper. The light comes on at six, the bell waits for the fog, and the notebook gains one more page.

const paramsH = (n) => n >= 1e9 ? nf(n / 1e9, 2) + ' B' : n >= 1e6 ? nf(n / 1e6, 1) + ' M' : nf(n / 1e3, 1) + ' k';

  if (LAST_STATUS) status(...LAST_STATUS); if (LAST_TSTATUS) tstatus(...LAST_TSTATUS);

  for (const m of CHAT.msgs) if (m.el) { m.el.querySelector('.who').textContent = m.role === 'user' ? t('you') : m.who; const th = m.el.querySelector('.think'); if (m.think) th.textContent = t('thinking') + ': ' + m.think; }
}
function setLang(l) { LANG = LANGS.includes(l) ? l : 'pt'; store.set('lang', LANG); if (location.hash.slice(1) !== (LANG === 'pt' ? '' : LANG)) history.replaceState(null, '', LANG === 'pt' ? location.pathname : '#' + LANG); applyLang(); }
function setTheme(th) { document.documentElement.dataset.theme = th; store.set('theme', th); drawChart(); }

    [t('dF16'), f ? ['shader-f16', 'subgroups', 'timestamp-query'].filter((x) => f.has(x)).join(', ') || '—' : '—'], [t('dMaxBuf'), L ? bytesH(Math.min(L.maxBufferSize, L.maxStorageBufferBindingSize)) : '—'],
    [t('dCores'), String(CORES)], [t('dWorkers'), String(NWORK)], [t('dMem'), navigator.deviceMemory ? '≥ ' + navigator.deviceMemory + ' GB' : t('unknown')], [t('dNet'), t('dNetV')]];
  for (const [k, v] of rows) { const tr = document.createElement('tr'), th = document.createElement('th'), td = document.createElement('td'); th.textContent = k; td.textContent = v; tr.append(th, td); tb.appendChild(tr); }

/* ===================== Conversa ===================== */
const CHAT = { file: null, h: null, cfg: null, tk: null, eng: null, kind: null, msgs: [], kv: [], busy: false, abort: false, name: '', loadId: 0 };
let LAST_STATUS = null, LAST_TSTATUS = null;
function status(msg, cls) { if (typeof msg === 'function') { LAST_STATUS = [msg, cls]; msg = msg(); } else LAST_STATUS = null; const s = $('#loadStatus'); s.textContent = msg || ''; s.className = 'status' + (cls ? ' ' + cls : ''); }
function errText(e) {
  const m = String(e && e.message || e);
  if (m === 'not-gguf' || m === 'old-gguf' || m === 'short' || m === 'truncated') return t('e_notgguf');
  if (m.startsWith('arch:')) return t('e_arch', m.slice(5));
  if (m.startsWith('unsupported-type:')) return t('e_type', m.split(':').slice(1).join(':'));
  if (m.startsWith('tokenizer:')) return t('e_tok', m.slice(10));
  if (m === 'no-webgpu' || m === 'no-adapter') return t('e_nogpu');
  if (m.startsWith('big:')) { const [, n, a, b] = m.split('|'); return t('e_big', n, a, b); }
  if (m === 'device-lost') return t('e_lost', DEV.lostMsg || '');
  return t('e_generic', m);
}
const readFile = (file) => async (o, n) => new Uint8Array(await file.slice(o, o + n).arrayBuffer());
async function pickModel(file) {
  if (CHAT.busy) return;
  await unload(); newChat(); CHAT.file = file; CHAT.h = null; status(t('reading')); $('#modelInfo').hidden = true;
  try {
    const h = await GG.parseHeader(readFile(file), file.size), cfg = GG.config(h), tk = new GG.Tokenizer(h.meta);

    const sel = $('#sCtx'); for (const o of sel.options) o.disabled = +o.value > cfg.ctxTrain; if (+sel.value > cfg.ctxTrain) sel.value = [...sel.options].filter((o) => !o.disabled).pop().value;
    renderModelInfo(); await loadModel();

}
function renderModelInfo() {

  if (!CHAT.h) { dl.hidden = true; return; }
  const c = CHAT.cfg, q = Object.entries(c.types).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + Math.round(v / c.params * 100) + '%').join(', ');
  const rows = [[t('iName'), CHAT.name], [t('iFile'), CHAT.file.name + ' · ' + bytesH(CHAT.file.size)], [t('iArch'), c.arch], [t('iParams'), paramsH(c.params)], [t('iLayers'), c.nLayer + ' · ' + c.nHead + (c.nKv !== c.nHead ? ' (KV ' + c.nKv + ')' : '')],
    [t('iCtx'), nf(c.ctxTrain)], [t('iQuant'), q], [t('iTok'), CHAT.tk.model === 'llama' ? 'SentencePiece · ' + nf(CHAT.tk.n) : 'BPE · ' + nf(CHAT.tk.n)]];
  for (const [k, v] of rows) { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); }
  dl.hidden = false;

async function unload() {
  CHAT.abort = true; if (CHAT.eng) { try { CHAT.eng.destroy(); } catch (e) {} } CHAT.eng = null; CHAT.kv = []; CHAT.kind = null; refreshChatUI();
}
async function loadModel() {
  if (!CHAT.h) return; const id = ++CHAT.loadId; await unload(); CHAT.abort = false;
  const c = CHAT.cfg, nCtx = +$('#sCtx').value; let kind = $('#sBackend').value; if (kind === 'auto') kind = DEV.gpu ? 'gpu' : 'cpu';
  const t0 = performance.now(); $('#bReload').disabled = true; $('#bOpen').disabled = true;
  try {
    let eng;
    if (kind === 'gpu') {
      if (!DEV.gpu) throw new Error(DEV.lostMsg ? 'device-lost' : 'no-webgpu');
      const lim = Math.min(DEV.ad.limits.maxStorageBufferBindingSize, DEV.ad.limits.maxBufferSize);
      for (const tt of Object.values(CHAT.h.tensors)) { const b = tt.dims.length > 1 ? tt.nel * 2 : tt.nel * 4; if (b > lim) throw new Error('big:|' + tt.name + '|' + bytesH(b) + '|' + bytesH(lim)); }
      eng = new GpuLLM(DEV.gpu, c, nCtx);
    } else eng = new CpuLLM(pool(), c, nCtx);
    let last = 0;
    await loadTensors(eng, kind, CHAT.h, readFile(CHAT.file), pool(), (done, total) => {

$('#bHelp').addEventListener('click', () => $('#dHelp').showModal());
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));
$('#bTheme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
$('#sLang').addEventListener('change', () => setLang($('#sLang').value));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== LANG) setLang(h); });
$('#tCorpus').addEventListener('input', () => { onCorpus(); });
$('#bSample').addEventListener('click', () => { $('#tCorpus').value = t('sample'); onCorpus(); });
$('#bTxt').addEventListener('click', () => $('#fTxt').click());
$('#fTxt').addEventListener('change', async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; $('#tCorpus').value = (await f.text()).slice(0, 5000000); onCorpus(); });
for (const s of ['#sL', '#sC', '#sH', '#sT', '#sB', '#sSteps', '#sLr']) $(s).addEventListener('change', () => { archInfo(); drawChart(); updateTrainUI(); });
$('#bTrain').addEventListener('click', startTrain);
$('#bReset').addEventListener('click', resetTrain);
$('#bGen').addEventListener('click', generate);
$('#bSaveM').addEventListener('click', saveModel);
$('#bLoadM').addEventListener('click', () => $('#fModel').click());
$('#fModel').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) loadModelFile(f); });
window.addEventListener('resize', () => drawChart());

/* ===================== Início ===================== */
(function init() {
  const sys = store.get('theme', null); setThemeQuiet(sys || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  function setThemeQuiet(th) { document.documentElement.dataset.theme = th; }
  const h = (location.hash || '').slice(1); LANG = LANGS.includes(h) ? h : store.get('lang', null) || ((navigator.language || 'pt').slice(0, 2) in HTML_LANG ? (navigator.language || 'pt').slice(0, 2) : 'pt');
  if (!LANGS.includes(LANG)) LANG = 'pt';
  $('#sBackend').value = store.get('backend', 'auto'); $('#sCtx').value = store.get('ctx', '2048');
  $('#oTemp').value = nf(+$('#rTemp').value, 2);
  applyLang(); selectTab(store.get('tab', 0) === 1 ? 1 : 0);
  probe();
})();
</script>
</body>
</html>
