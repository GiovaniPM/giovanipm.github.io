<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Elevadores · Giovani Perotto Mesquita</title>
<meta name="description" content="Elevadores: jogo de simulação de transporte vertical. A cada partida surge uma construção diferente, de uma casa a um aeroporto, e você projeta elevadores, escadas rolantes, esteiras e pontes de embarque para atender a demanda. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<style>
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --surface-2:#FBF1E3; --ink:#2B1B3D; --text:#3E3350; --muted:#756986; --line:#F1E2CF;
  --accent:#0E8074; --accent-ink:#FFFFFF; --accent-soft:#E2F6F2; --navy:#5B2A86; --gold:#FFB703; --gold-ink:#B35300; --gold-soft:#FFF1C9;
  --bad:#B3261E; --bad-soft:#FDE7E5; --ok:#1F7A4D; --ok-soft:#E3F4EA;
  --sky:#DCEBFA; --ground:#D9C7AE; --shaft:#EFE6F7; --wall:#CBBBDD;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif; --serif:Georgia,"Times New Roman",serif; --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#1A1328; --surface:#241A36; --surface-2:#2D2244; --ink:#F7F0FF; --text:#E2D8F0; --muted:#A898C0; --line:#3A2D52;
  --accent:#5FD3C4; --accent-ink:#10231F; --accent-soft:#1D3A38; --navy:#C9A7F5; --gold:#FFC94D; --gold-ink:#FFC94D; --gold-soft:#3A2E12;
  --bad:#FF8A80; --bad-soft:#3D1F24; --ok:#6FD39B; --ok-soft:#163327;
  --sky:#1E2A44; --ground:#3A3024; --shaft:#2F2546; --wall:#4A3B66;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.55rem 1rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand h1{font-family:var(--serif);font-size:1.3rem;margin:0;color:var(--ink);line-height:1.1}
.brand p{margin:0;font-size:.8rem;color:var(--muted)}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.42rem .75rem;min-height:38px;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{min-height:32px;padding:.25rem .55rem;font-size:.85rem}
.btn.icon{min-width:38px;padding:.25rem .5rem}
select,input[type=number],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.35rem .45rem;min-height:36px;color:var(--ink);max-width:100%}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr) 380px;grid-template-areas:"brief view design";gap:.9rem;max-width:1500px;margin:0 auto;padding:.9rem}
.brief{grid-area:brief}.view{grid-area:view}.design{grid-area:design}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.85rem;min-width:0}
.card h2{font-size:1rem;margin:0 0 .5rem;color:var(--ink)}
.card h3{font-size:.9rem;margin:.8rem 0 .35rem;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.bname{font-family:var(--serif);font-size:1.25rem;color:var(--ink);margin:.1rem 0 .2rem}
.btype{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.85rem}
.btype svg{width:28px;height:28px;flex:none}
.facts{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.25rem;font-size:.88rem}
.facts li{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px dashed var(--line);padding:.18rem 0}
.facts li b{color:var(--ink);text-align:right}
.chk{list-style:none;padding:0;margin:0;display:grid;gap:.3rem;font-size:.86rem}
.chk li{display:flex;gap:.45rem;align-items:flex-start;line-height:1.3}
.chk .m{flex:none;width:1.25rem;height:1.25rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800}
.m.ok{background:var(--ok-soft);color:var(--ok)}.m.bad{background:var(--bad-soft);color:var(--bad)}.m.soft{background:var(--gold-soft);color:var(--gold-ink)}.m.na{background:var(--surface-2);color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);line-height:1.4}
.canvasWrap{position:relative;background:var(--sky);border-radius:12px;overflow:auto;border:1px solid var(--line);max-height:72vh}
canvas{display:block}
.simbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);min-width:7.5em}
.live{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:.4rem}
.live b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:.35rem .8rem;font-size:.76rem;color:var(--muted);margin-top:.5rem}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.adds{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
.grp{border:1px solid var(--line);border-radius:12px;padding:.55rem .6rem;margin-bottom:.55rem;background:var(--surface-2)}
.grp.bad{border-color:var(--bad)}
.grp header{display:flex;justify-content:space-between;align-items:center;gap:.4rem;margin-bottom:.35rem}
.grp header b{color:var(--ink);font-size:.9rem;display:flex;gap:.4rem;align-items:center}
.sw{width:.8rem;height:.8rem;border-radius:3px;display:inline-block;flex:none}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem .5rem}
.fields label{display:grid;gap:.15rem;font-size:.75rem;color:var(--muted)}
.fields label.full{grid-column:1/-1}
.fields select,.fields input{width:100%}
.ginfo{font-size:.76rem;color:var(--muted);margin-top:.35rem}
.issues{font-size:.78rem;color:var(--bad);margin:.3rem 0 0;padding-left:1rem}
.costbar{height:12px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:.3rem 0}
.costbar span{display:block;height:100%;background:var(--accent)}
.costbar span.over{background:var(--bad)}
.row{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{border-bottom:1px solid var(--line);padding:.32rem .35rem;text-align:left;vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stars{font-size:1.8rem;letter-spacing:.15em;color:var(--gold-ink)}
.stars .off{color:var(--line)}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.tips{margin:.4rem 0 0;padding-left:1.1rem;font-size:.87rem;display:grid;gap:.3rem}
.pbb{display:grid;grid-template-columns:minmax(0,1fr);gap:.4rem}
.pbbrow{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:.3rem;align-items:center;font-size:.8rem}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:1rem 1.15rem;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
dialog::backdrop{background:rgba(20,10,30,.55)}
dialog h2{font-family:var(--serif);margin:0 0 .6rem;color:var(--ink)}
dialog h3{font-size:.98rem;margin:1rem 0 .35rem;color:var(--ink)}
dialog p,dialog li{line-height:1.45;font-size:.92rem}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.4rem;margin:.3rem 0 .6rem}
.choice label{display:flex;gap:.4rem;align-items:center;border:1px solid var(--line);border-radius:10px;padding:.4rem .5rem;font-size:.86rem;cursor:pointer}
.choice input{accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:1240px){.layout{grid-template-columns:300px minmax(0,1fr);grid-template-areas:"brief view" "design view"}}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"brief" "view" "design";padding:.55rem}.canvasWrap{max-height:none}}
@media (max-width:480px){.top{padding:.45rem .6rem}.brand p{display:none}.fields{grid-template-columns:minmax(0,1fr)}.pbbrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.tools,.simbar,.adds{display:none}}
</style>

<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="2" width="30" height="36" rx="6" fill="#5B2A86"/><rect x="10" y="7" width="20" height="26" rx="3" fill="#FFF7EC"/><path d="M20 10l5 6h-10z" fill="#0E8074"/><path d="M20 30l5-6h-10z" fill="#C2185B"/></svg>
    <div><h1 data-t="title"></h1><p data-t="subtitle"></p></div>
  </div>
  <div class="tools">
    <button type="button" class="btn" id="bNew" data-t="b.new"></button>

    <label class="sr" for="lang" data-t="lang"></label>

<main class="layout">
  <section class="card brief" id="brief" aria-labelledby="hBrief"></section>
  <div class="stack view">

      <h2 id="hView" data-t="view.title"></h2>

      <div class="legend" id="legend"></div>
      <div class="simbar">
        <button type="button" class="btn primary" id="bRun"></button>
        <label class="sr" for="speed" data-t="sim.speed"></label>
        <select id="speed"><option value="10">×10</option><option value="30" selected>×30</option><option value="60">×60</option><option value="120">×120</option></select>
        <button type="button" class="btn" id="bInstant" data-t="sim.instant"></button>
        <button type="button" class="btn" id="bReset" data-t="sim.reset"></button>
        <span class="clock" id="clock" aria-live="off"></span>
      </div>
      <div class="live" id="live" aria-live="polite"></div>

    <section class="card" id="results" aria-labelledby="hRes" hidden></section>

  <section class="card design" id="design" aria-labelledby="hDesign"></section>
</main>

<dialog id="dNew" aria-labelledby="hNew">
  <form method="dialog" id="fNew">
    <h2 id="hNew" data-t="new.title"></h2>
    <h3 data-t="new.kind"></h3>
    <div class="choice" id="kindChoice"></div>
    <h3 data-t="new.diff"></h3>
    <div class="choice" id="diffChoice"></div>
    <label class="note" style="display:grid;gap:.2rem;max-width:240px"><span data-t="new.seed"></span><input type="text" name="seed" inputmode="numeric" autocomplete="off"></label>
    <div class="row end" style="margin-top:.8rem"><button type="button" class="btn" id="bNewCancel" data-t="close"></button><button type="submit" class="btn primary" data-t="new.go"></button></div>
  </form>
</dialog>

<dialog id="dHelp" aria-labelledby="hHelp">
  <h2 id="hHelp" data-t="b.help" tabindex="-1" autofocus></h2>
  <div id="helpBody"></div>
  <div class="row end" style="margin-top:.8rem"><button type="button" class="btn primary" id="bHelpClose" data-t="close"></button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ===================== Gerador semeado ===================== */
function mulberry(seed) { let s = seed | 0; return () => { s = (s + 0x6D2B79F5) | 0; let x = Math.imul(s ^ (s >>> 15), 1 | s); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const ri = (R, a, b) => a + Math.floor(R() * (b - a + 1));
const pick = (R, arr) => arr[Math.floor(R() * arr.length)];
function poisson(R, lam) {
  if (lam <= 0) return 0;
  if (lam > 30) { const u = Math.max(1e-9, R()), v = R(); return Math.max(0, Math.round(lam + Math.sqrt(lam) * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v))); }
  const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1;
}

/* ===================== Catálogo de equipamentos (parâmetros do jogo) ===================== */
/* tipos de carga: p pessoa, w cadeirante/carrinho de bebê, k carrinho (bagagem, compras, limpeza),
   b leito, f palete, m pequena carga, c veículo */
const UNITS = { p: 1, w: 2, k: 2, b: 10, f: 10, m: 2, c: 10 };
const TRANSFER = { p: 1.2, w: 4, k: 3, b: 25, f: 20, m: 5, c: 40 };
const LIFTS = {
  home: { speeds: [0.3], caps: [3], maxTravel: 15, maxStops: 5, serves: 'pwk', base: 25, stop: 2, perV: 0, energy: 0.6, door: 5 },
  plat: { speeds: [0.15], caps: [2], maxTravel: 6, maxStops: 3, serves: 'w', base: 12, stop: 2, perV: 0, energy: 0.4, door: 6 },
  hyd: { speeds: [0.63], caps: [6, 8, 13], maxTravel: 18, maxStops: 6, serves: 'pwk', base: 55, stop: 4, perV: 0, energy: 3, door: 5 },
  mrl: { speeds: [1, 1.6, 2.5], caps: [8, 13, 17, 21], maxTravel: 76, maxStops: 30, serves: 'pwk', base: 80, stop: 5, perV: 15, energy: 1.4, door: 5 },
  trac: { speeds: [2.5, 4, 6, 8, 10], caps: [13, 17, 21, 24], maxTravel: 600, maxStops: 150, serves: 'pwk', base: 130, stop: 6, perV: 22, energy: 1.2, door: 5 },
  dd: { speeds: [4, 6, 8, 10], caps: [21, 24], maxTravel: 600, maxStops: 150, serves: 'pwk', base: 260, stop: 9, perV: 35, energy: 2.0, door: 5.5, double: true, minLevels: 25 },
  pan: { speeds: [1, 1.6, 2.5], caps: [8, 13, 17], maxTravel: 120, maxStops: 40, serves: 'pwk', base: 120, stop: 6, perV: 18, energy: 1.5, door: 5 },
  fire: { speeds: [1.6, 2.5, 4, 6], caps: [8, 13], maxTravel: 600, maxStops: 150, serves: 'pwk', base: 150, stop: 7, perV: 20, energy: 1.3, door: 5, fire: true },
  bed: { speeds: [1, 1.6, 2.5], caps: [21, 26], maxTravel: 200, maxStops: 40, serves: 'pwkb', base: 120, stop: 6, perV: 18, energy: 1.6, door: 7 },
  svc: { speeds: [0.5, 1, 1.6, 2.5], caps: [10, 20, 30, 50], maxTravel: 600, maxStops: 150, serves: 'fmk', base: 90, stop: 5, perV: 15, energy: 1.8, door: 8 },
  car: { speeds: [0.3, 0.5], caps: [10, 20], maxTravel: 40, maxStops: 12, serves: 'c', base: 140, stop: 8, perV: 30, energy: 2.5, door: 10 },
  dumb: { speeds: [0.5], caps: [2], maxTravel: 60, maxStops: 20, serves: 'm', base: 18, stop: 2, perV: 0, energy: 0.3, door: 3 }
};
const LIFT_ORDER = ['home', 'plat', 'hyd', 'mrl', 'trac', 'dd', 'pan', 'fire', 'bed', 'svc', 'car', 'dumb'];
/* escadas rolantes: capacidade teórica (pessoas/h) a 0,5 m/s; o jogo usa 60% dela como capacidade prática */
const ESC_CAP = { 600: 4500, 800: 6750, 1000: 9000 };
const ESC_PRACTICAL = 0.6;
const ESC_COST = { 600: 55, 800: 65, 1000: 75 };
const INC_CAP = { 1000: 5000, 1400: 7000 };
/* pontes de embarque: classes de aeronave que cada tipo atende */
const PBB = {
  apron: { cls: ['nar', 'wide', 'jumbo'], cost: 160 },
  nose: { cls: ['nar'], cost: 90 },
  tb: { cls: ['nar', 'wide'], cost: 130 },
  com: { cls: ['reg'], cost: 70 },
  otw: { cls: ['wide', 'jumbo'], cost: 150, second: true },
  a380: { cls: ['jumbo'], cost: 220, upper: true }
};
const PBB_ORDER = ['apron', 'nose', 'tb', 'com', 'otw', 'a380'];
const AIRCRAFT = { reg: { pax: [50, 72], doors: 1, target: 12 }, nar: { pax: [150, 200], doors: 1, target: 20 }, wide: { pax: [250, 350], doors: 2, target: 30 }, jumbo: { pax: [450, 550], doors: 3, target: 35 } };
const BRIDGE_RATE = 12, BUS_RATE = 8, BUS_OVERHEAD = 6;   /* passageiros/min e minutos */
const WALK = 1.3, BELT = 0.65, WALK_COST = 0.6;            /* m/s; créditos por metro */

/* ===================== Cenários ===================== */
const KINDS = ['house', 'resid', 'office', 'hotel', 'hosp', 'mall', 'airport', 'metro', 'stadium', 'parking', 'warehouse', 'supertall'];
const KIND_DIFF = { house: [0, 1, 2], resid: [0, 1, 2], office: [0, 1, 2], hotel: [0, 1, 2], hosp: [1, 2], mall: [0, 1, 2], airport: [1, 2], metro: [1, 2], stadium: [1, 2], parking: [0, 1, 2], warehouse: [0, 1, 2], supertall: [2] };
const NAMES = ['Aurora', 'Ipê', 'Atlântico', 'Guaíba', 'Horizonte', 'Pampa', 'Farol', 'Jacarandá', 'Vértice', 'Coral', 'Mirante', 'Lumen', 'Boreal', 'Sereno', 'Nimbus', 'Cobalto', 'Araucária', 'Bússola', 'Cais', 'Zênite'];

function genScenario(seed, kind, diff) {
  const R = mulberry(seed);
  if (diff == null) diff = 1;
  if (!kind) { const ks = KINDS.filter((k) => KIND_DIFF[k].includes(diff)); kind = pick(mulberry(seed ^ 0x9E3779B9), ks); }
  const S = { seed, kind, diff, name: pick(R, NAMES), levels: [], A: 0, streams: [], bursts: [], window: 900, warm: 120, targets: {}, reqs: { access: true }, gates: [], pier: 0, notes: [], hcPop: 0, pop: 0 };
  const L = (lab, z, pop, n) => { S.levels.push({ lab, n: n == null ? null : n, z, pop: pop || 0 }); return S.levels.length - 1; };
  const st = (o, d, k, per5, extra) => { if (per5 > 0) S.streams.push(Object.assign({ o, d, k, rate: per5 / 300, t0: 0, t1: S.window }, extra || {})); };
  const floors = (n, h, popf, z0) => { const ids = []; for (let i = 1; i <= n; i++) ids.push(L('fl', (z0 || 0) + i * h, popf(i), i)); return ids; };
  const spread = (ids, total, fn) => { const tp = ids.reduce((a, i) => a + (S.levels[i].pop || 1), 0); ids.forEach((i) => fn(i, total * (S.levels[i].pop || 1) / tp)); };
  switch (kind) {
    case 'house': {
      const F = [ri(R, 1, 2), ri(R, 2, 3), ri(R, 3, 4)][diff];
      S.A = L('ground', 0, 2);
      const ids = floors(F, 3, () => 2);
      S.window = 600; S.warm = 0;
      ids.forEach((i) => { st(S.A, i, 'p', 0.5); st(i, S.A, 'p', 0.5); });
      st(S.A, ids[ids.length - 1], 'w', 0.4); st(ids[0], S.A, 'w', 0.4);
      S.targets = { awt: 60 };
      S.reqs.wheel = true;
      break;
    }
    case 'resid': {
      const F = [ri(R, 4, 12), ri(R, 10, 28), ri(R, 24, 42)][diff], apts = ri(R, 2, 8), h = 2.9;
      const gar = diff > 0 && R() < 0.6 ? L('garage', -3, 0) : -1;
      S.A = L('ground', 0, 0);
      const ids = floors(F, h, () => apts * 3);
      S.pop = S.hcPop = F * apts * 3;
      const d5 = 0.075 * S.pop;
      spread(ids, d5 * 0.85, (i, x) => { if (gar >= 0) { st(i, S.A, 'p', x * 0.7, { hc: 1 }); st(i, gar, 'p', x * 0.3, { hc: 1 }); } else st(i, S.A, 'p', x, { hc: 1 }); });
      spread(ids, d5 * 0.1, (i, x) => st(S.A, i, 'p', x, { hc: 1 }));
      spread(ids, d5 * 0.03, (i, x) => st(i, S.A, 'w', x));
      S.targets = { hc5: 0.06, awt: 40 };
      break;
    }
    case 'office': {
      const F = [ri(R, 6, 14), ri(R, 12, 32), ri(R, 28, 55)][diff], area = ri(R, 8, 24) * 100, h = 3.8;
      const g = diff === 2 ? [L('garage', -6.6, 0), L('garage', -3.3, 0)] : [];
      S.A = L('ground', 0, 0);
      const ids = floors(F, h, () => Math.round(area / 10));
      S.pop = S.hcPop = ids.reduce((a, i) => a + S.levels[i].pop, 0);
      const d5 = 0.155 * S.pop;

'tip.hc5':['Faltou capacidade no pico: mais cabines, cabines maiores, mais velocidade ou zonas menores.','Not enough peak capacity: more cars, bigger cars, more speed or smaller zones.','Capacità insufficiente nella punta: più cabine, cabine più grandi, più velocità o zone più piccole.','Faltó capacidad en el pico: más cabinas, cabinas más grandes, más velocidad o zonas más chicas.'],
'tip.interval':['O intervalo no andar de embarque está alto: aumente os carros do grupo mais lento.','The lobby interval is too long: add cars to the slowest group.','L’intervallo al piano principale è alto: aggiungi cabine al gruppo più lento.','El intervalo en el piso principal es alto: agrega cabinas al grupo más lento.'],
'tip.awt':['Espera alta: veja no desenho onde as filas crescem e reforce aquele grupo ou escada.','Long waits: look at where queues grow in the drawing and reinforce that group or escalator.','Attese lunghe: guarda nel disegno dove crescono le code e rinforza quel gruppo o scala.','Espera alta: mira en el dibujo dónde crecen las filas y refuerza ese grupo o escalera.'],
'tip.awtB':['Leitos esperam demais: mais elevadores-maca, ou mais rápidos.','Beds wait too long: more bed lifts, or faster ones.','I letti aspettano troppo: più montaletti, o più veloci.','Las camas esperan demasiado: más montacamas, o más rápidos.'],
'tip.awtF':['Cargas esperam demais: reforce os elevadores de carga.','Goods wait too long: reinforce the goods lifts.','I carichi aspettano troppo: rinforza i montacarichi.','Las cargas esperan demasiado: refuerza los montacargas.'],
'tip.awtK':['Carrinhos esperam demais: reforce o elevador de serviço ou use esteira inclinada.','Trolleys wait too long: reinforce the service lift or use an inclined moving walk.','I carrelli aspettano troppo: rinforza il montacarichi di servizio o usa un tappeto inclinato.','Los carritos esperan demasiado: refuerza el ascensor de servicio o usa una rampa mecánica.'],
'tip.awtC':['Veículos esperam demais: mais elevadores de veículos.','Cars wait too long: more car lifts.','I veicoli aspettano troppo: più montauto.','Los vehículos esperan demasiado: más montacoches.'],
'tip.awtW':['Cadeirantes esperam demais: mais elevadores acessíveis onde as filas se formam.','Wheelchair users wait too long: more accessible lifts where queues form.','Le sedie a rotelle aspettano troppo: più ascensori accessibili dove si formano le code.','Las sillas de ruedas esperan demasiado: más ascensores accesibles donde se forman filas.'],
'tip.maxQ':['Fila longa na escada rolante: mais unidades ou degraus mais largos naquele lance.','Long escalator queue: more units or wider steps on that flight.','Coda lunga alla scala mobile: più unità o gradini più larghi su quella rampa.','Fila larga en la escalera mecánica: más unidades o peldaños más anchos en ese tramo.'],
'tip.journey':['Viagens longas: menos paradas por cabine (zonas ou controle por destino) e mais velocidade.','Long journeys: fewer stops per car (zones or destination dispatch) and more speed.','Viaggi lunghi: meno fermate per cabina (zone o comando a destinazione) e più velocità.','Viajes largos: menos paradas por cabina (zonas o control por destino) y más velocidad.'],
'tip.clear':['A plataforma não esvazia antes do próximo trem: mais escadas rolantes de subida.','The platform does not clear before the next train: more up escalators.','La banchina non si svuota prima del prossimo treno: più scale mobili in salita.','El andén no se vacía antes del próximo tren: más escaleras mecánicas de subida.'],
'tip.moved':['O público não sai a tempo: mais escadas rolantes de descida.','The crowd does not leave in time: more down escalators.','Il pubblico non esce in tempo: più scale mobili in discesa.','El público no sale a tiempo: más escaleras mecánicas de bajada.'],
'tip.thr':['Os paletes acumulam: mais elevadores de carga ou mais capacidade.','Pallets pile up: more goods lifts or more capacity.','I pallet si accumulano: più montacarichi o più capacità.','Los palés se acumulan: más montacargas o más capacidad.'],
'tip.flights':['Voos atrasados: pontes compatíveis com cada aeronave e todas as portas atendidas.','Late flights: bridges compatible with each aircraft, serving every door.','Voli in ritardo: ponti compatibili con ogni aereo, a tutte le porte.','Vuelos atrasados: pasarelas compatibles con cada avión, en todas las puertas.'],
'tip.walk':['Caminhada longa: cubra mais o píer com esteiras.','Long walk: cover more of the pier with walkways.','Cammino lungo: copri di più il molo con tappeti mobili.','Caminata larga: cubre más el muelle con pasillos rodantes.'],
'tip.noRoute':['Há gente ou carga sem caminho: confira se cada tipo tem um equipamento que chega ao destino.','Some people or goods have no path: check that each type has equipment reaching its destination.','Alcune persone o carichi non hanno percorso: controlla che ogni tipo abbia un impianto che arrivi a destinazione.','Hay personas o cargas sin camino: revisa que cada tipo tenga un equipo que llegue al destino.'],
'tip.req.access':['Ligue todos os níveis usados ao térreo com elevadores que levam cadeirantes.','Link every level in use to the main floor with lifts that carry wheelchairs.','Collega tutti i livelli usati al piano principale con ascensori per sedie a rotelle.','Conecta todos los niveles usados con el piso principal con ascensores para sillas de ruedas.'],
'tip.req.fire':['Adicione um elevador de bombeiros que atenda todos os níveis.','Add a firefighter lift serving every level.','Aggiungi un ascensore antincendio che serva tutti i livelli.','Agrega un ascensor de bomberos que atienda todos los niveles.'],
'tip.req.bed':['Adicione elevadores-maca até a quantidade exigida.','Add bed lifts up to the required number.','Aggiungi montaletti fino al numero richiesto.','Agrega montacamas hasta la cantidad exigida.'],
'tip.req.svc':['Adicione um elevador de serviço do subsolo a todos os andares.','Add a service lift from the basement to every floor.','Aggiungi un montacarichi di servizio dal seminterrato a tutti i piani.','Agrega un ascensor de servicio del sótano a todos los pisos.'],
'tip.req.freight':['Adicione elevadores de carga entre a doca e os pisos.','Add goods lifts between the dock and the floors.','Aggiungi montacarichi tra la banchina e i piani.','Agrega montacargas entre el muelle y los pisos.'],
'tip.req.car':['Adicione elevadores de veículos ligando a rua a cada nível.','Add car lifts linking the street to each level.','Aggiungi montauto che colleghino la strada a ogni livello.','Agrega montacoches que unan la calle con cada nivel.'],
'tip.req.wheel':['A moradora cadeirante precisa chegar a todos os andares.','The wheelchair user must reach every floor.','La persona in sedia a rotelle deve raggiungere tutti i piani.','La persona en silla de ruedas debe llegar a todos los pisos.'],
'tip.req.escAll':['Ligue cada par de níveis vizinhos com escadas rolantes nos dois sentidos.','Link each pair of neighbouring levels with escalators both ways.','Collega ogni coppia di livelli vicini con scale mobili in entrambi i sensi.','Une cada par de niveles vecinos con escaleras mecánicas en los dos sentidos.'],
'tip.req.escUp':['Cada lance precisa de escada rolante de subida.','Every flight needs an up escalator.','Ogni rampa ha bisogno di una scala mobile in salita.','Cada tramo necesita una escalera mecánica de subida.'],
'tip.req.escDown':['Cada lance precisa de escada rolante de descida.','Every flight needs a down escalator.','Ogni rampa ha bisogno di una scala mobile in discesa.','Cada tramo necesita una escalera mecánica de bajada.'],
'tip.req.pbb':['Faltam pontes compatíveis para algumas aeronaves.','Some aircraft lack a compatible bridge.','Alcuni aerei non hanno un ponte compatibile.','A algunos aviones les falta una pasarela compatible.'],
'tip.req.invalid':['Há grupos inválidos: veja os avisos em vermelho no projeto.','There are invalid groups: see the red warnings in the design.','Ci sono gruppi non validi: guarda gli avvisi in rosso nel progetto.','Hay grupos no válidos: mira los avisos en rojo en el proyecto.'],
'tip.cost':['Acima do orçamento: corte excessos onde as filas ficaram vazias.','Over budget: trim the excess where queues stayed empty.','Oltre il budget: taglia gli eccessi dove le code sono rimaste vuote.','Por encima del presupuesto: recorta excesos donde las filas quedaron vacías.'],
'tip.cheaper':['Tudo atendido. Para mais estrelas, tente o mesmo resultado gastando menos.','Everything met. For more stars, try the same result for less money.','Tutto rispettato. Per più stelle, prova lo stesso risultato spendendo meno.','Todo cumplido. Para más estrellas, intenta el mismo resultado gastando menos.'],
'tip.perfect':['Projeto completo: metas, exigências e orçamento atendidos. Experimente outra construção.','Complete design: targets, requirements and budget met. Try another building.','Progetto completo: obiettivi, requisiti e budget rispettati. Prova un’altra costruzione.','Proyecto completo: metas, requisitos y presupuesto cumplidos. Prueba otra construcción.'],
'tip.helped':['Com o projeto de referência, a nota máxima é uma estrela.','With the reference design, the top score is one star.','Con il progetto di riferimento, il massimo è una stella.','Con el proyecto de referencia, la nota máxima es una estrella.'],

'help.intro':['A cada partida o jogo sorteia uma construção e uma necessidade. Você projeta o transporte vertical e a simulação mostra se ele dá conta do pico.','Each game draws a building and a need. You design the vertical transport and the simulation shows whether it copes with the peak.','A ogni partita il gioco estrae una costruzione e un’esigenza. Tu progetti il trasporto verticale e la simulazione mostra se regge la punta.','En cada partida el juego sortea una construcción y una necesidad. Tú proyectas el transporte vertical y la simulación muestra si aguanta el pico.'],
'help.how':['Como jogar','How to play','Come si gioca','Cómo jugar'],
'help.s1':['Leia o briefing: níveis, demanda, metas e exigências.','Read the brief: levels, demand, targets and requirements.','Leggi il brief: livelli, domanda, obiettivi e requisiti.','Lee el encargo: niveles, demanda, metas y requisitos.'],
'help.s2':['Adicione grupos de elevadores e escolha tipo, quantidade, capacidade, velocidade, controle, andar de embarque e andares atendidos.','Add lift groups and choose type, quantity, capacity, speed, control, main floor and floors served.','Aggiungi gruppi di ascensori e scegli tipo, quantità, capacità, velocità, comando, piano d’imbarco e piani serviti.','Agrega grupos de ascensores y elige tipo, cantidad, capacidad, velocidad, control, piso de embarque y pisos atendidos.'],
'help.s3':['Em shoppings, aeroportos, metrôs e estádios, ponha escadas rolantes entre níveis vizinhos; no aeroporto, escolha pontes de embarque e esteiras.','In malls, airports, metro stations and stadiums, put escalators between neighbouring levels; at the airport, choose boarding bridges and walkways.','Nei centri commerciali, aeroporti, metropolitane e stadi, metti scale mobili tra livelli vicini; in aeroporto, scegli ponti d’imbarco e tappeti mobili.','En centros comerciales, aeropuertos, metros y estadios, pon escaleras mecánicas entre niveles vecinos; en el aeropuerto, elige pasarelas y pasillos rodantes.'],
'help.s4':['Clique em Simular para ver o pico em movimento, ou em Resultado imediato.','Click Simulate to watch the peak, or Instant result.','Clicca su Simula per vedere la punta in movimento, o su Risultato immediato.','Haz clic en Simular para ver el pico en movimiento, o en Resultado inmediato.'],

const LANGS = ['pt', 'en', 'it', 'es'], HTML_LANG = { pt: 'pt-BR', en: 'en', it: 'it', es: 'es' };
let LANG = 'pt';
function t(k, ...a) { const r = I18N[k]; let s = r ? r[LANGS.indexOf(LANG)] : k; a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); }); return s; }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('elevadores.' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('elevadores.' + k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } }
};
const nf = (x, d) => { const v = Number(x); return isFinite(v) ? v.toLocaleString(HTML_LANG[LANG], { maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: d == null ? 0 : d }) : '—'; };
const fmtS = (s) => s == null || !isFinite(s) ? '—' : s < 90 ? t('u.s', nf(s)) : t('u.min', nf(s / 60, 1));
const fmtPct = (x) => x == null ? '—' : nf(x * 100, 1) + '%';
function toast(msg) { const e = $('#toast'); e.textContent = msg; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => { e.classList.remove('on'); setTimeout(() => { e.textContent = ''; }, 300); }, 2600); }
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function lvName(i) {
  const l = G.scn.levels[i];
  switch (l.lab) {
    case 'fl': return t('lv.fl', l.n);
    case 'garage': return t('lv.garage', l.n);
    default: { const dup = G.scn.levels.filter((x) => x.lab === l.lab).length > 1; return t('lv.' + l.lab) + (dup ? ' ' + l.n : ''); }
  }
}
function lvShort(i) { const l = G.scn.levels[i]; if (l.lab === 'fl') return String(l.n); if (i === G.scn.A) return t('lv.short.A'); return l.n < 0 ? String(l.n) : t('lv.short.' + l.lab); }

/* ===================== Estado ===================== */
const DIFF_SLACK = [1.35, 1.2, 1.1];
const G = { scn: null, D: null, budget: 0, helped: false, sim: null, running: false, last: 0, result: null };
const LIFT_COLOR = { home: '#8D6E63', plat: '#78909C', hyd: '#FB8C00', mrl: '#0E8074', trac: '#3A86FF', dd: '#5B2A86', pan: '#26A69A', fire: '#D32F2F', bed: '#EC407A', svc: '#6D4C41', car: '#455A64', dumb: '#9E9D24' };
const KIND_COLOR = { p: '#3A86FF', w: '#0E8074', k: '#FB8C00', b: '#EC407A', f: '#6D4C41', m: '#9E9D24', c: '#455A64' };

function newScenario(seed, kind, diff) {
  stopSim();
  G.scn = genScenario(seed, kind, diff);
  G.budget = Math.round(costOf(G.scn, refDesign(G.scn)).total * DIFF_SLACK[G.scn.diff] / 10) * 10;
  G.D = { lifts: [], escs: [], walk: 0, pbb: {} };
  G.helped = false; G.sim = null; G.result = null;
  save(); renderAll();
}
function save() { store.set('state', { seed: G.scn.seed, kind: G.scn.kind, diff: G.scn.diff, D: G.D, helped: G.helped }); }
function load() {
  const s = store.get('state');
  if (!s || !KINDS.includes(s.kind)) return false;
  G.scn = genScenario(s.seed, s.kind, s.diff);
  G.budget = Math.round(costOf(G.scn, refDesign(G.scn)).total * DIFF_SLACK[G.scn.diff] / 10) * 10;
  G.D = sanitize(s.D); G.helped = !!s.helped;
  return true;
}
function sanitize(D) {
  const n = G.scn.levels.length, okL = (i) => Number.isInteger(i) && i >= 0 && i < n;
  const out = { lifts: [], escs: [], walk: 0, pbb: {} };
  ((D && D.lifts) || []).forEach((g) => { if (!LIFTS[g.type]) return; const T = LIFTS[g.type]; out.lifts.push({ type: g.type, qty: Math.max(1, Math.min(16, g.qty | 0)), cap: T.caps.includes(g.cap) ? g.cap : T.caps[0], speed: T.speeds.includes(g.speed) ? g.speed : T.speeds[0], lobby: okL(g.lobby) ? g.lobby : G.scn.A, from: okL(g.from) ? g.from : 0, to: okL(g.to) ? g.to : n - 1, ctl: g.ctl === 'dd' ? 'dd' : 'conv' }); });
  ((D && D.escs) || []).forEach((e) => { if (!okL(e.from) || !okL(e.to)) return; out.escs.push({ from: e.from, to: e.to, width: [600, 800, 1000, 1400].includes(e.width) ? e.width : 1000, qty: Math.max(1, Math.min(6, e.qty | 0)), dir: ['up', 'down', 'both'].includes(e.dir) ? e.dir : 'both', inc: !!e.inc }); });
  out.walk = Math.max(0, Math.min(G.scn.pier || 0, +(D && D.walk) || 0));
  Object.keys(AIRCRAFT).forEach((c) => { const arr = (D && D.pbb && D.pbb[c]) || []; out.pbb[c] = arr.slice(0, AIRCRAFT[c].doors).map((x) => PBB[x] ? x : ''); });
  return out;
}

function renderBrief() {
  const S = G.scn;
  const ks = {};
  S.streams.forEach((s) => { ks[s.k] = (ks[s.k] || 0) + s.rate * 300; });
  S.bursts.forEach((b) => { ks[b.k] = (ks[b.k] || 0); });
  const top = Math.max(...S.levels.map((l) => l.z)), bot = Math.min(...S.levels.map((l) => l.z));
  const reqs = checkReqs(S, G.D);
  const tg = S.targets;
  const tgRows = [];
  if (tg.hc5 != null) tgRows.push([t('m.hc5'), '≥ ' + fmtPct(tg.hc5)]);
  if (tg.interval != null) tgRows.push([t('m.interval'), '≤ ' + fmtS(tg.interval)]);
  ['awt', 'awtB', 'awtF', 'awtK', 'awtC', 'awtW'].forEach((k) => { if (tg[k] != null) tgRows.push([t('m.' + k), '≤ ' + fmtS(tg[k])]); });
  if (tg.maxQ != null) tgRows.push([t('m.maxQ'), '≤ ' + nf(tg.maxQ)]);
  if (tg.journey != null) tgRows.push([t('m.journey'), '≤ ' + fmtS(tg.journey)]);
  if (tg.clear != null) tgRows.push([t('m.clear'), '≤ ' + fmtS(tg.clear)]);
  if (tg.moved != null) tgRows.push([t('m.moved'), '≥ ' + fmtPct(tg.moved)]);
  if (tg.thr != null) tgRows.push([t('m.thr'), '≥ ' + fmtPct(tg.thr)]);
  if (tg.flights != null) tgRows.push([t('m.flights'), '≥ ' + fmtPct(tg.flights)]);
  if (tg.walk != null) tgRows.push([t('m.walk'), '≤ ' + fmtS(tg.walk)]);
  const facts = [[t('f.levels'), S.levels.length], [t('f.height'), t('u.m', nf(top - bot))]];
  if (S.kind === 'hosp') facts.push([t('f.beds'), nf(S.beds)]);
  if (S.kind === 'warehouse') facts.push([t('f.pallets'), t('u.perh', nf(S.pallets))]);
  if (S.train) { facts.push([t('f.headway'), fmtS(S.train.H)]); facts.push([t('f.trainLoad'), nf(S.train.load)]); }
  if (S.kind === 'stadium' || S.kind === 'mall' || S.kind === 'airport') facts.push([t('f.people.' + S.kind), nf(S.pop)]);
  else if (S.pop) facts.push([t('f.pop'), nf(S.pop)]);
  if (S.gates.length) { facts.push([t('f.gates'), S.gates.length]); facts.push([t('f.pier'), t('u.m', nf(S.pier))]); }
  facts.push([t('f.budget'), t('u.cr', nf(G.budget))]);

/* ===================== Simulação na tela ===================== */
function stopSim() { G.running = false; updateRunBtn(); }
function ensureSim() { if (!G.sim) { G.sim = Sim(G.scn, G.D, G.scn.seed); G.result = null; } }
function runToggle() {
  if (G.sim && G.sim.finished) { G.sim = null; }
  ensureSim();
  G.running = !G.running; G.last = performance.now(); updateRunBtn();
  if (G.running) requestAnimationFrame(frame);
}
function instant() {
  stopSim(); if (!G.sim || G.sim.finished) G.sim = Sim(G.scn, G.D, G.scn.seed);
  while (!G.sim.finished) G.sim.step(0.5);
  done();
}
function frame(now) {
  if (!G.running || !G.sim) return;
  const dt = Math.min(0.1, (now - G.last) / 1000); G.last = now;
  const sp = +$('#speed').value;
  let steps = Math.max(1, Math.round(sp * dt / 0.5)); steps = Math.min(steps, 240);
  for (let i = 0; i < steps && !G.sim.finished; i++) G.sim.step(0.5);
  draw(); renderLive();
  if (G.sim.finished) { done(); return; }
  requestAnimationFrame(frame);
}
function done() {
  G.running = false; updateRunBtn(); draw(); renderLive();
  const reqs = checkReqs(G.scn, G.D), rows = evaluate(G.scn, G.D, G.sim.M), cost = costOf(G.scn, G.D).total;
  const st = stars(reqs, rows, cost, G.budget, G.helped);
  G.result = { reqs, rows, cost, st, M: G.sim.M };
  const key = G.scn.kind + '-' + G.scn.diff + '-' + G.scn.seed, best = store.get('best') || {};
  G.result.isBest = st > (best[key] || 0) && st > 0;
  if (G.result.isBest) { best[key] = st; store.set('best', best); }
  renderResults();
  const r = $('#results'); if (r && !r.hidden) r.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' });
}
function updateRunBtn() { const b = $('#bRun'); if (b) b.textContent = G.running ? t('sim.pause') : (G.sim && !G.sim.finished && G.sim.t > 0 ? t('sim.resume') : t('sim.run')); }
function renderLive() {
  const s = G.sim, W = G.scn.window;
  const tt = s ? s.t : 0, mm = (x) => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;
  $('#clock').textContent = `${mm(tt)} / ${mm(W)}`;
  if (!s) { $('#live').innerHTML = `<span>${esc(t('live.idle'))}</span>`; return; }
  const w = s.waitingNow();
  const avg = (s.waitSum + w.wt) / Math.max(1, s.waitN + w.n);
  $('#live').innerHTML = `<span>${esc(t('live.waiting'))}: <b>${nf(w.n)}</b></span><span>${esc(t('live.done'))}: <b>${nf(s.doneN)}</b></span><span>${esc(t('live.avg'))}: <b>${esc(fmtS(avg))}</b></span>${s.noRoute && Object.keys(s.noRoute).length ? `<span>${esc(t('live.noRoute'))}: <b>${nf(Object.values(s.noRoute).reduce((a, b) => a + b, 0))}</b></span>` : ''}`;
}

        const car = sg.cars[c];

        st = car.st; inside = car.load.reduce((s, a) => s + a.n, 0);
        if (st === 'doors') { const e = now - (car.td0 || car.t1 - 5), r = car.t1 - now; open = Math.max(0, Math.min(1, e / 1.4, r / 1.4)); }
      }
      const y = L.yOf(yy), cx = gr.x + c * (L.carW + 5);
      if (TRACTION[g.type]) {
        const cwY = sBot - (y - sTop) * 0.92 + (sTop - sBot) * 0.04;
        x.strokeStyle = dark ? '#BBB' : '#444'; x.lineWidth = 0.8;
        x.beginPath(); x.moveTo(cx + L.carW / 2, sTop); x.lineTo(cx + L.carW / 2, y - ch); x.stroke();
        x.beginPath(); x.moveTo(cx + L.carW - 1.5, sTop); x.lineTo(cx + L.carW - 1.5, cwY); x.stroke();
        x.fillStyle = dark ? '#8A8A8A' : '#4A4A4A'; x.fillRect(cx + L.carW - 3, cwY, 3, Math.max(4, ch * 0.7));
      }
      if (HYDRAULIC[g.type]) { x.fillStyle = dark ? '#B8C2CC' : '#9AA6B2'; x.fillRect(cx + L.carW / 2 - 1.5, y, 3, sBot + 8 - y); }
      /* caixa da cabine */
      const body = dark ? '#3B3350' : '#F7F3EC', light = dark ? '#FFE9A8' : '#FFF9E3';
      x.fillStyle = LIFT_COLOR[g.type]; x.fillRect(cx - 1, y - ch - 1, L.carW + 2, ch + 2);
      const decks = T.double ? 2 : 1, dh = ch / decks;
      for (let d = 0; d < decks; d++) {
        const dy = y - ch + d * dh;
        x.fillStyle = st === 'doors' ? light : body; x.fillRect(cx + 0.5, dy + 0.5, L.carW - 1, dh - 1);
        if (L.carW >= 6) { const half = (L.carW - 1) / 2, gap = half * open; x.fillStyle = dark ? '#8B93A0' : '#B7BEC8'; x.fillRect(cx + 0.5, dy + 0.5, half - gap, dh - 1); x.fillRect(cx + 0.5 + half + gap, dy + 0.5, half - gap, dh - 1); x.strokeStyle = dark ? '#5B6370' : '#8D96A3'; x.lineWidth = 0.6; if (open < 0.05) { x.beginPath(); x.moveTo(cx + 0.5 + half, dy + 1); x.lineTo(cx + 0.5 + half, dy + dh - 1); x.stroke(); } }
        /* corte: os passageiros aparecem por cima das portas, para a lotação ficar visível */
        const perRow = Math.max(1, Math.floor((L.carW - 1) / (ps * 2.1)));
        const show = Math.min(Math.ceil(inside / decks), perRow * (dh > ps * 7 ? 2 : 1));
        for (let k = 0; k < show; k++) { const row = Math.floor(k / perRow), col = k % perRow; person(x, cx + ps * 1.2 + col * ps * 2.1, dy + dh - 1 - row * ps * 3, ps * 0.8, dark ? '#F2E6FF' : '#2B1B3D', 'p'); }
      }
    }
    /* filas nos andares: pessoinhas */
    if (sg) fl.forEach((f) => {
      const q = sg.wait[f]; if (!q || !q.length) return;
      const n = q.reduce((s, a) => s + a.n, 0), y = L.yOf(S.levels[f].z), maxShow = Math.max(1, Math.floor(22 / (ps * 2)));
      let k = 0;
      for (const a of q) { if (k >= maxShow) break; person(x, gr.qx + 20 - k * ps * 2, y - 1, ps, KIND_COLOR[a.k], a.k); k++; }
      if (n > maxShow) { x.font = 'bold 9px Segoe UI, Arial'; x.textAlign = 'right'; const txt = '+' + (n > 999 ? '999' : n - maxShow); x.fillStyle = dark ? '#000' : '#FFF'; x.fillText(txt, gr.qx + 21, y - ps * 4 - 4); x.fillStyle = KIND_COLOR[q[0].k]; x.fillText(txt, gr.qx + 20, y - ps * 4 - 5); }
    });
  });
  /* escadas rolantes: degraus em movimento, passageiros e filas */
  G.D.escs.forEach((e, i) => {
    const lo = Math.min(e.from, e.to), hi = Math.max(e.from, e.to);
    const yl = L.yOf(S.levels[lo].z) - 3, yh = L.yOf(S.levels[hi].z) - 3, span = Math.max(30, Math.min(56, (yl - yh + 3) * 1.1));
    (e.dir === 'both' ? ['up', 'down'] : [e.dir]).forEach((d, k) => {
      const cx = L.escX + 10 + (L.slot[i] + k) * 26, a = lo % 2 ? cx + span : cx, z = lo % 2 ? cx : cx + span;
      const run = !reduced() && G.running, ph = run ? (now * 0.5) % 1 : 0;
      x.fillStyle = dark ? '#6F665C' : '#9C9387';
      for (let s2 = 0; s2 < 6; s2++) { const f = (s2 / 6 + (d === 'down' ? 1 - ph : ph)) % 1; x.fillRect(a + (z - a) * f - 1, yl + (yh - yl) * f - 1, 2, 2); }
      const pe = sim && sim.escs[i] ? sim.escs[i].find((q) => (d === 'up' ? q.a === lo : q.a === hi)) : null;
      if (pe) {
        pe.ride.slice(0, 18).forEach(([tEnd, ag]) => { let f = 1 - (tEnd - now) / pe.tt; f = Math.max(0, Math.min(1, f)); if (d === 'down') f = 1 - f; person(x, a + (z - a) * f, yl + (yh - yl) * f - 1, ps * 0.9, KIND_COLOR[ag.k], ag.k); });
        const n = pe.qn || 0;
        if (n > 0) { const ex = d === 'up' ? a : z, ey = d === 'up' ? yl : yh, dirx = (d === 'up' ? (lo % 2 ? 1 : -1) : (lo % 2 ? -1 : 1)); const m = Math.min(5, n); for (let j = 0; j < m; j++) person(x, ex + dirx * (6 + j * ps * 2), ey + 2, ps, KIND_COLOR.p, 'p'); x.font = 'bold 9px Segoe UI, Arial'; x.textAlign = 'center'; x.fillStyle = dark ? '#FFF' : '#2B1B3D'; x.fillText(n > 999 ? '999+' : String(n), ex + dirx * (8 + m * ps * 2), ey - ps * 4); }
      }
    });
  });
  /* metrô: trem chegando e partindo */
  if (S.train && sim) {
    const last = S.bursts.filter((b) => b.t <= now + 8).pop();
    if (last) {
      const dt = now - last.t, lp = last.o, y = L.yOf(S.levels[lp].z);
      if (dt > -8 && dt < 30) {
        const len = Math.min(L.bx1 - L.bx0 - 20, 260), pos = dt < 0 ? (dt / 8) : dt > 22 ? (dt - 22) / 8 : 0;
        const sx = Math.max(L.bx0, ...L.groups.filter((g) => g.n).map((g) => g.x + g.n * (L.carW + 5) + 6));
        const ex = G.D.escs.length ? L.escX - 4 : L.bx1, len2 = Math.min(len, ex - sx - 12);
        const x0 = sx + 6 + pos * (ex - sx);
        x.save(); x.beginPath(); x.rect(sx, y - 30, ex - sx, 40); x.clip();
        for (let k = 0; k < 4; k++) { const cx = x0 + k * (len2 / 4); x.fillStyle = '#C2185B'; x.fillRect(cx, y - Math.min(18, L.per * 0.8), len2 / 4 - 3, Math.min(16, L.per * 0.72)); x.fillStyle = dark ? '#FFE9A8' : '#E3F2FD'; for (let w = 0; w < 3; w++) x.fillRect(cx + 4 + w * (len2 / 12), y - Math.min(15, L.per * 0.66), len2 / 18, Math.min(5, L.per * 0.25)); }
        x.restore();
      }
    }
  }
  /* aeroporto: embarque nos portões */
  if (S.gates.length) {
    S.gates.forEach((g, i) => {
      const P = gatePos(L, i, g.cls);
      const tb = boardingTime(g.cls, g.pax, (G.D.pbb[g.cls]) || []) * 60;
      const p = sim ? Math.max(0, Math.min(1, (now - g.t) / tb)) : 0, late = tb / 60 > AIRCRAFT[g.cls].target;
      const y0 = P.up ? P.pierY : P.pierY + 16, y1 = P.up ? P.ny + P.len * 0.88 : P.ny + P.len * 0.12;
      if (sim && now >= g.t && p < 1 && G.running) for (let k = 0; k < 3; k++) { const f = ((now * 0.7 + k / 3) % 1); person(x, P.cx - P.len * 0.18, y0 + (y1 - y0) * f + 2, 1.1, KIND_COLOR.p, 'p'); }
      const by = P.up ? P.ny - 9 : P.ny + P.len + 4, bw = Math.min(L.gate.gw * 0.8, 50);
      x.fillStyle = dark ? '#555' : '#D8D8D8'; x.fillRect(P.cx - bw / 2, by, bw, 4);
      x.fillStyle = late ? C.bad : C.ok; x.fillRect(P.cx - bw / 2, by, bw * p, 4);
    });
  }
  cv.setAttribute('aria-label', t('cv.aria', t('name.' + S.kind, S.name), S.levels.length, G.D.lifts.reduce((a, g) => a + g.qty, 0), G.D.escs.reduce((a, e) => a + e.qty, 0)));
}
/* posição ao longo da viagem com aceleração e frenagem suaves (só para o desenho) */
function easePos(f) { return f < 0.5 ? 2 * f * f : 1 - 2 * (1 - f) * (1 - f); }
function drawStatic() { draw(); }

/* ===================== Legenda, janelas, textos fixos ===================== */
function renderLegend() {
  const used = [...new Set(G.D.lifts.map((g) => g.type))];
  $('#legend').innerHTML = used.map((k) => `<span><i style="background:${LIFT_COLOR[k]}"></i>${esc(t('lt.' + k))}</span>`).join('') + (G.D.escs.length ? `<span><i style="background:#FFB703"></i>${esc(t('et.esc'))}</span>` : '') + `<span>${esc(t('leg.queue'))}</span>`;
}
function renderHelp() {
  const li = (k) => `<li>${esc(t(k))}</li>`;
  $('#helpBody').innerHTML = `<p>${esc(t('help.intro'))}</p>
  <h3>${esc(t('help.how'))}</h3><ol>${['help.s1', 'help.s2', 'help.s3', 'help.s4', 'help.s5'].map(li).join('')}</ol>
  <h3>${esc(t('help.types'))}</h3><ul>${LIFT_ORDER.map((k) => `<li><b>${esc(t('lt.' + k))}</b>: ${esc(t('ld.' + k))} ${esc(t('ld.specs', LIFTS[k].speeds.map((v) => nf(v, v < 1 ? 2 : v % 1 ? 1 : 0)).join('–'), LIFTS[k].maxTravel, LIFTS[k].maxStops))}</li>`).join('')}
  <li><b>${esc(t('et.esc'))}</b>: ${esc(t('ld.esc'))}</li><li><b>${esc(t('et.inc'))}</b>: ${esc(t('ld.inc'))}</li><li><b>${esc(t('walk.title'))}</b>: ${esc(t('ld.walk'))}</li></ul>
  <h3>${esc(t('pbb.title'))}</h3><ul>${PBB_ORDER.map((k) => `<li><b>${esc(t('pbbt.' + k))}</b>: ${esc(t('pd.' + k))}</li>`).join('')}</ul>
  <h3>${esc(t('help.metrics'))}</h3><ul>${['m.hc5', 'm.interval', 'm.awt', 'm.maxQ', 'm.clear', 'm.flights', 'm.walk'].map((k) => `<li><b>${esc(t(k))}</b>: ${esc(t(k + '.d'))}</li>`).join('')}</ul>
  <h3>${esc(t('help.stars'))}</h3><p>${esc(t('help.starsT'))}</p>
  <h3>${esc(t('help.model'))}</h3><ul>${['help.m1', 'help.m2', 'help.m3', 'help.m4', 'help.m5'].map(li).join('')}</ul>
  <h3>${esc(t('help.src'))}</h3><p>${esc(t('help.srcT'))}</p>
  <ul class="note"><li><a href="https://www.iso.org/standard/76389.html" rel="noopener" target="_blank">ISO 8100-32:2020</a> · <a href="https://www.cibse.org/knowledge-research/knowledge-portal/guide-d-transportation-systems-in-buildings-2020" rel="noopener" target="_blank">CIBSE Guide D</a></li>
  <li><a href="https://amadatech.com/de/escalator-speed-and-capacity/" rel="noopener" target="_blank">AmadaTECH, “Escalator speed and capacity”</a></li>
  <li><a href="https://www.adelte.com/airports/passenger-boarding-bridges/" rel="noopener" target="_blank">ADELTE, “Passenger Boarding Bridges for Airports”</a></li>
  <li><a href="https://www.kone.com/en-in/blog/different-types-of-elevators.html" rel="noopener" target="_blank">KONE, “Different Types of Elevators”</a></li>
  <li><a href="https://genorma.com/en/standards/en-81-72-2020" rel="noopener" target="_blank">EN 81-72:2020</a></li></ul>`;
}
function renderNewDialog() {
  const s = store.get('newPrefs') || { kind: '', diff: 1 };
  $('#kindChoice').innerHTML = `<label><input type="radio" name="kind" value=""${!s.kind ? ' checked' : ''}> ${esc(t('new.random'))}</label>` + KINDS.map((k) => `<label><input type="radio" name="kind" value="${k}"${s.kind === k ? ' checked' : ''}> ${kindSVG(k).replace('<svg', '<svg width="18" height="18"')} ${esc(t('kind.' + k))}</label>`).join('');
  $('#diffChoice').innerHTML = [0, 1, 2].map((d) => `<label><input type="radio" name="diff" value="${d}"${s.diff === d ? ' checked' : ''}> ${esc(t('diff.' + d))}</label>`).join('');
}
function applyStatic() {
  document.documentElement.lang = HTML_LANG[LANG];
  document.title = t('title') + ' · Giovani Perotto Mesquita';
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll('[data-ta]').forEach((e) => { e.setAttribute('aria-label', t(e.dataset.ta)); e.title = t(e.dataset.ta); });
  $('#lang').value = LANG;
}
function renderAll() { applyStatic(); renderBrief(); renderDesign(); renderResults(); renderLegend(); updateRunBtn(); renderLive(); draw(); }
function setLang(L, push) { if (!LANGS.includes(L)) L = 'pt'; LANG = L; store.set('lang', L); if (push !== false) history.replaceState(null, '', L === 'pt' ? location.pathname + location.search : '#' + L); renderAll(); if ($('#dHelp').open) renderHelp(); if ($('#dNew').open) renderNewDialog(); }

/* ===================== Eventos ===================== */
$('#design').addEventListener('change', onDesignChange);
$('#design').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.add === 'lift') addLift();
  else if (b.dataset.add === 'esc') addEsc();
  else if (b.dataset.rm) { const k = b.dataset.rm[0], i = +b.dataset.rm.slice(1); (k === 'l' ? G.D.lifts : G.D.escs).splice(i, 1); changed(); $('#design').querySelector('[data-add="lift"]').focus(); }
  else if (b.id === 'bRef') { if (!G.helped && !confirm(t('ref.confirm'))) return; G.D = sanitize(refDesign(G.scn)); G.helped = true; changed(); toast(t('ref.done')); }
  else if (b.id === 'bClear') { if (!confirm(t('clear.confirm'))) return; G.D = { lifts: [], escs: [], walk: 0, pbb: {} }; changed(); }
});
$('#results').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'bAgain') { $('#design').scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth' }); const f = $('#design select, #design button'); if (f) f.focus(); }
  if (b.id === 'bNext') openNew();
});
$('#bRun').addEventListener('click', runToggle);
$('#bInstant').addEventListener('click', instant);
$('#bReset').addEventListener('click', () => { stopSim(); G.sim = null; G.result = null; renderResults(); renderLive(); draw(); updateRunBtn(); });
function openNew() { renderNewDialog(); $('#dNew').showModal(); }
$('#bNew').addEventListener('click', openNew);
$('#bNewCancel').addEventListener('click', () => $('#dNew').close());
$('#fNew').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, kind = (f.querySelector('[name=kind]:checked') || {}).value || '', diff = +((f.querySelector('[name=diff]:checked') || {}).value || 1);
  const raw = f.seed.value.trim(), seed = raw && /^\d{1,9}$/.test(raw) ? +raw : (Math.random() * 1e9) >>> 0;
  let k = kind || null;
  if (k && !KIND_DIFF[k].includes(diff)) { toast(t('new.adjusted')); }
  const d = k && !KIND_DIFF[k].includes(diff) ? KIND_DIFF[k][0] === 2 ? 2 : KIND_DIFF[k].includes(1) ? 1 : 2 : diff;
  store.set('newPrefs', { kind, diff });
  $('#dNew').close(); newScenario(seed, k, d);
});
$('#bHelp').addEventListener('click', () => { renderHelp(); $('#dHelp').showModal(); $('#hHelp').focus(); $('#dHelp').scrollTop = 0; });
$('#bHelpClose').addEventListener('click', () => $('#dHelp').close());
$('#bTheme').addEventListener('click', () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = th; store.set('theme', th); draw(); });
$('#lang').addEventListener('change', (e) => setLang(e.target.value));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== LANG) setLang(h, false); });
let rz = 0; window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(draw); });

/* ===================== Início ===================== */
(function init() {
  const th = store.get('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = th;
  const h = location.hash.slice(1), saved = store.get('lang'), nav = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  LANG = LANGS.includes(h) ? h : LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'pt';
  if (!load()) { G.scn = null; newScenario((Math.random() * 1e9) >>> 0, null, 1); return; }
  renderAll();
})();

</script>
