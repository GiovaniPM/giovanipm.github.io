<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Batalha Gelada · Giovani Perotto Mesquita</title>
<meta name="description" content="Batalha Gelada: jogo de artilharia por turnos no universo de My Little Ice World. Bonecos de neve e yetis cinzentos disparam bolas de neve, granizo e bombas de nitrogênio com canhões-casquinha, em terreno que se desfaz. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#070B1F">
<style>
  :root {
    --space: #070B1F; --panel: rgba(14, 20, 48, .9); --panel-solid: #111A3C; --line: rgba(160, 200, 255, .22);
    --ink: #F2F7FF; --muted: #A9B8DA; --ice: #8FD3FF; --ice-deep: #2F6FE0; --pink: #FF8FB8;
    --gold: #FFC94D; --danger: #FF6B6B; --ok: #5FD3A4;
    --round: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #cv { position: fixed; inset: 0; display: block; touch-action: none; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .4; }
  a { color: var(--ice); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  kbd { font-family: inherit; font-size: .68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 .25rem; }
  body.touch kbd { display: none; }

  /* barra de cima */
  .top { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; padding: calc(.5rem + env(safe-area-inset-top)) calc(.5rem + env(safe-area-inset-right)) 0 calc(.5rem + env(safe-area-inset-left)); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .35rem .65rem; font-size: .85rem; line-height: 1.35; }
  .who { display: flex; align-items: center; gap: .5rem; }
  .who .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  .who strong { font-family: var(--round); font-size: 1rem; }
  .who .sub { color: var(--muted); font-size: .78rem; }
  .info { display: flex; flex-wrap: wrap; gap: .2rem .8rem; justify-content: flex-end; }
  .info b { color: var(--ice); font-variant-numeric: tabular-nums; }
  .wind { display: inline-flex; align-items: center; gap: .3rem; }
  .wind svg { width: 40px; height: 14px; }
  .tbtns { display: flex; gap: .3rem; margin-top: .35rem; justify-content: flex-end; flex-wrap: wrap; }
  .sbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: .35rem .6rem; font-size: .8rem; font-weight: 600; }
  .sbtn:hover { border-color: var(--ice); }

  /* painel de controle */
  .ctrl { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: .45rem; padding: .45rem calc(.5rem + env(safe-area-inset-right)) calc(.45rem + env(safe-area-inset-bottom)) calc(.5rem + env(safe-area-inset-left)); background: linear-gradient(180deg, rgba(7,11,31,0), rgba(7,11,31,.92) 30%); }
  .grp { display: flex; align-items: center; gap: .3rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .3rem .45rem; }
  .grp .lbl { font-size: .72rem; color: var(--muted); display: block; line-height: 1.1; }
  .grp .val { font-family: var(--round); font-weight: 700; font-size: 1.05rem; min-width: 2.6rem; text-align: center; font-variant-numeric: tabular-nums; }
  .vbox { display: grid; justify-items: center; }
  .pm { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #0B1230; font-size: 1.15rem; font-weight: 700; line-height: 1; }
  .pm:hover:not(:disabled) { border-color: var(--ice); }
  .wbtn { display: flex; align-items: center; gap: .45rem; min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #0B1230; padding: .25rem .55rem; text-align: left; max-width: 15rem; }
  .wbtn canvas { width: 30px; height: 30px; flex: none; }
  .wbtn .wn { font-weight: 700; font-size: .9rem; display: block; line-height: 1.15; }
  .wbtn .wq { font-size: .75rem; color: var(--muted); display: block; }
  .fire { min-width: 110px; border: 0; border-radius: 12px; background: linear-gradient(180deg, #FF8FB8, #E63B5A); color: #fff; font-family: var(--round); font-weight: 700; font-size: 1.15rem; padding: .4rem 1rem; box-shadow: 0 6px 18px rgba(230,59,90,.35); }
  .fire:hover:not(:disabled) { filter: brightness(1.1); }
  .ibtn { min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #0B1230; padding: .2rem .5rem; font-size: .78rem; font-weight: 600; display: grid; justify-items: center; line-height: 1.15; }
  .ibtn b { color: var(--ice); }
  .ibtn.on { border-color: var(--ice); box-shadow: 0 0 0 2px rgba(143,211,255,.35) inset; }
  .ctrl.wait .grp, .ctrl.wait .fire { opacity: .5; pointer-events: none; }
  .banner { position: fixed; left: 50%; top: 44%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 12px; padding: .6rem 1.1rem; font-family: var(--round); font-size: 1.15rem; font-weight: 700; text-align: center; pointer-events: none; max-width: 92vw; }
  .toasts { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); width: min(92vw, 520px); display: grid; gap: .4rem; justify-items: center; pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ice); border-radius: 10px; padding: .45rem .9rem; font-size: .9rem; text-align: center; animation: tin .25s ease-out; }
  .toast.warn { border-left-color: var(--danger); }
  .toast.good { border-left-color: var(--ok); }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } }

  /* telas */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; background: rgba(5, 8, 24, .65); overflow: auto; z-index: 5; }
  #ovTitle { background: radial-gradient(ellipse at center, rgba(5,8,24,.2), rgba(5,8,24,.8)); }
  .panel { width: min(100%, 620px); max-height: calc(100dvh - 2rem); overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px; padding: 1.3rem clamp(1rem, 4vw, 1.9rem); box-shadow: 0 30px 80px rgba(0,0,0,.5); -webkit-user-select: text; user-select: text; }
  .panel h2 { font-family: var(--round); font-weight: 700; font-size: 1.55rem; margin: 0 0 .7rem; color: var(--ice); }
  .panel h3 { font-family: var(--round); font-weight: 700; font-size: 1.05rem; margin: 1rem 0 .4rem; color: var(--gold); }
  .panel p, .panel li { color: var(--muted); line-height: 1.5; font-size: .95rem; }
  .panel ul { padding-left: 1.2rem; margin: 0; }
  .title { text-align: center; }
  .back { display: inline-block; font-size: .85rem; text-decoration: none; }
  #logo { width: 300px; max-width: 100%; height: 150px; display: block; margin: .2rem auto 0; }
  .logo-text { font-family: var(--round); font-weight: 700; font-size: clamp(2.1rem, 8vw, 3.1rem); line-height: 1.05; margin: 0 0 .2rem; background: linear-gradient(180deg, #FFFFFF 20%, #8FD3FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-family: var(--round); font-size: 1.05rem; color: var(--pink) !important; margin: 0 0 .4rem; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: .9rem; align-items: end; }
  .field { display: grid; gap: .25rem; text-align: left; font-size: .8rem; color: var(--muted); }
  select, input[type="text"] { background: #0B1230; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: .45rem .55rem; min-height: 38px; }
  .btn { border: 0; border-radius: 12px; padding: .65rem 1.15rem; font-weight: 700; font-size: 1rem; color: #fff; background: var(--ice-deep); }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn.alt { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn.pink { background: #E63B5A; }
  .setup { display: grid; gap: .45rem; margin-top: .8rem; text-align: left; }
  .ln { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto 34px; gap: .4rem; align-items: center; }
  .ln .sw { width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.4); }
  .ln input { width: 100%; min-width: 0; }
  .ln .rm { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; font-size: 1.1rem; }
  @media (max-width: 520px) { .ln { grid-template-columns: 26px minmax(0, 1fr) 34px; } .ln select { grid-column: 2 / 4; } .ln select + select { grid-column: 2 / 4; } }
  .shop { display: grid; gap: .45rem; margin: .6rem 0; padding: 0; list-style: none; }
  .shop li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: .2rem .7rem; align-items: center; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.03); }
  .shop canvas { width: 40px; height: 40px; }
  .shop h4 { margin: 0; font-size: .98rem; color: var(--ink); }
  .shop p { margin: .1rem 0 0; font-size: .8rem; line-height: 1.35; }
  .shop .have { font-size: .8rem; color: var(--muted); text-align: right; white-space: nowrap; }
  .shop .btn { padding: .45rem .7rem; font-size: .88rem; white-space: nowrap; }
  .money { font-family: var(--round); font-weight: 700; color: var(--gold); }
  .rank { display: grid; gap: .3rem; margin: .5rem 0; }
  .rank div { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto auto; gap: .6rem; align-items: center; padding: .4rem .6rem; border-radius: 9px; background: rgba(255,255,255,.05); font-size: .92rem; }
  .rank div.head { background: none; font-size: .75rem; color: var(--muted); padding-top: 0; padding-bottom: 0; }
  .rank .sw { width: 16px; height: 16px; border-radius: 50%; }
  .rank b { color: var(--gold); font-variant-numeric: tabular-nums; }
  .rank span:not(:nth-child(2)) { text-align: right; font-variant-numeric: tabular-nums; }
  .wlist { list-style: none; padding: 0 !important; display: grid; gap: .35rem; }
  .wlist button { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: .6rem; align-items: center; text-align: left; padding: .45rem .6rem; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
  .wlist button.cur { border-color: var(--ice); background: rgba(143,211,255,.1); }
  .wlist canvas { width: 34px; height: 34px; }
  .wlist b { color: var(--ice); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: .25rem .8rem; font-size: .9rem; color: var(--muted); }
  .keys kbd { font-size: .8rem; color: var(--ink); }
  body.touch .keys { display: none; }
  @media (max-width: 640px) {
    .grp .lbl { font-size: .66rem; }
    .pm { width: 34px; height: 34px; }
    .fire { min-width: 86px; font-size: 1rem; }
    .wbtn { max-width: 10.5rem; }
    .info { font-size: .76rem; }
    .who strong { font-size: .9rem; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>

<body>
<canvas id="cv" role="img" aria-label="Batalha Gelada"></canvas>

<div class="top" id="top" hidden>
  <div class="chip who" id="who" aria-live="polite"></div>
  <div>
    <div class="chip info" id="info"></div>
    <div class="tbtns">
      <button type="button" class="sbtn" id="bHelp" data-t="help"></button>
      <button type="button" class="sbtn" id="bSound"></button>
      <button type="button" class="sbtn" id="bMenu" data-t="menu"></button>
    </div>
  </div>
</div>
<div class="ctrl" id="ctrl" hidden>
  <div class="grp"><button type="button" class="pm" id="aDn" aria-label="−1°">−</button><div class="vbox"><span class="lbl" data-t="angle"></span><span class="val" id="vAng">45°</span></div><button type="button" class="pm" id="aUp" aria-label="+1°">+</button></div>
  <div class="grp"><button type="button" class="pm" id="pDn" aria-label="−1">−</button><div class="vbox"><span class="lbl" data-t="power"></span><span class="val" id="vPow">60</span></div><button type="button" class="pm" id="pUp" aria-label="+1">+</button></div>
  <div class="grp"><button type="button" class="wbtn" id="bWeapon"><canvas id="wIco" width="60" height="60" aria-hidden="true"></canvas><span><span class="wn" id="wName"></span><span class="wq" id="wQty"></span></span></button></div>
  <div class="grp"><button type="button" class="pm" id="mL" aria-label="←">◀</button><div class="vbox"><span class="lbl" data-t="fuel"></span><span class="val" id="vFuel">0</span></div><button type="button" class="pm" id="mR" aria-label="→">▶</button></div>
  <div class="grp"><button type="button" class="ibtn" id="bShield"><span data-t="shield"></span><b id="qShield">0</b></button><button type="button" class="ibtn" id="bSheep"><span data-t="sheep"></span><b id="qSheep">0</b></button></div>
  <button type="button" class="fire" id="bFire" data-t="fire"></button>
</div>
<div class="banner" id="banner" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<section class="overlay" id="ovTitle" aria-labelledby="ttl">
  <div class="panel title">
    <a class="back" href="projects.html" id="backLink" data-t="back"></a>
    <canvas id="logo" width="600" height="300" aria-hidden="true"></canvas>
    <h1 class="logo-text" id="ttl"></h1>
    <p class="tag" data-t="tagline"></p>
    <p data-t="story"></p>
    <div class="setup" id="setup"></div>
    <div class="row">
      <button type="button" class="btn alt" id="bAdd" data-t="addPlayer"></button>
      <label class="field"><span data-t="mode"></span><select id="modeSel"><option value="ffa" data-t="modeFfa"></option><option value="teams" data-t="modeTeams"></option></select></label>
      <label class="field"><span data-t="rounds"></span><select id="roundsSel"><option value="3">3</option><option value="5">5</option><option value="10">10</option></select></label>
      <label class="field"><span data-t="cash"></span><select id="cashSel"><option value="0" data-t="cash0"></option><option value="1500" data-t="cash1"></option><option value="5000" data-t="cash2"></option></select></label>
      <label class="field"><span data-t="windSet"></span><select id="windSel"><option value="0" data-t="wind0"></option><option value="1" data-t="wind1"></option><option value="2" data-t="wind2"></option></select></label>
      <label class="field"><span data-t="lang"></span><select id="langSel"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
    </div>
    <div class="row">
      <button type="button" class="btn" id="bPlay" data-t="play"></button>
      <button type="button" class="btn alt" id="bResume" data-t="resume" hidden></button>
      <button type="button" class="btn alt" id="bHelp2" data-t="help"></button>
    </div>
  </div>
</section>
<section class="overlay" id="ovHelp" hidden aria-labelledby="helpH"><div class="panel"><h2 id="helpH" data-t="helpTitle"></h2><div id="helpBody"></div><div class="row"><button type="button" class="btn" id="bHelpClose" data-t="close"></button></div></div></section>
<section class="overlay" id="ovWeapons" hidden aria-labelledby="wpH"><div class="panel"><h2 id="wpH" data-t="chooseWeapon"></h2><ul class="wlist" id="wList"></ul><div class="row"><button type="button" class="btn alt" id="bWClose" data-t="close"></button></div></div></section>
<section class="overlay" id="ovShop" hidden aria-labelledby="shopH"><div class="panel"><h2 id="shopH"></h2><p id="shopSub"></p><ul class="shop" id="shopList"></ul><div class="row"><button type="button" class="btn" id="bShopDone" data-t="shopDone"></button></div></div></section>
<section class="overlay" id="ovRound" hidden aria-labelledby="roundH"><div class="panel"><h2 id="roundH"></h2><div id="roundBody"></div><div class="row" id="roundBtns"></div></div></section>

<script>
// Motor da Batalha Gelada: terreno, física, armas, turnos e computador, sem nada de tela. Estado em JSON puro.
function Engine() {
  const WW = 1600, WH = 900, DT = 1 / 120, GRAV = 330, VMAX = 720, UNIT_R = 20;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function rnd(S) { S.seed = (S.seed + 0x6D2B79F5) | 0; let t = Math.imul(S.seed ^ (S.seed >>> 15), 1 | S.seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  // planetas de My Little Ice World: gravidade e vento mudam o jogo
  const PLANETS = {
    ice: { g: 1, wind: 1 }, life: { g: 1.1, wind: 0.8 }, hot: { g: 1.25, wind: 0.6 },
    desert: { g: 1, wind: 1.6 }, gas: { g: 0.7, wind: 1.3 }, ocean: { g: 1, wind: 1.1 },
  };
  const PTYPES = Object.keys(PLANETS);
  // armas: r = raio da explosão, dmg = dano no centro, price/pack = preço por pacote na loja
  const WEAPONS = {
    snowball: { r: 24, dmg: 34, price: 0, pack: 0 },
    bigball: { r: 38, dmg: 48, price: 350, pack: 3 },
    iceblock: { r: 58, dmg: 66, price: 800, pack: 2 },
    hail: { r: 26, dmg: 30, split: 5, price: 1000, pack: 2 },
    bouncer: { r: 32, dmg: 44, bounces: 3, price: 600, pack: 3 },
    icicles: { r: 22, dmg: 26, rain: 5, price: 900, pack: 2 },
    drill: { r: 12, dmg: 22, dig: 190, price: 450, pack: 3 },
    avalanche: { r: 70, dmg: 0, add: true, price: 550, pack: 2 },
    nitro: { r: 115, dmg: 95, price: 2400, pack: 1 },
  };
  const WORDER = Object.keys(WEAPONS);
  const ITEMS = { shield: { price: 600, pack: 1 }, balloon: { price: 300, pack: 2 }, fuel: { price: 250, pack: 60 }, sheep: { price: 500, pack: 1 } };
  const SHIELD = 60, SHEEP_HEAL = 35;
  const COLORS = ['#E63B5A', '#3A86FF', '#FFB703', '#2A9D8F', '#C77DFF', '#FF8A1F'];
  const MONEY = { perDamage: 3, kill: 500, survive: 250, win: 1000 };

  // ---------------------------------------------------------------- jogo e rodadas
  function newGame({ players, rounds, cash, wind, mode, seed }) {
    const S = {
      v: 1, seed: seed == null ? (Date.now() | 0) : seed, rounds, round: 0, windSet: wind, mode,
      players: players.map((p, i) => ({ name: p.name, kind: p.kind, race: p.race, color: COLORS[i % COLORS.length], money: cash, inv: { snowball: -1 }, items: { shield: 0, balloon: 0, fuel: 0, sheep: 0 }, wins: 0, kills: 0, damage: 0 })),
      R: null, phase: 'shop', shopIdx: 0, over: null, log: [],
    };
    return S;
  }
  const team = (S, i) => (S.mode === 'teams' ? S.players[i].race : 'p' + i);
  const foes = (S, a, b) => team(S, a) !== team(S, b);
  function genTerrain(S, type) {
    const h = new Array(WW + 1);
    const base = 260 + rnd(S) * 140, rough = { ice: 1, life: 0.8, hot: 1.4, desert: 0.55, gas: 0.9, ocean: 0.7 }[type];
    const waves = Array.from({ length: 5 }, (_, k) => ({ a: (140 / (k + 1)) * (0.5 + rnd(S)) * rough, f: (k + 1) * (0.6 + rnd(S) * 0.9) * TAU / WW, p: rnd(S) * TAU }));
    for (let x = 0; x <= WW; x++) {
      let y = base;
      waves.forEach((w) => { y += w.a * Math.sin(x * w.f + w.p); });
      h[x] = clamp(y, 90, 640);
    }
    // pequeno ruído para o terreno não ficar liso demais
    let n = 0;
    for (let x = 0; x <= WW; x++) { n = n * 0.9 + (rnd(S) - 0.5) * 6 * rough; h[x] = clamp(h[x] + n, 80, 650); }
    return h.map((v) => Math.round(v * 10) / 10);
  }
  function startRound(S) {
    S.round++;
    // a primeira rodada é sempre num planeta gelado, como em My Little Ice World
    const prev = S.R ? S.R.type : null, pool = PTYPES.filter((k) => k !== prev);
    const type = S.round === 1 ? 'ice' : pool[Math.floor(rnd(S) * pool.length)];
    const P = PLANETS[type], h = genTerrain(S, type), n = S.players.length;
    // posições espalhadas pelo mapa, em ordem sorteada
    const slots = Array.from({ length: n }, (_, i) => Math.round(((i + 0.5) / n) * (WW - 160) + 80 + (rnd(S) - 0.5) * (WW / n) * 0.4));
    for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
    const units = S.players.map((p, i) => {
      const x = slots[i];
      // achata um pouco o chão sob cada atirador
      const g = h[x];
      for (let k = -18; k <= 18; k++) if (x + k >= 0 && x + k <= WW) h[x + k] = g;
      return { p: i, x, y: WH - g, hp: 100, alive: true, angle: x < WW / 2 ? 55 : 125, power: 60, weapon: 'snowball', shield: 0, fuel: p.items.fuel, fallFrom: null };
    });
    S.players.forEach((p) => { p.items.fuel = 0; });
    const order = units.map((u) => u.p);

  function hurt(S, shooter, u, dmg, fx) {

          const P = S.players[u.p];

        // soterrado: continua onde está, coberto de neve
      }

  }

  // ---------------------------------------------------------------- ações

  function endRound(S, live) {
    const R = S.R, winners = live.map((u) => u.p);

  }

  // ---------------------------------------------------------------- computador. kind: 0 fácil, 1 médio, 2 difícil
  function aiShop(S, p) {
    const P = S.players[p], L = P.kind, buys = [];
    const wish = [
      ['shield', [0.15, 0.5, 0.8]], ['sheep', [0.1, 0.4, 0.7]], ['nitro', [0.05, 0.25, 0.6]], ['iceblock', [0.2, 0.5, 0.7]], ['hail', [0.15, 0.4, 0.6]],
      ['bigball', [0.4, 0.6, 0.5]], ['balloon', [0.1, 0.3, 0.4]], ['fuel', [0.1, 0.2, 0.3]], ['bouncer', [0.2, 0.25, 0.2]], ['icicles', [0.1, 0.25, 0.3]], ['drill', [0.1, 0.2, 0.3]], ['avalanche', [0.1, 0.1, 0.15]],
    ];
    for (let pass = 0; pass < 3; pass++) for (const [k, pr] of wish) {
      const it = WEAPONS[k] || ITEMS[k];

  function aiPlan(S) {

    let angle = best.a + (rnd(S) * 2 - 1) * err[0], power = best.pw + (rnd(S) * 2 - 1) * err[1];

    const inv = P.inv, dSelf = Math.abs(tgt.x - u.x);
    let weapon = 'snowball';
    const pref = L === 0 ? WORDER.filter((w) => w === 'snowball' || inv[w] > 0) : ['nitro', 'iceblock', 'hail', 'icicles', 'bigball', 'bouncer', 'snowball'];
    if (L === 0) weapon = pref[Math.floor(rnd(S) * pref.length)];

    return { angle: clamp(angle, 0, 180), power: clamp(power, 5, mp), weapon, shield: L > 0 && P.items.shield > 0 && u.shield === 0 && u.hp < 80, sheep: L > 0 && P.items.sheep > 0 && u.hp <= 60 };
  }

  return { STORM_DMG, WW, WH, DT, VMAX, WEAPONS, WORDER, ITEMS, PLANETS, PTYPES, COLORS, MONEY, SHIELD, SHEEP_HEAL, newGame, startRound, act, fire, stepFlight, aiPlan, aiShop, groundY, maxPower, muzzle, alive, foes, team, predict, rnd };
}

    helpHtml: [
      `<h3>Objetivo</h3><ul><li>Cada jogador tem um canhão-casquinha. Na sua vez, mire, escolha a arma e dispare. Quem perde toda a vida derrete. O último de pé, ou a última equipe, vence a rodada.</li><li>Depois de todas as rodadas, vence quem ganhou mais rodadas; no empate, quem derreteu mais adversários.</li></ul><h3>Mira</h3><ul><li><b>Ângulo:</b> 0° aponta para a direita, 90° para cima, 180° para a esquerda.</li><li><b>Força:</b> de 1 a 100.</li><li><b>Vento</b> empurra o tiro na direção da seta; <b>gravidade</b> muda de planeta para planeta: num gigante de gás os tiros vão longe, num vulcânico caem rápido.</li><li>Você também pode tocar ou clicar na tela: a direção do dedo dá o ângulo e a distância dá a força.</li></ul><h3>Terreno</h3><ul><li>As explosões abrem crateras. Se o chão some debaixo de você, você cai e perde vida, a menos que tenha um balão.</li><li>A avalanche soterra: soterrado, seu tiro explode na boca do canhão. Saia com a broca de gelo.</li><li>Se a rodada se arrastar, vem a <b>nevasca</b>: a cada vez, todos perdem 6 de vida até sobrar um.</li></ul><h3>N₂</h3><ul><li>O nitrogênio líquido é o dinheiro. Você ganha 3 de N₂ por ponto de dano nos adversários, 500 por adversário derretido, 250 por sobreviver e 1.000 por vencer a rodada.</li><li>Entre as rodadas, gaste na loja. Vender devolve metade do preço.</li></ul>`,
      `<h3>Goal</h3><ul><li>Each player has a cone cannon. On your turn, aim, choose a weapon and fire. Whoever loses all their health melts. The last one standing, or the last team, wins the round.</li><li>After all rounds, whoever won the most rounds wins; on a tie, whoever melted the most opponents.</li></ul><h3>Aiming</h3><ul><li><b>Angle:</b> 0° points right, 90° up, 180° left.</li><li><b>Power:</b> from 1 to 100.</li><li><b>Wind</b> pushes the shot toward the arrow; <b>gravity</b> changes from planet to planet: on a gas giant shots fly far, on a volcanic planet they drop fast.</li><li>You can also tap or click the screen: the direction of your finger sets the angle and the distance sets the power.</li></ul><h3>Terrain</h3><ul><li>Explosions open craters. If the ground disappears under you, you fall and lose health, unless you have a balloon.</li><li>The avalanche buries: when buried, your shot explodes at the cannon’s mouth. Get out with the ice drill.</li><li>If a round drags on, the <b>blizzard</b> comes: on every turn, everyone loses 6 health until one is left.</li></ul><h3>N₂</h3><ul><li>Liquid nitrogen is the money. You earn 3 N₂ per point of damage to opponents, 500 per opponent melted, 250 for surviving and 1,000 for winning the round.</li><li>Between rounds, spend it in the shop. Selling returns half the price.</li></ul>`,
      `<h3>Obiettivo</h3><ul><li>Ogni giocatore ha un cannone-cono. Nel tuo turno, mira, scegli l’arma e spara. Chi perde tutta la vita si scioglie. L’ultimo in piedi, o l’ultima squadra, vince il round.</li><li>Dopo tutti i round vince chi ha vinto più round; in caso di parità, chi ha sciolto più avversari.</li></ul><h3>Mira</h3><ul><li><b>Angolo:</b> 0° punta a destra, 90° in alto, 180° a sinistra.</li><li><b>Forza:</b> da 1 a 100.</li><li>Il <b>vento</b> spinge il colpo verso la freccia; la <b>gravità</b> cambia da pianeta a pianeta: su un gigante gassoso i colpi vanno lontano, su uno vulcanico cadono in fretta.</li><li>Puoi anche toccare o cliccare lo schermo: la direzione del dito dà l’angolo e la distanza dà la forza.</li></ul><h3>Terreno</h3><ul><li>Le esplosioni aprono crateri. Se il terreno sparisce sotto di te, cadi e perdi vita, a meno che tu abbia un palloncino.</li><li>La valanga seppellisce: da sepolto, il tuo colpo esplode alla bocca del cannone. Esci con la trivella di ghiaccio.</li><li>Se il round va per le lunghe, arriva la <b>tormenta</b>: a ogni turno tutti perdono 6 di vita finché ne resta uno.</li></ul><h3>N₂</h3><ul><li>L’azoto liquido è il denaro. Guadagni 3 di N₂ per punto di danno agli avversari, 500 per avversario sciolto, 250 se sopravvivi e 1.000 se vinci il round.</li><li>Tra un round e l’altro, spendilo nel negozio. Vendere restituisce metà del prezzo.</li></ul>`,
      `<h3>Objetivo</h3><ul><li>Cada jugador tiene un cañón-cucurucho. En tu turno, apunta, elige el arma y dispara. Quien pierde toda la vida se derrite. El último en pie, o el último equipo, gana la ronda.</li><li>Tras todas las rondas, gana quien ganó más rondas; en caso de empate, quien derritió más rivales.</li></ul><h3>Puntería</h3><ul><li><b>Ángulo:</b> 0° apunta a la derecha, 90° hacia arriba, 180° a la izquierda.</li><li><b>Fuerza:</b> de 1 a 100.</li><li>El <b>viento</b> empuja el disparo hacia la flecha; la <b>gravedad</b> cambia de planeta en planeta: en un gigante gaseoso los disparos llegan lejos, en uno volcánico caen rápido.</li><li>También puedes tocar o hacer clic en la pantalla: la dirección del dedo da el ángulo y la distancia da la fuerza.</li></ul><h3>Terreno</h3><ul><li>Las explosiones abren cráteres. Si el suelo desaparece bajo tus pies, caes y pierdes vida, salvo que tengas un globo.</li><li>La avalancha entierra: enterrado, tu disparo estalla en la boca del cañón. Sal con la broca de hielo.</li><li>Si la ronda se alarga, llega la <b>ventisca</b>: en cada turno todos pierden 6 de vida hasta que quede uno.</li></ul><h3>N₂</h3><ul><li>El nitrógeno líquido es el dinero. Ganas 3 de N₂ por punto de daño a los rivales, 500 por rival derretido, 250 por sobrevivir y 1.000 por ganar la ronda.</li><li>Entre rondas, gástalo en la tienda. Vender devuelve la mitad del precio.</li></ul>`],

      '<h3>Teclado</h3><div class="keys"><kbd>← →</kbd><span>ángulo (Shift: de 5 en 5)</span><kbd>↑ ↓</kbd><span>fuerza (Shift: de 5 en 5)</span><kbd>Espacio</kbd><span>disparar</span><kbd>Tab</kbd><span>arma siguiente</span><kbd>A D</kbd><span>moverse, con combustible</span><kbd>S</kbd><span>escudo</span><kbd>H</kbd><span>iceoveja</span><kbd>Esc</kbd><span>menú</span></div>'],
  };
  let lang = 'pt';
  const LI = () => LANGS.indexOf(lang);
  const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => (v && v[k] !== undefined ? v[k] : m));
  function t(k, v) { const a = k.split('.').reduce((o, x) => (o ? o[x] : undefined), I18N); const s = Array.isArray(a) ? a[LI()] : k; return v ? fill(s, v) : s; }
  const nf = (n) => Math.round(n).toLocaleString({ pt: 'pt-BR', en: 'en-US', it: 'it-IT', es: 'es-ES' }[lang]);

  // ---------------------------------------------------------------- desenho (personagens de My Little Ice World)
  const cv = $('cv'), mainCtx = cv.getContext('2d');
  let ctx = mainCtx, DPR = 1, CW = 0, CH = 0, view = { s: 1, ox: 0, oy: 0 };
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function shadow(rx, ry) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fill(); }
  function snowball(x, y, r) { const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.2, x, y, r); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#C9DEF2'); circle(x, y, r, g); }
  // boneco de neve astronauta, como em My Little Ice World (versão compacta do mesmo desenho)
  function drawSnowman(x, y, fx, o) {
    const s = fx < 0 ? -1 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(o.scale || 1, o.scale || 1);
    shadow(18, 6);
    ctx.strokeStyle = '#7A4E2D'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.beginPath();

      const o = audio.createOscillator(), g = audio.createGain(), st = audio.currentTime + (when || 0);

  }

    else if (k === 'snow') tone(300, 0.25, 'triangle', 0.04, 0, 120);
    else if (k === 'bounce') tone(440, 0.07, 'sine', 0.05, 0, 660);
    else if (k === 'split') tone(880, 0.1, 'triangle', 0.04, 0, 1300);
    else if (k === 'melt') [600, 450, 300].forEach((f, i) => tone(f, 0.2, 'sine', 0.05, i * 0.12));
    else if (k === 'coin') tone(1050, 0.08, 'triangle', 0.04);
    else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, i * 0.12));

    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, stop));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); fn(); } });
  }
  holdable('aDn', () => nudge(-1, 0)); holdable('aUp', () => nudge(1, 0));

  holdable('mL', () => move(-1)); holdable('mR', () => move(1));

  $('bWeapon').addEventListener('click', () => { if (myTurn()) openWeapons(); });
  $('bShield').addEventListener('click', () => { if (myTurn() && act({ type: 'shield' })) { toast(t('shieldOn', { n: E.SHIELD }), 'good'); sfx('coin'); } });
  $('bSheep').addEventListener('click', () => { if (myTurn() && act({ type: 'sheep' })) { toast(t('sheepOn', { p: esc(S.players[S.R.turn].name), n: E.SHEEP_HEAL }), 'good'); sfx('coin'); } });
  // mirar tocando ou arrastando na tela
  let aiming = false;
  function aimAt(e) {
    const u = curUnit(), wx = (e.clientX - view.ox) / view.s, wy = (e.clientY - view.oy) / view.s, cx = u.x, cy = u.y - 26;
    const ang = (Math.atan2(cy - wy, wx - cx) * 180) / Math.PI, d = Math.hypot(wx - cx, wy - cy);
    act({ type: 'aim', angle: clamp(ang < -90 ? 180 : ang < 0 ? 0 : ang, 0, 180), power: clamp((d - 40) / 1.1, 1, 100) });
  }
  cv.addEventListener('pointerdown', (e) => { if (!myTurn()) return; aiming = true; cv.setPointerCapture(e.pointerId); aimAt(e); });
  cv.addEventListener('pointermove', (e) => { if (aiming && myTurn()) aimAt(e); });
  cv.addEventListener('pointerup', () => { aiming = false; if (S) save(); });
  window.addEventListener('keydown', (e) => {
    if (!$('ovHelp').hidden && e.key === 'Escape') { $('ovHelp').hidden = true; return; }
    if (!$('ovWeapons').hidden && e.key === 'Escape') { $('ovWeapons').hidden = true; return; }
    if (!S || $('top').hidden) return;
    if (e.key === 'Escape') { showMenu(); return; }
    if (!myTurn() || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const st = e.shiftKey ? 5 : 1, k = e.key;
    if (k === 'ArrowLeft') { e.preventDefault(); nudge(st, 0); }
    else if (k === 'ArrowRight') { e.preventDefault(); nudge(-st, 0); }
    else if (k === 'ArrowUp') { e.preventDefault(); nudge(0, st); }
    else if (k === 'ArrowDown') { e.preventDefault(); nudge(0, -st); }
    else if (k === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); doFire(); }
    else if (k === 'Tab' && !e.target.closest('.ctrl, .top')) { e.preventDefault(); cycleWeapon(e.shiftKey ? -1 : 1); }
    else if (k === 'a' || k === 'A') move(-1);
    else if (k === 'd' || k === 'D') move(1);
    else if (k === 's' || k === 'S') $('bShield').click();
    else if (k === 'h' || k === 'H') $('bSheep').click();
  });
  $('bHelp').addEventListener('click', () => { $('ovHelp').hidden = false; $('bHelpClose').focus(); });
  $('bHelp2').addEventListener('click', () => { $('ovHelp').hidden = false; $('bHelpClose').focus(); });
  $('bHelpClose').addEventListener('click', () => { $('ovHelp').hidden = true; });
  $('bMenu').addEventListener('click', showMenu);
  $('bPlay').addEventListener('click', startGame);
  $('bResume').addEventListener('click', resume);
  $('bSound').addEventListener('click', () => { soundOn = !soundOn; savePref({ sound: soundOn }); $('bSound').textContent = t(soundOn ? 'soundOn' : 'soundOff'); });
  $('langSel').addEventListener('change', () => { lang = $('langSel').value; savePref({ lang }); applyLang(); });
  ['modeSel', 'roundsSel', 'cashSel', 'windSel'].forEach((id) => $(id).addEventListener('change', () => savePref({ [id]: $(id).value })));
  window.addEventListener('resize', resize);
  // o painel muda de altura quando os textos mudam ou quebram de linha: recalcula o campo
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => resize()); ro.observe($('ctrl')); ro.observe($('top')); }
  window.addEventListener('pointerdown', (e) => { document.body.classList.toggle('touch', e.pointerType === 'touch'); }, true);

  // ---------------------------------------------------------------- logotipo e laço
  const logo = $('logo'), logoCtx = logo.getContext('2d');
  function drawLogo() {
    ctx = logoCtx; ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 300, 150);
    const fl = Math.sin(time * 1.6) * 3;
    ctx.fillStyle = '#DCEEFB'; ctx.beginPath(); ctx.moveTo(0, 150); ctx.quadraticCurveTo(70, 108, 150, 128); ctx.quadraticCurveTo(230, 146, 300, 112); ctx.lineTo(300, 150); ctx.closePath(); ctx.fill();
    drawCannon(70, 126, 35 + Math.sin(time) * 8, '#E63B5A', 1); drawSnowman(70, 126, 1, { helmet: true, hat: '#E63B5A' });
    drawCannon(232, 128, 150 - Math.sin(time * 1.1) * 8, '#6E7688', 1); drawYeti(232, 128, -1, { color: '#FF3B3B' });
    // bola de neve no ar
    const k = (time * 0.45) % 1, bx = 100 + k * 100, by = 92 - Math.sin(k * Math.PI) * 60 + fl;
    snowball(bx, by, 6);
    ctx = mainCtx;
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
    if (!$('ovTitle').hidden) drawLogo();
    if (S && S.R && !$('top').hidden) { updateAI(dt); updateFlight(dt); stepParts(dt); draw(); }
    else { drawSky('ice'); }
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- início
  const prefs = Store.get('batalhagelada.prefs') || {};
  const hashLang = location.hash.slice(1), navLang = ((navigator.language || 'pt').slice(0, 2)).toLowerCase();
  lang = LANGS.includes(hashLang) ? hashLang : (LANGS.includes(prefs.lang) ? prefs.lang : (LANGS.includes(navLang) ? navLang : 'pt'));
  soundOn = prefs.sound !== false;
  setupRows = Array.isArray(prefs.rows) && prefs.rows.length >= 2 ? prefs.rows : defaultRows();
  ['modeSel', 'roundsSel', 'cashSel', 'windSel'].forEach((id) => { if (prefs[id] != null) $(id).value = prefs[id]; });
  if (prefs.cashSel == null) $('cashSel').value = '1500';
  if (prefs.windSel == null) $('windSel').value = '1';
  if (prefs.roundsSel == null) $('roundsSel').value = '5';
  applyLang(); refreshResume(); resize();
  requestAnimationFrame(frame);
  // ganchos para testes automáticos
  window.__bg = { get S() { return S; }, get F() { return F; }, view: () => view, E, showRoundEnd: () => showRoundEnd() };
})();
</script>
