<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Nenhum dado sai deste arquivo: sem rede e sem eval. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>IRIS Code Insights</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230176d3'/%3E%3Cpath d='M4 4h3v3H4zM9 9h3v3H9zM5.5 7v3.5H9' fill='none' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f3f3;--band1:#cfe4f9;--band2:#e8f1fb;--surface:#fff;--surface2:#f3f3f3;--surface3:#fafaf9;
  --text:#181818;--weak:#3e3e3c;--muted:#5c5c5c;--line:#e5e5e5;--line2:#c9c9c9;
  --brand:#0176d3;--brand-dark:#014486;--brand-text:#fff;--brand-soft:#eaf5fe;
  --crit:#ba0517;--crit-soft:#fef1ee;--warn:#8c4b02;--warn-bar:#dd7a01;--warn-soft:#fef5e6;
  --ok:#2e844a;--ok-soft:#ebf7e6;--info:#0176d3;--info-soft:#eaf5fe;
  --violet:#7526e3;--violet-soft:#f2ebfd;--teal:#056764;--teal-soft:#dff6f3;--orange:#a96404;--orange-soft:#fff1d6;--pink:#b60554;--pink-soft:#fef0f5;
  --shadow:0 2px 2px 0 rgba(0,0,0,.08);--radius:.5rem;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#16171a;--band1:#0f2541;--band2:#161d29;--surface:#1f2125;--surface2:#2a2d32;--surface3:#24272b;
  --text:#ececec;--weak:#d0d0d0;--muted:#a6a6a6;--line:#363a40;--line2:#4d525a;
  --brand:#4aa8ff;--brand-dark:#9ccbff;--brand-text:#04182e;--brand-soft:#11304f;
  --crit:#ff8c7d;--crit-soft:#401b17;--warn:#ffc069;--warn-bar:#f5a33c;--warn-soft:#3a2b12;
  --ok:#62cd7a;--ok-soft:#173222;--info:#4aa8ff;--info-soft:#11304f;
  --violet:#c4a1fb;--violet-soft:#2c2045;--teal:#4fd6c8;--teal-soft:#123430;--orange:#ffb85c;--orange-soft:#3a2a10;--pink:#ff8fbf;--pink-soft:#3c1729;
  --shadow:0 2px 3px 0 rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.5 var(--sans);color:var(--text);background:var(--bg);display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
code,.mono,pre{font-family:var(--mono);font-size:12px;font-variant-ligatures:none}
.muted{color:var(--muted)}.spacer{flex:1}.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cabeçalho global */
#gh{display:flex;align-items:center;gap:.75rem;height:3rem;padding:0 .75rem;background:var(--surface);box-shadow:0 1px 0 var(--line);position:relative;z-index:5}
#brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.95rem;white-space:nowrap}
#brand .logo{width:28px;height:28px;border-radius:.375rem;background:var(--brand);display:grid;place-items:center}
.waffle{width:2rem;height:2rem;border:0;background:none;border-radius:.25rem;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.waffle:hover{background:var(--surface2)}
#gsearch-w{flex:1;max-width:32rem;margin:0 auto;position:relative}
#gsearch{width:100%;height:2rem;border:1px solid var(--line2);border-radius:.25rem;background:var(--surface);padding:0 .75rem 0 2rem}
#gsearch:focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);outline:none}
#gsearch-w svg{position:absolute;left:.6rem;top:.55rem;color:var(--muted)}
#gsearch-r{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:.25rem;box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:20rem;overflow:auto;z-index:40;padding:.25rem 0}
#gsearch-r button{display:flex;gap:.5rem;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:.4rem .75rem;cursor:pointer}
#gsearch-r button:hover,#gsearch-r button[aria-selected=true]{background:var(--brand-soft)}
#gsearch-r .muted{font-size:.75rem}
.gh-tools{display:flex;align-items:center;gap:.4rem}
.icon-btn{width:2rem;height:2rem;display:grid;place-items:center;border:1px solid var(--line2);border-radius:.25rem;background:var(--surface);color:var(--muted);cursor:pointer;padding:0}
.icon-btn:hover{background:var(--surface2);color:var(--brand)}
#lang{height:2rem;border:1px solid var(--line2);border-radius:.25rem;background:var(--surface);padding:0 .4rem}

/* barra de navegação do app */
#appnav{display:flex;align-items:stretch;gap:.25rem;height:2.5rem;padding:0 .75rem;background:var(--surface);border-bottom:3px solid var(--brand);overflow-x:auto;scrollbar-width:thin}
#appname{display:flex;align-items:center;font-size:1.05rem;font-weight:400;padding-right:1rem;margin-right:.25rem;border-right:1px solid var(--line);white-space:nowrap}
#appnav [role=tab]{border:0;background:none;padding:0 .9rem;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;color:var(--text);display:flex;align-items:center;gap:.4rem}
#appnav [role=tab]:hover:not([aria-disabled=true]){background:var(--surface2)}
#appnav [role=tab][aria-selected=true]{border-bottom-color:var(--brand-dark);font-weight:700;background:var(--brand-soft)}
#appnav [role=tab][aria-disabled=true]{color:var(--muted);cursor:default;opacity:.6}
#appnav .cnt{font-size:.7rem;background:var(--surface2);border-radius:1rem;padding:0 .4rem;font-weight:700}
#appnav [role=tab][aria-selected=true] .cnt{background:var(--surface)}

/* área principal */
#main{overflow:auto;background:linear-gradient(180deg,var(--band1) 0,var(--band2) 9rem,var(--bg) 18rem);padding:.75rem;scrollbar-gutter:stable}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;flex-wrap:wrap}
.card-h h2{font-size:.95rem;font-weight:700;margin:0;line-height:1.3}
.card-h h2 small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:.3rem}
.card-b{padding:0 1rem 1rem}
.card-f{border-top:1px solid var(--line);padding:.5rem 1rem;text-align:center;font-size:.8rem}
.tile-ic{width:2rem;height:2rem;flex:none;border-radius:.25rem;display:grid;place-items:center;color:#fff}
.tile-ic svg{width:1.1rem;height:1.1rem}
.ic-brand{background:#0176d3}.ic-violet{background:#7526e3}.ic-teal{background:#06a59a}.ic-orange{background:#dd7a01}.ic-pink{background:#d8005a}.ic-green{background:#3ba755}.ic-gray{background:#706e6b}.ic-red{background:#ea001e}
.ph{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;margin-bottom:.75rem;flex-wrap:wrap}
.ph .tile-ic{width:2.5rem;height:2.5rem}
.ph .eyebrow{font-size:.75rem;color:var(--muted);line-height:1.2}
.ph h1{font-size:1.15rem;margin:0;font-weight:700;line-height:1.3;word-break:break-word}
.ph .tt{min-width:0;flex:1 1 14rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;height:2rem;padding:0 1rem;border:1px solid var(--line2);border-radius:.25rem;background:var(--surface);color:var(--brand);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){background:var(--surface2);border-color:var(--line2)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-text)}
.btn.brand:hover:not(:disabled){background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.small{height:1.6rem;padding:0 .6rem;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
.btn.icon{width:2rem;padding:0}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0}
.btn-group .btn+.btn{margin-left:-1px}
.btn-group .btn:first-child{border-radius:.25rem 0 0 .25rem}
.btn-group .btn:last-child{border-radius:0 .25rem .25rem 0}
.link{border:0;background:none;color:var(--brand);padding:0;cursor:pointer;text-align:left;font:inherit}
.link:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:.25rem;background:var(--surface2);color:var(--text);border-radius:15rem;padding:.05rem .5rem;font-size:.72rem;font-weight:700;white-space:nowrap;line-height:1.5}
.badge.b-crit{background:var(--crit-soft);color:var(--crit)}.badge.b-warn{background:var(--warn-soft);color:var(--warn)}.badge.b-ok{background:var(--ok-soft);color:var(--ok)}.badge.b-info{background:var(--info-soft);color:var(--brand-dark)}.badge.b-violet{background:var(--violet-soft);color:var(--violet)}.badge.b-teal{background:var(--teal-soft);color:var(--teal)}.badge.b-orange{background:var(--orange-soft);color:var(--orange)}.badge.b-pink{background:var(--pink-soft);color:var(--pink)}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:.25rem;padding:.3rem .6rem;min-width:0}
input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);outline:none}
label.chk{display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;white-space:nowrap}
.grid{display:grid;gap:.75rem}
.g-home{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-flow{grid-template-columns:17rem minmax(0,1fr)}
.g-map{grid-template-columns:minmax(0,1fr) 18rem}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:.75rem;align-content:start;min-width:0}

/* tela inicial */
.start{max-width:60rem;margin:0 auto}
#drop{border:2px dashed var(--line2);border-radius:var(--radius);padding:2rem 1.5rem;text-align:center;background:var(--surface3);transition:border-color .15s,background .15s}
#drop.over{border-color:var(--brand);background:var(--brand-soft)}
#drop h2{font-size:1.25rem;margin:.75rem 0 .25rem}
#drop p{margin:0 auto 1rem;max-width:44rem;color:var(--weak)}
#drop .row{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin-top:.75rem}
.feat .card{padding:.9rem 1rem}
.feat h3{font-size:.9rem;margin:.5rem 0 .25rem}
.feat p,.feat ul{margin:0;color:var(--weak);font-size:.85rem}
.feat ul{padding-left:1.1rem}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.75rem}
.kpi{padding:.75rem 1rem}
.kpi .v{font-size:1.5rem;font-weight:300;line-height:1.2}
.kpi .l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.kpi .s{font-size:.75rem;color:var(--muted)}

/* insights */
.ins-list{list-style:none;margin:0;padding:0}
.ins{border-top:1px solid var(--line);padding:.7rem 1rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .7rem}
.ins .sev{grid-row:span 3;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;margin-top:.1rem}
.ins .sev svg{width:.95rem;height:.95rem}
.sev.crit{background:var(--crit-soft);color:var(--crit)}.sev.warn{background:var(--warn-soft);color:var(--warn)}.sev.info{background:var(--info-soft);color:var(--brand)}.sev.good{background:var(--ok-soft);color:var(--ok)}
.ins>:not(.sev){grid-column:2}
.ins h3{margin:0;font-size:.9rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.ins p{margin:0;color:var(--weak)}
.ins .fix{font-size:.82rem;color:var(--muted)}
.ins details{margin-top:.15rem}
.ins summary{cursor:pointer;color:var(--brand);font-size:.82rem;width:max-content;max-width:100%}
.where{list-style:none;margin:.35rem 0 0;padding:0;display:grid;gap:.15rem}
.where li{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;font-size:.82rem}
.where .ctx{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;flex:1 1 12rem}
.filters{display:flex;gap:.35rem;flex-wrap:wrap}
.pill{border:1px solid var(--line2);background:var(--surface);border-radius:15rem;padding:.15rem .7rem;cursor:pointer;font-size:.8rem;display:inline-flex;gap:.35rem;align-items:center}
.pill[aria-pressed=true]{background:var(--brand);color:var(--brand-text);border-color:var(--brand)}
.passed{list-style:none;margin:0;padding:.25rem 1rem .75rem;display:grid;gap:.25rem;font-size:.85rem}
.passed li{display:flex;gap:.45rem;align-items:center}
.passed svg{color:var(--ok);flex:none}

/* barras */
.bars{display:grid;gap:.45rem}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.1rem .5rem;font-size:.8rem}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{grid-column:1/-1;height:.5rem;background:var(--surface2);border-radius:1rem;overflow:hidden}
.bar .fill{height:100%;border-radius:1rem;background:var(--brand)}
.bar .fill.warn{background:var(--warn-bar)}.bar .fill.crit{background:var(--crit)}
.units{list-style:none;margin:0;padding:0}
.units li{border-top:1px solid var(--line);padding:.55rem 0;display:grid;gap:.15rem}
.units li:first-child{border-top:0}
.units .nm{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-weight:600;word-break:break-all}
.units .sub{font-size:.78rem;color:var(--muted);word-break:break-word}

/* tabelas */
.tw{overflow:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{text-align:left;padding:.4rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface3);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap;position:sticky;top:0;z-index:1}
th button{border:0;background:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;padding:0;display:inline-flex;gap:.25rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface3)}
td .link{word-break:break-all}

/* fluxo e mapa */
.side-list{max-height:calc(100vh - 15rem);min-height:14rem;overflow:auto;border-top:1px solid var(--line)}
.side-list h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:0;padding:.5rem .75rem .25rem;position:sticky;top:0;background:var(--surface);word-break:break-all}
.mb{display:flex;gap:.4rem;align-items:center;width:100%;border:0;background:none;text-align:left;padding:.3rem .75rem;cursor:pointer;border-left:3px solid transparent}
.mb:hover{background:var(--surface2)}
.mb[aria-current=true]{background:var(--brand-soft);border-left-color:var(--brand);font-weight:600}
.mb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb .ty{font-size:.68rem;color:var(--muted)}
.toolbar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;padding:.5rem 1rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface3)}
.canvas{overflow:auto;height:calc(100vh - 17rem);min-height:22rem;background-color:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;cursor:grab;touch-action:none;position:relative}
.canvas.drag{cursor:grabbing}
.canvas svg{display:block;margin:0 auto}
.infobar{padding:.5rem 1rem;font-size:.82rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;min-height:2.4rem;border-top:1px solid var(--line)}
.infobar code{background:var(--surface2);padding:.05rem .35rem;border-radius:.25rem;word-break:break-all}
.legend{display:flex;gap:.75rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted);padding:.4rem 1rem .6rem}
.legend span{display:inline-flex;gap:.3rem;align-items:center}
.legend i{width:.8rem;height:.8rem;border-radius:.15rem;display:inline-block;border:1.5px solid}
.det dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3rem .75rem;margin:0;font-size:.82rem}
.det dt{color:var(--muted)}
.det dd{margin:0;word-break:break-word}
.det pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.5 var(--mono);background:var(--surface2);padding:.5rem .6rem;border-radius:.25rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}

/* SVG do fluxo */
svg text{font-family:var(--sans)}
.fn{cursor:pointer;outline:none}
.fn .sh{fill:var(--surface);stroke:var(--line2);stroke-width:1.4}
.fn text{font-size:12px;fill:var(--text)}
.fn .sm{font-size:10.5px;fill:var(--muted)}
.fn.start .sh{fill:var(--ok-soft);stroke:var(--ok)}
.fn.end .sh{fill:var(--surface2);stroke:var(--muted)}
.fn.dec .sh{fill:var(--warn-soft);stroke:var(--warn-bar)}
.fn.loop .sh{fill:var(--violet-soft);stroke:var(--violet)}
.fn.call .sh{fill:var(--brand-soft);stroke:var(--brand)}
.fn.call .bar2{stroke:var(--brand);stroke-width:1.2}
.fn.sql .sh{fill:var(--teal-soft);stroke:var(--teal)}
.fn.io .sh{fill:var(--surface);stroke:var(--muted)}
.fn.ret .sh{fill:var(--ok-soft);stroke:var(--ok)}
.fn.quit .sh{fill:var(--surface2);stroke:var(--weak)}
.fn.thr .sh{fill:var(--crit-soft);stroke:var(--crit)}
.fn.risk .sh{stroke:var(--crit);stroke-width:2.4}
.fn:hover .sh{stroke-width:2.4}
.fn:focus-visible .sh,.fn.sel .sh{stroke:var(--brand);stroke-width:3.2}
.fe{fill:none;stroke:var(--muted);stroke-width:1.4}
.fe.ex{stroke:var(--crit);stroke-dasharray:5 4}
.fe.back{stroke:var(--violet)}
.fl{font-size:10.5px;fill:var(--muted);font-weight:600}
.fl.ex{fill:var(--crit)}
.box-try{fill:none;stroke:var(--brand);stroke-dasharray:6 4;stroke-width:1.2}
.box-catch{fill:none;stroke:var(--crit);stroke-dasharray:6 4;stroke-width:1.2}
.box-do{fill:none;stroke:var(--violet);stroke-dasharray:6 4;stroke-width:1.2}
.box-t{font-size:11px;font-weight:700;fill:var(--muted)}
.mdot{fill:var(--muted)}
#ar path{fill:var(--muted)}#ar-x path{fill:var(--crit)}#ar-b path{fill:var(--violet)}#ar-m path{fill:var(--muted)}
/* SVG do mapa */
.mn{cursor:pointer;outline:none}
.mn rect.bg{fill:var(--surface);stroke:var(--line2);stroke-width:1.2}
.mn rect.k{stroke:none}
.mn text{font-size:12px;fill:var(--text)}
.mn .sm{font-size:10px;fill:var(--muted)}
.mn:hover rect.bg{stroke:var(--brand)}
.mn:focus-visible rect.bg,.mn.sel rect.bg{stroke:var(--brand);stroke-width:3}
.me{fill:none;stroke:var(--muted);opacity:.55}
.me.inh{stroke-dasharray:6 4;stroke:var(--violet)}
.me.data{stroke:var(--teal)}
.me.msg{stroke:var(--pink)}
.me.route{stroke:var(--ok)}
.me.cyc{stroke-dasharray:3 3}
.me.hi{opacity:1;stroke-width:2.4}
.dim{opacity:.15}
.k-cls{fill:#0176d3}.k-rtn{fill:#7526e3}.k-meth{fill:#0176d3}.k-label{fill:#7526e3}.k-ext{fill:#8a8886}.k-glob{fill:#dd7a01}.k-tbl{fill:#06a59a}.k-msg{fill:#d8005a}.k-route{fill:#3ba755}.k-inc{fill:#8a8886}

/* código */
.code{position:relative;font:12px/1.6 var(--mono);font-variant-ligatures:none;overflow:auto;height:calc(100vh - 14rem);min-height:20rem;border-top:1px solid var(--line);background:var(--surface);tab-size:4}
.cl{display:grid;grid-template-columns:4.2em minmax(0,1fr);white-space:pre}
.cl .no{color:var(--muted);text-align:right;padding-right:1em;user-select:none;border-right:1px solid var(--line);background:var(--surface3)}
.cl .tx{padding-left:.8em}
.cl.hl{background:var(--warn-soft)}
.cl.hl .no{background:var(--warn-bar);color:#fff}
.t-c{color:#2e844a;font-style:italic}.t-s{color:#a61a14}.t-k{color:#0b5cab;font-weight:600}.t-f{color:#7526e3}.t-m{color:#056764}.t-g{color:#a96404}.t-d{color:#b60554}.t-n{color:#3e3e3c}

/* modal e toast */
.backdrop{position:fixed;inset:0;background:rgba(8,7,7,.6);display:grid;place-items:center;z-index:50;padding:1rem}
.modal{background:var(--surface);border-radius:var(--radius);width:min(46rem,100%);max-height:calc(100vh - 2rem);display:grid;grid-template-rows:auto minmax(0,1fr) auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal header{padding:1rem 1.25rem;border-bottom:1px solid var(--line);text-align:center;position:relative}
.modal header h2{margin:0;font-size:1.15rem;font-weight:400}
.modal .x{position:absolute;right:.6rem;top:.6rem}
.modal .body{padding:1rem 1.25rem;overflow:auto}
.modal .body h4{margin:1rem 0 .3rem;font-size:.9rem}
.modal .body h4:first-child{margin-top:0}
.modal .body ul{margin:0;padding-left:1.2rem}
.modal footer{padding:.75rem 1.25rem;border-top:1px solid var(--line);background:var(--surface3);display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;border-radius:0 0 var(--radius) var(--radius)}
#toasts{position:fixed;top:4rem;left:50%;transform:translateX(-50%);display:grid;gap:.5rem;z-index:60;width:min(32rem,calc(100% - 2rem))}
.toast{display:flex;gap:.6rem;align-items:center;padding:.75rem 1rem;border-radius:.25rem;color:#fff;background:#444;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.ok{background:#2e844a}.toast.err{background:#ba0517}.toast.info{background:#0b5cab}

@media (max-width:1100px){.g-home{grid-template-columns:minmax(0,1fr)}.g-map{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.g-flow{grid-template-columns:minmax(0,1fr)}.side-list{max-height:14rem}.feat{grid-template-columns:minmax(0,1fr)}.g-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){#gsearch-w{display:none}#brand .bt{display:none}.gh-tools{margin-left:auto}#appname{display:none}.ph .btn-group{flex-wrap:wrap}.canvas{height:60vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  body{display:block;overflow:visible;height:auto;background:#fff}
  #gh,#appnav,.toolbar,.ph .btn-group,#toasts{display:none!important}
  #main{overflow:visible;background:none;padding:0}
  .card{box-shadow:none;break-inside:avoid}
  .canvas,.code,.side-list{height:auto;max-height:none;overflow:visible}
}

pasteHint:['Sem nome, o tipo é reconhecido pelo conteúdo: "Class" vira .cls, "<Export" vira XML e o resto é tratado como rotina.','Without a name, the type is recognized from the content: "Class" becomes .cls, "<Export" becomes XML and the rest is treated as a routine.','Senza nome, il tipo viene riconosciuto dal contenuto: "Class" diventa .cls, "<Export" diventa XML e il resto è trattato come routine.','Sin nombre, el tipo se reconoce por el contenido: "Class" pasa a .cls, "<Export" pasa a XML y el resto se trata como rutina.'],

help1:['Use Abrir arquivos, arraste os arquivos para a janela ou cole o código. Vários arquivos juntos permitem ligar as chamadas entre classes.','Use Open files, drag the files onto the window or paste the code. Several files together let the app link calls between classes.','Usa Apri file, trascina i file nella finestra o incolla il codice. Più file insieme permettono di collegare le chiamate tra le classi.','Usa Abrir archivos, arrastra los archivos a la ventana o pega el código. Varios archivos juntos permiten enlazar las llamadas entre clases.'],
help2:['Formatos: .cls em UDL, .mac, .int, .inc e .xml exportado.','Formats: .cls in UDL, .mac, .int, .inc and exported .xml.','Formati: .cls in UDL, .mac, .int, .inc e .xml esportato.','Formatos: .cls en UDL, .mac, .int, .inc y .xml exportado.'],
help3:['Clique em qualquer local citado em um insight para abrir o código na linha certa.','Click any place listed in an insight to open the code at the right line.','Fai clic su qualsiasi punto citato in un insight per aprire il codice alla riga giusta.','Haz clic en cualquier lugar citado en un insight para abrir el código en la línea correcta.'],
hExp:['Como tirar o código do IRIS','How to get the code out of IRIS','Come estrarre il codice da IRIS','Cómo sacar el código de IRIS'],
exp1:['No VS Code com a extensão InterSystems ObjectScript, use o comando ObjectScript: Export Code from Server. Por padrão, os arquivos vão para a pasta src do workspace.','In VS Code with the InterSystems ObjectScript extension, use the ObjectScript: Export Code from Server command. By default, the files go to the src folder of the workspace.','In VS Code con l\'estensione InterSystems ObjectScript, usa il comando ObjectScript: Export Code from Server. Per impostazione predefinita, i file vanno nella cartella src del workspace.','En VS Code con la extensión InterSystems ObjectScript, usa el comando ObjectScript: Export Code from Server. De forma predeterminada, los archivos van a la carpeta src del workspace.'],
exp2:['No Terminal do IRIS, o comando abaixo gera um XML com as classes de um pacote:','In the IRIS Terminal, the command below creates an XML file with the classes of a package:','Nel Terminal di IRIS, il comando qui sotto crea un XML con le classi di un pacchetto:','En el Terminal de IRIS, el comando de abajo genera un XML con las clases de un paquete:'],
hTabs:['As seções','The sections','Le sezioni','Las secciones'],
tab1:['Insights: indicadores, achados e métodos mais complexos.','Insights: indicators, findings and the most complex methods.','Insight: indicatori, risultati e metodi più complessi.','Insights: indicadores, hallazgos y métodos más complejos.'],
tab2:['Fluxo: o fluxograma de um método. Losango é decisão, roxo é laço, azul com barras é chamada, cilindro é SQL.','Flow: the flowchart of a method. A diamond is a decision, purple is a loop, blue with bars is a call, a cylinder is SQL.','Flusso: il diagramma di un metodo. Il rombo è una decisione, il viola un ciclo, il blu con barre una chiamata, il cilindro è SQL.','Flujo: el diagrama de un método. El rombo es una decisión, el morado un bucle, el azul con barras una llamada, el cilindro es SQL.'],
tab3:['Dependências: quem chama quem, por classe ou por método, com herança, tabelas, globais e mensagens.','Dependencies: who calls whom, by class or by method, with inheritance, tables, globals and messages.','Dipendenze: chi chiama chi, per classe o per metodo, con ereditarietà, tabelle, globali e messaggi.','Dependencias: quién llama a quién, por clase o por método, con herencia, tablas, globales y mensajes.'],
tab4:['Membros, Dados e Código: a tabela de todos os membros, o uso de SQL, globais, rotas REST e o código com destaque de sintaxe.','Members, Data and Code: the table of all members, the use of SQL, globals and REST routes, and the code with syntax highlighting.','Membri, Dati e Codice: la tabella di tutti i membri, l\'uso di SQL, globali e rotte REST, e il codice con evidenziazione della sintassi.','Miembros, Datos y Código: la tabla de todos los miembros, el uso de SQL, globales y rutas REST, y el código con resaltado de sintaxis.'],
hLim:['Limites','Limits','Limiti','Límites'],
lim1:['A leitura é heurística: o app não compila o código e pode errar em construções raras.','Reading is heuristic: the app does not compile the code and can be wrong on rare constructs.','La lettura è euristica: l\'app non compila il codice e può sbagliare su costrutti rari.','La lectura es heurística: la app no compila el código y puede equivocarse en construcciones raras.'],
lim2:['Macros não são expandidas. Membros herdados de classes que não estão nos arquivos aparecem como externos.','Macros are not expanded. Members inherited from classes that are not in the files appear as external.','Le macro non vengono espanse. I membri ereditati da classi che non sono nei file appaiono come esterni.','Las macros no se expanden. Los miembros heredados de clases que no están en los archivos aparecen como externos.'],
lim3:['A complexidade é uma aproximação, útil para comparar métodos entre si.','Complexity is an approximation, useful for comparing methods with each other.','La complessità è un\'approssimazione, utile per confrontare i metodi tra loro.','La complejidad es una aproximación, útil para comparar métodos entre sí.'],
lim4:['Chamadas por variável só são ligadas quando o tipo aparece no próprio método (#dim, argumento ou %New/%OpenId).','Calls through a variable are linked only when the type appears in the method itself (#dim, argument or %New/%OpenId).','Le chiamate tramite variabile vengono collegate solo quando il tipo compare nel metodo stesso (#dim, argomento o %New/%OpenId).','Las llamadas por variable solo se enlazan cuando el tipo aparece en el propio método (#dim, argumento o %New/%OpenId).'],
lim5:['Métodos em Python ou outra linguagem não ganham fluxograma: o app conta as linhas e as chamadas iris.cls().','Methods in Python or another language get no flowchart: the app counts the lines and the iris.cls() calls.','I metodi in Python o in un\'altra lingua non hanno diagramma: l\'app conta le righe e le chiamate iris.cls().','Los métodos en Python u otro lenguaje no tienen diagrama: la app cuenta las líneas y las llamadas iris.cls().'],
hSrc:['Fontes das regras de QUIT, RETURN, TRY e %ResultSet','Sources for the QUIT, RETURN, TRY and %ResultSet rules','Fonti delle regole su QUIT, RETURN, TRY e %ResultSet','Fuentes de las reglas de QUIT, RETURN, TRY y %ResultSet'],
about:['Ferramenta independente, sem vínculo com a InterSystems. InterSystems IRIS e ObjectScript são marcas da InterSystems Corporation.','Independent tool, not affiliated with InterSystems. InterSystems IRIS and ObjectScript are trademarks of InterSystems Corporation.','Strumento indipendente, non affiliato a InterSystems. InterSystems IRIS e ObjectScript sono marchi di InterSystems Corporation.','Herramienta independiente, sin vínculo con InterSystems. InterSystems IRIS y ObjectScript son marcas de InterSystems Corporation.'],
newT:['Nova análise','New analysis','Nuova analisi','Nuevo análisis'],newD:['A análise atual sai da memória e a tela inicial volta. Os arquivos no seu computador não mudam. Para guardar o resultado antes, use Relatório.','The current analysis is cleared from memory and the start screen comes back. The files on your computer do not change. To keep the result first, use Report.','L\'analisi attuale viene tolta dalla memoria e torna la schermata iniziale. I file sul tuo computer non cambiano. Per conservare prima il risultato, usa Report.','El análisis actual sale de la memoria y vuelve la pantalla inicial. Los archivos de tu equipo no cambian. Para guardar antes el resultado, usa Informe.'],newOk:['Limpar e começar','Clear and start','Svuota e ricomincia','Limpiar y empezar'],

demoNote:['Exemplo com código fictício, escrito para mostrar os achados. Não vem de nenhum sistema real.','Sample with made-up code, written to show the findings. It does not come from any real system.','Esempio con codice fittizio, scritto per mostrare i risultati. Non proviene da alcun sistema reale.','Ejemplo con código ficticio, escrito para mostrar los hallazgos. No viene de ningún sistema real.'],

/* regras: N nome, D o que acontece, F como corrigir */
in_killAllN:['Kill apaga uma global inteira','Kill erases an entire global','Kill cancella un\'intera globale','Kill borra una global entera'],
in_killAllD:['Kill ^Global sem subscrito apaga todos os nós da global, para todos os usuários, e não tem volta fora de uma transação.','Kill ^Global without a subscript erases every node of the global, for every user, and cannot be undone outside a transaction.','Kill ^Global senza indice cancella tutti i nodi della globale, per tutti gli utenti, e non si può annullare fuori da una transazione.','Kill ^Global sin subíndice borra todos los nodos de la global, para todos los usuarios, y no tiene vuelta fuera de una transacción.'],
in_killAllF:['Confirme se é mesmo isso. Se for limpeza parcial, mate só os subscritos necessários e proteja o comando com uma checagem explícita.','Confirm that this is really intended. For a partial cleanup, kill only the subscripts you need and guard the command with an explicit check.','Conferma che sia davvero voluto. Per una pulizia parziale, elimina solo gli indici necessari e proteggi il comando con un controllo esplicito.','Confirma que es realmente lo que se quiere. Para una limpieza parcial, borra solo los subíndices necesarios y protege el comando con una comprobación explícita.'],
in_quitArgTryN:['Quit com valor dentro de Try ou Catch','Quit with a value inside Try or Catch','Quit con valore dentro Try o Catch','Quit con valor dentro de Try o Catch'],
in_quitArgTryD:['A documentação do TRY diz que Quit com argumento não pode sair de um bloco Try e que tentar isso dá erro de compilação.','The TRY documentation says a Quit with an argument cannot exit a Try block and that trying to do so causes a compile error.','La documentazione di TRY dice che un Quit con argomento non può uscire da un blocco Try e che tentarlo causa un errore di compilazione.','La documentación de TRY dice que un Quit con argumento no puede salir de un bloque Try y que intentarlo da un error de compilación.'],
in_quitArgTryF:['Use Return valor, que sai do método de qualquer bloco, ou guarde o valor e use Quit depois do Catch.','Use Return value, which leaves the method from any block, or store the value and Quit after the Catch.','Usa Return valore, che esce dal metodo da qualsiasi blocco, oppure salva il valore e fai Quit dopo il Catch.','Usa Return valor, que sale del método desde cualquier bloque, o guarda el valor y haz Quit después del Catch.'],
in_sqlConcatN:['SQL montado por concatenação','SQL built by concatenation','SQL costruito per concatenazione','SQL armado por concatenación'],
in_sqlConcatD:['O texto do SQL junta valores com o operador _. Se um valor vier do usuário, ele pode mudar o comando: é a porta para injeção de SQL.','The SQL text joins values with the _ operator. If a value comes from the user, it can change the statement: that is the door to SQL injection.','Il testo SQL unisce valori con l\'operatore _. Se un valore arriva dall\'utente, può cambiare l\'istruzione: è la porta all\'SQL injection.','El texto del SQL une valores con el operador _. Si un valor viene del usuario, puede cambiar la sentencia: es la puerta a la inyección de SQL.'],
in_sqlConcatF:['Use ? no texto e passe os valores em %Execute(valor1, valor2), ou use SQL embutido com variáveis :host.','Use ? in the text and pass the values in %Execute(value1, value2), or use embedded SQL with :host variables.','Usa ? nel testo e passa i valori in %Execute(valore1, valore2), oppure usa SQL incorporato con variabili :host.','Usa ? en el texto y pasa los valores en %Execute(valor1, valor2), o usa SQL embebido con variables :host.'],
in_hardPwdN:['Senha ou segredo no código','Password or secret in the code','Password o segreto nel codice','Contraseña o secreto en el código'],
in_hardPwdD:['Uma variável com nome de senha, token ou chave recebe um texto fixo. Quem lê o código, o controle de versão ou uma exportação vê o segredo.','A variable named like a password, token or key gets a fixed text. Anyone who reads the code, the version control or an export sees the secret.','Una variabile con nome da password, token o chiave riceve un testo fisso. Chi legge il codice, il controllo di versione o un\'esportazione vede il segreto.','Una variable con nombre de contraseña, token o clave recibe un texto fijo. Quien lee el código, el control de versiones o una exportación ve el secreto.'],
in_hardPwdF:['Guarde o segredo em credenciais da produção, em uma global protegida ou em variável de ambiente, e troque o valor que já vazou.','Keep the secret in production credentials, in a protected global or in an environment variable, and change the value that has already leaked.','Conserva il segreto nelle credenziali della produzione, in una globale protetta o in una variabile d\'ambiente, e cambia il valore già esposto.','Guarda el secreto en credenciales de la producción, en una global protegida o en una variable de entorno, y cambia el valor que ya se filtró.'],
in_statusIgnoredN:['%Status descartado','%Status thrown away','%Status scartato','%Status descartado'],
in_statusIgnoredD:['O método chamado devolve um %Status, mas Do joga o resultado fora. Se o %Save ou a chamada falhar, o código segue como se tudo tivesse dado certo.','The called method returns a %Status, but Do throws the result away. If the %Save or the call fails, the code goes on as if everything had worked.','Il metodo chiamato restituisce un %Status, ma Do scarta il risultato. Se il %Save o la chiamata fallisce, il codice prosegue come se tutto fosse andato bene.','El método llamado devuelve un %Status, pero Do descarta el resultado. Si el %Save o la llamada falla, el código sigue como si todo hubiera salido bien.'],
in_statusIgnoredF:['Guarde o retorno e teste: Set sc = obj.%Save() e depois $$$ThrowOnError(sc) ou If $$$ISERR(sc) { ... }.','Keep the return value and test it: Set sc = obj.%Save() and then $$$ThrowOnError(sc) or If $$$ISERR(sc) { ... }.','Conserva il valore restituito e controllalo: Set sc = obj.%Save() e poi $$$ThrowOnError(sc) o If $$$ISERR(sc) { ... }.','Guarda el retorno y compruébalo: Set sc = obj.%Save() y luego $$$ThrowOnError(sc) o If $$$ISERR(sc) { ... }.'],
in_sqlcodeN:['SQLCODE não é conferido','SQLCODE is not checked','SQLCODE non viene controllato','SQLCODE no se comprueba'],
in_sqlcodeD:['O método tem SQL embutido (&sql) e não lê SQLCODE em nenhum lugar. Um erro de SQL ou "nenhuma linha" passa despercebido.','The method has embedded SQL (&sql) and never reads SQLCODE. A SQL error or "no row" goes unnoticed.','Il metodo ha SQL incorporato (&sql) e non legge mai SQLCODE. Un errore SQL o "nessuna riga" passa inosservato.','El método tiene SQL embebido (&sql) y no lee SQLCODE en ningún lugar. Un error de SQL o "ninguna fila" pasa inadvertido.'],
in_sqlcodeF:['Logo depois do &sql, teste If SQLCODE < 0 para erro e SQLCODE = 100 para nenhuma linha.','Right after the &sql, test If SQLCODE < 0 for an error and SQLCODE = 100 for no row.','Subito dopo &sql, verifica If SQLCODE < 0 per un errore e SQLCODE = 100 per nessuna riga.','Justo después del &sql, comprueba If SQLCODE < 0 para error y SQLCODE = 100 para ninguna fila.'],
in_emptyCatchN:['Catch vazio','Empty Catch','Catch vuoto','Catch vacío'],
in_emptyCatchD:['O bloco Catch não tem nenhum comando. A exceção é engolida: o erro não é registrado nem devolvido a quem chamou.','The Catch block has no command. The exception is swallowed: the error is neither logged nor returned to the caller.','Il blocco Catch non ha alcun comando. L\'eccezione viene inghiottita: l\'errore non viene registrato né restituito al chiamante.','El bloque Catch no tiene ningún comando. La excepción se traga: el error no se registra ni se devuelve a quien llamó.'],
in_emptyCatchF:['Converta e devolva o erro (Set sc = ex.AsStatus()) ou registre-o antes de seguir.','Convert and return the error (Set sc = ex.AsStatus()) or log it before going on.','Converti e restituisci l\'errore (Set sc = ex.AsStatus()) o registralo prima di proseguire.','Convierte y devuelve el error (Set sc = ex.AsStatus()) o regístralo antes de seguir.'],
in_quitTryN:['Quit dentro de Try sai só do Try','Quit inside Try only leaves the Try','Quit dentro di Try esce solo dal Try','Quit dentro de Try solo sale del Try'],
in_quitTryD:['Segundo a documentação, Quit sem argumento dentro de um Try leva a execução para a primeira linha depois do Catch, e não para fora do método. O código depois do bloco continua rodando.','According to the documentation, an argumentless Quit inside a Try moves execution to the first line after the Catch, not out of the method. The code after the block keeps running.','Secondo la documentazione, un Quit senza argomento dentro un Try porta l\'esecuzione alla prima riga dopo il Catch, non fuori dal metodo. Il codice dopo il blocco continua a essere eseguito.','Según la documentación, un Quit sin argumento dentro de un Try lleva la ejecución a la primera línea después del Catch, no fuera del método. El código después del bloque sigue ejecutándose.'],
in_quitTryF:['Se a intenção é sair do método, use Return. Se é sair só do bloco, deixe um comentário dizendo isso.','If the intent is to leave the method, use Return. If it is to leave only the block, add a comment saying so.','Se l\'intento è uscire dal metodo, usa Return. Se è uscire solo dal blocco, aggiungi un commento che lo dica.','Si la intención es salir del método, usa Return. Si es salir solo del bloque, deja un comentario que lo diga.'],
in_quitArgLoopN:['Quit com valor dentro de laço','Quit with a value inside a loop','Quit con valore dentro un ciclo','Quit con valor dentro de un bucle'],
in_quitArgLoopD:['A documentação do QUIT diz que Quit com argumento não pode ser usado para sair da rotina de dentro de um For, While ou Do-While.','The QUIT documentation says a Quit with an argument cannot be used to exit the routine from inside a For, While or Do-While.','La documentazione di QUIT dice che un Quit con argomento non può essere usato per uscire dalla routine dall\'interno di un For, While o Do-While.','La documentación de QUIT dice que un Quit con argumento no puede usarse para salir de la rutina desde dentro de un For, While o Do-While.'],
in_quitArgLoopF:['Use Return valor para sair do método de dentro do laço.','Use Return value to leave the method from inside the loop.','Usa Return valore per uscire dal metodo dall\'interno del ciclo.','Usa Return valor para salir del método desde dentro del bucle.'],
in_txRiskN:['Transação sem rollback garantido','Transaction without a guaranteed rollback','Transazione senza rollback garantito','Transacción sin rollback garantizado'],
in_txRiskD:['O método abre uma transação com TStart, mas não tem TRollback ou não tem Try/Catch. Se der erro no meio, a transação fica aberta e os locks continuam presos.','The method opens a transaction with TStart, but has no TRollback or no Try/Catch. If an error happens midway, the transaction stays open and the locks stay held.','Il metodo apre una transazione con TStart, ma non ha TRollback o non ha Try/Catch. Se c\'è un errore a metà, la transazione resta aperta e i lock restano bloccati.','El método abre una transacción con TStart, pero no tiene TRollback o no tiene Try/Catch. Si hay un error a mitad, la transacción queda abierta y los locks siguen tomados.'],

let LANG='pt';
const li=()=>LANGS.indexOf(LANG);
function t(key,...a){const e=I18N[key];let s=e?e[li()]:key;a.forEach((v,i)=>{s=s.split('{'+i+'}').join(String(v))});return s}

/* ========== utilitários ========== */
const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)];
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in attrs||{}){
    const v=attrs[k];if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='class')e.className=v;
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  const add=c=>{if(c==null||c===false)return;if(Array.isArray(c))c.forEach(add);else e.append(c)};
  kids.forEach(add);
  return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs,...kids){
  const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs||{}){const v=attrs[k];if(v==null||v===false)continue;if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}
  kids.forEach(c=>{if(c!=null&&c!==false)e.append(c)});
  return e;
}
const store={get(k){try{return localStorage.getItem('irisci.'+k)}catch{return null}},set(k,v){try{localStorage.setItem('irisci.'+k,v)}catch{}}};
const nf=(n,d=0)=>Number(n).toLocaleString(LOCALE[LANG],{maximumFractionDigits:d});
function lineStarts(s){const a=[0];for(let i=0;i<s.length;i++)if(s.charCodeAt(i)===10)a.push(i+1);return a}
function lineOf(ls,pos){let lo=0,hi=ls.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(ls[m]<=pos)lo=m;else hi=m-1}return lo+1}
const clip=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
const lc=s=>String(s||'').toLowerCase();

/* ========== varredura de ObjectScript ========== */
// Pula uma string "..." (aspas duplicadas são escape). Strings não atravessam linhas.
function skipStr(s,i){i++;const n=s.length;while(i<n){const c=s[i];if(c==='"'){if(s[i+1]==='"'){i+=2;continue}return i+1}if(c==='\n')return i;i++}return n}
// Se há um comentário em i, devolve onde ele termina; senão -1.
function commentEnd(s,i){
  const c=s[i],d=s[i+1];
  if(c===';'||(c==='/'&&d==='/')||(c==='#'&&d===';')||(c==='#'&&d==='#'&&s[i+2]===';')){const j=s.indexOf('\n',i);return j<0?s.length:j}
  if(c==='/'&&d==='*'){const j=s.indexOf('*/',i+2);return j<0?s.length:j+2}
  return -1;
}
// Pula parênteses de SQL embutido, respeitando strings '...' e "...".
function skipParens(s,i){
  let d=0;const n=s.length;
  while(i<n){const c=s[i];
    if(c==="'"||c==='"'){const q=c;i++;while(i<n&&s[i]!==q)i++;i++;continue}
    if(c==='-'&&s[i+1]==='-'){const j=s.indexOf('\n',i);i=j<0?n:j;continue}
    if(c==='(')d++;else if(c===')'){d--;if(d===0)return i+1}
    i++}
  return n;
}
function matchBraceOS(s,i){
  let d=0;const n=s.length;
  while(i<n){const c=s[i];
    if(c==='"'){i=skipStr(s,i);continue}
    const ce=commentEnd(s,i);if(ce>=0){i=ce;continue}
    if(c==='&'&&/^&sql\s*\(/i.test(s.slice(i,i+9))){i=skipParens(s,s.indexOf('(',i));continue}
    if(c==='{')d++;else if(c==='}'){d--;if(d===0)return i}
    i++}
  return n;
}
function matchBracePy(s,i){
  let d=0;const n=s.length;
  while(i<n){const c=s[i];
    if(c==='#'){const j=s.indexOf('\n',i);i=j<0?n:j;continue}
    if(c==='"'||c==="'"){
      const t3=c+c+c;
      if(s.startsWith(t3,i)){const j=s.indexOf(t3,i+3);i=j<0?n:j+3;continue}
      i++;while(i<n&&s[i]!==c&&s[i]!=='\n'){if(s[i]==='\\')i++;i++}i++;continue}
    if(c==='{')d++;else if(c==='}'){d--;if(d===0)return i}
    i++}
  return n;
}
function matchBraceGen(s,i,q){
  let d=0;const n=s.length;
  while(i<n){const c=s[i];
    if(c===q){const j=s.indexOf(q,i+1);if(j<0||s.slice(i,j).includes('\n')){i++;continue}i=j+1;continue}
    if(c==='{')d++;else if(c==='}'){d--;if(d===0)return i}
    i++}
  return n;
}
// Troca o conteúdo de strings e comentários por espaços, mantendo posições e quebras de linha.
function maskOS(s){
  let o='',i=0;const n=s.length;
  while(i<n){const c=s[i];
    if(c==='"'){const j=skipStr(s,i);const term=j-i>=2&&s[j-1]==='"';o+='"'+' '.repeat(Math.max(0,j-i-1-(term?1:0)))+(term?'"':'');i=j;continue}
    const ce=commentEnd(s,i);
    if(ce>=0){o+=s.slice(i,ce).replace(/[^\n]/g,' ');i=ce;continue}
    o+=c;i++}
  return o;
}
function codeEnd(l){let p=0;while(p<l.length){if(l[p]==='"'){p=skipStr(l,p);continue}if(commentEnd(l,p)>=0)return p;p++}return l.length}
// Divide em vírgulas no nível zero de parênteses (texto já mascarado).
function splitTop(s,ch=','){
  const out=[];let d=0,st=0;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(c==='('||c==='{'||c==='[')d++;else if(c===')'||c==='}'||c===']')d--;
    else if(c===ch&&d===0){out.push([st,i]);st=i+1}}
  out.push([st,s.length]);
  return out;
}
function topIndex(s,ch){let d=0;for(let i=0;i<s.length;i++){const c=s[i];if(c==='('||c==='{'||c==='[')d++;else if(c===')'||c==='}'||c===']')d--;else if(c===ch&&d===0)return i}return -1}

        case 'Method':{const kws=[];if(kid(el,'Private')==='1')kws.push('Private');const lg=kid(el,'Language');if(lg)kws.push('Language = '+lg);const cmo=kid(el,'CodeMode');if(cmo)kws.push('CodeMode = '+cmo);const rt=kid(el,'ReturnType');
          u+=d+(kid(el,'ClassMethod')==='1'?'ClassMethod ':'Method ')+n2+'('+spec(kid(el,'FormalSpec'))+')'+(rt?' As '+rt:'')+(kws.length?' [ '+kws.join(', ')+' ]':'')+'\n{\n'+(kid(el,'Implementation')||'').replace(/\r/g,'').replace(/^\n+|\n+$/g,'')+'\n}\n\n';break}
        case 'Property':{const co=kid(el,'Collection');u+=d+'Property '+n2+' As '+(co?co+' Of ':'')+(kid(el,'Type')||'%String')+(kid(el,'Required')==='1'?' [ Required ]':'')+';\n\n';break}
        case 'Parameter':{const df=kid(el,'Default');u+=d+'Parameter '+n2+(df!=null?' = "'+df.replace(/"/g,'""')+'"':'')+';\n\n';break}
        case 'Query':{u+=d+'Query '+n2+'('+spec(kid(el,'FormalSpec'))+') As '+(kid(el,'Type')||'%SQLQuery')+'\n{\n'+(kid(el,'SqlQuery')||'')+'\n}\n\n';break}
        case 'Index':{const p=kid(el,'Properties')||'';u+=d+'Index '+n2+' On '+(p.includes(',')?'('+p+')':p)+';\n\n';break}
        case 'XData':{u+=d+'XData '+n2+'\n{\n'+(kid(el,'Data')||'').replace(/\r/g,'').trim()+'\n}\n\n';break}
        case 'Trigger':{u+=d+'Trigger '+n2+' [ Event = '+(kid(el,'Event')||'INSERT')+', Time = '+(kid(el,'Time')||'AFTER')+' ]\n{\n'+(kid(el,'Code')||'')+'\n}\n\n';break}
        case 'Storage':{u+='Storage '+(n2||'Default')+'\n{\n}\n\n';break}
      }
    }
    out.push({name:nm+'.cls',text:u+'}\n',from:name});
  }
  for(const r of doc.getElementsByTagName('Routine')){
    const nm=r.getAttribute('name');if(!nm)continue;const ty=(r.getAttribute('type')||'MAC').toUpperCase();
    out.push({name:nm+'.'+ty.toLowerCase(),text:'ROUTINE '+nm+' [Type='+ty+']\n'+r.textContent.replace(/\r/g,'').replace(/^\n/,''),from:name});
  }
  return out;
}
function detectKind(name,text){
  const ext=lc(name.split('.').pop());
  if(ext==='xml'||/^\s*(<\?xml|<Export\b)/.test(text))return'xml';
  if(ext==='cls'||/^(?:\s*(?:\/\/.*|Include.*|Import.*|IncludeGenerator.*))*\s*^Class\s+[%\w.]+/m.test(text.slice(0,20000))&&!/^ROUTINE\s/i.test(text))return'cls';
  return'rtn';
}

const RISK_IDS=new Set(['killAll','quitArgTry','quitArgLoop','quitTry','emptyCatch','sqlConcat','hardPwd','statusIgnored','lockNoTimeout','dynCode','debugLeft','halt']);
function normCls(c,unit){
  if(!c)return c;
  if(c.startsWith('%')&&!c.includes('.'))return'%Library.'+c.slice(1);
  if(!c.includes('.')&&unit){
    if(unit.pkg&&S.uIdx.has(lc(unit.pkg+'.'+c)))return unit.pkg+'.'+c;
    for(const im of unit.imports||[])if(S.uIdx.has(lc(im+'.'+c)))return im+'.'+c;
    if(unit.pkg)return unit.pkg+'.'+c;
  }
  return c;
}
function sqlTables(sql){
  const out=[];
  let q=sql.replace(/'(?:[^']|'')*'/g,"''").replace(/--.*$/gm,'');
  const nm='((?:"[^"]+"|[%\\w]+)(?:\\.(?:"[^"]+"|[%\\w]+))?)';
  q=q.replace(new RegExp('\\bDELETE\\s+(?:FROM\\s+)?'+nm,'gi'),(a,t)=>{out.push([t,'DELETE']);return' '});
  q=q.replace(new RegExp('\\bINSERT\\s+(?:OR\\s+UPDATE\\s+)?INTO\\s+'+nm,'gi'),(a,t)=>{out.push([t,'INSERT']);return' '});
  q=q.replace(new RegExp('\\bUPDATE\\s+'+nm,'gi'),(a,t)=>{out.push([t,'UPDATE']);return' '});
  for(const x of q.matchAll(new RegExp('\\b(?:FROM|JOIN)\\s+'+nm,'gi')))out.push([x[1],'SELECT']);
  return out.map(([t,op])=>[t.replace(/"/g,''),op]).filter(([t])=>!/^(SELECT|WITH)$/i.test(t));
}
const SQL_START=/^\s*(SELECT|INSERT|UPDATE|DELETE|CALL|WITH)\b/i;

function analyzeMember(m){
  const u=m.unit,base=m.bodyLine-1;
  const met={lines:0,cc:1,depth:0,stmts:0,sql:0,tstart:0,tcommit:0,trollback:0,hasTry:false,ztrap:false};
  m.metrics=met;
  if(m.body==null)return;
  const flag=(id,line,extra)=>m.flags.push({id,line,extra});
  const texts=m.texts;
  if(m.type==='Query'){
    met.lines=m.body.split('\n').filter(l=>l.trim()).length;
    texts.push({role:'sql',text:m.body,line:m.bodyLine});
  }else if(m.type==='XData'){
    met.lines=m.body.split('\n').filter(l=>l.trim()).length;
    if(lc(m.name)==='urlmap'){
      for(const x of m.body.matchAll(/<Route\b([^>]*)>/gi)){const a=x[1];const g=k=>{const r=new RegExp('\\b'+k+'\\s*=\\s*["\']([^"\']*)["\']','i').exec(a);return r?r[1]:''};
        u.routes.push({url:g('Url'),method:(g('Method')||'GET').toUpperCase(),call:g('Call'),line:m.bodyLine+m.body.slice(0,x.index).split('\n').length-1,member:m})}
      for(const x of m.body.matchAll(/<Map\b([^>]*)>/gi)){const a=x[1];const pf=/Prefix\s*=\s*["']([^"']*)/i.exec(a),fw=/Forward\s*=\s*["']([^"']*)/i.exec(a);if(fw)u.forwards.push({prefix:pf?pf[1]:'',cls:fw[1],line:m.bodyLine+m.body.slice(0,x.index).split('\n').length-1})}
    }
    for(const x of m.body.matchAll(/<call\b[^>]*\btarget\s*=\s*["']([^"']+)["']/gi))u.bplTargets.push({target:x[1],line:m.bodyLine+m.body.slice(0,x.index).split('\n').length-1,member:m});
    for(const x of m.body.matchAll(/<Item\b[^>]*\bName\s*=\s*["']([^"']+)["'][^>]*\bClassName\s*=\s*["']([^"']+)["']/gi))u.prodItems.push({name:x[1],cls:x[2]});
    return;
  }else if(m.type==='Storage'||m.type==='Macro'){
    met.lines=m.body?m.body.split('\n').filter(l=>l.trim()).length:0;return;
  }else if(m.lang==='python'){
    met.lines=m.body.split('\n').filter(l=>l.trim()&&!/^\s*#/.test(l)).length;
    m.body.split('\n').forEach((l,k)=>{for(const x of l.matchAll(/iris\.cls\(\s*['"]([%\w.]+)['"]\s*\)\s*\.\s*(\w+)/g))m.calls.push({cls:normCls(x[1],u),meth:x[2],line:base+k+1})});
    return;
  }else if(!/^(objectscript|cache)$/.test(m.lang)){
    met.lines=m.body.split('\n').filter(l=>l.trim()).length;return;
  }
  const masked=maskOS(m.body);
  met.lines=masked.split('\n').filter(l=>l.trim()).length;
  if(m.codeMode==='expression'){texts.push({role:'expr',text:m.body,line:m.bodyLine});m.ast=[{k:'quit',cmd:'Quit',arg:m.body.trim(),line:1}]}
  else{
    let ast;try{ast=parseBody(m.body)}catch(e){ast=[];m.parseErr=true}
    m.ast=ast;
    const add=(role,text,line)=>{if(text&&text.trim())texts.push({role,text,line:base+line})};
    const walk=(list,ctx)=>{
      for(const st of list){
        met.stmts++;
        if(st.post){met.cc++;add('cond',st.post,st.line)}
        switch(st.k){
          case 'if':st.conds.forEach(c=>{met.cc++;add('cond',c,st.line)});st.bodies.forEach(b=>blk(b,ctx));if(st.els)blk(st.els,ctx);break;
          case 'for':met.cc++;add('for',st.head,st.line);blk(st.body,{...ctx,inner:'loop',anyLoop:true});break;
          case 'while':met.cc++;add('cond',st.cond,st.line);blk(st.body,{...ctx,inner:'loop',anyLoop:true});break;
          case 'dowhile':met.cc++;add('cond',st.cond,st.line);blk(st.body,{...ctx,inner:'loop',anyLoop:true});break;
          case 'dotdo':blk(st.body,{...ctx,inner:'dot'});break;
          case 'try':
            met.hasTry=true;blk(st.body,{...ctx,inner:'try',anyTry:true});
            if(st.cbody){met.cc++;if(!st.cbody.length)flag('emptyCatch',base+(st.cline||st.line));blk(st.cbody,{...ctx,inner:'catch',anyTry:true})}
            break;
          case 'quit':
            add('arg',st.arg,st.line);
            if(st.cmd==='Quit'){
              if(st.arg&&ctx.anyTry)flag('quitArgTry',base+st.line);
              else if(st.arg&&ctx.anyLoop)flag('quitArgLoop',base+st.line);
              else if(!st.arg&&ctx.inner==='try')flag('quitTry',base+st.line);
            }
            break;
          case 'do':add('do',st.arg,st.line);break;
          case 'sql':met.sql++;add('sql',st.inner,st.line);break;
          case 'macro':add('macro',st.text,st.line);break;
          case 'dir':add('dir',st.text,st.line);break;
          case 'raw':add('raw',st.text,st.line);break;
          case 'cmd':{
            const c=st.cmd;add(c.toLowerCase(),st.arg,st.line);
            if(c==='TStart')met.tstart++;else if(c==='TCommit')met.tcommit++;else if(c==='TRollback')met.trollback++;
            else if(c==='Break'||c==='ZWrite'||c==='ZBreak'||c==='ZZDump')flag('debugLeft',base+st.line,c);
            else if(c==='Halt')flag('halt',base+st.line);
            else if(c==='Goto')flag('goto',base+st.line);
            else if(c==='Xecute')flag('dynCode',base+st.line,'Xecute');
            else if(c==='ZTrap')met.ztrap=true;
            break;
          }
        }
      }
    };
    const blk=(b,ctx)=>{const d=ctx.depth+1;if(d>met.depth)met.depth=d;walk(b,{...ctx,depth:d})};
    walk(ast,{depth:0,inner:'',anyLoop:false,anyTry:false});
  }
  // tipos de variáveis
  const vt=new Map();
  m.args.forEach(a=>{if(a.type)vt.set(a.name,normCls(a.type,u))});
  for(const t of texts){
    if(t.role==='dir'){const x=/^#dim\s+([%\w,\s]+?)\s+As\s+(?:(?:list|array)\s+of\s+)?([%\w.]+)/i.exec(t.text);if(x)x[1].split(',').forEach(v=>vt.set(v.trim(),normCls(x[2],u)))}
    if(t.role==='set'){const mk=maskOS(t.text);for(const[a,b]of splitTop(mk)){const seg=t.text.slice(a,b),sm=mk.slice(a,b);const eq=topIndex(sm,'=');if(eq<0)continue;const lhs=seg.slice(0,eq).trim(),rhs=sm.slice(eq+1).trim();
      if(!/^%?\w+$/.test(lhs))continue;
      let x=/^##class\(\s*([%\w.]+)\s*\)\s*\.\s*(%New|%OpenId|%Open)\b/i.exec(rhs);if(x){vt.set(lhs,normCls(x[1],u));continue}
      x=/^\.\.(%New|%OpenId|%Open)\b/i.exec(rhs);if(x&&u.kind==='class')vt.set(lhs,u.name)}}
  }
  m.vt=vt;
  // fatos
  for(const t of texts)factsFrom(m,t,vt);
  // regras do método inteiro
  if(met.sql&&!/SQLCODE/i.test(masked))flag('sqlcode',base+lineIdx(masked,/&sql/i));
  if(met.tstart&&(!met.trollback||(!met.hasTry&&!met.ztrap&&!/\$ZT|\$ET/i.test(masked))))flag('txRisk',base+lineIdx(m.body,/\b(TStart|TS)\b/i));
  if(/\$(ZTRAP|ZT|ETRAP|ET)\b/i.test(masked))flag('legacyErr',base+lineIdx(masked,/\$(ZTRAP|ZT|ETRAP|ET)\b/i));
}
function lineIdx(text,re){const L=text.split('\n');for(let k=0;k<L.length;k++)if(re.test(L[k]))return k+1;return 1}

function factsFrom(m,t,vt){
  const u=m.unit,raw=t.text,mk=t.role==='sql'?raw:maskOS(raw),line=t.line,role=t.role;
  const argStarts=new Set();
  if(role==='do'||role==='job')for(const[a]of splitTop(mk)){let p=a;while(mk[p]===' '||mk[p]==='\t')p++;argStarts.add(p)}
  const viaDo=idx=>(role==='do')&&argStarts.has(idx);
  if(role==='sql'){
    for(const[tb,op]of sqlTables(raw))m.tables.push({name:tb,op,line,kind:m.type==='Query'?'query':'emb'});
    return;
  }
  // chamadas de classe
  for(const x of mk.matchAll(/##class\(\s*([%\w.]+)\s*\)\s*\.\s*(%?\w+)/gi))m.calls.push({cls:normCls(x[1],u),meth:x[2],line,viaDo:viaDo(x.index)});
  for(const x of mk.matchAll(/##super\s*\(/gi))m.calls.push({sup:true,line});
  for(const x of mk.matchAll(/(^|[^\w.%#])\.\.(%?\w+)(\s*\()?/g)){const p=x.index+x[1].length;m.calls.push({local:x[2],paren:!!x[3],line,viaDo:viaDo(p)})}
  for(const x of mk.matchAll(/\$this\.(%?\w+)\s*\(/gi))m.calls.push({local:x[1],paren:true,line});
  for(const x of mk.matchAll(/(^|[^$\w])\$\$(%?\w+)(?:\^(%?[\w.]+))?/g))m.calls.push({label:x[2],rtn:x[3]||null,line});
  for(const x of mk.matchAll(/(^|[^\w.%$#)])(%?[A-Za-z]\w*)\.(%?[A-Za-z]\w*)\s*\(/g)){
    const v=x[2];if(/^\d/.test(v))continue;const p=x.index+x[1].length;
    const cls=vt.get(v);
    m.calls.push({inst:v,meth:x[3],cls:cls||null,line,viaDo:viaDo(p)});
    if(viaDo(p)&&/^%(Save|Delete|DeleteId|DeleteExtent|KillExtent|ValidateObject)$/i.test(x[3]))m.flags.push({id:'statusIgnored',line,extra:v+'.'+x[3]+'()'});
  }
  if(role==='do'||role==='job'){
    for(const[a,b]of splitTop(mk)){
      let arg=raw.slice(a,b).trim();const am=mk.slice(a,b).trim();
      const pc=topIndex(am,':');if(pc>=0&&!/^\(/.test(am))arg=arg.slice(0,pc);
      if(/^(\.\.|##|\$|\.)/.test(arg)||/^[%\w]+\.[%\w]/.test(arg))continue;
      const x=/^(%?[A-Za-z0-9]+)?(?:\^(%?[\w.]+))?\s*(?:\(|$)/.exec(arg);
      if(x&&(x[1]||x[2]))m.calls.push({label:x[1]||null,rtn:x[2]||null,line,job:role==='job',doLabel:true});
    }
    for(const x of mk.matchAll(/(^|[^\w])\.\.%(Save|Delete)\s*\(/g))if(viaDo(x.index+x[1].length))m.flags.push({id:'statusIgnored',line,extra:'..%'+x[2]+'()'});
  }
  // globais
  const gl=(seg,segRaw,off,acc)=>{
    for(const x of seg.matchAll(/(^|[^\w$^|"])\^(\|\|)?(%?[A-Za-z][\w.]*)(\s*\()?/g)){
      const p=off+x.index+x[1].length;
      if((role==='do'||role==='job')&&argStarts.has(p))continue;
      const name=(x[2]?'||':'')+x[3];
      let a=acc;
      const before=seg.slice(Math.max(0,x.index-14),x.index+x[1].length);
      if(/\$I(?:NCREMENT)?\(\s*$/i.test(before))a='W';
      m.globals.push({name,acc:a,line,sub:!!x[4]});
      if(role==='kill'&&!x[4]&&!x[2])m.flags.push({id:'killAll',line,extra:'^'+name});
    }
  };
  if(role==='set'||role==='merge'){
    for(const[a,b]of splitTop(mk)){const sm=mk.slice(a,b);const eq=topIndex(sm,'=');if(eq<0){gl(sm,raw,a,'R');continue}gl(sm.slice(0,eq),raw,a,'W');gl(sm.slice(eq+1),raw,a+eq+1,'R')}
  }else gl(mk,raw,0,role==='kill'?'K':role==='lock'?'L':'R');
  if(role==='lock'){
    for(const[a,b]of splitTop(mk)){const sm=mk.slice(a,b).trim();if(!sm||sm[0]==='-')continue;if(topIndex(sm,':')<0)m.flags.push({id:'lockNoTimeout',line,extra:raw.slice(a,b).trim()})}
  }
  // SQL dinâmico
  const lits=strLits(raw);
  for(const l of lits){
    if(SQL_START.test(l))for(const[tb,op]of sqlTables(l))m.tables.push({name:tb,op,line,kind:'dyn'});
    if(/^(https?:\/\/\S+|(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?|[A-Za-z]:\\.*|\/(?:home|tmp|usr|opt|var|data|mnt|Users)\/.*)$/.test(l.trim()))m.flags.push({id:'hardcoded',line,extra:clip(l.trim(),60)});
  }
  if(lits.some(l=>SQL_START.test(l))&&/_\s*[%\w$.(]|[\w)]\s*_(?!\w)/.test(mk.replace(/"[^"]*"/g,'""')))m.flags.push({id:'sqlConcat',line});
  for(const x of mk.matchAll(/%(Prepare|ExecDirect)\s*\(/g)){const arg=mk.slice(x.index);const e=skipParens(arg,arg.indexOf('('));const inner=arg.slice(arg.indexOf('(')+1,e-1);if(/"\s*_|_\s*"/.test(inner))m.flags.push({id:'sqlConcat',line})}
  // mensagens de interoperabilidade
  for(const x of raw.matchAll(/\.SendRequest(?:Sync|Async)\(\s*"([^"]+)"/gi))m.msgs.push({target:x[1],line});
  // segurança e práticas
  if(role==='set'){const x=/(?:^|[\s,.(])(\w*(?:password|passwd|pwd|senha|secret|apikey|api_key|token|credential)\w*)\s*=\s*"([^"]{3,})"/i.exec(raw);if(x)m.flags.push({id:'hardPwd',line,extra:x[1]})}
  if(/\$X(?:ECUTE)?\s*\(/i.test(mk))m.flags.push({id:'dynCode',line,extra:'$Xecute'});
  if(/(^|[^\w"@])@(?=[%\w(])/.test(mk))m.flags.push({id:'dynCode',line,extra:'@'});
  if(/%(?:Library\.)?ResultSet\b/.test(mk))m.flags.push({id:'deprecatedRS',line});
}

// Resolve as chamadas para membros carregados ou para nós externos.
function findMember(u,name,seen=new Set()){
  if(!u||seen.has(u.name))return null;seen.add(u.name);
  const m=u.members.find(x=>x.name===name&&x.isMethod)||u.members.find(x=>lc(x.name)===lc(name)&&x.isMethod);
  if(m)return m;
  for(const e of u.ext){const su=S.uIdx.get(lc(normCls(e,u)));const r=findMember(su,name,seen);if(r)return r}
  return null;
}
function resolveAll(){
  for(const m of S.members){
    const u=m.unit,edges=new Map();
    const push=(to,kind,line,label,target)=>{const k=to+'|'+kind;const e=edges.get(k)||{to,kind,n:0,lines:[],label,target};e.n++;e.lines.push(line);edges.set(k,e);return e};
    for(const c of m.calls){
      if(c.sup)continue;
      let cls=c.cls,meth=c.meth;
      if(c.local!=null){
        const t=findMember(u,c.local);
        if(t){if(c.paren||t.isMethod){push(t.key,'call',c.line,t.name,t);if(c.viaDo&&/^%(Library\.)?Status$/i.test(t.ret))m.flags.push({id:'statusIgnored',line:c.line,extra:'..'+t.name+'()'})}}
        else if(c.paren&&u.kind==='class'){const sup=u.ext[0]?normCls(u.ext[0],u):'';if(sup&&!S.uIdx.has(lc(sup)))push('X:'+sup,'ext',c.line,sup+'.'+c.local)}
        continue;
      }
      if(c.label!==undefined&&c.label!==null||c.rtn){
        if(c.rtn){const ru=S.uIdx.get(lc(c.rtn));
          if(ru&&ru.kind==='routine'){const t=c.label?ru.members.find(x=>x.name.split('(')[0]===c.label):ru.members[0];if(t)push(t.key,c.job?'job':'call',c.line,t.name,t);else push('U:'+ru.name,'call',c.line,ru.name)}
          else push('R:'+c.rtn,'ext',c.line,(c.label||'')+'^'+c.rtn);
        }else if(u.kind==='routine'){const t=u.members.find(x=>x.name.split('(')[0]===c.label);if(t&&t!==m)push(t.key,c.job?'job':'call',c.line,t.name,t);else if(t===m)push(t.key,'call',c.line,t.name,t)}
        continue;
      }
      if(c.inst&&!cls)continue;
      if(!cls)continue;
      const tu=S.uIdx.get(lc(cls));
      if(tu){const t=findMember(tu,meth);if(t){push(t.key,'call',c.line,t.name,t);if(c.viaDo&&/^%(Library\.)?Status$/i.test(t.ret))m.flags.push({id:'statusIgnored',line:c.line,extra:t.unit.short+'.'+t.name+'()'})}else push('U:'+tu.name,'call',c.line,tu.name)}
      else push('X:'+cls,'ext',c.line,cls+'.'+meth);
    }
    m.edges=[...edges.values()];
    for(const e of m.edges)if(e.target&&e.target!==m)e.target.calledBy.push({from:m,n:e.n,lines:e.lines});
  }
  // rotas REST chamam métodos
  for(const u of S.units)for(const r of u.routes){const t=findMember(u,r.call);r.target=t||null;if(t)t.routed=(t.routed||0)+1}
  // itens da produção: nome de configuração → classe
  S.prod=new Map();for(const u of S.units)for(const it of u.prodItems)S.prod.set(it.name,it.cls);
}
function msgTargetUnit(name){const c=S.prod.get(name)||name;return S.uIdx.get(lc(c))||null}

const ROLES=[['%CSP.REST','REST','b-ok'],['Ens.BusinessService','Business Service','b-pink'],['Ens.BusinessProcessBPL','Business Process','b-pink'],['Ens.BusinessProcess','Business Process','b-pink'],['Ens.BusinessOperation','Business Operation','b-pink'],['Ens.Production','Production','b-pink'],['Ens.Request','Message','b-orange'],['Ens.Response','Message','b-orange'],['%UnitTest.TestCase','Unit Test','b-violet'],['%Persistent','Persistent','b-teal'],['%SerialObject','Serial','b-teal'],['%CSP.Page','CSP','b-info'],['%ZEN.Component.page','ZEN','b-info'],['%RegisteredObject','Object','']];
function unitRole(u,seen=new Set()){
  if(u.kind==='routine')return['Routine '+(u.rtype||''),'b-violet'];
  if(u.kind==='include')return['Include',''];
  if(seen.has(u.name))return null;seen.add(u.name);

const SEV={killAll:'crit',quitArgTry:'crit',sqlConcat:'crit',hardPwd:'crit',
  statusIgnored:'warn',sqlcode:'warn',emptyCatch:'warn',quitTry:'warn',quitArgLoop:'warn',txRisk:'warn',lockNoTimeout:'warn',dynCode:'warn',debugLeft:'warn',halt:'warn',highCC:'warn',longMethod:'warn',deepNest:'warn',
  deprecatedRS:'info',legacyErr:'info',goto:'info',unusedPrivate:'info',noDoc:'info',hardcoded:'info',globalDirect:'info',recursion:'info',parseErr:'info'};
const TH={cc:10,lines:60,depth:4};
function buildInsights(){
  const R=new Map();
  const add=(id,m,line,extra)=>{let r=R.get(id);if(!r){r={id,sev:SEV[id],items:[]};R.set(id,r)}if(r.items.some(x=>x.m===m&&x.line===line&&x.extra===extra))return;r.items.push({m,line,extra})};
  for(const m of S.members){
    for(const f of m.flags)add(f.id,m,f.line,f.extra);
    const t=m.metrics;if(!t)continue;
    if(m.isMethod&&m.ast){
      if(t.cc>TH.cc)add('highCC',m,m.line,t.cc);
      if(t.lines>TH.lines)add('longMethod',m,m.line,t.lines);
      if(t.depth>TH.depth)add('deepNest',m,m.line,t.depth);
    }
    if(m.parseErr)add('parseErr',m,m.line);
    if(m.isMethod&&m.private&&m.type!=='Label'&&!m.calledBy.length&&!m.routed)add('unusedPrivate',m,m.line);
    if(m.type==='Label'&&m.private&&!m.calledBy.length)add('unusedPrivate',m,m.line);
    if(m.edges.some(e=>e.target===m))add('recursion',m,m.edges.find(e=>e.target===m).lines[0]);
    if(m.unit.kind==='class'&&m.globals.length)add('globalDirect',m,m.globals[0].line,[...new Set(m.globals.map(g=>'^'+g.name))].slice(0,4).join(', '));
  }
  const meths=S.members.filter(m=>m.unit.kind==='class'&&m.isMethod&&m.type!=='Trigger');
  const undoc=meths.filter(m=>!m.doc);
  if(undoc.length)undoc.forEach(m=>add('noDoc',m,m.line));
  S.docCov=meths.length?(meths.length-undoc.length)/meths.length:null;
  const order={crit:0,warn:1,info:2};
  S.ins=[...R.values()].sort((a,b)=>order[a.sev]-order[b.sev]||b.items.length-a.items.length);
  for(const r of S.ins)r.items.sort((a,b)=>a.m.file.name.localeCompare(b.m.file.name)||a.line-b.line);
  const CHECKS=['killAll','quitArgTry','sqlConcat','hardPwd','statusIgnored','sqlcode','emptyCatch','quitTry','quitArgLoop','txRisk','lockNoTimeout','dynCode','debugLeft','halt','highCC','deepNest','deprecatedRS'];
  S.passed=CHECKS.filter(id=>!R.has(id));
}

function analyzeSources(srcs){
  S.files=[];S.units=[];S.members=[];S.uIdx=new Map();S.mIdx=new Map();S.errors=[];
  for(const src of srcs){
    const text=src.text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
    const kind=detectKind(src.name,text);
    if(kind==='xml'){
      try{const subs=xmlToSources(src.name,text);if(!subs.length)S.errors.push(src.name);subs.forEach(x=>S.files.push({name:x.name,text:x.text,from:x.from,kind:detectKind(x.name,x.text)}))}
      catch(e){S.errors.push(src.name)}
      continue;
    }
    S.files.push({name:src.name,text,kind});
  }
  for(const f of S.files){
    f.ls=lineStarts(f.text);f.lines=f.text.split('\n');
    let us=[];
    try{us=f.kind==='cls'?parseClassText(f):parseRoutineText(f)}catch(e){us=[]}
    if(!us.length)S.errors.push(f.name);
    f.units=us;
    for(const u of us){S.units.push(u);S.uIdx.set(lc(u.name),u)}
  }
  for(const u of S.units)for(const m of u.members){S.members.push(m);S.mIdx.set(m.key,m)}
  for(const m of S.members){try{analyzeMember(m)}catch(e){m.parseErr=true;m.metrics=m.metrics||{lines:0,cc:1,depth:0}}}
  // segunda passada: tipos de variáveis dependem do índice de classes, já completo
  resolveAll();
  buildInsights();
  for(const u of S.units)u.role=unitRole(u);
  // dados agregados
  S.tables=new Map();S.globals=new Map();S.msgs=[];S.routes=[];
  const sqlName=u=>(u.pkg.replace(/\./g,'_')+'.'+u.short).toLowerCase();
  const clsBySql=new Map();for(const u of S.units)if(u.kind==='class'){const k=/SqlTableName\s*=\s*"?(\w+)/i.exec(u.kw);clsBySql.set(sqlName(u),u);if(k)clsBySql.set((u.pkg.replace(/\./g,'_')+'.'+k[1]).toLowerCase(),u)}
  for(const m of S.members){
    for(const tb of m.tables){const k=lc(tb.name);let e=S.tables.get(k);if(!e){e={name:tb.name,ops:new Set(),refs:[],cls:clsBySql.get(k)||null};S.tables.set(k,e)}e.ops.add(tb.op);e.refs.push({m,line:tb.line,kind:tb.kind})}
    for(const g of m.globals){const k=g.name;let e=S.globals.get(k);if(!e){e={name:g.name,acc:new Set(),refs:[]};S.globals.set(k,e)}e.acc.add(g.acc);e.refs.push({m,line:g.line,acc:g.acc})}
    for(const x of m.msgs)S.msgs.push({m,target:x.target,line:x.line,unit:msgTargetUnit(x.target)});
  }
  for(const u of S.units){for(const b of u.bplTargets)S.msgs.push({m:b.member,target:b.target,line:b.line,unit:msgTargetUnit(b.target)});for(const r of u.routes)S.routes.push({u,...r})}
}

function wrap(s,n,max){
  const words=s.split(/\s+/).filter(Boolean),out=[];let cur='';
  for(const w of words){if(cur&&(cur+' '+w).length>n){out.push(cur);cur=w}else cur=cur?cur+' '+w:w}
  if(cur)out.push(cur);
  if(out.length>max){const r=out.slice(0,max);r[max-1]=clip(r[max-1]+' '+out.slice(max).join(' '),n+4);return r}
  return out.map(x=>clip(x,n+8));
}

    if(e.key==='ArrowDown'){e.preventDefault();cur=Math.min(res.length-1,cur+1);show()}
    else if(e.key==='ArrowUp'){e.preventDefault();cur=Math.max(0,cur-1);show()}
    else if(e.key==='Enter'){if(res.length)pick(res[Math.max(0,cur)])}
    else if(e.key==='Escape')close();
  });
  inp.addEventListener('blur',()=>setTimeout(close,150));
})();

{
    Set total = 0
    For i=1:1:..Items.Count() {

        Set total = total + (item.Quantity * item.Price)
    }

/// Marks the order as paid and records the payment.
ClassMethod Pay(orderId As %String, amount As %Numeric) As %Status
{
    Set sc = $$$OK
    Try {
        Set order = ..%OpenId(orderId,,.sc)
        $$$ThrowOnError(sc)
        If order.Status '= "NEW" {

        }
        TStart

        Do order.%Save()
        &sql(INSERT INTO Demo_Orders.Payment (OrderId, Amount) VALUES (:orderId, :amount))

    }

    Set result = []

    While rs.%Next() {

}

ClassMethod Purge(days As %Integer = 30) As %Status
