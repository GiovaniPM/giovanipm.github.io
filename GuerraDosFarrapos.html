<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Guerra dos Farrapos · Giovani Perotto Mesquita</title>
<meta name="description" content="Guerra dos Farrapos: jogo de estratégia e conquista de territórios no mapa do Rio Grande do Sul da Revolução Farroupilha, com objetivos secretos, dados e cartas. Contra o computador ou entre amigos, em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#2A2216">
<style>
  :root {
    --bg: #2A2216; --bg-2: #3A2F1F; --panel: #FBF5EA; --panel-2: #F1E6D2; --ink: #2A1E18; --muted: #6F5F50; --line: #DFCDB1;
    --accent: #9B1C1C; --accent-ink: #FFFFFF; --green: #1F6B3A; --gold: #E8B23E; --ok: #1F7A4D;
    --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif; --serif: Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: #241F18; --panel-2: #322A20; --ink: #F2EEE4; --muted: #B8AC98; --line: #4A3F30; --accent: #E0574A; --accent-ink: #1A0E08; --ok: #5CC490; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --panel: #241F18; --panel-2: #322A20; --ink: #F2EEE4; --muted: #B8AC98; --line: #4A3F30; --accent: #E0574A; --accent-ink: #1A0E08; --ok: #5CC490; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100dvh; }
  .stage { display: flex; flex-direction: column; align-items: center; min-width: 0; min-height: 0; padding: 8px; gap: 6px; }
  .mapbox { position: relative; width: min(100%, calc((100dvh - 56px) * 896 / 756)); border-radius: 14px; overflow: hidden; border: 4px solid #5A4128; box-shadow: 0 10px 30px rgba(0,0,0,.4); background: #E6DCC4; }
  #map { display: block; width: 100%; height: auto; aspect-ratio: 896 / 756; touch-action: manipulation; cursor: pointer; }
  .hover { width: min(100%, calc((100dvh - 56px) * 896 / 756)); min-height: 1.6em; color: #F4ECDD; font-size: .86rem; padding: 0 .3rem; }
  .hover b { color: var(--gold); }
  .side { display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 8px 0; min-height: 0; overflow: auto; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .75rem; }
  .side > .box, .side > .bar { flex-shrink: 0; }
  .side > .log { flex-shrink: 1; }
  .action { min-height: 120px; }
  .action h2 { font-family: var(--serif); font-size: 1.08rem; line-height: 1.2; margin: 0 0 .3rem; display: flex; align-items: center; gap: .4rem; }
  .action p { margin: 0 0 .45rem; font-size: .87rem; line-height: 1.35; color: var(--muted); }
  .action p.warn { color: var(--accent); font-weight: 700; }
  .pools { display: flex; flex-wrap: wrap; gap: .3rem; margin: 0 0 .45rem; }
  .pools span { background: var(--panel-2); border-radius: 99px; padding: .12rem .55rem; font-size: .8rem; font-weight: 700; }
  .btns { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .3rem; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: .48rem .72rem; font-weight: 700; font-size: .9rem; min-height: 40px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.sm { padding: .3rem .55rem; font-size: .8rem; min-height: 32px; }
  .chips { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin: .1rem 0 .35rem; }
  .chips button { border: 0; background: var(--panel-2); padding: .3rem .65rem; font-weight: 700; font-size: .82rem; min-height: 32px; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .dice { display: grid; gap: .3rem; margin: .2rem 0 .45rem; font-size: .8rem; }
  .dice .dr { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
  .dice .dr > span:first-child { min-width: 0; flex: 1 1 100%; color: var(--muted); }
  .die { width: 30px; height: 30px; }
  .die.lost { opacity: .4; }
  .plist { display: grid; gap: .2rem; font-size: .86rem; }
  .prow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto auto; gap: .45rem; align-items: center; padding: .16rem .3rem; border-radius: 7px; }
  .prow.on { background: var(--panel-2); font-weight: 700; }
  .prow.dead { opacity: .5; text-decoration: line-through; }
  .prow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow small { color: var(--muted); font-weight: 400; }
  .prow .num { font-variant-numeric: tabular-nums; text-align: right; min-width: 2.2em; }
  .phead { font-size: .7rem; color: var(--muted); }
  .rlist { display: grid; gap: .15rem; font-size: .82rem; }
  .rrow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: .45rem; align-items: center; }
  .rrow i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid #3B2A1A; }
  .rrow .own { font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: .2rem; }
  .boxh { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .3rem; font-weight: 700; }
  .log { min-height: 80px; max-height: 220px; overflow: auto; font-size: .82rem; line-height: 1.35; flex: 1; }
  .log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .22rem; }
  .log li { color: var(--muted); }
  .log li:last-child { color: var(--ink); font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: .35rem; }
  .sym { width: 20px; height: 20px; display: block; }

  /* telas */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; overflow: auto; z-index: 20; background: radial-gradient(ellipse at top, #4A3A24 0%, var(--bg) 70%); }
  .sheet, dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 1.2rem clamp(1rem, 4vw, 1.8rem); box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  .sheet { width: min(100%, 720px); }
  dialog { width: min(94vw, 700px); max-height: 90dvh; overflow: auto; }
  dialog::backdrop { background: rgba(14, 10, 4, .65); }
  .back { font-size: .85rem; color: var(--accent); text-decoration: none; }
  .hero { display: flex; justify-content: center; padding: .6rem 0 .2rem; }
  .hero svg { width: min(260px, 60vw); height: auto; }
  .sheet h1 { font-family: var(--serif); font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin: .2rem 0 .3rem; text-align: center; }
  .tag { font-family: var(--serif); font-size: 1.08rem; color: var(--accent); margin: 0 0 .4rem; font-weight: 600; text-align: center; }
  .sheet p { line-height: 1.45; margin: .3rem 0; font-size: .95rem; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .8rem; align-items: end; }
  .field { display: grid; gap: .2rem; font-size: .8rem; color: var(--muted); }
  select, input[type="text"] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .5rem; color: var(--ink); min-height: 38px; max-width: 100%; }
  .seats { display: grid; gap: .35rem; margin-top: .8rem; }
  .seat { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 200px); gap: .5rem; align-items: center; }
  .seat input { width: 100%; }
  .seat select { font-size: .86rem; }
  .seat.off input { opacity: .5; }
  dialog h2 { font-family: var(--serif); margin: 0 0 .6rem; font-size: 1.4rem; }
  dialog h3 { font-size: 1rem; margin: 1rem 0 .35rem; }
  dialog a { color: var(--accent); }
  dialog p, dialog li { line-height: 1.45; font-size: .93rem; }
  .rules { padding-left: 1.1rem; margin: 0; display: grid; gap: .4rem; }
  .cards { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
  .card { width: 104px; border: 2px solid var(--line); border-radius: 10px; background: #FFFDF6; color: #2A1E18; padding: .4rem .3rem; display: grid; justify-items: center; gap: .2rem; font-size: .76rem; text-align: center; line-height: 1.15; }
  .card svg { width: 52px; height: 52px; }
  .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--gold); }
  .card small { color: #6F5F50; }
  .card .mine { color: #1F7A4D; font-weight: 700; }
  .objbox { display: flex; gap: .5rem; align-items: flex-start; background: var(--panel-2); border-radius: 10px; padding: .7rem .8rem; font-size: 1rem; line-height: 1.45; font-weight: 600; }
  .sumline { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: .5rem; padding: .35rem .45rem; background: var(--panel-2); border-radius: 7px; font-size: .9rem; margin-bottom: .3rem; align-items: start; }
  .sumline small { display: block; color: var(--muted); }
  .toast { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); background: var(--panel); color: var(--ink); border: 2px solid var(--gold); border-radius: 12px; padding: .6rem 1rem; font-weight: 700; z-index: 40; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: 90vw; text-align: center; pointer-events: none; }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 100dvh; }
    .stage { padding: 4px; }
    .mapbox, .hover { width: 100%; }
    .mapbox { overflow-x: auto; overscroll-behavior-x: contain; }
    #map { width: max(100%, 700px); max-width: none; }
    .side { padding: 0 4px 12px; overflow: visible; }
    .log { max-height: 180px; }
  }
  @media (max-width: 480px) { .seat { grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1.25fr); } .prow { gap: .3rem; } }

  /* tela de vitória: lanceiro na coxilha e bandeira subindo no mastro da estância */
  #dVic { width: min(94vw, 560px); text-align: center; }
  #dVic h2 { font-size: clamp(1.3rem, 5vw, 1.7rem); margin: 0 0 .2rem; }
  #dVic .flav { color: var(--muted); margin: .3rem 0 .6rem; font-style: italic; }
  .vicart { width: 100%; height: auto; border-radius: 12px; display: block; border: 1px solid var(--line); }
  .vicart .rider { transform: translate(178px, 150px); animation: vicRide 1.7s cubic-bezier(.2,.7,.3,1) both; }
  .vicart .bob { animation: vicBob .28s ease-in-out 6 alternate; }
  .vicart .leg { transform-box: fill-box; transform-origin: 50% 0; animation: vicLeg .28s ease-in-out 6 alternate; }
  .vicart .leg.b { animation-direction: alternate-reverse; }
  .vicart .flag { animation: vicFlag 1.1s ease-out 1.3s both; }
  .vicart .cloth { transform-box: fill-box; transform-origin: 0 50%; animation: vicWave 1.2s ease-in-out 2.2s infinite alternate; }
  .vicart .sun { animation: vicSun 2.2s ease-out both; }
  .vicart .dust { animation: vicDust 1.6s ease-out both; }
  @keyframes vicRide { from { transform: translate(-90px, 150px); } to { transform: translate(178px, 150px); } }
  @keyframes vicBob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  @keyframes vicLeg { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  @keyframes vicFlag { from { transform: translateY(64px); } to { transform: translateY(0); } }
  @keyframes vicWave { from { transform: skewY(-4deg) scaleX(1); } to { transform: skewY(4deg) scaleX(.94); } }
  @keyframes vicSun { from { transform: translateY(40px); opacity: .3; } to { transform: translateY(0); opacity: 1; } }
  @keyframes vicDust { from { opacity: .7; transform: translateX(0); } to { opacity: 0; transform: translateX(-60px); } }
  .occ { background: var(--panel-2); border-radius: 12px; padding: .7rem .8rem; margin-top: .4rem; text-align: left; }
  .occ label { font-weight: 700; display: block; margin-bottom: .35rem; }
  .occrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: .5rem; align-items: center; }
  .occrow input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }
  .occrow button { min-height: 44px; font-size: 1.3rem; padding: 0; }
  .occsum { display: flex; justify-content: space-between; gap: .6rem; flex-wrap: wrap; margin-top: .45rem; font-size: .9rem; }
  .occsum b { font-size: 1.15rem; }
  .occq { display: flex; gap: .35rem; justify-content: center; margin-top: .45rem; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) { .vicart * { animation: none !important; } }
  @media print { .bar, .action { display: none; } }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <main class="stage">
    <div class="mapbox"><canvas id="map" width="896" height="756" tabindex="0" role="application"></canvas></div>
    <div class="hover" id="hover" aria-live="polite"></div>
  </main>
  <aside class="side">
    <section class="box action" id="action" aria-live="polite"></section>
    <section class="box"><p class="boxh" data-t="armies"></p><div class="plist" id="plist"></div></section>
    <section class="box"><p class="boxh" data-t="regions"></p><div class="rlist" id="rlist"></div></section>
    <section class="box log" id="logBox"><ol id="log"></ol></section>
    <div class="bar">
      <button type="button" class="btn sm" id="bObj" data-t="objective"></button>
      <button type="button" class="btn sm" id="bCards"></button>
      <button type="button" class="btn sm" id="bRules" data-t="rules"></button>
      <button type="button" class="btn sm" id="bSound"></button>
      <button type="button" class="btn sm" id="bSpeed"></button>
      <button type="button" class="btn sm" id="bTheme"></button>
      <button type="button" class="btn sm" id="bMenu" data-t="menu"></button>
    </div>
  </aside>
</div>

<section class="overlay" id="ovTitle" aria-labelledby="ttl">
  <div class="sheet">
    <a class="back" id="backLink" href="projects.html" data-t="back"></a>
    <div class="hero" id="heroArt" aria-hidden="true"></div>
    <h1 id="ttl">Guerra dos Farrapos</h1>
    <p class="tag" data-t="tagline"></p>
    <p data-t="story"></p>
    <div class="seats" id="seats"></div>
    <div class="row">
      <label class="field"><span data-t="mode"></span>
        <select id="modeSel"><option value="obj" data-t="modeObj"></option><option value="all" data-t="modeAll"></option></select></label>
      <label class="field"><span data-t="lang"></span>
        <select id="langSel"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
    </div>
    <p id="seatMsg" class="warn" role="alert"></p>
    <div class="row">
      <button type="button" class="btn pri" id="bPlay" data-t="play"></button>
      <button type="button" class="btn" id="bResume" data-t="resume" hidden></button>
      <button type="button" class="btn" id="bRules2" data-t="rules"></button>
      <button type="button" class="btn" id="bTheme2"></button>
    </div>
  </div>
</section>

<section class="overlay" id="ovPass" hidden aria-labelledby="passH">
  <div class="sheet" style="text-align:center">
    <h2 id="passH" style="font-family:var(--serif)"></h2>
    <p data-t="passMsg"></p>
    <div class="row" style="justify-content:center"><button type="button" class="btn pri" id="bPass" data-t="passGo"></button></div>
  </div>
</section>

<dialog id="dRules" aria-labelledby="rulesH"><h2 id="rulesH" data-t="rulesTitle"></h2><div id="rulesBody"></div><div class="row"><button type="button" class="btn pri" id="bRulesClose" data-t="close"></button></div></dialog>
<dialog id="dObj" aria-labelledby="objH"><h2 id="objH" data-t="objTitle"></h2><div id="objBody"></div><div class="row"><button type="button" class="btn pri" id="bObjClose" data-t="close"></button></div></dialog>
<dialog id="dCards" aria-labelledby="cardsH"></dialog>
<dialog id="dEnd" aria-labelledby="endH"></dialog>
<dialog id="dVic" aria-labelledby="vicH"></dialog>

<script>
// Motor da Guerra dos Farrapos: mapa, regras e computador, sem nada de tela. Estado em JSON puro.
function Engine() {
  // ------------------------------------------------------------ mapa
  // Gerado da malha municipal do IBGE: cada território é a união dos municípios atuais mais próximos da cidade que lhe dá nome.
  // Aqui ficam só a posição das fichas e as vizinhanças; os contornos ficam em MAPGEO, na parte da tela.
  const W = 896, H = 756, K = 108, LON0 = -57.95, LAT0 = -27.0, CX = Math.cos(30.5 * Math.PI / 180);
  const pt = ([lo, la]) => [+((lo - LON0) * K * CX).toFixed(1), +((LAT0 - la) * K).toFixed(1)];
  // regiões: [id, bônus]
  const REGIONS = [['mis', 3], ['ser', 3], ['lit', 4], ['cen', 3], ['cam', 4], ['sul', 4]].map(([id, bonus]) => ({ id, bonus }));
  const TERR = [
    ['sborja', 'São Borja', 'mis', 201, 189],
    ['itaqui', 'Itaqui', 'mis', 154.5, 241],
    ['sluiz', 'São Luiz Gonzaga', 'mis', 285, 153.5],
    ['sangelo', 'Santo Ângelo', 'mis', 340.5, 135.5],
    ['cruzalta', 'Cruz Alta', 'mis', 409, 184.5],
    ['altouru', 'Alto Uruguai', 'mis', 425.5, 102],
    ['pfundo', 'Passo Fundo', 'ser', 512, 137.5],
    ['vacaria', 'Vacaria', 'ser', 654.5, 148.5],
    ['cimaserra', 'Cima da Serra', 'ser', 688.5, 238.5],
    ['lages', 'Lages', 'ser', 708.5, 110.5],
    ['laguna', 'Laguna', 'ser', 840.5, 161],
    ['botucarai', 'Botucaraí', 'ser', 504, 199],
    ['poa', 'Porto Alegre', 'lit', 632, 335],
    ['viamao', 'Viamão', 'lit', 669.5, 346.5],
    ['spatrulha', 'Santo Antônio da Patrulha', 'lit', 689.5, 309.5],
    ['torres', 'Torres', 'lit', 751.5, 255.5],
    ['sleopoldo', 'São Leopoldo', 'lit', 635, 293],
    ['triunfo', 'Triunfo', 'lit', 594, 307.5],
    ['mostardas', 'Mostardas', 'lit', 671, 422],
    ['rpardo', 'Rio Pardo', 'cen', 513.5, 327],
    ['cachoeira', 'Cachoeira', 'cen', 462.5, 347],
    ['smaria', 'Santa Maria', 'cen', 384.5, 301.5],
    ['cacapava', 'Caçapava', 'cen', 416.5, 388.5],
    ['encruz', 'Encruzilhada', 'cen', 491.5, 392.5],
    ['alegrete', 'Alegrete', 'cam', 197.5, 299],
    ['uruguaiana', 'Uruguaiana', 'cam', 114, 307.5],
    ['livramento', 'Livramento', 'cam', 223, 401],
    ['rosario', 'Rosário', 'cam', 263.5, 358.5],
    ['sgabriel', 'São Gabriel', 'cam', 334, 357.5],
    ['dpedrito', 'Dom Pedrito', 'cam', 306, 438.5],
    ['bage', 'Bagé', 'cam', 366.5, 458],
    ['pelotas', 'Pelotas', 'sul', 522, 494],
    ['rgrande', 'Rio Grande', 'sul', 516.5, 564],
    ['sjnorte', 'São José do Norte', 'sul', 598, 508],
    ['jaguarao', 'Jaguarão', 'sul', 430, 585],
    ['piratini', 'Piratini', 'sul', 450.5, 480],
    ['cangucu', 'Canguçu', 'sul', 492, 456],
    ['camaqua', 'Camaquã', 'sul', 574, 424],
  ].map(([id, name, reg, x, y]) => ({ id, name, reg, x, y }));
  const IDX = {}; TERR.forEach((t, i) => { IDX[t.id] = i; });
  // ligações pela água: travessia da barra e a rota da lagoa (já incluídas em ADJ)
  const NAVAL = [['rgrande', 'sjnorte'], ['poa', 'rgrande']];
  const CAPITALS = ['piratini', 'cacapava', 'alegrete'];
  const LAGOA = ['poa', 'viamao', 'mostardas', 'sjnorte', 'rgrande', 'pelotas', 'camaqua'];
  const ADJ = [[1,2,24],[0,24,25],[0,3,4,21,24],[2,4,5],[2,3,5,6,11,21],[3,4,6],[4,5,7,9,11],[6,8,9,10,11,16,17],[7,10,14,15,16],[6,7,10],[7,8,9,15],[4,6,7,17,19,20,21],[13,16,17,32],[12,14,16],[8,13,15,16,18],[8,10,14],[7,8,12,13,14,17],[7,11,12,16,19,37],[14,33],[11,17,20,23,37],[11,19,21,22,23],[2,4,11,20,22,24,27,28,30],[20,21,23,30,35],[19,20,22,35,36,37],[0,1,2,21,25,26,27],[1,24],[24,27,29],[21,24,26,28,29],[21,27,29,30],[26,27,28,30],[21,22,28,29,35],[32,34,35,36,37],[12,31,33,34],[18,32],[31,32,35],[22,23,30,31,34,36],[23,31,35,37],[17,19,23,31,36]];
  const adj = (i) => ADJ[i];
  const isAdj = (a, b) => ADJ[a].includes(b);

    pt: `<h3>A história por trás do mapa</h3>
<p>A Revolução Farroupilha, ou Guerra dos Farrapos (1835–1845), opôs rebeldes rio-grandenses ao governo do Império do Brasil. Começou em 20 de setembro de 1835, com a tomada de Porto Alegre. Os imperiais retomaram a cidade em junho de 1836 e a mantiveram até o fim da guerra. Em setembro de 1836 os farrapos proclamaram a República Rio-Grandense, que teve como capitais Piratini, Caçapava e Alegrete. Em julho de 1839 tomaram Laguna, em Santa Catarina, e proclamaram a República Juliana, que os imperiais retomaram no mesmo ano. A guerra terminou com a paz de Ponche Verde, em 1845. Fontes: <a href="${WPT}" target="_blank" rel="noopener">Wikipédia, Revolução Farroupilha</a> e <a href="${WEN}" target="_blank" rel="noopener">Wikipedia, Ragamuffin War</a>.</p>
<p>Este é um jogo de estratégia, não uma reconstituição: os exércitos, as cores e os objetivos são inventados. O mapa é desenhado com as divisas atuais: cada território junta os municípios de hoje mais próximos da cidade que lhe dá nome. Nem todos esses lugares eram vilas em 1835, e as divisas do jogo não são as da época. Dados do mapa: <a href="https://www.ibge.gov.br/geociencias/organizacao-do-territorio/malhas-territoriais.html" target="_blank" rel="noopener">malha municipal do IBGE</a> e <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>.</p>
<h3>Como se joga</h3>
<ol class="rules">
<li><b>Início.</b> Os 38 territórios são sorteados entre os exércitos, com 1 tropa em cada. Cada exército recebe um objetivo secreto. Na primeira rodada ninguém ataca.</li>

    en: `<h3>The history behind the map</h3>
<p>The Ragamuffin War, or Farroupilha Revolution (1835–1845), pitted rebels from Rio Grande do Sul against the government of the Empire of Brazil. It began on 20 September 1835 with the capture of Porto Alegre. Imperial forces took the city back in June 1836 and held it until the end of the war. In September 1836 the rebels proclaimed the Riograndense Republic, whose capitals were Piratini, Caçapava and Alegrete. In July 1839 they took Laguna, in Santa Catarina, and proclaimed the Juliana Republic, which imperial forces retook that same year. The war ended with the peace of Ponche Verde in 1845. Sources: <a href="${WPT}" target="_blank" rel="noopener">Wikipedia (Portuguese), Revolução Farroupilha</a> and <a href="${WEN}" target="_blank" rel="noopener">Wikipedia, Ragamuffin War</a>.</p>
<p>This is a strategy game, not a reenactment: the armies, colours and objectives are made up. The map is drawn with today's borders: each territory groups the present-day municipalities closest to the town it is named after. Not all of these places were towns in 1835, and the game's borders are not those of the time. Map data: <a href="https://www.ibge.gov.br/geociencias/organizacao-do-territorio/malhas-territoriais.html" target="_blank" rel="noopener">IBGE municipal boundaries</a> and <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>.</p>
<h3>How to play</h3>
<ol class="rules">
<li><b>Setup.</b> The 38 territories are dealt among the armies, with 1 troop in each. Each army gets a secret objective. Nobody attacks in the first round.</li>
<li><b>Reinforcements.</b> At the start of your turn you get half your number of territories in troops (at least 3), plus the bonus of every region you fully own. A region bonus can only be placed in that region.</li>
<li><b>Cards.</b> Whoever conquers at least one territory in a turn gets a card. Three cards with the same symbol, or with three different symbols, are worth troops: 4, 6, 8, 10, 12, 15 and then 5 more each trade. The chimarrão gourd counts as any symbol. Each of your territories shown on the traded cards gets 2 extra troops. With 5 cards you must trade.</li>
<li><b>Attack.</b> Attack from one of your territories with 2 or more troops into an enemy neighbour. The attacker rolls up to 3 dice (one troop always stays behind), the defender up to 3. The highest dice are compared in pairs, and ties go to the defender. Each lost pair costs one troop.</li>
<li><b>Conquest.</b> When the defender runs out of troops, the territory is yours: one troop moves in at once, and you may bring more, up to the number of dice of the last attack.</li>
<li><b>Moving troops.</b> At the end of your turn, move troops between neighbouring territories of yours. Each troop moves once per turn, and every territory keeps at least one.</li>
<li><b>Water links.</b> The dashed lines link Rio Grande to São José do Norte, across the sandbar channel, and Porto Alegre to Rio Grande, across the lagoon.</li>
<li><b>Victory.</b> You win by fulfilling your objective on your own turn. If your objective is to destroy an army and another player destroys it first, your objective becomes holding 24 territories. With 2 armies the objectives ask for 6 more territories, and with 3, 2 more. Whoever destroys an army takes its cards.</li>
</ol>
<h3>Controls</h3>
<p>Tap territories on the map. With the keyboard, click the map, pick a territory with the arrow keys and tap it with Enter or Space. Esc clears the choice.</p>
<p>With more than one person on the same device, the screen asks to pass the turn before showing each person's objective and cards.</p>`,
    it: `<h3>La storia dietro la mappa</h3>

    if ($('dVic').open) $('dVic').close();
    if (had) dispatch({ type: 'occupy', k });
  }
  $('dVic').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'bOcc') confirmVictory();
    else if (b.dataset.occd) setOcc(vic.total + +b.dataset.occd);
    else if (b.dataset.occv) setOcc(+b.dataset.occv);
  });
  $('dVic').addEventListener('input', (e) => { if (e.target.id === 'occR') setOcc(+e.target.value); });
  // Esc fecha a tela confirmando a quantidade escolhida
  $('dVic').addEventListener('cancel', (e) => { e.preventDefault(); confirmVictory(); });

  // ---------------------------------------------------------------- fluxo
  const save = () => { if (S) Store.set('farrapos.game', S); };
  const live = () => S && S.phase !== 'over';
  const noHuman = () => !S.players.some((p) => p.kind === 'human' && p.alive);
  async function dispatch(a) {
    if (busy || !S) return false;
    const game = S, before = S.turn;
    if (!E.act(S, a)) return false;
    const list = S.fx.slice(); S.fx = [];
    const dice = list.find((f) => f.t === 'dice');
    if (dice) lastBattle = dice;
    if (a.type === 'endTurn' || a.type === 'endAttack' || a.type === 'toAttack') { sel = null; tgt = null; }
    if (list.some((f) => f.t === 'turn')) { lastBattle = null; sel = null; tgt = null; }
    if (sel != null && S.T[sel].o !== S.turn) sel = null;
    save();
    render();
    for (const f of list) {
      if (f.t === 'dice') sfx(f.conq && !(S.players[f.p].kind === 'human' && myTurn()) ? 'conq' : 'dice');
      else if (f.t === 'place' || f.t === 'move') sfx('place');
      else if (f.t === 'trade') sfx('trade');
      else if (f.t === 'elim') { sfx('elim'); if (S.players[f.q].kind === 'human' && humans().length === 1) toast(t('toastElimMe')); }
      else if (f.t === 'objchg' && S.players[f.p].kind === 'human' && humans().length === 1) toast(t('objChanged', { n: E.need(S, 'n24') }));
      else if (f.t === 'card' && f.p === viewer()) toast(t('toastCard'));
    }
    const wasAI = S.players[before].kind !== 'human';
    if (wasAI && !noHuman() && dice) { busy = true; await delay(reduceMotion ? 120 : (fast ? 260 : 700)); busy = false; }
    if (!$('ovTitle').hidden) return true;
    if (S !== game) return true;
    if (S.phase === 'over') { sfx(S.players[S.winner].kind === 'human' ? 'win' : 'lose'); render(); showEnd(); return true; }
    if (dice && dice.conq && S.players[dice.p].kind === 'human' && myTurn()) { showVictory(dice); return true; }
    checkPass();
    schedule();
    return true;
  }
  function checkPass() {
    if (!S || S.phase === 'over') return;
    const p = S.turn;
    if (S.players[p].kind === 'human' && humans().length > 1 && passShown !== p) {
      $('passH').textContent = turnText(p);
      $('ovPass').hidden = false;
      $('bPass').focus();
    }
  }
  function schedule() {
    clearTimeout(aiTimer);
    if (!S || !live() || !$('ovTitle').hidden || S.players[S.turn].kind === 'human') return;
    const quick = noHuman();
    aiTimer = setTimeout(() => {
      if (!S || !live() || busy || S.players[S.turn].kind === 'human') return;
      const a = E.ai(S);
      if (a) dispatch(a);
    }, reduceMotion || quick ? 30 : (fast ? 90 : 320));
  }
  function blitz() { if (sel != null && tgt != null) dispatch({ type: 'attack', from: sel, to: tgt, blitz: true }); }
  function tapTerr(i) {
    if (i == null || i < 0 || !S || busy || !myTurn()) return;
    const p = S.turn, T = S.T[i];
    if (S.phase === 'place') {
      if (T.o !== p || E.mustTrade(S)) return;
      const av = E.availAt(S, i);
      if (!av) return;
      dispatch({ type: 'place', t: i, k: amt === 'all' ? av : Math.min(amt, av) });
    } else if (S.phase === 'attack' && !S.pending) {
      if (T.o === p) { sel = sel === i ? null : (T.n >= 2 ? i : null); tgt = null; render(); return; }
      if (sel != null && E.isAdj(sel, i)) { tgt = i; dispatch({ type: 'attack', from: sel, to: i }); }
    } else if (S.phase === 'move') {
      if (T.o !== p) return;
      if (sel == null || sel === i) { sel = sel === i ? null : (E.movable(S, i) > 0 ? i : null); render(); return; }
      if (E.isAdj(sel, i)) {
        const m = E.movable(S, sel);
        if (m > 0) { const from = sel; dispatch({ type: 'move', from, to: i, k: amt === 'all' ? m : Math.min(amt, m) }).then(() => { if (S && S.phase === 'move' && E.movable(S, from) <= 0) { sel = null; render(); } }); }
        return;
      }
      sel = E.movable(S, i) > 0 ? i : null; render();
    }
  }

  // ---------------------------------------------------------------- som
  let audio = null;
  function tone(f, d, type, v, when) {
    if (!soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const o = audio.createOscillator(), g = audio.createGain(), st = audio.currentTime + (when || 0);
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, st);
      g.gain.setValueAtTime(v || 0.05, st); g.gain.exponentialRampToValueAtTime(0.0001, st + d);
      o.connect(g); g.connect(audio.destination); o.start(st); o.stop(st + d);
    } catch (e) { /* sem áudio */ }
  }
  function sfx(k) {
    if (noHuman() && k !== 'win' && k !== 'lose') return;
    if (k === 'dice') [0, 0.05, 0.1].forEach((w) => tone(180 + Math.random() * 120, 0.04, 'square', 0.025, w));
    else if (k === 'conq') { [0, 0.05].forEach((w) => tone(200, 0.04, 'square', 0.025, w)); tone(660, 0.16, 'triangle', 0.06, 0.12); }
    else if (k === 'place') tone(440, 0.05, 'triangle', 0.035);
    else if (k === 'trade') [523, 659, 784].forEach((f, i) => tone(f, 0.12, 'triangle', 0.05, i * 0.07));
    else if (k === 'elim') [392, 330, 262].forEach((f, i) => tone(f, 0.2, 'sawtooth', 0.03, i * 0.12));
    else if (k === 'bugle') [[392, 0], [523, 0.16], [659, 0.32], [784, 0.48], [659, 0.72], [784, 0.86]].forEach(([f, w], i) => tone(f, i === 5 ? 0.5 : 0.14, 'triangle', 0.06, w));
    else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, i * 0.12));
    else if (k === 'lose') [392, 349, 311, 262].forEach((f, i) => tone(f, 0.26, 'sine', 0.05, i * 0.18));
  }

  // ---------------------------------------------------------------- telas
  const CPU = ['Cel. Antero', 'Maj. Feliciano', 'Gen. Laurindo', 'Cap. Juvêncio', 'Cel. Hilário', 'Ten. Florêncio'];
  const DEFAULT_ROWS = [{ kind: 'human', name: '' }, { kind: 1, name: CPU[0] }, { kind: 1, name: CPU[1] }, { kind: 1, name: CPU[2] }, { kind: 'none', name: CPU[3] }, { kind: 'none', name: CPU[4] }];
  let rows = DEFAULT_ROWS.map((r) => Object.assign({}, r));
  function renderSeats() {
    $('seats').innerHTML = rows.map((r, i) => `<div class="seat${r.kind === 'none' ? ' off' : ''}">${shapeSvg(i, 24)}<input type="text" maxlength="18" data-sn="${i}" value="${esc(r.name)}" placeholder="${esc(r.kind === 'human' ? t('you') : CPU[i])}" aria-label="${esc(t('nameL', { c: cname(i) }))}"><select data-sk="${i}" aria-label="${esc(t('kindL', { c: cname(i) }))}">${[['human', 'human'], ['0', 'easy'], ['1', 'medium'], ['2', 'hard'], ['none', 'none']].map(([v, k]) => `<option value="${v}"${String(r.kind) === v ? ' selected' : ''}>${t(k)}</option>`).join('')}</select></div>`).join('');
  }
  function startGame() {
    const seats = rows.map((r, i) => ({ r, i })).filter((x) => x.r.kind !== 'none');
    if (seats.length < 2) { $('seatMsg').textContent = t('seatMin'); return; }
    $('seatMsg').textContent = '';
    savePref({ rows, mode: $('modeSel').value });
    // a cor segue a linha escolhida
    const players = seats.map(({ r, i }) => ({ name: r.name.trim() || (r.kind === 'human' ? '' : CPU[i]), kind: r.kind === 'human' ? 'human' : +r.kind, color: i }));
    S = E.newGame({ players, opts: { mode: $('modeSel').value }, seed: (Math.random() * 2147483647) | 0 });
    S.players.forEach((p, k) => { p.color = players[k].color; });
    sel = null; tgt = null; lastBattle = null; passShown = -1;
    enter();
  }
  function enter() {
    $('ovTitle').hidden = true; $('app').hidden = false;
    S.fx = []; save(); render();
    const mb = document.querySelector('.mapbox'); mb.scrollLeft = (mb.scrollWidth - mb.clientWidth) / 2;
    if (S.phase === 'over') showEnd(); else { checkPass(); schedule(); }
  }
  function showMenu() {
    clearTimeout(aiTimer);
    if (S) save();
    ['dEnd', 'dCards', 'dObj', 'dVic'].forEach((id) => { if ($(id).open) $(id).close(); }); vic = null;
    $('ovPass').hidden = true;
    $('app').hidden = true; $('ovTitle').hidden = false;
    refreshResume();
  }
  function refreshResume() { const g = Store.get('farrapos.game'); $('bResume').hidden = !(g && g.phase !== 'over' && g.players && g.v === 1); }
  const savePref = (o) => Store.set('farrapos.prefs', Object.assign({}, Store.get('farrapos.prefs') || {}, o));
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
    const label = t(theme === 'light' ? 'themeLight' : theme === 'dark' ? 'themeDark' : 'themeAuto');
    $('bTheme').textContent = label; $('bTheme2').textContent = label;
  }
  function applySoundSpeed() { $('bSound').textContent = t(soundOn ? 'soundOn' : 'soundOff'); $('bSpeed').textContent = t(fast ? 'speedF' : 'speedN'); }
  function heroSvg() {
    const nums = MAPGEO.rs.match(/-?\d+(\.\d+)?/g).map(Number), xs = nums.filter((_, i) => i % 2 === 0), ys = nums.filter((_, i) => i % 2 === 1);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0, X = (k) => x0 + k * w, Y = (k) => y0 + k * h;
    return `<svg viewBox="${x0 - 10} ${y0 - 10} ${w + 20} ${h + 20}"><defs><clipPath id="hc"><path d="${MAPGEO.rs}"/></clipPath></defs><g clip-path="url(#hc)"><rect x="${x0 - 10}" y="${y0 - 10}" width="${w + 20}" height="${h + 20}" fill="#2E7D32"/><path d="M${X(0.95)} ${Y(-0.05)}L${X(1.05)} ${Y(-0.05)}L${X(1.05)} ${Y(0.15)}L${X(0.15)} ${Y(1.05)}L${X(-0.05)} ${Y(1.05)}L${X(-0.05)} ${Y(0.9)}Z" fill="#C62828"/><path d="M${X(0.62)} ${Y(-0.05)}L${X(0.95)} ${Y(-0.05)}L${X(-0.05)} ${Y(0.9)}L${X(-0.05)} ${Y(0.45)}Z" fill="#F2B705"/></g><path d="${MAPGEO.rs}" fill="none" stroke="#FBF5EA" stroke-width="10" stroke-linejoin="round"/></svg>`;
  }
  function applyLang() {
    document.documentElement.lang = TAG[lang];
    document.title = t('title') + ' · Giovani Perotto Mesquita';
    $('ttl').textContent = t('title');
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('rulesBody').innerHTML = RULES[lang];
    $('langSel').value = lang;
    $('backLink').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    $('heroArt').innerHTML = heroSvg();
    renderSeats();
    applySoundSpeed(); applyTheme();
    if (S && !$('app').hidden) { render(); if ($('dEnd').open) showEnd(); if ($('dCards').open) openCards(); if ($('dVic').open && vic) { const v = vic.total; showVictory({ p: S.turn, q: vic.q, from: vic.from, to: vic.to }); setOcc(v); } }
    if (!$('ovPass').hidden && S) $('passH').textContent = turnText(S.turn);
  }

  // ---------------------------------------------------------------- eventos
  cv.addEventListener('click', (e) => { const i = terrAt(e); cursor = null; tapTerr(i); });
  cv.addEventListener('mousemove', (e) => { const i = terrAt(e); if (i !== hover) { hover = i; showHover(i); } });
  cv.addEventListener('mouseleave', () => { hover = null; showHover(cursor); });
  const byName = E.TERR.map((_, i) => i).sort((a, b) => E.TERR[a].name.localeCompare(E.TERR[b].name, 'pt'));
  cv.addEventListener('keydown', (e) => {
    if (!S) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(k)) {
      e.preventDefault();
      const pos = cursor == null ? -1 : byName.indexOf(cursor), step = k === 'ArrowRight' || k === 'ArrowDown' ? 1 : -1;
      cursor = byName[(pos + step + byName.length) % byName.length];
      drawMap(); showHover(cursor);
    } else if ((k === 'Enter' || k === ' ') && cursor != null) { e.preventDefault(); tapTerr(cursor); }
    else if (k === 'Escape') { sel = null; tgt = null; render(); }
  });
  cv.addEventListener('blur', () => { if (cursor != null) { cursor = null; drawMap(); } });
  $('action').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || b.disabled || !S) return;
    if (b.dataset.amt) { amt = b.dataset.amt === 'all' ? 'all' : +b.dataset.amt; renderAction(); return; }
    if (b.dataset.occ != null) { dispatch({ type: 'occupy', k: +b.dataset.occ }); return; }
    const a = b.dataset.a;
    if (a === 'showEnd') showEnd();
    else if (a === 'cards') openCards();
    else if (a === 'toAttack') dispatch({ type: 'toAttack' });
    else if (a === 'endAttack') dispatch({ type: 'endAttack' });
    else if (a === 'endTurn') dispatch({ type: 'endTurn' });
    else if (a === 'again') { if (sel != null && tgt != null) dispatch({ type: 'attack', from: sel, to: tgt }); }
    else if (a === 'blitz') blitz();
  });
  $('dCards').addEventListener('click', (e) => {
    const c = e.target.closest('[data-card]');
    if (c && !c.disabled) { const id = +c.dataset.card; if (pickCards.has(id)) pickCards.delete(id); else if (pickCards.size < 3) pickCards.add(id); openCards(); return; }
    const b = e.target.closest('[data-ca]');
    if (!b || b.disabled) return;
    const k = b.dataset.ca;
    if (k === 'close') $('dCards').close();
    else if (k === 'best') { pickCards.clear(); (E.bestSet(S, viewer()) || []).forEach((x) => pickCards.add(x)); openCards(); }
    else if (k === 'trade') { const set = [...pickCards]; pickCards.clear(); $('dCards').close(); dispatch({ type: 'trade', cards: set }); }
  });
  $('dEnd').addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (!go) return;
    if (go.dataset.go === 'close') $('dEnd').close(); else showMenu();
  });
  $('seats').addEventListener('change', (e) => {
    const s = e.target.closest('[data-sk]');
    if (s) { const i = +s.dataset.sk, v = s.value; rows[i].kind = v === 'human' || v === 'none' ? v : +v; renderSeats(); $('seatMsg').textContent = ''; }
  });
  $('seats').addEventListener('input', (e) => { const n = e.target.closest('[data-sn]'); if (n) rows[+n.dataset.sn].name = n.value; });
  $('bPass').addEventListener('click', () => { passShown = S.turn; $('ovPass').hidden = true; render(); cv.focus({ preventScroll: true }); });
  const openRules = () => { $('dRules').showModal(); $('dRules').scrollTop = 0; };
  const cycleTheme = () => { theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto'; savePref({ theme }); applyTheme(); };
  $('bRules').addEventListener('click', openRules);
  $('bRules2').addEventListener('click', openRules);
  $('bRulesClose').addEventListener('click', () => $('dRules').close());
  $('bObj').addEventListener('click', openObj);
  $('bObjClose').addEventListener('click', () => $('dObj').close());
  $('bCards').addEventListener('click', openCards);
  $('bMenu').addEventListener('click', showMenu);
  $('bPlay').addEventListener('click', startGame);
  $('bResume').addEventListener('click', () => { const g = Store.get('farrapos.game'); if (g && g.phase !== 'over' && g.v === 1) { S = g; sel = null; tgt = null; lastBattle = null; passShown = -1; enter(); } });
  $('bSound').addEventListener('click', () => { soundOn = !soundOn; savePref({ sound: soundOn }); applySoundSpeed(); });
  $('bSpeed').addEventListener('click', () => { fast = !fast; savePref({ fast }); applySoundSpeed(); });
  $('bTheme').addEventListener('click', cycleTheme);
  $('bTheme2').addEventListener('click', cycleTheme);
  $('langSel').addEventListener('change', () => { lang = $('langSel').value; savePref({ lang }); applyLang(); });
  window.addEventListener('resize', () => { if (S && !$('app').hidden) drawMap(); });

  // ---------------------------------------------------------------- início
  const prefs = Store.get('farrapos.prefs') || {};
  const hashLang = location.hash.slice(1), navLang = ((navigator.language || 'pt').slice(0, 2)).toLowerCase();
  lang = LANGS.includes(hashLang) ? hashLang : (LANGS.includes(prefs.lang) ? prefs.lang : (LANGS.includes(navLang) ? navLang : 'pt'));
  soundOn = prefs.sound !== false; fast = !!prefs.fast; theme = ['light', 'dark'].includes(prefs.theme) ? prefs.theme : 'auto';
  if (Array.isArray(prefs.rows) && prefs.rows.length === 6) rows = prefs.rows.map((r, i) => ({ kind: ['human', 'none', 0, 1, 2].includes(r.kind) ? r.kind : DEFAULT_ROWS[i].kind, name: typeof r.name === 'string' ? r.name.slice(0, 18) : '' }));
  $('modeSel').value = prefs.mode === 'all' ? 'all' : 'obj';
  applyLang();
  refreshResume();
  window.__gf = { get S() { return S; }, E, set S(v) { S = v; } };
})();
</script>
