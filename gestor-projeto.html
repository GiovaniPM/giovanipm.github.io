/* ===================== Eventos ===================== */
const ACT={
  go:el=>{UI.view=el.dataset.view;render();},
  task:el=>openTask(el.dataset.id),
  newTask:()=>openTask(null),
  close:()=>closeModal(),
  delTask:el=>{if(!confirm(_t('cf.delTask')))return;S.tasks=S.tasks.filter(t=>t.id!==el.dataset.id);S.tasks.forEach(t=>t.deps=(t.deps||[]).filter(d=>d.id!==el.dataset.id));closeModal();markDirty();render();},
  import:()=>openImport(),
  doImport:()=>doImport(),
  exportMenu:()=>openExportMenu(),
  exportCsv:()=>{closeModal();exportCsv();},
  exportJson:()=>{closeModal();exportJson();},
  exportMspdi:()=>{closeModal();exportMspdi();},
  exportGan:()=>{closeModal();exportGan();},
  importFile:()=>{const f=$('#impFile');f.value='';f.click();},
  extAdd:()=>applyExt('add'),
  extReplace:()=>applyExt('replace'),
  zoom:el=>{UI.zoom=el.dataset.z;render();},
  cfdRange:el=>{UI.cfdRange=el.dataset.r;render();},
  riskCell:el=>{const c=el.dataset.c;UI.riskCell=UI.riskCell===c?null:c;render();const b=document.querySelector(`.rmx [data-c="${c}"]`);if(b)b.focus();},
  riskAll:()=>{UI.riskAll=!UI.riskAll;render();},
  ownerTasks:el=>{UI.f={q:'',status:'',phase:'',owner:el.dataset.o,late:false};UI.view='tasks';render();window.scrollTo(0,0);},
  sample:()=>{S=sampleData();normalize();markDirty();UI.view='overview';render();toast(SP?_t('sm.loadedSP'):_t('sm.loaded'));},
  sampleReplace:()=>{if(!confirm(_t('cf.sample')))return;ACT.sample();},
  reset:()=>{if(!confirm(_t('cf.reset')))return;S=null;markDirty();render();},
  newMeeting:()=>{const last=[...S.meetings].sort((a,b)=>a.date<b.date?1:-1)[0];const m={id:uid(),createdAt:nowLocal(),date:TODAY,title:_t('fu.newTitle',S.meetings.length+1),participants:last?last.participants:'',notes:'',decisions:'',actions:[],updates:[]};S.meetings.push(m);UI.meetingId=m.id;markDirty();render();},
  selMeeting:el=>{UI.meetingId=el.dataset.id;render();},
  delMeeting:()=>{if(!confirm(_t('cf.delMeeting')))return;S.meetings=S.meetings.filter(m=>m.id!==UI.meetingId);UI.meetingId=null;markDirty();render();},
  addAction:()=>{const m=curMeeting();m.actions.push({id:uid(),text:'',owner:'',due:addD(m.date,7),done:false,createdAt:nowLocal()});markDirty();render();const ins=document.querySelectorAll('[data-a="text"]');if(ins.length)ins[ins.length-1].focus();},
  delAction:el=>{const m=curMeeting();m.actions=m.actions.filter(a=>a.id!==el.dataset.id);markDirty();render();},
  ata:()=>openAta(),
  pdf:()=>printReport(),
  copyAta:async()=>{const ta=$('#ataText');try{await navigator.clipboard.writeText(ta.value);toast(_t('at.copied'));}catch(e){ta.select();document.execCommand('copy');toast(_t('at.copied'));}},
  dlAta:()=>{const m=curMeeting();download(`${_t('at.file')}-${m.date}.txt`,$('#ataText').value,'text/plain');},
  spInfo:()=>spBlocked(),
  depAdd:()=>{const c=$('#depRows');c.insertAdjacentHTML('beforeend',depRow(null));c.lastElementChild.querySelector('select').focus();},
  depDel:el=>el.closest('.dep-row').remove(),
  depFit:()=>{const f=$('#taskForm');const st=f.start.value,en=f.end.value;if(!st||!en)return;const cur={start:st,end:en};let need=-Infinity;
    readDepRows().forEach(d=>{const p=tById(d.id);if(p)need=Math.max(need,rq(cur,p,d,p.milestone));});
    if(need===-Infinity){toast(_t('tf.addOne'));return;}
    const dur=dn(en)-dn(st);f.start.value=iso(need);f.end.value=iso(need+dur);toast(_t('tf.fitted',fmt(iso(need))));},
  resched:()=>openReschedule(planReschedule()),
  applyResched:()=>{(MD.resched||[]).forEach(c=>{c.t.start=c.ns;c.t.end=c.ne;});const n=(MD.resched||[]).length;MD.resched=null;closeModal();markDirty();render();toast(_t('rsch.done',_p(n,'task')));},
  spDownload:()=>{if(!S){toast(_t('sp.noData'));return;}S.savedAt=new Date().toISOString();download(slug(S.project.name)+'.html',serialize(),'text/html');closeModal();toast(_t('sp.dlDone'));},
  restore:()=>{S=pendingRestore.data;pendingRestore=null;normalize();dirty=true;$('#dirty').classList.add('on');render();toast(_t('rs.done'));},
  discardRestore:()=>{pendingRestore=null;try{localStorage.removeItem(BK);}catch(e){}render();}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&ACT[el.dataset.act]&&el.type!=='checkbox'){e.preventDefault();ACT[el.dataset.act](el);return;}
  if(e.target.id==='modal')closeModal();
});
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{if(!S)return;UI.view=b.dataset.view;render();window.scrollTo(0,0);}));
$('#saveBtn').addEventListener('click',()=>save(false));
$('#saveAsBtn').addEventListener('click',()=>save(true));
if(!window.showSaveFilePicker||SP)$('#saveAsBtn').style.display='none';
$('#langSel').addEventListener('change',e=>setLang(e.target.value));
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(LANGS.includes(h)&&h!==LANG)setLang(h,true);});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save(false);}if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act][tabindex]')){e.preventDefault();e.target.click();}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

document.addEventListener('submit',e=>{
  if(e.target.id==='newProj'){e.preventDefault();const f=new FormData(e.target);
    if(f.get('end')<f.get('start')){toast(_t('pj.badDates'));return;}
    S={version:1,project:{name:f.get('name').trim(),start:f.get('start'),end:f.get('end'),manager:f.get('manager').trim(),description:''},settings:{wipLimit:5,staleDays:7},tasks:[],meetings:[]};
    normalize();markDirty();UI.view='overview';render();toast(_t('pj.created'));}
  if(e.target.id==='projForm'){e.preventDefault();const f=new FormData(e.target);
    if(f.get('end')<f.get('start')){toast(_t('pj.badDates'));return;}
    Object.assign(S.project,{name:f.get('name').trim(),start:f.get('start'),end:f.get('end'),manager:f.get('manager').trim(),description:f.get('description')});
    S.settings.wipLimit=Math.max(1,+f.get('wipLimit')||5);S.settings.staleDays=Math.max(1,+f.get('staleDays')||7);
    markDirty();render();toast(_t('pj.updated'));}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f==='q'){UI.f.q=el.value;const pos=el.selectionStart;render();const n=document.querySelector('[data-f="q"]');n.focus();n.setSelectionRange(pos,pos);}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f&&el.dataset.f!=='q'){UI.f[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;render();return;}
  if(el.dataset.act==='fuAll'){UI.fuAll=el.checked;render();return;}
  if(el.dataset.act==='toggleDeps'){UI.showDeps=el.checked;render();return;}
  if(el.dataset.act==='toggleCrit'){UI.showCrit=el.checked;render();return;}
  if(el.id==='impFile'){if(el.files[0])importFile(el.files[0]);return;}
  if(el.id==='langSel')return;
  const m=S&&curMeeting();
  if(el.dataset.m&&m){
    if(el.dataset.m==='date'){if(!el.value)return;const old=m.date;m.date=el.value;
      // move registros desta reunião para a nova data
      S.tasks.forEach(t=>{if(m.updates.some(u=>u.taskId===t.id)){const i=t.history.findIndex(h=>h.d===old);if(i>=0&&!t.history.some(h=>h.d===m.date)){t.history[i].d=m.date;t.history.sort(cmpH);const l=t.history[t.history.length-1];t.status=l.s;t.progress=progOf(l);}}});
      markDirty();render();return;}
    m[el.dataset.m]=el.value;m.updatedAt=nowLocal();markDirty();if(el.dataset.m==='title')render();return;
  }
  if(el.dataset.fu&&m){
    const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t)return;
    const tr=el.closest('tr');const s=tr.querySelector('[data-fu="s"]').value,p=+tr.querySelector('[data-fu="p"]').value,n=tr.querySelector('[data-fu="n"]').value.trim();
    let pp=p;if(el.dataset.fu==='s'){if(s==='done')pp=100;else if(s!=='done'&&p===100&&statusAt(t,m.date)?.s==='done')pp=90;}
    if(updateTask(t,{s,p:pp,d:m.date,note:n})){if(!m.updates.some(u=>u.taskId===t.id))m.updates.push({taskId:t.id});markDirty();}
    if(el.dataset.fu!=='n')render();else updateHeader();
    return;
  }
  if(el.dataset.a&&m){const a=m.actions.find(x=>x.id===el.dataset.id);if(!a)return;a[el.dataset.a]=el.type==='checkbox'?el.checked:el.value;a.updatedAt=nowLocal();if(el.dataset.a==='done'){if(a.done)a.doneAt=a.updatedAt;else delete a.doneAt;}markDirty();if(el.type==='checkbox')render();return;}
  if(el.dataset.pa){const [mid,aid]=el.dataset.pa.split('|');const a=S.meetings.find(x=>x.id===mid)?.actions.find(x=>x.id===aid);if(a){a.done=el.checked;a.updatedAt=nowLocal();if(a.done)a.doneAt=a.updatedAt;else delete a.doneAt;markDirty();render();toast(_t('fu.actDone'));}}
});

/* ===================== Inicialização ===================== */
/* idioma: hash (#en, #it, #es, #pt) > escolha salva > idioma do navegador */
(()=>{const h=(location.hash||'').slice(1);let l=LANGS.includes(h)?h:null;
  if(!l){try{l=localStorage.getItem('gestorprojeto.lang');}catch(e){}}
  if(!LANGS.includes(l)){const nl=(navigator.languages&&navigator.languages[0]||navigator.language||'pt').slice(0,2).toLowerCase();l=LANGS.includes(nl)?nl:'pt';}
  LANG=l;})();
normalize();
try{const b=JSON.parse(localStorage.getItem(BK)||'null');if(b&&b.data&&(!S||!S.savedAt||b.ts>Date.parse(S.savedAt))&&JSON.stringify(b.data)!==JSON.stringify(S))pendingRestore=b;}catch(e){}
applyStatic();
render();
})();
