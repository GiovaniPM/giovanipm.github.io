<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de Projeto</title>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#1c2433;--muted:#667085;--line:#e4e8ef;--brand:#3b5bdb;--brand-2:#e8edff;
  --ok:#12a150;--warn:#e8a200;--bad:#e03131;--radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:#111a2e;color:#fff;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:180px}
.brand b{font-size:16px}
.brand small{color:#a9b4cc}
#tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
#tabs button{background:transparent;border:0;color:#c9d2e6;padding:7px 12px;border-radius:8px;cursor:pointer}
#tabs button:hover{background:#1e2a45;color:#fff}
#tabs button.active{background:#3b5bdb;color:#fff}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dirty{font-size:12px;color:#ffd43b;display:none}
#dirty.on{display:inline}
main#app{padding:20px;max-width:1500px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c5ccd8}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#3150c4}
.btn.danger{color:var(--bad);border-color:#f3c4c4}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
header .btn{background:#1e2a45;border-color:#2c3a5c;color:#fff}
header .btn.primary{background:#3b5bdb;border-color:#3b5bdb}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 12px;font-size:15px}
.card h3 small{font-weight:400;color:var(--muted)}
.kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:700;margin-top:2px}
.kpi .sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.health{display:flex;gap:14px;align-items:center;border-radius:var(--radius);padding:14px 18px;color:#fff;margin-bottom:16px}
.health.g{background:linear-gradient(90deg,#0f9d58,#34b36b)}
.health.y{background:linear-gradient(90deg,#d98e04,#f0b429)}
.health.r{background:linear-gradient(90deg,#c92a2a,#e8590c)}
.health .dot{font-size:28px}
.health b{font-size:17px}
ul.ins{margin:0;padding-left:18px}
ul.ins li{margin:6px 0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);margin-bottom:8px;background:#fff;align-items:flex-start}
.alert .sev{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.alert.alta{border-left:4px solid var(--bad)}.alert.alta .sev{background:#ffe3e3;color:#c92a2a}
.alert.media{border-left:4px solid var(--warn)}.alert.media .sev{background:#fff3bf;color:#a76a00}
.alert.baixa{border-left:4px solid #74c0fc}.alert.baixa .sev{background:#e7f5ff;color:#1971c2}
.alert .t{font-weight:600}
.alert .d{color:var(--muted);font-size:12.5px}
.alert[data-act]{cursor:pointer}
.alert[data-act]:hover{background:#fafbff}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);background:#fafbfc;position:sticky;top:0}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f7f9ff}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;color:#fff;white-space:nowrap}
.bar{height:8px;background:#edf0f5;border-radius:6px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--brand)}
.pb{display:flex;align-items:center;gap:8px}
.pb span{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#ffe3e3;color:#c92a2a;margin-left:4px}
.tag.w{background:#fff3bf;color:#a76a00}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid #d0d5dd;border-radius:7px;padding:6px 9px;background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f>*{color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal.hidden{display:none}
.modal .box{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111a2e;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.gantt{display:flex;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.gantt .left{flex:0 0 280px;border-right:1px solid var(--line)}
.gantt .left .r{height:30px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #f0f2f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;gap:6px;cursor:pointer}
.gantt .left .r:hover{background:#f7f9ff}
.gantt .left .r.ph{background:#f4f6fb;font-weight:700;cursor:default;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:#475467}
.gantt .left .r .o{color:var(--muted);font-size:12px;margin-left:auto}
.gantt .left .hd{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 10px 6px;font-size:12px;color:var(--muted)}
.gantt .right{flex:1;overflow-x:auto}
.gantt svg text{font-size:11px;fill:#667085}
.gantt .barg{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart svg text{font-size:11px;fill:#667085}
.tip{position:absolute;pointer-events:none;background:#111a2e;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;white-space:nowrap;display:none;z-index:5}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.fu{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
@media(max-width:900px){.fu{grid-template-columns:1fr}}
.mlist .m{padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.mlist .m:hover{background:#f4f6fb}
.mlist .m.sel{background:var(--brand-2);border-color:#c5d0fa}
.mlist .m small{display:block;color:var(--muted)}
.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}
.dep-row{display:grid;grid-template-columns:minmax(0,1fr) 170px 80px 32px;gap:8px;align-items:center;margin-bottom:6px}
.num{color:var(--muted);font-size:11.5px;font-weight:400;margin-right:4px}
.act-row{display:grid;grid-template-columns:28px 1fr 150px 150px 32px;gap:8px;align-items:center;margin-bottom:6px}
.act-row.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.scroll{overflow-x:auto}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.note b{color:var(--ink)}
.stk{display:flex;height:18px;border-radius:5px;overflow:hidden;background:#edf0f5;min-width:120px}
.stk i{display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;color:#fff;font-weight:600;overflow:hidden}
.wl{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr);gap:8px 12px;align-items:center}
.wl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.rmx{display:grid;grid-template-columns:72px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.rmx .ax{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.rmx button{border:2px solid transparent;border-radius:8px;padding:10px 4px;min-height:64px;cursor:pointer;font:inherit;color:#1c2433;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rmx button b{font-size:22px}
.rmx button small{font-size:11px}
.rmx button.sel{border-color:#111a2e;box-shadow:0 0 0 2px #fff inset}
.rmx button:focus-visible,.btn:focus-visible,.tbl tr.click:focus-visible{outline:3px solid #3b5bdb;outline-offset:2px}
.rk{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.rk.c{background:#c92a2a;color:#fff}.rk.a{background:#ffd8a8;color:#a33b00}.rk.m{background:#fff3bf;color:#7a5200}.rk.b{background:#d3f9d8;color:#1b6e2e}
.tag.n{background:#edf0f5;color:#344054}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px}
.welcome{max-width:620px;margin:40px auto}
.banner{background:#fff3bf;border:1px solid #f0d36b;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chg{font-size:12px;color:var(--brand);font-weight:600}
.small{font-size:12.5px}
#printArea{display:none}
.rp-head{border-bottom:3px solid #111a2e;padding-bottom:10px;margin-bottom:16px}
.rp-head h1{margin:0;font-size:22px}.rp-head .meta{color:var(--muted);font-size:12.5px;margin-top:4px}
.rp-sec{margin-top:18px}
.rp-sec>h2{font-size:15px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rp-pre{white-space:pre-wrap;margin:0}
.rp-break{break-before:page;page-break-before:always}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea{font-size:11.5px;color:#111;max-width:none}
  #printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .card{box-shadow:none;break-inside:avoid;padding:10px}
  #printArea .kpi .val{font-size:20px}
  #printArea .btn,#printArea .tip,#printArea .hov{display:none!important}
  #printArea .grid.g2{grid-template-columns:1fr}
  #printArea .kpis{grid-template-columns:repeat(3,1fr)}
  #printArea .tbl th{position:static}
  #printArea .scroll{overflow:visible}
  #printArea .rp-cfd .tbl{font-size:9.5px}
  #printArea .rp-cfd .tbl th,#printArea .rp-cfd .tbl td{padding:4px 3px}
  #printArea .rp-cfd .tbl th{font-size:8.5px;letter-spacing:0}
  #printArea td.fat{min-width:0}
  #printArea .rp-cfd>.row:first-child{display:none!important}
  #printArea tr{break-inside:avoid}
  #printArea .health{padding:10px 14px}
}
.nowrap{white-space:nowrap}
header select.lang{width:auto;background:#1e2a45;border-color:#2c3a5c;color:#fff;padding:6px 8px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fmts{display:grid;gap:10px}
.fmt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fmt b{font-size:14px}
.fmt p{margin:0;color:var(--muted);font-size:12.5px;grid-column:1}
.fmt .btn{grid-row:1/span 2;grid-column:2}
@media(max-width:560px){.fmt{grid-template-columns:1fr}.fmt .btn{grid-row:auto;grid-column:1;justify-self:start}}
.imp-sum{margin:0 0 10px;padding-left:18px}
.fu>*{min-width:0}
@media(max-width:900px){.fu{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.act-row{grid-template-columns:28px minmax(0,1fr) 32px}.act-row>input[data-a=owner],.act-row>input[data-a=due],.act-row>span.small{grid-column:2}.act-row>span:empty{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b id="projName">Gestor de Projeto</b><small id="projDates"></small></div>
  <nav id="tabs">
    <button data-view="overview" data-i18n="tab.overview">Visão geral</button>
    <button data-view="timeline" data-i18n="tab.timeline">Timeline</button>
    <button data-view="tasks" data-i18n="tab.tasks">Tarefas</button>
    <button data-view="followup" data-i18n="tab.followup">Follow-ups</button>
    <button data-view="cfd" data-i18n="tab.cfd">CFD &amp; Métricas</button>
    <button data-view="team" data-i18n="tab.team">Equipe</button>
    <button data-view="risk" data-i18n="tab.risk">Riscos</button>
    <button data-view="alerts"><span data-i18n="tab.alerts">Alertas</span> <span id="alertCount"></span></button>
    <button data-view="project" data-i18n="tab.project">Projeto</button>
  </nav>
  <div class="hdr-actions">
    <span id="dirty" data-i18n="hdr.dirty">● Alterações não salvas</span>
    <label><span class="sr" data-i18n="hdr.lang">Idioma</span><select id="langSel" class="lang" title="Idioma · Language · Lingua · Idioma"><option value="pt" lang="pt-BR">Português</option><option value="en" lang="en">English</option><option value="it" lang="it">Italiano</option><option value="es" lang="es">Español</option></select></label>
    <button class="btn" data-act="exportMenu" data-i18n="hdr.export" data-i18n-title="hdr.exportT" title="Exportar">⬇ Exportar</button>
    <button class="btn" data-act="importFile" data-i18n="hdr.import" data-i18n-title="hdr.importT" title="Importar">⬆ Importar</button>
    <input type="file" accept=".json,.xml,.gan,.csv,.txt,.mpp,.mpx,.pod,application/json,text/xml,text/csv" id="impFile" hidden>
    <button class="btn" id="saveAsBtn" data-i18n="hdr.saveAs" data-i18n-title="hdr.saveAsT" title="Salvar como">Salvar como…</button>
    <button class="btn primary" id="saveBtn" data-i18n="hdr.save" title="Ctrl+S">💾 Salvar</button>
  </div>
</header>
<main id="app"></main>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<div id="printArea"></div>

<!-- Dados do projeto: são gravados aqui sempre que você clica em Salvar -->
<script type="application/json" id="store">null</script>

<script>
(function(){
"use strict";
/* ===================== Idiomas ===================== */
const LANGS=['pt','en','it','es'],LOCALES={pt:'pt-BR',en:'en-GB',it:'it-IT',es:'es-ES'};
let LANG='pt';
const LOC=()=>LOCALES[LANG];
/* _t('chave', a, b...) devolve o texto no idioma atual, trocando {0}, {1}... pelos argumentos */
function _t(k,...a){const e=I18N[k];const s=e?(e[LANGS.indexOf(LANG)]??e[0]):k;return a.length?s.replace(/\{(\d+)\}/g,(m,i)=>a[+i]??''):s;}
/* _p(3,'day') → "3 dias"; usa as chaves day.1 (singular) e day.n (plural) */
const _p=(n,k)=>n+' '+_t(k+(n===1?'.1':'.n'));
/* ===================== Constantes e utilitários ===================== */
const ST=['backlog','todo','doing','blocked','review','done'].map((k,i)=>({k,c:['#98a2b3','#4dabf7','#f59f00','#e03131','#9c36b5','#2f9e44'][i],get l(){return _t('st.'+k);}}));
const STM=Object.fromEntries(ST.map(s=>[s.k,s]));
const SEV={alta:0,media:1,baixa:2};
const SEVL={get alta(){return _t('sev.alta');},get media(){return _t('sev.media');},get baixa(){return _t('sev.baixa');}};
const DAY=864e5;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(n);
const r1=n=>(Math.round(n*10)/10).toLocaleString(LOC());
const f2=n=>n.toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dn(s){const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY);}
function iso(n){return new Date(n*DAY).toISOString().slice(0,10);}
function addD(s,n){return iso(dn(s)+n);}
function fmt(s){if(!s)return '—';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2);}
/* data e hora local com fuso, ex.: 2026-11-12T18:55:03-03:00 */
function nowLocal(d){d=d||new Date();const o=-d.getTimezoneOffset(),a=Math.abs(o);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${o>=0?'+':'-'}${pad(Math.floor(a/60))}:${pad(a%60)}`;}
function fmtDT(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString(LOC(),{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function fmtL(s){if(!s)return '—';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y;}
const monShort=m=>new Date(Date.UTC(2020,m,1)).toLocaleString(LOC(),{month:'short',timeZone:'UTC'}).replace('.','');
const TODAY=todayISO();
/* Textos da interface: chave: [pt, en, it, es] */
const I18N={
'app':['Gestor de Projeto','Project Manager','Gestore di progetto','Gestor de proyecto'],
'newProject':['Novo projeto','New project','Nuovo progetto','Nuevo proyecto'],
'noPhase':['Sem fase','No phase','Senza fase','Sin fase'],
'noOwner':['Sem responsável','No owner','Senza responsabile','Sin responsable'],
'yes':['sim','yes','sì','sí'],
'dAb':['d','d','g','d'],
'st.backlog':['Backlog','Backlog','Backlog','Backlog'],
'st.todo':['A fazer','To do','Da fare','Por hacer'],
'st.doing':['Em andamento','In progress','In corso','En curso'],
'st.blocked':['Bloqueado','Blocked','Bloccata','Bloqueada'],
'st.review':['Em revisão','In review','In revisione','En revisión'],
'st.done':['Concluído','Done','Completata','Terminada'],
'sev.alta':['Alta','High','Alta','Alta'],
'sev.media':['Média','Medium','Media','Media'],
'sev.baixa':['Baixa','Low','Bassa','Baja'],
'dep.FS':['Término → Início','Finish → Start','Fine → Inizio','Fin → Inicio'],
'dep.SS':['Início → Início','Start → Start','Inizio → Inizio','Inicio → Inicio'],
'dep.FF':['Término → Término','Finish → Finish','Fine → Fine','Fin → Fin'],
'depS.FS':['TI','FS','FS','FS'],
'depS.SS':['II','SS','SS','SS'],
'depS.FF':['TT','FF','FF','FF'],
'day.1':['dia','day','giorno','día'],
'day.n':['dias','days','giorni','días'],
'task.1':['tarefa','task','attività','tarea'],
'task.n':['tarefas','tasks','attività','tareas'],
'person.1':['pessoa','person','persona','persona'],
'person.n':['pessoas','people','persone','personas'],
'delivery.1':['entrega','delivery','consegna','entrega'],
'delivery.n':['entregas','deliveries','consegne','entregas'],
'lateTask.1':['tarefa atrasada','late task','attività in ritardo','tarea atrasada'],
'lateTask.n':['tarefas atrasadas','late tasks','attività in ritardo','tareas atrasadas'],

'tm.howTo':['<b>Como ler:</b> “No prazo” = concluídas até o fim planejado. “Ciclo” = mediana de dias do início à conclusão. “Real÷est.” = mediana do ciclo real dividido pela duração planejada; acima de 1, a tarefa levou mais tempo que o estimado. SPI = progresso real ÷ planejado das tarefas da pessoa hoje. “Vazão 4s” = concluídas nas últimas 4 semanas. “Retrab.” = tarefas que voltaram de status. “Bloq.” = dias em bloqueio. “Ações” = ações abertas dos follow-ups (vencidas entre parênteses), ligadas pelo nome do responsável. As métricas medem o que foi registrado no plano e nas atualizações, não a produtividade individual: use-as para achar gargalos e ajudar, não para ranquear pessoas.','<b>How to read:</b> “On time” = finished by the planned end. “Cycle” = median days from start to finish. “Act.÷est.” = median actual cycle divided by planned duration; above 1, the task took longer than estimated. SPI = actual ÷ planned progress of the person’s tasks today. “Thru. 4w” = finished in the last 4 weeks. “Rework” = tasks that went back in status. “Blocked” = days blocked. “Actions” = open follow-up actions (overdue in brackets), matched by owner name. The metrics measure what was recorded in the plan and updates, not individual productivity: use them to find bottlenecks and help, not to rank people.','<b>Come leggere:</b> “Puntuali” = completate entro la fine pianificata. “Ciclo” = mediana dei giorni dall’inizio al completamento. “Reale÷stim.” = mediana del ciclo reale divisa per la durata pianificata; sopra 1, l’attività ha richiesto più del previsto. SPI = avanzamento reale ÷ pianificato delle attività della persona oggi. “Thru. 4s” = completate nelle ultime 4 settimane. “Rilav.” = attività tornate indietro di stato. “Blocc.” = giorni in blocco. “Azioni” = azioni aperte dei follow-up (scadute tra parentesi), collegate dal nome del responsabile. Le metriche misurano ciò che è stato registrato nel piano e negli aggiornamenti, non la produttività individuale: usale per trovare colli di bottiglia e aiutare, non per fare classifiche.','<b>Cómo leer:</b> “En plazo” = terminadas antes del fin planificado. “Ciclo” = mediana de días del inicio al fin. “Real÷est.” = mediana del ciclo real dividida por la duración planificada; por encima de 1, la tarea tardó más de lo estimado. SPI = avance real ÷ planificado de las tareas de la persona hoy. “Thru. 4s” = terminadas en las últimas 4 semanas. “Retrab.” = tareas que volvieron de estado. “Bloq.” = días bloqueada. “Acciones” = acciones abiertas de los seguimientos (vencidas entre paréntesis), vinculadas por el nombre del responsable. Las métricas miden lo que se registró en el plan y en las actualizaciones, no la productividad individual: úsalas para encontrar cuellos de botella y ayudar, no para hacer rankings.'],

'rk.matrixNote':['<b>Probabilidade</b> sobe com atraso, bloqueio, avanço abaixo do plano, início não feito, predecessora com problema, falta de atualização ou de responsável e sobrecarga do responsável. <b>Impacto</b> sobe com caminho crítico, folga pequena, marco, número de sucessoras e duração. Nível = probabilidade × impacto (1 a 9).','<b>Probability</b> rises with delay, blocker, progress below plan, start not made, a predecessor with a problem, missing update or owner and an overloaded owner. <b>Impact</b> rises with critical path, small slack, milestone, number of successors and duration. Level = probability × impact (1 to 9).','La <b>probabilità</b> sale con ritardo, blocco, avanzamento sotto il piano, inizio non avvenuto, predecessora con problemi, mancanza di aggiornamento o di responsabile e responsabile sovraccarico. L’<b>impatto</b> sale con percorso critico, margine piccolo, milestone, numero di successive e durata. Livello = probabilità × impatto (da 1 a 9).','La <b>probabilidad</b> sube con retraso, bloqueo, avance por debajo del plan, inicio no hecho, predecesora con problemas, falta de actualización o de responsable y responsable sobrecargado. El <b>impacto</b> sube con ruta crítica, holgura pequeña, hito, número de sucesoras y duración. Nivel = probabilidad × impacto (1 a 9).'],

'rk.mcNote':['Barras: % das {0} simulações que terminam em cada semana. É um modelo, não uma medida: sorteia a vazão de semanas reais (últimas {1}: {2} entregas) até concluir as {3} tarefas pendentes, tratando todas como do mesmo tamanho e supondo que o ritmo passado se mantém. Semente fixa {4}: os mesmos dados dão sempre o mesmo resultado.','Bars: % of the {0} simulations that finish in each week. It is a model, not a measurement: it draws the throughput of real weeks (last {1}: {2} deliveries) until the {3} pending tasks are done, treating all of them as the same size and assuming the past pace holds. Fixed seed {4}: the same data always gives the same result.','Barre: % delle {0} simulazioni che finiscono in ogni settimana. È un modello, non una misura: estrae il throughput di settimane reali (ultime {1}: {2} consegne) fino a completare le {3} attività in sospeso, trattandole tutte come della stessa dimensione e supponendo che il ritmo passato si mantenga. Seme fisso {4}: gli stessi dati danno sempre lo stesso risultato.','Barras: % de las {0} simulaciones que terminan en cada semana. Es un modelo, no una medida: sortea el throughput de semanas reales (últimas {1}: {2} entregas) hasta terminar las {3} tareas pendientes, tratándolas a todas como del mismo tamaño y suponiendo que el ritmo pasado se mantiene. Semilla fija {4}: los mismos datos dan siempre el mismo resultado.'],

'av.rules':['<li><b>Atrasada</b>: prazo final passou e a tarefa não foi concluída.</li><li><b>Bloqueada</b>: status bloqueado (alta após 3 dias).</li><li><b>Não iniciada</b>: data de início passou e a tarefa segue em Backlog ou A fazer.</li><li><b>Em risco</b>: progresso real ≥ 25 p.p. abaixo do planejado para hoje.</li><li><b>Sem atualização</b>: em andamento sem registro há {0}+ dias.</li><li><b>WIP</b>: tarefas ativas acima do limite ({1}).</li><li><b>SPI</b> &lt; 0,95 (média) ou &lt; 0,85 (alta). <b>Previsão</b>: término projetado pelo ritmo das últimas semanas além do prazo.</li><li><b>Dependências</b>: conflito de datas com a predecessora (média), atraso propagado de uma predecessora atrasada (alta se a sucessora começa em até 7 dias) e tarefa iniciada antes de a predecessora terminar (baixa).</li><li><b>Ações vencidas</b> dos follow-ups, <b>sobrecarga</b> (3+ tarefas ativas por pessoa), <b>marcos</b> em 7 dias e <b>falta de follow-up</b> há 14+ dias.</li>','<li><b>Late</b>: the end date has passed and the task is not done.</li><li><b>Blocked</b>: blocked status (high after 3 days).</li><li><b>Not started</b>: the start date has passed and the task is still in Backlog or To do.</li><li><b>At risk</b>: actual progress ≥ 25 p.p. below what was planned for today.</li><li><b>No update</b>: in progress with no record for {0}+ days.</li><li><b>WIP</b>: active tasks above the limit ({1}).</li><li><b>SPI</b> &lt; 0.95 (medium) or &lt; 0.85 (high). <b>Forecast</b>: finish projected from the pace of the last weeks beyond the deadline.</li><li><b>Dependencies</b>: date conflict with the predecessor (medium), delay propagated from a late predecessor (high if the successor starts within 7 days) and a task started before its predecessor finished (low).</li><li><b>Overdue actions</b> from the follow-ups, <b>overload</b> (3+ active tasks per person), <b>milestones</b> within 7 days and <b>no follow-up</b> for 14+ days.</li>','<li><b>In ritardo</b>: la data di fine è passata e l’attività non è completata.</li><li><b>Bloccata</b>: stato bloccato (alta dopo 3 giorni).</li><li><b>Non iniziata</b>: la data di inizio è passata e l’attività è ancora in Backlog o Da fare.</li><li><b>A rischio</b>: avanzamento reale ≥ 25 p.p. sotto il pianificato per oggi.</li><li><b>Senza aggiornamento</b>: in corso senza registrazioni da {0}+ giorni.</li><li><b>WIP</b>: attività attive oltre il limite ({1}).</li><li><b>SPI</b> &lt; 0,95 (media) o &lt; 0,85 (alta). <b>Previsione</b>: fine proiettata dal ritmo delle ultime settimane oltre la scadenza.</li><li><b>Dipendenze</b>: conflitto di date con la predecessora (media), ritardo propagato da una predecessora in ritardo (alta se la successiva inizia entro 7 giorni) e attività iniziata prima che la predecessora finisca (bassa).</li><li><b>Azioni scadute</b> dei follow-up, <b>sovraccarico</b> (3+ attività attive per persona), <b>milestone</b> entro 7 giorni e <b>mancanza di follow-up</b> da 14+ giorni.</li>','<li><b>Atrasada</b>: el plazo final pasó y la tarea no se terminó.</li><li><b>Bloqueada</b>: estado bloqueado (alta después de 3 días).</li><li><b>No iniciada</b>: la fecha de inicio pasó y la tarea sigue en Backlog o Por hacer.</li><li><b>En riesgo</b>: avance real ≥ 25 p.p. por debajo de lo planificado para hoy.</li><li><b>Sin actualización</b>: en curso sin registro hace {0}+ días.</li><li><b>WIP</b>: tareas activas por encima del límite ({1}).</li><li><b>SPI</b> &lt; 0,95 (media) o &lt; 0,85 (alta). <b>Pronóstico</b>: fin proyectado por el ritmo de las últimas semanas más allá del plazo.</li><li><b>Dependencias</b>: conflicto de fechas con la predecesora (media), retraso propagado de una predecesora atrasada (alta si la sucesora empieza en hasta 7 días) y tarea iniciada antes de que termine la predecesora (baja).</li><li><b>Acciones vencidas</b> de los seguimientos, <b>sobrecarga</b> (3+ tareas activas por persona), <b>hitos</b> en 7 días y <b>falta de seguimiento</b> hace 14+ días.</li>'],

'cf.read':['Leitura: a distância <b>vertical</b> entre a faixa “Concluído” e o topo das faixas ativas é o WIP; a distância <b>horizontal</b> aproxima o tempo de ciclo. Faixas que se alargam indicam gargalo; faixa de concluídas plana indica que nada está sendo entregue.','Reading: the <b>vertical</b> distance between the “Done” band and the top of the active bands is the WIP; the <b>horizontal</b> distance approximates the cycle time. Widening bands point to a bottleneck; a flat done band means nothing is being delivered.','Lettura: la distanza <b>verticale</b> tra la fascia “Completata” e la cima delle fasce attive è il WIP; la distanza <b>orizzontale</b> approssima il tempo di ciclo. Fasce che si allargano indicano un collo di bottiglia; una fascia dei completati piatta indica che non si consegna nulla.','Lectura: la distancia <b>vertical</b> entre la franja “Terminada” y el tope de las franjas activas es el WIP; la distancia <b>horizontal</b> aproxima el tiempo de ciclo. Franjas que se ensanchan indican un cuello de botella; una franja de terminadas plana indica que no se entrega nada.'],

'pj.fileList':['<li><b>Chrome/Edge</b>: na primeira vez você escolhe o arquivo (selecione este mesmo HTML para sobrescrevê-lo); depois, o Salvar grava direto nele.</li><li><b>Firefox/Safari</b>: uma nova cópia do HTML é baixada com os dados; substitua o arquivo antigo por ela.</li><li><b>⬇ Exportar / ⬆ Importar</b> (no topo): JSON com todos os dados deste app, MS Project XML (MS Project, ProjectLibre e outros), GanttProject (.gan) e CSV. Importar um projeto substitui os dados atuais ou soma tarefas; clique em Salvar depois para gravá-los no HTML.</li><li>Enquanto não salvar, uma cópia de segurança fica no navegador e é oferecida para restauração se você fechar sem salvar.</li>','<li><b>Chrome/Edge</b>: the first time you choose the file (select this same HTML to overwrite it); after that, Save writes straight to it.</li><li><b>Firefox/Safari</b>: a new copy of the HTML is downloaded with the data; replace the old file with it.</li><li><b>⬇ Export / ⬆ Import</b> (at the top): JSON with all the data of this app, MS Project XML (MS Project, ProjectLibre and others), GanttProject (.gan) and CSV. Importing a project replaces the current data or adds tasks; click Save afterwards to write them into the HTML.</li><li>Until you save, a backup copy stays in the browser and is offered for restoring if you close without saving.</li>','<li><b>Chrome/Edge</b>: la prima volta scegli il file (seleziona questo stesso HTML per sovrascriverlo); poi Salva scrive direttamente lì.</li><li><b>Firefox/Safari</b>: viene scaricata una nuova copia dell’HTML con i dati; sostituisci il file vecchio con essa.</li><li><b>⬇ Esporta / ⬆ Importa</b> (in alto): JSON con tutti i dati di questa app, MS Project XML (MS Project, ProjectLibre e altri), GanttProject (.gan) e CSV. Importare un progetto sostituisce i dati attuali o aggiunge attività; poi clicca Salva per scriverli nell’HTML.</li><li>Finché non salvi, una copia di sicurezza resta nel browser e viene proposta per il ripristino se chiudi senza salvare.</li>','<li><b>Chrome/Edge</b>: la primera vez eliges el archivo (selecciona este mismo HTML para sobrescribirlo); después, Guardar graba directamente en él.</li><li><b>Firefox/Safari</b>: se descarga una copia nueva del HTML con los datos; reemplaza con ella el archivo antiguo.</li><li><b>⬇ Exportar / ⬆ Importar</b> (arriba): JSON con todos los datos de este app, MS Project XML (MS Project, ProjectLibre y otros), GanttProject (.gan) y CSV. Importar un proyecto reemplaza los datos actuales o suma tareas; luego haz clic en Guardar para grabarlos en el HTML.</li><li>Mientras no guardes, una copia de seguridad queda en el navegador y se ofrece para restaurar si cierras sin guardar.</li>'],

'tf.depHelp':['<b>Término → Início</b>: só começa depois que a predecessora termina · <b>Início → Início</b>: só começa depois que ela começa · <b>Término → Término</b>: só termina depois que ela termina. Defasagem em dias (ex.: 2 = espera 2 dias; −1 = antecipa 1).','<b>Finish → Start</b>: starts only after the predecessor finishes · <b>Start → Start</b>: starts only after it starts · <b>Finish → Finish</b>: finishes only after it finishes. Lag in days (e.g. 2 = waits 2 days; −1 = 1 day earlier).','<b>Fine → Inizio</b>: inizia solo dopo che la predecessora finisce · <b>Inizio → Inizio</b>: inizia solo dopo che lei inizia · <b>Fine → Fine</b>: finisce solo dopo che lei finisce. Ritardo in giorni (es.: 2 = attende 2 giorni; −1 = anticipa di 1).','<b>Fin → Inicio</b>: solo empieza después de que la predecesora termina · <b>Inicio → Inicio</b>: solo empieza después de que ella empieza · <b>Fin → Fin</b>: solo termina después de que ella termina. Desfase en días (ej.: 2 = espera 2 días; −1 = adelanta 1).'],

'ip.help':['Cole as linhas da sua planilha (Excel, Google Sheets) ou um CSV. Colunas, nesta ordem:<br><code>Tarefa · Fase · Responsável · Início · Fim · Status · % · Marco (sim/não) · Predecessoras</code> (as quatro últimas são opcionais)<br>Datas em dd/mm/aaaa ou aaaa-mm-dd. Separador: tabulação, ponto e vírgula ou vírgula. O cabeçalho é ignorado.<br><b>Predecessoras</b> (estilo MS Project): número da linha na lista colada (1 = primeira tarefa), com tipo e defasagem opcionais, ex.: <code>2</code>, <code>2TI+3</code>, <code>4II</code>, <code>5TT-1</code> (também aceita FS/SS/FF). Várias separadas por <code>|</code> ou vírgula (ou <code>;</code> ao colar do Excel). Use <code>#12</code> para apontar uma tarefa já existente pelo número.','Paste the rows of your spreadsheet (Excel, Google Sheets) or a CSV. Columns, in this order:<br><code>Task · Phase · Owner · Start · End · Status · % · Milestone (yes/no) · Predecessors</code> (the last four are optional)<br>Dates as dd/mm/yyyy or yyyy-mm-dd. Separator: tab, semicolon or comma. The header is ignored.<br><b>Predecessors</b> (MS Project style): row number in the pasted list (1 = first task), with optional type and lag, e.g. <code>2</code>, <code>2FS+3</code>, <code>4SS</code>, <code>5FF-1</code> (TI/II/TT also accepted). Several separated by <code>|</code> or comma (or <code>;</code> when pasting from Excel). Use <code>#12</code> to point to an existing task by number.','Incolla le righe del tuo foglio di calcolo (Excel, Google Sheets) o un CSV. Colonne, in quest’ordine:<br><code>Attività · Fase · Responsabile · Inizio · Fine · Stato · % · Milestone (sì/no) · Predecessori</code> (le ultime quattro sono facoltative)<br>Date in gg/mm/aaaa o aaaa-mm-gg. Separatore: tabulazione, punto e virgola o virgola. L’intestazione viene ignorata.<br><b>Predecessori</b> (stile MS Project): numero di riga nell’elenco incollato (1 = prima attività), con tipo e ritardo facoltativi, es.: <code>2</code>, <code>2FS+3</code>, <code>4SS</code>, <code>5FF-1</code> (accetta anche TI/II/TT). Più valori separati da <code>|</code> o virgola (o <code>;</code> incollando da Excel). Usa <code>#12</code> per indicare un’attività esistente per numero.','Pega las filas de tu planilla (Excel, Google Sheets) o un CSV. Columnas, en este orden:<br><code>Tarea · Fase · Responsable · Inicio · Fin · Estado · % · Hito (sí/no) · Predecesoras</code> (las cuatro últimas son opcionales)<br>Fechas en dd/mm/aaaa o aaaa-mm-dd. Separador: tabulación, punto y coma o coma. El encabezado se ignora.<br><b>Predecesoras</b> (estilo MS Project): número de fila en la lista pegada (1 = primera tarea), con tipo y desfase opcionales, ej.: <code>2</code>, <code>2FS+3</code>, <code>4SS</code>, <code>5FF-1</code> (también acepta TI/II/TT). Varias separadas por <code>|</code> o coma (o <code>;</code> al pegar desde Excel). Usa <code>#12</code> para apuntar a una tarea existente por su número.'],

'ex.note':['Nos formatos MS Project XML e GanttProject vão só o plano e o andamento atual: histórico, reuniões, ações e métricas ficam apenas no JSON. O app conta dias corridos; por isso o arquivo usa um calendário de 7 dias úteis, para manter as mesmas datas.','The MS Project XML and GanttProject formats carry only the plan and the current progress: history, meetings, actions and metrics stay only in the JSON. The app counts calendar days, so the file uses a 7-working-day calendar to keep the same dates.','Nei formati MS Project XML e GanttProject vanno solo il piano e l’avanzamento attuale: storico, riunioni, azioni e metriche restano solo nel JSON. L’app conta i giorni di calendario; per questo il file usa un calendario di 7 giorni lavorativi, per mantenere le stesse date.','En los formatos MS Project XML y GanttProject van solo el plan y el avance actual: historial, reuniones, acciones y métricas quedan solo en el JSON. El app cuenta días corridos; por eso el archivo usa un calendario de 7 días hábiles, para mantener las mismas fechas.'],

'im.notes':['O status vem do campo de status do arquivo, quando existe; senão, do % concluído. Datas reais de início e fim, quando existem, entram no histórico; sem elas, o app supõe as datas planejadas. Durações contam dias corridos. Os dados só ficam no HTML depois de Salvar.','The status comes from the file’s status field, when there is one; otherwise from % done. Actual start and finish dates, when present, go into the history; without them, the app assumes the planned dates. Durations count calendar days. The data only stays in the HTML after Save.','Lo stato viene dal campo di stato del file, se presente; altrimenti dalla % completata. Le date reali di inizio e fine, se presenti, entrano nello storico; senza di esse l’app assume le date pianificate. Le durate contano i giorni di calendario. I dati restano nell’HTML solo dopo Salva.','El estado viene del campo de estado del archivo, cuando existe; si no, del % terminado. Las fechas reales de inicio y fin, cuando existen, entran en el historial; sin ellas, el app supone las fechas planificadas. Las duraciones cuentan días corridos. Los datos solo quedan en el HTML después de Guardar.'],

'im.wSF':['{0} dependência(s) Início → Término foram ignoradas: o app não tem esse tipo.','{0} Start → Finish dependency(ies) were skipped: the app has no such type.','{0} dipendenza/e Inizio → Fine ignorate: l’app non ha questo tipo.','{0} dependencia(s) Inicio → Fin se ignoraron: el app no tiene ese tipo.'],
'im.wPctLag':['{0} defasagem(ns) em porcentagem foram zeradas.','{0} percentage lag(s) were set to zero.','{0} ritardo/i in percentuale azzerato/i.','{0} desfase(s) en porcentaje se pusieron en cero.'],
};

/* ===================== Estado ===================== */
let S=null;
try{S=JSON.parse(document.getElementById('store').textContent);}catch(e){S=null;}
const UI={view:'overview',zoom:'week',f:{q:'',status:'',phase:'',owner:'',late:false},meetingId:null,cfdRange:'all',riskCell:null,riskAll:false,fuAll:false,showDeps:true,showCrit:false};
let dirty=false;
const BK='gestor-projeto-backup:'+location.pathname;

function normalize(){
  if(!S)return;
  S.version=1;
  S.project=Object.assign({name:_t('newProject'),description:'',manager:'',start:TODAY,end:addD(TODAY,60)},S.project||{});
  S.settings=Object.assign({wipLimit:5,staleDays:7},S.settings||{});
  S.tasks=S.tasks||[];S.meetings=S.meetings||[];
  S.tasks.forEach(t=>{
    t.history=(t.history&&t.history.length)?t.history:[{d:t.created||S.project.start,s:t.status||'todo',p:t.progress||0}];
    t.history.sort(cmpH);
    const l=t.history[t.history.length-1];t.status=l.s;t.progress=l.s==='done'?100:(l.p||0);
  });
  S.meetings.forEach(m=>{m.actions=m.actions||[];m.updates=m.updates||[];});
  const ids=new Set(S.tasks.map(t=>t.id));
  S.seq=Math.max(S.seq||0,...S.tasks.map(t=>t.num||0));
  sortedTasks().forEach(t=>{if(!t.num)t.num=++S.seq;});
  S.tasks.forEach(t=>{const seen=new Set();t.deps=(t.deps||[]).filter(d=>d&&ids.has(d.id)&&d.id!==t.id&&!seen.has(d.id)&&seen.add(d.id)).map(d=>({id:d.id,type:DEPT[d.type]?d.type:'FS',lag:+d.lag||0}));});
}
const cmpH=(a,b)=>a.d<b.d?-1:a.d>b.d?1:0;

function markDirty(){
  dirty=true;$('#dirty').classList.add('on');
  try{localStorage.setItem(BK,JSON.stringify({ts:Date.now(),data:S}));}catch(e){}
  updateHeader();
}
function markClean(){dirty=false;$('#dirty').classList.remove('on');try{localStorage.removeItem(BK);}catch(e){}}

/* ===================== Modelo: tarefas ===================== */
function statusAt(t,d){let r=null;for(const h of t.history){if(h.d<=d)r=h;else break;}return r;}
function progOf(h){return !h?0:(h.s==='done'?100:(h.p||0));}
function curProg(t){return t.status==='done'?100:(t.progress||0);}
function weight(t){return t.milestone?1:Math.max(1,dn(t.end)-dn(t.start)+1);}
function plannedPct(t,d){const a=dn(t.start),b=dn(t.end),x=dn(d);if(x<a)return 0;if(x>=b)return 100;return (x-a+1)/(b-a+1)*100;}
function isActive(s){return s==='doing'||s==='review'||s==='blocked';}
function doneDate(t){if(t.status!=='done')return null;let r=null,prev=null;for(const h of t.history){if(h.s==='done'&&prev!=='done')r=h.d;prev=h.s;}return r;}
function startedDate(t){const h=t.history.find(h=>h.s!=='backlog'&&h.s!=='todo');return h?h.d:null;}
function lastChange(t){return t.history[t.history.length-1].d;}
function statusSince(t){let r=t.history[t.history.length-1].d;for(let i=t.history.length-1;i>=0;i--){if(t.history[i].s===t.status)r=t.history[i].d;else break;}return r;}
function lastNote(t){for(let i=t.history.length-1;i>=0;i--)if(t.history[i].n)return t.history[i].n;return '';}
function isLate(t){return t.status!=='done'&&dn(t.end)<dn(TODAY);}

/* ===================== Dependências ===================== */
const DEPT={get FS(){return _t('dep.FS');},get SS(){return _t('dep.SS');},get FF(){return _t('dep.FF');}};
const DEPS={get FS(){return _t('depS.FS');},get SS(){return _t('depS.SS');},get FF(){return _t('depS.FF');}};
function tById(id){return S.tasks.find(t=>t.id===id);}
function depsOf(t){return (t.deps||[]).filter(d=>tById(d.id));}
function succsOf(t){return S.tasks.filter(s=>(s.deps||[]).some(d=>d.id===t.id));}
function descendants(id){const out=new Set(),st=[id];while(st.length){const c=st.pop();S.tasks.forEach(s=>{if((s.deps||[]).some(d=>d.id===c)&&!out.has(s.id)){out.add(s.id);st.push(s.id);}});}return out;}
/* início mínimo (nº do dia) que a sucessora s pode ter dada a predecessora p e o vínculo d */
function rq(s,p,d,pMilestone){
  const lag=+d.lag||0,dur=dn(s.end)-dn(s.start);
  if(d.type==='SS')return dn(p.start)+lag;
  if(d.type==='FF')return dn(p.end)+lag-dur;
  return dn(p.end)+(pMilestone?0:1)+lag;
}
function depGap(t,d){const p=tById(d.id);return rq(t,p,d,p.milestone)-dn(t.start);}
function lagTxt(d){return d.lag?` ${d.lag>0?'+':''}${d.lag}d`:'';}
function depLabel(d){const p=tById(d.id);return `#${p.num} ${p.title} (${DEPS[d.type]}${lagTxt(d)})`;}
function depShort(d){const p=tById(d.id);return '#'+p.num+(d.type!=='FS'?DEPS[d.type]:'')+(d.lag?(d.lag>0?'+':'')+d.lag:'');}
function topo(){
  const indeg=new Map(S.tasks.map(t=>[t.id,depsOf(t).length]));const q=S.tasks.filter(t=>!indeg.get(t.id));const out=[],seen=new Set();
  while(q.length){const t=q.shift();if(seen.has(t.id))continue;seen.add(t.id);out.push(t);succsOf(t).forEach(s=>{indeg.set(s.id,indeg.get(s.id)-1);if(indeg.get(s.id)<=0)q.push(s);});}
  S.tasks.forEach(t=>{if(!seen.has(t.id))out.push(t);});return out;
}
/* tarefas que dependem de predecessoras ainda não concluídas */
function waitingOn(t){
  if(t.status==='done'||isActive(t.status))return [];
  return depsOf(t).filter(d=>{const p=tById(d.id);return d.type==='SS'?(p.status==='todo'||p.status==='backlog'):d.type==='FS'?p.status!=='done':false;}).map(d=>tById(d.id));
}
/* Reagendamento: empurra (nunca puxa) tarefas não iniciadas para respeitar as dependências, mantendo a duração */
function planReschedule(){
  const tmp=new Map(S.tasks.map(t=>[t.id,{start:t.start,end:t.end}]));const ch=[];
  for(const t of topo()){
    if(t.status==='done'||isActive(t.status))continue;
    const cur=tmp.get(t.id);let need=-Infinity;
    for(const d of depsOf(t)){const p=tById(d.id);need=Math.max(need,rq(cur,tmp.get(d.id),d,p.milestone));}
    if(need>dn(cur.start)){const dur=dn(cur.end)-dn(cur.start),ns=iso(need),ne=iso(need+dur);ch.push({t,os:t.start,oe:t.end,ns,ne,delta:need-dn(cur.start)});tmp.set(t.id,{start:ns,end:ne});}
  }
  return ch;
}
/* Folga total (dias) de cada tarefa em relação ao fim planejado do projeto — 0 ou menos = caminho crítico */
function slackMap(){
  const order=topo(),LF=new Map(),LS=new Map();
  const end=Math.max(...S.tasks.map(t=>dn(t.end)));
  for(const t of [...order].reverse()){
    const dur=dn(t.end)-dn(t.start);let lf=end;
    for(const s of succsOf(t))for(const d of s.deps.filter(d=>d.id===t.id)){
      if(!LS.has(s.id))continue;const lag=+d.lag||0;
      if(d.type==='SS')lf=Math.min(lf,LS.get(s.id)-lag+dur);
      else if(d.type==='FF')lf=Math.min(lf,LF.get(s.id)-lag);
      else lf=Math.min(lf,LS.get(s.id)-lag-(t.milestone?0:1));
    }
    LF.set(t.id,lf);LS.set(t.id,lf-dur);
  }
  return new Map(S.tasks.map(t=>[t.id,LS.get(t.id)-dn(t.start)]));
}
function hasDeps(){return S.tasks.some(t=>depsOf(t).length);}

/* Registra mudança de status/progresso numa data (1 registro por dia) */
function updateTask(t,{s,p,d,note}){
  s=s??t.status;p=p??t.progress;d=d||TODAY;if(s==='done')p=100;
  p=Math.max(0,Math.min(100,Math.round(+p||0)));
  const at=statusAt(t,d);
  const changed=!at||at.s!==s||progOf(at)!==p||(note!==undefined&&note!==(at.d===d?(at.n||''):''));
  if(!changed)return false;
  const i=t.history.findIndex(h=>h.d===d);
  const e={d,s,p,at:nowLocal()};
  if(note!==undefined){if(note)e.n=note;}else if(i>=0&&t.history[i].n)e.n=t.history[i].n;
  if(i>=0)t.history[i]=e;else t.history.push(e);
  t.history.sort(cmpH);
  const l=t.history[t.history.length-1];t.status=l.s;t.progress=progOf(l);
  return true;
}

const phKey=t=>t.phase||'';
const phName=p=>p||_t('noPhase');
function phases(){const o=[];S.tasks.forEach(t=>{const p=phKey(t);if(!o.includes(p))o.push(p);});return o;}
function owners(){return [...new Set(S.tasks.map(t=>t.owner).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
function sortedTasks(){const ph=phases();return [...S.tasks].sort((a,b)=>ph.indexOf(phKey(a))-ph.indexOf(phKey(b))||(a.start<b.start?-1:a.start>b.start?1:0));}

/* ===================== Métricas ===================== */
function metricsAt(d){
  let W=0,pl=0,ac=0;const counts={};ST.forEach(s=>counts[s.k]=0);
  for(const t of S.tasks){
    const w=weight(t);W+=w;pl+=w*plannedPct(t,d);
    const h=statusAt(t,d);if(h){ac+=w*progOf(h);counts[h.s]++;}
  }
  return {planned:W?pl/W:0,actual:W?ac/W:0,counts};
}
function stats(){
  const P=S.project,x=dn(TODAY);
  const m=metricsAt(TODAY);
  const total=S.tasks.length,done=S.tasks.filter(t=>t.status==='done').length;
  const wip=S.tasks.filter(t=>isActive(t.status)).length;
  const spi=m.planned>0.5?m.actual/m.planned:null;
  const dur=Math.max(1,dn(P.end)-dn(P.start));
  const elapsed=Math.max(0,Math.min(100,(x-dn(P.start))/dur*100));
  const daysLeft=dn(P.end)-x;
  const win=Math.max(7,Math.min(28,x-dn(P.start)));
  const past=metricsAt(addD(TODAY,-win));
  const vel=(m.actual-past.actual)/win; // p.p. por dia
  let forecast=null;
  if(m.actual>=99.99)forecast=TODAY;else if(vel>0.01)forecast=addD(TODAY,Math.ceil((100-m.actual)/vel));
  const need=daysLeft>0?(100-m.actual)/daysLeft:null;
  const dds=S.tasks.map(doneDate).filter(Boolean);
  const thr14=dds.filter(d=>dn(d)>x-14).length,thrPrev14=dds.filter(d=>dn(d)>x-28&&dn(d)<=x-14).length;
  const cyc=S.tasks.filter(t=>t.status==='done'&&!t.milestone).map(t=>{const a=startedDate(t),b=doneDate(t);return a&&b?dn(b)-dn(a)+1:null;}).filter(v=>v!=null);
  const lead=S.tasks.filter(t=>t.status==='done'&&!t.milestone).map(t=>dn(doneDate(t))-dn(t.history[0].d)+1);
  const late=S.tasks.filter(isLate).length;
  const blocked=S.tasks.filter(t=>t.status==='blocked').length;
  return {...m,total,done,wip,spi,elapsed,daysLeft,vel,win,forecast,need,thr14,thrPrev14,cycle:cyc.length?avg(cyc):null,lead:lead.length?avg(lead):null,late,blocked};
}

/* ===================== Alertas ===================== */
function alerts(){
  const A=[],x=dn(TODAY),st=stats(),lim=S.settings.wipLimit,stale=S.settings.staleDays;
  const add=(sev,title,detail,taskId,kind)=>A.push({sev,title,detail,taskId,kind});
  for(const t of S.tasks){
    if(t.status==='done')continue;
    const late=x-dn(t.end),own=t.owner?' · '+t.owner:'';
    if(late>0)add('alta',_t('al.late',t.title),_t('al.lateD',fmt(t.end),_p(late,'day'),STM[t.status].l,curProg(t))+own,t.id,'atraso');
    if(t.status==='blocked'){const d=x-dn(statusSince(t));const n=lastNote(t);add(d>=3?'alta':'media',_t('al.blocked',t.title),_t('al.blockedD',_p(d,'day'))+own+(n?' · "'+n+'"':''),t.id,'bloqueio');}
    if((t.status==='backlog'||t.status==='todo')&&dn(t.start)<x&&late<=0)add('media',_t('al.notStarted',t.title),_t('al.notStartedD',fmt(t.start),_p(x-dn(t.start),'day'))+own,t.id,'inicio');
    if(isActive(t.status)&&t.status!=='blocked'&&late<=0){const g=plannedPct(t,TODAY)-curProg(t);if(g>=25)add('media',_t('al.atRisk',t.title),_t('al.atRiskD',r0(plannedPct(t,TODAY)),curProg(t),fmt(t.end))+own,t.id,'risco');}
    if(t.status==='doing'&&x-dn(lastChange(t))>=stale)add('media',_t('al.stale',t.title),_t('al.staleD',fmt(lastChange(t)),_p(x-dn(lastChange(t)),'day'))+own,t.id,'parada');
    if(!t.owner)add('baixa',_t('al.noOwner',t.title),_t('al.noOwnerD'),t.id,'dono');
    if(t.milestone&&late<=0&&dn(t.end)-x<=7)add('media',_t('al.ms',t.title),_t('al.msD',_p(dn(t.end)-x,'day'),fmt(t.end)),t.id,'marco');
  }
  for(const t of S.tasks){
    if(t.status==='done')continue;
    for(const d of depsOf(t)){
      const p=tById(d.id),gap=depGap(t,d);
      if(gap>0&&!isActive(t.status))add('media',_t('al.conf',t.title),_t('al.confD',fmt(t.start),p.num,p.title,DEPT[d.type]+lagTxt(d),fmt(iso(dn(t.start)+gap)),gap),t.id,'dep');
      if(isLate(p)&&!isActive(t.status))add(dn(t.start)<=x+7?'alta':'media',_t('al.prop',p.title,t.title),_t('al.propD',fmt(p.end),curProg(p),t.title,fmt(t.start)),t.id,'dep');
      if(d.type==='FS'&&isActive(t.status)&&p.status!=='done')add('baixa',_t('al.early',t.title),_t('al.earlyD',p.num,p.title,STM[p.status].l.toLowerCase(),curProg(p)),t.id,'dep');
    }
  }
  if(st.wip>lim)add('media',_t('al.wip'),_t('al.wipD',st.wip,lim),null,'wip');
  if(st.spi!=null&&st.spi<0.85)add('alta',_t('al.spiHi',f2(st.spi)),_t('al.spiD',r0(st.actual),r0(st.planned)),null,'spi');
  else if(st.spi!=null&&st.spi<0.95)add('media',_t('al.spiMd',f2(st.spi)),_t('al.spiD',r0(st.actual),r0(st.planned)),null,'spi');
  if(st.total>st.done){
    if(st.forecast&&dn(st.forecast)>dn(S.project.end)){const d=dn(st.forecast)-dn(S.project.end);add(d>7?'alta':'media',_t('al.fc'),_t('al.fcD',fmt(st.forecast),_p(d,'day'),fmt(S.project.end)),null,'previsao');}
    else if(!st.forecast&&x>dn(S.project.start)+3)add('alta',_t('al.noPace'),_t('al.noPaceD',st.win),null,'previsao');
  }
  const load={};S.tasks.filter(t=>isActive(t.status)&&t.owner).forEach(t=>load[t.owner]=(load[t.owner]||0)+1);
  Object.entries(load).filter(([,n])=>n>=3).forEach(([o,n])=>add('baixa',_t('al.load',o),_t('al.loadD',n),null,'carga'));
  S.meetings.forEach(m=>m.actions.forEach(a=>{if(!a.done&&a.due&&dn(a.due)<x)add('media',_t('al.act',a.text),_t('al.actD',a.owner||_t('noOwner'),fmt(a.due),m.title),null,'acao');}));
  const lastM=S.meetings.map(m=>m.date).sort().pop();
  if(S.tasks.length&&(!lastM||x-dn(lastM)>14)&&x>dn(S.project.start))add('baixa',_t('al.fu'),lastM?_t('al.fuLast',fmt(lastM)):_t('al.fuNone'),null,'fu');
  return A.sort((a,b)=>SEV[a.sev]-SEV[b.sev]);
}
function health(st,al){
  const hi=al.filter(a=>a.sev==='alta').length;
  const fLate=st.forecast&&st.total>st.done?dn(st.forecast)-dn(S.project.end):0;
  if((st.spi!=null&&st.spi<0.85)||fLate>7||hi>=3)return {c:'r',l:_t('h.r'),d:_t('h.rD')};
  if((st.spi!=null&&st.spi<0.95)||fLate>0||hi>0)return {c:'y',l:_t('h.y'),d:_t('h.yD')};
  return {c:'g',l:_t('h.g'),d:_t('h.gD')};
}

/* ===================== Insights ===================== */
function insights(){
  const st=stats(),I=[],x=dn(TODAY);
  if(!S.tasks.length)return [_t('in.empty')];
  const gap=st.actual-st.planned;
  const gapTxt=Math.abs(gap)<1?_t('in.onPlan'):(gap>0?'<b class="delta up">'+_t('in.ahead')+'</b>':'<b class="delta dn">'+_t('in.behind')+'</b>')+` ${r1(Math.abs(gap))} p.p.`;
  I.push(_t('in.progress',r0(st.actual),r0(st.planned),gapTxt,r0(st.elapsed)));
  if(st.total>st.done){
    if(st.forecast){const d=dn(st.forecast)-dn(S.project.end);
      const rel=d>0?`<b class="delta dn">${_t('in.after',_p(d,'day'))}</b>`:d<0?`<b class="delta up">${_t('in.before',_p(-d,'day'))}</b>`:_t('in.exactly');
      I.push(_t('in.forecast',r0(st.win/7),r1(st.vel*7),fmtL(st.forecast),rel));
    }
    if(st.need!=null&&st.daysLeft>0)I.push(_t('in.need',fmt(S.project.end),r1(st.need*7))+(st.vel>0?' '+_t('in.needX',r1(st.need/st.vel)):'')+'.');
    else if(st.daysLeft<=0)I.push(_t('in.overdue',fmt(S.project.end),r0(100-st.actual)));
  }
  if(st.thr14||st.thrPrev14){const dd=st.thr14-st.thrPrev14;I.push(_t('in.thr',_p(st.thr14,'delivery'),st.thrPrev14,dd>0?'<span class="delta up">'+_t('in.accel')+'</span>':dd<0?'<span class="delta dn">'+_t('in.decel')+'</span>':_t('in.stable')));}
  if(st.cycle!=null)I.push(_t('in.cycle',r1(st.cycle),r1(st.lead)));
  // gargalo no CFD
  const past=metricsAt(addD(TODAY,-14)).counts,now=metricsAt(TODAY).counts;
  const grow=['doing','review','blocked'].map(k=>({k,d:now[k]-past[k]})).sort((a,b)=>b.d-a.d)[0];
  const wipPast=past.doing+past.review+past.blocked;
  if(grow&&grow.d>0)I.push(_t('in.cfdGrow',STM[grow.k].l,grow.d,wipPast,st.wip,_p(now.done-past.done,'task')));
  else if(st.wip<=S.settings.wipLimit)I.push(_t('in.cfdOk',wipPast,st.wip,S.settings.wipLimit));
  // fase mais atrasada
  const ph=phases().map(p=>{const ts=S.tasks.filter(t=>phKey(t)===p);let W=0,a=0,pl=0;ts.forEach(t=>{const w=weight(t);W+=w;a+=w*curProg(t);pl+=w*plannedPct(t,TODAY);});return {p,a:a/W,pl:pl/W};}).filter(o=>o.pl-o.a>5).sort((a,b)=>(b.pl-b.a)-(a.pl-a.a))[0];
  if(ph)I.push(_t('in.phase',esc(phName(ph.p)),r0(ph.a),r0(ph.pl)));
  // responsáveis
  const lateBy={};S.tasks.filter(isLate).forEach(t=>{const o=t.owner||_t('noOwner');lateBy[o]=(lateBy[o]||0)+1;});
  const lo=Object.entries(lateBy).sort((a,b)=>b[1]-a[1])[0];
  if(lo)I.push(_t('in.ownerLate',esc(lo[0]),_p(lo[1],'lateTask')));
  const bl=S.tasks.filter(t=>t.status==='blocked');
  if(bl.length)I.push(_t('in.blocked',_p(bl.length,'blockedTask'),bl.map(t=>esc(t.title)).join(', ')));
  if(hasDeps()){
    const sl=slackMap();
    const crit=S.tasks.filter(t=>t.status!=='done'&&sl.get(t.id)<=0).sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);

/* ===================== Gráficos SVG ===================== */
let chartData={};
function xTicks(d0,N,W,pl,step){
  let out='';const every=Math.max(1,Math.ceil(N/9));
  for(let i=0;i<N;i+=every){const x=pl+i*step;const s=iso(d0+i);out+=`<text x="${x}" y="${0}" text-anchor="middle">${s.slice(8)}/${s.slice(5,7)}</text>`;}
  return out;
}
function cfdSVG(from,to,id){
  const d0=dn(from),d1=dn(to),N=Math.max(2,d1-d0+1);
  const W=920,H=320,pl=36,pr=12,pt=12,pb=26,step=(W-pl-pr)/(N-1);
  const order=['done','review','blocked','doing','todo','backlog'];
  const data=[];let max=1;
  for(let i=0;i<N;i++){const d=iso(d0+i),c={};order.forEach(k=>c[k]=0);for(const t of S.tasks){const h=statusAt(t,d);if(h)c[h.s]++;}const tot=order.reduce((a,k)=>a+c[k],0);max=Math.max(max,tot);data.push({d,c});}
  max=Math.ceil(max*1.05);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let polys='';const cum=new Array(N).fill(0);
  for(const k of order){
    const lo=cum.slice(),hi=cum.map((v,i)=>v+data[i].c[k]);
    let pts=hi.map((v,i)=>`${(pl+i*step).toFixed(1)},${y(v).toFixed(1)}`);
    for(let i=N-1;i>=0;i--)pts.push(`${(pl+i*step).toFixed(1)},${y(lo[i]).toFixed(1)}`);
    polys+=`<polygon points="${pts.join(' ')}" fill="${STM[k].c}" fill-opacity=".85" stroke="${STM[k].c}" stroke-width=".6"/>`;
    hi.forEach((v,i)=>cum[i]=v);
  }
  let grid='';const ys=Math.max(1,Math.ceil(max/5));
  for(let v=0;v<=max;v+=ys)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f4"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const tx=`<g transform="translate(0,${H-8})">${xTicks(d0,N,W,pl,step)}</g>`;
  let today='';const ti=dn(TODAY)-d0;if(ti>=0&&ti<N)today=`<line x1="${pl+ti*step}" x2="${pl+ti*step}" y1="${pt}" y2="${H-pb}" stroke="#111a2e" stroke-dasharray="4 3"/><text x="${pl+ti*step-4}" y="${pt+10}" text-anchor="end" style="fill:#111a2e;font-weight:600">${_t('today')}</text>`;
  chartData[id]={type:'cfd',data,order,pl,step,W,N};
  return `<svg viewBox="0 0 ${W} ${H}" data-chart="${id}">${grid}${polys}${today}${tx}<line class="hov" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#111a2e" stroke-width="1" style="display:none"/></svg><div class="tip"></div>`;
}
function lineSVG(id,from,to,series,opt={}){
  const d0=dn(from),d1=dn(to),N=Math.max(2,d1-d0+1);
  const W=920,H=opt.h||260,pl=40,pr=12,pt=12,pb=26,step=(W-pl-pr)/(N-1);
  const max=opt.max||Math.max(1,...series.flatMap(s=>s.v.filter(v=>v!=null)))*1.08;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let grid='';const ys=opt.ystep||Math.max(1,Math.ceil(max/5));
  for(let v=0;v<=max+0.01;v+=ys)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f4"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${r0(v)}${opt.suf||''}</text>`;
  let paths='';
  for(const s of series){let d='',on=false;s.v.forEach((v,i)=>{if(v==null){on=false;return;}d+=(on?'L':'M')+(pl+i*step).toFixed(1)+','+y(v).toFixed(1);on=true;});
    paths+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;}
  const tx=`<g transform="translate(0,${H-8})">${xTicks(d0,N,W,pl,step)}</g>`;
  let today='';const ti=dn(TODAY)-d0;if(ti>=0&&ti<N)today=`<line x1="${pl+ti*step}" x2="${pl+ti*step}" y1="${pt}" y2="${H-pb}" stroke="#111a2e" stroke-dasharray="4 3"/>`;
  chartData[id]={type:'line',series,d0,pl,step,W,N,suf:opt.suf||''};
  return `<svg viewBox="0 0 ${W} ${H}" data-chart="${id}">${grid}${today}${paths}${tx}<line class="hov" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#111a2e" style="display:none"/></svg><div class="tip"></div>`;
}
function barsSVG(labels,vals,color,suf){suf=suf||'';
  const W=920,H=220,pl=30,pr=10,pt=14,pb=26,n=vals.length||1,bw=(W-pl-pr)/n;
  const max=Math.max(1,...vals)*1.15,y=v=>pt+(H-pt-pb)*(1-v/max);
  let s='';vals.forEach((v,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${H-pb-y(v)}" rx="3" fill="${Array.isArray(color)?color[i]:color}"/>`+(v?`<text x="${x+w/2}" y="${y(v)-4}" text-anchor="middle" style="fill:#344054;font-weight:600">${v}${suf}</text>`:'')+`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#d0d5dd"/>${s}</svg>`;
}
function bindCharts(){
  document.querySelectorAll('svg[data-chart]').forEach(svg=>{
    const cd=chartData[svg.dataset.chart];if(!cd)return;
    const tip=svg.parentElement.querySelector('.tip'),hov=svg.querySelector('.hov');
    svg.addEventListener('mousemove',e=>{
      const rc=svg.getBoundingClientRect(),xr=(e.clientX-rc.left)/rc.width*cd.W;
      const i=Math.max(0,Math.min(cd.N-1,Math.round((xr-cd.pl)/cd.step)));
      const x=cd.pl+i*cd.step;hov.setAttribute('x1',x);hov.setAttribute('x2',x);hov.style.display='';
      let html;
      if(cd.type==='cfd'){const p=cd.data[i];html=`<b>${fmtL(p.d)}</b><br>`+[...cd.order].reverse().map(k=>`<i style="background:${STM[k].c}"></i>${STM[k].l}: ${p.c[k]}`).join('<br>');}
      else{html=`<b>${fmtL(iso(cd.d0+i))}</b><br>`+cd.series.map(s=>`<i style="background:${s.c}"></i>${s.n}: ${s.v[i]==null?'—':r1(s.v[i])+cd.suf}`).join('<br>');}
      tip.innerHTML=html;tip.style.display='block';
      const px=x/cd.W*rc.width;tip.style.left=(px>rc.width*.65?px-tip.offsetWidth-12:px+12)+'px';tip.style.top='10px';
    });
    svg.addEventListener('mouseleave',()=>{tip.style.display='none';hov.style.display='none';});
  });
}
function sCurve(id,h){
  const P=S.project;const from=minDate(),to=maxDate();const N=dn(to)-dn(from)+1;
  const plan=[],real=[];
  for(let i=0;i<N;i++){const d=iso(dn(from)+i);const m=metricsAt(d);plan.push(m.planned);real.push(dn(d)<=dn(TODAY)?m.actual:null);}
  return lineSVG(id,from,to,[{n:_t('sc.plan'),c:'#98a2b3',v:plan,dash:'6 4'},{n:_t('sc.actual'),c:'#3b5bdb',v:real,w:3}],{max:100,ystep:20,suf:'%',h});
}
function minDate(){let m=S.project.start;S.tasks.forEach(t=>{if(t.start<m)m=t.start;if(t.history[0].d<m)m=t.history[0].d;});return m;}
function maxDate(){let m=S.project.end;S.tasks.forEach(t=>{if(t.end>m)m=t.end;});if(TODAY>m)m=TODAY;return m;}

function curMeeting(){let m=S.meetings.find(m=>m.id===UI.meetingId);if(!m&&S.meetings.length){m=[...S.meetings].sort((a,b)=>a.date<b.date?1:-1)[0];UI.meetingId=m.id;}return m;}
function prevMeeting(m){return S.meetings.filter(x=>x.date<m.date||(x.date===m.date&&x.id!==m.id&&S.meetings.indexOf(x)<S.meetings.indexOf(m))).sort((a,b)=>a.date<b.date?1:-1)[0];}
function fuCtx(m,all){
  const pm=prevMeeting(m);
  const mA=metricsAt(m.date),mP=pm?metricsAt(pm.date):null;
  const dP=mP?mA.actual-mP.actual:null,dPl=mP?mA.planned-mP.planned:null;
  const doneBetween=pm?S.tasks.filter(t=>{const a=statusAt(t,pm.date),b=statusAt(t,m.date);return b&&b.s==='done'&&(!a||a.s!=='done');}):[];
  const spiA=mA.planned>0.5?mA.actual/mA.planned:null,spiP=mP&&mP.planned>0.5?mP.actual/mP.planned:null;
  const md=dn(m.date);
  const upd=new Set(m.updates.map(u=>u.taskId));
  const rows=sortedTasks().filter(t=>all||upd.has(t.id)||(()=>{const h=statusAt(t,m.date);const s=h?h.s:t.status;return s!=='done'&&(isActive(s)||dn(t.start)<=md+14);})());
  const prevActions=S.meetings.filter(x=>x.id!==m.id&&x.date<=m.date).flatMap(x=>x.actions.filter(a=>!a.done).map(a=>({a,x})));

function parseDateAny(s){s=(s||'').trim();let m;if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;return `${y}-${pad(+m[2])}-${pad(+m[1])}`;}return null;}
function parseStatus(s){s=(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();if(!s)return null;
  if(/conclu|done|feito|finaliz|entregue|complet|termin|finish|closed|^ok$/.test(s))return 'done';if(/bloq|block|imped|blocc/.test(s))return 'blocked';if(/revis|review|valida|homolog/.test(s))return 'review';
  if(/andamento|doing|progress|execu|iniciad|in corso|en curso|curso|started/.test(s))return 'doing';if(/backlog/.test(s))return 'backlog';if(/fazer|todo|to do|pendente|nao inic|planejad|da fare|por hacer|planned|not started/.test(s))return 'todo';return null;}
function parseImport(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());const out=[],errors=[];
  if(!lines.length)return {tasks:out,errors};
  const sep=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  lines.forEach((l,i)=>{const c=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));
    const st=parseDateAny(c[3]),en=parseDateAny(c[4]);
    if(!st||!en){if(i===0)return;errors.push(_t('ip.eDates',i+1));return;}
    if(!c[0]){errors.push(_t('ip.eTitle',i+1));return;}
    const s=parseStatus(c[5])||'todo';let p=parseInt((c[6]||'').replace('%',''))||0;if(s==='done')p=100;
    out.push({title:c[0],phase:c[1]||'',owner:c[2]||'',start:st<=en?st:en,end:st<=en?en:st,status:s,progress:p,milestone:/^(s|sim|si|sì|sí|x|y|yes|1|true)$/i.test(c[7]||''),_deps:c[8]||'',_line:i+1});
  });
  // predecessoras
  const splitter=new RegExp('['+['|',',',';'].filter(ch=>ch!==sep).map(ch=>'\\'+ch).join('')+']+');
  const TY={FS:'FS',SS:'SS',FF:'FF',TI:'FS',II:'SS',TT:'FF'};
  out.forEach((t,ix)=>{
    t.depRefs=[];
    String(t._deps).split(splitter).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
      const m=tok.replace(/\s+/g,'').match(/^(#?)(\d+)(FS|SS|FF|TI|II|TT)?([+-]\d+)?(d|dias?)?$/i);
      if(!m){errors.push(_t('ip.eDep',t._line,tok));return;}
      const ref={existing:!!m[1],n:+m[2],type:TY[(m[3]||'FS').toUpperCase()],lag:m[4]?+m[4]:0};
      if(!ref.existing&&(ref.n<1||ref.n>out.length||ref.n===ix+1)){errors.push(_t('ip.eDepRange',t._line,tok));return;}
      t.depRefs.push(ref);
    });
  });
  return {tasks:out,errors};
}
function doImport(){

/* ---------- Trava de salvamento no SharePoint / OneDrive ---------- */
function detectSharePoint(){
  const host=(location.hostname||'').toLowerCase();
  const webHosts=[/\.sharepoint\.com$/,/\.sharepoint\.us$/,/\.sharepoint\.cn$/,/\.sharepoint\.de$/,/\.sharepoint-df\.com$/,/(^|\.)onedrive\.live\.com$/,/(^|\.)1drv\.ms$/,/\.officeapps\.live\.com$/,/\.svc\.ms$/];
  if(webHosts.some(r=>r.test(host)))return {kind:'web',where:host};
  // aberto dentro de uma visualização do SharePoint (iframe / pré-visualização)
  let ctx='';try{ctx+=' '+(document.referrer||'');}catch(e){}
  try{if(location.ancestorOrigins)ctx+=' '+[...location.ancestorOrigins].join(' ');}catch(e){}
  ctx=ctx.toLowerCase();
  const m=ctx.match(/https?:\/\/([^\/\s]*(sharepoint(-df)?\.(com|us|cn|de)|onedrive\.live\.com))/);
  if(m)return {kind:'web',where:m[1]};
  // pasta sincronizada do SharePoint/OneDrive aberta localmente (file://)
  if(location.protocol==='file:'){
    let p='';try{p=decodeURIComponent(location.pathname).toLowerCase();}catch(e){p=location.pathname.toLowerCase();}
    if(/\/onedrive - [^\/]+\//.test(p)||/\/cloudstorage\/onedrive-[^\/]+\//.test(p)||/\/sharepoint( - [^\/]+)?\//.test(p)||/\/[^\/]+ - (documentos|documentos compartilhados|documents|shared documents)\//.test(p))
      return {kind:'sync',where:decodeURIComponent(location.pathname).split('/').slice(0,-1).join('/')};
  }
  return null;
}

const kidsN=(el,n)=>el?[...el.children].filter(c=>c.localName===n):[];
const kidN=(el,n)=>kidsN(el,n)[0];
const ktx=(el,n)=>{const k=kidN(el,n);return k?k.textContent.trim():'';};
function importFile(file){
  const name=(file.name||'').toLowerCase(),ext=name.includes('.')?name.split('.').pop():'';
  if(['mpp','mpt','mpx','pod'].includes(ext)){modal(`<h3>${_t('im.binTitle')}</h3><p>${_t('im.bin',esc(file.name))}</p><div class="row"><span class="spacer"></span><button class="btn" data-act="close">${_t('close')}</button></div>`);return;}
  const rd=new FileReader();
  rd.onerror=()=>toast(_t('im.readErr'));
  rd.onload=()=>{
    const txt=String(rd.result).replace(/^﻿/,''),head=txt.trimStart().charAt(0);
    try{
      if(ext==='json'||head==='{'){importJsonText(txt);return;}
      if(ext==='csv'||ext==='txt'){openImport(txt);return;}
      if(head==='<'){
        const doc=new DOMParser().parseFromString(txt,'application/xml');
        if(doc.getElementsByTagName('parsererror').length){toast(_t('im.badXml'));return;}
        const root=doc.documentElement;
        if(root.localName==='Project'&&(root.namespaceURI||'').indexOf(XNS)===0){openExtImport(parseMspdi(root),file.name);return;}
        if(root.localName==='project'&&kidN(root,'tasks')){openExtImport(parseGan(root),file.name);return;}
        toast(_t('im.unknownXml'));return;
      }
      toast(_t('im.unknown'));
    }catch(e){console.error(e);toast(_t('im.fail'));}
  };
  rd.readAsText(file);
}
function importJsonText(txt){

  if(d.tasks.some(t=>!t||typeof t.id!=='string'||typeof t.start!=='string'||typeof t.end!=='string')){toast(_t('im.badTasks'));return;}
  const n=d.tasks.length,nm=(d.meetings||[]).length;
  if(S&&!confirm(_t('im.confirm',d.project.name||'—',_p(n,'task'),_p(nm,'meeting'),d.export&&d.export.at?_t('im.exportedAt',fmtDT(d.export.at)):'')))return;
  delete d.app;delete d.exportedAt;delete d.export;

}
/* registra avisos agrupados por tipo */
function warnBag(){const m=new Map();return {add(k,...a){const e=m.get(k)||{n:0,a};e.n++;m.set(k,e);},list(){return [...m.entries()].map(([k,e])=>_t(k,e.n,...e.a));}};}
const datePart=s=>(s||'').slice(0,10);
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s);
function parseMspdi(root){
  const W=warnBag(),mpd=+ktx(root,'MinutesPerDay')||480;
  let statusField=null;
  kidsN(kidN(root,'ExtendedAttributes'),'ExtendedAttribute').forEach(a=>{const al=(ktx(a,'Alias')||'').toLowerCase();if(/^(status|estado|stato|situa)/.test(al))statusField=ktx(a,'FieldID');});

    links:kidsN(el,'PredecessorLink').map(l=>({uid:ktx(l,'PredecessorUID'),type:ktx(l,'Type')===''?1:+ktx(l,'Type'),lag:+ktx(l,'LinkLag')||0,fmt:+ktx(l,'LagFormat')||7})),
    ext:Object.fromEntries(kidsN(el,'ExtendedAttribute').map(x=>[ktx(x,'FieldID'),ktx(x,'Value')]))}));
  const byOutline=new Map(raw.filter(r=>r.outline).map(r=>[r.outline,r])),byUid=new Map(raw.map(r=>[r.uid,r]));
  const resName=new Map(kidsN(kidN(root,'Resources'),'Resource').map(r=>[ktx(r,'UID'),ktx(r,'Name')]));
  const own=new Map();kidsN(kidN(root,'Assignments'),'Assignment').forEach(a=>{const n=resName.get(ktx(a,'ResourceUID'));if(!n)return;const k=ktx(a,'TaskUID');if(!own.has(k))own.set(k,[]);if(!own.get(k).includes(n))own.get(k).push(n);});
  const proj0=raw.find(r=>r.uid==='0'||r.level===0);
  const leaves=raw.filter(r=>!r.isNull&&r!==proj0&&!r.summary&&r.name!=='');
  const tasks=[];
  leaves.forEach(r=>{
    let s=datePart(r.start),e=datePart(r.finish);
    if(!isDate(s)||!isDate(e)){W.add('im.wNoDates');return;}
    if(r.ms)e=s;else{const tm=(r.finish.slice(11,16)||'17:00');if(tm<='08:00'&&e>s)e=addD(e,-1);if(e<s)e=s;}
    let phase='';if(r.level>1&&r.outline){const top=byOutline.get(r.outline.split('.')[0]);if(top&&top.summary)phase=top.name;}
    const sv=statusField?r.ext[statusField]:r.ext['188743731'];
    let status=parseStatus(sv)||(r.pct>=100||r.af?'done':r.pct>0||r.as?'doing':'todo');
    tasks.push({key:r.uid,title:r.name,phase,owner:(own.get(r.uid)||[]).join(', '),start:s,end:e,milestone:r.ms,progress:status==='done'?100:Math.round(r.pct),status,notes:r.notes,actualStart:r.as,actualFinish:r.af,
      deps:r.links.map(l=>{const p=byUid.get(l.uid);if(!p){W.add('im.wPred');return null;}if(p.summary){W.add('im.wSumLink');return null;}
        const type={0:'FF',1:'FS',3:'SS'}[l.type];if(!type){W.add('im.wSF');return null;}
        let lag;if([19,20].includes(l.fmt)){W.add('im.wPctLag');lag=0;}else if([4,6,8,10,12].includes(l.fmt))lag=Math.round(l.lag/14400);else lag=Math.round(l.lag/(10*mpd));
        return {key:l.uid,type,lag};}).filter(Boolean)});
  });
  if(raw.some(r=>r.summary&&r!==proj0&&r.links.length))W.add('im.wSumLink');
  const starts=tasks.map(t=>t.start).sort(),ends=tasks.map(t=>t.end).sort();
  const pStart=datePart(ktx(root,'StartDate'));
  const name=ktx(root,'Title')||(proj0&&proj0.name)||ktx(root,'Name').replace(/\.xml$/i,'');
  return {source:'MS Project XML',warnings:W.list(),tasks,project:{name,manager:ktx(root,'Manager'),description:proj0?proj0.notes:'',
    start:isDate(pStart)&&(!starts.length||pStart<=starts[0])?pStart:(starts[0]||TODAY),end:(proj0&&isDate(proj0.deadline)?proj0.deadline:null)||ends[ends.length-1]||TODAY}};
}
function parseGan(root){
  const W=warnBag(),tasksEl=kidN(root,'tasks');
  const wk=kidN(kidN(kidN(root,'calendars'),'day-types'),'default-week');
  const work=[0,1,2,3,4,5,6].map(d=>wk?(+wk.getAttribute(['sun','mon','tue','wed','thu','fri','sat'][d])||0)===0:(d!==0&&d!==6));

  const props={};kidsN(kidN(tasksEl,'taskproperties'),'taskproperty').forEach(p=>{props[p.getAttribute('id')]=(p.getAttribute('name')||'').toLowerCase();});
  const resName=new Map(kidsN(kidN(root,'resources'),'resource').map(r=>[r.getAttribute('id'),r.getAttribute('name')||'']));
  const own=new Map();kidsN(kidN(root,'allocations'),'allocation').forEach(a=>{const n=resName.get(a.getAttribute('resource-id'));if(!n)return;const k=a.getAttribute('task-id');if(!own.has(k))own.set(k,[]);if(!own.get(k).includes(n))own.get(k).push(n);});

    kidsN(t,'depend').forEach(d=>{const s=d.getAttribute('id');if(!preds.has(s))preds.set(s,[]);preds.get(s).push({key:id,type:+d.getAttribute('type')||2,lag:+d.getAttribute('difference')||0,parent:ch.length>0});});
    if(ch.length){walk(t,top==null?t.getAttribute('name')||'':top);return;}
    all.push({el:t,id,top});});};
  walk(tasksEl,null);
  const leafSet=new Set(all.map(x=>x.id));preds.forEach((arr,sid)=>{if(!leafSet.has(sid))arr.forEach(()=>W.add('im.wSumLink'));});
  const leafIds=new Set(all.map(a=>a.id));
  const tasks=all.map(({el,id,top})=>{
    const s=el.getAttribute('start'),dur=+el.getAttribute('duration')||0,ms=el.getAttribute('meeting')==='true'||dur===0;
    if(!isDate(s)){W.add('im.wNoDates');return null;}
    const pct=+el.getAttribute('complete')||0;
    let sv='';kidsN(el,'customproperty').forEach(c=>{if(/^(status|estado|stato|situa)/.test(props[c.getAttribute('taskproperty-id')]||''))sv=c.getAttribute('value');});
    const status=parseStatus(sv)||(pct>=100?'done':pct>0?'doing':'todo');

      deps:(preds.get(id)||[]).map(p=>{if(p.parent||!leafIds.has(p.key)){W.add('im.wSumLink');return null;}const type={1:'SS',2:'FS',3:'FF'}[p.type];if(!type){W.add('im.wSF');return null;}return {key:p.key,type,lag:p.lag};}).filter(Boolean)};
  }).filter(Boolean);
  const starts=tasks.map(t=>t.start).sort(),ends=tasks.map(t=>t.end).sort();
  const desc=kidN(root,'description');
  return {source:'GanttProject',warnings:W.list(),tasks,project:{name:root.getAttribute('name')||'',manager:'',description:desc?desc.textContent.trim():'',start:starts[0]||TODAY,end:ends[ends.length-1]||TODAY}};
}

/* histórico mínimo coerente com o status e as datas reais do arquivo */
function histFor(r){
  const p=r.status==='done'?100:r.progress,st=r.status;
  const started=r.actualStart&&r.actualStart<=TODAY?r.actualStart:minS(r.start,TODAY);
  const h=[{d:minS(minS(r.start,started),TODAY),s:'todo',p:0}];
  const put=e=>{const i=h.findIndex(x=>x.d===e.d);if(i>=0)h[i]=e;else h.push(e);};
  if(st==='done'){put({d:started,s:'doing',p:0});put({d:r.actualFinish&&r.actualFinish<=TODAY?(r.actualFinish<started?started:r.actualFinish):minS(r.end<started?started:r.end,TODAY),s:'done',p:100});}
  else if(st!=='todo'&&st!=='backlog'){put({d:started,s:'doing',p:started===TODAY?p:0});put({d:TODAY,s:st,p});}
  else if(st==='backlog')put({d:h[0].d,s:'backlog',p:0});
  return h.sort(cmpH);
}
