<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truco Gaúcho · Giovani Perotto Mesquita</title>
<meta name="description" content="Truco Gaúcho, ou truco cego: jogo de cartas com baralho espanhol, envido, flor e truco, seguindo o regulamento da Confederação Brasileira da Tradição Gaúcha. Contra o computador, em duplas ou trios. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#1E3A2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17281F; --felt: #24523A; --felt-2: #1C4230; --panel: #FBF4E6; --panel-2: #F0E4CE; --ink: #2A2118; --muted: #6E5F4E; --line: #DCCBAE;
    --accent: #A9371E; --accent-ink: #FFFFFF; --gold: #E5A93C; --us: #2C6FB5; --them: #B5402C;
    --sans: "Hanken Grotesk", "Segoe UI", Arial, sans-serif; --serif: "Source Serif 4", Georgia, serif;
    --cw: clamp(62px, 9.2vmin, 104px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --panel: #20302A; --panel-2: #2B3F36; --ink: #F4EDE0; --muted: #B3A897; --line: #3F5349; --accent: #CF5433; --us: #6BA9E8; --them: #EE8872; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100dvh; }
  .stage { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 8px; gap: 8px; }
  .side { display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 8px 0; min-height: 0; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .75rem; }

  /* mesa */
  .table { position: relative; flex: 1; min-height: 340px; border-radius: 22px; background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-2) 80%); border: 6px solid #5B3B22; box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35); overflow: hidden; }
  .seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 3px; transform: translate(-50%, -50%); width: 150px; color: #FFF8EA; text-align: center; }
  .nameplate { font-weight: 700; font-size: .84rem; padding: .12rem .55rem; border-radius: 99px; background: rgba(0,0,0,.42); white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .seat.team0 .nameplate { box-shadow: inset 0 -2px 0 #7DB8F0; }
  .seat.team1 .nameplate { box-shadow: inset 0 -2px 0 #F09A85; }
  .seat.on .nameplate { background: var(--gold); color: #2A2118; }
  .seat.out { opacity: .5; }
  .backs { display: flex; }
  .backs svg { width: calc(var(--cw) * .42); height: calc(var(--cw) * .65); margin-left: calc(var(--cw) * -.2); }
  .backs svg:first-child { margin-left: 0; }
  .slot { position: absolute; width: var(--cw); height: calc(var(--cw) * 1.55); transform: translate(-50%, -50%); }
  .slot .pcard { position: absolute; left: 0; top: 0; }
  .slot.old { margin-left: calc(var(--cw) * -.42 * var(--back)); margin-top: calc(var(--cw) * -.12 * var(--back)); filter: brightness(.72); }
  .pcard { width: var(--cw); height: calc(var(--cw) * 1.55); display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.4)); }
  .slot .pcard.win { filter: drop-shadow(0 0 7px var(--gold)); }
  .bubble { position: absolute; left: 50%; transform: translate(-50%, -100%); top: -4px; background: #FFFDF6; color: #2A2118; font-family: var(--serif); font-weight: 700; padding: .25rem .6rem; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.45); font-size: 1rem; white-space: nowrap; z-index: 6; animation: pop .18s ease-out; }
  .bubble small { display: block; font-family: var(--sans); font-weight: 400; font-size: .72rem; white-space: normal; width: 170px; color: #6E5F4E; }
  @keyframes pop { from { transform: translate(-50%, -80%) scale(.7); opacity: 0; } }
  .vazas { position: absolute; left: 10px; top: 10px; display: flex; gap: 5px; }
  .vaza { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: transparent; }
  .vaza.t0 { background: #7DB8F0; } .vaza.t1 { background: #F09A85; } .vaza.tie { background: #CFC6B2; }
  .stake { position: absolute; right: 10px; top: 10px; color: #FFF8EA; background: rgba(0,0,0,.42); padding: .15rem .6rem; border-radius: 99px; font-weight: 700; font-size: .84rem; }
  /* minha mão */
  .hand { display: flex; justify-content: center; gap: 8px; min-height: calc(var(--cw) * 1.55 + 4px); }
  .hcard { padding: 0; border: 0; background: transparent; border-radius: 9px; transition: transform .1s; }
  .hcard:hover:not(:disabled) { transform: translateY(-8px); }
  .hcard:disabled { opacity: 1; filter: saturate(.75) brightness(.86); }
  .action { min-height: 86px; }
  .action h2 { font-family: var(--serif); font-size: 1.05rem; line-height: 1.2; margin: 0 0 .3rem; }
  .action p { margin: 0 0 .4rem; font-size: .86rem; line-height: 1.3; color: var(--muted); }
  .btns { display: flex; flex-wrap: wrap; gap: .35rem; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: .5rem .72rem; font-weight: 700; font-size: .9rem; min-height: 40px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.sm { padding: .3rem .55rem; font-size: .8rem; min-height: 32px; }
  .mine { font-size: .82rem; color: var(--muted); margin-top: .35rem; }
  .mine b { color: var(--ink); }

  /* placar */
  .score { display: grid; gap: .4rem; }
  .steam { display: grid; grid-template-columns: 1fr auto; gap: .15rem .5rem; align-items: baseline; }
  .steam strong { font-size: .92rem; }
  .steam.t0 strong { color: var(--us); } .steam.t1 strong { color: var(--them); }
  .pts { font-family: var(--serif); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .tentos { grid-column: 1 / -1; display: flex; gap: 2px; }
  .tentos i { flex: 1; height: 8px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); }
  .tentos i.gap { margin-left: 6px; }
  .steam.t0 .tentos i.on { background: var(--us); border-color: var(--us); }
  .steam.t1 .tentos i.on { background: var(--them); border-color: var(--them); }
  .sublabel { font-size: .72rem; color: var(--muted); display: flex; justify-content: space-between; }
  .log { flex: 1; min-height: 80px; overflow: auto; font-size: .82rem; line-height: 1.35; }
  .log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
  .log li { color: var(--muted); }
  .log li:last-child { color: var(--ink); font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: .35rem; }

  /* telas */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; overflow: auto; z-index: 20; background: var(--bg); }
  .sheet, dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 1.2rem clamp(1rem, 4vw, 1.8rem); box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  .sheet { width: min(100%, 620px); }
  dialog { width: min(94vw, 640px); max-height: 90dvh; overflow: auto; }
  dialog::backdrop { background: rgba(5, 15, 10, .65); }
  .back { font-size: .85rem; color: var(--accent); text-decoration: none; }
  .hero { width: 100%; height: 170px; border-radius: 12px; display: block; margin: .6rem 0; }
  .sheet h1 { font-family: var(--serif); font-size: clamp(2.1rem, 7vw, 3rem); line-height: 1.05; margin: .2rem 0 .3rem; }
  .tag { font-family: var(--serif); font-size: 1.1rem; color: var(--accent); margin: 0 0 .4rem; font-weight: 600; }
  .sheet p { line-height: 1.45; margin: .3rem 0; font-size: .95rem; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .8rem; align-items: end; }
  .field { display: grid; gap: .2rem; font-size: .8rem; color: var(--muted); }
  select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .5rem; color: var(--ink); min-height: 38px; }
  dialog h2 { font-family: var(--serif); margin: 0 0 .6rem; font-size: 1.4rem; }
  dialog h3 { font-size: 1rem; margin: 1rem 0 .35rem; }
  .rules { padding-left: 1.1rem; margin: 0; display: grid; gap: .4rem; line-height: 1.4; font-size: .93rem; }
  .ladder { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .ladder .pcard { --cw: 46px; width: 46px; height: 71px; }
  .step { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 7px; background: var(--panel-2); }
  .step small { font-size: .78rem; font-weight: 700; color: var(--muted); padding: 0 2px; }
  .ladnote { width: 100%; margin: .3rem 0 0; font-size: .82rem; color: var(--muted); }
  .sumline { display: flex; justify-content: space-between; gap: 1rem; padding: .32rem .45rem; background: var(--panel-2); border-radius: 7px; font-size: .92rem; margin-bottom: .25rem; }
  .reveal { display: flex; flex-wrap: wrap; gap: .8rem; margin: .5rem 0; }
  .reveal div { font-size: .78rem; color: var(--muted); }
  .reveal .cards { display: flex; gap: 3px; }
  .reveal .pcard { width: 52px; height: 81px; }
  .art2 { width: 100%; height: 130px; border-radius: 10px; display: block; margin-bottom: .6rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 100dvh; }
    .stage { padding: 4px; }
    .table { min-height: 290px; height: 44dvh; flex: none; }
    .action { order: -1; }
    .side { padding: 0 4px 12px; }
    .log { max-height: 200px; flex: none; }
    :root { --cw: clamp(58px, 17vw, 96px); }
    .seat { width: 110px; }
    .nameplate { font-size: .74rem; }
  }
  @media (prefers-reduced-motion: reduce) { .hcard { transition: none; } .bubble { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <main class="stage">
    <div class="table" id="table" role="group" aria-label="Mesa"></div>
    <div class="hand" id="hand" role="group"></div>
  </main>
  <aside class="side">
    <section class="box score" id="score"></section>
    <section class="box action" id="action" aria-live="polite"></section>
    <section class="box log" aria-label="Histórico"><ol id="log"></ol></section>
    <div class="bar">
      <button type="button" class="btn sm" id="bRules" data-t="rules"></button>
      <button type="button" class="btn sm" id="bSound"></button>
      <button type="button" class="btn sm" id="bSpeed"></button>
      <button type="button" class="btn sm" id="bMenu" data-t="menu"></button>
    </div>
  </aside>
</div>

<section class="overlay" id="ovTitle" aria-labelledby="ttl">
  <div class="sheet">
    <a class="back" id="backLink" href="projects.html" data-t="back"></a>
    <svg class="hero" id="heroArt" viewBox="0 0 620 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <h1 id="ttl" data-t="name"></h1>
    <p class="tag" data-t="tagline"></p>
    <p data-t="story"></p>
    <div class="row">
      <label class="field"><span data-t="tableSize"></span>
        <select id="sizeSel"><option value="1" data-t="size1"></option><option value="2" data-t="size2"></option><option value="3" data-t="size3"></option></select></label>
      <label class="field"><span data-t="level"></span>
        <select id="levelSel"><option value="0" data-t="easy"></option><option value="1" data-t="medium"></option><option value="2" data-t="hard"></option></select></label>
      <label class="field"><span data-t="duration"></span>
        <select id="durSel"><option value="1" data-t="dur1"></option><option value="3" data-t="dur3"></option></select></label>
      <label class="field"><span data-t="lang"></span>
        <select id="langSel"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
    </div>
    <div class="row">
      <button type="button" class="btn pri" id="bPlay" data-t="play"></button>
      <button type="button" class="btn" id="bResume" data-t="resume" hidden></button>
      <button type="button" class="btn" id="bRules2" data-t="rules"></button>
    </div>
  </div>
</section>

<dialog id="dRules" aria-labelledby="rulesH"><h2 id="rulesH" data-t="rulesTitle"></h2><h3 data-t="ladderTitle"></h3><div class="ladder" id="ladder"></div><div id="rulesBody"></div><div class="row"><button type="button" class="btn pri" id="bRulesClose" data-t="close"></button></div></dialog>
<dialog id="dHand" aria-labelledby="handH"></dialog>

<script>
// Motor do truco cego, conforme o regulamento da CBTG. Estado em JSON puro, sem nada de tela.
function Engine() {
  const SUITS = ['e', 'b', 'c', 'o'], RANKS = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12], TARGET = 24;
  const DECK = []; SUITS.forEach((s) => RANKS.forEach((r) => DECK.push(r + s)));
  const rankOf = (c) => parseInt(c, 10), suitOf = (c) => c[c.length - 1];
  // hierarquia do regulamento, art. XVI
  function power(c) {
    if (c === '1e') return 14; if (c === '1b') return 13; if (c === '7e') return 12; if (c === '7o') return 11;
    const r = rankOf(c);
    if (r === 3) return 10; if (r === 2) return 9; if (r === 1) return 8; if (r === 12) return 7; if (r === 11) return 6; if (r === 10) return 5; if (r === 7) return 4; if (r === 6) return 3; if (r === 5) return 2;
    return 1;
  }
  const pts = (c) => { const r = rankOf(c); return r <= 7 ? r : 0; };
  // envido: duas do mesmo naipe somam 20; sem par, vale a maior branca; só negras, Rei > Cavalo > Sota, abaixo do Ás
  function envidoOf(hand) {
    let best = -1;
    for (let a = 0; a < hand.length; a++) for (let b = a + 1; b < hand.length; b++) if (suitOf(hand[a]) === suitOf(hand[b])) best = Math.max(best, 20 + pts(hand[a]) + pts(hand[b]));
    if (best >= 0) return best;
    const w = Math.max(...hand.map(pts));
    if (w > 0) return w;
    const r = Math.max(...hand.map(rankOf));
    return r === 12 ? 0.3 : r === 11 ? 0.2 : 0.1;
  }
  const isFlor = (hand) => hand.length === 3 && hand.every((c) => suitOf(c) === suitOf(hand[0]));
  const florOf = (hand) => 20 + hand.reduce((t, c) => t + pts(c), 0);

  function rnd(S) { S.seed = (S.seed + 0x6D2B79F5) | 0; let t = Math.imul(S.seed ^ (S.seed >>> 15), 1 | S.seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const log = (S, k, v) => { S.log.push({ k, v: v || {} }); if (S.log.length > 300) S.log.shift(); };
  const say = (S, seat, k) => { S.fx.push({ t: 'say', seat, k }); };
  const teamOf = (s) => s % 2;
  const seats = (S) => Array.from({ length: S.n }, (_, i) => i);
  const posFromMao = (S, s) => (s - S.mao + S.n) % S.n;
  const falta = (S) => TARGET - Math.max(S.scores[0], S.scores[1]);
  const playedThisHand = (S, s) => S.played.some((t) => t.some((p) => p.seat === s));
  const inTrick = (S, s) => S.played[S.trick].some((p) => p.seat === s);

  function newGame({ players, bestOf, seed }) {
    const n = players.length;
    const S = { n, players: players.map((p) => ({ name: p.name, kind: p.kind })), scores: [0, 0], matches: [0, 0], bestOf: bestOf || 1, seed: seed == null ? (Date.now() | 0) : seed, mao: 0, handNo: 0, log: [], fx: [], over: null, matchWinner: null };
    S.mao = Math.floor(rnd(S) * n);
    deal(S);
    return S;
  }
  function deal(S) {
    const d = DECK.slice();
    for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
    S.hands = seats(S).map((s) => d.slice(s * 3, s * 3 + 3));
    S.initial = S.hands.map((h) => h.slice());
    S.played = [[], [], []]; S.trick = 0; S.results = []; S.folded = new Array(S.n).fill(false); S.turn = S.mao; S.leader = S.mao;
    S.tr = { level: 1, by: -1 }; S.trPending = null; S.env = null; S.envDone = false; S.fl = null; S.florDone = false; S.florAny = false; S.deferred = null;
    S.sum = []; S.reveal = []; S.handWinner = null; S.handNo++; S.matchWinner = null; S.phase = 'play';
    log(S, 'handStart', { p: S.mao });
    beginTurn(S);
  }

  // ---------------------------------------------------------------- pontos
  function add(S, team, n, key, extra) {
    const before = S.scores[team];
    S.scores[team] = Math.min(TARGET, before + n);
    S.sum.push({ team, n, key });
    log(S, 'scored', Object.assign({ team, n, why: key }, extra));
    if (S.scores[team] >= TARGET && S.matchWinner == null) { S.matchWinner = team; closeHand(S); return true; }
    return false;
  }
  function closeHand(S) {
    S.phase = 'handEnd'; S.trPending = null; S.env = null; S.fl = null;
  }
  function finishHand(S, winner, why, value) {
    S.handWinner = winner;
    if (S.deferred) {
      // flor e flor: mostram-se os pontos ao fim da volta e o maior leva a soma
      const d = S.deferred; S.deferred = null;
      const w = bestTeam(S, d.sung, florVal);
      addReveal(S, d.sung);
      if (add(S, w, 3 * d.sung.length, 'florFlor')) return;
    }
    if (winner != null && value > 0) { if (add(S, winner, value, why)) return; }
    closeHand(S);
  }
  const florVal = (S, s) => florOf(S.initial[s]);
  const envVal = (S, s) => envidoOf(S.initial[s]);
  function bestTeam(S, list, fn) {
    // em igualdade, ganha o mão: quem joga primeiro na ordem da volta
    return teamOf(list.slice().sort((a, b) => fn(S, b) - fn(S, a) || posFromMao(S, a) - posFromMao(S, b))[0]);
  }
  function addReveal(S, list) { list.forEach((s) => { if (!S.reveal.includes(s)) S.reveal.push(s); }); }

  // ---------------------------------------------------------------- flor
  function florQueue(S, from) {
    const out = [];
    for (let k = 0; k < S.n; k++) {
      const s = (from + k) % S.n;
      if (!S.folded[s] && !playedThisHand(S, s) && isFlor(S.initial[s]) && !(S.fl && (S.fl.sung.includes(s) || S.fl.achic.includes(s)))) out.push(s);
    }
    return out;
  }
  function startFlor(S, from) {
    const q = S.florDone ? [] : florQueue(S, from);
    if (!q.length) return false;
    S.env = null; S.envDone = true; // a flor anula o envido
    S.florAny = true;
    S.fl = { queue: q, sung: [], achic: [], level: 0, prop: -1, hadContra: false, accepted: false, refused: -1 };
    S.phase = 'flor';
    return true;
  }
  function florChoices(S, s) {
    const f = S.fl, T = teamOf(s), O = 1 - T, oppSung = f.sung.some((x) => teamOf(x) === O);
    if (f.level > 0 && f.prop === O) return f.level === 1 ? ['quero', 'resto', 'nao'] : ['quero', 'nao'];
    if (f.level > 0) return ['flor'];
    return oppSung ? ['flor', 'contra', 'resto', 'achico'] : ['flor', 'resto', 'achico'];
  }
  function responderIn(S, team, from) {
    const list = seats(S).filter((s) => teamOf(s) === team && !S.folded[s]);
    const h = list.find((s) => S.players[s].kind === 'human');
    if (h !== undefined) return h;
    for (let k = 1; k <= S.n; k++) { const s = (from + k) % S.n; if (list.includes(s)) return s; }
    return list[0];
  }
  function florAct(S, k) {
    const f = S.fl, s = f.queue[0], T = teamOf(s);
    if (!florChoices(S, s).includes(k)) return false;
    f.queue.shift();
    const push = () => { if (!f.sung.includes(s)) f.sung.push(s); };
    if (k === 'flor') { push(); say(S, s, 'flor'); log(S, 'sayFlor', { p: s }); }
    else if (k === 'achico') { f.achic.push(s); say(S, s, 'achico'); log(S, 'sayAchico', { p: s }); }
    else if (k === 'contra') { push(); f.level = 1; f.prop = T; f.hadContra = true; say(S, s, 'contra'); log(S, 'sayContra', { p: s }); }
    else if (k === 'resto') { push(); f.level = 2; f.prop = T; say(S, s, 'resto'); log(S, 'sayResto', { p: s }); }
    else if (k === 'quero') { push(); f.accepted = true; say(S, s, 'quero'); log(S, 'sayQuero', { p: s }); }

      rulesHtml: `<h3>La mano</h3><ul class="rules"><li><b>Mazzo:</b> 40 carte spagnole, senza 8 e 9. Ogni giocatore riceve 3 carte. Chi gioca per primo è il <b>mão</b>, e il ruolo passa a ogni mano.</li><li><b>Prese:</b> vince la mano chi fa 2 prese su 3. Chi gioca la carta più alta apre la presa successiva.</li><li><b>Pari:</b> se la 1ª presa è pari, vince chi fa la 2ª. Se la 3ª è pari, vince chi ha fatto la 1ª. Se tutte e tre sono pari, vince il mão.</li><li><b>Obiettivo:</b> la partita arriva a 24 punti: i primi 12 sono le “malas”, i 12 seguenti le “buenas”.</li></ul><h3>Envido</h3><ul class="rules"><li>Si chiama prima di giocare la prima carta. Due carte dello stesso seme sommano i valori più 20. Dall’Asso al 7 vale il numero; Fante, Cavallo e Re non valgono nulla. Senza coppia di seme vale la carta più alta.</li><li><b>Envido:</b> 2 punti se accettato, 1 se rifiutato. <b>Real Envido:</b> 3 se accettato, 1 se rifiutato. <b>Falta Envido:</b> i punti che mancano a chi è in testa per finire la partita.</li><li>I rilanci si sommano: Envido, Envido, Real Envido vale 7 se accettato e 4 se rifiutato. In parità vince il mão.</li></ul><h3>Flor</h3><ul class="rules"><li>Tre carte dello stesso seme: va dichiarata prima di giocare. Vale 3 punti e annulla l’envido. Il suo valore somma le carte più 20.</li><li><b>Flor e flor:</b> a fine mano, la più alta prende 6. <b>Contra-Flor:</b> accettata, 6 subito; rifiutata, 4. <b>Contra-Flor e o Resto:</b> accettata, 6 più quanto manca per finire la partita.</li><li><b>Ritirarsi con flor:</b> protegge una flor debole. Se nessun altro ha flor vale 3; se un avversario la dichiara, prende 4.</li></ul><h3>Truco</h3><ul class="rules"><li><b>Truco:</b> 2 se accettato, 1 se no. <b>Retruco:</b> 3 e 2. <b>Vale Quatro:</b> 4 e 3. Senza truco la mano vale 1.</li><li>L’ordine non cambia e chi ha chiamato non può rilanciare la propria puntata: il rilancio successivo spetta all’altra parte.</li><li><b>Andare al mazzo:</b> la tua parte abbandona la       rulesHtml: `<h3>La mano</h3><ul class="rules"><li><b>Baraja:</b> 40 cartas españolas, sin 8 ni 9. Cada jugador recibe 3 cartas. Quien juega primero es <b>mano</b>, y ese papel pasa en cada mano.</li><li><b>Bazas:</b> gana la mano quien haga 2 bazas de 3. Quien juega la carta más alta sale en la baza siguiente.</li><li><b>Pardas:</b> si la 1ª baza empata, gana quien haga la 2ª. Si empata la 3ª, gana quien hizo la 1ª. Si empatan las tres, gana el mano.</li><li><b>Objetivo:</b> la partida va a 24 tantos: los 12 primeros son las “malas” y los 12 siguientes, las “buenas”.</li></ul><h3>Envido</h3><ul class="rules"><li>Se canta antes de jugar la primera carta. Dos cartas del mismo palo suman sus valores más 20. Del As al 7 vale el número; Sota, Caballo y Rey no valen nada. Sin par de palo, vale la carta más alta.</li><li><b>Envido:</b> 2 tantos si se acepta, 1 si se rechaza. <b>Real Envido:</b> 3 si se acepta, 1 si se rechaza. <b>Falta Envido:</b> los tantos que le faltan a quien va al frente para terminar la partida.</li><li>Los revires se suman: Envido, Envido, Real Envido vale 7 si se acepta y 4 si se rechaza. En empate gana el mano.</li></ul><h3>Flor</h3><ul class="rules"><li>Tres cartas del mismo palo: hay que cantarla antes de jugar. Vale 3 tantos y anula el envido. Su valor suma las cartas más 20.</li><li><b>Flor y flor:</b> al final de la mano, la mayor lleva 6. <b>Contraflor:</b> aceptada, 6 de inmediato; rechazada, 4. <b>Contraflor al Resto:</b> aceptada, 6 más lo que falta para terminar la partida.</li><li><b>Achicarse con flor:</b> protege una flor débil. Si nadie más tiene flor, vale 3; si un adversario canta, lleva 4.</li></ul><h3>Truco</h3><ul class="rules"><li><b>Truco:</b> 2 si se acepta, 1 si no. <b>Retruco:</b> 3 y 2. <b>Vale Cuatro:</b> 4 y 3. Sin truco, la mano vale 1.</li><li>El orden no cambia, y el grupo que pidió no puede subir su propia apuesta: la siguiente subida corresponde al otro lado.</li><li><b>Ir al mazo:</b> tu grupo abandona la mano. Antes de cualquier propuesta, cuesta 2 tantos, 1 de envido y 1 de truco; después, cuesta el valor en juego. Con compañeros, quien se queda sigue jugando.</li></ul><h3>En esta versión</h3><ul class="rules"><li>En parejas y tríos, respondes por tu grupo a las propuestas. El reglamento alterna juego de grupo y “testa” en tríos; aquí siempre se juega en grupo, y el mano a mano equivale a la testa.</li><li>Quedan fuera la Lei do Jogo, el “peço flor”, las señas y las penalidades por canto errado: aquí los cantos son automáticos y siempre correctos, y la flor siempre se declara.</li></ul>`,

  let lang = 'pt';
  const TAG = { pt: 'pt-BR', en: 'en', it: 'it', es: 'es' };
  function fill(s, v) { return s.replace(/\{(\w+)\}/g, (m, k) => (v && v[k] !== undefined ? v[k] : m)); }
  function t(k, v) { const s = I18N[lang][k] !== undefined ? I18N[lang][k] : I18N.pt[k]; return v && typeof s === 'string' ? fill(s, v) : s; }
  function cardName(c) { const R = RANK_NAMES[lang]; return `${R[E.rankOf(c)]} ${R.of} ${SUIT_NAMES[lang][E.suitOf(c)]}`; }
  const CPU = ['Tchê', 'Guria', 'Piá', 'Gaudério', 'Prenda', 'Bagual'];
  const valueName = (v) => (v >= 1 ? String(v) : RANK_NAMES[lang][v === 0.3 ? 12 : v === 0.2 ? 11 : 10]);

  // ---------------------------------------------------------------- estado da tela
  let S = null, fast = false, soundOn = true, busy = false, aiTimer = null, shownTricks = null;
  const save = () => { if (S) Store.set('trucoGaucho.game', Object.assign({}, S, { fx: [] })); };
  const delay = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? Math.min(ms, 80) : (fast ? ms * 0.3 : ms)));
  const pname = (s) => (S.players[s].kind === 'human' ? t('you') : S.players[s].name);
  const teamName = (x) => (x === 0 ? (S.n === 2 ? t('you') : t('us')) : (S.n === 2 ? S.players[1].name : t('them')));
  const human = 0;
  function logText(e) {
    const v = e.v, o = {};
    if ('p' in v) o.p = esc(pname(v.p));
    if ('c' in v) {
      if (e.k === 'played') o.c = cardName(v.c);
      else o.c = I18N[lang].btn[v.c === 'e' ? 'envido' : v.c === 'r' ? 'real' : 'falta'];
    }
    if ('to' in v) o.c = I18N[lang].btn[v.to === 2 ? 'truco' : v.to === 3 ? 'retruco' : 'vale4'];
    if ('n' in v) o.n = v.n;
    if ('v' in v) o.v = valueName(v.v);
    if ('team' in v) { o.t = esc(teamName(v.team)); o.w = I18N[lang].why[v.why]; }
    return fill(I18N[lang].log[e.k] || e.k, o);
  }

  // ---------------------------------------------------------------- mesa
  const SEATPOS = { 2: [[50, 86], [50, 13]], 4: [[50, 86], [87, 50], [50, 13], [13, 50]], 6: [[50, 88], [86, 70], [86, 26], [50, 11], [14, 26], [14, 70]] };
  const SLOTPOS = { 2: [[50, 64], [50, 36]], 4: [[50, 66], [68, 50], [50, 34], [32, 50]], 6: [[50, 68], [68, 60], [68, 40], [50, 32], [32, 40], [32, 60]] };
  function renderTable(bubble) {
    const pos = SEATPOS[S.n], slots = SLOTPOS[S.n], act = E.actor(S);
    let h = `<div class="vazas" aria-hidden="true">${[0, 1, 2].map((i) => { const r = S.results[i]; return `<span class="vaza ${r === 't' ? 'tie' : r === 0 ? 't0' : r === 1 ? 't1' : ''}"></span>`; }).join('')}</div><div class="stake">${t('stake', { n: S.trPending ? `${S.tr.level}→${S.trPending.to}` : S.tr.level })}</div>`;
    const lastTrick = S.played.reduce((m, tr, i) => (tr.length ? i : m), 0);
    S.played.forEach((tr, ti) => {
      if (!tr.length) return;
      const done = ti < S.results.length, top = Math.max(...tr.map((p) => E.power(p.card))), back = lastTrick - ti;
      tr.forEach((p) => { const [x, y] = slots[p.seat]; h += `<div class="slot${back ? ' old' : ''}" style="left:${x}%;top:${y}%;--back:${back}">${cardSvg(p.card, done && !back && E.power(p.card) === top ? 'win' : '')}</div>`; });
    });
    for (let s = 0; s < S.n; s++) {
      const [x, y] = pos[s], partner = s % 2 === 0 && s !== 0;
      h += `<div class="seat team${s % 2}${s === act ? ' on' : ''}${S.folded[s] ? ' out' : ''}" style="left:${x}%;top:${y}%">`;
      if (s !== human) { h += `<div class="backs" aria-hidden="true">${S.hands[s].map(() => backSvg()).join('')}</div>`; }
      h += `<div class="nameplate">${esc(pname(s))}${s === S.mao ? ' ★' : ''}</div>`;
      if (bubble && bubble.seat === s) h += `<div class="bubble">${esc(I18N[lang].calls[bubble.k] || '')}</div>`;
      h += '</div>';
    }
    $('table').innerHTML = h;
  }
  function renderHand() {
    const canPlay = !busy && S.phase === 'play' && E.actor(S) === human;
    $('hand').setAttribute('aria-label', t('you'));
    $('hand').innerHTML = S.hands[human].map((c, i) => `<button type="button" class="hcard" data-i="${i}" ${canPlay ? '' : 'disabled'} aria-label="${esc(cardName(c))}">${cardSvg(c)}</button>`).join('');
  }
  function renderScore() {
    const bar = (x) => Array.from({ length: 24 }, (_, i) => `<i class="${i < S.scores[x] ? 'on' : ''}${i === 12 ? ' gap' : ''}"></i>`).join('');
    $('score').innerHTML = [0, 1].map((x) => `<div class="steam t${x}"><strong>${esc(teamName(x))}</strong><span class="pts">${S.scores[x]}</span><div class="tentos" aria-hidden="true">${bar(x)}</div></div>`).join('') + `<div class="sublabel"><span>${t('malos')}</span>${S.bestOf > 1 ? `<span>${t('partidas', { a: S.matches[0], b: S.matches[1] })}</span>` : ''}<span>${t('buenos')}</span></div>`;
  }
  function renderLog() {
    const ol = $('log');
    ol.innerHTML = S.log.slice(-50).map((e) => `<li>${logText(e)}</li>`).join('');
    ol.parentElement.scrollTop = ol.parentElement.scrollHeight;
  }
  const btn = (attrs, label, cls) => `<button type="button" class="btn ${cls || ''}" ${attrs}>${esc(label)}</button>`;
  function renderAction() {
    const el = $('action'), B = I18N[lang].btn, a = E.actor(S);
    if (S.phase === 'over') { el.innerHTML = `<h2>${t(S.over.winner === 0 ? (S.n === 2 ? 'gameWonYou' : 'gameWonUs') : 'gameLost')}</h2>${btn('data-go="end"', t('again'), 'pri')}`; return; }
    if (S.phase === 'handEnd') { el.innerHTML = `<h2>${t('handEnd')}</h2>${btn('data-go="hand"', t('seeResult'), 'pri')}`; return; }
    if (busy || a !== human) {
      el.innerHTML = `<h2>${a >= 0 ? t('thinking', { p: esc(pname(a)) }) : ''}</h2>${mine()}`;
      return;
    }
    const L = E.legal(S);
    let h = '';
    if (S.phase === 'flor') {
      const v = E.florOf(S.initial[human]);
      h = `<h2>${t('florTitle')}</h2><p>${t('florHint', { v })}</p><div class="btns">`;
      L.forEach((x, i) => { const label = x.k === 'nao' ? B.nao : x.k === 'quero' ? B.quero : B[x.k]; h += btn(`data-fl="${x.k}"`, label, i === 0 ? 'pri' : ''); });
      h += '</div>';
    } else if (S.phase === 'envido') {
      const st = S.env.stack, last = st[st.length - 1], who = pname(S.env.seat);
      h = `<h2>${t('envTitle', { p: esc(who), c: B[last === 'e' ? 'envido' : last === 'r' ? 'real' : 'falta'] })}</h2><p>${t('envHint', { a: E.envValue(S, st), b: E.envRefused(st), v: valueName(E.envidoOf(S.initial[human])) })}</p><div class="btns">${btn('data-a="quero"', B.quero, 'pri')}${btn('data-a="nao"', B.nao)}`;
      L.filter((x) => x.type === 'env').forEach((x) => { h += btn(`data-env="${x.k}"`, B[x.k === 'e' ? 'envido' : x.k === 'r' ? 'real' : 'falta']); });
      h += '</div>';
    } else if (S.phase === 'truco') {
      const to = S.trPending.to;
      h = `<h2>${t('trTitle', { p: esc(pname(S.trPending.seat)), c: B[to === 2 ? 'truco' : to === 3 ? 'retruco' : 'vale4'] })}</h2><p>${t('trHint', { a: to, b: S.tr.level })}</p><div class="btns">${btn('data-a="quero"', B.quero, 'pri')}${btn('data-a="nao"', B.nao)}`;
      if (L.some((x) => x.type === 'raise')) h += btn('data-a="raise"', B[to === 2 ? 'raise3' : 'raise4']);
      L.filter((x) => x.type === 'env').forEach((x) => { h += btn(`data-env="${x.k}"`, B[x.k === 'e' ? 'envido' : x.k === 'r' ? 'real' : 'falta']); });
      h += `</div>${mine()}`;
    } else {
      h = `<h2>${t('yourTurn')}</h2><p>${t('yourTurnH')}</p><div class="btns">`;
      if (L.some((x) => x.type === 'truco')) { const nx = S.tr.level === 1 ? 'truco' : S.tr.level === 2 ? 'retruco' : 'vale4'; h += btn('data-a="truco"', B[nx], 'pri'); }
      L.filter((x) => x.type === 'env').forEach((x) => { h += btn(`data-env="${x.k}"`, B[x.k === 'e' ? 'envido' : x.k === 'r' ? 'real' : 'falta']); });
      h += btn('data-a="fold"', B.fold) + `</div>${mine()}`;
    }
    el.innerHTML = h;
  }
  function mine() {
    const init = S.initial[human];
    if (S.envDone && !E.isFlor(init)) return '';
    return `<p class="mine">${E.isFlor(init) ? t('myFlor', { v: `<b>${E.florOf(init)}</b>` }) : t('myEnvido', { v: `<b>${valueName(E.envidoOf(init))}</b>` })}</p>`;
  }
  function render(bubble) {
    renderTable(bubble); renderHand(); renderScore(); renderLog(); renderAction();
    if (S.phase !== 'handEnd' && S.phase !== 'over' && $('dHand').open) $('dHand').close();
  }
  function showHandDialog() {
    const d = $('dHand'), W = I18N[lang].why;
    let h = `<svg class="art2" viewBox="0 0 600 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${pampa(600, 130, 'h')}</svg>`;
    if (S.phase === 'over') {
      h += `<h2 id="handH">${t(S.over.winner === 0 ? (S.n === 2 ? 'gameWonYou' : 'gameWonUs') : 'gameLost')}</h2>${S.bestOf > 1 ? `<p>${t('gameEnd', { a: S.matches[0], b: S.matches[1] })}</p>` : ''}<div class="sumline"><span>${esc(teamName(0))}</span><strong>${S.scores[0]}</strong></div><div class="sumline"><span>${esc(teamName(1))}</span><strong>${S.scores[1]}</strong></div><div class="row"><button type="button" class="btn pri" data-go="menu">${t('again')}</button><button type="button" class="btn" data-go="close">${t('close')}</button></div>`;
    } else {
      h += `<h2 id="handH">${t('handEnd')}</h2>`;
      if (S.sum.length) S.sum.forEach((x) => { h += `<div class="sumline"><span>${esc(teamName(x.team))}: ${W[x.key]}</span><strong>+${x.n}</strong></div>`; });
      else h += `<p>${t('noPoints')}</p>`;
      if (S.reveal.length) h += `<h3>${t('cardsShown')}</h3><div class="reveal">${S.reveal.map((s) => `<div>${esc(pname(s))}<div class="cards">${S.initial[s].map((c) => cardSvg(c)).join('')}</div></div>`).join('')}</div>`;
      h += `<div class="row"><button type="button" class="btn pri" data-go="next" autofocus>${t(S.matchWinner != null ? 'nextMatch' : 'next')}</button><button type="button" class="btn" data-go="close">${t('close')}</button></div>`;
    }
    d.innerHTML = h;
    if (!d.open) d.showModal();
  }

  // ---------------------------------------------------------------- fluxo
  async function playFx(list) {
    for (const f of list) {
      if (f.t === 'say') { sfx(f.k === 'truco' || f.k === 'retruco' || f.k === 'vale4' ? 'call' : 'say'); renderTable(f); await delay(780); }
      else if (f.t === 'play') { sfx('card'); await delay(180); }
      else if (f.t === 'trick') { await delay(620); }
    }
  }
  async function dispatch(a) {
    if (busy || !S) return false;
    if (!E.act(S, a)) return false;
    const list = S.fx.slice(); S.fx = [];
    save();
    busy = true;
    renderTable(); renderHand(); renderScore(); renderLog(); renderActionBusy();
    await playFx(list);
    busy = false;
    render();
    if (S.phase === 'handEnd') { sfx(S.matchWinner === 0 ? 'win' : 'tick'); showHandDialog(); return true; }
    if (S.phase === 'over') { sfx(S.over.winner === 0 ? 'win' : 'lose'); showHandDialog(); return true; }
    schedule();
    return true;
  }
  function renderActionBusy() { $('action').innerHTML = `<h2>…</h2>`; }
  function schedule() {
    clearTimeout(aiTimer);
    if (!S || S.over || !$('ovTitle').hidden || S.phase === 'handEnd') return;
    const a = E.actor(S);
    if (a < 0 || S.players[a].kind === 'human') return;
    aiTimer = setTimeout(() => {
      if (!S || S.over || busy) return;
      dispatch(E.ai(S));
    }, reduceMotion ? 80 : (fast ? 200 : 750));
  }

  // ---------------------------------------------------------------- som
  let audio = null;
  function tone(f, d, type, v, when) {
    if (!soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const o = audio.createOscillator(), g = audio.createGain(), st = audio.currentTime + (when || 0);
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, st);
      g.gain.setValueAtTime(v || 0.05, st); g.gain.exponentialRampToValueAtTime(0.0001, st + d);
      o.connect(g); g.connect(audio.destination); o.start(st); o.stop(st + d);
    } catch (e) { /* sem áudio */ }
  }
  function sfx(k) {
    if (k === 'card') tone(520, 0.05, 'triangle', 0.04);
    else if (k === 'say') tone(660, 0.09, 'sine', 0.04);
    else if (k === 'call') { tone(330, 0.14, 'sawtooth', 0.03); tone(495, 0.2, 'sawtooth', 0.03, 0.1); }
    else if (k === 'tick') tone(880, 0.07, 'sine', 0.04);
    else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, i * 0.12));
    else if (k === 'lose') [392, 349, 311, 262].forEach((f, i) => tone(f, 0.28, 'sine', 0.05, i * 0.2));
  }

  // ---------------------------------------------------------------- telas
  function startGame() {
    const size = +$('sizeSel').value, L = +$('levelSel').value, n = size * 2;
    const players = Array.from({ length: n }, (_, i) => ({ name: i === 0 ? '' : CPU[i - 1], kind: i === 0 ? 'human' : L }));
    Store.set('trucoGaucho.prefs', Object.assign({}, Store.get('trucoGaucho.prefs') || {}, { size, level: L, dur: +$('durSel').value }));
    S = E.newGame({ players, bestOf: +$('durSel').value, seed: (Math.random() * 2147483647) | 0 });
    enter();
  }
  function enter() {
    $('ovTitle').hidden = true; $('app').hidden = false;
    S.fx = [];
    save();
    render();
    if (S.phase === 'handEnd' || S.phase === 'over') showHandDialog(); else schedule();
  }
  function showMenu() {
    clearTimeout(aiTimer);
    if (S) save();
    if ($('dHand').open) $('dHand').close();
    $('app').hidden = true; $('ovTitle').hidden = false;
    refreshResume();
  }
  function refreshResume() { const g = Store.get('trucoGaucho.game'); $('bResume').hidden = !(g && !g.over && g.players); }
  const savePref = (o) => Store.set('trucoGaucho.prefs', Object.assign({}, Store.get('trucoGaucho.prefs') || {}, o));
  function applySoundSpeed() { $('bSound').textContent = t(soundOn ? 'soundOn' : 'soundOff'); $('bSpeed').textContent = t(fast ? 'speedF' : 'speedN'); }
  function renderLadder() {
    const groups = [['1e'], ['1b'], ['7e'], ['7o'], ['3o', 4], ['2o', 4], ['1c', '1o'], ['12o', 4], ['11o', 4], ['10o', 4], ['7c', '7b'], ['6o', 4], ['5o', 4], ['4o', 4]];
    $('ladder').innerHTML = groups.map((g) => `<span class="step">${g.filter((x) => typeof x === 'string').map((c) => cardSvg(c)).join('')}${typeof g[1] === 'number' ? `<small>×${g[1]}</small>` : ''}</span>`).join('') + `<p class="ladnote">${t('ladderNote')}</p>`;
  }
  function applyLang() {
    document.documentElement.lang = TAG[lang];
    document.title = t('name') + ' · Giovani Perotto Mesquita';
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('rulesBody').innerHTML = t('rulesHtml');
    $('langSel').value = lang;
    $('backLink').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    $('heroArt').innerHTML = pampa(620, 170, 'a');
    renderLadder(); applySoundSpeed();
    if (S && !$('app').hidden) render();
  }

  // ---------------------------------------------------------------- cliques
  $('hand').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b && !b.disabled) dispatch({ type: 'play', i: +b.dataset.i }); });
  $('action').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.a) dispatch({ type: b.dataset.a });
    else if (b.dataset.env) dispatch({ type: 'env', k: b.dataset.env });
    else if (b.dataset.fl) dispatch({ type: 'fl', k: b.dataset.fl });
    else if (b.dataset.go) showHandDialog();
  });
  $('dHand').addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (!go) return;
    const k = go.dataset.go;
    if (k === 'close') { $('dHand').close(); return; }
    if (k === 'menu') { showMenu(); return; }
    if (k === 'next') { $('dHand').close(); dispatch({ type: 'next' }); }
  });
  const openRules = () => { $('dRules').showModal(); $('dRules').scrollTop = 0; };
  $('bRules').addEventListener('click', openRules);
  $('bRules2').addEventListener('click', openRules);
  $('bRulesClose').addEventListener('click', () => $('dRules').close());
  $('bMenu').addEventListener('click', showMenu);
  $('bPlay').addEventListener('click', startGame);
  $('bResume').addEventListener('click', () => { const g = Store.get('trucoGaucho.game'); if (g && !g.over) { S = g; enter(); } });
  $('bSound').addEventListener('click', () => { soundOn = !soundOn; savePref({ sound: soundOn }); applySoundSpeed(); });
  $('bSpeed').addEventListener('click', () => { fast = !fast; savePref({ fast }); applySoundSpeed(); });
  $('langSel').addEventListener('change', () => { lang = $('langSel').value; savePref({ lang }); applyLang(); });

  // ---------------------------------------------------------------- início
  const prefs = Store.get('trucoGaucho.prefs') || {};
  const hashLang = location.hash.slice(1), navLang = ((navigator.language || 'pt').slice(0, 2)).toLowerCase();
  lang = I18N[hashLang] ? hashLang : (prefs.lang && I18N[prefs.lang] ? prefs.lang : (I18N[navLang] ? navLang : 'pt'));
  soundOn = prefs.sound !== false; fast = !!prefs.fast;
  $('sizeSel').value = String(prefs.size || 1);
  $('levelSel').value = String(prefs.level == null ? 1 : prefs.level);
  $('durSel').value = String(prefs.dur || 1);
  applyLang();
  refreshResume();
})();
</script>
</body>
</html>
