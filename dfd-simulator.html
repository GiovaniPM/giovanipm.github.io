<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nenhum dado sai deste arquivo: sem rede e sem eval. As regras dos modelos passam por um interpretador próprio. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>DFD Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23176b5b'/%3E%3Ccircle cx='8' cy='8' r='3.4' fill='none' stroke='white' stroke-width='1.4'/%3E%3Cpath d='M1.5 8h3M11.5 8h3' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f1;--panel:#fff;--panel2:#f8f8f6;--text:#1b2022;--muted:#60686c;--line:#d9dcd6;--line2:#e9ebe6;
  --accent:#176b5b;--accent-text:#fff;--accent-soft:#dfefeb;--danger:#b3261e;--danger-soft:#fbe9e7;--warn:#8a5a00;--warn-soft:#fdf3dc;--ok:#1f7a3d;
  --canvas:#fbfbf9;--dot:#d5d8d1;
  --proc-fill:#e4f0fb;--proc-line:#1f5f99;--ent-fill:#f6ecd9;--ent-line:#85621b;--sto-fill:#e4f3e6;--sto-line:#2b6e3c;--port-fill:#f0ecf8;--port-line:#65509c;
  --flow:#4a5358;--sel:#d9480f;--token:#d9480f;--read:#2b6e3c;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--c-grid:#e1e0d9;--c-base:#c3c2b7;--c-muted:#6f6d68;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#14171a;--panel:#1b1f23;--panel2:#21262a;--text:#e5e8ea;--muted:#9aa2a8;--line:#343a40;--line2:#2a2f34;
  --accent:#58c4ad;--accent-text:#0b1f1a;--accent-soft:#1b3a33;--danger:#ef8a80;--danger-soft:#3b211f;--warn:#e3b45a;--warn-soft:#352a14;--ok:#6cc98a;
  --canvas:#171a1d;--dot:#30363b;
  --proc-fill:#1c3247;--proc-line:#6db5ee;--ent-fill:#3a2f1a;--ent-line:#d9b163;--sto-fill:#1c3522;--sto-line:#74c98b;--port-fill:#2b2640;--port-line:#a795dd;
  --flow:#a7afb5;--sel:#ff8f5a;--token:#ff8f5a;--read:#74c98b;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--c-grid:#2c2c2a;--c-base:#383835;--c-muted:#9a9890;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--sans);color:var(--text);background:var(--bg);display:grid;grid-template-rows:46px minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--panel2);border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.danger{color:var(--danger)}
button.danger-solid{background:var(--danger);border-color:var(--danger);color:var(--panel)}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
button.on{background:var(--accent-soft);border-color:var(--accent)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;width:100%}
input[type=checkbox]{accent-color:var(--accent);margin:0}
textarea{font:12px/1.5 var(--mono);resize:vertical}
code,.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.spacer{flex:1}
.hidden{display:none!important}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}

#topbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
#brand{font-weight:650;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:4px}
#brand svg{width:18px;height:18px;flex:none}
#crumbs{display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden;white-space:nowrap}
#crumbs button{border:none;background:none;padding:2px 5px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
#crumbs button[aria-current=true]{font-weight:600}
#crumbs span{color:var(--muted)}
.tools{display:flex;align-items:center;gap:5px}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 3px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:40;min-width:220px;padding:4px}
.menu-list button{display:block;width:100%;text-align:left;border:none;background:none;padding:5px 9px;border-radius:4px}
.menu-list button:hover:not(:disabled){background:var(--accent-soft)}
#clock{font:600 13px var(--mono);min-width:82px;text-align:right}
#status{color:var(--muted);font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#speed{width:auto}
#lang{width:auto}

#main{display:grid;grid-template-columns:186px minmax(0,1fr) 300px;min-height:0}
#left,#right{background:var(--panel2);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.side-title{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:10px 12px 4px}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 10px 8px}
.pal{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;touch-action:none;font-size:11px;white-space:normal;line-height:1.15;cursor:grab}
.pal svg{width:40px;height:28px;pointer-events:none}
#outline{overflow:auto;flex:1;padding-bottom:10px}
.out{display:flex;gap:6px;width:100%;border:none;border-radius:0;background:none;text-align:left;padding:3px 12px;font-size:12px;align-items:baseline}
.out:hover:not(:disabled){background:var(--line2)}
.out.active{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.out i{font:600 10px var(--mono);color:var(--muted);font-style:normal;flex:none;min-width:22px}
.out span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#center{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--canvas)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;outline:none}
#zoombar{position:absolute;left:10px;bottom:10px;display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px}
#zoombar button{border:none;background:none;padding:2px 8px}
#zoombar span{align-self:center;font:11px var(--mono);color:var(--muted);min-width:40px;text-align:center}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:20px}
#empty>div{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 30px;width:min(520px,100%);text-align:center}
#empty h1{font-size:18px;margin:0 0 6px;font-weight:650}
#empty p{margin:0 0 16px;color:var(--muted)}
#empty .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#renamer{position:absolute;z-index:20;text-align:center;font:13px var(--sans);border:2px solid var(--accent);border-radius:4px;padding:3px;background:var(--panel);resize:none;overflow:hidden}

/* desenho */
.grid-dot{fill:var(--dot)}
.n-shape{stroke-width:1.8}
.n-process .n-shape{fill:var(--proc-fill);stroke:var(--proc-line)}
.n-entity .n-shape{fill:var(--ent-fill);stroke:var(--ent-line)}
.n-store .n-fill{fill:var(--sto-fill)}
.n-store .n-shape{fill:none;stroke:var(--sto-line)}
.n-port .n-shape{fill:var(--port-fill);stroke:var(--port-line);stroke-dasharray:5 3}
.n-text{fill:var(--text);font:13px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.n-num{fill:var(--muted);font:600 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node{cursor:move}
.node.sel .n-shape{stroke:var(--sel);stroke-width:3}
.node.tgt .n-shape{stroke:var(--accent);stroke-width:3.5}
.node.warn .n-shape{stroke-dasharray:none}
.conn{fill:var(--accent);opacity:0;cursor:crosshair;stroke:var(--panel);stroke-width:1.5}
.node:hover .conn,.node.sel .conn{opacity:1}
.mode-sim .conn{display:none}
.open-child{cursor:pointer}
.open-child rect{fill:var(--panel);stroke:var(--proc-line)}
.open-child text{fill:var(--proc-line);font:700 12px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bp{fill:var(--danger);stroke:var(--panel);stroke-width:1.5;pointer-events:none}
.f-line{fill:none;stroke:var(--flow);stroke-width:1.7;marker-end:url(#arrow)}
.f-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.flow.sel .f-line{stroke:var(--sel);stroke-width:2.6;marker-end:url(#arrow-sel)}
.flow.has-guard .f-line{stroke-dasharray:7 4}
.f-bg{fill:var(--canvas)}
.f-text{fill:var(--text);font:12px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.f-guard{fill:var(--muted);font:10.5px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bend{fill:var(--sel);stroke:var(--panel);stroke-width:1.5;cursor:grab}
.preview{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.marquee{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-dasharray:4 3;pointer-events:none}
.tok{fill:var(--token);stroke:var(--panel);stroke-width:1.5;cursor:pointer}
.tok.read{fill:var(--read);pointer-events:none}
.tok.picked{stroke:var(--text);stroke-width:3}
.badge rect{fill:var(--text)}
.badge text{fill:var(--panel);font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central}
.badge{pointer-events:none}
.badge.q rect{fill:var(--sel)}
.badge.in rect{fill:var(--proc-line)}
.prog{fill:none;stroke:var(--token);stroke-width:4;pointer-events:none}
.f-count{fill:var(--accent);font:700 10.5px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mode-sim .node{cursor:pointer}
.mode-sim .n-entity.manual .n-shape{stroke-width:2.6}

/* inspetor */
#tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 8px 0;gap:2px;flex:none}
.rt{border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:none;color:var(--muted);padding:4px 11px;margin-bottom:-1px}
.rt[aria-selected=true]{background:var(--panel2);border-color:var(--line);border-bottom-color:var(--panel2);color:var(--text);font-weight:600}
.rt b{background:var(--danger);color:var(--panel);border-radius:8px;padding:0 5px;font-size:10px;margin-left:3px}
.rt b.w{background:var(--warn)}
#inspector{overflow:auto;flex:1;padding:10px 12px 16px;display:flex;flex-direction:column;gap:9px;min-height:0}
.field{display:flex;flex-direction:column;gap:3px}
.field>span,.lab{font-size:12px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted);line-height:1.35}
.ferr{font:11px var(--mono);color:var(--danger);white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h4{margin:6px 0 0;font-size:13px;font-weight:650}
.type{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.issue{display:block;width:100%;text-align:left;white-space:normal;padding:6px 8px;border-left:3px solid var(--warn);border-radius:0 5px 5px 0;font-size:12px}
.issue.error{border-left-color:var(--danger)}
.issue small{display:block;color:var(--muted)}
.ok-msg{color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono)}
pre.json{margin:0;background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:7px;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}

/* painel da simulação */
#timeline{padding:4px 10px 0;flex:none;display:flex}#timeline input{width:100%;accent-color:var(--accent);margin:0}
.f-vol{fill:none;stroke:var(--accent);opacity:.22;stroke-linecap:round;pointer-events:none}
.f-trail{fill:none;stroke:var(--token);stroke-width:3.5;opacity:.75;pointer-events:none}
.chart-head{display:flex;align-items:center;gap:12px;padding:6px 10px 2px;flex-wrap:wrap;font-size:12px}
.chart-head button{padding:1px 8px;font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i,.c-row i{display:inline-block;width:14px;height:2px;border-radius:1px}
.chart-wrap{position:relative;padding:0 4px}
.qchart{display:block;max-width:100%}
.c-grid{stroke:var(--c-grid);stroke-width:1}.c-base{stroke:var(--c-base);stroke-width:1}
.c-tick{fill:var(--c-muted);font:11px var(--sans);font-variant-numeric:tabular-nums;dominant-baseline:central}
.c-end{fill:var(--muted);font:11px var(--sans);dominant-baseline:central}
.c-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{stroke:var(--panel);stroke-width:2}
.c-cross{stroke:var(--c-base);stroke-width:1}
.c-tip{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
.c-row{display:flex;align-items:center;gap:6px}.c-row b{min-width:18px;text-align:right}.c-row span{color:var(--muted)}
.sc-bar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.sc-bar .field{width:96px}.sc-bar .field:nth-child(2){width:120px}
.sc-note{padding:6px 12px}.errline{padding:0 12px 6px;color:var(--danger);font-size:12px}
#simpanel{height:270px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#simtabs{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line2);align-items:center;flex:none}
.st{padding:2px 10px;font-size:12px}
.st[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent)}
#simbody{overflow:auto;flex:1;min-height:0;padding:0}
table.t{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:3px 9px;text-align:left;white-space:nowrap}
table.t th{position:sticky;top:0;background:var(--panel2);font-weight:600;font-size:11px;color:var(--muted);z-index:1}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.m{font-family:var(--mono);max-width:520px;overflow:hidden;text-overflow:ellipsis}
table.t tr.warn td{background:var(--warn-soft);color:var(--warn)}
table.t tr.err td{background:var(--danger-soft);color:var(--danger)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:12px}
.summary b{font:600 13px var(--mono)}
.storeh{padding:8px 12px 3px;font-weight:600}
.pad{padding:12px}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0;width:min(480px,94vw);max-height:90vh;box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog.wide{width:min(760px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg header{padding:12px 16px;font-weight:650;font-size:14px;border-bottom:1px solid var(--line2)}
.dlg .b{padding:14px 16px;overflow:auto;flex:1}
.dlg .b h4{margin:14px 0 4px}.dlg .b h4:first-child{margin-top:0}
.dlg .b p{margin:0 0 8px}
.dlg .b ul{margin:0 0 8px;padding-left:18px}
.dlg footer{padding:10px 16px;display:flex;justify-content:flex-end;gap:6px;border-top:1px solid var(--line2)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:54px;z-index:9999;display:flex;flex-direction:column;gap:6px;max-width:min(520px,90vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:5px;padding:7px 10px;box-shadow:0 4px 18px rgba(0,0,0,.2);display:flex;gap:10px;white-space:pre-wrap}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
.toast span{flex:1}.toast button{border:none;background:none;padding:0 3px;color:var(--muted)}

@media (max-width:1000px){
  #main{grid-template-columns:150px minmax(0,1fr) 240px}
  #brand span,#status{display:none}
}
@media print{
  #topbar,#left,#right,#zoombar,#simpanel,#toasts{display:none!important}
  body,#main{display:block}
  #stage{position:fixed;inset:0;background:#fff}
}
</style>
</head>
<body>
<header id="topbar">
  <div id="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#176b5b"/><circle cx="8" cy="8" r="3.4" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1.5 8h3M11.5 8h3" stroke="#fff" stroke-width="1.4"/></svg><span>DFD Simulator</span></div>
  <nav id="crumbs" aria-label="Níveis"></nav>
  <div class="spacer"></div>
  <div class="tools" id="edit-tools">
    <button id="b-undo" data-t="undo" data-title="undoKey">↶</button>
    <button id="b-redo" data-t="redo" data-title="redoKey">↷</button>
    <div class="sep"></div>
    <div class="menu"><button id="b-file" aria-haspopup="true" data-tx="file"></button></div>
    <div class="sep"></div>
    <button id="b-sim" class="primary" data-tx="simulate"></button>
  </div>
  <div class="tools hidden" id="sim-tools">
    <span id="status" role="status"></span>
    <span id="clock">t = 0.0</span>
    <button id="b-play" class="primary"></button>
    <button id="b-back" data-tx="back" data-title="backKey"></button>
    <button id="b-step" data-tx="step" data-title="stepKey"></button>
    <button id="b-reset" data-tx="restart"></button>
    <select id="speed" data-aria="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
    <div class="sep"></div>
    <button id="b-stop" data-tx="backToEdit"></button>
  </div>
  <div class="sep"></div>
  <select id="lang" aria-label="Idioma / Language / Lingua"><option value="pt">PT</option><option value="en">EN</option><option value="it">IT</option><option value="es">ES</option></select>
  <button id="b-help" aria-label="?" data-title="help">?</button>
  <button id="b-theme" data-title="theme">◐</button>
</header>

<div id="main">
  <aside id="left">
    <div class="side-title" data-tx="elements"></div>
    <div id="palette"></div>
    <div class="side-title" data-tx="thisDiagram"></div>
    <div id="outline"></div>
  </aside>
  <section id="center">
    <div id="stage">
      <svg id="svg" role="application" tabindex="0" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="grid-dot" cx="1" cy="1" r="1"/></pattern>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="var(--flow)"/></marker>
          <marker id="arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="var(--sel)"/></marker>
        </defs>

const HELP={
pt:[['O que é um DFD','Um diagrama de fluxo de dados mostra como a informação circula em um sistema. Processos transformam dados, entidades externas enviam e recebem dados, depósitos os guardam e os fluxos mostram o caminho.'],['Desenhar',['Arraste um elemento da esquerda para o diagrama.','Passe o mouse em um elemento e arraste um ponto da borda até outro para criar um fluxo.','Duplo clique renomeia. Arrastar o ponto no meio de um fluxo selecionado o curva.','Arrastar o fundo seleciona uma área. Botão do meio ou Espaço + arrastar move a vista; a roda do mouse aproxima.']],['Níveis','Selecione um processo e use "Detalhar em subdiagrama". Os fluxos do processo aparecem no subdiagrama como elementos tracejados, o que mantém os níveis balanceados.'],['Simular',['Entidades emitem dados conforme o intervalo definido. Sem intervalo, emitem ao receber um clique; o botão "Emitir agora" funciona em todas.','Processos aplicam as regras, levam o tempo da duração e atendem conforme a capacidade; o excedente aguarda na fila.','Cada fluxo de saída com condição verdadeira recebe uma cópia do dado.','Fluxo vindo de depósito é leitura; fluxo indo para depósito é gravação.']],['Expressões',['Operadores: + - * / % == != < <= > >= && || ! ?:','Funções: round, floor, ceil, abs, min, max, random, randint, exponential, normal, chance, pick, count, sum, avg, minof, maxof, len, upper, lower, concat, contains, exists, coalesce, if, str, num','Variáveis: campos do dado, t (tempo), seq (emissão) e in (entrada, nos filtros).','Campo inexistente vale null. Modelos não executam JavaScript.']],['Atalhos',['Ctrl+Z / Ctrl+Y: desfazer e refazer · Del: excluir · Ctrl+C / Ctrl+V / Ctrl+D: copiar, colar, duplicar · Ctrl+A: selecionar tudo · setas: mover · F: ajustar','Na simulação: Espaço executa ou pausa · N avança um evento · B volta um evento · R reinicia']]],
en:[['What a DFD is','A data flow diagram shows how information moves through a system. Processes transform data, external entities send and receive it, stores keep it and flows show the path.'],['Drawing',['Drag an element from the left onto the diagram.','Hover an element and drag a dot on its edge to another one to create a flow.','Double-click renames. Dragging the dot in the middle of a selected flow curves it.','Dragging the background selects an area. Middle button or Space + drag pans; the mouse wheel zooms.']],['Levels','Select a process and use "Detail in a sub-diagram". The process\'s flows appear in the sub-diagram as dashed elements, which keeps the levels balanced.'],['Simulating',['Entities emit data at the set interval. With no interval, they emit when clicked; the "Emit now" button works on all of them.','Processes apply their rules, take their duration and serve according to capacity; the excess waits in a queue.','Each output flow whose condition is true receives a copy of the data.','A flow from a store is a read; a flow to a store is a write.']],['Expressions',['Operators: + - * / % == != < <= > >= && || ! ?:','Functions: round, floor, ceil, abs, min, max, random, randint, exponential, normal, chance, pick, count, sum, avg, minof, maxof, len, upper, lower, concat, contains, exists, coalesce, if, str, num','Variables: data fields, t (time), seq (emission) and in (input, in filters).','A missing field is null. Models do not run JavaScript.']],['Shortcuts',['Ctrl+Z / Ctrl+Y: undo and redo · Del: delete · Ctrl+C / Ctrl+V / Ctrl+D: copy, paste, duplicate · Ctrl+A: select all · arrows: move · F: fit','In the simulation: Space runs or pauses · N advances one event · B goes back one event · R restarts']]],
it:[['Che cos\'è un DFD','Un diagramma di flusso dei dati mostra come le informazioni circolano in un sistema. I processi trasformano i dati, le entità esterne li inviano e ricevono, gli archivi li conservano e i flussi mostrano il percorso.'],['Disegnare',['Trascina un elemento da sinistra sul diagramma.','Passa il mouse su un elemento e trascina un punto del bordo su un altro per creare un flusso.','Il doppio clic rinomina. Trascinare il punto al centro di un flusso selezionato lo curva.','Trascinare lo sfondo seleziona un\'area. Tasto centrale o Spazio + trascinamento sposta la vista; la rotella ingrandisce.']],['Livelli','Seleziona un processo e usa "Dettaglia in un sottodiagramma". I flussi del processo compaiono nel sottodiagramma come elementi tratteggiati, il che mantiene bilanciati i livelli.'],['Simulare',['Le entità emettono dati all\'intervallo impostato. Senza intervallo, emettono al clic; il pulsante "Emetti ora" funziona su tutte.','I processi applicano le regole, impiegano la durata e servono secondo la capacità; l\'eccedenza attende in coda.','Ogni flusso in uscita con condizione vera riceve una copia del dato.','Un flusso da un archivio è una lettura; un flusso verso un archivio è una scrittura.']],['Espressioni',['Operatori: + - * / % == != < <= > >= && || ! ?:','Funzioni: round, floor, ceil, abs, min, max, random, randint, exponential, normal, chance, pick, count, sum, avg, minof, maxof, len, upper, lower, concat, contains, exists, coalesce, if, str, num','Variabili: campi del dato, t (tempo), seq (emissione) e in (ingresso, nei filtri).','Un campo inesistente vale null. I modelli non eseguono JavaScript.']],['Scorciatoie',['Ctrl+Z / Ctrl+Y: annulla e ripeti · Canc: elimina · Ctrl+C / Ctrl+V / Ctrl+D: copia, incolla, duplica · Ctrl+A: seleziona tutto · frecce: sposta · F: adatta','Nella simulazione: Spazio esegue o sospende · N avanza di un evento · B torna indietro di un evento · R riavvia']]],
es:[['Qué es un DFD','Un diagrama de flujo de datos muestra cómo circula la información en un sistema. Los procesos transforman datos, las entidades externas los envían y reciben, los almacenes los guardan y los flujos muestran el camino.'],['Dibujar',['Arrastra un elemento de la izquierda al diagrama.','Pasa el ratón sobre un elemento y arrastra un punto del borde hasta otro para crear un flujo.','El doble clic renombra. Arrastrar el punto central de un flujo seleccionado lo curva.','Arrastrar el fondo selecciona un área. Botón central o Espacio + arrastrar mueve la vista; la rueda acerca.']],['Niveles','Selecciona un proceso y usa "Detallar en un subdiagrama". Los flujos del proceso aparecen en el subdiagrama como elementos discontinuos, lo que mantiene los niveles balanceados.'],['Simular',['Las entidades emiten datos en el intervalo definido. Sin intervalo, emiten al hacer clic; el botón "Emitir ahora" funciona en todas.','Los procesos aplican las reglas, tardan su duración y atienden según su capacidad; el exceso espera en cola.','Cada flujo de salida con condición verdadera recibe una copia del dato.','Un flujo desde un almacén es una lectura; un flujo hacia un almacén es una escritura.']],['Expresiones',['Operadores: + - * / % == != < <= > >= && || ! ?:','Funciones: round, floor, ceil, abs, min, max, random, randint, exponential, normal, chance, pick, count, sum, avg, minof, maxof, len, upper, lower, concat, contains, exists, coalesce, if, str, num','Variables: campos del dato, t (tiempo), seq (emisión) e in (entrada, en filtros).','Un campo inexistente vale null. Los modelos no ejecutan JavaScript.']],['Atajos',['Ctrl+Z / Ctrl+Y: deshacer y rehacer · Supr: eliminar · Ctrl+C / Ctrl+V / Ctrl+D: copiar, pegar, duplicar · Ctrl+A: seleccionar todo · flechas: mover · F: ajustar','En la simulación: Espacio ejecuta o pausa · N avanza un evento · B retrocede un evento · R reinicia']]],
};

let LANG='pt';
function t(key,...a){const e=I18N[key];let s=e?e[LANGS.indexOf(LANG)]:key;a.forEach((v,i)=>{s=s.split('{'+i+'}').join(String(v))});return s}

/* ========== utilitários ========== */
const $=(s,r=document)=>r.querySelector(s);
const SVGNS='http://www.w3.org/2000/svg';
function h(tag,attrs,...kids){
  const e=document.createElement(tag);let val;
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')val=v;
    else if(k==='checked'||k==='disabled'||k==='selected')e[k]=!!v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}
  if(val!==undefined)e.value=val;
  return e;
}
function s(tag,attrs,...kids){
  const e=document.createElementNS(SVGNS,tag);
  for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.setAttribute('class',v);else e.setAttribute(k,v)}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}
  return e;
}
function toast(msg,kind='ok',ms){
  const x=h('button',{'aria-label':t('close')},'×');
  const el=h('div',{class:'toast '+kind},h('span',null,msg),x);x.onclick=()=>el.remove();
  const box=$('#toasts');box.append(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>el.remove(),ms??(kind==='err'?9000:kind==='warn'?7000:3000));
}
function download(data,name,type='application/octet-stream'){

function percentile(list,p){
  if(!list.length)return null;
  const s=[...list].sort((a,b)=>a-b),i=(s.length-1)*p,lo=Math.floor(i);
  return s[lo]+(s[Math.min(lo+1,s.length-1)]-s[lo])*(i-lo);
}
function simMetrics(sim){
  const T=sim.tot,out=[];
  const add=(k,label,v,d=2,suf='')=>out.push({k,label,v,d,suf});
  add('emitted',t('sEmitted'),T.emitted,1);add('delivered',t('sDelivered'),T.delivered,1);add('stored',t('sStored'),T.stored,1);
  add('dropped',t('sDropped'),T.dropped,1);add('rejected',t('sRejected'),sim.rejected,1);
  add('lead',t('sLead'),T.leadN?T.leadSum/T.leadN:null);add('p50',t('sP50'),percentile(sim.leads,.5));add('p95',t('sP95'),percentile(sim.leads,.95));
  add('wip',t('sWip'),sim.t>0?sim.wipArea/sim.t:0);add('end',t('sEnd'),sim.t,1);
  for(const n of sim.nodes.values()){
    if(n.type!=='process'||n.child)continue;
    const st=sim.state.get(n.id),nm=`${numberOf(sim.m,n)} ${n.name}`;
    add('util:'+n.id,`${nm}: ${t('sUtil')}`,sim.util(n.id)*100,1,'%');
    add('maxq:'+n.id,`${nm}: ${t('sMaxQ')}`,st.maxQ,1);
    add('wait:'+n.id,`${nm}: ${t('sWait')}`,st.waitN?st.waitSum/st.waitN:null);
  }
  return out;
}

function runForever(m){

    if(n.type==='entity'&&autoInterval(n)&&!n.limit&&d.flows.some(f=>f.from===n.id))return true;
    if(n.type==='process'&&!n.child&&n.interval>0&&!n.limit&&!d.flows.some(f=>f.to===n.id))return true;

  return false;
}
const MAX_RUN_EVENTS=1500000;
function runOnce(model,seed,maxT){
  const m=JSON.parse(JSON.stringify(model));m.seed=seed;m.maxT=maxT;
  const s=new Sim(m);let g=0;
  while(s.heap.size&&g<MAX_RUN_EVENTS){
    if(s.maxT&&s.heap.peek().t>s.maxT){s.advanceTo(s.maxT);break}
    if(g%256===0&&s.isIdle())break;
    s.fireNext();s.pausedAt=null;g++;
  }
  return{metrics:simMetrics(s),capped:g>=MAX_RUN_EVENTS};
}
function aggregate(runs){
  const n=runs.length,stats=new Map();
  for(const r of runs)for(const x of r.metrics){
    if(!stats.has(x.k))stats.set(x.k,{k:x.k,label:x.label,d:x.d,suf:x.suf,vals:[]});
    if(x.v!=null)stats.get(x.k).vals.push(x.v);
  }
  for(const m of stats.values()){
    const c=m.vals.length;
    m.mean=c?m.vals.reduce((a,b)=>a+b,0)/c:null;
    const sd=c>1?Math.sqrt(m.vals.reduce((a,b)=>a+(b-m.mean)**2,0)/(c-1)):0;
    m.ci=c>1?tCrit(c-1)*sd/Math.sqrt(c):null;
    m.min=c?Math.min(...m.vals):null;m.max=c?Math.max(...m.vals):null;
    delete m.vals;
  }
  return{n,stats,capped:runs.some(r=>r.capped)};
}

/* ========== geometria ========== */
function half(n){
  const gs=S.model.notation==='gs';
  switch(n.type){
    case'process':return gs?{w:64,h:50}:{w:56,h:56,round:true};
    case'entity':return{w:62,h:34};
    case'store':return{w:84,h:24};
    default:return{w:66,h:16};
  }
}
function edgePoint(n,tx,ty){
  const b=half(n),dx=tx-n.x,dy=ty-n.y;
  if(!dx&&!dy)return{x:n.x,y:n.y};
  if(b.round){const l=Math.hypot(dx,dy);return{x:n.x+dx/l*b.w,y:n.y+dy/l*b.h}}
  const k=Math.min(dx?b.w/Math.abs(dx):Infinity,dy?b.h/Math.abs(dy):Infinity);
  return{x:n.x+dx*k,y:n.y+dy*k};
}
function flowGeom(d,f){
  const a=d.nodes.find(n=>n.id===f.from),b=d.nodes.find(n=>n.id===f.to);if(!a||!b)return null;
  const peers=d.flows.filter(x=>(x.from===f.from&&x.to===f.to)||(x.from===f.to&&x.to===f.from));
  let bend=f.bend;
  if(!bend&&peers.length>1){
    const i=peers.indexOf(f),off=(i-(peers.length-1)/2)*44;
    bend=f.from<f.to?off:-off;
  }
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
  const cx=mx-dy/l*bend*2,cy=my+dx/l*bend*2;
  const p0=edgePoint(a,cx,cy),p2=edgePoint(b,cx,cy);
  const q=t=>({x:(1-t)*(1-t)*p0.x+2*(1-t)*t*cx+t*t*p2.x,y:(1-t)*(1-t)*p0.y+2*(1-t)*t*cy+t*t*p2.y});
  return{p0,p2,cx,cy,q,mid:q(.5),nx:-dy/l,ny:dx/l,a,b};
}
function wrapText(text,max,lines=3){
  const words=String(text||'').split(/\s+/).filter(Boolean),out=[];let cur='';
  for(const w of words){
    if((cur+' '+w).trim().length<=max)cur=(cur+' '+w).trim();
    else{if(cur)out.push(cur);cur=w.length>max?w.slice(0,max-1)+'…':w}
  }
  if(cur)out.push(cur);
  if(out.length>lines){out.length=lines;out[lines-1]=out[lines-1].slice(0,Math.max(1,max-1))+'…'}
  return out;
}
function multiline(lines,x,y,lh,cls){
  const t0=y-(lines.length-1)*lh/2;
  return lines.map((l,i)=>s('text',{x,y:t0+i*lh,class:cls},l));
}

function drawFlow(d,f){
  const G=flowGeom(d,f);if(!G)return null;
  const sel=S.sel.has(f.id),guard=String(f.guard||'').trim();
  const g=s('g',{class:`flow${sel?' sel':''}${guard?' has-guard':''}`,'data-flow':f.id});
  const path=G.a.id===G.b.id?'':`M${G.p0.x} ${G.p0.y}Q${G.cx} ${G.cy} ${G.p2.x} ${G.p2.y}`;
  g.append(s('path',{class:'f-hit',d:path}),s('path',{class:'f-line',d:path}));
  const lines=wrapText(f.name,22,2);
  const lh=14,m=G.mid,w=Math.max(0,...lines.map(l=>l.length))*6.4+10,hh=lines.length*lh+(guard?12:0)+2;
  if(lines.length||guard){
    g.append(s('rect',{class:'f-bg',x:m.x-w/2,y:m.y-hh/2,width:w,height:hh,rx:3}));
    g.append(...multiline(lines,m.x,m.y-(guard?6:0),lh,'f-text'));
    if(guard){const gl=guard.length>26?guard.slice(0,25)+'…':guard;g.append(s('text',{x:m.x,y:m.y+lines.length*lh/2+(lines.length?2:0),class:'f-guard'},`[${gl}]`))}
  }
  if(sel&&editing()&&S.sel.size===1)g.append(s('circle',{class:'bend',cx:m.x,cy:m.y,r:6,'data-bend':f.id}));
  return g;
}

const svg=$('#svg');

    if(!editing()){

      const n=diagram().nodes.find(x=>x.id===id);

    }
    if(dbl){const n=diagram().nodes.find(x=>x.id===id);if(n&&n.type!=='port'){drag={kind:'rename',obj:n};svg.setPointerCapture(e.pointerId);return}}
    if(e.shiftKey){if(S.sel.has(id))S.sel.delete(id);else S.sel.add(id)}
    else if(!S.sel.has(id))S.sel=new Set([id]);
    drag={kind:'move',start:p,moved:false,orig:diagram().nodes.filter(n=>S.sel.has(n.id)).map(n=>({n,x:n.x,y:n.y}))};
    svg.setPointerCapture(e.pointerId);

    return;
  }
  const flowEl=tg.closest('[data-flow]');
  if(flowEl){
    const id=flowEl.dataset.flow;
    const now=performance.now(),dbl=lastClick.id===id&&now-lastClick.t<350;lastClick={id,t:now};
    if(!editing()){S.sel=new Set([id]);setRight('props');renderCanvas();return}
    if(dbl){const f=diagram().flows.find(x=>x.id===id);if(f){drag={kind:'rename',obj:f};svg.setPointerCapture(e.pointerId);return}}
    S.sel=e.shiftKey?new Set([...S.sel,id]):new Set([id]);
    S.right='props';renderCanvas();renderOutline();renderTabs();renderInspector();
    return;
  }
  // fundo
  if(!e.shiftKey&&S.sel.size){S.sel=new Set();S.tok=null;renderCanvas();renderOutline();renderInspector()}
  else if(S.tok){S.tok=null;renderInspector()}
  if(editing())drag={kind:'marquee',start:p,base:new Set(S.sel)};
  else drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:v.x,vy:v.y};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  const p=toWorld(e),over=$('#g-over');
  if(drag.kind==='pan'){const v=viewOf();v.x=drag.vx+e.clientX-drag.sx;v.y=drag.vy+e.clientY-drag.sy;applyView();return}
  if(drag.kind==='move'){
    const dx=p.x-drag.start.x,dy=p.y-drag.start.y;
    if(!drag.moved&&Math.hypot(dx,dy)<3)return;
    drag.moved=true;
    for(const o of drag.orig){o.n.x=e.altKey?o.x+dx:snap(o.x+dx);o.n.y=e.altKey?o.y+dy:snap(o.y+dy)}
    renderCanvas();return;
  }
  if(drag.kind==='link'){
    const d=diagram(),a=d.nodes.find(n=>n.id===drag.from);if(!a)return;
    const st=edgePoint(a,p.x,p.y);
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const tgt=el&&el.closest&&el.closest('[data-node]');
    document.querySelectorAll('.node.tgt').forEach(x=>x.classList.remove('tgt'));
    if(tgt&&tgt.dataset.node!==drag.from)tgt.classList.add('tgt');
    over.replaceChildren(s('path',{class:'preview',d:`M${st.x} ${st.y}L${p.x} ${p.y}`}));
    return;
  }
  if(drag.kind==='bend'){
    const d=diagram(),f=d.flows.find(x=>x.id===drag.flow);if(!f)return;
    const a=d.nodes.find(n=>n.id===f.from),b=d.nodes.find(n=>n.id===f.to);
    const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
    const val=((p.x-(a.x+b.x)/2)*(-dy/l)+(p.y-(a.y+b.y)/2)*(dx/l));
    f.bend=Math.abs(val)<8?0:Math.round(val);
    renderCanvas();return;
  }
  if(drag.kind==='marquee'){
    const x=Math.min(p.x,drag.start.x),y=Math.min(p.y,drag.start.y),w=Math.abs(p.x-drag.start.x),hh=Math.abs(p.y-drag.start.y);
    drag.rect={x,y,w,h:hh};
    over.replaceChildren(s('rect',{class:'marquee',x,y,width:w,height:hh}));
  }
});
function endDrag(e){
  if(!drag)return;
  const dr=drag;drag=null;
  $('#g-over').replaceChildren();
  if(dr.kind==='rename')startRename(dr.obj); // no pointerup: o mousedown tiraria o foco do campo
  else if(dr.kind==='move'&&dr.moved){commit();renderAll()}
  else if(dr.kind==='bend'){commit();renderAll()}
  else if(dr.kind==='link'&&e){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const tgt=el&&el.closest&&el.closest('[data-node]');
    document.querySelectorAll('.node.tgt').forEach(x=>x.classList.remove('tgt'));
    if(tgt&&tgt.dataset.node!==dr.from){
      const d=diagram();const f=addFlow(d.nodes.find(n=>n.id===dr.from),d.nodes.find(n=>n.id===tgt.dataset.node));
      if(f){const nameIn=document.querySelector('#inspector input[type=text]');if(nameIn)nameIn.focus()}
    }
  }else if(dr.kind==='marquee'&&dr.rect&&dr.rect.w>4){
    const r=dr.rect,d=diagram();const sel=new Set(dr.base);
    for(const n of d.nodes)if(n.x>=r.x&&n.x<=r.x+r.w&&n.y>=r.y&&n.y<=r.y+r.h)sel.add(n.id);

function applyView(){
  const v=viewOf();
  $('#world').setAttribute('transform',`translate(${v.x} ${v.y}) scale(${v.k})`);
  $('#dots').setAttribute('patternTransform',`translate(${v.x} ${v.y}) scale(${v.k})`);
  $('#z-label').textContent=Math.round(v.k*100)+'%';
}
function zoomAt(px,py,f){
  const v=viewOf(),k=Math.max(.2,Math.min(3,v.k*f));
  v.x=px-(px-v.x)*k/v.k;v.y=py-(py-v.y)*k/v.k;v.k=k;applyView();
}
function bounds(d){
  if(!d.nodes.length)return null;
  let a=Infinity,b=Infinity,c=-Infinity,e=-Infinity;
  for(const n of d.nodes){const q=half(n);a=Math.min(a,n.x-q.w);b=Math.min(b,n.y-q.h);c=Math.max(c,n.x+q.w);e=Math.max(e,n.y+q.h)}
  for(const f of d.flows){const G=flowGeom(d,f);if(G){a=Math.min(a,G.mid.x-70);b=Math.min(b,G.mid.y-24);c=Math.max(c,G.mid.x+70);e=Math.max(e,G.mid.y+24)}}
  return{x:a,y:b,w:c-a,h:e-b};
}
function fitView(){
  const d=diagram(),r=svg.getBoundingClientRect(),b=bounds(d),v=viewOf();
  if(!b||!r.width){v.x=0;v.y=0;v.k=1;applyView();return}
  const k=Math.max(.2,Math.min(1.25,Math.min((r.width-60)/b.w,(r.height-60)/b.h)));
  v.k=k;v.x=(r.width-b.w*k)/2-b.x*k;v.y=(r.height-b.h*k)/2-b.y*k;applyView();
}
function paletteDrag(e,type){
  if(!editing())return;
  e.preventDefault();
  const startX=e.clientX,startY=e.clientY;let moved=false;
  const ghost=h('div',{style:'position:fixed;z-index:60;pointer-events:none;padding:4px 9px;background:var(--accent);color:var(--accent-text);border-radius:5px;font-size:12px;display:none'},t(type));
  document.body.append(ghost);
  const mv=ev=>{if(Math.hypot(ev.clientX-startX,ev.clientY-startY)>4)moved=true;if(moved){ghost.style.display='block';ghost.style.left=ev.clientX+8+'px';ghost.style.top=ev.clientY+8+'px'}};
  const up=ev=>{
    removeEventListener('pointermove',mv);removeEventListener('pointerup',up);ghost.remove();
    const r=svg.getBoundingClientRect();
    if(moved&&ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){const p=toWorld(ev);addNode(type,snap(p.x),snap(p.y))}
    else if(!moved){

let renaming=null;
function startRename(obj,at){
  finishRename(true);
  const v=viewOf(),isFlow=!obj.type;
  let x=obj.x,y=obj.y;
  if(isFlow){const G=flowGeom(diagram(),obj);if(!G)return;x=G.mid.x;y=G.mid.y}
  const w=isFlow?170:Math.max(130,half(obj).w*2-6),hh=isFlow?28:56;
  const ta=h('textarea',{id:'renamer',value:obj.name,'aria-label':t('name'),style:`left:${x*v.k+v.x-w/2}px;top:${y*v.k+v.y-hh/2}px;width:${w}px;height:${hh}px`});
  renaming={obj,ta,orig:obj.name};
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();finishRename(true)}
    else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();finishRename(false)}
    e.stopPropagation();
  });
  ta.addEventListener('blur',()=>finishRename(true));

function finishRename(save){

function currentResult(){
  if(S.batch)return S.batch;
  return aggregate([{metrics:simMetrics(S.sim),capped:false}]);

function startBatch(){
  if(S.batching)return;
  const n=Math.max(2,Math.min(500,Math.round(S.batchN)||30));S.batchN=n;
  let per=Number(S.batchT)>0?Number(S.batchT):Number(S.model.maxT)||0;
  S.forcedT=0;
  if(!per&&runForever(S.model)){per=1000;S.forcedT=per}
  const token={i:0,n,runs:[]};S.batching=token;renderSimPanel(true);
  const model=JSON.parse(JSON.stringify(S.model)),base=S.model.seed|0;
  const work=()=>{
    if(S.batching!==token)return;
    const until=performance.now()+24;
    while(token.i<n&&performance.now()<until){token.runs.push(runOnce(model,base+token.i,per));token.i++}
    if(token.i<n){const p=$('#sc-progress');if(p)p.textContent=t('scProgress',token.i+1,n);setTimeout(work,0);return}
    S.batch=aggregate(token.runs);S.batching=null;renderSimPanel(true);

}

function fileMenu(btn){
  const host=btn.parentNode,open=host.querySelector('.menu-list');
  if(open){open.remove();return}
  const it=(k,fn)=>h('button',{onclick(){menu.remove();fn()}},t(k));
  const menu=h('div',{class:'menu-list'},
    it('fNew',async()=>{if(!diagramHasContent()||await confirmDlg(t('confirmNew'),t('confirmNewText')))setModel(newModel())}),
    it('fOpen',()=>$('#file-json').click()),
    it('fSave',()=>{commit();download(JSON.stringify(S.model,null,1),safeName()+'.json','application/json')}),
    h('div',{class:'side-title',style:'padding:6px 9px 2px'},t('samples')),
    Object.keys(SAMPLES).map(k=>h('button',{onclick:async()=>{menu.remove();if(!diagramHasContent()||await confirmDlg(t('confirmNew'),t('confirmNewText')))loadSample(k)}},SAMPLE_TEXT[k].title[LANGS.indexOf(LANG)])),
    h('div',{class:'side-title',style:'padding:6px 9px 2px'},'SVG / PNG'),
    it('fSvg',()=>download(diagramSvgText(),safeName()+'.svg','image/svg+xml')),
    it('fPng',exportPng),
    it('fPrint',()=>print()));
  host.append(menu);
  setTimeout(()=>document.addEventListener('click',function c(e){if(!menu.contains(e.target)){menu.remove();document.removeEventListener('click',c)}}),0);
}
const diagramHasContent=()=>Object.values(S.model.diagrams).some(d=>d.nodes.length);

function moveSel(dx,dy){
  const nodes=diagram().nodes.filter(n=>S.sel.has(n.id));if(!nodes.length)return;
  nodes.forEach(n=>{n.x+=dx;n.y+=dy});commit();renderCanvas();

document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const open=document.querySelector('dialog[open]');
  if(open)return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(!typing&&e.code==='Space'){
    if(S.sim){e.preventDefault();togglePlay();return}
    S.space=true;e.preventDefault();return;
  }
  if(typing)return;
  if(S.sim){
    if(k==='n'){e.preventDefault();stepSim()}
    else if(k==='b'){e.preventDefault();stepBack()}
    else if(k==='r'&&!mod){e.preventDefault();resetSim(true)}
    else if(k==='f'&&!mod)fitView();
    else if(k==='escape')stopSim(),renderAll();
    return;
  }
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&k==='y'){e.preventDefault();redo()}
  else if(mod&&k==='a'){e.preventDefault();S.sel=new Set(diagram().nodes.map(n=>n.id));renderCanvas();renderOutline();renderInspector()}
  else if(mod&&k==='c'){if(copySelection())e.preventDefault()}
  else if(mod&&k==='x'){if(copySelection()){e.preventDefault();deleteSelection()}}
  else if(mod&&k==='v'){e.preventDefault();paste()}
  else if(mod&&k==='d'){e.preventDefault();if(copySelection())paste()}
  else if(mod&&k==='s'){e.preventDefault();commit();download(JSON.stringify(S.model,null,1),safeName()+'.json','application/json')}
  else if(k==='delete'||k==='backspace'){e.preventDefault();deleteSelection()}
  else if(k==='escape'){S.sel=new Set();renderCanvas();renderOutline();renderInspector()}
  else if(k==='f'&&!mod)fitView();
  else if(k==='?'||k==='f1'){e.preventDefault();helpDlg()}
  else if(k.startsWith('arrow')&&S.sel.size){
    e.preventDefault();const st=e.shiftKey?24:8;
    moveSel(k==='arrowleft'?-st:k==='arrowright'?st:0,k==='arrowup'?-st:k==='arrowdown'?st:0);
  }
});
document.addEventListener('keyup',e=>{if(e.code==='Space')S.space=false});
