<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Hypercare</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--panel2:#f7f8fa;--text:#18202b;--muted:#5b6778;--line:#dde2e9;
  --accent:#1d4e89;--on-accent:#fff;--accent-soft:#e7eef7;
  --ok:#1f7a3d;--ok-soft:#e3f4e8;--warn:#8a5a00;--warn-soft:#fdf3dc;--bad:#b3261e;--bad-soft:#fbe9e7;--info:#1864ab;--info-soft:#e7f5ff;
  --s1:#b3261e;--s2:#c4470b;--s3:#946c00;--s4:#1864ab;--grid:#e6e9ee;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Consolas,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0f1520;--panel:#172131;--panel2:#1d293b;--text:#e6ebf2;--muted:#a3afbf;--line:#2c3a52;
  --accent:#8db4e2;--on-accent:#0f1520;--accent-soft:#1d3150;
  --ok:#5cc98a;--ok-soft:#173527;--warn:#f0c264;--warn-soft:#3a2f12;--bad:#ff8a80;--bad-soft:#3d1c1a;--info:#74c0fc;--info-soft:#16304a;
  --s1:#ff8a80;--s2:#ffa94d;--s3:#f0c264;--s4:#74c0fc;--grid:#26344a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;flex-direction:column;min-width:0;max-width:280px}
.brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1}
#tabs button{border:0;background:transparent;padding:7px 11px;border-radius:8px;cursor:pointer;color:var(--muted)}
#tabs button:hover{background:var(--panel2);color:var(--text)}
#tabs button[aria-selected=true]{background:var(--accent);color:var(--on-accent)}
#tabs button:disabled{opacity:.45;cursor:default}
.hdr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
main#app{padding:18px;max-width:1440px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 9px;min-height:28px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
select.sel{width:auto;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px}
.card h3 small{font-weight:400;color:var(--muted)}
h2{font-size:19px;margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:960px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:24px;font-weight:700;margin-top:2px}
.kpi .sub{color:var(--muted);font-size:12px}
.kpi.bad .val{color:var(--bad)}.kpi.ok .val{color:var(--ok)}.kpi.warn .val{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}.small{font-size:12.5px}.nowrap{white-space:nowrap}
.mt{margin-top:16px}
.health{display:flex;gap:14px;align-items:center;border-radius:12px;padding:14px 18px;margin-bottom:16px;border:1px solid var(--line)}
.health.g{background:var(--ok-soft)}.health.y{background:var(--warn-soft)}.health.r{background:var(--bad-soft)}
.health .ic{font-size:22px;font-weight:700}
.health.g .ic{color:var(--ok)}.health.y .ic{color:var(--warn)}.health.r .ic{color:var(--bad)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.step b{display:block}
.step small{color:var(--muted)}
.step.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.done{opacity:.75}
.step .n{display:inline-block;width:20px;height:20px;border-radius:50%;text-align:center;font-size:12px;line-height:20px;margin-right:6px;background:var(--panel2);border:1px solid var(--line)}
.step.cur .n{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.step.done .n{background:var(--ok);color:var(--on-accent);border-color:var(--ok)}
ul.ins{margin:0;padding-left:18px}ul.ins li{margin:6px 0}
.list .item{display:flex;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;align-items:flex-start;background:var(--panel)}
.list .item[data-act]{cursor:pointer}
.list .item[data-act]:hover{border-color:var(--muted)}
.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}
.tbl input,.tbl select{min-width:110px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap;font-weight:600}
.b-bad{color:var(--bad);background:var(--bad-soft)}.b-warn{color:var(--warn);background:var(--warn-soft)}.b-ok{color:var(--ok);background:var(--ok-soft)}.b-info{color:var(--info);background:var(--info-soft)}.b-mute{color:var(--muted);background:var(--panel2)}
.sev{display:inline-block;font-weight:700;font-size:12px;padding:1px 7px;border-radius:6px;color:#fff;white-space:nowrap}
:root[data-theme=dark] .sev{color:#0f1520}
.sev.S1{background:var(--s1)}.sev.S2{background:var(--s2)}.sev.S3{background:var(--s3)}.sev.S4{background:var(--s4)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.info{background:var(--info-soft);color:var(--info)}
input[type=text],input[type=date],input[type=datetime-local],input[type=number],select,textarea{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--panel);width:100%}
textarea{min-height:76px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f>*{color:var(--text)}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px}
label.chk input{width:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media(max-width:620px){.form{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select{width:auto;max-width:230px}
.modal{position:fixed;inset:0;background:rgba(10,16,28,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal.hidden{display:none}
.modal .box{background:var(--panel);border-radius:12px;max-width:820px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal h3{margin:0 0 14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.empty{color:var(--muted);text-align:center;padding:26px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px;font-weight:700}
.upd{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:6px 0}
.upd small{color:var(--muted)}
.fu{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}
.fu>*{min-width:0}
@media(max-width:960px){.fu{grid-template-columns:minmax(0,1fr)}}
.mlist .m{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.mlist .m:hover{background:var(--panel2)}
.mlist .m.sel{background:var(--accent-soft);border-color:var(--accent)}
.mlist .m small{display:block;color:var(--muted)}
.act-row{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 150px 32px;gap:8px;align-items:center;margin-bottom:6px}
@media(max-width:700px){.act-row{grid-template-columns:28px minmax(0,1fr) 32px}.act-row>.ow,.act-row>.du{grid-column:2}}
.chart{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block;min-width:560px}
.chart text{font-size:11px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(80px,160px) minmax(0,1fr) 40px;gap:6px 10px;align-items:center;font-size:13px}
.hbar .bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--accent)}
.crit{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.crit input{width:auto;margin-top:3px}
.crit .tx{flex:1}
.welcome{max-width:640px;margin:30px auto}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fmts{display:grid;gap:10px}
.fmt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fmt p{margin:0;color:var(--muted);font-size:12.5px}
.fmt .btn{grid-row:1/span 2;grid-column:2}
@media(max-width:560px){.fmt{grid-template-columns:minmax(0,1fr)}.fmt .btn{grid-row:auto;grid-column:1;justify-self:start}}
#printArea{display:none}
@media(max-width:720px){header.top{padding:8px 12px}main#app{padding:12px}.brand{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#111}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
}
</style>

  const own={};[...S.incidents.filter(incOpen),...S.pendings.filter(penOpen),...S.activities.filter(actOpen)].forEach(o=>{const w=(o.owner||'').trim();if(w)own[w]=(own[w]||0)+1;});
  const to=Object.entries(own).sort((a,b)=>b[1]-a[1])[0];if(to&&to[1]>=4)I.push(_t('in.owner',esc(to[0]),to[1]));

/* gráfico diário: barras de incidentes abertos e resolvidos por dia + linha de itens em aberto */
function dailyChart(){
  const start=S.project.deployAt?S.project.deployAt.slice(0,10):today(),end=today();
  let d0=dn(start);const d1=dn(end);if(d1-d0>59)d0=d1-59;const N=Math.max(1,d1-d0+1);
  const op=[],rs=[],oi=[],opn=[];
  for(let k=0;k<N;k++){const day=isoDay(d0+k);op.push(S.incidents.filter(i=>i.detectedAt&&i.detectedAt.slice(0,10)===day).length);rs.push(S.incidents.filter(i=>i.resolvedAt&&i.resolvedAt.slice(0,10)===day).length);
    const T=ms(day);oi.push(openIncAt(T).length);opn.push(openPenAt(T).length);}
  const W=900,H=240,pl=34,pr=10,pt=12,pb=28,cw=(W-pl-pr)/N,mx=Math.max(1,...op,...rs,...oi,...opn)*1.12,y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g='';const ys=Math.max(1,Math.ceil(mx/5));for(let v=0;v<=mx;v+=ys)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bw=Math.max(2,cw*.36);
  for(let k=0;k<N;k++){const x=pl+k*cw+cw/2;
    if(op[k])g+=`<rect x="${x-bw}" y="${y(op[k])}" width="${bw}" height="${y(0)-y(op[k])}" fill="var(--s1)" opacity=".85"><title>${fmtD(isoDay(d0+k))}: ${_t('ch.opened')} ${op[k]}</title></rect>`;
    if(rs[k])g+=`<rect x="${x}" y="${y(rs[k])}" width="${bw}" height="${y(0)-y(rs[k])}" fill="var(--ok)" opacity=".85"><title>${fmtD(isoDay(d0+k))}: ${_t('ch.resolved')} ${rs[k]}</title></rect>`;
    const every=Math.ceil(N/10);if(k%every===0)g+=`<text x="${x}" y="${H-8}" text-anchor="middle">${fmtD(isoDay(d0+k)).slice(0,5)}</text>`;}
  const path=a=>a.map((v,k)=>(k?'L':'M')+(pl+k*cw+cw/2).toFixed(1)+','+y(v).toFixed(1)).join('');
  g+=`<path d="${path(oi)}" fill="none" stroke="var(--s2)" stroke-width="2.4"/><path d="${path(opn)}" fill="none" stroke="var(--info)" stroke-width="2.4" stroke-dasharray="6 4"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(_t('ch.aria'))}">${g}</svg></div>
  <div class="legend"><span><i style="background:var(--s1)"></i>${_t('ch.opened')}</span><span><i style="background:var(--ok)"></i>${_t('ch.resolved')}</span><span><i style="background:var(--s2)"></i>${_t('ch.openInc')}</span><span><i style="background:var(--info)"></i>${_t('ch.openPen')}</span></div>`;
}
function compBars(){
  const c={};S.incidents.forEach(i=>{const k=(i.component||'').trim()||_t('noComp');c[k]=(c[k]||0)+1;});
  const e=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...e.map(x=>x[1]));
  return e.length?`<div class="hbar">${e.map(([k,n])=>`<span class="nowrap" style="overflow:hidden;text-overflow:ellipsis">${esc(k)}</span><span class="bar" role="img" aria-label="${esc(k)}: ${n}"><i style="width:${n/mx*100}%"></i></span><b>${n}</b>`).join('')}</div>`:`<div class="empty">${_t('inc.none')}</div>`;
}

function pmTimeline(){
  const E=[],P=S.project;

  (P.phaseLog||[]).forEach(l=>{if(l.phase!=='postdeploy')E.push({at:l.at,tx:_t('tl.phase',_t('ph.'+l.phase))});});
  S.incidents.forEach(i=>{E.push({at:i.detectedAt,tx:`${sevB(i.sev)} ${_t('tl.detected',code('i',i.num),esc(i.title))}`});if(i.resolvedAt)E.push({at:i.resolvedAt,tx:_t('tl.resolved',code('i',i.num),fmtH((ms(i.resolvedAt)-ms(i.detectedAt))/36e5))});});
  S.meetings.forEach(m=>E.push({at:m.date+'T12:00',tx:_t('tl.meeting',esc(m.title))}));
  S.criteria.filter(c=>c.met&&c.metAt).forEach(c=>E.push({at:c.metAt,tx:_t('tl.crit',esc(c.text))}));
  return E.filter(e=>e.at).sort((a,b)=>ms(a.at)-ms(b.at));
}

  const ups=[...S.incidents,...S.pendings].flatMap(o=>(o.updates||[]).filter(u=>u.at&&u.at.slice(0,10)===m.date&&(u.text||u.status)).map(u=>`• ${o.sev?code('i',o.num):code('p',o.num)} ${o.title}: ${u.status?_t((o.sev?'is.':'ps.')+u.status):''}${u.text?(u.status?' — ':'')+u.text:''}`));
  if(ups.length)L.push('',_t('at.updates'),...ups);
  if(m.notes)L.push('',_t('at.notes'),m.notes);
  if(m.decisions)L.push('',_t('at.decisions'),...m.decisions.split('\n').filter(Boolean).map(d=>'• '+d.replace(/^[-•]\s*/,'')));
  if(m.actions.length)L.push('',_t('at.actions'),...m.actions.map(a=>`[${a.done?'x':' '}] ${a.text} — ${a.owner||_t('noOwner')}${a.due?' — '+fmtD(a.due):''}`));
  modal(`<h3 id="mTitle">${_t('at.title')}</h3><textarea id="ataText" rows="20" style="font-family:var(--mono);font-size:12.5px" aria-label="${esc(_t('at.title'))}">${esc(L.join('\n'))}</textarea>
  <div class="row mt"><span class="spacer"></span><button class="btn" data-act="close">${_t('b.close')}</button><button class="btn" data-act="dlAta">${_t('at.dl')}</button><button class="btn primary" data-act="copyAta">${_t('b.copy')}</button></div>`);
}

function docFu(m){

function standalone(title,body){
  return `<!DOCTYPE html>\n<html lang="${LOCALES[LANG]}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>${esc(title)}</title><style>body{margin:24px 16px;background:#fff}${DOC_CSS}</style></head><body><div class="doc">${body}</div></body></html>\n`;
}
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}

function docPdf(kind){
  const d=docOf(kind);if(!d)return;const pa=$('#printArea');pa.innerHTML=`<style>${DOC_CSS}</style><div class="doc">${d.b}</div>`;
  const old=document.title;document.title=`${slug(S.project.name)}-${d.f}`;document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');pa.innerHTML='';document.title=old;window.removeEventListener('afterprint',done);};

function importJson(file){
  const rd=new FileReader();rd.onerror=()=>toast(_t('t.readErr'));
  rd.onload=()=>{let d;try{d=JSON.parse(String(rd.result).replace(/^﻿/,''));}catch(e){toast(_t('t.badJson'));return;}
    if(!d||typeof d!=='object'||!d.project||typeof d.project!=='object'||!Array.isArray(d.incidents)||!Array.isArray(d.pendings)||!Array.isArray(d.activities)){toast(_t('t.notOurs'));return;}
    if(S&&!confirm(_t('t.confirmImport',d.project.name||'—',_p(d.incidents.length,'inc'),_p(d.pendings.length,'pen'),_p(d.activities.length,'act'))))return;
    delete d.export;S=d;normalize();UI.view='dash';UI.meetingId=null;save();render();toast(_t('t.imported'));};
  rd.readAsText(file);
}

    if(ack)i.updates.push({at:ack,text:'',status:'investigating'});if(extra&&extra._u)extra._u.forEach(u=>i.updates.push(u));delete i._u;if(res)i.updates.push({at:res,text:i.resolution,status:st});return i;};
  s.incidents=[
    I('i1','S1','cAuth','Pedro Alves',at(0,'22:40'),at(0,'22:48'),at(1,'01:30'),'closed',1,{usersAffected:n('i1u'),rootCause:n('i1r'),resolution:n('i1s')}),
    I('i2','S2','cOrders','Rafael Lima',at(1,'09:15'),at(1,'09:40'),at(2,'18:00'),'resolved',1,{workaround:n('i2w'),rootCause:n('i2r'),resolution:n('i2s'),_u:[{at:at(1,'15:00'),text:n('i2w'),status:'workaround'}]}),
    I('i3','S3','cCheckout','Sofia Martins',at(2,'11:00'),at(2,'14:00'),at(4,'16:00'),'resolved',1,{rootCause:n('i3r'),resolution:n('i3s')}),
    I('i4','S2','cErp','Rafael Lima',at(5,'10:00'),at(5,'10:30'),'','workaround',0,{workaround:n('i4w'),usersAffected:n('i4u'),_u:[{at:at(5,'17:00'),text:n('i4w'),status:'workaround'},{at:at(8,'11:00'),text:n('i4n'),}]}),
    I('i5','S3','cReports','Sofia Martins',at(6,'15:00'),at(7,'09:00'),'','investigating',0),
    I('i6','S4','cUi','',at(7,'10:00'),'','','open',1),
    I('i7','S3','cNotif','Bruno Teixeira',at(8,'08:30'),at(8,'09:00'),at(8,'17:00'),'closed',0,{rootCause:n('i7r'),resolution:n('i7s')}),
    I('i8','S3','cOrders','Pedro Alves',addD(today(),-1)+'T16:00',addD(today(),-1)+'T16:30','','investigating',1)];
  s.incidents.forEach((i,k)=>i.num=k+1);
  const inc=k=>s.incidents[k].id;
  const Pn=(t,type,pri,st,ow,due,opened,tgt,incId,done)=>({id:uid(),title:n(t),type,priority:pri,status:st,owner:ow,due,openedAt:opened,target:tgt,incident:incId||'',notes:'',doneAt:done||'',createdAt:opened,updates:[{at:opened+'T10:00',text:'',status:'open'}].concat(st!=='open'?[{at:done||addD(today(),-1)+'T10:00',text:'',status:st}]:[])});
  s.pendings=[Pn('p1','bug','high','doing','Rafael Lima',addD(today(),2),addD(D,5),'hypercare',inc(3)),Pn('p2','improvement','medium','open','Sofia Martins',addD(today(),10),addD(D,7),'sustain',inc(4)),
    Pn('p3','config','high','done','Pedro Alves',addD(D,3),addD(D,1),'hypercare',inc(0),at(3,'15:00')),Pn('p4','doc','medium','open','Júlia Rocha',addD(today(),-1),addD(D,2),'hypercare'),
    Pn('p5','improvement','low','transferred','Sofia Martins','',addD(D,7),'sustain',inc(5),at(8,'10:00')),Pn('p6','data','medium','waiting','Rafael Lima',addD(today(),1),addD(D,6),'hypercare',inc(3)),
    Pn('p7','decision','high','open','Marina Costa',addD(P.hcEnd,-2),addD(D,8),'hypercare')];
  s.pendings.forEach((p,k)=>p.num=k+1);s.activities.forEach((a,k)=>a.num=k+1);
  s.meetings=[{id:uid(),date:addD(D,3),title:_t('sm.mt',1),participants:'Marina, Pedro, Rafael, Júlia, Sofia',notes:n('m1n'),decisions:n('m1d'),createdAt:at(3,'09:00'),actions:[{id:uid(),text:n('m1a1'),owner:'Pedro Alves',due:addD(D,4),done:true,doneAt:at(4,'12:00')},{id:uid(),text:n('m1a2'),owner:'Júlia Rocha',due:addD(D,6),done:false}]},
    {id:uid(),date:addD(D,7),title:_t('sm.mt',2),participants:'Marina, Rafael, Sofia, Bruno',notes:n('m2n'),decisions:n('m2d'),createdAt:at(7,'09:00'),actions:[{id:uid(),text:n('m2a1'),owner:'Rafael Lima',due:addD(D,8),done:false},{id:uid(),text:n('m2a2'),owner:'Bruno Teixeira',due:addD(today(),2),done:false}]}];
  s.seq={a:s.activities.length,i:s.incidents.length,p:s.pendings.length};
  return s;
}

/* ===================== Eventos ===================== */
function nextPhase(){const P=S.project,i=PHASES.indexOf(P.phase);if(i>=3)return;const nx=PHASES[i+1];
  if(!confirm(_t('ph.confirm',_t('ph.'+nx))))return;P.phase=nx;(P.phaseLog=P.phaseLog||[]).push({phase:nx,at:nowDT()});save();render();toast(_t('ph.done',_t('ph.'+nx)));}
function actList(to){return to==='pm'?S.pm.actions:(curMeeting()||{actions:[]}).actions;}
const ACT={
  go:el=>{UI.view=el.dataset.view;render();window.scrollTo(0,0);},
  theme:()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(t);store.set('theme',t);},
  open:el=>openItem(el.dataset.k,el.dataset.id),
  new:el=>openItem(el.dataset.k,null),
  close:()=>closeModal(),
  delItem:el=>{if(!confirm(_t('t.confirmDel')))return;const k=el.dataset.k,arr=coll(k),i=arr.findIndex(x=>x.id===el.dataset.id);if(i>=0)arr.splice(i,1);if(k==='inc')S.pendings.forEach(p=>{if(p.incident===el.dataset.id)p.incident='';});save();closeModal();render();},
  nextPhase:()=>nextPhase(),
  sample:()=>{S=sample();normalize();UI.view='dash';UI.meetingId=null;save();render();toast(_t('t.sample'));},
  sampleReplace:()=>{if(confirm(_t('t.confirmSample')))ACT.sample();},
  reset:()=>{if(!confirm(_t('t.confirmReset')))return;S=null;try{localStorage.removeItem('hypercare.data');}catch(e){}render();},
  exportMenu:()=>openExportMenu(),
  exportJson:()=>{closeModal();exportJson();},
  importFile:()=>{const f=$('#impFile');f.value='';f.click();},
  docHtml:()=>{closeModal();docHtml('full');},docPdf:()=>{closeModal();docPdf('full');},
  pmHtml:()=>{closeModal();docHtml('pm');},pmPdf:()=>docPdf('pm'),
  fuHtml:()=>docHtml('fu'),fuPdf:()=>docPdf('fu'),
  ata:()=>openAta(),
  copyAta:async()=>{const ta=$('#ataText');try{await navigator.clipboard.writeText(ta.value);}catch(e){ta.select();document.execCommand('copy');}toast(_t('t.copied'));},
  dlAta:()=>{const m=curMeeting();download(`${_t('at.file')}-${m.date}.txt`,$('#ataText').value,'text/plain');},
  newMeeting:()=>{const last=[...S.meetings].sort((a,b)=>a.date<b.date?1:-1)[0];const m={id:uid(),date:today(),title:_t('fu.newTitle',S.meetings.length+1),participants:last?last.participants:'',notes:'',decisions:'',actions:[],createdAt:nowISO()};S.meetings.push(m);UI.meetingId=m.id;save();render();},
  selMeeting:el=>{UI.meetingId=el.dataset.id;render();},
  delMeeting:()=>{if(!confirm(_t('t.confirmDelMeeting')))return;S.meetings=S.meetings.filter(m=>m.id!==UI.meetingId);UI.meetingId=null;save();render();},
  addAction:el=>{const arr=actList(el.dataset.to);arr.push({id:uid(),text:'',owner:'',due:addD(today(),7),done:false,createdAt:nowISO()});save();render();const ins=$$(`[data-a="text"][data-to="${el.dataset.to}"]`);if(ins.length)ins[ins.length-1].focus();},
  delAction:el=>{const arr=actList(el.dataset.to),i=arr.findIndex(a=>a.id===el.dataset.id);if(i>=0)arr.splice(i,1);save();render();},
  addCrit:()=>{const v=($('#critNew').value||'').trim();if(!v){$('#critNew').focus();return;}S.criteria.push({id:uid(),text:v,met:false,metAt:''});save();render();const n=$('#critNew');if(n)n.focus();},
  delCrit:el=>{if(!confirm(_t('t.confirmDel')))return;S.criteria=S.criteria.filter(c=>c.id!==el.dataset.id);save();render();}
};
function setTheme(t){document.documentElement.dataset.theme=t;const b=$('#themeBtn');if(b)b.setAttribute('aria-pressed',t==='dark');}
function setLang(l,keep){if(!LANGS.includes(l))l='pt';LANG=l;store.set('lang',l);if(!keep&&history.replaceState)history.replaceState(null,'',l==='pt'?location.pathname+location.search:'#'+l);applyStatic();render();}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&ACT[el.dataset.act]&&el.type!=='checkbox'){e.preventDefault();ACT[el.dataset.act](el);return;}
  const tab=e.target.closest('#tabs [role=tab]');if(tab&&S){UI.view=tab.dataset.view;render();window.scrollTo(0,0);return;}
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act][tabindex]:not(button)')){e.preventDefault();e.target.click();}
  if(e.target.matches('#tabs [role=tab]')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const t=$$('#tabs [role=tab]'),i=t.indexOf(e.target),n=t[(i+(e.key==='ArrowRight'?1:-1)+t.length)%t.length];n.focus();n.click();}
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='newProj'){const v=new FormData(f);if(v.get('hcEnd')<v.get('deployAt').slice(0,10)){toast(_t('t.badEnd'));return;}
    S=blank();Object.assign(S.project,{name:v.get('name').trim(),system:v.get('system').trim(),release:v.get('release').trim(),deployAt:v.get('deployAt'),hcEnd:v.get('hcEnd'),manager:v.get('manager').trim(),phaseLog:[{phase:'postdeploy',at:v.get('deployAt')}]});
    S.criteria=['dc1','dc2','dc3','dc4'].map(k=>({id:uid(),text:_t(k),met:false,metAt:''}));
    S.activities=['da1','da2','da3','da4','da5'].map((k,i)=>({id:uid(),num:i+1,title:_t(k),phase:'postdeploy',status:'todo',owner:'',due:addD(v.get('deployAt').slice(0,10),1),notes:'',createdAt:nowISO()}));S.seq.a=5;
    UI.view='dash';save();render();toast(_t('t.created'));}
  if(f.id==='projForm'){const v=new FormData(f),P=S.project;if(v.get('hcEnd')<v.get('deployAt').slice(0,10)){toast(_t('t.badEnd'));return;}
    const ph=v.get('phase');if(ph!==P.phase)(P.phaseLog=P.phaseLog||[]).push({phase:ph,at:nowDT()});
    Object.assign(P,{name:v.get('name').trim(),system:v.get('system').trim(),release:v.get('release').trim(),deployAt:v.get('deployAt'),hcEnd:v.get('hcEnd'),manager:v.get('manager').trim(),phase:ph,description:v.get('description')});save();render();toast(_t('t.updated'));}
  if(f.id==='slaForm'){const v=new FormData(f);SEVS.forEach(s=>{const a=+v.get(s+'.resp'),b=+v.get(s+'.res');if(a>0)S.settings.sla[s].resp=a;if(b>0)S.settings.sla[s].res=b;});const sh=+v.get('staleHours');if(sh>0)S.settings.staleHours=sh;save();render();toast(_t('t.updated'));}
  if(f.id==='itemForm')saveItem(f);
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&el.dataset.f.endsWith('.q')){const [k]=el.dataset.f.split('.');UI.f[k].q=el.value;const pos=el.selectionStart;render();const n=$(`[data-f="${k}.q"]`);if(n){n.focus();n.setSelectionRange(pos,pos);}}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='lang'){setLang(el.value);return;}
  if(el.id==='impFile'){if(el.files[0])importJson(el.files[0]);return;}
  if(el.dataset.f&&!el.dataset.f.endsWith('.q')){const [k,p]=el.dataset.f.split('.');UI.f[k][p]=el.value;render();return;}
  if(!S)return;
  if(el.dataset.m){const m=curMeeting();if(!m)return;if(el.dataset.m==='date'&&!el.value)return;m[el.dataset.m]=el.value;save();if(el.dataset.m!=='notes'&&el.dataset.m!=='decisions')render();return;}
  if(el.dataset.q){const k=el.dataset.q,o=coll(k).find(x=>x.id===el.dataset.id);if(!o)return;const nIn=$(`[data-qn="${k}"][data-id="${o.id}"]`),note=nIn?nIn.value.trim():'';
    const ch=k==='inc'?setIncStatus(o,el.value,note):k==='pen'?setPenStatus(o,el.value,note):setActStatus(o,el.value);if(ch){save();render();toast(_t('t.updated'));}return;}
  if(el.dataset.qn){const k=el.dataset.qn,o=coll(k).find(x=>x.id===el.dataset.id);if(!o||!el.value.trim())return;(k==='inc'?setIncStatus:setPenStatus)(o,o.status,el.value.trim());save();render();toast(_t('t.noteSaved'));return;}
  if(el.dataset.a){const a=actList(el.dataset.to).find(x=>x.id===el.dataset.id);if(!a)return;a[el.dataset.a]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.a==='done')a.doneAt=el.checked?nowDT():'';save();if(el.type==='checkbox')render();return;}
  if(el.dataset.pa){const [mid,aid]=el.dataset.pa.split('|');const a=(S.meetings.find(x=>x.id===mid)||{actions:[]}).actions.find(x=>x.id===aid);if(a){a.done=el.checked;a.doneAt=el.checked?nowDT():'';save();render();toast(_t('t.actDone'));}return;}
  if(el.dataset.pm){S.pm[el.dataset.pm]=el.value;save();return;}
  if(el.dataset.crit){const c=S.criteria.find(x=>x.id===el.dataset.id);if(c){c.met=el.checked;c.metAt=el.checked?nowDT():'';save();render();}return;}
});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(LANGS.includes(h)&&h!==LANG)setLang(h,true);});

/* ===================== Inicialização ===================== */
(()=>{const h=(location.hash||'').slice(1);let l=LANGS.includes(h)?h:store.get('lang',null);
  if(!LANGS.includes(l)){const nl=((navigator.languages&&navigator.languages[0])||navigator.language||'pt').slice(0,2).toLowerCase();l=LANGS.includes(nl)?nl:'pt';}LANG=l;
  let th=store.get('theme',null);if(th!=='dark'&&th!=='light')th=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';setTheme(th);
  S=store.get('data',null);if(S&&(!S.project||!Array.isArray(S.incidents)))S=null;normalize();})();
applyStatic();render();
})();
