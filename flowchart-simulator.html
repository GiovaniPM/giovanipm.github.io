<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nenhum dado sai deste arquivo: sem rede e sem eval. As expressões passam por um interpretador próprio. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Flowchart Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f5f99'/%3E%3Cpath d='M8 2.5 12 6 8 9.5 4 6z' fill='none' stroke='white' stroke-width='1.3'/%3E%3Cpath d='M8 9.5V13.5' stroke='white' stroke-width='1.3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f1;--panel:#fff;--panel2:#f8f8f6;--text:#1b2022;--muted:#60686c;--line:#d9dcd6;--line2:#e9ebe6;
  --accent:#1f5f99;--accent-text:#fff;--accent-soft:#e0ecf7;--danger:#b3261e;--danger-soft:#fbe9e7;--warn:#8a5a00;--warn-soft:#fdf3dc;--ok:#1f7a3d;--ok-soft:#e2f3e7;
  --canvas:#fbfbf9;--dot:#d5d8d1;--flow:#4a5358;--sel:#d9480f;--token:#d9480f;--walk:#d9480f;
  --c-bar:#2a78d6;--c-grid:#e1e0d9;--c-base:#c3c2b7;--c-muted:#6f6d68;
  --st-f:#dff3e4;--st-l:#2b7a45;--en-f:#fbe4e2;--en-l:#b3362c;--pr-f:#e4f0fb;--pr-l:#1f5f99;--de-f:#fdf0d0;--de-l:#9a6a00;--io-f:#efeafa;--io-l:#65509c;
  --su-f:#dcf1ec;--su-l:#176b5b;--dl-f:#fae6ef;--dl-l:#a8406f;--dc-f:#e9edf1;--dc-l:#55636f;--da-f:#f1ecd9;--da-l:#7a6a2b;--no-f:#fdf8d5;--no-l:#b3a24a;--co-f:#fff;--co-l:#4a5358;
  --n-text:#1b2022;--n-muted:#60686c;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#14171a;--panel:#1b1f23;--panel2:#21262a;--text:#e5e8ea;--muted:#9aa2a8;--line:#343a40;--line2:#2a2f34;
  --accent:#6db5ee;--accent-text:#0b1a26;--accent-soft:#1c3247;--danger:#ef8a80;--danger-soft:#3b211f;--warn:#e3b45a;--warn-soft:#352a14;--ok:#6cc98a;--ok-soft:#1c3522;
  --canvas:#171a1d;--dot:#30363b;--flow:#a7afb5;--sel:#ff8f5a;--token:#ff8f5a;--walk:#ff8f5a;
  --c-bar:#3987e5;--c-grid:#2c2c2a;--c-base:#383835;--c-muted:#9a9890;
  --st-f:#1c3522;--st-l:#74c98b;--en-f:#3b211f;--en-l:#ef8a80;--pr-f:#1c3247;--pr-l:#6db5ee;--de-f:#352a14;--de-l:#e3b45a;--io-f:#2b2640;--io-l:#a795dd;
  --su-f:#16332d;--su-l:#58c4ad;--dl-f:#38202c;--dl-l:#e58db3;--dc-f:#262c31;--dc-l:#a7b4bf;--da-f:#302c1a;--da-l:#cdbb72;--no-f:#2f2d18;--no-l:#a89a4e;--co-f:#21262a;--co-l:#a7afb5;
  --n-text:#e5e8ea;--n-muted:#9aa2a8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--sans);color:var(--text);background:var(--bg);display:grid;grid-template-rows:46px minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--panel2);border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.danger{color:var(--danger)}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;width:100%}
input[type=checkbox]{accent-color:var(--accent);margin:0}
textarea{resize:vertical}
textarea.mono,input.mono{font:12px/1.5 var(--mono)}
code,.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.spacer{flex:1}
.hidden{display:none!important}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}

#topbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
#brand{font-weight:650;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:4px}
#brand svg{width:18px;height:18px;flex:none}
.tools{display:flex;align-items:center;gap:5px}
#modes{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
#modes button{border:none;border-radius:0;padding:5px 13px;background:var(--panel)}
#modes button+button{border-left:1px solid var(--line)}
#modes button[aria-selected=true]{background:var(--accent);color:var(--accent-text);font-weight:600}
.menu{position:relative}
.menu-list{position:absolute;left:0;top:calc(100% + 3px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:40;min-width:230px;padding:4px}
.menu-list button{display:block;width:100%;text-align:left;border:none;background:none;padding:5px 9px;border-radius:4px}
.menu-list button:hover:not(:disabled){background:var(--accent-soft)}
.menu-list hr{border:none;border-top:1px solid var(--line2);margin:4px 0}
.menu-list .mh{font-size:11px;color:var(--muted);padding:4px 9px 2px;font-weight:650}
#clock{font:600 12px var(--mono);white-space:nowrap}
#status{color:var(--muted);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#speed,#lang{width:auto}

#main{display:grid;grid-template-columns:186px minmax(0,1fr) 300px;min-height:0}
#left,#right{background:var(--panel2);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.side-title{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:10px 12px 4px}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px 10px 8px}
.pal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;touch-action:none;font-size:11px;white-space:normal;line-height:1.12;cursor:grab;min-height:58px}
.pal svg{width:44px;height:28px;pointer-events:none;flex:none}
#outline{overflow:auto;flex:1;padding-bottom:10px;min-height:0}
.out{display:flex;gap:6px;width:100%;border:none;border-radius:0;background:none;text-align:left;padding:3px 12px;font-size:12px;align-items:baseline}
.out:hover:not(:disabled){background:var(--line2)}
.out.active{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.out i{font:600 10px var(--mono);color:var(--muted);font-style:normal;flex:none;min-width:22px}
.out span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#center{display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-height:0;min-width:0}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--canvas)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;outline:none}
#zoombar{position:absolute;left:10px;bottom:10px;display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px}
#zoombar button{border:none;background:none;padding:2px 8px}
#zoombar span{align-self:center;font:11px var(--mono);color:var(--muted);min-width:40px;text-align:center}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:20px}
#empty>div{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 30px;width:min(540px,100%);text-align:center}
#empty h1{font-size:18px;margin:0 0 6px;font-weight:650}
#empty p{margin:0 0 16px;color:var(--muted)}
#empty .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#renamer{position:absolute;z-index:20;text-align:center;font:13px/1.25 var(--sans);border:2px solid var(--accent);border-radius:4px;padding:3px;background:var(--panel);resize:none;overflow:hidden}
#quick{position:absolute;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:5px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:252px}
#quick button{font-size:11px;padding:4px;white-space:normal;line-height:1.15}
#sheets{display:flex;align-items:center;gap:3px;padding:4px 8px;background:var(--panel2);border-top:1px solid var(--line);overflow-x:auto;min-width:0}
#sheets button{padding:2px 10px;font-size:12px;flex:none}
#sheets button[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}

/* desenho */
.grid-dot{fill:var(--dot)}
.node{cursor:move}
.mode-sim .node{cursor:pointer}
.mode-sim .port,.mode-sim .rz{display:none}
.port{fill:var(--accent);stroke:var(--canvas);stroke-width:1.5;opacity:0;cursor:crosshair}
.node:hover .port,.node.sel .port{opacity:1}
.rz{fill:var(--canvas);stroke:var(--sel);stroke-width:1.5;cursor:nwse-resize}
.ep{fill:var(--sel);stroke:var(--canvas);stroke-width:1.5;cursor:grab}
.preview{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.marquee{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-dasharray:4 3;pointer-events:none}
.e-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.tok{fill:var(--token);stroke:var(--canvas);stroke-width:2;pointer-events:none}
.bp{fill:var(--danger);stroke:var(--canvas);stroke-width:1.5}
.node.tgt .n-shape{stroke:var(--accent);stroke-width:3.5}
.node.sel .n-shape{stroke:var(--sel);stroke-width:3}
.node.active .n-shape{stroke:var(--token);stroke-width:4}
.node.err .n-shape{stroke:var(--danger);stroke-width:4}
.node.dim{opacity:.55}
.edge.sel .e-line{stroke:var(--sel);stroke-width:2.6}
.edge.sel .e-arrow{fill:var(--sel)}
.edge.walked .e-line{stroke:var(--walk);stroke-width:2.4}
.edge.walked .e-arrow{fill:var(--walk)}
.edge.dim{opacity:.4}

/* inspetor */
#inspector{overflow:auto;flex:1;padding:10px 12px 16px;display:flex;flex-direction:column;gap:9px;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 8px 0;gap:2px;flex:none}
.rt{border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:none;color:var(--muted);padding:4px 11px;margin-bottom:-1px}
.rt[aria-selected=true]{background:var(--panel2);border-color:var(--line);border-bottom-color:var(--panel2);color:var(--text);font-weight:600}
.rt b{background:var(--danger);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:3px}
.rt b.w{background:var(--warn);color:var(--panel)}
.field{display:flex;flex-direction:column;gap:3px}
.field>span,.lab{font-size:12px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted);line-height:1.35}
.ferr{font:11px var(--mono);color:var(--danger);white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h4{margin:6px 0 0;font-size:13px;font-weight:650}
.type{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.issue{display:block;width:100%;text-align:left;white-space:normal;padding:6px 8px;border-left:3px solid var(--warn);border-radius:0 5px 5px 0;font-size:12px}
.issue.error{border-left-color:var(--danger)}
.issue small{display:block;color:var(--muted)}
.ok-msg{color:var(--ok)}
.branch{border:1px solid var(--line2);border-radius:6px;padding:7px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}

/* simulação */
#now{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:9px;display:flex;flex-direction:column;gap:7px}
#now.ask{border-color:var(--token);box-shadow:0 0 0 1px var(--token)}
#now b{font-size:14px;font-weight:650}
.vars{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:2px 10px;font-size:12px;margin:0}
.vars dt{font-family:var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.vars dd{margin:0;font-family:var(--mono);word-break:break-word}
.vars dd.chg{color:var(--token);font-weight:700}
#simpanel{height:290px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative}
#simgrip{position:absolute;left:0;right:0;top:-3px;height:6px;cursor:ns-resize;z-index:3;touch-action:none}
#simtabs{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line2);align-items:center;flex:none}
.st{padding:2px 10px;font-size:12px}
.st[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent)}
#simbody{overflow:auto;flex:1;min-height:0}
table.t{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:3px 9px;text-align:left;vertical-align:top}
table.t th{position:sticky;top:0;background:var(--panel2);font-weight:600;font-size:11px;color:var(--muted);z-index:1;white-space:nowrap}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.m{font-family:var(--mono)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}
table.t tr.cur td{background:var(--accent-soft)}
table.t tr.err td{background:var(--danger-soft);color:var(--danger)}
.pad{padding:12px}
.con{font:12px/1.5 var(--mono);padding:8px 12px;white-space:pre-wrap;word-break:break-word}
.con div{display:flex;gap:10px}
.con i{color:var(--muted);font-style:normal;flex:none;min-width:48px;text-align:right}
.con .sys{color:var(--muted)}
.con .e{color:var(--danger)}
.bar-row{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.bar-row .field{width:110px}
.tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.neutral{background:var(--line2);color:var(--muted)}
.sc-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.1fr);min-height:100%}
.sc-grid>div:first-child{border-right:1px solid var(--line2)}
.sc-form{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px}
.kpi{border:1px solid var(--line2);border-radius:7px;padding:6px 12px;min-width:86px;background:var(--panel2)}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.an-grid{display:grid;grid-template-columns:minmax(320px,1.4fr) minmax(240px,1fr);gap:0 14px;padding:0 12px 8px}
.an-grid h4{margin:4px 0 5px}
.chart-wrap{position:relative;min-width:0}
.chart-wrap svg{display:block;width:100%;height:auto;max-width:640px}
.an-grid>div{min-width:0}
.ht-bar{fill:var(--c-bar)}
.ht-hit{fill:transparent}
.ht-col:hover .ht-bar{filter:brightness(.88)}
.c-grid{stroke:var(--c-grid);stroke-width:1}.c-base{stroke:var(--c-base);stroke-width:1}
.c-tick{fill:var(--c-muted);font:11px var(--sans);font-variant-numeric:tabular-nums}
.c-tip{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap;z-index:5}
.mini{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px}
.mini span:first-child{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .tr{flex:1;height:10px;background:var(--line2);border-radius:3px;overflow:hidden}
.mini .tr i{display:block;height:100%;background:var(--c-bar);border-radius:0 3px 3px 0}
.mini b{font-weight:600;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

/* documentação */
#docview{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
#docside{background:var(--panel2);border-right:1px solid var(--line);overflow:auto;padding:10px 12px 18px;display:flex;flex-direction:column;gap:8px}
#docscroll{overflow:auto;background:var(--bg);padding:22px}
#paper{background:#fff;max-width:900px;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.18);border-radius:3px}
.doc-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sec-check{display:flex;align-items:center;gap:7px;padding:2px 0}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0;width:min(480px,94vw);max-height:90vh;box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog.wide{width:min(760px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg header{padding:12px 16px;font-weight:650;font-size:14px;border-bottom:1px solid var(--line2)}
.dlg .b{padding:14px 16px;overflow:auto;flex:1}
.dlg .b h4{margin:14px 0 4px}.dlg .b h4:first-child{margin-top:0}
.dlg .b p{margin:0 0 8px}
.dlg .b ul{margin:0 0 8px;padding-left:18px}
.dlg footer{padding:10px 16px;display:flex;justify-content:flex-end;gap:6px;border-top:1px solid var(--line2)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:54px;z-index:9999;display:flex;flex-direction:column;gap:6px;max-width:min(520px,90vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:5px;padding:7px 10px;box-shadow:0 4px 18px rgba(0,0,0,.2);display:flex;gap:10px;white-space:pre-wrap}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
.toast span{flex:1}.toast button{border:none;background:none;padding:0 3px;color:var(--muted)}

@media (max-width:1100px){
  #main{grid-template-columns:150px minmax(0,1fr) 250px}
  #brand span,#status{display:none}
  #modes button{padding:5px 9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  #topbar,#docside,#toasts{display:none!important}
  body.mode-doc #main{display:none!important}
  body:not(.mode-doc) #left,body:not(.mode-doc) #right,#sheets,#zoombar,#simpanel{display:none!important}
  body:not(.mode-doc) #main{display:block}
  body:not(.mode-doc) #stage{position:fixed;inset:0;background:#fff}
  body.mode-doc #docview{display:block}
  #docscroll{overflow:visible;background:#fff;padding:0}
  #paper{box-shadow:none;max-width:none}
}
</style>
</head>
<body>
<header id="topbar">
  <div id="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#1f5f99"/><path d="M8 2.5 12 6 8 9.5 4 6z" fill="none" stroke="#fff" stroke-width="1.3"/><path d="M8 9.5V13.5" stroke="#fff" stroke-width="1.3"/></svg><span>Flowchart Simulator</span></div>
  <div id="modes" role="tablist">
    <button role="tab" data-mode="edit" data-tx="mEdit"></button>
    <button role="tab" data-mode="sim" data-tx="mSim"></button>
    <button role="tab" data-mode="doc" data-tx="mDoc"></button>
  </div>
  <div class="sep"></div>
  <div class="tools">
    <div class="menu"><button id="b-file" aria-haspopup="true" data-tx="file"></button></div>
    <div class="tools" id="edit-tools">
      <button id="b-undo" data-title="undoKey" aria-label="↶">↶</button>
      <button id="b-redo" data-title="redoKey" aria-label="↷">↷</button>

    case'bin':{
      if(a.op==='&&')return evalAst(a.l,c)&&evalAst(a.r,c);
      if(a.op==='||')return evalAst(a.l,c)||evalAst(a.r,c);
      return binOp(a.op,evalAst(a.l,c),evalAst(a.r,c));
    }
  }
  throw new ExprError('?');
}
function binOp(op,l,r){
  switch(op){
    case'==':return eqVal(l,r);
    case'!=':return!eqVal(l,r);
    case'+':
      if(Array.isArray(l)&&Array.isArray(r))return[...l,...r];
      if(typeof l==='string'||typeof r==='string')return fmtPlain(l)+fmtPlain(r);
      return num(l,'+')+num(r,'+');
    case'<':case'<=':case'>':case'>=':
      if(typeof l==='string'&&typeof r==='string')return op==='<'?l<r:op==='<='?l<=r:op==='>'?l>r:l>=r;
      l=num(l,op);r=num(r,op);return op==='<'?l<r:op==='<='?l<=r:op==='>'?l>r:l>=r;
    case'-':return num(l,'-')-num(r,'-');
    case'*':return num(l,'*')*num(r,'*');
    case'/':if(num(r,'/')===0)throw new ExprError(t('xDiv0'));return num(l,'/')/r;
    case'%':if(num(r,'%')===0)throw new ExprError(t('xDiv0'));return num(l,'%')%r;
    case'^':return Math.pow(num(l,'^'),num(r,'^'));
  }
  throw new ExprError('?');
}
function parseLiteral(s){
  const v=String(s).trim();
  if(v==='')return'';
  if(/^(true|false)$/i.test(v))return v.toLowerCase()==='true';
  const n=Number(v.replace(/^(-?\d+),(\d+)$/,'$1.$2'));
  if(Number.isFinite(n))return n;
  if(v[0]==='['||v[0]==='"'||v[0]==="'"){try{return evalAst(parseExpr(v),{vars:Object.create(null),rng:new RNG(1)})}catch{}}
  return v;
}

/* ========== modelo ========== */
const TYPES={
  start:{w:128,h:48,flag:'st'},end:{w:128,h:48,flag:'en'},process:{w:160,h:64,flag:'pr'},decision:{w:176,h:96,flag:'de'},
  input:{w:168,h:64,flag:'io'},output:{w:168,h:64,flag:'io'},subprocess:{w:168,h:64,flag:'su'},delay:{w:136,h:56,flag:'dl'},
  document:{w:152,h:72,flag:'dc'},data:{w:136,h:80,flag:'da'},connector:{w:32,h:32,flag:'co'},note:{w:176,h:72,flag:'no'},
};
const TYPE_ORDER=Object.keys(TYPES);
const NODE_DEFAULTS={text:'',desc:'',resp:'',duration:'',cost:'',code:'',var:'',prompt:'',sample:'',mode:'cond',expr:'',target:'',bp:false};
const EDGE_DEFAULTS={label:'',branch:'',value:'',prob:'',fromSide:'',toSide:''};
const SIDES=['N','E','S','W'];
const DOC_SECTIONS=['overview','diagram','procedure','decisions','roles','data','paths','tests','analysis','issues','notes','revisions'];
function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function newModel(){
  return{app:'flowchart-simulator',v:1,
    meta:{title:t('untitled'),version:'1.0',author:'',owner:'',date:today(),purpose:'',scope:'',timeUnit:'min',currency:'',revisions:''},
    sheets:[{id:'main',name:t('mainSheet'),nodes:[],edges:[]}],scenarios:[],
    settings:{seed:42,runs:1000,maxSteps:5000},doc:{off:[]}};
}
function makeNode(type,x,y,text,extra){
  const d=TYPES[type];
  return{id:uid('n'),type,x,y,w:d.w,h:d.h,...NODE_DEFAULTS,text:text??'',...extra};
}
function makeEdge(from,to,extra){return{id:uid('e'),from,to,...EDGE_DEFAULTS,...extra}}
function loadModel(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.sheets)||o.app!=='flowchart-simulator')throw new Error(t('notModel'));
  const base=newModel(),str=v=>v==null?'':String(v),nums=(v,d)=>Number.isFinite(Number(v))?Number(v):d;
  const m={...base,meta:{...base.meta},settings:{...base.settings},doc:{off:[]},sheets:[],scenarios:[]};
  for(const k of Object.keys(base.meta))if(o.meta&&o.meta[k]!=null)m.meta[k]=str(o.meta[k]);
  m.settings.seed=nums(o.settings?.seed,42);
  m.settings.runs=Math.min(100000,Math.max(1,nums(o.settings?.runs,1000)));
  m.settings.maxSteps=Math.min(1000000,Math.max(10,nums(o.settings?.maxSteps,5000)));
  if(Array.isArray(o.doc?.off))m.doc.off=o.doc.off.filter(x=>DOC_SECTIONS.includes(x));
  const sheetIds=new Set(),nodeIds=new Set(),edgeIds=new Set();
  for(const s of o.sheets){
    if(!s||typeof s!=='object')continue;
    let id=str(s.id)||uid('s');if(sheetIds.has(id))id=uid('s');sheetIds.add(id);
    const sh={id,name:str(s.name)||id,nodes:[],edges:[]};
    for(const n of Array.isArray(s.nodes)?s.nodes:[]){
      if(!n||!TYPES[n.type])continue;
      let nid=str(n.id)||uid('n');if(nodeIds.has(nid))nid=uid('n');nodeIds.add(nid);
      const d=TYPES[n.type],x={id:nid,type:n.type,x:nums(n.x,0),y:nums(n.y,0),w:Math.max(24,nums(n.w,d.w)),h:Math.max(24,nums(n.h,d.h))};
      for(const k of Object.keys(NODE_DEFAULTS))x[k]=k==='bp'?!!n.bp:str(n[k]??NODE_DEFAULTS[k]);
      if(!['cond','prob','ask'].includes(x.mode))x.mode='cond';
      sh.nodes.push(x);
    }
    const here=new Set(sh.nodes.map(n=>n.id));
    for(const e of Array.isArray(s.edges)?s.edges:[]){
      if(!e||!here.has(str(e.from))||!here.has(str(e.to)))continue;
      let eid=str(e.id)||uid('e');if(edgeIds.has(eid))eid=uid('e');edgeIds.add(eid);
      const x={id:eid,from:str(e.from),to:str(e.to)};
      for(const k of Object.keys(EDGE_DEFAULTS))x[k]=str(e[k]??'');
      if(!['','yes','no','case','else'].includes(x.branch))x.branch='';
      if(!SIDES.includes(x.fromSide))x.fromSide='';
      if(!SIDES.includes(x.toSide))x.toSide='';
      sh.edges.push(x);
    }
    m.sheets.push(sh);
  }
  if(!m.sheets.length)m.sheets=base.sheets;
  for(const c of Array.isArray(o.scenarios)?o.scenarios:[]){
    if(c&&typeof c==='object')m.scenarios.push({id:str(c.id)||uid('c'),name:str(c.name),desc:str(c.desc),inputs:str(c.inputs),choices:str(c.choices),asserts:str(c.asserts)});
  }
  return m;
}
const sheetOf=(m,id)=>m.sheets.find(s=>s.id===id);
const nodeOf=(sh,id)=>sh.nodes.find(n=>n.id===id);
const outEdges=(sh,id)=>sh.edges.filter(e=>e.from===id);
const inEdges=(sh,id)=>sh.edges.filter(e=>e.to===id);
const typeName=type=>t('ty_'+type);
function nodeName(n){return(n.text||'').replace(/\s*\n\s*/g,' ').trim()||typeName(n.type)}
function branchLabel(e){
  if(e.label)return e.label;
  if(e.branch==='yes')return t('yes');
  if(e.branch==='no')return t('no');
  if(e.branch==='else')return t('otherwise');
  if(e.branch==='case')return e.value||'';
  return'';
}
function edgeText(e,from){
  const b=branchLabel(e);
  if(from&&from.type==='decision'&&from.mode==='prob'&&e.prob!=='')return b?`${b} (${e.prob}%)`:`${e.prob}%`;
  return b;
}
function connectProblem(sh,a,b){
  if(a.id===b.id)return t('lkSelf');
  if(a.type==='note'||b.type==='note')return t('lkNote');
  if(a.type==='end')return t('lkEnd');
  if(b.type==='start')return t('lkStart');
  if(sh.edges.some(e=>e.from===a.id&&e.to===b.id))return t('lkDup');
  if(a.type!=='decision'&&outEdges(sh,a.id).length)return t('lkOne');
  return'';
}
function nextBranch(sh,a){
  if(a.type!=='decision')return'';
  const used=outEdges(sh,a.id).map(e=>e.branch);
  if(a.mode==='cond'){if(!used.includes('yes'))return'yes';if(!used.includes('no'))return'no';return'case'}
  if(!used.includes('yes'))return'yes';if(!used.includes('no'))return'no';return'case';
}
/* numeração das etapas: percurso em profundidade, ramo "sim" primeiro */
function stepNumbers(m){
  const map=new Map();
  m.sheets.forEach((sh,si)=>{
    const prefix=m.sheets.length>1&&si>0?`${si}.`:'';
    const seen=new Set();let k=0;
    const order={yes:0,'':1,case:2,no:3,else:4};
    const visit=id=>{
      const stack=[id];
      while(stack.length){
        const c=stack.pop();
        if(seen.has(c))continue;
        seen.add(c);
        const n=nodeOf(sh,c);if(!n)continue;
        if(n.type!=='note'&&n.type!=='connector')map.set(n.id,prefix+(++k));
        const outs=outEdges(sh,c).slice().sort((a,b)=>order[b.branch]-order[a.branch]);
        for(const e of outs)stack.push(e.to);
      }
    };
    sh.nodes.filter(n=>n.type==='start').forEach(n=>visit(n.id));
    sh.nodes.filter(n=>n.type!=='start'&&n.type!=='note'&&!inEdges(sh,n.id).length).forEach(n=>visit(n.id));
    sh.nodes.forEach(n=>{if(n.type!=='note')visit(n.id)});
  });
  return map;
}

/* ========== verificação ========== */
function checkModel(m){
  const out=[];
  const add=(sev,sh,node,edge,msg)=>out.push({sev,sheet:sh.id,node:node&&node.id,edge:edge&&edge.id,msg});
  m.sheets.forEach((sh,si)=>{
    const steps=sh.nodes.filter(n=>n.type!=='note');
    if(!steps.length){if(si===0)add('warn',sh,null,null,t('iEmpty',sh.name));return}
    const starts=steps.filter(n=>n.type==='start'),ends=steps.filter(n=>n.type==='end');
    if(!starts.length)add('error',sh,null,null,t('iNoStart',sh.name));
    if(starts.length>1)add('error',sh,starts[1],null,t('iManyStart',sh.name));
    if(!ends.length)add('error',sh,null,null,t('iNoEnd',sh.name));
    const reach=new Set(),stack=starts.map(n=>n.id);
    while(stack.length){const c=stack.pop();if(reach.has(c))continue;reach.add(c);outEdges(sh,c).forEach(e=>stack.push(e.to))}
    const back=new Set(),st2=ends.map(n=>n.id);
    while(st2.length){const c=st2.pop();if(back.has(c))continue;back.add(c);inEdges(sh,c).forEach(e=>st2.push(e.from))}
    for(const n of steps){
      const nm=nodeName(n),outs=outEdges(sh,n.id);
      if(!n.text.trim()&&n.type!=='connector')add('warn',sh,n,null,t('iNoText',typeName(n.type)));
      if(starts.length&&!reach.has(n.id))add('error',sh,n,null,t('iUnreach',nm));
      else if(ends.length&&reach.has(n.id)&&!back.has(n.id)&&n.type!=='end'&&outs.length)add('error',sh,n,null,t('iTrap',nm));
      if(n.type!=='end'&&!outs.length)add('error',sh,n,null,t('iDead',nm));
      if(n.type!=='decision'&&outs.length>1)add('error',sh,n,null,t('iMulti',nm));
      for(const[f,err]of[[t('duration'),exprError(n.duration)],[t('cost'),exprError(n.cost)]])if(err)add('error',sh,n,null,t('iExpr',nm,f,err));
      if(['start','process','data'].includes(n.type)&&stmtError(n.code))add('error',sh,n,null,t('iExpr',nm,t('code'),stmtError(n.code)));
      if(['output','document'].includes(n.type)&&tplError(n.code))add('error',sh,n,null,t('iExpr',nm,t('tplLabel'),tplError(n.code)));
      if(n.type==='input'){
        if(!/^[\p{L}_][\p{L}\p{N}_]*$/u.test(n.var.trim()))add('error',sh,n,null,t('iNoVar',nm));
        if(exprError(n.sample))add('error',sh,n,null,t('iExpr',nm,t('sample'),exprError(n.sample)));
      }
      if(n.type==='subprocess'){
        if(!n.target||!sheetOf(m,n.target))add('error',sh,n,null,t('iNoTarget',nm));
        else if(!sheetOf(m,n.target).nodes.some(x=>x.type==='start'))add('error',sh,n,null,t('iTargetNoStart',nm));
      }
      if(n.type==='decision'){
        if(outs.length<2)add('error',sh,n,null,t('iFewBranch',nm));
        if(n.mode==='cond'){
          if(!n.expr.trim())add('error',sh,n,null,t('iNoCond',nm));
          else if(exprError(n.expr))add('error',sh,n,null,t('iExpr',nm,t('condition'),exprError(n.expr)));
          const kinds=new Set(outs.map(e=>e.branch));
          if(outs.length>=2&&!kinds.has('else')&&!kinds.has('case')&&!(kinds.has('yes')&&kinds.has('no')))add('warn',sh,n,null,t('iUncovered',nm));
          for(const e of outs)if(e.branch==='case'&&exprError(e.value))add('error',sh,n,e,t('iExpr',nm,t('caseValue'),exprError(e.value)));
        }
        if(n.mode!=='cond'){
          const ps=outs.filter(e=>e.prob!=='').map(e=>Number(e.prob));
          if(ps.some(p=>!Number.isFinite(p)||p<0))add('error',sh,n,null,t('iBadProb',nm));
          else if(n.mode==='prob'&&ps.length===outs.length&&outs.length&&Math.abs(ps.reduce((a,b)=>a+b,0)-100)>.001)add('warn',sh,n,null,t('iProbSum',nm,ps.reduce((a,b)=>a+b,0)));
        }
        for(const e of outs)if(!edgeText(e,n))add('warn',sh,n,e,t('iNoLabel',nm));
      }
    }
  });
  const main=m.sheets[0];
  if(main&&main.nodes.length){
    const defined=new Set(['END','STEPS','TIME','COST']),used=new Map();
    m.sheets.forEach(sh=>sh.nodes.forEach(n=>{
      const u=nodeUses(n);u.writes.forEach(v=>defined.add(v));
      u.reads.forEach(v=>{if(!used.has(v))used.set(v,{sh,n})});
    }));
    for(const[v,w]of used)if(!defined.has(v))add('warn',w.sh,w.n,null,t('iUndefVar',v,nodeName(w.n)));
    const graph=new Map(m.sheets.map(s=>[s.id,s.nodes.filter(n=>n.type==='subprocess'&&n.target).map(n=>n.target)]));
    const cyc=id=>{const seen=new Set(),st=[...(graph.get(id)||[])];while(st.length){const c=st.pop();if(c===id)return true;if(seen.has(c))continue;seen.add(c);st.push(...(graph.get(c)||[]))}return false};
    m.sheets.forEach(s=>{if(cyc(s.id))add('warn',s,null,null,t('iRecursive',s.name))});
  }
  return out;
}
/* variáveis lidas e gravadas por uma etapa */
function nodeUses(n,withEdges){
  const reads=new Set(),writes=new Set();
  const ex=src=>{if(String(src||'').trim()){try{astVars(parseExpr(src),reads)}catch{}}};
  ex(n.duration);ex(n.cost);
  if(['start','process','data'].includes(n.type)){
    try{for(const s of parseStatements(n.code)){
      astVars(s.expr,reads);
      if(s.target){
        const nm=s.target.k==='var'?s.target.n:s.target.x.n;
        writes.add(nm);
        if(s.target.k==='idx'){astVars(s.target.i,reads);reads.add(nm)}
        if(s.op!=='=')reads.add(nm);
      }
    }}catch{}
  }
  if(['output','document'].includes(n.type)){try{for(const p of parseTemplate(n.code))if(p.ast)astVars(p.ast,reads)}catch{}}
  if(n.type==='input'&&n.var.trim())writes.add(n.var.trim());
  if(n.type==='input')ex(n.sample);
  if(n.type==='decision'&&n.mode==='cond')ex(n.expr);
  if(withEdges)for(const e of withEdges)if(e.branch==='case')ex(e.value);
  return{reads,writes};
}
/* mesma lógica = mesmas chaves, sem posições: resultados guardados só valem para o modelo que os gerou */
function logicKey(m){
  return JSON.stringify([m.sheets.map(s=>[s.id,s.nodes.map(n=>[n.id,n.type,n.text,n.duration,n.cost,n.code,n.var,n.sample,n.mode,n.expr,n.target]),s.edges.map(e=>[e.from,e.to,e.branch,e.value,e.prob])]),m.settings.maxSteps]);
}

/* ========== motor de simulação ========== */
function buildIndex(m){
  const idx=new Map();
  for(const sh of m.sheets){
    const nodes=new Map(sh.nodes.map(n=>[n.id,n])),outs=new Map();
    for(const e of sh.edges){if(!outs.has(e.from))outs.set(e.from,[]);outs.get(e.from).push(e)}
    idx.set(sh.id,{sheet:sh,nodes,outs,start:sh.nodes.find(n=>n.type==='start')||null});
  }
  return idx;
}
class Run{

    this.frames=[];this.sheet=m.sheets[0].id;this.cur=null;this.time=0;this.cost=0;this.steps=0;this.status='run';this.error=null;this.end=null;this.pending=null;
    this.out=[];this.trace=[];this.visits=new Map();this.edges=new Map();this.nodeTime=new Map();this.nodeCost=new Map();
    this.inputs=opt.inputs||new Map();this.inPos=new Map();this.choices=opt.choices||[];this.chPos=0;this.path=[];
    this.maxSteps=opt.maxSteps||m.settings.maxSteps;
    const st=this.idx.get(this.sheet).start;
    if(!st){this.status='error';this.error={msg:t('rNoStart'),node:null}}else this.cur=st.id;
  }
  node(){return this.cur?this.idx.get(this.sheet).nodes.get(this.cur):null}
  sheetName(){return this.idx.get(this.sheet).sheet.name}
  snapshot(){return{vars:structuredClone({...this.vars}),frames:this.frames.map(f=>({...f})),sheet:this.sheet,cur:this.cur,time:this.time,cost:this.cost,steps:this.steps,status:this.status,error:this.error,end:this.end,pending:this.pending,rng:this.rng.s,out:this.out.length,trace:this.trace.length,inPos:new Map(this.inPos),chPos:this.chPos,visits:new Map(this.visits),edges:new Map(this.edges),nodeTime:new Map(this.nodeTime),nodeCost:new Map(this.nodeCost),path:this.path.length}}
  restore(s){
    for(const k of Object.keys(this.vars))delete this.vars[k];Object.assign(this.vars,s.vars);
    this.frames=s.frames;this.sheet=s.sheet;this.cur=s.cur;this.time=s.time;this.ctx.time=s.time;this.cost=s.cost;this.steps=s.steps;this.status=s.status;this.error=s.error;this.end=s.end;this.pending=s.pending;this.rng.s=s.rng;
    this.out.length=s.out;this.trace.length=s.trace;this.inPos=s.inPos;this.chPos=s.chPos;this.visits=s.visits;this.edges=s.edges;this.nodeTime=s.nodeTime;this.nodeCost=s.nodeCost;this.path.length=s.path;
  }

function analyze(m,opts,onProgress){

  const promise=new Promise(resolve=>{
    const slice=()=>{
      if(stop)return resolve(null);
      const t0=performance.now();
      while(i<runs&&performance.now()-t0<30){
        const r=new Run(m,{seed:(opts.seed*2654435761+i*40503)>>>0,index});
        try{r.runToEnd()}catch(e){r.status='error';r.error={msg:e.message}}
        i++;acc.steps+=r.steps;
        for(const[k,v]of r.visits){acc.visits.set(k,(acc.visits.get(k)||0)+v);acc.runsAt.set(k,(acc.runsAt.get(k)||0)+1)}
        for(const[k,v]of r.edges)acc.edges.set(k,(acc.edges.get(k)||0)+v);
        for(const[k,v]of r.nodeTime)acc.nodeTime.set(k,(acc.nodeTime.get(k)||0)+v);
        for(const[k,v]of r.nodeCost)acc.nodeCost.set(k,(acc.nodeCost.get(k)||0)+v);
        if(r.status==='done'){
          acc.times.push(r.time);acc.costs.push(r.cost);
          acc.ends.set(r.end,(acc.ends.get(r.end)||0)+1);
          if(acc.paths.size<20000||acc.paths.has(r.path.join())){const pk=r.path.join();acc.paths.set(pk,(acc.paths.get(pk)||0)+1)}
        }else if(r.status==='limit')acc.limit++;
        else if(r.error){const em=r.error.msg+(r.error.node?` (${nodeName(r.error.node)})`:'');acc.errors.set(em,(acc.errors.get(em)||0)+1)}
      }
      onProgress&&onProgress(i/runs);
      if(i<runs)return setTimeout(slice,0);
      acc.times.sort((a,b)=>a-b);acc.costs.sort((a,b)=>a-b);
      const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
      const sd=a=>{if(a.length<2)return 0;const u=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-u)*(v-u),0)/(a.length-1))};
      resolve({key,runs,seed:opts.seed,done:acc.times.length,limit:acc.limit,errors:[...acc.errors].sort((a,b)=>b[1]-a[1]),
        time:{mean:mean(acc.times),sd:sd(acc.times),min:acc.times[0],p50:percentile(acc.times,.5),p90:percentile(acc.times,.9),p95:percentile(acc.times,.95),max:acc.times[acc.times.length-1]},
        cost:{mean:mean(acc.costs),min:acc.costs[0],p50:percentile(acc.costs,.5),p95:percentile(acc.costs,.95),max:acc.costs[acc.costs.length-1]},
        hist:histogram(acc.times),ends:[...acc.ends].sort((a,b)=>b[1]-a[1]),visits:acc.visits,runsAt:acc.runsAt,edges:acc.edges,nodeTime:acc.nodeTime,nodeCost:acc.nodeCost,
        paths:[...acc.paths].sort((a,b)=>b[1]-a[1]).slice(0,10),pathCount:acc.paths.size});
    };
    slice();
  });
  return{promise,cancel(){stop=true}};
}

function wrapText(text,maxChars,maxLines){
  const out=[];
  for(const para of String(text||'').split('\n')){
    const words=para.split(/\s+/).filter(Boolean);let line='';
    if(!words.length){out.push('');continue}
    for(let w of words){
      while(w.length>maxChars){if(line){out.push(line);line=''}out.push(w.slice(0,maxChars-1)+'-');w=w.slice(maxChars-1)}
      if(!line)line=w;else if((line+' '+w).length<=maxChars)line+=' '+w;else{out.push(line);line=w}
    }

  if(maxLines&&out.length>maxLines){const c=out.slice(0,maxLines);c[maxLines-1]=c[maxLines-1].replace(/.{0,1}$/,'')+'…';return c}
  return out;
}

  const start=sh.nodes.find(n=>n.type==='start');const paths=[];let truncated=false;
  if(!start)return{paths,truncated};
  const walk=(id,nodes,used)=>{
    if(paths.length>=cap){truncated=true;return}
    const n=nodeOf(sh,id);if(!n)return;
    const seq=[...nodes,n],outs=outEdges(sh,id).filter(e=>!used.has(e.id));
    if(n.type==='end'||!outs.length){paths.push(seq);return}
    for(const e of outs){const u=new Set(used);u.add(e.id);walk(e.to,seq,u)}
  };

/* histograma de uma série: uma só cor, barras finas com topo arredondado, ancoradas na base */
function histSvg(bins,{width=620,height=210,unit=''}={}){
  const m={l:44,r:8,t:10,b:38},W=width-m.l-m.r,H=height-m.t-m.b,top=Math.max(...bins.map(b=>b.c),1);
  const niceTop=(()=>{const p=Math.pow(10,Math.floor(Math.log10(top))),f=top/p;return[1,1.2,1.6,2,2.4,3,4,5,6,8,10].find(x=>x>=f)*p})();
  const total=bins.reduce((a,b)=>a+b.c,0),bw=W/bins.length,y=v=>m.t+H-(v/niceTop)*H;
  let s=`<svg class="hist" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${esc(t('histTitle',unit))}">`;
  for(let i=0;i<=4;i++){const v=niceTop*i/4,py=y(v);s+=`<line class="${i?'c-grid':'c-base'}" x1="${m.l}" x2="${width-m.r}" y1="${py}" y2="${py}"/><text class="c-tick" x="${m.l-6}" y="${py+4}" text-anchor="end">${esc(fmtNum(v,v<10?1:0))}</text>`}
  bins.forEach((b,i)=>{
    const x=m.l+i*bw+1,w=Math.max(1,bw-2),py=y(b.c),hh=m.t+H-py,r=Math.min(4,w/2,hh);
    const tip=`${fmtNum(b.a,1)}–${fmtNum(b.b,1)} ${unit}: ${fmtNum(b.c,0)} (${fmtNum(b.c/total*100,1)}%)`;
    s+=`<g class="ht-col" data-tip="${esc(tip)}"><rect class="ht-hit" x="${m.l+i*bw}" y="${m.t}" width="${bw}" height="${H}"/>`;
    if(b.c)s+=`<path class="ht-bar" d="M${x} ${m.t+H}V${py+r}Q${x} ${py} ${x+r} ${py}H${x+w-r}Q${x+w} ${py} ${x+w} ${py+r}V${m.t+H}Z"/>`;
    s+=`<title>${esc(tip)}</title></g>`;
  });
  const every=Math.max(1,Math.ceil(bins.length/7));
  bins.forEach((b,i)=>{if(i%every===0)s+=`<text class="c-tick" x="${m.l+i*bw}" y="${height-m.b+15}" text-anchor="middle">${esc(fmtNum(b.a,b.b-b.a<1?2:b.b-b.a<10?1:0))}</text>`});
  s+=`<text class="c-tick" x="${m.l+W/2}" y="${height-4}" text-anchor="middle">${esc(t('histAxis',unit))}</text>`;
  return s+'</svg>';
}

function buildDoc(m,analysis){

function cellHtml(c){
  if(c==null||c==='')return'—';

  if(c.code!=null)return`<code>${esc(c.code)}</code>`;
  if(c.pre!=null)return c.pre==='—'?'—':`<pre>${esc(c.pre)}</pre>`;
  if(c.ok!=null)return`<span class="ok">✓ ${esc(c.ok)}</span>`;
  if(c.bad!=null)return`<span class="bad">✗ ${esc(c.bad)}</span>`;
  if(c.num!=null)return esc(c.num);
  return'';
}
function blockHtml(b){
  switch(b.t){
    case'h3':return`<h3>${esc(b.v)}</h3>`;
    case'p':return`<p>${esc(b.v)}</p>`;
    case'ul':return`<ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
    case'kpis':return`<div class="kpi-row">${b.items.map(([k,v])=>`<div class="kpi"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
    case'figure':return`<figure>${b.svg}<figcaption>${esc(b.caption)}</figcaption></figure>`;
    case'table':{
      const cl=c=>c&&typeof c==='object'&&c.num!=null?' class="num"':'';
      const head=b.head.map(c=>`<th${cl(c)}>${esc(typeof c==='object'?c.num:c)}</th>`).join('');
      return`<table><thead><tr>${head}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td${cl(c)}>${cellHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }

      const facts=b.facts.length?`<dl>${b.facts.map(([k,v,x])=>`<dt>${esc(k)}</dt><dd>${cellHtml(v)}${x?esc(x):''}</dd>`).join('')}</dl>`:'';

const mdEsc=s=>String(s??'').replace(/\|/g,'\\|').replace(/\r?\n/g,' ');

function docMarkdown(d){

const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function simStop(){if(S.sim){S.sim.playing=false;S.sim.anim&&S.sim.anim.cancel()}gSim.innerHTML=''}
function setStatus(s){$('#status').textContent=s}
function simBuild(sc){
  simStop();
  const opt={seed:S.m.settings.seed,interactive:true,trace:true};
  if(sc){opt.inputs=evalScenarioInputs(sc.inputs,S.m.settings.seed);opt.choices=splitChoices(sc.choices)}
  S.sim={run:new Run(S.m,opt),hist:[],playing:false,resume:false,anim:null,scenario:sc||null,changed:new Set(),skipBp:-1};
  setStatus(sc?t('runningSc',sc.name):'');
  if(S.sheet!==S.m.sheets[0].id){S.sheet=S.m.sheets[0].id;S.routes=routeSheet(sheet());renderSheets()}
}
function simAfter(ev){
  const sim=S.sim,r=sim.run;
  sim.changed=new Set(ev?ev.changes.map(c=>c.k):[]);
  if(r.sheet!==S.sheet){const first=!S.view[r.sheet];S.sheet=r.sheet;S.routes=routeSheet(sheet());renderSheets();renderLeft();renderCanvas();if(first)fitView()}
  if(r.status==='done'&&sim.scenario){
    const res=runScenario(S.m,sim.scenario);S.scResults.set(sim.scenario.id,res);
    r.out.push({t:r.time,text:t('scFinished',sim.scenario.name,res.pass?t('passed'):t('failed')),kind:'sys'});
  }
  renderSim();
  if(r.status==='done')setStatus(t('rFinished',r.end));
  else if(r.status==='error'||r.status==='limit')setStatus(r.error.msg);
  else if(r.status==='input'||r.status==='choice')setStatus(t('waitingYou'));
  else if(!sim.playing)setStatus('');
  const route=ev&&ev.edge&&S.routes.get(ev.edge.id);
  if(route&&!reduced()&&Number($('#speed').value)<16)return animateToken(route,560/Number($('#speed').value));
  gSim.innerHTML='';
  return Promise.resolve();
}
function animateToken(pts,dur){
  const sim=S.sim;sim.anim&&sim.anim.cancel();
  const L0=pathLen(pts),start=performance.now();let raf=0,done;
  const p=new Promise(res=>done=res);
  gSim.innerHTML='<circle class="tok" r="7"/>';const c=gSim.firstChild;
  const tick=now=>{
    const f=Math.min(1,(now-start)/dur),q=pointAlong(pts,L0*f*(2-f));
    c.setAttribute('cx',q.x);c.setAttribute('cy',q.y);
    if(f<1)raf=requestAnimationFrame(tick);else{gSim.innerHTML='';done()}
  };
  raf=requestAnimationFrame(tick);
  sim.anim={cancel(){cancelAnimationFrame(raf);gSim.innerHTML='';done();sim.anim=null}};
  return p;
}
function heatOff(){if(S.heat){S.heat=false;if(S.simTab==='analysis')renderSimBody()}}
function simStepOnce(){
  const sim=S.sim,r=sim.run;
  if(r.status!=='run')return Promise.resolve();
  heatOff();
  sim.anim&&sim.anim.cancel();
  sim.hist.push(r.snapshot());if(sim.hist.length>3000)sim.hist.shift();
  return simAfter(r.step());
}
async function simPlay(){
  const sim=S.sim;if(!sim||sim.playing)return;
  const r=sim.run;
  if(r.status!=='run'&&r.status!=='input'&&r.status!=='choice')return;
  sim.playing=true;heatOff();renderSimBar();setStatus('');
  while(sim.playing&&S.sim===sim){
    if(r.status==='input'||r.status==='choice'){sim.playing=false;sim.resume=true;break}
    if(r.status!=='run'){sim.playing=false;break}
    const n=r.node();
    if(n&&n.bp&&sim.skipBp!==r.steps){sim.skipBp=r.steps;sim.playing=false;setStatus(t('bpHit',nodeName(n)));break}
    await simStepOnce();
    if(!sim.playing||r.status!=='run')continue;
    await new Promise(res=>setTimeout(res,260/Number($('#speed').value)));
  }
  /* só a barra: redesenhar o painel aqui apagaria o que já foi digitado na pergunta */
  if(S.sim===sim)renderSimBar();
}
function simPause(){if(S.sim){S.sim.playing=false;S.sim.resume=false;renderSimBar()}}
function simBack(){
  const sim=S.sim;if(!sim||!sim.hist.length)return;
  simPause();sim.anim&&sim.anim.cancel();
  sim.run.restore(sim.hist.pop());sim.changed=new Set();sim.skipBp=sim.run.steps;
  if(sim.run.sheet!==S.sheet){S.sheet=sim.run.sheet;S.routes=routeSheet(sheet());renderSheets();renderLeft()}
  setStatus('');renderSim();
}

  b.append(h('div',{class:'an-grid'},left,right));
  const rows=analysisRows(S.m,a,nums);
  b.append(h('div',{class:'pad',style:'padding-top:0'},h('h4',{style:'margin:0 0 5px'},t('anNodes')),h('table',{class:'t'},h('thead',null,h('tr',null,h('th',null,t('dStep')),h('th',null,t('dName')),h('th',{class:'num'},t('anReach')),h('th',{class:'num'},t('anVisits')),h('th',{class:'num'},t('anAvgTime',u)),h('th',{class:'num'},t('anShare')),h('th',{class:'num'},t('anAvgCost')))),
    h('tbody',null,rows.map(r=>h('tr',{class:'click',onclick(){if(r.sheet!==S.sheet)goSheet(r.sheet);const n=nodeOf(sheet(),r.id);if(n)centerOn(n)}},h('td',null,r.num),h('td',null,r.name),h('td',{class:'num'},fmtNum(r.reach,1)+'%'),h('td',{class:'num'},fmtNum(r.visits)),h('td',{class:'num'},fmtNum(r.time)),h('td',{class:'num'},fmtNum(r.share,1)+'%'),h('td',{class:'num'},fmtNum(r.cost))))))));
}
function pathLabel(m,key){
  const map=new Map();for(const sh of m.sheets)for(const e of sh.edges){const f=nodeOf(sh,e.from);if(f.type==='decision')map.set(e.id,branchLabel(e))}
  return key.split(',').map(id=>map.get(id)).filter(Boolean).join(' · ');
}
function miniBar(label,pct){return h('div',{class:'mini'},h('span',{title:label},label),h('span',{class:'tr'},h('i',{style:`width:${Math.max(0,Math.min(100,pct))}%`})),h('b',null,fmtNum(pct,1)+'%'))}
function wireTips(w){
  let tip=null;
  w.addEventListener('pointermove',e=>{
    const g=e.target.closest&&e.target.closest('.ht-col');
    if(!g){tip&&tip.remove();tip=null;return}
    if(!tip){tip=h('div',{class:'c-tip'});w.append(tip)}
    tip.textContent=g.dataset.tip;
    const r=w.getBoundingClientRect();
    tip.style.left=Math.min(r.width-tip.offsetWidth-4,e.clientX-r.left+12)+'px';tip.style.top=Math.max(0,e.clientY-r.top-30)+'px';
  });
  w.addEventListener('pointerleave',()=>{tip&&tip.remove();tip=null});
}
function startAnalysis(afterDone){
  const st=S.m.settings;
  saveSoon();
  S.job=analyze(S.m,{runs:Number(st.runs)||1000,seed:Number(st.seed)||1},f=>{const p=$('#an-prog');if(p)p.textContent=Math.round(f*100)+'%'});
  if(S.mode==='sim')renderSimBody();
  S.job.promise.then(a=>{
    S.job=null;
    if(a){S.analysis=a;if(S.mode==='sim'){S.heat=true;renderCanvas()}}
    if(S.mode==='sim'&&S.simTab==='analysis')renderSimBody();
    if(typeof afterDone==='function')afterDone();
  });
}

/* ========== documentação na tela ========== */
let paperT=0;
function renderPaperSoon(){clearTimeout(paperT);paperT=setTimeout(renderPaper,250)}
function renderPaper(){
  S.doc=buildDoc(S.m,S.analysis);
  const y=$('#docscroll').scrollTop;
  $('#paper').innerHTML=docHtml(S.doc);
  $('#docscroll').scrollTop=y;
  $$('#paper .toc a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();$(a.getAttribute('href'),$('#paper'))?.scrollIntoView({behavior:reduced()?'auto':'smooth'})}));
  saveSoon();
}
function renderDoc(){
  const box=$('#docside');box.textContent='';
  box.append(h('div',{class:'type'},t('docExport')));
  box.append(h('div',{class:'doc-actions'},
    h('button',{class:'primary',onclick(){window.print()}},t('docPrint')),
    h('button',{onclick(){download(docStandalone(buildDoc(S.m,S.analysis)),slug(S.m.meta.title)+'.html','text/html;charset=utf-8')}},t('docHtml')),
    h('button',{onclick(){download(docMarkdown(buildDoc(S.m,S.analysis)),slug(S.m.meta.title)+'.md','text/markdown;charset=utf-8')}},t('docMd')),
    h('button',{onclick(){copyText(docMarkdown(buildDoc(S.m,S.analysis)))}},t('docCopy'))));
  const fresh=S.analysis&&S.analysis.key===logicKey(S.m);
  box.append(h('div',{class:'type',style:'margin-top:6px'},t('secAnalysis')));
  box.append(h('div',{class:'hint'},fresh?t('docAnalysisOk',fmtNum(S.analysis.runs,0)):t('docAnalysisNone')));
  const go=h('button',{disabled:!!S.job,onclick(){go.disabled=true;go.textContent=t('anRunning');startAnalysis(()=>{renderDoc()})}},fresh?t('docRerun'):t('anRun'));
  box.append(go);
  box.append(h('div',{class:'type',style:'margin-top:6px'},t('docSections')));
  for(const id of DOC_SECTIONS){
    const label={overview:'secOverview',diagram:'secDiagram',procedure:'secProcedure',decisions:'secDecisions',roles:'secRoles',data:'secData',paths:'secPaths',tests:'secTests',analysis:'secAnalysis',issues:'secIssues',notes:'secNotes',revisions:'secRevisions'}[id];
    box.append(h('label',{class:'sec-check'},h('input',{type:'checkbox',checked:!S.m.doc.off.includes(id),onchange(e){
      const off=new Set(S.m.doc.off);e.target.checked?off.delete(id):off.add(id);S.m.doc.off=[...off];commit();renderPaper();
    }}),t(label)));
  }
  box.append(h('div',{class:'type',style:'margin-top:6px'},t('docInfo')));
  box.append(...metaFields());
  box.append(textField(S.m.meta,'revisions',t('secRevisions'),{area:3,live:renderPaperSoon,placeholder:'1.1 | 2026-10-30 | Ana | …',hint:t('revHint')}));
  renderPaper();
}
function copyText(s){
  const fb=()=>{const ta=h('textarea',{value:s,style:'position:fixed;opacity:0'});document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();toast(ok?t('copied'):t('copyFail'),ok?'ok':'err')};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>toast(t('copied')),fb);else fb();
}

/* ========== arquivos ========== */
function exportSvg(){const sh=sheet();if(!sh.nodes.length)return toast(t('emptySheet'),'warn');download(sheetSvg(S.m,sh,{standalone:true,title:sh.name}).svg,`${slug(S.m.meta.title)}-${slug(sh.name)}.svg`,'image/svg+xml')}
function exportPng(){
  const sh=sheet();if(!sh.nodes.length)return toast(t('emptySheet'),'warn');
  const g=sheetSvg(S.m,sh,{title:sh.name}),img=new Image(),scale=2;
  img.onload=()=>{
    const c=h('canvas',{width:Math.ceil(g.w*scale),height:Math.ceil(g.h*scale)}),x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>download(b,`${slug(S.m.meta.title)}-${slug(sh.name)}.png`),'image/png');
  };
  img.onerror=()=>toast(t('pngFail'),'err');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(g.svg);
}
function saveJson(){download(JSON.stringify(S.m,null,1),slug(S.m.meta.title)+'.flow.json','application/json');toast(t('saved'))}
function confirmReplace(fn){
  if(!S.m.sheets.some(s=>s.nodes.length))return fn();
  modal({title:t('confirmNew'),body:h('p',null,t('confirmNewText')),actions:[{label:t('cancel')},{label:t('confirm'),primary:true,run:fn}]});
}
function openMenu(btn,items){
  const parent=btn.parentElement,old=parent.querySelector('.menu-list');
  $$('.menu-list').forEach(x=>x.remove());
  if(old)return;
  const list=h('div',{class:'menu-list',role:'menu'},items.map(i=>i==='-'?h('hr'):i.head?h('div',{class:'mh'},i.head):h('button',{role:'menuitem',onclick(){list.remove();i.run()}},i.label)));
  parent.append(list);
  list.querySelector('button')?.focus();
  setTimeout(()=>{const off=e=>{if(!list.contains(e.target)){list.remove();removeEventListener('pointerdown',off,true)}};addEventListener('pointerdown',off,true)},0);
}
$('#b-file').addEventListener('click',e=>openMenu(e.currentTarget,[
  {label:t('fNew'),run:()=>confirmReplace(()=>setModel(newModel()))},
  {label:t('fOpen'),run:()=>$('#file-json').click()},
  {label:t('fSave'),run:saveJson},
  '-',
  {label:t('fSvg'),run:exportSvg},{label:t('fPng'),run:exportPng},
  {label:t('fMermaid'),run:()=>{const sh=sheet();download(mermaidOf(S.m,sh)+'\n',`${slug(S.m.meta.title)}-${slug(sh.name)}.mmd`,'text/plain;charset=utf-8')}},
  '-',{head:t('samples')},
  ...Object.values(SAMPLES).map(s=>({label:s.label(),run:()=>confirmReplace(()=>setModel(s.build()))})),
]));
$('#b-layout').addEventListener('click',e=>openMenu(e.currentTarget,[{label:t('layoutV'),run:()=>layoutNow('TD')},{label:t('layoutH'),run:()=>layoutNow('LR')}]));
$('#file-json').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    if(f.size>20*1024*1024)throw new Error(t('tooBig'));
    setModel(loadModel(JSON.parse(await f.text())));toast(t('opened',f.name));
  }catch(err){toast(t('badFile',err.message),'err')}
});

/* ========== texto estático, ajuda e atalhos ========== */
function applyStaticText(){
  document.documentElement.lang=HTML_LANG[LANG];
  $$('[data-tx]').forEach(e=>{e.textContent=t(e.dataset.tx)});
  $$('[data-title]').forEach(e=>{e.title=t(e.dataset.title)});
  $$('[data-aria]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.aria))});
  $('#modes').setAttribute('aria-label',t('modeBar'));
}
function setLang(l){LANG=l;store.set('lang',l);exprCache.clear();stmtCache.clear();tplCache.clear();renderAll();renderSimBar()}
function showHelp(){
  modal({title:t('help'),wide:true,body:h('div',{html:HELP[LANG]})});
}
$('#b-help').addEventListener('click',showHelp);
$('#b-theme').addEventListener('click',()=>{const x=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=x;store.set('theme',x)});
$('#lang').addEventListener('change',e=>setLang(e.target.value));
$$('#modes button').forEach(b=>b.addEventListener('click',()=>{if(S.mode!==b.dataset.mode)setMode(b.dataset.mode)}));
$('#b-undo').addEventListener('click',undo);$('#b-redo').addEventListener('click',redo);
$('#z-in').addEventListener('click',()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.2)});
$('#z-out').addEventListener('click',()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.2)});
$('#z-fit').addEventListener('click',fitView);
$('#b-play').addEventListener('click',()=>{S.sim.playing?simPause():simPlay()});
$('#b-step').addEventListener('click',()=>{simStepOnce()});
$('#b-back').addEventListener('click',simBack);
$('#b-reset').addEventListener('click',simRestart);
$('#simgrip').addEventListener('pointerdown',e=>{
  const g=e.currentTarget,p=$('#simpanel'),sy=e.clientY,h0=p.offsetHeight;g.setPointerCapture(e.pointerId);
  const mv=ev=>{p.style.height=Math.max(120,Math.min(innerHeight-200,h0+sy-ev.clientY))+'px'};
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up)};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);
});
addEventListener('keydown',e=>{
  const typing=e.target.matches&&e.target.matches('input,textarea,select'),ctrl=e.ctrlKey||e.metaKey,key=e.key.toLowerCase();
  if(ctrl&&key==='s'){e.preventDefault();saveJson();return}
  if(typing||document.querySelector('dialog[open]'))return;
  if((key===' '||key==='enter')&&e.target.closest&&e.target.closest('button,a'))return;
  if(key==='escape'&&$('.menu-list')){$$('.menu-list').forEach(x=>x.remove());return}
  if(e.code==='Space'&&S.mode==='edit'&&!spaceDown){spaceDown=true;svg.style.cursor='grab';e.preventDefault();return}
  if(key==='f1'||key==='?'){e.preventDefault();showHelp();return}
  if(S.mode==='sim'){
    if(e.code==='Space'){e.preventDefault();S.sim.playing?simPause():simPlay()}
    else if(key==='n')simStepOnce();
    else if(key==='b')simBack();
    else if(key==='r')simRestart();
    return;
  }
  if(S.mode!=='edit')return;
  if(ctrl&&key==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(ctrl&&key==='y'){e.preventDefault();redo();return}
  if(ctrl&&key==='a'){e.preventDefault();select(sheet().nodes.map(n=>n.id));return}
  if(ctrl&&key==='c'){copySelection();return}
  if(ctrl&&key==='x'){if(copySelection())deleteSelection();return}
  if(ctrl&&key==='v'){paste();return}
  if(ctrl&&key==='d'){e.preventDefault();if(copySelection())paste();return}
  if(key==='delete'||key==='backspace'){e.preventDefault();deleteSelection();return}
  if(key==='escape'){closeQuick();select([]);return}
  if(key==='f2'||key==='enter'){const n=sheet().nodes.find(x=>S.sel.has(x.id));if(n&&S.sel.size===1){e.preventDefault();startRename(n)}return}
  if(key.startsWith('arrow')&&S.sel.size){
    e.preventDefault();const st=e.shiftKey?SNAP*4:SNAP,dx=key==='arrowleft'?-st:key==='arrowright'?st:0,dy=key==='arrowup'?-st:key==='arrowdown'?st:0;
    sheet().nodes.forEach(n=>{if(S.sel.has(n.id)){n.x+=dx;n.y+=dy}});commit();
  }
});
addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;svg.style.cursor=''}});
addEventListener('resize',()=>applyView());
addEventListener('beforeprint',()=>{if(S.mode==='doc')renderPaper()});

/* ========== início ========== */
function init(){
  document.head.append(h('style',null,SVG_CSS+DOC_CSS+HIST_CSS_DOC));
  const th=store.get('theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=th;
  $('#lang').value=LANG;
  let m=null;
  try{const saved=store.get('model',null);if(saved)m=loadModel(saved)}catch{}
  S.m=m||newModel();S.sheet=S.m.sheets[0].id;
  S.history=[JSON.stringify(S.m)];S.hIdx=0;
  updateUndo();
  $$('#modes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode==='edit'?'true':'false'));
  renderAll();fitView();
}
init();
