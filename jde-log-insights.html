<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Nenhum dado sai deste arquivo: sem rede e sem eval. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>JDE Log Insights</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f5e9c'/%3E%3Cpath d='M3 12V8m3.3 4V4m3.4 8V7M13 12V5' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4f6;--panel:#fff;--panel2:#f7f8fa;--text:#1a2026;--muted:#59636c;--line:#d7dce1;--line2:#e8ebee;
  --accent:#0f5e9c;--accent-text:#fff;--accent-soft:#e3eef7;--danger:#b3261e;--danger-soft:#fbe9e7;--warn:#8a5a00;--warn-soft:#fdf3dc;--ok:#1f7a3d;--ok-soft:#e2f3e7;--ch-err:#b3261e;--ch-act:#0f5e9c;--c-ube:#efe8f8;--c-ube-t:#5b2a86;
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#14171a;--panel:#1b1f23;--panel2:#21262a;--text:#e5e8ea;--muted:#a0a8ae;--line:#343a40;--line2:#2a2f34;
  --accent:#5aa9e6;--accent-text:#0d1a24;--accent-soft:#1d3346;--danger:#ef8a80;--danger-soft:#3b211f;--warn:#e3b45a;--warn-soft:#352a14;--ok:#6cc98a;--ok-soft:#1c3522;--ch-err:#e66767;--ch-act:#3987e5;--c-ube:#2a2240;--c-ube-t:#c3a6f0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);color:var(--text);background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--panel2);border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
button.link{border:none;background:none;color:var(--accent);padding:0;text-align:left;white-space:normal}
button.link:hover:not(:disabled){background:none;text-decoration:underline}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.spacer{flex:1}.hidden{display:none!important}
#topbar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#brand{font-weight:650;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:6px}
#main{overflow:auto;min-height:0;min-width:0}
.page{max-width:1240px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-width:0}
.card h2{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* início */
#start{max-width:760px;margin:0 auto;padding:30px 14px 40px;display:flex;flex-direction:column;gap:14px}
#start h1{font-size:24px;margin:0}
#drop{border:2px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;background:var(--panel)}
#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#start ul{margin:6px 0 0;padding-left:20px}
/* progresso */
#prog{max-width:520px;margin:60px auto;padding:0 14px;display:flex;flex-direction:column;gap:10px}
.bar{height:9px;background:var(--line2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
/* cabeçalho do resultado */
.notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:7px 11px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:0}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
#tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
#tabs button{border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;background:none;color:var(--muted);margin-bottom:-1px;flex:none}
#tabs button[aria-selected=true]{background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);color:var(--text);font-weight:600}
#tabs button b{font-weight:600;font-size:11px;margin-left:4px;background:var(--line2);border-radius:8px;padding:0 6px;color:var(--text)}
/* insights */
.ins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-left-width:4px;border-radius:0 8px 8px 0;background:var(--panel)}
.ins.crit{border-left-color:var(--danger)}.ins.warn{border-left-color:var(--warn)}.ins.info{border-left-color:var(--accent)}.ins.good{border-left-color:var(--ok)}
.ins .sev{font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;height:max-content;white-space:nowrap}
.ins.crit .sev{color:var(--danger);background:var(--danger-soft)}.ins.warn .sev{color:var(--warn);background:var(--warn-soft)}.ins.info .sev{color:var(--accent);background:var(--accent-soft)}.ins.good .sev{color:var(--ok);background:var(--ok-soft)}
.ins h3{font-size:14px;margin:0;font-weight:650;overflow-wrap:anywhere}
.ins p{grid-column:2;margin:2px 0 0;overflow-wrap:anywhere}
.ins .act{grid-column:2;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
#insights{display:flex;flex-direction:column;gap:7px}
/* tabelas */
.table-wrap{overflow:auto;border:1px solid var(--line2);border-radius:7px;max-height:66vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;padding:0;z-index:1}
th button{border:none;background:none;width:100%;text-align:inherit;padding:6px 9px;font-weight:600;border-radius:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td{padding:5px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
td.wide{min-width:280px;max-width:560px;overflow-wrap:anywhere}
td.m{font-family:var(--mono);font-size:12px}
tr.go{cursor:pointer}tr.go:hover td{background:var(--panel2)}
.lv{font-size:11px;font-weight:700;white-space:nowrap}
.lv.fatal,.lv.error{color:var(--danger)}.lv.warn{color:var(--warn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tools input[type=search]{flex:1 1 200px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:2px 10px;font-size:12px}
.chip button{border:none;background:none;padding:0 2px;color:inherit}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
/* gráfico */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:11px;fill:var(--muted)}
.flow-tools{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:13px}
.flow-tools label{display:inline-flex;gap:5px;align-items:center}
.flow-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line2);border-radius:7px;background:var(--panel)}
.flow-wrap svg{display:block}
.flow-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.flow-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid;margin-right:4px;vertical-align:-2px}
#flow-info{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:7px 11px;min-height:36px;font-size:13px;overflow-wrap:anywhere}
#flow-info b{font-weight:650}
.chart .grid{stroke:var(--line2)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:focus{outline:none}
.chart g.b:hover .hit,.chart .hit:focus-visible{fill:var(--line2);fill-opacity:.7}
#tip{position:fixed;z-index:50;background:var(--text);color:var(--panel);border-radius:6px;padding:4px 8px;font-size:12px;pointer-events:none;white-space:nowrap}
/* conteúdo */
.ct-tools{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:13px}
.ct-tools label{display:inline-flex;gap:5px;align-items:center}
.ct-tools input[type=search]{width:220px;max-width:100%}
.ct-tools input[type=number]{width:136px}
.ct-leg .tg0{display:none}
.ct-tools select{max-width:230px}
.ct-leg{display:flex;flex-wrap:wrap;gap:5px}
.ct-leg button{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 8px;border-radius:12px;white-space:nowrap}
.ct-leg button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:0;font-weight:650}
.ct-leg button:disabled{opacity:.5}
.ct-tg{font:700 10px/1 var(--mono);padding:2px 4px;border-radius:3px;min-width:26px;text-align:center;display:inline-block}
.ct-view{position:relative;height:66vh;min-height:300px;overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--panel);outline-offset:-2px}
.ct-spacer{width:1px}
.ct-rows{position:absolute;left:0;top:0;min-width:100%;width:max-content;font:12px/20px var(--mono)}
.ct-ln{display:flex;height:20px;white-space:pre;cursor:pointer;border-left:3px solid transparent}
.ct-ln:hover{filter:brightness(.97)}
.ct-ln.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ct-no{flex:none;width:64px;text-align:right;padding-right:8px;color:var(--muted);user-select:none;position:sticky;left:0;background:inherit}
.ct-ln .ct-tg{flex:none;margin:3px 7px 3px 0;height:14px;width:30px}
.ct-tx{flex:none;padding-right:14px}
.ct-tx mark{background:#ffd54a;color:#1a1a1a;border-radius:2px}
.ct-gap{flex:none;font-size:11px;font-weight:700;margin:2px 7px 2px 0;padding:0 5px;line-height:16px;border-radius:8px;background:var(--warn);color:var(--panel)}
.ct-ln,.ct-ln .ct-no{background:var(--panel)}
.k1,.k1 .ct-no{background:var(--danger);color:var(--panel)}.k1{border-left-color:var(--danger)}.k1 .ct-no{color:var(--panel)}.k1 .ct-tx{font-weight:700}
.k2,.k2 .ct-no{background:var(--danger-soft)}.k2{border-left-color:var(--danger)}
.k3,.k3 .ct-no,.k10,.k10 .ct-no{background:var(--warn-soft)}.k3,.k10{border-left-color:var(--warn)}
.k4,.k4 .ct-no{background:var(--accent-soft)}.k4{border-left-color:var(--accent)}
.k5,.k5 .ct-no{background:var(--ok-soft)}.k5{border-left-color:var(--ok)}
.k9,.k9 .ct-no{background:var(--c-ube)}.k9{border-left-color:var(--c-ube-t)}
.k6 .ct-tx,.k7 .ct-tx,.k8 .ct-tx{color:var(--muted)}
.tg1{background:var(--panel);color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}.tg2{background:var(--danger);color:var(--panel)}.tg3,.tg10{background:var(--warn);color:var(--panel)}.tg4{background:var(--accent);color:var(--accent-text)}.tg5{background:var(--ok);color:var(--panel)}.tg9{background:var(--c-ube-t);color:var(--panel)}.tg6,.tg7,.tg8,.tg11{background:var(--line2);color:var(--muted)}.tg0{visibility:hidden}.tg11{visibility:visible}
.dlg .b>.table-wrap,.dlg .b>.pr-h{flex:none}
table.pr td.v{font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:340px}
table.pr tr.chg td{background:var(--warn-soft)}
.pr-h{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:6px}
.pr-h b{font-size:13px}
#ct-info{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:13px;min-height:30px;overflow-wrap:anywhere}
/* contexto do log */
#ctx{font:12px/1.5 var(--mono);white-space:pre;overflow:auto;max-height:60vh;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 0;margin:0}
#ctx span{display:block;padding:0 10px;min-width:max-content}
#ctx span.cur{background:var(--warn-soft);font-weight:600}
/* diálogos */
dialog{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:0;width:min(860px,96vw);max-height:90vh;box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg header{padding:11px 16px;font-weight:650;border-bottom:1px solid var(--line2);overflow-wrap:anywhere}
.dlg .b{padding:12px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.dlg footer{padding:9px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg h4{margin:6px 0 0;font-size:13px}
.dlg p{margin:0;overflow-wrap:anywhere}
.dlg ul{margin:0;padding-left:20px}
.dlg pre.q{font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;margin:0}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;overflow-wrap:anywhere}
.kb{background:var(--accent-soft);border-radius:7px;padding:8px 11px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:60;max-width:92vw}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:7px 11px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.toast.err{border-left-color:var(--danger)}
@media (max-width:640px){
  .page{padding:10px 8px 30px}
  .ins{grid-template-columns:minmax(0,1fr)}
  .ins p,.ins .act{grid-column:1}
  td.wide{min-width:200px}
}
#menu{display:flex;gap:2px;margin-right:6px}
#menu button{border-color:transparent;background:none}
#menu button:hover:not(:disabled){background:var(--panel2);border-color:var(--line)}
/* documentação */
.doc-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
#doc header h1{font-size:22px;margin:0 0 4px}
#doc header p{margin:2px 0}
.doc-sec>h2{font-size:18px;margin:6px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.doc-p{display:flex;flex-direction:column;gap:12px;min-width:0}
#doc .tools,#doc .flow-tools,#doc #flow-info,#doc .act,#doc .chip button,#doc details>summary,#doc .doc-how{display:none!important}
#doc .table-wrap,#doc .flow-wrap{max-height:none;overflow:visible}
#doc .flow-wrap svg{max-width:100%;height:auto}
#doc input:disabled{opacity:1;border-color:transparent;background:none;padding:0 2px;width:4em;appearance:textfield}
@media (max-width:640px){#topbar{gap:4px;padding:6px 8px}#topbar button{padding:5px 8px}#brand{margin-right:0}#menu{margin-right:0}}
@media print{
  :root,:root[data-theme=dark]{--bg:#fff;--panel:#fff;--panel2:#f7f8fa;--text:#1a2026;--muted:#59636c;--line:#d7dce1;--line2:#e8ebee;--accent:#0f5e9c;--accent-text:#fff;--accent-soft:#e3eef7;--danger:#b3261e;--danger-soft:#fbe9e7;--warn:#8a5a00;--warn-soft:#fdf3dc;--ok:#1f7a3d;--ok-soft:#e2f3e7;--ch-err:#b3261e;--ch-act:#0f5e9c;--c-ube:#efe8f8;--c-ube-t:#5b2a86;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #topbar,#tabs,.tools,.act,.doc-bar,#toasts,#tip{display:none!important}
  body{display:block;overflow:visible;background:#fff}#main{overflow:visible}.table-wrap{max-height:none}
  #doc{max-width:none;padding:0}
  th{position:static}
  .doc-sec+.doc-sec{break-before:page}
  .doc-sec>h2{break-after:avoid}
  .ins,.tile,tr,.chart{break-inside:avoid}
}
</style>
<style id="flow-css">
.fl-n{cursor:pointer;outline:none}
.fl-n rect{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.fl-n text{font-size:12px;fill:var(--text)}
.fl-n .nm{font-weight:650}
.fl-n .mt{font-size:11px;fill:var(--muted)}
.fl-n.e rect{fill:var(--panel2);stroke:var(--text)}
.fl-n.b rect{fill:var(--accent-soft);stroke:var(--accent)}
.fl-n.t rect{fill:var(--ok-soft);stroke:var(--ok)}
.fl-n.x rect{fill:var(--danger-soft);stroke:var(--danger)}
.fl-n.slow rect{stroke:var(--warn);stroke-width:3}
.fl-n:hover rect{stroke-width:2.5}
.fl-n:focus-visible rect,.fl-n.sel rect{stroke-width:4}
.fl-h{font-size:11px;font-weight:700;fill:var(--muted)}
.fl-e{fill:none;stroke:var(--muted);marker-end:url(#fl-arrow)}
.fl-e.x{stroke:var(--danger);marker-end:url(#fl-arrow-x)}
.fl-e.back{stroke-dasharray:5 4}
.fl-hit{fill:none;stroke:transparent;stroke-width:10}
.dim{opacity:.16}
#fl-arrow path{fill:var(--muted)}
#fl-arrow-x path{fill:var(--danger)}
</style>
</head>
<body>
<div id="topbar">
  <div id="brand"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#0f5e9c"/><path d="M3 12V8m3.3 4V4m3.4 8V7M13 12V5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>JDE Log Insights</div>
  <nav id="menu" data-aria="mMenu"><button id="b-new" data-tx="mNew" data-title="mNewD"></button><button id="b-doc" data-tx="mDoc" data-title="mDocD"></button></nav>
  <button id="b-open" class="primary" data-tx="open"></button>
  <button id="b-paste" data-tx="paste"></button>
  <button id="b-report" class="hidden" data-tx="report"></button>
  <span class="spacer"></span>
  <select id="lang" data-aria="lang"><option value="pt">PT</option><option value="en">EN</option><option value="it">IT</option><option value="es">ES</option></select>
  <button id="b-help" data-aria="help" data-title="help">?</button>
  <button id="b-theme" data-aria="theme" data-title="theme">◐</button>
  <input id="file-in" type="file" multiple class="hidden">
</div>
<div id="main"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ========== textos ========== */
const LANGS=['pt','en','it','es'],HTML_LANG={pt:'pt-BR',en:'en',it:'it',es:'es'},LOCALE={pt:'pt-BR',en:'en-US',it:'it-IT',es:'es-ES'};
const I18N={
open:['Abrir logs','Open logs','Apri log','Abrir logs'],paste:['Colar texto','Paste text','Incolla testo','Pegar texto'],report:['Relatório','Report','Report','Informe'],lang:['Idioma','Language','Lingua','Idioma'],help:['Ajuda','Help','Guida','Ayuda'],theme:['Tema claro ou escuro','Light or dark theme','Tema chiaro o scuro','Tema claro u oscuro'],
startT:['Transforme um log do JD Edwards em respostas','Turn a JD Edwards log into answers','Trasforma un log di JD Edwards in risposte','Convierte un log de JD Edwards en respuestas'],
startD:['Solte aqui um ou vários arquivos do EnterpriseOne. O app agrupa os erros, mede funções de negócio e SQL, acha pausas e diz por onde começar.','Drop one or more EnterpriseOne files here. The app groups errors, measures business functions and SQL, finds pauses and tells you where to start.','Trascina qui uno o più file di EnterpriseOne. L\'app raggruppa gli errori, misura funzioni di business e SQL, trova le pause e indica da dove iniziare.','Suelta aquí uno o varios archivos de EnterpriseOne. La aplicación agrupa los errores, mide funciones de negocio y SQL, encuentra pausas e indica por dónde empezar.'],

lim1:['Foi testado com logs fictícios, baseados em trechos públicos. Variações de versão, idioma e plataforma podem não ser reconhecidas: o app avisa quando reconhece poucas linhas.','It was tested with made-up logs, based on public excerpts. Version, language and platform variations may not be recognized: the app warns when it recognizes few lines.','È stato provato con log fittizi, basati su estratti pubblici. Variazioni di versione, lingua e piattaforma possono non essere riconosciute: l\'app avvisa quando riconosce poche righe.','Se probó con logs ficticios, basados en fragmentos públicos. Las variaciones de versión, idioma y plataforma pueden no reconocerse: la aplicación avisa cuando reconoce pocas líneas.'],

lim3:['Os logs não trazem o ano, então só dia e hora são mostrados. Sem data na linha, só a hora.','Logs do not include the year, so only day and time are shown. With no date on the line, only the time.','I log non riportano l\'anno, quindi vengono mostrati solo giorno e ora. Senza data nella riga, solo l\'ora.','Los logs no traen el año, así que solo se muestran día y hora. Sin fecha en la línea, solo la hora.'],

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in attrs||{}){
    const v=attrs[k];if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='class')e.className=v;
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  const add=c=>{if(c==null||c===false)return;if(Array.isArray(c))c.forEach(add);else e.append(c)};
  kids.forEach(add);
  return e;
}

function fmtMs(ms){
  if(ms==null||!isFinite(ms))return'–';
  if(ms<1)return nf(ms,2)+' ms';
  if(ms<1000)return nf(ms)+' ms';
  if(ms<60000)return nf(ms/1000,ms<10000?2:1)+' s';
  if(ms<3600000)return Math.floor(ms/60000)+' min '+Math.round(ms%60000/1000)+' s';
  return Math.floor(ms/3600000)+' h '+Math.round(ms%3600000/60000)+' min';
}

const p2=n=>String(n).padStart(2,'0');
function fmtTs(ms,short){
  if(ms==null)return'–';
  const d=new Date(ms),hms=p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds());
  const time=short?hms:hms+'.'+String(d.getUTCMilliseconds()).padStart(3,'0');

  return d.toLocaleDateString(LOCALE[LANG],{day:'2-digit',month:'short',timeZone:'UTC'})+' '+time;
}

  const back=document.activeElement;

  const foot=(actions||[]).map(a=>h('button',{class:a.primary?'primary':'',onclick(){if(a.run&&a.run(close)===false)return;if(!a.keep)close()}},a.label));

function parseHeader(st,line,R){
  const c=line.charCodeAt(0);
  if(c===45&&line.startsWith('--UBE--')){const m=RX.ube.exec(line);if(m)return{fmt:'ube',level:+m[1],pid:m[2]||null,tid:m[3]||null,ts:null,thread:null,msg:m[4]}}

    let m=RX.time.exec(line);
    if(m){
      let ms=Date.UTC(2024,0,1,+m[1],+m[2],+m[3])+parseFloat('0.'+m[4])*1000+st.dayAdd;
      if(st.lastTs!=null&&ms<st.lastTs-43200000){st.dayAdd+=86400000;ms+=86400000}
      if(!st.dated)R.noDate=true;
      return{fmt:'time',ts:ms,pid:m[5]||null,tid:m[6]||null,thread:null,msg:m[7]};
    }

      m=RX.jde.exec(line);
      if(m){

  if(slowS&&slowS.max>=th.sql&&slowS!==big&&slowS!==rep)add('warn',t('iSlowST',slowS.tb||slowS.type,fmtMs(slowS.max)),t('iSlowSB','','',nf(slowS.count),nf(slowS.rows)),{tab:'sql',q:slowS.tb,lab:'goS'});

  if(R.schemas.size>1)add('info',t('iEnvT',R.schemas.size,[...R.schemas.keys()].slice(0,5).join(', ')),t('iEnvB'),{tab:'sql',q:'',lab:'goS'});
  if(R.memMax)add('info',t('iMemT',nf(R.memMax)),t('iMemB','',nf(R.dumps)));
  const apps=[...R.apps.values()].filter(a=>a.calls).sort((a,b)=>b.calls-a.calls);
  if(apps.length)add('info',t('iAppT',apps[0].name),t('iAppB','',nf(apps[0].calls),nf(R.bsfnCalls)),{tab:'ctx',lab:'goC'});

async function loadFiles(list,demo){
  const files=[...list];if(!files.length)return;
  const total=files.reduce((a,f)=>a+f.size,0);
  if(!total){toast(t('empty'),true);return}
  const R=newRun();R.bytes=total;R.demo=!!demo;
  if(S.busy)S.busy.cancel=true;
  S.busy=R;
  let done=0;const started=performance.now();
  const paint=(name)=>{
    if(S.busy!==R)return;
    const box=$('#main');
    const bar=$('#prog .bar i');
    if(bar){bar.style.width=(total?done/total*100:0)+'%';$('#prog .n').textContent=t('reading',name)+' '+fmtSize(done)+' / '+fmtSize(total);return}
    box.replaceChildren(h('div',{id:'prog',role:'status'},h('div',{class:'n'},t('reading',name)),h('div',{class:'bar'},h('i',{style:'width:0'})),h('div',null,h('button',{onclick(){R.cancel=true}},t('cancel')))));
  };
  paint(files[0].name);
  try{
    for(let i=0;i<files.length;i++){
      await readFile(R,files[i],i,n=>{done+=n;paint(files[i].name)});
      if(R.cancel)break;
    }
  }catch(e){toast(t('readErr',files[0].name),true);R.cancel=true}
  if(S.busy!==R)return;
  S.busy=null;
  if(R.cancel){renderAll();return}

  S.run=R;S.tab='ins';S.q={errors:'',bsfn:'',sql:''};S.range=null;S.lvl='';S.cat='';S.sort={};S.fl=null;S.ct=null;
  renderAll();
}

function dataTable(id,cols,rows,{onRow,def,limit=500,name}={}){
  const wrap=h('div',null);
  const sort=S.sort[id]||def||[cols[0].k,1];
  const val=(c,r)=>c.v?c.v(r):r[c.k];
  const draw=()=>{
    const col=cols.find(c=>c.k===sort[0])||cols[0];
    const data=[...rows].sort((a,b)=>{const x=val(col,a),y=val(col,b);if(x==null||y==null)return x==null?(y==null?0:1):-1;return(typeof x==='string'?x.localeCompare(String(y)):x-y)*sort[1]});
    const shown=data.slice(0,limit);
    const thead=h('tr',null,cols.map(c=>{
      const on=sort[0]===c.k;
      return h('th',{class:c.num?'num':null,scope:'col','aria-sort':on?(sort[1]>0?'ascending':'descending'):null},h('button',{onclick(){if(sort[0]===c.k)sort[1]=-sort[1];else{sort[0]=c.k;sort[1]=c.num?-1:1}S.sort[id]=sort;draw()}},c.l+(on?(sort[1]>0?' ▲':' ▼'):'')));
    }));
    const body=h('tbody');
    for(const r of shown){
      const tr=h('tr',{class:onRow?'go':null,onclick:onRow?(e)=>{if(!e.target.closest('button'))onRow(r)}:null});
      cols.forEach((c,i)=>{
        const txt=c.f?c.f(r):val(c,r);
        const content=i===(cols.findIndex(x=>x.main))&&onRow?h('button',{class:'link',onclick(){onRow(r)}},txt):txt;
        tr.append(h('td',{class:[c.num?'num':'',c.wide?'wide':'',c.mono?'m':''].join(' ').trim()||null},content));
      });
      body.append(tr);
    }
    wrap.replaceChildren(rows.length?h('div',{class:'table-wrap',tabindex:'0'},h('table',null,h('thead',null,thead),body)):h('div',{class:'muted'},t('none')));
    if(rows.length>limit)wrap.append(h('div',{class:'cap'},t('showing',nf(limit),nf(rows.length))));
  };
  draw();
  wrap.csv=()=>{
    const esc=v=>{let s=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
    return'﻿'+[cols.map(c=>esc(c.l)).join(';')].concat(rows.map(r=>cols.map(c=>{const x=c.csv?c.csv(r):val(c,r);return esc(typeof x==='number'?Math.round(x*1000)/1000:x)}).join(';'))).join('\r\n');
  };
  wrap.name=name||id;
  return wrap;
}

  const bD=maxOf('b'),xD=maxOf('x'),hasE=[...keep].some(x=>x[0]==='e'),hasT=[...keep].some(x=>x[0]==='t');
  const heads=[];let col=0;const colOf={};
  if(hasE){colOf.e=col++;heads.push(t('flEntry'))}
  colOf.b=col;for(let i=0;i<=bD;i++){heads.push(t('flBsfn',i+1));col++}
  if(hasT){colOf.t=col++;heads.push(t('flTable'))}
  colOf.x=col;for(let i=0;i<=xD;i++){heads.push(xD>0?t('flErrN',i+1):t('flErr'));col++}
  const cols=heads.map(()=>[]);
  for(const id of keep){const n=nodes.get(id);n.col=n.type==='e'?colOf.e:n.type==='t'?colOf.t:colOf[n.type]+depth.get(id);cols[n.col].push(n)}

  cols.forEach(c=>{c.sort((a,b)=>a.ord-b.ord);c.forEach((n,i)=>{n.pos=i-(c.length-1)/2})});
  const nb=new Map();for(const id of keep)nb.set(id,{p:[],s:[]});
  for(const e of edges){if(e.back)continue;nb.get(e.b).p.push(nodes.get(e.a));nb.get(e.a).s.push(nodes.get(e.b))}
  const sweep=(c,dir)=>{
    const sc=n=>{const l=nb.get(n.id)[dir];return l.length?l.reduce((a,x)=>a+x.pos,0)/l.length:n.pos};
    c.map(n=>[n,sc(n)]).sort((a,b)=>a[1]-b[1]).forEach(([n],i)=>{c[i]=n;n.pos=i-(c.length-1)/2});
  };
  for(let i=0;i<4;i++){for(const c of cols)sweep(c,'p');for(const c of [...cols].reverse())sweep(c,'s')}

  cols.forEach((c,i)=>c.forEach(n=>{n.x=M+i*(W+GX);n.y=mid+n.pos*(H+GY)-H/2}));

}

/* destaca o que vem antes e depois do bloco */
function flHi(id){
  const svg=$('#flow-svg');if(!svg)return;
  const eg=$$('.fl-eg',svg),nodes=$$('.fl-n',svg);
  if(!id){eg.concat(nodes).forEach(x=>x.classList.remove('dim'));return}
  const up=new Set([id]),down=new Set([id]);
  const ls=eg.map(e=>[e.dataset.a,e.dataset.b,e]);

  for(let ch=true;ch;){ch=false;for(const[a,b]of fw){if(down.has(a)&&!down.has(b)){down.add(b);ch=true}if(up.has(b)&&!up.has(a)){up.add(a);ch=true}}}
  for(const[a,b,e]of ls)e.classList.toggle('dim',!!e.dataset.back||!((down.has(a)&&down.has(b))||(up.has(a)&&up.has(b))));

function maskText(R,s){
  let o=String(s);
  const map=[...R.users,...R.hosts].filter(x=>x&&x.length>2).sort((a,b)=>b.length-a.length);
  for(const u of map)o=o.split(u).join('<...>');
  return o.replace(/\b\d{1,3}(?:\.\d{1,3}){3}\b/g,'<ip>').replace(/\b(DBServer|Machine|DBUser|User|TNSDB)=\S+/g,'$1=<...>').replace(/[A-Za-z]:\\[^\s"']+/g,'<path>').replace(/'[^']*'/g,"'?'").replace(/"[^"]*"/g,'"?"');
}
function buildReport(mask){
  const R=S.run,m=s=>mask?maskText(R,s):String(s),md=s=>m(s).replace(/\|/g,'\\|').replace(/\r?\n/g,' ');
  const L=[];
  L.push('# JDE Log Insights','');
  L.push(t('repAbout'),'');
  if(R.demo)L.push('> '+t('demoNote'),'');
  L.push('## '+t('repSum'),'');
  L.push('- '+t('ctxFiles')+': '+R.files.map(f=>mask?t('kind'+f.kind):f.name).join(', '));
  L.push('- '+t('tLines')+': '+nf(R.lines));
  if(R.tsMax!=null)L.push('- '+t('tPeriod')+': '+fmtTs(R.tsMin,true)+' – '+fmtTs(R.tsMax,true)+' ('+fmtMs(R.tsMax-R.tsMin)+')');
  L.push('- '+t('tErr')+': '+nf(R.errTotal)+' ('+nf(R.groupsA.length)+' '+t('tKinds')+')');
  L.push('- '+t('tBsfn')+': '+nf(R.bsfnCalls),'- '+t('tSql')+': '+nf(R.sqlCount),'');
  L.push('## '+t('tabI'),'');
  for(const x of buildInsights(R,S.th))L.push('- **'+t('sev'+x.sev)+': '+m(x.title)+'** '+m(x.body));
  L.push('');
  const top=(title,head,rows)=>{if(!rows.length)return;L.push('## '+title,'','| '+head.join(' | ')+' |','|'+head.map(()=>' --- ').join('|')+'|');rows.forEach(r=>L.push('| '+r.map(md).join(' | ')+' |'));L.push('')};
  top(t('repTopE'),[t('cCode'),t('cMsg'),t('cCount'),t('cFirst')],R.groupsA.slice(0,10).map(g=>[g.code,cut(g.msg,160),nf(g.count),fmtTs(g.first)]));
  top(t('repTopB'),[t('cName'),t('cCalls'),t('cTotal'),t('cSelf'),t('cMax')],R.bsfnA.filter(b=>b.timed).sort((a,b)=>b.self-a.self).slice(0,10).map(b=>[b.name,nf(b.calls),fmtMs(b.total),fmtMs(b.self),fmtMs(b.max)]));
  top(t('repTopS'),[t('cStmt'),t('cCount'),t('cRows'),t('cTime')],[...R.sqlA].sort((a,b)=>b.total-a.total).slice(0,10).map(s=>[cut(s.fp,200),nf(s.count),nf(s.rows),fmtMs(s.total)]));
  top(t('repTopG'),[t('cGap'),t('cAt'),t('cBefore'),t('cAfter')],R.gaps.filter(g=>g.ms>=S.th.gap).slice(0,10).map(g=>[fmtMs(g.ms),fmtTs(g.ts),cut(g.fromMsg,100),cut(g.toMsg,100)]));
  return L.join('\n')+'\n';
}
