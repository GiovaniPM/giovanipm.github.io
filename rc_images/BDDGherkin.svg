<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Anatomia de um arquivo .feature em Gherkin</title>
<desc id="d">Um arquivo .feature de exemplo, em Gherkin com palavras-chave em português, com anotações à direita. Linha de idioma; tag @saque; Funcionalidade com nome e descrição; Contexto com um passo comum a todos os cenários; um Cenário com Dado, Quando, Então e E; e um Esquema do Cenário com marcadores entre sinais de menor e maior, preenchidos pela tabela de Exemplos.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="558" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Anatomia de um arquivo .feature em Gherkin</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Palavras-chave no início de cada linha, texto livre em português logo depois</text>
<rect x="30" y="100" width="600" height="432.5" rx="12" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="48" y="126.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#A898C0"># language: pt</tspan></text>
<text x="48" y="143.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FF8A8A">@saque</tspan></text>
<text x="48" y="161.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">Funcionalidade:</tspan><tspan fill="#F7F0FF"> Saque no caixa eletrônico</tspan></text>
<text x="48" y="178.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F7F0FF">  Para não enfrentar fila no banco,</tspan></text>
<text x="48" y="196.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F7F0FF">  como cliente, quero sacar no caixa.</tspan></text>
<text x="48" y="213.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="231.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Contexto:</tspan></text>
<text x="48" y="248.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dado</tspan><tspan fill="#F7F0FF"> que o meu cartão é válido</tspan></text>
<text x="48" y="266.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="283.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Cenário:</tspan><tspan fill="#F7F0FF"> Saldo suficiente</tspan></text>
<text x="48" y="301.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dado</tspan><tspan fill="#F7F0FF"> que tenho R$ 100 na conta</tspan></text>
<text x="48" y="318.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Quando</tspan><tspan fill="#F7F0FF"> peço R$ 20</tspan></text>
<text x="48" y="336.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Então</tspan><tspan fill="#F7F0FF"> recebo R$ 20</tspan></text>
<text x="48" y="353.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    E</tspan><tspan fill="#F7F0FF"> o cartão é devolvido</tspan></text>
<text x="48" y="371.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="388.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Esquema do Cenário:</tspan><tspan fill="#F7F0FF"> Limite de saque</tspan></text>
<text x="48" y="406.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dado</tspan><tspan fill="#F7F0FF"> que tenho R$ </tspan><tspan fill="#C9A7F5">&lt;saldo&gt;</tspan><tspan fill="#F7F0FF"> na conta</tspan></text>
<text x="48" y="423.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Quando</tspan><tspan fill="#F7F0FF"> peço R$ </tspan><tspan fill="#C9A7F5">&lt;pedido&gt;</tspan></text>
<text x="48" y="441.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Então</tspan><tspan fill="#F7F0FF"> o saque é </tspan><tspan fill="#C9A7F5">&lt;resultado&gt;</tspan></text>
<text x="48" y="458.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">    Exemplos:</tspan></text>
<text x="48" y="476.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      | saldo | pedido | resultado |</tspan></text>
<text x="48" y="493.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      |   100 |    150 | recusado  |</tspan></text>
<text x="48" y="511.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      |   100 |    100 | aprovado  |</tspan></text>
<path d="M640 114.0 h8 V147.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 130.8 H656 V114.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="118.8" font-size="13" fill="#2B1B3D" font-weight="700">Idioma e tag</text>
<text x="668.0" y="134.8" font-size="12.5" fill="#3E3350"># language define as palavras-chave;</text>
<text x="668.0" y="150.8" font-size="12.5" fill="#3E3350">@tag agrupa e filtra o que executar</text>
<path d="M640 149.0 h8 V200.0 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 174.5 H656 V168.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="172.8" font-size="13" fill="#2B1B3D" font-weight="700">Funcionalidade</text>
<text x="668.0" y="188.8" font-size="12.5" fill="#3E3350">nome na mesma linha e descrição</text>
<text x="668.0" y="204.8" font-size="12.5" fill="#3E3350">livre nas linhas seguintes</text>
<path d="M640 219.0 h8 V252.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 235.8 H656 V222.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="226.8" font-size="13" fill="#2B1B3D" font-weight="700">Contexto</text>
<text x="668.0" y="242.8" font-size="12.5" fill="#3E3350">passos que valem para todos</text>
<text x="668.0" y="258.8" font-size="12.5" fill="#3E3350">os cenários do arquivo</text>
<path d="M640 271.5 h8 V357.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 314.5 H656 V298.5 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="302.5" font-size="13" fill="#2B1B3D" font-weight="700">Cenário</text>
<text x="668.0" y="318.5" font-size="12.5" fill="#3E3350">Dado: contexto · Quando: ação</text>
<text x="668.0" y="334.5" font-size="12.5" fill="#3E3350">Então: resultado · E/Mas: mais passos</text>
<path d="M640 376.5 h8 V515.0 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 445.8 H656 V421.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="425.8" font-size="13" fill="#2B1B3D" font-weight="700">Esquema do Cenário</text>
<text x="668.0" y="441.8" font-size="12.5" fill="#3E3350">os &lt;marcadores&gt; recebem os valores</text>
<text x="668.0" y="457.8" font-size="12.5" fill="#3E3350">de cada linha dos Exemplos: cada</text>
<text x="668.0" y="473.8" font-size="12.5" fill="#3E3350">linha é um cenário novo</text>
</svg>
