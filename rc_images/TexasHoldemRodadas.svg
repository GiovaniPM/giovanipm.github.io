<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">As rodadas de uma mão de Texas Hold’em</title>
<desc id="d">Seis etapas da esquerda para a direita: blinds; pré-flop, com duas cartas fechadas para cada um; flop, com três cartas comunitárias; turn, com a quarta; river, com a quinta; e showdown. Antes do flop, do turn e do river queima-se uma carta, e depois de cada abertura há uma rodada de apostas.</desc>
<rect width="1000" height="360" rx="18" fill="#FFF7EC"/>
<rect x="26" y="40" width="150" height="210" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="101" y="72" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Blinds</text><circle cx="81" cy="122" r="17" fill="#C8102E" stroke="#FFF" stroke-width="3"/><text x="81" y="127" font-size="12" fill="#FFF" text-anchor="middle" font-weight="700">SB</text><circle cx="123" cy="122" r="17" fill="#202020" stroke="#FFF" stroke-width="3"/><text x="123" y="127" font-size="12" fill="#FFF" text-anchor="middle" font-weight="700">BB</text><text x="101" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">SB e BB põem</text><text x="101" y="202" font-size="13" fill="#2B1B3D" text-anchor="middle">as apostas obrigatórias</text><path d="M177 145 L187 145" stroke="#756986" stroke-width="2"/><rect x="188" y="40" width="150" height="210" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="263" y="72" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Pré-flop</text><rect x="235" y="104" width="26" height="36" rx="4" fill="#A3122A" stroke="#2B1B3D" stroke-width="1.2"/><rect x="239" y="108" width="18" height="28" rx="2" fill="none" stroke="#F0C9B4"/><rect x="265" y="104" width="26" height="36" rx="4" fill="#A3122A" stroke="#2B1B3D" stroke-width="1.2"/><rect x="269" y="108" width="18" height="28" rx="2" fill="none" stroke="#F0C9B4"/><text x="263" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">2 cartas fechadas</text><text x="263" y="202" font-size="13" fill="#2B1B3D" text-anchor="middle">para cada jogador</text><rect x="194" y="268" width="138" height="30" rx="15" fill="#FFF1C9" stroke="#B35300"/><text x="263" y="288" font-size="12.5" fill="#B35300" text-anchor="middle" font-weight="700">rodada de apostas</text><path d="M339 145 L349 145" stroke="#756986" stroke-width="2"/><rect x="350" y="40" width="150" height="210" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="425" y="72" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Flop</text><rect x="382" y="104" width="26" height="36" rx="4" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.2"/><text x="395" y="127" font-size="13" fill="#141414" text-anchor="middle" font-weight="700">A♣</text><rect x="412" y="104" width="26" height="36" rx="4" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.2"/><text x="425" y="127" font-size="13" fill="#141414" text-anchor="middle" font-weight="700">Q♣</text><rect x="442" y="104" width="26" height="36" rx="4" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.2"/><text x="455" y="127" font-size="13" fill="#C8102E" text-anchor="middle" font-weight="700">J♦</text><text x="425" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">queima 1, abre 3</text><text x="425" y="202" font-size="13" fill="#2B1B3D" text-anchor="middle">cartas na mesa</text><rect x="356" y="268" width="138" height="30" rx="15" fill="#FFF1C9" stroke="#B35300"/><text x="425" y="288" font-size="12.5" fill="#B35300" text-anchor="middle" font-weight="700">rodada de apostas</text><path d="M501 145 L511 145" stroke="#756986" stroke-width="2"/><rect x="512" y="40" width="150" height="210" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="587" y="72" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Turn</text><rect x="574" y="104" width="26" height="36" rx="4" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.2"/><text x="587" y="127" font-size="13" fill="#141414" text-anchor="middle" font-weight="700">10♣</text><text x="587" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">queima 1, abre</text><text x="587" y="202" font-size="13" fill="#2B1B3D" text-anchor="middle">a 4ª carta</text><rect x="518" y="268" width="138" height="30" rx="15" fill="#FFF1C9" stroke="#B35300"/><text x="587" y="288" font-size="12.5" fill="#B35300" text-anchor="middle" font-weight="700">rodada de apostas</text><path d="M663 145 L673 145" stroke="#756986" stroke-width="2"/><rect x="674" y="40" width="150" height="210" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="749" y="72" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">River</text><rect x="736" y="104" width="26" height="36" rx="4" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.2"/><text x="749" y="127" font-size="13" fill="#141414" text-anchor="middle" font-weight="700">8♣</text><text x="749" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">queima 1, abre</text><text x="749" y="202" font-size="13" fill="#2B1B3D" text-anchor="middle">a 5ª carta</text><rect x="680" y="268" width="138" height="30" rx="15" fill="#FFF1C9" stroke="#B35300"/><text x="749" y="288" font-size="12.5" fill="#B35300" text-anchor="middle" font-weight="700">rodada de apostas</text><path d="M825 145 L835 145" stroke="#756986" stroke-width="2"/><rect x="836" y="40" width="150" height="210" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><text x="911" y="72" font-size="19" fill="#5B2A86" text-anchor="middle" font-weight="700">Showdown</text><rect x="883" y="104" width="26" height="36" rx="4" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.2"/><text x="896" y="127" font-size="13" fill="#141414" text-anchor="middle" font-weight="700">6♣</text><rect x="913" y="104" width="26" height="36" rx="4" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.2"/><text x="926" y="127" font-size="13" fill="#141414" text-anchor="middle" font-weight="700">2♣</text><text x="911" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">quem sobrou mostra;</text><text x="911" y="202" font-size="13" fill="#2B1B3D" text-anchor="middle">a melhor mão leva</text><text x="500" y="336" font-size="15" fill="#756986" text-anchor="middle">Se todos menos um desistem, a mão acaba na hora e as cartas restantes não são abertas.</text>
</svg>
