<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 508" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">How Cucumber links text to code</title>
<desc id="d">Three columns linked by arrows. On the left, the steps Given I have $100 in my account, When I request $20 and Then $20 should be dispensed. In the middle, the step definitions in code, each with the expression that matches the text and an {int} parameter. On the right, the system under test, an ATM. Below: all steps passed and the scenario turns green.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="508" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">How Cucumber links text to code</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Each Gherkin step finds a step definition, which calls the system</text>
<text x="180.0" y="112.0" font-size="14" fill="#756986" text-anchor="middle" font-weight="700">steps (.feature)</text>
<text x="540.0" y="112.0" font-size="14" fill="#756986" text-anchor="middle" font-weight="700">step definitions (code)</text>
<text x="860.0" y="112.0" font-size="14" fill="#756986" text-anchor="middle" font-weight="700">system under test</text>
<rect x="30" y="130" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="46" y="164" font-size="14.5" fill="#2B1B3D"><tspan font-weight="700" fill="#B35300">Given</tspan> I have $100 in my account</text>
<line x1="334" y1="158" x2="376" y2="158" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="380" y="124" width="320" height="68" rx="10" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="394" y="148" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5FD3C4" xml:space="preserve">Given('I have ${int} in my account',</text>
<text x="394" y="170" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#F7F0FF" xml:space="preserve">  (bal) =&gt; account.deposit(bal))</text>
<line x1="704" y1="158" x2="746" y2="158" stroke="#5B2A86" stroke-width="2.5" marker-end="url(#ap)"/>
<rect x="30" y="225" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="46" y="259" font-size="14.5" fill="#2B1B3D"><tspan font-weight="700" fill="#B35300">When</tspan> I request $20</text>
<line x1="334" y1="253" x2="376" y2="253" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="380" y="219" width="320" height="68" rx="10" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="394" y="243" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5FD3C4" xml:space="preserve">When('I request ${int}',</text>
<text x="394" y="265" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#F7F0FF" xml:space="preserve">  (amt) =&gt; atm.withdraw(amt))</text>
<line x1="704" y1="253" x2="746" y2="253" stroke="#5B2A86" stroke-width="2.5" marker-end="url(#ap)"/>
<rect x="30" y="320" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="46" y="354" font-size="14.5" fill="#2B1B3D"><tspan font-weight="700" fill="#B35300">Then</tspan> $20 should be dispensed</text>
<line x1="334" y1="348" x2="376" y2="348" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="380" y="314" width="320" height="68" rx="10" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="394" y="338" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5FD3C4" xml:space="preserve">Then('${int} should be dispensed',</text>
<text x="394" y="360" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#F7F0FF" xml:space="preserve">  (v) =&gt; assert(atm.dispensed(v)))</text>
<line x1="704" y1="348" x2="746" y2="348" stroke="#5B2A86" stroke-width="2.5" marker-end="url(#ap)"/>
<rect x="750" y="124" width="220" height="256" rx="14" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<rect x="815" y="160" width="90" height="120" rx="8" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/><rect x="828" y="174" width="64" height="40" rx="4" fill="#DDF3EF"/><rect x="832" y="228" width="56" height="8" rx="3" fill="#FFB703"/><rect x="840" y="250" width="40" height="18" rx="3" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="860.0" y="312.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">System under test</text>
<text x="860.0" y="334.0" font-size="12.5" fill="#3E3350" text-anchor="middle">account and ATM:</text>
<text x="860.0" y="352.0" font-size="12.5" fill="#3E3350" text-anchor="middle">the application’s real code</text>
<rect x="30" y="408" width="940" height="46" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2"/>
<circle cx="58" cy="431" r="13" fill="#2A9D8F"/><path d="M52 431 l4 5 l8 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82.0" y="436.0" font-size="14.5" fill="#2B1B3D" font-weight="700">All steps passed: the scenario turns green and the behavior is implemented.</text>
<text x="500.0" y="488.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">{int} is an expression parameter: the 100 in the text reaches the code as a number.</text>
</svg>
