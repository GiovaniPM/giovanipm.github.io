<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ciclo do novo agile</title>
<desc id="d">Ciclo de quatro etapas em sentido horário ao redor do princípio resultado, não volume. Etapa 1, objetivo de negócio: o ponto de partida, não um item de backlog. Etapa 2, protótipo com IA, gerado em horas na própria conversa. Etapa 3, validação, antes de qualquer grande investimento. Etapa 4, aprendizado: escalar, ajustar ou descartar, voltando ao objetivo de negócio.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ciclo do novo agile</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Iterações de horas ou dias, medidas por resultado de negócio</text>

<g fill="none" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)">
<path d="M625 170 Q780 170 780 272"/>
<path d="M780 368 Q780 470 628 470"/>
<path d="M375 470 Q220 470 220 368"/>
<path d="M220 272 Q220 170 372 170"/>
</g>

<circle cx="500" cy="320" r="78" fill="#5B2A86"/>
<text x="500" y="314" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Resultado,</text>
<text x="500" y="338" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">não volume</text>

<rect x="380" y="130" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<circle cx="380" cy="130" r="15" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/><text x="380" y="136" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">1</text>
<text x="500" y="164" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Objetivo de negócio</text>
<text x="500" y="188" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">o ponto de partida, não o backlog</text>

<rect x="660" y="280" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<circle cx="660" cy="280" r="15" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/><text x="660" y="286" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="780" y="314" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Protótipo com IA</text>
<text x="780" y="338" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">gerado em horas, na conversa</text>

<rect x="380" y="430" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<circle cx="380" cy="430" r="15" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/><text x="380" y="436" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="500" y="464" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Validação</text>
<text x="500" y="488" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">antes de qualquer grande investimento</text>

<rect x="100" y="280" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<circle cx="100" cy="280" r="15" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/><text x="100" y="286" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="220" y="314" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Aprendizado</text>
<text x="220" y="338" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">escalar, ajustar ou descartar</text>
</svg>
