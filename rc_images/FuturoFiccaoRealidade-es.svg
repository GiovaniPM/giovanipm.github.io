<text x="749.5" y="355" font-size="13" fill="#2B1B3D" font-weight="700">1973</text>
<text x="722.9" y="334" font-size="13" fill="#5B2A86" text-anchor="middle" font-style="italic">7 años</text>
<text x="50" y="416" font-size="15" fill="#2B1B3D" font-weight="700">Teletransportación de personas</text>
<text x="50" y="435" font-size="12.5" fill="#756986" font-style="italic">Star Trek → ?</text>
<line x1="710.4" y1="422" x2="932.8" y2="422" stroke="#756986" stroke-width="3" stroke-dasharray="6 6"/>
