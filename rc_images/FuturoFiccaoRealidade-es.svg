<text x="696.4" y="427" font-size="13" fill="#2B1B3D" text-anchor="end" font-weight="700">1966</text>
<text x="932.8" y="429" font-size="22" fill="#756986" text-anchor="middle" font-weight="700">?</text>
<text x="821.6" y="406" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">todavía ficción</text>
<circle cx="58" cy="492" r="7" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/><text x="72" y="497" font-size="13" fill="#2B1B3D">en la ficción</text>
<circle cx="208" cy="492" r="7" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/><text x="222" y="497" font-size="13" fill="#2B1B3D">en la realidad</text>
<text x="950" y="520" font-size="12" fill="#756986" text-anchor="end" font-style="italic">La teletransportación cuántica transfiere el estado de una partícula, no objetos ni personas.</text>
