<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">De la ficción a la realidad: cuánto tardó</title>
<desc id="d">Línea de tiempo de 1860 a 2030 con cinco ideas de la ficción y el año en que se volvieron realidad. Viaje humano a la Luna: Verne, 1865, y Apolo 11, 1969, 104 años. Tricorder médico: Star Trek, 1966, y DxtER, ganador del XPRIZE en 2017, 51 años. Teletransportación cuántica: Star Trek, 1966, y el experimento de Bouwmeester y colegas, 1997, 31 años. Teléfono celular portátil: Star Trek, 1966, y la llamada de Martin Cooper, 1973, 7 años. Teletransportación de personas: todavía ficción.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
