<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">El Plex: el pensamiento activo en el centro</title>
<desc id="d">El pensamiento activo Tornillos está en el centro. Arriba, el padre Elementos de fijación. Abajo, los hijos Tornillo M8x30, Tornillo M6x20 y Tornillo M10x40. A la izquierda, unidos por saltos, ISO 4017 y Metalúrgica Alfa. A la derecha, los hermanos Tuercas y Arandelas, que tienen el mismo padre.</desc>
