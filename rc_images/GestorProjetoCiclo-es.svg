<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="t d">
<title id="t">Ciclo de trabajo con el Gestor de proyecto</title>
<desc id="d">Cinco pasos en ciclo: 1 Planificar, con datos del proyecto, cronograma y dependencias; 2 Ejecutar, el equipo trabaja; 3 Dar seguimiento en el follow-up, actualizando estado, porcentaje, decisiones y acciones; 4 Analizar en las pestañas Visión general, CFD y métricas, Equipo y Riesgos; 5 Decidir y actuar, como reprogramar, quitar bloqueos o renegociar el alcance. Del paso 5 se vuelve al paso 2. En todos los pasos, Guardar graba los datos en el HTML y el JSON guarda una copia.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="370" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="500" y="44" font-size="22" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Un ciclo por semana (o por reunión)</text><rect x="20" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><rect x="20" y="90" width="168" height="40" rx="14" fill="#5B2A86"/><rect x="20" y="116" width="168" height="14" fill="#5B2A86"/><text x="104" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1. Planificar</text><text x="104" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Proyecto, cronograma,</text><text x="104" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">dependencias</text><line x1="190" y1="155" x2="213" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="216" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#0E8074" stroke-width="3"/><rect x="216" y="90" width="168" height="40" rx="14" fill="#0E8074"/><rect x="216" y="116" width="168" height="14" fill="#0E8074"/><text x="300" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2. Ejecutar</text><text x="300" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">el equipo</text><text x="300" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">trabaja</text><line x1="386" y1="155" x2="409" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="412" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#C2185B" stroke-width="3"/><rect x="412" y="90" width="168" height="40" rx="14" fill="#C2185B"/><rect x="412" y="116" width="168" height="14" fill="#C2185B"/><text x="496" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3. Dar seguimiento</text><text x="496" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">follow-up: estado, %,</text><text x="496" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">decisiones y acciones</text><line x1="582" y1="155" x2="605" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="608" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/><rect x="608" y="90" width="168" height="40" rx="14" fill="#3A86FF"/><rect x="608" y="116" width="168" height="14" fill="#3A86FF"/><text x="692" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4. Analizar</text><text x="692" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Visión general, CFD,</text><text x="692" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Equipo, Riesgos</text><line x1="778" y1="155" x2="801" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="804" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#B35300" stroke-width="3"/><rect x="804" y="90" width="168" height="40" rx="14" fill="#B35300"/><rect x="804" y="116" width="168" height="14" fill="#B35300"/><text x="888" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5. Decidir y actuar</text><text x="888" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">reprogramar, desbloquear,</text><text x="888" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">renegociar alcance</text><path d="M888 222 V270 H300 V224" fill="none" stroke="#2B1B3D" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="20" y="300" width="960" height="44" rx="10" fill="#FFF1C9"/><text x="500" y="328" font-size="15" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Guardar graba todo en el propio HTML · ⬇ JSON guarda una copia con fecha y hora</text>
</g></svg>
