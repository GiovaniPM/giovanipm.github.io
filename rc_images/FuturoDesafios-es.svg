<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Los cuatro desafíos: en qué punto está cada uno</title>
<desc id="d">Matriz con los cuatro desafíos en las filas y tres columnas: ya es realidad, en construcción y descartado por la física. Computación cuántica eficaz: corrección de errores por debajo del umbral con Willow en 2024; máquina tolerante a fallas prevista por IBM para 2029. IA omnisciente: IA que supera a los humanos en tareas específicas; IA general con previsiones entre 2029 y 2047; omnisciencia descartada por los límites de Gödel y Turing. Teletransportación: de estados cuánticos desde 1997 y vía satélite en 2017; de personas no viola la física pero está lejos; copiar sin destruir el original está prohibido por el teorema de no clonación. Comunicación vía entrelazamiento: distribución cuántica de claves con el satélite Micius; internet cuántica global en construcción; mensajes más rápidos que la luz descartados por el teorema de no comunicación.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Los cuatro desafíos: en qué punto está cada uno</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Qué ya existe, qué está en construcción y qué descarta la física</text>
<rect x="285" y="96" width="210" height="34" rx="10" fill="#2A9D8F"/>
<text x="390" y="118" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Ya es realidad</text>
<rect x="510" y="96" width="210" height="34" rx="10" fill="#FFB703"/>
<text x="615" y="118" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">En construcción</text>
<rect x="735" y="96" width="210" height="34" rx="10" fill="#E23B3B"/>
<text x="840" y="118" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Descartado por la física</text>
<rect x="50" y="142" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="182" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Computación</text>
<text x="160" y="202" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">cuántica eficaz</text>
<rect x="285" y="142" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">Corrección de errores bajo</text>
<text x="390" y="201" font-size="13" fill="#2B1B3D" text-anchor="middle">el umbral (Willow, 2024)</text>
<rect x="510" y="142" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">Máquina tolerante a</text>
<text x="615" y="201" font-size="13" fill="#2B1B3D" text-anchor="middle">fallas (IBM: 2029)</text>
<rect x="735" y="142" width="210" height="88" rx="12" fill="none" stroke="#D9C9B4" stroke-width="2" stroke-dasharray="5 5"/>
<text x="840" y="192" font-size="18" fill="#756986" text-anchor="middle">—</text>
<rect x="50" y="242" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="292" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">IA omnisciente</text>
<rect x="285" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">IA que supera a los humanos</text>
<text x="390" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">en tareas específicas</text>
<rect x="510" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">IA general: previsiones</text>
<text x="615" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">entre 2029 y 2047</text>
<rect x="735" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">Omnisciencia: límites</text>
<text x="840" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">de Gödel y Turing</text>
<rect x="50" y="342" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="392" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Teletransportación</text>
<rect x="285" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">De estados cuánticos</text>
<text x="390" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">(1997; satélite, 2017)</text>
<rect x="510" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">De personas: no viola la</text>
<text x="615" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">física, pero está lejos</text>
<rect x="735" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">Copiar sin destruir</text>
<text x="840" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">el original (no clonación)</text>
<rect x="50" y="442" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="482" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Comunicación vía</text>
<text x="160" y="502" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">entrelazamiento</text>
<rect x="285" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Distribución cuántica</text>
<text x="390" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">de claves (Micius)</text>
<rect x="510" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Internet cuántica</text>
<text x="615" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">a escala global</text>
<rect x="735" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Mensajes más rápidos</text>
<text x="840" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">que la luz (no-signaling)</text>
</svg>
