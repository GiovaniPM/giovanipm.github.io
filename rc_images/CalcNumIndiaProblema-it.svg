<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">La tavola dei seni di Aryabhata</title>
<desc id="d">A sinistra, un quarto di cerchio di raggio 3438 diviso in 24 archi uguali di 3°45’, cioè 225 minuti d’arco, con le semicorde verticali in ogni punto: sono i seni indiani, chiamati jyā, “corda d’arco”. Bisogna calcolare i 24 valori e anche quelli intermedi. A destra, due schede. Perché raggio 3438? Perché il cerchio ha 21.600 minuti d’arco e 21.600 diviso 2π fa circa 3438; così un arco piccolo e il suo seno quasi coincidono. E il π di Aryabhata, nel 499: 62.832 diviso 20.000, uguale a 3,1416, che lui chiama “approssimato”.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">La tavola dei seni di Aryabhata</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Astronomia e calendari avevano bisogno di 24 seni e di π</text><path d="M 80 130 A 340 340 0 0 1 420 470" fill="none" stroke="#2B1B3D" stroke-width="2.5"/><line x1="80" y1="470" x2="440" y2="470" stroke="#2B1B3D" stroke-width="2"/><line x1="80" y1="470" x2="80" y2="115" stroke="#2B1B3D" stroke-width="2"/><line x1="419.272" y1="447.763" x2="419.272" y2="470" stroke="#3A86FF" stroke-width="2"/><circle cx="419.272" cy="447.763" r="3.5" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1"/><line x1="417.091" y1="425.621" x2="417.091" y2="470" stroke="#2A9D8F" stroke-width="2"/><circle cx="417.091" cy="425.621" r="3.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><line x1="413.467" y1="403.669" x2="413.467" y2="470" stroke="#FF6B6B" stroke-width="2"/><circle cx="413.467" cy="403.669" r="3.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="408.415" cy="382.002" r="3.5" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1"/><circle cx="401.956" cy="360.711" r="3.5" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1"/><line x1="394.119" y1="339.888" x2="394.119" y2="470" stroke="#2A9D8F" stroke-width="2"/><circle cx="394.119" cy="339.888" r="3.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="384.937" cy="319.622" r="3.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="374.449" cy="300" r="3.5" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1"/><line x1="362.7" y1="281.106" x2="362.7" y2="470" stroke="#3A86FF" stroke-width="2"/><circle cx="362.7" cy="281.106" r="3.5" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1"/><circle cx="349.74" cy="263.021" r="3.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="335.626" cy="245.822" r="3.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><line x1="320.416" y1="229.584" x2="320.416" y2="470" stroke="#5B2A86" stroke-width="2"/><circle cx="320.416" cy="229.584" r="3.5" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1"/><circle cx="304.178" cy="214.374" r="3.5" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1"/><circle cx="286.979" cy="200.26" r="3.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><line x1="268.894" y1="187.3" x2="268.894" y2="470" stroke="#FF6B6B" stroke-width="2"/><circle cx="268.894" cy="187.3" r="3.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="250" cy="175.551" r="3.5" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1"/><circle cx="230.378" cy="165.063" r="3.5" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1"/><line x1="210.112" y1="155.881" x2="210.112" y2="470" stroke="#2A9D8F" stroke-width="2"/><circle cx="210.112" cy="155.881" r="3.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="189.289" cy="148.044" r="3.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="167.998" cy="141.585" r="3.5" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1"/><line x1="146.331" y1="136.533" x2="146.331" y2="470" stroke="#3A86FF" stroke-width="2"/><circle cx="146.331" cy="136.533" r="3.5" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1"/><circle cx="124.379" cy="132.909" r="3.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="102.237" cy="130.728" r="3.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><line x1="80" y1="130" x2="80" y2="470" stroke="#5B2A86" stroke-width="2"/><circle cx="80" cy="130" r="3.5" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1"/><line x1="80" y1="470" x2="394.119" y2="339.888" stroke="#756986" stroke-width="1.5" stroke-dasharray="4 4"/><text x="210" y="450" font-size="13" fill="#756986" text-anchor="middle">22°30’</text><text x="431.091" y="429.621" font-size="14" fill="#FF6B6B" text-anchor="start" font-weight="700">jyā = seno</text><text x="240" y="496" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">raggio R = 3438</text><text x="230" y="130" font-size="14" fill="#5B2A86" text-anchor="start" font-weight="700">24 archi di 3°45’ (225’)</text><rect x="520" y="110" width="450" height="170" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="745" y="140" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Perché raggio 3438?</text><text x="745" y="172" font-size="14" fill="#2B1B3D" text-anchor="middle">Il cerchio ha 360 × 60 = 21.600 minuti.</text><text x="745" y="196" font-size="14" fill="#2B1B3D" text-anchor="middle">21.600 ÷ 2π ≈ 3438</text><text x="745" y="220" font-size="14" fill="#2B1B3D" text-anchor="middle">Così un arco piccolo e il suo seno</text><text x="745" y="244" font-size="14" fill="#2B1B3D" text-anchor="middle">misurano quasi lo stesso: 225’ → 225.</text><rect x="520" y="300" width="450" height="190" rx="12" fill="#FFF1C9"/><text x="745" y="332" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">E π? Aryabhata, anno 499</text><text x="745" y="378" font-size="20" fill="#5B2A86" text-anchor="middle" font-weight="700">π ≈ 62.832 ÷ 20.000 = 3,1416</text><text x="745" y="418" font-size="14" fill="#2B1B3D" text-anchor="middle">Scrive che il valore è āsanna,</text><text x="745" y="442" font-size="14" fill="#2B1B3D" text-anchor="middle">“approssimato”: sapeva che non era esatto.</text>
</svg>
