<title id="t">Âncoras: posições, não caracteres</title>
<desc id="d">O texto o rato e a ratoeira com losangos marcando as posições encontradas por cada âncora: \b nas bordas de cada palavra, \B nas posições dentro das palavras, ^ no início e $ no fim. Abaixo, /rato/g encontra 2 correspondências, incluindo o início de ratoeira, e /\brato\b/g encontra só 1, a palavra inteira.</desc>
