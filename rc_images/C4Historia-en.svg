<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
<title id="t">Timeline of the C4 model</title>
<desc id="d">1995: Kruchten publishes the “4+1” view model. 2006–2009: Roots of C4, with Simon Brown, inspired by UML and 4+1. 2010: The diagrams get names: context, containers, components and classes. 2011: First use of the name “C4”, at QCon London. 2015–2018: “Classes” becomes “Code” (sources disagree on the date). 2018: An InfoQ article helps popularise the model.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#756986"/></marker>
<marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#2B1B3D" font-weight="bold" text-anchor="middle">From the 4+1 model to C4</text><line x1="60" y1="210" x2="940" y2="210" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="210" r="11" fill="#5B2A86" stroke="#fff" stroke-width="3"/><line x1="100" y1="199" x2="100" y2="150" stroke="#5B2A86" stroke-width="2"/><text x="100" y="82" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#5B2A86" font-weight="bold" text-anchor="middle">1995</text><text x="100" y="104" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Kruchten publishes the</text><text x="100" y="120" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">“4+1” view model</text><circle cx="260" cy="210" r="11" fill="#C2185B" stroke="#fff" stroke-width="3"/><line x1="260" y1="221" x2="260" y2="270" stroke="#C2185B" stroke-width="2"/><text x="260" y="296" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">2006–2009</text><text x="260" y="318" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Roots of C4, with</text><text x="260" y="334" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Simon Brown, inspired</text><text x="260" y="350" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">by UML and 4+1</text><circle cx="420" cy="210" r="11" fill="#0E8074" stroke="#fff" stroke-width="3"/><line x1="420" y1="199" x2="420" y2="150" stroke="#0E8074" stroke-width="2"/><text x="420" y="82" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#0E8074" font-weight="bold" text-anchor="middle">2010</text><text x="420" y="104" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">The diagrams get names:</text><text x="420" y="120" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">context, containers,</text><text x="420" y="136" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">components and classes</text><circle cx="580" cy="210" r="11" fill="#1168BD" stroke="#fff" stroke-width="3"/><line x1="580" y1="221" x2="580" y2="270" stroke="#1168BD" stroke-width="2"/><text x="580" y="296" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#1168BD" font-weight="bold" text-anchor="middle">2011</text><text x="580" y="318" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">First use of the</text><text x="580" y="334" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">name “C4”, at</text><text x="580" y="350" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">QCon London</text><circle cx="740" cy="210" r="11" fill="#B35300" stroke="#fff" stroke-width="3"/><line x1="740" y1="199" x2="740" y2="150" stroke="#B35300" stroke-width="2"/><text x="740" y="82" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#B35300" font-weight="bold" text-anchor="middle">2015–2018</text><text x="740" y="104" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">“Classes” becomes “Code”</text><text x="740" y="120" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">(sources disagree</text><text x="740" y="136" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">on the date)</text><circle cx="900" cy="210" r="11" fill="#2A9D8F" stroke="#fff" stroke-width="3"/><line x1="900" y1="221" x2="900" y2="270" stroke="#2A9D8F" stroke-width="2"/><text x="900" y="296" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#2A9D8F" font-weight="bold" text-anchor="middle">2018</text><text x="900" y="318" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">An InfoQ article helps</text><text x="900" y="334" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">popularise the model</text>
