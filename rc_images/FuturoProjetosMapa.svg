<text x="66" y="532" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">Como sabemos se</text><text x="66" y="549" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">o valor flui?</text>
<rect x="272" y="488" width="540" height="66" rx="10" fill="#fff" stroke="#5B2A86" stroke-width="2.5"/>
<text x="288" y="511" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Flow Framework</text>
<text x="288" y="536" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="start">4 itens e 5 métricas de fluxo</text>
<rect x="846" y="86" width="114" height="478" rx="14" fill="#2B1B3D"/>
