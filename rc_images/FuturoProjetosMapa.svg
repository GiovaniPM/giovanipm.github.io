<text x="66" y="434" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">Quem faz e como as</text><text x="66" y="451" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">equipes interagem?</text>
<rect x="272" y="390" width="540" height="66" rx="10" fill="#fff" stroke="#3A86FF" stroke-width="2.5"/>
