<text x="903" y="339.0" font-size="14" font-weight="400" fill="#FCE4F0" text-anchor="middle">aplicada</text><text x="903" y="357.0" font-size="14" font-weight="400" fill="#FCE4F0" text-anchor="middle">a todas as</text><text x="903" y="375.0" font-size="14" font-weight="400" fill="#FCE4F0" text-anchor="middle">camadas</text>
<text x="500" y="590" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Agrupamento em camadas proposto neste artigo.</text>
