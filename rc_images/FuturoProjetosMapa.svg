<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Além dos projetos: sete ideias, cinco camadas</title>
<desc id="d">Mapa das sete ideias em cinco camadas. Mentalidade, qual é a unidade de trabalho: #NoProjects, produtos e fluxo contínuo, não projetos. Direção, para onde vamos e por quê: OKRs. Dinheiro, como alocamos os recursos: Beyond Budgeting e Lean Portfolio Management do SAFe. Estrutura, quem faz e como as equipes interagem: Team Topologies. Medição, como sabemos se o valor flui: Flow Framework. Uma faixa vertical indica a IA aplicada a todas as camadas.</desc>
<rect width="1000" height="610" rx="18" fill="#FFF7EC"/>
<text x="500" y="52" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Além dos projetos: sete ideias, cinco camadas</text>
<rect x="40" y="86" width="790" height="86" rx="14" fill="#FDE4EA"/>
<rect x="40" y="86" width="8" height="86" rx="4" fill="#EF476F"/>
<text x="66" y="118" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="start">Mentalidade</text>
<text x="66" y="140" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">Qual é a unidade</text><text x="66" y="157" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">de trabalho?</text>
<rect x="272" y="96" width="540" height="66" rx="10" fill="#fff" stroke="#EF476F" stroke-width="2.5"/>
<text x="288" y="119" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">#NoProjects</text>
<text x="288" y="144" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="start">produtos e fluxo contínuo, não projetos</text>
<rect x="40" y="184" width="790" height="86" rx="14" fill="#FFF1C9"/>
<rect x="40" y="184" width="8" height="86" rx="4" fill="#FFB703"/>
<text x="66" y="216" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="start">Direção</text>
<text x="66" y="238" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">Para onde vamos</text><text x="66" y="255" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">e por quê?</text>
<rect x="272" y="194" width="540" height="66" rx="10" fill="#fff" stroke="#FFB703" stroke-width="2.5"/>
<text x="288" y="217" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">OKRs</text>
<text x="288" y="242" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="start">objetivos e resultados-chave</text>
<rect x="40" y="282" width="790" height="86" rx="14" fill="#DDF3EF"/>
<rect x="40" y="282" width="8" height="86" rx="4" fill="#2A9D8F"/>
<text x="66" y="314" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="start">Dinheiro</text>
<text x="66" y="336" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">Como alocamos</text><text x="66" y="353" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">os recursos?</text>
<rect x="272" y="292" width="264" height="66" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="288" y="315" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Beyond Budgeting</text>
<text x="288" y="334" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">metas relativas, recursos</text><text x="288" y="349" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">sob demanda</text>
<rect x="548" y="292" width="264" height="66" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="564" y="315" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Lean Portfolio Management</text>
<text x="564" y="334" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">orçamento por fluxo</text><text x="564" y="349" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">de valor (SAFe)</text>
<rect x="40" y="380" width="790" height="86" rx="14" fill="#E1ECFF"/>
<rect x="40" y="380" width="8" height="86" rx="4" fill="#3A86FF"/>
