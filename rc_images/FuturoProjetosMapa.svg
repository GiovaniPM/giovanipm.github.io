<text x="288" y="438" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="start">4 tipos de equipe, 3 modos de interação</text>
<rect x="40" y="478" width="790" height="86" rx="14" fill="#EFE6F8"/>
<rect x="40" y="478" width="8" height="86" rx="4" fill="#5B2A86"/>
