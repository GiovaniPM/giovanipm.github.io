<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Custo do atraso: quanto custa esperar</title>
<desc id="d">À esquerda, duas curvas de valor acumulado de um item que gera R$ 10 mil por semana: lançado na semana 4 e lançado na semana 8. A área entre elas é o valor perdido, R$ 40 mil. À direita, três itens ordenados por CD3, o custo do atraso dividido pela duração: B, com R$ 6 mil por semana e 1 semana, CD3 de 6; A, com R$ 10 mil por semana e 4 semanas, CD3 de 2,5; C, com R$ 20 mil por semana e 10 semanas, CD3 de 2.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker></defs>
<rect width="1000" height="485" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Custo do atraso: quanto custa esperar</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">O valor perdido por semana de atraso orienta a prioridade</text>
<text x="275.0" y="112.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Valor acumulado de um item</text>
<polygon points="70.0,400.0 104.2,400.0 138.3,400.0 172.5,400.0 206.7,400.0 240.8,371.0 275.0,342.0 309.2,313.0 343.3,284.0 377.5,255.0 411.7,226.0 445.8,197.0 480.0,168.0 480.0,284.0 445.8,313.0 411.7,342.0 377.5,371.0 343.3,400.0 309.2,400.0 275.0,400.0 240.8,400.0 206.7,400.0 172.5,400.0 138.3,400.0 104.2,400.0 70.0,400.0" fill="#FFE3E3" stroke="none"/>
<polyline points="70.0,400.0 104.2,400.0 138.3,400.0 172.5,400.0 206.7,400.0 240.8,371.0 275.0,342.0 309.2,313.0 343.3,284.0 377.5,255.0 411.7,226.0 445.8,197.0 480.0,168.0" fill="none" stroke="#2A9D8F" stroke-width="3"/>
<polyline points="70.0,400.0 104.2,400.0 138.3,400.0 172.5,400.0 206.7,400.0 240.8,400.0 275.0,400.0 309.2,400.0 343.3,400.0 377.5,371.0 411.7,342.0 445.8,313.0 480.0,284.0" fill="none" stroke="#D62828" stroke-width="3" stroke-dasharray="8 5"/>
<line x1="70" y1="400" x2="480" y2="400" stroke="#2B1B3D" stroke-width="2"/>
<line x1="70" y1="400" x2="70" y2="130" stroke="#2B1B3D" stroke-width="2"/>
<text x="70.0" y="418.0" font-size="11" fill="#756986" text-anchor="middle">0</text>
<text x="138.3" y="418.0" font-size="11" fill="#756986" text-anchor="middle">2</text>
<text x="206.7" y="418.0" font-size="11" fill="#756986" text-anchor="middle">4</text>
<text x="275.0" y="418.0" font-size="11" fill="#756986" text-anchor="middle">6</text>
<text x="343.3" y="418.0" font-size="11" fill="#756986" text-anchor="middle">8</text>
<text x="411.7" y="418.0" font-size="11" fill="#756986" text-anchor="middle">10</text>
<text x="480.0" y="418.0" font-size="11" fill="#756986" text-anchor="middle">12</text>
<text x="480.0" y="436.0" font-size="11.5" fill="#756986" text-anchor="end">semanas</text>
<text x="78.0" y="138.0" font-size="11.5" fill="#3E3350" font-weight="700">R$ mil</text>
<line x1="88" y1="160" x2="116" y2="160" stroke="#2A9D8F" stroke-width="3"/>
<text x="124.0" y="164.0" font-size="12" fill="#0E6B61" font-weight="700">lançado na semana 4</text>
<line x1="88" y1="180" x2="116" y2="180" stroke="#D62828" stroke-width="3" stroke-dasharray="6 4"/>
<text x="124.0" y="184.0" font-size="12" fill="#D62828" font-weight="700">lançado na semana 8</text>
<text x="88.0" y="214.0" font-size="12.5" fill="#D62828" font-weight="700">valor perdido: R$ 40 mil</text>
<text x="88.0" y="230.0" font-size="11.5" fill="#3E3350">4 semanas × R$ 10 mil/semana</text>
<path d="M170 238 C 230 268, 333.8 290, 398.0 289.8" stroke="#D62828" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
<line x1="520" y1="100" x2="520" y2="440" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="750.0" y="112.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Prioridade por CD3 = CoD ÷ duração</text>
<rect x="550.0" y="150.0" width="400.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="578" cy="185" r="16" fill="#5B2A86"/>
<text x="578.0" y="191.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">B</text>
<text x="606.0" y="176.0" font-size="12.5" fill="#3E3350">CoD R$ 6 mil/sem · duração 1 sem</text>
<rect x="606" y="188" width="264.0" height="18" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="1"/>
<text x="876.0" y="202.0" font-size="12.5" fill="#2B1B3D" font-weight="700">CD3 = 6,0</text>
<text x="940.0" y="176.0" font-size="13" fill="#C2185B" text-anchor="end" font-weight="700">1º</text>
<rect x="550.0" y="236.0" width="400.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="578" cy="271" r="16" fill="#5B2A86"/>
<text x="578.0" y="277.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text>
<text x="606.0" y="262.0" font-size="12.5" fill="#3E3350">CoD R$ 10 mil/sem · duração 4 sem</text>
<rect x="606" y="274" width="110.0" height="18" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="1"/>
<text x="722.0" y="288.0" font-size="12.5" fill="#2B1B3D" font-weight="700">CD3 = 2,5</text>
<text x="940.0" y="262.0" font-size="13" fill="#C2185B" text-anchor="end" font-weight="700">2º</text>
<rect x="550.0" y="322.0" width="400.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="578" cy="357" r="16" fill="#5B2A86"/>
<text x="578.0" y="363.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">C</text>
<text x="606.0" y="348.0" font-size="12.5" fill="#3E3350">CoD R$ 20 mil/sem · duração 10 sem</text>
<rect x="606" y="360" width="88.0" height="18" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="1"/>
<text x="700.0" y="374.0" font-size="12.5" fill="#2B1B3D" font-weight="700">CD3 = 2,0</text>
<text x="940.0" y="348.0" font-size="13" fill="#C2185B" text-anchor="end" font-weight="700">3º</text>
<text x="750.0" y="420.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">Faça primeiro o que tem mais valor por semana de trabalho.</text>
<text x="500.0" y="465.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Custo do atraso (CoD) = valor que se deixa de ganhar por unidade de tempo de atraso.</text>
</svg>
