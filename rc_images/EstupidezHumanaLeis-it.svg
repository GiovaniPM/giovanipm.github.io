<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 0 1160 720" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Comprendere la stupidità umana</title>
<desc id="d">Comprendere la stupidità umana. 1. Sottovalutare la stupidità: Tutti sottovalutano quante persone stupide esistono. 2. Indipendenza della stupidità: La stupidità non dipende da altre caratteristiche. 3. Definizione di stupidità: Causare perdite agli altri senza ottenere alcun vantaggio per sé. 4. Sottovalutare il danno: I non stupidi sottovalutano il danno causato dagli stupidi. 5. Il pericolo degli stupidi: Lo stupido è il tipo di persona più pericoloso.</desc>
