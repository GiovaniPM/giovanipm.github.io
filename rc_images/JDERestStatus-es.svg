<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ciclo de estado de una línea de orden de compra</title>
<desc id="d">Ejemplo de reglas de actividad de una orden OP: 220 ingreso de la orden, 230 aprobación, 280 impresión y envío al proveedor, 400 recepción, 999 cerrada. Una línea también puede pasar a 980, cancelada. Cada línea de la F4311 guarda el último estado (LTTR) y el estado siguiente (NXTR); la cantidad pedida es UORG, la recibida es UREC y el importe abierto es AOPN. Los códigos varían según las reglas de actividad configuradas en la P40204.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="42.0" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Estado de una línea de orden de compra</text>
<text x="500.0" y="68.0" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Cada línea de la F4311 tiene un último estado (LTTR) y un estado siguiente (NXTR)</text>
<rect x="40" y="110" width="150" height="110" rx="14" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2.2"/>
<text x="115.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">220</text>
<text x="115.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Ingreso</text>
<text x="115.0" y="199.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">de la orden</text>
<polyline points="190,165 228,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="230" y="110" width="150" height="110" rx="14" fill="#FFF1C9" stroke="#B35300" stroke-width="2.2"/>
<text x="305.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">230</text>
<text x="305.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Aprobación</text>
<polyline points="380,165 418,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="110" width="150" height="110" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.2"/>
<text x="495.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">280</text>
<text x="495.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Impresión /</text>
<text x="495.0" y="199.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">envío</text>
<polyline points="570,165 608,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="610" y="110" width="150" height="110" rx="14" fill="#E2F6F2" stroke="#0E8074" stroke-width="2.2"/>
<text x="685.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">400</text>
<text x="685.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Recepción</text>
<polyline points="760,165 798,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="800" y="110" width="150" height="110" rx="14" fill="#E2F6F2" stroke="#0E8074" stroke-width="2.2"/>
<text x="875.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">999</text>
<text x="875.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Cerrada</text>
<rect x="420" y="262" width="150" height="70" rx="14" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2.2"/>
<text x="495.0" y="294.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">980</text>
<text x="495.0" y="318.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Cancelada</text>
<polyline points="115,220 115,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="305,220 305,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="495,220 495,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="685,220 685,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="495,240 495,260" fill="none" stroke="#E23B3B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ae)"/>
<rect x="40" y="360" width="440" height="130" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="260.0" y="393.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Campos útiles en la F4311</text>
<text x="260.0" y="411.5" font-size="12.5" fill="#3E3350" text-anchor="middle">DOCO / DCTO / KCOO: número, tipo y compañía</text>
<text x="260.0" y="430.0" font-size="12.5" fill="#3E3350" text-anchor="middle">LNID: línea   ·   LITM: artículo</text>
<text x="260.0" y="448.5" font-size="12.5" fill="#3E3350" text-anchor="middle">UORG: cant. pedida   ·   UREC: cant. recibida</text>
<text x="260.0" y="467.0" font-size="12.5" fill="#3E3350" text-anchor="middle">AOPN: importe abierto</text>
<rect x="510" y="360" width="450" height="62" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="735.0" y="377.5" font-size="13" fill="#3E3350" text-anchor="middle">Ejemplo de respuesta:  LTTR = 280, NXTR = 400</text>
<text x="735.0" y="396.0" font-size="13" fill="#3E3350" text-anchor="middle">→ orden enviada, a la espera de recepción</text>
<rect x="510" y="430" width="450" height="60" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="735.0" y="446.5" font-size="12.5" fill="#3E3350" text-anchor="middle">Códigos ilustrativos: verifica las reglas de actividad (P40204)</text>
<text x="735.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">del tipo de orden y de línea en tu entorno.</text>
</svg>
