<title id="t">Anatomia di un elemento e di una relazione nel C4</title>
<desc id="d">API Prenotazioni [Container: Java / Spring Boot] → Legge e scrive [SQL/TCP] → Database [Container: PostgreSQL]. 1: Nome dell’elemento. 2: Tipo e, per container e componenti, la tecnologia. 3: Breve descrizione delle responsabilità. 4: Etichetta con un verbo, nel verso della freccia (evita “Usa”). 5: Tecnologia o protocollo della relazione. Ogni diagramma ha anche un titolo (tipo e ambito) e una legenda.</desc>
