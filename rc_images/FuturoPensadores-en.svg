<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">What today’s leading thinkers say</title>
<desc id="d">Two panels. Top, when general AI arrives, on a timeline from 2025 to 2050: Ray Kurzweil predicts general AI in 2029 and the singularity in 2045; Demis Hassabis speaks of 5 to 10 years from 2025; the survey by Grace and colleagues of 2,778 researchers gives a 10% chance by 2027 and 50% by 2047; Yann LeCun says it will not come from today’s language models. Bottom, a risk band from overblown to existential: LeCun calls the risk complete B.S.; Harari sees AI as alien intelligence; Hawking said in 2014 it could spell the end of the human race; Hinton puts the chance of extinction within 30 years at 10 to 20%.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
<rect width="1000" height="600" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">What today’s leading thinkers say</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Two questions: when general AI arrives and how big the risk is</text>
<text x="50" y="112" font-size="16" fill="#5B2A86" font-weight="700">When does general AI arrive?</text>
<line x1="290.0" y1="124" x2="290.0" y2="316" stroke="#EADBC6" stroke-width="1"/>
<text x="290" y="334" font-size="12" fill="#756986" text-anchor="middle">2025</text>
<line x1="418.0" y1="124" x2="418.0" y2="316" stroke="#EADBC6" stroke-width="1"/>
<text x="418" y="334" font-size="12" fill="#756986" text-anchor="middle">2030</text>
<line x1="546.0" y1="124" x2="546.0" y2="316" stroke="#EADBC6" stroke-width="1"/>
<text x="546" y="334" font-size="12" fill="#756986" text-anchor="middle">2035</text>
<line x1="674.0" y1="124" x2="674.0" y2="316" stroke="#EADBC6" stroke-width="1"/>
<text x="674" y="334" font-size="12" fill="#756986" text-anchor="middle">2040</text>
<line x1="802.0" y1="124" x2="802.0" y2="316" stroke="#EADBC6" stroke-width="1"/>
<text x="802" y="334" font-size="12" fill="#756986" text-anchor="middle">2045</text>
<line x1="930.0" y1="124" x2="930.0" y2="316" stroke="#EADBC6" stroke-width="1"/>
<text x="930" y="334" font-size="12" fill="#756986" text-anchor="middle">2050</text>
<text x="50" y="148" font-size="14.5" fill="#2B1B3D" font-weight="700">Ray Kurzweil</text>
<text x="50" y="164" font-size="11.5" fill="#756986" font-style="italic">2024 book</text>
<text x="50" y="196" font-size="14.5" fill="#2B1B3D" font-weight="700">Demis Hassabis</text>
<text x="50" y="212" font-size="11.5" fill="#756986" font-style="italic">2025 interview</text>
<text x="50" y="244" font-size="14.5" fill="#2B1B3D" font-weight="700">Grace et al.</text>
<text x="50" y="260" font-size="11.5" fill="#756986" font-style="italic">2,778 researchers, 2024</text>
<text x="50" y="292" font-size="14.5" fill="#2B1B3D" font-weight="700">Yann LeCun</text>
<text x="50" y="308" font-size="11.5" fill="#756986" font-style="italic">2024</text>
<line x1="392.4" y1="148" x2="802.0" y2="148" stroke="#5B2A86" stroke-width="2" stroke-dasharray="4 5"/>
<circle cx="392.4" cy="148" r="8" fill="#5B2A86"/><text x="392.4" y="134" font-size="12.5" fill="#5B2A86" text-anchor="middle" font-weight="700">2029 · general AI</text>
<circle cx="802.0" cy="148" r="8" fill="#5B2A86"/><text x="802" y="134" font-size="12.5" fill="#5B2A86" text-anchor="middle" font-weight="700">2045 · singularity</text>
<rect x="418.0" y="188" width="128.0" height="16" rx="8" fill="#3A86FF"/><text x="558" y="201" font-size="12.5" fill="#3A86FF" font-weight="700">“5 to 10 years”</text>
<line x1="341.2" y1="244" x2="853.2" y2="244" stroke="#FFB703" stroke-width="3"/>
<circle cx="341.2" cy="244" r="8" fill="#FFB703" stroke="#2B1B3D" stroke-width="1.5"/><text x="341.2" y="230" font-size="12.5" fill="#B35300" text-anchor="middle" font-weight="700">10% · 2027</text>
<circle cx="853.2" cy="244" r="8" fill="#FFB703" stroke="#2B1B3D" stroke-width="1.5"/><text x="853.2" y="230" font-size="12.5" fill="#B35300" text-anchor="middle" font-weight="700">50% · 2047</text>
<rect x="290" y="278" width="640" height="28" rx="14" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="5 4"/><text x="610" y="297" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-style="italic">not with today’s language models: new ideas are needed</text>
<line x1="50" y1="366" x2="950" y2="366" stroke="#EADBC6" stroke-width="1.5"/>
<text x="50" y="398" font-size="16" fill="#5B2A86" font-weight="700">How big is the risk?</text>
<rect x="50" y="468" width="900" height="12" rx="6" fill="url(#gd)" transform="rotate(180 500 474)"/>
<text x="50" y="500" font-size="13" fill="#2A9D8F" font-weight="700">Overblown</text>
<text x="950" y="500" font-size="13" fill="#E23B3B" text-anchor="end" font-weight="700">Existential</text>
<circle cx="250" cy="474" r="10" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="3"/>
<line x1="250" y1="486" x2="250" y2="520" stroke="#2B1B3D" stroke-width="1.5"/><text x="250" y="540" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Yann LeCun</text>
<text x="250" y="558" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">“complete B.S.”</text>
<text x="250" y="574" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">(2024)</text>
<circle cx="470" cy="474" r="10" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="3"/>
<line x1="470" y1="462" x2="470" y2="452" stroke="#2B1B3D" stroke-width="1.5"/><text x="470" y="412" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Yuval Harari</text>
<text x="470" y="430" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">AI as “alien</text>
<text x="470" y="446" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">intelligence” (2024)</text>
<circle cx="700" cy="474" r="10" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="3"/>
<line x1="700" y1="486" x2="700" y2="520" stroke="#2B1B3D" stroke-width="1.5"/><text x="700" y="540" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Stephen Hawking</text>
<text x="700" y="558" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">“could spell the end</text>
<text x="700" y="574" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">of the human race” (2014)</text>
<circle cx="880" cy="474" r="10" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="3"/>
<line x1="880" y1="462" x2="880" y2="452" stroke="#2B1B3D" stroke-width="1.5"/><text x="950" y="412" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">Geoffrey Hinton</text>
<text x="950" y="430" font-size="12.5" fill="#756986" text-anchor="end" font-style="italic">10–20% chance of</text>
<text x="950" y="446" font-size="12.5" fill="#756986" text-anchor="end" font-style="italic">extinction in 30 years (2024)</text>
</svg>
