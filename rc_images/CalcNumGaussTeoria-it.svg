<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Minimi quadrati: la retta dei quadratini più piccoli</title>
<desc id="d">Due grafici con gli stessi cinque punti: (1, 2), (2, 3), (3, 5), (4, 4) e (5, 6). A sinistra, la retta y = x + 1, con un quadratino disegnato per ogni errore verticale; la somma delle aree è 2,0. A destra, la retta di Gauss, y = 0,9x + 1,3, con quadratini la cui somma è 1,9, la più piccola possibile fra tutte le rette. Minimi quadrati significa scegliere la retta che rende la somma dei quadrati degli errori la più piccola possibile.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Minimi quadrati: la retta dei quadratini più piccoli</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Nessuna retta passa per tutti i punti. Qual è la “migliore”?</text><line x1="80" y1="440" x2="470" y2="440" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="80" y1="440" x2="80" y2="110" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><text x="143.333" y="460" font-size="12" fill="#756986" text-anchor="middle">1</text><text x="206.667" y="460" font-size="12" fill="#756986" text-anchor="middle">2</text><text x="270" y="460" font-size="12" fill="#756986" text-anchor="middle">3</text><text x="333.333" y="460" font-size="12" fill="#756986" text-anchor="middle">4</text><text x="396.667" y="460" font-size="12" fill="#756986" text-anchor="middle">5</text><text x="72" y="398.286" font-size="12" fill="#756986" text-anchor="end">1</text><text x="72" y="352.571" font-size="12" fill="#756986" text-anchor="end">2</text><text x="72" y="306.857" font-size="12" fill="#756986" text-anchor="end">3</text><text x="72" y="261.143" font-size="12" fill="#756986" text-anchor="end">4</text><text x="72" y="215.429" font-size="12" fill="#756986" text-anchor="end">5</text><text x="72" y="169.714" font-size="12" fill="#756986" text-anchor="end">6</text><line x1="99" y1="380.571" x2="441" y2="133.714" stroke="#FF6B6B" stroke-width="3"/><circle cx="143.333" cy="348.571" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="206.667" cy="302.857" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><rect x="270" y="211.429" width="45.7143" height="45.7143" rx="0" fill="#FF6B6B" fill-opacity="0.28"/><line x1="270" y1="211.429" x2="270" y2="257.143" stroke="#FF6B6B" stroke-width="2"/><circle cx="270" cy="211.429" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><rect x="333.333" y="211.429" width="45.7143" height="45.7143" rx="0" fill="#FF6B6B" fill-opacity="0.28"/><line x1="333.333" y1="257.143" x2="333.333" y2="211.429" stroke="#FF6B6B" stroke-width="2"/><circle cx="333.333" cy="257.143" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="396.667" cy="165.714" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><text x="270" y="110" font-size="18" fill="#FF6B6B" text-anchor="middle" font-weight="700">y = x + 1</text><rect x="120" y="480" width="300" height="44" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><text x="270" y="508" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">somma dei quadrati = 2,0</text><line x1="560" y1="440" x2="950" y2="440" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="560" y1="440" x2="560" y2="110" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><text x="623.333" y="460" font-size="12" fill="#756986" text-anchor="middle">1</text><text x="686.667" y="460" font-size="12" fill="#756986" text-anchor="middle">2</text><text x="750" y="460" font-size="12" fill="#756986" text-anchor="middle">3</text><text x="813.333" y="460" font-size="12" fill="#756986" text-anchor="middle">4</text><text x="876.667" y="460" font-size="12" fill="#756986" text-anchor="middle">5</text><text x="552" y="398.286" font-size="12" fill="#756986" text-anchor="end">1</text><text x="552" y="352.571" font-size="12" fill="#756986" text-anchor="end">2</text><text x="552" y="306.857" font-size="12" fill="#756986" text-anchor="end">3</text><text x="552" y="261.143" font-size="12" fill="#756986" text-anchor="end">4</text><text x="552" y="215.429" font-size="12" fill="#756986" text-anchor="end">5</text><text x="552" y="169.714" font-size="12" fill="#756986" text-anchor="end">6</text><line x1="579" y1="368.229" x2="921" y2="146.057" stroke="#2A9D8F" stroke-width="3"/><rect x="623.333" y="339.429" width="9.14286" height="9.14286" rx="0" fill="#2A9D8F" fill-opacity="0.28"/><line x1="623.333" y1="348.