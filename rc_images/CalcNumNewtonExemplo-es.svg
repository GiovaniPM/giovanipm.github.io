<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Newton en la práctica</title>
<desc id="d">A la izquierda, la tabla del ejemplo del propio Newton, x³ − 2x − 5 = 0, partiendo de x = 2: paso 1, 2,1; paso 2, 2,0945681; paso 3, 2,0945514817; paso 4, 2,09455148154. El error baja de 0,09 a 0,005, 0,00002 y 0,0000000002: cada error es más o menos el cuadrado del anterior. A la derecha, la raíz de 2 con Newton: f(x) = x² − 2, y la fórmula x − (x² − 2) ÷ 2x se simplifica en (x + 2 ÷ x) ÷ 2, exactamente el método babilónico de 3.600 años antes.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Newton en la práctica</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">El ejemplo del propio Newton y una sorpresa</text><rect x="30" y="100" width="520" height="46" rx="8" fill="#FFF1C9"/><text x="90" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">paso</text><text x="270" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">x</text><text x="450" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">error</text><text x="90" y="186" font-size="16" fill="#2B1B3D" text-anchor="middle">0</text><text x="270" y="186" font-size="17" text-anchor="middle" fill="#5B2A86" font-weight="700" font-family="Consolas, 'Courier New', monospace">2</text><text x="450" y="186" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">0,09</text><line x1="30" y1="204" x2="550" y2="204" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="234" font-size="16" fill="#2B1B3D" text-anchor="middle">1</text><text x="270" y="234" font-size="17" text-anchor="middle" fill="#5B2A86" font-weight="700" font-family="Consolas, 'Courier New', monospace">2,1</text><text x="450" y="234" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">0,005</text><line x1="30" y1="252" x2="550" y2="252" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="282" font-size="16" fill="#2B1B3D" text-anchor="middle">2</text><text x="270" y="282" font-size="17" text-anchor="middle" fill="#5B2A86" font-weight="700" font-family="Consolas, 'Courier New', monospace">2,0945681</text><text x="450" y="282" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">0,00002</text><line x1="30" y1="300" x2="550" y2="300" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="330" font-size="16" fill="#2B1B3D" text-anchor="middle">3</text><text x="270" y="330" font-size="17" text-anchor="middle" fill="#5B2A86" font-weight="700" font-family="Consolas, 'Courier New', monospace">2,0945514817</text><text x="450" y="330" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">0,0000000002</text><line x1="30" y1="348" x2="550" y2="348" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="378" font-size="16" fill="#2B1B3D" text-anchor="middle">4</text><text x="270" y="378" font-size="17" text-anchor="middle" fill="#5B2A86" font-weight="700" font-family="Consolas, 'Courier New', monospace">2,09455148154</text><text x="450" y="378" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">≈ 0 (12+ cifras)</text><line x1="30" y1="396" x2="550" y2="396" stroke="#F1E2CF" stroke-width="1.5"/><rect x="30" y="430" width="520" height="70" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="290" y="460" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">Convergencia cuadrática:</text><text x="290" y="484" font-size="14" fill="#2B1B3D" text-anchor="middle">cada error es más o menos el cuadrado del anterior</text><rect x="580" y="100" width="390" height="400" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="775" y="132" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Sorpresa: √2 con Newton</text><text x="775" y="176" font-size="17" fill="#2B1B3D" text-anchor="middle">f(x) = x² − 2</text><text x="775" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">f’(x) = 2x</text><text x="775" y="252" font-size="17" fill="#2B1B3D" text-anchor="middle">x nuevo = x − (x² − 2) ÷ 2x</text><text x="775" y="290" font-size="17" fill="#2B1B3D" text-anchor="middle">= x − x/2 + 1/x</text><text x="775" y="328" font-size="17" fill="#2B1B3D" text-anchor="middle">= (x + 2 ÷ x) ÷ 2</text><rect x="600" y="380" width="350" height="100" rx="10" fill="#FFF1C9"/><text x="775" y="414" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">¡Es el método babilónico!</text><text x="775" y="444" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">La misma idea, 3.600 años después.</text>
</svg>
