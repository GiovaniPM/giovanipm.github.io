<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cuánto rinde cada construcción en Cidade Baixa</title>
<desc id="d">Alquiler sin construcción 14, con una casa 70, dos 200, tres 550, cuatro 750 y hotel 950.</desc>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="26" fill="#2B1B3D" font-weight="700" text-anchor="middle">Cuánto rinde cada construcción en Cidade Baixa</text>
<path d="M90 380H960" stroke="#E2D3BC"/><text x="80" y="385" font-size="13" fill="#5E5170" text-anchor="end">0</text><path d="M90 309H960" stroke="#E2D3BC"/><text x="80" y="314" font-size="13" fill="#5E5170" text-anchor="end">250</text><path d="M90 238H960" stroke="#E2D3BC"/><text x="80" y="243" font-size="13" fill="#5E5170" text-anchor="end">500</text><path d="M90 167H960" stroke="#E2D3BC"/><text x="80" y="172" font-size="13" fill="#5E5170" text-anchor="end">750</text><path d="M90 96H960" stroke="#E2D3BC"/><text x="80" y="101" font-size="13" fill="#5E5170" text-anchor="end">1000</text><rect x="114" y="376.024" width="112" height="3.976" rx="4" fill="#3A6FD8"/><text x="170" y="368.024" font-size="15" fill="#2B1B3D" font-weight="700" text-anchor="middle">P$ 14</text><text x="170" y="404" font-size="14" fill="#2B1B3D" text-anchor="middle">Sin casa</text><rect x="260" y="360.12" width="112" height="19.880000000000003" rx="4" fill="#3A6FD8"/><text x="316" y="352.12" font-size="15" fill="#2B1B3D" font-weight="700" text-anchor="middle">P$ 70</text><text x="316" y="404" font-size="14" fill="#2B1B3D" text-anchor="middle">1 casa</text><rect x="406" y="323.2" width="112" height="56.800000000000004" rx="4" fill="#3A6FD8"/><text x="462" y="315.2" font-size="15" fill="#2B1B3D" font-weight="700" text-anchor="middle">P$ 200</text><text x="462" y="404" font-size="14" fill="#2B1B3D" text-anchor="middle">2 casas</text><rect x="552" y="223.79999999999998" width="112" height="156.20000000000002" rx="4" fill="#C2471F"/><text x="608" y="215.79999999999998" font-size="15" fill="#2B1B3D" font-weight="700" text-anchor="middle">P$ 550</text><text x="608" y="404" font-size="14" fill="#2B1B3D" text-anchor="middle">3 casas</text><rect x="698" y="167" width="112" height="213" rx="4" fill="#3A6FD8"/><text x="754" y="159" font-size="15" fill="#2B1B3D" font-weight="700" text-anchor="middle">P$ 750</text><text x="754" y="404" font-size="14" fill="#2B1B3D" text-anchor="middle">4 casas</text><rect x="844" y="110.19999999999999" width="112" height="269.8" rx="4" fill="#3A6FD8"/><text x="900" y="102.19999999999999" font-size="15" fill="#2B1B3D" font-weight="700" text-anchor="middle">P$ 950</text><text x="900" y="404" font-size="14" fill="#2B1B3D" text-anchor="middle">Hotel</text><text x="500" y="438" font-size="14" fill="#5E5170" text-anchor="middle">Cada construcción cuesta P$ 100. La tercera casa suma P$ 350 al alquiler; la cuarta y el hotel, P$ 200 cada</text><text x="500" y="457" font-size="14" fill="#5E5170" text-anchor="middle">uno.</text>
