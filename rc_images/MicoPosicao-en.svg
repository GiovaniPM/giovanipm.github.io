<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d">
<title id="t">Chance of losing by position</title>
<desc id="d">Bar chart of each position’s chance of losing, with 4 players. With 15 couples (31 cards, split 8, 8, 8 and 7): first to play 25.8%, second 32.6%, third 30.0%, dealer 11.6%. With 20 couples (41 cards, split 11, 10, 10 and 10): 25.6%, 25.1%, 24.7% and 24.6%, close to the 25% of a fair round. Result of 100,000 simulated rounds per deck, with random picks.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="430" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
