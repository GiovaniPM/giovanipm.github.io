<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cuando el redondeo sale caro</title>
<desc id="d">Tres fichas. Bolsa de Vancouver, 1982–1983: el índice empezó en 1.000 y se truncaba en cada actualización; en 22 meses bajó a 524,811, cuando el valor correcto era 1.098,892. Misil Patriot, 1991: el reloj contaba décimas de segundo, pero 0,1 no se representa exactamente en binario; después de 100 horas de funcionamiento el error llegó a 0,34 segundos, y el sistema buscó el misil enemigo a más de 600 metros del punto correcto; murieron 28 soldados. Cohete Ariane 5, 1996: un número demasiado grande se convirtió a un formato de 16 bits, se desbordó, y el cohete se autodestruyó 37 segundos después del lanzamiento.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cuando el redondeo sale caro</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Pequeños errores, repetidos millones de veces</text><rect x="40" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="40" y="100" width="290" height="70" rx="12" fill="#FFF1C9"/><text x="185" y="132" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">Bolsa de Vancouver</text><text x="185" y="156" font-size="14" fill="#B35300" text-anchor="middle">1982–1983</text><text x="185" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">índice parte de 1.000</text><text x="185" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">truncado en la 3.ª cifra</text><text x="185" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">en cada actualización</text><text x="185" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="185" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">22 meses después:</text><text x="185" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">524,811 ✗</text><text x="185" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">correcto: 1.098,892</text><rect x="355" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="355" y="100" width="290" height="70" rx="12" fill="#FF6B6B"/><text x="500" y="132" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Misil Patriot</text><text x="500" y="156" font-size="14" fill="#FFFFFF" text-anchor="middle">1991</text><text x="500" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">reloj en décimas</text><text x="500" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">0,1 no es exacto</text><text x="500" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">en binario</text><text x="500" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="500" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">100 h encendido:</text><text x="500" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">error de 0,34 s</text><text x="500" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">blanco a &gt; 600 m</text><rect x="670" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="670" y="100" width="290" height="70" rx="12" fill="#5B2A86"/><text x="815" y="132" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Ariane 5</text><text x="815" y="156" font-size="14" fill="#FFFFFF" text-anchor="middle">1996</text><text x="815" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">número grande</text><text x="815" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">convertido a</text><text x="815" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">16 bit</text><text x="815" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="815" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">desbordamiento</text><text x="815" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">autodestrucción</text><text x="815" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">37 s tras el lanzamiento</text>
</svg>
