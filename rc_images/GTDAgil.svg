<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">GTD e ágil: a equipe e você</title>
<desc id="d">Diagrama em duas camadas. Em cima, o quadro da equipe, em Scrum ou Kanban, com as colunas backlog, a fazer, fazendo e feito. Embaixo, o seu sistema GTD, com caixa de entrada, próximas ações, aguardando e revisão semanal. Um item da coluna a fazer atribuído a você desce para a sua caixa de entrada; das próximas ações, você puxa trabalho para a coluna fazendo quando tem capacidade; um cartão bloqueado em fazendo vira um item da lista aguardando; e, na revisão semanal, você atualiza o quadro.</desc>
