<circle cx="400.0" cy="520.0" r="15" fill="#5B2A86"/>
<text x="400.0" y="525.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="424.0" y="516.0" font-size="14" fill="#2B1B3D" font-weight="700">Automate</text>
<text x="424.0" y="536.0" font-size="12" fill="#756986">thin layer wired to the system</text>
<rect x="115.1923788646684" y="391.0" width="250" height="68" rx="12" fill="#FFFFFF" stroke="#EF476F" stroke-width="2.5"/>
<circle cx="140.2" cy="425.0" r="15" fill="#EF476F"/>
<text x="140.2" y="430.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="164.2" y="421.0" font-size="14" fill="#2B1B3D" font-weight="700">Validate often</text>
<text x="164.2" y="441.0" font-size="12" fill="#756986">at every change, in the pipeline</text>
<rect x="115.1923788646684" y="201.0" width="250" height="68" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<circle cx="140.2" cy="235.0" r="15" fill="#FF6B6B"/>
<text x="140.2" y="240.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">6</text>
<text x="164.2" y="231.0" font-size="14" fill="#2B1B3D" font-weight="700">Living documentation</text>
<text x="164.2" y="251.0" font-size="12" fill="#756986">the specification that runs</text>
