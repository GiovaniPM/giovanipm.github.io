<line x1="759.8" y1="303.4" x2="759.8" y2="356.6" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
<line x1="681.9" y1="453.5" x2="577.9" y2="491.5" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
<line x1="422.1" y1="491.5" x2="318.1" y2="453.5" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
