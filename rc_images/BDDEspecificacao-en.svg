<ellipse cx="500" cy="330" rx="140" ry="62" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="500.0" y="326.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Specification</text>
<text x="500.0" y="350.0" font-size="13" fill="#FCE4F0" text-anchor="middle">by Example</text>
<rect x="375.0" y="106.0" width="250" height="68" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<circle cx="400.0" cy="140.0" r="15" fill="#FFB703"/>
<text x="400.0" y="145.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">1</text>
<text x="424.0" y="136.0" font-size="14" fill="#2B1B3D" font-weight="700">Specify together</text>
<text x="424.0" y="156.0" font-size="12" fill="#756986">Three Amigos, shared language</text>
<rect x="634.8076211353316" y="201.0" width="250" height="68" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<circle cx="659.8" cy="235.0" r="15" fill="#3A86FF"/>
<text x="659.8" y="240.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">2</text>
<text x="683.8" y="231.0" font-size="14" fill="#2B1B3D" font-weight="700">Illustrate with examples</text>
<text x="683.8" y="251.0" font-size="12" fill="#756986">concrete Given/When/Then</text>
<rect x="634.8076211353316" y="391.0" width="250" height="68" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
