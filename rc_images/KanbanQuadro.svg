<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Onde cada métrica de tempo começa e termina</title>
<desc id="d">Quadro Kanban com dez colunas: requisições, backlog, análise e a fazer, no upstream; implementação, esperando, teste, homologação e deploy, em andamento, com limite de WIP de 6; e concluído. Acima, réguas mostram o planejamento, do início até a coluna a fazer; o lead time, do ponto de compromisso ao ponto de entrega; o cycle time, do início da implementação até a entrega; o time to market, de ponta a ponta; e o tempo bloqueado, na coluna esperando, onde há um cartão bloqueado.</desc>
