<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 362" width="1000" height="362" role="img" aria-labelledby="t d">
<title id="t">One campaign season</title>
<desc id="d">Each season has five steps: 1, Fortune: one die decides rain, cattle, guides or new supporters; 2, Command: each column rolls a die, Bento Gonçalves gets 3 plus half the die and other leaders 1 plus half; 3, Orders: march, besiege, attack, entrench, forage, gather rafts or build boats; 4, Imperials: the imperial forces move and attack; 5, Supplies: on friendly ground a column resupplies, elsewhere it loses 1. The campaign year has spring, summer and autumn, and ends in winter, spent on the ranches, when squadrons recover and Support is spent on reinforcements.</desc>
<rect width="1000" height="362" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="22" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="110" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">1. Fortune</text><text x="110" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">one die: rain, cattle,</text><text x="110" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">guides or supporters</text><line x1="200" y1="86" x2="214" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="216" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="304" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">2. Command</text><text x="304" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">one die per column:</text><text x="304" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Bento 3 + ½ die</text><line x1="394" y1="86" x2="408" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="410" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="498" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">3. Orders</text><text x="498" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">march, besiege, attack,</text><text x="498" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">entrench, rafts</text><line x1="588" y1="86" x2="602" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="604" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.5"/><text x="692" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#C2185B">4. Imperials</text><text x="692" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">move and attack</text><text x="692" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">whoever looks weak</text><line x1="782" y1="86" x2="796" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="798" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2.5"/><text x="886" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#0E8074">5. Supplies</text><text x="886" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">friendly ground resupplies;</text><text x="886" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">elsewhere −1</text>
<text x="500" y="186" font-size="17" font-weight="bold" text-anchor="middle">The campaign year</text>
<rect x="70" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="155" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Spring</text><text x="155" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Sep–Nov</text><line x1="242" y1="236" x2="286" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="290" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="375" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Summer</text><text x="375" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Dec–Feb</text><line x1="462" y1="236" x2="506" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="510" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="595" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Autumn</text><text x="595" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Mar–May</text><line x1="682" y1="236" x2="726" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="730" y="204" width="170" height="64" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="815" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Winter</text><text x="815" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Jun–Aug</text>
<path d="M 815 268 C 815 314, 155 314, 155 273" fill="none" stroke="#756986" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="500" y="340.0" font-size="14.5" fill="#756986" text-anchor="middle">In winter quarters, columns recover squadrons, receive reinforcements and may face revolts</text></g>
</svg>
