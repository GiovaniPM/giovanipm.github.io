<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Aerobraking: using the air as a brake</title>
<desc id="d">A planet with a thick atmosphere. Several dashed ellipses, each smaller than the last, have their periapsis inside the atmosphere: on each pass the air slows the object and the apoapsis drops. Finally, a speed-up burn at apoapsis lifts the periapsis out of the atmosphere and leaves the orbit in the target band. On the right, bars show the heat shield wearing down on each pass, from 100% to 70% and 45%.</desc>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Aerobraking: using the air as a brake</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Only for objects with a heat shield</text>
<path d="M206.0 280.0 a134 134 0 1 0 268 0 a134 134 0 1 0 -268 0 M220.0 280.0 a120 120 0 1 1 240 0 a120 120 0 1 1 -240 0 z" fill="#0E8074" fill-opacity="0.2" fill-rule="evenodd"/>
<circle cx="340.0" cy="280.0" r="127.0" fill="none" stroke="#0E8074" stroke-width="1.2" stroke-dasharray="4 5"/>
<path d="M250.0 280.0 a90 90 0 1 0 180 0 a90 90 0 1 0 -180 0 M274.0 280.0 a66 66 0 1 1 132 0 a66 66 0 1 1 -132 0 z" fill="#FF6B6B" fill-opacity="0.28" fill-rule="evenodd"/>
<defs><radialGradient id="pl" cx="35%" cy="35%" r="75%"><stop offset="0" stop-color="#F3DDA6"/><stop offset="1" stop-color="#B98E45"/></radialGradient></defs>
<circle cx="340.0" cy="280.0" r="66.0" fill="url(#pl)"/>
<ellipse cx="230.0" cy="280.0" rx="190.0" ry="154.9" transform="rotate(0 230.0 280.0)" fill="none" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.45"/>
<ellipse cx="265.0" cy="280.0" rx="155.0" ry="135.6" transform="rotate(0 265.0 280.0)" fill="none" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.65"/>
<ellipse cx="295.0" cy="280.0" rx="125.0" ry="116.6" transform="rotate(0 295.0 280.0)" fill="none" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.85"/>
<circle cx="340.0" cy="280.0" r="127.0" fill="none" stroke="#B35300" stroke-width="2.5"/>
<circle cx="420.0" cy="280.0" r="5.0" fill="#D62828"/>
<line x1="426.0" y1="270.0" x2="470.0" y2="150.0" stroke="#756986" stroke-width="1.2"/>
<text x="474.0" y="146.0" font-size="13.5" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">each pass through the air</text>
<text x="474.0" y="164.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">lowers the apoapsis</text>
<circle cx="170.0" cy="280.0" r="5.0" fill="#B35300"/>
<line x1="160.0" y1="274.0" x2="160.0" y2="320.0" stroke="#B35300" stroke-width="3.5" marker-end="url(#mg)"/>
<line x1="158.0" y1="326.0" x2="120.0" y2="446.0" stroke="#756986" stroke-width="1.2"/>
<text x="40.0" y="462.0" font-size="13.5" fill="#B35300" text-anchor="start" font-weight="700" xml:space="preserve">speed up at apoapsis to</text>
<text x="40.0" y="480.0" font-size="13.5" fill="#B35300" text-anchor="start" font-weight="700" xml:space="preserve">lift the periapsis out of the air</text>
<line x1="640.0" y1="100.0" x2="640.0" y2="450.0" stroke="#F1E2CF" stroke-width="2"/>
<text x="800.0" y="124.0" font-size="18" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Heat shield</text>
<text x="670.0" y="158.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Arrival</text>
<text x="930.0" y="158.0" font-size="13.5" fill="#2B1B3D" text-anchor="end" font-weight="700" xml:space="preserve">100%</text>
<rect x="670.0" y="167.0" width="260.0" height="10.0" rx="5" fill="#F1E2CF"/>
<rect x="670.0" y="167.0" width="260.0" height="10.0" rx="5" fill="#D62828"/>
<text x="670.0" y="212.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">1st pass</text>
<text x="930.0" y="212.0" font-size="13.5" fill="#2B1B3D" text-anchor="end" font-weight="700" xml:space="preserve">70%</text>
<rect x="670.0" y="221.0" width="260.0" height="10.0" rx="5" fill="#F1E2CF"/>
<rect x="670.0" y="221.0" width="182.0" height="10.0" rx="5" fill="#D62828"/>
<text x="670.0" y="266.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">2nd pass</text>
<text x="930.0" y="266.0" font-size="13.5" fill="#2B1B3D" text-anchor="end" font-weight="700" xml:space="preserve">45%</text>
<rect x="670.0" y="275.0" width="260.0" height="10.0" rx="5" fill="#F1E2CF"/>
<rect x="670.0" y="275.0" width="117.0" height="10.0" rx="5" fill="#D62828"/>
<text x="670.0" y="340.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">• Deeper brakes more and heats more.</text>
<text x="670.0" y="366.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">• Shield at 0% ends the mission.</text>
<text x="670.0" y="392.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">• Without a shield, touching the air ends it.</text>
</svg>
