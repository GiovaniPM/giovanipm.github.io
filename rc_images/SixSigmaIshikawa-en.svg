<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ishikawa (fishbone) diagram</title>
<desc id="d">Fishbone with the effect late delivery at the head. Six bones with the 6M categories and two causes each: method (unoptimized route, orders bundled), manpower (new couriers, short-staffed at peak), material (flimsy packaging, missing ingredient), machine (broken motorbike, app freezing), measurement (prep time unmeasured, poor demand forecast) and mother nature (rain, rush-hour traffic).</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ishikawa (fishbone) diagram</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">The possible causes of an effect, organized by the 6M categories</text>
<line x1="50" y1="300" x2="790" y2="300" stroke="#2B1B3D" stroke-width="5" marker-end="url(#ar)"/>
<path d="M790 242 L960 242 Q985 300 960 358 L790 358 Z" fill="#D62828" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="878.0" y="294.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Late</text>
<text x="878.0" y="316.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">delivery</text>
<line x1="240" y1="300" x2="110" y2="130" stroke="#2B1B3D" stroke-width="3"/>
<rect x="40.0" y="96.0" width="140.0" height="28.0" rx="8" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/>
<text x="110.0" y="115.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Method</text>
<line x1="227.5" y1="223.5" x2="185.5" y2="223.5" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="231.5" y="227.5" font-size="11.5" fill="#3E3350">unoptimized route</text>
<line x1="184.6" y1="167.4" x2="142.6" y2="167.4" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="188.6" y="171.4" font-size="11.5" fill="#3E3350">orders bundled</text>
<line x1="470" y1="300" x2="340" y2="130" stroke="#2B1B3D" stroke-width="3"/>
<rect x="270.0" y="96.0" width="140.0" height="28.0" rx="8" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<text x="340.0" y="115.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Manpower</text>
<line x1="457.5" y1="223.5" x2="415.5" y2="223.5" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="461.5" y="227.5" font-size="11.5" fill="#3E3350">new couriers</text>
<line x1="414.6" y1="167.4" x2="372.6" y2="167.4" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="418.6" y="171.4" font-size="11.5" fill="#3E3350">short-staffed at peak</text>
<line x1="700" y1="300" x2="570" y2="130" stroke="#2B1B3D" stroke-width="3"/>
<rect x="500.0" y="96.0" width="140.0" height="28.0" rx="8" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/>
<text x="570.0" y="115.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Material</text>
<line x1="687.5" y1="223.5" x2="645.5" y2="223.5" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="691.5" y="227.5" font-size="11.5" fill="#3E3350">flimsy packaging</text>
<line x1="644.6" y1="167.4" x2="602.6" y2="167.4" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="648.6" y="171.4" font-size="11.5" fill="#3E3350">missing ingredient</text>
<line x1="240" y1="300" x2="110" y2="470" stroke="#2B1B3D" stroke-width="3"/>
<rect x="40.0" y="476.0" width="140.0" height="28.0" rx="8" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/>
<text x="110.0" y="495.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Machine</text>
<line x1="227.5" y1="376.5" x2="185.5" y2="376.5" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="231.5" y="380.5" font-size="11.5" fill="#3E3350">broken motorbike</text>
<line x1="184.6" y1="432.6" x2="142.6" y2="432.6" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="188.6" y="436.6" font-size="11.5" fill="#3E3350">app freezing</text>
<line x1="470" y1="300" x2="340" y2="470" stroke="#2B1B3D" stroke-width="3"/>
<rect x="270.0" y="476.0" width="140.0" height="28.0" rx="8" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<text x="340.0" y="495.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Measurement</text>
<line x1="457.5" y1="376.5" x2="415.5" y2="376.5" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="461.5" y="380.5" font-size="11.5" fill="#3E3350">prep time unmeasured</text>
<line x1="414.6" y1="432.6" x2="372.6" y2="432.6" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="418.6" y="436.6" font-size="11.5" fill="#3E3350">poor demand forecast</text>
<line x1="700" y1="300" x2="570" y2="470" stroke="#2B1B3D" stroke-width="3"/>
<rect x="500.0" y="476.0" width="140.0" height="28.0" rx="8" fill="#EF476F" stroke="#2B1B3D" stroke-width="2"/>
<text x="570.0" y="495.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Mother nature</text>
<line x1="687.5" y1="376.5" x2="645.5" y2="376.5" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="691.5" y="380.5" font-size="11.5" fill="#3E3350">rain</text>
<line x1="644.6" y1="432.6" x2="602.6" y2="432.6" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="648.6" y="436.6" font-size="11.5" fill="#3E3350">rush-hour traffic</text>
<text x="500.0" y="540.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">After listing, the team votes on the most likely causes and validates them with data (Pareto, scatter).</text>
</svg>
