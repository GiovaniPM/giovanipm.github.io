<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Do plano ao valor: escopo, prazo, custo e qualidade</title>
<desc id="d">Gráfico de quatro quadrantes que resume o artigo, com o valor no centro. Escopo: ontem, fixado no início e protegido por um comitê de mudanças; amanhã, uma hipótese ajustada pelos resultados medidos a cada ciclo, com OKRs e #NoProjects. Prazo: ontem, data de término, cronograma detalhado e entrega em um grande lote; amanhã, fluxo contínuo de entregas pequenas com previsões a partir dos dados, com Flow Framework e IA. Custo: ontem, orçamento anual por projeto aprovado uma vez; amanhã, financiamento contínuo por fluxo de valor revisto a cada trimestre, com Beyond Budgeting e Lean Portfolio Management. Qualidade: ontem, verificada no fim e herdada por uma equipe de sustentação; amanhã, embutida no fluxo, com equipes estáveis donas do produto e débitos à vista, com Team Topologies e Flow Framework.</desc>
