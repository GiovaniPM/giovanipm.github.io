<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Arquitectura del Orchestrator y del AIS Server</title>
<desc id="d">Apps web y móviles, iPaaS y dispositivos IoT llaman, vía HTTPS, a un API gateway recomendado que reenvía al AIS Server sobre WebLogic. Dentro, la orquestación ejecuta pasos en secuencia: regla, form request, data request, business function, script Groovy, conector y mensaje. Los form requests pasan por el HTML Server, que habla con el Enterprise Server mediante JDENET, que accede a la base de datos. Los conectores llaman a servicios externos REST, SOAP o bases de datos. Recuadro de seguridad: usuario de servicio con privilegios mínimos, token AIS u OAuth, HTTPS y orquestaciones gestionadas como UDO aprobados y promovidos.</desc>
