<text x="396" y="136" font-size="12" font-weight="700" fill="#756986" text-anchor="start">1</text>
<circle cx="500" cy="157" r="20.2" fill="none" stroke="#0E8074" stroke-width="6.7"/>
<text x="470" y="136" font-size="12" font-weight="700" fill="#756986" text-anchor="start">2</text>
<path d="M480.76 211.76 L519.24 250.24 M519.24 211.76 L480.76 250.24" stroke="#5B2A86" stroke-width="6.7" stroke-linecap="round"/>
<text x="470" y="210" font-size="12" font-weight="700" fill="#756986" text-anchor="start">3</text>
<circle cx="574" cy="305" r="20.2" fill="none" stroke="#0E8074" stroke-width="6.7"/>
<text x="544" y="284" font-size="12" font-weight="700" fill="#756986" text-anchor="start">4</text>
<path d="M635 231 h46 m-11 -10 l11 10 l-11 10" fill="none" stroke="#756986" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="500" y="380" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">X joga no centro e ameaça</text>
<text x="500" y="400" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">a diagonal; O tem de bloquear.</text>
<text x="820" y="100" font-size="17" font-weight="700" fill="#C2185B" text-anchor="middle">3. Garfo: duas ameaças</text>
<rect x="709" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="783" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="857" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="709" y="194" width="74" height="74" fill="#FFFFFF"/>
<rect x="783" y="194" width="74" height="74" fill="#FFFFFF"/>
<rect x="857" y="194" width="74" height="74" fill="#FFFFFF"/>
<rect x="709" y="268" width="74" height="74" fill="#FFFFFF"/>
<rect x="783" y="268" width="74" height="74" fill="#FFFFFF"/>
<rect x="857" y="268" width="74" height="74" fill="#FFFFFF"/>
<path d="M783 120 V342 M709 194 H931" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<path d="M857 120 V342 M709 268 H931" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<rect x="709" y="120" width="222" height="222" fill="none" stroke="#2B1B3D" stroke-width="2" rx="4"/>
