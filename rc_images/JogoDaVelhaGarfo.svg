<path d="M217 120 V342 M69 268 H291" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<rect x="69" y="120" width="222" height="222" fill="none" stroke="#2B1B3D" stroke-width="2" rx="4"/>
<path d="M86.76 137.76 L125.24 176.24 M125.24 137.76 L86.76 176.24" stroke="#5B2A86" stroke-width="6.7" stroke-linecap="round"/>
<text x="76" y="136" font-size="12" font-weight="700" fill="#756986" text-anchor="start">1</text>
<circle cx="180" cy="157" r="20.2" fill="none" stroke="#0E8074" stroke-width="6.7"/>
<text x="150" y="136" font-size="12" font-weight="700" fill="#756986" text-anchor="start">2</text>
<path d="M315 231 h46 m-11 -10 l11 10 l-11 10" fill="none" stroke="#756986" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="380" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">X abre no canto; O responde</text>
<text x="180" y="400" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">ao lado, e não no centro.</text>
<text x="500" y="100" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">2. Ameaça e bloqueio</text>
<rect x="389" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="463" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="537" y="120" width="74" height="74" fill="#FFFFFF"/>
