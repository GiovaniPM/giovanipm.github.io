<path d="M783 120 V342 M709 194 H931" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<path d="M857 120 V342 M709 268 H931" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<rect x="709" y="120" width="222" height="222" fill="none" stroke="#2B1B3D" stroke-width="2" rx="4"/>
<path d="M726.76 137.76 L765.24 176.24 M765.24 137.76 L726.76 176.24" stroke="#5B2A86" stroke-width="6.7" stroke-linecap="round"/>
<text x="716" y="136" font-size="12" font-weight="700" fill="#756986" text-anchor="start">1</text>
<circle cx="820" cy="157" r="20.2" fill="none" stroke="#0E8074" stroke-width="6.7"/>
<text x="790" y="136" font-size="12" font-weight="700" fill="#756986" text-anchor="start">2</text>
<circle cx="894" cy="157" r="25.2" fill="#FDE4EA" stroke="#C2185B" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="746" cy="231" r="25.2" fill="#FDE4EA" stroke="#C2185B" stroke-width="3" stroke-dasharray="6 4"/>
<path d="M800.76 211.76 L839.24 250.24 M839.24 211.76 L800.76 250.24" stroke="#5B2A86" stroke-width="6.7" stroke-linecap="round"/>
<text x="790" y="210" font-size="12" font-weight="700" fill="#756986" text-anchor="start">3</text>
<path d="M726.76 285.76 L765.24 324.24 M765.24 285.76 L726.76 324.24" stroke="#5B2A86" stroke-width="6.7" stroke-linecap="round"/>
<text x="716" y="284" font-size="12" font-weight="700" fill="#756986" text-anchor="start">5</text>
<circle cx="894" cy="305" r="20.2" fill="none" stroke="#0E8074" stroke-width="6.7"/>
<text x="864" y="284" font-size="12" font-weight="700" fill="#756986" text-anchor="start">4</text>
<text x="820" y="380" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">X abre duas linhas de uma vez;</text>
<text x="820" y="400" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">O só consegue bloquear uma.</text>
<text x="500" y="448" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Os números pequenos indicam a ordem das jogadas. Os círculos tracejados marcam as ameaças.</text>
