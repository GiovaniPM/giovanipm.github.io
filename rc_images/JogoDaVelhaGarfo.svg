<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Anatomia de um garfo</title>
<desc id="d">Sequência em três tabuleiros. Primeiro: X abre no canto superior esquerdo e O responde na lateral de cima, um erro. Segundo: X joga no centro ameaçando a diagonal, e O é obrigado a bloquear no canto inferior direito. Terceiro: X joga no canto inferior esquerdo e cria duas ameaças ao mesmo tempo, na coluna da esquerda e na outra diagonal. O só consegue bloquear uma, e X vence na jogada seguinte.</desc>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Anatomia de um garfo</text>
<text x="180" y="100" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">1. O erra na lateral</text>
<rect x="69" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="143" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="217" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="69" y="194" width="74" height="74" fill="#FFFFFF"/>
<rect x="143" y="194" width="74" height="74" fill="#FFFFFF"/>
<rect x="217" y="194" width="74" height="74" fill="#FFFFFF"/>
<rect x="69" y="268" width="74" height="74" fill="#FFFFFF"/>
<rect x="143" y="268" width="74" height="74" fill="#FFFFFF"/>
<rect x="217" y="268" width="74" height="74" fill="#FFFFFF"/>
