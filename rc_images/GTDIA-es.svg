<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">La IA en cada paso del GTD</title>
<desc id="d">Cinco columnas, una por paso del GTD, que muestran cómo ayuda la inteligencia artificial: capturar, transcribiendo voz y reuniones y resumiendo correos y chats; aclarar, sugiriendo si un elemento requiere acción y redactando el resultado y la próxima acción; organizar, proponiendo listas, contextos y fechas y señalando duplicados; reflexionar, preparando la revisión semanal y mostrando proyectos parados; implicarse, sugiriendo la acción por contexto y energía, con agentes que hacen tareas sencillas. Abajo, la regla: la IA sugiere y tú decides qué se convierte en compromiso.</desc>
<rect width="1000" height="466" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">La IA en cada paso del GTD</text>
<rect x="34" y="84" width="176" height="56" rx="12" fill="#5B2A86"/>
<text x="122.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Capturar</text>
<rect x="34" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="54" cy="186" r="5" fill="#5B2A86"/><text x="66.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">transcribe voz</text><text x="66.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">y reuniones</text>
<circle cx="54" cy="256" r="5" fill="#5B2A86"/><text x="66.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">resume correos</text><text x="66.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">y chats</text>
<rect x="222" y="84" width="176" height="56" rx="12" fill="#2F6FE0"/>
<text x="310.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Aclarar</text>
<rect x="222" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/>
<circle cx="242" cy="186" r="5" fill="#2F6FE0"/><text x="254.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">sugiere si</text><text x="254.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">requiere acción</text>
<circle cx="242" cy="256" r="5" fill="#2F6FE0"/><text x="254.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">redacta resultado</text><text x="254.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">y próxima acción</text>
<rect x="410" y="84" width="176" height="56" rx="12" fill="#0E8074"/>
<text x="498.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Organizar</text>
<rect x="410" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<circle cx="430" cy="186" r="5" fill="#0E8074"/><text x="442.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">propone listas,</text><text x="442.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">contextos y fechas</text>
<circle cx="430" cy="256" r="5" fill="#0E8074"/><text x="442.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">señala elementos</text><text x="442.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">duplicados</text>
<rect x="598" y="84" width="176" height="56" rx="12" fill="#B35300"/>
<text x="686.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reflexionar</text>
<rect x="598" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<circle cx="618" cy="186" r="5" fill="#B35300"/><text x="630.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">prepara la</text><text x="630.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">revisión semanal</text>
<circle cx="618" cy="256" r="5" fill="#B35300"/><text x="630.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">muestra proyectos</text><text x="630.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">parados</text>
<rect x="786" y="84" width="176" height="56" rx="12" fill="#C2185B"/>
<text x="874.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Implicarse</text>
<rect x="786" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<circle cx="806" cy="186" r="5" fill="#C2185B"/><text x="818.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">sugiere la acción por</text><text x="818.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">contexto y energía</text>
<circle cx="806" cy="256" r="5" fill="#C2185B"/><text x="818.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">los agentes hacen</text><text x="818.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">tareas sencillas</text>
<rect x="34" y="340" width="928" height="64" rx="14" fill="#2B1B3D"/>
<text x="498.0" y="380.0" font-size="19" font-weight="700" fill="#FFC94D" text-anchor="middle">La IA sugiere. Tú decides qué se convierte en compromiso.</text>
<text x="500.0" y="446.0" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Antes de pegar datos en un asistente, revisa la política de privacidad de tu empresa.</text>
</svg>
