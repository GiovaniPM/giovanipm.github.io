<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cada sigma a mais corta os defeitos drasticamente</title>
<desc id="d">Barras horizontais em escala logarítmica com os defeitos por milhão de oportunidades de cada nível sigma: 1σ, 691.462 e rendimento de 30,9%; 2σ, 308.538 e 69,1%; 3σ, 66.807 e 93,3%; 4σ, 6.210 e 99,4%; 5σ, 233 e 99,977%; 6σ, 3,4 e 99,9997%.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cada sigma a mais corta os defeitos drasticamente</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Defeitos por milhão de oportunidades (DPMO) em cada nível sigma, com o deslocamento de 1,5σ</text>
<text x="60.0" y="112.0" font-size="13" fill="#756986" font-weight="700">nível</text>
<text x="180.0" y="112.0" font-size="13" fill="#756986" text-anchor="middle" font-weight="700">rendimento</text>
<text x="290.0" y="112.0" font-size="13" fill="#756986" font-weight="700">DPMO (escala logarítmica)</text>
<text x="60.0" y="154.0" font-size="20" fill="#2B1B3D" font-weight="700">1σ</text>
<text x="180.0" y="153.0" font-size="14" fill="#3E3350" text-anchor="middle">30,9%</text>
<rect x="290.0" y="134.0" width="574.5" height="30.0" rx="6" fill="#D62828" stroke="#2B1B3D" stroke-width="2"/>
<text x="874.5" y="155.0" font-size="15" fill="#2B1B3D" font-weight="700">691.462</text>
<text x="60.0" y="206.0" font-size="20" fill="#2B1B3D" font-weight="700">2σ</text>
<text x="180.0" y="205.0" font-size="14" fill="#3E3350" text-anchor="middle">69,1%</text>
<rect x="290.0" y="186.0" width="545.1" height="30.0" rx="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/>
<text x="845.1" y="207.0" font-size="15" fill="#2B1B3D" font-weight="700">308.538</text>
<text x="60.0" y="258.0" font-size="20" fill="#2B1B3D" font-weight="700">3σ</text>
<text x="180.0" y="257.0" font-size="14" fill="#3E3350" text-anchor="middle">93,3%</text>
<rect x="290.0" y="238.0" width="489.3" height="30.0" rx="6" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/>
<text x="789.3" y="259.0" font-size="15" fill="#2B1B3D" font-weight="700">66.807</text>
<text x="60.0" y="310.0" font-size="20" fill="#2B1B3D" font-weight="700">4σ</text>
<text x="180.0" y="309.0" font-size="14" fill="#3E3350" text-anchor="middle">99,4%</text>
<rect x="290.0" y="290.0" width="402.6" height="30.0" rx="6" fill="#8BC34A" stroke="#2B1B3D" stroke-width="2"/>
<text x="702.6" y="311.0" font-size="15" fill="#2B1B3D" font-weight="700">6.210</text>
<text x="60.0" y="362.0" font-size="20" fill="#2B1B3D" font-weight="700">5σ</text>
<text x="180.0" y="361.0" font-size="14" fill="#3E3350" text-anchor="middle">99,977%</text>
<rect x="290.0" y="342.0" width="282.8" height="30.0" rx="6" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<text x="582.8" y="363.0" font-size="15" fill="#2B1B3D" font-weight="700">233</text>
<text x="60.0" y="414.0" font-size="20" fill="#2B1B3D" font-weight="700">6σ</text>
<text x="180.0" y="413.0" font-size="14" fill="#3E3350" text-anchor="middle">99,9997%</text>
<rect x="290.0" y="394.0" width="128.6" height="30.0" rx="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<text x="428.6" y="415.0" font-size="15" fill="#2B1B3D" font-weight="700">3,4</text>
<text x="500.0" y="460.0" font-size="13" fill="#756986" text-anchor="middle">De 3σ para 6σ, os defeitos caem de 66.807 para 3,4 por milhão: quase 20 mil vezes menos.</text>
<text x="500.0" y="478.0" font-size="13" fill="#756986" text-anchor="middle">Valores calculados pela distribuição normal, com a média deslocada 1,5σ.</text>
</svg>
