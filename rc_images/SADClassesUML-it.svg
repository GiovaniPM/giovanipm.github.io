<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Diagramma delle classi UML</title>
<desc id="d">Diagramma delle classi. Persona, con nome, email e il metodo contattare, è la superclasse di Studente, con matricola e iscrivere, e di Docente, con codice e insegnare, collegate da una freccia di generalizzazione. Studente è associato a Corso da si iscrive, molti a molti. Docente insegna Corso, uno a molti. Corso ha codice, titolo e il metodo aprireClasse.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Diagramma delle classi UML</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Classi con attributi e metodi, ereditarietà (generalizzazione) e associazioni con molteplicità</text>
<path d="M215 262 V236 H785 V262" stroke="#2B1B3D" stroke-width="2" fill="none"/>
<line x1="500" y1="236" x2="500" y2="200" stroke="#2B1B3D" stroke-width="2" marker-end="url(#tri)"/>
<text x="522.0" y="228.0" font-size="12" fill="#756986" font-style="italic">generalizzazione</text>
<path d="M215 346 V440 H396" stroke="#2B1B3D" stroke-width="2" fill="none"/>
<text x="300.0" y="432.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">si iscrive</text>
<text x="226.0" y="364.0" font-size="16" fill="#C2185B" font-weight="700">*</text>
<text x="382.0" y="434.0" font-size="16" fill="#C2185B" text-anchor="end" font-weight="700">*</text>
<path d="M785 346 V440 H604" stroke="#2B1B3D" stroke-width="2" fill="none"/>
<text x="700.0" y="432.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">insegna</text>
<text x="796.0" y="364.0" font-size="15" fill="#C2185B" font-weight="700">1</text>
<text x="618.0" y="434.0" font-size="16" fill="#C2185B" font-weight="700">*</text>
<rect x="400.0" y="96.0" width="200.0" height="102.0" rx="4" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="400" y="96" width="200" height="30" rx="4" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/><text x="500.0" y="116.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Persona</text><text x="412.0" y="144.0" font-size="12.5" fill="#3E3350">- nome: testo</text><text x="412.0" y="162.0" font-size="12.5" fill="#3E3350">- email: testo</text><line x1="400" y1="170" x2="600" y2="170" stroke="#5B2A86" stroke-width="1.5"/><text x="412.0" y="188.0" font-size="12.5" fill="#2B1B3D">+ contattare()</text>
<rect x="110.0" y="262.0" width="210.0" height="84.0" rx="4" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="110" y="262" width="210" height="30" rx="4" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/><text x="215.0" y="282.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Studente</text><text x="122.0" y="310.0" font-size="12.5" fill="#3E3350">- matricola: numero</text><line x1="110" y1="318" x2="320" y2="318" stroke="#5B2A86" stroke-width="1.5"/><text x="122.0" y="336.0" font-size="12.5" fill="#2B1B3D">+ iscrivere(corso)</text>
<rect x="680.0" y="262.0" width="210.0" height="84.0" rx="4" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="680" y="262" width="210" height="30" rx="4" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/><text x="785.0" y="282.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Docente</text><text x="692.0" y="310.0" font-size="12.5" fill="#3E3350">- codice: numero</text><line x1="680" y1="318" x2="890" y2="318" stroke="#5B2A86" stroke-width="1.5"/><text x="692.0" y="336.0" font-size="12.5" fill="#2B1B3D">+ insegnare(corso)</text>
<rect x="400.0" y="386.0" width="200.0" height="102.0" rx="4" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="400" y="386" width="200" height="30" rx="4" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/><text x="500.0" y="406.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Corso</text><text x="412.0" y="434.0" font-size="12.5" fill="#3E3350">- codice: testo</text><text x="412.0" y="452.0" font-size="12.5" fill="#3E3350">- titolo: testo</text><line x1="400" y1="460" x2="600" y2="460" stroke="#5B2A86" stroke-width="1.5"/><text x="412.0" y="478.0" font-size="12.5" fill="#2B1B3D">+ aprireClasse()</text>
<text x="500.0" y="520.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Studente e Docente ereditano nome, email e contattare() da Persona; “*” significa molti, “1” significa esattamente uno.</text>
</svg>
