<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Salt’s basic widgets</title>
<desc id="d">Table with seven rows. On the left, the Salt code; in the middle, the control it draws; on the right, its name: plain text becomes a label; [Send] becomes a button; () and (X) become unchecked and checked radio buttons; [] and [X] become check boxes; text in quotes becomes an input field; text between carets becomes a drop-down list; and &lt;&amp;person&gt; inserts a person icon.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="516" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Salt’s basic widgets</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Each piece of text becomes a control on the screen</text>
<text x="60.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">YOU WRITE</text><text x="430.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">SALT DRAWS</text><text x="700.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">NAME</text>
<rect x="40.0" y="122.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="129.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="152.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">Plain text</text>
<line x1="388" y1="146" x2="418" y2="146" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="430.0" y="151.0" font-size="15" fill="#2B1B3D" xml:space="preserve">Plain text</text>
<text x="700.0" y="151.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Text (label)</text>
<rect x="60.0" y="179.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="202.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">[Send]</text>
<line x1="388" y1="196" x2="418" y2="196" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="430.0" y="184.0" width="50.8" height="28.0" rx="9" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.2"/><text x="455.4" y="203.0" font-size="14" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">Send</text>
<text x="700.0" y="201.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Button</text>
<rect x="40.0" y="222.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="229.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="252.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">() No   (X) Yes</text>
<line x1="388" y1="246" x2="418" y2="246" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<circle cx="438" cy="246" r="7" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.8"/><text x="452.0" y="251.0" font-size="14" fill="#2B1B3D" xml:space="preserve">No</text><circle cx="548" cy="246" r="7" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.8"/><circle cx="548" cy="246" r="3.5" fill="#2B1B3D"/><text x="562.0" y="251.0" font-size="14" fill="#2B1B3D" xml:space="preserve">Yes</text>
<text x="700.0" y="251.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Radio button</text>
<rect x="60.0" y="279.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="302.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">[] No   [X] Yes</text>
<line x1="388" y1="296" x2="418" y2="296" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="431.0" y="289.0" width="14.0" height="14.0" rx="1" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.8"/><text x="452.0" y="301.0" font-size="14" fill="#2B1B3D" xml:space="preserve">No</text><rect x="541.0" y="289.0" width="14.0" height="14.0" rx="1" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.8"/><path d="M544 296 l3.5 4 l6.5 -9" fill="none" stroke="#2B1B3D" stroke-width="2.4"/><text x="562.0" y="301.0" font-size="14" fill="#2B1B3D" xml:space="preserve">Yes</text>
<text x="700.0" y="301.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Check box</text>
<rect x="40.0" y="322.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="329.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="352.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">"Type here        "</text>
<line x1="388" y1="346" x2="418" y2="346" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="434.0" y="352.0" font-size="14" fill="#2B1B3D" xml:space="preserve">Type here</text><path d="M430 350 v6 h200 v-6" fill="none" stroke="#2B1B3D" stroke-width="1.6"/>
<text x="700.0" y="351.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Input field</text>
<rect x="60.0" y="379.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="402.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">^Choose^</text>
<line x1="388" y1="396" x2="418" y2="396" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="430.0" y="385.0" width="200.0" height="26.0" rx="0" fill="#EDEDED" stroke="#2B1B3D" stroke-width="1.6"/><text x="435.0" y="403.0" font-size="14" fill="#2B1B3D" xml:space="preserve">Choose</text><line x1="608" y1="385" x2="608" y2="411" stroke="#2B1B3D" stroke-width="1.6"/><path d="M613 393 h12 l-6 11 z" fill="#2B1B3D"/>
<text x="700.0" y="401.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Drop-down list</text>
<rect x="40.0" y="422.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="429.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="452.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">User &lt;&amp;person&gt;</text>
<line x1="388" y1="446" x2="418" y2="446" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="430.0" y="451.0" font-size="15" fill="#2B1B3D" xml:space="preserve">User</text><g transform="translate(468.0,438)" fill="#2B1B3D"><circle cx="7" cy="4" r="4"/><path d="M0 15 q7 -10 14 0 z"/></g>
<text x="700.0" y="451.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Open Iconic icon</text>
<text x="500.0" y="494.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">The spaces inside the quotes set the width of the input field.</text>
