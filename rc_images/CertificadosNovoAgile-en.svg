<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The new agile cycle</title>
<desc id="d">A four-step clockwise cycle around the principle outcomes, not volume. Step 1, business goal: the starting point, not a backlog item. Step 2, AI prototype, built in hours within the conversation itself. Step 3, validation, before any major investment. Step 4, learning: scale, adjust or discard, returning to the business goal.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">The new agile cycle</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Iterations of hours or days, measured by business outcomes</text>

<g fill="none" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)">
<path d="M625 170 Q780 170 780 272"/>
<path d="M780 368 Q780 470 628 470"/>
<path d="M375 470 Q220 470 220 368"/>
<path d="M220 272 Q220 170 372 170"/>
</g>

<circle cx="500" cy="320" r="78" fill="#5B2A86"/>
<text x="500" y="314" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Outcomes,</text>
<text x="500" y="338" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">not volume</text>

<rect x="380" y="130" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<circle cx="380" cy="130" r="15" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/><text x="380" y="136" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">1</text>
<text x="500" y="164" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Business goal</text>
<text x="500" y="188" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">the starting point, not the backlog</text>

<rect x="660" y="280" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<circle cx="660" cy="280" r="15" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/><text x="660" y="286" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="780" y="314" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">AI prototype</text>
<text x="780" y="338" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">built in hours, in the conversation</text>

<rect x="380" y="430" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<circle cx="380" cy="430" r="15" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/><text x="380" y="436" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="500" y="464" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Validation</text>
<text x="500" y="488" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">before any major investment</text>

<rect x="100" y="280" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<circle cx="100" cy="280" r="15" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/><text x="100" y="286" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="220" y="314" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Learning</text>
<text x="220" y="338" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">scale, adjust or discard</text>
</svg>
