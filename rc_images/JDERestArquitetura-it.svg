<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Architettura REST di JD Edwards EnterpriseOne</title>
<desc id="d">I consumatori (portale, iPaaS, app mobile, Postman) chiamano via HTTPS e JSON un API gateway raccomandato, che inoltra all'AIS Server su WebLogic. L'AIS espone i servizi tokenrequest, formservice, dataservice, orchestrator e altri, e ospita l'Orchestrator. L'AIS parla con l'HTML Server (JAS), che usa JDENET per raggiungere l'Enterprise Server, dove girano le business function che accedono al database. L'Orchestrator chiama anche API esterne tramite connettori REST. Il Server Manager installa e configura i server. Riquadro sicurezza: utente di servizio, token o OAuth, Security Workbench e HTTPS.</desc>
