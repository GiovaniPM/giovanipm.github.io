00">W</text><rect x="396" y="334" width="56" height="56" rx="0" fill="#FFE8E8" stroke="#2B1B3D" stroke-width="1" fill-opacity="0.55"/><text x="424" y="368" font-size="15" fill="#FF6B6B" text-anchor="middle" font-weight="700">P</text><rect x="60" y="390" width="56" height="56" rx="0" fill="#E6F0FF" stroke="#2B1B3D" stroke-width="1" fill-opacity="0.55"/><text x="88" y="424" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700">W</text><rect x="116" y="390" width="56" height="56" rx="0" fill="#FFE8E8" stroke="#2B1B3D" stroke-width="1" fill-opacity="0.55"/><text x="144" y="424" font-size="15" fill="#FF6B6B" text-anchor="middle" font-weight="700">P</text><rect x="172" y="390" width="56" height="56" rx="0" fill="#E6F0FF" stroke="#2B1B3D" stroke-width="1" fill-opacity="0.55"/><text x="200" y="424" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700">W</text><rect x="228" y="390" width="56" height="56" rx="0" fill="#FFE8E8" stroke="#2B1B3D" stroke-width="1" fill-opacity="0.55"/><text x="256" y="424" font-size="15" fill="#FF6B6B" text-anchor="middle" font-weight="700">P</text><rect x="284" y="390" width="56" height="56" rx="0" fill="#E6F0FF" stroke="#2B1B3D" stroke-width="1" fill-opacity="0.55"/><text x="312" y="424" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700">W</text><rect x="340" y="390" width="56" height="56" rx="0" fill="#FFE8E8" stroke="#2B1B3D" stroke-width="1" fill-opacity="0.55"/><text x="368" y="424" font-size="15" fill="#FF6B6B" text-anchor="middle" font-weight="700">P</text><rect x="396" y="390" width="56" height="56" rx="0" fill="#E6F0FF" stroke="#2B1B3D" stroke-width="1" fill-opacity="0.55"/><text x="424" y="424" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700">W</text><text x="256" y="470" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">P = pressure · W = wind</text><text x="256" y="494" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">(sketch inspired by Richardson’s grid)</text><rect x="500" y="110" width="470" height="68" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="520" y="138" font-size="17" fill="#5B2A86" text-anchor="start" font-weight="700">1. Measure the air now</text><text x="520" y="162" font-size="14" fill="#2B1B3D" text-anchor="start">pressure, wind, temperature</text><rect x="500" y="192" width="470" height="68" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><text x="520" y="220" font-size="17" fill="#3A86FF" text-anchor="start" font-weight="700">2. Apply physics</text><text x="520" y="244" font-size="14" fill="#2B1B3D" text-anchor="start">in every little square</text><rect x="500" y="274" width="470" height="68" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="520" y="302" font-size="17" fill="#2A9D8F" text-anchor="start" font-weight="700">3. Step forward in time</text><text x="520" y="326" font-size="14" fill="#2B1B3D" text-anchor="start">one step at a time</text><rect x="500" y="360" width="225" height="140" rx="12" fill="#FFE8E8"/><text x="612" y="390" font-size="14" fill="#2B1B3D" text-anchor="middle">Result by hand:</text><text x="612" y="416" font-size="14" fill="#2B1B3D" text-anchor="middle">≈ 6 weeks of arithmetic</text><text x="612" y="442" font-size="14" fill="#2B1B3D" text-anchor="middle">to forecast 6 hours,</text><text x="612" y="468" font-size="14" fill="#2B1B3D" text-anchor="middle">and a wrong forecast</text><rect x="745" y="360" width="225" height="140" rx="12" fill="#FFF1C9"/><text x="857" y="390" font-size="14" fill="#2B1B3D" text-anchor="middle">The dream:</text><text x="857" y="416" font-size="14" fill="#2B1B3D" text-anchor="middle">a “forecast factory”</text><text x="857" y="442" font-size="14" fill="#2B1B3D" text-anchor="middle">with 64,000 human</text><text x="857" y="468" font-size="14" fill="#2B1B3D" text-anchor="middle">computers</text>
</svg>
