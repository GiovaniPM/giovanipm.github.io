<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">From text to diagram</title>
<desc id="d">On the left, a text file with the code of a Gantt chart: project start, a 5-day task, an 8-day task chained with then and a milestone. An arrow leads to PlantUML, which runs on Java, and another to the generated image, with bars, a dependency and a milestone. Below, three ways to use it: VS Code extension, online server and command line.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">From text to diagram</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">You describe the project in text; PlantUML draws the Gantt chart</text>
<rect x="30.0" y="110.0" width="330.0" height="200.0" rx="12" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="46" y="138" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">@startgantt</tspan></text>
<text x="46" y="162" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">project starts </tspan><tspan fill="#F7F0FF">2026-10-05</tspan></text>
<text x="46" y="186" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#5FD3C4">[Analysis]</tspan><tspan fill="#FFB703" font-weight="700"> requires </tspan><tspan fill="#F7F0FF">5 days</tspan></text>
<text x="46" y="210" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">then </tspan><tspan fill="#5FD3C4">[Coding]</tspan><tspan fill="#FFB703" font-weight="700"> requires </tspan><tspan fill="#F7F0FF">8 days</tspan></text>
<text x="46" y="234" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#5FD3C4">[Delivery]</tspan><tspan fill="#FFB703" font-weight="700"> happens at</tspan></text>
<text x="46" y="258" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#F7F0FF">  </tspan><tspan fill="#5FD3C4">[Coding]</tspan><tspan fill="#F7F0FF">'s end</tspan></text>
<text x="46" y="282" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">@endgantt</tspan></text>
<text x="195.0" y="334.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">project.puml (plain text)</text>
