<rect width="1000" height="554" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Olhando para as linhas vizinhas</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">LAG e LEAD leem outra linha; SUM OVER acumula até a linha atual</text>
