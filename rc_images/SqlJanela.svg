<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 554" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Olhando para as linhas vizinhas</title>
<desc id="d">Tabela com sete funcionários em ordem de admissão, de Eva, em 2012, a Davi, em 2023. A linha de Ana está destacada. Uma seta roxa mostra que o LAG de Ana, 3500, vem do salário de Gil, na linha anterior; uma seta azul mostra que o LEAD de Ana, Fábio, vem da linha seguinte; e um colchete verde mostra que a soma acumulada de Ana, 18500, soma os salários das quatro primeiras linhas.</desc>
