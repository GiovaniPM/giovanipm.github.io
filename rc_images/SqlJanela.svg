<text x="790.0" y="228.0" font-size="12.5" fill="#2A9D8F" font-weight="700" xml:space="preserve">janela da SUM</text><text x="790.0" y="246.0" font-size="12" fill="#3E3350" xml:space="preserve">do início à linha atual</text><text x="790.0" y="264.0" font-size="12" fill="#3E3350" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">6000+4000+</text><text x="790.0" y="282.0" font-size="12" fill="#3E3350" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3500+5000</text>
<rect x="60.0" y="84.0" width="880.0" height="28.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="70.0" y="102.3" font-size="12" fill="#5FD3C4" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">LAG(salario) OVER (ORDER BY admissao) · LEAD(nome) OVER (…) · SUM(salario) OVER (ORDER BY admissao)</text>
<text x="60.0" y="452.0" font-size="13" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">LAG</text><text x="140.0" y="452.0" font-size="13" fill="#3E3350" xml:space="preserve">valor da linha anterior (a primeira recebe NULL)</text>
<text x="60.0" y="474.0" font-size="13" fill="#3A86FF" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">LEAD</text><text x="140.0" y="474.0" font-size="13" fill="#3E3350" xml:space="preserve">valor da linha seguinte (a última recebe NULL)</text>
<text x="60.0" y="496.0" font-size="13" fill="#2A9D8F" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">SUM</text><text x="140.0" y="496.0" font-size="13" fill="#3E3350" xml:space="preserve">com ORDER BY, soma acumulada: RANGE UNBOUNDED PRECEDING</text>
<text x="500.0" y="532.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Tudo sem self-join: a ordem vem do ORDER BY dentro do OVER, não do ORDER BY da consulta.</text>
