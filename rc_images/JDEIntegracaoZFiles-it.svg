<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 568" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Flusso delle Z-file in ingresso e in uscita</title>
<desc id="d">Ingresso: il sistema esterno scrive nella Z-file F4201Z1/F4211Z1 con il flag EDSP aperto; l'UBE elaboratore R4211Z1I, con versione e opzioni di elaborazione, chiama la master business function F4211FS con le regole del P4210 e scrive in F4201/F4211, impostando EDSP = 1. In caso di errore di validazione il messaggio va nel Work Center e il record resta nella Z-file per essere corretto e rielaborato. Uscita: una transazione in JDE, secondo le opzioni di elaborazione e il P0047, scrive nella Z-file con codice azione A, C o D; il sistema esterno la legge e la marca come elaborata; un purge elimina i record elaborati.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="568" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Z-file: interoperabilità batch</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">La tabella Z è un'area di sosta; l'UBE elaboratore applica le stesse regole dell'applicazione</text>
<rect x="20" y="92" width="960" height="262" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#756986" text-anchor="start" font-weight="700">IN INGRESSO (INBOUND)</text>
<rect x="40" y="140" width="168" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="124.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistema esterno</text>
<text x="124.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">SQL, ETL, iPaaS</text>
<text x="124.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">o orchestrazione</text>
<rect x="228" y="140" width="168" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="312.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Z-file</text>
<text x="312.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">F4201Z1 / F4211Z1</text>
<text x="312.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">EDSP = aperto</text>
<rect x="416" y="140" width="168" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE elaboratore</text>
<text x="500.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">R4211Z1I</text>
<text x="500.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">versione + opzioni</text>
<rect x="604" y="140" width="168" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="688.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Master BSFN</text>
<text x="688.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">F4211FS…</text>
<text x="688.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">regole del P4210</text>
<rect x="792" y="140" width="168" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="876.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tabelle finali</text>
<text x="876.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">F4201 / F4211</text>
<text x="876.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">EDSP = 1</text>
<polyline points="208,180 226,180" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="396,180 414,180" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="584,180 602,180" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="772,180 790,180" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="688.0,220 688.0,262" fill="none" stroke="#E23B3B" stroke-width="2" marker-end="url(#ae)"/>
<rect x="560" y="264" width="256" height="70" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="688.0" y="286.0" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Errore di validazione</text>
<text x="688.0" y="303.9" font-size="12.0" fill="#3E3350" text-anchor="middle">messaggio nel Work Center</text>
<text x="688.0" y="321.7" font-size="12.0" fill="#3E3350" text-anchor="middle">il record resta nella Z-file</text>
<polyline points="560,300 312.0,300 312.0,222" fill="none" stroke="#E23B3B" stroke-width="2" marker-end="url(#ae)"/>
<text x="400" y="292" font-size="12.5" fill="#B3261E" text-anchor="middle" font-style="italic">correggere e rielaborare</text>
<rect x="20" y="372" width="960" height="176" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="396" font-size="13" fill="#756986" text-anchor="start" font-weight="700">IN USCITA (OUTBOUND)</text>
<rect x="40" y="420" width="168" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="124.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Transazione in JDE</text>
<text x="124.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">es.: ordine nel</text>
<text x="124.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">P4210</text>
<rect x="228" y="420" width="168" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="312.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Controllo uscita</text>
<text x="312.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">opzioni di elab. /</text>
<text x="312.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">P0047</text>
<rect x="416" y="420" width="168" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Z-file</text>
<text x="500.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">F4211Z1</text>
<text x="500.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">EDTC = A, C, D</text>
<rect x="604" y="420" width="168" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="688.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistema esterno</text>
<text x="688.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">legge e marca</text>
<text x="688.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">come elaborato</text>
<rect x="792" y="420" width="168" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="876.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Purge</text>
<text x="876.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">elimina i record</text>
<text x="876.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">elaborati</text>
<polyline points="208,460 226,460" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="396,460 414,460" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="584,460 602,460" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="772,460 790,460" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
</svg>
