<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The vocabulary of orbits</title>
<desc id="d">On the left, a planet with its atmosphere, the green target band and an elliptical orbit in orange. The periapsis, the lowest point, is on the right; the apoapsis, the highest point, on the left; altitude is measured from the surface. On the right, four trajectory shapes by eccentricity: a circle with e equal to zero, an ellipse with e between zero and one, a parabola with e equal to one and a hyperbola with e greater than one, the shape in which the object arrives and escapes.</desc>
