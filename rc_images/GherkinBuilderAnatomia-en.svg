<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" role="img" aria-labelledby="t d"><title id="t">The parts of a feature in Gherkin</title><desc id="d">Annotated example: the feature says what will be tested; the background applies to all scenarios; each scenario describes one behavior with a starting situation, an action and a result; the outline repeats the test with the data in the examples table, one run per row.</desc><rect width="1000" height="524" rx="18" fill="#FFF7EC"/><text x="500" y="38" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#2B1B3D" xml:space="preserve">The parts of a feature in Gherkin</text><text class="c" x="30" y="84" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Feature:</tspan> Discount coupon</text><path d="M618 78h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="78" r="3.5" fill="#C2185B"/><text class="n" x="646" y="84" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">what will be tested</text><text class="c" x="48" y="121" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Background:</tspan></text><path d="M618 115h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="115" r="3.5" fill="#C2185B"/><text class="n" x="646" y="121" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">applies to all scenarios</text><text class="c" x="66" y="158" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Given</tspan> I have $200 in the cart</text><text class="c" x="48" y="195" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Scenario:</tspan> Apply a valid coupon</text><path d="M618 189h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="189" r="3.5" fill="#C2185B"/><text class="n" x="646" y="195" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">one behavior</text><text class="c" x="66" y="232" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Given</tspan> I have a 10% coupon</text><path d="M618 226h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="226" r="3.5" fill="#C2185B"/><text class="n" x="646" y="232" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">the starting situation</text><text class="c" x="66" y="269" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">When</tspan> I apply the coupon</text><path d="M618 263h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="263" r="3.5" fill="#C2185B"/><text class="n" x="646" y="269" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">the action</text><text class="c" x="66" y="306" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Then</tspan> the total becomes $180</text><path d="M618 300h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="300" r="3.5" fill="#C2185B"/><text class="n" x="646" y="306" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">a result you can check</text><text class="c" x="48" y="343" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Scenario Outline:</tspan> Refuse a coupon</text><path d="M618 337h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="337" r="3.5" fill="#C2185B"/><text class="n" x="646" y="343" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">same test, several data sets</text><text class="c" x="66" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">When</tspan> I apply the coupon "&lt;coupon&gt;"</text><path d="M618 374h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="374" r="3.5" fill="#C2185B"/><text class="n" x="646" y="380" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">&lt;variable&gt; comes from the table</text><text class="c" x="66" y="417" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Examples:</tspan></text><path d="M618 411h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="411" r="3.5" fill="#C2185B"/><text class="n" x="646" y="417" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">each row is one run</text><text class="c" x="84" y="454" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve">| coupon  |</text><text class="c" x="84" y="491" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve">| EXPIRED |</text></svg>