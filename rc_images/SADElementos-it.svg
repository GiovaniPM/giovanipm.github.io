<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Gli elementi di un sistema</title>
<desc id="d">Un sistema dentro il suo ambiente. Gli input attraversano il confine tramite un’interfaccia e arrivano al processore, che produce gli output. Il controllo, sopra, guida il processore. Una linea di retroazione riporta l’informazione dall’output al controllo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Gli elementi di un sistema</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Input, processore, output, controllo e retroazione, entro un confine e un ambiente</text>
<rect x="24.0" y="96.0" width="952.0" height="392.0" rx="16" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="8 6"/>
<text x="44.0" y="122.0" font-size="15" fill="#0E6B61" font-weight="700">Ambiente (supersistema)</text>
<text x="44.0" y="142.0" font-size="12.5" fill="#3E3350" font-style="italic">clienti, fornitori, concorrenti, leggi</text>
<rect x="190.0" y="150.0" width="620.0" height="290.0" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/>
<text x="206.0" y="172.0" font-size="13" fill="#5B2A86" font-weight="700">Confine del sistema</text>
<line x1="40.0" y1="320.0" x2="186.0" y2="320.0" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<text x="44.0" y="306.0" font-size="15" fill="#2B1B3D" font-weight="700">Input</text>
<text x="44.0" y="346.0" font-size="12" fill="#3E3350">dati e risorse</text>
<text x="44.0" y="362.0" font-size="12" fill="#3E3350">in ingresso</text>
<line x1="814.0" y1="320.0" x2="960.0" y2="320.0" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<text x="956.0" y="306.0" font-size="15" fill="#2B1B3D" text-anchor="end" font-weight="700">Output</text>
<text x="956.0" y="346.0" font-size="12" fill="#3E3350" text-anchor="end">risultati utili</text>
<text x="956.0" y="362.0" font-size="12" fill="#3E3350" text-anchor="end">per l’utente</text>
<circle cx="190" cy="320" r="7" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/>
<circle cx="810" cy="320" r="7" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/>
<text x="190.0" y="470.0" font-size="12" fill="#B35300" text-anchor="middle" font-weight="700">interfaccia</text>
<line x1="190" y1="330" x2="190" y2="456" stroke="#B35300" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="400.0" y="285.0" width="200.0" height="70.0" rx="12" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="500.0" y="314.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Processore</text>
<text x="500.0" y="336.0" font-size="12" fill="#3E3350" text-anchor="middle">trasforma input in output</text>
<line x1="197.0" y1="320.0" x2="396.0" y2="320.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="604.0" y1="320.0" x2="803.0" y2="320.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="420.0" y="180.0" width="160.0" height="58.0" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="2.5"/>
<text x="500.0" y="204.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Controllo</text>
<text x="500.0" y="224.0" font-size="12" fill="#3E3350" text-anchor="middle">decide e regola</text>
<line x1="500.0" y1="240.0" x2="500.0" y2="281.0" stroke="#B35300" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M700 320 V410 H300 V209 H414" stroke="#C2185B" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#ac)"/>
<text x="500.0" y="428.0" font-size="14" fill="#C2185B" text-anchor="middle" font-weight="700">Retroazione</text>
<text x="500.0" y="404.0" font-size="12" fill="#3E3350" text-anchor="middle">confronta l’output con l’obiettivo e informa il controllo</text>
</svg>
