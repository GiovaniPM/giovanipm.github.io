<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cinque grandi domande senza risposta</title>
<desc id="d">Cinque schede: Navier–Stokes: Le equazioni dei fluidi hanno sempre soluzioni lisce? Premio: 1 milione di $; Esponente ω: Si possono moltiplicare matrici n × n in ≈ n² passi? Oggi: ω &lt; 2,3714; Programmazione lineare: Esiste un algoritmo “fortemente polinomiale”? (9º di Smale) Usato nella logistica; Eliminazione di Gauss: Perché non va quasi mai storta in pratica, se in teoria potrebbe?; Alta dimensione: Perché le reti neurali battono la “maledizione della dimensionalità”?.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cinque grandi domande senza risposta</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Dove si trova oggi la frontiera del calcolo numerico</text><rect x="40" y="100" width="290" height="200" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><circle cx="76" cy="136" r="20" fill="#FF6B6B" stroke="None" stroke-width="0"/><text x="76" y="143" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="205" y="142" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">Navier–Stokes</text><text x="185" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">Le equazioni dei fluidi</text><text x="185" y="220" font-size="15" fill="#2B1B3D" text-anchor="middle">hanno sempre soluzioni lisce?</text><text x="185" y="250" font-size="15" fill="#2B1B3D" text-anchor="middle">Premio: 1 milione di $</text><rect x="355" y="100" width="290" height="200" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><circle cx="391" cy="136" r="20" fill="#3A86FF" stroke="None" stroke-width="0"/><text x="391" y="143" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="520" y="142" font-size="17" fill="#3A86FF" text-anchor="middle" font-weight="700">Esponente ω</text><text x="500" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">Si possono moltiplicare</text><text x="500" y="220" font-size="15" fill="#2B1B3D" text-anchor="middle">matrici n × n in ≈ n² passi?</text><text x="500" y="250" font-size="15" fill="#2B1B3D" text-anchor="middle">Oggi: ω &lt; 2,3714</text><rect x="670" y="100" width="290" height="200" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><circle cx="706" cy="136" r="20" fill="#2A9D8F" stroke="None" stroke-width="0"/><text x="706" y="143" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="835" y="142" font-size="17" fill="#2A9D8F" text-anchor="middle" font-weight="700">Programmazione lineare</text><text x="815" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">Esiste un algoritmo “fortemente</text><text x="815" y="220" font-size="15" fill="#2B1B3D" text-anchor="middle">polinomiale”? (9º di Smale)</text><text x="815" y="250" font-size="15" fill="#2B1B3D" text-anchor="middle">Usato nella logistica</text><rect x="197" y="325" width="290" height="200" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><circle cx="233" cy="361" r="20" fill="#FFB703" stroke="None" stroke-width="0"/><text x="233" y="368" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="362" y="367" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">Eliminazione di Gauss</text><text x="342" y="415" font-size="15" fill="#2B1B3D" text-anchor="middle">Perché non va quasi mai</text><text x="342" y="445" font-size="15" fill="#2B1B3D" text-anchor="middle">storta in pratica, se</text><text x="342" y="475" font-size="15" fill="#2B1B3D" text-anchor="middle">in teoria potrebbe?</text><rect x="512" y="325" width="290" height="200" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><circle cx="548" cy="361" r="20" fill="#5B2A86" stroke="None" stroke-width="0"/><text x="548" y="368" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="677" y="367" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Alta dimensione</text><text x="657" y="415" font-size="15" fill="#2B1B3D" text-anchor="middle">Perché le reti neurali</text><text x="657" y="445" font-size="15" fill="#2B1B3D" text-anchor="middle">battono la “maledizione</text><text x="657" y="475" font-size="15" fill="#2B1B3D" text-anchor="middle">della dimensionalità”?</text>
</svg>
