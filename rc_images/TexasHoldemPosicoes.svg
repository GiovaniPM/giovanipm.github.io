<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" width="1000" height="735" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Posições numa mesa de seis jogadores</title>
<desc id="d">Mesa oval com seis lugares em sentido horário: Botão (dealer), Small blind, Big blind, UTG, Hijack e Cutoff. Antes do flop a ordem é UTG, Hijack, Cutoff, Botão, Small blind e Big blind. Do flop em diante começa o Small blind e o Botão fala por último.</desc>
