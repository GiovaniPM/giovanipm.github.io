<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
<title id="t">Chains and loops at the end of the game</title>
<desc id="d">Board of 2 by 5 boxes with no safe line left: every free box has two sides drawn. The boxes form four pieces: a, a loop of 4 boxes on the left; b, a long chain of 3 boxes on the top row; c, a chain of 2 boxes below; and d, a chain of 1 box in the corner. Any line drawn gives away one of these pieces.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="420" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">Chains and loops at the end of the game</text>
<rect x="77.7" y="113.4" width="61.4" height="61.4" rx="5" fill="#D8F1EC"/><text x="108.4" y="151.1" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">a</text><rect x="148.5" y="113.4" width="61.4" height="61.4" rx="5" fill="#D8F1EC"/><text x="179.2" y="151.1" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">a</text><rect x="219.3" y="113.4" width="61.4" height="61.4" rx="5" fill="#FFF1C9"/><text x="250.0" y="151.1" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">b</text><rect x="290.1" y="113.4" width="61.4" height="61.4" rx="5" fill="#FFF1C9"/><text x="320.8" y="151.1" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">b</text><rect x="360.9" y="113.4" width="61.4" height="61.4" rx="5" fill="#FFF1C9"/><text x="391.6" y="151.1" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">b</text><rect x="77.7" y="184.2" width="61.4" height="61.4" rx="5" fill="#D8F1EC"/><text x="108.4" y="221.9" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">a</text><rect x="148.5" y="184.2" width="61.4" height="61.4" rx="5" fill="#D8F1EC"/><text x="179.2" y="221.9" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">a</text><rect x="219.3" y="184.2" width="61.4" height="61.4" rx="5" fill="#FBDDEA"/><text x="250.0" y="221.9" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">c</text><rect x="290.1" y="184.2" width="61.4" height="61.4" rx="5" fill="#FBDDEA"/><text x="320.8" y="221.9" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">c</text><rect x="360.9" y="184.2" width="61.4" height="61.4" rx="5" fill="#ECE2F8"/><text x="391.6" y="221.9" text-anchor="middle" font-size="22" font-weight="700" fill="#756986">d</text><g transform="translate(42.3 78) scale(1.18)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="gridln" x1="146" y