<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Two possible futures</title>
<desc id="d">Two panels. If P equals NP, solving would be as easy as checking: drugs and materials would be designed quickly and computers would find mathematical proofs, but today’s cryptography would be vulnerable and creativity would lose its leap. If P is not equal to NP, some problems are inherently hard: passwords and banks stay protected, we know where the limits are, and hard problems call for shortcuts such as approximations and heuristics. Below, the 2019 poll with 124 responses: about 80% think P is not equal to NP; among those who have studied the problem most, 99%; and 66% think it will be solved before 2100.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="505" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Two possible futures</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">What changes if the answer is yes, and what changes if it is no</text>
<rect x="50" y="96" width="420" height="250" rx="14" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<path d="M50 110 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v36 h-420 z" fill="#FFB703"/>
<text x="260" y="120" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">If P = NP</text>
<text x="260" y="139" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-style="italic">solving would be as easy as checking</text>
<circle cx="82" cy="179" r="12" fill="#2A9D8F"/><text x="82" y="184" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="106" y="184" font-size="14.5" fill="#2B1B3D">Drugs and materials designed quickly</text>
<circle cx="82" cy="217" r="12" fill="#2A9D8F"/><text x="82" y="222" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="106" y="222" font-size="14.5" fill="#2B1B3D">Computers would find mathematical proofs</text>
<circle cx="82" cy="255" r="12" fill="#E23B3B"/><text x="82" y="260" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">−</text>
<text x="106" y="260" font-size="14.5" fill="#2B1B3D">Today’s cryptography would be vulnerable</text>
<circle cx="82" cy="293" r="12" fill="#5B2A86"/><text x="82" y="298" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="106" y="298" font-size="14.5" fill="#2B1B3D">Creativity would lose its “leap”</text>
<rect x="530" y="96" width="420" height="250" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M530 110 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v36 h-420 z" fill="#2A9D8F"/>
<text x="740" y="120" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">If P ≠ NP</text>
<text x="740" y="139" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">some problems are inherently hard</text>
<circle cx="562" cy="179" r="12" fill="#2A9D8F"/><text x="562" y="184" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="586" y="184" font-size="14.5" fill="#2B1B3D">Passwords and banks stay protected</text>
<circle cx="562" cy="217" r="12" fill="#2A9D8F"/><text x="562" y="222" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="586" y="222" font-size="14.5" fill="#2B1B3D">We know where the limits are</text>
<circle cx="562" cy="255" r="12" fill="#3A86FF"/><text x="562" y="260" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">•</text>
<text x="586" y="260" font-size="14.5" fill="#2B1B3D">Hard problems call for shortcuts:</text>
<text x="586" y="298" font-size="14.5" fill="#2B1B3D">approximations and heuristics</text>
<text x="500" y="390" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">What experts say (2019 poll, 124 responses)</text>
<rect x="100" y="406" width="640" height="40" rx="8" fill="#2A9D8F"/><rect x="740" y="406" width="160" height="40" rx="8" fill="#D9C9B4"/><text x="420" y="432" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">P ≠ NP: about 80%</text>
<text x="820" y="432" font-size="13" fill="#2B1B3D" text-anchor="middle">other answers</text>
<text x="500" y="478" font-size="13.5" fill="#756986" text-anchor="middle" font-style="italic">Among those who have studied the problem most, 99% bet on P ≠ NP. And 66% think it will be solved before 2100.</text>
</svg>
