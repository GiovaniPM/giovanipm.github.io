<text x="402.5" y="348" font-size="20" fill="#B35300" text-anchor="middle" font-weight="700">1964–65</text>
<text x="402.5" y="372" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cobham y Edmonds</text>
<text x="402.5" y="396" font-size="12" fill="#756986" text-anchor="middle">Tiempo polinomial</text>
<text x="402.5" y="413" font-size="12" fill="#756986" text-anchor="middle">= eficiente</text>
<line x1="500.0" y1="244" x2="500.0" y2="290" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="3 4"/>
