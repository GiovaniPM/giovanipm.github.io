<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cómo nació la complejidad computacional</title>
<desc id="d">Línea de tiempo con nueve hitos. 1936, Alan Turing muestra que no todo se puede calcular, con el problema de la parada. 1956, Kurt Gödel le pregunta a von Neumann, en una carta, si encontrar demostraciones se puede automatizar. 1965, Hartmanis y Stearns miden el tiempo de los algoritmos y le dan nombre al área. 1964 y 1965, Cobham y Edmonds proponen que tiempo polinomial significa eficiente. 1971, Stephen Cook muestra que el problema SAT es NP-completo y nace la pregunta P igual a NP. 1972, Richard Karp muestra 21 problemas NP-completos. 1973, Leonid Levin descubre lo mismo, por su cuenta, en la Unión Soviética. 2000, el Instituto Clay ofrece 1 millón de dólares por una respuesta. 2002, Agrawal, Kayal y Saxena muestran que verificar si un número es primo está en P.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cómo nació la complejidad computacional</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">De Turing al premio del millón de dólares</text>
<line x1="40" y1="290" x2="960" y2="290" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<line x1="110.0" y1="244" x2="110.0" y2="290" stroke="#5B2A86" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="110.0" cy="290" r="8" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<rect x="18.0" y="104" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<text x="110" y="134" font-size="20" fill="#5B2A86" text-anchor="middle" font-weight="700">1936</text>
<text x="110" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Alan Turing</text>
<text x="110" y="182" font-size="12" fill="#756986" text-anchor="middle">No todo se puede</text>
<text x="110" y="199" font-size="12" fill="#756986" text-anchor="middle">calcular: el problema</text>
<text x="110" y="216" font-size="12" fill="#756986" text-anchor="middle">de la parada</text>
<line x1="207.5" y1="290" x2="207.5" y2="318" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="207.5" cy="290" r="8" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/>
<rect x="115.5" y="318" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="207.5" y="348" font-size="20" fill="#3A86FF" text-anchor="middle" font-weight="700">1956</text>
<text x="207.5" y="372" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Kurt Gödel</text>
<text x="207.5" y="396" font-size="12" fill="#756986" text-anchor="middle">Carta a von Neumann:</text>
<text x="207.5" y="413" font-size="12" fill="#756986" text-anchor="middle">¿encontrar demostraciones</text>
<text x="207.5" y="430" font-size="12" fill="#756986" text-anchor="middle">se puede automatizar?</text>
<line x1="305.0" y1="244" x2="305.0" y2="290" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="305.0" cy="290" r="8" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<rect x="213.0" y="104" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="305" y="134" font-size="20" fill="#2A9D8F" text-anchor="middle" font-weight="700">1965</text>
<text x="305" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Hartmanis y Stearns</text>
<text x="305" y="182" font-size="12" fill="#756986" text-anchor="middle">Miden el tiempo</text>
<text x="305" y="199" font-size="12" fill="#756986" text-anchor="middle">de los algoritmos y</text>
<text x="305" y="216" font-size="12" fill="#756986" text-anchor="middle">le dan nombre al área</text>
<line x1="402.5" y1="290" x2="402.5" y2="318" stroke="#FFB703" stroke-width="2" stroke-dasharray="3 4"/>
