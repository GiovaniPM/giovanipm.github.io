<rect x="238" y="150" width="150" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2" stroke-dasharray="6 4"/>
<text x="313.0" y="191.5" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">API gateway</text>
<text x="313.0" y="210.0" font-size="12.5" fill="#3E3350" text-anchor="middle">reverse proxy</text>
