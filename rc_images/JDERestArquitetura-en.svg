<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">REST architecture of JD Edwards EnterpriseOne</title>
<desc id="d">Consumers (portal, iPaaS, mobile app, Postman) call over HTTPS and JSON a recommended API gateway, which forwards to the AIS Server on WebLogic. AIS exposes the tokenrequest, formservice, dataservice, orchestrator and other services, and hosts the Orchestrator. AIS talks to the HTML Server (JAS), which uses JDENET to reach the Enterprise Server, where business functions run and access the database. The Orchestrator also calls external APIs through REST connectors. Server Manager deploys and configures the servers. Security box: service user, token or OAuth, Security Workbench and HTTPS.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
