<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" role="img" aria-labelledby="t d"><title id="t">Onde a IA ajuda na análise dos cenários</title><desc id="d">Seis passos: você descreve o requisito, a IA levanta regras e exemplos, a IA rascunha os cenários, o app importa e verifica, a IA revisa as lacunas e você decide com a equipe. Da decisão, volta-se a levantar regras com as respostas da equipe.</desc><rect width="1000" height="214" rx="18" fill="#FFF7EC"/><text x="500" y="32" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D" xml:space="preserve">Onde a IA ajuda na análise dos cenários</text><rect x="18" y="56" width="150" height="92" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="93" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#B35300" xml:space="preserve">Você</text><text x="93" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D" xml:space="preserve">Descrever</text><text x="93" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#2B1B3D" xml:space="preserve">o requisito</text><path d="M170 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M181 102l-6 -4v8z" fill="#2B1B3D"/><rect x="182" y="56" width="150" height="92" rx="12" fill="#EFEAFA" stroke="#5B2A86" stroke-width="2"/><text x="257" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5B2A86" xml:space="preserve">IA</text><text x="257" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D" xml:space="preserve">Levantar regras</text><text x="257" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#2B1B3D" xml:space="preserve">e exemplos</text><path d="M334 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M345 102l-6 -4v8z" fill="#2B1B3D"/><rect x="346" y="56" width="150" height="92" rx="12" fill="#EFEAFA" stroke="#5B2A86" stroke-width="2"/><text x="421" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5B2A86" xml:space="preserve">IA</text><text x="421" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D" xml:space="preserve">Rascunhar</text><text x="421" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#2B1B3D" xml:space="preserve">os cenários</text><path d="M498 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M509 102l-6 -4v8z" fill="#2B1B3D"/><rect x="510" y="56" width="150" height="92" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="585" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0E8074" xml:space="preserve">App</text><text x="585" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D" xml:space="preserve">Importar</text><text x="585" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#2B1B3D" xml:space="preserve">e verificar</text><path d="M662 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M673 102l-6 -4v8z" fill="#2B1B3D"/><rect x="674" y="56" width="150" height="92" rx="12" fill="#EFEAFA" stroke="#5B2A86" stroke-width="2"/><text x="749" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5B2A86" xml:space="preserve">IA</text><text x="749" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D" xml:space="preserve">Revisar</text><text x="749" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#2B1B3D" xml:space="preserve">as lacunas</text><path d="M826 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M837 102l-6 -4v8z" fill="#2B1B3D"/><rect x="838" y="56" width="150" height="92" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="913" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#B35300" xml:space="preserve">Você</text><text x="913" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D" xml:space="preserve">Decidir</text><text x="913" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#2B1B3D" xml:space="preserve">com a equipe</text><path d="M913 150V178H257V158" fill="none" stroke="#756986" stroke-width="2" stroke-dasharray="6 4"/><path d="M257 150l-4 7h8z" fill="#756986"/><text x="585" y="199" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#756986" xml:space="preserve">volte com as respostas da equipe</text></svg>