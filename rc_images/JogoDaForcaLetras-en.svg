<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" width="1000" height="442" role="img" aria-labelledby="t d">
<title id="t">Most frequent letters in the 3000 English words</title>
<desc id="d">Share of each letter among all letters of the game's 3000 English words, and share of the words that contain the letter at least once: E 9.9% / 65%; I 9.3% / 63%; O 8.7% / 61%; A 8.6% / 63%; T 8.3% / 62%; N 8.0% / 61%; R 7.6% / 58%; S 6.1% / 44%; C 4.6% / 39%; L 4.5% / 37%; M 3.3% / 28%; P 2.9% / 25%.</desc>
