<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Anatomía de un archivo .feature en Gherkin</title>
<desc id="d">Un archivo .feature de ejemplo, en Gherkin con palabras clave en español, con notas a la derecha. Línea del idioma; etiqueta @retiro; Característica con nombre y descripción; Antecedentes con un paso común a todos los escenarios; un Escenario con Dado, Cuando, Entonces e Y; y un Esquema del escenario con marcadores entre corchetes angulares, completados por la tabla de Ejemplos.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="558" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Anatomía de un archivo .feature en Gherkin</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Palabras clave al inicio de cada línea, texto libre en español justo después</text>
<rect x="30" y="100" width="600" height="432.5" rx="12" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="48" y="126.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#A898C0"># language: es</tspan></text>
<text x="48" y="143.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FF8A8A">@retiro</tspan></text>
<text x="48" y="161.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">Característica:</tspan><tspan fill="#F7F0FF"> Retiro en el cajero</tspan></text>
<text x="48" y="178.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F7F0FF">  Para no hacer fila en el banco,</tspan></text>
<text x="48" y="196.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F7F0FF">  como cliente, quiero retirar en el cajero.</tspan></text>
<text x="48" y="213.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="231.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Antecedentes:</tspan></text>
<text x="48" y="248.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dado</tspan><tspan fill="#F7F0FF"> que mi tarjeta es válida</tspan></text>
<text x="48" y="266.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="283.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Escenario:</tspan><tspan fill="#F7F0FF"> Saldo suficiente</tspan></text>
<text x="48" y="301.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dado</tspan><tspan fill="#F7F0FF"> que tengo 100 € en la cuenta</tspan></text>
<text x="48" y="318.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Cuando</tspan><tspan fill="#F7F0FF"> pido 20 €</tspan></text>
<text x="48" y="336.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Entonces</tspan><tspan fill="#F7F0FF"> recibo 20 €</tspan></text>
<text x="48" y="353.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Y</tspan><tspan fill="#F7F0FF"> se devuelve la tarjeta</tspan></text>
<text x="48" y="371.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="388.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Esquema del escenario:</tspan><tspan fill="#F7F0FF"> Límite de retiro</tspan></text>
<text x="48" y="406.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dado</tspan><tspan fill="#F7F0FF"> que tengo </tspan><tspan fill="#C9A7F5">&lt;saldo&gt;</tspan><tspan fill="#F7F0FF"> € en la cuenta</tspan></text>
<text x="48" y="423.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Cuando</tspan><tspan fill="#F7F0FF"> pido </tspan><tspan fill="#C9A7F5">&lt;monto&gt;</tspan><tspan fill="#F7F0FF"> €</tspan></text>
<text x="48" y="441.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Entonces</tspan><tspan fill="#F7F0FF"> el retiro es </tspan><tspan fill="#C9A7F5">&lt;resultado&gt;</tspan></text>
<text x="48" y="458.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">    Ejemplos:</tspan></text>
<text x="48" y="476.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      | saldo | monto | resultado |</tspan></text>
<text x="48" y="493.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      |   100 |   150 | rechazado |</tspan></text>
<text x="48" y="511.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      |   100 |   100 | aprobado  |</tspan></text>
<path d="M640 114.0 h8 V147.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 130.8 H656 V114.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="118.8" font-size="13" fill="#2B1B3D" font-weight="700">Idioma y etiquetas</text>
<text x="668.0" y="134.8" font-size="12.5" fill="#3E3350"># language define las palabras clave;</text>
<text x="668.0" y="150.8" font-size="12.5" fill="#3E3350">@etiqueta agrupa y filtra qué ejecutar</text>
<path d="M640 149.0 h8 V200.0 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 174.5 H656 V168.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="172.8" font-size="13" fill="#2B1B3D" font-weight="700">Característica</text>
<text x="668.0" y="188.8" font-size="12.5" fill="#3E3350">nombre en la misma línea y descripción</text>
<text x="668.0" y="204.8" font-size="12.5" fill="#3E3350">libre en las líneas siguientes</text>
<path d="M640 219.0 h8 V252.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 235.8 H656 V222.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="226.8" font-size="13" fill="#2B1B3D" font-weight="700">Antecedentes</text>
<text x="668.0" y="242.8" font-size="12.5" fill="#3E3350">pasos válidos para todos</text>
<text x="668.0" y="258.8" font-size="12.5" fill="#3E3350">los escenarios del archivo</text>
<path d="M640 271.5 h8 V357.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 314.5 H656 V298.5 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="302.5" font-size="13" fill="#2B1B3D" font-weight="700">Escenario</text>
<text x="668.0" y="318.5" font-size="12.5" fill="#3E3350">Dado: contexto · Cuando: acción</text>
<text x="668.0" y="334.5" font-size="12.5" fill="#3E3350">Entonces: resultado · Y/Pero: otros pasos</text>
<path d="M640 376.5 h8 V515.0 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 445.8 H656 V421.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="425.8" font-size="13" fill="#2B1B3D" font-weight="700">Esquema del escenario</text>
<text x="668.0" y="441.8" font-size="12.5" fill="#3E3350">los &lt;marcadores&gt; toman los valores</text>
<text x="668.0" y="457.8" font-size="12.5" fill="#3E3350">de cada fila de los Ejemplos: cada</text>
<text x="668.0" y="473.8" font-size="12.5" fill="#3E3350">fila es un nuevo escenario</text>
</svg>
