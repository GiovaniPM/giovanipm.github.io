<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dal piano al valore: ambito, tempi, costi e qualità</title>
<desc id="d">Grafico a quattro quadranti che riassume l’articolo, con il valore al centro. Ambito: ieri, fissato all’inizio e protetto da un comitato di controllo delle modifiche; domani, un’ipotesi aggiustata in base ai risultati misurati a ogni ciclo, con OKR e #NoProjects. Tempi: ieri, data di fine progetto, cronoprogramma dettagliato e consegna in un grande lotto; domani, flusso continuo di piccoli rilasci con previsioni basate sui dati, con Flow Framework e IA. Costi: ieri, budget annuale per progetto approvato una volta; domani, finanziamento continuo per flusso di valore rivisto ogni trimestre, con Beyond Budgeting e Lean Portfolio Management. Qualità: ieri, verificata alla fine ed ereditata da un team di manutenzione; domani, integrata nel flusso, con team stabili titolari del prodotto e debiti visibili, con Team Topologies e Flow Framework.</desc>
