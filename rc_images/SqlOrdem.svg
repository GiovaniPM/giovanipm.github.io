<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 506" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">A ordem em que você escreve não é a ordem em que o banco pensa</title>
<desc id="d">À esquerda, as cláusulas na ordem em que são escritas: SELECT, FROM, WHERE, GROUP BY, HAVING e ORDER BY. À direita, a ordem lógica de avaliação: FROM e JOIN, WHERE, GROUP BY, HAVING, SELECT e ORDER BY. Linhas ligam cada cláusula à sua posição, mostrando que o SELECT passa da primeira para a quinta posição.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="506" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">A ordem em que você escreve não é a ordem em que o banco pensa</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">O SELECT vem primeiro no texto, mas é avaliado quase no fim</text>
<text x="240.0" y="112.0" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">Ordem de escrita</text>
<text x="760.0" y="112.0" font-size="15" fill="#C2185B" text-anchor="middle" font-weight="700" xml:space="preserve">Ordem lógica de avaliação</text>
<rect x="120.0" y="130.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.2"/><circle cx="98" cy="149" r="11" fill="#C2185B" stroke="#FFFFFF" stroke-width="2"/><text x="98.0" y="153.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">1</text><text x="136.0" y="155.0" font-size="16" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">SELECT</text>
<path d="M366 149 C 500 149, 500 357, 632 357" fill="none" stroke="#C2185B" stroke-width="2.2" marker-end="url(#am)" opacity="0.85"/>
<rect x="120.0" y="182.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.2"/><circle cx="98" cy="201" r="11" fill="#3A86FF" stroke="#FFFFFF" stroke-width="2"/><text x="98.0" y="205.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">2</text><text x="136.0" y="207.0" font-size="16" fill="#3A86FF" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">FROM</text>
<path d="M366 201 C 500 201, 500 149, 632 149" fill="none" stroke="#3A86FF" stroke-width="2.2" marker-end="url(#am)" opacity="0.85"/>
<rect x="120.0" y="234.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.2"/><circle cx="98" cy="253" r="11" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="2"/><text x="98.0" y="257.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">3</text><text x="136.0" y="259.0" font-size="16" fill="#2A9D8F" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">WHERE</text>
<path d="M366 253 C 500 253, 500 201, 632 201" fill="none" stroke="#2A9D8F" stroke-width="2.2" marker-end="url(#am)" opacity="0.85"/>
<rect x="120.0" y="286.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#B35300" stroke-width="2.2"/><circle cx="98" cy="305" r="11" fill="#B35300" stroke="#FFFFFF" stroke-width="2"/><text x="98.0" y="309.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">4</text><text x="136.0" y="311.0" font-size="16" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">GROUP BY</text>
<path d="M366 305 C 500 305, 500 253, 632 253" fill="none" stroke="#B35300" stroke-width="2.2" marker-end="url(#am)" opacity="0.85"/>
<rect x="120.0" y="338.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.2"/><circle cx="98" cy="357" r="11" fill="#FF6B6B" stroke="#FFFFFF" stroke-width="2"/><text x="98.0" y="361.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">5</text><text x="136.0" y="363.0" font-size="16" fill="#FF6B6B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">HAVING</text>
<path d="M366 357 C 500 357, 500 305, 632 305" fill="none" stroke="#FF6B6B" stroke-width="2.2" marker-end="url(#am)" opacity="0.85"/>
<rect x="120.0" y="390.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.2"/><circle cx="98" cy="409" r="11" fill="#5B2A86" stroke="#FFFFFF" stroke-width="2"/><text x="98.0" y="413.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">6</text><text x="136.0" y="415.0" font-size="16" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">ORDER BY</text>
<path d="M366 409 C 500 409, 500 409, 632 409" fill="none" stroke="#5B2A86" stroke-width="2.2" marker-end="url(#am)" opacity="0.85"/>
<rect x="640.0" y="130.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.2"/><circle cx="902" cy="149" r="11" fill="#3A86FF" stroke="#FFFFFF" stroke-width="2"/><text x="902.0" y="153.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">1</text><text x="656.0" y="155.0" font-size="16" fill="#3A86FF" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">FROM / JOIN</text>
<text x="924.0" y="154.0" font-size="12" fill="#2B1B3D" xml:space="preserve"></text>
<rect x="640.0" y="182.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.2"/><circle cx="902" cy="201" r="11" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="2"/><text x="902.0" y="205.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">2</text><text x="656.0" y="207.0" font-size="16" fill="#2A9D8F" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">WHERE</text>
<text x="924.0" y="206.0" font-size="12" fill="#2B1B3D" xml:space="preserve"></text>
<rect x="640.0" y="234.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#B35300" stroke-width="2.2"/><circle cx="902" cy="253" r="11" fill="#B35300" stroke="#FFFFFF" stroke-width="2"/><text x="902.0" y="257.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">3</text><text x="656.0" y="259.0" font-size="16" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">GROUP BY</text>
<text x="924.0" y="258.0" font-size="12" fill="#2B1B3D" xml:space="preserve"></text>
<rect x="640.0" y="286.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.2"/><circle cx="902" cy="305" r="11" fill="#FF6B6B" stroke="#FFFFFF" stroke-width="2"/><text x="902.0" y="309.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">4</text><text x="656.0" y="311.0" font-size="16" fill="#FF6B6B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">HAVING</text>
<text x="924.0" y="310.0" font-size="12" fill="#2B1B3D" xml:space="preserve"></text>
<rect x="640.0" y="338.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.2"/><circle cx="902" cy="357" r="11" fill="#C2185B" stroke="#FFFFFF" stroke-width="2"/><text x="902.0" y="361.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">5</text><text x="656.0" y="363.0" font-size="16" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">SELECT</text>
<text x="924.0" y="362.0" font-size="12" fill="#2B1B3D" xml:space="preserve"></text>
<rect x="640.0" y="390.0" width="240.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.2"/><circle cx="902" cy="409" r="11" fill="#5B2A86" stroke="#FFFFFF" stroke-width="2"/><text x="902.0" y="413.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">6</text><text x="656.0" y="415.0" font-size="16" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">ORDER BY</text>
<text x="924.0" y="414.0" font-size="12" fill="#2B1B3D" xml:space="preserve"></text>
<text x="500.0" y="452.0" font-size="14" fill="#3E3350" text-anchor="middle" xml:space="preserve">Por isso um apelido criado no SELECT não pode ser usado no WHERE, mas pode no ORDER BY.</text>
<text x="500.0" y="474.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">É a ordem lógica; o otimizador pode executar de outro jeito, desde que o resultado seja o mesmo.</text>
</svg>
