<text x="52" y="319" font-size="18" font-weight="bold" text-anchor="middle">L</text><rect x="80" y="305" width="125.1" height="20" rx="4" fill="#0E8074"/><text x="213.1" y="320" font-size="15">4,7%</text><rect x="560" y="309" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="309" width="122.1" height="12" rx="6" fill="#5B2A86"/><text x="960" y="320" font-size="15" text-anchor="end">37%</text>
<text x="52" y="349" font-size="18" font-weight="bold" text-anchor="middle">S</text><rect x="80" y="335" width="111.8" height="20" rx="4" fill="#0E8074"/><text x="199.8" y="350" font-size="15">4,2%</text><rect x="560" y="339" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="339" width="112.2" height="12" rx="6" fill="#5B2A86"/><text x="960" y="350" font-size="15" text-anchor="end">34%</text>
<text x="52" y="379" font-size="18" font-weight="bold" text-anchor="middle">M</text><rect x="80" y="365" width="87.8" height="20" rx="4" fill="#0E8074"/><text x="175.8" y="380" font-size="15">3,3%</text><rect x="560" y="369" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="369" width="95.7" height="12" rx="6" fill="#5B2A86"/><text x="960" y="380" font-size="15" text-anchor="end">29%</text>
<text x="52" y="409" font-size="18" font-weight="bold" text-anchor="middle">P</text><rect x="80" y="395" width="69.2" height="20" rx="4" fill="#0E8074"/><text x="157.2" y="410" font-size="15">2,6%</text><rect x="560" y="399" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="399" width="75.9" height="12" rx="6" fill="#5B2A86"/><text x="960" y="410" font-size="15" text-anchor="end">23%</text>
