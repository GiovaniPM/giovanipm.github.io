<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" width="1000" height="442" role="img" aria-labelledby="t d">
<title id="t">Lettere più frequenti nelle 3000 parole italiane</title>
<desc id="d">Percentuale di ogni lettera sul totale delle lettere delle 3000 parole italiane del gioco, senza accenti, e percentuale delle parole che contengono la lettera almeno una volta: A 12,4% / 80%; O 11,2% / 77%; I 11,2% / 76%; E 9,7% / 69%; T 8,0% / 58%; N 7,4% / 57%; R 7,0% / 58%; C 5,1% / 40%; L 4,7% / 37%; S 4,2% / 34%; M 3,3% / 29%; P 2,6% / 23%.</desc>
<rect width="1000" height="442" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="40" y="44" font-size="14" fill="#756986">lettera</text><text x="470" y="44" font-size="14" fill="#756986" text-anchor="end">delle lettere</text><text x="960" y="44" font-size="14" fill="#756986" text-anchor="end">delle parole la hanno</text>
<text x="52" y="79" font-size="18" font-weight="bold" text-anchor="middle">A</text><rect x="80" y="65" width="330.0" height="20" rx="4" fill="#0E8074"/><text x="418.0" y="80" font-size="15">12,4%</text><rect x="560" y="69" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="69" width="264.0" height="12" rx="6" fill="#5B2A86"/><text x="960" y="80" font-size="15" text-anchor="end">80%</text>
<text x="52" y="109" font-size="18" font-weight="bold" text-anchor="middle">O</text><rect x="80" y="95" width="298.1" height="20" rx="4" fill="#0E8074"/><text x="386.1" y="110" font-size="15">11,2%</text><rect x="560" y="99" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="99" width="254.1" height="12" rx="6" fill="#5B2A86"/><text x="960" y="110" font-size="15" text-anchor="end">77%</text>
<text x="52" y="139" font-size="18" font-weight="bold" text-anchor="middle">I</text><rect x="80" y="125" width="298.1" height="20" rx="4" fill="#0E8074"/><text x="386.1" y="140" font-size="15">11,2%</text><rect x="560" y="129" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="129" width="250.8" height="12" rx="6" fill="#5B2A86"/><text x="960" y="140" font-size="15" text-anchor="end">76%</text>
<text x="52" y="169" font-size="18" font-weight="bold" text-anchor="middle">E</text><rect x="80" y="155" width="258.1" height="20" rx="4" fill="#0E8074"/><text x="346.1" y="170" font-size="15">9,7%</text><rect x="560" y="159" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="159" width="227.7" height="12" rx="6" fill="#5B2A86"/><text x="960" y="170" font-size="15" text-anchor="end">69%</text>
<text x="52" y="199" font-size="18" font-weight="bold" text-anchor="middle">T</text><rect x="80" y="185" width="212.9" height="20" rx="4" fill="#0E8074"/><text x="300.9" y="200" font-size="15">8,0%</text><rect x="560" y="189" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="189" width="191.4" height="12" rx="6" fill="#5B2A86"/><text x="960" y="200" font-size="15" text-anchor="end">58%</text>
<text x="52" y="229" font-size="18" font-weight="bold" text-anchor="middle">N</text><rect x="80" y="215" width="196.9" height="20" rx="4" fill="#0E8074"/><text x="284.9" y="230" font-size="15">7,4%</text><rect x="560" y="219" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="219" width="188.1" height="12" rx="6" fill="#5B2A86"/><text x="960" y="230" font-size="15" text-anchor="end">57%</text>
<text x="52" y="259" font-size="18" font-weight="bold" text-anchor="middle">R</text><rect x="80" y="245" width="186.3" height="20" rx="4" fill="#0E8074"/><text x="274.3" y="260" font-size="15">7,0%</text><rect x="560" y="249" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="249" width="191.4" height="12" rx="6" fill="#5B2A86"/><text x="960" y="260" font-size="15" text-anchor="end">58%</text>
