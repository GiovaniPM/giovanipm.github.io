<text x="60" y="392" font-size="11.5" fill="#756986" font-style="italic">input size</text>
<rect x="220" y="346" width="236" height="52" rx="10" fill="#2A9D8F"/>
<text x="338" y="378" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">&lt; 1 millisecond</text>
