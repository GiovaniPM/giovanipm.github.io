<text x="582" y="258" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">1.0 ms</text>
<rect x="708" y="226" width="236" height="52" rx="10" fill="#F4845F"/>
<text x="826" y="258" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">77 years</text>
<text x="60" y="314" font-size="17" fill="#2B1B3D" font-weight="700">n = 30</text>
