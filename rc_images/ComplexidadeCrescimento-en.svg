<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">When the number of steps explodes</title>
<desc id="d">Color table with the time needed, on a computer doing 1 billion steps per second, for algorithms taking n squared, 2 to the n and n factorial steps, with n equal to 10, 20, 30, 50 and 100. n = 10: n², &lt; 1 millisecond; 2ⁿ, &lt; 1 millisecond; n!, 3.6 ms. n = 20: n², &lt; 1 millisecond; 2ⁿ, 1.0 ms; n!, 77 years. n = 30: n², &lt; 1 millisecond; 2ⁿ, 1.1 s; n!, 10¹⁵ years. n = 50: n², &lt; 1 millisecond; 2ⁿ, 13 days; n!, 10⁴⁷ years. n = 100: n², &lt; 1 millisecond; 2ⁿ, 40 trillion years; n!, 10¹⁴¹ years.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">When the number of steps explodes</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Time on a computer doing 1 billion steps per second</text>
<rect x="220" y="96" width="236" height="60" rx="10" fill="#5B2A86"/>
<text x="338" y="124" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">n²</text>
<text x="338" y="146" font-size="12.5" fill="#E9DDF5" text-anchor="middle" font-style="italic">compare every pair</text>
<rect x="464" y="96" width="236" height="60" rx="10" fill="#5B2A86"/>
<text x="582" y="124" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">2ⁿ</text>
<text x="582" y="146" font-size="12.5" fill="#E9DDF5" text-anchor="middle" font-style="italic">try every combination</text>
<rect x="708" y="96" width="236" height="60" rx="10" fill="#5B2A86"/>
<text x="826" y="124" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">n!</text>
<text x="826" y="146" font-size="12.5" fill="#E9DDF5" text-anchor="middle" font-style="italic">try every ordering</text>
<text x="60" y="194" font-size="17" fill="#2B1B3D" font-weight="700">n = 10</text>
<text x="60" y="212" font-size="11.5" fill="#756986" font-style="italic">input size</text>
<rect x="220" y="166" width="236" height="52" rx="10" fill="#2A9D8F"/>
<text x="338" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">&lt; 1 millisecond</text>
<rect x="464" y="166" width="236" height="52" rx="10" fill="#2A9D8F"/>
<text x="582" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">&lt; 1 millisecond</text>
<rect x="708" y="166" width="236" height="52" rx="10" fill="#2A9D8F"/>
<text x="826" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">3.6 ms</text>
<text x="60" y="254" font-size="17" fill="#2B1B3D" font-weight="700">n = 20</text>
<text x="60" y="272" font-size="11.5" fill="#756986" font-style="italic">input size</text>
<rect x="220" y="226" width="236" height="52" rx="10" fill="#2A9D8F"/>
