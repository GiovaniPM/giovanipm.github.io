<rect x="292.0" y="488" width="18" height="18" rx="4" fill="#F4845F"/><text x="316" y="502" font-size="12.5" fill="#2B1B3D">under 100 years</text>
<rect x="441.0" y="488" width="18" height="18" rx="4" fill="#E23B3B"/><text x="465" y="502" font-size="12.5" fill="#2B1B3D">over 100 years</text>
<rect x="583.4" y="488" width="18" height="18" rx="4" fill="#2B1B3D"/><text x="607.4" y="502" font-size="12.5" fill="#2B1B3D">longer than the age of the universe</text>
</svg>
