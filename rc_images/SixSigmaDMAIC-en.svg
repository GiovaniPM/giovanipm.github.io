<text x="500.0" y="460.0" font-size="14" fill="#5B2A86" text-anchor="middle" font-weight="700">continuous improvement: the controlled process is the base of the next cycle</text>
<text x="500.0" y="505.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">DMAIC projects usually last 3 to 6 months; every phase transition is reviewed at a “tollgate”.</text>
