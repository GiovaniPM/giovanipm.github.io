<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">DMAIC: the five phases of process improvement</title>
<desc id="d">Five columns linked by arrows, one per DMAIC phase. Define: what is the problem and for whom, with project charter, SIPOC, CTQ tree and voice of the customer. Measure: how big is it, with data collection plan, DPMO, FMEA and capability. Analyze: what is the root cause, with Ishikawa, 5 whys, Pareto and scatter diagram. Improve: how to remove the cause, with affinity diagram, criteria matrix, pilot and poka-yoke. Control: how to keep the gain, with control chart, standardization, response plan and process owner. A dashed arrow goes back from Control to Define.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
