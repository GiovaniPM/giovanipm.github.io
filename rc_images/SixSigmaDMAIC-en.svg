<text x="50.0" y="356.0" font-size="13" fill="#2B1B3D">CTQ tree</text>
<circle cx="40" cy="378" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="382.0" font-size="13" fill="#2B1B3D">Voice of customer</text>
