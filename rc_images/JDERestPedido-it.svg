<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Esempio: creare un ordine di acquisto e consultarne lo stato via REST</title>
<desc id="d">Due corsie. Creare l'ordine: il sistema acquisti fa POST sull'orchestrazione ORCH_PO_Create con fornitore, filiale, articolo, quantità, costo e riferimento esterno; l'orchestrazione esegue una form request sull'applicazione P4310, form W4310A, versione ZJDE0001, compilando testata e griglia e premendo OK; la master business function scrive la testata in F4301 e le righe in F4311; la risposta restituisce numero e tipo dell'ordine. Consultare lo stato: il sistema fa POST sull'orchestrazione ORCH_PO_Status con il numero d'ordine; l'orchestrazione esegue una data request sulla tabella F4311 filtrando per DOCO e DCTO; la risposta riporta, per riga, l'ultimo stato LTTR, lo stato successivo NXTR e le quantità.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="600" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="42.0" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Esempio: ordine di acquisto via REST</text>
<text x="500.0" y="68.0" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Due orchestrazioni: una crea l'ordine, l'altra consulta lo stato delle righe</text>
<rect x="20" y="96" width="960" height="228" rx="14" fill="none" stroke="#E6D3BC" stroke-width="1.5"/>
<text x="40.0" y="122.0" font-size="15" fill="#5B2A86" text-anchor="start" font-weight="700">Creare l'ordine</text>
<rect x="35" y="138" width="210" height="110" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="140.0" y="188.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistema acquisti</text>
<text x="140.0" y="207.2" font-size="12.5" fill="#3E3350" text-anchor="middle">portale o iPaaS</text>
<rect x="275" y="138" width="210" height="110" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="380.0" y="170.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">ORCH_PO_Create</text>
<text x="380.0" y="188.8" font-size="12.5" fill="#3E3350" text-anchor="middle">POST /v3/orchestrator</text>
<text x="380.0" y="207.2" font-size="12.5" fill="#3E3350" text-anchor="middle">fornitore, filiale, articolo,</text>
<text x="380.0" y="225.8" font-size="12.5" fill="#3E3350" text-anchor="middle">qtà, costo, riferimento</text>
<rect x="515" y="138" width="210" height="110" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="620.0" y="170.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Form request</text>
<text x="620.0" y="188.8" font-size="12.5" fill="#3E3350" text-anchor="middle">P4310_W4310A</text>
<text x="620.0" y="207.2" font-size="12.5" fill="#3E3350" text-anchor="middle">versione ZJDE0001</text>
<text x="620.0" y="225.8" font-size="12.5" fill="#3E3350" text-anchor="middle">testata + griglia + OK</text>
<rect x="755" y="138" width="210" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="860.0" y="170.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tabelle</text>
<text x="860.0" y="188.8" font-size="12.5" fill="#3E3350" text-anchor="middle">F4301 (testata)</text>
<text x="860.0" y="207.2" font-size="12.5" fill="#3E3350" text-anchor="middle">F4311 (righe)</text>
<text x="860.0" y="225.8" font-size="12.5" fill="#3E3350" text-anchor="middle">tramite MBF acquisti</text>
<polyline points="245,193 273,193" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="485,193 513,193" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="725,193 753,193" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="860,248 860,286 140,286 140,250" fill="none" stroke="#0E8074" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
<text x="500.0" y="308.0" font-size="12.5" fill="#0E8074" text-anchor="middle" font-weight="700" font-family="Consolas, 'Courier New', monospace">{ "OrderNumber": "4450", "OrderType": "OP" }</text>
<rect x="20" y="336" width="960" height="228" rx="14" fill="none" stroke="#E6D3BC" stroke-width="1.5"/>
<text x="40.0" y="362.0" font-size="15" fill="#5B2A86" text-anchor="start" font-weight="700">Consultare lo stato</text>
<rect x="35" y="378" width="210" height="110" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="140.0" y="428.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistema acquisti</text>
<text x="140.0" y="447.2" font-size="12.5" fill="#3E3350" text-anchor="middle">polling o su richiesta</text>
<rect x="275" y="378" width="210" height="110" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="380.0" y="410.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">ORCH_PO_Status</text>
<text x="380.0" y="428.8" font-size="12.5" fill="#3E3350" text-anchor="middle">POST /v3/orchestrator</text>
<text x="380.0" y="447.2" font-size="12.5" fill="#3E3350" text-anchor="middle">{ "OrderNumber": "4450",</text>
<text x="380.0" y="465.8" font-size="12.5" fill="#3E3350" text-anchor="middle">"OrderType": "OP" }</text>
<rect x="515" y="378" width="210" height="110" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="620.0" y="410.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Data request</text>
<text x="620.0" y="428.8" font-size="12.5" fill="#3E3350" text-anchor="middle">tabella F4311</text>
<text x="620.0" y="447.2" font-size="12.5" fill="#3E3350" text-anchor="middle">filtro DOCO e DCTO</text>
<text x="620.0" y="465.8" font-size="12.5" fill="#3E3350" text-anchor="middle">sola lettura</text>
<rect x="755" y="378" width="210" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="860.0" y="410.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Risultato per riga</text>
<text x="860.0" y="428.8" font-size="12.5" fill="#3E3350" text-anchor="middle">LNID, LITM</text>
<text x="860.0" y="447.2" font-size="12.5" fill="#3E3350" text-anchor="middle">LTTR / NXTR</text>
<text x="860.0" y="465.8" font-size="12.5" fill="#3E3350" text-anchor="middle">UORG, UREC, AOPN</text>
<polyline points="245,433 273,433" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="485,433 513,433" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="725,433 753,433" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="860,488 860,526 140,526 140,490" fill="none" stroke="#0E8074" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
<text x="500.0" y="548.0" font-size="12.5" fill="#0E8074" text-anchor="middle" font-weight="700" font-family="Consolas, 'Courier New', monospace">[ { "Line": 1.000, "LastStatus": "220", "NextStatus": "230" } ]</text>
</svg>
