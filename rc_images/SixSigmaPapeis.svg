<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quem é quem num programa Six Sigma</title>
<desc id="d">Pirâmide com cinco camadas. No topo, liderança e patrocinador, que define metas, escolhe projetos e remove barreiras. Depois, Master Black Belt, que treina e orienta os Black Belts. Black Belt, com dedicação integral, lidera projetos DMAIC. Green Belt, em tempo parcial, lidera projetos menores ou apoia o Black Belt. Na base, membros da equipe e o dono do processo, que mantém o ganho.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Quem é quem num programa Six Sigma</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Os papéis da organização e as “faixas”, emprestadas das artes marciais</text>
<path d="M245.0 100 L395.0 100 L436.2 166 L203.8 166 Z" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="320.0" y="138.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Liderança</text>
<line x1="444.2" y1="133.0" x2="648" y2="133.0" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="660.0" y="129.0" font-size="13.5" fill="#2B1B3D" font-weight="700">Liderança e patrocinador (champion)</text>
<text x="660.0" y="148.0" font-size="12.5" fill="#3E3350">define metas, escolhe projetos, remove barreiras</text>
<path d="M200.0 172 L440.0 172 L481.2 238 L158.8 238 Z" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<text x="320.0" y="210.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Master Black Belt</text>
<line x1="489.2" y1="205.0" x2="648" y2="205.0" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="660.0" y="201.0" font-size="13.5" fill="#2B1B3D" font-weight="700">Master Black Belt</text>
<text x="660.0" y="220.0" font-size="12.5" fill="#3E3350">treina e orienta Black Belts; resolve questões técnicas</text>
<path d="M155.0 244 L485.0 244 L526.2 310 L113.8 310 Z" fill="#1B1B1B" stroke="#2B1B3D" stroke-width="2"/>
<text x="320.0" y="282.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Black Belt</text>
<line x1="534.2" y1="277.0" x2="648" y2="277.0" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="660.0" y="273.0" font-size="13.5" fill="#2B1B3D" font-weight="700">Black Belt</text>
<text x="660.0" y="292.0" font-size="12.5" fill="#3E3350">dedicação integral; lidera projetos DMAIC</text>
<path d="M110.0 316 L530.0 316 L571.2 382 L68.8 382 Z" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<text x="320.0" y="354.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Green Belt</text>
<line x1="579.2" y1="349.0" x2="648" y2="349.0" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="660.0" y="345.0" font-size="13.5" fill="#2B1B3D" font-weight="700">Green Belt</text>
<text x="660.0" y="364.0" font-size="12.5" fill="#3E3350">tempo parcial; lidera projetos menores ou apoia o BB</text>
<path d="M65.0 388 L575.0 388 L616.2 454 L23.8 454 Z" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="2"/>
<text x="320.0" y="426.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Equipe e dono do processo</text>
<line x1="624.2" y1="421.0" x2="648" y2="421.0" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="660.0" y="417.0" font-size="13.5" fill="#2B1B3D" font-weight="700">Membros da equipe e dono do processo</text>
<text x="660.0" y="436.0" font-size="12.5" fill="#3E3350">executam o projeto; o dono mantém o ganho depois</text>
<text x="500.0" y="490.0" font-size="13" fill="#3E3350" text-anchor="middle">As faixas medem experiência; não substituem os papéis de patrocinador, líder de equipe ou dono do processo.</text>
<text x="500.0" y="512.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Muitas empresas usam também Yellow Belts, com formação básica, na base da pirâmide.</text>
</svg>
