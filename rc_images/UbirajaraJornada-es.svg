<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">La jornada: nueve actos y seis finales</title>
<desc id="d">Los nueve actos del juego siguen los capítulos de la novela. Acto I, El cazador: caza en los campos, la carrera tras Araci, la flecha del desafío y los dos duelos con Pojucã; perder un duelo lleva al final Cautivo de Pojucã. Acto II, El guerrero: el gran arco de los araguaias. Acto III, La novia. Acto IV, La hospitalidad: la subida del río. Acto V, Siervo del amor: los trabajos para Itaquê. Acto VI, El combate nupcial: Cori, el tronco, el cántaro de hormigas; si la suma de afecto de Araci, mérito y la mitad del servicio queda por debajo de 9, el final es La virgen no eligió. Acto VII, La guerra: llevarse a Araci de noche lleva al final La traición. Acto VIII, La batalla. Acto IX, La unión de los arcos: con honor por debajo de 5 el final es Sin honor, sin unión; perder ante Agniná lleva a La caída del héroe; vencer lleva a La leyenda de Ubirajara.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
