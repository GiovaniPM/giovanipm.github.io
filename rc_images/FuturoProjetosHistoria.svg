<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Uma breve história da gestão de projetos</title>
<desc id="d">Linha do tempo da gestão de projetos: anos 1910, Henry Gantt cria o gráfico de barras; 1942, Projeto Manhattan; 1957 e 1958, CPM na DuPont e PERT no programa Polaris; 1965 a 1969, fundação do IPMA e do PMI; 1970, Royce descreve o modelo em cascata; 1994 e 1995, relatório CHAOS e Scrum; 1996, primeira edição do PMBOK e PRINCE2; 2001, Manifesto Ágil; 2021, PMBOK 7 baseado em princípios e valor; 2025, PMBOK 8 e IA na gestão. Três eras: engenharia e defesa, profissionalização, ágil e valor.</desc>
<rect width="1000" height="510" rx="18" fill="#FFF7EC"/>
<text x="500" y="52" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Uma breve história da gestão de projetos</text>
<rect x="40" y="262" width="282" height="16" fill="#3A86FF"/>
