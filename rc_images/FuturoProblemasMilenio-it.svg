<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">I sette Problemi del Millennio</title>
<desc id="d">Sette schede con i Problemi del Millennio del Clay Mathematics Institute, del 2000, ciascuno con un premio di 1 milione di dollari. Aperti: l’ipotesi di Riemann, sulla distribuzione dei numeri primi; P contro NP, se verificare una risposta è facile quanto trovarla; Navier–Stokes, sulle equazioni dei fluidi; Yang–Mills e il gap di massa, base matematica della fisica delle particelle; la congettura di Hodge; e Birch e Swinnerton-Dyer, sulle curve ellittiche. Risolto: la congettura di Poincaré, da Perelman nel 2003, che ha rifiutato il premio nel 2010.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">I sette Problemi del Millennio</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Clay Mathematics Institute, 2000 · 1 milione di dollari per problema</text>
<rect x="76" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="176" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ipotesi di Riemann</text>
<text x="176" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Come si distribuiscono</text>
<text x="176" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">i numeri primi</text>
<rect x="144.4" y="224" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="176" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Aperto</text>
<rect x="292" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="392" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">P contro NP</text>
<text x="392" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Verificare una risposta è</text>
<text x="392" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">facile quanto trovarla?</text>
<rect x="360.4" y="224" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="392" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Aperto</text>
<rect x="508" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="608" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Navier–Stokes</text>
<text x="608" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Le equazioni dei fluidi</text>
<text x="608" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">hanno sempre soluzioni lisce?</text>
<rect x="576.4" y="224" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="608" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Aperto</text>
<rect x="724" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="824" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Yang–Mills e il</text>
<text x="824" y="149" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">gap di massa</text>
<text x="824" y="176" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">La base matematica</text>
<text x="824" y="193" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">della fisica delle particelle</text>
<rect x="792.4" y="224" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="824" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Aperto</text>
<rect x="184" y="276" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="284" y="306" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Congettura di Hodge</text>
<text x="284" y="333" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Forme geometriche</text>
<text x="284" y="350" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">descritte dall’algebra</text>
<rect x="252.4" y="400" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="284" y="416" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Aperto</text>
<rect x="400" y="276" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="500" y="306" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Birch e</text>
<text x="500" y="325" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Swinnerton-Dyer</text>
<text x="500" y="352" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Soluzioni razionali</text>
<text x="500" y="369" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">delle curve ellittiche</text>
<rect x="468.4" y="400" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="500" y="416" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Aperto</text>
<rect x="616" y="276" width="200" height="158" rx="12" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="716" y="306" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Congettura di Poincaré</text>
<text x="716" y="333" font-size="12.5" fill="#E6F5F2" text-anchor="middle" font-style="italic">Caratterizza la sfera</text>
<text x="716" y="350" font-size="12.5" fill="#E6F5F2" text-anchor="middle" font-style="italic">in tre dimensioni</text>
<text x="716" y="373" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Perelman, 2003</text>
<rect x="680.8" y="400" width="70.4" height="22" rx="11" fill="#FFFFFF"/>
<text x="716" y="416" font-size="12" fill="#2A9D8F" text-anchor="middle" font-weight="700">Risolto</text>
<text x="500" y="478" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">6 su 7 restano aperti. Perelman ha rifiutato il premio nel 2010.</text>
</svg>
