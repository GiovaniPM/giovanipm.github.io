<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Distopias científicas e o que já chegou</title>
<desc id="d">Faixa que vai da distopia à utopia, com quatro obras. 1984, publicado em 1949 e ambientado em 1984: vigilância total e controle da linguagem; já chegaram câmeras com reconhecimento facial e o capitalismo de vigilância. Matrix, de 1999, ambientado por volta de 2199: realidade simulada controlada por máquinas; já chegaram a realidade virtual e o argumento da simulação de Bostrom, de 2003. Blade Runner, de 1982, ambientado em 2019: androides indistinguíveis de humanos; já chegaram robôs humanoides, deepfakes e a dúvida sobre quem é humano. Star Trek, de 1966, ambientado no século 23: utopia de abundância e exploração; já chegaram celular, tablet, tradução simultânea e o tricorder do XPRIZE de 2017.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
