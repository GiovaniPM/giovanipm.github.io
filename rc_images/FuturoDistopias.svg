<text x="153.5" y="205" font-size="12" fill="#FFFFFF" text-anchor="middle" font-style="italic">1949 · ambientado em 1984</text>
<text x="67" y="250" font-size="11.5" fill="#756986" font-weight="700">TEMA</text>
