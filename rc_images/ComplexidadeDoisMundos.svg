<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dois futuros possíveis</title>
<desc id="d">Dois painéis. Se P for igual a NP, resolver seria tão fácil quanto verificar: remédios e materiais seriam projetados rapidamente e computadores achariam provas matemáticas, mas a criptografia de hoje ficaria vulnerável e a criatividade perderia o seu salto. Se P for diferente de NP, existem problemas intrinsecamente difíceis: senhas e bancos continuam protegidos, sabemos onde estão os limites, e problemas difíceis pedem atalhos, como aproximações e heurísticas. Embaixo, a enquete de 2019 com 124 respostas: cerca de 80% acham que P é diferente de NP; entre quem mais estudou o problema, 99%; e 66% acham que ele será resolvido antes de 2100.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="505" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Dois futuros possíveis</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">O que muda se a resposta for sim, e o que muda se for não</text>
<rect x="50" y="96" width="420" height="250" rx="14" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<path d="M50 110 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v36 h-420 z" fill="#FFB703"/>
<text x="260" y="120" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Se P = NP</text>
<text x="260" y="139" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-style="italic">resolver seria tão fácil quanto verificar</text>
<circle cx="82" cy="179" r="12" fill="#2A9D8F"/><text x="82" y="184" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="106" y="184" font-size="14.5" fill="#2B1B3D">Remédios e materiais projetados rapidamente</text>
<circle cx="82" cy="217" r="12" fill="#2A9D8F"/><text x="82" y="222" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="106" y="222" font-size="14.5" fill="#2B1B3D">Computadores achariam provas matemáticas</text>
<circle cx="82" cy="255" r="12" fill="#E23B3B"/><text x="82" y="260" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">−</text>
<text x="106" y="260" font-size="14.5" fill="#2B1B3D">A criptografia de hoje ficaria vulnerável</text>
<circle cx="82" cy="293" r="12" fill="#5B2A86"/><text x="82" y="298" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="106" y="298" font-size="14.5" fill="#2B1B3D">A criatividade perderia o seu “salto”</text>
<rect x="530" y="96" width="420" height="250" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M530 110 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v36 h-420 z" fill="#2A9D8F"/>
<text x="740" y="120" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Se P ≠ NP</text>
<text x="740" y="139" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">existem problemas intrinsecamente difíceis</text>
<circle cx="562" cy="179" r="12" fill="#2A9D8F"/><text x="562" y="184" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="586" y="184" font-size="14.5" fill="#2B1B3D">Senhas e bancos continuam protegidos</text>
<circle cx="562" cy="217" r="12" fill="#2A9D8F"/><text x="562" y="222" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="586" y="222" font-size="14.5" fill="#2B1B3D">Sabemos onde estão os limites</text>
<circle cx="562" cy="255" r="12" fill="#3A86FF"/><text x="562" y="260" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">•</text>
<text x="586" y="260" font-size="14.5" fill="#2B1B3D">Problemas difíceis pedem atalhos:</text>
<text x="586" y="298" font-size="14.5" fill="#2B1B3D">aproximações e heurísticas</text>
<text x="500" y="390" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">O que dizem os especialistas (enquete de 2019, 124 respostas)</text>
<rect x="100" y="406" width="640" height="40" rx="8" fill="#2A9D8F"/><rect x="740" y="406" width="160" height="40" rx="8" fill="#D9C9B4"/><text x="420" y="432" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">P ≠ NP: cerca de 80%</text>
<text x="820" y="432" font-size="13" fill="#2B1B3D" text-anchor="middle">outras respostas</text>
<text x="500" y="478" font-size="13.5" fill="#756986" text-anchor="middle" font-style="italic">Entre quem mais estudou o problema, 99% apostam em P ≠ NP. E 66% acham que ele será resolvido antes de 2100.</text>
</svg>
