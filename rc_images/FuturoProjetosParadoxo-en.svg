<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 586" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The scope paradox</title>
<desc id="d">Conceptual chart of the scope paradox. The horizontal axis shows the level of scope detail; the vertical axis, cost and value. The curve for the value of the delivery multiplied by time in use rises quickly at first and then almost flattens. The curve for the cost of defining the scope starts low and accelerates. Up to the sweet spot, detailing pays off; then comes a zone of diminishing returns; and when the cost of defining exceeds the value, you reach the paradox, where detailing costs more than it is worth. Rule of thumb: detail the scope only while the cost of defining is lower than value times time in use; beyond that point, fix the outcome with an OKR and discover the scope in short cycles. The curves are illustrative and do not represent measured data.</desc>
<rect width="1000" height="586" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">The scope paradox</text>
