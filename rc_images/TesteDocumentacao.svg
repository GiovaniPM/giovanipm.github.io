<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Do plano ao caso de teste, com rastreabilidade</title>
<desc id="d">À esquerda, uma hierarquia: o plano de teste gera o cenário login do usuário, que gera três casos de teste: senha válida entra, senha errada mostra mensagem e três erros bloqueiam a conta. À direita, uma matriz de rastreabilidade liga os requisitos REQ-01 a REQ-03 aos casos CT-01 a CT-03, e o REQ-03 está associado ao defeito BUG-17.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Do plano ao caso de teste, com rastreabilidade</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Um plano gera cenários, cada cenário gera casos, e a matriz liga tudo aos requisitos</text>
<rect x="30" y="100" width="420" height="64" rx="12" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="240" y="127" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Plano de teste</text>
<text x="240" y="150" font-size="13" fill="#FCE4F0" text-anchor="middle">estratégia · escopo · recursos · riscos · cronograma</text>
<line x1="240" y1="164" x2="240" y2="196" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<rect x="60" y="200" width="360" height="50" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="240" y="231" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cenário: login do usuário</text>
<path d="M80 250 V300 H96" stroke="#756986" stroke-width="2.5" fill="none" marker-end="url(#am)"/>
<rect x="100" y="280" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="114" y="306" font-size="14" fill="#B35300" font-weight="700">CT-01</text>
<text x="172" y="306" font-size="14" fill="#2B1B3D">senha válida → entra</text>
<path d="M80 250 V354 H96" stroke="#756986" stroke-width="2.5" fill="none" marker-end="url(#am)"/>
<rect x="100" y="334" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="114" y="360" font-size="14" fill="#B35300" font-weight="700">CT-02</text>
<text x="172" y="360" font-size="14" fill="#2B1B3D">senha errada → mensagem</text>
<path d="M80 250 V408 H96" stroke="#756986" stroke-width="2.5" fill="none" marker-end="url(#am)"/>
<rect x="100" y="388" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="114" y="414" font-size="14" fill="#B35300" font-weight="700">CT-03</text>
<text x="172" y="414" font-size="14" fill="#2B1B3D">3 erros → bloqueia a conta</text>
<text x="30" y="472" font-size="13" fill="#3E3350" font-weight="700">Cada caso de teste tem:</text>
<text x="30" y="492" font-size="13" fill="#756986">ID, pré-condições, passos, resultado esperado e resultado obtido</text>
<path d="M424 334 C 470 334, 480 280, 522 280" stroke="#2B1B3D" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="476" y="352" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">rastreia</text>
<text x="745.0" y="118" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Matriz de rastreabilidade</text>
<rect x="530" y="130" width="430" height="200" rx="10" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<path d="M530 174 h430" stroke="#2B1B3D" stroke-width="2"/>
<rect x="531.5" y="131.5" width="427" height="41" rx="9" fill="#FFF1C9"/>
<text x="605.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Requisito</text>
<text x="710.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">CT-01</text>
<line x1="680" y1="130" x2="680" y2="330" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="770.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">CT-02</text>
<line x1="740" y1="130" x2="740" y2="330" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="830.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">CT-03</text>
<line x1="800" y1="130" x2="800" y2="330" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="910.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Defeito</text>
<line x1="860" y1="130" x2="860" y2="330" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="542" y="196" font-size="13" fill="#5B2A86" font-weight="700">REQ-01</text>
<text x="542" y="214" font-size="12" fill="#756986">acesso com senha</text>
<circle cx="710" cy="200" r="13" fill="#2A9D8F"/>
<path d="M704 200 l4 5 l8 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="530" y1="226" x2="960" y2="226" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="542" y="248" font-size="13" fill="#5B2A86" font-weight="700">REQ-02</text>
<text x="542" y="266" font-size="12" fill="#756986">aviso de erro</text>
<circle cx="770" cy="252" r="13" fill="#2A9D8F"/>
<path d="M764 252 l4 5 l8 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="530" y1="278" x2="960" y2="278" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="542" y="300" font-size="13" fill="#5B2A86" font-weight="700">REQ-03</text>
<text x="542" y="318" font-size="12" fill="#756986">bloqueio</text>
<circle cx="830" cy="304" r="13" fill="#2A9D8F"/>
<path d="M824 304 l4 5 l8 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="874" y="291" width="72" height="26" rx="13" fill="#FF6B6B"/>
<text x="910" y="309" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">BUG-17</text>
<text x="530" y="364" font-size="13" fill="#3E3350">Para a frente: requisito → caso de teste (tudo foi testado?)</text>
<text x="530" y="386" font-size="13" fill="#3E3350">Para trás: defeito → caso → requisito (qual a origem?)</text>
</svg>
