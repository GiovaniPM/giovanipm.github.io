ight="normal" text-anchor="middle" fill="#2B1B3D">linha do tempo</text><text x="623" y="118.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">causas raiz</text><text x="623" y="137.8" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">lições e ações</text><text x="623" y="156.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">decisão</text><rect x="758" y="30" width="222" height="168" rx="14" fill="#FFFFFF" stroke="#B35300" stroke-width="3"/><rect x="758" y="30" width="222" height="40" rx="14" fill="#B35300"/><rect x="758" y="56" width="222" height="14" fill="#B35300"/><text x="869" y="57" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4. Encerrado</text><text x="869" y="100.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">passagem para</text><text x="869" y="118.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">a sustentação</text><text x="869" y="137.8" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">documentação</text><text x="869" y="156.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">final</text><line x1="243" y1="114" x2="264" y2="114" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="489" y1="114" x2="510" y2="114" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="735" y1="114" x2="756" y2="114" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><path d="M377 200 V232" stroke="#2B1B3D" stroke-width="2" stroke-dasharray="5 4"/><rect x="232" y="232" width="290" height="118" rx="12" fill="#FFF1C9" stroke="#FFB703"/><text x="377" y="258" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Critérios de saída</text><text x="377" y="282.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">• sem S1/S2 aberto</text><text x="377" y="299.55" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">• critérios atendidos</text><text x="377" y="317.1" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">• pendências altas resolvidas</text><text x="377" y="334.65" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">• incidentes em queda</text><text x="980" y="340" font-size="13" font-weight="normal" text-anchor="end" fill="#756986">Cada mudança de fase fica registrada com data e hora</text>
</g></svg>
