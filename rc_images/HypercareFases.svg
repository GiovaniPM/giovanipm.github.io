<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="t d">
<title id="t">As quatro fases acompanhadas pelo app</title>
<desc id="d">Quatro fases em sequência. Pós-deploy: verificação imediata, com smoke tests, monitoramento, comunicação e janela de rollback. Hypercare: estabilização com suporte reforçado, incidentes com SLA, pendências e follow-ups. Pós-mortem: revisão sem culpados, com linha do tempo, causas raiz, lições e ações. Encerrado: passagem para a sustentação. A saída do hypercare depende dos critérios de saída: nenhum S1 ou S2 aberto, critérios atendidos, pendências altas resolvidas e incidentes em queda.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="370" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
