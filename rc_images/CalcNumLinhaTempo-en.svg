text-anchor="middle" font-weight="700">Baghdad, Samarkand</text><text x="418.4" y="188" font-size="12" fill="#756986" text-anchor="middle">al-Khwarizmi and</text><text x="418.4" y="206" font-size="12" fill="#756986" text-anchor="middle">al-Kashi: algorithm</text><text x="418.4" y="224" font-size="12" fill="#756986" text-anchor="middle">and iteration</text><line x1="500" y1="310" x2="500" y2="350" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="3 4"/><circle cx="500" cy="310" r="8" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/><rect x="422" y="350" width="156" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><text x="500" y="378" font-size="15" fill="#FF6B6B" text-anchor="middle" font-weight="700">1669 · 1690</text><text x="500" y="402" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Newton and Raphson</text><text x="500" y="428" font-size="12" fill="#756986" text-anchor="middle">roots of</text><text x="500" y="446" font-size="12" fill="#756986" text-anchor="middle">equations via</text><text x="500" y="464" font-size="12" fill="#756986" text-anchor="middle">the tangent line</text><line x1="581.6" y1="268" x2="581.6" y2="310" stroke="#E23B3B" stroke-width="2" stroke-dasharray="3 4"/><circle cx="581.6" cy="310" r="8" fill="#E23B3B" stroke="#2B1B3D" stroke-width="2"/><rect x="503.6" y="110" width="156" height="158" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/><text x="581.6" y="138" font-size="15" fill="#E23B3B" text-anchor="middle" font-weight="700">1768 · 1901</text><text x="581.6" y="162" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Euler, Runge, Kutta</text><text x="581.6" y="188" font-size="12" fill="#756986" text-anchor="middle">predicting the</text><text x="581.6" y="206" font-size="12" fill="#756986" text-anchor="middle">future with differential</text><text x="581.6" y="224" font-size="12" fill="#756986" text-anchor="middle">equations</text><line x1="663.2" y1="310" x2="663.2" y2="350" stroke="#EF476F" stroke-width="2" stroke-dasharray="3 4"/><circle cx="663.2" cy="310" r="8" fill="#EF476F" stroke="#2B1B3D" stroke-width="2"/><rect x="585.2" y="350" width="156" height="158" rx="12" fill="#FFFFFF" stroke="#EF476F" stroke-width="2.5"/><text x="663.2" y="378" font-size="15" fill="#EF476F" text-anchor="middle" font-weight="700">1801 · 1809</text><text x="663.2" y="402" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Gauss</text><text x="663.2" y="428" font-size="12" fill="#756986" text-anchor="middle">finds Ceres again</text><text x="663.2" y="446" font-size="12" fill="#756986" text-anchor="middle">with least</text><text x="663.2" y="464" font-size="12" fill="#756986" text-anchor="middle">squares</text><line x1="744.8" y1="268" x2="744.8" y2="310" stroke="#5B2A86" stroke-width="2" stroke-dasharray="3 4"/><circle cx="744.8" cy="310" r="8" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/><rect x="666.8" y="110" width="156" height="158" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="744.8" y="138" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1922</text><text x="744.8" y="162" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Richardson</text><text x="744.8" y="188" font-size="12" fill="#756986" text-anchor="middle">weather forecast</text><text x="744.8" y="206" font-size="12" fill="#756986" text-anchor="middle">with finite</text><text x="744.8" y="224" font-size="12" fill="#756986" text-anchor="middle">differences, by hand</text><line x1="826.4" y1="310" x2="826.4" y2="350" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 4"/><circle cx="826.4" cy="310" r="8" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/><rect x="748.4" y="350" width="156" height="158" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><text x="826.4" y="378" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700">1946–1985</text><text x="826.4" y="402" font