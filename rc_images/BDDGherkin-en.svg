<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Anatomy of a Gherkin .feature file</title>
<desc id="d">An example .feature file, in Gherkin with English keywords, annotated on the right. Language line; @withdrawal tag; Feature with a name and a description; Background with a step shared by all scenarios; a Scenario with Given, When, Then and And; and a Scenario Outline with placeholders in angle brackets, filled in by the Examples table.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="558" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Anatomy of a Gherkin .feature file</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Keywords at the start of each line, free English text right after them</text>
<rect x="30" y="100" width="600" height="432.5" rx="12" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="48" y="126.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#A898C0"># language: en</tspan></text>
<text x="48" y="143.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FF8A8A">@withdrawal</tspan></text>
<text x="48" y="161.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">Feature:</tspan><tspan fill="#F7F0FF"> ATM cash withdrawal</tspan></text>
<text x="48" y="178.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F7F0FF">  So that I don’t have to queue at the bank,</tspan></text>
<text x="48" y="196.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F7F0FF">  as a customer, I want to use the ATM.</tspan></text>
<text x="48" y="213.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="231.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Background:</tspan></text>
<text x="48" y="248.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Given</tspan><tspan fill="#F7F0FF"> my card is valid</tspan></text>
<text x="48" y="266.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="283.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Scenario:</tspan><tspan fill="#F7F0FF"> Account in credit</tspan></text>
<text x="48" y="301.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Given</tspan><tspan fill="#F7F0FF"> I have $100 in my account</tspan></text>
<text x="48" y="318.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    When</tspan><tspan fill="#F7F0FF"> I request $20</tspan></text>
<text x="48" y="336.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Then</tspan><tspan fill="#F7F0FF"> $20 should be dispensed</tspan></text>
<text x="48" y="353.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    And</tspan><tspan fill="#F7F0FF"> my card should be returned</tspan></text>
<text x="48" y="371.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="388.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Scenario Outline:</tspan><tspan fill="#F7F0FF"> Withdrawal limit</tspan></text>
<text x="48" y="406.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Given</tspan><tspan fill="#F7F0FF"> I have $</tspan><tspan fill="#C9A7F5">&lt;balance&gt;</tspan><tspan fill="#F7F0FF"> in my account</tspan></text>
<text x="48" y="423.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    When</tspan><tspan fill="#F7F0FF"> I request $</tspan><tspan fill="#C9A7F5">&lt;amount&gt;</tspan></text>
<text x="48" y="441.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Then</tspan><tspan fill="#F7F0FF"> the withdrawal is </tspan><tspan fill="#C9A7F5">&lt;result&gt;</tspan></text>
<text x="48" y="458.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">    Examples:</tspan></text>
<text x="48" y="476.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      | balance | amount | result   |</tspan></text>
<text x="48" y="493.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      |     100 |    150 | rejected |</tspan></text>
<text x="48" y="511.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      |     100 |    100 | approved |</tspan></text>
<path d="M640 114.0 h8 V147.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 130.8 H656 V114.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="118.8" font-size="13" fill="#2B1B3D" font-weight="700">Language and tag</text>
<text x="668.0" y="134.8" font-size="12.5" fill="#3E3350"># language sets the keywords;</text>
<text x="668.0" y="150.8" font-size="12.5" fill="#3E3350">@tag groups and filters what to run</text>
<path d="M640 149.0 h8 V200.0 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 174.5 H656 V168.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="172.8" font-size="13" fill="#2B1B3D" font-weight="700">Feature</text>
<text x="668.0" y="188.8" font-size="12.5" fill="#3E3350">name on the same line, free</text>
<text x="668.0" y="204.8" font-size="12.5" fill="#3E3350">description on the lines below</text>
<path d="M640 219.0 h8 V252.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 235.8 H656 V222.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="226.8" font-size="13" fill="#2B1B3D" font-weight="700">Background</text>
<text x="668.0" y="242.8" font-size="12.5" fill="#3E3350">steps shared by every</text>
<text x="668.0" y="258.8" font-size="12.5" fill="#3E3350">scenario in the file</text>
<path d="M640 271.5 h8 V357.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 314.5 H656 V298.5 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="302.5" font-size="13" fill="#2B1B3D" font-weight="700">Scenario</text>
<text x="668.0" y="318.5" font-size="12.5" fill="#3E3350">Given: context · When: action</text>
<text x="668.0" y="334.5" font-size="12.5" fill="#3E3350">Then: outcome · And/But: more steps</text>
<path d="M640 376.5 h8 V515.0 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 445.8 H656 V421.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="425.8" font-size="13" fill="#2B1B3D" font-weight="700">Scenario Outline</text>
<text x="668.0" y="441.8" font-size="12.5" fill="#3E3350">the &lt;placeholders&gt; take the values</text>
<text x="668.0" y="457.8" font-size="12.5" fill="#3E3350">of each Examples row: each row</text>
<text x="668.0" y="473.8" font-size="12.5" fill="#3E3350">is a new scenario</text>
</svg>
