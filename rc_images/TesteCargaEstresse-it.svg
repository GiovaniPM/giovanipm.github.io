<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Test di carico × test di stress</title>
<desc id="d">Grafico del tempo di risposta in funzione degli utenti simultanei, con tre fasce: carico normale, picco previsto e oltre il limite. La curva sale piano, supera la linea del tempo accettabile al limite di capacità e schizza fino al punto di rottura. Il test di carico copre il carico normale e il picco; il test di stress va oltre il limite.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Test di carico × test di stress</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Il carico misura il comportamento fino al picco previsto; lo stress cerca il punto di rottura</text>
<rect x="110" y="105" width="337.2073365625" height="345" fill="#DDF3EF"/>
<text x="278.60366828125" y="131" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">carico normale</text>
<rect x="447.2073365625" y="105" width="220.0" height="345" fill="#FFF1C9"/>
<text x="557.2073365625" y="131" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">picco previsto</text>
<rect x="667.2073365625" y="105" width="272.7926634375" height="345" fill="#FFE3E3"/>
<text x="803.6036682812501" y="131" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">oltre il limite</text>
<line x1="110" y1="450" x2="950" y2="450" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="110" y1="450" x2="110" y2="93" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="70" y="280" font-size="14" fill="#3E3350" text-anchor="middle" font-weight="700" transform="rotate(-90 70 280)">tempo di risposta</text>
<text x="940" y="472" font-size="13" fill="#756986" text-anchor="end">utenti simultanei →</text>
<line x1="110" y1="300" x2="940" y2="300" stroke="#5B2A86" stroke-width="2" stroke-dasharray="8 6"/>
<text x="120" y="292" font-size="13" fill="#5B2A86" font-weight="700">tempo accettabile (SLA)</text>
<path d="M110 410 C 300 406, 470 398, 580 360 S 740 230, 800 158" stroke="#C2185B" stroke-width="4" fill="none" stroke-linecap="round"/>
<g stroke="#2B1B3D" stroke-width="4" stroke-linecap="round"><path d="M792 148 l18 18 M810 148 l-18 18"/></g>
<text x="822" y="166" font-size="14" fill="#2B1B3D" font-weight="700">punto di rottura</text>
<circle cx="667" cy="300" r="7" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="679.2073365625" y="322" font-size="13" fill="#2B1B3D" font-weight="700">limite di capacità</text>
<path d="M110 474 v8 H663 v-8" stroke="#2A9D8F" stroke-width="3" fill="none"/>
<text x="388.60366828125" y="504" font-size="16" fill="#0E6B61" text-anchor="middle" font-weight="700">test di carico</text>
<path d="M671 474 v8 H940 v-8" stroke="#FF6B6B" stroke-width="3" fill="none"/>
<text x="803.6036682812501" y="504" font-size="16" fill="#B3261E" text-anchor="middle" font-weight="700">test di stress</text>
<text x="500" y="540" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Curva illustrativa: il tempo di risposta cresce piano fino alla capacità e poi schizza in alto.</text>
</svg>
