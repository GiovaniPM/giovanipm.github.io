<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">GTD e agile: il team e tu</title>
<desc id="d">Diagramma a due livelli. In alto, la bacheca del team, in Scrum o Kanban, con le colonne backlog, da fare, in corso e fatto. In basso, il tuo sistema GTD, con casella di entrata, azioni successive, in attesa e revisione settimanale. Un elemento della colonna da fare assegnato a te scende nella tua casella di entrata; dalle azioni successive prendi lavoro per la colonna in corso quando hai capacità; una scheda bloccata in corso diventa un elemento della lista in attesa; e nella revisione settimanale aggiorni la bacheca.</desc>
