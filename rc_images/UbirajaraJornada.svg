<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">A jornada: nove atos e seis finais</title>
<desc id="d">Os nove atos do jogo seguem os capítulos do romance. Ato I, O caçador: caça nos campos, corrida atrás de Araci, a seta do desafio e os dois duelos com Pojucã; perder um duelo leva ao final Cativo de Pojucã. Ato II, O guerreiro: o grande arco dos araguaias. Ato III, A noiva. Ato IV, A hospitalidade: a subida do rio. Ato V, Servo do amor: os trabalhos para Itaquê. Ato VI, O combate nupcial: Cori, o toro, o camucim das saúvas; se a soma de afeto de Araci, mérito e metade do serviço ficar abaixo de 9, o final é A virgem não escolheu. Ato VII, A guerra: levar Araci de noite leva ao final A traição. Ato VIII, A batalha. Ato IX, A união dos arcos: com honra abaixo de 5, o final é Sem honra, sem união; perder para Agniná leva a A queda do herói; vencer leva a A lenda de Ubirajara.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
