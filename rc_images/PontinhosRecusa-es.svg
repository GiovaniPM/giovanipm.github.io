<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
<title id="t">El doble rechazo: tomar todos menos dos</title>
<desc id="d">Tres dibujos de la misma cadena de 4 cuadrados. En el primero, el rival acaba de abrir la cadena por el extremo izquierdo. En el segundo, Ana toma los cuatro cuadrados, pero después tiene que trazar otra línea y abrir la siguiente cadena. En el tercero, Ana toma dos cuadrados y traza la línea del extremo derecho: los dos últimos cuadrados tienen tres lados y una línea del medio cierra los dos a la vez; el rival, Bruno, se lleva esos dos y tiene que abrir la siguiente cadena.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="330" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">El doble rechazo: tomar todos menos dos</text>
<g transform="translate(23.9 78) scale(0.98)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="146" y1="26" x2="206" y2="26"/><line class="ln" style="--len:60" x1="206" y1="26" x2="266" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="ln" style="--len:60" x1="146" y1="86" x2="206" y2="86"/><line class="ln" style="--len:60" x1="206" y1="86" x2="266" y2="86"/><line class="ln last" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="gridln" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><line class="gridln" x1="206" y1="26" x2="206" y2="86"/><line class="gridln" x1="266" y1="26" x2="266" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="206" cy="26" r="6"/><circle class="dot" cx="266" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/><circle class="dot" cx="206" cy="86" r="6"/><circle class="dot" cx="266" cy="86" r="6"/></g><text x="167" y="221.76" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">La cadena fue abierta</text><text x="167" y="242.76" text-anchor="middle" font-size="15.5" fill="#756986">El rival entregó una cadena</text><text x="167" y="263.76" text-anchor="middle" font-size="15.5" fill="#756986">de 4 cuadrados por un extremo.</text><g transform="translate(356.9 78) scale(0.98)"><rect class="box" x="29" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="56" y="57" font-size="25.2" fill="#0E8074">A</text><rect class="box" x="89" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="116" y="57" font-size="25.2" 