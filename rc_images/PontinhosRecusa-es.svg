te cadena.</text><g transform="translate(689.9 78) scale(0.98)"><rect class="box" x="29" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="56" y="57" font-size="25.2" fill="#0E8074">A</text><rect class="box" x="89" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="116" y="57" font-size="25.2" fill="#0E8074">A</text><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="146" y1="26" x2="206" y2="26"/><line class="ln" style="--len:60" x1="206" y1="26" x2="266" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="ln" style="--len:60" x1="146" y1="86" x2="206" y2="86"/><line class="ln" style="--len:60" x1="206" y1="86" x2="266" y2="86"/><line class="ln" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="ln" style="--len:60" x1="86" y1="26" x2="86" y2="86"/><line class="ln" style="--len:60" x1="146" y1="26" x2="146" y2="86"/><line class="gridln" x1="206" y1="26" x2="206" y2="86"/><line class="ln last" style="--len:60" x1="266" y1="26" x2="266" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="206" cy="26" r="6"/><circle class="dot" cx="266" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/><circle class="dot" cx="206" cy="86" r="6"/><circle class="dot" cx="266" cy="86" r="6"/></g><line x1="891.8" y1="103.5" x2="891.8" y2="162.3" stroke="#C2185B" stroke-width="5.88" stroke-linecap="round" stroke-dasharray="7.84 7.84"/><text x="833" y="221.76" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">Dejar dos</text><text x="833" y="242.76" text-anchor="middle" font-size="15.5" fill="#756986">Ana toma 2 y traza el otro extremo.</text><text x="833" y="263.76" text-anchor="middle" font-size="15.5" fill="#756986">Bruno cierra los dos con una línea</text><text x="833" y="284.76" text-anchor="middle" font-size="15.5" fill="#756986">y es él quien abre la siguiente cadena.</text></svg>
