<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il pianeta nano che si perse</title>
<desc id="d">Il Sole al centro, l’orbita della Terra e l’orbita più grande di Cerere. Un piccolo arco dell’orbita di Cerere ha dei punti segnati: le osservazioni di Giuseppe Piazzi tra il 1º gennaio e l’11 febbraio 1801. Poi Cerere sparì nel bagliore del Sole. Il resto dell’orbita è tratteggiato: la previsione di Gauss, fatta alla fine del 1801. Un segnaposto indica il ritrovamento il 31 dicembre 1801, quasi nel punto previsto.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Il pianeta nano che si perse</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cerere, 1801: poche settimane di dati e un cielo enorme</text><circle cx="330" cy="290" r="26" fill="#FFB703" stroke="#B35300" stroke-width="2"/><text x="330" y="340" font-size="14" fill="#B35300" text-anchor="middle" font-weight="700">Sole</text><circle cx="330" cy="290" r="80" fill="none" stroke="#3A86FF" stroke-width="2"/><circle cx="410" cy="290" r="8" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1.5"/><text x="426" y="295" font-size="13" fill="#3A86FF" text-anchor="start" font-weight="700">Terra</text><ellipse cx="320" cy="290" rx="200" ry="170" fill="none" stroke="#5B2A86" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="132.061" cy="231.857" r="5.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.2"/><circle cx="135.899" cy="223.576" r="5.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.2"/><circle cx="140.241" cy="215.477" r="5.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.2"/><circle cx="145.076" cy="207.582" r="5.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.2"/><circle cx="150.39" cy="199.914" r="5.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.2"/><circle cx="156.17" cy="192.492" r="5.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.2"/><circle cx="162.398" cy="185.338" r="5.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.2"/><text x="170" y="250" font-size="14" fill="#FF6B6B" text-anchor="start" font-weight="700">osservato</text><text x="170" y="268" font-size="13" fill="#FF6B6B" text-anchor="start">gen–feb 1801</text><circle cx="493.205" cy="205" r="9" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/><text x="509.205" y="199" font-size="14" fill="#2A9D8F" text-anchor="start" font-weight="700">ritrovato</text><text x="509.205" y="217" font-size="13" fill="#2A9D8F" text-anchor="start">31 dic 1801</text><text x="410" y="140" font-size="14" fill="#5B2A86" text-anchor="start" font-weight="700">previsione di Gauss</text><rect x="600" y="110" width="370" height="350" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="785" y="142" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">La sfida</text><text x="625" y="180" font-size="15" fill="#2B1B3D" text-anchor="start">• 1 gen 1801: Piazzi vede Cerere</text><text x="625" y="208" font-size="15" fill="#2B1B3D" text-anchor="start">• la osserva per circa 6 settimane</text><text x="625" y="236" font-size="15" fill="#2B1B3D" text-anchor="start">• Cerere sparisce nel bagliore del Sole</text><text x="625" y="264" font-size="15" fill="#2B1B3D" text-anchor="start">• solo un pezzetto dell’orbita</text><text x="625" y="292" font-size="15" fill="#2B1B3D" text-anchor="start">• misure con errori</text><text x="625" y="320" font-size="15" fill="#2B1B3D" text-anchor="start"></text><text x="625" y="348" font-size="15" fill="#2B1B3D" text-anchor="start">Dove cercarla a fine anno?</text><text x="625" y="376" font-size="15" fill="#2B1B3D" text-anchor="start">Gauss, 24 anni, calcola</text><text x="625" y="404" font-size="15" fill="#2B1B3D" text-anchor="start">l’orbita che si adatta meglio.</text>
</svg>
