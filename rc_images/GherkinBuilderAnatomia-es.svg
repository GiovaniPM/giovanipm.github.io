<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" role="img" aria-labelledby="t d"><title id="t">Las partes de una funcionalidad en Gherkin</title><desc id="d">Ejemplo anotado: la funcionalidad dice qué se va a probar; los antecedentes valen para todos los escenarios; cada escenario describe un comportamiento con situación inicial, acción y resultado; el esquema repite la prueba con los datos de la tabla de ejemplos, una ejecución por fila.</desc><rect width="1000" height="524" rx="18" fill="#FFF7EC"/><text x="500" y="38" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#2B1B3D" xml:space="preserve">Las partes de una funcionalidad en Gherkin</text><text class="c" x="30" y="84" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Característica:</tspan> Cupón de descuento</text><path d="M618 78h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="78" r="3.5" fill="#C2185B"/><text class="n" x="646" y="84" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">qué se va a probar</text><text class="c" x="48" y="121" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Antecedentes:</tspan></text><path d="M618 115h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="115" r="3.5" fill="#C2185B"/><text class="n" x="646" y="121" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">valen para todos los escenarios</text><text class="c" x="66" y="158" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Dado</tspan> que tengo 200 € en el carrito</text><text class="c" x="48" y="195" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Escenario:</tspan> Aplicar un cupón válido</text><path d="M618 189h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="189" r="3.5" fill="#C2185B"/><text class="n" x="646" y="195" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">un comportamiento</text><text class="c" x="66" y="232" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Dado</tspan> que tengo un cupón del 10%</text><path d="M618 226h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="226" r="3.5" fill="#C2185B"/><text class="n" x="646" y="232" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">la situación inicial</text><text class="c" x="66" y="269" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Cuando</tspan> aplico el cupón</text><path d="M618 263h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="263" r="3.5" fill="#C2185B"/><text class="n" x="646" y="269" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">la acción</text><text class="c" x="66" y="306" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Entonces</tspan> el total pasa a ser 180 €</text><path d="M618 300h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="300" r="3.5" fill="#C2185B"/><text class="n" x="646" y="306" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">un resultado comprobable</text><text class="c" x="48" y="343" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Esquema del escenario:</tspan> Rechazar un cupón</text><path d="M618 337h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="337" r="3.5" fill="#C2185B"/><text class="n" x="646" y="343" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">misma prueba, varios datos</text><text class="c" x="66" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Cuando</tspan> aplico el cupón "&lt;cupon&gt;"</text><path d="M618 374h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="374" r="3.5" fill="#C2185B"/><text class="n" x="646" y="380" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">&lt;variable&gt; viene de la tabla</text><text class="c" x="66" y="417" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Ejemplos:</tspan></text><path d="M618 411h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="411" r="3.5" fill="#C2185B"/><text class="n" x="646" y="417" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">cada fila es una ejecución</text><text class="c" x="84" y="454" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve">| cupon    |</text><text class="c" x="84" y="491" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve">| CADUCADO |</text></svg>