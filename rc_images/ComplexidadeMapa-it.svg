<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">La mappa delle classi di complessità</title>
<desc id="d">Diagramma di insiemi, supponendo P diverso da NP. Tra tutti i problemi ci sono quelli decidibili, che un computer risolve anche se lentamente, e quelli indecidibili, come il problema della fermata, che nessun computer risolve. Dentro i decidibili c’è EXP, tempo esponenziale, con gli scacchi n per n. Dentro EXP c’è NP, problemi facili da verificare, e dentro NP c’è P, facili da risolvere, come ordinare una lista, trovare un percorso GPS e verificare se un numero è primo. Sul bordo di NP ci sono i problemi NP-completi, come Sudoku, Campo minato e Tetris. La regione tratteggiata NP-difficile include gli NP-completi e va oltre NP, con problemi almeno difficili quanto loro, come Candy Crush e Mario.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="620" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">La mappa delle classi di complessità</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Come gli scienziati credono che sia (supponendo P ≠ NP)</text>
<defs><clipPath id="npc"><ellipse cx="310" cy="385" rx="200" ry="125"/></clipPath></defs><rect x="40" y="94" width="920" height="506" rx="18" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><text x="60" y="120" font-size="15" fill="#2B1B3D" font-weight="700">Tutti i problemi</text>
<rect x="775" y="140" width="170" height="440" rx="14" fill="#FDE3E3" stroke="#E23B3B" stroke-width="2.5"/><text x="860" y="172" font-size="16" fill="#E23B3B" text-anchor="middle" font-weight="700">Indecidibili</text>
<text x="860" y="196" font-size="12.5" fill="#2B1B3D" text-anchor="middle">nessun computer</text>
<text x="860" y="214" font-size="12.5" fill="#2B1B3D" text-anchor="middle">li risolve</text>
<text x="860" y="232" font-size="12.5" fill="#2B1B3D" text-anchor="middle">(problema della fermata)</text>
<rect x="60" y="140" width="700" height="440" rx="110" fill="#F4EEFA" stroke="#5B2A86" stroke-width="2.5"/><text x="410" y="168" font-size="14" fill="#5B2A86" text-anchor="middle" font-weight="700">Decidibili: un computer li risolve, anche se lentamente</text>
<ellipse cx="360" cy="385" rx="255" ry="175" fill="#FFF3D6" stroke="#D99A00" stroke-width="2.5"/><text x="360" y="236" font-size="14.5" fill="#8A5A00" text-anchor="middle" font-weight="700">EXP: tempo esponenziale</text>
<text x="360" y="254" font-size="12.5" fill="#8A5A00" text-anchor="middle" font-style="italic">scacchi n × n</text>
<ellipse cx="310" cy="385" rx="200" ry="125" fill="#E5EEFF" stroke="#3A86FF" stroke-width="2.5"/><text x="295" y="306" font-size="14.5" fill="#3A86FF" text-anchor="middle" font-weight="700">NP: facile da verificare</text>
<rect x="425" y="250" width="100" height="270" fill="#FF6B6B" clip-path="url(#npc)"/><ellipse cx="310" cy="385" rx="200" ry="125" fill="none" stroke="#3A86FF" stroke-width="2.5"/><text x="468" y="390" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">NP-C</text>
<line x1="505" y1="420" x2="594" y2="452" stroke="#2B1B3D" stroke-width="1.5"/><text x="600" y="462" font-size="13" fill="#2B1B3D" font-weight="700">NP-completo</text>
<text x="600" y="480" font-size="12" fill="#2B1B3D">Sudoku</text>
<text x="600" y="496" font-size="12" fill="#2B1B3D">Campo minato</text>
<text x="600" y="512" font-size="12" fill="#2B1B3D">Tetris</text>
<rect x="418" y="268" width="532" height="296" rx="40" fill="none" stroke="#E23B3B" stroke-width="2.5" stroke-dasharray="8 6"/><text x="690" y="300" font-size="15" fill="#E23B3B" text-anchor="middle" font-weight="700">NP-difficile</text>
<text x="690" y="320" font-size="12" fill="#2B1B3D" text-anchor="middle" font-style="italic">almeno difficile</text>
<text x="690" y="336" font-size="12" fill="#2B1B3D" text-anchor="middle" font-style="italic">quanto i</text>
<text x="690" y="352" font-size="12" fill="#2B1B3D" text-anchor="middle" font-style="italic">NP-completi</text>
<text x="690" y="368" font-size="12" fill="#2B1B3D" text-anchor="middle" font-style="italic">(Candy Crush, Mario)</text>
<ellipse cx="250" cy="400" rx="115" ry="72" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/><text x="250" y="367" font-size="14" fill="#2A9D8F" text-anchor="middle" font-weight="700">P: facile da risolvere</text>
<text x="250" y="391" font-size="12" fill="#2B1B3D" text-anchor="middle">ordinare una lista</text>
<text x="250" y="408" font-size="12" fill="#2B1B3D" text-anchor="middle">percorso GPS</text>
<text x="250" y="425" font-size="12" fill="#2B1B3D" text-anchor="middle">test di primalità</text>
</svg>
