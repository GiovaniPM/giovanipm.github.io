<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il ciclo del monitoraggio del business</title>
<desc id="d">Sei fasi disposte in cerchio attorno al monitoraggio del business, collegate da frecce in senso orario: 1 definire KPI, eventi e obiettivi; 2 raccogliere dati da ERP, API, database e log; 3 confrontare con soglie, SLA e storico; 4 allertare tramite cruscotti, e-mail, Slack e Teams; 5 indagare la causa e agire; 6 migliorare regole e processi, tornando alla definizione.</desc>
