<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">Estrutura dos dados do app Atividades entre POs</title>
<desc id="d">Um arquivo JSON guarda a lista de times e a lista de atividades. Cada atividade tem request, RITM, descrição, status, priorização, tipo, sistema originador, business owner, retorno em reais, os marcadores Legal, Auditoria e Priorizado Gestão, a atividade predecessora e as datas de criação e de atualização. Dentro dela, cada time envolvido tem task, datas de início, SIT, UAT e deploy e a última notificação.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#756986"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="30" y="80" width="250" height="300" rx="12" fill="#F6EEFF" stroke="#5B2A86" stroke-width="2"/>
<text x="155" y="120" font-size="20" font-weight="bold" fill="#5B2A86" text-anchor="middle">Arquivo JSON</text>
<text x="155" y="144" font-size="14" font-weight="normal" fill="#756986" text-anchor="middle">no seu computador</text>
<rect x="55" y="180" width="200" height="60" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="155" y="216" font-size="14" font-weight="normal" fill="#2B1B3D" text-anchor="middle">times: lista de times</text>
<rect x="55" y="270" width="200" height="60" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="155" y="306" font-size="14" font-weight="normal" fill="#2B1B3D" text-anchor="middle">atividades: lista</text>
<line x1="255" y1="300" x2="315" y2="240" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="30" width="340" height="410" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<text x="490" y="66" font-size="20" font-weight="bold" fill="#0E8074" text-anchor="middle">Atividade</text>
<circle cx="346" cy="97" r="5" fill="#0E8074"/>
<text x="362" y="102" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Request e RITM</text>
<circle cx="346" cy="133" r="5" fill="#0E8074"/>
<text x="362" y="138" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Descrição simples</text>
<circle cx="346" cy="169" r="5" fill="#0E8074"/>
<text x="362" y="174" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Status e Priorização</text>
<circle cx="346" cy="205" r="5" fill="#0E8074"/>
<text x="362" y="210" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Tipo e Sistema originador</text>
<circle cx="346" cy="241" r="5" fill="#0E8074"/>
<text x="362" y="246" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Business Owner</text>
<circle cx="346" cy="277" r="5" fill="#0E8074"/>
<text x="362" y="282" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Retorno (R$)</text>
<circle cx="346" cy="313" r="5" fill="#0E8074"/>
<text x="362" y="318" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Marcadores: Legal, Auditoria</text>
<text x="362" y="338" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">e Priorizado Gestão</text>
<circle cx="346" cy="369" r="5" fill="#0E8074"/>
<text x="362" y="374" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Predecessor (outra atividade)</text>
<circle cx="346" cy="405" r="5" fill="#0E8074"/>
<text x="362" y="410" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Criada em · Atualizada em</text>
<line x1="660" y1="235" x2="695" y2="235" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="700" y="125" width="275" height="220" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="837" y="161" font-size="18" font-weight="bold" fill="#B35300" text-anchor="middle">Cada time envolvido</text>
<circle cx="724" cy="202" r="5" fill="#B35300"/>
<text x="740" y="207" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Task</text>
<circle cx="724" cy="246" r="5" fill="#B35300"/>
<text x="740" y="251" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Início · SIT · UAT · Deploy</text>
<circle cx="724" cy="290" r="5" fill="#B35300"/>
<text x="740" y="295" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Última notificação</text>
<text x="837" y="378" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">Um time só entra na atividade</text>
<text x="837" y="396" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">quando algum campo dele é preenchido.</text>
</g>
</svg>
