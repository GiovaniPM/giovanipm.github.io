<rect x="182.6" y="488" width="18" height="18" rx="4" fill="#FFB703"/><text x="206.6" y="502" font-size="12.5" fill="#2B1B3D">meno di 1 giorno</text>
<rect x="338.2" y="488" width="18" height="18" rx="4" fill="#F4845F"/><text x="362.2" y="502" font-size="12.5" fill="#2B1B3D">meno di 100 anni</text>
