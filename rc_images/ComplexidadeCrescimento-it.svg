<text x="582" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">&lt; 1 millisecondo</text>
<rect x="708" y="166" width="236" height="52" rx="10" fill="#2A9D8F"/>
<text x="826" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">3,6 ms</text>
