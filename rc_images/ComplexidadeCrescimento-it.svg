<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quando il numero di passi esplode</title>
<desc id="d">Tabella a colori con il tempo necessario, su un computer da 1 miliardo di passi al secondo, per algoritmi da n al quadrato, 2 alla n e n fattoriale passi, con n uguale a 10, 20, 30, 50 e 100. n = 10: n², &lt; 1 millisecondo; 2ⁿ, &lt; 1 millisecondo; n!, 3,6 ms. n = 20: n², &lt; 1 millisecondo; 2ⁿ, 1,0 ms; n!, 77 anni. n = 30: n², &lt; 1 millisecondo; 2ⁿ, 1,1 s; n!, 10¹⁵ anni. n = 50: n², &lt; 1 millisecondo; 2ⁿ, 13 giorni; n!, 10⁴⁷ anni. n = 100: n², &lt; 1 millisecondo; 2ⁿ, 40 bilioni di anni; n!, 10¹⁴¹ anni.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Quando il numero di passi esplode</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Tempo su un computer che fa 1 miliardo di passi al secondo</text>
<rect x="220" y="96" width="236" height="60" rx="10" fill="#5B2A86"/>
<text x="338" y="124" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">n²</text>
<text x="338" y="146" font-size="12.5" fill="#E9DDF5" text-anchor="middle" font-style="italic">confrontare tutte le coppie</text>
<rect x="464" y="96" width="236" height="60" rx="10" fill="#5B2A86"/>
<text x="582" y="124" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">2ⁿ</text>
<text x="582" y="146" font-size="12.5" fill="#E9DDF5" text-anchor="middle" font-style="italic">provare tutte le combinazioni</text>
<rect x="708" y="96" width="236" height="60" rx="10" fill="#5B2A86"/>
<text x="826" y="124" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">n!</text>
<text x="826" y="146" font-size="12.5" fill="#E9DDF5" text-anchor="middle" font-style="italic">provare tutti gli ordini</text>
<text x="60" y="194" font-size="17" fill="#2B1B3D" font-weight="700">n = 10</text>
<text x="60" y="212" font-size="11.5" fill="#756986" font-style="italic">dimensione dell’input</text>
