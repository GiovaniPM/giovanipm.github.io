<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Eliminação: zerar para simplificar</title>
<desc id="d">Quatro etapas da eliminação. Etapa 1: montar a tabela com os números 3, 2, 1 e 39; 2, 3, 1 e 34; 1, 2, 3 e 26. Etapa 2: multiplicar a linha 2 por 3 e tirar duas vezes a linha 1, e multiplicar a linha 3 por 3 e tirar a linha 1, zerando a primeira coluna: as linhas viram 0, 5, 1 e 24 e 0, 4, 8 e 39. Etapa 3: multiplicar a linha 3 por 5 e tirar 4 vezes a linha 2: 0, 0, 36 e 99. Etapa 4: voltar resolvendo, de baixo para cima: baixa = 99 dividido por 36 = 2,75; média = (24 − 2,75) dividido por 5 = 4,25; alta = (39 − 2 × 4,25 − 2,75) dividido por 3 = 9,25.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Eliminação: zerar para simplificar</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">O mesmo método que hoje chamamos de eliminação de Gauss</text><rect x="40" y="100" width="225" height="270" rx="12" fill="#F1E8FA"/><text x="152" y="130" font-size="16" fill="#5B2A86" text-anchor="middle" font-weight="700">1. Montar a tabela</text><rect x="42" y="154" width="214" height="114" rx="8" fill="#FFFFFF" stroke="#D9C7AE" stroke-width="2"/><text x="67" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="113" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="159" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="219" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">39</text><text x="67" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="113" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="159" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="219" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">34</text><text x="67" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="113" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="159" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="219" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">26</text><line x1="193" y1="160" x2="193" y2="256" stroke="#756986" stroke-width="1.5"/><text x="152" y="310" font-size="13" fill="#2B1B3D" text-anchor="middle">uma linha por feixe</text><rect x="285" y="100" width="225" height="270" rx="12" fill="#E6F0FF"/><text x="397" y="130" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">2. Zerar a coluna 1</text><rect x="287" y="154" width="214" height="114" rx="8" fill="#FFFFFF" stroke="#D9C7AE" stroke-width="2"/><text x="312" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="358" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="404" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="464" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">39</text><text x="312" y="214" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="358" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">5</text><text x="404" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="464" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">24</text><text x="312" y="248" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="358" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">4</text><text x="404" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">8</text><text x="464" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">39</text><line x1="438" y1="160" x2="438" y2="256" stroke="#756986" stroke-width="1.5"/><text x="397" y="310" font-size="13" fill="#2B1B3D" text-anchor="middle">L2 = 3·L2 − 2·L1</text><text x="397" y="332" font-size="13" fill="#2B1B3D" text-anchor="middle">L3 = 3·L3 − L1</text><rect x="530" y="100" width="225" height="270" rx="12" fill="#E2F6F2"/><text x="642" y="130" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">3. Zerar mais um</text><rect x="532" y="154" width="214" height="114" rx="8" fill="#FFFFFF" stroke="#D9C7AE" stroke-width="2"/><text x="557" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="603" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="649" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="709" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">39</text><text x="557" y="214" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="603" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">5</text><text x="649" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="709" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">24</text><text x="557" y="248" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="603" y="248" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="649" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">36</text><text x="709" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">99</text><line x1="683" y1="160" x2="683" y2="256" stroke="#756986" stroke-width="1.5"/><text x="642" y="310" font-size="13" fill="#2B1B3D" text-anchor="middle">L3 = 5·L3 − 4·L2</text><text x="642" y="332" font-size="13" fill="#2B1B3D" text-anchor="middle">virou uma “escada”</text><rect x="775" y="100" width="190" height="270" rx="12" fill="#FFF1C9"/><text x="870" y="130" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">4. Voltar resolvendo</text><text x="870" y="170" font-size="13" fill="#2B1B3D" text-anchor="middle">baixa = 99 ÷ 36</text><text x="870" y="198" font-size="13" fill="#2B1B3D" text-anchor="middle">= 2,75</text><text x="870" y="226" font-size="13" fill="#2B1B3D" text-anchor="middle">média = (24 − 2,75) ÷ 5</text><text x="870" y="254" font-size="13" fill="#2B1B3D" text-anchor="middle">= 4,25</text><text x="870" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">alta = (39 − 8,5 − 2,75) ÷ 3</text><text x="870" y="310" font-size="13" fill="#2B1B3D" text-anchor="middle">= 9,25</text><rect x="40" y="400" width="925" height="130" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="500" y="434" font-size="19" fill="#5B2A86" text-anchor="middle" font-weight="700">Resposta: alta = 9¼ dou · média = 4¼ dou · baixa = 2¾ dou</text><text x="500" y="466" font-size="15" fill="#2B1B3D" text-anchor="middle">Conferindo a linha 1: 3 × 9,25 + 2 × 4,25 + 2,75 = 27,75 + 8,5 + 2,75 = 39 ✓</text><text x="500" y="500" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">Na China, as contas eram feitas com varetas numa tábua, em colunas da direita para a esquerda.</text>
</svg>
