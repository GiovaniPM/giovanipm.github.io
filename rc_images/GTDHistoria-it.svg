<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">La storia del GTD</title>
<desc id="d">Linea del tempo del GTD: negli anni 1980 e 1990 David Allen sviluppa il metodo come consulente; nel 2001 esce il libro Getting Things Done; nel 2007 Merlin Mann diffonde l’Inbox Zero; nel 2008 Heylighen e Vidal spiegano il GTD con le scienze cognitive; nel 2011 Masicampo e Baumeister mostrano che fare un piano calma la mente; nel 2015 esce l’edizione rivista con i cinque passi; negli anni 2020 gli assistenti di intelligenza artificiale entrano nel flusso.</desc>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">La storia del GTD</text>
<path d="M50 220 H950" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<circle cx="90.0" cy="220" r="10" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/>
<path d="M90.0 208.0 L90.0 168.0" stroke="#5B2A86" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="90.0" y="100.0" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="middle">Anni 1980–90</text>
<text x="90.0" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Allen sviluppa il metodo</text><text x="90.0" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">come consulente</text>
<circle cx="226.7" cy="220" r="10" fill="#2F6FE0" stroke="#FFF7EC" stroke-width="3"/>
<path d="M226.7 232.0 L226.7 272.0" stroke="#2F6FE0" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="226.7" y="300.0" font-size="17" font-weight="700" fill="#2F6FE0" text-anchor="middle">2001</text>
<text x="226.7" y="324.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Esce il libro</text><text x="226.7" y="341.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Getting Things Done</text>
<circle cx="363.4" cy="220" r="10" fill="#0E8074" stroke="#FFF7EC" stroke-width="3"/>
<path d="M363.4 208.0 L363.4 168.0" stroke="#0E8074" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="363.4" y="100.0" font-size="17" font-weight="700" fill="#0E8074" text-anchor="middle">2007</text>
<text x="363.4" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Merlin Mann</text><text x="363.4" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">diffonde l’Inbox Zero</text>
<circle cx="500.1" cy="220" r="10" fill="#B35300" stroke="#FFF7EC" stroke-width="3"/>
<path d="M500.1 232.0 L500.1 272.0" stroke="#B35300" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="500.1" y="300.0" font-size="17" font-weight="700" fill="#B35300" text-anchor="middle">2008</text>
<text x="500.1" y="324.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Heylighen e Vidal spiegano</text><text x="500.1" y="341.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">il GTD con le scienze cognitive</text>
<circle cx="636.8" cy="220" r="10" fill="#C2185B" stroke="#FFF7EC" stroke-width="3"/>
<path d="M636.8 208.0 L636.8 168.0" stroke="#C2185B" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="636.8" y="100.0" font-size="17" font-weight="700" fill="#C2185B" text-anchor="middle">2011</text>
<text x="636.8" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Masicampo e Baumeister:</text><text x="636.8" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">pianificare calma la mente</text>
<circle cx="773.5" cy="220" r="10" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/>
<path d="M773.5 232.0 L773.5 272.0" stroke="#5B2A86" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="773.5" y="300.0" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="middle">2015</text>
<text x="773.5" y="324.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Edizione rivista,</text><text x="773.5" y="341.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">con i cinque passi</text>
<circle cx="910.2" cy="220" r="10" fill="#0E8074" stroke="#FFF7EC" stroke-width="3"/>
<path d="M910.2 208.0 L910.2 168.0" stroke="#0E8074" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="910.2" y="100.0" font-size="17" font-weight="700" fill="#0E8074" text-anchor="middle">Anni 2020</text>
<text x="910.2" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Gli assistenti di IA</text><text x="910.2" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">entrano nel flusso</text>
</svg>
