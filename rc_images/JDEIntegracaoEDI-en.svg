<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 482" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">EDI flow in JD Edwards</title>
<desc id="d">Inbound: the customer sends an 850 over a VAN or AS2; the EDI translator turns the X12 into a flat file, returns the 997 and writes to tables F47011/F47012, an editable staging area; R47011 creates the order in F4201/F4211 with the same order-entry rules, and errors go to the Work Center. Outbound: after invoicing in JDE, R47042 extracts the invoice into tables F47046/F47047; the translator turns the file into an 810 and the customer receives it; the 997 or CONTRL receipt is kept.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="482" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">EDI with the system 47 tables</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">The translator turns the standard (X12, EDIFACT) into a flat file; JDE validates and creates the document</text>
<rect x="20" y="92" width="960" height="176" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#756986" text-anchor="start" font-weight="700">INBOUND: CUSTOMER ORDER (850 / ORDERS)</text>
<rect x="30" y="136" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="116.0" y="171.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Customer</text>
<text x="116.0" y="190.3" font-size="12.5" fill="#3E3350" text-anchor="middle">sends 850</text>
<rect x="222" y="136" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="308.0" y="171.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">VAN or AS2</text>
<text x="308.0" y="190.3" font-size="12.5" fill="#3E3350" text-anchor="middle">certificates</text>
<rect x="414" y="136" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">EDI translator</text>
<text x="500.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">X12 → flat file</text>
<text x="500.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">returns the 997</text>
<rect x="606" y="136" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="692.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">F47011 / F47012</text>
<text x="692.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">staging area</text>
<text x="692.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(editable)</text>
<rect x="798" y="136" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="884.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">R47011</text>
<text x="884.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">creates the order</text>
<text x="884.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">F4201 / F4211</text>
<polyline points="202,176 220,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,176 412,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,176 604,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,176 796,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="250" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">R47011 uses the same order-entry rules; errors go to the Work Center</text>
<rect x="20" y="286" width="960" height="176" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="310" font-size="13" fill="#756986" text-anchor="start" font-weight="700">OUTBOUND: INVOICE TO THE CUSTOMER (810 / INVOIC)</text>
<rect x="30" y="330" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="116.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Invoicing</text>
<text x="116.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">in JDE</text>
<rect x="222" y="330" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="308.0" y="356.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">R47042</text>
<text x="308.0" y="375.0" font-size="12.5" fill="#3E3350" text-anchor="middle">extracts the</text>
<text x="308.0" y="393.5" font-size="12.5" fill="#3E3350" text-anchor="middle">invoice for EDI</text>
<rect x="414" y="330" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">F47046 / F47047</text>
<text x="500.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">outbound</text>
<rect x="606" y="330" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="692.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">EDI translator</text>
<text x="692.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">flat file → 810</text>
<rect x="798" y="330" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="884.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Customer</text>
<text x="884.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">receives 810</text>
<polyline points="202,370 220,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,370 412,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,370 604,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,370 796,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="444" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">the translator flags the record as sent and keeps the receipt (997 / CONTRL)</text>
</svg>
