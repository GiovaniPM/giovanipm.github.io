<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The horizons of focus</title>
<desc id="d">Six horizons of focus in GTD, from the widest to the most concrete: horizon 5, purpose and principles, why you do what you do; horizon 4, a 3 to 5 year vision; horizon 3, 1 to 2 year goals; horizon 2, areas of focus and accountability, such as health, team and finances; horizon 1, projects, outcomes needing more than one action within a year; and the ground, actions and the calendar.</desc>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">The horizons of focus</text>
<path d="M60.0 520.0 L60.0 107.0" stroke="#756986" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M60.0 96.0 L66.0 107.0 L54.0 107.0 Z" fill="#756986"/>
<text x="40" y="310" font-size="13" font-weight="700" fill="#756986" text-anchor="middle" transform="rotate(-90 40 310)">wider view · more concrete</text>
<rect x="90" y="90" width="870" height="60" rx="12" fill="#5B2A86"/>
<text x="112.0" y="126.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizon 5 · Purpose and principles</text>
<text x="938.0" y="126.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">why you do what you do</text>
<rect x="90" y="162" width="870" height="60" rx="12" fill="#7B3FB0"/>
<text x="112.0" y="198.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizon 4 · Vision (3 to 5 years)</text>
<text x="938.0" y="198.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">what long-term success would look like</text>
<rect x="90" y="234" width="870" height="60" rx="12" fill="#C2185B"/>
<text x="112.0" y="270.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizon 3 · Goals (1 to 2 years)</text>
<text x="938.0" y="270.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">what needs to be achieved soon</text>
<rect x="90" y="306" width="870" height="60" rx="12" fill="#B35300"/>
<text x="112.0" y="342.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizon 2 · Areas of focus and accountability</text>
<text x="938.0" y="342.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">roles to maintain: health, team, finances</text>
<rect x="90" y="378" width="870" height="60" rx="12" fill="#2F6FE0"/>
<text x="112.0" y="414.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizon 1 · Projects</text>
<text x="938.0" y="414.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">outcomes needing more than one action, within a year</text>
<rect x="90" y="450" width="870" height="60" rx="12" fill="#0E8074"/>
<text x="112.0" y="486.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Ground · Actions and calendar</text>
<text x="938.0" y="486.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">the next physical action and your commitments</text>
</svg>
