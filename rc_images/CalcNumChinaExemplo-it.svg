<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Sistemi lineari nella vita quotidiana</title>
<desc id="d">A sinistra, un problema al bar: un panzerotto più un succo più una crocchetta costano 18 euro; 2 panzerotti e 1 crocchetta, 20 euro; 1 succo e 2 crocchette, 17 euro. Eliminando passo dopo passo, panzerotto = 7, succo = 5 e crocchetta = 6 euro. A destra, dove compaiono oggi i sistemi lineari, con le dimensioni tipiche: circuiti elettrici, da decine a milioni di incognite; strutture di ponti ed edifici, milioni; giochi 3D e animazione, migliaia per fotogramma; previsioni meteo, miliardi; intelligenza artificiale, miliardi di numeri al secondo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistemi lineari nella vita quotidiana</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Dal granaio cinese al tuo cellulare</text><rect x="30" y="100" width="450" height="410" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="255" y="130" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700">Al bar</text><text x="255" y="170" font-size="16" fill="#2B1B3D" text-anchor="middle">panzerotto + succo + crocchetta = € 18</text><text x="255" y="200" font-size="16" fill="#2B1B3D" text-anchor="middle">2 panzerotti + crocchetta = € 20</text><text x="255" y="230" font-size="16" fill="#2B1B3D" text-anchor="middle">succo + 2 crocchette = € 17</text><line x1="60" y1="262" x2="450" y2="262" stroke="#F1E2CF" stroke-width="2"/><text x="255" y="292" font-size="15" fill="#2B1B3D" text-anchor="middle">dalla 2ª: crocchetta = 20 − 2·panz.</text><text x="255" y="318" font-size="15" fill="#2B1B3D" text-anchor="middle">nella 3ª: succo = 4·panz. − 23</text><text x="255" y="344" font-size="15" fill="#2B1B3D" text-anchor="middle">nella 1ª: 3·panz. − 3 = 18</text><text x="255" y="370" font-size="15" fill="#2B1B3D" text-anchor="middle">panzerotto = 7, e il resto segue</text><rect x="60" y="410" width="390" height="80" rx="10" fill="#E2F6F2"/><text x="255" y="442" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">panzerotto = € 7 · succo = € 5 · crocchetta = € 6</text><text x="255" y="470" font-size="14" fill="#2B1B3D" text-anchor="middle">verifica: 7 + 5 + 6 = 18 ✓</text><rect x="510" y="100" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><rect x="510" y="100" width="14" height="70" rx="6" fill="#3A86FF"/><text x="545" y="130" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Circuiti elettrici</text><text x="545" y="154" font-size="14" fill="#756986" text-anchor="start">da decine a milioni di incognite</text><rect x="510" y="184" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><rect x="510" y="184" width="14" height="70" rx="6" fill="#2A9D8F"/><text x="545" y="214" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Ponti ed edifici</text><text x="545" y="238" font-size="14" fill="#756986" text-anchor="start">milioni di incognite</text><rect x="510" y="268" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="510" y="268" width="14" height="70" rx="6" fill="#FFB703"/><text x="545" y="298" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Giochi 3D e animazione</text><text x="545" y="322" font-size="14" fill="#756986" text-anchor="start">migliaia a ogni fotogramma</text><rect x="510" y="352" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="510" y="352" width="14" height="70" rx="6" fill="#FF6B6B"/><text x="545" y="382" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Previsioni meteo</text><text x="545" y="406" font-size="14" fill="#756986" text-anchor="start">miliardi di incognite</text><rect x="510" y="436" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="510" y="436" width="14" height="70" rx="6" fill="#5B2A86"/><text x="545" y="466" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Intelligenza artificiale</text><text x="545" y="490" font-size="14" fill="#756986" text-anchor="start">miliardi di numeri al secondo</text>
</svg>
