<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 642" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Lo que cambia la probabilidad de ganar</title>
<desc id="d">Porcentaje de victorias de un jugador que cambia una decisión, contra dos computadoras difíciles. La referencia es 33,3%.</desc>
<rect width="1000" height="642" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="26" fill="#2B1B3D" font-weight="700" text-anchor="middle">Lo que cambia la probabilidad de ganar</text>
<path d="M773.3333333333334 96V580" stroke="#2B1B3D" stroke-width="1.6" stroke-dasharray="5 4"/><text x="773.3333333333334" y="92" font-size="13" fill="#5E5170" text-anchor="middle">Sin efecto: 33,3%</text><text x="328" y="125.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Pagar siempre la fianza</text><rect x="340" y="109" width="436.9" height="23" rx="4" fill="#3A6FD8"/><path d="M765.9 120.5H787.9M765.9 115.5V125.5M787.9 115.5V125.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="125.08" font-size="14" fill="#2B1B3D" font-weight="700">33,6%</text><text x="328" y="159.07999999999998" font-size="14.5" fill="#2B1B3D" text-anchor="end">Comprar siempre que se pueda</text><rect x="340" y="143" width="435.6" height="23" rx="4" fill="#3A6FD8"/><path d="M764.6 154.5H786.6M764.6 149.5V159.5M786.6 149.5V159.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="159.07999999999998" font-size="14" fill="#2B1B3D" font-weight="700">33,5%</text><text x="328" y="193.07999999999998" font-size="14.5" fill="#2B1B3D" font-weight="700" text-anchor="end">Estrategia de referencia</text><rect x="340" y="177" width="434.4" height="23" rx="4" fill="#2B1B3D"/><path d="M763.4 188.5H785.4M763.4 183.5V193.5M785.4 183.5V193.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="193.07999999999998" font-size="14" fill="#2B1B3D" font-weight="700">33,4%</text><text x="328" y="227.07999999999998" font-size="14.5" fill="#2B1B3D" text-anchor="end">Nunca negociar</text><rect x="340" y="211" width="434.4" height="23" rx="4" fill="#3A6FD8"/><path d="M763.4 222.5H785.4M763.4 217.5V227.5M785.4 217.5V227.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="227.07999999999998" font-size="14" fill="#2B1B3D" font-weight="700">33,4%</text><text x="328" y="261.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">No hipotecar para construir</text><rect x="340" y="245" width="426.0" height="23" rx="4" fill="#3A6FD8"/><path d="M755.1 256.5H776.9M755.1 251.5V261.5M776.9 251.5V261.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="261.08" font-size="14" fill="#2B1B3D" font-weight="700">32,8%</text><text x="328" y="295.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Ofertar hasta el 150% del precio</text><rect x="340" y="279" width="421.6" height="23" rx="4" fill="#D0680A"/><path d="M750.8 290.5H772.5M750.8 285.5V295.5M772.5 285.5V295.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="295.08" font-size="14" fill="#2B1B3D" font-weight="700">32,4%</text><text x="328" y="329.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Quedarse siempre en la Detención</text><rect x="340" y="313" width="421.2" height="23" rx="4" fill="#D0680A"/><path d="M750.3 324.5H772.1M750.3 319.5V329.5M772.1 319.5V329.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="329.08" font-size="14" fill="#2B1B3D" font-weight="700">32,4%</text><text x="328" y="363.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Parar en 4 casas</text><rect x="340" y="347" width="417.0" height="23" rx="4" fill="#D0680A"/><path d="M746.1 358.5H767.8M746.1 353.5V363.5M767.8 353.5V363.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="363.08" font-size="14" fill="#2B1B3D" font-weight="700">32,1%</text><text x="328" y="397.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Construir solo si sobran P$ 500</text><rect x="340" y="381" width="406.7" height="23" rx="4" fill="#D0680A"/><path d="M735.9 392.5H757.5M735.9 387.5V397.5M757.5 387.5V397.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="397.08" font-size="14" fill="#2B1B3D" font-weight="700">31,3%</text><text x="328" y="431.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Parar en 3 casas</text><rect x="340" y="415" width="398.4" height="23" rx="4" fill="#D0680A"/><path d="M727.7 426.5H749.1M727.7 421.5V431.5M749.1 421.5V431.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="431.08" font-size="14" fill="#2B1B3D" font-weight="700">30,6%</text><text x="328" y="465.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Comprar solo si sobran P$ 500</text><rect x="340" y="449" width="388.0" height="23" rx="4" fill="#D0680A"/><path d="M717.3 460.5H738.6M717.3 455.5V465.5M738.6 455.5V465.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="465.08" font-size="14" fill="#2B1B3D" font-weight="700">29,8%</text><text x="328" y="499.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Nunca ofertar en subastas</text><rect x="340" y="483" width="327.3" height="23" rx="4" fill="#D0680A"/><path d="M657.2 494.5H677.4M657.2 489.5V499.5M677.4 489.5V499.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="499.08" font-size="14" fill="#2B1B3D" font-weight="700">25,2%</text><text x="328" y="533.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Nunca construir</text><rect x="340" y="517" width="247.6" height="23" rx="4" fill="#D0680A"/><path d="M578.5 528.5H596.7M578.5 523.5V533.5M596.7 523.5V533.5" stroke="#2B1B3D" stroke-width="1.5"/><text x="799.3" y="533.08" font-size="14" fill="#2B1B3D" font-weight="700">19,0%</text><text x="328" y="567.08" font-size="14.5" fill="#2B1B3D" text-anchor="end">Nunca comprar</text><rect x="340" y="551" width="0.0" height="23" rx="4" fill="#D0680A"/><text x="799.3" y="567.08" font-size="14" fill="#2B1B3D" font-weight="700">0,0%</text><text x="500" y="600" font-size="13.5" fill="#5E5170" text-anchor="middle">12.012 partidas por fila, en mesas de 3 jugadores, con margen de ±0,8 puntos. En naranja: por debajo de la</text><text x="500" y="618" font-size="13.5" fill="#5E5170" text-anchor="middle">referencia, más allá del margen.</text>
