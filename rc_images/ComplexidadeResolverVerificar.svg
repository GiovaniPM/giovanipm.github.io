<rect x="50" y="512" width="900" height="62" rx="12" fill="#5B2A86"/>
<text x="500" y="537" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">NP: problemas cuja resposta é fácil de VERIFICAR.  P: problemas fáceis de RESOLVER.</text>
<text x="500" y="559" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">A pergunta P = NP? é: sempre que verificar é fácil, resolver também é?</text>
