<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Resolver é difícil, verificar é fácil</title>
<desc id="d">Dois painéis com um Sudoku de 4 por 4. À esquerda, resolver: o tabuleiro tem só alguns números e é preciso tentar, errar e voltar; num Sudoku gigante, as tentativas crescem de forma explosiva. À direita, verificar: o tabuleiro está completo e basta conferir que cada linha, cada coluna e cada quadrado de 2 por 2 têm os números 1, 2, 3 e 4. Embaixo: NP são os problemas cuja resposta é fácil de verificar; P, os fáceis de resolver; a pergunta P igual a NP é se, sempre que verificar é fácil, resolver também é.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
