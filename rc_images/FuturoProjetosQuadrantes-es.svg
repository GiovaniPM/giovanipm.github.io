<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Del plan al valor: alcance, plazo, costo y calidad</title>
<desc id="d">Gráfico de cuatro cuadrantes que resume el artículo, con el valor en el centro. Alcance: ayer, fijado al inicio y protegido por un comité de cambios; mañana, una hipótesis ajustada por los resultados medidos en cada ciclo, con OKR y #NoProjects. Plazo: ayer, fecha de fin del proyecto, cronograma detallado y entrega en un gran lote; mañana, flujo continuo de entregas pequeñas con previsiones a partir de los datos, con Flow Framework e IA. Costo: ayer, presupuesto anual por proyecto aprobado una vez; mañana, financiación continua por flujo de valor revisada cada trimestre, con Beyond Budgeting y Lean Portfolio Management. Calidad: ayer, verificada al final y heredada por un equipo de mantenimiento; mañana, integrada en el flujo, con equipos estables dueños del producto y deuda a la vista, con Team Topologies y Flow Framework.</desc>
