<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 408" width="1000" height="408" role="img" aria-labelledby="t d">
<title id="t">The computer against itself</title>
<desc id="d">Horizontal bars with the results of games between computer levels. 3 × 3: hard vs medium: hard wins 91%, ties 0%, medium wins 9%; 3 × 3: medium vs easy: medium wins 88%, ties 0%, easy wins 12%; 5 × 5: hard vs medium: hard wins 92%, ties 0%, medium wins 8%; 5 × 5: medium vs easy: medium wins 98%, ties 0%, easy wins 2%; 8 × 8: hard vs medium: hard wins 77.5%, ties 2.5%, medium wins 20%.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="408" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">The computer against itself</text>
<text x="500" y="68" text-anchor="middle" font-size="15" fill="#756986">Wins for each level in 200 games per row (40 on 8 × 8). Each level starts half the time. Simulation with the game’s code.</text><text x="286" y="129" text-anchor="end" font-size="15.5" fill="#2B1B3D">3 × 3: hard vs medium</text><rect x="300" y="108" width="582.4" height="30" fill="#0E8074"/><rect x="882.4" y="108" width="0.0" height="30" fill="#D9CCE6"/><rect x="882.4" y="108" width="57.6" height="30" fill="#C2185B"/><text x="308" y="128" font-size="14" font-weight="700" fill="#fff">hard 91.0%</text><text x="946" y="128" font-size="13" fill="#756986">9.0%</text><text x="286" y="175" text-anchor="end" font-size="15.5" fill="#2B1B3D">3 × 3: medium vs easy</text><rect x="300" y="154" width="563.2" height="30" fill="#0E8074"/><rect x="863.2" y="154" width="0.0" height="30" fill="#D9CCE6"/><rect x="863.2" y="154" width="76.8" height="30" fill="#C2185B"/><text x="308" y="174" font-size="14" font-weight="700" fill="#fff">medium 88.0%</text><text x="946" y="174" font-size="13" fill="#756986">12.0%</text><text x="286" y="221" text-anchor="end" font-size="15.5" fill="#2B1B3D">5 × 5: hard vs medium</text><rect x="300" y="200" width="588.8" height="30" fill="#0E8074"/><rect x="888.8" y="200" width="0.0" height="30" fill="#D9CCE6"/><rect x="888.8" y="200" width="51.2" height="30" fill="#C2185B"/><text x="308" y="220" font-size="14" font-weight="700" fill="#fff">hard 92.0%</text><text x="946" y="220" font-size="13" fill="#756986">8.0%</text><text x="286" y="267" text-anchor="end" font-size="15.5" fill="#2B1B3D">5 × 5: medium vs easy</text><rect x="300" y="246" width="627.2" height="30" fill="#0E8074"/><rect x="927.2" y="246" width="0.0" height="30" fill="#D9CCE6"/><rect x="927.2" y="246" width="12.8" height="30" fill="#C2185B"/><text x="308" y="266" font-size="14" font-weight="700" fill="#fff">medium 98.0%</text><text x="946" y="266" font-size="13" fill="#756986">2.0%</text><text x="286" y="313" text-anchor="end" font-size="15.5" fill="#2B1B3D">8 × 8: hard vs medium</text><rect x="300" y="292" width="496.0" height="30" fill="#0E8074"/><rect x="796.0" y="292" width="16.0" height="30" fill="#D9CCE6"/><rect x="812.0" y="292" width="128.0" height="30" fill="#C2185B"/><text x="308" y="312" font-size="14" font-weight="700" fill="#fff">hard 77.5%</text><text x="932" y="312" text-anchor="end" font-size="14" font-weight="700" fill="#fff">medium 20.0%</text><rect x="300" y="360" width="16" height="16" fill="#0E8074"/><text x="322" y="373" font-size="14" fill="#2B1B3D">left level wins</text><rect x="550" y="360" width="16" height="16" fill="#D9CCE6"/><text x="572" y="373" font-size="14" fill="#2B1B3D">ties</text><rect x="680" y="360" width="16" height="16" fill="#C2185B"/><text x="702" y="373" font-size="14" fill="#2B1B3D">right level wins</text></svg>
