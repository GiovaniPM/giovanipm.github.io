<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 506" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Character classes: what matches what</title>
<desc id="d">Table with the characters a, Z, 7, space, underscore, é, hyphen and dot in the columns, and eight classes in the rows: [a-z], [A-Za-z], [0-9] or \d, \w, \s, [^a-z], [À-ü] and the dot. A green mark means the character matches the class. For example, \w matches a, Z, 7 and underscore, but not é or the hyphen.</desc>
