<text x="815" y="144" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">PMBOK 7:</text><text x="815" y="162" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">principios</text><text x="815" y="180" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">y valor</text>
