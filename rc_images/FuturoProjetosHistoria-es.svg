<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Breve historia de la gestión de proyectos</title>
<desc id="d">Línea de tiempo de la gestión de proyectos: década de 1910, Henry Gantt crea el diagrama de barras; 1942, Proyecto Manhattan; 1957 y 1958, CPM en DuPont y PERT en el programa Polaris; de 1965 a 1969, se fundan IPMA y PMI; 1970, Royce describe el modelo en cascada; 1994 y 1995, informe CHAOS y Scrum; 1996, primera edición del PMBOK y PRINCE2; 2001, Manifiesto Ágil; 2021, PMBOK 7 basado en principios y valor; 2025, PMBOK 8 e IA en la gestión. Tres eras: ingeniería y defensa, profesionalización, ágil y valor.</desc>
<rect width="1000" height="510" rx="18" fill="#FFF7EC"/>
<text x="500" y="52" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Breve historia de la gestión de proyectos</text>
