<rect x="688" y="452" width="266" height="34" rx="17" fill="#2A9D8F" opacity=".14"/>
<text x="821.0" y="475" font-size="15" font-weight="700" fill="#2A9D8F" text-anchor="middle">Ágil y valor</text>
