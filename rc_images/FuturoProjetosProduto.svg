<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Do projeto ao produto: o que muda</title>
<desc id="d">Comparação entre projeto e produto. Equipe: no projeto é montada e desfeita no fim; no produto é estável e de longa duração. Trabalho: no projeto as pessoas vão até o trabalho; no produto o trabalho vai até a equipe. Financiamento: por projeto, aprovado uma vez, contra contínuo, por capacidade, revisto a cada trimestre. Sucesso: prazo, custo e escopo, contra resultados para o negócio e o cliente. Fim: entregue e passado para a sustentação, contra evolui enquanto gerar valor. Risco: concentrado no fim, contra diluído em entregas pequenas.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Do projeto ao produto: o que muda</text>
<rect x="40" y="78" width="360" height="46" rx="12" fill="#FF6B6B"/>
<text x="220" y="108" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Projeto</text>
<rect x="600" y="78" width="360" height="46" rx="12" fill="#0E8074"/>
<text x="780" y="108" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Produto (fluxo de valor)</text>
<rect x="40" y="140" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="140" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="140" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="140" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="163.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Montada para o projeto,</text><text x="220" y="182.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">desfeita no fim</text>
<text x="780" y="173.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Estável e de longa duração</text>
<path d="M414 146 H566 L586 168.0 L566 190 H414 Z" fill="#5B2A86"/>
<text x="494" y="173.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Equipe</text>
<rect x="40" y="204" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="204" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="204" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="204" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="237.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">As pessoas vão até o trabalho</text>
<text x="780" y="237.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">O trabalho vai até a equipe</text>
<path d="M414 210 H566 L586 232.0 L566 254 H414 Z" fill="#5B2A86"/>
<text x="494" y="237.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Trabalho</text>
<rect x="40" y="268" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="268" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="268" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="268" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="301.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Por projeto, aprovado uma vez</text>
<text x="780" y="291.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Contínuo, por capacidade,</text><text x="780" y="310.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">revisto a cada trimestre</text>
<path d="M414 274 H566 L586 296.0 L566 318 H414 Z" fill="#5B2A86"/>
<text x="494" y="301.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Financiamento</text>
<rect x="40" y="332" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="332" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="332" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="332" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="365.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Prazo, custo e escopo</text>
<text x="780" y="355.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Resultados para o negócio</text><text x="780" y="374.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">e para o cliente</text>
<path d="M414 338 H566 L586 360.0 L566 382 H414 Z" fill="#5B2A86"/>
<text x="494" y="365.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Sucesso</text>
<rect x="40" y="396" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="396" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="396" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="396" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="419.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Entregue e passado</text><text x="220" y="438.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">para a sustentação</text>
<text x="780" y="429.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Evolui enquanto gerar valor</text>
<path d="M414 402 H566 L586 424.0 L566 446 H414 Z" fill="#5B2A86"/>
<text x="494" y="429.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Fim</text>
<rect x="40" y="460" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="460" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="460" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="460" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="493.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Concentrado no fim</text>
<text x="780" y="493.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Diluído em entregas pequenas</text>
<path d="M414 466 H566 L586 488.0 L566 510 H414 Z" fill="#5B2A86"/>
<text x="494" y="493.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Risco</text>
<text x="500" y="540" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Com base em Kersten (2018) e Kelly (2018).</text>
</svg>
