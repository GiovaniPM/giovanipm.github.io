<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-labelledby="t d">
<title id="t">Ciclo de vida de un incidente en el app</title>
<desc id="d">Estados en secuencia: Abierto, En análisis, Con solución temporal, Resuelto y Cerrado. Al salir de Abierto, el app graba el inicio de la atención; al llegar a Resuelto, graba la resolución. Una flecha vuelve de Resuelto a los estados activos: es la reapertura (Abierto, En análisis o Con solución temporal), que borra la hora de resolución y cuenta una reapertura. Abajo, las medidas: tiempo de respuesta, de la detección al inicio de la atención, comparado con el SLA de respuesta; y tiempo de resolución, de la detección a la resolución, comparado con el SLA de resolución. Los promedios son MTTA y MTTR.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="316" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="20" y="70" width="176" height="56" rx="12" fill="#C2185B"/><text x="108" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Abierto</text><rect x="216" y="70" width="176" height="56" rx="12" fill="#B35300"/><text x="304" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">En análisis</text><rect x="412" y="70" width="176" height="56" rx="12" fill="#3A86FF"/><text x="500" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Con solución temporal</text><rect x="608" y="70" width="176" height="56" rx="12" fill="#0E8074"/><text x="696" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Resuelto</text><rect x="804" y="70" width="176" height="56" rx="12" fill="#5B2A86"/><text x="892" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Cerrado</text><line x1="197" y1="98" x2="214" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="393" y1="98" x2="410" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="589" y1="98" x2="606" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="785" y1="98" x2="802" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><path d="M206 66 V44 H306 V66" fill="none" stroke="#2B1B3D" stroke-width="1.5"/><text x="256" y="36" font-size="13" font-weight="bold" text-anchor="middle" fill="#B35300">⏱ graba el inicio de la atención</text><path d="M598 66 V44 H696 V66" fill="none" stroke="#2B1B3D" stroke-width="1.5"/><text x="647" y="36" font-size="13" font-weight="bold" text-anchor="middle" fill="#0E8074">⏱ graba la resolución</text><path d="M696 128 V168 H304 V130" fill="none" stroke="#C2185B" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="500" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#C2185B">reapertura: volver a un estado activo borra la resolución y cuenta +1</text><rect x="20" y="210" width="960" height="84" rx="12" fill="#FFF1C9"/><text x="500" y="244" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Respuesta = inicio de la atención − detección → SLA de respuesta · promedio = MTTA</text><text x="500" y="274" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Resolución = resolución − detección → SLA de resolución · promedio = MTTR</text>
</g></svg>
