<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 754" width="1000" height="754" role="img" aria-labelledby="t d">
<title id="t">Vuelta lanzada de un coche solo en pista (simulación)</title>
<desc id="d">Gráfico con una fila por pista que muestra la vuelta lanzada de un coche solo, medida con el código del juego. Un círculo marca el tiempo del ordenador en nivel difícil, y una franja llega al tiempo del nivel fácil; un rombo marca el tiempo con pedales automáticos, siempre entre el difícil y el fácil. Tiempos del nivel difícil: Phoenix 79,5 s; Interlagos 81,8 s; Imola 84,5 s; Monaco 81,8 s; Gilles Villeneuve 81,7 s; Hermanos Rodríguez 72,9 s; Paul Ricard 69,6 s; Silverstone 73,5 s; Hockenheim 109,2 s; Hungaroring 76,4 s; Spa-Francorchamps 113,8 s; Monza 88,2 s; Estoril 81,8 s; Jerez 83,2 s; Suzuka 94,3 s; Adelaide 89,2 s.</desc>
