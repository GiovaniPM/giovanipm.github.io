<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Uma caixa de entrada para o mundo digital</title>
<desc id="d">Diagrama com uma caixa de entrada no centro e seis fontes digitais em volta, cada uma com o que costuma virar: agenda, só o que tem dia e hora; e-mail, ações, aguardando e referência; sites e leituras, listas de ler depois e referência; celular e voz, captura em qualquer lugar; arquivos e notas, referência e material de apoio a projetos; mensagens e chat, pedidos que viram ações.</desc>
