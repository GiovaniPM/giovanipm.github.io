<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Colunas com o SELECT, linhas com o WHERE</title>
<desc id="d">Uma tabela emp com sete funcionários e as colunas id, nome, depto, salario e idade. As colunas nome e salario estão destacadas em lilás, indicando a projeção feita pelo SELECT; as linhas do departamento 20 estão destacadas em verde, indicando a seleção feita pelo WHERE; os cruzamentos estão em dourado. À direita, a consulta e o resultado: Eva 6000, Fábio 3500 e Gil 3500.</desc>
