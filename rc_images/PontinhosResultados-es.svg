<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 408" width="1000" height="408" role="img" aria-labelledby="t d">
<title id="t">El ordenador contra sí mismo</title>
<desc id="d">Barras horizontales con el resultado de partidas entre niveles del ordenador. 3 × 3: difícil × medio: difícil gana 91%, empates 0%, medio gana 9%; 3 × 3: medio × fácil: medio gana 88%, empates 0%, fácil gana 12%; 5 × 5: difícil × medio: difícil gana 92%, empates 0%, medio gana 8%; 5 × 5: medio × fácil: medio gana 98%, empates 0%, fácil gana 2%; 8 × 8: difícil × medio: difícil gana 77,5%, empates 2,5%, medio gana 20%.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="408" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">El ordenador contra sí mismo</text>
<text x="500" y="68" text-anchor="middle" font-size="15" fill="#756986">Victorias de cada nivel en 200 partidas por fila (40 en el 8 × 8). Cada nivel empieza la mitad de las veces. Simulación con el código del juego.</text><text x="286" y="129" text-anchor="end" font-size="15.5" fill="#2B1B3D">3 × 3: difícil × medio</text><rect x="300" y="108" width="582.4" height="30" fill="#0E8074"/><rect x="882.4" y="108" width="0.0" height="30" fill="#D9CCE6"/><rect x="882.4" y="108" width="57.6" height="30" fill="#C2185B"/><text x="308" y="128" font-size="14" font-weight="700" fill="#fff">difícil 91,0%</text><text x="946" y="128" font-size="13" fill="#756986">9,0%</text><text x="286" y="175" text-anchor="end" font-size="15.5" fill="#2B1B3D">3 × 3: medio × fácil</text><rect x="300" y="154" width="563.2" height="30" fill="#0E8074"/><rect x="863.2" y="154" width="0.0" height="30" fill="#D9CCE6"/><rect x="863.2" y="154" width="76.8" height="30" fill="#C2185B"/><text x="308" y="174" font-size="14" font-weight="700" fill="#fff">medio 88,0%</text><text x="946" y="174" font-size="13" fill="#756986">12,0%</text><text x="286" y="221" text-anchor="end" font-size="15.5" fill="#2B1B3D">5 × 5: difícil × medio</text><rect x="300" y="200" width="588.8" height="30" fill="#0E8074"/><rect x="888.8" y="200" width="0.0" height="30" fill="#D9CCE6"/><rect x="888.8" y="200" width="51.2" height="30" fill="#C2185B"/><text x="308" y="220" font-size="14" font-weight="700" fill="#fff">difícil 92,0%</text><text x="946" y="220" font-size="13" fill="#756986">8,0%</text><text x="286" y="267" text-anchor="end" font-size="15.5" fill="#2B1B3D">5 × 5: medio × fácil</text><rect x="300" y="246" width="627.2" height="30" fill="#0E8074"/><rect x="927.2" y="246" width="0.0" height="30" fill="#D9CCE6"/><rect x="927.2" y="246" width="12.8" height="30" fill="#C2185B"/><text x="308" y="266" font-size="14" font-weight="700" fill="#fff">medio 98,0%</text><text x="946" y="266" font-size="13" fill="#756986">2,0%</text><text x="286" y="313" text-anchor="end" font-size="15.5" fill="#2B1B3D">8 × 8: difícil × medio</text><rect x="300" y="292" width="496.0" height="30" fill="#0E8074"/><rect x="796.0" y="292" width="16.0" height="30" fill="#D9CCE6"/><rect x="812.0" y="292" width="128.0" height="30" fill="#C2185B"/><text x="308" y="312" font-size="14" font-weight="700" fill="#fff">difícil 77,5%</text><text x="932" y="312" text-anchor="end" font-size="14" font-weight="700" fill="#fff">medio 20,0%</text><rect x="300" y="360" width="16" height="16" fill="#0E8074"/><text x="322" y="373" font-size="14" fill="#2B1B3D">gana el nivel de la izquierda</text><rect x="550" y="360" width="16" height="16" fill="#D9CCE6"/><text x="572" y="373" font-size="14" fill="#2B1B3D">empates</text><rect x="680" y="360" width="16" height="16" fill="#C2185B"/><text x="702" y="373" font-size="14" fill="#2B1B3D">gana el nivel de la derecha</text></svg>
