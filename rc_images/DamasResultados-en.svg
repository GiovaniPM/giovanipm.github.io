<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 298" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Who wins a game of checkers?</title>
<desc id="d">Random moves: snow wins 48.0%, draw 1.5%, yeti wins 50.5%. Medium against medium: snow wins 29.0%, draw 39.2%, yeti wins 31.8%.</desc>
<rect width="1000" height="298" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Who wins a game of checkers?</text>
<rect x="342" y="66" width="16" height="16" rx="4" fill="#3A6FD8"/><text x="364" y="79" font-size="15" fill="#2B1B3D">Snow wins (moves first)</text><rect x="564.6" y="66" width="16" height="16" rx="4" fill="#B8AFC4"/><text x="586.6" y="79" font-size="15" fill="#2B1B3D">Draw</text><rect x="631.4" y="66" width="16" height="16" rx="4" fill="#D0680A"/><text x="653.4" y="79" font-size="15" fill="#2B1B3D">Yeti wins</text><text x="328" y="141" font-size="15.5" font-weight="700" fill="#2B1B3D" text-anchor="end">Random moves</text><rect x="342.0" y="116" width="286.3" height="46" rx="4" fill="#3A6FD8"/><text x="486.1" y="145" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">48.0%</text><rect x="630.3" y="116" width="6.9" height="46" rx="4" fill="#B8AFC4"/><text x="634.7" y="112" font-size="13" font-weight="700" fill="#2B1B3D" text-anchor="middle">1.5%</text><rect x="639.2" y="116" width="302.8" height="46" rx="4" fill="#D0680A"/><text x="790.6" y="145" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">50.5%</text><text x="328" y="203" font-size="15.5" font-weight="700" fill="#2B1B3D" text-anchor="end">Medium against Medium</text><rect x="342.0" y="178" width="171.9" height="46" rx="4" fill="#3A6FD8"/><text x="428.9" y="207" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">29.0%</text><rect x="515.9" y="178" width="233.1" height="46" rx="4" fill="#B8AFC4"/><text x="633.4" y="207" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">39.2%</text><rect x="750.9" y="178" width="191.1" height="46" rx="4" fill="#D0680A"/><text x="846.5" y="207" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">31.8%</text><text x="500" y="262" font-size="13.5" fill="#5E5170" text-anchor="middle">200,018 random games and 5,018 at medium level, under the Brazilian rules. Source: own simulation.</text>
</svg>
