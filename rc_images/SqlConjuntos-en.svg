<text x="274.0" y="586.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Alex 2000</text>
<text x="274.0" y="611.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Isaque 35000</text>
<rect x="500.0" y="410.0" width="228.0" height="236.0" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<text x="514.0" y="436.0" font-size="15" fill="#2A9D8F" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">INTERSECT</text>
<text x="714.0" y="436.0" font-size="12.5" fill="#756986" text-anchor="end" font-weight="700" xml:space="preserve">1 row</text>
<text x="514.0" y="458.0" font-size="12" fill="#3E3350" font-style="italic" xml:space="preserve">only what is in both</text>
<text x="514.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Alex 2000</text>
<rect x="740.0" y="410.0" width="228.0" height="236.0" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<text x="754.0" y="436.0" font-size="15" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">EXCEPT · MINUS</text>
<text x="954.0" y="436.0" font-size="12.5" fill="#756986" text-anchor="end" font-weight="700" xml:space="preserve">2 rows</text>
<text x="754.0" y="458.0" font-size="12" fill="#3E3350" font-style="italic" xml:space="preserve">what is only in the first</text>
<text x="754.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">João 1000</text>
<text x="754.0" y="511.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Roberto 5000</text>
<text x="500.0" y="676.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">In Oracle, EXCEPT is called MINUS (EXCEPT is also accepted from version 21c). Without ORDER BY, the order is not guaranteed.</text>
</svg>
