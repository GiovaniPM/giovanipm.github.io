<text x="545.0" y="246.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">Isaque 35000</text>
<text x="410.0" y="235.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="700" xml:space="preserve">Alex 2000</text>
<text x="410.0" y="380.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">João 1000 and João 2000 are different rows: only Alex 2000 is in both</text>
<rect x="20.0" y="410.0" width="228.0" height="236.0" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="34.0" y="436.0" font-size="15" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">UNION</text>
<text x="234.0" y="436.0" font-size="12.5" fill="#756986" text-anchor="end" font-weight="700" xml:space="preserve">5 rows</text>
<text x="34.0" y="458.0" font-size="12" fill="#3E3350" font-style="italic" xml:space="preserve">combines and removes duplicates</text>
<text x="34.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Alex 2000</text>
<text x="34.0" y="511.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Isaque 35000</text>
