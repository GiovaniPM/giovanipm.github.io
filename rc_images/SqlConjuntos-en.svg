<text x="290.0" y="98.0" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">sales2005</text><text x="530.0" y="98.0" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700" xml:space="preserve">sales2006</text>
<text x="275.0" y="214.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">João 1000</text>
<text x="275.0" y="246.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">Roberto 5000</text>
