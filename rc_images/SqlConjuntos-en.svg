<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 698" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">UNION, INTERSECT and EXCEPT</title>
<desc id="d">Venn diagram with sales2005 on the left, holding João 1000 and Roberto 5000, sales2006 on the right, with João 2000 and Isaque 35000, and Alex 2000 in the intersection. Below, four results: UNION with 5 rows, UNION ALL with 6, since Alex 2000 appears twice, INTERSECT with 1, Alex 2000, and EXCEPT or MINUS with 2, João 1000 and Roberto 5000.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="698" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">UNION, INTERSECT and EXCEPT</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Set operators compare whole rows from two queries</text>
<circle cx="330" cy="230" r="120" fill="#EFE3FA" fill-opacity="0.8" stroke="#5B2A86" stroke-width="2.5"/><circle cx="490" cy="230" r="120" fill="#E1ECFF" fill-opacity="0.8" stroke="#3A86FF" stroke-width="2.5"/>
