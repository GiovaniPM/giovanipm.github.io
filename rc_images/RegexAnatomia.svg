<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Anatomia de uma expressão regular</title>
<desc id="d">O padrão /^(\d{2})\/(\d{2})\/(\d{4})$/g decomposto em partes coloridas: delimitadores, âncoras de início e fim, três grupos de captura, o atalho \d para dígito, os quantificadores {2} e {4}, as barras escapadas e a flag g. Abaixo, o teste com 25/09/2026: o texto inteiro casa, e os grupos capturam 25, 09 e 2026.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
