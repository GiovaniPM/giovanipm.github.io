<path d="M838.0 444.0 L838.0 287.0" stroke="#C2185B" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M838.0 276.0 L844.0 287.0 L832.0 287.0 Z" fill="#C2185B"/>
<rect x="808.0" y="324.5" width="124.0" height="21.5" rx="6" fill="#FFF7EC"/><text x="870.0" y="340.0" font-size="12.5" font-weight="700" fill="#C2185B" text-anchor="middle">update the board</text>
