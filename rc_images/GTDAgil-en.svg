<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">GTD and agile: the team and you</title>
<desc id="d">Two-layer diagram. On top, the team board, in Scrum or Kanban, with the columns backlog, to do, doing and done. Below, your GTD system, with inbox, next actions, waiting for and weekly review. An item in the to-do column assigned to you goes down to your inbox; from next actions, you pull work into the doing column when you have capacity; a blocked card in doing becomes an item on the waiting-for list; and in the weekly review you update the board.</desc>
<rect width="1000" height="580" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">GTD and agile: the team and you</text>
<rect x="40" y="76" width="920" height="214" rx="16" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="60.0" y="104.0" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Team · Scrum or Kanban</text>
