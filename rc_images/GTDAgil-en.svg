<rect x="80" y="190" width="165" height="28" rx="5" fill="#FFF1C9" stroke="#E9D9A8"/>
<rect x="285" y="116" width="205" height="158" rx="10" fill="#F6F1E8"/>
<text x="387.0" y="138.0" font-size="14" font-weight="700" fill="#756986" text-anchor="middle">To do</text>
