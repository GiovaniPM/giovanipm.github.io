<rect x="530" y="228" width="165" height="30" rx="5" fill="#FDE4EA" stroke="#E04E6B" stroke-width="2.5"/><text x="612.0" y="248.0" font-size="13" font-weight="700" fill="#E04E6B" text-anchor="middle">blocked</text>
