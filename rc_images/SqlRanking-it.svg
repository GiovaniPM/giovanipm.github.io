<text x="500.0" y="538.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Per “i 3 stipendi più alti”, DENSE_RANK &lt;= 3 include tutti i pari; ROW_NUMBER &lt;= 3 taglia a metà del pareggio.</text>
