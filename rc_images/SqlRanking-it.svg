<text x="570.0" y="428.0" font-size="12.5" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">RANK salta posizioni</text>
<text x="150.0" y="458.0" font-size="13" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">ROW_NUMBER</text><text x="290.0" y="458.0" font-size="13" fill="#3E3350" xml:space="preserve">numero unico anche in caso di pareggio (l’ordine tra pari è arbitrario)</text>
