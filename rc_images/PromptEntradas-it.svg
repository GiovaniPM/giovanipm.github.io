<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Ogni tipo di materiale entra nell’articolo in modo diverso</text>
<text x="130.0" y="98.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Voi allegate</text><text x="470.0" y="98.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">L’IA deve…</text><text x="845.0" y="98.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Nell’articolo</text>
