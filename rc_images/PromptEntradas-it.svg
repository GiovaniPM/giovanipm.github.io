<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Che cosa fa l’IA con ogni allegato</title>
<desc id="d">Cinque tipi di allegato a sinistra, ognuno con ciò che l’IA deve farne: link, scaricare tutto il contenuto e verificare che risponda; testo incollato, trattarlo come fonte e verificare i fatti; immagine, descriverla, estrarre dati e ridisegnarla in SVG; PDF o foglio di calcolo, leggere e citare la pagina; codice, eseguire e verificare. Delle frecce portano a sei risultati nell’articolo: testo esplicativo, esempi verificati, correzioni all’originale, figure SVG, riferimenti e ripasso veloce.</desc>
