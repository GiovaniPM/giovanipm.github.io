<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Chi vince, a seconda della bravura dei giocatori</title>
<desc id="d">Grafico a barre impilate con la probabilità esatta di vittoria della X, vittoria della O e pareggio in quattro scenari, calcolata sull’albero completo del gioco. Entrambi a caso: X vince 58,5%, O vince 28,8%, pareggio 12,7%. X perfetto contro O a caso: X vince 99,5%, pareggio 0,5%, O non vince mai. X a caso contro O perfetto: O vince 91,6%, pareggio 8,4%, X non vince mai. Entrambi perfetti: pareggio nel 100% delle partite.</desc>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Chi vince, a seconda della bravura dei giocatori</text>
<text x="312" y="121" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="end">Entrambi a caso</text>
<rect x="330.0" y="92" width="351.0" height="46" fill="#5B2A86"/>
<text x="505.5" y="121" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">58,5%</text>
<rect x="681.0" y="92" width="172.8" height="46" fill="#0E8074"/>
<text x="767.4" y="121" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">28,8%</text>
<rect x="853.8" y="92" width="76.2" height="46" fill="#FFB703"/>
<text x="891.9" y="121" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">12,7%</text>
<rect x="330" y="92" width="600" height="46" fill="none" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="312" y="193" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="end">X perfetto × O a caso</text>
<rect x="330.0" y="164" width="597.0" height="46" fill="#5B2A86"/>
<text x="628.5" y="193" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">99,5%</text>
<rect x="927.0" y="164" width="3.0" height="46" fill="#FFB703"/>
<rect x="330" y="164" width="600" height="46" fill="none" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="312" y="265" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="end">X a caso × O perfetto</text>
<rect x="330.0" y="236" width="549.6" height="46" fill="#0E8074"/>
<text x="604.8" y="265" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">91,6%</text>
<rect x="879.6" y="236" width="50.4" height="46" fill="#FFB703"/>
<text x="904.8" y="265" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">8,4%</text>
<rect x="330" y="236" width="600" height="46" fill="none" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="312" y="337" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="end">Entrambi perfetti</text>
<rect x="330.0" y="308" width="600.0" height="46" fill="#FFB703"/>
<text x="630" y="337" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">100%</text>
<rect x="330" y="308" width="600" height="46" fill="none" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="330" y="390" width="22" height="16" rx="3" fill="#5B2A86"/>
<text x="360" y="403" font-size="14" font-weight="700" fill="#3E3350" text-anchor="start">Vince X</text>
<rect x="500" y="390" width="22" height="16" rx="3" fill="#0E8074"/>
<text x="530" y="403" font-size="14" font-weight="700" fill="#3E3350" text-anchor="start">Vince O</text>
<rect x="670" y="390" width="22" height="16" rx="3" fill="#FFB703"/>
<text x="700" y="403" font-size="14" font-weight="700" fill="#3E3350" text-anchor="start">Pareggio</text>
<text x="500" y="448" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Probabilità esatte, calcolate percorrendo tutte le 255.168 partite possibili.</text>
</svg>
