<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Beyond projects: seven ideas, five layers</title>
<desc id="d">Map of the seven ideas in five layers. Mindset, what is the unit of work: #NoProjects, products and continuous flow, not projects. Direction, where are we going and why: OKRs. Money, how do we allocate resources: Beyond Budgeting and SAFe Lean Portfolio Management. Structure, who does the work and how teams interact: Team Topologies. Measurement, how do we know value is flowing: Flow Framework. A vertical band shows AI applied to every layer.</desc>
