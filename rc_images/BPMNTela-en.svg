<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif"><title id="t">The BPMN Simulator screen</title><desc id="d">The element palette on the left, the diagram list below it, the canvas in the center, the File, Arrange and Simulate buttons on top and, on the right, the Properties and Check tabs.</desc><style>:root{--b-fill:#fff;--b-line:#2B1B3D;--b-muted:#5E5170;--b-pool:#fff;--b-font:'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;--b-mono:Consolas,monospace}
.grid-dot{fill:var(--dot)}
.b-fill{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-line{fill:none;stroke:var(--b-line);stroke-width:1.6}
.b-thin{fill:none;stroke:var(--b-line);stroke-width:1.2}
.b-ink{fill:var(--b-line);stroke:none}
.b-blank{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.2}
.b-text{fill:var(--b-line);font:12px var(--b-font);text-anchor:middle;pointer-events:none}
.b-note{fill:var(--b-line);font:12px var(--b-font);text-anchor:start;pointer-events:none}
.b-small{fill:var(--b-muted);font:10.5px var(--b-mono);text-anchor:middle;pointer-events:none}
.b-event{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-end{fill:var(--b-fill);stroke:var(--b-line);stroke-width:3.4}
.b-gw{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-pool{fill:var(--b-pool);stroke:var(--b-line);stroke-width:1.6}
.b-lane{fill:none;stroke:var(--b-line);stroke-width:1}
.b-group{fill:none;stroke:var(--b-line);stroke-width:1.4;stroke-dasharray:9 4 2 4}
.b-seq{fill:none;stroke:var(--b-line);stroke-width:1.5;marker-end:url(#m-seq)}
.b-msg{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:7 5;marker-start:url(#m-msg-start);marker-end:url(#m-msg-end)}
.b-assoc{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.b-assoc.one{marker-end:url(#m-open)}
.b-assoc.both{marker-start:url(#m-open-s);marker-end:url(#m-open)}
.b-data{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round;marker-end:url(#m-open)}
.b-text{font-size:12px}</style><defs><marker id="m-seq" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="m-msg-end" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11z" fill="#fff" stroke="#2B1B3D" stroke-width="1.2"/></marker><marker id="m-msg-start" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#2B1B3D" stroke-width="1.4"/></marker><marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker><marker id="m-open-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 1 6 11 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker></defs><rect width="1000" height="540" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">The BPMN Simulator screen</text><rect x="20" y="60" width="960" height="330" rx="10" fill="#fff" stroke="#E2D3BC"/><rect x="20" y="60" width="960" height="34" rx="10" fill="#F4EBDD"/><text x="36" y="82" font-size="13" fill="#2B1B3D" font-weight="700">BPMN Simulator</text><rect x="560" y="67" width="74" height="21" rx="5" fill="#fff" stroke="#E2D3BC"/><text x="597" y="82" font-size="12" fill="#2B1B3D" text-anchor="middle">File</text><rect x="640" y="67" width="74" height="21" rx="5" fill="#fff" stroke="#E2D3BC"/><text x="677" y="82" font-size="12" fill="#2B1B3D" text-anchor="middle">Arrange</text><rect x="728" y="67" width="84" height="21" rx="5" fill="#0E8074" stroke="#E2D3BC"/><text x="770" y="82" font-size="12" fill="#fff" text-anchor="middle">Simulate</text><rect x="20" y="94" width="130" height="296" fill="#FBF4E8"/><rect x="760" y="94" width="220" height="296" fill="#FBF4E8"/><rect x="32" y="106" width="50" height="38" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="88" y="106" width="50" height="38" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="32" y="150" width="50" height="38" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="88" y="150" width="50" height="38" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="32" y="194" width="50" height="38" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="88" y="194" width="50" height="38" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="32" y="238" width="50" height="38" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="88" y="238" width="50" height="38" rx="5" fill="#fff" stroke="#E2D3BC"/><circle cx="60" cy="126" r="18" class="b-event"/><text x="85" y="300" font-size="12" fill="#5E5170" text-anchor="middle">In this diagram</text><rect x="34" y="312" width="100" height="8" rx="4" fill="#E2D3BC"/><rect x="34" y="330" width="88" height="8" rx="4" fill="#E2D3BC"/><rect x="34" y="348" width="76" height="8" rx="4" fill="#E2D3BC"/><rect x="34" y="366" width="64" height="8" rx="4" fill="#E2D3BC"/><circle cx="198" cy="208" r="18" class="b-event"/><path d="M216 208L250 208" class="b-seq"/><rect x="250" y="176" width="90" height="64" rx="10" class="b-fill"/><text class="b-text"><tspan x="295" y="208" dominant-baseline="central"></tspan></text><text x="295" y="213" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Task</text><path d="M340 208L376 208" class="b-seq"/><path d="M400 184L424 208L400 232L376 208Z" class="b-gw"/><path d="M-9 -11.5-6.3-11.5 0-2.6 6.3-11.5 9-11.5 1.7 0 9 11.5 6.3 11.5 0 2.6-6.3 11.5-9 11.5-1.7 0Z" class="b-ink" transform="translate(400 208) scale(0.96)"/><path d="M424 208L470 208" class="b-seq"/><rect x="470" y="176" width="90" height="64" rx="10" class="b-fill"/><text class="b-text"><tspan x="515" y="208" dominant-baseline="central"></tspan></text><text x="515" y="213" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Task</text><path d="M560 208L606 208" class="b-seq"/><circle cx="624" cy="208" r="16.8" class="b-end"/><path d="M400 232V300H606" class="b-seq"/><circle cx="624" cy="300" r="16.8" class="b-end"/><rect x="306" y="170" width="40" height="76" rx="4" fill="none" stroke="none"/><text x="770" y="130" font-size="13" fill="#2B1B3D" font-weight="700">Properties</text><text x="885" y="130" font-size="13" fill="#2B1B3D" font-weight="700">Check</text><rect x="770" y="140" width="200" height="24" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="770" y="176" width="200" height="56" rx="5" fill="#fff" stroke="#E2D3BC"/><rect x="770" y="244" width="200" height="24" rx="5" fill="#fff" stroke="#E2D3BC"/><circle cx="160" cy="110" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="160" y="115" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="140" cy="296" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="140" y="301" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="296" cy="160" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="296" y="165" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="640" cy="60" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="640" y="65" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="770" cy="60" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="770" y="65" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><circle cx="800" cy="106" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="800" y="111" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><circle cx="912" cy="106" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="912" y="111" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><circle cx="38" cy="416" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="38" y="421" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="58" y="421" font-size="13" fill="#2B1B3D">Palette: drag the elements</text><circle cx="38" cy="446" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="38" y="451" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="58" y="451" font-size="13" fill="#2B1B3D">In this diagram: a list of everything there</text><circle cx="38" cy="476" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="38" y="481" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="58" y="481" font-size="13" fill="#2B1B3D">Canvas, with actions beside the element</text><circle cx="38" cy="506" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="38" y="511" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="58" y="511" font-size="13" fill="#2B1B3D">File and Arrange: open, save, export, lay out</text><circle cx="528" cy="416" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="528" y="421" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="548" y="421" font-size="13" fill="#2B1B3D">Simulate: opens the execution panels</text><circle cx="528" cy="446" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="528" y="451" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="548" y="451" font-size="13" fill="#2B1B3D">Properties: name, type, condition, duration</text><circle cx="528" cy="476" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="528" y="481" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="548" y="481" font-size="13" fill="#2B1B3D">Check: standard errors and token analysis</text></svg>
