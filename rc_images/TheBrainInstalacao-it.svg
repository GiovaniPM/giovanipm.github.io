<text x="556" y="365" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Sincronizzazione cloud</text>
<text x="556" y="384" font-size="12.5" fill="#3E3350" text-anchor="start" xml:space="preserve">piano a pagamento; unisce desktop, web e telefono</text>
<path d="M40 432 L58 432" fill="none" stroke="#0E8074" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#at)"/>
<rect x="60" y="408" width="400" height="50" rx="10" fill="#FFFFFF" stroke="#0E8074" stroke-width="1.5"/>
<text x="76" y="429" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Kubernetes</text>
<text x="76" y="448" font-size="12.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Deployment con PVC, Service e CronJob di importazione</text>
