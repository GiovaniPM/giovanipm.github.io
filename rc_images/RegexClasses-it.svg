<title id="t">Classi di caratteri: chi corrisponde a chi</title>
<desc id="d">Tabella con i caratteri a, Z, 7, spazio, trattino basso, é, trattino e punto nelle colonne, e otto classi nelle righe: [a-z], [A-Za-z], [0-9] o \d, \w, \s, [^a-z], [À-ü] e il punto. Un segno verde indica che il carattere corrisponde alla classe. Per esempio, \w corrisponde ad a, Z, 7 e trattino basso, ma non a é né al trattino.</desc>
