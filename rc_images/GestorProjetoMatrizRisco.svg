<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
<title id="t">Matriz de risco: probabilidade vezes impacto</title>
<desc id="d">Matriz de três por três. Linhas de probabilidade alta, média e baixa; colunas de impacto baixo, médio e alto. O nível é o produto: 1 ou 2 é baixo, 3 ou 4 é médio, 6 é alto e 9 é crítico. À direita, o que aumenta cada eixo no app. Probabilidade: atraso, bloqueio, avanço abaixo do plano, início não feito, predecessora com problema, sem atualização, sem responsável, responsável sobrecarregado. Impacto: caminho crítico, folga pequena, marco, muitas sucessoras, duração longa.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="345.0" y="32" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Impacto →</text><text x="40" y="205.0" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(-90 40 205.0)">Probabilidade →</text><text x="215.0" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#756986">Baixo</text><text x="345.0" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#756986">Médio</text><text x="475.0" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#756986">Alto</text><text x="140" y="120.0" font-size="14" font-weight="bold" text-anchor="end" fill="#756986">Alta</text><rect x="153" y="73" width="124" height="84" rx="10" fill="#ffe066"/><text x="215.0" y="112" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">3</text><text x="215.0" y="136" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Médio</text><rect x="283" y="73" width="124" height="84" rx="10" fill="#ffc078"/><text x="345.0" y="112" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">6</text><text x="345.0" y="136" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Alto</text><rect x="413" y="73" width="124" height="84" rx="10" fill="#ff8787"/><text x="475.0" y="112" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">9</text><text x="475.0" y="136" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Crítico</text><text x="140" y="210.0" font-size="14" font-weight="bold" text-anchor="end" fill="#756986">Média</text><rect x="153" y="163" width="124" height="84" rx="10" fill="#b2f2bb"/><text x="215.0" y="202" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">2</text><text x="215.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Baixo</text><rect x="283" y="163" width="124" height="84" rx="10" fill="#ffe066"/><text x="345.0" y="202" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">4</text><text x="345.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Médio</text><rect x="413" y="163" width="124" height="84" rx="10" fill="#ffc078"/><text x="475.0" y="202" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">6</text><text x="475.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Alto</text><text x="140" y="300.0" font-size="14" font-weight="bold" text-anchor="end" fill="#756986">Baixa</text><rect x="153" y="253" width="124" height="84" rx="10" fill="#b2f2bb"/><text x="215.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">1</text><text x="215.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Baixo</text><rect x="283" y="253" width="124" height="84" rx="10" fill="#b2f2bb"/><text x="345.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">2</text><text x="345.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Baixo</text><rect x="413" y="253" width="124" height="84" rx="10" fill="#ffe066"/><text x="475.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">3</text><text x="475.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Médio</text><text x="345.0" y="370" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Probabilidade × Impacto = 1 … 9</text><rect x="600" y="60" width="370" height="200" rx="12" fill="#FFFFFF" stroke="#F1E2CF"/><text x="616" y="88" font-size="16" font-weight="bold" text-anchor="start" fill="#B35300">Sobe a probabilidade</text><text x="622" y="116" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• atraso ou bloqueio</text><text x="622" y="139" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• avanço abaixo do plano</text><text x="622" y="162" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• início previsto já passou</text><text x="622" y="185" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• predecessora atrasada/bloqueada</text><text x="622" y="208" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• sem atualização ou responsável</text><text x="622" y="231" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• responsável sobrecarregado</text><rect x="600" y="276" width="370" height="162" rx="12" fill="#FFFFFF" stroke="#F1E2CF"/><text x="616" y="304" font-size="16" font-weight="bold" text-anchor="start" fill="#5B2A86">Sobe o impacto</text><text x="622" y="332" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• caminho crítico (folga 0)</text><text x="622" y="355" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• folga até 5 dias</text><text x="622" y="378" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• marco</text><text x="622" y="401" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• muitas sucessoras</text><text x="622" y="424" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• duração longa (10+ dias)</text>
</g></svg>
