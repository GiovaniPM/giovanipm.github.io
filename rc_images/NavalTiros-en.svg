<rect x="555.9" y="267" width="14" height="14" fill="#C2185B" transform="rotate(45 562.9 274)"/>
<text x="576.9" y="279.0" font-size="13" text-anchor="start" font-weight="bold" fill="#C2185B">53</text>
<text x="236.0" y="324.0" font-size="16" text-anchor="end" font-weight="bold" fill="#2B1B3D">Admiral</text>
<rect x="381.8" y="310" width="123.5" height="16" rx="8" fill="#0E8074" opacity=".28"/>
<circle cx="439.4" cy="318" r="8" fill="#0E8074"/>
<text x="453.4" y="323.0" font-size="13" text-anchor="start" font-weight="bold" fill="#0E8074">38</text>
<rect x="406.5" y="336" width="197.6" height="16" rx="8" fill="#C2185B" opacity=".28"/>
<rect x="481.8" y="337" width="14" height="14" fill="#C2185B" transform="rotate(45 488.8 344)"/>
<text x="502.8" y="349.0" font-size="13" text-anchor="start" font-weight="bold" fill="#C2185B">44</text>
<circle cx="260" cy="435" r="8" fill="#0E8074"/><text x="276.0" y="440.0" font-size="14" text-anchor="start" font-weight="normal" fill="#2B1B3D">ships may not touch</text>
<rect x="573" y="428" width="14" height="14" fill="#C2185B" transform="rotate(45 580 435)"/><text x="596.0" y="440.0" font-size="14" text-anchor="start" font-weight="normal" fill="#2B1B3D">ships may touch</text>
<text x="500.0" y="470.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">Marker: median. Band: the middle 80% of games (10th to 90th percentile). 5,000 games per bar, random fleets,</text>
<text x="500.0" y="487.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">the game's own code.</text>
