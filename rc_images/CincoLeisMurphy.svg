<text x="225.0" y="139" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">de código</text>
<rect x="306" y="100" width="110" height="330" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
