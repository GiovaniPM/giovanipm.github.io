<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Lei de Murphy: camadas de proteção</title>
<desc id="d">Uma mudança de software precisa atravessar cinco camadas de proteção antes de chegar ao usuário: revisão de código, testes automatizados, implantação gradual, monitoramento e alertas, e plano de volta. Quatro erros entram. O nome de variável trocado é barrado na revisão; o cálculo errado de frete, nos testes; a lentidão com dados reais, na implantação gradual; a falha só no horário de pico é detectada pelo monitoramento e desfeita pelo plano de volta. Nenhum chega ao usuário. Mensagem: nenhuma camada pega tudo, mas juntas elas impedem que o erro chegue ao usuário.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
