<text x="912.0" y="258" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Usuário</text>
<text x="912.0" y="280" font-size="20" fill="#2A9D8F" text-anchor="middle" font-weight="700">✓</text>
