<rect x="146" y="283" width="175" height="20" rx="6" fill="#FFF7EC" opacity="0.92"/>
<text x="153" y="298" font-size="12.5" fill="#E23B3B" font-weight="700">Lentidão com dados reais</text>
<line x1="140" y1="375" x2="619.0" y2="375" stroke="#E23B3B" stroke-width="2.5" stroke-dasharray="7 5"/>
