<path d="M628.0 370 L638.0 380 M638.0 370 L628.0 380" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
<rect x="146" y="348" width="195" height="20" rx="6" fill="#FFF7EC" opacity="0.92"/>
<text x="153" y="363" font-size="12.5" fill="#E23B3B" font-weight="700">Falha só no horário de pico</text>
<path d="M647.0 375 C 683.0 405, 729.0 405, 769.0 392" fill="none" stroke="#5B2A86" stroke-width="2" marker-end="url(#ap)"/>
<text x="769.0" y="380" font-size="22" fill="#5B2A86" text-anchor="middle" font-weight="700">↺</text>
<text x="500.0" y="480" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">A pergunta de Murphy: o que pode dar errado aqui, e quem vai perceber primeiro?</text>
</svg>
