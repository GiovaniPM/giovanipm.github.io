<text x="361.0" y="139" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">automatizados</text>
<rect x="442" y="100" width="110" height="330" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<path d="M442 112 a12 12 0 0 1 12 -12 h86 a12 12 0 0 1 12 12 v38 h-110 z" fill="#FFB703"/>
<text x="497.0" y="121" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Implantação</text>
<text x="497.0" y="139" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">gradual</text>
<rect x="578" y="100" width="110" height="330" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.5"/>
<path d="M578 112 a12 12 0 0 1 12 -12 h86 a12 12 0 0 1 12 12 v38 h-110 z" fill="#C2185B"/>
<text x="633.0" y="121" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Monitoramento</text>
<text x="633.0" y="139" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">e alertas</text>
