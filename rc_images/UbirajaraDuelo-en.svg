<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-labelledby="t d">
<title id="t">How to read a duel</title>
<desc id="d">Two attack patterns, with the timings from the game code. Club, used by Pojucã in the first duel and by Cori: he approaches, raises the weapon for 0.5 seconds (Cori 0.75), strikes, and spends 0.8 seconds recovering: that is the window to strike; a shield raised facing him parries the blow, and a parried Cori staggers for 1.6 seconds. Lunge, used by Pojucã with the spear and by Agniná: he gets ready for 0.7 seconds and charges in a straight line; if the lunge hits the shield from the front he staggers for 1.6 seconds, the best window; if he misses he spends 0.9 seconds recovering. A yellow ring on the ground marks the wind-up.</desc>
<rect width="1000" height="390" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="40" y="50.0" font-size="16" fill="#5B2A86" text-anchor="start" font-weight="bold">Club · Pojucã I and Cori</text><rect x="40.0" y="64" width="196.4" height="74" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="138.22222222222223" y="94.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">approaches</text><line x1="237.4" y1="101" x2="243.4" y2="101" stroke="#756986" stroke-width="2"/><rect x="244.4" y="64" width="183.7" height="74" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="336.27777777777777" y="94.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">raises weapon</text><text x="336.27777777777777" y="118.0" font-size="13" fill="#756986" text-anchor="middle">0.5 s (Cori 0.75 s)</text><line x1="429.1" y1="101" x2="435.1" y2="101" stroke="#756986" stroke-width="2"/><rect x="436.1" y="64" width="234.8" height="74" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="2"/><text x="553.5" y="94.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">strike</text><text x="553.5" y="118.0" font-size="13" fill="#756986" text-anchor="middle">front shield parries</text><line x1="671.9" y1="101" x2="677.9" y2="101" stroke="#756986" stroke-width="2"/><rect x="678.9" y="64" width="273.1" height="74" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="815.4444444444445" y="94.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">recovers 0.8 s</text><text x="815.4444444444445" y="118.0" font-size="13" fill="#0E8074" text-anchor="middle" font-weight="bold">STRIKE NOW</text><text x="40" y="200.0" font-size="16" fill="#5B2A86" text-anchor="start" font-weight="bold">Lunge · Pojucã II and Agniná</text><rect x="40.0" y="214" width="178.3" height="74" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="129.1645569620253" y="244.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">waits 1.1 s</text><line x1="219.3" y1="251" x2="225.3" y2="251" stroke="#756986" stroke-width="2"/><rect x="226.3" y="214" width="178.3" height="74" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="315.49367088607596" y="244.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">winds up 0.7 s</text><text x="315.49367088607596" y="268.0" font-size="13" fill="#756986" text-anchor="middle">yellow ring</text><line x1="405.7" y1="251" x2="411.7" y2="251" stroke="#756986" stroke-width="2"/><rect x="412.7" y="214" width="213.3" height="74" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="2"/><text x="519.2911392405064" y="244.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">straight lunge</text><text x="519.2911392405064" y="268.0" font-size="13" fill="#756986" text-anchor="middle">front shield</text><line x1="626.9" y1="251" x2="632.9" y2="251" stroke="#756986" stroke-width="2"/><rect x="633.9" y="214" width="318.1" height="74" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="792.9620253164558" y="244.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">parried: staggers 1.6 s</text><text x="792.9620253164558" y="268.0" font-size="13" fill="#0E8074" text-anchor="middle" font-weight="bold">STRIKE NOW</text><circle cx="62" cy="355" r="15" fill="none" stroke="#E0B400" stroke-width="4"/><text x="92" y="360.0" font-size="14" fill="#2B1B3D" text-anchor="start">Yellow ring on the ground = he is about to attack. Face him and hold the shield (L or Shift).</text></g>
</svg>
