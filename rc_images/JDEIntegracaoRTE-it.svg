<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Flusso dei Real-Time Events</title>
<desc id="d">Una transazione in JDE, come un ordine di vendita nel P4210, fa sì che la business function generi un evento XML, per esempio RTSOOUT. I kernel degli eventi dell'Enterprise Server, con la tabella F90710, passano l'evento al Transaction Server, su WebLogic con code JMS e consegna garantita per sottoscrittore, che lo distribuisce a una coda JMS o MQ, all'Orchestrator come notifica o a un web service tramite BSSV. I tipi di evento sono Z event, real-time event e XAPI. La configurazione attiva l'evento nel P90701A, registra sottoscrittori e trasporti nel P90702A, definisce i kernel nel jde.ini e installa il Transaction Server con Server Manager.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
