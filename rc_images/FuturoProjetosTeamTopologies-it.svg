<rect x="650" y="86" width="26" height="26" rx="6" fill="#FFE7A3" stroke="#E0A100" stroke-width="3"/>
<text x="690" y="104" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Allineato al flusso</text>
<text x="690" y="124" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">consegna valore end-to-end</text><text x="690" y="140" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">su un flusso di cambiamento</text>
<rect x="650" y="152" width="26" height="26" rx="6" fill="#D6E6FF" stroke="#3A86FF" stroke-width="3"/>
<text x="690" y="170" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Piattaforma</text>
<text x="690" y="190" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">offre servizi interni</text><text x="690" y="206" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">in self-service</text>
