<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Team Topologies: quattro tipi di team</title>
<desc id="d">Diagramma del Team Topologies. Tre team allineati al flusso, in giallo, seguono il flusso di cambiamento da sinistra a destra. Un team abilitante, in verde, attraversa i team in verticale. Un team di sottosistema complicato, in rosso, collabora con uno dei team. Un team di piattaforma, in blu, li sostiene tutti con servizi in self-service. Le modalità di interazione sono collaborazione, X-as-a-Service e facilitazione.</desc>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Team Topologies: quattro tipi di team</text>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFD9D9"/><rect width="3" height="8" fill="#E0A100" opacity=".6"/></pattern></defs>
