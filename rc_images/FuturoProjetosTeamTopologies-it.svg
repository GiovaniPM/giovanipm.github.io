<text x="535" y="336" font-size="13.5" font-weight="700" fill="#2B1B3D" text-anchor="middle">Sottosistema</text><text x="535" y="352" font-size="13.5" font-weight="700" fill="#2B1B3D" text-anchor="middle">complicato</text>
