<text x="690" y="256" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">aiuta altri team ad</text><text x="690" y="272" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">acquisire capacità</text>
<rect x="650" y="284" width="26" height="26" rx="6" fill="#FFD9D9" stroke="#FF6B6B" stroke-width="3"/>
<text x="690" y="302" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Sottosistema complicato</text>
<text x="690" y="322" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">gestisce parti che</text><text x="690" y="338" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">richiedono specialisti</text>
<text x="650" y="362" font-size="15" font-weight="700" fill="#5B2A86" text-anchor="start">Modalità di interazione</text>
<rect x="650" y="376" width="22" height="22" rx="4" fill="#FFE7A3" stroke="#E0A100" stroke-width="2"/><rect x="662" y="376" width="22" height="22" rx="4" fill="url(#hatch)" stroke="#FF6B6B" stroke-width="2"/>
<text x="698" y="393" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">Collaborazione</text>
<path d="M650 420 v-8 h34 v8" fill="none" stroke="#3A86FF" stroke-width="3"/><rect x="650" y="422" width="34" height="12" rx="3" fill="#D6E6FF" stroke="#3A86FF" stroke-width="2"/>
<text x="698" y="431" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">X-as-a-Service</text>
