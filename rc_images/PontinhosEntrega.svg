<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
<title id="t">Entregar dois quadrados: pela ponta ou pelo meio</title>
<desc id="d">Dois desenhos de uma cadeia de 2 quadrados. À esquerda, a cadeia foi aberta pela ponta: só o primeiro quadrado tem três lados, e quem recebe pode recusar os dois traçando a outra ponta. À direita, a cadeia foi aberta pela linha do meio: os dois quadrados ficam com três lados, cada um fechado por uma linha diferente, e não dá para recusar os dois com uma só jogada.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">Entregar dois quadrados: pela ponta ou pelo meio</text>
<g transform="translate(133.9 76) scale(1.35)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="ln last" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="gridln" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/></g><line x1="331.0" y1="111.1" x2="331.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><text x="250" y="261.20000000000005" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">Pela ponta</text><text x="250" y="282.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">Quem recebe pode pegar os dois ou</text><text x="250" y="303.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">recusar os dois, traçando a outra ponta,</text><text x="250" y="324.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">e ficar com o controle.</text><g transform="translate(633.9 76) scale(1.35)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="gridln" x1="26" y1="26" x2="26" y2="86"/><line class="ln last" style="--len:60" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/></g><line x1="669.0" y1="111.1" x2="669.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><line x1="831.0" y1="111.1" x2="831.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><text x="750" y="261.20000000000005" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">Pelo meio</text><text x="750" y="282.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">Cada quadrado fecha com uma linha.</text><text x="750" y="303.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">Não dá para recusar os dois</text><text x="750" y="324.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">com uma jogada só.</text></svg>
