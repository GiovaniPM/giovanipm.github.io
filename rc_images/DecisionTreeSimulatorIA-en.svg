<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" role="img" aria-labelledby="t d"><title id="t">Where the AI fits in the decision tree</title><desc id="d">Six steps: you describe the decision, the AI interviews and builds the JSON, the app opens the file, the app checks and calculates, you review the assumptions and you decide. From the review, you can go back to the AI.</desc><rect width="1000" height="214" rx="18" fill="#FFF7EC"/><text x="500" y="32" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D">Where the AI fits in the decision tree</text><rect x="18" y="56" width="150" height="92" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="93" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#B35300">You</text><text x="93" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Describe</text><text x="93" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2B1B3D">the decision</text><path d="M170 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M181 102l-6 -4v8z" fill="#2B1B3D"/><rect x="182" y="56" width="150" height="92" rx="12" fill="#EFEAFA" stroke="#5B2A86" stroke-width="2"/><text x="257" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5B2A86">AI</text><text x="257" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Interview and</text><text x="257" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2B1B3D">build the JSON</text><path d="M334 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M345 102l-6 -4v8z" fill="#2B1B3D"/><rect x="346" y="56" width="150" height="92" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="421" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0E8074">App</text><text x="421" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Open</text><text x="421" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2B1B3D">the file</text><path d="M498 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M509 102l-6 -4v8z" fill="#2B1B3D"/><rect x="510" y="56" width="150" height="92" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="585" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0E8074">App</text><text x="585" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Check and</text><text x="585" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2B1B3D">calculate</text><path d="M662 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M673 102l-6 -4v8z" fill="#2B1B3D"/><rect x="674" y="56" width="150" height="92" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="749" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#B35300">You</text><text x="749" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Review the</text><text x="749" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2B1B3D">assumptions</text><path d="M826 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M837 102l-6 -4v8z" fill="#2B1B3D"/><rect x="838" y="56" width="150" height="92" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="913" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#B35300">You</text><text x="913" y="116" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Decide</text><path d="M749 150V178H257V158" fill="none" stroke="#756986" stroke-width="2" stroke-dasharray="6 4"/><path d="M257 150l-4 7h8z" fill="#756986"/><text x="503" y="199" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#756986">if needed, go back to the AI</text></svg>