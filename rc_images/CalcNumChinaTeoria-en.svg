<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Elimination: make zeros to simplify</title>
<desc id="d">Four stages of elimination. Stage 1: set up the table with the numbers 3, 2, 1 and 39; 2, 3, 1 and 34; 1, 2, 3 and 26. Stage 2: multiply row 2 by 3 and subtract row 1 twice, and multiply row 3 by 3 and subtract row 1, zeroing the first column: the rows become 0, 5, 1 and 24 and 0, 4, 8 and 39. Stage 3: multiply row 3 by 5 and subtract 4 times row 2: 0, 0, 36 and 99. Stage 4: back-substitute from the bottom up: low = 99 divided by 36 = 2.75; medium = (24 − 2.75) divided by 5 = 4.25; high = (39 − 2 × 4.25 − 2.75) divided by 3 = 9.25.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Elimination: make zeros to simplify</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">The same method we now call Gaussian elimination</text><rect x="40" y="100" width="225" height="270" rx="12" fill="#F1E8FA"/><text x="152" y="130" font-size="16" fill="#5B2A86" text-anchor="middle" font-weight="700">1. Set up the table</text><rect x="42" y="154" width="214" height="114" rx="8" fill="#FFFFFF" stroke="#D9C7AE" stroke-width="2"/><text x="67" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="113" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="159" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="219" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">39</text><text x="67" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="113" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="159" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="219" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">34</text><text x="67" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="113" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="159" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="219" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">26</text><line x1="193" y1="160" x2="193" y2="256" stroke="#756986" stroke-width="1.5"/><text x="152" y="310" font-size="13" fill="#2B1B3D" text-anchor="middle">one row per bundle</text><rect x="285" y="100" width="225" height="270" rx="12" fill="#E6F0FF"/><text x="397" y="130" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">2. Zero column 1</text><rect x="287" y="154" width="214" height="114" rx="8" fill="#FFFFFF" stroke="#D9C7AE" stroke-width="2"/><text x="312" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="358" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="404" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="464" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">39</text><text x="312" y="214" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="358" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">5</text><text x="404" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="464" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">24</text><text x="312" y="248" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="358" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">4</text><text x="404" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">8</text><text x="464" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">39</text><line x1="438" y1="160" x2="438" y2="256" stroke="#756986" stroke-width="1.5"/><text x="397" y="310" font-size="13" fill="#2B1B3D" text-anchor="middle">R2 = 3·R2 − 2·R1</text><text x="397" y="332" font-size="13" fill="#2B1B3D" text-anchor="middle">R3 = 3·R3 − R1</text><rect x="530" y="100" width="225" height="270" rx="12" fill="#E2F6F2"/><text x="642" y="130" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">3. One more zero</text><rect x="532" y="154" width="214" height="114" rx="8" fill="#FFFFFF" stroke="#D9C7AE" stroke-width="2"/><text x="557" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">3</text><text x="603" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">2</text><text x="649" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="709" y="180" font-size="17" fill="#2B1B3D" text-anchor="middle">39</text><text x="557" y="214" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="603" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">5</text><text x="649" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">1</text><text x="709" y="214" font-size="17" fill="#2B1B3D" text-anchor="middle">24</text><text x="557" y="248" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="603" y="248" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">0</text><text x="649" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">36</text><text x="709" y="248" font-size="17" fill="#2B1B3D" text-anchor="middle">99</text><line x1="683" y1="160" x2="683" y2="256" stroke="#756986" stroke-width="1.5"/><text x="642" y="310" font-size="13" fill="#2B1B3D" text-anchor="middle">R3 = 5·R3 − 4·R2</text><text x="642" y="332" font-size="13" fill="#2B1B3D" text-anchor="middle">now it is a “staircase”</text><rect x="775" y="100" width="190" height="270" rx="12" fill="#FFF1C9"/><text x="870" y="130" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">4. Solve back up</text><text x="870" y="170" font-size="13" fill="#2B1B3D" text-anchor="middle">low = 99 ÷ 36</text><text x="870" y="198" font-size="13" fill="#2B1B3D" text-anchor="middle">= 2.75</text><text x="870" y="226" font-size="13" fill="#2B1B3D" text-anchor="middle">medium = (24 − 2.75) ÷ 5</text><text x="870" y="254" font-size="13" fill="#2B1B3D" text-anchor="middle">= 4.25</text><text x="870" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">high = (39 − 8.5 − 2.75) ÷ 3</text><text x="870" y="310" font-size="13" fill="#2B1B3D" text-anchor="middle">= 9.25</text><rect x="40" y="400" width="925" height="130" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="500" y="434" font-size="19" fill="#5B2A86" text-anchor="middle" font-weight="700">Answer: high = 9¼ dou · medium = 4¼ dou · low = 2¾ dou</text><text x="500" y="466" font-size="15" fill="#2B1B3D" text-anchor="middle">Checking row 1: 3 × 9.25 + 2 × 4.25 + 2.75 = 27.75 + 8.5 + 2.75 = 39 ✓</text><text x="500" y="500" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">In China, the arithmetic was done with rods on a board, in columns from right to left.</text>
</svg>
