<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Tre cambiamenti strutturali nell’IT</title>
<desc id="d">Tre righe confrontano l’IT prima e con l’IA. Prima: da eseguire compiti tecnici a orchestrare risultati. Seconda: dallo strumento isolato al processo end-to-end. Terza: da scrivere codice come parte costosa a decidere cosa costruire come parte costosa. Sotto, due indicatori: il 39% delle competenze chiave cambierà entro il 2030, secondo il World Economic Forum, e l’80% degli ingegneri dovrà riqualificarsi entro il 2027, secondo Gartner.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tre cambiamenti strutturali</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">L’IT smette di eseguire compiti e inizia a orchestrare risultati</text>

<text x="235" y="112" font-size="15" fill="#756986" text-anchor="middle" font-weight="700" letter-spacing="2">PRIMA</text>
<text x="765" y="112" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700" letter-spacing="2">CON L’IA</text>

<g>
<rect x="50" y="128" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="162" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Eseguire compiti tecnici</text>
<text x="235" y="186" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">programmare, configurare, documentare</text>
<line x1="430" y1="168" x2="568" y2="168" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="128" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="162" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Orchestrare risultati</text>
<text x="765" y="186" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">compiti assistiti o delegati ad agenti</text>
</g>
<g>
<rect x="50" y="223" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="257" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Strumento isolato</text>
<text x="235" y="281" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">specialista di un solo prodotto</text>
<line x1="430" y1="263" x2="568" y2="263" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="223" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="257" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Processo end-to-end</text>
<text x="765" y="281" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">dal problema a una soluzione sicura e sostenibile</text>
</g>
<g>
<rect x="50" y="318" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="352" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Scrivere codice è costoso</text>
<text x="235" y="376" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">il collo di bottiglia è costruire</text>
<line x1="430" y1="358" x2="568" y2="358" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="318" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="352" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Decidere cosa costruire è costoso</text>
<text x="765" y="376" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">il collo di bottiglia è scegliere bene</text>
</g>

<rect x="50" y="428" width="430" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="120" y="478" font-size="34" fill="#2B1B3D" text-anchor="middle" font-weight="700">39%</text>
<text x="190" y="459" font-size="14" fill="#2B1B3D">delle competenze chiave</text>
<text x="190" y="479" font-size="14" fill="#2B1B3D">cambierà entro il 2030</text>
<text x="190" y="496" font-size="12" fill="#756986" font-style="italic">World Economic Forum</text>
<rect x="520" y="428" width="430" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="590" y="478" font-size="34" fill="#2B1B3D" text-anchor="middle" font-weight="700">80%</text>
<text x="660" y="459" font-size="14" fill="#2B1B3D">degli ingegneri dovrà</text>
<text x="660" y="479" font-size="14" fill="#2B1B3D">riqualificarsi entro il 2027</text>
<text x="660" y="496" font-size="12" fill="#756986" font-style="italic">Gartner</text>
</svg>
