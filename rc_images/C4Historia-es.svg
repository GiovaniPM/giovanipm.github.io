<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
<title id="t">Cronología del modelo C4</title>
<desc id="d">1995: Kruchten publica el modelo de vistas “4+1”. 2006–2009: Raíces del C4, con Simon Brown, inspiradas en UML y en el 4+1. 2010: Los diagramas reciben nombre: contexto, contenedores, componentes y clases. 2011: Primer uso del nombre “C4”, en la QCon London. 2015–2018: “Clases” pasa a “Código” (las fuentes difieren sobre la fecha). 2018: Un artículo en InfoQ ayuda a popularizar el modelo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#756986"/></marker>
<marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#2B1B3D" font-weight="bold" text-anchor="middle">Del modelo 4+1 al C4</text><line x1="60" y1="210" x2="940" y2="210" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="210" r="11" fill="#5B2A86" stroke="#fff" stroke-width="3"/><line x1="100" y1="199" x2="100" y2="150" stroke="#5B2A86" stroke-width="2"/><text x="100" y="82" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#5B2A86" font-weight="bold" text-anchor="middle">1995</text><text x="100" y="104" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Kruchten publica el</text><text x="100" y="120" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">modelo de vistas “4+1”</text><circle cx="260" cy="210" r="11" fill="#C2185B" stroke="#fff" stroke-width="3"/><line x1="260" y1="221" x2="260" y2="270" stroke="#C2185B" stroke-width="2"/><text x="260" y="296" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#C2185B" font-weight="bold" text-anchor="middle">2006–2009</text><text x="260" y="318" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Raíces del C4, con</text><text x="260" y="334" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Simon Brown, inspiradas</text><text x="260" y="350" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">en UML y en el 4+1</text><circle cx="420" cy="210" r="11" fill="#0E8074" stroke="#fff" stroke-width="3"/><line x1="420" y1="199" x2="420" y2="150" stroke="#0E8074" stroke-width="2"/><text x="420" y="82" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#0E8074" font-weight="bold" text-anchor="middle">2010</text><text x="420" y="104" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Los diagramas reciben nombre:</text><text x="420" y="120" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">contexto, contenedores,</text><text x="420" y="136" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">componentes y clases</text><circle cx="580" cy="210" r="11" fill="#1168BD" stroke="#fff" stroke-width="3"/><line x1="580" y1="221" x2="580" y2="270" stroke="#1168BD" stroke-width="2"/><text x="580" y="296" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#1168BD" font-weight="bold" text-anchor="middle">2011</text><text x="580" y="318" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Primer uso del</text><text x="580" y="334" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">nombre “C4”, en la</text><text x="580" y="350" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">QCon London</text><circle cx="740" cy="210" r="11" fill="#B35300" stroke="#fff" stroke-width="3"/><line x1="740" y1="199" x2="740" y2="150" stroke="#B35300" stroke-width="2"/><text x="740" y="82" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#B35300" font-weight="bold" text-anchor="middle">2015–2018</text><text x="740" y="104" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">“Clases” pasa a “Código”</text><text x="740" y="120" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">(las fuentes difieren</text><text x="740" y="136" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">sobre la fecha)</text><circle cx="900" cy="210" r="11" fill="#2A9D8F" stroke="#fff" stroke-width="3"/><line x1="900" y1="221" x2="900" y2="270" stroke="#2A9D8F" stroke-width="2"/><text x="900" y="296" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#2A9D8F" font-weight="bold" text-anchor="middle">2018</text><text x="900" y="318" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">Un artículo en InfoQ ayuda</text><text x="900" y="334" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" text-anchor="middle">a popularizar el modelo</text>
