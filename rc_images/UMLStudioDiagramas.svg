<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 626" width="1000" height="626" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Os 14 diagramas da UML 2.5.1</title>
<desc id="d">Árvore com os 14 tipos de diagrama. Estrutura tem sete: classes, objetos, pacotes, componentes, estrutura composta, implantação e perfil. Comportamento tem sete: casos de uso, atividades, máquina de estados e o grupo interação, com sequência, comunicação, tempo e visão geral de interação.</desc>
