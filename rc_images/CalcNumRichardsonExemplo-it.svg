<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Simulare una barra di metallo riscaldata</title>
<desc id="d">Una barra divisa in 6 punti. L’estremità sinistra resta sempre a 100 gradi e la destra a 0; il resto parte da 0. A ogni passo, ogni punto interno diventa la media dei vicini. Passo 1: 100, 50, 0, 0, 0, 0. Passo 2: 100, 50, 25, 0, 0, 0. Passo 3: 100, 62,5, 25, 12,5, 0, 0. Passo 5: 100, 68,8, 37,5, 21,9, 6,2, 0. Passo 10: 100, 75,2, 53,7, 32,2, 16,1, 0. Passo 30: 100, 79,9, 59,9, 39,9, 19,9, 0, quasi la retta 100, 80, 60, 40, 20, 0, che è l’equilibrio.</desc>
