<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Distopie scientifiche e cosa è già arrivato</title>
<desc id="d">Una fascia che va dalla distopia all’utopia, con quattro opere. 1984, pubblicato nel 1949 e ambientato nel 1984: sorveglianza totale e controllo del linguaggio; sono già arrivati telecamere con riconoscimento facciale e capitalismo della sorveglianza. Matrix, del 1999, ambientato verso il 2199: realtà simulata controllata dalle macchine; sono arrivati la realtà virtuale e l’argomento della simulazione di Bostrom del 2003. Blade Runner, del 1982, ambientato nel 2019: androidi indistinguibili dagli umani; sono arrivati robot umanoidi, deepfake e il dubbio su chi è umano. Star Trek, del 1966, ambientato nel XXIII secolo: utopia di abbondanza ed esplorazione; sono arrivati cellulare, tablet, traduzione simultanea e il tricorder dell’XPRIZE del 2017.</desc>
