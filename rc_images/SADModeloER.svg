<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Modelo entidade-relacionamento (notação de Chen)</title>
<desc id="d">Diagrama entidade-relacionamento. Aluno se relaciona com Curso pelo relacionamento matricula-se, com cardinalidade N para M e o atributo nota. Professor ministra Curso, com cardinalidade 1 para N e participação total de Curso, indicada por linha dupla. Aluno tem matrícula como chave, nome, telefones multivalorado e idade derivada. Curso tem código como chave e título. Professor tem registro como chave, nome e endereço composto de rua e cidade.</desc>
