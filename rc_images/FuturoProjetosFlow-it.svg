<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Flow Framework: cosa scorre e come misurarlo</title>
<desc id="d">Diagramma del Flow Framework. Un flusso di valore porta la domanda fino al cliente. Vi scorrono quattro elementi di flusso: funzionalità, nuovo valore di business; difetto, corregge la qualità; rischio, sicurezza e conformità; e debito tecnico, rimuove ostacoli futuri. Cinque metriche di flusso: velocità, elementi completati per periodo; tempo, dall’inizio del lavoro alla consegna; efficienza, tempo attivo diviso tempo totale; carico, elementi in corso; e distribuzione, quota di ogni tipo di elemento.</desc>
