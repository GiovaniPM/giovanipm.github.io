<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Three structural shifts in IT</title>
<desc id="d">Three rows compare IT before and with AI. First: from executing technical tasks to orchestrating outcomes. Second: from the isolated tool to the end-to-end process. Third: from writing code as the costly part to deciding what to build as the costly part. Below, two indicators: 39% of core skills are expected to change by 2030, according to the World Economic Forum, and 80% of engineers will need to upskill by 2027, according to Gartner.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Three structural shifts</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">IT stops executing tasks and starts orchestrating outcomes</text>

<text x="235" y="112" font-size="15" fill="#756986" text-anchor="middle" font-weight="700" letter-spacing="2">BEFORE</text>
<text x="765" y="112" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700" letter-spacing="2">WITH AI</text>

<g>
<rect x="50" y="128" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="162" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Executing technical tasks</text>
<text x="235" y="186" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">coding, configuring, documenting</text>
<line x1="430" y1="168" x2="568" y2="168" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="128" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="162" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Orchestrating outcomes</text>
<text x="765" y="186" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">tasks assisted by or delegated to agents</text>
</g>
<g>
<rect x="50" y="223" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="257" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Isolated tool</text>
<text x="235" y="281" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">specialist in a single product</text>
<line x1="430" y1="263" x2="568" y2="263" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="223" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="257" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">End-to-end process</text>
<text x="765" y="281" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">from problem to a secure, sustainable solution</text>
</g>
<g>
<rect x="50" y="318" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="352" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Writing code is costly</text>
<text x="235" y="376" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">the bottleneck is building</text>
<line x1="430" y1="358" x2="568" y2="358" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="318" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="352" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Deciding what to build is costly</text>
<text x="765" y="376" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">the bottleneck is choosing well</text>
</g>

<rect x="50" y="428" width="430" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="120" y="478" font-size="34" fill="#2B1B3D" text-anchor="middle" font-weight="700">39%</text>
<text x="190" y="459" font-size="14" fill="#2B1B3D">of core skills are expected</text>
<text x="190" y="479" font-size="14" fill="#2B1B3D">to change by 2030</text>
<text x="190" y="496" font-size="12" fill="#756986" font-style="italic">World Economic Forum</text>
<rect x="520" y="428" width="430" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="590" y="478" font-size="34" fill="#2B1B3D" text-anchor="middle" font-weight="700">80%</text>
<text x="660" y="459" font-size="14" fill="#2B1B3D">of engineers will need</text>
<text x="660" y="479" font-size="14" fill="#2B1B3D">to upskill by 2027</text>
<text x="660" y="496" font-size="12" fill="#756986" font-style="italic">Gartner</text>
</svg>
