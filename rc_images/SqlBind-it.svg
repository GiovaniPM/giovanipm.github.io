<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 508" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Variabili di BIND: un piano, molte esecuzioni</title>
<desc id="d">A sinistra, tre query identiche tranne il numero nel WHERE, 674, 234 e 332; ognuna provoca un hard parse, in cui il database analizza il comando e costruisce un piano. A destra, la stessa query con la variabile :cust_no che riceve i tre valori; solo la prima esecuzione fa un hard parse, e le altre due riusano il piano con un soft parse. Sotto, la shared pool, dove Oracle conserva il testo e il piano di ogni comando.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="508" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Variabili di BIND: un piano, molte esecuzioni</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Il database riconosce un comando dal testo esatto</text>
<text x="250.0" y="116.0" font-size="15" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">Con i letterali</text>
<text x="750.0" y="116.0" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700" xml:space="preserve">Con una variabile di BIND</text>
<rect x="30.0" y="136.0" width="250.0" height="48.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="42" y="156" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">SELECT </tspan><tspan fill="#F7F0FF">… FROM cust</tspan></text>
<text x="42" y="174" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">WHERE </tspan><tspan fill="#F7F0FF">id = </tspan><tspan fill="#5FD3C4">674</tspan></text>
<line x1="286" y1="160" x2="330" y2="160" stroke="#D62828" stroke-width="2" marker-end="url(#am)"/>
<rect x="352.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(0 356 160)"/><rect x="352.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(45 356 160)"/><rect x="352.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(90 356 160)"/><rect x="352.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(135 356 160)"/><rect x="352.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(180 356 160)"/><rect x="352.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(225 356 160)"/><rect x="352.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(270 356 160)"/><rect x="352.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(315 356 160)"/><circle cx="356" cy="160" r="14" fill="#D62828"/><circle cx="356" cy="160" r="5.6000000000000005" fill="#FFFFFF"/>
<text x="382.0" y="156.0" font-size="12.5" fill="#D62828" font-weight="700" xml:space="preserve">hard parse</text><text x="382.0" y="173.0" font-size="12" fill="#3E3350" xml:space="preserve">analizza e crea il piano</text>
<rect x="30.0" y="200.0" width="250.0" height="48.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="42" y="220" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">SELECT </tspan><tspan fill="#F7F0FF">… FROM cust</tspan></text>
<text x="42" y="238" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">WHERE </tspan><tspan fill="#F7F0FF">id = </tspan><tspan fill="#5FD3C4">234</tspan></text>
<line x1="286" y1="224" x2="330" y2="224" stroke="#D62828" stroke-width="2" marker-end="url(#am)"/>
<rect x="352.5" y="205" width="7" height="8" fill="#D62828" transform="rotate(0 356 224)"/><rect x="352.5" y="205" width="7" height="8" fill="#D62828" transform="rotate(45 356 224)"/><rect x="352.5" y="205" width="7" height="8" fill="#D62828" transform="rotate(90 356 224)"/><rect x="352.5" y="205" width="7" height="8" fill="#D62828" transform="rotate(135 356 224)"/><rect x="352.5" y="205" width="7" height="8" fill="#D62828" transform="rotate(180 356 224)"/><rect x="352.5" y="205" width="7" height="8" fill="#D62828" transform="rotate(225 356 224)"/><rect x="352.5" y="205" width="7" height="8" fill="#D62828" transform="rotate(270 356 224)"/><rect x="352.5" y="205" width="7" height="8" fill="#D62828" transform="rotate(315 356 224)"/><circle cx="356" cy="224" r="14" fill="#D62828"/><circle cx="356" cy="224" r="5.6000000000000005" fill="#FFFFFF"/>
<text x="382.0" y="220.0" font-size="12.5" fill="#D62828" font-weight="700" xml:space="preserve">hard parse</text><text x="382.0" y="237.0" font-size="12" fill="#3E3350" xml:space="preserve">analizza e crea il piano</text>
<rect x="30.0" y="264.0" width="250.0" height="48.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="42" y="284" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">SELECT </tspan><tspan fill="#F7F0FF">… FROM cust</tspan></text>
<text x="42" y="302" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">WHERE </tspan><tspan fill="#F7F0FF">id = </tspan><tspan fill="#5FD3C4">332</tspan></text>
<line x1="286" y1="288" x2="330" y2="288" stroke="#D62828" stroke-width="2" marker-end="url(#am)"/>
<rect x="352.5" y="269" width="7" height="8" fill="#D62828" transform="rotate(0 356 288)"/><rect x="352.5" y="269" width="7" height="8" fill="#D62828" transform="rotate(45 356 288)"/><rect x="352.5" y="269" width="7" height="8" fill="#D62828" transform="rotate(90 356 288)"/><rect x="352.5" y="269" width="7" height="8" fill="#D62828" transform="rotate(135 356 288)"/><rect x="352.5" y="269" width="7" height="8" fill="#D62828" transform="rotate(180 356 288)"/><rect x="352.5" y="269" width="7" height="8" fill="#D62828" transform="rotate(225 356 288)"/><rect x="352.5" y="269" width="7" height="8" fill="#D62828" transform="rotate(270 356 288)"/><rect x="352.5" y="269" width="7" height="8" fill="#D62828" transform="rotate(315 356 288)"/><circle cx="356" cy="288" r="14" fill="#D62828"/><circle cx="356" cy="288" r="5.6000000000000005" fill="#FFFFFF"/>
<text x="382.0" y="284.0" font-size="12.5" fill="#D62828" font-weight="700" xml:space="preserve">hard parse</text><text x="382.0" y="301.0" font-size="12" fill="#3E3350" xml:space="preserve">analizza e crea il piano</text>
<text x="250.0" y="350.0" font-size="13" fill="#3E3350" text-anchor="middle" font-style="italic" xml:space="preserve">tre testi diversi, tre piani costruiti</text>
<rect x="530.0" y="136.0" width="250.0" height="48.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="542" y="156" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">SELECT </tspan><tspan fill="#F7F0FF">… FROM cust</tspan></text>
<text x="542" y="174" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">WHERE </tspan><tspan fill="#F7F0FF">id = </tspan><tspan fill="#5FD3C4">:cust_no</tspan></text>
<text x="790.0" y="166.0" font-size="12.5" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">= 674</text>
<rect x="530.0" y="200.0" width="250.0" height="48.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="542" y="220" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">SELECT </tspan><tspan fill="#F7F0FF">… FROM cust</tspan></text>
<text x="542" y="238" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">WHERE </tspan><tspan fill="#F7F0FF">id = </tspan><tspan fill="#5FD3C4">:cust_no</tspan></text>
<text x="790.0" y="230.0" font-size="12.5" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">= 234</text>
<rect x="530.0" y="264.0" width="250.0" height="48.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="542" y="284" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">SELECT </tspan><tspan fill="#F7F0FF">… FROM cust</tspan></text>
<text x="542" y="302" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">WHERE </tspan><tspan fill="#F7F0FF">id = </tspan><tspan fill="#5FD3C4">:cust_no</tspan></text>
<text x="790.0" y="294.0" font-size="12.5" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">= 332</text>
<rect x="886.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(0 890 160)"/><rect x="886.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(45 890 160)"/><rect x="886.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(90 890 160)"/><rect x="886.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(135 890 160)"/><rect x="886.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(180 890 160)"/><rect x="886.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(225 890 160)"/><rect x="886.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(270 890 160)"/><rect x="886.5" y="141" width="7" height="8" fill="#D62828" transform="rotate(315 890 160)"/><circle cx="890" cy="160" r="14" fill="#D62828"/><circle cx="890" cy="160" r="5.6000000000000005" fill="#FFFFFF"/><text x="912.0" y="156.0" font-size="12" fill="#D62828" font-weight="700" xml:space="preserve">hard parse</text><text x="912.0" y="172.0" font-size="12" fill="#D62828" font-weight="700" xml:space="preserve">1×</text>
<circle cx="890" cy="252" r="16" fill="#2A9D8F"/><path d="M882 252 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<text x="912.0" y="248.0" font-size="12" fill="#2A9D8F" font-weight="700" xml:space="preserve">soft parse</text><text x="912.0" y="264.0" font-size="12" fill="#2A9D8F" font-weight="700" xml:space="preserve">2×</text>
<text x="750.0" y="350.0" font-size="13" fill="#3E3350" text-anchor="middle" font-style="italic" xml:space="preserve">lo stesso testo: il piano viene riusato</text>
<line x1="500" y1="100" x2="500" y2="360" stroke="#E9E4EF" stroke-width="2"/>
<rect x="120.0" y="380.0" width="760.0" height="70.0" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="140.0" y="406.0" font-size="14" fill="#B35300" font-weight="700" xml:space="preserve">Shared pool (la cache SQL di Oracle)</text><text x="140.0" y="428.0" font-size="13" fill="#3E3350" xml:space="preserve">Conserva il testo di ogni comando e il piano di esecuzione già calcolato.</text>
<text x="500.0" y="486.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">In più: il valore viaggia separato dal comando, e questo impedisce anche la SQL injection.</text>
</svg>
