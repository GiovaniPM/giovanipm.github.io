<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Prompt vago contro prompt completo</title>
<desc id="d">Due pannelli. A sinistra, in rosso, il prompt vago “Crea un articolo su SQL con immagini” porta a testo generico, errori ripetuti, immagini decorative, una sola lingua senza riferimenti e un formato diverso dalle altre pagine. A destra, in verde, il prompt completo, con blocchi per fonti, contesto, pubblico, istruzioni, verifiche e consegna, porta a contenuti presi dalle fonti, esempi verificati, figure SVG che spiegano, tre lingue con riferimenti e lo stesso modello delle altre pagine.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="552" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Prompt vago contro prompt completo</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">La stessa richiesta, con e senza le istruzioni che definiscono il risultato</text>
<rect x="30.0" y="100.0" width="460.0" height="400.0" rx="14" fill="#FFE3E3" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="260.0" y="132.0" font-size="18" fill="#FF6B6B" text-anchor="middle" font-weight="700" xml:space="preserve">Prompt vago</text>
<rect x="50.0" y="150.0" width="420.0" height="70.0" rx="9" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="64.0" y="174.0" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Crea un articolo su SQL</text>
<text x="64.0" y="194.0" font-size="13" fill="#F7F0FF" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">con immagini.</text>
<line x1="260" y1="228" x2="260" y2="252" stroke="#FF6B6B" stroke-width="2.5" marker-end="url(#am)"/>
<circle cx="68" cy="274" r="9" fill="#FF6B6B"/><path d="M64.5 270.5 l7 7 M71.5 270.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="279.0" font-size="14" fill="#3E3350" xml:space="preserve">testo generico, non basato sulle fonti</text>
<circle cx="68" cy="308" r="9" fill="#FF6B6B"/><path d="M64.5 304.5 l7 7 M71.5 304.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="313.0" font-size="14" fill="#3E3350" xml:space="preserve">errori dell’originale ripetuti</text>
<circle cx="68" cy="342" r="9" fill="#FF6B6B"/><path d="M64.5 338.5 l7 7 M71.5 338.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="347.0" font-size="14" fill="#3E3350" xml:space="preserve">immagini decorative o inventate</text>
<circle cx="68" cy="376" r="9" fill="#FF6B6B"/><path d="M64.5 372.5 l7 7 M71.5 372.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="381.0" font-size="14" fill="#3E3350" xml:space="preserve">una lingua, senza riferimenti</text>
<circle cx="68" cy="410" r="9" fill="#FF6B6B"/><path d="M64.5 406.5 l7 7 M71.5 406.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="415.0" font-size="14" fill="#3E3350" xml:space="preserve">formato diverso dalle altre pagine</text>
<rect x="510.0" y="100.0" width="460.0" height="400.0" rx="14" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="740.0" y="132.0" font-size="18" fill="#2A9D8F" text-anchor="middle" font-weight="700" xml:space="preserve">Prompt completo</text>
<rect x="530.0" y="150.0" width="420.0" height="110.0" rx="9" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="544.0" y="174.0" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&lt;fonti&gt; … &lt;/fonti&gt;</text>
<text x="544.0" y="194.0" font-size="13" fill="#F7F0FF" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&lt;contesto&gt; &lt;pubblico&gt; &lt;istruzioni&gt;</text>
<text x="544.0" y="214.0" font-size="13" fill="#F7F0FF" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&lt;verifiche&gt; &lt;consegna&gt;</text>
<text x="544.0" y="234.0" font-size="13" fill="#F7F0FF" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Compito: crea un tutorial su …</text>
<line x1="740" y1="268" x2="740" y2="292" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#am)"/>
<circle cx="548" cy="314" r="9" fill="#2A9D8F"/><path d="M544 314 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="319.0" font-size="14" fill="#3E3350" xml:space="preserve">contenuti presi dalle fonti allegate</text>
<circle cx="548" cy="348" r="9" fill="#2A9D8F"/><path d="M544 348 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="353.0" font-size="14" fill="#3E3350" xml:space="preserve">esempi verificati, errori segnalati</text>
<circle cx="548" cy="382" r="9" fill="#2A9D8F"/><path d="M544 382 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="387.0" font-size="14" fill="#3E3350" xml:space="preserve">figure SVG che spiegano i concetti</text>
<circle cx="548" cy="416" r="9" fill="#2A9D8F"/><path d="M544 416 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="421.0" font-size="14" fill="#3E3350" xml:space="preserve">tre lingue, riferimenti numerati</text>
<circle cx="548" cy="450" r="9" fill="#2A9D8F"/><path d="M544 450 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="455.0" font-size="14" fill="#3E3350" xml:space="preserve">stesso modello delle altre pagine</text>
<text x="500.0" y="530.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">L’IA non conosce le convenzioni del vostro sito: tutto ciò che manca nel prompt lo deciderà lei.</text>
</svg>
