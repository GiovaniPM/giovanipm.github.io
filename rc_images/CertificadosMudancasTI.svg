<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Três mudanças estruturais na TI</title>
<desc id="d">Três linhas comparam a TI antes e com a IA. Primeira: de executar tarefas técnicas para orquestrar resultados. Segunda: da ferramenta isolada para o processo de ponta a ponta. Terceira: de produzir código como a parte cara para decidir o que construir como a parte cara. Abaixo, dois indicadores: 39% das habilidades centrais devem mudar até 2030, segundo o Fórum Econômico Mundial, e 80% dos engenheiros precisarão se requalificar até 2027, segundo o Gartner.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Três mudanças estruturais</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">A TI deixa de executar tarefas e passa a orquestrar resultados</text>

<text x="235" y="112" font-size="15" fill="#756986" text-anchor="middle" font-weight="700" letter-spacing="2">ANTES</text>
<text x="765" y="112" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700" letter-spacing="2">COM A IA</text>

<g>
<rect x="50" y="128" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="162" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Executar tarefas técnicas</text>
<text x="235" y="186" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">codificar, configurar, documentar</text>
<line x1="430" y1="168" x2="568" y2="168" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="128" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="162" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Orquestrar resultados</text>
<text x="765" y="186" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">tarefas assistidas ou delegadas a agentes</text>
</g>
<g>
<rect x="50" y="223" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="257" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ferramenta isolada</text>
<text x="235" y="281" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">especialista em um produto</text>
<line x1="430" y1="263" x2="568" y2="263" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="223" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="257" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Processo de ponta a ponta</text>
<text x="765" y="281" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">do problema à solução segura e sustentável</text>
</g>
<g>
<rect x="50" y="318" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="352" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Produzir código é o caro</text>
<text x="235" y="376" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">o gargalo é construir</text>
<line x1="430" y1="358" x2="568" y2="358" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="318" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="352" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Decidir o que construir é o caro</text>
<text x="765" y="376" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">o gargalo é escolher bem</text>
</g>

<rect x="50" y="428" width="430" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="120" y="478" font-size="34" fill="#2B1B3D" text-anchor="middle" font-weight="700">39%</text>
<text x="190" y="459" font-size="14" fill="#2B1B3D">das habilidades centrais devem</text>
<text x="190" y="479" font-size="14" fill="#2B1B3D">mudar até 2030</text>
<text x="190" y="496" font-size="12" fill="#756986" font-style="italic">Fórum Econômico Mundial</text>
<rect x="520" y="428" width="430" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="590" y="478" font-size="34" fill="#2B1B3D" text-anchor="middle" font-weight="700">80%</text>
<text x="660" y="459" font-size="14" fill="#2B1B3D">dos engenheiros precisarão se</text>
<text x="660" y="479" font-size="14" fill="#2B1B3D">requalificar até 2027</text>
<text x="660" y="496" font-size="12" fill="#756986" font-style="italic">Gartner</text>
</svg>
