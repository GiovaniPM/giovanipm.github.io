<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" width="1000" height="326" role="img" aria-labelledby="t d">
<title id="t">Cuánto ayudan las muecas</title>
<desc id="d">Barras con tu probabilidad de perder la ronda según el nivel de las muecas, evitando siempre las cartas que hacen cambiar la cara del rival. Difícil, sin muecas: 25,5%. Normal: 18,5%. Fácil: 7,2%. Simulación de 100 mil rondas por nivel, con 4 jugadores y 15 parejas.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="326" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="500" y="36" font-size="19" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Cuánto ayudan las muecas</text><text x="316" y="97" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Difícil: sin muecas</text><rect x="330" y="70" width="510.0" height="40" rx="6" fill="#756986"/><text x="850.0" y="97" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">25,5%</text><text x="316" y="159" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Normal: a veces blufean</text><rect x="330" y="132" width="370.0" height="40" rx="6" fill="#B35300"/><text x="710.0" y="159" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">18,5%</text><text x="316" y="221" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Fácil: casi siempre delatan</text><rect x="330" y="194" width="144.0" height="40" rx="6" fill="#0E8074"/><text x="484.0" y="221" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">7,2%</text><text x="330" y="276" font-size="13.5" font-weight="normal" text-anchor="start" fill="#756986">tu probabilidad de perder la ronda</text><text x="500" y="304" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#756986">100 mil rondas simuladas por nivel: 4 jugadores, 15 parejas; juegas primero y evitas las cartas con mueca</text>
</g></svg>
