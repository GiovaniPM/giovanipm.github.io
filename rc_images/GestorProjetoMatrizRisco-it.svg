old" text-anchor="middle" fill="#2B1B3D">4</text><text x="345.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Medio</text><rect x="413" y="163" width="124" height="84" rx="10" fill="#ffc078"/><text x="475.0" y="202" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">6</text><text x="475.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Alto</text><text x="140" y="300.0" font-size="14" font-weight="bold" text-anchor="end" fill="#756986">Bassa</text><rect x="153" y="253" width="124" height="84" rx="10" fill="#b2f2bb"/><text x="215.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">1</text><text x="215.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Basso</text><rect x="283" y="253" width="124" height="84" rx="10" fill="#b2f2bb"/><text x="345.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">2</text><text x="345.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Basso</text><rect x="413" y="253" width="124" height="84" rx="10" fill="#ffe066"/><text x="475.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">3</text><text x="475.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Medio</text><text x="345.0" y="370" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Probabilità × Impatto = 1 … 9</text><rect x="600" y="60" width="370" height="200" rx="12" fill="#FFFFFF" stroke="#F1E2CF"/><text x="616" y="88" font-size="16" font-weight="bold" text-anchor="start" fill="#B35300">Alza la probabilità</text><text x="622" y="116" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• ritardo o blocco</text><text x="622" y="139" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• avanzamento sotto il piano</text><text x="622" y="162" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• inizio previsto già passato</text><text x="622" y="185" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• predecessora in ritardo/bloccata</text><text x="622" y="208" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• senza aggiornamento o responsabile</text><text x="622" y="231" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• responsabile sovraccarico</text><rect x="600" y="276" width="370" height="162" rx="12" fill="#FFFFFF" stroke="#F1E2CF"/><text x="616" y="304" font-size="16" font-weight="bold" text-anchor="start" fill="#5B2A86">Alza l’impatto</text><text x="622" y="332" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• percorso critico (margine 0)</text><text x="622" y="355" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• margine fino a 5 giorni</text><text x="622" y="378" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• milestone</text><text x="622" y="401" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• molte successive</text><text x="622" y="424" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• durata lunga (10+ giorni)</text>
</g></svg>
