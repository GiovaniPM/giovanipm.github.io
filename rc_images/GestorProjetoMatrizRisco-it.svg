<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
<title id="t">Matrice di rischio: probabilità per impatto</title>
<desc id="d">Matrice tre per tre. Righe di probabilità alta, media e bassa; colonne di impatto basso, medio e alto. Il livello è il prodotto: 1 o 2 è basso, 3 o 4 è medio, 6 è alto e 9 è critico. A destra, cosa fa salire ciascun asse nell’app. Probabilità: ritardo, blocco, avanzamento sotto il piano, inizio non avvenuto, predecessora con problemi, nessun aggiornamento, nessun responsabile, responsabile sovraccarico. Impatto: percorso critico, margine piccolo, milestone, molte successive, durata lunga.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
