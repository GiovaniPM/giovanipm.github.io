<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">¿Umbral fijo o patrón histórico?</title>
<desc id="d">Gráfico de líneas de las transacciones por hora a lo largo de un día. Una franja verde muestra el volumen esperado según el histórico, más o menos 25%, bajo de madrugada y cerca de 500 por hora entre las 10 h y las 16 h. El volumen real sigue la franja hasta las 9 h y se desploma a 50 a las 10 h, donde se dispara una alerta: se esperaban cerca de 500. Una línea punteada roja marca un umbral fijo de 100 por hora: entre la medianoche y las 6 h el volumen normal queda por debajo, generando falsas alertas.</desc>
