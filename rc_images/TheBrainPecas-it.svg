<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Un cervello per classificare i pezzi</title>
<desc id="d">In alto, Catalogo dei pezzi. Sotto, le categorie Elementi di fissaggio, Trasmissione e Tenuta. Elementi di fissaggio ha le sottocategorie Viti, Dadi e Rondelle; Trasmissione ha Cuscinetti; Tenuta ha O-ring. Sotto Viti c’è il pezzo Vite a testa esagonale M8x30, codice PAR-M8X30, collegato da salti al materiale Acciaio al carbonio, al fornitore Metallurgica Alfa e alla norma ISO 4017.</desc>
