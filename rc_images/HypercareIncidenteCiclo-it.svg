<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-labelledby="t d">
<title id="t">Ciclo di vita di un incidente nell’app</title>
<desc id="d">Stati in sequenza: Aperto, In analisi, Aggirato, Risolto e Chiuso. Quando esce da Aperto, l’app registra la presa in carico; quando arriva a Risolto, registra la risoluzione. Una freccia torna da Risolto agli stati attivi: è la riapertura (Aperto, In analisi o Aggirato), che cancella l’ora di risoluzione e conta una riapertura. Sotto, le misure: tempo di risposta, dal rilevamento alla presa in carico, confrontato con lo SLA di risposta; e tempo di risoluzione, dal rilevamento alla risoluzione, confrontato con lo SLA di risoluzione. Le medie sono MTTA e MTTR.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="316" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="20" y="70" width="176" height="56" rx="12" fill="#C2185B"/><text x="108" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Aperto</text><rect x="216" y="70" width="176" height="56" rx="12" fill="#B35300"/><text x="304" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">In analisi</text><rect x="412" y="70" width="176" height="56" rx="12" fill="#3A86FF"/><text x="500" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Aggirato</text><rect x="608" y="70" width="176" height="56" rx="12" fill="#0E8074"/><text x="696" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Risolto</text><rect x="804" y="70" width="176" height="56" rx="12" fill="#5B2A86"/><text x="892" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Chiuso</text><line x1="197" y1="98" x2="214" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="393" y1="98" x2="410" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="589" y1="98" x2="606" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="785" y1="98" x2="802" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><path d="M206 66 V44 H306 V66" fill="none" stroke="#2B1B3D" stroke-width="1.5"/><text x="256" y="36" font-size="13" font-weight="bold" text-anchor="middle" fill="#B35300">⏱ registra la presa in carico</text><path d="M598 66 V44 H696 V66" fill="none" stroke="#2B1B3D" stroke-width="1.5"/><text x="647" y="36" font-size="13" font-weight="bold" text-anchor="middle" fill="#0E8074">⏱ registra la risoluzione</text><path d="M696 128 V168 H304 V130" fill="none" stroke="#C2185B" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="500" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#C2185B">riapertura: tornare a uno stato attivo cancella la risoluzione e conta +1</text><rect x="20" y="210" width="960" height="84" rx="12" fill="#FFF1C9"/><text x="500" y="244" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Risposta = presa in carico − rilevamento → SLA di risposta · media = MTTA</text><text x="500" y="274" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Risoluzione = risoluzione − rilevamento → SLA di risoluzione · media = MTTR</text>
