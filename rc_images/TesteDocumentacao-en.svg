<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">From the plan to the test case, with traceability</title>
<desc id="d">On the left, a hierarchy: the test plan produces the user login scenario, which produces three test cases: a valid password logs in, a wrong password shows a message and three errors lock the account. On the right, a traceability matrix links requirements REQ-01 to REQ-03 to cases TC-01 to TC-03, and REQ-03 is linked to defect BUG-17.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">From the plan to the test case, with traceability</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">A plan produces scenarios, each scenario produces cases, and the matrix ties them to requirements</text>
<rect x="30" y="100" width="420" height="64" rx="12" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="240" y="127" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Test plan</text>
<text x="240" y="150" font-size="13" fill="#FCE4F0" text-anchor="middle">strategy · scope · resources · risks · schedule</text>
<line x1="240" y1="164" x2="240" y2="196" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<rect x="60" y="200" width="360" height="50" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="240" y="231" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Scenario: user login</text>
<path d="M80 250 V300 H96" stroke="#756986" stroke-width="2.5" fill="none" marker-end="url(#am)"/>
<rect x="100" y="280" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="114" y="306" font-size="14" fill="#B35300" font-weight="700">TC-01</text>
<text x="172" y="306" font-size="14" fill="#2B1B3D">valid password → logs in</text>
<path d="M80 250 V354 H96" stroke="#756986" stroke-width="2.5" fill="none" marker-end="url(#am)"/>
<rect x="100" y="334" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="114" y="360" font-size="14" fill="#B35300" font-weight="700">TC-02</text>
<text x="172" y="360" font-size="14" fill="#2B1B3D">wrong password → message</text>
<path d="M80 250 V408 H96" stroke="#756986" stroke-width="2.5" fill="none" marker-end="url(#am)"/>
<rect x="100" y="388" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="114" y="414" font-size="14" fill="#B35300" font-weight="700">TC-03</text>
<text x="172" y="414" font-size="14" fill="#2B1B3D">3 errors → locks account</text>
<text x="30" y="472" font-size="13" fill="#3E3350" font-weight="700">Each test case has:</text>
<text x="30" y="492" font-size="13" fill="#756986">ID, preconditions, steps, expected result and actual result</text>
<path d="M424 334 C 470 334, 480 280, 522 280" stroke="#2B1B3D" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="476" y="352" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">traces</text>
<text x="745.0" y="118" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Traceability matrix</text>
<rect x="530" y="130" width="430" height="200" rx="10" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<path d="M530 174 h430" stroke="#2B1B3D" stroke-width="2"/>
<rect x="531.5" y="131.5" width="427" height="41" rx="9" fill="#FFF1C9"/>
<text x="605.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Requirement</text>
<text x="710.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">TC-01</text>
<line x1="680" y1="130" x2="680" y2="330" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="770.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">TC-02</text>
<line x1="740" y1="130" x2="740" y2="330" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="830.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">TC-03</text>
<line x1="800" y1="130" x2="800" y2="330" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="910.0" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Defect</text>
<line x1="860" y1="130" x2="860" y2="330" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="542" y="196" font-size="13" fill="#5B2A86" font-weight="700">REQ-01</text>
<text x="542" y="214" font-size="12" fill="#756986">password access</text>
<circle cx="710" cy="200" r="13" fill="#2A9D8F"/>
<path d="M704 200 l4 5 l8 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="530" y1="226" x2="960" y2="226" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="542" y="248" font-size="13" fill="#5B2A86" font-weight="700">REQ-02</text>
<text x="542" y="266" font-size="12" fill="#756986">error notice</text>
<circle cx="770" cy="252" r="13" fill="#2A9D8F"/>
<path d="M764 252 l4 5 l8 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="530" y1="278" x2="960" y2="278" stroke="#E4D5C0" stroke-width="1.5"/>
<text x="542" y="300" font-size="13" fill="#5B2A86" font-weight="700">REQ-03</text>
<text x="542" y="318" font-size="12" fill="#756986">account lock</text>
<circle cx="830" cy="304" r="13" fill="#2A9D8F"/>
<path d="M824 304 l4 5 l8 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="874" y="291" width="72" height="26" rx="13" fill="#FF6B6B"/>
<text x="910" y="309" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">BUG-17</text>
<text x="530" y="364" font-size="13" fill="#3E3350">Forward: requirement → test case (was everything tested?)</text>
<text x="530" y="386" font-size="13" fill="#3E3350">Backward: defect → case → requirement (where does it come from?)</text>
</svg>
