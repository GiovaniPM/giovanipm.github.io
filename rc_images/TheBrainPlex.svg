<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">O Plex: o pensamento ativo no centro</title>
<desc id="d">O pensamento ativo Parafusos está no centro. Acima, o pai Fixadores. Abaixo, os filhos Parafuso M8x30, Parafuso M6x20 e Parafuso M10x40. À esquerda, ligados por salto, ISO 4017 e Metalúrgica Alfa. À direita, os irmãos Porcas e Arruelas, que têm o mesmo pai.</desc>
