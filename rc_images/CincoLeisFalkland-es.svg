<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ley de Falkland: el momento justo para decidir</title>
<desc id="d">Gráfico con el tiempo en el eje horizontal. La curva de la incertidumbre baja con el tiempo, a medida que llega información; la curva del costo de cambiar de idea sube. A la izquierda, la zona demasiado pronto, en la que se decide a ciegas; en el centro, destacado, el último momento responsable, cuando hay suficiente información y las opciones siguen abiertas; a la derecha, la zona demasiado tarde, en la que las opciones desaparecen. Abajo, dos tipos de decisión: puerta de doble sentido, reversible, en la que se decide rápido y se corrige; y puerta de un solo sentido, irreversible, en la que se espera, se reúnen datos y se decide con calma.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
