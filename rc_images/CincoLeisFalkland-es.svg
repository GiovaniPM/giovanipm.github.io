<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ley de Falkland: el momento justo para decidir</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Decidir demasiado pronto es decidir a ciegas; demasiado tarde, sin opciones</text>
