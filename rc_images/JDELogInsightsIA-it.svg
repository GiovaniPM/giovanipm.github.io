<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" role="img" aria-labelledby="t d"><title id="t">Dove l'IA aiuta nell'analisi del log</title><desc id="d">Sei passi: l'app crea il report con i dati nascosti, tu rivedi cosa esce, l'IA propone ipotesi con prove, l'app controlla la riga originale, tu confermi con il DBA e lo sviluppo, poi correggi e misuri. Dalla correzione, si torna all'IA con il nuovo log.</desc><rect width="1000" height="214" rx="18" fill="#FFF7EC"/><text x="500" y="32" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D" xml:space="preserve">Dove l'IA aiuta nell'analisi del log</text><rect x="18" y="56" width="150" height="92" rx="12" fill="#EFEAFA" stroke="#5B2A86" stroke-width="2"/><text x="93" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5B2A86" xml:space="preserve">App</text><text x="93" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Creare il report</text><text x="93" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#2B1B3D" xml:space="preserve">con dati nascosti</text><path d="M170 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M181 102l-6 -4v8z" fill="#2B1B3D"/><rect x="182" y="56" width="150" height="92" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="257" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#B35300" xml:space="preserve">Tu</text><text x="257" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xm