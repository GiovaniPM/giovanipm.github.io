<title id="t">Anchors: positions, not characters</title>
<desc id="d">The text the cat and the catalog with diamonds marking the positions found by each anchor: \b at the edges of each word, \B at positions inside words, ^ at the start and $ at the end. Below, /cat/g finds 2 matches, including the start of catalog, and /\bcat\b/g finds only 1, the whole word.</desc>
