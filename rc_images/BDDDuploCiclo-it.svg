<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">BDD dall’esterno all’interno: il doppio ciclo</title>
<desc id="d">Doppio ciclo. A sinistra, passo 1: scrivi uno scenario di accettazione in linguaggio di business, che fallisce. Al centro, il ciclo interno di TDD, rosso, verde e refactoring, ripetuto nei passi da 2 a 4 finché lo scenario passa. A destra, passo 5: lo scenario passa. Una freccia tratteggiata torna in alto al passo 6, lo scenario successivo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="550" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">BDD dall’esterno all’interno: il doppio ciclo</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Lo scenario di business traina il lavoro; il TDD costruisce ogni pezzo dall’interno</text>
<path d="M830 262 C 830 130, 170 130, 170 258" stroke="#5B2A86" stroke-width="3.5" fill="none" stroke-dasharray="9 7" marker-end="url(#ap)"/>
<text x="500.0" y="150.0" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">6. scenario successivo</text>
<text x="500.0" y="118.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">ciclo esterno: comportamento descritto in Gherkin</text>
<rect x="40" y="265" width="260" height="110" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2.5"/>
<circle cx="70" cy="295" r="16" fill="#E23B3B"/><text x="70.0" y="301.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="96.0" y="300.0" font-size="15" fill="#2B1B3D" font-weight="700">Scrivi uno scenario</text>
<text x="58.0" y="343.0" font-size="13" fill="#3E3350">di accettazione, in linguaggio</text>
<text x="58.0" y="361.0" font-size="13" fill="#3E3350">di business: fallisce.</text>
<rect x="700" y="265" width="260" height="110" rx="12" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<circle cx="730" cy="295" r="16" fill="#2A9D8F"/><text x="730.0" y="301.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="756.0" y="300.0" font-size="15" fill="#2B1B3D" font-weight="700">Lo scenario passa</text>
<text x="718.0" y="343.0" font-size="13" fill="#3E3350">il comportamento richiesto</text>
<text x="718.0" y="361.0" font-size="13" fill="#3E3350">è pronto: verde.</text>
<circle cx="500" cy="325" r="118" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<path d="M536.0 262.6 A72 72 0 0 1 572.0 325.0" stroke="#2A9D8F" stroke-width="3.5" fill="none" marker-end="url(#ag)"/>
<path d="M536.0 387.4 A72 72 0 0 1 464.0 387.4" stroke="#3A86FF" stroke-width="3.5" fill="none" marker-end="url(#ab)"/>
<path d="M428.0 325.0 A72 72 0 0 1 464.0 262.6" stroke="#E23B3B" stroke-width="3.5" fill="none" marker-end="url(#ard)"/>
<circle cx="500.0" cy="253.0" r="32" fill="#FFE3E3" stroke="#E23B3B" stroke-width="3"/>
<text x="500.0" y="257.0" font-size="11" fill="#2B1B3D" text-anchor="middle" font-weight="700">rosso</text>
<circle cx="562.4" cy="361.0" r="32" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="3"/>
<text x="562.4" y="365.0" font-size="11" fill="#2B1B3D" text-anchor="middle" font-weight="700">verde</text>
<circle cx="437.6" cy="361.0" r="32" fill="#E1ECFF" stroke="#3A86FF" stroke-width="3"/>
<text x="437.6" y="365.0" font-size="11" fill="#2B1B3D" text-anchor="middle" font-weight="700">refactor</text>
<text x="500.0" y="330.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">TDD</text>
<line x1="302" y1="320" x2="378" y2="320" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<line x1="622" y1="320" x2="696" y2="320" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<text x="500.0" y="470.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">da 2 a 4: ciclo interno di TDD</text>
<text x="500.0" y="492.0" font-size="13" fill="#756986" text-anchor="middle">ripeti finché lo scenario esterno passa</text>
<text x="500.0" y="530.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Con i test verdi puoi rifattorizzare; con i test rossi scrivi solo il codice per farli diventare verdi.</text>
</svg>
