<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Hoja de ruta de la TI hasta 2030</title>
<desc id="d">Línea de tiempo con tres fases proyectadas. Adopción, de 2026 a 2027: agentes de IA en el trabajo diario de desarrollo, soporte y operaciones, y selección con pruebas prácticas y uso de IA permitido. Reorganización, de 2028 a 2029: equipos de TI más pequeños y multidisciplinarios, y exámenes de opción múltiple reemplazados por laboratorios y simulaciones. Fusión con el negocio, de 2030 en adelante: menos distancia entre quien pide y quien construye, y credenciales que se convierten en portafolios verificables e historiales de entregas. Abajo, la estimación del World Economic Forum hasta 2030: 170 millones de empleos creados, 92 millones desplazados, un saldo de 78 millones.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Hoja de ruta: tres fases hasta 2030</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Una lectura posible, a modo de proyección</text>

<line x1="70" y1="160" x2="935" y2="160" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<text x="190" y="130" font-size="16" fill="#FFB703" text-anchor="middle" font-weight="700">2026–2027</text>
<text x="500" y="130" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">2028–2029</text>
<text x="810" y="130" font-size="16" fill="#5B2A86" text-anchor="middle" font-weight="700">de 2030 en adelante</text>
<circle cx="190" cy="160" r="12" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/>
<circle cx="500" cy="160" r="12" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/>
<circle cx="810" cy="160" r="12" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<g stroke-width="2" stroke-dasharray="4 4">
<line x1="190" y1="172" x2="190" y2="196" stroke="#FFB703"/>
<line x1="500" y1="172" x2="500" y2="196" stroke="#3A86FF"/>
<line x1="810" y1="172" x2="810" y2="196" stroke="#5B2A86"/>
</g>

<rect x="50" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="190" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Adopción</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="72" cy="265" r="4" fill="#FFB703"/><text x="84" y="270">Agentes de IA en el trabajo</text><text x="84" y="289">diario de desarrollo,</text><text x="84" y="308">soporte y operaciones</text>
<circle cx="72" cy="336" r="4" fill="#FFB703"/><text x="84" y="341">Selección con pruebas prácticas,</text><text x="84" y="360">con uso de IA permitido</text>
</g>

<rect x="360" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="500" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Reorganización</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="382" cy="265" r="4" fill="#3A86FF"/><text x="394" y="270">Equipos de TI más pequeños</text><text x="394" y="289">y multidisciplinarios</text>
<circle cx="382" cy="317" r="4" fill="#3A86FF"/><text x="394" y="322">La opción múltiple da</text><text x="394" y="341">paso a laboratorios y simulaciones</text>
</g>

<rect x="670" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<text x="810" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Fusión con el negocio</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="692" cy="265" r="4" fill="#5B2A86"/><text x="704" y="270">Menos distancia entre quien</text><text x="704" y="289">pide y quien construye</text>
<circle cx="692" cy="317" r="4" fill="#5B2A86"/><text x="704" y="322">Las credenciales se vuelven</text><text x="704" y="341">portafolios verificables e</text><text x="704" y="360">historiales de entregas</text>
</g>

<text x="500" y="424" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Empleos hasta 2030 · transformación, no extinción</text>
<rect x="50" y="440" width="280" height="54" rx="12" fill="#2A9D8F"/>
<text x="190" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">+170 M</tspan> creados</text>
<rect x="360" y="440" width="280" height="54" rx="12" fill="#E23B3B"/>
<text x="500" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">−92 M</tspan> desplazados</text>
<rect x="670" y="440" width="280" height="54" rx="12" fill="#2B1B3D"/>
<text x="810" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">+78 M</tspan> de saldo</text>
<text x="950" y="510" font-size="11" fill="#756986" text-anchor="end" font-style="italic">Fuente: World Economic Forum, Future of Jobs Report 2025</text>
</svg>
