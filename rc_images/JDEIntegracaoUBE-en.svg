<text x="692.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Edit BSFN</text>
<text x="692.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">validates and applies</text>
<text x="692.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">the rule</text>
