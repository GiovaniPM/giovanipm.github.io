<text x="116.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Bank</text>
<text x="116.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">return file</text>
<text x="116.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(fixed width)</text>
<rect x="222" y="136" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="308.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">SFTP / MFT</text>
<text x="308.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">secure</text>
<text x="308.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">transfer</text>
