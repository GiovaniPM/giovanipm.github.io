<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 404" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The cycle of every planet</title>
<desc id="d">Eight-step diagram repeated on every planet: 1, analyse with the sensor; 2, land; 3, extract liquid nitrogen from the crystals; 4, terraform at the ship; 5, build the extractor, storehouse, housing and barn; 6, defend with towers; 7, build the communication center and found the colony; 8, gather 200 N₂ and take off. An arrow goes from step 8 back to step 1, towards the next planet.</desc>
<rect width="980" height="404" rx="18" fill="#FFF7EC"/>
<text x="490.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">The cycle of every planet</text>
<g transform="translate(20 80)"><rect x="20" y="20" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/><circle cx="48" cy="50" r="16" fill="#3A86FF"/><text x="48.0" y="56.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="72.0" y="57.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Analyse</text><text x="120.0" y="90.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">sensor (Q)</text><rect x="260" y="20" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><circle cx="288" cy="50" r="16" fill="#5B2A86"/><text x="288.0" y="56.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="312.0" y="57.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Land</text><text x="360.0" y="90.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">E near the planet</text><rect x="500" y="20" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#0E8074" stroke-width="3"/><circle cx="528" cy="50" r="16" fill="#0E8074"/><text x="528.0" y="56.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="552.0" y="57.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Extract N₂</text><text x="600.0" y="90.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">blue crystals</text><rect x="740" y="20" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="3"/><circle cx="768" cy="50" r="16" fill="#2F6FE0"/><text x="768.0" y="56.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="792.0" y="57.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Terraform</text><text x="840.0" y="90.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">at the ship, −N₂</text><rect x="740" y="180" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#B35300" stroke-width="3"/><circle cx="768" cy="210" r="16" fill="#B35300"/><text x="768.0" y="216.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="792.0" y="217.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Build</text><text x="840.0" y="250.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">extractor and storehouse</text><rect x="500" y="180" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#C2185B" stroke-width="3"/><circle cx="528" cy="210" r="16" fill="#C2185B"/><text x="528.0" y="216.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="552.0" y="217.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Defend</text><text x="600.0" y="250.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">defense towers</text><rect x="260" y="180" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/><circle cx="288" cy="210" r="16" fill="#2A9D8F"/><text x="288.0" y="216.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="312.0" y="217.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Found the colony</text><text x="360.0" y="250.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">communication center</text><rect x="20" y="180" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#E04E6B" stroke-width="3"/><circle cx="48" cy="210" r="16" fill="#E04E6B"/><text x="48.0" y="216.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="72.0" y="217.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Take off</text><text x="120.0" y="250.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">200 N₂ in the tanks</text><path d="M226.0 66.0 L242.0 66.0" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" fill="none"/><path 