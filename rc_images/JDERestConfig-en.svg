<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Steps to configure REST in JD Edwards</title>
<desc id="d">Eight steps in sequence: 1 prerequisites (Tools 9.2, JDK, WebLogic, certificates); 2 create the AIS Server instance in Server Manager; 3 connect AIS to the HTML Server and the environment; 4 tune the configuration (timeout, allowed hosts, CORS, JAS sessions); 5 security (service user, Security Workbench, UDO); 6 create and publish orchestrations in Orchestrator Studio; 7 test with /v2/defaultconfig and Postman; 8 expose through an API gateway, TLS and monitoring.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="42.0" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">How to configure REST in JD Edwards</text>
<text x="500.0" y="68.0" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">From the server to the first call, in eight steps</text>
<rect x="35" y="110" width="210" height="118" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="140.0" y="146.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">1. Prerequisites</text>
<text x="140.0" y="164.8" font-size="12.5" fill="#3E3350" text-anchor="middle">current Tools 9.2</text>
<text x="140.0" y="183.2" font-size="12.5" fill="#3E3350" text-anchor="middle">JDK and WebLogic</text>
<text x="140.0" y="201.8" font-size="12.5" fill="#3E3350" text-anchor="middle">TLS certificates</text>
<rect x="275" y="110" width="210" height="118" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="380.0" y="146.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">2. AIS instance</text>
<text x="380.0" y="164.8" font-size="12.5" fill="#3E3350" text-anchor="middle">Server Manager</text>
<text x="380.0" y="183.2" font-size="12.5" fill="#3E3350" text-anchor="middle">Create/Register</text>
<text x="380.0" y="201.8" font-size="12.5" fill="#3E3350" text-anchor="middle">a Managed Instance</text>
<rect x="515" y="110" width="210" height="118" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="620.0" y="146.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">3. Connect to JAS</text>
<text x="620.0" y="164.8" font-size="12.5" fill="#3E3350" text-anchor="middle">HTML Server</text>
<text x="620.0" y="183.2" font-size="12.5" fill="#3E3350" text-anchor="middle">default environment</text>
<text x="620.0" y="201.8" font-size="12.5" fill="#3E3350" text-anchor="middle">and role</text>
<rect x="755" y="110" width="210" height="118" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="860.0" y="146.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">4. AIS settings</text>
<text x="860.0" y="164.8" font-size="12.5" fill="#3E3350" text-anchor="middle">timeout, allowed hosts</text>
<text x="860.0" y="183.2" font-size="12.5" fill="#3E3350" text-anchor="middle">CORS, JAS sessions</text>
<text x="860.0" y="201.8" font-size="12.5" fill="#3E3350" text-anchor="middle">page size</text>
<rect x="755" y="290" width="210" height="118" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="860.0" y="326.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">5. Security</text>
<text x="860.0" y="344.8" font-size="12.5" fill="#3E3350" text-anchor="middle">service user</text>
<text x="860.0" y="363.2" font-size="12.5" fill="#3E3350" text-anchor="middle">P00950, UDO</text>
<text x="860.0" y="381.8" font-size="12.5" fill="#3E3350" text-anchor="middle">OAuth (optional)</text>
<rect x="515" y="290" width="210" height="118" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="620.0" y="326.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">6. Orchestrator Studio</text>
<text x="620.0" y="344.8" font-size="12.5" fill="#3E3350" text-anchor="middle">service requests</text>
<text x="620.0" y="363.2" font-size="12.5" fill="#3E3350" text-anchor="middle">orchestrations</text>
<text x="620.0" y="381.8" font-size="12.5" fill="#3E3350" text-anchor="middle">share and approve</text>
<rect x="275" y="290" width="210" height="118" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="380.0" y="326.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">7. Test</text>
<text x="380.0" y="344.8" font-size="12.5" fill="#3E3350" text-anchor="middle">GET /v2/defaultconfig</text>
<text x="380.0" y="363.2" font-size="12.5" fill="#3E3350" text-anchor="middle">Postman / curl</text>
<text x="380.0" y="381.8" font-size="12.5" fill="#3E3350" text-anchor="middle">Server Manager logs</text>
<rect x="35" y="290" width="210" height="118" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="140.0" y="326.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">8. Expose</text>
<text x="140.0" y="344.8" font-size="12.5" fill="#3E3350" text-anchor="middle">API gateway</text>
<text x="140.0" y="363.2" font-size="12.5" fill="#3E3350" text-anchor="middle">TLS and limits</text>
<text x="140.0" y="381.8" font-size="12.5" fill="#3E3350" text-anchor="middle">monitoring</text>
<polyline points="245,169 273,169" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="755,349 727,349" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="485,169 513,169" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="515,349 487,349" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="725,169 753,169" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="275,349 247,349" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="860,228 860,288" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="35" y="440" width="930" height="50" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="460.8" font-size="14" fill="#3E3350" text-anchor="middle">Promote orchestrations between environments as UDOs (DV → PY → PD), never rebuilding them by hand.</text>
</svg>
