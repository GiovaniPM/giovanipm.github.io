<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dal progetto al prodotto: cosa cambia</title>
<desc id="d">Confronto tra progetto e prodotto. Team: nel progetto è formato e sciolto alla fine; nel prodotto è stabile e di lunga durata. Lavoro: nel progetto le persone vanno verso il lavoro; nel prodotto il lavoro va verso il team. Finanziamento: per progetto, approvato una volta, contro continuo, per capacità, rivisto ogni trimestre. Successo: tempi, costi e ambito, contro risultati per il business e il cliente. Fine: consegnato e passato alla manutenzione, contro evolve finché genera valore. Rischio: concentrato alla fine, contro distribuito in piccoli rilasci.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Dal progetto al prodotto: cosa cambia</text>
<rect x="40" y="78" width="360" height="46" rx="12" fill="#FF6B6B"/>
<text x="220" y="108" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Progetto</text>
<rect x="600" y="78" width="360" height="46" rx="12" fill="#0E8074"/>
<text x="780" y="108" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Prodotto (flusso di valore)</text>
<rect x="40" y="140" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="140" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="140" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="140" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="163.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Formato per il progetto,</text><text x="220" y="182.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">sciolto alla fine</text>
<text x="780" y="173.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Stabile e di lunga durata</text>
<path d="M414 146 H566 L586 168.0 L566 190 H414 Z" fill="#5B2A86"/>
<text x="494" y="173.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Team</text>
<rect x="40" y="204" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="204" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="204" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="204" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="237.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Le persone vanno verso il lavoro</text>
<text x="780" y="237.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Il lavoro va verso il team</text>
<path d="M414 210 H566 L586 232.0 L566 254 H414 Z" fill="#5B2A86"/>
<text x="494" y="237.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Lavoro</text>
<rect x="40" y="268" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="268" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="268" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="268" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="301.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Per progetto, approvato una volta</text>
<text x="780" y="291.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Continuo, per capacità,</text><text x="780" y="310.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">rivisto ogni trimestre</text>
<path d="M414 274 H566 L586 296.0 L566 318 H414 Z" fill="#5B2A86"/>
<text x="494" y="301.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Finanziamento</text>
<rect x="40" y="332" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="332" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="332" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="332" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="365.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Tempi, costi e ambito</text>
<text x="780" y="355.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Risultati per il business</text><text x="780" y="374.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">e per il cliente</text>
<path d="M414 338 H566 L586 360.0 L566 382 H414 Z" fill="#5B2A86"/>
<text x="494" y="365.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Successo</text>
<rect x="40" y="396" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="396" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="396" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="396" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="419.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Consegnato e passato</text><text x="220" y="438.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">alla manutenzione</text>
<text x="780" y="429.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Evolve finché genera valore</text>
<path d="M414 402 H566 L586 424.0 L566 446 H414 Z" fill="#5B2A86"/>
<text x="494" y="429.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Fine</text>
<rect x="40" y="460" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="460" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="460" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="460" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="493.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Concentrato alla fine</text>
<text x="780" y="493.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Distribuito in piccoli rilasci</text>
<path d="M414 466 H566 L586 488.0 L566 510 H414 Z" fill="#5B2A86"/>
<text x="494" y="493.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Rischio</text>
<text x="500" y="540" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Basato su Kersten (2018) e Kelly (2018).</text>
</svg>
