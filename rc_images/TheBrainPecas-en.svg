<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">A brain to classify parts</title>
<desc id="d">At the top, Parts catalog. Below it, the categories Fasteners, Transmission and Sealing. Fasteners has the subcategories Bolts, Nuts and Washers; Transmission has Bearings; Sealing has O-rings. Under Bolts sits the part Hex bolt M8x30, code PAR-M8X30, linked by jumps to the material Carbon steel, the supplier Alfa Metalworks and the standard ISO 4017.</desc>
