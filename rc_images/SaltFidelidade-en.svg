<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Where Salt fits in screen design</title>
<desc id="d">Four stages side by side, each showing the same login screen: the sketch, drawn by hand; the wireframe, in black and white, highlighted with a Salt badge; the mockup, in colour; and the prototype, with a cursor clicking the button. Below, two arrows show that fidelity and the cost of change grow from left to right.</desc>
