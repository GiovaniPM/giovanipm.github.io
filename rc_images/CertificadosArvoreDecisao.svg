<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Customizar ou evoluir o processo</title>
<desc id="d">Árvore de decisão com duas perguntas e três caminhos. Diante de um pedido de novo sistema, pergunte antes por que o processo existe. Primeira pergunta: é diferencial competitivo? Se sim, customize, pois é algo que o concorrente não faz igual. Se não, segunda pergunta: a IA elimina etapas inteiras? Se sim, redesenhe o fluxo do zero. Se não, evolua o processo com boas práticas e ferramentas padrão, como em financeiro, RH e compras. Um alerta lembra que automatizar um processo ruim só produz erro em escala.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="600" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Customizar ou evoluir o processo?</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Duas perguntas, três caminhos</text>

<rect x="290" y="96" width="420" height="72" rx="12" fill="#2B1B3D"/>
<text x="500" y="126" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Pedido de um novo sistema</text>
<text x="500" y="150" font-size="13" fill="#FFD9A0" text-anchor="middle" font-style="italic">antes do código: por que esse processo existe?</text>

<g stroke="#2B1B3D" stroke-width="2.5" fill="none" marker-end="url(#ar)">
<line x1="500" y1="168" x2="500" y2="196"/>
<line x1="340" y1="255" x2="274" y2="255"/>
<line x1="500" y1="310" x2="500" y2="341"/>
<line x1="660" y1="400" x2="726" y2="400"/>
<line x1="500" y1="455" x2="500" y2="491"/>
</g>
<g font-size="14" font-weight="700">
<text x="307" y="245" fill="#2A9D8F" text-anchor="middle">Sim</text>
<text x="515" y="332" fill="#E23B3B">Não</text>
<text x="693" y="390" fill="#2A9D8F" text-anchor="middle">Sim</text>
<text x="515" y="478" fill="#E23B3B">Não</text>
</g>

<path d="M500 200 L660 255 L500 310 L340 255 z" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500" y="250" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">É diferencial</text>
<text x="500" y="270" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">competitivo?</text>

<path d="M500 345 L660 400 L500 455 L340 400 z" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500" y="395" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">A IA elimina</text>
<text x="500" y="415" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">etapas inteiras?</text>

<rect x="50" y="215" width="220" height="80" rx="12" fill="#3A86FF"/>
<text x="160" y="246" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Customizar</text>
<text x="160" y="268" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">o que o concorrente</text>
<text x="160" y="285" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">não faz igual</text>

<rect x="730" y="360" width="220" height="80" rx="12" fill="#FF6B6B"/>
<text x="840" y="394" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Redesenhar</text>
<text x="840" y="418" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">o fluxo do zero</text>

<rect x="310" y="495" width="380" height="84" rx="12" fill="#2A9D8F"/>
<text x="500" y="525" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Evoluir o processo</text>
<text x="500" y="547" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">boas práticas e ferramentas padrão</text>
<text x="500" y="566" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">ex.: financeiro, RH, compras</text>

<rect x="730" y="205" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2" stroke-dasharray="6 4"/>
<text x="840" y="236" font-size="14" fill="#E23B3B" text-anchor="middle" font-weight="700">Atenção</text>
<text x="840" y="260" font-size="13" fill="#2B1B3D" text-anchor="middle">Automatizar um processo</text>
<text x="840" y="279" font-size="13" fill="#2B1B3D" text-anchor="middle">ruim só produz</text>
<text x="840" y="298" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">erro em escala</text>
</svg>
