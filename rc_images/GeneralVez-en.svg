<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 344" width="1000" height="344" role="img" aria-labelledby="t d">
<title id="t">One turn</title>
<desc id="d">Flow of a turn: first roll of the five dice; keep the dice you want; second roll of the others; keep again; third roll. After any roll the player may stop and score a free box on the sheet; if nothing fits, scratch a box with zero. Under Brazilian rules, a combination made on the first roll is worth 5 more points.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="344" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="20" y="40" width="168" height="76" rx="14" fill="#0E8074" stroke="#0E8074" stroke-width="2.5"/><text x="104" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1st roll</text><text x="104" y="98" font-size="14" font-weight="normal" text-anchor="middle" fill="#E2F6F2">5 dice</text><path d="M104 118 V198" stroke="#2B1B3D" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="218" y="40" width="168" height="76" rx="14" fill="#FFFFFF" stroke="#B35300" stroke-width="2.5"/><text x="302" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#2B1B3D">keep</text><text x="302" y="98" font-size="14" font-weight="normal" text-anchor="middle" fill="#756986">the useful ones</text><rect x="416" y="40" width="168" height="76" rx="14" fill="#0E8074" stroke="#0E8074" stroke-width="2.5"/><text x="500" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2nd roll</text><text x="500" y="98" font-size="14" font-weight="normal" text-anchor="middle" fill="#E2F6F2">the free ones</text><path d="M500 118 V198" stroke="#2B1B3D" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="614" y="40" width="168" height="76" rx="14" fill="#FFFFFF" stroke="#B35300" stroke-width="2.5"/><text x="698" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#2B1B3D">keep</text><text x="698" y="98" font-size="14" font-weight="normal" text-anchor="middle" fill="#756986">the useful ones</text><rect x="812" y="40" width="168" height="76" rx="14" fill="#0E8074" stroke="#0E8074" stroke-width="2.5"/><text x="896" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3rd roll</text><text x="896" y="98" font-size="14" font-weight="normal" text-anchor="middle" fill="#E2F6F2">the free ones</text><path d="M896 118 V198" stroke="#2B1B3D" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/><line x1="190" y1="78" x2="216" y2="78" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="388" y1="78" x2="414" y2="78" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="586" y1="78" x2="612" y2="78" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="784" y1="78" x2="810" y2="78" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="200" width="960" height="70" rx="14" fill="#FFF1C9" stroke="#FFB703" stroke-width="2"/><text x="500" y="230" font-size="18" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Score a free box</text><text x="500" y="256" font-size="14" font-weight="normal" text-anchor="middle" fill="#756986">or scratch a box with 0</text><rect x="300" y="146" width="400" height="22" fill="#FFF7EC"/><text font-style="italic" x="500" y="162" font-size="14" font-weight="normal" text-anchor="middle" fill="#756986">you may stop and score after any roll</text><rect x="20" y="290" width="380" height="34" rx="10" fill="#E2F6F2"/><text x="36" y="312" font-size="13" font-weight="bold" text-anchor="start" fill="#0E8074">★ first roll: +5 on combinations (Brazilian rules)</text>
</g></svg>
