<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Sappiamo come cambia. Vogliamo il futuro</title>
<desc id="d">Due pannelli. A sinistra, un caffè a 90 gradi in una stanza a 20 gradi: la regola dice che si raffredda più in fretta quando è più caldo, ma che temperatura avrà fra 10 minuti? A destra, una palla di cannone: conosciamo gravità e resistenza dell’aria in ogni istante, ma dove cadrà? Sotto: un’equazione differenziale dice come qualcosa cambia in ogni istante; risolverla significa trovare l’intero percorso. Quasi nessuna ha una formula pronta.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sappiamo come cambia. Vogliamo il futuro</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Il problema delle equazioni differenziali</text><rect x="40" y="100" width="440" height="290" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><text x="260" y="130" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">Caffè che si raffredda</text><path d="M 100 200 L 110 300 Q 112 312 125 312 L 185 312 Q 198 312 200 300 L 210 200 Z" fill="#FFE8E8" stroke="#2B1B3D" stroke-width="2.5"/><path d="M 208 225 q 30 0 30 25 q 0 25 -32 25" fill="none" stroke="#2B1B3D" stroke-width="2.5"/><path d="M 125 188 q -10 -14 0 -26 q 10 -12 0 -26" fill="none" stroke="#756986" stroke-width="2"/><path d="M 155 188 q -10 -14 0 -26 q 10 -12 0 -26" fill="none" stroke="#756986" stroke-width="2"/><path d="M 185 188 q -10 -14 0 -26 q 10 -12 0 -26" fill="none" stroke="#756986" stroke-width="2"/><text x="155" y="350" font-size="18" fill="#FF6B6B" text-anchor="middle" font-weight="700">90 °C</text><text x="360" y="200" font-size="15" fill="#2B1B3D" text-anchor="middle">Regola: si raffredda più</text><text x="360" y="226" font-size="15" fill="#2B1B3D" text-anchor="middle">in fretta quanto più è caldo</text><text x="360" y="252" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="360" y="278" font-size="15" fill="#2B1B3D" text-anchor="middle">Fra 10 min: ? °C</text><rect x="520" y="100" width="440" height="290" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><text x="740" y="130" font-size="17" fill="#3A86FF" text-anchor="middle" font-weight="700">Palla di cannone</text><line x1="550" y1="350" x2="930" y2="350" stroke="#2B1B3D" stroke-width="2.5"/><path d="M 575 345 L 610 322 L 618 334 L 583 356 Z" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><path d="M 612 322 Q 720 150 830 330" fill="none" stroke="#3A86FF" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="700" cy="222" r="9" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="860" y="340" font-size="30" fill="#FF6B6B" text-anchor="middle" font-weight="700">?</text><text x="740" y="170" font-size="14" fill="#2B1B3D" text-anchor="middle">gravità + resistenza dell’aria</text><text x="740" y="192" font-size="14" fill="#2B1B3D" text-anchor="middle">in ogni istante</text><rect x="40" y="410" width="920" height="70" rx="12" fill="#FFF1C9"/><text x="500" y="440" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Equazione differenziale: dice come qualcosa cambia in ogni istante.</text><text x="500" y="466" font-size="15" fill="#2B1B3D" text-anchor="middle">Risolverla = trovare l’intero percorso. Quasi nessuna ha una formula pronta.</text>
</svg>
