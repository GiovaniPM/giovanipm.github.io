<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">A IA em cada passo do GTD</title>
<desc id="d">Cinco colunas, uma por passo do GTD, mostrando como a inteligência artificial ajuda: capturar, transcrevendo voz e reuniões e resumindo e-mails e conversas; esclarecer, sugerindo se o item é acionável e rascunhando o resultado e a próxima ação; organizar, propondo listas, contextos e datas e apontando duplicados; refletir, preparando a revisão semanal e mostrando projetos parados; engajar, sugerindo a ação pelo contexto e pela energia, com agentes executando tarefas simples. Embaixo, a regra: a IA sugere e você decide o que vira compromisso.</desc>
<rect width="1000" height="466" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">A IA em cada passo do GTD</text>
<rect x="34" y="84" width="176" height="56" rx="12" fill="#5B2A86"/>
<text x="122.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Capturar</text>
<rect x="34" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="54" cy="186" r="5" fill="#5B2A86"/><text x="66.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">transcreve voz</text><text x="66.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">e reuniões</text>
<circle cx="54" cy="256" r="5" fill="#5B2A86"/><text x="66.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">resume e-mails</text><text x="66.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">e conversas</text>
<rect x="222" y="84" width="176" height="56" rx="12" fill="#2F6FE0"/>
<text x="310.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Esclarecer</text>
<rect x="222" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/>
<circle cx="242" cy="186" r="5" fill="#2F6FE0"/><text x="254.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">sugere se é</text><text x="254.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">acionável</text>
<circle cx="242" cy="256" r="5" fill="#2F6FE0"/><text x="254.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">rascunha resultado</text><text x="254.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">e próxima ação</text>
<rect x="410" y="84" width="176" height="56" rx="12" fill="#0E8074"/>
<text x="498.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Organizar</text>
<rect x="410" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<circle cx="430" cy="186" r="5" fill="#0E8074"/><text x="442.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">propõe listas,</text><text x="442.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">contextos e datas</text>
<circle cx="430" cy="256" r="5" fill="#0E8074"/><text x="442.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">aponta itens</text><text x="442.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">duplicados</text>
<rect x="598" y="84" width="176" height="56" rx="12" fill="#B35300"/>
<text x="686.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Refletir</text>
<rect x="598" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<circle cx="618" cy="186" r="5" fill="#B35300"/><text x="630.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">prepara a</text><text x="630.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">revisão semanal</text>
<circle cx="618" cy="256" r="5" fill="#B35300"/><text x="630.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">mostra projetos</text><text x="630.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">parados</text>
<rect x="786" y="84" width="176" height="56" rx="12" fill="#C2185B"/>
<text x="874.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Engajar</text>
<rect x="786" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<circle cx="806" cy="186" r="5" fill="#C2185B"/><text x="818.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">sugere a ação por</text><text x="818.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">contexto e energia</text>
<circle cx="806" cy="256" r="5" fill="#C2185B"/><text x="818.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">agentes executam</text><text x="818.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">tarefas simples</text>
<rect x="34" y="340" width="928" height="64" rx="14" fill="#2B1B3D"/>
<text x="498.0" y="380.0" font-size="19" font-weight="700" fill="#FFC94D" text-anchor="middle">A IA sugere. Você decide o que vira compromisso.</text>
<text x="500.0" y="446.0" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Antes de colar dados no assistente, confira a política de privacidade da sua empresa.</text>
</svg>
