<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">DMAIC: le cinque fasi del miglioramento di un processo</title>
<desc id="d">Cinque colonne collegate da frecce, una per fase del DMAIC. Definire: qual è il problema e per chi, con project charter, SIPOC, albero CTQ e voce del cliente. Misurare: quanto è grande, con piano di raccolta, DPMO, FMEA e capacità. Analizzare: qual è la causa radice, con Ishikawa, 5 perché, Pareto e dispersione. Migliorare: come eliminare la causa, con diagramma di affinità, matrice di criteri, pilota e poka-yoke. Controllare: come mantenere il risultato, con carta di controllo, standardizzazione, piano di risposta e owner del processo. Una freccia tratteggiata torna da Controllare a Definire.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="525" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">DMAIC: le cinque fasi del miglioramento di un processo</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Ogni fase risponde a una domanda e ha i suoi strumenti tipici</text>
<rect x="20.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#E1ECFF" stroke="#3A86FF" stroke-width="2.5"/>
<circle cx="106.0" cy="144" r="24" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/>
<text x="106.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">D</text>
<text x="106.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Definire</text>
<text x="106.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Qual è il problema</text>
<text x="106.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">e per chi?</text>
<line x1="34" y1="258" x2="178" y2="258" stroke="#3A86FF" stroke-width="1.5"/>
<text x="34.0" y="280.0" font-size="11" fill="#756986" font-weight="700">STRUMENTI</text>
<circle cx="40" cy="300" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="304.0" font-size="13" fill="#2B1B3D">Project charter</text>
<circle cx="40" cy="326" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="330.0" font-size="13" fill="#2B1B3D">SIPOC</text>
<circle cx="40" cy="352" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="356.0" font-size="13" fill="#2B1B3D">Albero CTQ</text>
<circle cx="40" cy="378" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="382.0" font-size="13" fill="#2B1B3D">Voce del cliente</text>
<line x1="194" y1="144" x2="215" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="217.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<circle cx="303.0" cy="144" r="24" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<text x="303.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">M</text>
<text x="303.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Misurare</text>
<text x="303.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Quanto è grande</text>
<text x="303.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">oggi?</text>
<line x1="231" y1="258" x2="375" y2="258" stroke="#2A9D8F" stroke-width="1.5"/>
<text x="231.0" y="280.0" font-size="11" fill="#756986" font-weight="700">STRUMENTI</text>
<circle cx="237" cy="300" r="3.5" fill="#2A9D8F"/>
<text x="247.0" y="304.0" font-size="13" fill="#2B1B3D">Piano di raccolta</text>
<circle cx="237" cy="326" r="3.5" fill="#2A9D8F"/>
<text x="247.0" y="330.0" font-size="13" fill="#2B1B3D">DPMO e sigma</text>
<circle cx="237" cy="352" r="3.5" fill="#2A9D8F"/>
<text x="247.0" y="356.0" font-size="13" fill="#2B1B3D">FMEA</text>
<circle cx="237" cy="378" r="3.5" fill="#2A9D8F"/>
<text x="247.0" y="382.0" font-size="13" fill="#2B1B3D">Capacità (Cp, Cpk)</text>
<line x1="391" y1="144" x2="412" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="414.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#FFF1C9" stroke="#FFB703" stroke-width="2.5"/>
<circle cx="500.0" cy="144" r="24" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/>
<text x="500.0" y="153.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">A</text>
<text x="500.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Analizzare</text>
<text x="500.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Qual è la</text>
<text x="500.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">causa radice?</text>
<line x1="428" y1="258" x2="572" y2="258" stroke="#FFB703" stroke-width="1.5"/>
<text x="428.0" y="280.0" font-size="11" fill="#756986" font-weight="700">STRUMENTI</text>
<circle cx="434" cy="300" r="3.5" fill="#FFB703"/>
<text x="444.0" y="304.0" font-size="13" fill="#2B1B3D">Ishikawa</text>
<circle cx="434" cy="326" r="3.5" fill="#FFB703"/>
<text x="444.0" y="330.0" font-size="13" fill="#2B1B3D">5 perché</text>
<circle cx="434" cy="352" r="3.5" fill="#FFB703"/>
<text x="444.0" y="356.0" font-size="13" fill="#2B1B3D">Pareto</text>
<circle cx="434" cy="378" r="3.5" fill="#FFB703"/>
<text x="444.0" y="382.0" font-size="13" fill="#2B1B3D">Dispersione</text>
<line x1="588" y1="144" x2="609" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="611.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#FFE3E3" stroke="#FF6B6B" stroke-width="2.5"/>
<circle cx="697.0" cy="144" r="24" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/>
<text x="697.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">I</text>
<text x="697.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Migliorare</text>
<text x="697.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Come eliminare</text>
<text x="697.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">la causa?</text>
<line x1="625" y1="258" x2="769" y2="258" stroke="#FF6B6B" stroke-width="1.5"/>
<text x="625.0" y="280.0" font-size="11" fill="#756986" font-weight="700">STRUMENTI</text>
<circle cx="631" cy="300" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="304.0" font-size="13" fill="#2B1B3D">Diagramma affinità</text>
<circle cx="631" cy="326" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="330.0" font-size="13" fill="#2B1B3D">Matrice di criteri</text>
<circle cx="631" cy="352" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="356.0" font-size="13" fill="#2B1B3D">Pilota</text>
<circle cx="631" cy="378" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="382.0" font-size="13" fill="#2B1B3D">Poka-yoke</text>
<line x1="785" y1="144" x2="806" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="808.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<circle cx="894.0" cy="144" r="24" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<text x="894.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">C</text>
<text x="894.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Controllare</text>
<text x="894.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Come mantenere</text>
<text x="894.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">il risultato?</text>
<line x1="822" y1="258" x2="966" y2="258" stroke="#5B2A86" stroke-width="1.5"/>
<text x="822.0" y="280.0" font-size="11" fill="#756986" font-weight="700">STRUMENTI</text>
<circle cx="828" cy="300" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="304.0" font-size="13" fill="#2B1B3D">Carta di controllo</text>
<circle cx="828" cy="326" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="330.0" font-size="13" fill="#2B1B3D">Standardizzazione</text>
<circle cx="828" cy="352" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="356.0" font-size="13" fill="#2B1B3D">Piano di risposta</text>
<circle cx="828" cy="378" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="382.0" font-size="13" fill="#2B1B3D">Owner del processo</text>
<path d="M894.0 432 v34 H106.0 v-30" stroke="#5B2A86" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#ap)"/>
<text x="500.0" y="460.0" font-size="14" fill="#5B2A86" text-anchor="middle" font-weight="700">miglioramento continuo: il processo sotto controllo è la base del ciclo successivo</text>
<text x="500.0" y="505.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">I progetti DMAIC durano di solito da 3 a 6 mesi; ogni passaggio di fase è rivisto in un “tollgate”.</text>
</svg>
