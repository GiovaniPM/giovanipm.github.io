<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quando o número de passos explode</title>
<desc id="d">Tabela de cores com o tempo necessário, num computador de 1 bilhão de passos por segundo, para algoritmos de n ao quadrado, 2 elevado a n e n fatorial passos, com n igual a 10, 20, 30, 50 e 100. n = 10: n², &lt; 1 milissegundo; 2ⁿ, &lt; 1 milissegundo; n!, 3,6 ms. n = 20: n², &lt; 1 milissegundo; 2ⁿ, 1,0 ms; n!, 77 anos. n = 30: n², &lt; 1 milissegundo; 2ⁿ, 1,1 s; n!, 10¹⁵ anos. n = 50: n², &lt; 1 milissegundo; 2ⁿ, 13 dias; n!, 10⁴⁷ anos. n = 100: n², &lt; 1 milissegundo; 2ⁿ, 40 trilhões de anos; n!, 10¹⁴¹ anos.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
