<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Anatomía de una horquilla</title>
<desc id="d">Secuencia en tres tableros. Primero: X abre en la esquina superior izquierda y O responde en el lateral de arriba, un error. Segundo: X juega en el centro amenazando la diagonal, y O está obligado a bloquear en la esquina inferior derecha. Tercero: X juega en la esquina inferior izquierda y crea dos amenazas a la vez, en la columna de la izquierda y en la otra diagonal. O solo puede bloquear una, y X gana en la jugada siguiente.</desc>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Anatomía de una horquilla</text>
<text x="180" y="100" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">1. O falla en el lateral</text>
<rect x="69" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="143" y="120" width="74" height="74" fill="#FFFFFF"/>
<rect x="217" y="120" width="74" height="74" fill="#FFFFFF"/>
