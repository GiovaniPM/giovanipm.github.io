<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Integrazione via file con UBE e Table Conversion</title>
<desc id="d">Ingresso: la banca produce il file di ritorno, che arriva via SFTP o MFT; un UBE o una Table Conversion legge il file, una business function di validazione controlla e applica la regola e i dati vanno nelle tabelle di JDE, come gli incassi nella F03B13; le righe scartate finiscono in un report di errori. Uscita: dalle tabelle di JDE un UBE genera il file a tracciato fisso in una cartella dell'Enterprise Server, che parte via SFTP o MFT con cifratura PGP verso la banca o il fisco. Tutto è pianificato nello Scheduler di JDE, con un report di controllo per ogni esecuzione.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="510" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE personalizzati e Table Conversion</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">File con tracciato proprio: flussi bancari, adempimenti fiscali, CSV</text>
<rect x="20" y="92" width="960" height="190" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#756986" text-anchor="start" font-weight="700">INGRESSO: FILE DI RITORNO BANCARIO</text>
<rect x="30" y="136" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="116.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Banca</text>
<text x="116.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">file di ritorno</text>
<text x="116.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(larghezza fissa)</text>
<rect x="222" y="136" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="308.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">SFTP / MFT</text>
<text x="308.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">trasferimento</text>
<text x="308.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">sicuro</text>
<rect x="414" y="136" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE o Table</text>
<text x="500.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">Conversion legge</text>
<text x="500.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">il file</text>
<rect x="606" y="136" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="692.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">BSFN di validazione</text>
<text x="692.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">valida e applica</text>
<text x="692.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">la regola</text>
<rect x="798" y="136" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="884.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tabelle JDE</text>
<text x="884.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">es.: incassi</text>
<text x="884.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">F03B13</text>
<polyline points="202,176 220,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,176 412,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,176 604,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,176 796,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="262" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">le righe scartate finiscono in un report di errori o in una tabella di lavoro</text>
<rect x="20" y="300" width="960" height="190" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="324" font-size="13" fill="#756986" text-anchor="start" font-weight="700">USCITA: FLUSSI DI PAGAMENTO E FILE FISCALI</text>
<rect x="30" y="344" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="116.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tabelle JDE</text>
<text x="116.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">pagamenti,</text>
<text x="116.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">fatture, contabilità</text>
<rect x="222" y="344" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="308.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">L'UBE genera</text>
<text x="308.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">il file</text>
<text x="308.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(tracciato fisso)</text>
<rect x="414" y="344" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cartella</text>
<text x="500.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">sull'Enterprise</text>
<text x="500.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">Server</text>
<rect x="606" y="344" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="692.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">SFTP / MFT</text>
<text x="692.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">cifratura</text>
<text x="692.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">PGP</text>
<rect x="798" y="344" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="884.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Banca / fisco</text>
<text x="884.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">autorità</text>
<text x="884.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">…</text>
<polyline points="202,384 220,384" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,384 412,384" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,384 604,384" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,384 796,384" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="470" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">pianificato nello Scheduler di JDE; ogni esecuzione produce un report PDF/CSV di controllo</text>
</svg>
