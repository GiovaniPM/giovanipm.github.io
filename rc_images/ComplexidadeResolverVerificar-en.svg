<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Solving is hard, checking is easy</title>
<desc id="d">Two panels with a 4 by 4 Sudoku. On the left, solving: the board has only a few numbers and you must try, fail and go back; in a giant Sudoku the number of tries grows explosively. On the right, checking: the board is complete and you only need to confirm that every row, column and 2 by 2 square has the numbers 1, 2, 3 and 4. Below: NP are the problems whose answer is easy to check; P, those that are easy to solve; the question P equals NP asks whether, whenever checking is easy, solving is easy too.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
