<text x="500" y="537" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">NP: problems whose answer is easy to CHECK.  P: problems that are easy to SOLVE.</text>
<text x="500" y="559" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">The question P = NP? asks: whenever checking is easy, is solving easy too?</text>
