<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il metodo babilonese in azione</title>
<desc id="d">A sinistra, una tabella per la radice di 2 partendo dalla stima 1. Passo 1: stima 1, 2 diviso 1 fa 2, media 1,5, nessuna cifra decimale giusta. Passo 2: stima 1,5, 2 diviso 1,5 fa 1,3333, media 1,41667, due cifre giuste. Passo 3: stima 1,41667, divisione 1,41176, media 1,414216, cinque cifre giuste. Passo 4: media 1,41421356237, undici cifre giuste. Le cifre giuste quasi raddoppiano a ogni passo. A destra, l’esempio di Erone di Alessandria per la radice di 720: stima 27, 720 diviso 27 fa 26 e due terzi, la media è 26 e cinque sesti, 26,8333, contro il valore vero 26,8328.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Il metodo babilonese in azione</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Calcolare √2 e la √720 di Erone</text><rect x="30" y="100" width="590" height="50" rx="8" fill="#FFF1C9"/><text x="70" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">passo</text><text x="150" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">stima</text><text x="265" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">2 ÷ stima</text><text x="400" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">media</text><text x="540" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">cifre giuste</text><line x1="30" y1="212" x2="620" y2="212" stroke="#F1E2CF" stroke-width="1.5"/><text x="70" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">1</text><text x="150" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">1</text><text x="265" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">2</text><text x="400" y="190" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1,5</text><text x="540" y="190" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">0</text><line x1="30" y1="268" x2="620" y2="268" stroke="#F1E2CF" stroke-width="1.5"/><text x="70" y="246" font-size="15" fill="#2B1B3D" text-anchor="middle">2</text><text x="150" y="246" font-size="15" fill="#2B1B3D" text-anchor="middle">1,5</text><text x="265" y="246" font-size="15" fill="#2B1B3D" text-anchor="middle">1,3333</text><text x="400" y="246" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1,41667</text><text x="540" y="246" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">2</text><line x1="30" y1="324" x2="620" y2="324" stroke="#F1E2CF" stroke-width="1.5"/><text x="70" y="302" font-size="15" fill="#2B1B3D" text-anchor="middle">3</text><text x="150" y="302" font-size="15" fill="#2B1B3D" text-anchor="middle">1,41667</text><text x="265" y="302" font-size="15" fill="#2B1B3D" text-anchor="middle">1,41176</text><text x="400" y="302" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1,414216</text><text x="540" y="302" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">5</text><line x1="30" y1="380" x2="620" y2="380" stroke="#F1E2CF" stroke-width="1.5"/><text x="70" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle">4</text><text x="150" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle">1,414216</text><text x="265" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle">1,414211</text><text x="400" y="358" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1,41421356237</text><text x="540" y="358" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">11</text><text x="325" y="440" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">vero: √2 = 1,41421356237…</text><rect x="30" y="460" width="590" height="56" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="325" y="494" font-size="17" fill="#2A9D8F" text-anchor="middle" font-weight="700">Le cifre giuste quasi raddoppiano a ogni passo!</text><rect x="650" y="100" width="320" height="416" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="810" y="132" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Erone, c. 60 d.C.: √720</text><text x="810" y="172" font-size="15" fill="#2B1B3D" text-anchor="middle">27² = 729, vicino a 720</text><text x="810" y="202" font-size="15" fill="#2B1B3D" text-anchor="middle">stima: 27</text><text x="810" y="232" font-size="15" fill="#2B1B3D" text-anchor="middle">720 ÷ 27 = 26 ⅔</text><text x="810" y="262" font-size="15" fill="#2B1B3D" text-anchor="middle">media: (27 + 26 ⅔) ÷ 2</text><text x="810" y="310" font-size="20" fill="#5B2A86" text-anchor="middle" font-weight="700">= 26 ⅚ = 26,8333</text><text x="810" y="340" font-size="15" fill="#756986" text-anchor="middle">vero: 26,8328</text><line x1="680" y1="370" x2="940" y2="370" stroke="#F1E2CF" stroke-width="2"/><text x="810" y="400" font-size="14" fill="#2B1B3D" text-anchor="middle">Un solo passo, errore di</text><text x="810" y="424" font-size="14" fill="#2B1B3D" text-anchor="middle">mezzo millesimo.</text><text x="810" y="448" font-size="14" fill="#2B1B3D" text-anchor="middle">Erone diceva: ripeti per</text><text x="810" y="472" font-size="14" fill="#2B1B3D" text-anchor="middle">avvicinarti ancora di più.</text>
</svg>
