<text x="500.1" y="324.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Heylighen y Vidal explican</text><text x="500.1" y="341.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">el GTD con ciencia cognitiva</text>
