<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">La historia del GTD</title>
<desc id="d">Línea del tiempo del GTD: en los años 1980 y 1990, David Allen desarrolla el método como consultor; en 2001 sale el libro Getting Things Done; en 2007 Merlin Mann populariza el Inbox Zero; en 2008 Heylighen y Vidal explican el GTD con la ciencia cognitiva; en 2011 Masicampo y Baumeister muestran que hacer un plan calma la mente; en 2015 se publica la edición revisada con los cinco pasos; en los años 2020 los asistentes de inteligencia artificial entran en el flujo.</desc>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">La historia del GTD</text>
