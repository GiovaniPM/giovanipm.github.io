<text x="226.7" y="324.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Sale el libro</text><text x="226.7" y="341.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Getting Things Done</text>
<circle cx="363.4" cy="220" r="10" fill="#0E8074" stroke="#FFF7EC" stroke-width="3"/>
