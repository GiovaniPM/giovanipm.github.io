<text x="636.8" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Masicampo y Baumeister:</text><text x="636.8" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">planificar calma la mente</text>
