<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ciclo de uma chamada REST ao AIS Server</title>
<desc id="d">Diagrama de sequência com quatro participantes: cliente, AIS Server, HTML Server e Enterprise Server com o banco. 1: o cliente faz POST em /v2/tokenrequest com usuário, senha, ambiente e role. 2: o AIS valida o login no HTML Server e abre uma sessão. 3: o AIS devolve 200 com o token. 4: o cliente faz POST em /v3/orchestrator/ORCH_PO_Create com o token ou autenticação Basic. 5: o AIS executa o form request ou data request no HTML Server. 6: o HTML Server chama business functions e SQL no Enterprise Server. 7: o resultado volta ao HTML Server. 8: valores de retorno e erros voltam ao AIS. 9: o AIS responde 200 com JSON ou um código 4xx ou 5xx. 10: o cliente encerra a sessão com /v2/tokenrequest/logout.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="640" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="42.0" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Como uma chamada REST percorre o JD Edwards</text>
<text x="500.0" y="68.0" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Token, execução nas aplicações e resposta em JSON</text>
<rect x="28" y="92" width="164" height="44" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="110.0" y="119.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cliente</text>
<polyline points="110,136 110,560" fill="none" stroke="#C9B8DC" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="438" y="92" width="164" height="44" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="520.0" y="119.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">AIS Server</text>
<polyline points="520,136 520,560" fill="none" stroke="#C9B8DC" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="638" y="92" width="164" height="44" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="720.0" y="119.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">HTML Server (JAS)</text>
<polyline points="720,136 720,560" fill="none" stroke="#C9B8DC" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="813" y="92" width="164" height="44" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="895.0" y="119.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Enterprise Server + BD</text>
<polyline points="895,136 895,560" fill="none" stroke="#C9B8DC" stroke-width="1.5" stroke-dasharray="4 4"/>
<polyline points="114,172 514,172" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="122.0" y="165.0" font-size="12" fill="#2B1B3D" text-anchor="start" font-weight="700">1  POST /v2/tokenrequest  (usuário, senha, ambiente, role)</text>
<polyline points="524,210 714,210" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="620.0" y="203.0" font-size="12" fill="#2B1B3D" text-anchor="middle" font-weight="700">2  valida o login e abre a sessão</text>
<polyline points="516,248 116,248" fill="none" stroke="#0E8074" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
<text x="122.0" y="241.0" font-size="12" fill="#0E8074" text-anchor="start">3  200 OK + userInfo.token</text>
<polyline points="114,286 514,286" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="122.0" y="279.0" font-size="12" fill="#2B1B3D" text-anchor="start" font-weight="700">4  POST /v3/orchestrator/ORCH_PO_Create  (token ou Basic)</text>
<polyline points="524,324 714,324" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="620.0" y="317.0" font-size="12" fill="#2B1B3D" text-anchor="middle" font-weight="700">5  form request / data request</text>
<polyline points="724,362 889,362" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="807.5" y="355.0" font-size="12" fill="#2B1B3D" text-anchor="middle" font-weight="700">6  BSFN, MBF e SQL via JDENET</text>
<polyline points="891,400 726,400" fill="none" stroke="#0E8074" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
<text x="807.5" y="393.0" font-size="12" fill="#0E8074" text-anchor="middle">7  registros gravados / lidos</text>
<polyline points="716,438 526,438" fill="none" stroke="#0E8074" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
<text x="620.0" y="431.0" font-size="12" fill="#0E8074" text-anchor="middle">8  valores de retorno e erros</text>
<polyline points="516,476 116,476" fill="none" stroke="#0E8074" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
<text x="122.0" y="469.0" font-size="12" fill="#0E8074" text-anchor="start">9  200 OK + JSON  (ou 4xx / 5xx)</text>
<polyline points="114,514 514,514" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="122.0" y="507.0" font-size="12" fill="#2B1B3D" text-anchor="start" font-weight="700">10  POST /v2/tokenrequest/logout</text>
<rect x="30" y="574" width="940" height="46" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="592.8" font-size="13" fill="#3E3350" text-anchor="middle">Orquestrações com autenticação Basic dispensam os passos 1 a 3 e o 10: o AIS abre e fecha a sessão a cada chamada.</text>
</svg>
