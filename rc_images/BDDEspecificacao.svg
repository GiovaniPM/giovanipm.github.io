<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Os seis padrões da Especificação por Exemplo</title>
<desc id="d">Seis etapas em círculo ao redor da Especificação por Exemplo, ligadas por setas: 1, especificar juntos, com os Três Amigos e uma linguagem comum; 2, ilustrar com exemplos Dado, Quando, Então; 3, refinar; 4, automatizar com uma camada fina; 5, validar sempre, a cada mudança; 6, documentação viva, que volta à etapa 1.</desc>
