<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">From plan to value: scope, time, cost and quality</title>
<desc id="d">Four-quadrant chart summarizing the article, with value at the center. Scope: yesterday, fixed at the start and guarded by a change control board; tomorrow, a hypothesis adjusted by the outcomes measured in each cycle, with OKRs and #NoProjects. Time: yesterday, project end date, detailed schedule and delivery in one large batch; tomorrow, a continuous flow of small deliveries with forecasts drawn from data, with the Flow Framework and AI. Cost: yesterday, annual budget per project approved once; tomorrow, continuous funding by value stream reviewed every quarter, with Beyond Budgeting and Lean Portfolio Management. Quality: yesterday, checked at the end and inherited by a maintenance team; tomorrow, built into the flow, with stable teams that own the product and visible debt, with Team Topologies and the Flow Framework.</desc>
