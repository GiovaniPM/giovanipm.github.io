<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
<title id="t">How the app opens and saves the file in each browser</title>
<desc id="d">You open the JSON file with Abrir JSON and edit the activities. In Chrome, Edge and Opera, the app writes the changes to the same file, even on its own, a moment after each change. In Firefox and Safari, Salvar JSON downloads a new copy that replaces the previous one. While there are unsaved changes, a draft is kept in the browser.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#756986"/></marker></defs>
<rect width="1000" height="330" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="30" y="120" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="125" y="155" font-size="18" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Abrir JSON</text>
<text x="125" y="180" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">pick the file</text>
<line x1="222" y1="160" x2="268" y2="160" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="272" y="120" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<text x="367" y="155" font-size="18" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Edit</text>
<text x="367" y="180" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">activities, filters</text>
<line x1="464" y1="150" x2="540" y2="85" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<line x1="464" y1="170" x2="540" y2="235" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="545" y="40" width="420" height="90" rx="12" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2"/>
<text x="755" y="72" font-size="18" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Chrome · Edge · Opera</text>
<text x="755" y="96" font-size="14" font-weight="normal" fill="#2B1B3D" text-anchor="middle">writes to the same file</text>
<text x="755" y="116" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">and saves on its own after each change</text>
<rect x="545" y="190" width="420" height="90" rx="12" fill="#EAF2FF" stroke="#3A86FF" stroke-width="2"/>
<text x="755" y="222" font-size="18" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Firefox · Safari</text>
<text x="755" y="246" font-size="14" font-weight="normal" fill="#2B1B3D" text-anchor="middle">Salvar JSON downloads a copy</text>
<text x="755" y="266" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">name + date and time</text>
<rect x="257" y="238" width="220" height="74" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2" stroke-dasharray="6 5"/>
<text x="367" y="262" font-size="14" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Draft in the browser</text>
<text x="367" y="282" font-size="12" font-weight="normal" fill="#756986" text-anchor="middle">while there are</text>
<text x="367" y="299" font-size="12" font-weight="normal" fill="#756986" text-anchor="middle">unsaved changes</text>
<line x1="367" y1="202" x2="367" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 5"/>
</g>
</svg>
