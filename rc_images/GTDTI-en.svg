<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">IT work in GTD</title>
<desc id="d">Table with eight kinds of IT work and the GTD list each one goes to: production alert, do it now, it is an incident; ticket assigned to you, next action in the computer context; pull request to review, do it if it takes less than two minutes, otherwise it becomes a next action; question in the team chat, answer it or turn it into an action; dependency on another team, waiting-for list with a follow-up date; multi-step migration, project with its next action defined; refactoring idea, someday or maybe, or the backlog; runbook and documentation, reference.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">IT work in GTD</text>
<text x="250.0" y="96.0" font-size="15" font-weight="700" fill="#756986" text-anchor="middle">Arrives as…</text>
<text x="700.0" y="96.0" font-size="15" font-weight="700" fill="#756986" text-anchor="middle">Goes to…</text>
<rect x="90.0" y="112.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="139.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Production alert</text>
<path d="M418.0 133.0 L467.0 133.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 133.0 L467.0 139.0 L467.0 127.0 Z" fill="#756986"/>
<rect x="486.0" y="112.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2"/>
<text x="701.0" y="139.0" font-size="14.5" font-weight="700" fill="#2A9D8F" text-anchor="middle">Do it now: it is an incident</text>
