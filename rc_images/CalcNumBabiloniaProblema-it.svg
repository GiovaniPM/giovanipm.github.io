<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il problema della diagonale</title>
<desc id="d">A sinistra, un campo quadrato di lato 1 con la diagonale tracciata. Per il teorema di Pitagora, la diagonale al quadrato è 1 più 1, cioè 2, quindi la diagonale è la radice di 2. Nessuna frazione dà esattamente quel valore. A destra, il disegno della tavoletta babilonese YBC 7289, di circa il 1800 a.C., con un quadrato, le diagonali e i numeri 1;24,51,10 in base 60, che valgono 1 + 24/60 + 51/3600 + 10/216000, cioè 1,41421296, contro il valore vero 1,41421356.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Il problema della diagonale</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Quanto misura la diagonale di un quadrato di lato 1?</text><rect x="90" y="130" width="220" height="220" rx="4" fill="#E2F6F2" stroke="#2A9D8F" stroke-width="3"/><line x1="90" y1="350" x2="310" y2="130" stroke="#FF6B6B" stroke-width="4"/><text x="200" y="375" font-size="18" fill="#2B1B3D" text-anchor="middle" font-weight="700">1</text><text x="70" y="245" font-size="18" fill="#2B1B3D" text-anchor="middle" font-weight="700">1</text><text x="232" y="272" font-size="30" fill="#FF6B6B" text-anchor="middle" font-weight="700">?</text><rect x="40" y="400" width="330" height="76" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="205" y="430" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Pitagora: d² = 1² + 1² = 2</text><text x="205" y="458" font-size="15" fill="#5B2A86" text-anchor="middle">d = √2 … ma quanto fa?</text><circle cx="620" cy="260" r="150" fill="#E9D8B8" stroke="#9C7A4A" stroke-width="3"/><polygon points="530.0,170.0 710.0,170.0 710.0,350.0 530.0,350.0" fill="none" stroke="#6B4E2A" stroke-width="2.5" stroke-linejoin="round"/><line x1="530" y1="350" x2="710" y2="170" stroke="#6B4E2A" stroke-width="2.5"/><line x1="530" y1="170" x2="710" y2="350" stroke="#6B4E2A" stroke-width="2.5"/><text x="540" y="160" font-size="16" fill="#6B4E2A" text-anchor="start" font-weight="700">30</text><text x="620" y="250" font-size="20" fill="#4A3418" text-anchor="middle" font-weight="700">1;24,51,10</text><text x="620" y="300" font-size="18" fill="#4A3418" text-anchor="middle" font-weight="700">42;25,35</text><text x="620" y="440" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">YBC 7289 · c. 1800 a.C.</text><rect x="790" y="150" width="190" height="250" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><text x="885" y="178" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">Base 60</text><text x="885" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">1</text><text x="885" y="230" font-size="14" fill="#2B1B3D" text-anchor="middle">+ 24 ÷ 60</text><text x="885" y="254" font-size="14" fill="#2B1B3D" text-anchor="middle">+ 51 ÷ 3.600</text><text x="885" y="278" font-size="14" fill="#2B1B3D" text-anchor="middle">+ 10 ÷ 216.000</text><line x1="810" y1="300" x2="960" y2="300" stroke="#B35300" stroke-width="1.5"/><text x="885" y="326" font-size="16" fill="#5B2A86" text-anchor="middle" font-weight="700">= 1,41421296</text><text x="885" y="352" font-size="14" fill="#756986" text-anchor="middle">vero: 1,41421356</text><text x="885" y="380" font-size="13" fill="#2A9D8F" text-anchor="middle" font-weight="700">errore &lt; 0,000001</text>
</svg>
