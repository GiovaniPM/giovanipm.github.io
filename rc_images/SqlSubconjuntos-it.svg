<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">I cinque sottoinsiemi di SQL</title>
<desc id="d">Cinque schede: DDL, definizione dei dati, con CREATE, ALTER e DROP; DML, manipolazione dei dati, con INSERT, UPDATE e DELETE; DQL, interrogazione, con SELECT; DCL, controllo dei dati, con GRANT e REVOKE; e DTL, transazioni, detta anche TCL, con COMMIT, ROLLBACK e SAVEPOINT.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="416" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">I cinque sottoinsiemi di SQL</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Ogni gruppo di comandi si occupa di una parte del lavoro con il database</text>
<rect x="30.0" y="110.0" width="176.0" height="250.0" rx="14" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="118.0" y="148.0" font-size="28" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">DDL</text>
<text x="118.0" y="172.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Definizione dei dati</text>
<text x="118.0" y="196.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">crea e modifica</text>
<text x="118.0" y="213.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">la struttura</text>
<rect x="48.0" y="240.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="58.0" y="259.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">CREATE</text>
<rect x="48.0" y="276.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="58.0" y="295.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">ALTER</text>
<rect x="48.0" y="312.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="58.0" y="331.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">DROP</text>
<rect x="221.0" y="110.0" width="176.0" height="250.0" rx="14" fill="#E1ECFF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="309.0" y="148.0" font-size="28" fill="#3A86FF" text-anchor="middle" font-weight="700" xml:space="preserve">DML</text>
<text x="309.0" y="172.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Manipolazione dei dati</text>
<text x="309.0" y="196.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">inserisce, modifica</text>
<text x="309.0" y="213.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">e cancella righe</text>
<rect x="239.0" y="240.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="249.0" y="259.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">INSERT</text>
<rect x="239.0" y="276.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="249.0" y="295.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">UPDATE</text>
<rect x="239.0" y="312.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="249.0" y="331.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">DELETE</text>
<rect x="412.0" y="110.0" width="176.0" height="250.0" rx="14" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="500.0" y="148.0" font-size="28" fill="#2A9D8F" text-anchor="middle" font-weight="700" xml:space="preserve">DQL</text>
<text x="500.0" y="172.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Interrogazione</text>
<text x="500.0" y="196.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">legge i dati</text>
<text x="500.0" y="213.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">(un solo comando)</text>
<rect x="430.0" y="240.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="440.0" y="259.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">SELECT</text>
<rect x="603.0" y="110.0" width="176.0" height="250.0" rx="14" fill="#FFF1C9" stroke="#B35300" stroke-width="2.5"/>
<text x="691.0" y="148.0" font-size="28" fill="#B35300" text-anchor="middle" font-weight="700" xml:space="preserve">DCL</text>
<text x="691.0" y="172.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Controllo dei dati</text>
<text x="691.0" y="196.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">concede e revoca</text>
<text x="691.0" y="213.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">permessi</text>
<rect x="621.0" y="240.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="631.0" y="259.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">GRANT</text>
<rect x="621.0" y="276.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="631.0" y="295.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">REVOKE</text>
<rect x="794.0" y="110.0" width="176.0" height="250.0" rx="14" fill="#FFE3E3" stroke="#C2185B" stroke-width="2.5"/>
<text x="882.0" y="148.0" font-size="28" fill="#C2185B" text-anchor="middle" font-weight="700" xml:space="preserve">DTL</text>
<text x="882.0" y="172.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Transazioni (o TCL)</text>
<text x="882.0" y="196.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">conferma o annulla</text>
<text x="882.0" y="213.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">un gruppo di modifiche</text>
<rect x="812.0" y="240.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="822.0" y="259.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">COMMIT</text>
<rect x="812.0" y="276.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="822.0" y="295.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">ROLLBACK</text>
<rect x="812.0" y="312.0" width="140.0" height="30.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="822.0" y="331.7" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">SAVEPOINT</text>
<text x="500.0" y="394.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Molti autori mettono SELECT dentro la DML; il nome TCL (Transaction Control Language) è più comune di DTL.</text>
</svg>
