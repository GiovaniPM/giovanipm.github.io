e="#756986" stroke-width="2" marker-end="url(#ar)"/><rect x="612" y="230" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><text x="698.0" y="256.0" font-size="13.550600343053173" fill="#5B2A86" text-anchor="middle" font-weight="bold">IX · Union of the bows</text><text x="698.0" y="280.0" font-size="13" fill="#756986" text-anchor="middle">Itaquê’s bow,</text><text x="698.0" y="296.2" font-size="13" fill="#756986" text-anchor="middle">Agniná</text><path d="M892.0 126 L892.0 164 L116.0 164 L116.0 226" fill="none" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/><rect x="30" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="119.0" y="457.0" font-size="13.5" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ Captive of Pojucã</text><text x="119.0" y="480.0" font-size="12" fill="#2B1B3D" text-anchor="middle">lose a duel</text><path d="M32 82.0 L14 82.0 L14 465 L27 465" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><rect x="222" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="311.0" y="457.0" font-size="11.600279524807826" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ The maiden did not choose</text><text x="311.0" y="480.0" font-size="10.702772404900065" fill="#2B1B3D" text-anchor="middle">affection + merit + ½ service &lt; 9</text><path d="M116.0 316 L116.0 334 L311.0 404 L311.0 426" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><rect x="414" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="503.0" y="457.0" font-size="13.5" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ Betrayal</text><text x="503.0" y="480.0" font-size="12" fill="#2B1B3D" text-anchor="middle">take Araci at night</text><path d="M310.0 316 L310.0 334 L503.0 404 L503.0 426" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><rect x="606" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="695.0" y="457.0" font-size="13.5" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ No honour, no union</text><text x="695.0" y="480.0" font-size="12" fill="#2B1B3D" text-anchor="middle">honour &lt; 5</text><path d="M683.0 316 L683.0 334 L695.0 404 L695.0 426" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><rect x="798" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="887.0" y="457.0" font-size="13.5" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ The fall of the hero</text><text x="887.0" y="480.0" font-size="12" fill="#2B1B3D" text-anchor="middle">lose to Agniná</text><path d="M713.0 316 L713.0 334 L887.0 404 L887.0 426" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><line x1="786" y1="272.0" x2="803" y2="272.0" stroke="#0E8074" stroke-width="2.4" marker-end="url(#ar)"/><rect x="806" y="230" width="172" height="84" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2.4"/><text x="892.0" y="258.0" font-size="14.5" fill="#0E8074" text-anchor="middle" font-weight="bold">★ The legend of</text><text x="892.0" y="276.1" font-size="14.5" fill="#0E8074" text-anchor="middle" font-weight="bold">Ubirajara</text><text x="892.0" y="300.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle">defeat Agniná</text><text x="500" y="535.0" font-size="13" fill="#756986" text-anchor="middle">After a sad ending you can restart the act.</text></g>
