<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">The journey: nine acts and six endings</title>
<desc id="d">The nine acts of the game follow the chapters of the novel. Act I, The hunter: hunting in the fields, the chase after Araci, the challenge arrow and the two duels with Pojucã; losing a duel leads to the ending Captive of Pojucã. Act II, The warrior: the great bow of the Araguaia. Act III, The bride. Act IV, Hospitality: the trip up the river. Act V, Servant of love: the tasks for Itaquê. Act VI, The wedding contest: Cori, the log, the jar of ants; if Araci’s affection plus merit plus half of service is below 9, the ending is The maiden did not choose. Act VII, The war: taking Araci at night leads to the ending Betrayal. Act VIII, The battle. Act IX, The union of the bows: with honour below 5 the ending is No honour, no union; losing to Agniná leads to The fall of the hero; winning leads to The legend of Ubirajara.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
