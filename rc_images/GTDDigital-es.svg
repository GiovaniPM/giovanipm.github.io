<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Una bandeja de entrada para el mundo digital</title>
<desc id="d">Diagrama con una bandeja de entrada en el centro y seis fuentes digitales alrededor, cada una con lo que suele convertirse: agenda, solo lo que tiene día y hora; correo, acciones, a la espera y referencia; webs y lecturas, listas de leer después y referencia; móvil y voz, captura en cualquier lugar; archivos y notas, referencia y material de apoyo a proyectos; mensajes y chat, peticiones que se convierten en acciones.</desc>
