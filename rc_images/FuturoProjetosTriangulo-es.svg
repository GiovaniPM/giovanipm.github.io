<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">El triángulo de hierro y su inversión en el ágil</title>
<desc id="d">Dos triángulos. En el enfoque tradicional, predictivo, el alcance es fijo y el costo y el plazo se estiman: el plan guía el valor. En el enfoque ágil, adaptativo, el triángulo se invierte: costo y plazo son fijos y el alcance se estima: el valor guía el plan.</desc>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="52" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">El triángulo de hierro y su inversión en el ágil</text>
<text x="250" y="100" font-size="19" font-weight="700" fill="#5B2A86" text-anchor="middle">Tradicional (predictivo)</text>
<path d="M250 178 L100 400 L400 400 Z" fill="#EFE6F8" stroke="#5B2A86" stroke-width="4" stroke-linejoin="round"/>
<text x="250" y="334" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">El plan</text><text x="250" y="356" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">guía el valor</text>
<text x="250" y="132" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Alcance</text>
<rect x="218.0" y="143" width="64" height="26" rx="13" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/><text x="250" y="161" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">FIJO</text>
<text x="100" y="432" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Costo</text>
<rect x="52.0" y="443" width="96" height="26" rx="13" fill="#fff" stroke="#2B1B3D" stroke-width="2"/><text x="100" y="461" font-size="12.5" font-weight="700" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">ESTIMADO</text>
<text x="400" y="432" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Plazo</text>
<rect x="352.0" y="443" width="96" height="26" rx="13" fill="#fff" stroke="#2B1B3D" stroke-width="2"/><text x="400" y="461" font-size="12.5" font-weight="700" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">ESTIMADO</text>
<path d="M462 280 H528" stroke="#B35300" stroke-width="5" stroke-linecap="round"/><path d="M524 266 L546 280 L524 294 Z" fill="#B35300"/>
<text x="750" y="100" font-size="19" font-weight="700" fill="#0E8074" text-anchor="middle">Ágil (adaptativo)</text>
<path d="M600 182 L900 182 L750 404 Z" fill="#E2F6F2" stroke="#0E8074" stroke-width="4" stroke-linejoin="round"/>
<text x="750" y="244" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">El valor</text><text x="750" y="266" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">guía el plan</text>
<text x="600" y="132" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Costo</text>
<rect x="568.0" y="143" width="64" height="26" rx="13" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/><text x="600" y="161" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">FIJO</text>
<text x="900" y="132" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Plazo</text>
<rect x="868.0" y="143" width="64" height="26" rx="13" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/><text x="900" y="161" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">FIJO</text>
<text x="750" y="436" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Alcance</text>
<rect x="702.0" y="447" width="96" height="26" rx="13" fill="#fff" stroke="#2B1B3D" stroke-width="2"/><text x="750" y="465" font-size="12.5" font-weight="700" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">ESTIMADO</text>
<text x="500" y="500" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Adaptado del DSDM (Dynamic Systems Development Method), del Agile Business Consortium.</text>
</svg>
