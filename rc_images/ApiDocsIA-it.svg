<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dove entra l'IA nel lavoro con API Docs</title>
<desc id="d">Sei passi: raccogli codice, chiamate cURL e testi; l'IA abbozza la specifica OpenAPI in JSON con i prompt da 1 a 4; l'app importa il file e lo rivedi in modalità modifica; l'app prova sull'API reale; l'IA rivede testi, lacune e test con i prompt da 5 a 9, e tu correggi nell'app; infine decidi, salvi e pubblichi.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="400" rx="18" fill="#FFF7EC"/>
<rect x="40" y="50" width="280" height="110" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="180" y="90" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">1. Tu raccogli</text>
<text x="180" y="118" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">codice, cURL, testi</text>
<rect x="360" y="50" width="280" height="110" rx="14" fill="#FCE4F0" stroke="#2B1B3D" stroke-width="3"/>
<text x="500" y="90" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">2. L'IA abbozza</text>
<text x="500" y="118" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">OpenAPI in JSON</text>
<text x="500" y="142" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="middle">prompt da 1 a 4</text>
<rect x="680" y="50" width="280" height="110" rx="14" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="3"/>
<text x="820" y="90" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">3. L'app importa</text>
<text x="820" y="118" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">importa e rivedi</text>
<text x="820" y="142" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="middle">in modalità modifica</text>
<rect x="680" y="250" width="280" height="110" rx="14" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="3"/>
<text x="820" y="290" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">4. L'app prova</text>
<text x="820" y="318" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">prova richiesta</text>
<text x="820" y="342" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="middle">sull'API reale</text>
<rect x="360" y="250" width="280" height="110" rx="14" fill="#FCE4F0" stroke="#2B1B3D" stroke-width="3"/>
<text x="500" y="290" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">5. L'IA rivede</text>
<text x="500" y="318" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">testi, lacune e test</text>
<text x="500" y="342" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="middle">prompt da 5 a 9</text>
<rect x="40" y="250" width="280" height="110" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="180" y="290" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">6. Tu decidi</text>
<text x="180" y="318" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">salva e pubblica</text>
<g stroke="#2B1B3D" stroke-width="3" fill="none"><path d="M324 105H356" marker-end="url(#a)"/><path d="M644 105H676" marker-end="url(#a)"/><path d="M820 164V246" marker-end="url(#a)"/><path d="M676 305H644" marker-end="url(#a)"/><path d="M356 305H324" marker-end="url(#a)"/></g>
<path d="M560 246C600 200 660 190 700 166" stroke="#C2185B" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#r)"/>
<text x="612" y="196" font-size="14" font-weight="700" fill="#C2185B" text-anchor="end">correggi</text>
</svg>
