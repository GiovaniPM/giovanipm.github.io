<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Integration landscape in JD Edwards EnterpriseOne</title>
<desc id="d">Three columns. External systems on the left: web, mobile, IoT and iPaaS call the AIS Server with the Orchestrator via REST, which uses the HTML Server and reaches the Enterprise Server through JDENET. SOAP systems call the Business Services Server. The Enterprise Server sends events to the Transaction Server, which delivers them to consumers via JMS or HTTP. BI reads the database with read-only SQL. Batch loads write to the Z-files and a UBE processes them. EDI partners arrive as flat files in the F47 tables. The Enterprise Server, with business functions, master business functions, UBEs and event kernels, accesses the database through JDB.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
