<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="t d">
<title id="t">Le quattro fasi seguite dall’app</title>
<desc id="d">Quattro fasi in sequenza. Post-rilascio: verifiche immediate, con smoke test, monitoraggio, comunicazione e finestra di rollback. Hypercare: stabilizzazione con supporto rafforzato, incidenti con SLA, pendenze e follow-up. Post-mortem: revisione senza colpevoli, con cronologia, cause principali, lezioni e azioni. Chiuso: passaggio al supporto. L’uscita dall’hypercare dipende dai criteri di uscita: nessun S1 o S2 aperto, criteri soddisfatti, pendenze alte risolte e incidenti in calo.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="370" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
