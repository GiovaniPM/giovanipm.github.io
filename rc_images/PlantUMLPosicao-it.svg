<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Sette modi per posizionare un’attività</title>
<desc id="d">Sette righe di codice a sinistra, ognuna collegata alla barra che produce su una linea del tempo a destra: A, senza data, inizia con il progetto; B ha date fisse; C inizia quando finisce A; D viene subito dopo C con then; E inizia 2 giorni dopo la fine di A; la milestone M avviene alla fine di D; e F è mostrata sulla stessa riga di A.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="510" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Sette modi per posizionare un’attività</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">PlantUML calcola le date a partire dalle relazioni tra le attività</text>
<line x1="480" y1="100" x2="480" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="495.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">5</text>
<line x1="511" y1="100" x2="511" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="526.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">6</text>
<line x1="542" y1="100" x2="542" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="557.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">7</text>
<line x1="573" y1="100" x2="573" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="588.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">8</text>
<line x1="604" y1="100" x2="604" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="619.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">9</text>
<line x1="635" y1="100" x2="635" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="650.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">10</text>
<line x1="666" y1="100" x2="666" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="681.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">11</text>
<line x1="697" y1="100" x2="697" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="712.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">12</text>
<line x1="728" y1="100" x2="728" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="743.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">13</text>
<line x1="759" y1="100" x2="759" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="774.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">14</text>
<line x1="790" y1="100" x2="790" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="805.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">15</text>
<line x1="821" y1="100" x2="821" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="836.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">16</text>
<line x1="852" y1="100" x2="852" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="867.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">17</text>
<line x1="883" y1="100" x2="883" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="898.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">18</text>
<line x1="914" y1="100" x2="914" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="929.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">19</text>
<line x1="945" y1="100" x2="945" y2="460" stroke="#E4D5C0" stroke-width="1"/>
<text x="960.5" y="94.0" font-size="11" fill="#756986" text-anchor="middle" xml:space="preserve">20</text>
<line x1="480" y1="100" x2="480" y2="460" stroke="#5B2A86" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="486.0" y="472.0" font-size="11.5" fill="#5B2A86" font-weight="700" xml:space="preserve">project starts</text>
<rect x="20.0" y="102.0" width="444.0" height="40.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="32" y="120" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#5FD3C4">[A]</tspan><tspan fill="#FFB703" font-weight="700"> requires </tspan><tspan fill="#F7F0FF">4 days</tspan></text>
<text x="32.0" y="136.0" font-size="11" fill="#C9BEDA" font-style="italic" xml:space="preserve">senza data: inizia con il progetto</text>
<rect x="481.0" y="108.0" width="122.0" height="22.0" rx="3" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="487.0" y="124.0" font-size="12" fill="#2B1B3D" font-weight="700" xml:space="preserve">A</text>
<rect x="20.0" y="152.0" width="444.0" height="40.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="32" y="170" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#5FD3C4">[B]</tspan><tspan fill="#FFB703" font-weight="700"> starts </tspan><tspan fill="#F7F0FF">2026-10-08</tspan><tspan fill="#FFB703" font-weight="700"> and ends </tspan><tspan fill="#F7F0FF">…-12</tspan></text>
<text x="32.0" y="186.0" font-size="11" fill="#C9BEDA" font-style="italic" xml:space="preserve">date fisse di inizio e fine</text>
<rect x="574.0" y="158.0" width="153.0" height="22.0" rx="3" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="580.0" y="174.0" font-size="12" fill="#2B1B3D" font-weight="700" xml:space="preserve">B</text>
<rect x="20.0" y="202.0" width="444.0" height="40.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="32" y="220" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#5FD3C4">[C]</tspan><tspan fill="#FFB703" font-weight="700"> starts at </tspan><tspan fill="#5FD3C4">[A]</tspan><tspan fill="#F7F0FF">'s end</tspan></text>
<text x="32.0" y="236.0" font-size="11" fill="#C9BEDA" font-style="italic" xml:space="preserve">inizia quando finisce A</text>
<rect x="605.0" y="208.0" width="91.0" height="22.0" rx="3" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="611.0" y="224.0" font-size="12" fill="#2B1B3D" font-weight="700" xml:space="preserve">C</text>
<rect x="20.0" y="252.0" width="444.0" height="40.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="32" y="270" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">then </tspan><tspan fill="#5FD3C4">[D]</tspan><tspan fill="#FFB703" font-weight="700"> requires </tspan><tspan fill="#F7F0FF">3 days</tspan></text>
<text x="32.0" y="286.0" font-size="11" fill="#C9BEDA" font-style="italic" xml:space="preserve">then: subito dopo l’attività precedente</text>
<rect x="698.0" y="258.0" width="91.0" height="22.0" rx="3" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="704.0" y="274.0" font-size="12" fill="#2B1B3D" font-weight="700" xml:space="preserve">D</text>
<rect x="20.0" y="302.0" width="444.0" height="40.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="32" y="320" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#5FD3C4">[E]</tspan><tspan fill="#FFB703" font-weight="700"> starts </tspan><tspan fill="#F7F0FF">2 days after </tspan><tspan fill="#5FD3C4">[A]</tspan><tspan fill="#F7F0FF">'s end</tspan></text>
<text x="32.0" y="336.0" font-size="11" fill="#C9BEDA" font-style="italic" xml:space="preserve">con un margine dopo A</text>
<rect x="667.0" y="308.0" width="60.0" height="22.0" rx="3" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="673.0" y="324.0" font-size="12" fill="#2B1B3D" font-weight="700" xml:space="preserve">E</text>
<rect x="20.0" y="352.0" width="444.0" height="40.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="32" y="370" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#5FD3C4">[M]</tspan><tspan fill="#FFB703" font-weight="700"> happens at </tspan><tspan fill="#5FD3C4">[D]</tspan><tspan fill="#F7F0FF">'s end</tspan></text>
<text x="32.0" y="386.0" font-size="11" fill="#C9BEDA" font-style="italic" xml:space="preserve">milestone: un punto, non una barra</text>
<path d="M790 358 l11 11 l-11 11 l-11 -11 z" fill="#FFB703" stroke="#2B1B3D" stroke-width="1.8"/>
<text x="806.0" y="374.0" font-size="12" fill="#2B1B3D" font-weight="700" xml:space="preserve">M</text>
<rect x="20.0" y="402.0" width="444.0" height="40.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="32" y="420" font-family="Consolas, 'Courier New', monospace" font-size="12.5" xml:space="preserve"><tspan fill="#5FD3C4">[F]</tspan><tspan fill="#FFB703" font-weight="700"> displays on same row as </tspan><tspan fill="#5FD3C4">[A]</tspan></text>
<text x="32.0" y="436.0" font-size="11" fill="#C9BEDA" font-style="italic" xml:space="preserve">stessa riga, per risparmiare spazio</text>
<rect x="791.0" y="408.0" width="60.0" height="22.0" rx="3" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="797.0" y="424.0" font-size="12" fill="#2B1B3D" font-weight="700" xml:space="preserve">F</text>
<path d="M604 130 V218 H608" stroke="#2B1B3D" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M697 230 V268 H701" stroke="#2B1B3D" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M610 130 V310" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
<line x1="610" y1="312" x2="664" y2="312" stroke="#C2185B" stroke-width="2" marker-end="url(#ard)" marker-start="url(#ard)"/>
<text x="635.0" y="306.0" font-size="10.5" fill="#C2185B" text-anchor="middle" font-weight="700" xml:space="preserve">+2</text>
<path d="M790 280 V356" stroke="#2B1B3D" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M794 280 V410 H796" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
<text x="500.0" y="494.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Senza date fisse basta cambiare la durata di A e tutto il calendario si ricalcola.</text>
</svg>
