<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Sistemas lineales en la vida cotidiana</title>
<desc id="d">A la izquierda, un problema en el bar: una empanada más un jugo más una croqueta cuestan 18 euros; 2 empanadas y 1 croqueta, 20 euros; 1 jugo y 2 croquetas, 17 euros. Eliminando paso a paso, empanada = 7, jugo = 5 y croqueta = 6 euros. A la derecha, dónde aparecen hoy los sistemas lineales, con los tamaños típicos: circuitos eléctricos, de decenas a millones de incógnitas; estructuras de puentes y edificios, millones; juegos 3D y animación, miles por fotograma; pronóstico del tiempo, miles de millones; inteligencia artificial, miles de millones de números por segundo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistemas lineales en la vida cotidiana</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Del granero chino a tu celular</text><rect x="30" y="100" width="450" height="410" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="255" y="130" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700">En el bar</text><text x="255" y="170" font-size="16" fill="#2B1B3D" text-anchor="middle">empanada + jugo + croqueta = € 18</text><text x="255" y="200" font-size="16" fill="#2B1B3D" text-anchor="middle">2 empanadas + croqueta = € 20</text><text x="255" y="230" font-size="16" fill="#2B1B3D" text-anchor="middle">jugo + 2 croquetas = € 17</text><line x1="60" y1="262" x2="450" y2="262" stroke="#F1E2CF" stroke-width="2"/><text x="255" y="292" font-size="15" fill="#2B1B3D" text-anchor="middle">de la 2.ª: croqueta = 20 − 2·emp.</text><text x="255" y="318" font-size="15" fill="#2B1B3D" text-anchor="middle">en la 3.ª: jugo = 4·emp. − 23</text><text x="255" y="344" font-size="15" fill="#2B1B3D" text-anchor="middle">en la 1.ª: 3·emp. − 3 = 18</text><text x="255" y="370" font-size="15" fill="#2B1B3D" text-anchor="middle">empanada = 7, y el resto sigue</text><rect x="60" y="410" width="390" height="80" rx="10" fill="#E2F6F2"/><text x="255" y="442" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">empanada = € 7 · jugo = € 5 · croqueta = € 6</text><text x="255" y="470" font-size="14" fill="#2B1B3D" text-anchor="middle">verificación: 7 + 5 + 6 = 18 ✓</text><rect x="510" y="100" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><rect x="510" y="100" width="14" height="70" rx="6" fill="#3A86FF"/><text x="545" y="130" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Circuitos eléctricos</text><text x="545" y="154" font-size="14" fill="#756986" text-anchor="start">de decenas a millones de incógnitas</text><rect x="510" y="184" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><rect x="510" y="184" width="14" height="70" rx="6" fill="#2A9D8F"/><text x="545" y="214" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Puentes y edificios</text><text x="545" y="238" font-size="14" fill="#756986" text-anchor="start">millones de incógnitas</text><rect x="510" y="268" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="510" y="268" width="14" height="70" rx="6" fill="#FFB703"/><text x="545" y="298" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Juegos 3D y animación</text><text x="545" y="322" font-size="14" fill="#756986" text-anchor="start">miles en cada fotograma</text><rect x="510" y="352" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="510" y="352" width="14" height="70" rx="6" fill="#FF6B6B"/><text x="545" y="382" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Pronóstico del tiempo</text><text x="545" y="406" font-size="14" fill="#756986" text-anchor="start">miles de millones de incógnitas</text><rect x="510" y="436" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="510" y="436" width="14" height="70" rx="6" fill="#5B2A86"/><text x="545" y="466" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Inteligencia artificial</text><text x="545" y="490" font-size="14" fill="#756986" text-anchor="start">miles de millones de números por segundo</text>
</svg>
