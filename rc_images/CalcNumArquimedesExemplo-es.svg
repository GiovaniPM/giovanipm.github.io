<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">El asedio a π, lado tras lado</title>
<desc id="d">Gráfico con cinco franjas verticales, una por número de lados: 6, 12, 24, 48 y 96. Cada franja va del perímetro del polígono interior al del exterior, y una línea discontinua marca pi, 3,14159. Las franjas se estrechan: de 3,000 a 3,464 con 6 lados; de 3,106 a 3,215 con 12; de 3,133 a 3,160 con 24; de 3,139 a 3,146 con 48; de 3,1410 a 3,1427 con 96. Arquímedes redondeó del lado seguro: 3 y 10/71, 3,1408, menor que pi, menor que 3 y 1/7, 3,1429.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">El asedio a π, lado tras lado</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cada duplicación de los lados estrecha el intervalo unas 4 veces</text><line x1="90" y1="110" x2="90" y2="440" stroke="#2B1B3D" stroke-width="2"/><line x1="90" y1="440" x2="640" y2="440" stroke="#2B1B3D" stroke-width="2"/><line x1="84" y1="410" x2="640" y2="410" stroke="#F1E2CF" stroke-width="1"/><text x="78" y="415" font-size="12" fill="#756986" text-anchor="end">3,0</text><line x1="84" y1="350" x2="640" y2="350" stroke="#F1E2CF" stroke-width="1"/><text x="78" y="355" font-size="12" fill="#756986" text-anchor="end">3,1</text><line x1="84" y1="290" x2="640" y2="290" stroke="#F1E2CF" stroke-width="1"/><text x="78" y="295" font-size="12" fill="#756986" text-anchor="end">3,2</text><line x1="84" y1="230" x2="640" y2="230" stroke="#F1E2CF" stroke-width="1"/><text x="78" y="235" font-size="12" fill="#756986" text-anchor="end">3,3</text><line x1="84" y1="170" x2="640" y2="170" stroke="#F1E2CF" stroke-width="1"/><text x="78" y="175" font-size="12" fill="#756986" text-anchor="end">3,4</text><line x1="84" y1="110" x2="640" y2="110" stroke="#F1E2CF" stroke-width="1"/><text x="78" y="115" font-size="12" fill="#756986" text-anchor="end">3,5</text><line x1="90" y1="325.044" x2="640" y2="325.044" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="6 5"/><text x="646" y="330.044" font-size="18" fill="#FF6B6B" text-anchor="start" font-weight="700">π</text><rect x="132" y="131.54" width="36" height="278.46" rx="6" fill="#5B2A86"/><text x="150" y="462" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">6</text><rect x="237" y="280.766" width="36" height="65.736" rx="6" fill="#3A86FF"/><text x="255" y="462" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">12</text><rect x="342" y="314.204" width="36" height="16.218" rx="6" fill="#2A9D8F"/><text x="360" y="462" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">24</text><rect x="447" y="322.346" width="36" height="4.044" rx="6" fill="#FFB703"/><text x="465" y="462" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">48</text><rect x="552" y="324.374" width="36" height="3" rx="6" fill="#EF476F"/><text x="570" y="462" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">96</text><text x="365" y="490" font-size="14" fill="#756986" text-anchor="middle">número de lados</text><rect x="680" y="100" width="290" height="300" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="825" y="128" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">lados · dentro · fuera</text><text x="825" y="164" font-size="15" fill="#2B1B3D" text-anchor="middle">6 · 3,0000 · 3,4641</text><text x="825" y="194" font-size="15" fill="#2B1B3D" text-anchor="middle">12 · 3,1058 · 3,2154</text><text x="825" y="224" font-size="15" fill="#2B1B3D" text-anchor="middle">24 · 3,1326 · 3,1597</text><text x="825" y="254" font-size="15" fill="#2B1B3D" text-anchor="middle">48 · 3,1393 · 3,1461</text><text x="825" y="284" font-size="15" fill="#2B1B3D" text-anchor="middle">96 · 3,1410 · 3,1427</text><line x1="700" y1="312" x2="950" y2="312" stroke="#F1E2CF" stroke-width="2"/><text x="825" y="340" font-size="14" fill="#2B1B3D" text-anchor="middle">Arquímedes (redondeando</text><text x="825" y="362" font-size="14" fill="#2B1B3D" text-anchor="middle">del lado seguro):</text><text x="825" y="388" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">3 10/71 &lt; π &lt; 3 1/7</text><rect x="680" y="420" width="290" height="76" rx="10" fill="#FFF1C9"/><text x="825" y="450" font-size="15" fill="#2B1B3D" text-anchor="middle">3,1408 &lt; π &lt; 3,1429</text><text x="825" y="474" font-size="15" fill="#2B1B3D" text-anchor="middle">ya da π ≈ 3,14</text>
</svg>
