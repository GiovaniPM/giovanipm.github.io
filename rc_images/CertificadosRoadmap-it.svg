<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Roadmap dell’IT fino al 2030</title>
<desc id="d">Linea del tempo con tre fasi proiettate. Adozione, dal 2026 al 2027: agenti di IA nel lavoro quotidiano di sviluppo, supporto e operazioni, e selezione con prove pratiche e uso dell’IA consentito. Riorganizzazione, dal 2028 al 2029: team IT più piccoli e multidisciplinari, ed esami a scelta multipla sostituiti da laboratori e simulazioni. Fusione con il business, dal 2030 in poi: meno distanza tra chi chiede e chi costruisce, e credenziali che diventano portfolio verificabili e storici di consegne. Sotto, la stima del World Economic Forum fino al 2030: 170 milioni di posti creati, 92 milioni spostati, un saldo di 78 milioni.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Roadmap: tre fasi fino al 2030</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Una lettura possibile, a titolo di proiezione</text>

<line x1="70" y1="160" x2="935" y2="160" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<text x="190" y="130" font-size="16" fill="#FFB703" text-anchor="middle" font-weight="700">2026–2027</text>
<text x="500" y="130" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">2028–2029</text>
<text x="810" y="130" font-size="16" fill="#5B2A86" text-anchor="middle" font-weight="700">dal 2030 in poi</text>
<circle cx="190" cy="160" r="12" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/>
<circle cx="500" cy="160" r="12" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/>
<circle cx="810" cy="160" r="12" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<g stroke-width="2" stroke-dasharray="4 4">
<line x1="190" y1="172" x2="190" y2="196" stroke="#FFB703"/>
<line x1="500" y1="172" x2="500" y2="196" stroke="#3A86FF"/>
<line x1="810" y1="172" x2="810" y2="196" stroke="#5B2A86"/>
</g>

<rect x="50" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="190" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Adozione</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="72" cy="265" r="4" fill="#FFB703"/><text x="84" y="270">Agenti di IA nel lavoro</text><text x="84" y="289">quotidiano di sviluppo,</text><text x="84" y="308">supporto e operazioni</text>
<circle cx="72" cy="336" r="4" fill="#FFB703"/><text x="84" y="341">Selezione con prove pratiche,</text><text x="84" y="360">con uso dell’IA consentito</text>
</g>

<rect x="360" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="500" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Riorganizzazione</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="382" cy="265" r="4" fill="#3A86FF"/><text x="394" y="270">Team IT più piccoli e più</text><text x="394" y="289">multidisciplinari</text>
<circle cx="382" cy="317" r="4" fill="#3A86FF"/><text x="394" y="322">La scelta multipla lascia il</text><text x="394" y="341">posto a laboratori e simulazioni</text>
</g>

<rect x="670" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<text x="810" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Fusione con il business</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="692" cy="265" r="4" fill="#5B2A86"/><text x="704" y="270">Meno distanza tra chi</text><text x="704" y="289">chiede e chi costruisce</text>
<circle cx="692" cy="317" r="4" fill="#5B2A86"/><text x="704" y="322">Le credenziali diventano</text><text x="704" y="341">portfolio verificabili e</text><text x="704" y="360">storici di consegne</text>
</g>

<text x="500" y="424" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Posti di lavoro entro il 2030 · trasformazione, non estinzione</text>
<rect x="50" y="440" width="280" height="54" rx="12" fill="#2A9D8F"/>
<text x="190" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">+170 mln</tspan> creati</text>
<rect x="360" y="440" width="280" height="54" rx="12" fill="#E23B3B"/>
<text x="500" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">−92 mln</tspan> spostati</text>
<rect x="670" y="440" width="280" height="54" rx="12" fill="#2B1B3D"/>
<text x="810" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">+78 mln</tspan> di saldo</text>
<text x="950" y="510" font-size="11" fill="#756986" text-anchor="end" font-style="italic">Fonte: World Economic Forum, Future of Jobs Report 2025</text>
</svg>
