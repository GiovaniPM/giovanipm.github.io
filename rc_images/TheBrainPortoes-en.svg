<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The gates of a thought</title>
<desc id="d">A thought called Bolts with four small circles, the gates. The top one creates a parent; the bottom one creates a child; the side ones create jumps. Siblings have no gate: they appear when two thoughts share a parent.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="390" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">The gates of a thought</text>
<text x="500.0" y="72" font-size="15" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Click a gate to create a linked thought; drag it onto another thought to link the two</text>
<rect x="400.0" y="180.0" width="200" height="60" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="3"/>
<text x="500" y="217.0" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Bolts</text>
<circle cx="500" cy="180" r="9" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/>
<circle cx="500" cy="240" r="9" fill="#FFFFFF" stroke="#0E8074" stroke-width="3"/>
<circle cx="400" cy="210" r="9" fill="#FFFFFF" stroke="#D62828" stroke-width="3"/>
<circle cx="600" cy="210" r="9" fill="#FFFFFF" stroke="#D62828" stroke-width="3"/>
<text x="500" y="112" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">Parent gate</text>
<text x="500" y="131" font-size="13" fill="#3E3350" text-anchor="middle" xml:space="preserve">creates a thought above</text>
<path d="M500 140 L500 166" fill="none" stroke="#5B2A86" stroke-width="2" stroke-linejoin="round" marker-end="url(#ap)"/>
<text x="500" y="295" font-size="15" fill="#0E8074" text-anchor="middle" font-weight="700" xml:space="preserve">Child gate</text>
<text x="500" y="314" font-size="13" fill="#3E3350" text-anchor="middle" xml:space="preserve">creates a thought below</text>
<path d="M500 280 L500 254" fill="none" stroke="#0E8074" stroke-width="2" stroke-linejoin="round" marker-end="url(#at)"/>
<text x="215" y="205" font-size="15" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">Jump gate</text>
<text x="215" y="224" font-size="13" fill="#3E3350" text-anchor="middle" xml:space="preserve">creates a thought beside</text>
<path d="M320 210 L386 210" fill="none" stroke="#D62828" stroke-width="2" stroke-linejoin="round" marker-end="url(#ac)"/>
<text x="785" y="205" font-size="15" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">Jump gate</text>
<text x="785" y="224" font-size="13" fill="#3E3350" text-anchor="middle" xml:space="preserve">creates a thought beside</text>
<path d="M680 210 L614 210" fill="none" stroke="#D62828" stroke-width="2" stroke-linejoin="round" marker-end="url(#ac)"/>
<text x="500" y="362" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Siblings have no gate: they appear on their own when two thoughts share a parent.</text>
</svg>
