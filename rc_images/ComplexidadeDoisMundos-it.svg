<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Due futuri possibili</title>
<desc id="d">Due pannelli. Se P è uguale a NP, risolvere sarebbe facile quanto verificare: farmaci e materiali sarebbero progettati in fretta e i computer troverebbero dimostrazioni matematiche, ma la crittografia di oggi sarebbe vulnerabile e la creatività perderebbe il suo salto. Se P è diverso da NP, esistono problemi intrinsecamente difficili: password e banche restano protette, sappiamo dove sono i limiti, e i problemi difficili chiedono scorciatoie come approssimazioni ed euristiche. Sotto, il sondaggio del 2019 con 124 risposte: circa l’80% pensa che P sia diverso da NP; tra chi ha studiato di più il problema, il 99%; e il 66% pensa che sarà risolto prima del 2100.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="505" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Due futuri possibili</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cosa cambia se la risposta è sì, e cosa cambia se è no</text>
<rect x="50" y="96" width="420" height="250" rx="14" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<path d="M50 110 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v36 h-420 z" fill="#FFB703"/>
<text x="260" y="120" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Se P = NP</text>
<text x="260" y="139" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-style="italic">risolvere sarebbe facile quanto verificare</text>
<circle cx="82" cy="179" r="12" fill="#2A9D8F"/><text x="82" y="184" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="106" y="184" font-size="14.5" fill="#2B1B3D">Farmaci e materiali progettati in fretta</text>
<circle cx="82" cy="217" r="12" fill="#2A9D8F"/><text x="82" y="222" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="106" y="222" font-size="14.5" fill="#2B1B3D">I computer troverebbero dimostrazioni</text>
<circle cx="82" cy="255" r="12" fill="#E23B3B"/><text x="82" y="260" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">−</text>
<text x="106" y="260" font-size="14.5" fill="#2B1B3D">La crittografia di oggi sarebbe vulnerabile</text>
<circle cx="82" cy="293" r="12" fill="#5B2A86"/><text x="82" y="298" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="106" y="298" font-size="14.5" fill="#2B1B3D">La creatività perderebbe il suo “salto”</text>
<rect x="530" y="96" width="420" height="250" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M530 110 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v36 h-420 z" fill="#2A9D8F"/>
<text x="740" y="120" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Se P ≠ NP</text>
<text x="740" y="139" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">esistono problemi intrinsecamente difficili</text>
<circle cx="562" cy="179" r="12" fill="#2A9D8F"/><text x="562" y="184" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="586" y="184" font-size="14.5" fill="#2B1B3D">Password e banche restano protette</text>
<circle cx="562" cy="217" r="12" fill="#2A9D8F"/><text x="562" y="222" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="586" y="222" font-size="14.5" fill="#2B1B3D">Sappiamo dove sono i limiti</text>
<circle cx="562" cy="255" r="12" fill="#3A86FF"/><text x="562" y="260" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">•</text>
<text x="586" y="260" font-size="14.5" fill="#2B1B3D">I problemi difficili chiedono scorciatoie:</text>
<text x="586" y="298" font-size="14.5" fill="#2B1B3D">approssimazioni ed euristiche</text>
<text x="500" y="390" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cosa dicono gli esperti (sondaggio del 2019, 124 risposte)</text>
<rect x="100" y="406" width="640" height="40" rx="8" fill="#2A9D8F"/><rect x="740" y="406" width="160" height="40" rx="8" fill="#D9C9B4"/><text x="420" y="432" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">P ≠ NP: circa l’80%</text>
<text x="820" y="432" font-size="13" fill="#2B1B3D" text-anchor="middle">altre risposte</text>
<text x="500" y="478" font-size="13.5" fill="#756986" text-anchor="middle" font-style="italic">Tra chi ha studiato di più il problema, il 99% punta su P ≠ NP. E il 66% pensa che sarà risolto prima del 2100.</text>
</svg>
