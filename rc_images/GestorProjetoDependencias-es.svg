<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
<title id="t">Los tres tipos de dependencia del Gestor de proyecto</title>
<desc id="d">Tres ejemplos. Fin a Inicio, TI o FS: la sucesora solo empieza después de que la predecesora termina. Inicio a Inicio, II o SS: la sucesora solo empieza después de que la predecesora empieza; con un desfase de 3 días, empieza 3 días después. Fin a Fin, TT o FF: la sucesora solo termina después de que la predecesora termina. El desfase en días empuja la regla hacia adelante; un valor negativo la adelanta.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="30" y="52" font-size="18" font-weight="bold" text-anchor="start" fill="#2B1B3D">Fin → Inicio (FS / TI)</text><text x="30" y="74" font-size="14" font-weight="normal" text-anchor="start" fill="#756986">solo empieza después de que la predecesora termina</text><rect x="830" y="36" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#F1E2CF"/><text x="900" y="57" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E8074">2FS</text><rect x="60" y="94" width="300" height="28" rx="6" fill="#2f9e44"/><text x="72" y="113" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Predecesora #2</text><rect x="400" y="138" width="260" height="28" rx="6" fill="#4dabf7"/><text x="412" y="157" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Sucesora</text><path d="M360 108 H380 V152 H398" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><text x="30" y="202" font-size="18" font-weight="bold" text-anchor="start" fill="#2B1B3D">Inicio → Inicio (SS / II)</text><text x="30" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#756986">solo empieza después de que la predecesora empieza (+3 días)</text><rect x="830" y="186" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#F1E2CF"/><text x="900" y="207" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E8074">2SS+3</text><rect x="60" y="244" width="300" height="28" rx="6" fill="#2f9e44"/><text x="72" y="263" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Predecesora #2</text><rect x="150" y="288" width="300" height="28" rx="6" fill="#4dabf7"/><text x="162" y="307" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Sucesora</text><path d="M60 272 V280 H148 V287" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><text x="104" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#C2185B">+3 días</text><text x="30" y="352" font-size="18" font-weight="bold" text-anchor="start" fill="#2B1B3D">Fin → Fin (FF / TT)</text><text x="30" y="374" font-size="14" font-weight="normal" text-anchor="start" fill="#756986">solo termina después de que la predecesora termina</text><rect x="830" y="336" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#F1E2CF"/><text x="900" y="357" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E8074">2FF</text><rect x="60" y="394" width="300" height="28" rx="6" fill="#2f9e44"/><text x="72" y="413" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Predecesora #2</text><rect x="200" y="438" width="200" height="28" rx="6" fill="#4dabf7"/><text x="212" y="457" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Sucesora</text><path d="M360 422 V430 H400 V437" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="478" width="960" height="40" rx="10" fill="#FFF1C9"/><text x="500" y="504" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Al importar: número de fila + tipo + desfase, p. ej.: 2FS+1 · 4SS · 5FF-1 (el app también acepta TI, II, TT)</text>
</g></svg>
