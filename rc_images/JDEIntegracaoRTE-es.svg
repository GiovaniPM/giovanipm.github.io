<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Flujo de los Real-Time Events</title>
<desc id="d">Una transacción en JDE, como un pedido de venta en el P4210, hace que la business function genere un evento XML, por ejemplo RTSOOUT. Los kernels de eventos del Enterprise Server, con la tabla F90710, pasan el evento al Transaction Server, sobre WebLogic con colas JMS y entrega garantizada por suscriptor, que lo distribuye a una cola JMS o MQ, al Orchestrator como notificación o a un web service mediante BSSV. Los tipos de evento son Z events, real-time events y XAPI. La configuración activa el evento en el P90701A, registra suscriptores y transportes en el P90702A, define los kernels en el jde.ini e instala el Transaction Server con el Server Manager.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
