<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">5W3H: as oito perguntas do plano</title>
<desc id="d">Oito cartões em dois grupos. 5W: What, o que vai ser feito; Why, por que precisa ser feito; Who, quem vai fazer; Where, onde vai acontecer; When, quando começa e termina. 3H: How, como vai ser feito; How much, quanto vai custar; How to measure, como saber que deu certo. Nota: o terceiro H varia entre as fontes; algumas usam How many, quantos.</desc>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="30" y="44" font-size="24" font-weight="700" fill="#2B1B3D">5W3H: as oito perguntas do plano</text>
<text x="30" y="84" font-size="16" font-weight="700" fill="#0E8074">5W · o plano em si</text>
<rect x="30.0" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="30.0" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="44.0" y="128" font-size="12" fill="#756986">pergunta 1</text>
<text x="44.0" y="154" font-size="21" font-weight="700" fill="#0E8074">What</text>
<text x="44.0" y="180" font-size="15" fill="#2B1B3D">O que vai ser feito?</text>
<rect x="220.4" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="220.4" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="234.4" y="128" font-size="12" fill="#756986">pergunta 2</text>
<text x="234.4" y="154" font-size="21" font-weight="700" fill="#0E8074">Why</text>
<text x="234.4" y="180" font-size="15" fill="#2B1B3D">Por que isso precisa</text>
<text x="234.4" y="199" font-size="15" fill="#2B1B3D">ser feito?</text>
<rect x="410.8" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="410.8" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="424.8" y="128" font-size="12" fill="#756986">pergunta 3</text>
<text x="424.8" y="154" font-size="21" font-weight="700" fill="#0E8074">Who</text>
<text x="424.8" y="180" font-size="15" fill="#2B1B3D">Quem vai fazer?</text>
<rect x="601.2" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="601.2" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="615.2" y="128" font-size="12" fill="#756986">pergunta 4</text>
<text x="615.2" y="154" font-size="21" font-weight="700" fill="#0E8074">Where</text>
<text x="615.2" y="180" font-size="15" fill="#2B1B3D">Onde vai acontecer?</text>
<rect x="791.6" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="791.6" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="805.6" y="128" font-size="12" fill="#756986">pergunta 5</text>
<text x="805.6" y="154" font-size="21" font-weight="700" fill="#0E8074">When</text>
<text x="805.6" y="180" font-size="15" fill="#2B1B3D">Quando vai começar e</text>
<text x="805.6" y="199" font-size="15" fill="#2B1B3D">terminar?</text>
<text x="30" y="258" font-size="16" font-weight="700" fill="#5B2A86">3H · execução, custo e medida</text>
<rect x="30.0" y="270" width="305.3" height="128" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<rect x="30.0" y="270" width="305.3" height="8" rx="4" fill="#5B2A86"/>
<text x="44.0" y="302" font-size="12" fill="#756986">pergunta 6</text>
<text x="44.0" y="328" font-size="21" font-weight="700" fill="#5B2A86">How</text>
<text x="44.0" y="354" font-size="15" fill="#2B1B3D">Como vai ser feito?</text>
<rect x="347.3333333333333" y="270" width="305.3" height="128" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<rect x="347.3333333333333" y="270" width="305.3" height="8" rx="4" fill="#5B2A86"/>
<text x="361.3333333333333" y="302" font-size="12" fill="#756986">pergunta 7</text>
<text x="361.3333333333333" y="328" font-size="21" font-weight="700" fill="#5B2A86">How much</text>
<text x="361.3333333333333" y="354" font-size="15" fill="#2B1B3D">Quanto vai custar?</text>
<rect x="664.6666666666666" y="270" width="305.3" height="128" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<rect x="664.6666666666666" y="270" width="305.3" height="8" rx="4" fill="#5B2A86"/>
<text x="678.6666666666666" y="302" font-size="12" fill="#756986">pergunta 8</text>
<text x="678.6666666666666" y="328" font-size="21" font-weight="700" fill="#5B2A86">How to measure</text>
<text x="678.6666666666666" y="354" font-size="15" fill="#2B1B3D">Como você vai saber que deu certo?</text>
<text x="30" y="440" font-size="14" fill="#756986">O terceiro H varia entre as fontes: algumas usam How many (quantos). Neste app ele é How to measure (como medir).</text>
</svg>
