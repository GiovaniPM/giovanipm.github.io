<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The seven Millennium Prize Problems</title>
<desc id="d">Seven cards with the Clay Mathematics Institute’s Millennium Prize Problems, from 2000, each carrying a 1 million dollar prize. Open: the Riemann hypothesis, on the distribution of primes; P versus NP, whether checking an answer is as easy as finding it; Navier–Stokes, on the fluid equations; Yang–Mills and the mass gap, the mathematical basis of particle physics; the Hodge conjecture; and Birch and Swinnerton-Dyer, on elliptic curves. Solved: the Poincaré conjecture, by Perelman in 2003, who declined the prize in 2010.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">The seven Millennium Prize Problems</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Clay Mathematics Institute, 2000 · US$1 million per problem</text>
<rect x="76" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="176" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Riemann hypothesis</text>
<text x="176" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">How the prime numbers</text>
<text x="176" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">are distributed</text>
<rect x="151.6" y="224" width="48.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="176" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Open</text>
<rect x="292" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="392" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">P versus NP</text>
<text x="392" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Is checking an answer as</text>
<text x="392" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">easy as finding it?</text>
<rect x="367.6" y="224" width="48.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="392" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Open</text>
<rect x="508" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="608" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Navier–Stokes</text>
<text x="608" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Do the fluid equations</text>
<text x="608" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">always have smooth solutions?</text>
<rect x="583.6" y="224" width="48.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="608" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Open</text>
<rect x="724" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="824" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Yang–Mills and</text>
<text x="824" y="149" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">the mass gap</text>
<text x="824" y="176" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">The mathematical basis</text>
<text x="824" y="193" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">of particle physics</text>
<rect x="799.6" y="224" width="48.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="824" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Open</text>
<rect x="184" y="276" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="284" y="306" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Hodge conjecture</text>
<text x="284" y="333" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Geometric shapes</text>
<text x="284" y="350" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">described by algebra</text>
<rect x="259.6" y="400" width="48.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="284" y="416" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Open</text>
<rect x="400" y="276" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="500" y="306" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Birch and</text>
<text x="500" y="325" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Swinnerton-Dyer</text>
<text x="500" y="352" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Rational solutions of</text>
<text x="500" y="369" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">elliptic curves</text>
<rect x="475.6" y="400" width="48.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="500" y="416" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Open</text>
<rect x="616" y="276" width="200" height="158" rx="12" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="716" y="306" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Poincaré conjecture</text>
<text x="716" y="333" font-size="12.5" fill="#E6F5F2" text-anchor="middle" font-style="italic">Characterizes the sphere</text>
<text x="716" y="350" font-size="12.5" fill="#E6F5F2" text-anchor="middle" font-style="italic">in three dimensions</text>
<text x="716" y="373" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Perelman, 2003</text>
<rect x="684.4" y="400" width="63.2" height="22" rx="11" fill="#FFFFFF"/>
<text x="716" y="416" font-size="12" fill="#2A9D8F" text-anchor="middle" font-weight="700">Solved</text>
<text x="500" y="478" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">6 of 7 remain open. Perelman declined the prize in 2010.</text>
</svg>
