<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ciclo de status de uma linha de pedido de compra</title>
<desc id="d">Exemplo de regras de atividade de um pedido OP: 220 entrada do pedido, 230 aprovação, 280 impressão e envio ao fornecedor, 400 recebimento, 999 encerrado. Uma linha também pode ir para 980, cancelada. Cada linha da F4311 guarda o último status (LTTR) e o próximo status (NXTR); a quantidade pedida é UORG, a recebida é UREC e o valor em aberto é AOPN. Os códigos variam conforme as regras de atividade configuradas na P40204.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="42.0" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Status de uma linha de pedido de compra</text>
<text x="500.0" y="68.0" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Cada linha da F4311 tem um último status (LTTR) e um próximo status (NXTR)</text>
<rect x="40" y="110" width="150" height="110" rx="14" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2.2"/>
<text x="115.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">220</text>
<text x="115.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Entrada</text>
<text x="115.0" y="199.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">do pedido</text>
<polyline points="190,165 228,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="230" y="110" width="150" height="110" rx="14" fill="#FFF1C9" stroke="#B35300" stroke-width="2.2"/>
<text x="305.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">230</text>
<text x="305.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Aprovação</text>
<polyline points="380,165 418,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="110" width="150" height="110" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.2"/>
<text x="495.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">280</text>
<text x="495.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Impressão /</text>
<text x="495.0" y="199.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">envio</text>
<polyline points="570,165 608,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="610" y="110" width="150" height="110" rx="14" fill="#E2F6F2" stroke="#0E8074" stroke-width="2.2"/>
<text x="685.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">400</text>
<text x="685.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Recebimento</text>
<polyline points="760,165 798,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="800" y="110" width="150" height="110" rx="14" fill="#E2F6F2" stroke="#0E8074" stroke-width="2.2"/>
<text x="875.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">999</text>
<text x="875.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Encerrado</text>
<rect x="420" y="262" width="150" height="70" rx="14" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2.2"/>
<text x="495.0" y="294.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">980</text>
<text x="495.0" y="318.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Cancelado</text>
<polyline points="115,220 115,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="305,220 305,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="495,220 495,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="685,220 685,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="495,240 495,260" fill="none" stroke="#E23B3B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ae)"/>
<rect x="40" y="360" width="440" height="130" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="260.0" y="393.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Campos úteis na F4311</text>
<text x="260.0" y="411.5" font-size="12.5" fill="#3E3350" text-anchor="middle">DOCO / DCTO / KCOO: número, tipo e companhia</text>
<text x="260.0" y="430.0" font-size="12.5" fill="#3E3350" text-anchor="middle">LNID: linha   ·   LITM: item</text>
<text x="260.0" y="448.5" font-size="12.5" fill="#3E3350" text-anchor="middle">UORG: qtde pedida   ·   UREC: qtde recebida</text>
<text x="260.0" y="467.0" font-size="12.5" fill="#3E3350" text-anchor="middle">AOPN: valor em aberto</text>
<rect x="510" y="360" width="450" height="62" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="735.0" y="377.5" font-size="13" fill="#3E3350" text-anchor="middle">Exemplo de resposta:  LTTR = 280, NXTR = 400</text>
<text x="735.0" y="396.0" font-size="13" fill="#3E3350" text-anchor="middle">→ pedido enviado, aguardando recebimento</text>
<rect x="510" y="430" width="450" height="60" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="735.0" y="446.5" font-size="12.5" fill="#3E3350" text-anchor="middle">Códigos ilustrativos: confira as regras de atividade (P40204)</text>
<text x="735.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">do tipo de pedido e de linha do seu ambiente.</text>
</svg>
