<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">O que o piloto automático faz</title>
<desc id="d">Seis etapas em sequência vertical: corrigir a rota de aproximação, aguardar o ponto de frenagem, frear para a captura, aerofrenagem opcional em linha tracejada, ajustar nos extremos da órbita e, por fim, desligar os motores na faixa-alvo. À direita, três cartões: a regra de segurança que sobe a periapse quando ela fica perigosa, a forma de retomar o controle e o aviso de que o resultado não conta como recorde.</desc>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="590" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">O que o piloto automático faz</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Ele repete, sozinho, a mesma estratégia que você aprende a usar</text>
<rect x="40.0" y="98.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2"/>
<circle cx="72.0" cy="129.0" r="16.0" fill="#3A86FF"/>
<text x="72.0" y="135.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="100.0" y="123.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Corrigir a rota de aproximação</text>
<text x="100.0" y="145.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Ainda longe, queima de lado até a periapse prevista cair na faixa.</text>
<line x1="335.0" y1="161.0" x2="335.0" y2="175.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="178.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="72.0" cy="209.0" r="16.0" fill="#5B2A86"/>
<text x="72.0" y="215.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="100.0" y="203.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Aguardar o ponto de frenagem</text>
<text x="100.0" y="225.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Calcula quando começar a frear para centrar a queima na periapse.</text>
<line x1="335.0" y1="241.0" x2="335.0" y2="255.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="258.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#D62828" stroke-width="2"/>
<circle cx="72.0" cy="289.0" r="16.0" fill="#D62828"/>
<text x="72.0" y="295.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<text x="100.0" y="283.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Frear para a captura</text>
<text x="100.0" y="305.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Freia contra o movimento, segurando a periapse, até a apoapse descer.</text>
<line x1="335.0" y1="321.0" x2="335.0" y2="335.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="338.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="72.0" cy="369.0" r="16.0" fill="#FF6B6B"/>
<text x="72.0" y="375.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<text x="100.0" y="363.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Aerofrenagem (só às vezes)</text>
<text x="100.0" y="385.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Com escudo e pouco Δv, passa pelo ar a 55% da altura da atmosfera.</text>
<line x1="335.0" y1="401.0" x2="335.0" y2="415.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="418.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<circle cx="72.0" cy="449.0" r="16.0" fill="#B35300"/>
<text x="72.0" y="455.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<text x="100.0" y="443.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Ajustar nos extremos</text>
<text x="100.0" y="465.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Na periapse corrige a apoapse; na apoapse corrige a periapse.</text>
<line x1="335.0" y1="481.0" x2="335.0" y2="495.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="498.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<circle cx="72.0" cy="529.0" r="16.0" fill="#0E8074"/>
<text x="72.0" y="535.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">6</text>
<text x="100.0" y="523.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Motores desligados</text>
<text x="100.0" y="545.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Com Pe e Ap na faixa, espera a missão ser concluída.</text>
<rect x="670.0" y="98.0" width="290.0" height="140.0" rx="12" fill="#FFF1C9" stroke="#FFB703" stroke-width="2"/>
<text x="690.0" y="132.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Segurança primeiro</text>
<text x="690.0" y="164.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Se a periapse ficar perigosa,</text>
<text x="690.0" y="185.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">ele a sobe antes de tudo.</text>
<rect x="670.0" y="258.0" width="290.0" height="140.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="690.0" y="292.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Você retoma quando quiser</text>
<text x="690.0" y="324.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Qualquer comando de motor</text>
<text x="690.0" y="345.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">devolve o controle a você.</text>
<rect x="670.0" y="418.0" width="290.0" height="140.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="690.0" y="452.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Sem recorde</text>
<text x="690.0" y="484.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Missões com o piloto não</text>
<text x="690.0" y="505.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">entram no seu melhor resultado.</text>
</svg>
