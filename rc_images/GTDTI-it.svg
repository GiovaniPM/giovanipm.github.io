<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il lavoro IT nel GTD</title>
<desc id="d">Tabella con otto tipi di lavoro IT e la lista del GTD in cui va ciascuno: allarme di produzione, falla subito, è un incidente; ticket assegnato a te, azione successiva nel contesto computer; pull request da rivedere, falla se richiede meno di due minuti, altrimenti diventa azione successiva; domanda nella chat del team, rispondi o trasformala in azione; dipendenza da un altro team, lista in attesa con una data per sollecitare; migrazione in più fasi, progetto con l’azione successiva definita; idea di refactoring, un giorno o forse, oppure il backlog; runbook e documentazione, riferimento.</desc>
