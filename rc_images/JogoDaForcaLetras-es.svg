<text x="52" y="379" font-size="18" font-weight="bold" text-anchor="middle">S</text><rect x="80" y="365" width="99.2" height="20" rx="4" fill="#0E8074"/><text x="187.2" y="380" font-size="15">4,0%</text><rect x="560" y="369" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="369" width="115.5" height="12" rx="6" fill="#5B2A86"/><text x="960" y="380" font-size="15" text-anchor="end">35%</text>
<text x="52" y="409" font-size="18" font-weight="bold" text-anchor="middle">M</text><rect x="80" y="395" width="81.9" height="20" rx="4" fill="#0E8074"/><text x="169.9" y="410" font-size="15">3,3%</text><rect x="560" y="399" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="399" width="99.0" height="12" rx="6" fill="#5B2A86"/><text x="960" y="410" font-size="15" text-anchor="end">30%</text>
