<text x="52" y="319" font-size="18" font-weight="bold" text-anchor="middle">L</text><rect x="80" y="305" width="111.7" height="20" rx="4" fill="#0E8074"/><text x="199.7" y="320" font-size="15">4,5%</text><rect x="560" y="309" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="309" width="125.4" height="12" rx="6" fill="#5B2A86"/><text x="960" y="320" font-size="15" text-anchor="end">38%</text>
