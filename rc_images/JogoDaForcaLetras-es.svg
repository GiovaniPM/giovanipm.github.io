<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" width="1000" height="442" role="img" aria-labelledby="t d">
<title id="t">Letras más frecuentes en las 3000 palabras en español</title>
<desc id="d">Porcentaje de cada letra en el total de letras de las 3000 palabras en español del juego, sin acentos (la Ñ cuenta aparte), y porcentaje de las palabras que tienen la letra al menos una vez: A 13,3% / 82%; I 11,5% / 75%; O 10,4% / 74%; E 8,5% / 62%; N 7,8% / 61%; R 7,8% / 61%; C 7,1% / 54%; T 5,3% / 46%; L 4,5% / 38%; D 4,2% / 33%; S 4,0% / 35%; M 3,3% / 30%.</desc>
<rect width="1000" height="442" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="40" y="44" font-size="14" fill="#756986">letra</text><text x="470" y="44" font-size="14" fill="#756986" text-anchor="end">de las letras</text><text x="960" y="44" font-size="14" fill="#756986" text-anchor="end">de las palabras la tienen</text>
<text x="52" y="79" font-size="18" font-weight="bold" text-anchor="middle">A</text><rect x="80" y="65" width="330.0" height="20" rx="4" fill="#0E8074"/><text x="418.0" y="80" font-size="15">13,3%</text><rect x="560" y="69" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="69" width="270.6" height="12" rx="6" fill="#5B2A86"/><text x="960" y="80" font-size="15" text-anchor="end">82%</text>
<text x="52" y="109" font-size="18" font-weight="bold" text-anchor="middle">I</text><rect x="80" y="95" width="285.3" height="20" rx="4" fill="#0E8074"/><text x="373.3" y="110" font-size="15">11,5%</text><rect x="560" y="99" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="99" width="247.5" height="12" rx="6" fill="#5B2A86"/><text x="960" y="110" font-size="15" text-anchor="end">75%</text>
<text x="52" y="139" font-size="18" font-weight="bold" text-anchor="middle">O</text><rect x="80" y="125" width="258.0" height="20" rx="4" fill="#0E8074"/><text x="346.0" y="140" font-size="15">10,4%</text><rect x="560" y="129" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="129" width="244.2" height="12" rx="6" fill="#5B2A86"/><text x="960" y="140" font-size="15" text-anchor="end">74%</text>
<text x="52" y="169" font-size="18" font-weight="bold" text-anchor="middle">E</text><rect x="80" y="155" width="210.9" height="20" rx="4" fill="#0E8074"/><text x="298.9" y="170" font-size="15">8,5%</text><rect x="560" y="159" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="159" width="204.6" height="12" rx="6" fill="#5B2A86"/><text x="960" y="170" font-size="15" text-anchor="end">62%</text>
<text x="52" y="199" font-size="18" font-weight="bold" text-anchor="middle">N</text><rect x="80" y="185" width="193.5" height="20" rx="4" fill="#0E8074"/><text x="281.5" y="200" font-size="15">7,8%</text><rect x="560" y="189" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="189" width="201.3" height="12" rx="6" fill="#5B2A86"/><text x="960" y="200" font-size="15" text-anchor="end">61%</text>
<text x="52" y="229" font-size="18" font-weight="bold" text-anchor="middle">R</text><rect x="80" y="215" width="193.5" height="20" rx="4" fill="#0E8074"/><text x="281.5" y="230" font-size="15">7,8%</text><rect x="560" y="219" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="219" width="201.3" height="12" rx="6" fill="#5B2A86"/><text x="960" y="230" font-size="15" text-anchor="end">61%</text>
<text x="52" y="259" font-size="18" font-weight="bold" text-anchor="middle">C</text><rect x="80" y="245" width="176.2" height="20" rx="4" fill="#0E8074"/><text x="264.2" y="260" font-size="15">7,1%</text><rect x="560" y="249" width="330" height="12" rx="6" fill="#F1E2CF"/><rect x="560" y="249" width="178.2" height="12" rx="6" fill="#5B2A86"/><text x="960" y="260" font-size="15" text-anchor="end">54%</text>
