<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">Disparos para hundir la flota clásica (simulación)</title>
<desc id="d">Gráfico de franjas con la cantidad de disparos que cada nivel del ordenador necesitó para hundir la flota clásica, en 5.000 partidas simuladas por barra. Con barcos sin tocarse, las medianas fueron: al azar 97, Recluta 71, Oficial 45 y Almirante 38. Con barcos que pueden tocarse: al azar 97, Recluta 67, Oficial 53 y Almirante 44. Las franjas van del percentil 10 al 90: al azar de 89 a 100; Almirante sin tocarse de 31 a 46.</desc>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="500.0" y="40.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#2B1B3D">Disparos para hundir la flota clásica (simulación)</text>
<line x1="291.2" y1="80" x2="291.2" y2="370" stroke="#F1E2CF"/>
<text x="291.2" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">20</text>
<line x1="373.5" y1="80" x2="373.5" y2="370" stroke="#F1E2CF"/>
<text x="373.5" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">30</text>
<line x1="455.9" y1="80" x2="455.9" y2="370" stroke="#F1E2CF"/>
<text x="455.9" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">40</text>
<line x1="538.2" y1="80" x2="538.2" y2="370" stroke="#F1E2CF"/>
<text x="538.2" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">50</text>
<line x1="620.6" y1="80" x2="620.6" y2="370" stroke="#F1E2CF"/>
<text x="620.6" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">60</text>
<line x1="702.9" y1="80" x2="702.9" y2="370" stroke="#F1E2CF"/>
<text x="702.9" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">70</text>
<line x1="785.3" y1="80" x2="785.3" y2="370" stroke="#F1E2CF"/>
<text x="785.3" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">80</text>
<line x1="867.6" y1="80" x2="867.6" y2="370" stroke="#F1E2CF"/>
<text x="867.6" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">90</text>
<line x1="950.0" y1="80" x2="950.0" y2="370" stroke="#F1E2CF"/>
<text x="950.0" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">100</text>
<text x="600.0" y="414.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#756986">disparos hasta hundir los 5 barcos (de 17 a 100)</text>
<text x="236.0" y="114.0" font-size="16" text-anchor="end" font-weight="bold" fill="#2B1B3D">Al azar</text>
<rect x="859.4" y="100" width="90.6" height="16" rx="8" fill="#0E8074" opacity=".28"/>
<circle cx="925.3" cy="108" r="8" fill="#0E8074"/>
