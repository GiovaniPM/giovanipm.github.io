<rect x="918.3" y="127" width="14" height="14" fill="#C2185B" transform="rotate(45 925.3 134)"/>
<text x="911.3" y="139.0" font-size="13" text-anchor="end" font-weight="bold" fill="#C2185B">97</text>
<text x="236.0" y="184.0" font-size="16" text-anchor="end" font-weight="bold" fill="#2B1B3D">Recluta</text>
