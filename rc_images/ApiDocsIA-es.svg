<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dónde entra la IA en el trabajo con API Docs</title>
<desc id="d">Seis pasos: reúnes código, llamadas cURL y textos; la IA bosqueja la especificación OpenAPI en JSON con los prompts 1 a 4; la app importa el archivo y lo revisas en modo edición; la app prueba en la API real; la IA revisa textos, lagunas y pruebas con los prompts 5 a 9, y tú ajustas en la app; por último, decides, guardas y publicas.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="400" rx="18" fill="#FFF7EC"/>
<rect x="40" y="50" width="280" height="110" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="180" y="90" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">1. Tú reúnes</text>
<text x="180" y="118" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">código, cURL, textos</text>
<rect x="360" y="50" width="280" height="110" rx="14" fill="#FCE4F0" stroke="#2B1B3D" stroke-width="3"/>
<text x="500" y="90" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">2. La IA bosqueja</text>
<text x="500" y="118" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">OpenAPI en JSON</text>
<text x="500" y="142" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="middle">prompts 1 a 4</text>
<rect x="680" y="50" width="280" height="110" rx="14" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="3"/>
<text x="820" y="90" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">3. La app importa</text>
<text x="820" y="118" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">importar y revisar</text>
<text x="820" y="142" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="middle">en modo edición</text>
<rect x="680" y="250" width="280" height="110" rx="14" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="3"/>
<text x="820" y="290" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">4. La app prueba</text>
<text x="820" y="318" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">probar petición</text>
<text x="820" y="342" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="middle">en la API real</text>
<rect x="360" y="250" width="280" height="110" rx="14" fill="#FCE4F0" stroke="#2B1B3D" stroke-width="3"/>
<text x="500" y="290" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">5. La IA revisa</text>
<text x="500" y="318" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">textos, lagunas y pruebas</text>
<text x="500" y="342" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="middle">prompts 5 a 9</text>
<rect x="40" y="250" width="280" height="110" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="180" y="290" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">6. Tú decides</text>
<text x="180" y="318" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">guardar y publicar</text>
<g stroke="#2B1B3D" stroke-width="3" fill="none"><path d="M324 105H356" marker-end="url(#a)"/><path d="M644 105H676" marker-end="url(#a)"/><path d="M820 164V246" marker-end="url(#a)"/><path d="M676 305H644" marker-end="url(#a)"/><path d="M356 305H324" marker-end="url(#a)"/></g>
<path d="M560 246C600 200 660 190 700 166" stroke="#C2185B" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#r)"/>
<text x="612" y="196" font-size="14" font-weight="700" fill="#C2185B" text-anchor="end">ajustar</text>
</svg>
