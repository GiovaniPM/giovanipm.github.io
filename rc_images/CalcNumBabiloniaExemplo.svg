<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">O método babilônico em ação</title>
<desc id="d">À esquerda, tabela para a raiz de 2 começando no chute 1. Passo 1: chute 1, 2 dividido por 1 é 2, média 1,5, nenhuma casa certa. Passo 2: chute 1,5, 2 dividido por 1,5 é 1,3333, média 1,41667, duas casas certas. Passo 3: chute 1,41667, divisão 1,41176, média 1,414216, cinco casas certas. Passo 4: média 1,41421356237, onze casas certas. As casas certas quase dobram a cada passo. À direita, o exemplo de Heron de Alexandria para a raiz de 720: chute 27, 720 dividido por 27 dá 26 e dois terços, a média é 26 e cinco sextos, 26,8333, contra o valor real 26,8328.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">O método babilônico em ação</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Calculando √2 e o √720 de Heron</text><rect x="30" y="100" width="590" height="50" rx="8" fill="#FFF1C9"/><text x="70" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">passo</text><text x="150" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">chute</text><text x="265" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">2 ÷ chute</text><text x="400" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">média</text><text x="540" y="131" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">casas certas</text><line x1="30" y1="212" x2="620" y2="212" stroke="#F1E2CF" stroke-width="1.5"/><text x="70" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">1</text><text x="150" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">1</text><text x="265" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">2</text><text x="400" y="190" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1,5</text><text x="540" y="190" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">0</text><line x1="30" y1="268" x2="620" y2="268" stroke="#F1E2CF" stroke-width="1.5"/><text x="70" y="246" font-size="15" fill="#2B1B3D" text-anchor="middle">2</text><text x="150" y="246" font-size="15" fill="#2B1B3D" text-anchor="middle">1,5</text><text x="265" y="246" font-size="15" fill="#2B1B3D" text-anchor="middle">1,3333</text><text x="400" y="246" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1,41667</text><text x="540" y="246" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">2</text><line x1="30" y1="324" x2="620" y2="324" stroke="#F1E2CF" stroke-width="1.5"/><text x="70" y="302" font-size="15" fill="#2B1B3D" text-anchor="middle">3</text><text x="150" y="302" font-size="15" fill="#2B1B3D" text-anchor="middle">1,41667</text><text x="265" y="302" font-size="15" fill="#2B1B3D" text-anchor="middle">1,41176</text><text x="400" y="302" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1,414216</text><text x="540" y="302" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">5</text><line x1="30" y1="380" x2="620" y2="380" stroke="#F1E2CF" stroke-width="1.5"/><text x="70" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle">4</text><text x="150" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle">1,414216</text><text x="265" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle">1,414211</text><text x="400" y="358" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1,41421356237</text><text x="540" y="358" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">11</text><text x="325" y="440" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">real: √2 = 1,41421356237…</text><rect x="30" y="460" width="590" height="56" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="325" y="494" font-size="17" fill="#2A9D8F" text-anchor="middle" font-weight="700">As casas certas quase dobram a cada passo!</text><rect x="650" y="100" width="320" height="416" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="810" y="132" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Heron, c. 60 d.C.: √720</text><text x="810" y="172" font-size="15" fill="#2B1B3D" text-anchor="middle">27² = 729, perto de 720</text><text x="810" y="202" font-size="15" fill="#2B1B3D" text-anchor="middle">chute: 27</text><text x="810" y="232" font-size="15" fill="#2B1B3D" text-anchor="middle">720 ÷ 27 = 26 ⅔</text><text x="810" y="262" font-size="15" fill="#2B1B3D" text-anchor="middle">média: (27 + 26 ⅔) ÷ 2</text><text x="810" y="310" font-size="20" fill="#5B2A86" text-anchor="middle" font-weight="700">= 26 ⅚ = 26,8333</text><text x="810" y="340" font-size="15" fill="#756986" text-anchor="middle">real: 26,8328</text><line x1="680" y1="370" x2="940" y2="370" stroke="#F1E2CF" stroke-width="2"/><text x="810" y="400" font-size="14" fill="#2B1B3D" text-anchor="middle">Um só passo, erro de</text><text x="810" y="424" font-size="14" fill="#2B1B3D" text-anchor="middle">meio milésimo.</text><text x="810" y="448" font-size="14" fill="#2B1B3D" text-anchor="middle">Heron dizia: repita para</text><text x="810" y="472" font-size="14" fill="#2B1B3D" text-anchor="middle">chegar ainda mais perto.</text>
</svg>
