<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Scientific dystopias and what has already arrived</title>
<desc id="d">A band running from dystopia to utopia, with four works. 1984, published in 1949 and set in 1984: total surveillance and control of language; facial-recognition cameras and surveillance capitalism have already arrived. The Matrix, from 1999, set around 2199: simulated reality run by machines; virtual reality and Bostrom’s 2003 simulation argument have arrived. Blade Runner, from 1982, set in 2019: androids indistinguishable from humans; humanoid robots, deepfakes and doubt about who is human have arrived. Star Trek, from 1966, set in the 23rd century: a utopia of abundance and exploration; cell phones, tablets, live translation and the 2017 XPRIZE tricorder have arrived.</desc>
