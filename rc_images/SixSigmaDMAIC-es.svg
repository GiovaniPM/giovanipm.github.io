<rect x="414.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#FFF1C9" stroke="#FFB703" stroke-width="2.5"/>
<circle cx="500.0" cy="144" r="24" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/>
