<text x="500.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Analizar</text>
<text x="500.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">¿Cuál es la</text>
<text x="500.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">causa raíz?</text>
