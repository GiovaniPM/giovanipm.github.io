<rect x="611.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#FFE3E3" stroke="#FF6B6B" stroke-width="2.5"/>
<circle cx="697.0" cy="144" r="24" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/>
<text x="697.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">I</text>
<text x="697.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Mejorar</text>
<text x="697.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">¿Cómo eliminar</text>
<text x="697.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">la causa?</text>
<line x1="625" y1="258" x2="769" y2="258" stroke="#FF6B6B" stroke-width="1.5"/>
<text x="625.0" y="280.0" font-size="11" fill="#756986" font-weight="700">HERRAMIENTAS</text>
<circle cx="631" cy="300" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="304.0" font-size="13" fill="#2B1B3D">Diagrama de afinidad</text>
<circle cx="631" cy="326" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="330.0" font-size="13" fill="#2B1B3D">Matriz de criterios</text>
<circle cx="631" cy="352" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="356.0" font-size="13" fill="#2B1B3D">Piloto</text>
<circle cx="631" cy="378" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="382.0" font-size="13" fill="#2B1B3D">Poka-yoke</text>
<line x1="785" y1="144" x2="806" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="808.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<circle cx="894.0" cy="144" r="24" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
