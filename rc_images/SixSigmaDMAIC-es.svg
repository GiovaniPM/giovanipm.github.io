<text x="894.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Controlar</text>
<text x="894.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">¿Cómo mantener</text>
<text x="894.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">el resultado?</text>
<line x1="822" y1="258" x2="966" y2="258" stroke="#5B2A86" stroke-width="1.5"/>
<text x="822.0" y="280.0" font-size="11" fill="#756986" font-weight="700">HERRAMIENTAS</text>
<circle cx="828" cy="300" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="304.0" font-size="13" fill="#2B1B3D">Gráfico de control</text>
