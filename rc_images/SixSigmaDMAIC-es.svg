<text x="838.0" y="330.0" font-size="13" fill="#2B1B3D">Estandarización</text>
<circle cx="828" cy="352" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="356.0" font-size="13" fill="#2B1B3D">Plan de respuesta</text>
<circle cx="828" cy="378" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="382.0" font-size="13" fill="#2B1B3D">Dueño del proceso</text>
<path d="M894.0 432 v34 H106.0 v-30" stroke="#5B2A86" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#ap)"/>
<text x="500.0" y="460.0" font-size="14" fill="#5B2A86" text-anchor="middle" font-weight="700">mejora continua: el proceso bajo control es la base del ciclo siguiente</text>
<text x="500.0" y="505.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Los proyectos DMAIC suelen durar de 3 a 6 meses; cada paso de etapa se revisa en un “tollgate”.</text>
</svg>
