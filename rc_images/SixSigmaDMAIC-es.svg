<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">DMAIC: las cinco etapas de la mejora de un proceso</title>
<desc id="d">Cinco columnas unidas por flechas, una por etapa del DMAIC. Definir: cuál es el problema y para quién, con project charter, SIPOC, árbol CTQ y voz del cliente. Medir: qué tan grande es, con plan de recolección, DPMO, FMEA y capacidad. Analizar: cuál es la causa raíz, con Ishikawa, 5 porqués, Pareto y dispersión. Mejorar: cómo eliminar la causa, con diagrama de afinidad, matriz de criterios, piloto y poka-yoke. Controlar: cómo mantener el resultado, con gráfico de control, estandarización, plan de respuesta y dueño del proceso. Una flecha punteada vuelve de Controlar a Definir.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="525" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">DMAIC: las cinco etapas de la mejora de un proceso</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cada etapa responde una pregunta y tiene sus herramientas típicas</text>
<rect x="20.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#E1ECFF" stroke="#3A86FF" stroke-width="2.5"/>
<circle cx="106.0" cy="144" r="24" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/>
<text x="106.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">D</text>
<text x="106.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Definir</text>
<text x="106.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">¿Cuál es el problema</text>
<text x="106.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">y para quién?</text>
<line x1="34" y1="258" x2="178" y2="258" stroke="#3A86FF" stroke-width="1.5"/>
<text x="34.0" y="280.0" font-size="11" fill="#756986" font-weight="700">HERRAMIENTAS</text>
<circle cx="40" cy="300" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="304.0" font-size="13" fill="#2B1B3D">Project charter</text>
<circle cx="40" cy="326" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="330.0" font-size="13" fill="#2B1B3D">SIPOC</text>
<circle cx="40" cy="352" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="356.0" font-size="13" fill="#2B1B3D">Árbol CTQ</text>
<circle cx="40" cy="378" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="382.0" font-size="13" fill="#2B1B3D">Voz del cliente</text>
<line x1="194" y1="144" x2="215" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="217.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<circle cx="303.0" cy="144" r="24" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<text x="303.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">M</text>
<text x="303.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Medir</text>
<text x="303.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">¿Qué tan grande es</text>
<text x="303.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">hoy?</text>
<line x1="231" y1="258" x2="375" y2="258" stroke="#2A9D8F" stroke-width="1.5"/>
<text x="231.0" y="280.0" font-size="11" fill="#756986" font-weight="700">HERRAMIENTAS</text>
