<title id="t">Árvore de decisão: a regra de desconto</title>
<desc id="d">Árvore de decisão. Primeira condição: pagou adiantado? Se sim, 5% de desconto. Se não, segunda condição: compra de R$ 10.000 ou mais? Se não, sem desconto. Se sim, terceira condição: cliente regular? Se sim, 5% de desconto; se não, sem desconto.</desc>
