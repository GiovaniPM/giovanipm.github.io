<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">¿Dónde está el planeta?</title>
<desc id="d">A la izquierda, la órbita elíptica de un planeta con el Sol en uno de los focos y el planeta en un punto de la elipse. Kepler descubrió que el planeta barre áreas iguales en tiempos iguales. Para saber dónde está en una fecha, hay que resolver la ecuación de Kepler, M = E − e · sen E, donde M viene del tiempo, e es el achatamiento de la órbita y E da la posición. No existe una fórmula que despeje E. A la derecha, el gráfico de la función f(E) = E − e · sen E − M que cruza el cero en un punto marcado con un signo de interrogación: hallar la raíz significa hallar el planeta.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">¿Dónde está el planeta?</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">La ecuación de Kepler no tiene una fórmula resolutiva</text><ellipse cx="250" cy="280" rx="190" ry="130" fill="none" stroke="#2B1B3D" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="388.564" cy="280" r="22" fill="#FFB703" stroke="#B35300" stroke-width="2"/><text x="388.564" y="330" font-size="15" fill="#B35300" text-anchor="middle" font-weight="700">Sol</text><path d="M 388.5640646055102 280 L 440 280 A 190 130 0 0 0 169.7 162.2 Z" fill="#E6F0FF" stroke="#3A86FF" stroke-width="1.5"/><circle cx="169.703" cy="162.18" r="12" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/><text x="151.703" y="146.18" font-size="15" fill="#3A86FF" text-anchor="end" font-weight="700">planeta</text><text x="310" y="210" font-size="14" fill="#3A86FF" text-anchor="middle" font-weight="700">área barrida</text><rect x="40" y="430" width="420" height="50" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="250" y="462" font-size="19" fill="#5B2A86" text-anchor="middle" font-weight="700">M = E − e · sen E   →   E = ?</text><line x1="560" y1="300" x2="960" y2="300" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="570" y1="440" x2="570" y2="110" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><text x="955" y="324" font-size="16" fill="#2B1B3D" text-anchor="end" font-weight="700">E</text><text x="584" y="118" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700">f(E)</text><polyline points="570.0,404.0 576.3,402.3 582.7,400.6 589.0,398.8 595.3,397.1 601.7,395.3 608.0,393.5 614.3,391.6 620.7,389.7 627.0,387.8 633.3,385.7 639.7,383.6 646.0,381.5 652.3,379.2 658.7,376.9 665.0,374.4 671.3,371.9 677.7,369.3 684.0,366.5 690.3,363.7 696.7,360.7 703.0,357.6 709.3,354.4 715.7,351.1 722.0,347.6 728.3,344.0 734.7,340.3 741.0,336.4 747.3,332.4 753.7,328.3 760.0,324.0 766.3,319.6 772.7,315.0 779.0,310.3 785.3,305.5 791.7,300.6 798.0,295.5 804.3,290.3 810.7,285.0 817.0,279.5 823.3,273.9 829.7,268.2 836.0,262.4 842.3,256.5 848.7,250.5 855.0,244.4 861.3,238.2 867.7,231.9 874.0,225.6 880.3,219.1 886.7,212.6 893.0,206.0 899.3,199.4 905.7,192.7 912.0,186.0 918.3,179.3 924.7,172.5 931.0,165.7 937.3,158.8 943.7,152.0 950.0,145.2" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linejoin="round"/><circle cx="792.4" cy="300" r="9" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/><text x="796.4" y="334" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">raíz = ?</text><rect x="560" y="430" width="400" height="50" rx="10" fill="#FFF1C9"/><text x="760" y="462" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">hallar la raíz = hallar el planeta</text>
</svg>
