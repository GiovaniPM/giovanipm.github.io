<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">IT roadmap to 2030</title>
<desc id="d">Timeline with three projected phases. Adoption, 2026 to 2027: AI agents in the daily work of development, support and operations, and hiring through practical challenges with AI allowed. Reorganization, 2028 to 2029: smaller, more multidisciplinary IT teams, and multiple-choice exams replaced by labs and simulations. Merging with the business, 2030 onward: less distance between those who ask and those who build, and credentials that become verifiable portfolios and delivery track records. Below, the World Economic Forum estimate to 2030: 170 million jobs created, 92 million displaced, a net gain of 78 million.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Roadmap: three phases to 2030</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">One possible reading, offered as a projection</text>

<line x1="70" y1="160" x2="935" y2="160" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<text x="190" y="130" font-size="16" fill="#FFB703" text-anchor="middle" font-weight="700">2026–2027</text>
<text x="500" y="130" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">2028–2029</text>
<text x="810" y="130" font-size="16" fill="#5B2A86" text-anchor="middle" font-weight="700">2030 onward</text>
<circle cx="190" cy="160" r="12" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/>
<circle cx="500" cy="160" r="12" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/>
<circle cx="810" cy="160" r="12" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<g stroke-width="2" stroke-dasharray="4 4">
<line x1="190" y1="172" x2="190" y2="196" stroke="#FFB703"/>
<line x1="500" y1="172" x2="500" y2="196" stroke="#3A86FF"/>
<line x1="810" y1="172" x2="810" y2="196" stroke="#5B2A86"/>
</g>

<rect x="50" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="190" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Adoption</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="72" cy="265" r="4" fill="#FFB703"/><text x="84" y="270">AI agents in the daily work of</text><text x="84" y="289">development, support and</text><text x="84" y="308">operations</text>
<circle cx="72" cy="336" r="4" fill="#FFB703"/><text x="84" y="341">Hiring through practical</text><text x="84" y="360">challenges, with AI allowed</text>
</g>

<rect x="360" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="500" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Reorganization</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="382" cy="265" r="4" fill="#3A86FF"/><text x="394" y="270">Smaller, more multidisciplinary</text><text x="394" y="289">IT teams</text>
<circle cx="382" cy="317" r="4" fill="#3A86FF"/><text x="394" y="322">Multiple choice gives way to</text><text x="394" y="341">labs and simulations</text>
</g>

<rect x="670" y="198" width="280" height="190" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<text x="810" y="232" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700">Merging with the business</text>
<g font-size="13.5" fill="#2B1B3D">
<circle cx="692" cy="265" r="4" fill="#5B2A86"/><text x="704" y="270">Less distance between those</text><text x="704" y="289">who ask and those who build</text>
<circle cx="692" cy="317" r="4" fill="#5B2A86"/><text x="704" y="322">Credentials become verifiable</text><text x="704" y="341">portfolios and delivery</text><text x="704" y="360">track records</text>
</g>

<text x="500" y="424" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Jobs by 2030 · transformation, not extinction</text>
<rect x="50" y="440" width="280" height="54" rx="12" fill="#2A9D8F"/>
<text x="190" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">+170M</tspan> created</text>
<rect x="360" y="440" width="280" height="54" rx="12" fill="#E23B3B"/>
<text x="500" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">−92M</tspan> displaced</text>
<rect x="670" y="440" width="280" height="54" rx="12" fill="#2B1B3D"/>
<text x="810" y="474" font-size="17" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" font-size="22">+78M</tspan> net gain</text>
<text x="950" y="510" font-size="11" fill="#756986" text-anchor="end" font-style="italic">Source: World Economic Forum, Future of Jobs Report 2025</text>
</svg>
