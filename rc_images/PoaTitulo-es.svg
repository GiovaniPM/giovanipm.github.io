<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cómo leer un título de propiedad</title>
<desc id="d">Título de Cidade Baixa: precio 180; alquiler 14; con el grupo 28; con casas 70, 200, 550 y 750; con hotel 950; cada construcción 100; hipoteca 90; rescate 99.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="26" fill="#2B1B3D" font-weight="700" text-anchor="middle">Cómo leer un título de propiedad</text>
<rect x="90" y="76" width="380" height="456" rx="14" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><rect x="90" y="76" width="380" height="62" rx="14" fill="#F28C28"/><rect x="90" y="116" width="380" height="22" fill="#F28C28"/><text x="280" y="116" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Cidade Baixa</text><text x="114" y="168" font-size="15.5" fill="#2B1B3D">Precio</text><text x="446" y="168" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 180</text><path d="M106 178H454" stroke="#E2D3BC"/><text x="114" y="201" font-size="15.5" fill="#2B1B3D">Alquiler</text><text x="446" y="201" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 14</text><path d="M106 211H454" stroke="#E2D3BC"/><text x="114" y="234" font-size="15.5" fill="#2B1B3D">Con el grupo completo</text><text x="446" y="234" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 28</text><path d="M106 244H454" stroke="#E2D3BC"/><text x="114" y="267" font-size="15.5" fill="#2B1B3D">1 casa</text><text x="446" y="267" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 70</text><path d="M106 277H454" stroke="#E2D3BC"/><text x="114" y="300" font-size="15.5" fill="#2B1B3D">2 casas</text><text x="446" y="300" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 200</text><path d="M106 310H454" stroke="#E2D3BC"/><rect x="100" y="311" width="360" height="31" rx="6" fill="#FFF1C9"/><text x="114" y="333" font-size="15.5" fill="#2B1B3D" font-weight="700">3 casas</text><text x="446" y="333" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 550</text><path d="M106 343H454" stroke="#E2D3BC"/><text x="114" y="366" font-size="15.5" fill="#2B1B3D">4 casas</text><text x="446" y="366" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 750</text><path d="M106 376H454" stroke="#E2D3BC"/><text x="114" y="399" font-size="15.5" fill="#2B1B3D">Hotel</text><text x="446" y="399" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 950</text><path d="M106 409H454" stroke="#E2D3BC"/><text x="114" y="432" font-size="15.5" fill="#2B1B3D">Casa u hotel</text><text x="446" y="432" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 100</text><path d="M106 442H454" stroke="#E2D3BC"/><text x="114" y="465" font-size="15.5" fill="#2B1B3D">Hipoteca</text><text x="446" y="465" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 90</text><path d="M106 475H454" stroke="#E2D3BC"/><text x="114" y="498" font-size="15.5" fill="#2B1B3D">Rescate</text><text x="446" y="498" font-size="15.5" fill="#2B1B3D" font-weight="700" text-anchor="end">P$ 99</text><path d="M474 163H560" stroke="#C2471F" stroke-width="2"/><circle cx="474" cy="163" r="4" fill="#C2471F"/><text x="570" y="168" font-size="15" fill="#2B1B3D">Cuánto cuesta comprarla. Si la rechazas, va</text><text x="570" y="188" font-size="15" fill="#2B1B3D">a subasta.</text><path d="M474 234H560" stroke="#C2471F" stroke-width="2"/><circle cx="474" cy="234" r="4" fill="#C2471F"/><text x="570" y="242" font-size="15" fill="#2B1B3D">Con todo el grupo y sin construcciones, el</text><text x="570" y="262" font-size="15" fill="#2B1B3D">alquiler se duplica.</text><path d="M474 329H560" stroke="#C2471F" stroke-width="2"/><circle cx="474" cy="329" r="4" fill="#C2471F"/><text x="570" y="338" font-size="15" fill="#2B1B3D">En la tercera casa, el alquiler casi se</text><text x="570" y="358" font-size="15" fill="#2B1B3D">triplica. Es el mejor momento para haber</text><text x="570" y="378" font-size="15" fill="#2B1B3D">construido.</text><path d="M474 461H560" stroke="#C2471F" stroke-width="2"/><circle cx="474" cy="461" r="4" fill="#C2471F"/><text x="570" y="466" font-size="15" fill="#2B1B3D">La hipoteca da la mitad del precio al</text><text x="570" y="486" font-size="15" fill="#2B1B3D">instante. El rescate cuesta un 10% más, y</text><text x="570" y="506" font-size="15" fill="#2B1B3D">mientras tanto la propiedad no cobra.</text>
</svg>
