<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Os horizontes de foco</title>
<desc id="d">Seis horizontes de foco do GTD, do mais amplo ao mais concreto: horizonte 5, propósito e princípios, por que você faz o que faz; horizonte 4, visão de 3 a 5 anos; horizonte 3, metas de 1 a 2 anos; horizonte 2, áreas de foco e responsabilidade, como saúde, equipe e finanças; horizonte 1, projetos, resultados com mais de uma ação em até um ano; e o chão, as ações e a agenda.</desc>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Os horizontes de foco</text>
<path d="M60.0 520.0 L60.0 107.0" stroke="#756986" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M60.0 96.0 L66.0 107.0 L54.0 107.0 Z" fill="#756986"/>
<text x="40" y="310" font-size="13" font-weight="700" fill="#756986" text-anchor="middle" transform="rotate(-90 40 310)">visão mais ampla · mais concreto</text>
<rect x="90" y="90" width="870" height="60" rx="12" fill="#5B2A86"/>
<text x="112.0" y="126.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 5 · Propósito e princípios</text>
<text x="938.0" y="126.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">por que você faz o que faz</text>
<rect x="90" y="162" width="870" height="60" rx="12" fill="#7B3FB0"/>
<text x="112.0" y="198.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 4 · Visão (3 a 5 anos)</text>
<text x="938.0" y="198.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">como seria o sucesso a longo prazo</text>
<rect x="90" y="234" width="870" height="60" rx="12" fill="#C2185B"/>
<text x="112.0" y="270.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 3 · Metas (1 a 2 anos)</text>
<text x="938.0" y="270.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">o que precisa ser alcançado em breve</text>
<rect x="90" y="306" width="870" height="60" rx="12" fill="#B35300"/>
<text x="112.0" y="342.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 2 · Áreas de foco e responsabilidade</text>
<text x="938.0" y="342.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">papéis a manter: saúde, equipe, finanças</text>
<rect x="90" y="378" width="870" height="60" rx="12" fill="#2F6FE0"/>
<text x="112.0" y="414.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 1 · Projetos</text>
<text x="938.0" y="414.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">resultados com mais de uma ação, em até um ano</text>
<rect x="90" y="450" width="870" height="60" rx="12" fill="#0E8074"/>
<text x="112.0" y="486.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Chão · Ações e agenda</text>
<text x="938.0" y="486.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">a próxima ação física e os compromissos</text>
</svg>
