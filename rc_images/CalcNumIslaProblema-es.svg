<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Por qué el seno de 1° era tan difícil</title>
<desc id="d">A la izquierda, un círculo de radio 1 con un ángulo pequeñísimo de 1 grado; la altura del punto sobre el círculo es el seno de 1 grado. Los astrónomos necesitaban tablas de senos para predecir la posición de los astros, hacer calendarios y encontrar la dirección de La Meca. Con la geometría se calcula exactamente el seno de 3 grados, pero dividir un ángulo en tres partes iguales con regla y compás es imposible. A la derecha, una tabla de senos con 3 grados completado, 0,0523359563, y 1 y 2 grados con signos de interrogación.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Por qué el seno de 1° era tan difícil</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">La astronomía, los calendarios y la navegación dependían de las tablas</text><circle cx="250" cy="285" r="140" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/><line x1="90" y1="285" x2="420" y2="285" stroke="#756986" stroke-width="1.5"/><line x1="250" y1="285" x2="388.638" y2="265.516" stroke="#5B2A86" stroke-width="3"/><line x1="388.638" y1="265.516" x2="388.638" y2="285" stroke="#FF6B6B" stroke-width="4"/><text x="402.638" y="277" font-size="17" fill="#FF6B6B" text-anchor="start" font-weight="700">sen 1°</text><text x="320" y="267" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1°</text><text x="250" y="455" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">(ángulo exagerado para poder verlo)</text><rect x="490" y="110" width="220" height="250" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><text x="600" y="140" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">Tabla de senos</text><text x="530" y="185" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">1°</text><text x="680" y="185" font-size="16" fill="#FF6B6B" text-anchor="end" font-weight="700">?</text><text x="530" y="229" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">2°</text><text x="680" y="229" font-size="16" fill="#FF6B6B" text-anchor="end" font-weight="700">?</text><text x="530" y="273" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">3°</text><text x="680" y="273" font-size="16" fill="#2A9D8F" text-anchor="end" font-weight="700">0,0523359563</text><text x="530" y="317" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">…</text><text x="680" y="317" font-size="16" fill="#756986" text-anchor="end" font-weight="700">…</text><rect x="740" y="110" width="230" height="250" rx="12" fill="#FFE8E8"/><text x="855" y="140" font-size="16" fill="#E23B3B" text-anchor="middle" font-weight="700">El nudo</text><text x="855" y="172" font-size="14" fill="#2B1B3D" text-anchor="middle">sen 3° sale de la geometría</text><text x="855" y="198" font-size="14" fill="#2B1B3D" text-anchor="middle">(de 72° y 60°).</text><text x="855" y="224" font-size="14" fill="#2B1B3D" text-anchor="middle">Pero dividir un ángulo</text><text x="855" y="250" font-size="14" fill="#2B1B3D" text-anchor="middle">en 3 con regla y</text><text x="855" y="276" font-size="14" fill="#2B1B3D" text-anchor="middle">compás es imposible.</text><text x="855" y="302" font-size="14" fill="#2B1B3D" text-anchor="middle">Hace falta otro camino.</text><rect x="490" y="390" width="480" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="730" y="422" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">Samarcanda, observatorio de Ulugh Beg, años 1420</text><text x="730" y="450" font-size="14" fill="#2B1B3D" text-anchor="middle">objetivo: tablas de senos con muchas cifras correctas</text>
</svg>
