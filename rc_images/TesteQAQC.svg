<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">QA, QC e testes: um dentro do outro</title>
<desc id="d">Três elipses aninhadas: a maior é a garantia da qualidade, focada no processo e em prevenir defeitos; dentro dela, o controle da qualidade, focado no produto e em detectar defeitos; no centro, os testes, que executam o software para encontrar defeitos. Ao lado, dois quadros: teste encontra a falha e depuração corrige; auditoria examina o processo e inspeção revisa um artefato.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">QA, QC e testes: um dentro do outro</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Testar é uma parte do controle, que por sua vez é uma parte da garantia da qualidade</text>
<ellipse cx="360" cy="300" rx="330" ry="210" fill="#EFE3FA" stroke="#5B2A86" stroke-width="3"/>
<ellipse cx="360" cy="330" rx="240" ry="145" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="3"/>
<ellipse cx="360" cy="360" rx="135" ry="72" fill="#FFF1C9" stroke="#B35300" stroke-width="3"/>
<text x="360" y="132" font-size="19" fill="#5B2A86" text-anchor="middle" font-weight="700">Garantia da qualidade (QA)</text>
<text x="360" y="155" font-size="14" fill="#3E3350" text-anchor="middle">foco no processo · prevenir defeitos</text>
<text x="360" y="222" font-size="18" fill="#0E6B61" text-anchor="middle" font-weight="700">Controle da qualidade (QC)</text>
<text x="360" y="244" font-size="14" fill="#3E3350" text-anchor="middle">foco no produto · detectar defeitos</text>
<text x="360" y="356" font-size="19" fill="#B35300" text-anchor="middle" font-weight="700">Testes</text>
<text x="360" y="379" font-size="14" fill="#3E3350" text-anchor="middle">executar e encontrar defeitos</text>
<rect x="720" y="110" width="262" height="128" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<rect x="720" y="110" width="8" height="128" rx="4" fill="#FF6B6B"/>
<text x="742" y="140" font-size="16" fill="#2B1B3D" font-weight="700">Teste × depuração</text>
<text x="742" y="166" font-size="14" fill="#3E3350">Teste: encontra a falha,</text>
<text x="742" y="187" font-size="14" fill="#3E3350">sem corrigir.</text>
<text x="742" y="208" font-size="14" fill="#3E3350">Depuração: o desenvolvedor</text>
<text x="742" y="229" font-size="14" fill="#3E3350">localiza a causa e corrige.</text>
<rect x="720" y="320" width="262" height="128" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<rect x="720" y="320" width="8" height="128" rx="4" fill="#3A86FF"/>
<text x="742" y="350" font-size="16" fill="#2B1B3D" font-weight="700">Auditoria × inspeção</text>
<text x="742" y="376" font-size="14" fill="#3E3350">Auditoria: examina se o</text>
<text x="742" y="397" font-size="14" fill="#3E3350">processo é seguido.</text>
<text x="742" y="418" font-size="14" fill="#3E3350">Inspeção: revisão formal de</text>
<text x="742" y="439" font-size="14" fill="#3E3350">um artefato por outra pessoa.</text>
</svg>
