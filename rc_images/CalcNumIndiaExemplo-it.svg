-anchor="middle" font-weight="700">890</text><line x1="30" y1="266" x2="470" y2="266" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="292" font-size="15" fill="#2B1B3D" text-anchor="middle">8</text><text x="190" y="292" font-size="15" fill="#2B1B3D" text-anchor="middle">30°</text><text x="300" y="292" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1719</text><text x="410" y="292" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">1719</text><line x1="30" y1="306" x2="470" y2="306" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="332" font-size="15" fill="#2B1B3D" text-anchor="middle">12</text><text x="190" y="332" font-size="15" fill="#2B1B3D" text-anchor="middle">45°</text><text x="300" y="332" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">2431</text><text x="410" y="332" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">2431</text><line x1="30" y1="346" x2="470" y2="346" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="372" font-size="15" fill="#2B1B3D" text-anchor="middle">16</text><text x="190" y="372" font-size="15" fill="#2B1B3D" text-anchor="middle">60°</text><text x="300" y="372" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">2978</text><text x="410" y="372" font-size="15" fill="#FF6B6B" text-anchor="middle" font-weight="700">2977</text><line x1="30" y1="386" x2="470" y2="386" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="412" font-size="15" fill="#2B1B3D" text-anchor="middle">21</text><text x="190" y="412" font-size="15" fill="#2B1B3D" text-anchor="middle">78°45’</text><text x="300" y="412" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">3372</text><text x="410" y="412" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">3372</text><line x1="30" y1="426" x2="470" y2="426" stroke="#F1E2CF" stroke-width="1.5"/><text x="90" y="452" font-size="15" fill="#2B1B3D" text-anchor="middle">24</text><text x="190" y="452" font-size="15" fill="#2B1B3D" text-anchor="middle">90°</text><text x="300" y="452" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">3438</text><text x="410" y="452" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">3438</text><line x1="30" y1="466" x2="470" y2="466" stroke="#F1E2CF" stroke-width="1.5"/><text x="250" y="508" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">moderno = 3438 × seno, arrotondato</text><rect x="500" y="100" width="470" height="420" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="735" y="130" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Brahmagupta (665): seno di 80°?</text><line x1="560" y1="330" x2="920" y2="330" stroke="#2B1B3D" stroke-width="1.5"/><polyline points="560.0,324.4 563.6,322.5 567.2,320.6 570.8,318.8 574.4,316.9 578.0,315.0 581.6,313.2 585.2,311.4 588.8,309.5 592.4,307.7 596.0,305.9 599.6,304.2 603.2,302.4 606.8,300.6 610.4,298.9 614.0,297.1 617.6,295.4 621.2,293.7 624.8,292.0 628.4,290.3 632.0,288.6 635.6,286.9 639.2,285.3 642.8,283.6 646.4,282.0 650.0,280.4 653.6,278.8 657.2,277.2 660.8,275.6 664.4,274.0 668.0,272.4 671.6,270.9 675.2,269.3 678.8,267.8 682.4,266.3 686.0,264.8 689.6,263.3 693.2,261.8 696.8,260.4 700.4,258.9 704.0,257.5 707.6,256.0 711.2,254.6 714.8,253.2 718.4,251.8 722.0,250.4 725.6,249.0 729.2,247.7 732.8,246.3 736.4,245.0 740.0,243.7 743.6,242.3 747.2,241.0 750.8,239.7 754.4,238.5 758.0,237.2 761.6,235.9 765.2,234.7 768.8,233.5 772.4,232.2 776.0,231.0 779.6,229.8 783.2,228.7 786.8,227.5 790.4,226.3 794.0,225.2 797.6,224.0 801.2,222.9 804.8,221.8 808.4,220.7 812.0,219.6 815.6,218.5 819.2,217.5 822.8,216.4 826.4,215.4 830.0,214.3 833.6,213.3 837.2,212.3 840.8,211.3 844.4,210.3 848.0,209.4 851.6,208.4 855.2,207.5 858.8,206.5 862.4,205.6 866.0,204.7 869.6,203.8 873.2,202.9 876.8,202.0 880.4,201.2 884.0,200.3 887.6,199.5 891.2,198.7 894.8,197.9 898.4,197.1 902.0,196.3 905.6,195.5 909.2,194.7 91