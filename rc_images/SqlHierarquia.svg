<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Consulta hierárquica: da raiz às folhas</title>
<desc id="d">À esquerda, duas árvores de mensagens. A primeira começa na mensagem 1, do Usuário 1, com nível 1, e desce pelas respostas 2, 3, 4 e 5, com níveis de 2 a 5. A segunda começa na mensagem 6, do Usuário 23, com a resposta 7 no nível 2. À direita, a tabela com id, login e parent_id, em que as raízes 1 e 6 têm parent_id nulo, e a cláusula CONNECT BY PRIOR id = parent_id, com a explicação de que PRIOR marca a coluna da linha-pai.</desc>
