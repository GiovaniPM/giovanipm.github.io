<text x="654" y="388" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">CONNECT BY </tspan><tspan fill="#5FD3C4">PRIOR</tspan><tspan fill="#F7F0FF"> id = parent_id</tspan></text>
<text x="654.0" y="416.0" font-size="12.5" fill="#F7F0FF" xml:space="preserve">PRIOR marca a coluna da linha-pai:</text>
<text x="654.0" y="436.0" font-size="12.5" fill="#F7F0FF" xml:space="preserve">o id do pai = o parent_id do filho.</text>
<text x="654.0" y="456.0" font-size="12.5" fill="#F7F0FF" xml:space="preserve">Trocar o lado do PRIOR inverte</text>
<text x="654.0" y="476.0" font-size="12.5" fill="#F7F0FF" xml:space="preserve">o sentido: sobe da folha à raiz.</text>
<text x="500.0" y="530.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">LEVEL é a profundidade: 1 nas raízes (parent_id nulo), 2 nas respostas diretas, e assim por diante.</text>
</svg>
