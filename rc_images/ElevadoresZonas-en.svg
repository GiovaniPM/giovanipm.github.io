<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d">
<title id="t">Three ways to serve a tall building</title>
<desc id="d">On the left, a single group serves every floor and stops at many of them on each trip. In the centre, two zones: one group serves the low floors and another goes straight from the main floor to the high floors, without stopping at the low ones. On the right, a sky lobby: fast shuttle lifts, possibly double-deck, carry people from the main floor to the sky lobby, and local groups distribute from there.</desc>
