<text x="576.0" y="327.0" font-size="14" fill="#2B1B3D" text-anchor="start">Revenue, last hour</text>
<text x="922.0" y="327.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">38% of forecast</text>
<rect x="605.0" y="350" width="260" height="28" rx="14" fill="#E23B3B"/>
<text x="735.0" y="369.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Alert: the business stopped</text>
<text x="500.0" y="430.0" font-size="14" fill="#3E3350" text-anchor="middle">The API answers, but it answers “no”. Only business monitoring sees the problem.</text>
