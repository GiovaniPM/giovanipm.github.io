<text x="735.0" y="136.0" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Business monitoring</text>
<text x="735.0" y="157.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">is the business happening?</text>
