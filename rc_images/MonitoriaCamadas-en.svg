<circle cx="556" cy="234" r="10" fill="#E23B3B"/>
<path d="M552 230 l8 8 M560 230 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="239.0" font-size="14" fill="#2B1B3D" text-anchor="start">Transactions at 10 am</text>
<text x="922.0" y="239.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">50 (expected ~500)</text>
