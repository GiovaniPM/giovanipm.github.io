<text x="452.0" y="195.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">99.9%</text>
<rect x="66" y="216" width="398" height="36" rx="8" fill="#C8EDE6"/>
<circle cx="86" cy="234" r="10" fill="#2A9D8F"/>
<path d="M81 234 l3.5 3.5 l6.5 -7" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
