<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Funzione aggregata o analitica?</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">GROUP BY unisce le righe; OVER le mantiene tutte e aggiunge una colonna</text>
<text x="20.0" y="112.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">7 righe in ingresso</text>
