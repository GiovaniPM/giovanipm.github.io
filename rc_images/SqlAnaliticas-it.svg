<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Funzione aggregata o analitica?</title>
<desc id="d">A sinistra, sette dipendenti di due reparti. Al centro, la versione aggregata, AVG con GROUP BY, riduce tutto a due righe: reparto 10 con media 4000 e reparto 20 con media 4333,33. A destra, la versione analitica, AVG OVER PARTITION BY reparto, mantiene le sette righe e aggiunge la colonna media_rep con la media del reparto di ciascuno.</desc>
