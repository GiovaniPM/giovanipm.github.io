<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quatro formas de trocar o sistema antigo pelo novo</title>
<desc id="d">Quatro linhas do tempo. Direta: o sistema antigo é desligado e o novo entra no mesmo momento. Paralela: os dois rodam juntos por um período e os resultados são comparados. Piloto: o novo sistema entra primeiro numa unidade e depois em todas. Por fases: o novo substitui o antigo módulo a módulo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="525" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Quatro formas de trocar o sistema antigo pelo novo</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">O que muda é quanto tempo os dois convivem e onde o novo começa</text>
<text x="30.0" y="124.0" font-size="15" fill="#2B1B3D" font-weight="700">Direta</text>
<text x="30.0" y="144.0" font-size="12" fill="#756986" font-style="italic">risco alto, custo baixo</text>
<rect x="250" y="112" width="350" height="22" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/><text x="258.0" y="129.0" font-size="11" fill="#2B1B3D" font-weight="700">antigo</text>
<rect x="600" y="112" width="360" height="22" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="608.0" y="129.0" font-size="11" fill="#FFFFFF" font-weight="700">novo</text>
<line x1="600" y1="104" x2="600" y2="144" stroke="#D62828" stroke-width="3"/>
<text x="30.0" y="220.0" font-size="15" fill="#2B1B3D" font-weight="700">Paralela</text>
<text x="30.0" y="240.0" font-size="12" fill="#756986" font-style="italic">risco baixo, custo alto</text>
<rect x="250" y="202" width="470" height="18" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/><text x="258.0" y="215.0" font-size="11" fill="#2B1B3D" font-weight="700">antigo</text>
<rect x="480" y="224" width="480" height="18" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="488.0" y="237.0" font-size="11" fill="#FFFFFF" font-weight="700">novo</text>
<rect x="480" y="198" width="240" height="48" rx="6" fill="none" stroke="#B35300" stroke-width="2" stroke-dasharray="5 4"/>
<text x="600.0" y="260.0" font-size="11.5" fill="#B35300" text-anchor="middle" font-weight="700">os dois rodam juntos e os resultados são comparados</text>
<text x="30.0" y="316.0" font-size="15" fill="#2B1B3D" font-weight="700">Piloto</text>
<text x="30.0" y="336.0" font-size="12" fill="#756986" font-style="italic">risco limitado a um local</text>
<rect x="250" y="298" width="470" height="18" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/><text x="258.0" y="311.0" font-size="11" fill="#2B1B3D" font-weight="700">antigo</text>
<rect x="430" y="320" width="530" height="12" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/>
<text x="436.0" y="346.0" font-size="11.5" fill="#5B2A86" font-weight="700">novo sistema numa unidade piloto</text>
<rect x="720" y="298" width="240" height="18" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="728.0" y="311.0" font-size="11" fill="#FFFFFF" font-weight="700">todas as unidades</text>
<text x="30.0" y="412.0" font-size="15" fill="#2B1B3D" font-weight="700">Por fases</text>
<text x="30.0" y="432.0" font-size="12" fill="#756986" font-style="italic">risco diluído, mais demorada</text>
<rect x="250" y="392" width="170" height="16" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/>
<rect x="420" y="392" width="540" height="16" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="428.0" y="403.0" font-size="11" fill="#FFFFFF" font-weight="700">módulo A</text>
<rect x="250" y="412" width="340" height="16" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/>
<rect x="590" y="412" width="370" height="16" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="598.0" y="423.0" font-size="11" fill="#FFFFFF" font-weight="700">módulo B</text>
<rect x="250" y="432" width="510" height="16" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/>
<rect x="760" y="432" width="200" height="16" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="768.0" y="443.0" font-size="11" fill="#FFFFFF" font-weight="700">módulo C</text>
<line x1="250.0" y1="492.0" x2="960.0" y2="492.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="960.0" y="510.0" font-size="12" fill="#756986" text-anchor="end">tempo →</text>
<rect x="30" y="470" width="30" height="14" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/>
<text x="66.0" y="482.0" font-size="12" fill="#3E3350">antigo</text>
<rect x="30" y="494" width="30" height="14" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/>
<text x="66.0" y="506.0" font-size="12" fill="#3E3350">novo</text>
</svg>
