<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Arquitectura de referencia</title>
<desc id="d">Flujo de izquierda a derecha en cinco columnas. Fuentes: ERP JDE, API de los socios, base de datos y logs de integración. Recolección: conectores con SQL programado, eventos y webhooks, guardando el histórico. Reglas: motor de reglas con umbrales fijos, SLA, patrón histórico y eventos ausentes, clasificando en verde, amarillo o rojo. Salidas: tablero en tiempo real, alertas por correo, Slack y Teams y tickets abiertos automáticamente. Acción: el negocio decide y TI corrige. Una flecha punteada vuelve de la acción a las reglas: cada incidente afina reglas, umbrales y responsables.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
