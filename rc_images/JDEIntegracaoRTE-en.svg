<text x="500.0" y="455.0" font-size="12.5" fill="#3E3350" text-anchor="middle">activate the event (P90701A) · register subscribers and transports (P90702A)</text>
<text x="500.0" y="473.5" font-size="12.5" fill="#3E3350" text-anchor="middle">event kernels in the Enterprise Server jde.ini · Transaction Server installed with Server Manager</text>
