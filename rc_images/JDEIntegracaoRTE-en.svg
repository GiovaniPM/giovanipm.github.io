<text x="565.0" y="170.0" font-size="12.5" fill="#3E3350" text-anchor="middle">event kernels</text>
<text x="565.0" y="188.5" font-size="12.5" fill="#3E3350" text-anchor="middle">F90710</text>
<rect x="700" y="110" width="270" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="835.0" y="142.3" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Transaction Server</text>
<text x="835.0" y="160.8" font-size="12.5" fill="#3E3350" text-anchor="middle">WebLogic + JMS queues</text>
<text x="835.0" y="179.3" font-size="12.5" fill="#3E3350" text-anchor="middle">guaranteed delivery</text>
