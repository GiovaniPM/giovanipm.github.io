<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Real-Time Events flow</title>
<desc id="d">A JDE transaction, such as a sales order in P4210, makes the business function raise an XML event, for example RTSOOUT. The Enterprise Server event kernels, with table F90710, pass the event to the Transaction Server, on WebLogic with JMS queues and guaranteed delivery per subscriber, which distributes it to a JMS or MQ queue, to the Orchestrator as a notification, or to a web service through BSSV. The event types are Z events, real-time events and XAPI. Configuration activates the event in P90701A, registers subscribers and transports in P90702A, defines the kernels in jde.ini and installs the Transaction Server with Server Manager.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
