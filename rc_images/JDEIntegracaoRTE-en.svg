<text x="125.0" y="170.0" font-size="12.5" fill="#3E3350" text-anchor="middle">e.g. a sales order</text>
<text x="125.0" y="188.5" font-size="12.5" fill="#3E3350" text-anchor="middle">in P4210</text>
<rect x="250" y="120" width="190" height="90" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="345.0" y="151.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">BSFN raises the event</text>
<text x="345.0" y="170.0" font-size="12.5" fill="#3E3350" text-anchor="middle">e.g. RTSOOUT</text>
<text x="345.0" y="188.5" font-size="12.5" fill="#3E3350" text-anchor="middle">XML</text>
<rect x="470" y="120" width="190" height="90" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
