<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
<title id="t">Giving away two boxes: from the end or the middle</title>
<desc id="d">Two drawings of a chain of 2 boxes. On the left, the chain was opened at one end: only the first box has three sides, and the receiver can decline both by drawing the other end. On the right, the chain was opened with the middle line: both boxes have three sides, each closed by a different line, and it is not possible to decline both in one move.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">Giving away two boxes: from the end or the middle</text>
<g transform="translate(133.9 76) scale(1.35)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="ln last" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="gridln" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/></g><line x1="331.0" y1="111.1" x2="331.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><text x="250" y="261.20000000000005" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">From the end</text><text x="250" y="282.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">The receiver can take both or</text><text x="250" y="303.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">decline both, drawing the other end,</text><text x="250" y="324.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">and keep control.</text><g transform="translate(633.9 76) scale(1.35)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="gridln" x1="26" y1="26" x2="26" y2="86"/><line class="ln last" style="--len:60" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/></g><line x1="669.0" y1="111.1" x2="669.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><line x1="831.0" y1="111.1" x2="831.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><text x="750" y="261.20000000000005" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">From the middle</text><text x="750" y="282.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">Each box closes with its own line.</text><text x="750" y="303.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">Both cannot be declined</text><text x="750" y="324.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">in a single move.</text></svg>
