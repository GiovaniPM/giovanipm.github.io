<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 404" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il ciclo di ogni pianeta</title>
<desc id="d">Diagramma in otto fasi che si ripetono su ogni pianeta: 1, analizzare con il sensore; 2, atterrare; 3, estrarre azoto liquido dai cristalli; 4, terraformare alla nave; 5, costruire estrattore, magazzino, abitazioni e stalla; 6, difendere con le torri; 7, costruire la centrale di comunicazione e fondare la colonia; 8, raccogliere 200 di N₂ e decollare. Una freccia torna dalla fase 8 alla 1, verso il prossimo pianeta.</desc>
<rect width="980" height="404" rx="18" fill="#FFF7EC"/>
<text x="490.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Il ciclo di ogni pianeta</text>
<g transform="translate(20 80)"><rect x="20" y="20" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/><circle cx="48" cy="50" r="16" fill="#3A86FF"/><text x="48.0" y="56.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="72.0" y="57.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Analizzare</text><text x="120.0" y="90.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">sensore (Q)</text><rect x="260" y="20" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><circle cx="288" cy="50" r="16" fill="#5B2A86"/><text x="288.0" y="56.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="312.0" y="57.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Atterrare</text><text x="360.0" y="90.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">E vicino al pianeta</text><rect x="500" y="20" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#0E8074" stroke-width="3"/><circle cx="528" cy="50" r="16" fill="#0E8074"/><text x="528.0" y="56.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="552.0" y="57.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Estrarre N₂</text><text x="600.0" y="90.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">cristalli azzurri</text><rect x="740" y="20" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="3"/><circle cx="768" cy="50" r="16" fill="#2F6FE0"/><text x="768.0" y="56.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="792.0" y="57.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Terraformare</text><text x="840.0" y="90.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">alla nave, −N₂</text><rect x="740" y="180" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#B35300" stroke-width="3"/><circle cx="768" cy="210" r="16" fill="#B35300"/><text x="768.0" y="216.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="792.0" y="217.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Costruire</text><text x="840.0" y="250.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">estrattore e magazzino</text><rect x="500" y="180" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#C2185B" stroke-width="3"/><circle cx="528" cy="210" r="16" fill="#C2185B"/><text x="528.0" y="216.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="552.0" y="217.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Difendere</text><text x="600.0" y="250.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">torri di difesa</text><rect x="260" y="180" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/><circle cx="288" cy="210" r="16" fill="#2A9D8F"/><text x="288.0" y="216.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="312.0" y="217.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Fondare la colonia</text><text x="360.0" y="250.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">centrale di comunicazione</text><rect x="20" y="180" width="200" height="92" rx="16" fill="#FFFFFF" stroke="#E04E6B" stroke-width="3"/><circle cx="48" cy="210" r="16" fill="#E04E6B"/><text x="48.0" y="216.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="72.0" y="217.0" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Decollare</text><text x="120.0" y="250.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">200 N₂ nei serbatoi</text><path d="M226.0 66.0 L242.0 66.0" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M254.0 66.0 L242.0 73.0 L242.0 59.0 Z" fill="#2B1B3D"/><path d="M734.0 226.0 L718.0 226.0" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M706.0 226.0 L718.0 219.0 L718.0 233.0 Z" fill="#2B1B3D"/><path d="M466.0 66.0 L482.0 66.0" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M494.0 66.0 L482.0 73.0 L482.0 59.0 Z" fill="#2B1B3D"/><path d="M494.0 226.0 L478.0 226.0" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M466.0 226.0 L478.0 219.0 L478.0 233.0 Z" fill="#2B1B3D"/><path d="M706.0 66.0 L722.0 66.0" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M734.0 66.0 L722.0 73.0 L722.0 59.0 Z" fill="#2B1B3D"/><path d="M254.0 226.0 L238.0 226.0" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M226.0 226.0 L238.0 219.0 L238.0 233.0 Z" fill="#2B1B3D"/><path d="M840.0 116.0 L840.0 162.0" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M840.0 174.0 L833.0 162.0 L847.0 162.0 Z" fill="#2B1B3D"/><path d="M60 176 V122" stroke="#756986" stroke-width="3" stroke-dasharray="7 6" fill="none"/><path d="M60 116 l-7 10 h14 z" fill="#756986"/><text x="72.0" y="152.0" font-size="13" font-weight="700" fill="#756986" text-anchor="start" font-style="italic">Prossimo pianeta</text></g>
</svg>
