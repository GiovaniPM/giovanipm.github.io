<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ciclo di stato di una riga d'ordine di acquisto</title>
<desc id="d">Esempio di regole di attività di un ordine OP: 220 inserimento ordine, 230 approvazione, 280 stampa e invio al fornitore, 400 ricevimento, 999 chiuso. Una riga può anche passare a 980, annullata. Ogni riga della F4311 memorizza l'ultimo stato (LTTR) e lo stato successivo (NXTR); la quantità ordinata è UORG, quella ricevuta è UREC e l'importo aperto è AOPN. I codici variano secondo le regole di attività configurate nella P40204.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="42.0" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Stato di una riga d'ordine di acquisto</text>
<text x="500.0" y="68.0" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Ogni riga della F4311 ha un ultimo stato (LTTR) e uno stato successivo (NXTR)</text>
<rect x="40" y="110" width="150" height="110" rx="14" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2.2"/>
<text x="115.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">220</text>
<text x="115.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Inserimento</text>
<text x="115.0" y="199.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">ordine</text>
<polyline points="190,165 228,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="230" y="110" width="150" height="110" rx="14" fill="#FFF1C9" stroke="#B35300" stroke-width="2.2"/>
<text x="305.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">230</text>
<text x="305.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Approvazione</text>
<polyline points="380,165 418,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="110" width="150" height="110" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.2"/>
<text x="495.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">280</text>
<text x="495.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Stampa /</text>
<text x="495.0" y="199.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">invio</text>
<polyline points="570,165 608,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="610" y="110" width="150" height="110" rx="14" fill="#E2F6F2" stroke="#0E8074" stroke-width="2.2"/>
<text x="685.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">400</text>
<text x="685.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Ricevimento</text>
<polyline points="760,165 798,165" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="800" y="110" width="150" height="110" rx="14" fill="#E2F6F2" stroke="#0E8074" stroke-width="2.2"/>
<text x="875.0" y="152.0" font-size="28" fill="#2B1B3D" text-anchor="middle" font-weight="700">999</text>
<text x="875.0" y="180.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Chiuso</text>
<rect x="420" y="262" width="150" height="70" rx="14" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2.2"/>
<text x="495.0" y="294.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">980</text>
<text x="495.0" y="318.0" font-size="13.5" fill="#3E3350" text-anchor="middle" font-weight="700">Annullato</text>
<polyline points="115,220 115,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="305,220 305,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="495,220 495,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="685,220 685,240 495,240" fill="none" stroke="#E23B3B" stroke-width="1.6" stroke-dasharray="4 4"/>
<polyline points="495,240 495,260" fill="none" stroke="#E23B3B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ae)"/>
<rect x="40" y="360" width="440" height="130" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="260.0" y="393.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Campi utili nella F4311</text>
<text x="260.0" y="411.5" font-size="12.5" fill="#3E3350" text-anchor="middle">DOCO / DCTO / KCOO: numero, tipo e società</text>
<text x="260.0" y="430.0" font-size="12.5" fill="#3E3350" text-anchor="middle">LNID: riga   ·   LITM: articolo</text>
<text x="260.0" y="448.5" font-size="12.5" fill="#3E3350" text-anchor="middle">UORG: qtà ordinata   ·   UREC: qtà ricevuta</text>
<text x="260.0" y="467.0" font-size="12.5" fill="#3E3350" text-anchor="middle">AOPN: importo aperto</text>
<rect x="510" y="360" width="450" height="62" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="735.0" y="377.5" font-size="13" fill="#3E3350" text-anchor="middle">Esempio di risposta:  LTTR = 280, NXTR = 400</text>
<text x="735.0" y="396.0" font-size="13" fill="#3E3350" text-anchor="middle">→ ordine inviato, in attesa di ricevimento</text>
<rect x="510" y="430" width="450" height="60" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="735.0" y="446.5" font-size="12.5" fill="#3E3350" text-anchor="middle">Codici illustrativi: verifica le regole di attività (P40204)</text>
<text x="735.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">del tipo d'ordine e di riga nel tuo ambiente.</text>
</svg>
