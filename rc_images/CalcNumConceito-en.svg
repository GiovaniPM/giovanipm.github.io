<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">What numerical analysis does</title>
<desc id="d">Four-step flow. A continuous problem, such as finding the square root of 2, the area under a curve or the solution of an equation, becomes an algorithm with finitely many steps of addition, subtraction, multiplication and division. The algorithm produces an approximate answer, such as 1.41421, and the error is measured. If the error is still too large, the algorithm repeats. Below, the three kinds of error: model error, when the equation simplifies reality; truncation error, when we stop an infinite process; and rounding error, when we keep only a few decimal places.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">What numerical analysis does</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Trading the “impossible exact” for the “reliable approximate”</text><rect x="40" y="110" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="140" y="140" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700">Problem</text><text x="140" y="166" font-size="14" fill="#2B1B3D" text-anchor="middle">√2 = ?</text><text x="140" y="186" font-size="14" fill="#2B1B3D" text-anchor="middle">area under a curve</text><text x="140" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">equation with no formula</text><line x1="244" y1="185" x2="276" y2="185" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="280" y="110" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><text x="380" y="140" font-size="18" fill="#3A86FF" text-anchor="middle" font-weight="700">Algorithm</text><text x="380" y="166" font-size="14" fill="#2B1B3D" text-anchor="middle">finitely many steps</text><text x="380" y="186" font-size="14" fill="#2B1B3D" text-anchor="middle">+  −  ×  ÷</text><text x="380" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">repeated many times</text><line x1="484" y1="185" x2="516" y2="185" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="520" y="110" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="620" y="140" font-size="18" fill="#2A9D8F" text-anchor="middle" font-weight="700">Answer</text><text x="620" y="166" font-size="14" fill="#2B1B3D" text-anchor="middle">1.41421…</text><text x="620" y="186" font-size="14" fill="#2B1B3D" text-anchor="middle">a number</text><text x="620" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">you can actually use</text><line x1="724" y1="185" x2="756" y2="185" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="760" y="110" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><text x="860" y="140" font-size="18" fill="#B35300" text-anchor="middle" font-weight="700">Measured error</text><text x="860" y="166" font-size="14" fill="#2B1B3D" text-anchor="middle">|error| &lt; 0.00001?</text><text x="860" y="186" font-size="14" fill="#2B1B3D" text-anchor="middle">yes: stop</text><text x="860" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">no: repeat</text><path d="M 860 262 C 860 320 520 320 520 266" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ac)"/><text x="690" y="330" font-size="14" fill="#FF6B6B" text-anchor="middle" font-weight="700">error too large? go back and improve</text><text x="500" y="378" font-size="18" fill="#2B1B3D" text-anchor="middle" font-weight="700">Where does the error come from?</text><rect x="40" y="400" width="280" height="90" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="180" y="432" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Model</text><text x="180" y="462" font-size="14" fill="#2B1B3D" text-anchor="middle">the equation simplifies the world</text><rect x="360" y="400" width="280" height="90" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><text x="500" y="432" font-size="17" fill="#3A86FF" text-anchor="middle" font-weight="700">Truncation</text><text x="500" y="462" font-size="14" fill="#2B1B3D" text-anchor="middle">we stop an infinite process</text><rect x="680" y="400" width="280" height="90" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><text x="820" y="432" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">Rounding</text><text x="820" y="462" font-size="14" fill="#2B1B3D" text-anchor="middle">we keep only a few digits</text>
</svg>
