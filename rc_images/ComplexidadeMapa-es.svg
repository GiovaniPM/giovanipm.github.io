<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">El mapa de las clases de complejidad</title>
<desc id="d">Diagrama de conjuntos, suponiendo P distinto de NP. Entre todos los problemas están los decidibles, que una computadora resuelve aunque sea lentamente, y los indecidibles, como el problema de la parada, que ninguna computadora resuelve. Dentro de los decidibles está EXP, tiempo exponencial, con el ajedrez de n por n. Dentro de EXP está NP, problemas fáciles de verificar, y dentro de NP está P, fáciles de resolver, como ordenar una lista, encontrar una ruta de GPS y verificar si un número es primo. En el borde de NP están los problemas NP-completos, como Sudoku, Buscaminas y Tetris. La región punteada NP-difícil incluye a los NP-completos y va más allá de NP, con problemas al menos tan difíciles como ellos, como Candy Crush y Mario.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="620" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">El mapa de las clases de complejidad</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Como los científicos creen que es (suponiendo P ≠ NP)</text>
<defs><clipPath id="npc"><ellipse cx="310" cy="385" rx="200" ry="125"/></clipPath></defs><rect x="40" y="94" width="920" height="506" rx="18" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><text x="60" y="120" font-size="15" fill="#2B1B3D" font-weight="700">Todos los problemas</text>
<rect x="775" y="140" width="170" height="440" rx="14" fill="#FDE3E3" stroke="#E23B3B" stroke-width="2.5"/><text x="860" y="172" font-size="16" fill="#E23B3B" text-anchor="middle" font-weight="700">Indecidibles</text>
<text x="860" y="196" font-size="12.5" fill="#2B1B3D" text-anchor="middle">ninguna computadora</text>
<text x="860" y="214" font-size="12.5" fill="#2B1B3D" text-anchor="middle">los resuelve</text>
<text x="860" y="232" font-size="12.5" fill="#2B1B3D" text-anchor="middle">(problema de la parada)</text>
<rect x="60" y="140" width="700" height="440" rx="110" fill="#F4EEFA" stroke="#5B2A86" stroke-width="2.5"/><text x="410" y="168" font-size="14" fill="#5B2A86" text-anchor="middle" font-weight="700">Decidibles: una computadora los resuelve, aunque sea lentamente</text>
<ellipse cx="360" cy="385" rx="255" ry="175" fill="#FFF3D6" stroke="#D99A00" stroke-width="2.5"/><text x="360" y="236" font-size="14.5" fill="#8A5A00" text-anchor="middle" font-weight="700">EXP: tiempo exponencial</text>
<text x="360" y="254" font-size="12.5" fill="#8A5A00" text-anchor="middle" font-style="italic">ajedrez de n × n</text>
<ellipse cx="310" cy="385" rx="200" ry="125" fill="#E5EEFF" stroke="#3A86FF" stroke-width="2.5"/><text x="295" y="306" font-size="14.5" fill="#3A86FF" text-anchor="middle" font-weight="700">NP: fácil de verificar</text>
<rect x="425" y="250" width="100" height="270" fill="#FF6B6B" clip-path="url(#npc)"/><ellipse cx="310" cy="385" rx="200" ry="125" fill="none" stroke="#3A86FF" stroke-width="2.5"/><text x="468" y="390" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">NP-C</text>
<line x1="505" y1="420" x2="594" y2="452" stroke="#2B1B3D" stroke-width="1.5"/><text x="600" y="462" font-size="13" fill="#2B1B3D" font-weight="700">NP-completo</text>
<text x="600" y="480" font-size="12" fill="#2B1B3D">Sudoku</text>
<text x="600" y="496" font-size="12" fill="#2B1B3D">Buscaminas</text>
<text x="600" y="512" font-size="12" fill="#2B1B3D">Tetris</text>
<rect x="418" y="268" width="532" height="296" rx="40" fill="none" stroke="#E23B3B" stroke-width="2.5" stroke-dasharray="8 6"/><text x="690" y="300" font-size="15" fill="#E23B3B" text-anchor="middle" font-weight="700">NP-difícil</text>
<text x="690" y="320" font-size="12" fill="#2B1B3D" text-anchor="middle" font-style="italic">al menos tan difícil</text>
<text x="690" y="336" font-size="12" fill="#2B1B3D" text-anchor="middle" font-style="italic">como los</text>
<text x="690" y="352" font-size="12" fill="#2B1B3D" text-anchor="middle" font-style="italic">NP-completos</text>
<text x="690" y="368" font-size="12" fill="#2B1B3D" text-anchor="middle" font-style="italic">(Candy Crush, Mario)</text>
<ellipse cx="250" cy="400" rx="115" ry="72" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/><text x="250" y="367" font-size="14" fill="#2A9D8F" text-anchor="middle" font-weight="700">P: fácil de resolver</text>
<text x="250" y="391" font-size="12" fill="#2B1B3D" text-anchor="middle">ordenar una lista</text>
<text x="250" y="408" font-size="12" fill="#2B1B3D" text-anchor="middle">ruta de GPS</text>
<text x="250" y="425" font-size="12" fill="#2B1B3D" text-anchor="middle">prueba de primalidad</text>
</svg>
