<text x="500" y="44" font-size="26" fill="#2B1B3D" font-weight="700" text-anchor="middle">En cuánto tiempo se paga cada grupo</text>
<text x="188" y="108.8" font-size="14.5" fill="#2B1B3D" text-anchor="end">Naranja</text><rect x="200" y="89" width="237.5" height="29" rx="4" fill="#F28C28"/><text x="445.5" y="108.8" font-size="14" fill="#2B1B3D" font-weight="700">30 jugadas</text><text x="188" y="148.8" font-size="14.5" fill="#2B1B3D" text-anchor="end">Azul oscuro</text><rect x="200" y="129" width="273.7" height="29" rx="4" fill="#1E4FA3"/><text x="481.7" y="148.8" font-size="14" fill="#2B1B3D" font-weight="700">35 jugadas</text><text x="188" y="188.8" font-size="14.5" fill="#2B1B3D" text-anchor="end">Rojo</text><rect x="200" y="169" width="274.8" height="29" rx="4" fill="#D9342B"/><text x="482.8" y="188.8" font-size="14" fill="#2B1B3D" font-weight="700">35 jugadas</text><text x="188" y="228.8" font-size="14.5" fill="#2B1B3D" text-anchor="end">Amarillo</text><rect x="200" y="209" width="281.3" height="29" rx="4" fill="#F7D02C"/><text x="489.3" y="228.8" font-size="14" fill="#2B1B3D" font-weight="700">36 jugadas</text><text x="188" y="268.8" font-size="14.5" fill="#2B1B3D" text-anchor="end">Verde</text><rect x="200" y="249" width="319.9" height="29" rx="4" fill="#1F9D55"/><text x="527.9" y="268.8" font-size="14" fill="#2B1B3D" font-weight="700">41 jugadas</text><text x="188" y="308.8" font-size="14.5" fill="#2B1B3D" text-anchor="end">Celeste</text><rect x="200" y="289" width="329.8" height="29" rx="4" fill="#8ED1F0"/><text x="537.8" y="308.8" font-size="14" fill="#2B1B3D" font-weight="700">42 jugadas</text><text x="188" y="348.8" font-size="14.5" fill="#2B1B3D" text-anchor="end">Rosa</text><rect x="200" y="329" width="339.5" height="29" rx="4" fill="#D9418E"/><text x="547.5" y="348.8" font-size="14" fill="#2B1B3D" font-weight="700">43 jugadas</text><text x="188" y="388.8" font-size="14.5" fill="#2B1B3D" text-anchor="end">Marrón</text><rect x="200" y="369" width="620.0" height="29" rx="4" fill="#8B5A2B"/><text x="828.0" y="388.8" font-size="14" fill="#2B1B3D" font-weight="700">79 jugadas</text><text x="500" y="424" font-size="13.5" fill="#5E5170" text-anchor="middle">La cuenta: costo del grupo con 3 casas por lote, dividido por el alquiler esperado en cada jugada de un rival.</text><text x="500" y="442" font-size="13.5" fill="#5E5170" text-anchor="middle">Menos es mejor.</text>
