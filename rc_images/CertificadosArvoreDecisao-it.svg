<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Personalizzare o evolvere il processo</title>
<desc id="d">Albero decisionale con due domande e tre strade. Davanti alla richiesta di un nuovo sistema, chiedersi prima perché il processo esiste. Prima domanda: è un vantaggio competitivo? Se sì, personalizzare, perché è qualcosa che il concorrente non sa replicare. Se no, seconda domanda: l’IA elimina intere fasi? Se sì, riprogettare il flusso da zero. Se no, evolvere il processo con buone pratiche e strumenti standard, come in finanza, HR e acquisti. Un avviso ricorda che automatizzare un processo sbagliato produce solo errori su larga scala.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="600" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Personalizzare o evolvere il processo?</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Due domande, tre strade</text>

<rect x="290" y="96" width="420" height="72" rx="12" fill="#2B1B3D"/>
<text x="500" y="126" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Richiesta di un nuovo sistema</text>
<text x="500" y="150" font-size="13" fill="#FFD9A0" text-anchor="middle" font-style="italic">prima del codice: perché esiste questo processo?</text>

<g stroke="#2B1B3D" stroke-width="2.5" fill="none" marker-end="url(#ar)">
<line x1="500" y1="168" x2="500" y2="196"/>
<line x1="340" y1="255" x2="274" y2="255"/>
<line x1="500" y1="310" x2="500" y2="341"/>
<line x1="660" y1="400" x2="726" y2="400"/>
<line x1="500" y1="455" x2="500" y2="491"/>
</g>
<g font-size="14" font-weight="700">
<text x="307" y="245" fill="#2A9D8F" text-anchor="middle">Sì</text>
<text x="515" y="332" fill="#E23B3B">No</text>
<text x="693" y="390" fill="#2A9D8F" text-anchor="middle">Sì</text>
<text x="515" y="478" fill="#E23B3B">No</text>
</g>

<path d="M500 200 L660 255 L500 310 L340 255 z" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500" y="250" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">È un vantaggio</text>
<text x="500" y="270" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">competitivo?</text>

<path d="M500 345 L660 400 L500 455 L340 400 z" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500" y="395" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">L’IA elimina</text>
<text x="500" y="415" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">intere fasi?</text>

<rect x="50" y="215" width="220" height="80" rx="12" fill="#3A86FF"/>
<text x="160" y="246" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Personalizzare</text>
<text x="160" y="268" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">ciò che il concorrente</text>
<text x="160" y="285" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">non sa replicare</text>

<rect x="730" y="360" width="220" height="80" rx="12" fill="#FF6B6B"/>
<text x="840" y="394" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Riprogettare</text>
<text x="840" y="418" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">il flusso da zero</text>

<rect x="310" y="495" width="380" height="84" rx="12" fill="#2A9D8F"/>
<text x="500" y="525" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Evolvere il processo</text>
<text x="500" y="547" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">buone pratiche e strumenti standard</text>
<text x="500" y="566" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">es.: finanza, HR, acquisti</text>

<rect x="730" y="205" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2" stroke-dasharray="6 4"/>
<text x="840" y="236" font-size="14" fill="#E23B3B" text-anchor="middle" font-weight="700">Attenzione</text>
<text x="840" y="260" font-size="13" fill="#2B1B3D" text-anchor="middle">Automatizzare un processo</text>
<text x="840" y="279" font-size="13" fill="#2B1B3D" text-anchor="middle">sbagliato produce solo</text>
<text x="840" y="298" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">errori su larga scala</text>
</svg>
