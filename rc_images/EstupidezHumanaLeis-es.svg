<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 0 1160 720" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Comprender la estupidez humana</title>
<desc id="d">Comprender la estupidez humana. 1. Subestimar la estupidez: Todos subestiman cuántas personas estúpidas existen. 2. Independencia de la estupidez: La estupidez no depende de otras características. 3. Definición de estupidez: Causar pérdidas a otros sin obtener beneficio para sí mismo. 4. Subestimar el daño: Los no estúpidos subestiman el daño que causan los estúpidos. 5. El peligro de los estúpidos: El estúpido es el tipo de persona más peligroso.</desc>
<rect x="-80" width="1160" height="720" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Comprender la estupidez humana</text>
