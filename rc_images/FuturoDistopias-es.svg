<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Distopías científicas y lo que ya llegó</title>
<desc id="d">Una franja que va de la distopía a la utopía, con cuatro obras. 1984, publicado en 1949 y ambientado en 1984: vigilancia total y control del lenguaje; ya llegaron las cámaras con reconocimiento facial y el capitalismo de la vigilancia. Matrix, de 1999, ambientada hacia 2199: realidad simulada controlada por las máquinas; llegaron la realidad virtual y el argumento de la simulación de Bostrom de 2003. Blade Runner, de 1982, ambientada en 2019: androides indistinguibles de los humanos; llegaron los robots humanoides, los deepfakes y la duda sobre quién es humano. Star Trek, de 1966, ambientada en el siglo XXIII: utopía de abundancia y exploración; llegaron el celular, la tableta, la traducción simultánea y el tricorder del XPRIZE de 2017.</desc>
