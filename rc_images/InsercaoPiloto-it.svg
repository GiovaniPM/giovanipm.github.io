<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cosa fa il pilota automatico</title>
<desc id="d">Sei fasi in sequenza verticale: correggere la rotta di avvicinamento, attendere il punto di frenata, frenare per la cattura, aerofrenata opzionale in linea tratteggiata, regolare agli estremi dell'orbita e, infine, spegnere i motori nella fascia obiettivo. A destra, tre schede: la regola di sicurezza che alza il periasse quando diventa pericoloso, il modo di riprendere il controllo e l'avviso che il risultato non vale come record.</desc>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="590" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Cosa fa il pilota automatico</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Ripete, da solo, la stessa strategia che impari a usare</text>
<rect x="40.0" y="98.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2"/>
<circle cx="72.0" cy="129.0" r="16.0" fill="#3A86FF"/>
<text x="72.0" y="135.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="100.0" y="123.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Correggere la rotta di avvicinamento</text>
<text x="100.0" y="145.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Ancora lontano, accende di lato finché il periasse previsto entra nella fascia.</text>
<line x1="335.0" y1="161.0" x2="335.0" y2="175.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="178.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="72.0" cy="209.0" r="16.0" fill="#5B2A86"/>
<text x="72.0" y="215.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="100.0" y="203.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Attendere il punto di frenata</text>
<text x="100.0" y="225.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Calcola quando iniziare a frenare per centrare l'accensione sul periasse.</text>
<line x1="335.0" y1="241.0" x2="335.0" y2="255.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="258.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#D62828" stroke-width="2"/>
<circle cx="72.0" cy="289.0" r="16.0" fill="#D62828"/>
<text x="72.0" y="295.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<text x="100.0" y="283.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Frenare per la cattura</text>
<text x="100.0" y="305.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Frena contro il moto, tenendo fermo il periasse, finché l'apoasse scende.</text>
<line x1="335.0" y1="321.0" x2="335.0" y2="335.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="338.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="72.0" cy="369.0" r="16.0" fill="#FF6B6B"/>
<text x="72.0" y="375.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<text x="100.0" y="363.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Aerofrenata (solo a volte)</text>
<text x="100.0" y="385.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Con scudo e poco Δv, attraversa l'aria al 55% della sua altezza.</text>
<line x1="335.0" y1="401.0" x2="335.0" y2="415.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="418.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<circle cx="72.0" cy="449.0" r="16.0" fill="#B35300"/>
<text x="72.0" y="455.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<text x="100.0" y="443.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Regolare agli estremi</text>
<text x="100.0" y="465.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Al periasse corregge l'apoasse; all'apoasse corregge il periasse.</text>
<line x1="335.0" y1="481.0" x2="335.0" y2="495.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="498.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<circle cx="72.0" cy="529.0" r="16.0" fill="#0E8074"/>
<text x="72.0" y="535.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">6</text>
<text x="100.0" y="523.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Motori spenti</text>
<text x="100.0" y="545.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Con Pe e Ap nella fascia, attende che la missione si concluda.</text>
<rect x="670.0" y="98.0" width="290.0" height="140.0" rx="12" fill="#FFF1C9" stroke="#FFB703" stroke-width="2"/>
<text x="690.0" y="132.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Prima la sicurezza</text>
<text x="690.0" y="164.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Se il periasse diventa pericoloso,</text>
<text x="690.0" y="185.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">lo alza prima di tutto.</text>
<rect x="670.0" y="258.0" width="290.0" height="140.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="690.0" y="292.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Riprendi quando vuoi</text>
<text x="690.0" y="324.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Qualsiasi comando del motore</text>
<text x="690.0" y="345.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">ti restituisce il controllo.</text>
<rect x="670.0" y="418.0" width="290.0" height="140.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="690.0" y="452.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Niente record</text>
<text x="690.0" y="484.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Le missioni col pilota non</text>
<text x="690.0" y="505.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">entrano nel tuo miglior risultato.</text>
</svg>
