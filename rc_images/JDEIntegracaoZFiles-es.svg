<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 568" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Flujo de las tablas Z de entrada y de salida</title>
<desc id="d">Entrada: el sistema externo escribe en la tabla Z F4201Z1/F4211Z1 con el indicador EDSP abierto; el UBE procesador R4211Z1I, con versión y opciones de proceso, llama a la master business function F4211FS con las reglas del P4210 y escribe en F4201/F4211, poniendo EDSP = 1. En caso de error de validación el mensaje va al Work Center y el registro queda en la tabla Z para ser corregido y reprocesado. Salida: una transacción en JDE, según las opciones de proceso y el P0047, escribe en la tabla Z con código de acción A, C o D; el sistema externo la lee y la marca como procesada; una purga elimina los registros procesados.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="568" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tablas Z: interoperabilidad batch</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">La tabla Z es un área de espera; el UBE procesador aplica las mismas reglas que la aplicación</text>
<rect x="20" y="92" width="960" height="262" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#756986" text-anchor="start" font-weight="700">DE ENTRADA (INBOUND)</text>
<rect x="40" y="140" width="168" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="124.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistema externo</text>
<text x="124.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">SQL, ETL, iPaaS</text>
<text x="124.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">u orquestación</text>
<rect x="228" y="140" width="168" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="312.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tablas Z</text>
<text x="312.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">F4201Z1 / F4211Z1</text>
<text x="312.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">EDSP = abierto</text>
<rect x="416" y="140" width="168" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE procesador</text>
<text x="500.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">R4211Z1I</text>
<text x="500.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">versión + opciones</text>
<rect x="604" y="140" width="168" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="688.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Master BSFN</text>
<text x="688.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">F4211FS…</text>
<text x="688.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">reglas del P4210</text>
<rect x="792" y="140" width="168" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="876.0" y="166.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tablas finales</text>
<text x="876.0" y="185.0" font-size="12.5" fill="#3E3350" text-anchor="middle">F4201 / F4211</text>
<text x="876.0" y="203.5" font-size="12.5" fill="#3E3350" text-anchor="middle">EDSP = 1</text>
<polyline points="208,180 226,180" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="396,180 414,180" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="584,180 602,180" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="772,180 790,180" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="688.0,220 688.0,262" fill="none" stroke="#E23B3B" stroke-width="2" marker-end="url(#ae)"/>
<rect x="560" y="264" width="256" height="70" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="688.0" y="286.0" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Error de validación</text>
<text x="688.0" y="303.9" font-size="12.0" fill="#3E3350" text-anchor="middle">mensaje en el Work Center</text>
<text x="688.0" y="321.7" font-size="12.0" fill="#3E3350" text-anchor="middle">el registro queda en la tabla Z</text>
<polyline points="560,300 312.0,300 312.0,222" fill="none" stroke="#E23B3B" stroke-width="2" marker-end="url(#ae)"/>
<text x="400" y="292" font-size="12.5" fill="#B3261E" text-anchor="middle" font-style="italic">corregir y reprocesar</text>
<rect x="20" y="372" width="960" height="176" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="396" font-size="13" fill="#756986" text-anchor="start" font-weight="700">DE SALIDA (OUTBOUND)</text>
<rect x="40" y="420" width="168" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="124.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Transacción en JDE</text>
<text x="124.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">ej.: pedido en el</text>
<text x="124.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">P4210</text>
<rect x="228" y="420" width="168" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="312.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Control de salida</text>
<text x="312.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">opciones de proc. /</text>
<text x="312.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">P0047</text>
<rect x="416" y="420" width="168" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tablas Z</text>
<text x="500.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">F4211Z1</text>
<text x="500.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">EDTC = A, C, D</text>
<rect x="604" y="420" width="168" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="688.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistema externo</text>
<text x="688.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">lee y marca</text>
<text x="688.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">como procesado</text>
<rect x="792" y="420" width="168" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="876.0" y="446.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Purga</text>
<text x="876.0" y="465.0" font-size="12.5" fill="#3E3350" text-anchor="middle">elimina los registros</text>
<text x="876.0" y="483.5" font-size="12.5" fill="#3E3350" text-anchor="middle">procesados</text>
<polyline points="208,460 226,460" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="396,460 414,460" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="584,460 602,460" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="772,460 790,460" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
</svg>
