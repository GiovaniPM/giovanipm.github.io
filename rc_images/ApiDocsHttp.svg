<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Uma requisição HTTP e sua resposta</title>
<desc id="d">O cliente envia uma requisição com método e caminho (GET /ws/01001000/json/), cabeçalhos como Host e Accept, e corpo vazio por ser GET. O servidor devolve uma resposta com código de status 200 OK, cabeçalho Content-Type application/json e o corpo em JSON com o endereço.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#FFF7EC"/>
<rect x="30" y="150" width="150" height="160" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="105" y="214" font-size="21" font-weight="700" fill="#2B1B3D" text-anchor="middle">Cliente</text>
<text x="105" y="240" font-size="13" font-weight="400" fill="#3E3350" text-anchor="middle">navegador,</text>
<text x="105" y="258" font-size="13" font-weight="400" fill="#3E3350" text-anchor="middle">app ou script</text>
<rect x="820" y="150" width="150" height="160" rx="14" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="3"/>
<text x="895" y="222" font-size="21" font-weight="700" fill="#2B1B3D" text-anchor="middle">Servidor</text>
<text x="895" y="248" font-size="13" font-weight="400" fill="#3E3350" text-anchor="middle">a API</text>
<rect x="215" y="40" width="570" height="168" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="232" y="68" font-size="17" font-weight="700" fill="#3A86FF" text-anchor="start">Requisição</text>
<text x="232" y="100" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start" font-family="Consolas, 'Courier New', monospace">GET /ws/01001000/json/ HTTP/1.1</text>
<text x="768" y="100" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="end">método + caminho</text>
<text x="232" y="128" font-size="16" font-weight="400" fill="#2B1B3D" text-anchor="start" font-family="Consolas, 'Courier New', monospace">Host: viacep.com.br</text>
<text x="768" y="128" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="end">cabeçalhos</text>
<text x="232" y="152" font-size="16" font-weight="400" fill="#2B1B3D" text-anchor="start" font-family="Consolas, 'Courier New', monospace">Accept: application/json</text>
<text x="768" y="184" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="end">corpo (vazio em GET)</text>
<path d="M232 176H560" stroke="#756986" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M180 190C200 150 205 125 211 120" fill="none" stroke="#2B1B3D" stroke-width="3" marker-end="url(#a)"/>
<path d="M785 120C800 130 810 160 818 186" fill="none" stroke="#2B1B3D" stroke-width="3" marker-end="url(#a)"/>
<rect x="215" y="250" width="570" height="178" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.5"/>
<text x="232" y="278" font-size="17" font-weight="700" fill="#C2185B" text-anchor="start">Resposta</text>
<text x="232" y="310" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start" font-family="Consolas, 'Courier New', monospace">HTTP/1.1 200 OK</text>
<text x="768" y="310" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="end">código de status</text>
<text x="232" y="338" font-size="16" font-weight="400" fill="#2B1B3D" text-anchor="start" font-family="Consolas, 'Courier New', monospace">Content-Type: application/json</text>
<text x="768" y="338" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="end">cabeçalhos</text>
<text x="232" y="372" font-size="16" font-weight="400" fill="#2B1B3D" text-anchor="start" font-family="Consolas, 'Courier New', monospace">{ "cep": "01001-000",</text>
<text x="768" y="372" font-size="14" font-weight="700" fill="#5B2A86" text-anchor="end">corpo em JSON</text>
<text x="232" y="398" font-size="16" font-weight="400" fill="#2B1B3D" text-anchor="start" font-family="Consolas, 'Courier New', monospace">  "localidade": "São Paulo", … }</text>
<path d="M232 354H560" stroke="#756986" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M820 280C805 300 795 320 789 336" fill="none" stroke="#C2185B" stroke-width="3" marker-end="url(#r)"/>
<path d="M215 340C200 330 190 310 184 290" fill="none" stroke="#C2185B" stroke-width="3" marker-end="url(#r)"/>
</svg>
