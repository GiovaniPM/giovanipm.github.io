<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Lei de Wilson: o conhecimento rende juros compostos</title>
<desc id="d">Gráfico com dois caminhos ao longo de 365 dias. Quem melhora 1% por dia termina o ano 37,8 vezes melhor: 2,4 vezes em 90 dias, 6 vezes em 180 e 14,7 vezes em 270. Quem piora 1% por dia termina com 0,03, quase nada. À direita, um ciclo: conhecimento gera competência, que gera valor entregue, que gera oportunidades e renda, que são reinvestidas em conhecimento.</desc>
