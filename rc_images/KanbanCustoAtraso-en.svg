<rect x="550.0" y="322.0" width="400.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="578" cy="357" r="16" fill="#5B2A86"/>
<text x="578.0" y="363.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">C</text>
<text x="606.0" y="348.0" font-size="12.5" fill="#3E3350">CoD $20k/week · duration 10 wk</text>
<rect x="606" y="360" width="88.0" height="18" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="1"/>
<text x="700.0" y="374.0" font-size="12.5" fill="#2B1B3D" font-weight="700">CD3 = 2.0</text>
<text x="940.0" y="348.0" font-size="13" fill="#C2185B" text-anchor="end" font-weight="700">3rd</text>
<text x="750.0" y="420.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">Do first what brings the most value per week of work.</text>
<text x="500.0" y="465.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Cost of delay (CoD) = value not earned per unit of delay time.</text>
</svg>
