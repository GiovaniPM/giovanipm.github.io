<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">The value lost per week of delay guides priority</text>
<text x="275.0" y="112.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cumulative value of an item</text>
