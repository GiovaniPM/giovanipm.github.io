<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Caja negra, gris y blanca</title>
<desc id="d">Tres cajas lado a lado, cada una con una flecha de entrada y una de salida. La caja negra es opaca, con un signo de pregunta: el tester solo ve entradas y salidas. La caja gris muestra parte del interior, como una base de datos y tablas. La caja blanca muestra el flujo del código, con las ramas. Una barra degradada abajo indica el conocimiento de la estructura interna, de ninguno a total.</desc>
