<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d">
<title id="t">Probabilidad de perder según la posición</title>
<desc id="d">Gráfico de barras con la probabilidad de perder de cada posición, con 4 jugadores. Con 15 parejas (31 cartas, repartidas en 8, 8, 8 y 7): primero en jugar 25,8%, segundo 32,6%, tercero 30,0%, repartidor 11,6%. Con 20 parejas (41 cartas, repartidas en 11, 10, 10 y 10): 25,6%, 25,1%, 24,7% y 24,6%, cerca del 25% de una ronda justa. Resultado de 100 mil rondas simuladas por baraja, con elecciones al azar.</desc>
