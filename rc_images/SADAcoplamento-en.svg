<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Coupling and cohesion: from worst to best</title>
<desc id="d">Two scales from worst to best. Coupling: content, common, external, control, stamp and data. Cohesion: coincidental, logical, temporal, procedural, communicational, sequential and functional. Below, four fully interconnected modules, with high coupling, and four modules with few links, with low coupling. The goal is low coupling and high cohesion.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Coupling and cohesion: from worst to best</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Good modules depend little on each other and do one thing only</text>
<text x="40.0" y="112.0" font-size="16" fill="#2B1B3D" font-weight="700">Coupling</text>
<text x="210.0" y="112.0" font-size="13" fill="#756986" font-style="italic">how much a module depends on others</text>
<rect x="43.0" y="126.0" width="147.3" height="50.0" rx="8" fill="#F4A3A3" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="116.7" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Content</text>
<rect x="196.3" y="126.0" width="147.3" height="50.0" rx="8" fill="#E3AEAC" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="270.0" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Common</text>
<rect x="349.7" y="126.0" width="147.3" height="50.0" rx="8" fill="#D2B9B4" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="423.3" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">External</text>
<rect x="503.0" y="126.0" width="147.3" height="50.0" rx="8" fill="#C0C3BD" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="576.7" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Control</text>
<rect x="656.3" y="126.0" width="147.3" height="50.0" rx="8" fill="#AFCEC5" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="730.0" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Stamp</text>
<rect x="809.7" y="126.0" width="147.3" height="50.0" rx="8" fill="#9ED9CE" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="883.3" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Data</text>
<line x1="60.0" y1="198.0" x2="940.0" y2="198.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="60.0" y="216.0" font-size="12" fill="#D62828" font-weight="700">worse</text>
<text x="940.0" y="216.0" font-size="12" fill="#0E6B61" text-anchor="end" font-weight="700">better</text>
<text x="40.0" y="242.0" font-size="16" fill="#2B1B3D" font-weight="700">Cohesion</text>
<text x="210.0" y="242.0" font-size="13" fill="#756986" font-style="italic">how much a module’s parts belong together</text>
<rect x="43.0" y="256.0" width="125.4" height="50.0" rx="8" fill="#F4A3A3" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="105.7" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Coincidental</text>
<rect x="174.4" y="256.0" width="125.4" height="50.0" rx="8" fill="#E6ACAA" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="237.1" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Logical</text>
<rect x="305.9" y="256.0" width="125.4" height="50.0" rx="8" fill="#D7B5B1" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="368.6" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Temporal</text>
<rect x="437.3" y="256.0" width="125.4" height="50.0" rx="8" fill="#C9BEB8" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="500.0" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Procedural</text>
<rect x="568.7" y="256.0" width="125.4" height="50.0" rx="8" fill="#BBC7C0" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="631.4" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Communicational</text>
<rect x="700.1" y="256.0" width="125.4" height="50.0" rx="8" fill="#ACD0C7" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="762.9" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sequential</text>
<rect x="831.6" y="256.0" width="125.4" height="50.0" rx="8" fill="#9ED9CE" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="894.3" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Functional</text>
<line x1="60.0" y1="328.0" x2="940.0" y2="328.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="60.0" y="346.0" font-size="12" fill="#D62828" font-weight="700">worse</text>
<text x="940.0" y="346.0" font-size="12" fill="#0E6B61" text-anchor="end" font-weight="700">better</text>
<line x1="180" y1="400" x2="320" y2="400" stroke="#D62828" stroke-width="2.5"/><line x1="180" y1="400" x2="180" y2="470" stroke="#D62828" stroke-width="2.5"/><line x1="180" y1="400" x2="320" y2="470" stroke="#D62828" stroke-width="2.5"/><line x1="320" y1="400" x2="180" y2="470" stroke="#D62828" stroke-width="2.5"/><line x1="320" y1="400" x2="320" y2="470" stroke="#D62828" stroke-width="2.5"/><line x1="180" y1="470" x2="320" y2="470" stroke="#D62828" stroke-width="2.5"/><rect x="148.0" y="384.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="288.0" y="384.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="148.0" y="454.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="288.0" y="454.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><text x="250.0" y="378.0" font-size="13.5" fill="#D62828" text-anchor="middle" font-weight="700">high coupling</text>
<line x1="680" y1="400" x2="820" y2="400" stroke="#0E6B61" stroke-width="2.5"/><line x1="680" y1="470" x2="820" y2="470" stroke="#0E6B61" stroke-width="2.5"/><rect x="648.0" y="384.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="788.0" y="384.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="648.0" y="454.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="788.0" y="454.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><text x="750.0" y="378.0" font-size="13.5" fill="#0E6B61" text-anchor="middle" font-weight="700">low coupling</text>
<rect x="395.0" y="405.0" width="210.0" height="60.0" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="430.0" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Goal: low coupling</text>
<text x="500.0" y="448.0" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">and high cohesion</text>
</svg>
