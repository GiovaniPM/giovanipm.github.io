<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dove stanno i dati in SQLite Manager</title>
<desc id="d">Abrir copia il file dal disco al database in memoria. Salvar lo riscrive. Modifiche e SQL cambiano il database in memoria, Reverter lo riporta all'ultimo stato salvato, Importar CSV porta dati e Exportar produce altri formati.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="400" rx="18" fill="#FFF7EC"/>
<rect x="40" y="130" width="220" height="130" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="150" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#2B1B3D">File .sqlite</text>
<text x="150" y="220" text-anchor="middle" font-size="15" fill="#3E3350">sul tuo disco</text>
<rect x="395" y="130" width="250" height="130" rx="14" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="3"/>
<text x="520" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#2B1B3D">Database in memoria</text>
<text x="520" y="218" text-anchor="middle" font-size="13.5" fill="#3E3350">ciò che l'app mostra e modifica</text>
<rect x="780" y="130" width="180" height="130" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="870" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#2B1B3D">Altri formati</text>
<text x="870" y="220" text-anchor="middle" font-size="15" fill="#3E3350">CSV · JSON · .sql</text>
<g stroke="#2B1B3D" stroke-width="3" fill="none">
<path d="M264 170H391" marker-end="url(#a)"/><path d="M391 220H264" marker-end="url(#a)"/>
<path d="M649 170H776" marker-end="url(#a)"/><path d="M776 220H649" marker-end="url(#a)"/>
<path d="M480 130C480 62 560 62 560 126" marker-end="url(#a)"/>
</g>
<path d="M150 260C150 345 520 345 520 266" fill="none" stroke="#C2185B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/>
<text x="327" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#5B2A86">Abrir</text><text x="327" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#5B2A86">Salvar</text><text x="712" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#5B2A86">Exportar</text><text x="712" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#5B2A86">Importar CSV</text><text x="520" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#5B2A86">Modifiche e SQL</text>
<text x="335" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#C2185B">Reverter: torna all'ultimo stato salvato</text>
</svg>
