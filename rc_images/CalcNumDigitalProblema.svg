<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quando o arredondamento custa caro</title>
<desc id="d">Três cartões. Bolsa de Vancouver, 1982 a 1983: o índice começou em 1.000 e era truncado a cada atualização; em 22 meses caiu para 524,811, quando o valor certo era 1.098,892. Míssil Patriot, 1991: o relógio contava décimos de segundo, mas 0,1 não cabe exato em binário; após 100 horas ligado, o erro chegou a 0,34 segundo, e o sistema procurou o míssil inimigo a mais de 600 metros do lugar certo; 28 soldados morreram. Foguete Ariane 5, 1996: um número grande demais foi convertido para um formato de 16 bits, estourou, e o foguete se destruiu 37 segundos após o lançamento.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Quando o arredondamento custa caro</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Pequenos erros, repetidos milhões de vezes</text><rect x="40" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="40" y="100" width="290" height="70" rx="12" fill="#FFF1C9"/><text x="185" y="132" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">Bolsa de Vancouver</text><text x="185" y="156" font-size="14" fill="#B35300" text-anchor="middle">1982–1983</text><text x="185" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">índice começa em 1.000</text><text x="185" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">cortado na 3ª casa</text><text x="185" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">a cada atualização</text><text x="185" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="185" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">22 meses depois:</text><text x="185" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">524,811 ✗</text><text x="185" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">certo: 1.098,892</text><rect x="355" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="355" y="100" width="290" height="70" rx="12" fill="#FF6B6B"/><text x="500" y="132" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Míssil Patriot</text><text x="500" y="156" font-size="14" fill="#FFFFFF" text-anchor="middle">1991</text><text x="500" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">relógio em décimos</text><text x="500" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">0,1 não é exato</text><text x="500" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">em binário</text><text x="500" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="500" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">100 h ligado:</text><text x="500" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">erro de 0,34 s</text><text x="500" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">alvo a &gt; 600 m</text><rect x="670" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="670" y="100" width="290" height="70" rx="12" fill="#5B2A86"/><text x="815" y="132" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Ariane 5</text><text x="815" y="156" font-size="14" fill="#FFFFFF" text-anchor="middle">1996</text><text x="815" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">número grande</text><text x="815" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">convertido para</text><text x="815" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">16 bits</text><text x="815" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="815" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">estouro (overflow)</text><text x="815" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">autodestruição</text><text x="815" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">37 s após lançar</text>
</svg>
