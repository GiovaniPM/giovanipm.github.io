<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Four ways to replace the old system with the new one</title>
<desc id="d">Four timelines. Direct cutover: the old system is switched off and the new one starts at the same moment. Parallel: both run together for a period and results are compared. Pilot: the new system goes live first at one site and then at all of them. Phased: the new system replaces the old one module by module.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="525" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Four ways to replace the old system with the new one</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">What changes is how long both coexist and where the new one starts</text>
<text x="30.0" y="124.0" font-size="15" fill="#2B1B3D" font-weight="700">Direct cutover</text>
<text x="30.0" y="144.0" font-size="12" fill="#756986" font-style="italic">high risk, low cost</text>
<rect x="250" y="112" width="350" height="22" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/><text x="258.0" y="129.0" font-size="11" fill="#2B1B3D" font-weight="700">old</text>
<rect x="600" y="112" width="360" height="22" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="608.0" y="129.0" font-size="11" fill="#FFFFFF" font-weight="700">new</text>
<line x1="600" y1="104" x2="600" y2="144" stroke="#D62828" stroke-width="3"/>
<text x="30.0" y="220.0" font-size="15" fill="#2B1B3D" font-weight="700">Parallel</text>
<text x="30.0" y="240.0" font-size="12" fill="#756986" font-style="italic">low risk, high cost</text>
<rect x="250" y="202" width="470" height="18" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/><text x="258.0" y="215.0" font-size="11" fill="#2B1B3D" font-weight="700">old</text>
<rect x="480" y="224" width="480" height="18" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="488.0" y="237.0" font-size="11" fill="#FFFFFF" font-weight="700">new</text>
<rect x="480" y="198" width="240" height="48" rx="6" fill="none" stroke="#B35300" stroke-width="2" stroke-dasharray="5 4"/>
<text x="600.0" y="260.0" font-size="11.5" fill="#B35300" text-anchor="middle" font-weight="700">both run together and results are compared</text>
<text x="30.0" y="316.0" font-size="15" fill="#2B1B3D" font-weight="700">Pilot</text>
<text x="30.0" y="336.0" font-size="12" fill="#756986" font-style="italic">risk limited to one site</text>
<rect x="250" y="298" width="470" height="18" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/><text x="258.0" y="311.0" font-size="11" fill="#2B1B3D" font-weight="700">old</text>
<rect x="430" y="320" width="530" height="12" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/>
<text x="436.0" y="346.0" font-size="11.5" fill="#5B2A86" font-weight="700">new system at a pilot site</text>
<rect x="720" y="298" width="240" height="18" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="728.0" y="311.0" font-size="11" fill="#FFFFFF" font-weight="700">all sites</text>
<text x="30.0" y="412.0" font-size="15" fill="#2B1B3D" font-weight="700">Phased</text>
<text x="30.0" y="432.0" font-size="12" fill="#756986" font-style="italic">risk spread out, slower</text>
<rect x="250" y="392" width="170" height="16" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/>
<rect x="420" y="392" width="540" height="16" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="428.0" y="403.0" font-size="11" fill="#FFFFFF" font-weight="700">module A</text>
<rect x="250" y="412" width="340" height="16" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/>
<rect x="590" y="412" width="370" height="16" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="598.0" y="423.0" font-size="11" fill="#FFFFFF" font-weight="700">module B</text>
<rect x="250" y="432" width="510" height="16" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/>
<rect x="760" y="432" width="200" height="16" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/><text x="768.0" y="443.0" font-size="11" fill="#FFFFFF" font-weight="700">module C</text>
<line x1="250.0" y1="492.0" x2="960.0" y2="492.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="960.0" y="510.0" font-size="12" fill="#756986" text-anchor="end">time →</text>
<rect x="30" y="470" width="30" height="14" rx="4" fill="#C9BEDA" stroke="#2B1B3D" stroke-width="1.2"/>
<text x="66.0" y="482.0" font-size="12" fill="#3E3350">old</text>
<rect x="30" y="494" width="30" height="14" rx="4" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.2"/>
<text x="66.0" y="506.0" font-size="12" fill="#3E3350">new</text>
</svg>
