<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">TheBrain timeline</title>
<desc id="d">Timeline: 1993, Harlan Hugh conceives the idea of focusing on the connections between pieces of information; 1996, Natrificial is founded, later becoming TheBrain Technologies; 2013, TheBrain 8 adopts the TheBrain name in place of PersonalBrain; 2023, the REST API is launched; 2026, TheBrain 15, with Cerebro AI, five platforms on one codebase, a free app and a local API.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="340" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">TheBrain timeline</text>
<text x="500.0" y="72" font-size="15" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">From an idea about connections to a free, AI-powered app</text>
<path d="M50 185 L950 185" fill="none" stroke="#756986" stroke-width="3" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="120" y="160" font-size="24" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">1993</text>
<circle cx="120" cy="185" r="9" fill="#EFE3FA" stroke="#5B2A86" stroke-width="3"/>
<rect x="32" y="208" width="176" height="86" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="1.5"/>
<text x="120" y="232" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">Harlan Hugh conceives</text>
<text x="120" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">the idea of focusing on</text>
<text x="120" y="272" font-size="13.0" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">connections, not folders</text>
<text x="310" y="160" font-size="24" fill="#0E8074" text-anchor="middle" font-weight="700" xml:space="preserve">1996</text>
<circle cx="310" cy="185" r="9" fill="#E2F6F2" stroke="#0E8074" stroke-width="3"/>
<rect x="222" y="208" width="176" height="86" rx="10" fill="#E2F6F2" stroke="#0E8074" stroke-width="1.5"/>
<text x="310" y="232" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">Natrificial is founded,</text>
<text x="310" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">later becoming</text>
<text x="310" y="272" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">TheBrain Technologies</text>
<text x="500" y="160" font-size="24" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">2013</text>
<circle cx="500" cy="185" r="9" fill="#FFE3E3" stroke="#D62828" stroke-width="3"/>
<rect x="412" y="208" width="176" height="86" rx="10" fill="#FFE3E3" stroke="#D62828" stroke-width="1.5"/>
<text x="500" y="232" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">TheBrain 8: the name</text>
<text x="500" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">PersonalBrain gives</text>
<text x="500" y="272" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">way to TheBrain</text>
<text x="690" y="160" font-size="24" fill="#1F5FCC" text-anchor="middle" font-weight="700" xml:space="preserve">2023</text>
<circle cx="690" cy="185" r="9" fill="#E3EEFF" stroke="#1F5FCC" stroke-width="3"/>
<rect x="602" y="208" width="176" height="86" rx="10" fill="#E3EEFF" stroke="#1F5FCC" stroke-width="1.5"/>
<text x="690" y="232" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">REST API launched</text>
<text x="690" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">(November), with a</text>
<text x="690" y="272" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">per-user access key</text>
<text x="880" y="160" font-size="24" fill="#B35300" text-anchor="middle" font-weight="700" xml:space="preserve">2026</text>
<circle cx="880" cy="185" r="9" fill="#FFF1C9" stroke="#B35300" stroke-width="3"/>
<rect x="792" y="208" width="176" height="86" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="1.5"/>
<text x="880" y="232" font-size="13.0" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">TheBrain 15: Cerebro AI,</text>
<text x="880" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">5 platforms, free app</text>
<text x="880" y="272" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">and a local API</text>
</svg>
