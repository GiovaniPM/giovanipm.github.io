<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il Plex: il pensiero attivo al centro</title>
<desc id="d">Il pensiero attivo Viti è al centro. Sopra, il genitore Elementi di fissaggio. Sotto, i figli Vite M8x30, Vite M6x20 e Vite M10x40. A sinistra, collegati da salti, ISO 4017 e Metallurgica Alfa. A destra, i fratelli Dadi e Rondelle, che hanno lo stesso genitore.</desc>
