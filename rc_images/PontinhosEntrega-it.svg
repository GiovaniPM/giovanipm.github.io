<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
<title id="t">Regalare due quadrati: dall’estremità o dal centro</title>
<desc id="d">Due disegni di una catena di 2 quadrati. A sinistra, la catena è stata aperta da un’estremità: solo il primo quadrato ha tre lati, e chi la riceve può rifiutarli entrambi tracciando l’altra estremità. A destra, la catena è stata aperta con la linea centrale: entrambi i quadrati hanno tre lati, ciascuno chiuso da una linea diversa, e non si possono rifiutare entrambi con una sola mossa.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">Regalare due quadrati: dall’estremità o dal centro</text>
<g transform="translate(133.9 76) scale(1.35)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="ln last" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="gridln" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/></g><line x1="331.0" y1="111.1" x2="331.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><text x="250" y="261.20000000000005" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">Dall’estremità</text><text x="250" y="282.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">Chi riceve può prenderli entrambi o</text><text x="250" y="303.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">rifiutarli, tracciando l’altra estremità,</text><text x="250" y="324.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">e tenere il controllo.</text><g transform="translate(633.9 76) scale(1.35)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="gridln" x1="26" y1="26" x2="26" y2="86"/><line class="ln last" style="--len:60" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/></g><line x1="669.0" y1="111.1" x2="669.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><line x1="831.0" y1="111.1" x2="831.0" y2="192.1" stroke="#C2185B" stroke-width="8.100000000000001" stroke-linecap="round" stroke-dasharray="10.8 10.8"/><text x="750" y="261.20000000000005" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">Dal centro</text><text x="750" y="282.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">Ogni quadrato si chiude con la sua linea.</text><text x="750" y="303.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">Non si possono rifiutare entrambi</text><text x="750" y="324.20000000000005" text-anchor="middle" font-size="15.5" fill="#756986">con una sola mossa.</text></svg>
