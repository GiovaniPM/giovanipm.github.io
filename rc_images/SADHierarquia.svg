<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cada nível quebra o anterior em partes menores e mais concretas</text>
<rect x="40.0" y="100.0" width="600.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<rect x="40" y="100" width="150" height="56" rx="10" fill="#5B2A86" stroke="#5B2A86" stroke-width="2.5"/>
<text x="115.0" y="134.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Tema</text>
<text x="204.0" y="134.0" font-size="13" fill="#2B1B3D">Autoatendimento do aluno</text>
<text x="660.0" y="134.0" font-size="12.5" fill="#756986" font-style="italic">objetivo de negócio</text>
<path d="M70 156 V184 H86" stroke="#756986" stroke-width="2" fill="none" marker-end="url(#am)"/>
<rect x="84.0" y="168.0" width="600.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.5"/>
<rect x="84" y="168" width="150" height="56" rx="10" fill="#C2185B" stroke="#C2185B" stroke-width="2.5"/>
<text x="159.0" y="202.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Épico</text>
<text x="248.0" y="202.0" font-size="13" fill="#2B1B3D">Matrícula on-line</text>
<text x="704.0" y="202.0" font-size="12.5" fill="#756986" font-style="italic">vários sprints</text>
<path d="M114 224 V252 H130" stroke="#756986" stroke-width="2" fill="none" marker-end="url(#am)"/>
<rect x="128.0" y="236.0" width="600.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<rect x="128" y="236" width="150" height="56" rx="10" fill="#3A86FF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="203.0" y="270.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Funcionalidade</text>
<text x="292.0" y="270.0" font-size="13" fill="#2B1B3D">Escolha de disciplinas</text>
<text x="748.0" y="270.0" font-size="12.5" fill="#756986" font-style="italic">um ou poucos sprints</text>
<path d="M158 292 V320 H174" stroke="#756986" stroke-width="2" fill="none" marker-end="url(#am)"/>
<rect x="172.0" y="304.0" width="600.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<rect x="172" y="304" width="150" height="56" rx="10" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="247.0" y="338.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">História</text>
<text x="336.0" y="338.0" font-size="13" fill="#2B1B3D">Como aluno, quero ver as vagas para escolher a turma</text>
<text x="792.0" y="338.0" font-size="12.5" fill="#756986" font-style="italic">cabe num sprint</text>
<path d="M202 360 V388 H218" stroke="#756986" stroke-width="2" fill="none" marker-end="url(#am)"/>
<rect x="216.0" y="372.0" width="600.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<rect x="216" y="372" width="150" height="56" rx="10" fill="#FFB703" stroke="#FFB703" stroke-width="2.5"/>
<text x="291.0" y="406.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tarefa</text>
<text x="380.0" y="406.0" font-size="13" fill="#2B1B3D">Criar a consulta de vagas na API</text>
<text x="836.0" y="406.0" font-size="12.5" fill="#756986" font-style="italic">horas</text>
<line x1="980.0" y1="110.0" x2="980.0" y2="420.0" stroke="#B35300" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="962.0" y="265.0" font-size="12" fill="#B35300" text-anchor="middle" font-weight="700" transform="rotate(90 962 265)">menor e mais concreto</text>
<text x="500.0" y="460.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">A história segue o modelo “Como [papel], quero [ação], para [benefício]” e tem critérios de aceitação.</text>
</svg>
