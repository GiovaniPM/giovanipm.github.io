<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Arquitetura de referência</title>
<desc id="d">Fluxo da esquerda para a direita em cinco colunas. Fontes: ERP JDE, APIs de parceiros, bancos de dados e logs de integração. Coleta: conectores com SQL agendado, eventos e webhooks, guardando o histórico. Regras: motor de regras com limites fixos, SLAs, padrão histórico e ausência de eventos, classificando em verde, amarelo ou vermelho. Saídas: painel em tempo real, alertas por e-mail, Slack e Teams e chamados abertos automaticamente. Ação: o negócio decide e a TI corrige. Uma seta tracejada volta da ação para as regras: cada incidente ajusta regras, limites e donos.</desc>
