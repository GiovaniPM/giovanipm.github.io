y1="82.0" x2="803" y2="82.0" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/><rect x="806" y="40" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><text x="892.0" y="66.0" font-size="14.905660377358489" fill="#5B2A86" text-anchor="middle" font-weight="bold">V · Servo dell’amore</text><text x="892.0" y="90.0" font-size="13" fill="#756986" text-anchor="middle">lavori per</text><text x="892.0" y="106.2" font-size="13" fill="#756986" text-anchor="middle">Itaquê</text><rect x="30" y="230" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><text x="116.0" y="256.0" font-size="11.465892597968068" fill="#5B2A86" text-anchor="middle" font-weight="bold">VI · Combattimento nuziale</text><text x="116.0" y="280.0" font-size="13" fill="#756986" text-anchor="middle">Cori, il tronco,</text><text x="116.0" y="296.2" font-size="13" fill="#756986" text-anchor="middle">il vaso</text><line x1="204" y1="272.0" x2="221" y2="272.0" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/><rect x="224" y="230" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><text x="310.0" y="256.0" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="bold">VII · La guerra</text><text x="310.0" y="280.0" font-size="13" fill="#756986" text-anchor="middle">Pojucã e</text><text x="310.0" y="296.2" font-size="13" fill="#756986" text-anchor="middle">la decisione</text><line x1="398" y1="272.0" x2="415" y2="272.0" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/><rect x="418" y="230" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><text x="504.0" y="256.0" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="bold">VIII · La battaglia</text><text x="504.0" y="280.0" font-size="13" fill="#756986" text-anchor="middle">araguaia contro</text><text x="504.0" y="296.2" font-size="13" fill="#756986" text-anchor="middle">tocantins</text><line x1="592" y1="272.0" x2="609" y2="272.0" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/><rect x="612" y="230" width="172" height="84" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><text x="698.0" y="256.0" font-size="12.961443806398686" fill="#5B2A86" text-anchor="middle" font-weight="bold">IX · Unione degli archi</text><text x="698.0" y="280.0" font-size="13" fill="#756986" text-anchor="middle">arco di Itaquê,</text><text x="698.0" y="296.2" font-size="13" fill="#756986" text-anchor="middle">Agniná</text><path d="M892.0 126 L892.0 164 L116.0 164 L116.0 226" fill="none" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/><rect x="30" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="119.0" y="457.0" font-size="13.5" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ Prigioniero di Pojucã</text><text x="119.0" y="480.0" font-size="12" fill="#2B1B3D" text-anchor="middle">perdere un duello</text><path d="M32 82.0 L14 82.0 L14 465 L27 465" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><rect x="222" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="311.0" y="457.0" font-size="12.046444121915819" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ La vergine non ha scelto</text><text x="311.0" y="480.0" font-size="10.702772404900065" fill="#2B1B3D" text-anchor="middle">affetto + merito + ½ servizio &lt; 9</text><path d="M116.0 316 L116.0 334 L311.0 404 L311.0 426" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><rect x="414" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="503.0" y="457.0" font-size="13.5" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ Il tradimento</text><text x="503.0" y="480.0" font-size="12" fill="#2B1B3D" text-anchor="middle">portare Araci di notte</text><path d="M310.0 316 L310.0 334 L503.0 404 L503.0 426" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><rect x="606" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="695.0" y="457.0" font-size="11.600279524807826" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ Senza onore, senza unione</text><text x="695.0" y="480.0" font-size="12" fill="#2B1B3D" text-anchor="middle">onore &lt; 5</text><path d="M683.0 316 L683.0 334 L695.0 404 L695.0 426" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><rect x="798" y="430" width="178" height="70" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4"/><text x="887.0" y="457.0" font-size="13.5" fill="#C2185B" text-anchor="middle" font-weight="bold">✗ La caduta dell’eroe</text><text x="887.0" y="480.0" font-size="12" fill="#2B1B3D" text-anchor="middle">perdere contro Agniná</text><path d="M713.0 316 L713.0 334 L887.0 404 L887.0 426" fill="none" stroke="#C2185B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/><line x1="786" y1="272.0" x2="803" y2="272.0" stroke="#0E8074" stroke-width="2.4" marker-end="url(#ar)"/><rect x="806" y="230" width="172" height="84" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2.4"/><text x="892.0" y="258.0" font-size="14.5" fill="#0E8074" text-anchor="middle" font-weight="bold">★ La leggenda di</text><text x="892.0" y="276.1" font-size="14.5" fill="#0E8074" text-anchor="middle" font-weight="bold">Ubirajara</text><text x="892.0" y="300.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle">sconfiggere Agniná</text><text x="500" y="535.0" font-size="13" fill="#756986" text-anchor="middle">Dopo un finale triste si può ricominciare l’atto.</text></g>
