<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">Il viaggio: nove atti e sei finali</title>
<desc id="d">I nove atti del gioco seguono i capitoli del romanzo. Atto I, Il cacciatore: caccia nei campi, la corsa dietro ad Araci, la freccia della sfida e i due duelli con Pojucã; perdere un duello porta al finale Prigioniero di Pojucã. Atto II, Il guerriero: il grande arco degli araguaia. Atto III, La promessa sposa. Atto IV, L’ospitalità: la risalita del fiume. Atto V, Servo dell’amore: i lavori per Itaquê. Atto VI, Il combattimento nuziale: Cori, il tronco, il vaso delle formiche; se la somma di affetto di Araci, merito e metà del servizio resta sotto 9, il finale è La vergine non ha scelto. Atto VII, La guerra: portare via Araci di notte porta al finale Il tradimento. Atto VIII, La battaglia. Atto IX, L’unione degli archi: con onore sotto 5 il finale è Senza onore, senza unione; perdere contro Agniná porta a La caduta dell’eroe; vincere porta a La leggenda di Ubirajara.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
