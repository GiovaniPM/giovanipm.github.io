<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Una baza: todos siguen el palo de quien abrió</title><desc id="d">Ana abre con el 5 de corazones, Beto juega la Jota de corazones, Caio el 2 de corazones y Duda el Rey de corazones. El Rey, la carta más alta del palo, se lleva la baza.</desc><rect width="1000" height="440" rx="18" fill="#FFF7EC"/><text x="500" y="44" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Una baza: todos siguen el palo de quien abrió</text><circle cx="205" cy="92" r="17" fill="#E9DCC8"/><text x="205" y="99" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#2B1B3D" font-weight="700" text-anchor="middle">1</text><svg x="150" y="122" width="110" height="159.5" viewBox="0 0 100 145"><rect x="1" y="1" width="98" height="143" rx="8" fill="#FFFDF6" stroke="#B9A98F" stroke-width="1.500"/><text x="7" y="21" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#C2252F">5</text><path transform="translate(15 33) scale(0.55)" d="M0 12C-4 6 -12 1 -12 -5C-12 -10 -8 -13 -5 -13C-2 -13 0 -11 0 -8C0 -11 2 -13 5 -13C8 -13 12 -10 12 -5C12 1 4 6 0 12Z" fill="#C2252F"/><g transform="rotate(180 50 72.500)"><text x="7" y="21" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#C2252F">5</text><path transform="translate(15 33) scale(0.55)" d="M0 12C-4 6 -12 1 -12 -5C-12 -10 -8 -13 -5 -13C-2 -13 0 -11 0 -8C0 -11 2 -13 5 -13C8 -13 12 -10 12 -5C12 1 4 6 0 12Z" fill="#C2252F"/></g><path transform="translate(35 28) scale(0.72)" d="M0 12C-4 6 -12 1 -12 -5C-12 -10 -8 -13 -5 -13C-2 -13 0 -11 0 -8C0 -11 2 -13 5 -13C8 -13 12 -10 12 -5C12 1 4 6 0 12Z" fill="#C2252F"/><path transform="translate(65 28) scale(0.72)" d="M0 12C-4 6 -12 1 -12 -5C-12 -10 -8 -13 -5 -13C-2 -13 0 -11 0 -8C0 -11 2 -13 5 -13C8 -13 12 -10 12 -5C12 1 4 6 0 12Z" fill="#C22