<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Reduction: solving one problem with another</title>
<desc id="d">Reduction diagram. Problem A, for example Sudoku, goes through a fast translator, in polynomial time, that turns it into problem B, for example SAT. A solver for B gives the answer, which is valid for A and B. Rule: if B has a fast solution, so does A. Below, Karp’s 1972 domino effect: SAT, about logical formulas, leads to Clique, a group of friends, which leads to Vertex cover, guarding every street, which leads to Hamiltonian cycle, visiting everything once. Moral: if one NP-complete problem has a fast solution, they all do, and P equals NP.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Reduction: solving one problem with another</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">The tool that links all NP-complete problems</text>
<rect x="40" y="104" width="164" height="78" rx="12" fill="#FF6B6B"/><text x="122" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Problem A</text>
<text x="122" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">e.g. Sudoku</text>
<line x1="207" y1="143" x2="231" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="234" y="104" width="164" height="78" rx="12" fill="#5B2A86"/><text x="316" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Fast translator</text>
<text x="316" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">polynomial time</text>
<line x1="401" y1="143" x2="425" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="428" y="104" width="164" height="78" rx="12" fill="#3A86FF"/><text x="510" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Problem B</text>
<text x="510" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">e.g. SAT</text>
<line x1="595" y1="143" x2="619" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="622" y="104" width="164" height="78" rx="12" fill="#2A9D8F"/><text x="704" y="148" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">B solver</text>
<line x1="789" y1="143" x2="813" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="816" y="104" width="164" height="78" rx="12" fill="#FFB703"/><text x="898" y="138" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Answer</text>
<text x="898" y="160" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-style="italic">valid for A and B</text>
<text x="500" y="214" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">If B has a fast solution, so does A.</text>
<line x1="50" y1="238" x2="950" y2="238" stroke="#EADBC6" stroke-width="1.5"/><text x="500" y="270" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Karp’s domino effect (1972)</text>
<g transform="rotate(-6 155 360)"><rect x="70" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><rect x="70" y="300" width="170" height="10" rx="4" fill="#5B2A86"/><text x="155" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">SAT</text>
<text x="155" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">logical formulas</text>
</g>
<line x1="246" y1="358" x2="289" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(-1 380 360)"><rect x="295" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/><rect x="295" y="300" width="170" height="10" rx="4" fill="#3A86FF"/><text x="380" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Clique</text>
<text x="380" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">group of friends</text>
</g>
<line x1="471" y1="358" x2="514" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(4 605 360)"><rect x="520" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/><rect x="520" y="300" width="170" height="10" rx="4" fill="#2A9D8F"/><text x="605" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Vertex cover</text>
<text x="605" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">guard every street</text>
</g>
<line x1="696" y1="358" x2="739" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(9 830 360)"><rect x="745" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="3"/><rect x="745" y="300" width="170" height="10" rx="4" fill="#FF6B6B"/><text x="830" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Hamiltonian cycle</text>
<text x="830" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">visit everything once</text>
</g>
<rect x="80" y="450" width="840" height="56" rx="12" fill="#2B1B3D"/><text x="500" y="484" font-size="15.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">If ONE NP-complete problem has a fast solution, they ALL do, and P = NP.</text>
</svg>
