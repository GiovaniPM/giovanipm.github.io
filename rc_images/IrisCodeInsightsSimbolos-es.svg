<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Los símbolos del diagrama de flujo</title><desc id="d">Los símbolos del diagrama de flujo: Inicio (nombre y argumentos); Comandos (Set, Kill y New agrupados); Decisión (If, ElseIf, poscondicional); Bucle (For, While, Do-While); Llamada (método o etiqueta); SQL embebido (&amp;sql(...)); Entrada y salida (Write, Read, ZWrite); Fin del camino (Quit, Return, Goto); Error o parada (Throw, Halt, Catch vacío); Try y Catch (cuadros discontinuos). Borde rojo: el comando tiene un hallazgo. Haz clic en un bloque para ver el comando completo.</desc><rect width="1000" height="380" rx="18" fill="#FFF7EC"/><text x="500" y="32" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D" xml:space="preserve">Los símbolos del diagrama de flujo</text><rect x="54" y="66" width="120" height="46" rx="23" fill="#EBF7E6" stroke="#2E844A" stroke-width="2"/><text x="114" y="148" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Inicio</text><text x="114" y="167" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">nombre y argumentos</text><rect x="247" y="66" width="120" height="46" rx="4" fill="#FFFFFF" stroke="#706E6B" stroke-width="2"/><path d="M265 83h84M265 95h60" stroke="#B0ADAB" stroke-width="3" stroke-linecap="round"/><text x="307" y="148" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Comandos</text><text x="307" y="167" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">Set, Kill y New agrupados</text><polygon points="500,62 566,89 500,116 434,89" fill="#FEF5E6" stroke="#DD7A01" stroke-width="2"/><text x="500" y="94" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#8C4B02" xml:space="preserve">?</text><text x="500" y="148" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Decisión</text><text x="500" y="167" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">If, ElseIf, poscondicional</text><polygon points="693,62 759,89 693,116 627,89" fill="#F2EBFD" stroke="#7526E3" stroke-width="2"/><path d="M693 116v8h-82v-35h9" fill="none" stroke="#7526E3" stroke-width="2"/><path d="M627 89l-7 -4v8z" fill="#7526E3"/><text x="693" y="148" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Bucle</text><text x="693" y="167" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">For, While, Do-While</text><rect x="826" y="66" width="120" height="46" rx="4" fill="#EAF5FE" stroke="#0176D3" stroke-width="2"/><path d="M834 66v46M938 66v46" stroke="#0176D3" stroke-width="1.5"/><text x="886" y="148" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Llamada</text><text x="886" y="167" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">método o etiqueta</text><path d="M54 215A60 7 0 0 1 174 215V247A60 7 0 0 1 54 247Z" fill="#DFF6F3" stroke="#056764" stroke-width="2"/><path d="M54 215A60 7 0 0 0 174 215" fill="none" stroke="#056764" stroke-width="2"/><text x="114" y="290" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">SQL embebido</text><text x="114" y="309" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">&amp;sql(...)</text><polygon points="259,208 367,208 355,254 247,254" fill="#FFFFFF" stroke="#5C5C5C" stroke-width="2"/><text x="307" y="290" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Entrada y salida</text><text x="307" y="309" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">Write, Read, ZWrite</text><rect x="440" y="208" width="120" height="46" rx="23" fill="#F3F3F3" stroke="#3E3E3C" stroke-width="2"/><text x="500" y="290" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Fin del camino</text><text x="500" y="309" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">Quit, Return, Goto</text><rect x="633" y="208" width="120" height="46" rx="23" fill="#FEF1EE" stroke="#BA0517" stroke-width="2"/><text x="693" y="290" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Error o parada</text><text x="693" y="309" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">Throw, Halt, Catch vacío</text><rect x="812" y="204" width="70" height="54" rx="8" fill="none" stroke="#0176D3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="820" y="218" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#756986" xml:space="preserve">Try</text><rect x="902" y="204" width="70" height="54" rx="8" fill="none" stroke="#BA0517" stroke-width="1.6" stroke-dasharray="6 4"/><text x="910" y="218" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#756986" xml:space="preserve">Catch</text><path d="M882 222h14" stroke="#BA0517" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M902 222l-7 -4v8z" fill="#BA0517"/><text x="886" y="290" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Try y Catch</text><text x="886" y="309" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">cuadros discontinuos</text><text x="500" y="358" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#756986" xml:space="preserve">Borde rojo: el comando tiene un hallazgo. Haz clic en un bloque para ver el comando completo.</text></svg>