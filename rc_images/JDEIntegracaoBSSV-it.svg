<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Architettura dei Business Services</title>
<desc id="d">Un consumatore SOAP chiama via HTTPS il Business Services Server su WebLogic o WebSphere. Il published business service, per esempio JP420000, delega a un business service interno con value object, che chiama business function tramite l'API di runtime di JDE; la chiamata arriva all'Enterprise Server tramite JDENET e poi al database. Lo sviluppo usa JDeveloper, Java, JAX-WS e oggetti in OMW. Nella fascia in basso, JDE come consumatore: una business function chiama un business service consumatore sul BSSV Server, che chiama un servizio esterno SOAP o REST.</desc>
