<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Risolvere è difficile, verificare è facile</title>
<desc id="d">Due pannelli con un Sudoku 4 per 4. A sinistra, risolvere: la griglia ha solo alcuni numeri e bisogna provare, sbagliare e tornare indietro; in un Sudoku gigante i tentativi crescono in modo esplosivo. A destra, verificare: la griglia è completa e basta controllare che ogni riga, colonna e quadrato 2 per 2 contenga i numeri 1, 2, 3 e 4. Sotto: NP sono i problemi la cui risposta è facile da verificare; P, quelli facili da risolvere; la domanda P uguale a NP chiede se, ogni volta che verificare è facile, lo sia anche risolvere.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
