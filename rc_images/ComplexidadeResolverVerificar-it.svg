<text x="500" y="537" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">NP: problemi la cui risposta è facile da VERIFICARE.  P: problemi facili da RISOLVERE.</text>
<text x="500" y="559" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">La domanda P = NP? è: ogni volta che verificare è facile, lo è anche risolvere?</text>
