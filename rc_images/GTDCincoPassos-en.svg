<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The five steps of GTD</title>
<desc id="d">Cycle with the five steps of GTD around the idea of mind like water: 1, capture everything that has your attention; 2, clarify what it is and what to do; 3, organize everything in its place; 4, reflect, reviewing the system every week; 5, engage, doing with confidence. Arrows link each step to the next and the last to the first.</desc>
