<text x="500.0" y="148.0" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="500.0" y="174.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Capture</text>
<text x="574.0" y="154.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">everything that has</text><text x="574.0" y="172.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">your attention</text>
<circle cx="675.9" cy="287.8" r="60" fill="#2F6FE0"/>
