<text x="608.7" y="508.7" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Organize</text>
<text x="682.7" y="488.7" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">everything</text><text x="682.7" y="506.9" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">in its place</text>
<circle cx="391.3" cy="494.7" r="60" fill="#B35300"/>
