<text x="391.3" y="508.7" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reflect</text>
<text x="317.3" y="488.7" font-size="14" font-weight="400" fill="#3E3350" text-anchor="end">review the system</text><text x="317.3" y="506.9" font-size="14" font-weight="400" fill="#3E3350" text-anchor="end">every week</text>
<circle cx="324.1" cy="287.8" r="60" fill="#C2185B"/>
<text x="324.1" y="275.8" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="324.1" y="301.8" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Engage</text>
<text x="250.1" y="281.8" font-size="14" font-weight="400" fill="#3E3350" text-anchor="end">do with</text><text x="250.1" y="300.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="end">confidence</text>
