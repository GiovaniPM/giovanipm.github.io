<text x="675.9" y="301.8" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Clarify</text>
<text x="749.9" y="281.8" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">what it is and</text><text x="749.9" y="300.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">what to do</text>
