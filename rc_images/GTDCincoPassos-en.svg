<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">The five steps of GTD</text>
<circle cx="500" cy="345" r="88" fill="#E2F6F2" stroke="#0E8074" stroke-width="2" stroke-dasharray="6 6"/>
<text x="500.0" y="341.0" font-size="19" font-weight="700" fill="#0E8074" text-anchor="middle">Mind</text><text x="500.0" y="365.7" font-size="19" font-weight="700" fill="#0E8074" text-anchor="middle">like water</text>
