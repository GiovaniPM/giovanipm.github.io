<title id="t">Dal tema al task: la gerarchia dei requisiti agili</title>
<desc id="d">Cinque livelli a scala: tema, self-service per lo studente, un obiettivo di business; epic, iscrizione online, che richiede diversi sprint; funzionalità, scelta degli insegnamenti, in uno o pochi sprint; storia, come studente, voglio vedere i posti liberi per scegliere la classe, che sta in uno sprint; e task, creare la query dei posti liberi nell’API, che richiede ore.</desc>
