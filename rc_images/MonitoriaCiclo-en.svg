<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The business monitoring cycle</title>
<desc id="d">Six steps arranged in a circle around business monitoring, linked by clockwise arrows: 1 define KPIs, events and targets; 2 collect data from the ERP, APIs, databases and logs; 3 compare against thresholds, SLAs and history; 4 alert through dashboards, email, Slack and Teams; 5 investigate the cause and act; 6 improve rules and processes, returning to the definition.</desc>
