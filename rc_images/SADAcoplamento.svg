<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Acoplamento e coesão: do pior ao melhor</title>
<desc id="d">Duas escalas do pior para o melhor. Acoplamento: conteúdo, comum, externo, controle, estrutura e dados. Coesão: coincidental, lógica, temporal, procedural, comunicacional, sequencial e funcional. Abaixo, quatro módulos todos interligados, com alto acoplamento, e quatro módulos com poucas ligações, com baixo acoplamento. A meta é baixo acoplamento e alta coesão.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Acoplamento e coesão: do pior ao melhor</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Bons módulos dependem pouco uns dos outros e fazem uma coisa só</text>
<text x="40.0" y="112.0" font-size="16" fill="#2B1B3D" font-weight="700">Acoplamento</text>
<text x="210.0" y="112.0" font-size="13" fill="#756986" font-style="italic">quanto um módulo depende dos outros</text>
<rect x="43.0" y="126.0" width="147.3" height="50.0" rx="8" fill="#F4A3A3" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="116.7" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Conteúdo</text>
<rect x="196.3" y="126.0" width="147.3" height="50.0" rx="8" fill="#E3AEAC" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="270.0" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Comum</text>
<rect x="349.7" y="126.0" width="147.3" height="50.0" rx="8" fill="#D2B9B4" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="423.3" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Externo</text>
<rect x="503.0" y="126.0" width="147.3" height="50.0" rx="8" fill="#C0C3BD" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="576.7" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Controle</text>
<rect x="656.3" y="126.0" width="147.3" height="50.0" rx="8" fill="#AFCEC5" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="730.0" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Estrutura</text>
<rect x="809.7" y="126.0" width="147.3" height="50.0" rx="8" fill="#9ED9CE" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="883.3" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Dados</text>
<line x1="60.0" y1="198.0" x2="940.0" y2="198.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="60.0" y="216.0" font-size="12" fill="#D62828" font-weight="700">pior</text>
<text x="940.0" y="216.0" font-size="12" fill="#0E6B61" text-anchor="end" font-weight="700">melhor</text>
<text x="40.0" y="242.0" font-size="16" fill="#2B1B3D" font-weight="700">Coesão</text>
<text x="210.0" y="242.0" font-size="13" fill="#756986" font-style="italic">quanto as partes de um módulo pertencem juntas</text>
<rect x="43.0" y="256.0" width="125.4" height="50.0" rx="8" fill="#F4A3A3" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="105.7" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Coincidental</text>
<rect x="174.4" y="256.0" width="125.4" height="50.0" rx="8" fill="#E6ACAA" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="237.1" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Lógica</text>
<rect x="305.9" y="256.0" width="125.4" height="50.0" rx="8" fill="#D7B5B1" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="368.6" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Temporal</text>
<rect x="437.3" y="256.0" width="125.4" height="50.0" rx="8" fill="#C9BEB8" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="500.0" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Procedural</text>
<rect x="568.7" y="256.0" width="125.4" height="50.0" rx="8" fill="#BBC7C0" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="631.4" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Comunicacional</text>
<rect x="700.1" y="256.0" width="125.4" height="50.0" rx="8" fill="#ACD0C7" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="762.9" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sequencial</text>
<rect x="831.6" y="256.0" width="125.4" height="50.0" rx="8" fill="#9ED9CE" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="894.3" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Funcional</text>
<line x1="60.0" y1="328.0" x2="940.0" y2="328.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="60.0" y="346.0" font-size="12" fill="#D62828" font-weight="700">pior</text>
<text x="940.0" y="346.0" font-size="12" fill="#0E6B61" text-anchor="end" font-weight="700">melhor</text>
<line x1="180" y1="400" x2="320" y2="400" stroke="#D62828" stroke-width="2.5"/><line x1="180" y1="400" x2="180" y2="470" stroke="#D62828" stroke-width="2.5"/><line x1="180" y1="400" x2="320" y2="470" stroke="#D62828" stroke-width="2.5"/><line x1="320" y1="400" x2="180" y2="470" stroke="#D62828" stroke-width="2.5"/><line x1="320" y1="400" x2="320" y2="470" stroke="#D62828" stroke-width="2.5"/><line x1="180" y1="470" x2="320" y2="470" stroke="#D62828" stroke-width="2.5"/><rect x="148.0" y="384.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="288.0" y="384.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="148.0" y="454.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="288.0" y="454.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><text x="250.0" y="378.0" font-size="13.5" fill="#D62828" text-anchor="middle" font-weight="700">alto acoplamento</text>
<line x1="680" y1="400" x2="820" y2="400" stroke="#0E6B61" stroke-width="2.5"/><line x1="680" y1="470" x2="820" y2="470" stroke="#0E6B61" stroke-width="2.5"/><rect x="648.0" y="384.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="788.0" y="384.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="648.0" y="454.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><rect x="788.0" y="454.0" width="64.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/><text x="750.0" y="378.0" font-size="13.5" fill="#0E6B61" text-anchor="middle" font-weight="700">baixo acoplamento</text>
<rect x="395.0" y="405.0" width="210.0" height="60.0" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="430.0" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Meta: baixo acoplamento</text>
<text x="500.0" y="448.0" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">e alta coesão</text>
</svg>
