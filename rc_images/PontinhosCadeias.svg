<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
<title id="t">Cadeias e ciclos no fim da partida</title>
<desc id="d">Tabuleiro de 2 por 5 quadrados em que não sobra nenhuma linha segura: cada quadrado livre tem dois lados traçados. Os quadrados formam quatro peças: a, um ciclo de 4 quadrados no lado esquerdo; b, uma cadeia longa de 3 quadrados na linha de cima; c, uma cadeia de 2 quadrados embaixo; e d, uma cadeia de 1 quadrado no canto. Qualquer linha traçada entrega uma dessas peças.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="420" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">Cadeias e ciclos no fim da partida</text>
