r="6"/><circle class="dot" cx="326" cy="86" r="6"/><circle class="dot" cx="26" cy="146" r="6"/><circle class="dot" cx="86" cy="146" r="6"/><circle class="dot" cx="146" cy="146" r="6"/><circle class="dot" cx="206" cy="146" r="6"/><circle class="dot" cx="266" cy="146" r="6"/><circle class="dot" cx="326" cy="146" r="6"/></g><rect x="520" y="74" width="34" height="34" rx="6" fill="#D8F1EC" stroke="#756986" stroke-width="1"/><text x="537" y="97" text-anchor="middle" font-size="20" font-weight="700" fill="#2B1B3D">a</text><text x="568" y="94" font-size="18" font-weight="700" fill="#2B1B3D">Ciclo de 4</text><text x="568" y="114" font-size="14.5" fill="#756986">fecha em volta de si mesmo</text><rect x="520" y="132" width="34" height="34" rx="6" fill="#FFF1C9" stroke="#756986" stroke-width="1"/><text x="537" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#2B1B3D">b</text><text x="568" y="152" font-size="18" font-weight="700" fill="#2B1B3D">Cadeia longa de 3</text><text x="568" y="172" font-size="14.5" fill="#756986">três ou mais quadrados em fila</text><rect x="520" y="190" width="34" height="34" rx="6" fill="#FBDDEA" stroke="#756986" stroke-width="1"/><text x="537" y="213" text-anchor="middle" font-size="20" font-weight="700" fill="#2B1B3D">c</text><text x="568" y="210" font-size="18" font-weight="700" fill="#2B1B3D">Cadeia de 2</text><rect x="520" y="248" width="34" height="34" rx="6" fill="#ECE2F8" stroke="#756986" stroke-width="1"/><text x="537" y="271" text-anchor="middle" font-size="20" font-weight="700" fill="#2B1B3D">d</text><text x="568" y="268" font-size="18" font-weight="700" fill="#2B1B3D">Cadeia de 1</text><text x="520" y="345" text-anchor="start" font-size="15.5" fill="#756986">Não há linha segura: qualquer linha</text><text x="520" y="366" text-anchor="start" font-size="15.5" fill="#756986">dá a terceira linha a algum quadrado</text><text x="520" y="387" text-anchor="start" font-size="15.5" fill="#756986">e entrega uma peça inteira.</text></svg>
