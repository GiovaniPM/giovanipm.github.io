<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Iteração de ponto fixo: a escadinha</title>
<desc id="d">Gráfico com a reta y igual a x e a curva y igual a g de x. Partindo de um chute no eixo horizontal, sobe-se até a curva, anda-se na horizontal até a reta e repete-se. O caminho forma uma escadinha que vai parar no ponto em que a curva cruza a reta: o ponto fixo, onde x é igual a g de x. À direita, a receita: reescrever a equação como x = g(x), chutar, aplicar g, repetir. E a equação de al-Kashi: sen 3° = 3x − 4x³, reescrita como x = (sen 3° + 4x³) ÷ 3.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Iteração de ponto fixo: a escadinha</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Aplicar a mesma conta de novo e de novo até parar de mudar</text><line x1="80" y1="480" x2="530" y2="480" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="80" y1="480" x2="80" y2="90" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="80" y1="480" x2="501.667" y2="115.833" stroke="#756986" stroke-width="2"/><text x="495.667" y="107.833" font-size="14" fill="#756986" text-anchor="end">y = x</text><line x1="80" y1="369.167" x2="501.667" y2="187.083" stroke="#5B2A86" stroke-width="3"/><text x="465" y="186.917" font-size="15" fill="#5B2A86" text-anchor="end" font-weight="700">y = g(x)</text><polyline points="109.3,480.0 109.3,356.5 223.0,356.5 223.0,307.4 279.8,307.4 279.8,282.9 308.2,282.9 308.2,270.6 322.5,270.6 322.5,264.5 329.6,264.5 329.6,261.4 333.1,261.4" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="109.333" cy="480" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><text x="109.333" y="502" font-size="14" fill="#FF6B6B" text-anchor="middle" font-weight="700">chute</text><circle cx="336.667" cy="258.333" r="8" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/><text x="350.667" y="284.333" font-size="15" fill="#B35300" text-anchor="start" font-weight="700">ponto fixo: x = g(x)</text><rect x="560" y="100" width="410" height="200" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="765" y="130" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">A receita</text><text x="585" y="166" font-size="15" fill="#2B1B3D" text-anchor="start">1. Reescreva: x = g(x)</text><text x="585" y="196" font-size="15" fill="#2B1B3D" text-anchor="start">2. Chute um valor</text><text x="585" y="226" font-size="15" fill="#2B1B3D" text-anchor="start">3. Calcule g(chute): novo chute</text><text x="585" y="256" font-size="15" fill="#2B1B3D" text-anchor="start">4. Repita até parar de mudar</text><rect x="560" y="320" width="410" height="190" rx="12" fill="#FFF1C9"/><text x="765" y="350" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">A equação de al-Kashi</text><text x="765" y="386" font-size="16" fill="#2B1B3D" text-anchor="middle">sen 3° = 3x − 4x³   (x = sen 1°)</text><text x="765" y="420" font-size="14" fill="#756986" text-anchor="middle">reescrita:</text><text x="765" y="454" font-size="20" fill="#5B2A86" text-anchor="middle" font-weight="700">x = (sen 3° + 4x³) ÷ 3</text><text x="765" y="488" font-size="13" fill="#2B1B3D" text-anchor="middle">x³ é minúsculo, então cada passo mexe pouco</text>
</svg>
