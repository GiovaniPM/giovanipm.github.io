<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" role="img" aria-labelledby="t d" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif"><title id="t">La mappa degli elementi</title><desc id="d">Gli eventi sono cerchi: inizio, intermedio di ricezione, intermedio di invio e fine. Le attività sono rettangoli arrotondati: attività, attività utente, sottoprocesso e attività di chiamata. I gateway sono rombi: esclusivo, parallelo, inclusivo e basato su eventi. Collegamenti e organizzazione: flusso di sequenza, flusso di messaggi, associazione, oggetto dati, pool e corsie.</desc><style>:root{--b-fill:#fff;--b-line:#2B1B3D;--b-muted:#5E5170;--b-pool:#fff;--b-font:'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;--b-mono:Consolas,monospace}
.grid-dot{fill:var(--dot)}
.b-fill{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-line{fill:none;stroke:var(--b-line);stroke-width:1.6}
.b-thin{fill:none;stroke:var(--b-line);stroke-width:1.2}
.b-ink{fill:var(--b-line);stroke:none}
.b-blank{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.2}
.b-text{fill:var(--b-line);font:12px var(--b-font);text-anchor:middle;pointer-events:none}
.b-note{fill:var(--b-line);font:12px var(--b-font);text-anchor:start;pointer-events:none}
.b-small{fill:var(--b-muted);font:10.5px var(--b-mono);text-anchor:middle;pointer-events:none}
.b-event{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-end{fill:var(--b-fill);stroke:var(--b-line);stroke-width:3.4}
.b-gw{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-pool{fill:var(--b-pool);stroke:var(--b-line);stroke-width:1.6}
.b-lane{fill:none;stroke:var(--b-line);stroke-width:1}
.b-group{fill:none;stroke:var(--b-line);stroke-width:1.4;stroke-dasharray:9 4 2 4}
.b-seq{fill:none;stroke:var(--b-line);stroke-width:1.5;marker-end:url(#m-seq)}
.b-msg{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:7 5;marker-start:url(#m-msg-start);marker-end:url(#m-msg-end)}
.b-assoc{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.b-assoc.one{marker-end:url(#m-open)}
.b-assoc.both{marker-start:url(#m-open-s);marker-end:url(#m-open)}
.b-data{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round;marker-end:url(#m-open)}
.b-text{font-size:12px}</style><defs><marker id="m-seq" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="m-msg-end" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11z" fill="#fff" stroke="#2B1B3D" stroke-width="1.2"/></marker><marker id="m-msg-start" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#2B1B3D" stroke-width="1.4"/></marker><marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker><marker id="m-open-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 1 6 11 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker></defs><rect width="1000" height="612" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">La mappa degli elementi</text><rect x="20" y="70" width="960" height="122" rx="12" fill="#fff" stroke="#E2D3BC"/><text x="36" y="100" font-size="16" fill="#2B1B3D" font-weight="700">Eventi</text><text x="36" y="120" font-size="12" fill="#5E5170">Accade qualcosa</text><circle cx="282" cy="106" r="18" class="b-event"/><text x="282" y="156" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Inizio</text><circle cx="452" cy="106" r="18" class="b-event"/><circle cx="452" cy="106" r="14.6" class="b-blank"/><g transform="translate(452 106) scale(1)"><circle r="9" class="b-thin"/><path d="M9 0L6.8 0" class="b-thin"/><path d="M7.794228634059948 4.499999999999999L6.581793068761734 3.7999999999999994" class="b-thin"/><path d="M4.500000000000001 7.794228634059947L3.8000000000000007 6.581793068761733" class="b-thin"/><path d="M5.51091059616309e-16 9L4.1637991171010006e-16 6.8" class="b-thin"/><path d="M-4.499999999999998 7.794228634059948L-3.799999999999998 6.581793068761734" class="b-thin"/><path d="M-7.794228634059948 4.499999999999999L-6.581793068761734 3.7999999999999994" class="b-thin"/><path d="M-9 1.102182119232618e-15L-6.8 8.327598234202001e-16" class="b-thin"/><path d="M-7.79422863405995 -4.499999999999997L-6.581793068761734 -3.7999999999999976" class="b-thin"/><path d="M-4.5000000000000036 -7.794228634059945L-3.8000000000000034 -6.581793068761732" class="b-thin"/><path d="M-1.6532731788489267e-15 -9L-1.2491397351303002e-15 -6.8" class="b-thin"/><path d="M4.500000000000001 -7.794228634059947L3.8000000000000007 -6.581793068761733" class="b-thin"/><path d="M7.794228634059945 -4.5000000000000036L6.581793068761732 -3.8000000000000034" class="b-thin"/><path d="M0 0V-6.5M0 0L4.5 2.5" class="b-thin"/></g><text x="452" y="156" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Intermedio (ricezione)</text><circle cx="622" cy="106" r="18" class="b-event"/><circle cx="622" cy="106" r="14.6" class="b-blank"/><g transform="translate(622 106) scale(1)"><rect x="-8.5" y="-6" width="17" height="12" class="b-ink"/><path d="M-8.5 -6 0 1 8.5 -6" class="b-thin" stroke="var(--b-fill)" style="stroke:var(--b-fill)"/></g><text x="622" y="156" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Intermedio (invio)</text><circle cx="792" cy="106" r="16.8" class="b-end"/><text x="792" y="156" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Fine</text><rect x="20" y="205" width="960" height="122" rx="12" fill="#fff" stroke="#E2D3BC"/><text x="36" y="235" font-size="16" fill="#2B1B3D" font-weight="700">Attività</text><text x="36" y="255" font-size="12" fill="#5E5170">Qualcuno fa qualcosa</text><rect x="236" y="213" width="92" height="62" rx="10" class="b-fill"/><text class="b-text"><tspan x="282" y="244" dominant-baseline="central"></tspan></text><text x="282" y="291" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Attività</text><rect x="406" y="213" width="92" height="62" rx="10" class="b-fill"/><g transform="translate(412 218)"><path d="M8 8.2a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2ZM1.5 16v-3c0-2.4 2.4-4 6.5-4s6.5 1.6 6.5 4v3Z" class="b-thin"/><path d="M4.5 16v-3M11.5 16v-3M4.6 3.8c2 .8 4.6.8 6.8 0" class="b-thin"/></g><text class="b-text"><tspan x="452" y="248" dominant-baseline="central"></tspan></text><text x="452" y="291" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Attività utente</text><rect x="576" y="213" width="92" height="62" rx="10" class="b-fill"/><text class="b-text"><tspan x="622" y="238" dominant-baseline="central"></tspan></text><g class="expander"><rect x="615" y="258" width="14" height="14" class="b-blank"/><path d="M618 265H626M622 261V269" class="b-line"/></g><text x="622" y="291" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Sottoprocesso</text><rect x="746" y="213" width="92" height="62" rx="10" class="b-fill" style="stroke-width:3.6"/><text class="b-text"><tspan x="792" y="244" dominant-baseline="central"></tspan></text><text x="792" y="291" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Attività di chiamata</text><rect x="20" y="340" width="960" height="122" rx="12" fill="#fff" stroke="#E2D3BC"/><text x="36" y="370" font-size="16" fill="#2B1B3D" font-weight="700">Gateway</text><text x="36" y="390" font-size="12" fill="#5E5170">Il flusso si divide o</text><text x="36" y="405" font-size="12" fill="#5E5170">si unisce</text><path d="M282 352L306 376L282 400L258 376Z" class="b-gw"/><path d="M-9 -11.5-6.3-11.5 0-2.6 6.3-11.5 9-11.5 1.7 0 9 11.5 6.3 11.5 0 2.6-6.3 11.5-9 11.5-1.7 0Z" class="b-ink" transform="translate(282 376) scale(0.96)"/><text x="282" y="426" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Esclusivo</text><path d="M452 352L476 376L452 400L428 376Z" class="b-gw"/><path d="M-1.7 -12H1.7V-1.7H12V1.7H1.7V12H-1.7V1.7H-12V-1.7H-1.7Z" class="b-ink" transform="translate(452 376) scale(0.96)"/><text x="452" y="426" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Parallelo</text><path d="M622 352L646 376L622 400L598 376Z" class="b-gw"/><circle r="10.5" class="b-line" transform="translate(622 376) scale(0.96)" style="stroke-width:3"/><text x="622" y="426" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Inclusivo</text><path d="M792 352L816 376L792 400L768 376Z" class="b-gw"/><circle r="12.5" class="b-thin" transform="translate(792 376) scale(0.96)"/><circle r="10" class="b-thin" transform="translate(792 376) scale(0.96)"/><path d="M0 -6.8 6.5 -2.1 4 5.5H-4L-6.5 -2.1Z" class="b-thin" transform="translate(792 376) scale(0.96)"/><text x="792" y="426" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Basato su eventi</text><rect x="20" y="475" width="960" height="122" rx="12" fill="#fff" stroke="#E2D3BC"/><text x="36" y="505" font-size="16" fill="#2B1B3D" font-weight="700">Collegamenti</text><text x="36" y="525" font-size="12" fill="#5E5170">Collegano e</text><text x="36" y="540" font-size="12" fill="#5E5170">organizzano</text><path d="M232 513L332 513" class="b-seq"/><text x="282" y="561" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Flusso di</text><text x="282" y="576" font-size="12.5" fill="#2B1B3D" text-anchor="middle">sequenza</text><path d="M362 513L462 513" class="b-msg"/><text x="412" y="561" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Flusso di</text><text x="412" y="576" font-size="12.5" fill="#2B1B3D" text-anchor="middle">messaggi</text><path d="M492 513L592 513" class="b-assoc"/><text x="542" y="561" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Associazione</text><path d="M654 485H680L690 495V535H654Z" class="b-fill"/><path d="M680 485V495H690" class="b-thin"/><text x="672" y="561" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Oggetto dati</text><rect x="748" y="487" width="108" height="52" fill="#fff" stroke="#2B1B3D" stroke-width="1.5"/><path d="M766 487V539M766 513H856" stroke="#2B1B3D" fill="none"/><text x="802" y="561" font-size="12.5" fill="#2B1B3D" text-anchor="middle">Pool e corsie</text></svg>
