<text x="782" y="212" font-size="16" font-weight="bold" text-anchor="middle">5 misses</text>
<text x="782" y="234" font-size="14" fill="#756986" text-anchor="middle">+ leg</text>
<rect x="858" y="26" width="128" height="160" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<g transform="translate(862,30) scale(0.62)"><path d="M20 205h110M50 205V18h90M50 52l34-34" stroke="#5B2A86" stroke-width="6" stroke-linecap="round" fill="none"/><line x1="140" y1="18" x2="140" y2="48" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/><g stroke="#2B1B3D" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="140" cy="66" r="18"/><line x1="140" y1="84" x2="140" y2="140"/><line x1="140" y1="98" x2="114" y2="124"/><line x1="140" y1="98" x2="166" y2="124"/><line x1="140" y1="140" x2="118" y2="178"/><line x1="140" y1="140" x2="162" y2="178"/></g><g stroke="#B3261E" stroke-width="2.5" stroke-linecap="round"><path d="M131 59l6 6M137 59l-6 6M143 59l6 6M149 59l-6 6"/></g></g>
<text x="922" y="212" font-size="16" font-weight="bold" text-anchor="middle">6 misses</text>
<text x="922" y="234" font-size="14" fill="#B3261E" text-anchor="middle">game over</text>
