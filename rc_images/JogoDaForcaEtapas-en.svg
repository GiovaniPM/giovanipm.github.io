<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 256" width="1000" height="256" role="img" aria-labelledby="t d">
<title id="t">The seven stages of the gallows</title>
<desc id="d">With 0 misses only the gallows shows. Each wrong letter draws one part of the figure, in this order: head, body, left arm, right arm, left leg and right leg. On the sixth miss the figure is complete and the game ends.</desc>
<rect width="1000" height="256" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="18" y="26" width="128" height="160" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<g transform="translate(22,30) scale(0.62)"><path d="M20 205h110M50 205V18h90M50 52l34-34" stroke="#5B2A86" stroke-width="6" stroke-linecap="round" fill="none"/><line x1="140" y1="18" x2="140" y2="48" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/><g stroke="#2B1B3D" stroke-width="4" stroke-linecap="round" fill="none"></g></g>
<text x="82" y="212" font-size="16" font-weight="bold" text-anchor="middle">0 misses</text>
<rect x="158" y="26" width="128" height="160" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<g transform="translate(162,30) scale(0.62)"><path d="M20 205h110M50 205V18h90M50 52l34-34" stroke="#5B2A86" stroke-width="6" stroke-linecap="round" fill="none"/><line x1="140" y1="18" x2="140" y2="48" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/><g stroke="#2B1B3D" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="140" cy="66" r="18"/></g></g>
<text x="222" y="212" font-size="16" font-weight="bold" text-anchor="middle">1 miss</text>
<text x="222" y="234" font-size="14" fill="#756986" text-anchor="middle">+ head</text>
<rect x="298" y="26" width="128" height="160" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<g transform="translate(302,30) scale(0.62)"><path d="M20 205h110M50 205V18h90M50 52l34-34" stroke="#5B2A86" stroke-width="6" stroke-linecap="round" fill="none"/><line x1="140" y1="18" x2="140" y2="48" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/><g stroke="#2B1B3D" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="140" cy="66" r="18"/><line x1="140" y1="84" x2="140" y2="140"/></g></g>
<text x="362" y="212" font-size="16" font-weight="bold" text-anchor="middle">2 misses</text>
<text x="362" y="234" font-size="14" fill="#756986" text-anchor="middle">+ body</text>
<rect x="438" y="26" width="128" height="160" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<g transform="translate(442,30) scale(0.62)"><path d="M20 205h110M50 205V18h90M50 52l34-34" stroke="#5B2A86" stroke-width="6" stroke-linecap="round" fill="none"/><line x1="140" y1="18" x2="140" y2="48" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/><g stroke="#2B1B3D" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="140" cy="66" r="18"/><line x1="140" y1="84" x2="140" y2="140"/><line x1="140" y1="98" x2="114" y2="124"/></g></g>
<text x="502" y="212" font-size="16" font-weight="bold" text-anchor="middle">3 misses</text>
