<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quantos diâmetros cabem numa volta?</title>
<desc id="d">Uma roda de diâmetro 1 dá uma volta completa sobre o chão. O caminho percorrido é a circunferência. Marcando o diâmetro ao longo do caminho, cabem 3 diâmetros e sobra um pedacinho. Essa razão, circunferência dividida pelo diâmetro, é o número pi, e não há como medi-la com régua de forma exata.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Quantos diâmetros cabem numa volta?</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">A roda que desenrola a própria borda</text><line x1="40" y1="330" x2="960" y2="330" stroke="#2B1B3D" stroke-width="3"/><circle cx="150" cy="275" r="55" fill="#E6F0FF" stroke="#3A86FF" stroke-width="3"/><line x1="150" y1="220" x2="150" y2="330" stroke="#5B2A86" stroke-width="3"/><text x="136" y="280" font-size="16" fill="#5B2A86" text-anchor="end" font-weight="700">1</text><circle cx="495.575" cy="275" r="55" fill="#E6F0FF" stroke="#3A86FF" stroke-width="3"/><path d="M 150 200 Q 322.7875959474386 130 475.57519189487726 200" fill="none" stroke="#756986" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#au)"/><text x="322.788" y="150" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">uma volta completa</text><rect x="152" y="344" width="106" height="26" rx="6" fill="#5B2A86"/><text x="205" y="362" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">diâmetro 1</text><rect x="262" y="344" width="106" height="26" rx="6" fill="#3A86FF"/><text x="315" y="362" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">diâmetro 2</text><rect x="372" y="344" width="106" height="26" rx="6" fill="#2A9D8F"/><text x="425" y="362" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">diâmetro 3</text><rect x="482" y="344" width="13.5752" height="26" rx="4" fill="#FF6B6B"/><line x1="488" y1="374" x2="520" y2="390" stroke="#FF6B6B" stroke-width="2"/><text x="524" y="396" font-size="15" fill="#FF6B6B" text-anchor="start" font-weight="700">+ um pedacinho</text><rect x="250" y="405" width="500" height="50" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><text x="500" y="437" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">π = circunferência ÷ diâmetro = 3 e “um pouco”</text>
</svg>
