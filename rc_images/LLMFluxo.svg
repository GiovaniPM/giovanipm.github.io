<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">Como o app gera uma resposta</title><desc id="d">Diagrama em cinco caixas ligadas por setas, da esquerda para a direita: Texto, a conversa montada no formato do modelo; Tokenizador, que transforma texto em números; Transformer, com N camadas de atenção e MLP; Logits, uma nota para cada token; e Amostragem, com temperatura, top-k e top-p. Uma seta volta da Amostragem ao Texto: o token sorteado vira texto na tela e volta como entrada. Em cima, o arquivo .gguf fornece os pesos, o vocabulário e os metadados ao tokenizador e ao transformer. Embaixo do transformer, o cache KV guarda o que já foi lido. No rodapé: roda na GPU, com WebGPU e pesos em 16 bits, ou na CPU, com workers e pesos em 8 bits.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
