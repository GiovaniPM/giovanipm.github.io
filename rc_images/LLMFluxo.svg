<rect x="812.0" y="200" width="168" height="112" rx="14" fill="#FFFFFF" stroke="#B35300" stroke-width="3"/>
<rect x="812.0" y="200" width="168" height="34" rx="14" fill="#B35300"/><rect x="812.0" y="220" width="168" height="14" fill="#B35300"/>
<text x="896.0" y="223" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Amostragem</text>
