<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Vague prompt versus complete prompt</title>
<desc id="d">Two panels. On the left, in red, the vague prompt “Write an article about SQL with images” leads to generic text, repeated mistakes, decorative images, a single language with no references and a format unlike the other pages. On the right, in green, the complete prompt, with blocks for sources, context, audience, instructions, checks and delivery, leads to content drawn from the sources, tested examples, SVG figures that explain, three languages with references and the same template as the other pages.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="552" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Vague prompt versus complete prompt</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">The same request, with and without the instructions that shape the result</text>
<rect x="30.0" y="100.0" width="460.0" height="400.0" rx="14" fill="#FFE3E3" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="260.0" y="132.0" font-size="18" fill="#FF6B6B" text-anchor="middle" font-weight="700" xml:space="preserve">Vague prompt</text>
<rect x="50.0" y="150.0" width="420.0" height="70.0" rx="9" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="64.0" y="174.0" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Write an article about SQL</text>
<text x="64.0" y="194.0" font-size="13" fill="#F7F0FF" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">with images.</text>
<line x1="260" y1="228" x2="260" y2="252" stroke="#FF6B6B" stroke-width="2.5" marker-end="url(#am)"/>
<circle cx="68" cy="274" r="9" fill="#FF6B6B"/><path d="M64.5 270.5 l7 7 M71.5 270.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="279.0" font-size="14" fill="#3E3350" xml:space="preserve">generic text, not based on the sources</text>
<circle cx="68" cy="308" r="9" fill="#FF6B6B"/><path d="M64.5 304.5 l7 7 M71.5 304.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="313.0" font-size="14" fill="#3E3350" xml:space="preserve">the original’s mistakes repeated</text>
<circle cx="68" cy="342" r="9" fill="#FF6B6B"/><path d="M64.5 338.5 l7 7 M71.5 338.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="347.0" font-size="14" fill="#3E3350" xml:space="preserve">decorative or made-up images</text>
<circle cx="68" cy="376" r="9" fill="#FF6B6B"/><path d="M64.5 372.5 l7 7 M71.5 372.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="381.0" font-size="14" fill="#3E3350" xml:space="preserve">one language, no references</text>
<circle cx="68" cy="410" r="9" fill="#FF6B6B"/><path d="M64.5 406.5 l7 7 M71.5 406.5 l-7 7" stroke="#FFFFFF" stroke-width="2.4"/><text x="88.0" y="415.0" font-size="14" fill="#3E3350" xml:space="preserve">a format unlike the other pages</text>
<rect x="510.0" y="100.0" width="460.0" height="400.0" rx="14" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="740.0" y="132.0" font-size="18" fill="#2A9D8F" text-anchor="middle" font-weight="700" xml:space="preserve">Complete prompt</text>
<rect x="530.0" y="150.0" width="420.0" height="110.0" rx="9" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="544.0" y="174.0" font-size="13" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&lt;sources&gt; … &lt;/sources&gt;</text>
<text x="544.0" y="194.0" font-size="13" fill="#F7F0FF" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&lt;context&gt; &lt;audience&gt; &lt;instructions&gt;</text>
<text x="544.0" y="214.0" font-size="13" fill="#F7F0FF" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&lt;checks&gt; &lt;delivery&gt;</text>
<text x="544.0" y="234.0" font-size="13" fill="#F7F0FF" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Task: write a tutorial on …</text>
<line x1="740" y1="268" x2="740" y2="292" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#am)"/>
<circle cx="548" cy="314" r="9" fill="#2A9D8F"/><path d="M544 314 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="319.0" font-size="14" fill="#3E3350" xml:space="preserve">content drawn from the attached sources</text>
<circle cx="548" cy="348" r="9" fill="#2A9D8F"/><path d="M544 348 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="353.0" font-size="14" fill="#3E3350" xml:space="preserve">tested examples, mistakes flagged</text>
<circle cx="548" cy="382" r="9" fill="#2A9D8F"/><path d="M544 382 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="387.0" font-size="14" fill="#3E3350" xml:space="preserve">SVG figures that explain concepts</text>
<circle cx="548" cy="416" r="9" fill="#2A9D8F"/><path d="M544 416 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="421.0" font-size="14" fill="#3E3350" xml:space="preserve">three languages, numbered references</text>
<circle cx="548" cy="450" r="9" fill="#2A9D8F"/><path d="M544 450 l3 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><text x="568.0" y="455.0" font-size="14" fill="#3E3350" xml:space="preserve">the same template as the other pages</text>
<text x="500.0" y="530.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">The AI does not know your site’s conventions: anything left out of the prompt, it will decide for you.</text>
</svg>
