<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">O que a IA faz com cada anexo</title>
<desc id="d">Cinco tipos de anexo à esquerda, cada um com o que a IA deve fazer com ele: link, baixar todo o conteúdo e conferir se responde; texto colado, tratar como fonte e conferir fatos; imagem, descrever, extrair dados e redesenhar em SVG; PDF ou planilha, ler e citar a página; código, executar e testar. Setas levam a seis saídas no artigo: texto explicativo, exemplos testados, correções do original, figuras SVG, referências e revisão rápida.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">O que a IA faz com cada anexo</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Cada tipo de material entra no artigo de um jeito diferente</text>
<text x="130.0" y="98.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Você anexa</text><text x="470.0" y="98.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">A IA deve…</text><text x="845.0" y="98.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">No artigo</text>
<rect x="30.0" y="110.0" width="200.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.2"/><g fill="none" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"><path d="M54 144 l8 -8 a6 6 0 0 1 9 9 l-6 6"/><path d="M62 136 l-8 8 a6 6 0 0 0 9 9 l6 -6"/></g>
<text x="92.0" y="137.0" font-size="14" fill="#3A86FF" font-weight="700" xml:space="preserve">Link</text><text x="92.0" y="156.0" font-size="12" fill="#756986" xml:space="preserve">gist, repositório, página</text>
<line x1="236" y1="141" x2="268" y2="141" stroke="#3A86FF" stroke-width="2" marker-end="url(#am)"/>
<rect x="276.0" y="110.0" width="390.0" height="62.0" rx="10" fill="#E1ECFF" stroke="none" stroke-width="0"/>
<text x="292.0" y="136.0" font-size="12.5" fill="#3E3350" xml:space="preserve">baixar o conteúdo completo (todas as partes)</text>
<text x="292.0" y="155.0" font-size="12.5" fill="#3E3350" xml:space="preserve">e conferir se o link responde</text>
<rect x="30.0" y="188.0" width="200.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.2"/><rect x="46.0" y="202.0" width="28.0" height="34.0" rx="3" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.2"/><line x1="51" y1="211" x2="69" y2="211" stroke="#5B2A86" stroke-width="2"/><line x1="51" y1="218" x2="69" y2="218" stroke="#5B2A86" stroke-width="2"/><line x1="51" y1="225" x2="69" y2="225" stroke="#5B2A86" stroke-width="2"/>
<text x="92.0" y="215.0" font-size="14" fill="#5B2A86" font-weight="700" xml:space="preserve">Texto colado</text><text x="92.0" y="234.0" font-size="12" fill="#756986" xml:space="preserve">notas, rascunhos</text>
<line x1="236" y1="219" x2="268" y2="219" stroke="#5B2A86" stroke-width="2" marker-end="url(#am)"/>
<rect x="276.0" y="188.0" width="390.0" height="62.0" rx="10" fill="#EFE3FA" stroke="none" stroke-width="0"/>
<text x="292.0" y="214.0" font-size="12.5" fill="#3E3350" xml:space="preserve">tratar como fonte primária, mas</text>
<text x="292.0" y="233.0" font-size="12.5" fill="#3E3350" xml:space="preserve">conferir fatos, datas e nomes</text>
<rect x="30.0" y="266.0" width="200.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.2"/><rect x="42.0" y="283.0" width="36.0" height="28.0" rx="3" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.2"/><circle cx="52" cy="292" r="3.5" fill="#C2185B"/><path d="M44 309 l11 -11 l7 7 l5 -5 l9 9 z" fill="#C2185B"/>
<text x="92.0" y="293.0" font-size="14" fill="#C2185B" font-weight="700" xml:space="preserve">Imagem</text><text x="92.0" y="312.0" font-size="12" fill="#756986" xml:space="preserve">print, diagrama, foto</text>
<line x1="236" y1="297" x2="268" y2="297" stroke="#C2185B" stroke-width="2" marker-end="url(#am)"/>
<rect x="276.0" y="266.0" width="390.0" height="62.0" rx="10" fill="#E1ECFF" stroke="none" stroke-width="0"/>
<text x="292.0" y="292.0" font-size="12.5" fill="#3E3350" xml:space="preserve">descrever o que mostra e extrair dados;</text>
<text x="292.0" y="311.0" font-size="12.5" fill="#3E3350" xml:space="preserve">redesenhar em SVG, nunca copiar</text>
<rect x="30.0" y="344.0" width="200.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#B35300" stroke-width="2.2"/><rect x="46.0" y="358.0" width="28.0" height="34.0" rx="3" fill="#FFFFFF" stroke="#B35300" stroke-width="2.2"/><text x="60.0" y="381.0" font-size="9" fill="#B35300" text-anchor="middle" font-weight="700" xml:space="preserve">PDF</text>
<text x="92.0" y="371.0" font-size="14" fill="#B35300" font-weight="700" xml:space="preserve">PDF ou planilha</text><text x="92.0" y="390.0" font-size="12" fill="#756986" xml:space="preserve">manual, relatório</text>
<line x1="236" y1="375" x2="268" y2="375" stroke="#B35300" stroke-width="2" marker-end="url(#am)"/>
<rect x="276.0" y="344.0" width="390.0" height="62.0" rx="10" fill="#EFE3FA" stroke="none" stroke-width="0"/>
<text x="292.0" y="370.0" font-size="12.5" fill="#3E3350" xml:space="preserve">ler as partes relevantes e citar</text>
<text x="292.0" y="389.0" font-size="12.5" fill="#3E3350" xml:space="preserve">página ou seção de onde veio</text>
<rect x="30.0" y="422.0" width="200.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.2"/><g fill="none" stroke="#2A9D8F" stroke-width="2.6"><circle cx="52" cy="442" r="4"/><circle cx="52" cy="466" r="4"/><circle cx="70" cy="448" r="4"/><path d="M52 446 v16 M70 452 q0 8 -14 12"/></g>
<text x="92.0" y="449.0" font-size="14" fill="#2A9D8F" font-weight="700" xml:space="preserve">Código</text><text x="92.0" y="468.0" font-size="12" fill="#756986" xml:space="preserve">scripts, exemplos</text>
<line x1="236" y1="453" x2="268" y2="453" stroke="#2A9D8F" stroke-width="2" marker-end="url(#am)"/>
<rect x="276.0" y="422.0" width="390.0" height="62.0" rx="10" fill="#E1ECFF" stroke="none" stroke-width="0"/>
<text x="292.0" y="448.0" font-size="12.5" fill="#3E3350" xml:space="preserve">executar e testar os exemplos</text>
<text x="292.0" y="467.0" font-size="12.5" fill="#3E3350" xml:space="preserve">antes de publicá-los</text>
