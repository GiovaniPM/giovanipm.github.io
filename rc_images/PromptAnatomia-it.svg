<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 772" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Anatomia del prompt completo</title>
<desc id="d">Una pila di sette blocchi, dall’alto in basso: fonti, con il materiale di base; contesto, con il sito e le pagine modello; pubblico, con lettore e obiettivo; istruzioni, il blocco più grande, con lettura e verifica, struttura, figure, riferimenti, lingue e pubblicazione; verifiche, con i controlli finali; consegna, con il riepilogo; e il compito, una frase con la richiesta. Una nota indica che il materiale lungo viene prima e la richiesta per ultima.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="772" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Anatomia del prompt completo</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Sette blocchi, ognuno con i propri tag, nell’ordine che l’IA sfrutta meglio</text>
<rect x="40.0" y="116.0" width="440.0" height="74.0" rx="10" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.4"/>
<rect x="40.0" y="116.0" width="12.0" height="74.0" rx="0" fill="#3A86FF" stroke="#3A86FF" stroke-width="0"/>
<text x="66.0" y="140.0" font-size="15" fill="#3A86FF" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">&lt;fonti&gt;</text>
<text x="66.0" y="162.0" font-size="12.5" fill="#3E3350" xml:space="preserve">link, testi incollati, immagini, PDF,</text>
<text x="66.0" y="181.0" font-size="12.5" fill="#3E3350" xml:space="preserve">ognuno in un tag &lt;fonte&gt;</text>
<line x1="486" y1="153.0" x2="516" y2="153.0" stroke="#3A86FF" stroke-width="2" stroke-dasharray="4 4"/>
<text x="526.0" y="150.0" font-size="13" fill="#3A86FF" font-weight="700" xml:space="preserve">Il materiale di base</text>
<text x="526.0" y="167.0" font-size="13" fill="#3E3350" xml:space="preserve">link, testi, immagini, PDF</text>
<rect x="40.0" y="202.0" width="440.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.4"/>
<rect x="40.0" y="202.0" width="12.0" height="56.0" rx="0" fill="#5B2A86" stroke="#5B2A86" stroke-width="0"/>
<text x="66.0" y="226.0" font-size="15" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">&lt;contesto&gt;</text>
<text x="66.0" y="248.0" font-size="12.5" fill="#3E3350" xml:space="preserve">sito, cartella immagini, pagine modello</text>
<line x1="486" y1="230.0" x2="516" y2="230.0" stroke="#5B2A86" stroke-width="2" stroke-dasharray="4 4"/>
<text x="526.0" y="227.0" font-size="13" fill="#5B2A86" font-weight="700" xml:space="preserve">Dove vivrà l’articolo</text>
<text x="526.0" y="244.0" font-size="13" fill="#3E3350" xml:space="preserve">e quali pagine fanno da modello</text>
<rect x="40.0" y="270.0" width="440.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.4"/>
<rect x="40.0" y="270.0" width="12.0" height="56.0" rx="0" fill="#5B2A86" stroke="#5B2A86" stroke-width="0"/>
<text x="66.0" y="294.0" font-size="15" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">&lt;pubblico&gt;</text>
<text x="66.0" y="316.0" font-size="12.5" fill="#3E3350" xml:space="preserve">lettore, livello e obiettivo</text>
<line x1="486" y1="298.0" x2="516" y2="298.0" stroke="#5B2A86" stroke-width="2" stroke-dasharray="4 4"/>
<text x="526.0" y="295.0" font-size="13" fill="#5B2A86" font-weight="700" xml:space="preserve">Per chi si scrive</text>
<text x="526.0" y="312.0" font-size="13" fill="#3E3350" xml:space="preserve">definisce livello ed esempi</text>
<rect x="40.0" y="338.0" width="440.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.4"/>
<rect x="40.0" y="338.0" width="12.0" height="150.0" rx="0" fill="#C2185B" stroke="#C2185B" stroke-width="0"/>
<text x="66.0" y="362.0" font-size="15" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">&lt;istruzioni&gt;</text>
<text x="66.0" y="384.0" font-size="12.5" fill="#3E3350" xml:space="preserve">1. lettura e verifica delle fonti</text>
<text x="66.0" y="403.0" font-size="12.5" fill="#3E3350" xml:space="preserve">2. struttura e tono</text>
<text x="66.0" y="422.0" font-size="12.5" fill="#3E3350" xml:space="preserve">3. figure SVG</text>
<text x="66.0" y="441.0" font-size="12.5" fill="#3E3350" xml:space="preserve">4. riferimenti</text>
<text x="66.0" y="460.0" font-size="12.5" fill="#3E3350" xml:space="preserve">5. lingue</text>
<text x="66.0" y="479.0" font-size="12.5" fill="#3E3350" xml:space="preserve">6. pubblicazione sul sito</text>
<line x1="486" y1="413.0" x2="516" y2="413.0" stroke="#C2185B" stroke-width="2" stroke-dasharray="4 4"/>
<text x="526.0" y="410.0" font-size="13" fill="#C2185B" font-weight="700" xml:space="preserve">Come svolgere il lavoro</text>
<text x="526.0" y="427.0" font-size="13" fill="#3E3350" xml:space="preserve">il blocco più grande: le regole</text>
<rect x="40.0" y="500.0" width="440.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#B35300" stroke-width="2.4"/>
<rect x="40.0" y="500.0" width="12.0" height="56.0" rx="0" fill="#B35300" stroke="#B35300" stroke-width="0"/>
<text x="66.0" y="524.0" font-size="15" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">&lt;verifiche&gt;</text>
<text x="66.0" y="546.0" font-size="12.5" fill="#3E3350" xml:space="preserve">id, link, immagini, citazioni, rendering</text>
<line x1="486" y1="528.0" x2="516" y2="528.0" stroke="#B35300" stroke-width="2" stroke-dasharray="4 4"/>
<text x="526.0" y="525.0" font-size="13" fill="#B35300" font-weight="700" xml:space="preserve">Come capire che è finito</text>
<text x="526.0" y="542.0" font-size="13" fill="#3E3350" xml:space="preserve">controlli oggettivi</text>
<rect x="40.0" y="568.0" width="440.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.4"/>
<rect x="40.0" y="568.0" width="12.0" height="56.0" rx="0" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/>
<text x="66.0" y="592.0" font-size="15" fill="#2A9D8F" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">&lt;consegna&gt;</text>
<text x="66.0" y="614.0" font-size="12.5" fill="#3E3350" xml:space="preserve">riepilogo e cose rimaste in sospeso</text>
<line x1="486" y1="596.0" x2="516" y2="596.0" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="4 4"/>
<text x="526.0" y="593.0" font-size="13" fill="#2A9D8F" font-weight="700" xml:space="preserve">Che cosa restituire</text>
<text x="526.0" y="610.0" font-size="13" fill="#3E3350" xml:space="preserve">riepilogo, correzioni, sospesi</text>
<rect x="40.0" y="636.0" width="440.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.4"/>
<rect x="40.0" y="636.0" width="12.0" height="58.0" rx="0" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="0"/>
<text x="66.0" y="660.0" font-size="15" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">Compito</text>
<text x="66.0" y="682.0" font-size="12.5" fill="#3E3350" xml:space="preserve">“Crea un tutorial su … basato sulle fonti.”</text>
<line x1="486" y1="665.0" x2="516" y2="665.0" stroke="#2B1B3D" stroke-width="2" stroke-dasharray="4 4"/>
<text x="526.0" y="662.0" font-size="13" fill="#2B1B3D" font-weight="700" xml:space="preserve">Una frase con la richiesta</text>
<text x="526.0" y="679.0" font-size="13" fill="#3E3350" xml:space="preserve"></text>
<text x="260.0" y="106.0" font-size="12" fill="#756986" text-anchor="middle" font-weight="700" xml:space="preserve">↑ prima il materiale lungo</text>
<text x="260.0" y="718.0" font-size="12" fill="#756986" text-anchor="middle" font-weight="700" xml:space="preserve">↓ la richiesta per ultima</text>
<text x="500.0" y="750.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Tag come &lt;fonti&gt; separano il materiale dalle istruzioni ed evitano che i due si confondano.</text>
</svg>
