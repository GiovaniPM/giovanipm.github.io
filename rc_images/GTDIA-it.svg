<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">L’IA in ogni passo del GTD</title>
<desc id="d">Cinque colonne, una per passo del GTD, che mostrano come aiuta l’intelligenza artificiale: raccogliere, trascrivendo voce e riunioni e riassumendo e-mail e chat; chiarire, suggerendo se un elemento è azionabile e abbozzando il risultato e l’azione successiva; organizzare, proponendo liste, contesti e date e segnalando i duplicati; riflettere, preparando la revisione settimanale e mostrando i progetti fermi; agire, suggerendo l’azione per contesto ed energia, con agenti che eseguono compiti semplici. In basso, la regola: l’IA suggerisce e sei tu a decidere cosa diventa un impegno.</desc>
<rect width="1000" height="466" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">L’IA in ogni passo del GTD</text>
<rect x="34" y="84" width="176" height="56" rx="12" fill="#5B2A86"/>
<text x="122.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Raccogliere</text>
<rect x="34" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="54" cy="186" r="5" fill="#5B2A86"/><text x="66.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">trascrive voce</text><text x="66.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">e riunioni</text>
<circle cx="54" cy="256" r="5" fill="#5B2A86"/><text x="66.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">riassume e-mail</text><text x="66.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">e chat</text>
<rect x="222" y="84" width="176" height="56" rx="12" fill="#2F6FE0"/>
<text x="310.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chiarire</text>
<rect x="222" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/>
<circle cx="242" cy="186" r="5" fill="#2F6FE0"/><text x="254.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">suggerisce se è</text><text x="254.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">azionabile</text>
<circle cx="242" cy="256" r="5" fill="#2F6FE0"/><text x="254.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">abbozza risultato</text><text x="254.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">e azione successiva</text>
<rect x="410" y="84" width="176" height="56" rx="12" fill="#0E8074"/>
<text x="498.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Organizzare</text>
<rect x="410" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<circle cx="430" cy="186" r="5" fill="#0E8074"/><text x="442.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">propone liste,</text><text x="442.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">contesti e date</text>
<circle cx="430" cy="256" r="5" fill="#0E8074"/><text x="442.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">segnala elementi</text><text x="442.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">duplicati</text>
<rect x="598" y="84" width="176" height="56" rx="12" fill="#B35300"/>
<text x="686.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Riflettere</text>
<rect x="598" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<circle cx="618" cy="186" r="5" fill="#B35300"/><text x="630.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">prepara la</text><text x="630.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">revisione settimanale</text>
<circle cx="618" cy="256" r="5" fill="#B35300"/><text x="630.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">mostra progetti</text><text x="630.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">fermi</text>
<rect x="786" y="84" width="176" height="56" rx="12" fill="#C2185B"/>
<text x="874.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Agire</text>
<rect x="786" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<circle cx="806" cy="186" r="5" fill="#C2185B"/><text x="818.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">suggerisce l’azione</text><text x="818.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">per contesto ed energia</text>
<circle cx="806" cy="256" r="5" fill="#C2185B"/><text x="818.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">gli agenti eseguono</text><text x="818.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">compiti semplici</text>
<rect x="34" y="340" width="928" height="64" rx="14" fill="#2B1B3D"/>
<text x="498.0" y="380.0" font-size="19" font-weight="700" fill="#FFC94D" text-anchor="middle">L’IA suggerisce. Sei tu a decidere cosa diventa un impegno.</text>
<text x="500.0" y="446.0" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Prima di incollare dati in un assistente, verifica la politica sulla privacy della tua azienda.</text>
</svg>
