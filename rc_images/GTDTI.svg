<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">O trabalho de TI no GTD</title>
<desc id="d">Tabela com oito tipos de trabalho de TI e a lista do GTD para onde cada um vai: alerta de produção, faça agora, é um incidente; ticket atribuído a você, próxima ação no contexto computador; pull request para revisar, faça se levar menos de dois minutos, senão vira próxima ação; pergunta no chat da equipe, responda ou transforme em ação; dependência de outra equipe, lista aguardando, com data para cobrar; migração em várias etapas, projeto com a próxima ação definida; ideia de refatoração, algum dia ou talvez, ou o backlog; runbook e documentação, referência.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">O trabalho de TI no GTD</text>
<text x="250.0" y="96.0" font-size="15" font-weight="700" fill="#756986" text-anchor="middle">Chega como…</text>
<text x="700.0" y="96.0" font-size="15" font-weight="700" fill="#756986" text-anchor="middle">Vai para…</text>
<rect x="90.0" y="112.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="139.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Alerta de produção</text>
<path d="M418.0 133.0 L467.0 133.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 133.0 L467.0 139.0 L467.0 127.0 Z" fill="#756986"/>
<rect x="486.0" y="112.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2"/>
<text x="701.0" y="139.0" font-size="14.5" font-weight="700" fill="#2A9D8F" text-anchor="middle">Faça agora: é um incidente</text>
<rect x="90.0" y="166.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="193.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Ticket atribuído a você</text>
<path d="M418.0 187.0 L467.0 187.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 187.0 L467.0 193.0 L467.0 181.0 Z" fill="#756986"/>
<rect x="486.0" y="166.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#0E8074" stroke-width="2"/>
<text x="701.0" y="193.0" font-size="14.5" font-weight="700" fill="#0E8074" text-anchor="middle">Próxima ação @computador</text>
<rect x="90.0" y="220.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="247.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Pull request para revisar</text>
<path d="M418.0 241.0 L467.0 241.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 241.0 L467.0 247.0 L467.0 235.0 Z" fill="#756986"/>
<rect x="486.0" y="220.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#0E8074" stroke-width="2"/>
<text x="701.0" y="247.0" font-size="14.5" font-weight="700" fill="#0E8074" text-anchor="middle">Menos de 2 min? Faça. Se não, próxima ação</text>
<rect x="90.0" y="274.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="301.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Pergunta no chat da equipe</text>
<path d="M418.0 295.0 L467.0 295.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 295.0 L467.0 301.0 L467.0 289.0 Z" fill="#756986"/>
<rect x="486.0" y="274.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#0E8074" stroke-width="2"/>
<text x="701.0" y="301.0" font-size="14.5" font-weight="700" fill="#0E8074" text-anchor="middle">Responda ou transforme em ação</text>
<rect x="90.0" y="328.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="355.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Depende de outra equipe</text>
<path d="M418.0 349.0 L467.0 349.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 349.0 L467.0 355.0 L467.0 343.0 Z" fill="#756986"/>
<rect x="486.0" y="328.0" width="430.0" height="42.0" rx="10" fill="#FDE4EA" stroke="#E04E6B" stroke-width="2"/>
<text x="701.0" y="355.0" font-size="14.5" font-weight="700" fill="#E04E6B" text-anchor="middle">Aguardando, com data para cobrar</text>
<rect x="90.0" y="382.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="409.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Migração em várias etapas</text>
<path d="M418.0 403.0 L467.0 403.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 403.0 L467.0 409.0 L467.0 397.0 Z" fill="#756986"/>
<rect x="486.0" y="382.0" width="430.0" height="42.0" rx="10" fill="#F0E6FA" stroke="#7B3FB0" stroke-width="2"/>
<text x="701.0" y="409.0" font-size="14.5" font-weight="700" fill="#7B3FB0" text-anchor="middle">Projeto, com a próxima ação definida</text>
<rect x="90.0" y="436.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="463.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Ideia de refatoração</text>
<path d="M418.0 457.0 L467.0 457.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 457.0 L467.0 463.0 L467.0 451.0 Z" fill="#756986"/>
<rect x="486.0" y="436.0" width="430.0" height="42.0" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="701.0" y="463.0" font-size="14.5" font-weight="700" fill="#B35300" text-anchor="middle">Algum dia / talvez, ou o backlog</text>
<rect x="90.0" y="490.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="517.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Runbook e documentação</text>
<path d="M418.0 511.0 L467.0 511.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 511.0 L467.0 517.0 L467.0 505.0 Z" fill="#756986"/>
<rect x="486.0" y="490.0" width="430.0" height="42.0" rx="10" fill="#E1ECFD" stroke="#2F6FE0" stroke-width="2"/>
<text x="701.0" y="517.0" font-size="14.5" font-weight="700" fill="#2F6FE0" text-anchor="middle">Referência</text>
</svg>
