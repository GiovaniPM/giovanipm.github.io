<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il problema dei covoni di grano</title>
<desc id="d">Primo problema del capitolo 8 dei Nove capitoli. Tre raccolti, di qualità alta, media e bassa. Riga 1: 3 covoni di qualità alta, 2 di media e 1 di bassa rendono 39 dou di grano. Riga 2: 2 alti, 3 medi e 1 basso rendono 34 dou. Riga 3: 1 alto, 2 medi e 3 bassi rendono 26 dou. La domanda: quanto rende un covone di ciascun tipo?</desc>
