<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The four engine commands</title>
<desc id="d">A planet at the bottom and an object at the top of its orbit, moving to the right. Four arrows leave the object: Speed up, forward, along the motion; Brake, backward; Out, away from the planet; In, toward the planet. On the right, one card per command with its key and its effect on the orbit.</desc>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">The four engine commands</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Directions are relative to the motion and the planet, not the screen</text>
<path d="M204.0 425.0 a66 66 0 1 0 132 0 a66 66 0 1 0 -132 0 M214.0 425.0 a56 56 0 1 1 112 0 a56 56 0 1 1 -112 0 z" fill="#8DC0F0" fill-opacity="0.45" fill-rule="evenodd"/>
<defs><radialGradient id="pl" cx="35%" cy="35%" r="75%"><stop offset="0" stop-color="#8DC0F0"/><stop offset="1" stop-color="#2E5E9A"/></radialGradient></defs>
<circle cx="270.0" cy="425.0" r="56.0" fill="url(#pl)"/>
<path d="M93.9 301.7 L97.9 296.1 L102.1 290.7 L106.5 285.4 L111.1 280.2 L115.8 275.2 L120.6 270.3 L125.7 265.6 L130.8 261.1 L136.2 256.7 L141.6 252.5 L147.2 248.5 L152.9 244.7 L158.7 241.0 L164.7 237.6 L170.7 234.3 L176.9 231.2 L183.1 228.3 L189.5 225.7 L195.9 223.2 L202.4 220.9 L208.9 218.9 L215.6 217.0 L222.2 215.4 L229.0 214.0 L235.7 212.7 L242.6 211.8 L249.4 211.0 L256.3 210.4 L263.1 210.1 L270.0 210.0 L276.9 210.1 L283.7 210.4 L290.6 211.0 L297.4 211.8 L304.3 212.7 L311.0 214.0 L317.8 215.4 L324.4 217.0 L331.1 218.9 L337.6 220.9 L344.1 223.2 L350.5 225.7 L356.9 228.3 L363.1 231.2 L369.3 234.3 L375.3 237.6 L381.3 241.0 L387.1 244.7 L392.8 248.5 L398.4 252.5 L403.8 256.7 L409.2 261.1 L414.3 265.6 L419.4 270.3 L424.2 275.2 L428.9 280.2 L433.5 285.4 L437.9 290.7 L442.1 296.1 L446.1 301.7" fill="none" stroke="#756986" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="410.0" y1="184.0" x2="470.0" y2="184.0" stroke="#756986" stroke-width="1.5" marker-end="url(#mm)"/>
<text x="410.0" y="176.0" font-size="12" fill="#756986" text-anchor="start" font-style="italic" xml:space="preserve">motion</text>
<line x1="284.0" y1="210.0" x2="370.0" y2="210.0" stroke="#B35300" stroke-width="4" marker-end="url(#mg)"/>
<line x1="256.0" y1="210.0" x2="170.0" y2="210.0" stroke="#D62828" stroke-width="4" marker-end="url(#mr)"/>
<line x1="270.0" y1="196.0" x2="270.0" y2="138.0" stroke="#3A86FF" stroke-width="4" marker-end="url(#ms)"/>
<line x1="270.0" y1="224.0" x2="270.0" y2="290.0" stroke="#0E8074" stroke-width="4" marker-end="url(#mt)"/>
<text x="378.0" y="215.0" font-size="15" fill="#B35300" text-anchor="start" font-weight="700" xml:space="preserve">Speed up</text>
<text x="162.0" y="215.0" font-size="15" fill="#D62828" text-anchor="end" font-weight="700" xml:space="preserve">Brake</text>
<text x="286.0" y="148.0" font-size="15" fill="#3A86FF" text-anchor="start" font-weight="700" xml:space="preserve">Out</text>
<text x="286.0" y="284.0" font-size="15" fill="#0E8074" text-anchor="start" font-weight="700" xml:space="preserve">In</text>
<path d="M10 0 l-18 -9 l5 9 l-5 9 z" fill="#2B1B3D" transform="translate(270 210)"/>
<rect x="560.0" y="100.0" width="400.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<rect x="560" y="100" width="6" height="76" rx="3" fill="#B35300"/>
<text x="580.0" y="124.0" font-size="16" fill="#B35300" text-anchor="start" font-weight="700" xml:space="preserve">Speed up</text>
<rect x="876.0" y="109.0" width="64.0" height="22.0" rx="6" fill="#FFF1C9"/>
<text x="908.0" y="125.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">↑ or W</text>
<text x="580.0" y="146.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">More speed: the opposite side</text>
<text x="580.0" y="164.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">of the orbit rises.</text>
<rect x="560.0" y="188.0" width="400.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<rect x="560" y="188" width="6" height="76" rx="3" fill="#D62828"/>
<text x="580.0" y="212.0" font-size="16" fill="#D62828" text-anchor="start" font-weight="700" xml:space="preserve">Brake</text>
<rect x="876.0" y="197.0" width="64.0" height="22.0" rx="6" fill="#FFF1C9"/>
<text x="908.0" y="213.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">↓ or S</text>
<text x="580.0" y="234.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Less speed: the opposite side</text>
<text x="580.0" y="252.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">drops. This is the capture command.</text>
<rect x="560.0" y="276.0" width="400.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<rect x="560" y="276" width="6" height="76" rx="3" fill="#3A86FF"/>
<text x="580.0" y="300.0" font-size="16" fill="#3A86FF" text-anchor="start" font-weight="700" xml:space="preserve">Out</text>
<rect x="876.0" y="285.0" width="64.0" height="22.0" rx="6" fill="#FFF1C9"/>
<text x="908.0" y="301.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">→ or D</text>
<text x="580.0" y="322.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Pushes away from the planet. While</text>
<text x="580.0" y="340.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">falling, it raises the periapsis.</text>
<rect x="560.0" y="364.0" width="400.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<rect x="560" y="364" width="6" height="76" rx="3" fill="#0E8074"/>
<text x="580.0" y="388.0" font-size="16" fill="#0E8074" text-anchor="start" font-weight="700" xml:space="preserve">In</text>
<rect x="876.0" y="373.0" width="64.0" height="22.0" rx="6" fill="#FFF1C9"/>
<text x="908.0" y="389.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">← or A</text>
<text x="580.0" y="410.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Pulls toward the planet. While</text>
<text x="580.0" y="428.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">falling, it lowers the periapsis.</text>
<text x="760.0" y="478.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Two keys together add up the directions.</text>
</svg>
