<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Lei de Kidlin: do pensamento ao papel</title>
<desc id="d">Dois painéis com o mesmo problema. À esquerda, na cabeça: frases soltas como o sistema está lento, acho que é o banco de dados, só acontece às vezes, os clientes estão reclamando e alguém precisa ver isso. Uma seta chamada escrever leva ao painel da direita, no papel, com o problema estruturado: o quê, a tela de pedidos leva 12 segundos para abrir; quando, de segunda a sexta, das 9h às 11h; onde, só nas lojas da região Sul; desde, a implantação da versão 4.2; impacto, cerca de 300 pedidos atrasados por dia; meta, abrir em menos de 2 segundos. Embaixo: metade resolvido, agora dá para medir, dividir, priorizar e pedir ajuda.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Lei de Kidlin: do pensamento ao papel</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">O mesmo problema, antes e depois de escrito</text>
<rect x="40" y="100" width="380" height="320" rx="14" fill="#FFFFFF" stroke="#D9C9B4" stroke-width="2.5"/>
<path d="M40 114 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v32 h-380 z" fill="#D9C9B4"/>
<text x="230.0" y="127" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Na cabeça</text>
<g transform="rotate(-4 70 180)"><text x="70" y="180" font-size="15" fill="#756986" font-style="italic">“O sistema está lento”</text></g>
<g transform="rotate(3 150 225)"><text x="150" y="225" font-size="15" fill="#756986" font-style="italic">“Acho que é o banco de dados”</text></g>
<g transform="rotate(-2 80 275)"><text x="80" y="275" font-size="15" fill="#756986" font-style="italic">“Só acontece às vezes”</text></g>
<g transform="rotate(4 130 325)"><text x="130" y="325" font-size="15" fill="#756986" font-style="italic">“Os clientes estão reclamando”</text></g>
<g transform="rotate(-3 75 380)"><text x="75" y="380" font-size="15" fill="#756986" font-style="italic">“Alguém precisa ver isso”</text></g>
<line x1="436" y1="260" x2="514" y2="260" stroke="#3A86FF" stroke-width="4" marker-end="url(#ar)"/>
<text x="475" y="248" font-size="14" fill="#3A86FF" text-anchor="middle" font-weight="700">escrever</text>
<rect x="530" y="100" width="430" height="320" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<path d="M530 114 a14 14 0 0 1 14 -14 h402 a14 14 0 0 1 14 14 v32 h-430 z" fill="#3A86FF"/>
<text x="745.0" y="127" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">No papel</text>
<text x="552" y="168" font-size="13.5" fill="#3A86FF" font-weight="700">O quê</text>
<text x="640" y="168" font-size="14" fill="#2B1B3D">A tela de pedidos leva 12 s para abrir</text>
<line x1="550" y1="184" x2="940" y2="184" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="210" font-size="13.5" fill="#3A86FF" font-weight="700">Quando</text>
<text x="640" y="210" font-size="14" fill="#2B1B3D">De segunda a sexta, das 9h às 11h</text>
<line x1="550" y1="226" x2="940" y2="226" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="252" font-size="13.5" fill="#3A86FF" font-weight="700">Onde</text>
<text x="640" y="252" font-size="14" fill="#2B1B3D">Só nas lojas da região Sul</text>
<line x1="550" y1="268" x2="940" y2="268" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="294" font-size="13.5" fill="#3A86FF" font-weight="700">Desde</text>
<text x="640" y="294" font-size="14" fill="#2B1B3D">A implantação da versão 4.2</text>
<line x1="550" y1="310" x2="940" y2="310" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="336" font-size="13.5" fill="#3A86FF" font-weight="700">Impacto</text>
<text x="640" y="336" font-size="14" fill="#2B1B3D">Cerca de 300 pedidos atrasados por dia</text>
<line x1="550" y1="352" x2="940" y2="352" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="378" font-size="13.5" fill="#3A86FF" font-weight="700">Meta</text>
<text x="640" y="378" font-size="14" fill="#2B1B3D">Abrir em menos de 2 s</text>
<text x="500.0" y="462" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Metade resolvido: agora dá para medir, dividir, priorizar e pedir ajuda</text>
</svg>
