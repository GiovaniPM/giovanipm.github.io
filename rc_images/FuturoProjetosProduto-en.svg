<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">From project to product: what changes</title>
<desc id="d">Comparison between project and product. Team: in a project it is assembled and disbanded at the end; in a product it is stable and long-lived. Work: in a project people are brought to the work; in a product work is brought to the team. Funding: per project, approved once, versus continuous, by capacity, reviewed every quarter. Success: time, cost and scope, versus business and customer outcomes. End: delivered and handed over to maintenance, versus evolves while it creates value. Risk: concentrated at the end, versus spread across small deliveries.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">From project to product: what changes</text>
<rect x="40" y="78" width="360" height="46" rx="12" fill="#FF6B6B"/>
<text x="220" y="108" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Project</text>
<rect x="600" y="78" width="360" height="46" rx="12" fill="#0E8074"/>
<text x="780" y="108" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Product (value stream)</text>
<rect x="40" y="140" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="140" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="140" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="140" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="163.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Assembled for the project,</text><text x="220" y="182.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">disbanded at the end</text>
<text x="780" y="173.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Stable and long-lived</text>
<path d="M414 146 H566 L586 168.0 L566 190 H414 Z" fill="#5B2A86"/>
<text x="494" y="173.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Team</text>
<rect x="40" y="204" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="204" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="204" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="204" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="237.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">People are brought to the work</text>
<text x="780" y="237.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Work is brought to the team</text>
<path d="M414 210 H566 L586 232.0 L566 254 H414 Z" fill="#5B2A86"/>
<text x="494" y="237.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Work</text>
<rect x="40" y="268" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="268" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="268" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="268" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="301.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Per project, approved once</text>
<text x="780" y="291.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Continuous, by capacity,</text><text x="780" y="310.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">reviewed every quarter</text>
<path d="M414 274 H566 L586 296.0 L566 318 H414 Z" fill="#5B2A86"/>
<text x="494" y="301.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Funding</text>
<rect x="40" y="332" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="332" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="332" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="332" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="365.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Time, cost and scope</text>
<text x="780" y="355.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Business and customer</text><text x="780" y="374.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">outcomes</text>
<path d="M414 338 H566 L586 360.0 L566 382 H414 Z" fill="#5B2A86"/>
