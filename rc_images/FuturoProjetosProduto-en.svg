<rect x="40" y="396" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="396" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="396" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="396" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="419.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Delivered and handed over</text><text x="220" y="438.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">to maintenance</text>
<text x="780" y="429.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Evolves while it creates value</text>
<path d="M414 402 H566 L586 424.0 L566 446 H414 Z" fill="#5B2A86"/>
<text x="494" y="429.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">End</text>
<rect x="40" y="460" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="460" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="460" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="460" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="493.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Concentrated at the end</text>
<text x="780" y="493.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Spread across small deliveries</text>
<path d="M414 466 H566 L586 488.0 L566 510 H414 Z" fill="#5B2A86"/>
<text x="494" y="493.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Risk</text>
<text x="500" y="540" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Based on Kersten (2018) and Kelly (2018).</text>
