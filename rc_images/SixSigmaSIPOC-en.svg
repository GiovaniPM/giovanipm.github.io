<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">SIPOC: the end-to-end process on one page</title>
<desc id="d">Five columns: suppliers (restaurant, app, courier, ingredient supplier); inputs (order, ingredients, address, payment); process (receive order, prepare, pack, deliver); outputs (food delivered, receipt, rating, timing data); customers (who ordered, restaurant, app).</desc>
