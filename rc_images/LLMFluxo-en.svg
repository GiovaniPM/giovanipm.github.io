<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">How the app generates an answer</title><desc id="d">Diagram with five boxes linked by arrows, left to right: Text, the chat built in the model's format; Tokenizer, which turns text into numbers; Transformer, with N layers of attention and MLP; Logits, one score for every token; and Sampling, with temperature, top-k and top-p. An arrow goes back from Sampling to Text: the drawn token becomes text on screen and goes back in as input. At the top, the .gguf file supplies weights, vocabulary and metadata to the tokenizer and the transformer. Below the transformer, the KV cache keeps what was already read. At the bottom: runs on the GPU, with WebGPU and 16-bit weights, or on the CPU, with workers and 8-bit weights.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
