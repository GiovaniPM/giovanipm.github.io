<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Scatola nera, grigia e bianca</title>
<desc id="d">Tre scatole affiancate, ognuna con una freccia di input e una di output. La scatola nera è opaca, con un punto interrogativo: il tester vede solo input e output. La scatola grigia mostra parte dell’interno, come un database e delle tabelle. La scatola bianca mostra il flusso del codice, con i rami. Una barra sfumata sotto indica la conoscenza della struttura interna, da nessuna a totale.</desc>
