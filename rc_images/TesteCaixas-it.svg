<text x="180" y="300" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700">Scatola nera</text>
<text x="180" y="325" font-size="14" fill="#3E3350" text-anchor="middle">solo input e output</text>
<text x="180" y="346" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">test funzionali, lato utente</text>
<text x="500" y="300" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700">Scatola grigia</text>
<text x="500" y="325" font-size="14" fill="#3E3350" text-anchor="middle">conosce una parte: progetto, DB</text>
<text x="500" y="346" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">integrazione, API, dati</text>
<text x="820" y="300" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700">Scatola bianca</text>
<text x="820" y="325" font-size="14" fill="#3E3350" text-anchor="middle">conosce il codice</text>
<text x="820" y="346" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">percorsi, rami, copertura</text>
