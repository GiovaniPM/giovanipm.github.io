<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" role="img" aria-labelledby="t d"><title id="t">Le parti di una funzionalità in Gherkin</title><desc id="d">Esempio annotato: la funzionalità dice cosa verrà testato; il contesto vale per tutti gli scenari; ogni scenario descrive un comportamento con situazione iniziale, azione e risultato; lo schema ripete il test con i dati della tabella degli esempi, un'esecuzione per riga.</desc><rect width="1000" height="524" rx="18" fill="#FFF7EC"/><text x="500" y="38" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#2B1B3D" xml:space="preserve">Le parti di una funzionalità in Gherkin</text><text class="c" x="30" y="84" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Funzionalità:</tspan> Buono sconto</text><path d="M618 78h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="78" r="3.5" fill="#C2185B"/><text class="n" x="646" y="84" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">cosa verrà testato</text><text class="c" x="48" y="121" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Contesto:</tspan></text><path d="M618 115h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="115" r="3.5" fill="#C2185B"/><text class="n" x="646" y="121" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">vale per tutti gli scenari</text><text class="c" x="66" y="158" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Dato</tspan> che ho 200 € nel carrello</text><text class="c" x="48" y="195" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Scenario:</tspan> Applicare un buono valido</text><path d="M618 189h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="189" r="3.5" fill="#C2185B"/><text class="n" x="646" y="195" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">un comportamento</text><text class="c" x="66" y="232" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Dato</tspan> che ho un buono del 10%</text><path d="M618 226h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="226" r="3.5" fill="#C2185B"/><text class="n" x="646" y="232" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">la situazione iniziale</text><text class="c" x="66" y="269" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Quando</tspan> applico il buono</text><path d="M618 263h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="263" r="3.5" fill="#C2185B"/><text class="n" x="646" y="269" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">l'azione</text><text class="c" x="66" y="306" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Allora</tspan> il totale diventa 180 €</text><path d="M618 300h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="300" r="3.5" fill="#C2185B"/><text class="n" x="646" y="306" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">un risultato verificabile</text><text class="c" x="48" y="343" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Schema dello scenario:</tspan> Rifiutare un buono</text><path d="M618 337h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="337" r="3.5" fill="#C2185B"/><text class="n" x="646" y="343" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">stesso test, più dati</text><text class="c" x="66" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Quando</tspan> applico il buono "&lt;buono&gt;"</text><path d="M618 374h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="374" r="3.5" fill="#C2185B"/><text class="n" x="646" y="380" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">&lt;variabile&gt; viene dalla tabella</text><text class="c" x="66" y="417" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Esempi:</tspan></text><path d="M618 411h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="411" r="3.5" fill="#C2185B"/><text class="n" x="646" y="417" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">ogni riga è un'esecuzione</text><text class="c" x="84" y="454" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve">| buono   |</text><text class="c" x="84" y="491" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve">| SCADUTO |</text></svg>