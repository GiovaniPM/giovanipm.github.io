<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Architettura di riferimento</title>
<desc id="d">Flusso da sinistra a destra in cinque colonne. Fonti: ERP JDE, API dei partner, database e log di integrazione. Raccolta: connettori con SQL pianificato, eventi e webhook, salvando lo storico. Regole: motore di regole con soglie fisse, SLA, andamento storico ed eventi mancanti, classificando in verde, giallo o rosso. Uscite: cruscotto in tempo reale, allarmi via e-mail, Slack e Teams e ticket aperti automaticamente. Azione: il business decide e l’IT corregge. Una freccia tratteggiata torna dall’azione alle regole: ogni incidente affina regole, soglie e responsabili.</desc>
