<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">QA, QC y pruebas: uno dentro del otro</title>
<desc id="d">Tres elipses anidadas: la más grande es el aseguramiento de la calidad, centrado en el proceso y en prevenir defectos; dentro, el control de calidad, centrado en el producto y en detectar defectos; en el centro, la prueba, que ejecuta el software para encontrar defectos. Al lado, dos recuadros: la prueba encuentra la falla y la depuración la corrige; la auditoría verifica el proceso y la inspección revisa un artefacto.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">QA, QC y pruebas: uno dentro del otro</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">La prueba es parte del control, que a su vez es parte del aseguramiento de la calidad</text>
<ellipse cx="360" cy="300" rx="330" ry="210" fill="#EFE3FA" stroke="#5B2A86" stroke-width="3"/>
<ellipse cx="360" cy="330" rx="240" ry="145" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="3"/>
<ellipse cx="360" cy="360" rx="135" ry="72" fill="#FFF1C9" stroke="#B35300" stroke-width="3"/>
<text x="360" y="132" font-size="19" fill="#5B2A86" text-anchor="middle" font-weight="700">Aseguramiento de la calidad (QA)</text>
<text x="360" y="155" font-size="14" fill="#3E3350" text-anchor="middle">foco en el proceso · prevenir</text>
<text x="360" y="222" font-size="18" fill="#0E6B61" text-anchor="middle" font-weight="700">Control de calidad (QC)</text>
<text x="360" y="244" font-size="14" fill="#3E3350" text-anchor="middle">foco en el producto · detectar</text>
<text x="360" y="356" font-size="19" fill="#B35300" text-anchor="middle" font-weight="700">Pruebas</text>
<text x="360" y="379" font-size="14" fill="#3E3350" text-anchor="middle">ejecutar y encontrar defectos</text>
<rect x="720" y="110" width="262" height="128" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<rect x="720" y="110" width="8" height="128" rx="4" fill="#FF6B6B"/>
<text x="742" y="140" font-size="16" fill="#2B1B3D" font-weight="700">Prueba × depuración</text>
<text x="742" y="166" font-size="14" fill="#3E3350">Prueba: encuentra la falla,</text>
<text x="742" y="187" font-size="14" fill="#3E3350">sin corregirla.</text>
<text x="742" y="208" font-size="14" fill="#3E3350">Depuración: el desarrollador</text>
<text x="742" y="229" font-size="14" fill="#3E3350">encuentra la causa y la corrige.</text>
<rect x="720" y="320" width="262" height="128" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<rect x="720" y="320" width="8" height="128" rx="4" fill="#3A86FF"/>
<text x="742" y="350" font-size="16" fill="#2B1B3D" font-weight="700">Auditoría × inspección</text>
<text x="742" y="376" font-size="14" fill="#3E3350">Auditoría: verifica si se</text>
<text x="742" y="397" font-size="14" fill="#3E3350">sigue el proceso.</text>
<text x="742" y="418" font-size="14" fill="#3E3350">Inspección: revisión formal</text>
<text x="742" y="439" font-size="14" fill="#3E3350">de un artefacto por otra persona.</text>
</svg>
