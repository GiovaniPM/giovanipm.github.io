<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Infraestrutura verde, negócio parado</title>
<desc id="d">Dois painéis lado a lado. À esquerda, a monitoria técnica mostra tudo verde: API disponível 99,9%, tempo de resposta 200 ms, CPU 35% e erros HTTP 0,2%. À direita, a monitoria de negócios mostra tudo vermelho: 40% das propostas do parceiro X recusadas, 50 transações às 10h quando o esperado era cerca de 500, 37 pedidos parados no status 520 e receita da última hora em 38% do previsto.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Infraestrutura verde, negócio parado</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Os mesmos 15 minutos vistos por duas monitorias</text>
<rect x="50" y="100" width="430" height="290" rx="14" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<rect x="50" y="100" width="430" height="8" rx="4" fill="#2A9D8F"/>
<text x="265.0" y="136.0" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Monitoria técnica</text>
<text x="265.0" y="157.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">o sistema está no ar?</text>
<rect x="66" y="172" width="398" height="36" rx="8" fill="#C8EDE6"/>
<circle cx="86" cy="190" r="10" fill="#2A9D8F"/>
<path d="M81 190 l3.5 3.5 l6.5 -7" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="106.0" y="195.0" font-size="14" fill="#2B1B3D" text-anchor="start">API disponível</text>
<text x="452.0" y="195.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">99,9%</text>
<rect x="66" y="216" width="398" height="36" rx="8" fill="#C8EDE6"/>
<circle cx="86" cy="234" r="10" fill="#2A9D8F"/>
<path d="M81 234 l3.5 3.5 l6.5 -7" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="106.0" y="239.0" font-size="14" fill="#2B1B3D" text-anchor="start">Tempo de resposta</text>
<text x="452.0" y="239.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">200 ms</text>
<rect x="66" y="260" width="398" height="36" rx="8" fill="#C8EDE6"/>
<circle cx="86" cy="278" r="10" fill="#2A9D8F"/>
<path d="M81 278 l3.5 3.5 l6.5 -7" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="106.0" y="283.0" font-size="14" fill="#2B1B3D" text-anchor="start">CPU do servidor</text>
<text x="452.0" y="283.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">35%</text>
<rect x="66" y="304" width="398" height="36" rx="8" fill="#C8EDE6"/>
<circle cx="86" cy="322" r="10" fill="#2A9D8F"/>
<path d="M81 322 l3.5 3.5 l6.5 -7" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="106.0" y="327.0" font-size="14" fill="#2B1B3D" text-anchor="start">Erros HTTP 5xx</text>
<text x="452.0" y="327.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">0,2%</text>
<rect x="135.0" y="350" width="260" height="28" rx="14" fill="#2A9D8F"/>
<text x="265.0" y="369.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Tudo verde</text>
<rect x="520" y="100" width="430" height="290" rx="14" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<rect x="520" y="100" width="430" height="8" rx="4" fill="#E23B3B"/>
<text x="735.0" y="136.0" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Monitoria de negócios</text>
<text x="735.0" y="157.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">o negócio está acontecendo?</text>
<rect x="536" y="172" width="398" height="36" rx="8" fill="#FFC9C9"/>
<circle cx="556" cy="190" r="10" fill="#E23B3B"/>
<path d="M552 186 l8 8 M560 186 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="195.0" font-size="14" fill="#2B1B3D" text-anchor="start">Propostas do parceiro X</text>
<text x="922.0" y="195.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">40% recusadas</text>
<rect x="536" y="216" width="398" height="36" rx="8" fill="#FFC9C9"/>
<circle cx="556" cy="234" r="10" fill="#E23B3B"/>
<path d="M552 230 l8 8 M560 230 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="239.0" font-size="14" fill="#2B1B3D" text-anchor="start">Transações às 10h</text>
<text x="922.0" y="239.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">50 (esperado ~500)</text>
<rect x="536" y="260" width="398" height="36" rx="8" fill="#FFC9C9"/>
<circle cx="556" cy="278" r="10" fill="#E23B3B"/>
<path d="M552 274 l8 8 M560 274 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="283.0" font-size="14" fill="#2B1B3D" text-anchor="start">Pedidos parados no status 520</text>
<text x="922.0" y="283.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">37</text>
<rect x="536" y="304" width="398" height="36" rx="8" fill="#FFC9C9"/>
<circle cx="556" cy="322" r="10" fill="#E23B3B"/>
<path d="M552 318 l8 8 M560 318 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="327.0" font-size="14" fill="#2B1B3D" text-anchor="start">Receita da última hora</text>
<text x="922.0" y="327.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">38% do previsto</text>
<rect x="605.0" y="350" width="260" height="28" rx="14" fill="#E23B3B"/>
<text x="735.0" y="369.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Alerta: o negócio parou</text>
<text x="500.0" y="430.0" font-size="14" fill="#3E3350" text-anchor="middle">A API responde, mas responde “não”. Só a monitoria de negócios enxerga o problema.</text>
</svg>
