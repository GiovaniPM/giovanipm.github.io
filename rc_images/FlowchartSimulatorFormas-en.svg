<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 474" role="img" aria-labelledby="t d"><title id="t">The 12 shapes of Flowchart Simulator</title><desc id="d">Start: one per sheet; End: there can be several; Process: activity or calculation; Decision: splits the flow into branches; Input: asks for a value; Output: writes a message; Subprocess: runs another sheet; Wait: only takes time; Document: records a document; Data: reads or writes a database; Connector: joins branches; Note: comment, not executed.</desc><rect width="840" height="474" fill="#FFF7EC"/><g transform="translate(105 68)" fill="#DFF3E4" stroke="#2B7A45" stroke-width="2"><rect x="-52" y="-22" width="104" height="44" rx="22"/></g><text x="105" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Start</text><text x="105" y="144" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">one per sheet</text><g transform="translate(315 68)" fill="#FBE4E2" stroke="#B3362C" stroke-width="2"><rect x="-52" y="-22" width="104" height="44" rx="22"/></g><text x="315" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">End</text><text x="315" y="144" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">there can be several</text><g transform="translate(525 68)" fill="#E4F0FB" stroke="#1F5F99" stroke-width="2"><rect x="-58" y="-26" width="116" height="52" rx="3"/></g><text x="525" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Process</text><text x="525" y="144" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">activity or calculation</text><g transform="translate(735 68)" fill="#FDF0D0" stroke="#9A6A00" stroke-width="2"><path d="M0-32 66 0 0 32-66 0Z"/></g><text x="735" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Decision</text><text x="735" y="144" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">splits the flow into branches</text><g transform="translate(105 218)" fill="#EFEAFA" stroke="#65509C" stroke-width="2"><path d="M-44-26H66L44 26H-66Z"/><text x="50" y="-11" font-size="13" text-anchor="middle" fill="#2B1B3D" stroke="none">↓</text></g><text x="105" y="276" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Input</text><text x="105" y="294" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">asks for a value</text><g transform="translate(315 218)" fill="#EFEAFA" stroke="#65509C" stroke-width="2"><path d="M-44-26H66L44 26H-66Z"/><text x="50" y="-11" font-size="13" text-anchor="middle" fill="#2B1B3D" stroke="none">↑</text></g><text x="315" y="276" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Output</text><text x="315" y="294" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">writes a message</text><g transform="translate(525 218)" fill="#DCF1EC" stroke="#176B5B" stroke-width="2"><path d="M-60-26H60V26H-60ZM-48-26V26M48-26V26"/></g><text x="525" y="276" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Subprocess</text><text x="525" y="294" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">runs another sheet</text><g transform="translate(735 218)" fill="#FAE6EF" stroke="#A8406F" stroke-width="2"><path d="M-54-24H28A24 24 0 0 1 28 24H-54Z"/></g><text x="735" y="276" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Wait</text><text x="735" y="294" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">only takes time</text><g transform="translate(105 368)" fill="#E9EDF1" stroke="#55636F" stroke-width="2"><path d="M-56-28H56V18C28 6 10 10 0 18C-20 34-40 34-56 22Z"/></g><text x="105" y="426" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Document</text><text x="105" y="444" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">records a document</text><g transform="translate(315 368)" fill="#F1ECD9" stroke="#7A6A2B" stroke-width="2"><path d="M-48-20A48 11 0 0 1 48-20V20A48 11 0 0 1-48 20Z"/><path d="M-48-20A48 11 0 0 0 48-20" fill="none"/></g><text x="315" y="426" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Data</text><text x="315" y="444" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">reads or writes a database</text><g transform="translate(525 368)" fill="#FFFFFF" stroke="#4A5358" stroke-width="2"><circle r="17"/></g><text x="525" y="426" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Connector</text><text x="525" y="444" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">joins branches</text><g transform="translate(735 368)" fill="#FDF8D5" stroke="#B3A24A" stroke-width="2"><path d="M-58-26H42L58-10V26H-58Z"/><path d="M42-26V-10H58" fill="none"/></g><text x="735" y="426" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Note</text><text x="735" y="444" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">comment, not executed</text></svg>
