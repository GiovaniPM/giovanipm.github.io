<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Tres categorías de información, tres niveles de gestión</title>
<desc id="d">Pirámide de tres capas. En la cima, la información estratégica, para la alta dirección, apoyada por los sistemas de soporte a las decisiones, con horizonte de años. En el medio, la información gerencial, para la gerencia media, apoyada por los sistemas de información gerencial, con horizonte de meses. En la base, la información operativa, para la supervisión y la operación, apoyada por los sistemas de procesamiento de datos, en el día a día.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="440" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tres categorías de información, tres niveles de gestión</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cuanto más alto el nivel, más largo el horizonte y más sintética la información</text>
<path d="M230.0 100 L350.0 100 L411.7 200 L168.3 200 Z" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<text x="290.0" y="152.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Estratégica</text>
<text x="290.0" y="172.0" font-size="12" fill="#FFFFFF" text-anchor="middle">alta dirección</text>
<line x1="419.7" y1="150.0" x2="568" y2="150.0" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="580.0" y="134.0" font-size="14" fill="#2B1B3D" font-weight="700">Sistemas de soporte a las decisiones (DSS)</text>
<text x="580.0" y="153.0" font-size="12.5" fill="#3E3350">planificación a largo plazo: años</text>
<text x="580.0" y="171.0" font-size="12.5" fill="#756986" font-style="italic">ej.: tendencia de ingresos, inversiones</text>
<path d="M163.3 208 L416.7 208 L478.4 308 L101.6 308 Z" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/>
<text x="290.0" y="260.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Gerencial</text>
<text x="290.0" y="280.0" font-size="12" fill="#FFFFFF" text-anchor="middle">gerencia media</text>
<line x1="486.4" y1="258.0" x2="568" y2="258.0" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="580.0" y="242.0" font-size="14" fill="#2B1B3D" font-weight="700">Sistemas de información gerencial (MIS)</text>
<text x="580.0" y="261.0" font-size="12.5" fill="#3E3350">planificación a mediano plazo: meses</text>
<text x="580.0" y="279.0" font-size="12.5" fill="#756986" font-style="italic">ej.: análisis de ventas, flujo de caja</text>
<path d="M96.7 316 L483.3 316 L545.1 416 L34.9 416 Z" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<text x="290.0" y="368.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Operativa</text>
<text x="290.0" y="388.0" font-size="12" fill="#FFFFFF" text-anchor="middle">supervisión y operación</text>
<line x1="553.1" y1="366.0" x2="568" y2="366.0" stroke="#756986" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="580.0" y="350.0" font-size="14" fill="#2B1B3D" font-weight="700">Sistemas de procesamiento de datos</text>
<text x="580.0" y="369.0" font-size="12.5" fill="#3E3350">el día a día: horas y días</text>
<text x="580.0" y="387.0" font-size="12.5" fill="#756986" font-style="italic">ej.: asistencia del personal, stock</text>
<line x1="36" y1="412" x2="36" y2="108" stroke="#B35300" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="28.0" y="260.0" font-size="12" fill="#B35300" text-anchor="middle" font-weight="700" transform="rotate(-90 28 260)">horizonte de decisión</text>
</svg>
