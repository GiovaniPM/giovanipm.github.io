<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
<title id="t">Battaglie storiche simulate nel gioco</title>
<desc id="d">Battaglie storiche simulate nel gioco. Seival, 1836: vittoria 54%, pareggio 36%, sconfitta 10%; nella storia: vittoria. Fanfa, 1836 (in difesa): vittoria 10%, pareggio 27%, sconfitta 64%; nella storia: sconfitta. Rio Pardo, 1838: vittoria 34%, pareggio 49%, sconfitta 17%; nella storia: vittoria. Santa Vitória, 1839: vittoria 13%, pareggio 12%, sconfitta 75%; nella storia: vittoria. Taquari, 1840: vittoria 3%, pareggio 60%, sconfitta 37%; nella storia: incerto. São José do Norte, 1840: vittoria 18%, pareggio 34%, sconfitta 48%; nella storia: sconfitta. Ponche Verde, 1843: vittoria 92%, pareggio 7%, sconfitta 1%; nella storia: discusso. Porongos, 1844: uscendo: vittoria 45%, pareggio 14%, sconfitta 41%; nella storia: sconfitta. Porongos, 1844: nel campo: vittoria 100%, pareggio 0%, sconfitta 0%; nella storia: —. 2.000 combattimenti per riga, con la funzione di combattimento del gioco e le forze delle fonti. È il modello del gioco, non la probabilità reale.</desc>
<rect width="1000" height="480" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker></defs>
