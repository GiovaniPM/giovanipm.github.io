<text x="500.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE o Table</text>
<text x="500.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">Conversion lee</text>
<text x="500.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">el archivo</text>
<rect x="606" y="136" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="692.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">BSFN de validación</text>
<text x="692.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">valida y aplica</text>
<text x="692.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">la regla</text>
