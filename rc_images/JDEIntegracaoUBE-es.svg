<text x="308.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(formato fijo)</text>
<rect x="414" y="344" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
