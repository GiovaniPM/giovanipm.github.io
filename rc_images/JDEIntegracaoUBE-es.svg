<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Integración por archivos con UBE y Table Conversion</title>
<desc id="d">Entrada: el banco produce el archivo de retorno, que llega vía SFTP o MFT; un UBE o una Table Conversion lee el archivo, una business function de validación controla y aplica la regla y los datos van a las tablas de JDE, como los cobros en la F03B13; las líneas rechazadas terminan en un informe de errores. Salida: desde las tablas de JDE un UBE genera el archivo de formato fijo en una carpeta del Enterprise Server, que sale vía SFTP o MFT con cifrado PGP hacia el banco o el fisco. Todo se programa en el Scheduler de JDE, con un informe de control por cada ejecución.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
