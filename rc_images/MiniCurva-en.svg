<text x="780.0" y="390.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">The brakes hold 1.6 g at low speed and 3.8 g at</text>
<text x="780.0" y="407.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">290 km/h, because of downforce.</text>
<text x="500.0" y="470.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">Values from the game's model, not from a real car: lateral grip of 1.45 g when slow, growing with the square of speed to 4.1</text>
<text x="500.0" y="487.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">g at 290 km/h. Grass and gravel hold far less.</text>
