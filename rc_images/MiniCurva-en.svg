<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="t d">
<title id="t">The game's physics: corners and braking</title>
<desc id="d">Two charts with values from the game's model. On the left, top speed in a corner by radius: 63 km/h at a 20 m radius, 108 km/h at 50 m and 177 km/h at 100 m; above a 165 m radius, the corner is taken flat out. On the right, bars with braking distance on tarmac: from 300 to 100 km/h, 112 m; from 300 to 200 km/h, 59 m; from 200 to 100 km/h, 52 m; from 150 to 60 km/h, 38 m.</desc>
