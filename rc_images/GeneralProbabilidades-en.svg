<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 436" width="1000" height="436" role="img" aria-labelledby="t d">
<title id="t">Chance of each combination</title>
<desc id="d">Bar chart with the probability of each combination on the first roll and within a whole turn of up to three rolls, keeping dice in the best way to chase only that combination. General: 0.08% and 4.6%. Four or more alike: 2.0% and 29.1%. Full house: 3.9% and 36.3%. Five in a row: 3.1% and 26.1%. Four in a row: 15.4% and 61.5%. Exact values, computed by enumeration.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="436" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="300" y="24" width="18" height="14" rx="3" fill="#9FD9D0"/><text x="324" y="36" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">1st roll</text><rect x="520" y="24" width="18" height="14" rx="3" fill="#0E8074"/><text x="544" y="36" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">up to 3 rolls, chasing only it</text><line x1="290.0" y1="56" x2="290.0" y2="374" stroke="#F1E2CF" stroke-width="1.5"/><text x="290.0" y="392" font-size="12" font-weight="normal" text-anchor="middle" fill="#756986">0%</text><line x1="378.6" y1="56" x2="378.6" y2="374" stroke="#F1E2CF" stroke-width="1.5"/><text x="378.6" y="392" font-size="12" font-weight="normal" text-anchor="middle" fill="#756986">10%</text><line x1="467.1" y1="56" x2="467.1" y2="374" stroke="#F1E2CF" stroke-width="1.5"/><text x="467.1" y="392" font-size="12" font-weight="normal" text-anchor="middle" fill="#756986">20%</text><line x1="555.7" y1="56" x2="555.7" y2="374" stroke="#F1E2CF" stroke-width="1.5"/><text x="555.7" y="392" font-size="12" font-weight="normal" text-anchor="middle" fill="#756986">30%</text><line x1="644.3" y1="56" x2="644.3" y2="374" stroke="#F1E2CF" stroke-width="1.5"/><text x="644.3" y="392" font-size="12" font-weight="normal" text-anchor="middle" fill="#756986">40%</text><line x1="732.9" y1="56" x2="732.9" y2="374" stroke="#F1E2CF" stroke-width="1.5"/><text x="732.9" y="392" font-size="12" font-weight="normal" text-anchor="middle" fill="#756986">50%</text><line x1="821.4" y1="56" x2="821.4" y2="374" stroke="#F1E2CF" stroke-width="1.5"/><text x="821.4" y="392" font-size="12" font-weight="normal" text-anchor="middle" fill="#756986">60%</text><line x1="910.0" y1="56" x2="910.0" y2="374" stroke="#F1E2CF" stroke-width="1.5"/><text x="910.0" y="392" font-size="12" font-weight="normal" text-anchor="middle" fill="#756986">70%</text><text x="276" y="96" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">General (5 alike)</text><rect x="290" y="74" width="2.0" height="18" rx="4" fill="#9FD9D0"/><text x="298" y="88" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">0.08%</text><rect x="290" y="96" width="40.8" height="22" rx="4" fill="#0E8074"/><text x="336.8" y="113" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">4.6%</text><text x="276" y="158" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Four or more alike</text><rect x="290" y="136" width="17.8" height="18" rx="4" fill="#9FD9D0"/><text x="313.8" y="150" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">2.0%</text><rect x="290" y="158" width="257.6" height="22" rx="4" fill="#0E8074"/><text x="553.6" y="175" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">29.1%</text><text x="276" y="220" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Full house (3 + 2)</text><rect x="290" y="198" width="34.2" height="18" rx="4" fill="#9FD9D0"/><text x="330.2" y="212" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">3.9%</text><rect x="290" y="220" width="321.4" height="22" rx="4" fill="#0E8074"/><text x="617.4" y="237" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">36.3%</text><text x="276" y="282" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Five in a row</text><rect x="290" y="260" width="27.3" height="18" rx="4" fill="#9FD9D0"/><text x="323.3" y="274" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">3.1%</text><rect x="290" y="282" width="231.3" height="22" rx="4" fill="#0E8074"/><text x="527.3" y="299" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">26.1%</text><text x="276" y="344" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Four in a row</text><rect x="290" y="322" width="136.7" height="18" rx="4" fill="#9FD9D0"/><text x="432.7" y="336" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">15.4%</text><rect x="290" y="344" width="545.1" height="22" rx="4" fill="#0E8074"/><text x="841.1" y="361" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">61.5%</text><text x="980" y="420" font-size="12" font-weight="normal" text-anchor="end" fill="#756986">Exact calculation by enumerating the 7,776 outcomes of 5 dice</text>
</g></svg>
