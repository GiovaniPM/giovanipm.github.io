<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 362" width="1000" height="362" role="img" aria-labelledby="t d">
<title id="t">Una estación de campaña</title>
<desc id="d">Cada estación tiene cinco etapas: 1, Suerte: un dado decide lluvias, ganado, baqueanos o adhesiones; 2, Mando: cada columna tira un dado, Bento Gonçalves recibe 3 más la mitad del dado y los demás jefes 1 más la mitad; 3, Órdenes: marchar, sitiar, atacar, atrincherarse, buscar víveres, juntar balsas o construir lanchas; 4, Imperiales: las fuerzas imperiales se mueven y atacan; 5, Víveres: en tierra amiga la columna se abastece, fuera de ella pierde 1. El año de campaña tiene primavera, verano y otoño, y termina en invierno, pasado en las estancias, cuando se recuperan escuadrones y se gasta Adhesión en refuerzos.</desc>
<rect width="1000" height="362" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="22" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="110" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">1. Suerte</text><text x="110" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">un dado: lluvia, ganado,</text><text x="110" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">baqueanos o adhesiones</text><line x1="200" y1="86" x2="214" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="216" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="304" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">2. Mando</text><text x="304" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">un dado por columna:</text><text x="304" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Bento 3 + ½ dado</text><line x1="394" y1="86" x2="408" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="410" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="498" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">3. Órdenes</text><text x="498" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">marchar, sitiar, atacar,</text><text x="498" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">atrincherarse, balsas</text><line x1="588" y1="86" x2="602" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="604" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.5"/><text x="692" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#C2185B">4. Imperiales</text><text x="692" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">se mueven y atacan</text><text x="692" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">a quien parece débil</text><line x1="782" y1="86" x2="796" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="798" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2.5"/><text x="886" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#0E8074">5. Víveres</text><text x="886" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">tierra amiga abastece;</text><text x="886" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">fuera de ella −1</text>
<text x="500" y="186" font-size="17" font-weight="bold" text-anchor="middle">El año de campaña</text>
<rect x="70" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="155" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Primavera</text><text x="155" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">sep.–nov.</text><line x1="242" y1="236" x2="286" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="290" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="375" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Verano</text><text x="375" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">dic.–feb.</text><line x1="462" y1="236" x2="506" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="510" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="595" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Otoño</text><text x="595" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">mar.–may.</text><line x1="682" y1="236" x2="726" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="730" y="204" width="170" height="64" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="815" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Invierno</text><text x="815" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">jun.–ago.</text>
<path d="M 815 268 C 815 314, 155 314, 155 273" fill="none" stroke="#756986" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="500" y="340.0" font-size="14.5" fill="#756986" text-anchor="middle">En los cuarteles de invierno, las columnas recuperan escuadrones, reciben refuerzos y pueden enfrentar revueltas</text></g>
</svg>
