<text x="200.0" y="408.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#2B1B3D">1. Procurar em xadrez</text>
<text x="200.0" y="432.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#756986">Todo navio tem pelo menos 2 casas,</text>
<text x="200.0" y="450.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#756986">então sempre cobre uma casa escura.</text>
<text x="200.0" y="469.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#756986">Metade dos tiros basta para encontrar</text>
<text x="200.0" y="488.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#756986">todos.</text>
