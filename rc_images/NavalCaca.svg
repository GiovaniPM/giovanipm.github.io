<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">Procurar e caçar</title>
<desc id="d">Três tabuleiros. No primeiro, metade das casas está pintada em xadrez, e dois navios de 2 casas, um horizontal e um vertical, cobrem cada um uma casa pintada: procurar só nas casas pintadas basta para achar todos os navios. No segundo, um acerto no centro e setas para as 4 casas vizinhas; as 4 diagonais estão em cinza, porque ficam vazias quando navios não encostam. No terceiro, dois acertos lado a lado, águas acima e abaixo, e setas para as duas pontas da linha.</desc>
