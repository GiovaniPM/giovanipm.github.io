<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Lei de Gilbert: espectador ou dono?</title>
<desc id="d">Comparação diante da mesma situação: a API do outro time atrasou e a entrega é na sexta-feira. À esquerda, o espectador diz não é comigo, é com o outro time; ninguém me avisou; vou esperar resolverem. Resultado: a entrega atrasa e a culpa se espalha. À direita, o dono pergunta ao outro time a data real, cria um dublê da API e segue, e avisa o cliente e combina um plano B. Resultado: a entrega sai, com o risco às claras. Embaixo: ser responsável não é fazer tudo sozinho, é garantir que o resultado aconteça.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="480" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Lei de Gilbert: espectador ou dono?</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Situação: a API do outro time atrasou e a entrega é na sexta-feira</text>
<rect x="50" y="100" width="430" height="290" rx="14" fill="#FFFFFF" stroke="#D9C9B4" stroke-width="2.5"/>
<path d="M50 114 a14 14 0 0 1 14 -14 h402 a14 14 0 0 1 14 14 v32 h-430 z" fill="#D9C9B4"/>
<text x="265.0" y="127" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Espectador</text>
<circle cx="80" cy="170" r="12" fill="#756986"/>
<text x="80" y="175" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="102" y="175" font-size="15" fill="#756986" font-style="italic">“Não é comigo, é com o outro time”</text>
<circle cx="80" cy="220" r="12" fill="#756986"/>
<text x="80" y="225" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="102" y="225" font-size="15" fill="#756986" font-style="italic">“Ninguém me avisou”</text>
<circle cx="80" cy="270" r="12" fill="#756986"/>
<text x="80" y="275" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="102" y="275" font-size="15" fill="#756986" font-style="italic">“Vou esperar resolverem”</text>
<rect x="66" y="325" width="398" height="46" rx="10" fill="#E23B3B" opacity="0.12"/>
<text x="265" y="354" font-size="14.5" fill="#E23B3B" text-anchor="middle" font-weight="700">Resultado: entrega atrasa e a culpa se espalha</text>
<rect x="520" y="100" width="430" height="290" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<path d="M520 114 a14 14 0 0 1 14 -14 h402 a14 14 0 0 1 14 14 v32 h-430 z" fill="#5B2A86"/>
<text x="735.0" y="127" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Dono</text>
<circle cx="550" cy="170" r="12" fill="#2A9D8F"/>
<text x="550" y="175" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
<text x="572" y="175" font-size="15" fill="#2B1B3D">Pergunta ao outro time a data real</text>
<circle cx="550" cy="220" r="12" fill="#2A9D8F"/>
<text x="550" y="225" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
<text x="572" y="225" font-size="15" fill="#2B1B3D">Cria um dublê (mock) da API e segue</text>
<circle cx="550" cy="270" r="12" fill="#2A9D8F"/>
<text x="550" y="275" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
<text x="572" y="275" font-size="15" fill="#2B1B3D">Avisa o cliente e combina um plano B</text>
<rect x="536" y="325" width="398" height="46" rx="10" fill="#2A9D8F" opacity="0.12"/>
<text x="735" y="354" font-size="14.5" fill="#1E7268" text-anchor="middle" font-weight="700">Resultado: entrega sai, com o risco às claras</text>
<text x="500.0" y="440" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ser responsável não é fazer tudo sozinho: é garantir que o resultado aconteça</text>
</svg>
