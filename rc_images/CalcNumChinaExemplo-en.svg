<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Linear systems in everyday life</title>
<desc id="d">On the left, a snack-bar problem: a pie plus a juice plus a croquette cost 18 dollars; 2 pies and 1 croquette, 20 dollars; 1 juice and 2 croquettes, 17 dollars. Eliminating step by step, pie = 7, juice = 5 and croquette = 6 dollars. On the right, where linear systems show up today, with typical sizes: electrical circuits, tens to millions of unknowns; structures of bridges and buildings, millions; 3D games and animation, thousands per frame; weather forecasting, billions; artificial intelligence, billions of numbers per second.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Linear systems in everyday life</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">From the Chinese granary to your phone</text><rect x="30" y="100" width="450" height="410" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="255" y="130" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700">At the snack bar</text><text x="255" y="170" font-size="16" fill="#2B1B3D" text-anchor="middle">pie + juice + croquette = $18</text><text x="255" y="200" font-size="16" fill="#2B1B3D" text-anchor="middle">2 pies + croquette = $20</text><text x="255" y="230" font-size="16" fill="#2B1B3D" text-anchor="middle">juice + 2 croquettes = $17</text><line x1="60" y1="262" x2="450" y2="262" stroke="#F1E2CF" stroke-width="2"/><text x="255" y="292" font-size="15" fill="#2B1B3D" text-anchor="middle">from the 2nd: croquette = 20 − 2·pie</text><text x="255" y="318" font-size="15" fill="#2B1B3D" text-anchor="middle">into the 3rd: juice = 4·pie − 23</text><text x="255" y="344" font-size="15" fill="#2B1B3D" text-anchor="middle">into the 1st: 3·pie − 3 = 18</text><text x="255" y="370" font-size="15" fill="#2B1B3D" text-anchor="middle">pie = 7, and the rest follows</text><rect x="60" y="410" width="390" height="80" rx="10" fill="#E2F6F2"/><text x="255" y="442" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">pie = $7 · juice = $5 · croquette = $6</text><text x="255" y="470" font-size="14" fill="#2B1B3D" text-anchor="middle">check: 7 + 5 + 6 = 18 ✓</text><rect x="510" y="100" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><rect x="510" y="100" width="14" height="70" rx="6" fill="#3A86FF"/><text x="545" y="130" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Electrical circuits</text><text x="545" y="154" font-size="14" fill="#756986" text-anchor="start">tens to millions of unknowns</text><rect x="510" y="184" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><rect x="510" y="184" width="14" height="70" rx="6" fill="#2A9D8F"/><text x="545" y="214" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Bridges and buildings</text><text x="545" y="238" font-size="14" fill="#756986" text-anchor="start">millions of unknowns</text><rect x="510" y="268" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="510" y="268" width="14" height="70" rx="6" fill="#FFB703"/><text x="545" y="298" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">3D games and animation</text><text x="545" y="322" font-size="14" fill="#756986" text-anchor="start">thousands every frame</text><rect x="510" y="352" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="510" y="352" width="14" height="70" rx="6" fill="#FF6B6B"/><text x="545" y="382" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Weather forecasting</text><text x="545" y="406" font-size="14" fill="#756986" text-anchor="start">billions of unknowns</text><rect x="510" y="436" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="510" y="436" width="14" height="70" rx="6" fill="#5B2A86"/><text x="545" y="466" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Artificial intelligence</text><text x="545" y="490" font-size="14" fill="#756986" text-anchor="start">billions of numbers per second</text>
</svg>
