<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">How computers store numbers with decimals</title>
<desc id="d">Three parts. At the top, the binary scientific notation used by the IEEE 754 standard: sign, a 53-bit mantissa and an exponent; it gives about 16 correct decimal digits. In the middle, a number line with the numbers a computer can store: they get further apart the larger they are, and anything that falls between two of them is rounded. At the bottom, the famous case: 0.1 in binary is 0.000110011001100… with the pattern 0011 repeating forever, so it gets cut off. That is why 0.1 + 0.2 gives 0.30000000000000004.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">How computers store numbers with decimals</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Floating point: scientific notation in binary</text><rect x="40" y="96" width="920" height="110" rx="12" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/><rect x="100" y="110" width="120" height="50" rx="8" fill="#F1E8FA" stroke="#5B2A86" stroke-width="2.5"/><text x="160" y="142" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700">±</text><text x="160" y="186" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">sign</text><rect x="300" y="110" width="200" height="50" rx="8" fill="#E6F0FF" stroke="#3A86FF" stroke-width="2.5"/><text x="400" y="142" font-size="18" fill="#3A86FF" text-anchor="middle" font-weight="700">1.1001100110…</text><text x="400" y="186" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">mantissa (53 bits)</text><rect x="530" y="110" width="120" height="50" rx="8" fill="#E2F6F2" stroke="#2A9D8F" stroke-width="2.5"/><text x="590" y="142" font-size="18" fill="#2A9D8F" text-anchor="middle" font-weight="700">× 2⁻⁴</text><text x="590" y="186" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">exponent</text><text x="810" y="136" font-size="14" fill="#2B1B3D" text-anchor="middle">IEEE 754 standard (1985)</text><text x="810" y="162" font-size="14" fill="#2B1B3D" text-anchor="middle">≈ 16 decimal digits</text><text x="500" y="244" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Storable numbers get further apart as they grow</text><line x1="60" y1="300" x2="940" y2="300" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="70" y1="290" x2="70" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="76" y1="290" x2="76" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="82.54" y1="290" x2="82.54" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="89.6686" y1="290" x2="89.6686" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="97.4388" y1="290" x2="97.4388" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="105.908" y1="290" x2="105.908" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="115.14" y1="290" x2="115.14" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="125.203" y1="290" x2="125.203" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="136.171" y1="290" x2="136.171" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="148.126" y1="290" x2="148.126" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="161.158" y1="290" x2="161.158" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="175.362" y1="290" x2="175.362" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="190.844" y1="290" x2="190.844" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="207.72" y1="290" x2="207.72" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="226.115" y1="290" x2="226.115" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="246.165" y1="290" x2="246.165" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="268.02" y1="290" x2="268.02" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="291.842" y1="290" x2="291.842" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="317.808" y1="290" x2="317.808" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="346.111" y1="290" x2="346.111" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="376.961" y1="290" x2="376.961" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="410.587" y1="290" x2="410.587" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="447.24" y1="290" x2="447.24" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="487.192" y1="290" x2="487.192" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="530.739" y1="290" x2="530.739" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="578.205" y1="290" x2="578.205" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="629.944" y1="290" x2="629.944" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="686.339" y1="290" x2="686.339" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="747.809" y1="290" x2="747.809" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="814.812" y1="290" x2="814.812" y2="310" stroke="#3A86FF" stroke-width="2"/><line x1="887.845" y1="290" x2="887.845" y2="310" stroke="#3A86FF" stroke-width="2"/><text x="70" y="330" font-size="13" fill="#3A86FF" text-anchor="start">near 0: packed tight</text><text x="930" y="330" font-size="13" fill="#3A86FF" text-anchor="end">big numbers: spread out</text><rect x="40" y="360" width="920" height="160" rx="12" fill="#FFF1C9"/><text x="500" y="392" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">The famous case: 0.1 never ends in binary</text><text x="500" y="432" font-size="20" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#2B1B3D">0.1 = 0.0<tspan fill="#FF6B6B" font-weight="700">0011</tspan><tspan fill="#3A86FF" font-weight="700">0011</tspan><tspan fill="#FF6B6B" font-weight="700">0011</tspan><tspan fill="#3A86FF" font-weight="700">0011</tspan>…₂</text><text x="500" y="466" font-size="15" fill="#2B1B3D" text-anchor="middle">It is cut after 53 bits, so it ends up a tiny bit off from 0.1.</text><text x="500" y="502" font-size="19" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#2B1B3D" font-weight="700">0.1 + 0.2 = 0.3<tspan fill="#FF6B6B">0000000000004</tspan></text>
</svg>
