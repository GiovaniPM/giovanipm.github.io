<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Panorama dell'integrazione in JD Edwards EnterpriseOne</title>
<desc id="d">Tre colonne. Sistemi esterni a sinistra: web, mobile, IoT e iPaaS chiamano l'AIS Server con l'Orchestrator via REST, che usa l'HTML Server e raggiunge l'Enterprise Server tramite JDENET. I sistemi SOAP chiamano il Business Services Server. L'Enterprise Server invia eventi al Transaction Server, che li consegna ai consumatori via JMS o HTTP. La BI legge il database con SQL in sola lettura. I carichi batch scrivono nelle Z-file e un UBE le elabora. I partner EDI arrivano come file piatti nelle tabelle F47. L'Enterprise Server, con business function, master business function, UBE e kernel degli eventi, accede al database tramite JDB.</desc>
