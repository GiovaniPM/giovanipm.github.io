<text x="225.0" y="139" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">del codice</text>
<rect x="306" y="100" width="110" height="330" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M306 112 a12 12 0 0 1 12 -12 h86 a12 12 0 0 1 12 12 v38 h-110 z" fill="#2A9D8F"/>
