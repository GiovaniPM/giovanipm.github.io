<path d="M628.0 370 L638.0 380 M638.0 370 L628.0 380" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
<rect x="146" y="348" width="208" height="20" rx="6" fill="#FFF7EC" opacity="0.92"/>
<text x="153" y="363" font-size="12.5" fill="#E23B3B" font-weight="700">Guasto solo nell’ora di punta</text>
