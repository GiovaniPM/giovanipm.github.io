<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Legge di Murphy: livelli di protezione</title>
<desc id="d">Una modifica software deve attraversare cinque livelli di protezione prima di arrivare all’utente: revisione del codice, test automatici, rilascio graduale, monitoraggio e allarmi, e piano di rollback. Entrano quattro errori. La variabile con nome errato è fermata nella revisione; il calcolo errato della spedizione, dai test; la lentezza con dati reali, dal rilascio graduale; il guasto che avviene solo nell’ora di punta è rilevato dal monitoraggio e annullato dal piano di rollback. Nessuno arriva all’utente. Messaggio: nessun livello cattura tutto, ma insieme tengono l’errore lontano dall’utente.</desc>
