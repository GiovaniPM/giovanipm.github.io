<text x="769.0" y="380" font-size="22" fill="#5B2A86" text-anchor="middle" font-weight="700">↺</text>
<text x="500.0" y="480" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">La domanda di Murphy: cosa può andare storto qui, e chi se ne accorgerà per primo?</text>
</svg>
