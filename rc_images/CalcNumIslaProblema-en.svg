<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Why the sine of 1° was so hard</title>
<desc id="d">On the left, a circle of radius 1 with a very small angle of 1 degree; the height of the point on the circle is the sine of 1 degree. Astronomers needed sine tables to predict where celestial bodies would be, make calendars and find the direction of Mecca. Geometry gives the sine of 3 degrees exactly, but dividing an angle into three equal parts with ruler and compass is impossible. On the right, a sine table with 3 degrees filled in, 0.0523359563, and 1 and 2 degrees with question marks.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Why the sine of 1° was so hard</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Astronomy, calendars and navigation depended on tables</text><circle cx="250" cy="285" r="140" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/><line x1="90" y1="285" x2="420" y2="285" stroke="#756986" stroke-width="1.5"/><line x1="250" y1="285" x2="388.638" y2="265.516" stroke="#5B2A86" stroke-width="3"/><line x1="388.638" y1="265.516" x2="388.638" y2="285" stroke="#FF6B6B" stroke-width="4"/><text x="402.638" y="277" font-size="17" fill="#FF6B6B" text-anchor="start" font-weight="700">sin 1°</text><text x="320" y="267" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">1°</text><text x="250" y="455" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">(angle exaggerated so you can see it)</text><rect x="490" y="110" width="220" height="250" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><text x="600" y="140" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">Sine table</text><text x="530" y="185" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">1°</text><text x="680" y="185" font-size="16" fill="#FF6B6B" text-anchor="end" font-weight="700">?</text><text x="530" y="229" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">2°</text><text x="680" y="229" font-size="16" fill="#FF6B6B" text-anchor="end" font-weight="700">?</text><text x="530" y="273" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">3°</text><text x="680" y="273" font-size="16" fill="#2A9D8F" text-anchor="end" font-weight="700">0.0523359563</text><text x="530" y="317" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">…</text><text x="680" y="317" font-size="16" fill="#756986" text-anchor="end" font-weight="700">…</text><rect x="740" y="110" width="230" height="250" rx="12" fill="#FFE8E8"/><text x="855" y="140" font-size="16" fill="#E23B3B" text-anchor="middle" font-weight="700">The catch</text><text x="855" y="172" font-size="14" fill="#2B1B3D" text-anchor="middle">sin 3° comes from geometry</text><text x="855" y="198" font-size="14" fill="#2B1B3D" text-anchor="middle">(from 72° and 60°).</text><text x="855" y="224" font-size="14" fill="#2B1B3D" text-anchor="middle">But splitting an angle</text><text x="855" y="250" font-size="14" fill="#2B1B3D" text-anchor="middle">into 3 with ruler and</text><text x="855" y="276" font-size="14" fill="#2B1B3D" text-anchor="middle">compass is impossible.</text><text x="855" y="302" font-size="14" fill="#2B1B3D" text-anchor="middle">Another way is needed.</text><rect x="490" y="390" width="480" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="730" y="422" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">Samarkand, Ulugh Beg’s observatory, 1420s</text><text x="730" y="450" font-size="14" fill="#2B1B3D" text-anchor="middle">goal: sine tables with many correct digits</text>
</svg>
