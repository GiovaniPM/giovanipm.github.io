text x="27.0" y="270.5" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">C</text><rect x="110.0" y="252.0" width="70.0" height="28.0" rx="0" fill="#FFFFFF" stroke="#E9E4EF" stroke-width="1"/><text x="117.0" y="270.5" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">700</text><rect x="20.0" y="280.0" width="90.0" height="28.0" rx="0" fill="#FFFFFF" stroke="#E9E4EF" stroke-width="1"/><text x="27.0" y="298.5" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">B</text><rect x="110.0" y="280.0" width="70.0" height="28.0" rx="0" fill="#FFFFFF" stroke="#E9E4EF" stroke-width="1"/><text x="117.0" y="298.5" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1250</text><rect x="20.0" y="140.0" width="160.0" height="168.0" rx="0" fill="none" stroke="#2B1B3D" stroke-width="1.5"/>
