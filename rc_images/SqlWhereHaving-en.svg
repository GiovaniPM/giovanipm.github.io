<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 474" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">WHERE filters rows; HAVING filters groups</title>
<desc id="d">Four stages. First, the emp_bonus table with five rows; WHERE bonus greater than or equal to 700 drops the row A 500. Next, GROUP BY gathers the rows by employee: A with 1000, B with 2000 and 1250, C with 700. Then the sums are A 1000, B 3250 and C 700, and HAVING SUM greater than 1000 drops A and C. The result is B 3250.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="474" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">WHERE filters rows; HAVING filters groups</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">The two filters act at different moments of the query</text>
<text x="20.0" y="124.0" font-size="13.5" fill="#2B1B3D" font-weight="700" xml:space="preserve">1. Rows</text>
<text x="262.0" y="124.0" font-size="13.5" fill="#2B1B3D" font-weight="700" xml:space="preserve">2. Groups</text>
<text x="504.0" y="124.0" font-size="13.5" fill="#2B1B3D" font-weight="700" xml:space="preserve">3. Sums</text>
<text x="766.0" y="124.0" font-size="13.5" fill="#2B1B3D" font-weight="700" xml:space="preserve">4. Result</text>
