<text x="274.0" y="217.0" font-size="14" fill="#3A86FF" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">B</text>
<text x="300.0" y="217.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2000</text>
