<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">Come l'app genera una risposta</title><desc id="d">Diagramma con cinque riquadri collegati da frecce, da sinistra a destra: Testo, la chat composta nel formato del modello; Tokenizzatore, che trasforma il testo in numeri; Transformer, con N strati di attenzione e MLP; Logit, un punteggio per ogni token; e Campionamento, con temperatura, top-k e top-p. Una freccia torna dal Campionamento al Testo: il token estratto diventa testo sullo schermo e rientra come input. In alto, il file .gguf fornisce pesi, vocabolario e metadati al tokenizzatore e al transformer. Sotto il transformer, la cache KV conserva ciò che è già stato letto. In fondo: gira sulla GPU, con WebGPU e pesi a 16 bit, o sulla CPU, con worker e pesi a 8 bit.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
