<text x="500.0" y="504" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#756986">gira sulla GPU (WebGPU, pesi a 16 bit) o sulla CPU (worker, pesi a 8 bit)</text>
