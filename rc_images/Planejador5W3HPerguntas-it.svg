<text x="615.2" y="154" font-size="21" font-weight="700" fill="#0E8074">Where</text>
<text x="615.2" y="180" font-size="15" fill="#2B1B3D">Dove avverrà?</text>
<rect x="791.6" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="791.6" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="805.6" y="128" font-size="12" fill="#756986">domanda 5</text>
<text x="805.6" y="154" font-size="21" font-weight="700" fill="#0E8074">When</text>
<text x="805.6" y="180" font-size="15" fill="#2B1B3D">Quando inizia e</text>
<text x="805.6" y="199" font-size="15" fill="#2B1B3D">quando finisce?</text>
<text x="30" y="258" font-size="16" font-weight="700" fill="#5B2A86">3H · esecuzione, costo e misura</text>
