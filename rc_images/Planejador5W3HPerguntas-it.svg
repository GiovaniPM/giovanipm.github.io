<text x="678.6666666666666" y="328" font-size="21" font-weight="700" fill="#5B2A86">How to measure</text>
<text x="678.6666666666666" y="354" font-size="15" fill="#2B1B3D">Come saprai che ha funzionato?</text>
<text x="30" y="440" font-size="14" fill="#756986">La terza H varia tra le fonti: alcune usano How many (quanti). In questa app è How to measure (come misurare).</text>
