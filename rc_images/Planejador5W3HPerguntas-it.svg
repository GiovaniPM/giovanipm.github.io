<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">5W3H: le otto domande del piano</title>
<desc id="d">Otto schede in due gruppi. 5W: What, che cosa sarà fatto; Why, perché va fatto; Who, chi lo farà; Where, dove avverrà; When, quando inizia e finisce. 3H: How, come sarà fatto; How much, quanto costerà; How to measure, come saprai che ha funzionato. Nota: la terza H varia tra le fonti; alcune usano How many, quanti.</desc>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="30" y="44" font-size="24" font-weight="700" fill="#2B1B3D">5W3H: le otto domande del piano</text>
<text x="30" y="84" font-size="16" font-weight="700" fill="#0E8074">5W · il piano in sé</text>
<rect x="30.0" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="30.0" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
