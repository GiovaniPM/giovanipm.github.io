<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Riduzione: risolvere un problema con un altro</title>
<desc id="d">Schema di riduzione. Il problema A, per esempio il Sudoku, passa per un traduttore rapido, in tempo polinomiale, che lo trasforma nel problema B, per esempio SAT. Un risolutore di B dà la risposta, che vale per A e B. Regola: se B ha una soluzione rapida, ce l’ha anche A. Sotto, l’effetto domino di Karp del 1972: SAT, sulle formule logiche, porta a Clique, gruppo di amici, che porta a Copertura dei vertici, sorvegliare ogni strada, che porta a Ciclo hamiltoniano, visitare tutto una volta. Morale: se un problema NP-completo ha una soluzione rapida, ce l’hanno tutti, e P è uguale a NP.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Riduzione: risolvere un problema con un altro</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Lo strumento che collega tutti i problemi NP-completi</text>
<rect x="40" y="104" width="164" height="78" rx="12" fill="#FF6B6B"/><text x="122" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Problema A</text>
<text x="122" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">es.: Sudoku</text>
<line x1="207" y1="143" x2="231" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="234" y="104" width="164" height="78" rx="12" fill="#5B2A86"/><text x="316" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Traduttore rapido</text>
<text x="316" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">tempo polinomiale</text>
<line x1="401" y1="143" x2="425" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="428" y="104" width="164" height="78" rx="12" fill="#3A86FF"/><text x="510" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Problema B</text>
<text x="510" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">es.: SAT</text>
<line x1="595" y1="143" x2="619" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="622" y="104" width="164" height="78" rx="12" fill="#2A9D8F"/><text x="704" y="148" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Risolutore di B</text>
<line x1="789" y1="143" x2="813" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="816" y="104" width="164" height="78" rx="12" fill="#FFB703"/><text x="898" y="138" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Risposta</text>
<text x="898" y="160" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-style="italic">vale per A e B</text>
<text x="500" y="214" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Se B ha una soluzione rapida, ce l’ha anche A.</text>
<line x1="50" y1="238" x2="950" y2="238" stroke="#EADBC6" stroke-width="1.5"/><text x="500" y="270" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">L’effetto domino di Karp (1972)</text>
<g transform="rotate(-6 155 360)"><rect x="70" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><rect x="70" y="300" width="170" height="10" rx="4" fill="#5B2A86"/><text x="155" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">SAT</text>
<text x="155" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">formule logiche</text>
</g>
<line x1="246" y1="358" x2="289" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(-1 380 360)"><rect x="295" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/><rect x="295" y="300" width="170" height="10" rx="4" fill="#3A86FF"/><text x="380" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Clique</text>
<text x="380" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">gruppo di amici</text>
</g>
<line x1="471" y1="358" x2="514" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(4 605 360)"><rect x="520" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/><rect x="520" y="300" width="170" height="10" rx="4" fill="#2A9D8F"/><text x="605" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Copertura dei vertici</text>
<text x="605" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">sorvegliare ogni strada</text>
</g>
<line x1="696" y1="358" x2="739" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(9 830 360)"><rect x="745" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="3"/><rect x="745" y="300" width="170" height="10" rx="4" fill="#FF6B6B"/><text x="830" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ciclo hamiltoniano</text>
<text x="830" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">visitare tutto una volta</text>
</g>
<rect x="80" y="450" width="840" height="56" rx="12" fill="#2B1B3D"/><text x="500" y="484" font-size="15.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Se UN problema NP-completo ha una soluzione rapida, ce l’hanno TUTTI, e P = NP.</text>
</svg>
