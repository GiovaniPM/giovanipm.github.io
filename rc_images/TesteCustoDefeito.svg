<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quanto mais tarde o defeito aparece, mais caro ele fica</title>
<desc id="d">Gráfico de barras com o custo relativo de corrigir um defeito: 1 vez nos requisitos, 5 vezes no projeto, 10 vezes na codificação, 20 vezes nos testes e 100 vezes em produção. Uma seta indica que testar cedo sai mais barato.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Quanto mais tarde o defeito aparece, mais caro ele fica</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Custo relativo de corrigir o mesmo defeito conforme a fase em que é encontrado</text>
<line x1="60" y1="440" x2="940" y2="440" stroke="#2B1B3D" stroke-width="2.5"/>
<rect x="95" y="414" width="110" height="26" rx="6" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="150" y="402" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">1×</text>
<text x="150" y="470" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Requisitos</text>
<text x="150" y="494" font-size="14" fill="#756986" text-anchor="middle">revisão de requisitos</text>
<rect x="270" y="378" width="110" height="62" rx="6" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="325" y="366" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">5×</text>
<text x="325" y="470" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Projeto</text>
<text x="325" y="494" font-size="14" fill="#756986" text-anchor="middle">revisão de projeto</text>
<rect x="445" y="336" width="110" height="104" rx="6" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="500" y="324" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">10×</text>
<text x="500" y="470" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Codificação</text>
<text x="500" y="494" font-size="14" fill="#756986" text-anchor="middle">teste unitário</text>
<rect x="620" y="272" width="110" height="168" rx="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="675" y="260" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">20×</text>
<text x="675" y="470" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Testes</text>
<text x="675" y="494" font-size="14" fill="#756986" text-anchor="middle">teste de sistema</text>
<rect x="795" y="140" width="110" height="300" rx="6" fill="#C2185B" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="850" y="128" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">100×</text>
<text x="850" y="470" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Produção</text>
<text x="850" y="494" font-size="14" fill="#756986" text-anchor="middle">defeito com o cliente</text>
<path d="M790 132 C 620 118, 360 150, 170 360" stroke="#5B2A86" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<text x="520" y="112" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">testar cedo sai mais barato</text>
<text x="500" y="536" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Valores ilustrativos da ordem de grandeza, com base em Boehm (1981). Barras fora de escala.</text>
</svg>
