<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Los horizontes de enfoque</title>
<desc id="d">Seis horizontes de enfoque del GTD, del más amplio al más concreto: horizonte 5, propósito y principios, por qué haces lo que haces; horizonte 4, visión de 3 a 5 años; horizonte 3, metas de 1 a 2 años; horizonte 2, áreas de enfoque y responsabilidad, como salud, equipo y finanzas; horizonte 1, proyectos, resultados con más de una acción en menos de un año; y el suelo, las acciones y la agenda.</desc>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Los horizontes de enfoque</text>
<path d="M60.0 520.0 L60.0 107.0" stroke="#756986" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M60.0 96.0 L66.0 107.0 L54.0 107.0 Z" fill="#756986"/>
<text x="40" y="310" font-size="13" font-weight="700" fill="#756986" text-anchor="middle" transform="rotate(-90 40 310)">visión más amplia · más concreto</text>
<rect x="90" y="90" width="870" height="60" rx="12" fill="#5B2A86"/>
<text x="112.0" y="126.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 5 · Propósito y principios</text>
<text x="938.0" y="126.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">por qué haces lo que haces</text>
<rect x="90" y="162" width="870" height="60" rx="12" fill="#7B3FB0"/>
<text x="112.0" y="198.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 4 · Visión (de 3 a 5 años)</text>
<text x="938.0" y="198.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">cómo sería el éxito a largo plazo</text>
<rect x="90" y="234" width="870" height="60" rx="12" fill="#C2185B"/>
<text x="112.0" y="270.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 3 · Metas (de 1 a 2 años)</text>
<text x="938.0" y="270.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">lo que hay que lograr pronto</text>
<rect x="90" y="306" width="870" height="60" rx="12" fill="#B35300"/>
<text x="112.0" y="342.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 2 · Áreas de enfoque y responsabilidad</text>
<text x="938.0" y="342.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">roles que mantener: salud, equipo, finanzas</text>
<rect x="90" y="378" width="870" height="60" rx="12" fill="#2F6FE0"/>
<text x="112.0" y="414.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Horizonte 1 · Proyectos</text>
<text x="938.0" y="414.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">resultados con más de una acción, en menos de un año</text>
<rect x="90" y="450" width="870" height="60" rx="12" fill="#0E8074"/>
<text x="112.0" y="486.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Suelo · Acciones y agenda</text>
<text x="938.0" y="486.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">la próxima acción física y los compromisos</text>
</svg>
