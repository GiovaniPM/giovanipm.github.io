<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Flow Framework: o que flui e como medir</title>
<desc id="d">Diagrama do Flow Framework. Um fluxo de valor leva a demanda até o cliente. Por ele passam quatro itens de fluxo: funcionalidade, novo valor de negócio; defeito, corrige a qualidade; risco, segurança e conformidade; e débito técnico, remove obstáculos futuros. Cinco métricas de fluxo: velocidade, itens concluídos por período; tempo, do início do trabalho até a entrega; eficiência, tempo ativo dividido pelo tempo total; carga, itens em andamento; e distribuição, proporção de cada tipo de item.</desc>
