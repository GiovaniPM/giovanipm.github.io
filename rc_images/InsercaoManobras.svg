<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Da chegada à órbita em três queimas</title>
<desc id="d">Três painéis. No primeiro, o objeto chega numa hipérbole vermelha tracejada e freia na periapse, ficando preso numa elipse alongada. No segundo, freia de novo na periapse, e a apoapse desce até a faixa-alvo verde. No terceiro, acelera na apoapse, e a periapse sobe até a faixa, deixando a órbita quase circular. Embaixo, a regra: uma queima num extremo muda a altura do extremo oposto.</desc>
