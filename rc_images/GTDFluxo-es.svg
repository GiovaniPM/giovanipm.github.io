<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Aclarar y organizar: el flujo de decisión</title>
<desc id="d">Diagrama de flujo del GTD. Cada elemento de la bandeja de entrada pasa por la pregunta: ¿qué es y requiere acción? Si no, va a la papelera, a la lista algún día o quizá, o a la referencia. Si sí, se pregunta cuál es el resultado deseado: si exige más de una acción, se convierte en un proyecto, con plan, revisión semanal y siempre una próxima acción. Después, ¿cuál es la próxima acción? Si lleva menos de dos minutos, hazla ahora. Si no, delégala, y el elemento va a la lista a la espera; aplázala con fecha, y va a la agenda; o aplázala sin fecha, y va a las próximas acciones, organizadas por contexto.</desc>
<rect width="1000" height="740" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Aclarar y organizar: el flujo de decisión</text>
