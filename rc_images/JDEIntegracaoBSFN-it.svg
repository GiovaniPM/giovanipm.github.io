<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il ciclo delle master business function</title>
<desc id="d">Gli UBE elaboratori delle Z-file, i passi BSFN dell'Orchestrator e i business service del BSSV chiamano la sequenza BeginDoc, che valida la testata e apre la cache; EditLine, ripetuto per ogni riga, che valida e salva in cache; EditDoc, con totali e regole del documento; ed EndDoc, che ottiene i next number, scrive ed esegue il commit. La cache di testata e di dettaglio, per job number, conserva tutto fino all'EndDoc, che scrive in F4201/F4211 e tabelle correlate. Esempio: F4211FSBeginDoc, F4211FSEditLine, F4211FSEditDoc e F4211FSEndDoc, con le regole del P4210 secondo la versione indicata.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Master business function: il ciclo Begin, Edit, End</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">La stessa logica usata dalla videata, chiamata da un programma ospite di JDE</text>
<text x="120" y="112" font-size="14" fill="#756986" text-anchor="middle" font-weight="700">Chi chiama</text>
<rect x="30" y="130" width="180" height="62" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="120.0" y="156.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE</text>
<text x="120.0" y="175.3" font-size="12.5" fill="#3E3350" text-anchor="middle">elaboratore Z</text>
<polyline points="210,161 232,161 232,241 252,241" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="210" width="180" height="62" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="120.0" y="236.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Orchestrator</text>
<text x="120.0" y="255.3" font-size="12.5" fill="#3E3350" text-anchor="middle">passo BSFN</text>
<polyline points="210,241 232,241 232,241 252,241" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="290" width="180" height="62" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="120.0" y="316.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">BSSV</text>
<text x="120.0" y="335.3" font-size="12.5" fill="#3E3350" text-anchor="middle">business service</text>
<polyline points="210,321 232,321 232,241 252,241" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="254" y="196" width="160" height="90" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="334.0" y="227.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">BeginDoc</text>
<text x="334.0" y="246.0" font-size="12.5" fill="#3E3350" text-anchor="middle">valida testata</text>
<text x="334.0" y="264.5" font-size="12.5" fill="#3E3350" text-anchor="middle">apre la cache</text>
<polyline points="414,241 430,241" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="432" y="196" width="160" height="90" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="512.0" y="227.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">EditLine × n</text>
<text x="512.0" y="246.0" font-size="12.5" fill="#3E3350" text-anchor="middle">valida ogni riga</text>
<text x="512.0" y="264.5" font-size="12.5" fill="#3E3350" text-anchor="middle">salva in cache</text>
<polyline points="592,241 608,241" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="610" y="196" width="160" height="90" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="690.0" y="227.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">EditDoc</text>
<text x="690.0" y="246.0" font-size="12.5" fill="#3E3350" text-anchor="middle">totali e regole</text>
<text x="690.0" y="264.5" font-size="12.5" fill="#3E3350" text-anchor="middle">del documento</text>
<polyline points="770,241 786,241" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="788" y="196" width="160" height="90" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="868.0" y="227.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">EndDoc</text>
<text x="868.0" y="246.0" font-size="12.5" fill="#3E3350" text-anchor="middle">next number,</text>
<text x="868.0" y="264.5" font-size="12.5" fill="#3E3350" text-anchor="middle">scrive e commit</text>
<rect x="254" y="320" width="694" height="70" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2" stroke-dasharray="6 4"/>
<text x="601" y="350" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cache di testata e di dettaglio (jdeCache) per job number</text>
<text x="601" y="372" font-size="13" fill="#3E3350" text-anchor="middle">niente viene scritto nelle tabelle prima dell'EndDoc</text>
<polyline points="334,286 334,318" fill="none" stroke="#2B1B3D" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)" marker-start="url(#ar)"/>
<polyline points="512,286 512,318" fill="none" stroke="#2B1B3D" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)" marker-start="url(#ar)"/>
<polyline points="690,286 690,318" fill="none" stroke="#2B1B3D" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="820" y="420" width="150" height="60" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="895.0" y="445.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">F4201 / F4211</text>
<text x="895.0" y="464.3" font-size="12.5" fill="#3E3350" text-anchor="middle">e correlate</text>
<polyline points="868,286 868,300 960,300 960,400 895,400 895,418" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="420" width="760" height="60" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="410.0" y="445.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Esempio: F4211FSBeginDoc → F4211FSEditLine → F4211FSEditDoc → F4211FSEndDoc</text>
<text x="410.0" y="464.3" font-size="12.5" fill="#3E3350" text-anchor="middle">(ordine di vendita, stesse regole del P4210, guidate dalla versione indicata)</text>
</svg>
