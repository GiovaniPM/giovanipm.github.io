<text x="500.0" y="392" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#756986">guarda lo que ya se leyó</text>
<path d="M896.0 312 L896.0 470 L104.0 470 L104.0 316" fill="none" stroke="#C2185B" stroke-width="2.5" marker-end="url(#a)"/>
