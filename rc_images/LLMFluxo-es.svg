<text x="896.0" y="436" text-anchor="end" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#C2185B"><tspan x="888.0">el token sorteado se vuelve</tspan><tspan x="888.0" dy="18">texto en pantalla y vuelve a entrar</tspan></text>
<text x="500.0" y="504" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#756986">se ejecuta en la GPU (WebGPU, pesos de 16 bits) o en la CPU (workers, pesos de 8 bits)</text>
