<line x1="500.0" y1="132" x2="500.0" y2="196" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/>
<rect x="20.0" y="200" width="168" height="112" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/>
<rect x="20.0" y="200" width="168" height="34" rx="14" fill="#3A86FF"/><rect x="20.0" y="220" width="168" height="14" fill="#3A86FF"/>
