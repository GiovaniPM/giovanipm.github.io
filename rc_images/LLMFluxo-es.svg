<rect x="218.0" y="200" width="168" height="34" rx="14" fill="#0E8074"/><rect x="218.0" y="220" width="168" height="14" fill="#0E8074"/>
<text x="302.0" y="223" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Tokenizador</text>
<text x="302.0" y="264" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2B1B3D">texto → números</text>
