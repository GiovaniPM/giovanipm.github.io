<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">Cómo genera la app una respuesta</title><desc id="d">Diagrama con cinco cajas unidas por flechas, de izquierda a derecha: Texto, la conversación armada en el formato del modelo; Tokenizador, que convierte el texto en números; Transformer, con N capas de atención y MLP; Logits, una puntuación para cada token; y Muestreo, con temperatura, top-k y top-p. Una flecha vuelve del Muestreo al Texto: el token sorteado se vuelve texto en pantalla y vuelve a entrar. Arriba, el archivo .gguf entrega pesos, vocabulario y metadatos al tokenizador y al transformer. Debajo del transformer, la caché KV guarda lo que ya se leyó. Abajo: se ejecuta en la GPU, con WebGPU y pesos de 16 bits, o en la CPU, con workers y pesos de 8 bits.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
