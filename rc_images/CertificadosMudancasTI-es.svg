<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Tres cambios estructurales en la TI</title>
<desc id="d">Tres filas comparan la TI antes y con la IA. Primera: de ejecutar tareas técnicas a orquestar resultados. Segunda: de la herramienta aislada al proceso de punta a punta. Tercera: de escribir código como la parte cara a decidir qué construir como la parte cara. Abajo, dos indicadores: el 39% de las habilidades clave cambiará hasta 2030, según el World Economic Forum, y el 80% de los ingenieros deberá recapacitarse hasta 2027, según Gartner.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tres cambios estructurales</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">La TI deja de ejecutar tareas y empieza a orquestar resultados</text>

<text x="235" y="112" font-size="15" fill="#756986" text-anchor="middle" font-weight="700" letter-spacing="2">ANTES</text>
<text x="765" y="112" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700" letter-spacing="2">CON IA</text>

<g>
<rect x="50" y="128" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="162" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ejecutar tareas técnicas</text>
<text x="235" y="186" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">programar, configurar, documentar</text>
<line x1="430" y1="168" x2="568" y2="168" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="128" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="162" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Orquestar resultados</text>
<text x="765" y="186" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">tareas asistidas o delegadas a agentes</text>
</g>
<g>
<rect x="50" y="223" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="257" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Herramienta aislada</text>
<text x="235" y="281" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">especialista en un solo producto</text>
<line x1="430" y1="263" x2="568" y2="263" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="223" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="257" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Proceso de punta a punta</text>
<text x="765" y="281" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">del problema a una solución segura y sostenible</text>
</g>
<g>
<rect x="50" y="318" width="370" height="80" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="235" y="352" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Escribir código es caro</text>
<text x="235" y="376" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">el cuello de botella es construir</text>
<line x1="430" y1="358" x2="568" y2="358" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<rect x="580" y="318" width="370" height="80" rx="12" fill="#5B2A86"/>
<text x="765" y="352" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Decidir qué construir es caro</text>
<text x="765" y="376" font-size="13" fill="#E9DDF5" text-anchor="middle" font-style="italic">el cuello de botella es elegir bien</text>
</g>

<rect x="50" y="428" width="430" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="120" y="478" font-size="34" fill="#2B1B3D" text-anchor="middle" font-weight="700">39%</text>
<text x="190" y="459" font-size="14" fill="#2B1B3D">de las habilidades clave</text>
<text x="190" y="479" font-size="14" fill="#2B1B3D">cambiará hasta 2030</text>
<text x="190" y="496" font-size="12" fill="#756986" font-style="italic">World Economic Forum</text>
<rect x="520" y="428" width="430" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="590" y="478" font-size="34" fill="#2B1B3D" text-anchor="middle" font-weight="700">80%</text>
<text x="660" y="459" font-size="14" fill="#2B1B3D">de los ingenieros deberá</text>
<text x="660" y="479" font-size="14" fill="#2B1B3D">recapacitarse hasta 2027</text>
<text x="660" y="496" font-size="12" fill="#756986" font-style="italic">Gartner</text>
</svg>
