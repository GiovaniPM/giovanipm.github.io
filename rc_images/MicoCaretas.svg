<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" width="1000" height="326" role="img" aria-labelledby="t d">
<title id="t">Quanto as caretas ajudam</title>
<desc id="d">Barras com a chance de você perder a rodada conforme o nível das caretas, evitando sempre as cartas que fazem o adversário mudar de cara. Difícil, sem caretas: 25,5%. Normal: 18,5%. Fácil: 7,2%. Simulação de 100 mil rodadas por nível, com 4 jogadores e 15 casais.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="326" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="500" y="36" font-size="19" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Quanto as caretas ajudam</text><text x="316" y="97" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Difícil: sem caretas</text><rect x="330" y="70" width="510.0" height="40" rx="6" fill="#756986"/><text x="850.0" y="97" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">25,5%</text><text x="316" y="159" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Normal: às vezes blefam</text><rect x="330" y="132" width="370.0" height="40" rx="6" fill="#B35300"/><text x="710.0" y="159" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">18,5%</text><text x="316" y="221" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Fácil: quase sempre entregam</text><rect x="330" y="194" width="144.0" height="40" rx="6" fill="#0E8074"/><text x="484.0" y="221" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">7,2%</text><text x="330" y="276" font-size="13.5" font-weight="normal" text-anchor="start" fill="#756986">chance de você perder a rodada</text><text x="500" y="304" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#756986">100 mil rodadas simuladas por nível: 4 jogadores, 15 casais; você joga primeiro e evita as cartas com careta</text>
</g></svg>
