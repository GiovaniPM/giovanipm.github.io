<rect x="272" y="292" width="264" height="66" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="288" y="315" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Beyond Budgeting</text>
<text x="288" y="334" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">obiettivi relativi, risorse</text><text x="288" y="349" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">su richiesta</text>
<rect x="548" y="292" width="264" height="66" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="564" y="315" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">Lean Portfolio Management</text>
<text x="564" y="334" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">budget per flusso</text><text x="564" y="349" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">di valore (SAFe)</text>
