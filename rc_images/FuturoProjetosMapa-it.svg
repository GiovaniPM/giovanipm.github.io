<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Oltre i progetti: sette idee, cinque livelli</title>
<desc id="d">Mappa delle sette idee in cinque livelli. Mentalità, qual è l’unità di lavoro: #NoProjects, prodotti e flusso continuo, non progetti. Direzione, dove andiamo e perché: OKR. Denaro, come allochiamo le risorse: Beyond Budgeting e Lean Portfolio Management del SAFe. Struttura, chi fa il lavoro e come interagiscono i team: Team Topologies. Misura, come sappiamo se il valore scorre: Flow Framework. Una fascia verticale indica l’IA applicata a tutti i livelli.</desc>
<rect width="1000" height="610" rx="18" fill="#FFF7EC"/>
<text x="500" y="52" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Oltre i progetti: sette idee, cinque livelli</text>
