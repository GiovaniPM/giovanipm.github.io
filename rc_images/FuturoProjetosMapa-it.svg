<text x="66" y="238" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">Dove andiamo</text><text x="66" y="255" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">e perché?</text>
<rect x="272" y="194" width="540" height="66" rx="10" fill="#fff" stroke="#FFB703" stroke-width="2.5"/>
<text x="288" y="217" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="start">OKR</text>
<text x="288" y="242" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="start">obiettivi e risultati chiave</text>
