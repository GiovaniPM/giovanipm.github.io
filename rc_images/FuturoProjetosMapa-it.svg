<text x="66" y="140" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">Qual è l’unità</text><text x="66" y="157" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">di lavoro?</text>
