<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">V-model: every construction step has its own test level</title>
<desc id="d">V-model. On the left, going down: client requirements, specification, architecture and module design, down to coding at the bottom. On the right, going up: unit, integration, system and acceptance testing. Dashed lines show that each test is planned from the matching step on the left.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="610" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">V-model: every construction step has its own test level</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">The left side specifies, the right side tests, and each test is planned early on</text>
<text x="125" y="96" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">SPECIFY AND DESIGN</text>
<text x="875" y="96" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">TEST AND INTEGRATE</text>
<line x1="125.0" y1="170" x2="200.0" y2="200" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="200.0" y1="260" x2="275.0" y2="290" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="275.0" y1="350" x2="350.0" y2="380" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="350.0" y1="440" x2="500.0" y2="470" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="500.0" y1="470" x2="650.0" y2="440" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="650.0" y1="380" x2="725.0" y2="350" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="725.0" y1="290" x2="800.0" y2="260" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="800.0" y1="200" x2="875.0" y2="170" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="236" y1="140.0" x2="764" y2="140.0" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="500" y="133.0" font-size="13" fill="#B35300" text-anchor="middle" font-weight="700">plans</text>
<line x1="311" y1="230.0" x2="689" y2="230.0" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="500" y="223.0" font-size="13" fill="#B35300" text-anchor="middle" font-weight="700">plans</text>
<line x1="386" y1="320.0" x2="614" y2="320.0" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="500" y="313.0" font-size="13" fill="#B35300" text-anchor="middle" font-weight="700">plans</text>
<line x1="461" y1="410.0" x2="539" y2="410.0" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="500" y="403.0" font-size="13" fill="#B35300" text-anchor="middle" font-weight="700">plans</text>
<rect x="20" y="110" width="210" height="60" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="125.0" y="136" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Client requirements</text>
<text x="125.0" y="156" font-size="13" fill="#756986" text-anchor="middle">what the client needs</text>
<rect x="95" y="200" width="210" height="60" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="200.0" y="226" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Specification</text>
<text x="200.0" y="246" font-size="13" fill="#756986" text-anchor="middle">what the system does</text>
<rect x="170" y="290" width="210" height="60" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="275.0" y="316" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Architecture</text>
<text x="275.0" y="336" font-size="13" fill="#756986" text-anchor="middle">how the parts connect</text>
<rect x="245" y="380" width="210" height="60" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="350.0" y="406" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Module design</text>
<text x="350.0" y="426" font-size="13" fill="#756986" text-anchor="middle">how each part works</text>
<rect x="770" y="110" width="210" height="60" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="875.0" y="136" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Acceptance testing</text>
<text x="875.0" y="156" font-size="13" fill="#756986" text-anchor="middle">is it the right thing?</text>
<rect x="695" y="200" width="210" height="60" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="800.0" y="226" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">System testing</text>
<text x="800.0" y="246" font-size="13" fill="#756986" text-anchor="middle">does it meet the spec?</text>
<rect x="620" y="290" width="210" height="60" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="725.0" y="316" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Integration testing</text>
<text x="725.0" y="336" font-size="13" fill="#756986" text-anchor="middle">do the parts talk?</text>
<rect x="545" y="380" width="210" height="60" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="650.0" y="406" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Unit testing</text>
<text x="650.0" y="426" font-size="13" fill="#756986" text-anchor="middle">does each part work?</text>
<rect x="395" y="470" width="210" height="60" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="2.5"/>
<text x="500.0" y="496" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Coding</text>
<text x="500.0" y="516" font-size="13" fill="#756986" text-anchor="middle">writing the code</text>
<text x="20" y="568" font-size="14" fill="#3E3350">Verification: each product matches its specification. “Are we building it right?”</text>
<text x="20" y="590" font-size="14" fill="#3E3350">Validation: the final product meets the client’s real need. “Are we building the right thing?”</text>
</svg>
