<text x="500.0" y="310.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Avido × pigro su “&lt;b&gt;um&lt;/b&gt; e &lt;b&gt;dois&lt;/b&gt;”</text>
