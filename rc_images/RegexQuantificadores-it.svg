<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quantificatori: quante volte, e con quanta avidità</title>
<desc id="d">In alto, delle barre mostrano quante ripetizioni accetta ogni quantificatore: ? da 0 a 1, * da 0 all’infinito, + da 1 all’infinito, {2,4} da 2 a 4 e {3} esattamente 3. Sotto, sul testo &lt;b&gt;um&lt;/b&gt; e &lt;b&gt;dois&lt;/b&gt;, il pattern avido &lt;.+&gt; corrisponde a tutto il testo in una volta, e quello pigro &lt;.+?&gt; a ciascuno dei quattro tag separatamente.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="510" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Quantificatori: quante volte, e con quanta avidità</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Sopra, quante ripetizioni accetta ciascuno; sotto, avido contro pigro</text>
