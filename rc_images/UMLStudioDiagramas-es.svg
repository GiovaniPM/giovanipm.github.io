<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 626" width="1000" height="626" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Los 14 diagramas de UML 2.5.1</title>
<desc id="d">Árbol con los 14 tipos de diagrama. Estructura tiene siete: clases, objetos, paquetes, componentes, estructura compuesta, despliegue y perfil. Comportamiento tiene siete: casos de uso, actividades, máquina de estados y el grupo interacción, con secuencia, comunicación, tiempos y visión general de interacción.</desc>
<rect width="1000" height="626" rx="18" fill="#FFF7EC"/>
