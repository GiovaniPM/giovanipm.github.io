<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The iron triangle and its agile inversion</title>
<desc id="d">Two triangles. In the traditional, predictive approach, scope is fixed and cost and time are estimated: the plan drives value. In the agile, adaptive approach, the triangle is inverted: cost and time are fixed and scope is estimated: value drives the plan.</desc>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="52" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">The iron triangle and its agile inversion</text>
<text x="250" y="100" font-size="19" font-weight="700" fill="#5B2A86" text-anchor="middle">Traditional (predictive)</text>
<path d="M250 178 L100 400 L400 400 Z" fill="#EFE6F8" stroke="#5B2A86" stroke-width="4" stroke-linejoin="round"/>
<text x="250" y="334" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">The plan</text><text x="250" y="356" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">drives value</text>
<text x="250" y="132" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Scope</text>
<rect x="215.5" y="143" width="69" height="26" rx="13" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/><text x="250" y="161" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">FIXED</text>
<text x="100" y="432" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Cost</text>
<rect x="47.5" y="443" width="105" height="26" rx="13" fill="#fff" stroke="#2B1B3D" stroke-width="2"/><text x="100" y="461" font-size="12.5" font-weight="700" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">ESTIMATED</text>
<text x="400" y="432" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Time</text>
<rect x="347.5" y="443" width="105" height="26" rx="13" fill="#fff" stroke="#2B1B3D" stroke-width="2"/><text x="400" y="461" font-size="12.5" font-weight="700" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">ESTIMATED</text>
<path d="M462 280 H528" stroke="#B35300" stroke-width="5" stroke-linecap="round"/><path d="M524 266 L546 280 L524 294 Z" fill="#B35300"/>
<text x="750" y="100" font-size="19" font-weight="700" fill="#0E8074" text-anchor="middle">Agile (adaptive)</text>
<path d="M600 182 L900 182 L750 404 Z" fill="#E2F6F2" stroke="#0E8074" stroke-width="4" stroke-linejoin="round"/>
<text x="750" y="244" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">Value</text><text x="750" y="266" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">drives the plan</text>
<text x="600" y="132" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Cost</text>
<rect x="565.5" y="143" width="69" height="26" rx="13" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/><text x="600" y="161" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">FIXED</text>
<text x="900" y="132" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Time</text>
<rect x="865.5" y="143" width="69" height="26" rx="13" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/><text x="900" y="161" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">FIXED</text>
<text x="750" y="436" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">Scope</text>
<rect x="697.5" y="447" width="105" height="26" rx="13" fill="#fff" stroke="#2B1B3D" stroke-width="2"/><text x="750" y="465" font-size="12.5" font-weight="700" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">ESTIMATED</text>
<text x="500" y="500" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Adapted from DSDM (Dynamic Systems Development Method), by the Agile Business Consortium.</text>
</svg>
