<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Automation × augmentation: effect on jobs</title>
<desc id="d">Two panels. On the left, automation: when AI replaces tasks, entry-level jobs shrink. Employment of developers aged 22 to 25 fell nearly 20% from its late-2022 peak, and young workers in AI-exposed jobs are 19% below the trend of less-exposed peers. On the right, augmentation: when AI complements the work, jobs hold steady or grow, and experienced professionals show no comparable decline. Source: Stanford Digital Economy Lab, 2025 and 2026.</desc>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Automation × augmentation</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">The effect on jobs depends on how AI is used</text>

<rect x="50" y="100" width="420" height="370" rx="14" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<path d="M50 114 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v50 h-420 z" fill="#E23B3B"/>
<text x="260" y="130" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">Automation</text>
<text x="260" y="152" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">AI replaces tasks</text>
<path d="M92 188 h16 v24 h12 l-20 24 l-20 -24 h12 z" fill="#E23B3B"/>
<text x="138" y="219" font-size="17" fill="#2B1B3D" font-weight="700">Entry-level jobs shrink</text>
<line x1="75" y1="252" x2="445" y2="252" stroke="#F2D6D6" stroke-width="2"/>
<text x="75" y="315" font-size="36" fill="#E23B3B" font-weight="700">−20%</text>
<text x="195" y="298" font-size="14" fill="#2B1B3D">employment of developers</text>
<text x="195" y="317" font-size="14" fill="#2B1B3D">aged 22 to 25, versus the</text>
<text x="195" y="336" font-size="14" fill="#2B1B3D">late-2022 peak</text>
<text x="75" y="415" font-size="36" fill="#E23B3B" font-weight="700">−19%</text>
<text x="195" y="398" font-size="14" fill="#2B1B3D">young workers in AI-exposed</text>
<text x="195" y="417" font-size="14" fill="#2B1B3D">jobs, relative to the trend of</text>
<text x="195" y="436" font-size="14" fill="#2B1B3D">less-exposed peers</text>

<circle cx="500" cy="285" r="22" fill="#2B1B3D"/>
<text x="500" y="292" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">×</text>

<rect x="530" y="100" width="420" height="370" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M530 114 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v50 h-420 z" fill="#2A9D8F"/>
<text x="740" y="130" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">Augmentation</text>
<text x="740" y="152" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">AI complements the work</text>
<path d="M572 236 h16 v-24 h12 l-20 -24 l-20 24 h12 z" fill="#2A9D8F"/>
<text x="618" y="219" font-size="17" fill="#2B1B3D" font-weight="700">Jobs hold steady or grow</text>
<line x1="555" y1="252" x2="925" y2="252" stroke="#D3ECE9" stroke-width="2"/>
<g font-size="14" fill="#2B1B3D">
<path d="M560 300 l8 8 l16 -18" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="298" font-size="16" font-weight="700">Experienced professionals</text>
<text x="600" y="319">show no comparable decline</text>
<text x="600" y="338">to that of younger workers</text>
<path d="M560 400 l8 8 l16 -18" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="398" font-size="16" font-weight="700">Complementary use</text>
<text x="600" y="419">where AI augments the work,</text>
<text x="600" y="438">jobs are sustained</text>
</g>

<text x="500" y="505" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">Source: Stanford Digital Economy Lab, Canaries in the Coal Mine?, 2025 and 2026 · descriptive, not causal study</text>
</svg>
