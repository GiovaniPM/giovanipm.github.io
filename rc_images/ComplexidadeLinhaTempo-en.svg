<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">How computational complexity was born</title>
<desc id="d">Timeline with nine milestones. 1936, Alan Turing shows that not everything can be computed, with the halting problem. 1956, Kurt Gödel asks von Neumann, in a letter, whether finding proofs can be automated. 1965, Hartmanis and Stearns measure the time algorithms take and name the field. 1964 and 1965, Cobham and Edmonds propose that polynomial time means efficient. 1971, Stephen Cook shows that the SAT problem is NP-complete and the question P equals NP is born. 1972, Richard Karp shows 21 NP-complete problems. 1973, Leonid Levin finds the same thing independently in the Soviet Union. 2000, the Clay Institute offers 1 million dollars for an answer. 2002, Agrawal, Kayal and Saxena show that testing whether a number is prime is in P.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">How computational complexity was born</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">From Turing to the million-dollar prize</text>
<line x1="40" y1="290" x2="960" y2="290" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<line x1="110.0" y1="244" x2="110.0" y2="290" stroke="#5B2A86" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="110.0" cy="290" r="8" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<rect x="18.0" y="104" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<text x="110" y="134" font-size="20" fill="#5B2A86" text-anchor="middle" font-weight="700">1936</text>
<text x="110" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Alan Turing</text>
<text x="110" y="182" font-size="12" fill="#756986" text-anchor="middle">Not everything can be</text>
<text x="110" y="199" font-size="12" fill="#756986" text-anchor="middle">computed: the</text>
<text x="110" y="216" font-size="12" fill="#756986" text-anchor="middle">halting problem</text>
<line x1="207.5" y1="290" x2="207.5" y2="318" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="207.5" cy="290" r="8" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/>
<rect x="115.5" y="318" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="207.5" y="348" font-size="20" fill="#3A86FF" text-anchor="middle" font-weight="700">1956</text>
<text x="207.5" y="372" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Kurt Gödel</text>
<text x="207.5" y="396" font-size="12" fill="#756986" text-anchor="middle">Letter to von Neumann:</text>
<text x="207.5" y="413" font-size="12" fill="#756986" text-anchor="middle">can finding proofs</text>
<text x="207.5" y="430" font-size="12" fill="#756986" text-anchor="middle">be automated?</text>
<line x1="305.0" y1="244" x2="305.0" y2="290" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="305.0" cy="290" r="8" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<rect x="213.0" y="104" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="305" y="134" font-size="20" fill="#2A9D8F" text-anchor="middle" font-weight="700">1965</text>
<text x="305" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Hartmanis and Stearns</text>
<text x="305" y="182" font-size="12" fill="#756986" text-anchor="middle">Measure the time</text>
<text x="305" y="199" font-size="12" fill="#756986" text-anchor="middle">algorithms take and</text>
<text x="305" y="216" font-size="12" fill="#756986" text-anchor="middle">name the field</text>
<line x1="402.5" y1="290" x2="402.5" y2="318" stroke="#FFB703" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="402.5" cy="290" r="8" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/>
<rect x="310.5" y="318" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="402.5" y="348" font-size="20" fill="#B35300" text-anchor="middle" font-weight="700">1964–65</text>
<text x="402.5" y="372" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cobham and Edmonds</text>
<text x="402.5" y="396" font-size="12" fill="#756986" text-anchor="middle">Polynomial time</text>
<text x="402.5" y="413" font-size="12" fill="#756986" text-anchor="middle">= efficient</text>
<line x1="500.0" y1="244" x2="500.0" y2="290" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="500.0" cy="290" r="8" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/>
<rect x="408.0" y="104" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="500" y="134" font-size="20" fill="#FF6B6B" text-anchor="middle" font-weight="700">1971</text>
<text x="500" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Stephen Cook</text>
<text x="500" y="182" font-size="12" fill="#756986" text-anchor="middle">SAT is NP-complete:</text>
<text x="500" y="199" font-size="12" fill="#756986" text-anchor="middle">the question P = NP?</text>
<text x="500" y="216" font-size="12" fill="#756986" text-anchor="middle">is born</text>
<line x1="597.5" y1="290" x2="597.5" y2="318" stroke="#E23B3B" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="597.5" cy="290" r="8" fill="#E23B3B" stroke="#2B1B3D" stroke-width="2"/>
<rect x="505.5" y="318" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="597.5" y="348" font-size="20" fill="#E23B3B" text-anchor="middle" font-weight="700">1972</text>
<text x="597.5" y="372" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Richard Karp</text>
<text x="597.5" y="396" font-size="12" fill="#756986" text-anchor="middle">Shows 21</text>
<text x="597.5" y="413" font-size="12" fill="#756986" text-anchor="middle">NP-complete problems</text>
<line x1="695.0" y1="244" x2="695.0" y2="290" stroke="#F4845F" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="695.0" cy="290" r="8" fill="#F4845F" stroke="#2B1B3D" stroke-width="2"/>
<rect x="603.0" y="104" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#F4845F" stroke-width="2.5"/>
<text x="695" y="134" font-size="20" fill="#F4845F" text-anchor="middle" font-weight="700">1973</text>
<text x="695" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Leonid Levin</text>
<text x="695" y="182" font-size="12" fill="#756986" text-anchor="middle">Finds the same thing,</text>
<text x="695" y="199" font-size="12" fill="#756986" text-anchor="middle">independently, in</text>
<text x="695" y="216" font-size="12" fill="#756986" text-anchor="middle">the Soviet Union</text>
<line x1="792.5" y1="290" x2="792.5" y2="318" stroke="#5B2A86" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="792.5" cy="290" r="8" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<rect x="700.5" y="318" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<text x="792.5" y="348" font-size="20" fill="#5B2A86" text-anchor="middle" font-weight="700">2000</text>
<text x="792.5" y="372" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Clay Institute</text>
<text x="792.5" y="396" font-size="12" fill="#756986" text-anchor="middle">US$1 million</text>
<text x="792.5" y="413" font-size="12" fill="#756986" text-anchor="middle">for an answer</text>
<line x1="890.0" y1="244" x2="890.0" y2="290" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="890.0" cy="290" r="8" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<rect x="798.0" y="104" width="184" height="140" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="890" y="134" font-size="20" fill="#2A9D8F" text-anchor="middle" font-weight="700">2002</text>
<text x="890" y="158" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Agrawal, Kayal and Saxena</text>
<text x="890" y="182" font-size="12" fill="#756986" text-anchor="middle">Testing whether a</text>
<text x="890" y="199" font-size="12" fill="#756986" text-anchor="middle">number is prime is in P</text>
</svg>
