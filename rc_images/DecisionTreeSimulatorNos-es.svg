<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="t d"><title id="t">Los cuatro nodos de Decision Tree Simulator</title><desc id="d">Decisión, con un cuadrado: alguien elige una opción. Incertidumbre, con un círculo: el azar elige según las probabilidades. Regla, con un rombo: una condición elige por sí sola. Resultado, con un triángulo: fin del camino, con su valor.</desc><style>.dtw .n-shape{stroke-width:1.8}
.dtw .n-txt{fill:#1b2022;font:13px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif}
.dtw .n-num{fill:#60686c;font:600 10px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-val{fill:#1b2022;font:600 12px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-inner{fill:none;stroke-width:1}
.dtw .t-decision .n-shape{fill:#e4f0fb;stroke:#1f5f99}.dtw .t-decision .n-glyph{fill:#1f5f99}
.dtw .t-chance .n-shape{fill:#efeafa;stroke:#65509c}.dtw .t-chance .n-glyph{fill:#65509c}
.dtw .t-rule .n-shape{fill:#fdf0d0;stroke:#9a6a00}.dtw .t-rule .n-glyph{fill:#9a6a00}
.dtw .t-outcome .n-shape{fill:#dff3e4;stroke:#2b7a45}.dtw .t-outcome .n-glyph{fill:#2b7a45}.dtw .t-outcome .n-inner{stroke:#2b7a45}
.dtw .e-line{fill:none;stroke:#4a5358;stroke-width:1.6;stroke-linejoin:round}
.dtw .e-mark{fill:none;stroke:#4a5358;stroke-width:1.8}
.dtw .e-lab{fill:#1b2022;font:12px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;paint-order:stroke;stroke:#FFF7EC;stroke-width:4px;stroke-linejoin:round}
.dtw .edge.best .e-line{stroke:#1f7a3d;stroke-width:3}
.dtw .edge.rej .e-line{opacity:.55}
.dtw .edge.rej .e-lab{fill:#60686c}</style><rect width="1000" height="190" rx="18" fill="#FFF7EC"/><g class="dtw"><g class="node t-decision" data-id="nmvxui2ibn" transform="translate(37 42)"><title>Decisión: ¿Qué proveedor?</title><rect class="n-shape" width="176" height="64" rx="2"/><rect class="n-glyph" x="10" y="10" width="10" height="10"/><text class="n-txt" x="88" y="39" text-anchor="middle">¿Qué proveedor?</text></g><g class="node t-chance" data-id="nmvxui2ibo" transform="translate(287 42)"><title>Incertidumbre: ¿Se retrasa la entrega?</title><rect class="n-shape" width="176" height="64" rx="20"/><circle class="n-glyph" cx="17" cy="15" r="5.3"/><text class="n-txt" x="88" y="39" text-anchor="middle">¿Se retrasa la entrega?</text></g><g class="node t-rule" data-id="nmvxui2ibp" transform="translate(537 42)"><title>Regla: ¿Sobre el límite?</title><path class="n-shape" d="M10 0H166L176 32L166 64H10L0 32Z"/><path class="n-glyph" d="M20 8.5L26.5 15L20 21.5L13.5 15Z"/><text class="n-txt" x="88" y="39" text-anchor="middle">¿Sobre el límite?</text></g><g class="node t-outcome" data-id="nmvxui2ibq" transform="translate(787 42)"><title>Resultado: Pedido entregado</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-txt" x="88" y="39" text-anchor="middle">Pedido entregado</text><text class="n-val" x="88" y="55" text-anchor="middle">= 0</text></g></g><text x="125" y="136" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#2B1B3D">Decisión</text><text x="125" y="158" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#756986">Alguien elige</text><text x="375" y="136" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#2B1B3D">Incertidumbre</text><text x="375" y="158" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#756986">El azar elige</text><text x="625" y="136" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#2B1B3D">Regla</text><text x="625" y="158" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#756986">La condición elige</text><text x="875" y="136" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#2B1B3D">Resultado</text><text x="875" y="158" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#756986">Fin del camino</text></svg>