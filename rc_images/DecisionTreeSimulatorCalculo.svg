<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" role="img" aria-labelledby="t d"><title id="t">Como o app calcula o valor esperado do notebook</title><desc id="d">A árvore do notebook com os valores: a incerteza vale 0,7 × 800 + 0,3 × 3.800 = 1.700; a decisão fica com o menor valor entre 1.700 e 3.000; a regra segue o ramo Não, porque o aparelho está fora da garantia.</desc><style>.dtw .n-shape{stroke-width:1.8}
.dtw .n-txt{fill:#1b2022;font:13px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif}
.dtw .n-num{fill:#60686c;font:600 10px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-val{fill:#1b2022;font:600 12px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-inner{fill:none;stroke-width:1}
.dtw .t-decision .n-shape{fill:#e4f0fb;stroke:#1f5f99}.dtw .t-decision .n-glyph{fill:#1f5f99}
.dtw .t-chance .n-shape{fill:#efeafa;stroke:#65509c}.dtw .t-chance .n-glyph{fill:#65509c}
.dtw .t-rule .n-shape{fill:#fdf0d0;stroke:#9a6a00}.dtw .t-rule .n-glyph{fill:#9a6a00}
.dtw .t-outcome .n-shape{fill:#dff3e4;stroke:#2b7a45}.dtw .t-outcome .n-glyph{fill:#2b7a45}.dtw .t-outcome .n-inner{stroke:#2b7a45}
.dtw .e-line{fill:none;stroke:#4a5358;stroke-width:1.6;stroke-linejoin:round}
.dtw .e-mark{fill:none;stroke:#4a5358;stroke-width:1.8}
.dtw .e-lab{fill:#1b2022;font:12px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;paint-order:stroke;stroke:#FFF7EC;stroke-width:4px;stroke-linejoin:round}
.dtw .edge.best .e-line{stroke:#1f7a3d;stroke-width:3}
.dtw .edge.rej .e-line{opacity:.55}
.dtw .edge.rej .e-lab{fill:#60686c}</style><rect width="1000" height="435" rx="18" fill="#FFF7EC"/><svg class="dtw" x="30" y="20" width="940" height="285" viewBox="-104 -16 1148 348"><g class="edge rej" data-edge="nmvxuhgwv6"><path class="e-line" d="M88 126.5H104Q110 126.5 110 120.5V38Q110 32 116 32H164"/><path class="e-mark" d="M143 38L147 26M149 38L153 26"/><text class="e-lab" x="118" y="26" text-anchor="start">Sim</text></g><g class="edge best" data-edge="nmvxuhh5p7"><path class="e-line" d="M88 126.5H104Q110 126.5 110 132.5V215Q110 221 116 221H164"/><text class="e-lab" x="118" y="215" text-anchor="start">Não</text></g><g class="edge best" data-edge="nmvxuhheg8"><path class="e-line" d="M340 221H356Q362 221 362 215V164Q362 158 368 158H520.3"/><text class="e-lab" x="370" y="152" text-anchor="start">Consertar · +800</text></g><g class="edge" data-edge="nmvxuhhms9"><path class="e-line" d="M696.3 158H712.3Q718.3 158 718.3 152V122Q718.3 116 724.3 116H851.4"/><text class="e-lab" x="726.3" y="110" text-anchor="start">Resolve · 70%</text></g><g class="edge" data-edge="nmvxuhhuna"><path class="e-line" d="M696.3 158H712.3Q718.3 158 718.3 164V194Q718.3 200 724.3 200H851.4"/><text class="e-lab" x="726.3" y="194" text-anchor="start">Não resolve · 30%</text></g><g class="edge rej" data-edge="nmvxuhi3hb"><path class="e-line" d="M340 221H356Q362 221 362 227V278Q362 284 368 284H520.3"/><path class="e-mark" d="M499.29999999999995 290L503.29999999999995 278M505.29999999999995 290L509.29999999999995 278"/><text class="e-lab" x="370" y="278" text-anchor="start">Trocar agora · +3.000</text></g><g class="node t-rule" data-id="nmvxuhgph5" transform="translate(-88 94.5)"><title>Regra: Está na garantia?</title><path class="n-shape" d="M10 0H166L176 32L166 64H10L0 32Z"/><path class="n-glyph" d="M20 8.5L26.5 15L20 21.5L13.5 15Z"/><text class="n-num" x="30" y="19">1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Está na garantia?</text><text class="n-val" x="88" y="55" text-anchor="middle">VE R$ 1.700</text></g><g class="node t-outcome" data-id="nmvxuhgwv6" transform="translate(164 0)"><title>Resultado: Conserto gratuito</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Conserto gratuito</text><text class="n-val" x="88" y="55" text-anchor="middle">= R$ 0</text></g><g class="node t-decision" data-id="nmvxuhh5p7" transform="translate(164 189)"><title>Decisão: Consertar ou trocar?</title><rect class="n-shape" width="176" height="64" rx="2"/><rect class="n-glyph" x="10" y="10" width="10" height="10"/><text class="n-num" x="25" y="19">1.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Consertar ou trocar?</text><text class="n-val" x="88" y="55" text-anchor="middle">VE R$ 1.700</text></g><g class="node t-chance" data-id="nmvxuhheg8" transform="translate(520.3 126)"><title>Incerteza: O conserto resolve?</title><rect class="n-shape" width="176" height="64" rx="20"/><circle class="n-glyph" cx="17" cy="15" r="5.3"/><text class="n-num" x="27" y="19">1.2.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">O conserto resolve?</text><text class="n-val" x="88" y="55" text-anchor="middle">VE R$ 1.700</text></g><g class="node t-outcome" data-id="nmvxuhhms9" transform="translate(851.4 84)"><title>Resultado: Continua usando</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.1.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Continua usando</text><text class="n-val" x="88" y="55" text-anchor="middle">= R$ 800</text></g><g class="node t-outcome" data-id="nmvxuhhuna" transform="translate(851.4 168)"><title>Resultado: Compra um novo</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.1.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Compra um novo</text><text class="n-val" x="88" y="55" text-anchor="middle">= R$ 3.800</text></g><g class="node t-outcome" data-id="nmvxuhi3hb" transform="translate(520.3 252)"><title>Resultado: Notebook novo</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Notebook novo</text><text class="n-val" x="88" y="55" text-anchor="middle">= R$ 3.000</text></g></svg><text x="40" y="343" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2B1B3D">1. Incerteza: 0,7 × 800 + 0,3 × 3.800 = 1.700</text><text x="40" y="369" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2B1B3D">2. Decisão, minimizando: menor entre 1.700 e 3.000 = 1.700</text><text x="40" y="395" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D">3. Regra: fora da garantia, segue o ramo Não = 1.700</text></svg>