<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Os sete Problemas do Milênio</title>
<desc id="d">Sete cartões com os Problemas do Milênio do Clay Mathematics Institute, de 2000, cada um com prêmio de 1 milhão de dólares. Em aberto: hipótese de Riemann, sobre a distribuição dos números primos; P versus NP, se verificar uma resposta é tão fácil quanto encontrá-la; Navier–Stokes, sobre as equações dos fluidos; Yang–Mills e a lacuna de massa, base matemática da física de partículas; conjectura de Hodge; e Birch e Swinnerton-Dyer, sobre curvas elípticas. Resolvida: conjectura de Poincaré, por Perelman em 2003, que recusou o prêmio em 2010.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
