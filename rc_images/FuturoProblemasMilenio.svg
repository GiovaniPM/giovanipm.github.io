<text x="176" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Hipótese de Riemann</text>
<text x="176" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Como os números primos</text>
<text x="176" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">se distribuem</text>
<rect x="133.6" y="224" width="84.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="176" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Em aberto</text>
<rect x="292" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="392" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">P versus NP</text>
<text x="392" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Verificar uma resposta é</text>
<text x="392" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">tão fácil quanto achá-la?</text>
<rect x="349.6" y="224" width="84.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="392" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Em aberto</text>
<rect x="508" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="608" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Navier–Stokes</text>
<text x="608" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">As equações dos fluidos</text>
<text x="608" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">sempre têm solução suave?</text>
<rect x="565.6" y="224" width="84.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="608" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Em aberto</text>
<rect x="724" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="824" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Yang–Mills e a</text>
<text x="824" y="149" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">lacuna de massa</text>
<text x="824" y="176" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">A base matemática da</text>
<text x="824" y="193" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">física de partículas</text>
<rect x="781.6" y="224" width="84.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="824" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Em aberto</text>
<rect x="184" y="276" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="284" y="306" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Conjectura de Hodge</text>
<text x="284" y="333" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Formas geométricas</text>
<text x="284" y="350" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">descritas por álgebra</text>
<rect x="241.6" y="400" width="84.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="284" y="416" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Em aberto</text>
<rect x="400" y="276" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="500" y="306" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Birch e</text>
<text x="500" y="325" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Swinnerton-Dyer</text>
<text x="500" y="352" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Soluções racionais das</text>
<text x="500" y="369" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">curvas elípticas</text>
<rect x="457.6" y="400" width="84.8" height="22" rx="11" fill="#FF6B6B"/>
<text x="500" y="416" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Em aberto</text>
<rect x="616" y="276" width="200" height="158" rx="12" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="716" y="306" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Conjectura de Poincaré</text>
<text x="716" y="333" font-size="12.5" fill="#E6F5F2" text-anchor="middle" font-style="italic">Caracteriza a esfera</text>
<text x="716" y="350" font-size="12.5" fill="#E6F5F2" text-anchor="middle" font-style="italic">em três dimensões</text>
<text x="716" y="373" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Perelman, 2003</text>
<rect x="673.6" y="400" width="84.8" height="22" rx="11" fill="#FFFFFF"/>
<text x="716" y="416" font-size="12" fill="#2A9D8F" text-anchor="middle" font-weight="700">Resolvida</text>
<text x="500" y="478" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">6 de 7 seguem em aberto. Perelman recusou o prêmio em 2010.</text>
</svg>
