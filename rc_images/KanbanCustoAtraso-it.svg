<text x="750.0" y="112.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Priorità per CD3 = CoD ÷ durata</text>
<rect x="550.0" y="150.0" width="400.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="578" cy="185" r="16" fill="#5B2A86"/>
<text x="578.0" y="191.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">B</text>
<text x="606.0" y="176.0" font-size="12.5" fill="#3E3350">CoD 6 mila €/sett. · durata 1 sett.</text>
<rect x="606" y="188" width="264.0" height="18" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="1"/>
<text x="876.0" y="202.0" font-size="12.5" fill="#2B1B3D" font-weight="700">CD3 = 6,0</text>
