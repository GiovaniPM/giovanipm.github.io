<text x="206.7" y="418.0" font-size="11" fill="#756986" text-anchor="middle">4</text>
<text x="275.0" y="418.0" font-size="11" fill="#756986" text-anchor="middle">6</text>
<text x="343.3" y="418.0" font-size="11" fill="#756986" text-anchor="middle">8</text>
<text x="411.7" y="418.0" font-size="11" fill="#756986" text-anchor="middle">10</text>
<text x="480.0" y="418.0" font-size="11" fill="#756986" text-anchor="middle">12</text>
<text x="480.0" y="436.0" font-size="11.5" fill="#756986" text-anchor="end">settimane</text>
<text x="78.0" y="138.0" font-size="11.5" fill="#3E3350" font-weight="700">migliaia di €</text>
<line x1="88" y1="160" x2="116" y2="160" stroke="#2A9D8F" stroke-width="3"/>
