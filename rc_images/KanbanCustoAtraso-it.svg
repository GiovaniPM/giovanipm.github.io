<circle cx="578" cy="271" r="16" fill="#5B2A86"/>
<text x="578.0" y="277.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text>
<text x="606.0" y="262.0" font-size="12.5" fill="#3E3350">CoD 10 mila €/sett. · durata 4 sett.</text>
<rect x="606" y="274" width="110.0" height="18" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="1"/>
<text x="722.0" y="288.0" font-size="12.5" fill="#2B1B3D" font-weight="700">CD3 = 2,5</text>
<text x="940.0" y="262.0" font-size="13" fill="#C2185B" text-anchor="end" font-weight="700">2º</text>
<rect x="550.0" y="322.0" width="400.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="578" cy="357" r="16" fill="#5B2A86"/>
<text x="578.0" y="363.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">C</text>
<text x="606.0" y="348.0" font-size="12.5" fill="#3E3350">CoD 20 mila €/sett. · durata 10 sett.</text>
<rect x="606" y="360" width="88.0" height="18" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="1"/>
<text x="700.0" y="374.0" font-size="12.5" fill="#2B1B3D" font-weight="700">CD3 = 2,0</text>
<text x="940.0" y="348.0" font-size="13" fill="#C2185B" text-anchor="end" font-weight="700">3º</text>
<text x="750.0" y="420.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">Fai prima ciò che porta più valore per settimana di lavoro.</text>
<text x="500.0" y="465.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Costo del ritardo (CoD) = valore non guadagnato per unità di tempo di ritardo.</text>
</svg>
