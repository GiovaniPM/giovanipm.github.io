<text x="88.0" y="214.0" font-size="12.5" fill="#D62828" font-weight="700">valore perso: 40 mila €</text>
<text x="88.0" y="230.0" font-size="11.5" fill="#3E3350">4 settimane × 10 mila €/sett.</text>
<path d="M170 238 C 230 268, 333.8 290, 398.0 289.8" stroke="#D62828" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
