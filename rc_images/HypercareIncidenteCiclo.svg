<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-labelledby="t d">
<title id="t">Ciclo de vida de um incidente no app</title>
<desc id="d">Estados em sequência: Aberto, Em análise, Contornado, Resolvido e Fechado. Ao sair de Aberto, o app grava o início do tratamento; ao chegar a Resolvido, grava a resolução. Uma seta volta de Resolvido para os estados ativos: é a reabertura (Aberto, Em análise ou Contornado), que apaga a hora de resolução e conta uma reabertura. Embaixo, as medidas: tempo de resposta, da detecção ao início do tratamento, comparado ao SLA de resposta; e tempo de resolução, da detecção à resolução, comparado ao SLA de resolução. As médias são o MTTA e o MTTR.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="316" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="20" y="70" width="176" height="56" rx="12" fill="#C2185B"/><text x="108" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Aberto</text><rect x="216" y="70" width="176" height="56" rx="12" fill="#B35300"/><text x="304" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Em análise</text><rect x="412" y="70" width="176" height="56" rx="12" fill="#3A86FF"/><text x="500" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Contornado</text><rect x="608" y="70" width="176" height="56" rx="12" fill="#0E8074"/><text x="696" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Resolvido</text><rect x="804" y="70" width="176" height="56" rx="12" fill="#5B2A86"/><text x="892" y="104" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Fechado</text><line x1="197" y1="98" x2="214" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="393" y1="98" x2="410" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="589" y1="98" x2="606" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="785" y1="98" x2="802" y2="98" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><path d="M206 66 V44 H306 V66" fill="none" stroke="#2B1B3D" stroke-width="1.5"/><text x="256" y="36" font-size="13" font-weight="bold" text-anchor="middle" fill="#B35300">⏱ grava o início do tratamento</text><path d="M598 66 V44 H696 V66" fill="none" stroke="#2B1B3D" stroke-width="1.5"/><text x="647" y="36" font-size="13" font-weight="bold" text-anchor="middle" fill="#0E8074">⏱ grava a resolução</text><path d="M696 128 V168 H304 V130" fill="none" stroke="#C2185B" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="500" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#C2185B">reabertura: voltar a um estado ativo apaga a resolução e conta +1</text><rect x="20" y="210" width="960" height="84" rx="12" fill="#FFF1C9"/><text x="500" y="244" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Resposta = início do tratamento − detecção → SLA de resposta · média = MTTA</text><text x="500" y="274" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Resolução = resolução − detecção → SLA de resolução · média = MTTR</text>
</g></svg>
