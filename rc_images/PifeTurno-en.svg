<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 252" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><title id="t">Your turn</title><desc id="d">Five steps: look at the top discard, draw from the stock or the discards, see whether a meld formed, go out if every card fits and, if not, discard a card and pass the turn.</desc><rect width="1000" height="252" rx="18" fill="#FFF7EC"/><text x="500" y="42" font-size="25" fill="#2B1B3D" font-weight="700" text-anchor="middle">Your turn</text><rect x="23" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="108" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="108" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Look at the top</text><text x="108" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">discard</text><path d="M196 136H214" stroke="#5E5170" stroke-width="2.4"/><path d="M216 136l-9 -5v10z" fill="#5E5170"/><rect x="219" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="304" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="304" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="304" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Draw: stock or</text><text x="304" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">discards</text><path d="M392 136H410" stroke="#5E5170" stroke-width="2.4"/><path d="M412 136l-9 -5v10z" fill="#5E5170"/><rect x="415" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="500" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="500" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="500" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">See if a meld</text><text x="500" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">formed</text><path d="M588 136H606" stroke="#5E5170" stroke-width="2.4"/><path d="M608 136l-9 -5v10z" fill="#5E5170"/><rect x="611" y="72" width="170" height="128" rx="12" fill="#FFF1C9" stroke="#E5A93C" stroke-width="2"/><circle cx="696" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="696" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="696" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Everything fits? Go</text><text x="696" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">out!</text><path d="M784 136H802" stroke="#5E5170" stroke-width="2.4"/><path d="M804 136l-9 -5v10z" fill="#5E5170"/><rect x="807" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="892" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="892" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="892" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">If not, discard one</text><text x="892" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">and pass</text><text x="500" y="232" font-size="14.5" fill="#5E5170" text-anchor="middle">You start the turn with 9 cards, hold 10 after drawing and end with 9.</text></svg>
