<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cómo funciona la teletransportación cuántica</title>
<desc id="d">Esquema del protocolo de teletransportación cuántica. Una fuente envía un par de partículas entrelazadas, una a Alice y otra a Bob. Alice tiene una partícula en el estado psi que quiere enviar y hace una medición conjunta con su mitad del par. Envía 2 bits por un canal clásico, como máximo a la velocidad de la luz. Bob usa esos bits para aplicar una corrección a su mitad y obtiene el estado psi. Notas: el original de Alice se destruye, así que no hay copia; sin los 2 bits Bob solo ve ruido, por eso el entrelazamiento no envía mensajes.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cómo funciona la teletransportación cuántica</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Viaja el estado, no la partícula. Y nada va más rápido que la luz</text>
<rect x="360" y="96" width="280" height="50" rx="12" fill="#5B2A86"/>
<text x="500" y="127" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Fuente de pares entrelazados</text>
<path d="M420 146 Q305.0 154.0 250 222" fill="none" stroke="#5B2A86" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ap)"/>
<path d="M580 146 Q780 154 750 222" fill="none" stroke="#5B2A86" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ap)"/>
<rect x="80" y="226" width="300" height="160" rx="14" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<path d="M80 240 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v26 h-300 z" fill="#FF6B6B"/>
<text x="230" y="253" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Alice</text>
<text x="104" y="296" font-size="14.5" fill="#2B1B3D">① partícula en el estado ψ</text>
<text x="104" y="326" font-size="14.5" fill="#2B1B3D">② mitad del par</text>
<text x="104" y="356" font-size="14.5" fill="#2B1B3D">③ medición conjunta</text>
<rect x="620" y="226" width="300" height="160" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M620 240 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v26 h-300 z" fill="#2A9D8F"/>
<text x="770" y="253" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Bob</text>
<text x="644" y="296" font-size="14.5" fill="#2B1B3D">mitad del par</text>
<text x="644" y="326" font-size="14.5" fill="#2B1B3D">⑤ aplica la corrección</text>
<text x="644" y="356" font-size="14.5" fill="#2B1B3D">→ obtiene el estado ψ</text>
<line x1="380" y1="410" x2="614" y2="410" stroke="#2B1B3D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<path d="M230 386 V410 H380" fill="none" stroke="#2B1B3D" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M614 410 H770 V390" fill="none" stroke="#2B1B3D" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<text x="500" y="436" font-size="13.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">④ 2 bits por un canal clásico · como máximo a la velocidad de la luz</text>
<rect x="80" y="462" width="400" height="66" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2" stroke-dasharray="6 4"/>
<text x="280" y="489" font-size="13.5" fill="#2B1B3D" text-anchor="middle">El original de Alice se destruye:</text>
<text x="280" y="509" font-size="13.5" fill="#2B1B3D" text-anchor="middle">no existe copia (no clonación)</text>
<rect x="520" y="462" width="400" height="66" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2" stroke-dasharray="6 4"/>
<text x="720" y="489" font-size="13.5" fill="#2B1B3D" text-anchor="middle">Sin los 2 bits, Bob solo ve ruido:</text>
<text x="720" y="509" font-size="13.5" fill="#2B1B3D" text-anchor="middle">el entrelazamiento no envía mensajes</text>
</svg>
