<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il turno di ogni potenza</title><desc id="d">Cinque fasi in sequenza: acquisti, movimento di combattimento, battaglie, movimento libero e mobilitazione, seguite dalla rendita. Poi gioca la potenza successiva, nell’ordine Germania, Unione Sovietica, Giappone, Regno Unito e Stati Uniti; quando finiscono gli Stati Uniti, il giro termina.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#756986"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#2B1B3D">Il turno di ogni potenza</text><rect x="15" y="80" width="150" height="150" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><circle cx="39" cy="104" r="15" fill="#5B2A86"/><text x="39" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text><text x="90" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Acquisti</text><text x="90" y="192" text-anchor="middle" font-size="13" fill="#756986">spendi la</text><text x="90" y="208" text-anchor="middle" font-size="13" fill="#756986">produzione</text><line x1="167" y1="155" x2="177" y2="155" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><rect x="179" y="80" width="150" height="150" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><circle cx="203" cy="104" r="15" fill="#5B2A86"/><text x="203" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text><text x="254" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Movimento di</text><text x="254" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">combattimento</text><text x="254" y="192" text-anchor="middle" font-size="13" fill="#756986">entra in</text><text x="254" y="208" text-anchor="middle" font-size="13" fill="#756986">territorio o mare</text><text x="254" y="224" text-anchor="middle" font-size="13" fill="#756986">nemico</text><line x1="331" y1="155" x2="341" y2="155" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><rect x="343" y="80" width="150" height="150" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><circle cx="367" cy="104" r="15" fill="#5B2A86"/><text x="367" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="418" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Battaglie</text><text x="418" y="192" text-anchor="middle" font-size="13" fill="#756986">dadi finché una</text><text x="418" y="208" text-anchor="middle" font-size="13" fill="#756986">parte resta</text><line x1="495" y1="155" x2="505" y2="155" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><rect x="507" y="80" width="150" height="150" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><circle cx="531" cy="104" r="15" fill="#5B2A86"/><text x="531" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text><text x="582" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Movimento</text><text x="582" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">libero</text><text x="582" y="192" text-anchor="middle" font-size="13" fill="#756986">rinforza i luoghi</text><text x="582" y="208" text-anchor="middle" font-size="13" fill="#756986">amici</text><line x1="659" y1="155" x2="669" y2="155" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><rect x="671" y="80" width="150" height="150" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/><circle cx="695" cy="104" r="15" fill="#5B2A86"/><text x="695" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text><text x="746" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Mobilitazione</text><text x="746" y="192" text-anchor="middle" font-size="13" fill="#756986">nuove unità nelle</text><text x="746" y="208" text-anchor="middle" font-size="13" fill="#756986">fabbriche</text><line x1="823" y1="155" x2="833" y2="155" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><rect x="835" y="80" width="150" height="150" rx="14" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><circle cx="859" cy="104" r="15" fill="#B35300"/><text x="859" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">+</text><text x="910" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Rendita</text><text x="910" y="192" text-anchor="middle" font-size="13" fill="#756986">produzione dei</text><text x="910" y="208" text-anchor="middle" font-size="13" fill="#756986">territori</text><text x="500" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#2B1B3D">Ordine delle potenze nel giro</text><circle cx="164" cy="350" r="30" fill="#5d6870" stroke="#2B1B3D" stroke-width="1.5"/><text x="164" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="164" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#2B1B3D">Germania</text><text x="164" y="446" text-anchor="middle" font-size="13" fill="#4b555c">Asse</text><line x1="200" y1="350" x2="296" y2="350" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><circle cx="332" cy="350" r="30" fill="#a3342b" stroke="#2B1B3D" stroke-width="1.5"/><text x="332" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="332" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#2B1B3D">Unione</text><text x="332" y="422" text-anchor="middle" font-size="15" font-weight="700" fill="#2B1B3D">Sovietica</text><text x="332" y="446" text-anchor="middle" font-size="13" fill="#2E6B3A">Alleati</text><line x1="368" y1="350" x2="464" y2="350" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><circle cx="500" cy="350" r="30" fill="#d98a22" stroke="#2B1B3D" stroke-width="1.5"/><text x="500" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="500" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#2B1B3D">Giappone</text><text x="500" y="446" text-anchor="middle" font-size="13" fill="#4b555c">Asse</text><line x1="536" y1="350" x2="632" y2="350" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><circle cx="668" cy="350" r="30" fill="#b89a5c" stroke="#2B1B3D" stroke-width="1.5"/><text x="668" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="668" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#2B1B3D">Regno Unito</text><text x="668" y="446" text-anchor="middle" font-size="13" fill="#2E6B3A">Alleati</text><line x1="704" y1="350" x2="800" y2="350" stroke="#756986" stroke-width="2.5" marker-end="url(#ar)"/><circle cx="836" cy="350" r="30" fill="#56763c" stroke="#2B1B3D" stroke-width="1.5"/><text x="836" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">5</text><text x="836" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#2B1B3D">Stati Uniti</text><text x="836" y="446" text-anchor="middle" font-size="13" fill="#2E6B3A">Alleati</text><path d="M836 456 L836 500 Q836 512 824 512 L176 512 Q164 512 164 500 L164 462" fill="none" stroke="#756986" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="500" y="538" text-anchor="middle" font-size="14" font-style="italic" fill="#756986">fine del giro: città della vittoria</text></svg>