<text x="208" y="234" font-size="11" fill="#756986" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">:3001</text>
<rect x="265" y="145" width="430" height="150" rx="14" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="480" y="170" font-size="14" fill="#0E8074" text-anchor="middle" font-weight="700" xml:space="preserve">Container webtop (KasmVNC + XFCE)</text>
<rect x="290.0" y="199.0" width="190" height="72" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="385" y="231.4" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">TheBrain</text>
<text x="385" y="248.4" font-size="14" fill="#3E3350" text-anchor="middle" xml:space="preserve">desktop</text>
<rect x="505.0" y="199.0" width="170" height="72" rx="12" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="590" y="231.4" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">API locale</text>
