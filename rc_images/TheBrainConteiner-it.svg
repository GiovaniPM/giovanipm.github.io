<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">TheBrain in container: un’architettura possibile</title>
<desc id="d">A sinistra, il browser dell’utente raggiunge in HTTPS, sulla porta 3001, un container webtop con KasmVNC e XFCE. Al suo interno girano TheBrain desktop e la sua API locale. Il container conserva l’app e i cervelli in un volume /config. Un secondo container, l’importatore in Python, legge pecas.csv e scrive tramite l’API locale o l’API cloud, api.bra.in. Facoltativamente, il desktop si sincronizza con TheBrain Cloud. Il tutto può essere un Docker Compose o un Pod di Kubernetes.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">TheBrain in container: un’architettura possibile</text>
<text x="500.0" y="72" font-size="15" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Non esiste un’immagine ufficiale: il desktop gira in un desktop Linux raggiungibile dal browser</text>
<rect x="240" y="105" width="480" height="380" rx="16" fill="none" stroke="#756986" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="258" y="128" font-size="13" fill="#756986" text-anchor="start" font-style="italic" xml:space="preserve">Docker Compose o namespace di Kubernetes</text>
<rect x="35.0" y="185.0" width="140" height="60" rx="12" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/>
<text x="105" y="211.4" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Browser</text>
<text x="105" y="228.4" font-size="12" fill="#3E3350" text-anchor="middle" xml:space="preserve">tu</text>
