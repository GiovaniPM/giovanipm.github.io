<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">El trabajo de TI en el GTD</title>
<desc id="d">Tabla con ocho tipos de trabajo de TI y la lista del GTD a la que va cada uno: alerta de producción, hazla ahora, es un incidente; ticket asignado a ti, próxima acción en el contexto ordenador; pull request para revisar, hazla si lleva menos de dos minutos, si no se convierte en próxima acción; pregunta en el chat del equipo, responde o conviértela en acción; dependencia de otro equipo, lista a la espera con fecha para reclamar; migración en varias etapas, proyecto con la próxima acción definida; idea de refactorización, algún día o quizá, o el backlog; runbook y documentación, referencia.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">El trabajo de TI en el GTD</text>
<text x="250.0" y="96.0" font-size="15" font-weight="700" fill="#756986" text-anchor="middle">Llega como…</text>
<text x="700.0" y="96.0" font-size="15" font-weight="700" fill="#756986" text-anchor="middle">Va a…</text>
<rect x="90.0" y="112.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="139.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Alerta de producción</text>
<path d="M418.0 133.0 L467.0 133.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 133.0 L467.0 139.0 L467.0 127.0 Z" fill="#756986"/>
<rect x="486.0" y="112.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2"/>
<text x="701.0" y="139.0" font-size="14.5" font-weight="700" fill="#2A9D8F" text-anchor="middle">Hazla ahora: es un incidente</text>
<rect x="90.0" y="166.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="193.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Ticket asignado a ti</text>
<path d="M418.0 187.0 L467.0 187.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 187.0 L467.0 193.0 L467.0 181.0 Z" fill="#756986"/>
<rect x="486.0" y="166.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#0E8074" stroke-width="2"/>
<text x="701.0" y="193.0" font-size="14.5" font-weight="700" fill="#0E8074" text-anchor="middle">Próxima acción @ordenador</text>
<rect x="90.0" y="220.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="247.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Pull request para revisar</text>
<path d="M418.0 241.0 L467.0 241.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 241.0 L467.0 247.0 L467.0 235.0 Z" fill="#756986"/>
<rect x="486.0" y="220.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#0E8074" stroke-width="2"/>
<text x="701.0" y="247.0" font-size="14.5" font-weight="700" fill="#0E8074" text-anchor="middle">¿Menos de 2 min? Hazla. Si no, próxima acción</text>
<rect x="90.0" y="274.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="301.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Pregunta en el chat del equipo</text>
<path d="M418.0 295.0 L467.0 295.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 295.0 L467.0 301.0 L467.0 289.0 Z" fill="#756986"/>
<rect x="486.0" y="274.0" width="430.0" height="42.0" rx="10" fill="#DDF3EF" stroke="#0E8074" stroke-width="2"/>
<text x="701.0" y="301.0" font-size="14.5" font-weight="700" fill="#0E8074" text-anchor="middle">Responde o conviértela en acción</text>
<rect x="90.0" y="328.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
<text x="250.0" y="355.0" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Depende de otro equipo</text>
<path d="M418.0 349.0 L467.0 349.0" stroke="#756986" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M478.0 349.0 L467.0 355.0 L467.0 343.0 Z" fill="#756986"/>
<rect x="486.0" y="328.0" width="430.0" height="42.0" rx="10" fill="#FDE4EA" stroke="#E04E6B" stroke-width="2"/>
<text x="701.0" y="355.0" font-size="14.5" font-weight="700" fill="#E04E6B" text-anchor="middle">A la espera, con fecha para reclamar</text>
<rect x="90.0" y="382.0" width="320.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#3E3350" stroke-width="2"/>
