<text x="725.0" y="112.0" font-size="14" fill="#756986" text-anchor="middle" font-weight="700">4. Outputs</text>
<text x="907.5" y="112.0" font-size="14" fill="#756986" text-anchor="middle" font-weight="700">5. Action</text>
