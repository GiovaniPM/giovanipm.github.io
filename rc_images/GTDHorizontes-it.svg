<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Gli orizzonti di attenzione</title>
<desc id="d">Sei orizzonti di attenzione del GTD, dal più ampio al più concreto: orizzonte 5, scopo e principi, perché fai quello che fai; orizzonte 4, visione da 3 a 5 anni; orizzonte 3, obiettivi da 1 a 2 anni; orizzonte 2, aree di attenzione e responsabilità, come salute, squadra e finanze; orizzonte 1, progetti, risultati con più di un’azione entro un anno; e il suolo, le azioni e l’agenda.</desc>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Gli orizzonti di attenzione</text>
<path d="M60.0 520.0 L60.0 107.0" stroke="#756986" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M60.0 96.0 L66.0 107.0 L54.0 107.0 Z" fill="#756986"/>
<text x="40" y="310" font-size="13" font-weight="700" fill="#756986" text-anchor="middle" transform="rotate(-90 40 310)">visione più ampia · più concreto</text>
<rect x="90" y="90" width="870" height="60" rx="12" fill="#5B2A86"/>
<text x="112.0" y="126.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Orizzonte 5 · Scopo e principi</text>
<text x="938.0" y="126.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">perché fai quello che fai</text>
<rect x="90" y="162" width="870" height="60" rx="12" fill="#7B3FB0"/>
<text x="112.0" y="198.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Orizzonte 4 · Visione (da 3 a 5 anni)</text>
<text x="938.0" y="198.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">come sarebbe il successo a lungo termine</text>
<rect x="90" y="234" width="870" height="60" rx="12" fill="#C2185B"/>
<text x="112.0" y="270.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Orizzonte 3 · Obiettivi (da 1 a 2 anni)</text>
<text x="938.0" y="270.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">cosa va raggiunto a breve</text>
<rect x="90" y="306" width="870" height="60" rx="12" fill="#B35300"/>
<text x="112.0" y="342.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Orizzonte 2 · Aree di attenzione e responsabilità</text>
<text x="938.0" y="342.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">ruoli da mantenere: salute, squadra, finanze</text>
<rect x="90" y="378" width="870" height="60" rx="12" fill="#2F6FE0"/>
<text x="112.0" y="414.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Orizzonte 1 · Progetti</text>
<text x="938.0" y="414.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">risultati con più di un’azione, entro un anno</text>
<rect x="90" y="450" width="870" height="60" rx="12" fill="#0E8074"/>
<text x="112.0" y="486.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Suolo · Azioni e agenda</text>
<text x="938.0" y="486.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">la prossima azione fisica e gli impegni</text>
</svg>
