<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">UML class diagram</title>
<desc id="d">Class diagram. Person, with name, email and the contact method, is the superclass of Student, with studentId and enroll, and of Professor, with staffId and teach, linked by a generalization arrow. Student is associated with Course through enrolls in, many to many. Professor teaches Course, one to many. Course has code, title and the openClass method.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">UML class diagram</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Classes with attributes and methods, inheritance (generalization) and associations with multiplicity</text>
<path d="M215 262 V236 H785 V262" stroke="#2B1B3D" stroke-width="2" fill="none"/>
<line x1="500" y1="236" x2="500" y2="200" stroke="#2B1B3D" stroke-width="2" marker-end="url(#tri)"/>
<text x="522.0" y="228.0" font-size="12" fill="#756986" font-style="italic">generalization</text>
<path d="M215 346 V440 H396" stroke="#2B1B3D" stroke-width="2" fill="none"/>
<text x="300.0" y="432.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">enrolls in</text>
<text x="226.0" y="364.0" font-size="16" fill="#C2185B" font-weight="700">*</text>
<text x="382.0" y="434.0" font-size="16" fill="#C2185B" text-anchor="end" font-weight="700">*</text>
<path d="M785 346 V440 H604" stroke="#2B1B3D" stroke-width="2" fill="none"/>
<text x="700.0" y="432.0" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">teaches</text>
<text x="796.0" y="364.0" font-size="15" fill="#C2185B" font-weight="700">1</text>
<text x="618.0" y="434.0" font-size="16" fill="#C2185B" font-weight="700">*</text>
<rect x="400.0" y="96.0" width="200.0" height="102.0" rx="4" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="400" y="96" width="200" height="30" rx="4" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/><text x="500.0" y="116.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Person</text><text x="412.0" y="144.0" font-size="12.5" fill="#3E3350">- name: string</text><text x="412.0" y="162.0" font-size="12.5" fill="#3E3350">- email: string</text><line x1="400" y1="170" x2="600" y2="170" stroke="#5B2A86" stroke-width="1.5"/><text x="412.0" y="188.0" font-size="12.5" fill="#2B1B3D">+ contact()</text>
<rect x="110.0" y="262.0" width="210.0" height="84.0" rx="4" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="110" y="262" width="210" height="30" rx="4" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/><text x="215.0" y="282.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Student</text><text x="122.0" y="310.0" font-size="12.5" fill="#3E3350">- studentId: int</text><line x1="110" y1="318" x2="320" y2="318" stroke="#5B2A86" stroke-width="1.5"/><text x="122.0" y="336.0" font-size="12.5" fill="#2B1B3D">+ enroll(course)</text>
<rect x="680.0" y="262.0" width="210.0" height="84.0" rx="4" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="680" y="262" width="210" height="30" rx="4" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/><text x="785.0" y="282.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Professor</text><text x="692.0" y="310.0" font-size="12.5" fill="#3E3350">- staffId: int</text><line x1="680" y1="318" x2="890" y2="318" stroke="#5B2A86" stroke-width="1.5"/><text x="692.0" y="336.0" font-size="12.5" fill="#2B1B3D">+ teach(course)</text>
<rect x="400.0" y="386.0" width="200.0" height="102.0" rx="4" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="400" y="386" width="200" height="30" rx="4" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/><text x="500.0" y="406.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Course</text><text x="412.0" y="434.0" font-size="12.5" fill="#3E3350">- code: string</text><text x="412.0" y="452.0" font-size="12.5" fill="#3E3350">- title: string</text><line x1="400" y1="460" x2="600" y2="460" stroke="#5B2A86" stroke-width="1.5"/><text x="412.0" y="478.0" font-size="12.5" fill="#2B1B3D">+ openClass()</text>
<text x="500.0" y="520.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Student and Professor inherit name, email and contact() from Person; “*” means many, “1” means exactly one.</text>
</svg>
