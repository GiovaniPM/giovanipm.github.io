<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Qué mide el examen × qué premia el mercado</title>
<desc id="d">Dos paneles. A la izquierda, lo que el examen de certificación mide y la IA ya entrega sola: sintaxis de comandos, configuración paso a paso, respuestas a simulacros, contenido del manual de memoria y opción múltiple estandarizada. Una flecha indica que el valor migra hacia la derecha, donde está lo que el mercado premia: formulación de problemas, criterio técnico, pensamiento sistémico, conocimiento del negocio y prueba de ejecución. Abajo, dos barras comparan la prima salarial promedio en el 1.er trimestre de 2026: 9,3% para las habilidades no certificadas y 6,5% para las certificaciones.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="590" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Qué mide el examen × qué premia el mercado</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">El conocimiento que la certificación acredita es justo lo que la IA hace mejor</text>

<rect x="50" y="100" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<path d="M50 114 a14 14 0 0 1 14 -14 h362 a14 14 0 0 1 14 14 v46 h-390 z" fill="#E23B3B"/>
<text x="245" y="128" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Qué mide el examen</text>
<text x="245" y="149" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">la IA ya lo entrega sola</text>
<g font-size="16" fill="#2B1B3D">
<circle cx="80" cy="190" r="6" fill="#E23B3B"/><text x="98" y="195">Sintaxis de comandos</text>
<circle cx="80" cy="240" r="6" fill="#E23B3B"/><text x="98" y="245">Configuración paso a paso</text>
<circle cx="80" cy="290" r="6" fill="#E23B3B"/><text x="98" y="295">Respuestas a simulacros</text>
<circle cx="80" cy="340" r="6" fill="#E23B3B"/><text x="98" y="345">Contenido del manual de memoria</text>
<circle cx="80" cy="390" r="6" fill="#E23B3B"/><text x="98" y="395">Opción múltiple estandarizada</text>
</g>

<line x1="452" y1="265" x2="546" y2="265" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<text x="500" y="250" font-size="13" fill="#5B2A86" text-anchor="middle" font-style="italic">el valor</text>
<text x="500" y="290" font-size="13" fill="#5B2A86" text-anchor="middle" font-style="italic">migra</text>

<rect x="560" y="100" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M560 114 a14 14 0 0 1 14 -14 h362 a14 14 0 0 1 14 14 v46 h-390 z" fill="#2A9D8F"/>
<text x="755" y="128" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Qué premia el mercado</text>
<text x="755" y="149" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">distingue a un profesional de otro</text>
<g font-size="16" fill="#2B1B3D">
<circle cx="590" cy="190" r="6" fill="#2A9D8F"/><text x="608" y="195">Formulación de problemas</text>
<circle cx="590" cy="240" r="6" fill="#2A9D8F"/><text x="608" y="245">Criterio técnico</text>
<circle cx="590" cy="290" r="6" fill="#2A9D8F"/><text x="608" y="295">Pensamiento sistémico</text>
<circle cx="590" cy="340" r="6" fill="#2A9D8F"/><text x="608" y="345">Conocimiento del negocio</text>
<circle cx="590" cy="390" r="6" fill="#2A9D8F"/><text x="608" y="395">Prueba de ejecución</text>
</g>

<text x="50" y="470" font-size="15" fill="#2B1B3D" font-weight="700">Prima salarial promedio sobre el salario base · 1.er trimestre de 2026</text>
<text x="50" y="501" font-size="14" fill="#2B1B3D">Habilidades no certificadas</text>
<rect x="290" y="485" width="465" height="22" rx="5" fill="#2A9D8F"/>
<text x="765" y="501" font-size="15" fill="#2A9D8F" font-weight="700">9,3%</text>
<text x="50" y="533" font-size="14" fill="#2B1B3D">Certificaciones</text>
<rect x="290" y="517" width="325" height="22" rx="5" fill="#E23B3B"/>
<text x="625" y="533" font-size="15" fill="#E23B3B" font-weight="700">6,5%</text>
<text x="50" y="568" font-size="12" fill="#756986" font-style="italic">Fuente: Foote Partners, IT Skills and Certifications Pay Index, 2026</text>
</svg>
