<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Clarify and organize: the decision flow</title>
<desc id="d">GTD flowchart. Every inbox item goes through the question: what is it, and is it actionable? If not, it goes to the trash, to the someday or maybe list, or to reference. If it is, ask what the desired outcome is: if it needs more than one action, it becomes a project, with a plan, a weekly review and always a next action. Then, what is the next action? If it takes less than two minutes, do it now. If not, delegate it, and the item goes to the waiting-for list; defer it with a date, and it goes to the calendar; or defer it without a date, and it goes to the next-actions lists, organized by context.</desc>
