<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-labelledby="t d">
<title id="t">Fluxo de status de uma atividade</title>
<desc id="d">Uma atividade avança por Analysis, Sizing, WIP, SIT, UAT, Deploy e Finished. Stand-by e Blocked podem acontecer em qualquer etapa: a atividade fica parada e volta ao fluxo de onde saiu.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#756986"/></marker></defs>
<rect width="1000" height="310" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="30" y="50" width="118" height="56" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="89.0" y="84" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Analysis</text>
<text x="89.0" y="132" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">análise</text>
<line x1="150" y1="78" x2="166" y2="78" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="168" y="50" width="118" height="56" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="227.0" y="84" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Sizing</text>
<text x="227.0" y="132" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">dimensiona-</text>
<text x="227.0" y="149" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">mento</text>
<line x1="288" y1="78" x2="304" y2="78" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="306" y="50" width="118" height="56" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2"/>
<text x="365.0" y="84" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">WIP</text>
<text x="365.0" y="132" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">em desenvol-</text>
<text x="365.0" y="149" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">vimento</text>
<line x1="426" y1="78" x2="442" y2="78" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="444" y="50" width="118" height="56" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<text x="503.0" y="84" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">SIT</text>
<text x="503.0" y="132" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">teste</text>
<text x="503.0" y="149" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">integrado</text>
<line x1="564" y1="78" x2="580" y2="78" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="582" y="50" width="118" height="56" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<text x="641.0" y="84" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">UAT</text>
<text x="641.0" y="132" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">aceite do</text>
<text x="641.0" y="149" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">usuário</text>
<line x1="702" y1="78" x2="718" y2="78" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="720" y="50" width="118" height="56" rx="12" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<text x="779.0" y="84" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Deploy</text>
<text x="779.0" y="132" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">implantação</text>
<line x1="840" y1="78" x2="856" y2="78" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="858" y="50" width="118" height="56" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="917.0" y="84" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Finished</text>
<text x="917.0" y="132" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">concluída</text>
<text x="500" y="190" font-size="15" font-weight="bold" fill="#756986" text-anchor="middle">Em qualquer etapa</text>
<rect x="270" y="210" width="210" height="74" rx="12" fill="#FFF1C9" stroke="#B87500" stroke-width="2" stroke-dasharray="6 5"/>
<text x="375" y="240" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Stand-by</text>
<text x="375" y="264" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">pausada, aguardando algo</text>
<rect x="520" y="210" width="210" height="74" rx="12" fill="#FFE9E7" stroke="#C4352B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="625" y="240" font-size="17" font-weight="bold" fill="#2B1B3D" text-anchor="middle">Blocked</text>
<text x="625" y="264" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">impedida por um problema</text>
<path d="M100 160 H900" stroke="#756986" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/>
<line x1="375" y1="162" x2="375" y2="206" stroke="#756986" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 5"/>
<line x1="625" y1="162" x2="625" y2="206" stroke="#756986" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 5"/>
</g>
</svg>
