<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">BDD = Especificación mediante ejemplos + TDD</title>
<desc id="d">Dos recuadros arriba, Especificación mediante ejemplos, con conversaciones sobre ejemplos concretos en el lenguaje del negocio, y TDD, con la prueba escrita antes del código en ciclos cortos, unidos por un signo más. Las flechas llevan a un recuadro abajo, BDD, donde los ejemplos se convierten en especificaciones ejecutables que sirven como pruebas de aceptación y como documentación viva.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">BDD = Especificación mediante ejemplos + TDD</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Las dos prácticas que, juntas, forman el desarrollo guiado por el comportamiento</text>
<rect x="60" y="110" width="380" height="150" rx="12" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<rect x="560" y="110" width="380" height="150" rx="12" fill="#E1ECFF" stroke="#3A86FF" stroke-width="2.5"/>
<text x="250.0" y="148.0" font-size="19" fill="#0E6B61" text-anchor="middle" font-weight="700">Especificación mediante ejemplos</text>
<text x="250.0" y="178.0" font-size="14" fill="#3E3350" text-anchor="middle">conversaciones con ejemplos concretos</text>
<text x="250.0" y="200.0" font-size="14" fill="#3E3350" text-anchor="middle">en el lenguaje del negocio</text>
<text x="250.0" y="222.0" font-size="14" fill="#3E3350" text-anchor="middle">para entender qué construir</text>
<text x="750.0" y="148.0" font-size="19" fill="#1F5FBF" text-anchor="middle" font-weight="700">TDD</text>
<text x="750.0" y="178.0" font-size="14" fill="#3E3350" text-anchor="middle">prueba escrita antes del código</text>
<text x="750.0" y="200.0" font-size="14" fill="#3E3350" text-anchor="middle">ciclos cortos: falla, pasa, refactoriza</text>
<text x="750.0" y="222.0" font-size="14" fill="#3E3350" text-anchor="middle">para construir de la forma correcta</text>
<text x="500.0" y="202.0" font-size="54" fill="#B35300" text-anchor="middle" font-weight="700">+</text>
<path d="M250 262 C 250 300, 330 312, 390 330" stroke="#756986" stroke-width="3" fill="none" marker-end="url(#am)"/>
<path d="M750 262 C 750 300, 670 312, 610 330" stroke="#756986" stroke-width="3" fill="none" marker-end="url(#am)"/>
<rect x="190" y="335" width="620" height="120" rx="14" fill="#5B2A86" stroke="#2B1B3D" stroke-width="3"/>
<text x="500.0" y="375.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">BDD</text>
<text x="500.0" y="405.0" font-size="14" fill="#FCE4F0" text-anchor="middle">los ejemplos se convierten en especificaciones ejecutables:</text>
<text x="500.0" y="427.0" font-size="14" fill="#FCE4F0" text-anchor="middle">pruebas de aceptación y documentación viva a la vez</text>
<text x="500.0" y="492.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Dan North acuñó el término BDD en 2006, reemplazando el vocabulario de las “pruebas” por el del “comportamiento”.</text>
</svg>
