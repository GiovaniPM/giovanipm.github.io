<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">Search and hunt</title>
<desc id="d">Three boards. On the first, half the squares are shaded in a checkerboard, and two 2-square ships, one horizontal and one vertical, each cover a shaded square: searching only the shaded squares is enough to find every ship. On the second, a hit in the centre and arrows to the 4 neighbouring squares; the 4 diagonals are grey, because they are empty when ships may not touch. On the third, two hits side by side, misses above and below, and arrows to both ends of the line.</desc>
