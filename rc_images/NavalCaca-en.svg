<text x="200.0" y="408.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#2B1B3D">1. Search on a checkerboard</text>
<text x="200.0" y="432.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#756986">Every ship has at least 2 squares, so</text>
