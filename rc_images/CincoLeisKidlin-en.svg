<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Kidlin's law: from thought to paper</title>
<desc id="d">Two panels with the same problem. On the left, in your head: loose sentences such as the system is slow, I think it's the database, it only happens sometimes, customers are complaining and someone needs to look at this. An arrow labelled write leads to the right panel, on paper, with the problem structured: what, the orders screen takes 12 seconds to open; when, Monday to Friday, 9 to 11 a.m.; where, only in the southern region stores; since, the release of version 4.2; impact, about 300 delayed orders a day; goal, open in under 2 seconds. Below: half solved, now you can measure, split, prioritize and ask for help.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="500" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Kidlin's law: from thought to paper</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">The same problem, before and after writing it down</text>
<rect x="40" y="100" width="380" height="320" rx="14" fill="#FFFFFF" stroke="#D9C9B4" stroke-width="2.5"/>
<path d="M40 114 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v32 h-380 z" fill="#D9C9B4"/>
<text x="230.0" y="127" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">In your head</text>
<g transform="rotate(-4 70 180)"><text x="70" y="180" font-size="15" fill="#756986" font-style="italic">“The system is slow”</text></g>
<g transform="rotate(3 150 225)"><text x="150" y="225" font-size="15" fill="#756986" font-style="italic">“I think it’s the database”</text></g>
<g transform="rotate(-2 80 275)"><text x="80" y="275" font-size="15" fill="#756986" font-style="italic">“It only happens sometimes”</text></g>
<g transform="rotate(4 130 325)"><text x="130" y="325" font-size="15" fill="#756986" font-style="italic">“Customers are complaining”</text></g>
<g transform="rotate(-3 75 380)"><text x="75" y="380" font-size="15" fill="#756986" font-style="italic">“Someone needs to look at this”</text></g>
<line x1="436" y1="260" x2="514" y2="260" stroke="#3A86FF" stroke-width="4" marker-end="url(#ar)"/>
<text x="475" y="248" font-size="14" fill="#3A86FF" text-anchor="middle" font-weight="700">write</text>
<rect x="530" y="100" width="430" height="320" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<path d="M530 114 a14 14 0 0 1 14 -14 h402 a14 14 0 0 1 14 14 v32 h-430 z" fill="#3A86FF"/>
<text x="745.0" y="127" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">On paper</text>
<text x="552" y="168" font-size="13.5" fill="#3A86FF" font-weight="700">What</text>
<text x="640" y="168" font-size="14" fill="#2B1B3D">The orders screen takes 12 s to open</text>
<line x1="550" y1="184" x2="940" y2="184" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="210" font-size="13.5" fill="#3A86FF" font-weight="700">When</text>
<text x="640" y="210" font-size="14" fill="#2B1B3D">Monday to Friday, 9 to 11 a.m.</text>
<line x1="550" y1="226" x2="940" y2="226" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="252" font-size="13.5" fill="#3A86FF" font-weight="700">Where</text>
<text x="640" y="252" font-size="14" fill="#2B1B3D">Only in the southern region stores</text>
<line x1="550" y1="268" x2="940" y2="268" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="294" font-size="13.5" fill="#3A86FF" font-weight="700">Since</text>
<text x="640" y="294" font-size="14" fill="#2B1B3D">The release of version 4.2</text>
<line x1="550" y1="310" x2="940" y2="310" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="336" font-size="13.5" fill="#3A86FF" font-weight="700">Impact</text>
<text x="640" y="336" font-size="14" fill="#2B1B3D">About 300 delayed orders a day</text>
<line x1="550" y1="352" x2="940" y2="352" stroke="#F1E2CF" stroke-width="1.5"/>
<text x="552" y="378" font-size="13.5" fill="#3A86FF" font-weight="700">Goal</text>
<text x="640" y="378" font-size="14" fill="#2B1B3D">Open in under 2 s</text>
<text x="500.0" y="462" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Half solved: now you can measure, split, prioritize and ask for help</text>
</svg>
