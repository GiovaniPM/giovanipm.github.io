<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Gilbert's law: bystander or owner?</title>
<desc id="d">Comparison in the same situation: the other team's API is late and delivery is on Friday. On the left, the bystander says not my problem, it's the other team; nobody told me; I'll wait for them to fix it. Result: delivery slips and blame spreads. On the right, the owner asks the other team for the real date, builds a mock of the API and moves on, and warns the client and agrees on a plan B. Result: delivery ships, with the risk in the open. Below: being responsible is not doing everything alone, it is making sure the result happens.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="480" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Gilbert's law: bystander or owner?</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Situation: the other team's API is late and delivery is on Friday</text>
<rect x="50" y="100" width="430" height="290" rx="14" fill="#FFFFFF" stroke="#D9C9B4" stroke-width="2.5"/>
<path d="M50 114 a14 14 0 0 1 14 -14 h402 a14 14 0 0 1 14 14 v32 h-430 z" fill="#D9C9B4"/>
<text x="265.0" y="127" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Bystander</text>
<circle cx="80" cy="170" r="12" fill="#756986"/>
<text x="80" y="175" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="102" y="175" font-size="15" fill="#756986" font-style="italic">“Not my problem, it’s the other team”</text>
<circle cx="80" cy="220" r="12" fill="#756986"/>
<text x="80" y="225" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="102" y="225" font-size="15" fill="#756986" font-style="italic">“Nobody told me”</text>
<circle cx="80" cy="270" r="12" fill="#756986"/>
<text x="80" y="275" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="102" y="275" font-size="15" fill="#756986" font-style="italic">“I’ll wait for them to fix it”</text>
<rect x="66" y="325" width="398" height="46" rx="10" fill="#E23B3B" opacity="0.12"/>
<text x="265" y="354" font-size="14.5" fill="#E23B3B" text-anchor="middle" font-weight="700">Result: delivery slips and blame spreads</text>
<rect x="520" y="100" width="430" height="290" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<path d="M520 114 a14 14 0 0 1 14 -14 h402 a14 14 0 0 1 14 14 v32 h-430 z" fill="#5B2A86"/>
<text x="735.0" y="127" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Owner</text>
<circle cx="550" cy="170" r="12" fill="#2A9D8F"/>
<text x="550" y="175" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
<text x="572" y="175" font-size="15" fill="#2B1B3D">Asks the other team for the real date</text>
<circle cx="550" cy="220" r="12" fill="#2A9D8F"/>
<text x="550" y="225" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
<text x="572" y="225" font-size="15" fill="#2B1B3D">Builds a mock of the API and moves on</text>
<circle cx="550" cy="270" r="12" fill="#2A9D8F"/>
<text x="550" y="275" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
<text x="572" y="275" font-size="15" fill="#2B1B3D">Warns the client and agrees on a plan B</text>
<rect x="536" y="325" width="398" height="46" rx="10" fill="#2A9D8F" opacity="0.12"/>
<text x="735" y="354" font-size="14.5" fill="#1E7268" text-anchor="middle" font-weight="700">Result: delivery ships, with the risk in the open</text>
<text x="500.0" y="440" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Being responsible is not doing everything alone: it is making sure the result happens</text>
</svg>
