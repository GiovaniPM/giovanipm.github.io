<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-labelledby="t d">
<title id="t">Estructura de los datos de la app Actividades entre PO</title>
<desc id="d">Un archivo JSON guarda la lista de equipos y la lista de actividades. Cada actividad tiene request, RITM, descripción, estado, priorización, tipo, sistema de origen, business owner y las fechas de creación y de actualización. Dentro de ella, cada equipo involucrado tiene task, fechas de inicio, SIT, UAT y deploy y la última notificación.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#756986"/></marker></defs>
<rect width="1000" height="390" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="30" y="40" width="250" height="300" rx="12" fill="#F6EEFF" stroke="#5B2A86" stroke-width="2"/>
<text x="155" y="80" font-size="20" font-weight="bold" fill="#5B2A86" text-anchor="middle">Archivo JSON</text>
<text x="155" y="104" font-size="14" font-weight="normal" fill="#756986" text-anchor="middle">en tu computadora</text>
<rect x="55" y="140" width="200" height="60" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="155" y="176" font-size="14" font-weight="normal" fill="#2B1B3D" text-anchor="middle">times: lista de equipos</text>
<rect x="55" y="230" width="200" height="60" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="155" y="266" font-size="14" font-weight="normal" fill="#2B1B3D" text-anchor="middle">atividades: lista</text>
<line x1="255" y1="260" x2="325" y2="200" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="330" y="40" width="300" height="320" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<text x="480" y="76" font-size="20" font-weight="bold" fill="#0E8074" text-anchor="middle">Actividad</text>
<circle cx="358" cy="107" r="5" fill="#0E8074"/>
<text x="374" y="112" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Request y RITM</text>
<circle cx="358" cy="147" r="5" fill="#0E8074"/>
<text x="374" y="152" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Descripción breve</text>
<circle cx="358" cy="187" r="5" fill="#0E8074"/>
<text x="374" y="192" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Estado y Priorización</text>
<circle cx="358" cy="227" r="5" fill="#0E8074"/>
<text x="374" y="232" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Tipo y Sistema de origen</text>
<circle cx="358" cy="267" r="5" fill="#0E8074"/>
<text x="374" y="272" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Business Owner</text>
<circle cx="358" cy="307" r="5" fill="#0E8074"/>
<text x="374" y="312" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Creada el · Actualizada el</text>
<line x1="630" y1="200" x2="685" y2="200" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="690" y="90" width="280" height="220" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="830" y="126" font-size="18" font-weight="bold" fill="#B35300" text-anchor="middle">Cada equipo involucrado</text>
<circle cx="716" cy="167" r="5" fill="#B35300"/>
<text x="732" y="172" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Task</text>
<circle cx="716" cy="211" r="5" fill="#B35300"/>
<text x="732" y="216" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Inicio · SIT · UAT · Deploy</text>
<circle cx="716" cy="255" r="5" fill="#B35300"/>
<text x="732" y="260" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Última notificación</text>
<text x="830" y="340" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">Un equipo solo entra en la actividad</text>
<text x="830" y="358" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">cuando se llena alguno de sus campos.</text>
</g>
</svg>
