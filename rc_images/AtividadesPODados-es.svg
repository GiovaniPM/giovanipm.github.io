<circle cx="724" cy="290" r="5" fill="#B35300"/>
<text x="740" y="295" font-size="15" font-weight="normal" fill="#2B1B3D" text-anchor="start">Última notificación</text>
<text x="837" y="378" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">Un equipo solo entra en la actividad</text>
<text x="837" y="396" font-size="13" font-weight="normal" fill="#756986" text-anchor="middle">cuando se llena alguno de sus campos.</text>
