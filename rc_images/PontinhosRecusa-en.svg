<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
<title id="t">The double-cross: take all but two</title>
<desc id="d">Three drawings of the same chain of 4 boxes. In the first, the opponent has just opened the chain at the left end. In the second, Ana takes all four boxes, but then has to draw another line and open the next chain. In the third, Ana takes two boxes and draws the right-end line: the last two boxes have three sides and one middle line closes both at once; the opponent, Bruno, takes those two and has to open the next chain.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="330" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">The double-cross: take all but two</text>
<g transform="translate(23.9 78) scale(0.98)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="146" y1="26" x2="206" y2="26"/><line class="ln" style="--len:60" x1="206" y1="26" x2="266" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="ln" style="--len:60" x1="146" y1="86" x2="206" y2="86"/><line class="ln" style="--len:60" x1="206" y1="86" x2="266" y2="86"/><line class="ln last" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="gridln" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><line class="gridln" x1="206" y1="26" x2="206" y2="86"/><line class="gridln" x1="266" y1="26" x2="266" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="206" cy="26" r="6"/><circle class="dot" cx="266" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/><circle class="dot" cx="206" cy="86" r="6"/><circle class="dot" cx="266" cy="86" r="6"/></g><text x="167" y="221.76" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">The chain was opened</text><text x="167" y="242.76" text-anchor="middle" font-size="15.5" fill="#756986">The opponent gave away a chain</text><text x="167" y="263.76" text-anchor="middle" font-size="15.5" fill="#756986">of 4 boxes from one end.</text><g transform="translate(356.9 78) scale(0.98)"><rect class="box" x="29" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="56" y="57" font-size="25.2" fill="#0E8074">A</text><rect class="box" x="89" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="116" y="57" font-size="25.2" fill="#0E8074">A</text><rect class="box" x="149" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="176" y="57" font-size="25.2" fill="#0E8074">A</text><rect class="box" x="209" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="236" y="57" font-size="25.2" fill="#0E8074">A</text><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="146" y1="26" x2="206" y2="26"/><line class="ln" style="--len:60" x1="206" y1="26" x2="266" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="ln" style="--len:60" x1="146" y1="86" x2="206" y2="86"/><line class="ln" style="--len:60" x1="206" y1="86" x2="266" y2="86"/><line class="ln" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="ln" style="--len:60" x1="86" y1="26" x2="86" y2="86"/><line class="ln" style="--len:60" x1="146" y1="26" x2="146" y2="86"/><line class="ln" style="--len:60" x1="206" y1="26" x2="206" y2="86"/><line class="ln last" style="--len:60" x1="266" y1="26" x2="266" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="206" cy="26" r="6"/><circle class="dot" cx="266" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/><circle class="dot" cx="206" cy="86" r="6"/><circle class="dot" cx="266" cy="86" r="6"/></g><text x="500" y="221.76" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">Take everything</text><text x="500" y="242.76" text-anchor="middle" font-size="15.5" fill="#756986">Ana gets 4, but plays again</text><text x="500" y="263.76" text-anchor="middle" font-size="15.5" fill="#756986">and has to open the next chain.</text><g transform="translate(689.9 78) scale(0.98)"><rect class="box" x="29" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="56" y="57" font-size="25.2" fill="#0E8074">A</text><rect class="box" x="89" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="116" y="57" font-size="25.2" fill="#0E8074">A</text><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="ln" style="--len:60" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="146" y1="26" x2="206" y2="26"/><line class="ln" style="--len:60" x1="206" y1="26" x2="266" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="ln" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="ln" style="--len:60" x1="146" y1="86" x2="206" y2="86"/><line class="ln" style="--len:60" x1="206" y1="86" x2="266" y2="86"/><line class="ln" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="ln" style="--len:60" x1="86" y1="26" x2="86" y2="86"/><line class="ln" style="--len:60" x1="146" y1="26" x2="146" y2="86"/><line class="gridln" x1="206" y1="26" x2="206" y2="86"/><line class="ln last" style="--len:60" x1="266" y1="26" x2="266" y2="86"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="206" cy="26" r="6"/><circle class="dot" cx="266" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/><circle class="dot" cx="206" cy="86" r="6"/><circle class="dot" cx="266" cy="86" r="6"/></g><line x1="891.8" y1="103.5" x2="891.8" y2="162.3" stroke="#C2185B" stroke-width="5.88" stroke-linecap="round" stroke-dasharray="7.84 7.84"/><text x="833" y="221.76" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">Leave two</text><text x="833" y="242.76" text-anchor="middle" font-size="15.5" fill="#756986">Ana gets 2 and draws the other end.</text><text x="833" y="263.76" text-anchor="middle" font-size="15.5" fill="#756986">Bruno closes both with one line</text><text x="833" y="284.76" text-anchor="middle" font-size="15.5" fill="#756986">and he has to open the next chain.</text></svg>
