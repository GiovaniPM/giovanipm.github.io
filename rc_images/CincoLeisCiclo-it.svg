<path d="M564.5 530.6 A310 200 0 0 1 425.0 529.1" fill="none" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<path d="M231.5 435.0 A310 200 0 0 1 190.8 349.0" fill="none" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<path d="M269.6 201.2 A310 200 0 0 1 383.9 149.6" fill="none" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="500" cy="335" r="86" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="500" y="331" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Un problema,</text>
<text x="500" y="355" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">cinque domande</text>
<rect x="380.0" y="104.0" width="240" height="62" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/>
<path d="M380.0 118.0 a14 14 0 0 1 14 -14 h212 a14 14 0 0 1 14 14 v12 h-240 z" fill="#3A86FF"/>
<text x="500.0" y="123.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">1 · Kidlin</text>
<text x="500.0" y="155.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ho scritto il problema?</text>
<rect x="674.8" y="242.2" width="240" height="62" rx="14" fill="#FFFFFF" stroke="#FFB703" stroke-width="3"/>
<path d="M674.8 256.2 a14 14 0 0 1 14 -14 h212 a14 14 0 0 1 14 14 v12 h-240 z" fill="#FFB703"/>
<text x="794.8" y="261.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">2 · Falkland</text>
<text x="794.8" y="293.2" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Devo decidere adesso?</text>
<rect x="562.2" y="465.8" width="240" height="62" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/>
<path d="M562.2 479.8 a14 14 0 0 1 14 -14 h212 a14 14 0 0 1 14 14 v12 h-240 z" fill="#5B2A86"/>
<text x="682.2" y="484.8" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">3 · Gilbert</text>
<text x="682.2" y="516.8" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Chi garantisce il risultato?</text>
<rect x="197.8" y="465.8" width="240" height="62" rx="14" fill="#FFFFFF" stroke="#E23B3B" stroke-width="3"/>
<path d="M197.8 479.8 a14 14 0 0 1 14 -14 h212 a14 14 0 0 1 14 14 v12 h-240 z" fill="#E23B3B"/>
<text x="317.8" y="484.8" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">4 · Murphy</text>
<text x="317.8" y="516.8" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cosa può andare storto?</text>
<rect x="85.2" y="242.2" width="240" height="62" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/>
