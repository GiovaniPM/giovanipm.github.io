<text x="205.2" y="261.2" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">5 · Wilson</text>
<text x="205.2" y="293.2" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cosa ho imparato?</text>
</svg>
