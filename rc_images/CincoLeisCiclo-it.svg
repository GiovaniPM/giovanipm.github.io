<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Una lista di cinque domande per qualsiasi problema o progetto</text>
<ellipse cx="500" cy="335" rx="310" ry="200" fill="none" stroke="#D9C9B4" stroke-width="3" stroke-dasharray="4 7"/>
