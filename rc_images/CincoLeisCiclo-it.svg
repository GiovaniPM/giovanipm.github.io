<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Le cinque leggi insieme</title>
<desc id="d">Ciclo con le cinque leggi come lista di domande. 1, Kidlin: ho scritto il problema? 2, Falkland: devo decidere adesso? 3, Gilbert: chi garantisce il risultato? 4, Murphy: cosa può andare storto? 5, Wilson: cosa ho imparato? E ciò che si impara alimenta la prossima definizione del problema. Al centro: un problema, cinque domande.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
