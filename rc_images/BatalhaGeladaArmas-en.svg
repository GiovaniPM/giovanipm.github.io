<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" role="img" aria-labelledby="t d"><title id="t">Blast size of each weapon</title><desc id="d">Crater radius, to scale, and damage at the center. Snowball: r 24, damage 34; Big snowball: r 38, damage 48; Ice block: r 58, damage 66; Hail (each stone): r 26, damage 30; Bouncing ball: r 32, damage 44; Icicle (each): r 22, damage 26; Nitrogen bomb: r 115, damage 95.</desc><rect width="1000" height="404" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Blast size of each weapon</text><text x="500" y="66" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#756986" text-anchor="middle">Crater radius, to scale, and damage at the center.</text><circle cx="80" cy="190" r="24" fill="#CFE8FF" stroke="#5FA8DF" stroke-width="2"/><circle cx="80" cy="190" r="4" fill="#2B1B3D"/><text x="80" y="290" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" font-weight="700" text-anchor="middle">Snowball</text><text x="80" y="326" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#756986" text-anchor="middle">r 24 · damage 34</text><circle cx="198" cy="190" r="38" fill="#CFE8FF" stroke="#5FA8DF" stroke-width="2"/><circle cx="198" cy="190" r="4" fill="#2B1B3D"/><text x="198" y="290" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" font-weight="700" text-anchor="middle">Big snowball</text><text x="198" y="326" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#756986" text-anchor="middle">r 38 · damage 48</text><circle cx="316" cy="190" r="58" fill="#CFE8FF" stroke="#5FA8DF" stroke-width="2"/><circle cx="316" cy="190" r="4" fill="#2B1B3