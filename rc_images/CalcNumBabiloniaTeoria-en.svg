<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">From rectangle to square</title>
<desc id="d">Four rectangles, all with area 2, drawn to scale. The first measures 1 by 2. Averaging the sides, the next measures 1.5 by 1.333. Then 1.4167 by 1.4118. The last is practically a square of 1.41421 by 1.41421. Below, the rule: new guess equals guess plus N divided by the guess, all divided by 2.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">From rectangle to square</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">All have area 2. At each step, the sides get closer</text><rect x="75" y="130" width="100" height="200" rx="3" fill="#FFE8E8" stroke="#FF6B6B" stroke-width="3"/><text x="125" y="236" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">area 2</text><text x="125" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">1 × 2</text><text x="125" y="382" font-size="13" fill="#756986" text-anchor="middle">step 0</text><line x1="195" y1="250" x2="300" y2="250" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><text x="247" y="238" font-size="12" fill="#756986" text-anchor="middle">average</text><rect x="300" y="196.667" width="150" height="133.333" rx="3" fill="#FFF1C9" stroke="#FFB703" stroke-width="3"/><text x="375" y="269.333" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">area 2</text><text x="375" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">1.5 × 1.333</text><text x="375" y="382" font-size="13" fill="#756986" text-anchor="middle">step 1</text><line x1="445" y1="250" x2="550" y2="250" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><text x="497" y="238" font-size="12" fill="#756986" text-anchor="middle">average</text><rect x="554.167" y="188.824" width="141.667" height="141.176" rx="3" fill="#E6F0FF" stroke="#3A86FF" stroke-width="3"/><text x="625" y="265.412" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">area 2</text><text x="625" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">1.4167 × 1.4118</text><text x="625" y="382" font-size="13" fill="#756986" text-anchor="middle">step 2</text><line x1="695" y1="250" x2="800" y2="250" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><text x="747" y="238" font-size="12" fill="#756986" text-anchor="middle">average</text><rect x="804.289" y="188.579" width="141.421" height="141.421" rx="3" fill="#E2F6F2" stroke="#2A9D8F" stroke-width="3"/><text x="875" y="265.289" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">area 2</text><text x="875" y="358" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">1.41421 × 1.41421</text><text x="875" y="382" font-size="13" fill="#756986" text-anchor="middle">step 3</text><rect x="120" y="410" width="760" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="500" y="446" font-size="22" fill="#5B2A86" text-anchor="middle" font-weight="700">new guess = (guess + N ÷ guess) ÷ 2</text><text x="500" y="480" font-size="15" fill="#2B1B3D" text-anchor="middle">If the guess is too small, N ÷ guess is too large.</text><text x="500" y="504" font-size="15" fill="#2B1B3D" text-anchor="middle">Their average lands in between, closer to the answer.</text>
</svg>
