<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 558" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Anatomia di un file .feature in Gherkin</title>
<desc id="d">Un file .feature di esempio, in Gherkin con parole chiave in italiano, con note a destra. Riga della lingua; tag @prelievo; Funzionalità con nome e descrizione; Contesto con un passo comune a tutti gli scenari; uno Scenario con Dato, Quando, Allora ed E; e uno Schema dello scenario con segnaposto tra parentesi angolari, riempiti dalla tabella degli Esempi.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="558" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Anatomia di un file .feature in Gherkin</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Parole chiave all’inizio di ogni riga, testo libero in italiano subito dopo</text>
<rect x="30" y="100" width="600" height="432.5" rx="12" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="48" y="126.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#A898C0"># language: it</tspan></text>
<text x="48" y="143.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FF8A8A">@prelievo</tspan></text>
<text x="48" y="161.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">Funzionalità:</tspan><tspan fill="#F7F0FF"> Prelievo al bancomat</tspan></text>
<text x="48" y="178.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F7F0FF">  Per non fare la fila in banca,</tspan></text>
<text x="48" y="196.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F7F0FF">  come cliente, voglio prelevare al bancomat.</tspan></text>
<text x="48" y="213.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="231.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Contesto:</tspan></text>
<text x="48" y="248.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dato</tspan><tspan fill="#F7F0FF"> che la mia carta è valida</tspan></text>
<text x="48" y="266.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="283.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Scenario:</tspan><tspan fill="#F7F0FF"> Saldo sufficiente</tspan></text>
<text x="48" y="301.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dato</tspan><tspan fill="#F7F0FF"> che ho 100 € sul conto</tspan></text>
<text x="48" y="318.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Quando</tspan><tspan fill="#F7F0FF"> chiedo 20 €</tspan></text>
<text x="48" y="336.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Allora</tspan><tspan fill="#F7F0FF"> ricevo 20 €</tspan></text>
<text x="48" y="353.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    E</tspan><tspan fill="#F7F0FF"> la carta viene restituita</tspan></text>
<text x="48" y="371.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"></text>
<text x="48" y="388.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">  Schema dello scenario:</tspan><tspan fill="#F7F0FF"> Limite di prelievo</tspan></text>
<text x="48" y="406.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Dato</tspan><tspan fill="#F7F0FF"> che ho </tspan><tspan fill="#C9A7F5">&lt;saldo&gt;</tspan><tspan fill="#F7F0FF"> € sul conto</tspan></text>
<text x="48" y="423.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Quando</tspan><tspan fill="#F7F0FF"> chiedo </tspan><tspan fill="#C9A7F5">&lt;importo&gt;</tspan><tspan fill="#F7F0FF"> €</tspan></text>
<text x="48" y="441.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5FD3C4" font-weight="700">    Allora</tspan><tspan fill="#F7F0FF"> il prelievo è </tspan><tspan fill="#C9A7F5">&lt;esito&gt;</tspan></text>
<text x="48" y="458.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">    Esempi:</tspan></text>
<text x="48" y="476.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      | saldo | importo | esito     |</tspan></text>
<text x="48" y="493.5" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      |   100 |     150 | rifiutato |</tspan></text>
<text x="48" y="511.0" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FCE4F0">      |   100 |     100 | approvato |</tspan></text>
<path d="M640 114.0 h8 V147.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 130.8 H656 V114.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="118.8" font-size="13" fill="#2B1B3D" font-weight="700">Lingua e tag</text>
<text x="668.0" y="134.8" font-size="12.5" fill="#3E3350"># language definisce le parole chiave;</text>
<text x="668.0" y="150.8" font-size="12.5" fill="#3E3350">@tag raggruppa e filtra cosa eseguire</text>
<path d="M640 149.0 h8 V200.0 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 174.5 H656 V168.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="172.8" font-size="13" fill="#2B1B3D" font-weight="700">Funzionalità</text>
<text x="668.0" y="188.8" font-size="12.5" fill="#3E3350">nome sulla stessa riga e descrizione</text>
<text x="668.0" y="204.8" font-size="12.5" fill="#3E3350">libera nelle righe seguenti</text>
<path d="M640 219.0 h8 V252.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 235.8 H656 V222.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="226.8" font-size="13" fill="#2B1B3D" font-weight="700">Contesto</text>
<text x="668.0" y="242.8" font-size="12.5" fill="#3E3350">passi validi per tutti</text>
<text x="668.0" y="258.8" font-size="12.5" fill="#3E3350">gli scenari del file</text>
<path d="M640 271.5 h8 V357.5 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 314.5 H656 V298.5 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="302.5" font-size="13" fill="#2B1B3D" font-weight="700">Scenario</text>
<text x="668.0" y="318.5" font-size="12.5" fill="#3E3350">Dato: contesto · Quando: azione</text>
<text x="668.0" y="334.5" font-size="12.5" fill="#3E3350">Allora: risultato · E/Ma: altri passi</text>
<path d="M640 376.5 h8 V515.0 h-8" stroke="#B35300" stroke-width="2" fill="none"/>
<path d="M648 445.8 H656 V421.8 H664" stroke="#B35300" stroke-width="2" fill="none"/>
<text x="668.0" y="425.8" font-size="13" fill="#2B1B3D" font-weight="700">Schema dello scenario</text>
<text x="668.0" y="441.8" font-size="12.5" fill="#3E3350">i &lt;segnaposto&gt; prendono i valori</text>
<text x="668.0" y="457.8" font-size="12.5" fill="#3E3350">di ogni riga degli Esempi: ogni</text>
<text x="668.0" y="473.8" font-size="12.5" fill="#3E3350">riga è un nuovo scenario</text>
</svg>
