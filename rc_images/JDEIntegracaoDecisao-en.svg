<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">How to choose the integration method in JD Edwards</title>
<desc id="d">Decision tree. Must it be real time? If yes and JDE receives data: Orchestrator/AIS, or BSSV on old Tools. If yes and JDE sends: RTE or Orchestrator notifications. If not, batch: a standard document with a partner, X12 or EDIFACT, leads to EDI with F47 tables; an own file layout leads to a UBE or Table Conversion; otherwise, Z-files with the standard processor UBE. Read-only SQL on views for BI is acceptable; direct database writes are not.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="650" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">How to choose the integration method</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Latency, flow direction and the nature of the data define the path</text>
<rect x="410" y="92" width="180" height="40" rx="20" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="500.0" y="117.4" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">New integration</text>
<polyline points="500,132 500,150" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polygon points="366.0,152.0 634.0,152.0 650.0,182 634.0,212.0 366.0,212.0 350.0,182" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="500" y="187.4" font-size="15" fill="#2B1B3D" text-anchor="middle">Must it be real time?</text>
<polyline points="350,182 230,182 230,238" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="290" y="173" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">yes</text>
<polygon points="126.0,240.0 334.0,240.0 350.0,270 334.0,300.0 126.0,300.0 110.0,270" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="230" y="265.8" font-size="14" fill="#2B1B3D" text-anchor="middle">Does JDE receive</text>
<text x="230" y="284.3" font-size="14" fill="#2B1B3D" text-anchor="middle">or send data?</text>
<polyline points="170,300 170,318 130,318 130,348" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="120" y="336" font-size="12.5" fill="#756986" text-anchor="end" font-style="italic">receives</text>
<polyline points="290,300 290,318 360,318 360,348" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="370" y="336" font-size="12.5" fill="#756986" text-anchor="start" font-style="italic">sends</text>
<rect x="30" y="350" width="200" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="130.0" y="376.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Orchestrator / AIS</text>
<text x="130.0" y="396.3" font-size="13.5" fill="#3E3350" text-anchor="middle">REST / JSON</text>
<rect x="260" y="350" width="200" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="360.0" y="376.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">RTE or notifications</text>
<text x="360.0" y="396.3" font-size="13.5" fill="#3E3350" text-anchor="middle">from the Orchestrator</text>
<text x="130" y="434" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Old Tools without AIS: BSSV</text>
<text x="130" y="452" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">(or legacy to migrate)</text>
<polyline points="650,182 720,182 720,238" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="690" y="173" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">no, batch</text>
<polygon points="606.0,240.0 834.0,240.0 850.0,270 834.0,300.0 606.0,300.0 590.0,270" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="720" y="265.8" font-size="14" fill="#2B1B3D" text-anchor="middle">Standard document with</text>
<text x="720" y="284.3" font-size="14" fill="#2B1B3D" text-anchor="middle">a partner (X12, EDIFACT)?</text>
<polyline points="850,270 900,270 900,348" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="872" y="261" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">yes</text>
<rect x="820" y="350" width="160" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="900.0" y="376.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">EDI</text>
<text x="900.0" y="396.3" font-size="13.5" fill="#3E3350" text-anchor="middle">F47 tables + R47</text>
<polyline points="690,300 690,348" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="700" y="330" font-size="12.5" fill="#756986" text-anchor="start" font-style="italic">no</text>
<polygon points="576.0,350.0 784.0,350.0 800.0,380 784.0,410.0 576.0,410.0 560.0,380" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="680" y="375.8" font-size="14" fill="#2B1B3D" text-anchor="middle">Own file layout</text>
<text x="680" y="394.3" font-size="14" fill="#2B1B3D" text-anchor="middle">(bank, tax, CSV)?</text>
<polyline points="620,410 620,430 580,430 580,458" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="570" y="448" font-size="12.5" fill="#756986" text-anchor="end" font-style="italic">yes</text>
<polyline points="740,410 740,430 820,430 820,458" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="830" y="448" font-size="12.5" fill="#756986" text-anchor="start" font-style="italic">no</text>
<rect x="480" y="460" width="200" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="580.0" y="486.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE / Table</text>
<text x="580.0" y="506.3" font-size="13.5" fill="#3E3350" text-anchor="middle">Conversion</text>
<rect x="720" y="460" width="220" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="830.0" y="486.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Z-files + standard</text>
<text x="830.0" y="506.3" font-size="13.5" fill="#3E3350" text-anchor="middle">processor UBE</text>
<rect x="40" y="560" width="440" height="66" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="260.0" y="588.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Read-only for BI and reports?</text>
<text x="260.0" y="607.3" font-size="12.5" fill="#3E3350" text-anchor="middle">SQL on views or a replica is acceptable</text>
<rect x="520" y="560" width="440" height="66" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="740.0" y="588.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Direct database writes (INSERT/UPDATE)</text>
<text x="740.0" y="607.3" font-size="12.5" fill="#3E3350" text-anchor="middle">no: it bypasses edits and next numbers</text>
</svg>
