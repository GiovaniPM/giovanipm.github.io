<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="t d" lang="it" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Teoria dei vincoli nel portafoglio IT</title>
<desc id="d">Pannello executive con quattro pratiche della Teoria dei vincoli per progetti e portafogli IT. 1: scaglionare il portafoglio; tre progetti da 10 settimane finiscono in media alla settimana 29 in parallelo e alla settimana 20 se scaglionati. 2: buffer al posto dei margini per attività; la scadenza impegnata scende da 40 a 30 giorni. 3: gestire con il consumo del buffer, con zone verde, gialla e rossa. 4: cambiare le regole insieme al sistema, come sostituire l’efficienza di ogni area con il throughput dell’intero sistema.</desc>
<defs>
  <pattern id="multi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E9E0F4"/><rect width="3" height="6" fill="#B9A3D6"/></pattern>
  <pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EFEDF2"/><rect width="2.5" height="6" fill="#C9C3D3"/></pattern>
  <clipPath id="r"><rect width="1000" height="820" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1000" height="820" fill="#F7F5FA"/>
<rect width="1000" height="86" fill="#2B1B3D"/>
<rect y="86" width="1000" height="3" fill="#FFB703"/>
<text x="32" y="44" font-size="26" fill="#fff" font-weight="700" text-anchor="start">Teoria dei vincoli nel portafoglio IT</text>
<text x="32" y="70" font-size="15" fill="#D8CCE8" font-weight="400" text-anchor="start">Quattro pratiche per consegnare più progetti, prima e in modo prevedibile</text>
<rect x="820" y="28" width="148" height="28" rx="14" fill="none" stroke="#FFB703" stroke-width="1.5"/>
<text x="894.0" y="47" font-size="12" fill="#FFB703" font-weight="700" text-anchor="middle" letter-spacing="1">VISTA EXECUTIVE</text>
<rect x="24" y="100" width="464" height="300" rx="10" fill="#fff" stroke="#E3DDEA" stroke-width="1.5"/><rect x="24" y="100" width="464" height="4" rx="2" fill="#5B2A86"/><circle cx="56" cy="129" r="13" fill="#5B2A86"/><text x="56" y="134" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="78" y="135" font-size="17" fill="#2B1B3D" font-weight="700" text-anchor="start">Scaglionare il portafoglio</text><text x="44" y="158" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Avviare i progetti al ritmo della risorsa più contesa (il tamburo)</text><rect x="40" y="342" width="432" height="46" rx="6" fill="#F5F2F9"/><rect x="40" y="342" width="4" height="46" rx="2" fill="#5B2A86"/><text x="54" y="362" font-size="14" fill="#2B1B3D" font-weight="700" text-anchor="start">Tempo medio di consegna: 29 → 20 settimane (−31%)</text><text x="54" y="380" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Il primo progetto genera valore 18 settimane prima</text><text x="44" y="216" font-size="12.5" fill="#2B1B3D" font-weight="600" text-anchor="start">In parallelo</text><text x="146" y="204" font-size="11" fill="#6B6080" font-weight="600" text-anchor="end">A</text><rect x="156" y="194" width="252" height="12" rx="2" fill="url(#multi)" stroke="#9B7CC4" stroke-width="1"/><text x="414" y="204" font-size="11" fill="#2B1B3D" font-weight="600" text-anchor="start">28</text><text x="146" y="220" font-size="11" fill="#6B6080" font-weight="600" text-anchor="end">B</text><rect x="156" y="210" width="261" height="12" rx="2" fill="url(#multi)" stroke="#9B7CC4" stroke-width="1"/><text x="423" y="220" font-size="11" fill="#2B1B3D" font-weight="600" text-anchor="start">29</text><text x="146" y="236" font-size="11" fill="#6B6080" font-weight="600" text-anchor="end">C</text><rect x="156" y="226" width="270" height="12" rx="2" fill="url(#multi)" stroke="#9B7CC4" stroke-width="1"/><text x="432" y="236" font-size="11" fill="#2B1B3D" font-weight="600" text-anchor="start">30</text><text x="44" y="270" font-size="12.5" fill="#2B1B3D" font-weight="600" text-anchor="start">Scaglionati</text><text x="146" y="258" font-size="11" fill="#6B6080" font-weight="600" text-anchor="end">A</text><rect x="156" y="248" width="90" height="12" rx="2" fill="#0E8074" stroke="#0E8074" stroke-width="1"/><text x="252" y="258" font-size="11" fill="#2B1B3D" font-weight="600" text-anchor="start">10</text><text x="146" y="274" font-size="11" fill="#6B6080" font-weight="600" text-anchor="end">B</text><rect x="246" y="264" width="90" height="12" rx="2" fill="#0E8074" stroke="#0E8074" stroke-width="1"/><text x="342" y="274" font-size="11" fill="#2B1B3D" font-weight="600" text-anchor="start">20</text><text x="146" y="290" font-size="11" fill="#6B6080" font-weight="600" text-anchor="end">C</text><rect x="336" y="280" width="90" height="12" rx="2" fill="#0E8074" stroke="#0E8074" stroke-width="1"/><text x="432" y="290" font-size="11" fill="#2B1B3D" font-weight="600" text-anchor="start">30</text><path d="M156 300 H426" stroke="#6B6080" stroke-width="1"/><path d="M156 300 v4" stroke="#6B6080"/><text x="156" y="316" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">0</text><path d="M246 300 v4" stroke="#6B6080"/><text x="246" y="316" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">10</text><path d="M336 300 v4" stroke="#6B6080"/><text x="336" y="316" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">20</text><path d="M426 300 v4" stroke="#6B6080"/><text x="426" y="316" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">30</text><text x="44" y="316" font-size="11" fill="#6B6080" font-weight="400" text-anchor="start">settimane</text><rect x="512" y="100" width="464" height="300" rx="10" fill="#fff" stroke="#E3DDEA" stroke-width="1.5"/><rect x="512" y="100" width="464" height="4" rx="2" fill="#0E8074"/><circle cx="544" cy="129" r="13" fill="#0E8074"/><text x="544" y="134" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="566" y="135" font-size="17" fill="#2B1B3D" font-weight="700" text-anchor="start">Buffer al posto dei margini per attività</text><text x="532" y="158" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Togliere i margini da ogni attività e proteggere il progetto nel suo</text><text x="532" y="174" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">insieme</text><rect x="528" y="342" width="432" height="46" rx="6" fill="#F5F2F9"/><rect x="528" y="342" width="4" height="46" rx="2" fill="#0E8074"/><text x="542" y="362" font-size="14" fill="#2B1B3D" font-weight="700" text-anchor="start">Scadenza impegnata: 40 → 30 giorni (−25%)</text><text x="542" y="380" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">La sicurezza è condivisa, non consumata attività per attività</text><text x="532" y="215" font-size="12.5" fill="#2B1B3D" font-weight="600" text-anchor="start">Tradizionale</text><text x="532" y="257" font-size="12.5" fill="#2B1B3D" font-weight="600" text-anchor="start">Catena Critica</text><rect x="644" y="198" width="35" height="24" fill="#5B2A86"/><rect x="679" y="198" width="35" height="24" fill="url(#pad)"/><rect x="644" y="240" width="35" height="24" fill="#5B2A86"/><rect x="714" y="198" width="35" height="24" fill="#5B2A86"/><rect x="749" y="198" width="35" height="24" fill="url(#pad)"/><rect x="679" y="240" width="35" height="24" fill="#5B2A86"/><rect x="784" y="198" width="35" height="24" fill="#5B2A86"/><rect x="819" y="198" width="35" height="24" fill="url(#pad)"/><rect x="714" y="240" width="35" height="24" fill="#5B2A86"/><rect x="854" y="198" width="35" height="24" fill="#5B2A86"/><rect x="889" y="198" width="35" height="24" fill="url(#pad)"/><rect x="749" y="240" width="35" height="24" fill="#5B2A86"/><rect x="784" y="240" width="70" height="24" fill="#FFB703"/><path d="M679 198 v24" stroke="#fff" stroke-width="1.5"/><path d="M714 198 v24" stroke="#fff" stroke-width="1.5"/><path d="M749 198 v24" stroke="#fff" stroke-width="1.5"/><path d="M784 198 v24" stroke="#fff" stroke-width="1.5"/><path d="M819 198 v24" stroke="#fff" stroke-width="1.5"/><path d="M854 198 v24" stroke="#fff" stroke-width="1.5"/><path d="M889 198 v24" stroke="#fff" stroke-width="1.5"/><path d="M679 240 v24" stroke="#fff" stroke-width="1.5"/><path d="M714 240 v24" stroke="#fff" stroke-width="1.5"/><path d="M749 240 v24" stroke="#fff" stroke-width="1.5"/><path d="M784 240 v24" stroke="#fff" stroke-width="1.5"/><text x="930" y="215" font-size="12" fill="#2B1B3D" font-weight="700" text-anchor="start">40</text><text x="860" y="257" font-size="12" fill="#2B1B3D" font-weight="700" text-anchor="start">30</text><path d="M854 231 H924 M854 227 v8 M924 227 v8" stroke="#0E8074" stroke-width="1.5"/><text x="930" y="235" font-size="12" fill="#0E8074" font-weight="700" text-anchor="start">−10</text><path d="M644 286 H924" stroke="#6B6080" stroke-width="1"/><path d="M644 286 v4" stroke="#6B6080"/><text x="644" y="302" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">0</text><path d="M714 286 v4" stroke="#6B6080"/><text x="714" y="302" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">10</text><path d="M784 286 v4" stroke="#6B6080"/><text x="784" y="302" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">20</text><path d="M854 286 v4" stroke="#6B6080"/><text x="854" y="302" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">30</text><path d="M924 286 v4" stroke="#6B6080"/><text x="924" y="302" font-size="11" fill="#6B6080" font-weight="400" text-anchor="middle">40</text><text x="532" y="302" font-size="11" fill="#6B6080" font-weight="400" text-anchor="start">giorni</text><rect x="532" y="312" width="12" height="12" rx="2" fill="#5B2A86" stroke="#E3DDEA"/><text x="550" y="322" font-size="12" fill="#2B1B3D" font-weight="400" text-anchor="start">Lavoro</text><rect x="662" y="312" width="12" height="12" rx="2" fill="url(#pad)" stroke="#E3DDEA"/><text x="680" y="322" font-size="12" fill="#2B1B3D" font-weight="400" text-anchor="start">Margine incorporato</text><rect x="816" y="312" width="12" height="12" rx="2" fill="#FFB703" stroke="#E3DDEA"/><text x="834" y="322" font-size="12" fill="#2B1B3D" font-weight="400" text-anchor="start">Buffer di progetto</text><rect x="24" y="414" width="464" height="300" rx="10" fill="#fff" stroke="#E3DDEA" stroke-width="1.5"/><rect x="24" y="414" width="464" height="4" rx="2" fill="#B35300"/><circle cx="56" cy="443" r="13" fill="#B35300"/><text x="56" y="448" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="78" y="449" font-size="17" fill="#2B1B3D" font-weight="700" text-anchor="start">Gestire con il consumo del buffer</text><text x="44" y="472" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Un solo indicatore per progetto, confrontabile in tutto il portafoglio</text><rect x="40" y="656" width="432" height="46" rx="6" fill="#F5F2F9"/><rect x="40" y="656" width="4" height="46" rx="2" fill="#B35300"/><text x="54" y="676" font-size="14" fill="#2B1B3D" font-weight="700" text-anchor="start">Gestione per eccezione: il vertice interviene solo sul rosso</text><text x="54" y="694" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Senza microgestire attività né report di stato</text><polygon points="96.0,618.0 296.0,618.0 296.0,539.6 96.0,601.2" fill="#DDF2EF"/><polygon points="96.0,601.2 296.0,539.6 296.0,511.6 96.0,578.8" fill="#FFF1C9"/><polygon points="96.0,578.8 296.0,511.6 296.0,506.0 96.0,506.0" fill="#FDE0E7"/><rect x="96" y="506" width="200" height="112" fill="none" stroke="#6B6080" stroke-width="1"/><circle cx="236.0" cy="578.8" r="10" fill="#2A9D8F" stroke="#fff" stroke-width="2"/><text x="236.0" y="582.8" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">A</text><circle cx="186.0" cy="562.0" r="10" fill="#E0A100" stroke="#fff" stroke-width="2"/><text x="186.0" y="566.0" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">B</text><circle cx="156.0" cy="537.4" r="10" fill="#E0475F" stroke="#fff" stroke-width="2"/><text x="156.0" y="541.4" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="96" y="632" font-size="10.5" fill="#6B6080" font-weight="400" text-anchor="middle">0%</text><text x="296" y="632" font-size="10.5" fill="#6B6080" font-weight="400" text-anchor="middle">100%</text><text x="196.0" y="644" font-size="11.5" fill="#6B6080" font-weight="400" text-anchor="middle">% della catena critica completata</text><text x="88" y="514" font-size="10.5" fill="#6B6080" font-weight="400" text-anchor="end">100%</text><text x="52" y="562.0" font-size="11.5" fill="#6B6080" font-weight="400" text-anchor="middle" transform="rotate(-90 52 562.0)">% del buffer consumato</text><circle cx="322" cy="518" r="6" fill="#2A9D8F"/><text x="334" y="522" font-size="13" fill="#2B1B3D" font-weight="700" text-anchor="start">In linea</text><text x="334" y="538" font-size="12" fill="#6B6080" font-weight="400" text-anchor="start">seguire il piano</text><circle cx="322" cy="556" r="6" fill="#E0A100"/><text x="334" y="560" font-size="13" fill="#2B1B3D" font-weight="700" text-anchor="start">Attenzione</text><text x="334" y="576" font-size="12" fill="#6B6080" font-weight="400" text-anchor="start">preparare azioni</text><circle cx="322" cy="594" r="6" fill="#E0475F"/><text x="334" y="598" font-size="13" fill="#2B1B3D" font-weight="700" text-anchor="start">A rischio</text><text x="334" y="614" font-size="12" fill="#6B6080" font-weight="400" text-anchor="start">agire subito</text><rect x="512" y="414" width="464" height="300" rx="10" fill="#fff" stroke="#E3DDEA" stroke-width="1.5"/><rect x="512" y="414" width="464" height="4" rx="2" fill="#C2185B"/><circle cx="544" cy="443" r="13" fill="#C2185B"/><text x="544" y="448" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="566" y="449" font-size="17" fill="#2B1B3D" font-weight="700" text-anchor="start">Cambiare le regole insieme al sistema</text><text x="532" y="472" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Un ERP rende grazie alle regole che cambiano, non al go-live</text><rect x="528" y="656" width="432" height="46" rx="6" fill="#F5F2F9"/><rect x="528" y="656" width="4" height="46" rx="2" fill="#C2185B"/><text x="542" y="676" font-size="14" fill="#2B1B3D" font-weight="700" text-anchor="start">Tecnologia senza nuove regole è costo senza ritorno</text><text x="542" y="694" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Necessaria, ma non sufficiente</text><text x="532" y="512" font-size="11" fill="#6B6080" font-weight="700" text-anchor="start" letter-spacing="1">REGOLA VECCHIA</text><text x="762" y="512" font-size="11" fill="#0E8074" font-weight="700" text-anchor="start" letter-spacing="1">NUOVA REGOLA</text><rect x="528" y="520" width="432" height="40" rx="5" fill="#FAF8FC" stroke="#E3DDEA"/><text x="536" y="544" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Efficienza di ogni area</text><text x="740" y="546" font-size="18" fill="#0E8074" font-weight="700" text-anchor="middle">→</text><text x="762" y="537" font-size="12.5" fill="#2B1B3D" font-weight="700" text-anchor="start">Throughput dell’intero</text><text x="762" y="552" font-size="12.5" fill="#2B1B3D" font-weight="700" text-anchor="start">sistema</text><rect x="528" y="564" width="432" height="40" rx="5" fill="#fff" stroke="#E3DDEA"/><text x="536" y="581" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Avviare tutto ciò che è</text><text x="536" y="596" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">approvato</text><text x="740" y="590" font-size="18" fill="#0E8074" font-weight="700" text-anchor="middle">→</text><text x="762" y="581" font-size="12.5" fill="#2B1B3D" font-weight="700" text-anchor="start">Avviare al ritmo del</text><text x="762" y="596" font-size="12.5" fill="#2B1B3D" font-weight="700" text-anchor="start">tamburo</text><rect x="528" y="608" width="432" height="40" rx="5" fill="#FAF8FC" stroke="#E3DDEA"/><text x="536" y="632" font-size="12.5" fill="#6B6080" font-weight="400" text-anchor="start">Successo = go-live dell’ERP</text><text x="740" y="634" font-size="18" fill="#0E8074" font-weight="700" text-anchor="middle">→</text><text x="762" y="625" font-size="12.5" fill="#2B1B3D" font-weight="700" text-anchor="start">Successo = guadagno dopo il</text><text x="762" y="640" font-size="12.5" fill="#2B1B3D" font-weight="700" text-anchor="start">go-live</text>
<rect x="24" y="728" width="952" height="64" rx="10" fill="#5B2A86"/>
<text x="44" y="752" font-size="15" fill="#fff" font-weight="600" text-anchor="start">Meno progetti in parallelo, consegnati prima e in modo prevedibile: il portafoglio è gestito in base al</text><text x="44" y="772" font-size="15" fill="#fff" font-weight="600" text-anchor="start">throughput, non all’occupazione dei team.</text>
<text x="24" y="806" font-size="11.5" fill="#6B6080" font-weight="400" text-anchor="start">Fonti: Goldratt, Critical Chain (1997) e Necessary But Not Sufficient (2000). Valori illustrativi.</text>
</g>
</svg>
