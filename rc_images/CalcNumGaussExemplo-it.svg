<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Calcolare la retta migliore, passo dopo passo</title>
<desc id="d">Una pianta è stata misurata per 5 settimane: 2, 3, 5, 4 e 6 centimetri. La tabella calcola, per ogni settimana x e altezza y, la distanza dalle medie (x medio 3, y medio 4), il prodotto di queste distanze e il quadrato della distanza in x. Le somme sono 9 e 10. Pendenza = 9 ÷ 10 = 0,9; intercetta = 4 − 0,9 × 3 = 1,3. La retta è altezza = 0,9 × settimana + 1,3, e la previsione per la settimana 6 è 6,7 centimetri.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Calcolare la retta migliore, passo dopo passo</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Quanto sarà alta la pianta nella settimana 6?</text><rect x="30" y="100" width="570" height="46" rx="8" fill="#FFF1C9"/><text x="85" y="130" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">sett. x</text><text x="180" y="130" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">altezza y</text><text x="270" y="130" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">x − 3</text><text x="355" y="130" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">y − 4</text><text x="450" y="130" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">prodotto</text><text x="545" y="130" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">(x − 3)²</text><text x="85" y="176" font-size="16" fill="#2B1B3D" text-anchor="middle">1</text><text x="180" y="176" font-size="16" fill="#2B1B3D" text-anchor="middle">2</text><text x="270" y="176" font-size="16" fill="#2B1B3D" text-anchor="middle">−2</text><text x="355" y="176" font-size="16" fill="#2B1B3D" text-anchor="middle">−2</text><text x="450" y="176" font-size="16" fill="#2B1B3D" text-anchor="middle">+4</text><text x="545" y="176" font-size="16" fill="#2B1B3D" text-anchor="middle">4</text><line x1="30" y1="190" x2="600" y2="190" stroke="#F1E2CF" stroke-width="1.5"/><text x="85" y="216" font-size="16" fill="#2B1B3D" text-anchor="middle">2</text><text x="180" y="216" font-size="16" fill="#2B1B3D" text-anchor="middle">3</text><text x="270" y="216" font-size="16" fill="#2B1B3D" text-anchor="middle">−1</text><text x="355" y="216" font-size="16" fill="#2B1B3D" text-anchor="middle">−1</text><text x="450" y="216" font-size="16" fill="#2B1B3D" text-anchor="middle">+1</text><text x="545" y="216" font-size="16" fill="#2B1B3D" text-anchor="middle">1</text><line x1="30" y1="230" x2="600" y2="230" stroke="#F1E2CF" stroke-width="1.5"/><text x="85" y="256" font-size="16" fill="#2B1B3D" text-anchor="middle">3</text><text x="180" y="256" font-size="16" fill="#2B1B3D" text-anchor="middle">5</text><text x="270" y="256" font-size="16" fill="#2B1B3D" text-anchor="middle">0</text><text x="355" y="256" font-size="16" fill="#2B1B3D" text-anchor="middle">+1</text><text x="450" y="256" font-size="16" fill="#2B1B3D" text-anchor="middle">0</text><text x="545" y="256" font-size="16" fill="#2B1B3D" text-anchor="middle">0</text><line x1="30" y1="270" x2="600" y2="270" stroke="#F1E2CF" stroke-width="1.5"/><text x="85" y="296" font-size="16" fill="#2B1B3D" text-anchor="middle">4</text><text x="180" y="296" font-size="16" fill="#2B1B3D" text-anchor="middle">4</text><text x="270" y="296" font-size="16" fill="#2B1B3D" text-anchor="middle">+1</text><text x="355" y="296" font-size="16" fill="#2B1B3D" text-anchor="middle">0</text><text x="450" y="296" font-size="16" fill="#2B1B3D" text-anchor="middle">0</text><text x="545" y="296" font-size="16" fill="#2B1B3D" text-anchor="middle">1</text><line x1="30" y1="310" x2="600" y2="310" stroke="#F1E2CF" stroke-width="1.5"/><text x="85" y="336" font-size="16" fill="#2B1B3D" text-anchor="middle">5</text><text x="180" y="336" font-size="16" fill="#2B1B3D" text-anchor="middle">6</text><text x="270" y="336" font-size="16" fill="#2B1B3D" text-anchor="middle">+2</text><text x="355" y="336" font-size="16" fill="#2B1B3D" text-anchor="middle">+2</text><text x="450" y="336" font-size="16" fill="#2B1B3D" text-anchor="middle">+4</text><text x="545" y="336" font-size="16" fill="#2B1B3D" text-anchor="middle">4</text><line x1="30" y1="350" x2="600" y2="350" stroke="#F1E2CF" stroke-width="1.5"/><text x="140" y="386" font-size="14" fill="#756986" text-anchor="middle" font-weight="700">medie: x̄ = 3, ȳ = 4</text><text x="450" y="386" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">somma 9</text><text x="545" y="386" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">somma 10</text><rect x="30" y="410" width="570" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="315" y="442" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">pendenza = 9 ÷ 10 = 0,9</text><text x="315" y="472" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">intercetta = 4 − 0,9 × 3 = 1,3</text><text x="315" y="504" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">altezza = 0,9 × settimana + 1,3</text><line x1="650" y1="440" x2="960" y2="440" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="650" y1="440" x2="650" y2="130" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><text x="692.857" y="460" font-size="12" fill="#756986" text-anchor="middle">1</text><text x="735.714" y="460" font-size="12" fill="#756986" text-anchor="middle">2</text><text x="778.571" y="460" font-size="12" fill="#756986" text-anchor="middle">3</text><text x="821.429" y="460" font-size="12" fill="#756986" text-anchor="middle">4</text><text x="864.286" y="460" font-size="12" fill="#756986" text-anchor="middle">5</text><text x="907.143" y="460" font-size="12" fill="#756986" text-anchor="middle">6</text><text x="642" y="369" font-size="12" fill="#756986" text-anchor="end">2</text><text x="642" y="294" font-size="12" fill="#756986" text-anchor="end">4</text><text x="642" y="219" font-size="12" fill="#756986" text-anchor="end">6</text><text x="642" y="144" font-size="12" fill="#756986" text-anchor="end">8</text><line x1="667.143" y1="377.75" x2="932.857" y2="168.5" stroke="#2A9D8F" stroke-width="3"/><circle cx="692.857" cy="365" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="735.714" cy="327.5" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="778.571" cy="252.5" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="821.429" cy="290" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="864.286" cy="215" r="6" fill="#5B2A86" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="907.143" cy="188.75" r="8" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/><text x="897.143" y="172.75" font-size="14" fill="#B35300" text-anchor="end" font-weight="700">sett. 6: 6,7 cm</text><text x="800" y="488" font-size="13" fill="#756986" text-anchor="middle">settimana</text><text x="660" y="130" font-size="13" fill="#756986" text-anchor="start">altezza (cm)</text>
