<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 482" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Flusso EDI in JD Edwards</title>
<desc id="d">Ingresso: il cliente invia un 850 tramite VAN o AS2; il traduttore EDI converte l'X12 in file piatto, restituisce il 997 e scrive nelle tabelle F47011/F47012, un'area di sosta correggibile; l'R47011 crea l'ordine in F4201/F4211 con le stesse regole dell'inserimento ordini e gli errori vanno nel Work Center. Uscita: dopo la fatturazione in JDE, l'R47042 estrae la fattura nelle tabelle F47046/F47047; il traduttore converte il file in 810 e il cliente lo riceve; la ricevuta 997 o CONTRL viene conservata.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="482" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">EDI con le tabelle del sistema 47</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Il traduttore converte lo standard (X12, EDIFACT) in file piatto; JDE valida e crea il documento</text>
<rect x="20" y="92" width="960" height="176" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#756986" text-anchor="start" font-weight="700">INGRESSO: ORDINE DEL CLIENTE (850 / ORDERS)</text>
<rect x="30" y="136" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="116.0" y="171.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cliente</text>
<text x="116.0" y="190.3" font-size="12.5" fill="#3E3350" text-anchor="middle">invia 850</text>
<rect x="222" y="136" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="308.0" y="171.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">VAN o AS2</text>
<text x="308.0" y="190.3" font-size="12.5" fill="#3E3350" text-anchor="middle">certificati</text>
<rect x="414" y="136" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Traduttore EDI</text>
<text x="500.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">X12 → file piatto</text>
<text x="500.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">restituisce il 997</text>
<rect x="606" y="136" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="692.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">F47011 / F47012</text>
<text x="692.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">area di sosta</text>
<text x="692.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(correggibile)</text>
<rect x="798" y="136" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="884.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">R47011</text>
<text x="884.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">crea l'ordine</text>
<text x="884.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">F4201 / F4211</text>
<polyline points="202,176 220,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,176 412,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,176 604,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,176 796,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="250" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">R47011 usa le stesse regole di inserimento ordini; gli errori vanno nel Work Center</text>
<rect x="20" y="286" width="960" height="176" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="310" font-size="13" fill="#756986" text-anchor="start" font-weight="700">USCITA: FATTURA AL CLIENTE (810 / INVOIC)</text>
<rect x="30" y="330" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="116.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Fatturazione</text>
<text x="116.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">in JDE</text>
<rect x="222" y="330" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="308.0" y="356.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">R47042</text>
<text x="308.0" y="375.0" font-size="12.5" fill="#3E3350" text-anchor="middle">estrae la</text>
<text x="308.0" y="393.5" font-size="12.5" fill="#3E3350" text-anchor="middle">fattura per EDI</text>
<rect x="414" y="330" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">F47046 / F47047</text>
<text x="500.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">uscita</text>
<rect x="606" y="330" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="692.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Traduttore EDI</text>
<text x="692.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">file → 810</text>
<rect x="798" y="330" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="884.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cliente</text>
<text x="884.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">riceve 810</text>
<polyline points="202,370 220,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,370 412,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,370 604,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,370 796,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="444" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">il traduttore marca il record come inviato e conserva la ricevuta (997 / CONTRL)</text>
</svg>
