<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Modello entità-relazione (notazione di Chen)</title>
<desc id="d">Diagramma entità-relazione. Studente è collegato a Corso dalla relazione si iscrive, con cardinalità N a M e l’attributo voto. Docente insegna Corso, con cardinalità 1 a N e partecipazione totale di Corso, indicata da una linea doppia. Studente ha la matricola come chiave, nome, telefoni multivalore ed età derivata. Corso ha il codice come chiave e il titolo. Docente ha il codice docente come chiave, il nome e un indirizzo composto da via e città.</desc>
