<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ejemplo de botes laterales</title>
<desc id="d">Ana va all-in con 100, Beto con 250, Caio y Duda igualan 400 cada uno y Edu se retira tras poner 50. El bote principal tiene 450 para los cuatro que quedan; el lateral 1 tiene 450 para Beto, Caio y Duda; el lateral 2 tiene 300 y solo lo disputan Caio y Duda.</desc>
<rect width="1000" height="430" rx="18" fill="#FFF7EC"/>
<text x="50" y="44" font-size="15" fill="#756986" text-anchor="start">fichas puestas en la mano</text><rect x="70" y="278" width="62" height="62" fill="#FFB703" stroke="#FFF7EC" stroke-width="1.5"/><text x="101" y="270" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">100</text><text x="101" y="364" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ana</text><text x="101" y="384" font-size="13" fill="#756986" text-anchor="middle">all-in</text><rect x="162" y="278" width="62" height="62" fill="#FFB703" stroke="#FFF7EC" stroke-width="1.5"/><rect x="162" y="185" width="62" height="93" fill="#2A9D8F" stroke="#FFF7EC" stroke-width="1.5"/><text x="193" y="177" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">250</text><text x="193" y="364" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Beto</text><text x="193" y="384" font-size="13" fill="#756986" text-anchor="middle">all-in</text><rect x="254" y="278" width="62" height="62" fill="#FFB703" stroke="#FFF7EC" stroke-width="1.5"/><rect x="254" y="185" width="62" height="93" fill="#2A9D8F" stroke="#FFF7EC" stroke-width="1.5"/><rect x="254" y="92" width="62" height="93" fill="#8E5BC0" stroke="#FFF7EC" stroke-width="1.5"/><text x="285" y="84" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">400</text><text x="285" y="364" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Caio</text><rect x="346" y="278" width="62" height="62" fill="#FFB703" stroke="#FFF7EC" stroke-width="1.5"/><rect x="346" y="185" width="62" height="93" fill="#2A9D8F" stroke="#FFF7EC" stroke-width="1.5"/><rect x="346" y="92" width="62" height="93" fill="#8E5BC0" stroke="#FFF7EC" stroke-width="1.5"/><text x="377" y="84" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">400</text><text x="377" y="364" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Duda</text><rect x="438" y="309" width="62" height="31" fill="#FFB703" stroke="#FFF7EC" stroke-width="1.5" opacity=".55"/><text x="469" y="301" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">50</text><text x="469" y="364" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Edu</text><text x="469" y="384" font-size="13" fill="#756986" text-anchor="middle">se retiró</text><path d="M58 278H520" stroke="#2B1B3D" stroke-dasharray="5 5" stroke-width="1"/><path d="M58 185H520" stroke="#2B1B3D" stroke-dasharray="5 5" stroke-width="1"/><path d="M58 340H520" stroke="#2B1B3D" stroke-width="1.5"/><rect x="560" y="70" width="400" height="76" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="3"/><rect x="560" y="70" width="14" height="76" rx="6" fill="#FFB703"/><text x="590" y="97" font-size="18" fill="#2B1B3D" text-anchor="start" font-weight="700">Bote principal: 450</text><text x="590" y="118" font-size="14" fill="#756986" text-anchor="start">100 × 4 + 50 de Edu</text><text x="590" y="137" font-size="14" fill="#2B1B3D" text-anchor="start">Ana, Beto, Caio, Duda</text><rect x="560" y="162" width="400" height="76" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/><rect x="560" y="162" width="14" height="76" rx="6" fill="#2A9D8F"/><text x="590" y="189" font-size="18" fill="#2B1B3D" text-anchor="start" font-weight="700">Bote lateral 1: 450</text><text x="590" y="210" font-size="14" fill="#756986" text-anchor="start">150 × 3</text><text x="590" y="229" font-size="14" fill="#2B1B3D" text-anchor="start">Beto, Caio, Duda</text><rect x="560" y="254" width="400" height="76" rx="12" fill="#FFFFFF" stroke="#8E5BC0" stroke-width="3"/><rect x="560" y="254" width="14" height="76" rx="6" fill="#8E5BC0"/><text x="590" y="281" font-size="18" fill="#2B1B3D" text-anchor="start" font-weight="700">Bote lateral 2: 300</text><text x="590" y="302" font-size="14" fill="#756986" text-anchor="start">150 × 2</text><text x="590" y="321" font-size="14" fill="#2B1B3D" text-anchor="start">Caio, Duda</text><text x="500" y="410" font-size="15" fill="#756986" text-anchor="middle">Ana solo puede ganar el bote principal, aunque tenga la mejor mano de la mesa.</text>
</svg>
