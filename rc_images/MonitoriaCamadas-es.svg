<rect x="520" y="100" width="430" height="8" rx="4" fill="#E23B3B"/>
<text x="735.0" y="136.0" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Monitoreo de negocio</text>
<text x="735.0" y="157.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">¿el negocio está funcionando?</text>
<rect x="536" y="172" width="398" height="36" rx="8" fill="#FFC9C9"/>
<circle cx="556" cy="190" r="10" fill="#E23B3B"/>
<path d="M552 186 l8 8 M560 186 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="195.0" font-size="14" fill="#2B1B3D" text-anchor="start">Propuestas del socio X</text>
<text x="922.0" y="195.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">40% rechazadas</text>
<rect x="536" y="216" width="398" height="36" rx="8" fill="#FFC9C9"/>
<circle cx="556" cy="234" r="10" fill="#E23B3B"/>
<path d="M552 230 l8 8 M560 230 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="239.0" font-size="14" fill="#2B1B3D" text-anchor="start">Transacciones a las 10 h</text>
<text x="922.0" y="239.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">50 (esperadas ~500)</text>
<rect x="536" y="260" width="398" height="36" rx="8" fill="#FFC9C9"/>
<circle cx="556" cy="278" r="10" fill="#E23B3B"/>
<path d="M552 274 l8 8 M560 274 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="283.0" font-size="14" fill="#2B1B3D" text-anchor="start">Pedidos detenidos en el estado 520</text>
<text x="922.0" y="283.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">37</text>
<rect x="536" y="304" width="398" height="36" rx="8" fill="#FFC9C9"/>
<circle cx="556" cy="322" r="10" fill="#E23B3B"/>
<path d="M552 318 l8 8 M560 318 l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
<text x="576.0" y="327.0" font-size="14" fill="#2B1B3D" text-anchor="start">Ingresos de la última hora</text>
<text x="922.0" y="327.0" font-size="14" fill="#2B1B3D" text-anchor="end" font-weight="700">38% de lo previsto</text>
<rect x="605.0" y="350" width="260" height="28" rx="14" fill="#E23B3B"/>
<text x="735.0" y="369.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Alerta: el negocio se detuvo</text>
<text x="500.0" y="430.0" font-size="14" fill="#3E3350" text-anchor="middle">La API responde, pero responde “no”. Solo el monitoreo de negocio ve el problema.</text>
