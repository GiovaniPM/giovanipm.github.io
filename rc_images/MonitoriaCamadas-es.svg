<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Los mismos 15 minutos vistos por dos monitoreos</text>
<rect x="50" y="100" width="430" height="290" rx="14" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<rect x="50" y="100" width="430" height="8" rx="4" fill="#2A9D8F"/>
<text x="265.0" y="136.0" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Monitoreo técnico</text>
<text x="265.0" y="157.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">¿el sistema está en pie?</text>
<rect x="66" y="172" width="398" height="36" rx="8" fill="#C8EDE6"/>
<circle cx="86" cy="190" r="10" fill="#2A9D8F"/>
<path d="M81 190 l3.5 3.5 l6.5 -7" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
