="500" y="424" font-size="13.5" fill="#5E5170" text-anchor="middle">Conta: custo do grupo com 3 casas por lote, dividido pelo aluguel esperado a cada lance de um adversário. Menos</text><text x="500" y="442" font-size="13.5" fill="#5E5170" text-anchor="middle">é melhor.</text>
