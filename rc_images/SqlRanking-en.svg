<text x="570.0" y="428.0" font-size="12.5" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">RANK skips positions</text>
<text x="150.0" y="458.0" font-size="13" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">ROW_NUMBER</text><text x="290.0" y="458.0" font-size="13" fill="#3E3350" xml:space="preserve">a unique number even on ties (order among tied rows is arbitrary)</text>
<text x="150.0" y="480.0" font-size="13" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">RANK</text><text x="290.0" y="480.0" font-size="13" fill="#3E3350" xml:space="preserve">tied rows share a position, and the next one is skipped (3, 3, 5)</text>
<text x="150.0" y="502.0" font-size="13" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">DENSE_RANK</text><text x="290.0" y="502.0" font-size="13" fill="#3E3350" xml:space="preserve">tied rows share a position, with no gaps (3, 3, 4)</text>
<rect x="150.0" y="84.0" width="520.0" height="28.0" rx="7" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="160.0" y="102.7" font-size="13" fill="#5FD3C4" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">… OVER (ORDER BY salary DESC)</text>
<text x="500.0" y="538.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">For “the top 3 salaries”, DENSE_RANK &lt;= 3 includes every tied row; ROW_NUMBER &lt;= 3 cuts through the tie.</text>
</svg>
