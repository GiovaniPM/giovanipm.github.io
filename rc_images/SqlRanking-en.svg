<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">ROW_NUMBER, RANK and DENSE_RANK with ties</title>
<desc id="d">Table with seven employees sorted by descending salary and three numbering columns. Eva 6000 and Ana 5000 get 1 and 2 in all three. Bruno and Carla, tied at 4000, get 3 and 4 in ROW_NUMBER, 3 and 3 in RANK and 3 and 3 in DENSE_RANK. Fábio and Gil, tied at 3500, get 5 and 6, 5 and 5, and 4 and 4. Davi 3000 gets 7, 7 and 5. Arrows show that RANK skips positions 4 and 6.</desc>
