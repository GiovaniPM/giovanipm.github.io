<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 433" role="img" aria-labelledby="t d"><title id="t">How the app calculates the laptop expected value</title><desc id="d">The laptop tree with its values: the chance node is worth 0.7 × 800 + 0.3 × 3,800 = 1,700; the decision takes the lowest of 1,700 and 3,000; the rule follows the No branch because the laptop is out of warranty.</desc><style>.dtw .n-shape{stroke-width:1.8}
.dtw .n-txt{fill:#1b2022;font:13px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif}
.dtw .n-num{fill:#60686c;font:600 10px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-val{fill:#1b2022;font:600 12px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-inner{fill:none;stroke-width:1}
.dtw .t-decision .n-shape{fill:#e4f0fb;stroke:#1f5f99}.dtw .t-decision .n-glyph{fill:#1f5f99}
.dtw .t-chance .n-shape{fill:#efeafa;stroke:#65509c}.dtw .t-chance .n-glyph{fill:#65509c}
.dtw .t-rule .n-shape{fill:#fdf0d0;stroke:#9a6a00}.dtw .t-rule .n-glyph{fill:#9a6a00}
.dtw .t-outcome .n-shape{fill:#dff3e4;stroke:#2b7a45}.dtw .t-outcome .n-glyph{fill:#2b7a45}.dtw .t-outcome .n-inner{stroke:#2b7a45}
.dtw .e-line{fill:none;stroke:#4a5358;stroke-width:1.6;stroke-linejoin:round}
.dtw .e-mark{fill:none;stroke:#4a5358;stroke-width:1.8}
.dtw .e-lab{fill:#1b2022;font:12px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;paint-order:stroke;stroke:#FFF7EC;stroke-width:4px;stroke-linejoin:round}
.dtw .edge.best .e-line{stroke:#1f7a3d;stroke-width:3}
.dtw .edge.rej .e-line{opacity:.55}
.dtw .edge.rej .e-lab{fill:#60686c}</style><rect width="1000" height="433" rx="18" fill="#FFF7EC"/><svg class="dtw" x="30" y="20" width="940" height="283" viewBox="-104 -16 1154 348"><g class="edge rej" data-edge="nmvxuhmm16"><path class="e-line" d="M88 126.5H104Q110 126.5 110 120.5V38Q110 32 116 32H164"/><path class="e-mark" d="M143 38L147 26M149 38L153 26"/><text class="e-lab" x="118" y="26" text-anchor="start">Yes</text></g><g class="edge best" data-edge="nmvxuhmus7"><path class="e-line" d="M88 126.5H104Q110 126.5 110 132.5V215Q110 221 116 221H164"/><text class="e-lab" x="118" y="215" text-anchor="start">No</text></g><g class="edge best" data-edge="nmvxuhn2n8"><path class="e-line" d="M340 221H356Q362 221 362 215V164Q362 158 368 158H514"/><text class="e-lab" x="370" y="152" text-anchor="start">Repair · +800</text></g><g class="edge" data-edge="nmvxuhnaj9"><path class="e-line" d="M690 158H706Q712 158 712 152V122Q712 116 718 116H857.7"/><text class="e-lab" x="720" y="110" text-anchor="start">Works · 70%</text></g><g class="edge" data-edge="nmvxuhnjta"><path class="e-line" d="M690 158H706Q712 158 712 164V194Q712 200 718 200H857.7"/><text class="e-lab" x="720" y="194" text-anchor="start">Does not work · 30%</text></g><g class="edge rej" data-edge="nmvxuhns3b"><path class="e-line" d="M340 221H356Q362 221 362 227V278Q362 284 368 284H514"/><path class="e-mark" d="M493 290L497 278M499 290L503 278"/><text class="e-lab" x="370" y="278" text-anchor="start">Replace now · +3,000</text></g><g class="node t-rule" data-id="nmvxuhme55" transform="translate(-88 94.5)"><title>Rule: Under warranty?</title><path class="n-shape" d="M10 0H166L176 32L166 64H10L0 32Z"/><path class="n-glyph" d="M20 8.5L26.5 15L20 21.5L13.5 15Z"/><text class="n-num" x="30" y="19">1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Under warranty?</text><text class="n-val" x="88" y="55" text-anchor="middle">EV $ 1,700</text></g><g class="node t-outcome" data-id="nmvxuhmm16" transform="translate(164 0)"><title>Outcome: Free repair</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Free repair</text><text class="n-val" x="88" y="55" text-anchor="middle">= $ 0</text></g><g class="node t-decision" data-id="nmvxuhmus7" transform="translate(164 189)"><title>Decision: Repair or replace?</title><rect class="n-shape" width="176" height="64" rx="2"/><rect class="n-glyph" x="10" y="10" width="10" height="10"/><text class="n-num" x="25" y="19">1.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Repair or replace?</text><text class="n-val" x="88" y="55" text-anchor="middle">EV $ 1,700</text></g><g class="node t-chance" data-id="nmvxuhn2n8" transform="translate(514 126)"><title>Chance: Does the repair work?</title><rect class="n-shape" width="176" height="64" rx="20"/><circle class="n-glyph" cx="17" cy="15" r="5.3"/><text class="n-num" x="27" y="19">1.2.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Does the repair work?</text><text class="n-val" x="88" y="55" text-anchor="middle">EV $ 1,700</text></g><g class="node t-outcome" data-id="nmvxuhnaj9" transform="translate(857.7 84)"><title>Outcome: Keep using it</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.1.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Keep using it</text><text class="n-val" x="88" y="55" text-anchor="middle">= $ 800</text></g><g class="node t-outcome" data-id="nmvxuhnjta" transform="translate(857.7 168)"><title>Outcome: Buy a new one</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.1.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Buy a new one</text><text class="n-val" x="88" y="55" text-anchor="middle">= $ 3,800</text></g><g class="node t-outcome" data-id="nmvxuhns3b" transform="translate(514 252)"><title>Outcome: New laptop</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">New laptop</text><text class="n-val" x="88" y="55" text-anchor="middle">= $ 3,000</text></g></svg><text x="40" y="341" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2B1B3D">1. Chance: 0.7 × 800 + 0.3 × 3,800 = 1,700</text><text x="40" y="367" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2B1B3D">2. Decision, minimizing: lowest of 1,700 and 3,000 = 1,700</text><text x="40" y="393" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D">3. Rule: out of warranty, follows the No branch = 1,700</text></svg>