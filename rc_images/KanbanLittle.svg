<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Lei de Little: menos WIP, entregas mais rápidas</title>
<desc id="d">No alto, a fórmula da Lei de Little: tempo de ciclo médio igual a WIP médio dividido pelo throughput. Time A tem 12 itens em andamento e entrega 3 por dia: tempo de ciclo de 4 dias. Time B tem 6 itens em andamento e entrega os mesmos 3 por dia: tempo de ciclo de 2 dias.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker></defs>
<rect width="1000" height="490" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Lei de Little: menos WIP, entregas mais rápidas</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Com o mesmo throughput, reduzir o trabalho em andamento reduz o tempo de ciclo</text>
<rect x="200.0" y="96.0" width="600.0" height="56.0" rx="12" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="500.0" y="131.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">Tempo de ciclo médio = WIP médio ÷ Throughput</text>
<text x="40.0" y="198.0" font-size="15" fill="#2B1B3D" font-weight="700">Time A: 12 itens em andamento</text>
<rect x="40.0" y="212.0" width="560.0" height="60.0" rx="30" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/>
<rect x="62.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
