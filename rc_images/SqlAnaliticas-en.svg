<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Aggregate or analytic function?</title>
<desc id="d">On the left, seven employees from two departments. In the middle, the aggregate version, AVG with GROUP BY, reduces everything to two rows: department 10 with average 4000 and department 20 with average 4333.33. On the right, the analytic version, AVG OVER PARTITION BY dept, keeps all seven rows and adds the dept_avg column with each person’s department average.</desc>
