<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dove si colloca Salt nel disegno delle schermate</title>
<desc id="d">Quattro fasi affiancate, ognuna con la stessa schermata di login: lo schizzo, fatto a mano; il wireframe, in bianco e nero, evidenziato con il bollino Salt; il mockup, a colori; e il prototipo, con un cursore che clicca il pulsante. Sotto, due frecce mostrano che fedeltà e costo del cambiamento crescono da sinistra a destra.</desc>
