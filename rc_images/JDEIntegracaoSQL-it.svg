<text x="125.0" y="170.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Integrazione</text>
<text x="125.0" y="189.3" font-size="12.5" fill="#3E3350" text-anchor="middle">Orchestrator, Z-file</text>
