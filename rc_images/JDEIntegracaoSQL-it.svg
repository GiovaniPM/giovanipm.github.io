<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 564" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Percorso supportato e SQL diretto</title>
<desc id="d">Nel percorso supportato, l'integrazione passa per l'Orchestrator o per una Z-file e per l'applicazione o la master business function, che gestiscono validazioni e UDC, next number dalla F0002, tabelle correlate, saldi in F0902 e F41021, audit, workflow e sicurezza di JDE, lasciando il database coerente. Con INSERT o UPDATE diretto, lo script SQL o l'ETL salta tutto il livello di business e lascia il database incoerente: saldi che non quadrano, numeri duplicati, righe orfane e nessuna traccia di audit. La lettura è diversa: viste, replica e utente in sola lettura, convertendo date giuliane e decimali impliciti.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="564" rx="18" fill="#FFF7EC"/>
