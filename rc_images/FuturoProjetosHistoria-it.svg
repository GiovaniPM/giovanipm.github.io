<text x="635" y="144" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">1ª edizione del</text><text x="635" y="162" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">PMBOK e</text><text x="635" y="180" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">PRINCE2</text>
