<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Breve storia della gestione dei progetti</title>
<desc id="d">Linea del tempo della gestione dei progetti: anni 1910, Henry Gantt crea il diagramma a barre; 1942, Progetto Manhattan; 1957 e 1958, CPM alla DuPont e PERT nel programma Polaris; dal 1965 al 1969, nascono IPMA e PMI; 1970, Royce descrive il modello a cascata; 1994 e 1995, rapporto CHAOS e Scrum; 1996, prima edizione del PMBOK e PRINCE2; 2001, Manifesto Agile; 2021, PMBOK 7 basato su principi e valore; 2025, PMBOK 8 e IA nella gestione. Tre ere: ingegneria e difesa, professionalizzazione, agile e valore.</desc>
<rect width="1000" height="510" rx="18" fill="#FFF7EC"/>
<text x="500" y="52" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Breve storia della gestione dei progetti</text>
