<text x="905" y="382" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">PMBOK 8 e</text><text x="905" y="400" font-size="14" font-weight="400" fill="#3E3350" text-anchor="middle">IA nella gestione</text>
