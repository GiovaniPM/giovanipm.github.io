<rect x="328" y="452" width="348" height="34" rx="17" fill="#5B2A86" opacity=".14"/>
<text x="502.0" y="475" font-size="15" font-weight="700" fill="#5B2A86" text-anchor="middle">Professionalizzazione</text>
<rect x="682" y="262" width="278" height="16" fill="#2A9D8F"/>
<rect x="688" y="452" width="266" height="34" rx="17" fill="#2A9D8F" opacity=".14"/>
<text x="821.0" y="475" font-size="15" font-weight="700" fill="#2A9D8F" text-anchor="middle">Agile e valore</text>
