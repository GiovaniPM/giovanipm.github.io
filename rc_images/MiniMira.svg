<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">Dois jeitos de dirigir com o mouse</title>
<desc id="d">Dois painéis. À esquerda, o modo Mira: um carro numa reta, o cursor à frente e acima, uma linha amarela do carro ao cursor e um arco marcando o erro de direção entre o nariz do carro e o cursor; o carro vira para fechar esse ângulo. À direita, o modo Volante: uma linha tracejada no centro da tela, o cursor à direita dela, uma seta amarela indicando a distância do centro e um volante girado para a direita. Abaixo, a nota de que o ângulo máximo das rodas cai de 26 graus parado para cerca de 4 graus a 300 km/h.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="500.0" y="40.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#2B1B3D">Dois jeitos de dirigir com o mouse</text>
<clipPath id="cp"><rect x="30" y="70" width="450" height="330" rx="14"/></clipPath>
<rect x="30" y="70" width="450" height="330" rx="14" fill="#5A9A55"/>
<path d="M30 300 Q 255 300 330 190 T 480 120" stroke="#4A4D52" stroke-width="56" fill="none" clip-path="url(#cp)"/>
<g transform="translate(150 300) rotate(0)"><rect x="-26" y="-6" width="52" height="12" rx="6" fill="#E63946"/><rect x="-30" y="-14" width="7" height="28" fill="#222"/><rect x="21" y="-13" width="6" height="26" fill="#222"/><rect x="-20" y="-15" width="10" height="6" fill="#111"/><rect x="-20" y="9" width="10" height="6" fill="#111"/><rect x="12" y="-14" width="9" height="5" fill="#111"/><rect x="12" y="9" width="9" height="5" fill="#111"/><circle cx="0" cy="0" r="4" fill="#FFD43B"/></g>
<line x1="176" y1="300" x2="390" y2="300" stroke="#fff" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="150" y1="300" x2="380" y2="170" stroke="#FFD43B" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M290 300 A140 140 0 0 0 272 232" stroke="#FFD43B" stroke-width="3" fill="none"/>
<g transform="translate(380 170)"><path d="M0 0 L0 22 L6 16 L11 27 L15 25 L10 14 L18 14 Z" fill="#fff" stroke="#111" stroke-width="1.5"/></g>
<text x="300.0" y="262.0" font-size="14" text-anchor="start" font-weight="bold" fill="#FFF">erro de direção</text>
<text x="255.0" y="105.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#FFF">Mira (padrão)</text>
<text x="255.0" y="430.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#2B1B3D">O carro vira as rodas para apontar para o cursor.</text>
<text x="255.0" y="448.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#2B1B3D">Quanto maior o ângulo entre o nariz do carro e o</text>
<text x="255.0" y="467.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#2B1B3D">cursor, mais ele vira, até o limite da velocidade.</text>
<rect x="520" y="70" width="450" height="330" rx="14" fill="#5A9A55"/>
<line x1="745" y1="80" x2="745" y2="390" stroke="#fff" stroke-width="2" stroke-dasharray="6 6"/>
<text x="745.0" y="105.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#FFF">Volante</text>
<g transform="translate(745 300) rotate(-90)"><rect x="-26" y="-6" width="52" height="12" rx="6" fill="#E63946"/><rect x="-30" y="-14" width="7" height="28" fill="#222"/><rect x="21" y="-13" width="6" height="26" fill="#222"/><rect x="-20" y="-15" width="10" height="6" fill="#111"/><rect x="-20" y="9" width="10" height="6" fill="#111"/><rect x="12" y="-14" width="9" height="5" fill="#111"/><rect x="12" y="9" width="9" height="5" fill="#111"/><circle cx="0" cy="0" r="4" fill="#FFD43B"/></g>
<g transform="translate(860 190)"><path d="M0 0 L0 22 L6 16 L11 27 L15 25 L10 14 L18 14 Z" fill="#fff" stroke="#111" stroke-width="1.5"/></g>
<line x1="745" y1="215" x2="856" y2="215" stroke="#FFD43B" stroke-width="3"/><path d="M856 215 l-10 -6 v12 z" fill="#FFD43B"/>
<text x="800.0" y="240.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFF">distância do centro</text>
<circle cx="890" cy="330" r="34" fill="none" stroke="#fff" stroke-width="5"/><line x1="890" y1="330" x2="890" y2="296" stroke="#fff" stroke-width="5" transform="rotate(35 890 330)"/><line x1="858" y1="330" x2="922" y2="330" stroke="#fff" stroke-width="5" transform="rotate(35 890 330)"/>
<text x="745.0" y="430.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#2B1B3D">A distância do mouse ao centro da tela, para a</text>
<text x="745.0" y="448.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#2B1B3D">esquerda ou para a direita, é o quanto o volante</text>
<text x="745.0" y="467.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#2B1B3D">está virado. Funciona melhor com a câmera que gira</text>
<text x="745.0" y="486.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#2B1B3D">com o carro.</text>
<text x="500.0" y="530.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">Nos dois modos, o quanto as rodas podem virar diminui com a velocidade: a 0 km/h, até 26°; a 300 km/h, cerca de 4°.</text>
</g>
</svg>
