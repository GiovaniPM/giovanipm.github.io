<text x="654" y="388" font-family="Consolas, 'Courier New', monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">CONNECT BY </tspan><tspan fill="#5FD3C4">PRIOR</tspan><tspan fill="#F7F0FF"> id = parent_id</tspan></text>
<text x="654.0" y="416.0" font-size="12.5" fill="#F7F0FF" xml:space="preserve">PRIOR marks the parent row’s column:</text>
<text x="654.0" y="436.0" font-size="12.5" fill="#F7F0FF" xml:space="preserve">the parent’s id = the child’s parent_id.</text>
<text x="654.0" y="456.0" font-size="12.5" fill="#F7F0FF" xml:space="preserve">Moving PRIOR to the other side</text>
<text x="654.0" y="476.0" font-size="12.5" fill="#F7F0FF" xml:space="preserve">reverses it: leaf up to root.</text>
<text x="500.0" y="530.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">LEVEL is the depth: 1 at the roots (null parent_id), 2 for direct replies, and so on.</text>
</svg>
