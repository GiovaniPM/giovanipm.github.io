<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Hierarchical query: from root to leaves</title>
<desc id="d">On the left, two message trees. The first starts at message 1, by User 1, at level 1, and goes down through replies 2, 3, 4 and 5, at levels 2 to 5. The second starts at message 6, by User 23, with reply 7 at level 2. On the right, the table with id, login and parent_id, where roots 1 and 6 have a null parent_id, and the clause CONNECT BY PRIOR id = parent_id, explaining that PRIOR marks the parent row’s column.</desc>
