<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" role="img" aria-labelledby="t d" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif"><title id="t">Um ciclo seguro com IA</title><desc id="d">Seis passos: descrever o processo, a IA gera o XML, importar no app, conferir em Verificar, simular com cenários de teste e revisar com quem conhece o processo, voltando à IA se for preciso. Descrever e revisar são tarefas humanas.</desc><style>:root{--b-fill:#fff;--b-line:#2B1B3D;--b-muted:#5E5170;--b-pool:#fff;--b-font:'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;--b-mono:Consolas,monospace}
.grid-dot{fill:var(--dot)}
.b-fill{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-line{fill:none;stroke:var(--b-line);stroke-width:1.6}
.b-thin{fill:none;stroke:var(--b-line);stroke-width:1.2}
.b-ink{fill:var(--b-line);stroke:none}
.b-blank{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.2}
.b-text{fill:var(--b-line);font:12px var(--b-font);text-anchor:middle;pointer-events:none}
.b-note{fill:var(--b-line);font:12px var(--b-font);text-anchor:start;pointer-events:none}
.b-small{fill:var(--b-muted);font:10.5px var(--b-mono);text-anchor:middle;pointer-events:none}
.b-event{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-end{fill:var(--b-fill);stroke:var(--b-line);stroke-width:3.4}
.b-gw{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-pool{fill:var(--b-pool);stroke:var(--b-line);stroke-width:1.6}
.b-lane{fill:none;stroke:var(--b-line);stroke-width:1}
.b-group{fill:none;stroke:var(--b-line);stroke-width:1.4;stroke-dasharray:9 4 2 4}
.b-seq{fill:none;stroke:var(--b-line);stroke-width:1.5;marker-end:url(#m-seq)}
.b-msg{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:7 5;marker-start:url(#m-msg-start);marker-end:url(#m-msg-end)}
.b-assoc{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.b-assoc.one{marker-end:url(#m-open)}
.b-assoc.both{marker-start:url(#m-open-s);marker-end:url(#m-open)}
.b-data{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round;marker-end:url(#m-open)}
.b-text{font-size:12px}</style><defs><marker id="m-seq" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="m-msg-end" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11z" fill="#fff" stroke="#2B1B3D" stroke-width="1.2"/></marker><marker id="m-msg-start" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#2B1B3D" stroke-width="1.4"/></marker><marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker><marker id="m-open-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 1 6 11 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker></defs><rect width="1000" height="316" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Um ciclo seguro com IA</text><rect x="27" y="84" width="146" height="130" rx="12" fill="#FFF1C9" stroke="#E8B23E"/><circle cx="100" cy="84" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="100" y="89" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="120" font-size="14.5" fill="#2B1B3D" font-weight="700" text-anchor="middle">Descrever</text><text x="100" y="142" font-size="12" fill="#5E5170" text-anchor="middle">o processo real, sem</text><text x="100" y="157" font-size="12" fill="#5E5170" text-anchor="middle">dados sensíveis</text><path d="M174 149H185" stroke="#5E5170" stroke-width="2.2" marker-end="url(#m-seq)"/><rect x="187" y="84" width="146" height="130" rx="12" fill="#fff" stroke="#E2D3BC"/><circle cx="260" cy="84" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="260" y="89" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="260" y="120" font-size="14.5" fill="#2B1B3D" font-weight="700" text-anchor="middle">Gerar</text><text x="260" y="142" font-size="12" fill="#5E5170" text-anchor="middle">a IA escreve o BPMN</text><text x="260" y="157" font-size="12" fill="#5E5170" text-anchor="middle">XML</text><path d="M334 149H345" stroke="#5E5170" stroke-width="2.2" marker-end="url(#m-seq)"/><rect x="347" y="84" width="146" height="130" rx="12" fill="#fff" stroke="#E2D3BC"/><circle cx="420" cy="84" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="420" y="89" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="420" y="120" font-size="14.5" fill="#2B1B3D" font-weight="700" text-anchor="middle">Importar</text><text x="420" y="142" font-size="12" fill="#5E5170" text-anchor="middle">Ver ou colar XML, no</text><text x="420" y="157" font-size="12" fill="#5E5170" text-anchor="middle">app</text><path d="M494 149H505" stroke="#5E5170" stroke-width="2.2" marker-end="url(#m-seq)"/><rect x="507" y="84" width="146" height="130" rx="12" fill="#fff" stroke="#E2D3BC"/><circle cx="580" cy="84" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="580" y="89" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="580" y="120" font-size="14.5" fill="#2B1B3D" font-weight="700" text-anchor="middle">Verificar</text><text x="580" y="142" font-size="12" fill="#5E5170" text-anchor="middle">erros de norma e</text><text x="580" y="157" font-size="12" fill="#5E5170" text-anchor="middle">impasses</text><path d="M654 149H665" stroke="#5E5170" stroke-width="2.2" marker-end="url(#m-seq)"/><rect x="667" y="84" width="146" height="130" rx="12" fill="#fff" stroke="#E2D3BC"/><circle cx="740" cy="84" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="740" y="89" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="740" y="120" font-size="14.5" fill="#2B1B3D" font-weight="700" text-anchor="middle">Testar</text><text x="740" y="142" font-size="12" fill="#5E5170" text-anchor="middle">cenários e simulação</text><path d="M814 149H825" stroke="#5E5170" stroke-width="2.2" marker-end="url(#m-seq)"/><rect x="827" y="84" width="146" height="130" rx="12" fill="#FFF1C9" stroke="#E8B23E"/><circle cx="900" cy="84" r="12.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="900" y="89" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="900" y="120" font-size="14.5" fill="#2B1B3D" font-weight="700" text-anchor="middle">Revisar</text><text x="900" y="142" font-size="12" fill="#5E5170" text-anchor="middle">com quem faz o</text><text x="900" y="157" font-size="12" fill="#5E5170" text-anchor="middle">trabalho</text><path d="M900 214V250H260V218" fill="none" stroke="#5E5170" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-seq)"/><text x="500" y="268" font-size="13" fill="#5E5170" text-anchor="middle">Achou erro? Volte ao passo 2 com a correção.</text><rect x="300" y="284" width="16" height="16" rx="3" fill="#FFF1C9" stroke="#E8B23E"/><text x="322" y="297" font-size="13" fill="#5E5170">Passos que continuam sendo de pessoas</text></svg>
