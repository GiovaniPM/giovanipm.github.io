<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">A thousand years of checkers</title>
<desc id="d">Timeline: alquerque in the 10th century, fierges in the 12th, the alquerque rules in 1283, forced capture around 1535, the first book in 1547, the 10 by 10 board in the 17th century, Payne’s book in 1756, the world federation in 1947, Samuel’s paper in 1959, the first Brazilian federation in 1963, Tinsley against Chinook in 1992 and the solution of the American game in 2007.</desc>
<rect width="1000" height="780" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">A thousand years of checkers</text>
<line x1="192" y1="92" x2="192" y2="746" stroke="#D8C8B0" stroke-width="3"/><text x="172" y="110" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">10th c.</text><circle cx="192" cy="104" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="109" font-size="15.5" fill="#2B1B3D">First certain mention of quirkat, or alquerque, the likely ancestor</text><text x="172" y="166" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">12th c.</text><circle cx="192" cy="160" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="165" font-size="15.5" fill="#2B1B3D">Fierges appears in Europe: date and place are still debated</text><text x="172" y="222" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1283</text><circle cx="192" cy="216" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="221" font-size="15.5" fill="#2B1B3D">Alfonso X’s Book of Games describes the rules of alquerque</text><text x="172" y="278" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">c. 1535</text><circle cx="192" cy="272" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="277" font-size="15.5" fill="#2B1B3D">Forced capture is attributed to France: jeu forcé is born</text><text x="172" y="334" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1547</text><circle cx="192" cy="328" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="333" font-size="15.5" fill="#2B1B3D">Antonio Torquemada publishes the first book on the game in Valencia</text><text x="172" y="390" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1617–1635</text><circle cx="192" cy="384" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="389" font-size="15.5" fill="#2B1B3D">The 10 × 10 board appears in Holland</text><text x="172" y="446" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1756</text><circle cx="192" cy="440" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="445" font-size="15.5" fill="#2B1B3D">William Payne publishes the first book in English</text><text x="172" y="502" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1947</text><circle cx="192" cy="496" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="501" font-size="15.5" fill="#2B1B3D">The World Draughts Federation is founded</text><text x="172" y="558" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1959</text><circle cx="192" cy="552" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="557" font-size="15.5" fill="#2B1B3D">Arthur Samuel publishes his machine learning study using checkers</text><text x="172" y="614" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1963</text><circle cx="192" cy="608" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="613" font-size="15.5" fill="#2B1B3D">The first Brazilian checkers federation is founded in São Paulo</text><text x="172" y="670" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1992</text><circle cx="192" cy="664" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="669" font-size="15.5" fill="#2B1B3D">Marion Tinsley beats Chinook 4 to 2, with 33 draws</text><text x="172" y="726" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">2007</text><circle cx="192" cy="720" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="725" font-size="15.5" fill="#2B1B3D">American checkers is solved: perfect play ends in a draw</text>
</svg>
