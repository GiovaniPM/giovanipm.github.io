<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
<title id="t">Cómo leer el CFD (diagrama de flujo acumulado)</title>
<desc id="d">Gráfico de áreas apiladas en el tiempo con tres franjas: Terminado abajo, En curso en el medio y Por hacer arriba. La distancia vertical de la franja En curso en un día es el trabajo en curso, el WIP. La distancia horizontal entre entrar en curso y terminar aproxima el tiempo de ciclo. La pendiente de la franja Terminado es el throughput. Abajo, la ley de Little: tiempo de ciclo medio igual al WIP medio dividido entre el throughput medio.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#FFF7EC"/>
