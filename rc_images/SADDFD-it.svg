<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Diagramma di flusso dei dati (DFD)</title>
<desc id="d">Legenda con i quattro simboli del DFD: rettangolo per l’entità esterna, cerchio per il processo, freccia per il flusso di dati e rettangolo aperto per l’archivio dati. Sotto, un DFD di biblioteca: lo studente invia una richiesta al processo 1.0 Prestare libro, che consulta l’archivio D1 Libri, registra in D2 Prestiti e restituisce una ricevuta. Lo studente consegna il libro al processo 2.0 Restituire libro, che chiude il prestito in D2 e invia un avviso di ritardo al bibliotecario.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Diagramma di flusso dei dati (DFD)</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">I quattro simboli e un DFD di livello 1 di una biblioteca</text>
<rect x="60.0" y="102.0" width="56.0" height="38.0" rx="2" fill="#E1ECFF" stroke="#2B1B3D" stroke-width="2"/>
<text x="128.0" y="118.0" font-size="13" fill="#2B1B3D" font-weight="700">Entità esterna</text>
<text x="128.0" y="135.0" font-size="12" fill="#3E3350">origine o destinazione</text>
<circle cx="324" cy="121" r="22" fill="#EFE3FA" stroke="#2B1B3D" stroke-width="2"/>
<text x="356.0" y="118.0" font-size="13" fill="#2B1B3D" font-weight="700">Processo</text>
<text x="356.0" y="135.0" font-size="12" fill="#3E3350">trasforma i dati</text>
<line x1="540.0" y1="121.0" x2="590.0" y2="121.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="600.0" y="118.0" font-size="13" fill="#2B1B3D" font-weight="700">Flusso di dati</text>
<text x="600.0" y="135.0" font-size="12" fill="#3E3350">dati in movimento</text>
<path d="M816 104 H760 V138 H816" stroke="#2B1B3D" stroke-width="2" fill="#FFF1C9"/>
<text x="826.0" y="118.0" font-size="13" fill="#2B1B3D" font-weight="700">Archivio dati</text>
<text x="826.0" y="135.0" font-size="12" fill="#3E3350">dati conservati</text>
<line x1="40" y1="162" x2="960" y2="162" stroke="#E4D5C0" stroke-width="1.5"/>
<rect x="40.0" y="330.0" width="140.0" height="60.0" rx="2" fill="#E1ECFF" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="110.0" y="366.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Studente</text>
<rect x="800.0" y="460.0" width="160.0" height="56.0" rx="2" fill="#E1ECFF" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="880.0" y="494.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Bibliotecario</text>
<circle cx="420" cy="250" r="58" fill="#EFE3FA" stroke="#2B1B3D" stroke-width="2.5"/>
<line x1="370" y1="232" x2="470" y2="232" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="420.0" y="224.0" font-size="12" fill="#756986" text-anchor="middle" font-weight="700">1.0</text>
<text x="420.0" y="252.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Prestare</text>
<text x="420.0" y="269.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">libro</text>
<circle cx="420" cy="450" r="58" fill="#EFE3FA" stroke="#2B1B3D" stroke-width="2.5"/>
<line x1="370" y1="432" x2="470" y2="432" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="420.0" y="424.0" font-size="12" fill="#756986" text-anchor="middle" font-weight="700">2.0</text>
<text x="420.0" y="452.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Restituire</text>
<text x="420.0" y="469.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">libro</text>
<path d="M850 205 H640 V245 H850" stroke="#2B1B3D" stroke-width="2.5" fill="#FFF1C9"/><line x1="684" y1="205" x2="684" y2="245" stroke="#2B1B3D" stroke-width="2"/><text x="662.0" y="231.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">D1</text><text x="696.0" y="231.0" font-size="13.5" fill="#2B1B3D">Libri</text>
<path d="M850 345 H640 V385 H850" stroke="#2B1B3D" stroke-width="2.5" fill="#FFF1C9"/><line x1="684" y1="345" x2="684" y2="385" stroke="#2B1B3D" stroke-width="2"/><text x="662.0" y="371.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">D2</text><text x="696.0" y="371.0" font-size="13.5" fill="#2B1B3D">Prestiti</text>
<line x1="182.0" y1="342.0" x2="364.0" y2="262.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="262.0" y="284.0" font-size="12" fill="#3E3350" text-anchor="middle">richiesta</text>
<path d="M368 282 Q 300 340 184 378" stroke="#2B1B3D" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
