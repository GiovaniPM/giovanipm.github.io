<line x1="638.0" y1="225.0" x2="480.0" y2="244.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="560.0" y="222.0" font-size="12" fill="#3E3350" text-anchor="middle">stato del libro</text>
<line x1="472.0" y1="276.0" x2="638.0" y2="360.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="566.0" y="302.0" font-size="12" fill="#3E3350" text-anchor="middle">prestito</text>
<line x1="182.0" y1="384.0" x2="366.0" y2="440.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="262.0" y="430.0" font-size="12" fill="#3E3350" text-anchor="middle">restituzione</text>
<line x1="474.0" y1="432.0" x2="638.0" y2="380.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="566.0" y="426.0" font-size="12" fill="#3E3350" text-anchor="middle">chiusura</text>
<line x1="478.0" y1="466.0" x2="796.0" y2="486.0" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="640.0" y="494.0" font-size="12" fill="#3E3350" text-anchor="middle">avviso di ritardo</text>
</svg>
