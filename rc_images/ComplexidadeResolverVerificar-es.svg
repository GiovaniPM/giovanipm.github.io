<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Resolver es difícil, verificar es fácil</title>
<desc id="d">Dos paneles con un Sudoku de 4 por 4. A la izquierda, resolver: la cuadrícula tiene solo algunos números y hay que probar, equivocarse y volver atrás; en un Sudoku gigante los intentos crecen de forma explosiva. A la derecha, verificar: la cuadrícula está completa y basta comprobar que cada fila, columna y cuadrado de 2 por 2 tenga los números 1, 2, 3 y 4. Abajo: NP son los problemas cuya respuesta es fácil de verificar; P, los fáciles de resolver; la pregunta P igual a NP pregunta si, siempre que verificar es fácil, también lo es resolver.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
