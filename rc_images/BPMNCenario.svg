<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" role="img" aria-labelledby="t d" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif"><title id="t">Anatomia de um cenário de teste</title><desc id="d">Dado que o valor é 800 e o comprovante é válido; quando o gateway segue pela condição; então o caso termina em Reembolso pago e passa por Aprovar reembolso. O resultado mostra uma conferência que passou e outra que falhou.</desc><style>:root{--b-fill:#fff;--b-line:#2B1B3D;--b-muted:#5E5170;--b-pool:#fff;--b-font:'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;--b-mono:Consolas,monospace}
.grid-dot{fill:var(--dot)}
.b-fill{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-line{fill:none;stroke:var(--b-line);stroke-width:1.6}
.b-thin{fill:none;stroke:var(--b-line);stroke-width:1.2}
.b-ink{fill:var(--b-line);stroke:none}
.b-blank{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.2}
.b-text{fill:var(--b-line);font:12px var(--b-font);text-anchor:middle;pointer-events:none}
.b-note{fill:var(--b-line);font:12px var(--b-font);text-anchor:start;pointer-events:none}
.b-small{fill:var(--b-muted);font:10.5px var(--b-mono);text-anchor:middle;pointer-events:none}
.b-event{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-end{fill:var(--b-fill);stroke:var(--b-line);stroke-width:3.4}
.b-gw{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-pool{fill:var(--b-pool);stroke:var(--b-line);stroke-width:1.6}
.b-lane{fill:none;stroke:var(--b-line);stroke-width:1}
.b-group{fill:none;stroke:var(--b-line);stroke-width:1.4;stroke-dasharray:9 4 2 4}
.b-seq{fill:none;stroke:var(--b-line);stroke-width:1.5;marker-end:url(#m-seq)}
.b-msg{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:7 5;marker-start:url(#m-msg-start);marker-end:url(#m-msg-end)}
.b-assoc{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.b-assoc.one{marker-end:url(#m-open)}
.b-assoc.both{marker-start:url(#m-open-s);marker-end:url(#m-open)}
.b-data{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round;marker-end:url(#m-open)}
.b-text{font-size:12px}</style><defs><marker id="m-seq" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="m-msg-end" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11z" fill="#fff" stroke="#2B1B3D" stroke-width="1.2"/></marker><marker id="m-msg-start" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#2B1B3D" stroke-width="1.4"/></marker><marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker><marker id="m-open-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 1 6 11 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker></defs><rect width="1000" height="378" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Anatomia de um cenário de teste</text><rect x="24" y="66" width="308" height="186" rx="12" fill="#fff" stroke="#E2D3BC"/><rect x="24" y="66" width="308" height="36" rx="12" fill="#FFF1C9"/><text x="40" y="90" font-size="16" fill="#2B1B3D" font-weight="700">Dado que</text><text x="40" y="128" font-size="13.5" fill="#2B1B3D">valor = 800</text><text x="40" y="176" font-size="13.5" fill="#2B1B3D">comprovante_ok = true</text><rect x="346" y="66" width="308" height="186" rx="12" fill="#fff" stroke="#E2D3BC"/><rect x="346" y="66" width="308" height="36" rx="12" fill="#E2F6F2"/><text x="362" y="90" font-size="16" fill="#2B1B3D" font-weight="700">Quando</text><text x="362" y="128" font-size="13.5" fill="#2B1B3D">Decisões: automático, pelas condições</text><text x="362" y="176" font-size="13.5" fill="#2B1B3D">Eventos: nenhum forçado</text><rect x="668" y="66" width="308" height="186" rx="12" fill="#fff" stroke="#E2D3BC"/><rect x="668" y="66" width="308" height="36" rx="12" fill="#EFE6FA"/><text x="684" y="90" font-size="16" fill="#2B1B3D" font-weight="700">Então</text><text x="684" y="128" font-size="13.5" fill="#2B1B3D">Passa por Aprovar reembolso</text><text x="684" y="176" font-size="13.5" fill="#2B1B3D">Termina em Reembolso pago</text><rect x="24" y="266" width="952" height="96" rx="12" fill="#fff" stroke="#E2D3BC"/><circle cx="46" cy="287" r="11" fill="#1F7A4D"/><text x="46" y="292" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">✓</text><text x="66" y="292" font-size="14" fill="#2B1B3D">Passa por Aprovar reembolso</text><circle cx="46" cy="317" r="11" fill="#A9371E"/><text x="46" y="322" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">✗</text><text x="66" y="322" font-size="14" fill="#2B1B3D">Exemplo de falha: Não passa por Aprovar reembolso (passou 1 vez)</text></svg>
