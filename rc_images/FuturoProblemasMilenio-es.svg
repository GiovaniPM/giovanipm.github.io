<text x="824" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Yang–Mills y el</text>
<text x="824" y="149" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">salto de masa</text>
<text x="824" y="176" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">La base matemática</text>
<text x="824" y="193" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">de la física de partículas</text>
<rect x="792.4" y="224" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="824" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Abierto</text>
