<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Los siete Problemas del Milenio</title>
<desc id="d">Siete tarjetas con los Problemas del Milenio del Clay Mathematics Institute, de 2000, cada uno con un premio de 1 millón de dólares. Abiertos: la hipótesis de Riemann, sobre la distribución de los números primos; P contra NP, si verificar una respuesta es tan fácil como encontrarla; Navier–Stokes, sobre las ecuaciones de los fluidos; Yang–Mills y el salto de masa, base matemática de la física de partículas; la conjetura de Hodge; y Birch y Swinnerton-Dyer, sobre las curvas elípticas. Resuelto: la conjetura de Poincaré, por Perelman en 2003, que rechazó el premio en 2010.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
