<text x="500" y="306" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Birch y</text>
<text x="500" y="325" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Swinnerton-Dyer</text>
<text x="500" y="352" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Soluciones racionales</text>
<text x="500" y="369" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">de las curvas elípticas</text>
<rect x="468.4" y="400" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="500" y="416" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Abierto</text>
<rect x="616" y="276" width="200" height="158" rx="12" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="716" y="306" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Conjetura de Poincaré</text>
<text x="716" y="333" font-size="12.5" fill="#E6F5F2" text-anchor="middle" font-style="italic">Caracteriza la esfera</text>
<text x="716" y="350" font-size="12.5" fill="#E6F5F2" text-anchor="middle" font-style="italic">en tres dimensiones</text>
<text x="716" y="373" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Perelman, 2003</text>
<rect x="680.8" y="400" width="70.4" height="22" rx="11" fill="#FFFFFF"/>
<text x="716" y="416" font-size="12" fill="#2A9D8F" text-anchor="middle" font-weight="700">Resuelto</text>
<text x="500" y="478" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">6 de 7 siguen abiertos. Perelman rechazó el premio en 2010.</text>
</svg>
