<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Clay Mathematics Institute, 2000 · 1 millón de dólares por problema</text>
<rect x="76" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="176" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Hipótesis de Riemann</text>
<text x="176" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Cómo se distribuyen</text>
<text x="176" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">los números primos</text>
<rect x="144.4" y="224" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="176" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Abierto</text>
<rect x="292" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="392" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">P contra NP</text>
<text x="392" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">¿Verificar una respuesta es</text>
<text x="392" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">tan fácil como encontrarla?</text>
<rect x="360.4" y="224" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="392" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Abierto</text>
<rect x="508" y="100" width="200" height="158" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<text x="608" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Navier–Stokes</text>
<text x="608" y="157" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">¿Las ecuaciones de los fluidos</text>
<text x="608" y="174" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">siempre tienen soluciones suaves?</text>
<rect x="576.4" y="224" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="608" y="240" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Abierto</text>
