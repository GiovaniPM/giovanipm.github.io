<text x="284" y="333" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Formas geométricas</text>
<text x="284" y="350" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">descritas por el álgebra</text>
<rect x="252.4" y="400" width="63.2" height="22" rx="11" fill="#FF6B6B"/>
<text x="284" y="416" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Abierto</text>
