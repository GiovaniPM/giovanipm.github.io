<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Como escolher o método de integração no JD Edwards</title>
<desc id="d">Árvore de decisão. Precisa ser em tempo real? Se sim e o JDE recebe dados: Orchestrator/AIS, ou BSSV em Tools antigo. Se sim e o JDE envia: RTE ou notificações do Orchestrator. Se não, em lote: documento padrão com parceiro, X12 ou EDIFACT, leva ao EDI com tabelas F47; layout de arquivo próprio leva a UBE ou Table Conversion; senão, Z-files com o UBE processador padrão. Leitura para BI por SQL em views é aceitável; escrita direta no banco não.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="650" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Como escolher o método de integração</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Latência, direção do fluxo e natureza dos dados definem o caminho</text>
<rect x="410" y="92" width="180" height="40" rx="20" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="2"/>
<text x="500.0" y="117.4" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Nova integração</text>
<polyline points="500,132 500,150" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polygon points="366.0,152.0 634.0,152.0 650.0,182 634.0,212.0 366.0,212.0 350.0,182" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="500" y="187.4" font-size="15" fill="#2B1B3D" text-anchor="middle">Precisa ser em tempo real?</text>
<polyline points="350,182 230,182 230,238" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="290" y="173" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">sim</text>
<polygon points="126.0,240.0 334.0,240.0 350.0,270 334.0,300.0 126.0,300.0 110.0,270" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="230" y="265.8" font-size="14" fill="#2B1B3D" text-anchor="middle">O JDE recebe</text>
<text x="230" y="284.3" font-size="14" fill="#2B1B3D" text-anchor="middle">ou envia dados?</text>
<polyline points="170,300 170,318 130,318 130,348" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="120" y="336" font-size="12.5" fill="#756986" text-anchor="end" font-style="italic">recebe</text>
<polyline points="290,300 290,318 360,318 360,348" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="370" y="336" font-size="12.5" fill="#756986" text-anchor="start" font-style="italic">envia</text>
<rect x="30" y="350" width="200" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="130.0" y="376.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Orchestrator / AIS</text>
<text x="130.0" y="396.3" font-size="13.5" fill="#3E3350" text-anchor="middle">REST / JSON</text>
<rect x="260" y="350" width="200" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="360.0" y="376.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">RTE ou notificações</text>
<text x="360.0" y="396.3" font-size="13.5" fill="#3E3350" text-anchor="middle">do Orchestrator</text>
<text x="130" y="434" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">Tools antigo sem AIS: BSSV</text>
<text x="130" y="452" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">(ou legado a migrar)</text>
<polyline points="650,182 720,182 720,238" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="690" y="173" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">não, lote</text>
<polygon points="606.0,240.0 834.0,240.0 850.0,270 834.0,300.0 606.0,300.0 590.0,270" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="720" y="265.8" font-size="14" fill="#2B1B3D" text-anchor="middle">Documento padrão com</text>
<text x="720" y="284.3" font-size="14" fill="#2B1B3D" text-anchor="middle">parceiro (X12, EDIFACT)?</text>
<polyline points="850,270 900,270 900,348" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="872" y="261" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">sim</text>
<rect x="820" y="350" width="160" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="900.0" y="376.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">EDI</text>
<text x="900.0" y="396.3" font-size="13.5" fill="#3E3350" text-anchor="middle">tabelas F47 + R47</text>
<polyline points="690,300 690,348" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="700" y="330" font-size="12.5" fill="#756986" text-anchor="start" font-style="italic">não</text>
<polygon points="576.0,350.0 784.0,350.0 800.0,380 784.0,410.0 576.0,410.0 560.0,380" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="680" y="375.8" font-size="14" fill="#2B1B3D" text-anchor="middle">Layout de arquivo próprio</text>
<text x="680" y="394.3" font-size="14" fill="#2B1B3D" text-anchor="middle">(CNAB, fiscal, CSV)?</text>
<polyline points="620,410 620,430 580,430 580,458" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="570" y="448" font-size="12.5" fill="#756986" text-anchor="end" font-style="italic">sim</text>
<polyline points="740,410 740,430 820,430 820,458" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="830" y="448" font-size="12.5" fill="#756986" text-anchor="start" font-style="italic">não</text>
<rect x="480" y="460" width="200" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="580.0" y="486.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE / Table</text>
<text x="580.0" y="506.3" font-size="13.5" fill="#3E3350" text-anchor="middle">Conversion</text>
<rect x="720" y="460" width="220" height="62" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="830.0" y="486.5" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Z-files + UBE</text>
<text x="830.0" y="506.3" font-size="13.5" fill="#3E3350" text-anchor="middle">processador padrão</text>
<rect x="40" y="560" width="440" height="66" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="260.0" y="588.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Só leitura para BI e relatórios?</text>
<text x="260.0" y="607.3" font-size="12.5" fill="#3E3350" text-anchor="middle">SQL em views ou réplica é aceitável</text>
<rect x="520" y="560" width="440" height="66" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="740.0" y="588.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Escrita direta no banco (INSERT/UPDATE)</text>
<text x="740.0" y="607.3" font-size="12.5" fill="#3E3350" text-anchor="middle">não: ignora validações e next numbers</text>
</svg>
