<ellipse cx="500" cy="320" rx="120" ry="56" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="500.0" y="318.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">SDLC</text>
<text x="500.0" y="340.0" font-size="12.5" fill="#FCE4F0" text-anchor="middle">ciclo di vita</text>
<rect x="370.0" y="97.0" width="260.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
