<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cinque fasi, ognuna con il suo deliverable, e la manutenzione che alimenta il ciclo successivo</text>
<line x1="597.3" y1="177.2" x2="697.5" y2="220.6" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
<line x1="757.7" y1="331.1" x2="719.4" y2="401.4" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
