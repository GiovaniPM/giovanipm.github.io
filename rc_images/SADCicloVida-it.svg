<text x="688.8" y="259.8" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">2</text>
<text x="710.8" y="258.8" font-size="14" fill="#2B1B3D" font-weight="700">Analisi e specifica</text>
<text x="710.8" y="280.8" font-size="12" fill="#756986">→ specifica dei requisiti</text>
