<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 0 1160 720" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Compreendendo a estupidez humana</title>
<desc id="d">Compreendendo a estupidez humana. 1. Subestimação da estupidez: Todos subestimam quantas pessoas estúpidas existem. 2. Independência da estupidez: A estupidez não depende de outras características. 3. Definição de estupidez: Causar perda aos outros sem obter ganho para si mesmo. 4. Subestimação do dano: Os não estúpidos subestimam o dano que os estúpidos causam. 5. Perigo das pessoas estúpidas: O estúpido é o tipo mais perigoso de pessoa.</desc>
<rect x="-80" width="1160" height="720" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Compreendendo a estupidez humana</text>
<circle cx="500" cy="370" r="150" fill="#F1E2CF"/>
<g fill="none" stroke="#2B1B3D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<circle cx="500" cy="348" r="52" fill="#FFFFFF"/>
<circle cx="481" cy="336" r="13" fill="#FFFFFF"/><circle cx="519" cy="336" r="13" fill="#FFFFFF"/>
<circle cx="486" cy="332" r="4" fill="#2B1B3D"/><circle cx="524" cy="340" r="4" fill="#2B1B3D"/>
<path d="M476 366 q12 -9 24 0 q12 9 24 0"/>
<path d="M496 369 v12 a6 6 0 0 0 12 0 v-9" fill="#FF8A8A"/>
</g>
<text x="500" y="432" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="middle">As 5 leis de Cipolla</text>
<path d="M586.0 247.1 L609.0 214.4" stroke="#B35300" stroke-width="3"/>
<circle cx="609.0" cy="214.4" r="40" fill="#FFF1C9" stroke="#B35300" stroke-width="3.5"/>
<text x="609.0" y="226.4" font-size="34" font-weight="700" fill="#B35300" text-anchor="middle">1</text>
<text x="672" y="128" font-size="19" font-weight="700" fill="#B35300" text-anchor="start">Subestimação da estupidez</text>
<text x="672" y="154" font-size="15" fill="#3E3350" text-anchor="start">Todos subestimam quantas</text>
<text x="672" y="175" font-size="15" fill="#3E3350" text-anchor="start">pessoas estúpidas existem.</text>
<path d="M644.9 408.8 L683.5 419.2" stroke="#0E8074" stroke-width="3"/>
<circle cx="683.5" cy="419.2" r="40" fill="#DDF3EF" stroke="#0E8074" stroke-width="3.5"/>
<text x="683.5" y="431.2" font-size="34" font-weight="700" fill="#0E8074" text-anchor="middle">2</text>
<text x="752" y="392" font-size="19" font-weight="700" fill="#0E8074" text-anchor="start">Independência da estupidez</text>
<text x="752" y="418" font-size="15" fill="#3E3350" text-anchor="start">A estupidez não depende de</text>
<text x="752" y="439" font-size="15" fill="#3E3350" text-anchor="start">outras características.</text>
<path d="M500.0 520.0 L500.0 560.0" stroke="#C2185B" stroke-width="3"/>
<circle cx="500.0" cy="560.0" r="40" fill="#FDE4EA" stroke="#C2185B" stroke-width="3.5"/>
<text x="500.0" y="572.0" font-size="34" font-weight="700" fill="#C2185B" text-anchor="middle">3</text>
<text x="500" y="640" font-size="19" font-weight="700" fill="#C2185B" text-anchor="middle">Definição de estupidez</text>
<text x="500" y="666" font-size="15" fill="#3E3350" text-anchor="middle">Causar perda aos outros sem</text>
<text x="500" y="687" font-size="15" fill="#3E3350" text-anchor="middle">obter ganho para si mesmo.</text>
