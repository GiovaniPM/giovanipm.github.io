<circle cx="316.5" cy="419.2" r="40" fill="#EFE4FA" stroke="#5B2A86" stroke-width="3.5"/>
<text x="316.5" y="431.2" font-size="34" font-weight="700" fill="#5B2A86" text-anchor="middle">4</text>
<text x="248" y="392" font-size="19" font-weight="700" fill="#5B2A86" text-anchor="end">Subestimação do dano</text>
<text x="248" y="418" font-size="15" fill="#3E3350" text-anchor="end">Os não estúpidos subestimam</text>
<text x="248" y="439" font-size="15" fill="#3E3350" text-anchor="end">o dano que os estúpidos causam.</text>
<path d="M414.0 247.1 L391.0 214.4" stroke="#E04E6B" stroke-width="3"/>
