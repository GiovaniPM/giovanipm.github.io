<text x="328" y="128" font-size="19" font-weight="700" fill="#E04E6B" text-anchor="end">Perigo das pessoas estúpidas</text>
<text x="328" y="154" font-size="15" fill="#3E3350" text-anchor="end">O estúpido é o tipo</text>
<text x="328" y="175" font-size="15" fill="#3E3350" text-anchor="end">mais perigoso de pessoa.</text>
</svg>
