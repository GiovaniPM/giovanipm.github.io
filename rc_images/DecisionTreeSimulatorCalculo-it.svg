<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Come l&#39;app calcola il valore atteso del portatile</title><desc id="d">L&#39;albero del portatile con i valori: l&#39;incertezza vale 0,7 × 800 + 0,3 × 3.800 = 1.700; la decisione prende il più basso tra 1.700 e 3.000; la regola segue il ramo No perché il portatile è fuori garanzia.</desc><style>.dtw .n-shape{stroke-width:1.8}
.dtw .n-txt{fill:#1b2022;font:13px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif}
.dtw .n-num{fill:#60686c;font:600 10px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-val{fill:#1b2022;font:600 12px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-inner{fill:none;stroke-width:1}
.dtw .t-decision .n-shape{fill:#e4f0fb;stroke:#1f5f99}.dtw .t-decision .n-glyph{fill:#1f5f99}
.dtw .t-chance .n-shape{fill:#efeafa;stroke:#65509c}.dtw .t-chance .n-glyph{fill:#65509c}
.dtw .t-rule .n-shape{fill:#fdf0d0;stroke:#9a6a00}.dtw .t-rule .n-glyph{fill:#9a6a00}
.dtw .t-outcome .n-shape{fill:#dff3e4;stroke:#2b7a45}.dtw .t-outcome .n-glyph{fill:#2b7a45}.dtw .t-outcome .n-inner{stroke:#2b7a45}
.dtw .e-line{fill:none;stroke:#4a5358;stroke-width:1.6;stroke-linejoin:round}
.dtw .e-mark{fill:none;stroke:#4a5358;stroke-width:1.8}
.dtw .e-lab{fill:#1b2022;font:12px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;paint-order:stroke;stroke:#FFF7EC;stroke-width:4px;stroke-linejoin:round}
.dtw .edge.best .e-line{stroke:#1f7a3d;stroke-width:3}
.dtw .edge.rej .e-line{opacity:.55}
.dtw .edge.rej .e-lab{fill:#60686c}</style><rect width="1000" height="430" rx="18" fill="#FFF7EC"/><svg class="dtw" x="30" y="20" width="940" height="280" viewBox="-104 -16 1167 348"><g class="edge rej" data-edge="nmvxuhs9p6"><path class="e-line" d="M88 126.5H104Q110 126.5 110 120.5V38Q110 32 116 32H164"/><path class="e-mark" d="M143 38L147 26M149 38L153 26"/><text class="e-lab" x="118" y="26" text-anchor="start">Sì</text></g><g class="edge best" data-edge="nmvxuhsi17"><path class="e-line" d="M88 126.5H104Q110 126.5 110 132.5V215Q110 221 116 221H164"/><text class="e-lab" x="118" y="215" text-anchor="start">No</text></g><g class="edge best" data-edge="nmvxuhsqd8"><path class="e-line" d="M340 221H356Q362 221 362 215V164Q362 158 368 158H532.9"/><text class="e-lab" x="370" y="152" text-anchor="start">Ripara · +800</text></g><g class="edge" data-edge="nmvxuhsz49"><path class="e-line" d="M708.9 158H724.9Q730.9 158 730.9 152V122Q730.9 116 736.9 116H870.3"/><text class="e-lab" x="738.9" y="110" text-anchor="start">Funziona · 70%</text></g><g class="edge" data-edge="nmvxuht7ya"><path class="e-line" d="M708.9 158H724.9Q730.9 158 730.9 164V194Q730.9 200 736.9 200H870.3"/><text class="e-lab" x="738.9" y="194" text-anchor="start">Non funziona · 30%</text></g><g class="edge rej" data-edge="nmvxuhtgsb"><path class="e-line" d="M340 221H356Q362 221 362 227V278Q362 284 368 284H532.9"/><path class="e-mark" d="M511.9 290L515.9 278M517.9 290L521.9 278"/><text class="e-lab" x="370" y="278" text-anchor="start">Sostituisci ora · +3000</text></g><g class="node t-rule" data-id="nmvxuhs1s5" transform="translate(-88 94.5)"><title>Regola: È in garanzia?</title><path class="n-shape" d="M10 0H166L176 32L166 64H10L0 32Z"/><path class="n-glyph" d="M20 8.5L26.5 15L20 21.5L13.5 15Z"/><text class="n-num" x="30" y="19">1</text><text class="n-txt" x="88" y="39" text-anchor="middle">È in garanzia?</text><text class="n-val" x="88" y="55" text-anchor="middle">VA € 1700</text></g><g class="node t-outcome" data-id="nmvxuhs9p6" transform="translate(164 0)"><title>Esito: Riparazione gratuita</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Riparazione gratuita</text><text class="n-val" x="88" y="55" text-anchor="middle">= € 0</text></g><g class="node t-decision" data-id="nmvxuhsi17" transform="translate(164 189)"><title>Decisione: Riparare o sostituire?</title><rect class="n-shape" width="176" height="64" rx="2"/><rect class="n-glyph" x="10" y="10" width="10" height="10"/><text class="n-num" x="25" y="19">1.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Riparare o sostituire?</text><text class="n-val" x="88" y="55" text-anchor="middle">VA € 1700</text></g><g class="node t-chance" data-id="nmvxuhsqd8" transform="translate(532.9 126)"><title>Incertezza: La riparazione funziona?</title><rect class="n-shape" width="176" height="64" rx="20"/><circle class="n-glyph" cx="17" cy="15" r="5.3"/><text class="n-num" x="27" y="19">1.2.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">La riparazione funziona?</text><text class="n-val" x="88" y="55" text-anchor="middle">VA € 1700</text></g><g class="node t-outcome" data-id="nmvxuhsz49" transform="translate(870.3 84)"><title>Esito: Continua a usarlo</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.1.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Continua a usarlo</text><text class="n-val" x="88" y="55" text-anchor="middle">= € 800</text></g><g class="node t-outcome" data-id="nmvxuht7ya" transform="translate(870.3 168)"><title>Esito: Ne compra uno nuovo</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.1.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Ne compra uno nuovo</text><text class="n-val" x="88" y="55" text-anchor="middle">= € 3800</text></g><g class="node t-outcome" data-id="nmvxuhtgsb" transform="translate(532.9 252)"><title>Esito: Portatile nuovo</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Portatile nuovo</text><text class="n-val" x="88" y="55" text-anchor="middle">= € 3000</text></g></svg><text x="40" y="338" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2B1B3D">1. Incertezza: 0,7 × 800 + 0,3 × 3.800 = 1.700</text><text x="40" y="364" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2B1B3D">2. Decisione, minimizzando: il più basso tra 1.700 e 3.000 = 1.700</text><text x="40" y="390" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D">3. Regola: fuori garanzia, segue il ramo No = 1.700</text></svg>