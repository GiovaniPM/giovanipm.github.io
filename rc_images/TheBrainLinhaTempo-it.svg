<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cronologia di TheBrain</title>
<desc id="d">Cronologia: 1993, Harlan Hugh concepisce l’idea di concentrarsi sulle connessioni tra le informazioni; 1996, nasce Natrificial, poi diventata TheBrain Technologies; 2013, TheBrain 8 adotta il nome TheBrain al posto di PersonalBrain; 2023, lancio dell’API REST; 2026, TheBrain 15, con IA Cerebro, cinque piattaforme con lo stesso codice, app gratuita e API locale.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="340" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Cronologia di TheBrain</text>
<text x="500.0" y="72" font-size="15" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Da un’idea sulle connessioni a un’app gratuita con IA</text>
<path d="M50 185 L950 185" fill="none" stroke="#756986" stroke-width="3" stroke-linejoin="round" marker-end="url(#am)"/>
<text x="120" y="160" font-size="24" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">1993</text>
<circle cx="120" cy="185" r="9" fill="#EFE3FA" stroke="#5B2A86" stroke-width="3"/>
<rect x="32" y="208" width="176" height="86" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="1.5"/>
<text x="120" y="232" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">Harlan Hugh concepisce</text>
<text x="120" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">l’idea di puntare sulle</text>
<text x="120" y="272" font-size="12.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">connessioni, non cartelle</text>
<text x="310" y="160" font-size="24" fill="#0E8074" text-anchor="middle" font-weight="700" xml:space="preserve">1996</text>
<circle cx="310" cy="185" r="9" fill="#E2F6F2" stroke="#0E8074" stroke-width="3"/>
<rect x="222" y="208" width="176" height="86" rx="10" fill="#E2F6F2" stroke="#0E8074" stroke-width="1.5"/>
<text x="310" y="232" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">Nasce Natrificial,</text>
<text x="310" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">poi diventata</text>
<text x="310" y="272" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">TheBrain Technologies</text>
<text x="500" y="160" font-size="24" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">2013</text>
<circle cx="500" cy="185" r="9" fill="#FFE3E3" stroke="#D62828" stroke-width="3"/>
<rect x="412" y="208" width="176" height="86" rx="10" fill="#FFE3E3" stroke="#D62828" stroke-width="1.5"/>
<text x="500" y="232" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">TheBrain 8: il nome</text>
<text x="500" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">PersonalBrain lascia</text>
<text x="500" y="272" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">il posto a TheBrain</text>
<text x="690" y="160" font-size="24" fill="#1F5FCC" text-anchor="middle" font-weight="700" xml:space="preserve">2023</text>
<circle cx="690" cy="185" r="9" fill="#E3EEFF" stroke="#1F5FCC" stroke-width="3"/>
<rect x="602" y="208" width="176" height="86" rx="10" fill="#E3EEFF" stroke="#1F5FCC" stroke-width="1.5"/>
<text x="690" y="232" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">Lancio dell’API REST</text>
<text x="690" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">(novembre), con chiave</text>
<text x="690" y="272" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">di accesso per utente</text>
<text x="880" y="160" font-size="24" fill="#B35300" text-anchor="middle" font-weight="700" xml:space="preserve">2026</text>
<circle cx="880" cy="185" r="9" fill="#FFF1C9" stroke="#B35300" stroke-width="3"/>
<rect x="792" y="208" width="176" height="86" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="1.5"/>
<text x="880" y="232" font-size="13.0" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">TheBrain 15: IA Cerebro,</text>
<text x="880" y="252" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">5 piattaforme, app</text>
<text x="880" y="272" font-size="13.5" fill="#2B1B3D" text-anchor="middle" xml:space="preserve">gratuita e API locale</text>
</svg>
