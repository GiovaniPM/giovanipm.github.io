<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Arquitectura REST de JD Edwards EnterpriseOne</title>
<desc id="d">Los consumidores (portal, iPaaS, app móvil, Postman) llaman vía HTTPS y JSON a un API gateway recomendado, que reenvía al AIS Server sobre WebLogic. El AIS expone los servicios tokenrequest, formservice, dataservice, orchestrator y otros, y aloja el Orchestrator. El AIS habla con el HTML Server (JAS), que usa JDENET para llegar al Enterprise Server, donde corren las business functions que acceden a la base de datos. El Orchestrator también llama a API externas mediante conectores REST. El Server Manager instala y configura los servidores. Recuadro de seguridad: usuario de servicio, token u OAuth, Security Workbench y HTTPS.</desc>
