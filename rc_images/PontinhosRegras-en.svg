<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">The rules of Dots and Boxes in three steps</title>
<desc id="d">Three boards of 2 by 2 boxes. In the first, a line has just been drawn between two neighbouring dots, highlighted in orange. In the second, the corner box has three sides drawn and the fourth side is shown dashed: whoever plays next can close it. In the third, Ana drew the fourth side: the box gets the initial A and Ana plays again.</desc>
<style>text{font-family:'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.dot{fill:#2B1B3D}.ln{stroke:#2B1B3D;stroke-width:5.5;stroke-linecap:round}.ln.last{stroke:#B35300;stroke-width:7}.gridln{stroke:#D9CCE6;stroke-width:1.2;stroke-dasharray:3 6}.ini{font-weight:800;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1000" height="400" rx="18" fill="#FFF7EC"/>
<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2B1B3D">The rules of Dots and Boxes in three steps</text>
<g transform="translate(68.1 70) scale(1.15)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="gridln" x1="86" y1="26" x2="146" y2="26"/><line class="gridln" x1="26" y1="86" x2="86" y2="86"/><line class="ln last" style="--len:60" x1="86" y1="86" x2="146" y2="86"/><line class="gridln" x1="26" y1="146" x2="86" y2="146"/><line class="gridln" x1="86" y1="146" x2="146" y2="146"/><line class="ln" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="gridln" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><line class="gridln" x1="26" y1="86" x2="26" y2="146"/><line class="gridln" x1="86" y1="86" x2="86" y2="146"/><line class="gridln" x1="146" y1="86" x2="146" y2="146"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/><circle class="dot" cx="26" cy="146" r="6"/><circle class="dot" cx="86" cy="146" r="6"/><circle class="dot" cx="146" cy="146" r="6"/></g><text x="167" y="299.79999999999995" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">1. Draw a line</text><text x="167" y="320.79999999999995" text-anchor="middle" font-size="15.5" fill="#756986">On your turn, join two neighbouring</text><text x="167" y="341.79999999999995" text-anchor="middle" font-size="15.5" fill="#756986">dots, horizontally or vertically.</text><g transform="translate(401.1 70) scale(1.15)"><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="gridln" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="gridln" x1="86" y1="86" x2="146" y2="86"/><line class="gridln" x1="26" y1="146" x2="86" y2="146"/><line class="gridln" x1="86" y1="146" x2="146" y2="146"/><line class="ln last" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="gridln" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><line class="gridln" x1="26" y1="86" x2="26" y2="146"/><line class="gridln" x1="86" y1="86" x2="86" y2="146"/><line class="gridln" x1="146" y1="86" x2="146" y2="146"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/><circle class="dot" cx="26" cy="146" r="6"/><circle class="dot" cx="86" cy="146" r="6"/><circle class="dot" cx="146" cy="146" r="6"/></g><line x1="500.0" y1="99.9" x2="500.0" y2="168.9" stroke="#C2185B" stroke-width="6.8999999999999995" stroke-linecap="round" stroke-dasharray="9.2 9.2"/><text x="465.5" y="142.4" text-anchor="middle" font-size="26" font-weight="800" fill="#C2185B">!</text><text x="500" y="299.79999999999995" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">2. Beware the third side</text><text x="500" y="320.79999999999995" text-anchor="middle" font-size="15.5" fill="#756986">A box with three sides is</text><text x="500" y="341.79999999999995" text-anchor="middle" font-size="15.5" fill="#756986">a gift for the next player.</text><g transform="translate(734.1 70) scale(1.15)"><rect class="box" x="29" y="29" width="54" height="54" rx="4" fill="#CDEFE9"/><text class="ini" x="56" y="57" font-size="25.2" fill="#0E8074">A</text><line class="ln" style="--len:60" x1="26" y1="26" x2="86" y2="26"/><line class="gridln" x1="86" y1="26" x2="146" y2="26"/><line class="ln" style="--len:60" x1="26" y1="86" x2="86" y2="86"/><line class="gridln" x1="86" y1="86" x2="146" y2="86"/><line class="gridln" x1="26" y1="146" x2="86" y2="146"/><line class="gridln" x1="86" y1="146" x2="146" y2="146"/><line class="ln" style="--len:60" x1="26" y1="26" x2="26" y2="86"/><line class="ln last" style="--len:60" x1="86" y1="26" x2="86" y2="86"/><line class="gridln" x1="146" y1="26" x2="146" y2="86"/><line class="gridln" x1="26" y1="86" x2="26" y2="146"/><line class="gridln" x1="86" y1="86" x2="86" y2="146"/><line class="gridln" x1="146" y1="86" x2="146" y2="146"/><circle class="dot" cx="26" cy="26" r="6"/><circle class="dot" cx="86" cy="26" r="6"/><circle class="dot" cx="146" cy="26" r="6"/><circle class="dot" cx="26" cy="86" r="6"/><circle class="dot" cx="86" cy="86" r="6"/><circle class="dot" cx="146" cy="86" r="6"/><circle class="dot" cx="26" cy="146" r="6"/><circle class="dot" cx="86" cy="146" r="6"/><circle class="dot" cx="146" cy="146" r="6"/></g><text x="833" y="299.79999999999995" text-anchor="middle" font-size="19" font-weight="700" fill="#2B1B3D">3. Close it and play again</text><text x="833" y="320.79999999999995" text-anchor="middle" font-size="15.5" fill="#756986">Whoever draws the fourth side puts</text><text x="833" y="341.79999999999995" text-anchor="middle" font-size="15.5" fill="#756986">their initial in the box and plays again.</text></svg>
