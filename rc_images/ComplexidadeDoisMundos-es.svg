<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dos futuros posibles</title>
<desc id="d">Dos paneles. Si P es igual a NP, resolver sería tan fácil como verificar: los fármacos y materiales se diseñarían rápido y las computadoras encontrarían demostraciones matemáticas, pero la criptografía de hoy sería vulnerable y la creatividad perdería su salto. Si P es distinto de NP, existen problemas intrínsecamente difíciles: las contraseñas y los bancos siguen protegidos, sabemos dónde están los límites, y los problemas difíciles piden atajos como aproximaciones y heurísticas. Abajo, la encuesta de 2019 con 124 respuestas: cerca del 80% cree que P es distinto de NP; entre quienes más estudiaron el problema, el 99%; y el 66% cree que se resolverá antes de 2100.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="505" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Dos futuros posibles</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Qué cambia si la respuesta es sí, y qué cambia si es no</text>
<rect x="50" y="96" width="420" height="250" rx="14" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<path d="M50 110 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v36 h-420 z" fill="#FFB703"/>
<text x="260" y="120" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Si P = NP</text>
<text x="260" y="139" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-style="italic">resolver sería tan fácil como verificar</text>
<circle cx="82" cy="179" r="12" fill="#2A9D8F"/><text x="82" y="184" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="106" y="184" font-size="14.5" fill="#2B1B3D">Fármacos y materiales diseñados rápido</text>
<circle cx="82" cy="217" r="12" fill="#2A9D8F"/><text x="82" y="222" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="106" y="222" font-size="14.5" fill="#2B1B3D">Las computadoras encontrarían demostraciones</text>
<circle cx="82" cy="255" r="12" fill="#E23B3B"/><text x="82" y="260" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">−</text>
<text x="106" y="260" font-size="14.5" fill="#2B1B3D">La criptografía de hoy sería vulnerable</text>
<circle cx="82" cy="293" r="12" fill="#5B2A86"/><text x="82" y="298" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">?</text>
<text x="106" y="298" font-size="14.5" fill="#2B1B3D">La creatividad perdería su “salto”</text>
<rect x="530" y="96" width="420" height="250" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M530 110 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v36 h-420 z" fill="#2A9D8F"/>
<text x="740" y="120" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Si P ≠ NP</text>
<text x="740" y="139" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">existen problemas intrínsecamente difíciles</text>
<circle cx="562" cy="179" r="12" fill="#2A9D8F"/><text x="562" y="184" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="586" y="184" font-size="14.5" fill="#2B1B3D">Contraseñas y bancos siguen protegidos</text>
<circle cx="562" cy="217" r="12" fill="#2A9D8F"/><text x="562" y="222" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">+</text>
<text x="586" y="222" font-size="14.5" fill="#2B1B3D">Sabemos dónde están los límites</text>
<circle cx="562" cy="255" r="12" fill="#3A86FF"/><text x="562" y="260" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">•</text>
<text x="586" y="260" font-size="14.5" fill="#2B1B3D">Los problemas difíciles piden atajos:</text>
<text x="586" y="298" font-size="14.5" fill="#2B1B3D">aproximaciones y heurísticas</text>
<text x="500" y="390" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Qué dicen los especialistas (encuesta de 2019, 124 respuestas)</text>
<rect x="100" y="406" width="640" height="40" rx="8" fill="#2A9D8F"/><rect x="740" y="406" width="160" height="40" rx="8" fill="#D9C9B4"/><text x="420" y="432" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">P ≠ NP: cerca del 80%</text>
<text x="820" y="432" font-size="13" fill="#2B1B3D" text-anchor="middle">otras respuestas</text>
<text x="500" y="478" font-size="13.5" fill="#756986" text-anchor="middle" font-style="italic">Entre quienes más estudiaron el problema, el 99% apuesta por P ≠ NP. Y el 66% cree que se resolverá antes de 2100.</text>
</svg>
