<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="t d">
<title id="t">Ciclo di lavoro con il Gestore di progetto</title>
<desc id="d">Cinque passi in ciclo: 1 Pianificare, con dati del progetto, timeline e dipendenze; 2 Eseguire, il team lavora; 3 Seguire nel follow-up, aggiornando stato, percentuale, decisioni e azioni; 4 Analizzare nelle schede Panoramica, CFD e metriche, Team e Rischi; 5 Decidere e agire, come ripianificare, rimuovere blocchi o rinegoziare l’ambito. Dal passo 5 si torna al passo 2. In ogni passo, Salva scrive i dati nell’HTML e il JSON conserva una copia.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="370" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="500" y="44" font-size="22" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Un ciclo a settimana (o a riunione)</text><rect x="20" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><rect x="20" y="90" width="168" height="40" rx="14" fill="#5B2A86"/><rect x="20" y="116" width="168" height="14" fill="#5B2A86"/><text x="104" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1. Pianificare</text><text x="104" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Progetto, timeline,</text><text x="104" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">dipendenze</text><line x1="190" y1="155" x2="213" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="216" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#0E8074" stroke-width="3"/><rect x="216" y="90" width="168" height="40" rx="14" fill="#0E8074"/><rect x="216" y="116" width="168" height="14" fill="#0E8074"/><text x="300" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2. Eseguire</text><text x="300" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">il team</text><text x="300" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">lavora</text><line x1="386" y1="155" x2="409" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="412" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#C2185B" stroke-width="3"/><rect x="412" y="90" width="168" height="40" rx="14" fill="#C2185B"/><rect x="412" y="116" width="168" height="14" fill="#C2185B"/><text x="496" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3. Seguire</text><text x="496" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">follow-up: stato, %,</text><text x="496" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">decisioni e azioni</text><line x1="582" y1="155" x2="605" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="608" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/><rect x="608" y="90" width="168" height="40" rx="14" fill="#3A86FF"/><rect x="608" y="116" width="168" height="14" fill="#3A86FF"/><text x="692" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4. Analizzare</text><text x="692" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Panoramica, CFD,</text><text x="692" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Team, Rischi</text><line x1="778" y1="155" x2="801" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="804" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#B35300" stroke-width="3"/><rect x="804" y="90" width="168" height="40" rx="14" fill="#B35300"/><rect x="804" y="116" width="168" height="14" fill="#B35300"/><text x="888" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5. Decidere e agire</text><text x="888" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">ripianificare, sbloccare,</text><text x="888" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">rinegoziare l’ambito</text><path d="M888 222 V270 H300 V224" fill="none" stroke="#2B1B3D" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="20" y="300" width="960" height="44" rx="10" fill="#FFF1C9"/><text x="500" y="328" font-size="15" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Salva scrive tutto nell’HTML stesso · ⬇ JSON conserva una copia con data e ora</text>
</g></svg>
