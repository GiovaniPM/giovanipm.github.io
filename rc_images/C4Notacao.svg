<title id="t">Anatomia de um elemento e de uma relação no C4</title>
<desc id="d">API de Reservas [Contêiner: Java / Spring Boot] → Lê e grava [SQL/TCP] → Banco de Dados [Contêiner: PostgreSQL]. 1: Nome do elemento. 2: Tipo e, em contêineres e componentes, a tecnologia. 3: Descrição curta das responsabilidades. 4: Rótulo com verbo, no sentido da seta (evite “Usa”). 5: Tecnologia ou protocolo da relação. Todo diagrama também tem título (tipo e escopo) e legenda.</desc>
