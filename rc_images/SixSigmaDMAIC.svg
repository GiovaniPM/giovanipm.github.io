<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">DMAIC: as cinco fases da melhoria de um processo</title>
<desc id="d">Cinco colunas ligadas por setas, uma por fase do DMAIC. Definir: qual é o problema e para quem, com termo de abertura, SIPOC, árvore CTQ e voz do cliente. Medir: quão grande ele é, com plano de coleta, DPMO, FMEA e capacidade. Analisar: qual a causa raiz, com Ishikawa, 5 porquês, Pareto e dispersão. Melhorar: como eliminar a causa, com diagrama de afinidade, matriz de critérios, piloto e poka-yoke. Controlar: como manter o ganho, com carta de controle, padronização, plano de resposta e dono do processo. Uma seta tracejada volta de Controlar para Definir.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="525" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">DMAIC: as cinco fases da melhoria de um processo</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cada fase responde a uma pergunta e tem as suas ferramentas típicas</text>
<rect x="20.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#E1ECFF" stroke="#3A86FF" stroke-width="2.5"/>
<circle cx="106.0" cy="144" r="24" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2"/>
<text x="106.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">D</text>
<text x="106.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Definir</text>
<text x="106.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Qual é o problema</text>
<text x="106.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">e para quem?</text>
<line x1="34" y1="258" x2="178" y2="258" stroke="#3A86FF" stroke-width="1.5"/>
<text x="34.0" y="280.0" font-size="11" fill="#756986" font-weight="700">FERRAMENTAS</text>
<circle cx="40" cy="300" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="304.0" font-size="13" fill="#2B1B3D">Termo de abertura</text>
<circle cx="40" cy="326" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="330.0" font-size="13" fill="#2B1B3D">SIPOC</text>
<circle cx="40" cy="352" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="356.0" font-size="13" fill="#2B1B3D">Árvore CTQ</text>
<circle cx="40" cy="378" r="3.5" fill="#3A86FF"/>
<text x="50.0" y="382.0" font-size="13" fill="#2B1B3D">Voz do cliente</text>
<line x1="194" y1="144" x2="215" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="217.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<circle cx="303.0" cy="144" r="24" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/>
<text x="303.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">M</text>
<text x="303.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Medir</text>
<text x="303.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Quão grande ele é</text>
<text x="303.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">hoje?</text>
<line x1="231" y1="258" x2="375" y2="258" stroke="#2A9D8F" stroke-width="1.5"/>
<text x="231.0" y="280.0" font-size="11" fill="#756986" font-weight="700">FERRAMENTAS</text>
<circle cx="237" cy="300" r="3.5" fill="#2A9D8F"/>
<text x="247.0" y="304.0" font-size="13" fill="#2B1B3D">Plano de coleta</text>
<circle cx="237" cy="326" r="3.5" fill="#2A9D8F"/>
<text x="247.0" y="330.0" font-size="13" fill="#2B1B3D">DPMO e sigma</text>
<circle cx="237" cy="352" r="3.5" fill="#2A9D8F"/>
<text x="247.0" y="356.0" font-size="13" fill="#2B1B3D">FMEA</text>
<circle cx="237" cy="378" r="3.5" fill="#2A9D8F"/>
<text x="247.0" y="382.0" font-size="13" fill="#2B1B3D">Capacidade (Cp, Cpk)</text>
<line x1="391" y1="144" x2="412" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="414.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#FFF1C9" stroke="#FFB703" stroke-width="2.5"/>
<circle cx="500.0" cy="144" r="24" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/>
<text x="500.0" y="153.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">A</text>
<text x="500.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Analisar</text>
<text x="500.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Qual é a</text>
<text x="500.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">causa raiz?</text>
<line x1="428" y1="258" x2="572" y2="258" stroke="#FFB703" stroke-width="1.5"/>
<text x="428.0" y="280.0" font-size="11" fill="#756986" font-weight="700">FERRAMENTAS</text>
<circle cx="434" cy="300" r="3.5" fill="#FFB703"/>
<text x="444.0" y="304.0" font-size="13" fill="#2B1B3D">Ishikawa</text>
<circle cx="434" cy="326" r="3.5" fill="#FFB703"/>
<text x="444.0" y="330.0" font-size="13" fill="#2B1B3D">5 porquês</text>
<circle cx="434" cy="352" r="3.5" fill="#FFB703"/>
<text x="444.0" y="356.0" font-size="13" fill="#2B1B3D">Pareto</text>
<circle cx="434" cy="378" r="3.5" fill="#FFB703"/>
<text x="444.0" y="382.0" font-size="13" fill="#2B1B3D">Dispersão</text>
<line x1="588" y1="144" x2="609" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="611.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#FFE3E3" stroke="#FF6B6B" stroke-width="2.5"/>
<circle cx="697.0" cy="144" r="24" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2"/>
<text x="697.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">I</text>
<text x="697.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Melhorar</text>
<text x="697.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Como eliminar</text>
<text x="697.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">a causa?</text>
<line x1="625" y1="258" x2="769" y2="258" stroke="#FF6B6B" stroke-width="1.5"/>
<text x="625.0" y="280.0" font-size="11" fill="#756986" font-weight="700">FERRAMENTAS</text>
<circle cx="631" cy="300" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="304.0" font-size="13" fill="#2B1B3D">Diagrama de afinidade</text>
<circle cx="631" cy="326" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="330.0" font-size="13" fill="#2B1B3D">Matriz de critérios</text>
<circle cx="631" cy="352" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="356.0" font-size="13" fill="#2B1B3D">Piloto</text>
<circle cx="631" cy="378" r="3.5" fill="#FF6B6B"/>
<text x="641.0" y="382.0" font-size="13" fill="#2B1B3D">Poka-yoke</text>
<line x1="785" y1="144" x2="806" y2="144" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="808.0" y="108.0" width="172.0" height="322.0" rx="14" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<circle cx="894.0" cy="144" r="24" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2"/>
<text x="894.0" y="153.0" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="700">C</text>
<text x="894.0" y="196.0" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">Controlar</text>
<text x="894.0" y="220.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">Como manter</text>
<text x="894.0" y="237.0" font-size="13" font-style="italic" fill="#3E3350" text-anchor="middle">o ganho?</text>
<line x1="822" y1="258" x2="966" y2="258" stroke="#5B2A86" stroke-width="1.5"/>
<text x="822.0" y="280.0" font-size="11" fill="#756986" font-weight="700">FERRAMENTAS</text>
<circle cx="828" cy="300" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="304.0" font-size="13" fill="#2B1B3D">Carta de controle</text>
<circle cx="828" cy="326" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="330.0" font-size="13" fill="#2B1B3D">Padronização</text>
<circle cx="828" cy="352" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="356.0" font-size="13" fill="#2B1B3D">Plano de resposta</text>
<circle cx="828" cy="378" r="3.5" fill="#5B2A86"/>
<text x="838.0" y="382.0" font-size="13" fill="#2B1B3D">Dono do processo</text>
<path d="M894.0 432 v34 H106.0 v-30" stroke="#5B2A86" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#ap)"/>
<text x="500.0" y="460.0" font-size="14" fill="#5B2A86" text-anchor="middle" font-weight="700">melhoria contínua: o processo controlado é a base do próximo ciclo</text>
<text x="500.0" y="505.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Projetos DMAIC costumam durar de 3 a 6 meses; cada passagem de fase é revisada num “tollgate”.</text>
</svg>
