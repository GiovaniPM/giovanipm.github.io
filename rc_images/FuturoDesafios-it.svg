<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Le quattro sfide: a che punto è ciascuna</title>
<desc id="d">Matrice con le quattro sfide nelle righe e tre colonne: già realtà, in costruzione ed escluso dalla fisica. Computazione quantistica efficace: correzione d’errore sotto soglia con Willow nel 2024; macchina tollerante ai guasti prevista da IBM per il 2029. IA onnisciente: IA che supera gli umani in compiti specifici; IA generale con previsioni tra il 2029 e il 2047; onniscienza esclusa dai limiti di Gödel e Turing. Teletrasporto: di stati quantistici dal 1997 e via satellite nel 2017; di persone non viola la fisica ma è lontano; copiare senza distruggere l’originale è vietato dal teorema di no-cloning. Comunicazione via entanglement: distribuzione quantistica di chiavi con il satellite Micius; internet quantistico globale in costruzione; messaggi più veloci della luce esclusi dal teorema di non comunicazione.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Le quattro sfide: a che punto è ciascuna</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cosa esiste già, cosa è in costruzione e cosa la fisica esclude</text>
<rect x="285" y="96" width="210" height="34" rx="10" fill="#2A9D8F"/>
<text x="390" y="118" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Già realtà</text>
<rect x="510" y="96" width="210" height="34" rx="10" fill="#FFB703"/>
<text x="615" y="118" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">In costruzione</text>
<rect x="735" y="96" width="210" height="34" rx="10" fill="#E23B3B"/>
<text x="840" y="118" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Escluso dalla fisica</text>
<rect x="50" y="142" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="182" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Computazione</text>
<text x="160" y="202" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">quantistica efficace</text>
<rect x="285" y="142" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">Correzione d’errore sotto</text>
<text x="390" y="201" font-size="13" fill="#2B1B3D" text-anchor="middle">soglia (Willow, 2024)</text>
<rect x="510" y="142" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">Macchina tollerante ai</text>
<text x="615" y="201" font-size="13" fill="#2B1B3D" text-anchor="middle">guasti (IBM: 2029)</text>
<rect x="735" y="142" width="210" height="88" rx="12" fill="none" stroke="#D9C9B4" stroke-width="2" stroke-dasharray="5 5"/>
<text x="840" y="192" font-size="18" fill="#756986" text-anchor="middle">—</text>
<rect x="50" y="242" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="292" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">IA onnisciente</text>
<rect x="285" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">IA che supera gli umani</text>
<text x="390" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">in compiti specifici</text>
<rect x="510" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">IA generale: previsioni</text>
<text x="615" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">tra il 2029 e il 2047</text>
<rect x="735" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">Onniscienza: limiti</text>
<text x="840" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">di Gödel e Turing</text>
<rect x="50" y="342" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="392" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Teletrasporto</text>
<rect x="285" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">Di stati quantistici</text>
<text x="390" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">(1997; satellite, 2017)</text>
<rect x="510" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">Di persone: non viola la</text>
<text x="615" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">fisica, ma è lontano</text>
<rect x="735" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">Copiare senza distruggere</text>
<text x="840" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">l’originale (no-cloning)</text>
<rect x="50" y="442" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="482" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Comunicazione via</text>
<text x="160" y="502" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">entanglement</text>
<rect x="285" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Distribuzione quantistica</text>
<text x="390" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">di chiavi (Micius)</text>
<rect x="510" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Internet quantistico</text>
<text x="615" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">su scala globale</text>
<rect x="735" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Messaggi più veloci</text>
<text x="840" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">della luce (no-signaling)</text>
</svg>
