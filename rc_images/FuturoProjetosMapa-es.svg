<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Más allá de los proyectos: siete ideas, cinco capas</title>
<desc id="d">Mapa de las siete ideas en cinco capas. Mentalidad, cuál es la unidad de trabajo: #NoProjects, productos y flujo continuo, no proyectos. Dirección, hacia dónde vamos y por qué: OKR. Dinero, cómo asignamos los recursos: Beyond Budgeting y Lean Portfolio Management de SAFe. Estructura, quién hace el trabajo y cómo interactúan los equipos: Team Topologies. Medición, cómo sabemos si el valor fluye: Flow Framework. Una franja vertical indica la IA aplicada a todas las capas.</desc>
