<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">O caminho de um dado na simulação</title>
<desc id="d">A entidade emite. O dado percorre o fluxo. Em uma entidade é entregue, em um depósito é gravado e em um processo entra na fila. Depois da execução, as condições de saída enviam uma cópia a cada fluxo verdadeiro ou descartam o dado.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/><rect x="30" y="50" width="170" height="86" rx="12" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="2.5"/><text x="115" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Emissão</text><text x="115" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#3E3350">a entidade gera o dado</text><rect x="270" y="50" width="180" height="86" rx="12" fill="#FFF" stroke="#2B1B3D" stroke-width="2.5"/><text x="360" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Trânsito</text><text x="360" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#3E3350">condição e campos do fluxo</text><rect x="530" y="50" width="170" height="86" rx="12" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="2.5"/><text x="615" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Fila</text><text x="615" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#3E3350">espera a capacidade</text><rect x="770" y="50" width="200" height="86" rx="12" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="2.5"/><text x="870" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Execução</text><text x="870" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#3E3350">lê, aplica regras, leva a</text><text x="870" y="123" text-anchor="middle" font-size="12.5" font-weight="400" fill="#3E3350">duração</text><rect x="760" y="210" width="220" height="76" rx="12" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="2.5"/><text x="870" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Condições de saída</text><rect x="250" y="350" width="220" height="86" rx="12" fill="#E9F7EC" stroke="#2B1B3D" stroke-width="2.5"/><text x="360" y="387" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Entregue ou gravado</text><text x="360" y="408" text-anchor="middle" font-size="12.5" font-weight="400" fill="#3E3350">fim do caminho desta cópia</text><rect x="770" y="350" width="200" height="86" rx="12" fill="#FFE3EC" stroke="#2B1B3D" stroke-width="2.5"/><text x="870" y="387" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D">Descartado</text><text x="870" y="408" text-anchor="middle" font-size="12.5" font-weight="400" fill="#3E3350">aparece no registro</text><path d="M200 93H266" fill="none" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><path d="M450 93H526" fill="none" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><path d="M700 93H766" fill="none" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><path d="M870 136V206" fill="none" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><text x="490" y="40" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5B2A86">em um processo</text><path d="M320 136V346" fill="none" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><text x="310" y="245" text-anchor="end" font-size="13.5" font-weight="700" fill="#5B2A86">em entidade ou depósito</text><path d="M760 248H410V140" fill="none" stroke="#C2185B" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#r)"/><text x="590" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C2185B">cópia para cada fluxo verdadeiro</text><path d="M870 286V346" fill="none" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><text x="858" y="322" text-anchor="end" font-size="13.5" font-weight="700" fill="#5B2A86">nenhuma verdadeira</text>
</svg>
