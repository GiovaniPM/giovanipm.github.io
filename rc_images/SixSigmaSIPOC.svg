<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">SIPOC: o processo de ponta a ponta numa só página</title>
<desc id="d">Cinco colunas: fornecedores (restaurante, aplicativo, entregador, fornecedor de insumos); entradas (pedido, ingredientes, endereço, pagamento); processo (receber o pedido, preparar, embalar, entregar); saídas (comida entregue, recibo, avaliação, dados de tempo); clientes (quem pediu, restaurante, aplicativo).</desc>
