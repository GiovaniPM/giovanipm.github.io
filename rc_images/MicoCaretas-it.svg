<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" width="1000" height="326" role="img" aria-labelledby="t d">
<title id="t">Quanto aiutano le smorfie</title>
<desc id="d">Barre con la probabilità che tu perda il giro secondo il livello delle smorfie, evitando sempre le carte che fanno cambiare faccia all’avversario. Difficile, senza smorfie: 25,5%. Normale: 18,5%. Facile: 7,2%. Simulazione di 100 mila giri per livello, con 4 giocatori e 15 coppie.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="326" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="500" y="36" font-size="19" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Quanto aiutano le smorfie</text><text x="316" y="97" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Difficile: nessuna smorfia</text><rect x="330" y="70" width="510.0" height="40" rx="6" fill="#756986"/><text x="850.0" y="97" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">25,5%</text><text x="316" y="159" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Normale: a volte bluffano</text><rect x="330" y="132" width="370.0" height="40" rx="6" fill="#B35300"/><text x="710.0" y="159" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">18,5%</text><text x="316" y="221" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Facile: tradiscono quasi sempre</text><rect x="330" y="194" width="144.0" height="40" rx="6" fill="#0E8074"/><text x="484.0" y="221" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">7,2%</text><text x="330" y="276" font-size="13.5" font-weight="normal" text-anchor="start" fill="#756986">probabilità che tu perda il giro</text><text x="500" y="304" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#756986">100 mila giri simulati per livello: 4 giocatori, 15 coppie; giochi per primo ed eviti le carte con la smorfia</text>
</g></svg>
