<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 536" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The work the prompt sets off</title>
<desc id="d">Ten steps in two rows: read the sources, verify code and links, plan, draw the SVGs, inspect by rendering each figure, write in Portuguese, translate into English and Italian, assemble the page, validate ids, links, citations and images, and deliver the card and summary. Two dashed red arrows go back from inspection to drawing, to fix overlaps, and from validation to assembly, to fix what failed.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="536" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">The work the prompt sets off</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Ten steps, with two correction loops before delivery</text>
<rect x="40.0" y="150.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.4"/>
<circle cx="56" cy="166" r="11" fill="#3A86FF" stroke="#FFFFFF" stroke-width="2"/><text x="56.0" y="170.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="130.0" y="182.0" font-size="14" fill="#3A86FF" text-anchor="middle" font-weight="700" xml:space="preserve">Read</text>
<text x="122.0" y="202.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">every source,</text>
<text x="122.0" y="218.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">in full</text>
<line x1="207" y1="189.0" x2="229" y2="189.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="234.0" y="150.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.4"/>
<circle cx="250" cy="166" r="11" fill="#3A86FF" stroke="#FFFFFF" stroke-width="2"/><text x="250.0" y="170.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="324.0" y="182.0" font-size="14" fill="#3A86FF" text-anchor="middle" font-weight="700" xml:space="preserve">Verify</text>
<text x="316.0" y="202.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">test the code,</text>
<text x="316.0" y="218.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">check the links</text>
<line x1="401" y1="189.0" x2="423" y2="189.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="428.0" y="150.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.4"/>
<circle cx="444" cy="166" r="11" fill="#5B2A86" stroke="#FFFFFF" stroke-width="2"/><text x="444.0" y="170.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<text x="518.0" y="182.0" font-size="14" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">Plan</text>
<text x="510.0" y="202.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">sections, figures</text>
<text x="510.0" y="218.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">and references</text>
<line x1="595" y1="189.0" x2="617" y2="189.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="622.0" y="150.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.4"/>
<circle cx="638" cy="166" r="11" fill="#C2185B" stroke="#FFFFFF" stroke-width="2"/><text x="638.0" y="170.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<text x="712.0" y="182.0" font-size="14" fill="#C2185B" text-anchor="middle" font-weight="700" xml:space="preserve">Draw</text>
<text x="704.0" y="202.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">the SVGs in</text>
<text x="704.0" y="218.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">three languages</text>
<line x1="789" y1="189.0" x2="811" y2="189.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="816.0" y="150.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.4"/>
<circle cx="832" cy="166" r="11" fill="#C2185B" stroke="#FFFFFF" stroke-width="2"/><text x="832.0" y="170.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<text x="906.0" y="182.0" font-size="14" fill="#C2185B" text-anchor="middle" font-weight="700" xml:space="preserve">Inspect</text>
<text x="898.0" y="202.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">render and look</text>
<text x="898.0" y="218.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">at each figure</text>
<line x1="898.0" y1="232" x2="898.0" y2="344" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="816.0" y="350.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2.4"/>
<circle cx="832" cy="366" r="11" fill="#B35300" stroke="#FFFFFF" stroke-width="2"/><text x="832.0" y="370.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">6</text>
<text x="906.0" y="382.0" font-size="14" fill="#B35300" text-anchor="middle" font-weight="700" xml:space="preserve">Write</text>
<text x="898.0" y="402.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">the text in</text>
<text x="898.0" y="418.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">Portuguese</text>
<line x1="813" y1="389.0" x2="791" y2="389.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="622.0" y="350.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2.4"/>
<circle cx="638" cy="366" r="11" fill="#B35300" stroke="#FFFFFF" stroke-width="2"/><text x="638.0" y="370.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">7</text>
<text x="712.0" y="382.0" font-size="14" fill="#B35300" text-anchor="middle" font-weight="700" xml:space="preserve">Translate</text>
<text x="704.0" y="402.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">into English</text>
<text x="704.0" y="418.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">and Italian</text>
<line x1="619" y1="389.0" x2="597" y2="389.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="428.0" y="350.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.4"/>
<circle cx="444" cy="366" r="11" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="2"/><text x="444.0" y="370.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">8</text>
<text x="518.0" y="382.0" font-size="14" fill="#2A9D8F" text-anchor="middle" font-weight="700" xml:space="preserve">Assemble</text>
<text x="510.0" y="402.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">the page from</text>
<text x="510.0" y="418.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">the template</text>
<line x1="425" y1="389.0" x2="403" y2="389.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="234.0" y="350.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.4"/>
<circle cx="250" cy="366" r="11" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="2"/><text x="250.0" y="370.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">9</text>
<text x="324.0" y="382.0" font-size="14" fill="#2A9D8F" text-anchor="middle" font-weight="700" xml:space="preserve">Validate</text>
<text x="316.0" y="402.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">ids, links,</text>
<text x="316.0" y="418.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">citations, images</text>
<line x1="231" y1="389.0" x2="209" y2="389.0" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="40.0" y="350.0" width="164.0" height="78.0" rx="12" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.4"/>
<circle cx="56" cy="366" r="11" fill="#2B1B3D" stroke="#FFFFFF" stroke-width="2"/><text x="56.0" y="370.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">10</text>
<text x="130.0" y="382.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Deliver</text>
<text x="122.0" y="402.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">card, summary</text>
<text x="122.0" y="418.0" font-size="11.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">and open items</text>
<path d="M898.0 148 C 898.0 106, 704.0 106, 704.0 146" fill="none" stroke="#D62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ard)"/>
<text x="801.0" y="110.0" font-size="12" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">fixes overlaps</text>
<path d="M316.0 430 C 316.0 472, 510.0 472, 510.0 432" fill="none" stroke="#D62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ard)"/>
<text x="413.0" y="480.0" font-size="12" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">fixes what failed</text>
<text x="500.0" y="514.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">The loops are what turn a draft into a publishable article: the AI has to see the result, not just produce it.</text>
</svg>
