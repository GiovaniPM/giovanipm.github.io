<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">A brief history of project management</title>
<desc id="d">Project management timeline: 1910s, Henry Gantt creates the bar chart; 1942, Manhattan Project; 1957 and 1958, CPM at DuPont and PERT in the Polaris program; 1965 to 1969, IPMA and PMI are founded; 1970, Royce describes the waterfall model; 1994 and 1995, CHAOS report and Scrum; 1996, first edition of the PMBOK and PRINCE2; 2001, Agile Manifesto; 2021, PMBOK 7 based on principles and value; 2025, PMBOK 8 and AI in management. Three eras: engineering and defense, professionalization, agile and value.</desc>
<rect width="1000" height="510" rx="18" fill="#FFF7EC"/>
<text x="500" y="52" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">A brief history of project management</text>
