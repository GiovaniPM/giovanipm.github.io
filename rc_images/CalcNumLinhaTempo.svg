oke="#2A9D8F" stroke-width="2" stroke-dasharray="3 4"/><circle cx="255.2" cy="310" r="8" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2"/><rect x="177.2" y="110" width="156" height="158" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="255.2" y="138" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">c. 200 a.C.–263</text><text x="255.2" y="162" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">China</text><text x="255.2" y="188" font-size="12" fill="#756986" text-anchor="middle">Nove Capítulos</text><text x="255.2" y="206" font-size="12" fill="#756986" text-anchor="middle">e Liu Hui:</text><text x="255.2" y="224" font-size="12" fill="#756986" text-anchor="middle">sistemas lineares</text><line x1="336.8" y1="310" x2="336.8" y2="350" stroke="#EF476F" stroke-width="2" stroke-dasharray="3 4"/><circle cx="336.8" cy="310" r="8" fill="#EF476F" stroke="#2B1B3D" stroke-width="2"/><rect x="258.8" y="350" width="156" height="158" rx="12" fill="#FFFFFF" stroke="#EF476F" stroke-width="2.5"/><text x="336.8" y="378" font-size="15" fill="#EF476F" text-anchor="middle" font-weight="700">499–c. 1400</text><text x="336.8" y="402" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Índia</text><text x="336.8" y="428" font-size="12" fill="#756986" text-anchor="middle">senos, zero,</text><text x="336.8" y="446" font-size="12" fill="#756986" text-anchor="middle">interpolação e</text><text x="336.8" y="464" font-size="12" fill="#756986" text-anchor="middle">séries infinitas</text><line x1="418.4" y1="268" x2="418.4" y2="310" stroke="#FFB703" stroke-width="2" stroke-dasharray="3 4"/><circle cx="418.4" cy="310" r="8" fill="#FFB703" stroke="#2B1B3D" stroke-width="2"/><rect x="340.4" y="110" width="156" height="158" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><text x="418.4" y="138" font-size="15" fill="#B35300" text-anchor="middle" font-weight="700">820 · 1424</text><text x="418.4" y="162" font-size="13