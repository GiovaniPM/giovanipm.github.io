<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quatro mil anos de Cálculo Numérico</title>
<desc id="d">Linha do tempo com dez marcos, fora de escala: c. 1800 a.C., Babilônia: √2 com 6 casas na tabuleta YBC 7289; c. 250 a.C., Arquimedes: π entre dois polígonos de 96 lados; c. 200 a.C.–263, China: Nove Capítulos e Liu Hui: sistemas lineares; 820 · 1424, Bagdá e Samarcanda: al-Khwarizmi e al-Kashi: algoritmo e iteração; 1669 · 1690, Newton e Raphson: raízes de equações pela reta tangente; 1768 · 1901, Euler, Runge, Kutta: prever o futuro com equações diferenciais; 1801 · 1809, Gauss: reencontra Ceres com mínimos quadrados; 1922, Richardson: previsão do tempo com diferenças finitas, à mão; 1946–1985, Era digital: ENIAC, Monte Carlo, von Neumann, Turing IEEE 754; hoje, Exaescala e IA: 10¹⁸ contas por segundo e IA que inventa algoritmos.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
