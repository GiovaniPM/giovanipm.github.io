<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 508" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Precedenza: che cosa valuta prima il database</title>
<desc id="d">A sinistra, una scala di otto livelli di precedenza, dal più forte al più debole: segni e PRIOR; moltiplicazione e divisione; somma, sottrazione e concatenazione; confronti; IS NULL, LIKE, BETWEEN e IN; NOT; AND; e OR. A destra, l’esempio reparto = 10 OR reparto = 20 AND stipendio &gt; 4000, che il database legge come reparto = 10 OR, tra parentesi, reparto = 20 AND stipendio &gt; 4000, restituendo 5 righe; con le parentesi al posto giusto tornano solo 2 righe, Ana ed Eva.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="508" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Precedenza: che cosa valuta prima il database</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Dalla più forte (1) alla più debole (8), secondo la documentazione di Oracle</text>
<rect x="40.0" y="110.0" width="420.0" height="32.0" rx="8" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<circle cx="26" cy="126" r="11" fill="#C2185B" stroke="#FFFFFF" stroke-width="2"/><text x="26.0" y="130.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="54.0" y="131.0" font-size="13.5" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">+ − (segno)  PRIOR</text><text x="446.0" y="131.0" font-size="12" fill="#756986" text-anchor="end" xml:space="preserve">unari</text>
<rect x="46.0" y="150.0" width="408.0" height="32.0" rx="8" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<circle cx="32" cy="166" r="11" fill="#C2185B" stroke="#FFFFFF" stroke-width="2"/><text x="32.0" y="170.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="60.0" y="171.0" font-size="13.5" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">*  /</text><text x="440.0" y="171.0" font-size="12" fill="#756986" text-anchor="end" xml:space="preserve">moltiplicazione</text>
<rect x="52.0" y="190.0" width="396.0" height="32.0" rx="8" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<circle cx="38" cy="206" r="11" fill="#C2185B" stroke="#FFFFFF" stroke-width="2"/><text x="38.0" y="210.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<text x="66.0" y="211.0" font-size="13.5" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">+  −  ||</text><text x="434.0" y="211.0" font-size="12" fill="#756986" text-anchor="end" xml:space="preserve">somma, concatenazione</text>
<rect x="58.0" y="230.0" width="384.0" height="32.0" rx="8" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="44" cy="246" r="11" fill="#5B2A86" stroke="#FFFFFF" stroke-width="2"/><text x="44.0" y="250.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<text x="72.0" y="251.0" font-size="13.5" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">=  &lt;&gt;  &lt;  &gt;  &lt;=  &gt;=</text><text x="428.0" y="251.0" font-size="12" fill="#756986" text-anchor="end" xml:space="preserve">confronto</text>
<rect x="64.0" y="270.0" width="372.0" height="32.0" rx="8" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="50" cy="286" r="11" fill="#5B2A86" stroke="#FFFFFF" stroke-width="2"/><text x="50.0" y="290.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<text x="78.0" y="291.0" font-size="13.5" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">IS NULL  LIKE  BETWEEN  IN</text><text x="422.0" y="291.0" font-size="12" fill="#756986" text-anchor="end" xml:space="preserve">condizioni</text>
<rect x="70.0" y="310.0" width="360.0" height="32.0" rx="8" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2"/>
<circle cx="56" cy="326" r="11" fill="#3A86FF" stroke="#FFFFFF" stroke-width="2"/><text x="56.0" y="330.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">6</text>
<text x="84.0" y="331.0" font-size="13.5" fill="#3A86FF" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">NOT</text><text x="416.0" y="331.0" font-size="12" fill="#756986" text-anchor="end" xml:space="preserve">negazione</text>
<rect x="76.0" y="350.0" width="348.0" height="32.0" rx="8" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<circle cx="62" cy="366" r="11" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="2"/><text x="62.0" y="370.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">7</text>
<text x="90.0" y="371.0" font-size="13.5" fill="#2A9D8F" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">AND</text><text x="410.0" y="371.0" font-size="12" fill="#756986" text-anchor="end" xml:space="preserve">congiunzione</text>
<rect x="82.0" y="390.0" width="336.0" height="32.0" rx="8" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<circle cx="68" cy="406" r="11" fill="#B35300" stroke="#FFFFFF" stroke-width="2"/><text x="68.0" y="410.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">8</text>
<text x="96.0" y="411.0" font-size="13.5" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">OR</text><text x="404.0" y="411.0" font-size="12" fill="#756986" text-anchor="end" xml:space="preserve">disgiunzione</text>
<text x="250.0" y="448.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">allo stesso livello, da sinistra a destra</text>
<text x="510.0" y="114.0" font-size="15" fill="#D62828" font-weight="700" xml:space="preserve">La trappola di AND con OR</text>
<rect x="510.0" y="126.0" width="450.0" height="58.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/>
<text x="522" y="150" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#FFB703" font-weight="700">WHERE </tspan><tspan fill="#F7F0FF">reparto = 10 </tspan><tspan fill="#5FD3C4">OR</tspan><tspan fill="#F7F0FF"> reparto = 20</tspan></text>
<text x="522" y="172" font-family="Consolas, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#F7F0FF">      </tspan><tspan fill="#5FD3C4">AND</tspan><tspan fill="#F7F0FF"> stipendio &gt; 4000</tspan></text>
<text x="510.0" y="210.0" font-size="12.5" fill="#3E3350" font-weight="700" xml:space="preserve">Il database la legge così:</text>
<rect x="510.0" y="220.0" width="450.0" height="34.0" rx="8" fill="#FFE3E3" stroke="#D62828" stroke-width="1.5"/>
<text x="522.0" y="242.0" font-size="12.5" fill="#D62828" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">reparto = 10 OR (reparto = 20 AND stipendio &gt; 4000)</text>
<text x="510.0" y="274.0" font-size="12.5" fill="#3E3350" xml:space="preserve">→ tutto il reparto 10 (4 persone) + Eva: 5 righe</text>
<text x="510.0" y="308.0" font-size="12.5" fill="#3E3350" font-weight="700" xml:space="preserve">Con le parentesi, ciò che si voleva:</text>
<rect x="510.0" y="318.0" width="450.0" height="34.0" rx="8" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="1.5"/>
<text x="522.0" y="340.0" font-size="12.5" fill="#2A9D8F" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">(reparto = 10 OR reparto = 20) AND stipendio &gt; 4000</text>
<text x="510.0" y="372.0" font-size="12.5" fill="#3E3350" xml:space="preserve">→ solo Ana ed Eva: 2 righe</text>
<text x="500.0" y="486.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Nel dubbio, usate le parentesi: vincono sempre sulla precedenza e rendono chiara l’intenzione.</text>
</svg>
