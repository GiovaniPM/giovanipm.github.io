<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Integração por arquivos com UBEs e Table Conversions</title>
<desc id="d">Entrada: o banco gera o arquivo de retorno, que chega por SFTP ou MFT; um UBE ou Table Conversion lê o arquivo, uma business function de edição valida e aplica a regra e os dados vão para as tabelas do JDE, como os recebimentos na F03B13; linhas rejeitadas vão para um relatório de erros. Saída: a partir das tabelas do JDE, um UBE gera o arquivo de layout fixo numa pasta do Enterprise Server, que segue por SFTP ou MFT com criptografia PGP para o banco ou o fisco. Tudo é agendado no Scheduler do JDE, com relatório de conferência a cada execução.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="510" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBEs customizados e Table Conversions</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Arquivos com layout próprio: remessa e retorno bancário, obrigações fiscais, CSV</text>
<rect x="20" y="92" width="960" height="190" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#756986" text-anchor="start" font-weight="700">ENTRADA: RETORNO BANCÁRIO</text>
<rect x="30" y="136" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="116.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Banco</text>
<text x="116.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">arquivo de retorno</text>
<text x="116.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(CNAB 240)</text>
<rect x="222" y="136" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="308.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">SFTP / MFT</text>
<text x="308.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">transferência</text>
<text x="308.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">segura</text>
<rect x="414" y="136" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE ou Table</text>
<text x="500.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">Conversion lê</text>
<text x="500.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">o arquivo</text>
<rect x="606" y="136" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="692.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">BSFN de edição</text>
<text x="692.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">valida e aplica</text>
<text x="692.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">a regra</text>
<rect x="798" y="136" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="884.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tabelas JDE</text>
<text x="884.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">ex.: recebimentos</text>
<text x="884.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">F03B13</text>
<polyline points="202,176 220,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,176 412,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,176 604,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,176 796,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="262" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">linhas rejeitadas vão para um relatório de erros ou para uma tabela de trabalho</text>
<rect x="20" y="300" width="960" height="190" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="324" font-size="13" fill="#756986" text-anchor="start" font-weight="700">SAÍDA: REMESSA E ARQUIVOS FISCAIS</text>
<rect x="30" y="344" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="116.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tabelas JDE</text>
<text x="116.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">pagamentos,</text>
<text x="116.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">notas, razão</text>
<rect x="222" y="344" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="308.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">UBE gera</text>
<text x="308.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">o arquivo</text>
<text x="308.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(layout fixo)</text>
<rect x="414" y="344" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Pasta no</text>
<text x="500.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">Enterprise</text>
<text x="500.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">Server</text>
<rect x="606" y="344" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="692.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">SFTP / MFT</text>
<text x="692.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">criptografia</text>
<text x="692.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">PGP</text>
<rect x="798" y="344" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="884.0" y="370.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Banco / fisco</text>
<text x="884.0" y="389.0" font-size="12.5" fill="#3E3350" text-anchor="middle">remessa, SPED</text>
<text x="884.0" y="407.5" font-size="12.5" fill="#3E3350" text-anchor="middle">…</text>
<polyline points="202,384 220,384" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,384 412,384" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,384 604,384" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,384 796,384" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="470" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">agendado no Scheduler do JDE; cada execução gera PDF/CSV de conferência</text>
</svg>
