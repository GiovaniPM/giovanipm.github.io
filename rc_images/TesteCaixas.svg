<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Caixa preta, cinza e branca</title>
<desc id="d">Três caixas lado a lado, cada uma com uma seta de entrada e uma de saída. A caixa preta é opaca, com um ponto de interrogação: o testador vê só entradas e saídas. A caixa cinza mostra parte do interior, como um banco de dados e tabelas. A caixa branca mostra o fluxo do código, com desvios. Uma barra em degradê abaixo indica o conhecimento da estrutura interna, de nenhum a total.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
