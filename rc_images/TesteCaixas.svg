<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Caixa preta, cinza e branca</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">O que muda entre os métodos é quanto o testador enxerga do lado de dentro</text>
