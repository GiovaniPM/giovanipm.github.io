<text x="180" y="300" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700">Caixa preta</text>
<text x="180" y="325" font-size="14" fill="#3E3350" text-anchor="middle">só entradas e saídas</text>
<text x="180" y="346" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">testes funcionais, pelo usuário</text>
<text x="500" y="300" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700">Caixa cinza</text>
<text x="500" y="325" font-size="14" fill="#3E3350" text-anchor="middle">conhece parte: projeto, banco</text>
<text x="500" y="346" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">integração, APIs, dados</text>
<text x="820" y="300" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700">Caixa branca</text>
<text x="820" y="325" font-size="14" fill="#3E3350" text-anchor="middle">conhece o código</text>
<text x="820" y="346" font-size="14" fill="#756986" text-anchor="middle" font-style="italic">caminhos, desvios, cobertura</text>
<defs><linearGradient id="gk" x1="0" x2="1"><stop offset="0" stop-color="#2B1B3D"/><stop offset=".5" stop-color="#A898C0"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs>
