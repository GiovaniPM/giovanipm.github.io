<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Encerrar el círculo entre dos polígonos</title>
<desc id="d">Dos paneles. A la izquierda, un círculo con un hexágono dibujado dentro y otro fuera. El perímetro interior vale 3 diámetros y el exterior 3,464; la circunferencia está en medio. A la derecha, lo mismo con polígonos de 12 lados: 3,106 y 3,215, más estrecho. Cuantos más lados hay, más se ajustan los polígonos al círculo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Encerrar el círculo entre dos polígonos</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Dentro &lt; círculo &lt; fuera</text><polygon points="250.0,111.4 370.0,180.7 370.0,319.3 250.0,388.6 130.0,319.3 130.0,180.7" fill="#FFE8E8" stroke="#FF6B6B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="250" cy="250" r="120" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="3"/><polygon points="250.0,130.0 353.9,190.0 353.9,310.0 250.0,370.0 146.1,310.0 146.1,190.0" fill="#E6F0FF" stroke="#3A86FF" stroke-width="2.5" stroke-linejoin="round"/><text x="250" y="256" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700">6 lados</text><rect x="50" y="400" width="400" height="100" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="250" y="432" font-size="22" fill="#5B2A86" text-anchor="middle" font-weight="700">3,000 &lt; π &lt; 3,464</text><text x="150" y="462" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700">dentro 3,000</text><text x="350" y="462" font-size="15" fill="#FF6B6B" text-anchor="middle" font-weight="700">fuera 3,464</text><text x="250" y="490" font-size="13" fill="#756986" text-anchor="middle">diferencia 0,464</text><polygon points="750.0,125.8 812.1,142.4 857.6,187.9 874.2,250.0 857.6,312.1 812.1,357.6 750.0,374.2 687.9,357.6 642.4,312.1 625.8,250.0 642.4,187.9 687.9,142.4" fill="#FFE8E8" stroke="#FF6B6B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="750" cy="250" r="120" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="3"/><polygon points="750.0,130.0 810.0,146.1 853.9,190.0 870.0,250.0 853.9,310.0 810.0,353.9 750.0,370.0 690.0,353.9 646.1,310.0 630.0,250.0 646.1,190.0 690.0,146.1" fill="#E6F0FF" stroke="#3A86FF" stroke-width="2.5" stroke-linejoin="round"/><text x="750" y="256" font-size="20" fill="#2B1B3D" text-anchor="middle" font-weight="700">12 lados</text><rect x="550" y="400" width="400" height="100" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="750" y="432" font-size="22" fill="#5B2A86" text-anchor="middle" font-weight="700">3,106 &lt; π &lt; 3,215</text><text x="650" y="462" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700">dentro 3,106</text><text x="850" y="462" font-size="15" fill="#FF6B6B" text-anchor="middle" font-weight="700">fuera 3,215</text><text x="750" y="490" font-size="13" fill="#756986" text-anchor="middle">diferencia 0,109</text><line x1="430" y1="250" x2="560" y2="250" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><text x="495" y="238" font-size="13" fill="#756986" text-anchor="middle">duplica los lados</text>
</svg>
