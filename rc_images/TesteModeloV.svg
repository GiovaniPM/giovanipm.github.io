<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Modelo em V: cada etapa de construção tem o seu nível de teste</title>
<desc id="d">Modelo em V. À esquerda, descendo: requisitos do cliente, especificação, arquitetura e projeto dos módulos, até a codificação no vértice. À direita, subindo: teste unitário, de integração, de sistema e de aceitação. Linhas tracejadas mostram que cada teste é planejado a partir da etapa correspondente do lado esquerdo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="610" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Modelo em V: cada etapa de construção tem o seu nível de teste</text>
<text x="500.0" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">O lado esquerdo especifica, o lado direito testa, e cada teste é planejado lá atrás</text>
<text x="125" y="96" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">ESPECIFICAR E PROJETAR</text>
<text x="875" y="96" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">TESTAR E INTEGRAR</text>
<line x1="125.0" y1="170" x2="200.0" y2="200" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="200.0" y1="260" x2="275.0" y2="290" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="275.0" y1="350" x2="350.0" y2="380" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="350.0" y1="440" x2="500.0" y2="470" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="500.0" y1="470" x2="650.0" y2="440" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="650.0" y1="380" x2="725.0" y2="350" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="725.0" y1="290" x2="800.0" y2="260" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="800.0" y1="200" x2="875.0" y2="170" stroke="#756986" stroke-width="2.5" marker-end="url(#am)"/>
<line x1="236" y1="140.0" x2="764" y2="140.0" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="500" y="133.0" font-size="13" fill="#B35300" text-anchor="middle" font-weight="700">planeja</text>
<line x1="311" y1="230.0" x2="689" y2="230.0" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="500" y="223.0" font-size="13" fill="#B35300" text-anchor="middle" font-weight="700">planeja</text>
<line x1="386" y1="320.0" x2="614" y2="320.0" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="500" y="313.0" font-size="13" fill="#B35300" text-anchor="middle" font-weight="700">planeja</text>
<line x1="461" y1="410.0" x2="539" y2="410.0" stroke="#B35300" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="500" y="403.0" font-size="13" fill="#B35300" text-anchor="middle" font-weight="700">planeja</text>
<rect x="20" y="110" width="210" height="60" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="125.0" y="136" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Requisitos do cliente</text>
<text x="125.0" y="156" font-size="13" fill="#756986" text-anchor="middle">o que o cliente precisa</text>
<rect x="95" y="200" width="210" height="60" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="200.0" y="226" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Especificação</text>
<text x="200.0" y="246" font-size="13" fill="#756986" text-anchor="middle">o que o sistema faz</text>
<rect x="170" y="290" width="210" height="60" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="275.0" y="316" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Arquitetura</text>
<text x="275.0" y="336" font-size="13" fill="#756986" text-anchor="middle">como as partes se ligam</text>
<rect x="245" y="380" width="210" height="60" rx="10" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2.5"/>
<text x="350.0" y="406" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Projeto dos módulos</text>
<text x="350.0" y="426" font-size="13" fill="#756986" text-anchor="middle">como cada parte funciona</text>
<rect x="770" y="110" width="210" height="60" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="875.0" y="136" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Teste de aceitação</text>
<text x="875.0" y="156" font-size="13" fill="#756986" text-anchor="middle">é a coisa certa?</text>
<rect x="695" y="200" width="210" height="60" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="800.0" y="226" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Teste de sistema</text>
<text x="800.0" y="246" font-size="13" fill="#756986" text-anchor="middle">atende à especificação?</text>
<rect x="620" y="290" width="210" height="60" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="725.0" y="316" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Teste de integração</text>
<text x="725.0" y="336" font-size="13" fill="#756986" text-anchor="middle">as partes conversam?</text>
<rect x="545" y="380" width="210" height="60" rx="10" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="650.0" y="406" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Teste unitário</text>
<text x="650.0" y="426" font-size="13" fill="#756986" text-anchor="middle">cada parte funciona?</text>
<rect x="395" y="470" width="210" height="60" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="2.5"/>
<text x="500.0" y="496" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Codificação</text>
<text x="500.0" y="516" font-size="13" fill="#756986" text-anchor="middle">escrever o código</text>
<text x="20" y="568" font-size="14" fill="#3E3350">Verificação: cada produto confere com a sua especificação. “Estamos construindo certo?”</text>
<text x="20" y="590" font-size="14" fill="#3E3350">Validação: o produto final atende à necessidade real do cliente. “Estamos construindo a coisa certa?”</text>
</svg>
