<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">I simboli del diagramma di flusso</title><desc id="d">I simboli del diagramma di flusso: Inizio (nome e argomenti); Comandi (Set, Kill e New raggruppati); Decisione (If, ElseIf, postcondizionale); Ciclo (For, While, Do-While); Chiamata (metodo o etichetta); SQL incorporato (&amp;sql(...)); Ingresso e uscita (Write, Read, ZWrite); Fine del percorso (Quit, Return, Goto); Errore o arresto (Throw, Halt, Catch vuoto); Try e Catch (riquadri tratteggiati). Bordo rosso: il comando ha un risultato. Fai clic su un blocco per vedere il comando intero.</desc><rect width="1000" height="380" rx="18" fill="#FFF7EC"/><text x="500" y="32" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D" xml:space="preserve">I simboli del diagramma di flusso</text><rect x="54" y="66" width="120" height="46" rx="23" fill="#EBF7E6" stroke="#2E844A" stroke-width="2"/><text x="114" y="148" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Inizio</text><text x="114" y="167" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#756986" xml:space="preserve">nome e argomenti</text><rect x="247" y="66" width="120" height="46" rx="4" fill="#FFFFFF" stroke="#706E6B" stroke-width="2"/><path d="M265 83h84M265 95h60" stroke="#B0ADAB" stroke-width="3" stroke-linecap="round"/><text x="307" y="148" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Comandi</text><text x="307" y="167" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill=