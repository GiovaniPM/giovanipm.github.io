<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">What the exam measures × what the market values</title>
<desc id="d">Two panels. On the left, what the certification exam measures and AI already delivers on its own: command syntax, step-by-step configuration, practice-test answers, memorized manual content and standardized multiple choice. An arrow shows value shifting to the right, to what the market values: problem framing, technical judgment, systems thinking, business domain knowledge and proof of delivery. Below, bars compare the average pay premium in Q1 2026: 9.3% for non-certified skills and 6.5% for certifications.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="590" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">What the exam measures × what the market values</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">The knowledge a certification attests to is exactly what AI does best</text>

<rect x="50" y="100" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<path d="M50 114 a14 14 0 0 1 14 -14 h362 a14 14 0 0 1 14 14 v46 h-390 z" fill="#E23B3B"/>
<text x="245" y="128" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">What the exam measures</text>
<text x="245" y="149" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">AI already delivers it on its own</text>
<g font-size="16" fill="#2B1B3D">
<circle cx="80" cy="190" r="6" fill="#E23B3B"/><text x="98" y="195">Command syntax</text>
<circle cx="80" cy="240" r="6" fill="#E23B3B"/><text x="98" y="245">Step-by-step configuration</text>
<circle cx="80" cy="290" r="6" fill="#E23B3B"/><text x="98" y="295">Practice-test answers</text>
<circle cx="80" cy="340" r="6" fill="#E23B3B"/><text x="98" y="345">Memorized manual content</text>
<circle cx="80" cy="390" r="6" fill="#E23B3B"/><text x="98" y="395">Standardized multiple choice</text>
</g>

<line x1="452" y1="265" x2="546" y2="265" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<text x="500" y="250" font-size="13" fill="#5B2A86" text-anchor="middle" font-style="italic">value</text>
<text x="500" y="290" font-size="13" fill="#5B2A86" text-anchor="middle" font-style="italic">shifts</text>

<rect x="560" y="100" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M560 114 a14 14 0 0 1 14 -14 h362 a14 14 0 0 1 14 14 v46 h-390 z" fill="#2A9D8F"/>
<text x="755" y="128" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">What the market values</text>
<text x="755" y="149" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">sets one professional apart</text>
<g font-size="16" fill="#2B1B3D">
<circle cx="590" cy="190" r="6" fill="#2A9D8F"/><text x="608" y="195">Problem framing</text>
<circle cx="590" cy="240" r="6" fill="#2A9D8F"/><text x="608" y="245">Technical judgment</text>
<circle cx="590" cy="290" r="6" fill="#2A9D8F"/><text x="608" y="295">Systems thinking</text>
<circle cx="590" cy="340" r="6" fill="#2A9D8F"/><text x="608" y="345">Business domain knowledge</text>
<circle cx="590" cy="390" r="6" fill="#2A9D8F"/><text x="608" y="395">Proof of delivery</text>
</g>

<text x="50" y="470" font-size="15" fill="#2B1B3D" font-weight="700">Average pay premium over base salary · Q1 2026</text>
<text x="50" y="501" font-size="14" fill="#2B1B3D">Non-certified skills</text>
<rect x="290" y="485" width="465" height="22" rx="5" fill="#2A9D8F"/>
<text x="765" y="501" font-size="15" fill="#2A9D8F" font-weight="700">9.3%</text>
<text x="50" y="533" font-size="14" fill="#2B1B3D">Certifications</text>
<rect x="290" y="517" width="325" height="22" rx="5" fill="#E23B3B"/>
<text x="625" y="533" font-size="15" fill="#E23B3B" font-weight="700">6.5%</text>
<text x="50" y="568" font-size="12" fill="#756986" font-style="italic">Source: Foote Partners, IT Skills and Certifications Pay Index, 2026</text>
