<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
<title id="t">Os quatro níveis do modelo C4</title>
<desc id="d">1. Contexto: O sistema, quem o usa e com quem ele fala; para quem: todos, inclusive quem não é técnico; recomendado. 2. Contêineres: Aplicações e bancos de dados do sistema; para quem: equipe técnica, operação e suporte; recomendado. 3. Componentes: As partes internas de um contêiner; para quem: arquitetos e desenvolvedores; opcional. 4. Código: Classes e interfaces de um componente; para quem: desenvolvedores (a IDE gera); raramente.</desc>
