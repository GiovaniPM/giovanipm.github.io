<text x="502.8" y="349.0" font-size="13" text-anchor="start" font-weight="bold" fill="#C2185B">44</text>
<circle cx="260" cy="435" r="8" fill="#0E8074"/><text x="276.0" y="440.0" font-size="14" text-anchor="start" font-weight="normal" fill="#2B1B3D">navios não podem encostar</text>
