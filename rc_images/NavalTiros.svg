<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">Tiros para afundar a frota clássica (simulação)</title>
<desc id="d">Gráfico de faixas com a quantidade de tiros que cada nível do computador precisou para afundar a frota clássica, em 5 mil partidas simuladas por barra. Com navios sem encostar, as medianas foram: ao acaso 97, Recruta 71, Oficial 45 e Almirante 38. Com navios encostados: ao acaso 97, Recruta 67, Oficial 53 e Almirante 44. As faixas vão do 10º ao 90º percentil: ao acaso de 89 a 100; Almirante sem encostar de 31 a 46.</desc>
