<text x="500.0" y="470.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">Marcador: mediana. Faixa: 80% das partidas do meio (do 10º ao 90º percentil). 5 mil partidas por barra, frotas</text>
<text x="500.0" y="487.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#756986">sorteadas, código do próprio jogo.</text>
