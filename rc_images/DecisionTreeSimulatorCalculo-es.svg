<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" role="img" aria-labelledby="t d"><title id="t">Cómo calcula la aplicación el valor esperado del portátil</title><desc id="d">El árbol del portátil con sus valores: la incertidumbre vale 0,7 × 800 + 0,3 × 3.800 = 1.700; la decisión toma el menor entre 1.700 y 3.000; la regla sigue la rama No porque el portátil está fuera de garantía.</desc><style>.dtw .n-shape{stroke-width:1.8}
.dtw .n-txt{fill:#1b2022;font:13px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif}
.dtw .n-num{fill:#60686c;font:600 10px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-val{fill:#1b2022;font:600 12px ui-monospace,Consolas,Menlo,monospace}
.dtw .n-inner{fill:none;stroke-width:1}
.dtw .t-decision .n-shape{fill:#e4f0fb;stroke:#1f5f99}.dtw .t-decision .n-glyph{fill:#1f5f99}
.dtw .t-chance .n-shape{fill:#efeafa;stroke:#65509c}.dtw .t-chance .n-glyph{fill:#65509c}
.dtw .t-rule .n-shape{fill:#fdf0d0;stroke:#9a6a00}.dtw .t-rule .n-glyph{fill:#9a6a00}
.dtw .t-outcome .n-shape{fill:#dff3e4;stroke:#2b7a45}.dtw .t-outcome .n-glyph{fill:#2b7a45}.dtw .t-outcome .n-inner{stroke:#2b7a45}
.dtw .e-line{fill:none;stroke:#4a5358;stroke-width:1.6;stroke-linejoin:round}
.dtw .e-mark{fill:none;stroke:#4a5358;stroke-width:1.8}
.dtw .e-lab{fill:#1b2022;font:12px 'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;paint-order:stroke;stroke:#FFF7EC;stroke-width:4px;stroke-linejoin:round}
.dtw .edge.best .e-line{stroke:#1f7a3d;stroke-width:3}
.dtw .edge.rej .e-line{opacity:.55}
.dtw .edge.rej .e-lab{fill:#60686c}</style><rect width="1000" height="432" rx="18" fill="#FFF7EC"/><svg class="dtw" x="30" y="20" width="940" height="282" viewBox="-104 -16 1160 348"><g class="edge rej" data-edge="nmvxuhxxf6"><path class="e-line" d="M88 126.5H104Q110 126.5 110 120.5V38Q110 32 116 32H164"/><path class="e-mark" d="M143 38L147 26M149 38L153 26"/><text class="e-lab" x="118" y="26" text-anchor="start">Sí</text></g><g class="edge best" data-edge="nmvxuhy5p7"><path class="e-line" d="M88 126.5H104Q110 126.5 110 132.5V215Q110 221 116 221H164"/><text class="e-lab" x="118" y="215" text-anchor="start">No</text></g><g class="edge best" data-edge="nmvxuhydj8"><path class="e-line" d="M340 221H356Q362 221 362 215V164Q362 158 368 158H532.9"/><text class="e-lab" x="370" y="152" text-anchor="start">Reparar · +800</text></g><g class="edge" data-edge="nmvxuhylg9"><path class="e-line" d="M708.9 158H724.9Q730.9 158 730.9 152V122Q730.9 116 736.9 116H864"/><text class="e-lab" x="738.9" y="110" text-anchor="start">Funciona · 70%</text></g><g class="edge" data-edge="nmvxuhyuqa"><path class="e-line" d="M708.9 158H724.9Q730.9 158 730.9 164V194Q730.9 200 736.9 200H864"/><text class="e-lab" x="738.9" y="194" text-anchor="start">No funciona · 30%</text></g><g class="edge rej" data-edge="nmvxuhz3jb"><path class="e-line" d="M340 221H356Q362 221 362 227V278Q362 284 368 284H532.9"/><path class="e-mark" d="M511.9 290L515.9 278M517.9 290L521.9 278"/><text class="e-lab" x="370" y="278" text-anchor="start">Sustituir ahora · +3000</text></g><g class="node t-rule" data-id="nmvxuhxp25" transform="translate(-88 94.5)"><title>Regla: ¿Está en garantía?</title><path class="n-shape" d="M10 0H166L176 32L166 64H10L0 32Z"/><path class="n-glyph" d="M20 8.5L26.5 15L20 21.5L13.5 15Z"/><text class="n-num" x="30" y="19">1</text><text class="n-txt" x="88" y="39" text-anchor="middle">¿Está en garantía?</text><text class="n-val" x="88" y="55" text-anchor="middle">VE € 1700</text></g><g class="node t-outcome" data-id="nmvxuhxxf6" transform="translate(164 0)"><title>Resultado: Reparación gratuita</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Reparación gratuita</text><text class="n-val" x="88" y="55" text-anchor="middle">= € 0</text></g><g class="node t-decision" data-id="nmvxuhy5p7" transform="translate(164 189)"><title>Decisión: ¿Reparar o sustituir?</title><rect class="n-shape" width="176" height="64" rx="2"/><rect class="n-glyph" x="10" y="10" width="10" height="10"/><text class="n-num" x="25" y="19">1.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">¿Reparar o sustituir?</text><text class="n-val" x="88" y="55" text-anchor="middle">VE € 1700</text></g><g class="node t-chance" data-id="nmvxuhydj8" transform="translate(532.9 126)"><title>Incertidumbre: ¿La reparación funciona?</title><rect class="n-shape" width="176" height="64" rx="20"/><circle class="n-glyph" cx="17" cy="15" r="5.3"/><text class="n-num" x="27" y="19">1.2.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">¿La reparación funciona?</text><text class="n-val" x="88" y="55" text-anchor="middle">VE € 1700</text></g><g class="node t-outcome" data-id="nmvxuhylg9" transform="translate(864 84)"><title>Resultado: Sigue usándolo</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.1.1</text><text class="n-txt" x="88" y="39" text-anchor="middle">Sigue usándolo</text><text class="n-val" x="88" y="55" text-anchor="middle">= € 800</text></g><g class="node t-outcome" data-id="nmvxuhyuqa" transform="translate(864 168)"><title>Resultado: Compra uno nuevo</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.1.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Compra uno nuevo</text><text class="n-val" x="88" y="55" text-anchor="middle">= € 3800</text></g><g class="node t-outcome" data-id="nmvxuhz3jb" transform="translate(532.9 252)"><title>Resultado: Portátil nuevo</title><rect class="n-shape" width="176" height="64" rx="9"/><rect class="n-inner" x="3" y="3" width="170" height="58" rx="7"/><path class="n-glyph" d="M10 10L21 15L10 20Z"/><text class="n-num" x="25" y="19">1.2.2</text><text class="n-txt" x="88" y="39" text-anchor="middle">Portátil nuevo</text><text class="n-val" x="88" y="55" text-anchor="middle">= € 3000</text></g></svg><text x="40" y="340" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2B1B3D">1. Incertidumbre: 0,7 × 800 + 0,3 × 3.800 = 1.700</text><text x="40" y="366" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#2B1B3D">2. Decisión, minimizando: el menor entre 1.700 y 3.000 = 1.700</text><text x="40" y="392" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D">3. Regla: fuera de garantía, sigue la rama No = 1.700</text></svg>