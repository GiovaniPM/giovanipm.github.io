<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">AI in every step of GTD</title>
<desc id="d">Five columns, one per GTD step, showing how artificial intelligence helps: capture, transcribing voice and meetings and summarizing emails and chats; clarify, suggesting whether an item is actionable and drafting the outcome and next action; organize, proposing lists, contexts and dates and flagging duplicates; reflect, preparing the weekly review and showing stalled projects; engage, suggesting actions by context and energy, with agents carrying out simple tasks. Below, the rule: AI suggests and you decide what becomes a commitment.</desc>
<rect width="1000" height="466" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">AI in every step of GTD</text>
<rect x="34" y="84" width="176" height="56" rx="12" fill="#5B2A86"/>
<text x="122.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Capture</text>
<rect x="34" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="54" cy="186" r="5" fill="#5B2A86"/><text x="66.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">transcribes voice</text><text x="66.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">and meetings</text>
<circle cx="54" cy="256" r="5" fill="#5B2A86"/><text x="66.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">summarizes emails</text><text x="66.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">and chats</text>
<rect x="222" y="84" width="176" height="56" rx="12" fill="#2F6FE0"/>
<text x="310.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Clarify</text>
<rect x="222" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2"/>
<circle cx="242" cy="186" r="5" fill="#2F6FE0"/><text x="254.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">suggests whether</text><text x="254.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">it is actionable</text>
<circle cx="242" cy="256" r="5" fill="#2F6FE0"/><text x="254.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">drafts outcome</text><text x="254.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">and next action</text>
<rect x="410" y="84" width="176" height="56" rx="12" fill="#0E8074"/>
<text x="498.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Organize</text>
<rect x="410" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<circle cx="430" cy="186" r="5" fill="#0E8074"/><text x="442.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">proposes lists,</text><text x="442.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">contexts and dates</text>
<circle cx="430" cy="256" r="5" fill="#0E8074"/><text x="442.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">flags duplicate</text><text x="442.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">items</text>
<rect x="598" y="84" width="176" height="56" rx="12" fill="#B35300"/>
<text x="686.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reflect</text>
<rect x="598" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<circle cx="618" cy="186" r="5" fill="#B35300"/><text x="630.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">prepares the</text><text x="630.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">weekly review</text>
<circle cx="618" cy="256" r="5" fill="#B35300"/><text x="630.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">shows stalled</text><text x="630.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">projects</text>
<rect x="786" y="84" width="176" height="56" rx="12" fill="#C2185B"/>
<text x="874.0" y="119.0" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Engage</text>
<rect x="786" y="150" width="176" height="170" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<circle cx="806" cy="186" r="5" fill="#C2185B"/><text x="818.0" y="191.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">suggests actions by</text><text x="818.0" y="209.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">context and energy</text>
<circle cx="806" cy="256" r="5" fill="#C2185B"/><text x="818.0" y="261.0" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">agents carry out</text><text x="818.0" y="279.2" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">simple tasks</text>
<rect x="34" y="340" width="928" height="64" rx="14" fill="#2B1B3D"/>
<text x="498.0" y="380.0" font-size="19" font-weight="700" fill="#FFC94D" text-anchor="middle">AI suggests. You decide what becomes a commitment.</text>
<text x="500.0" y="446.0" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Before pasting data into an assistant, check your company’s privacy policy.</text>
</svg>
