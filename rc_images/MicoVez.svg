<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d">
<title id="t">Uma vez no Mico Preto</title>
<desc id="d">Fluxo de uma vez: você pega, sem ver, uma carta do vizinho. Se ela forma par com uma carta sua, o par vai para o monte; se não, a carta fica na sua mão. Quem fica sem cartas está salvo e sai da rodada. Depois, a vez passa para o vizinho de quem você pegou a carta, e o ciclo se repete até sobrar só o mico.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="350" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="20" y="110" width="190" height="76" rx="14" fill="#0E8074" stroke="#0E8074" stroke-width="2.5"/><text x="115.0" y="142.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Pegue 1 carta</text><text x="115.0" y="164.0" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#E2F6F2">virada, do vizinho</text><path d="M212 148 H262" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><path d="M335 98 L405 148 L335 198 L265 148 Z" fill="#FFB703" fill-opacity=".25" stroke="#B35300" stroke-width="2.5"/><text x="335" y="154" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Formou par?</text><path d="M380 116 Q400 60 446 60" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><text x="408" y="72" font-size="14" font-weight="bold" text-anchor="end" fill="#B35300">sim</text><path d="M380 180 Q400 236 446 236" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><text x="408" y="232" font-size="14" font-weight="bold" text-anchor="end" fill="#B35300">não</text><rect x="448" y="24" width="180" height="72" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="538.0" y="54.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Baixe o par</text><text x="538.0" y="76.0" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#756986">no monte</text><rect x="448" y="200" width="180" height="72" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="538.0" y="230.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">A carta fica</text><text x="538.0" y="252.0" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#756986">na sua mão</text><path d="M630 60 Q660 60 676 120" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><path d="M630 236 Q660 236 676 176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="112" width="150" height="72" rx="14" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.5"/><text x="735.0" y="142.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Sem cartas?</text><text x="735.0" y="164.0" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#756986">está salvo e sai</text><path d="M812 148 H836" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><rect x="838" y="112" width="142" height="72" rx="14" fill="#FFFFFF" stroke="#0E8074" stroke-width="2.5"/><text x="909.0" y="142.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">A vez passa</text><text x="909.0" y="164.0" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#756986">a quem deu a carta</text><path d="M909 186 V306 H115 V190" fill="none" stroke="#2B1B3D" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="512" y="330" font-size="14.5" font-weight="normal" text-anchor="middle" fill="#756986">repete até sobrar só o mico, na mão de quem perde</text>
</g></svg>
