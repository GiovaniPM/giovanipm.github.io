<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Las partes de una URL de API</title>
<desc id="d">Dos URL de la API de ejemplo. En la primera, https es el esquema, api.correios.com.br es el servidor, /cep/v2/enderecos es la ruta y 01001001 es el parámetro de ruta cep. En la segunda, lo que sigue al signo de interrogación, uf=SP y size=50, son parámetros de consulta separados por &amp;.</desc>
