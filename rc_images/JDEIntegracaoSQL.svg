<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 564" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Caminho suportado e SQL direto</title>
<desc id="d">No caminho suportado, a integração passa pelo Orchestrator ou por uma Z-file e pela aplicação ou master business function, que fazem validações e UDCs, next numbers da F0002, tabelas relacionadas, saldos em F0902 e F41021, auditoria, workflow e segurança do JDE, deixando o banco consistente. No INSERT ou UPDATE direto, o script SQL ou ETL pula toda a camada de negócio e deixa o banco inconsistente: saldo que não fecha, número duplicado, linha órfã e nenhuma trilha de auditoria. Leitura é diferente: views, réplica e usuário somente leitura, convertendo datas julianas e decimais implícitos.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="564" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Por que não gravar direto no banco</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">O que a aplicação faz por você e o SQL direto pula</text>
<rect x="20" y="92" width="960" height="196" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#0E8074" text-anchor="start" font-weight="700">CAMINHO SUPORTADO</text>
<rect x="40" y="140" width="170" height="70" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="125.0" y="170.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Integração</text>
<text x="125.0" y="189.3" font-size="12.5" fill="#3E3350" text-anchor="middle">Orchestrator, Z-file</text>
<rect x="250" y="130" width="500" height="140" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500" y="154" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Aplicação / master business function</text>
<text x="270" y="184" font-size="13.5" fill="#3E3350" text-anchor="start">✓ validações e UDCs</text>
<text x="510" y="184" font-size="13.5" fill="#3E3350" text-anchor="start">✓ next numbers (F0002)</text>
<text x="270" y="212" font-size="13.5" fill="#3E3350" text-anchor="start">✓ tabelas relacionadas</text>
<text x="510" y="212" font-size="13.5" fill="#3E3350" text-anchor="start">✓ saldos (F0902, F41021)</text>
<text x="270" y="240" font-size="13.5" fill="#3E3350" text-anchor="start">✓ auditoria e workflow</text>
<text x="510" y="240" font-size="13.5" fill="#3E3350" text-anchor="start">✓ segurança do JDE</text>
<rect x="790" y="140" width="170" height="70" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="875.0" y="170.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Banco</text>
<text x="875.0" y="189.3" font-size="12.5" fill="#3E3350" text-anchor="middle">consistente</text>
<polyline points="210,175 248,175" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="750,175 788,175" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="306" width="960" height="150" rx="14" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2"/>
<text x="36" y="330" font-size="13" fill="#B3261E" text-anchor="start" font-weight="700">INSERT / UPDATE DIRETO</text>
<rect x="40" y="350" width="170" height="70" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="125.0" y="380.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Script SQL</text>
<text x="125.0" y="399.3" font-size="12.5" fill="#3E3350" text-anchor="middle">ou ETL</text>
<polyline points="210,385 788,385" fill="none" stroke="#E23B3B" stroke-width="2" marker-end="url(#ae)"/>
<text x="500" y="377" font-size="13" fill="#B3261E" text-anchor="middle" font-style="italic">pula toda a camada de negócio</text>
<rect x="790" y="350" width="170" height="70" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="875.0" y="380.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Banco</text>
<text x="875.0" y="399.3" font-size="12.5" fill="#3E3350" text-anchor="middle">inconsistente</text>
<text x="500" y="410" font-size="13" fill="#B3261E" text-anchor="middle">saldo que não fecha · número duplicado · linha órfã · sem trilha de auditoria</text>
<rect x="20" y="474" width="960" height="70" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="504.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Leitura é outra história</text>
<text x="500.0" y="523.3" font-size="12.5" fill="#3E3350" text-anchor="middle">views, réplica e usuário somente leitura · converter datas julianas (CYYDDD) e decimais implícitos</text>
</svg>
