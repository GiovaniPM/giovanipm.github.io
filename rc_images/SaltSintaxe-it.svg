<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">I widget di base di Salt</title>
<desc id="d">Tabella con sette righe. A sinistra il codice Salt, al centro il controllo disegnato, a destra il nome: il testo semplice diventa un’etichetta; [Invia] un pulsante; () e (X) pulsanti di opzione non selezionato e selezionato; [] e [X] caselle di controllo; il testo tra virgolette un campo di testo; il testo tra accenti circonflessi un menu a tendina; e &lt;&amp;person&gt; inserisce l’icona di una persona.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="516" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">I widget di base di Salt</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Ogni frammento di testo diventa un controllo della schermata</text>
<text x="60.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">VOI SCRIVETE</text><text x="430.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">SALT DISEGNA</text><text x="700.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">NOME</text>
<rect x="40.0" y="122.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="129.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="152.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">Testo semplice</text>
