<text x="700.0" y="401.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Menu a tendina</text>
<rect x="40.0" y="422.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="429.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="452.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">Utente &lt;&amp;person&gt;</text>
