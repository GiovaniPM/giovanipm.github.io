<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 564" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Camino soportado y SQL directo</title>
<desc id="d">En el camino soportado, la integración pasa por el Orchestrator o por una tabla Z y por la aplicación o la master business function, que se ocupan de validaciones y UDC, next numbers de la F0002, tablas relacionadas, saldos en F0902 y F41021, auditoría, workflow y seguridad de JDE, dejando la base de datos coherente. Con INSERT o UPDATE directo, el script SQL o el ETL se salta toda la capa de negocio y deja la base de datos incoherente: saldos que no cuadran, números duplicados, filas huérfanas y ningún rastro de auditoría. La lectura es distinta: vistas, réplica y usuario de solo lectura, convirtiendo fechas julianas y decimales implícitos.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
