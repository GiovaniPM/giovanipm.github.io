<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Qué hace por ti la aplicación y qué se salta el SQL directo</text>
<rect x="20" y="92" width="960" height="196" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#0E8074" text-anchor="start" font-weight="700">CAMINO SOPORTADO</text>
<rect x="40" y="140" width="170" height="70" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="125.0" y="170.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Integración</text>
<text x="125.0" y="189.3" font-size="12.5" fill="#3E3350" text-anchor="middle">Orchestrator, tablas Z</text>
