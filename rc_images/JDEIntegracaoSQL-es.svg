<text x="500" y="154" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Aplicación / master business function</text>
<text x="270" y="184" font-size="13.5" fill="#3E3350" text-anchor="start">✓ validaciones y UDC</text>
<text x="510" y="184" font-size="13.5" fill="#3E3350" text-anchor="start">✓ next number (F0002)</text>
<text x="270" y="212" font-size="13.5" fill="#3E3350" text-anchor="start">✓ tablas relacionadas</text>
<text x="510" y="212" font-size="13.5" fill="#3E3350" text-anchor="start">✓ saldos (F0902, F41021)</text>
<text x="270" y="240" font-size="13.5" fill="#3E3350" text-anchor="start">✓ auditoría y workflow</text>
<text x="510" y="240" font-size="13.5" fill="#3E3350" text-anchor="start">✓ seguridad de JDE</text>
<rect x="790" y="140" width="170" height="70" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="875.0" y="170.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Base de datos</text>
<text x="875.0" y="189.3" font-size="12.5" fill="#3E3350" text-anchor="middle">coherente</text>
