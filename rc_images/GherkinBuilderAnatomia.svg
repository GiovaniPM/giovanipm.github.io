<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" role="img" aria-labelledby="t d"><title id="t">As partes de uma funcionalidade em Gherkin</title><desc id="d">Exemplo anotado: a funcionalidade diz o que será testado; o contexto vale para todos os cenários; cada cenário descreve um comportamento com situação inicial, ação e resultado; o esquema repete o teste com os dados da tabela de exemplos, uma execução por linha.</desc><rect width="1000" height="524" rx="18" fill="#FFF7EC"/><text x="500" y="38" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#2B1B3D" xml:space="preserve">As partes de uma funcionalidade em Gherkin</text><text class="c" x="30" y="84" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Funcionalidade:</tspan> Cupom de desconto</text><path d="M618 78h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="78" r="3.5" fill="#C2185B"/><text class="n" x="646" y="84" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">o que será testado</text><text class="c" x="48" y="121" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Contexto:</tspan></text><path d="M618 115h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="115" r="3.5" fill="#C2185B"/><text class="n" x="646" y="121" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">vale para todos os cenários</text><text class="c" x="66" y="158" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Dado</tspan> que tenho R$ 200 no carrinho</text><text class="c" x="48" y="195" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Cenário:</tspan> Aplicar cupom válido</text><path d="M618 189h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="189" r="3.5" fill="#C2185B"/><text class="n" x="646" y="195" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">um comportamento</text><text class="c" x="66" y="232" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Dado</tspan> que tenho o cupom de 10%</text><path d="M618 226h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="226" r="3.5" fill="#C2185B"/><text class="n" x="646" y="232" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">a situação inicial</text><text class="c" x="66" y="269" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Quando</tspan> aplico o cupom</text><path d="M618 263h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="263" r="3.5" fill="#C2185B"/><text class="n" x="646" y="269" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">a ação</text><text class="c" x="66" y="306" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Então</tspan> o total passa a ser R$ 180</text><path d="M618 300h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="300" r="3.5" fill="#C2185B"/><text class="n" x="646" y="306" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">o resultado que dá para conferir</text><text class="c" x="48" y="343" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Esquema do Cenário:</tspan> Recusar cupom</text><path d="M618 337h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="337" r="3.5" fill="#C2185B"/><text class="n" x="646" y="343" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">mesmo teste, vários dados</text><text class="c" x="66" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Quando</tspan> aplico o cupom "&lt;cupom&gt;"</text><path d="M618 374h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="374" r="3.5" fill="#C2185B"/><text class="n" x="646" y="380" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">&lt;variável&gt; vem da tabela</text><text class="c" x="66" y="417" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve"><tspan font-weight="700" fill="#5B2A86">Exemplos:</tspan></text><path d="M618 411h20" stroke="#C2185B" stroke-width="2"/><circle cx="618" cy="411" r="3.5" fill="#C2185B"/><text class="n" x="646" y="417" text-anchor="start" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#C2185B" xml:space="preserve">cada linha é uma execução</text><text class="c" x="84" y="454" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve">| cupom   |</text><text class="c" x="84" y="491" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="20" fill="#2B1B3D" xml:space="preserve">| VENCIDO |</text></svg>