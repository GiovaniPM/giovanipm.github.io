<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Automazione × potenziamento: effetto sull’occupazione</title>
<desc id="d">Due pannelli. A sinistra, l’automazione: quando l’IA sostituisce compiti, i posti junior si riducono. L’occupazione degli sviluppatori tra i 22 e i 25 anni è calata di quasi il 20% rispetto al picco di fine 2022, e i giovani in occupazioni esposte all’IA sono il 19% sotto il trend dei colleghi meno esposti. A destra, il potenziamento: quando l’IA integra il lavoro, l’occupazione tiene o cresce, e i professionisti esperti non mostrano un calo analogo. Fonte: Stanford Digital Economy Lab, 2025 e 2026.</desc>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Automazione × potenziamento</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">L’effetto sull’occupazione dipende da come si usa l’IA</text>

<rect x="50" y="100" width="420" height="370" rx="14" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<path d="M50 114 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v50 h-420 z" fill="#E23B3B"/>
<text x="260" y="130" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">Automazione</text>
<text x="260" y="152" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">l’IA sostituisce compiti</text>
<path d="M92 188 h16 v24 h12 l-20 24 l-20 -24 h12 z" fill="#E23B3B"/>
<text x="138" y="219" font-size="17" fill="#2B1B3D" font-weight="700">I posti junior si riducono</text>
<line x1="75" y1="252" x2="445" y2="252" stroke="#F2D6D6" stroke-width="2"/>
<text x="75" y="315" font-size="36" fill="#E23B3B" font-weight="700">−20%</text>
<text x="195" y="298" font-size="14" fill="#2B1B3D">occupazione degli sviluppatori</text>
<text x="195" y="317" font-size="14" fill="#2B1B3D">tra i 22 e i 25 anni, rispetto al</text>
<text x="195" y="336" font-size="14" fill="#2B1B3D">picco di fine 2022</text>
<text x="75" y="415" font-size="36" fill="#E23B3B" font-weight="700">−19%</text>
<text x="195" y="398" font-size="14" fill="#2B1B3D">giovani in occupazioni esposte</text>
<text x="195" y="417" font-size="14" fill="#2B1B3D">all’IA, rispetto al trend dei</text>
<text x="195" y="436" font-size="14" fill="#2B1B3D">colleghi meno esposti</text>

<circle cx="500" cy="285" r="22" fill="#2B1B3D"/>
<text x="500" y="292" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">×</text>

<rect x="530" y="100" width="420" height="370" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M530 114 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v50 h-420 z" fill="#2A9D8F"/>
<text x="740" y="130" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">Potenziamento</text>
<text x="740" y="152" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">l’IA integra il lavoro</text>
<path d="M572 236 h16 v-24 h12 l-20 -24 l-20 24 h12 z" fill="#2A9D8F"/>
<text x="618" y="219" font-size="17" fill="#2B1B3D" font-weight="700">L’occupazione tiene o cresce</text>
<line x1="555" y1="252" x2="925" y2="252" stroke="#D3ECE9" stroke-width="2"/>
<g font-size="14" fill="#2B1B3D">
<path d="M560 300 l8 8 l16 -18" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="298" font-size="16" font-weight="700">Professionisti esperti</text>
<text x="600" y="319">non mostrano un calo analogo</text>
<text x="600" y="338">a quello dei più giovani</text>
<path d="M560 400 l8 8 l16 -18" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="398" font-size="16" font-weight="700">Uso complementare</text>
<text x="600" y="419">dove l’IA potenzia il lavoro,</text>
<text x="600" y="438">i posti si mantengono</text>
</g>

<text x="500" y="505" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">Fonte: Stanford Digital Economy Lab, Canaries in the Coal Mine?, 2025 e 2026 · studio descrittivo, non causale</text>
</svg>
