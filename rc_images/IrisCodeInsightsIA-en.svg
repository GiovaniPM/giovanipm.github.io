<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" role="img" aria-labelledby="t d"><title id="t">Where AI helps you understand the code</title><desc id="d">Six steps: the app generates the report or you copy the method, you remove secrets and customer data, the AI explains and proposes citing the exact excerpt, the app checks it in the flow and the line, you compile and test outside production, and the team reviews before publishing. From the review, you go back to the AI with the new code.</desc><rect width="1000" height="214" rx="18" fill="#FFF7EC"/><text x="500" y="32" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#2B1B3D" xml:space="preserve">Where AI helps you understand the code</text><rect x="18" y="56" width="150" height="92" rx="12" fill="#EFEAFA" stroke="#5B2A86" stroke-width="2"/><text x="93" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5B2A86" xml:space="preserve">App</text><text x="93" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#2B1B3D" xml:space="preserve">Generate the report</text><text x="93" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#2B1B3D" xml:space="preserve">or copy the method</text><path d="M170 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M181 102l-6 -4v8z" fill="#2B1B3D"/><rect x="182" y="56" width="150" height="92" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="257" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#B35300" xml:space="preserve">You</text><text x="257" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Remove secrets</text><text x="257" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#2B1B3D" xml:space="preserve">and customer data</text><path d="M334 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M345 102l-6 -4v8z" fill="#2B1B3D"/><rect x="346" y="56" width="150" height="92" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="421" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0E8074" xml:space="preserve">AI</text><text x="421" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#2B1B3D" xml:space="preserve">Explain and propose</text><text x="421" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#2B1B3D" xml:space="preserve">with the exact excerpt</text><path d="M498 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M509 102l-6 -4v8z" fill="#2B1B3D"/><rect x="510" y="56" width="150" height="92" rx="12" fill="#EFEAFA" stroke="#5B2A86" stroke-width="2"/><text x="585" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5B2A86" xml:space="preserve">App</text><text x="585" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Check</text><text x="585" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#2B1B3D" xml:space="preserve">in the flow and line</text><path d="M662 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M673 102l-6 -4v8z" fill="#2B1B3D"/><rect x="674" y="56" width="150" height="92" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="749" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#B35300" xml:space="preserve">You</text><text x="749" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Compile and test</text><text x="749" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#2B1B3D" xml:space="preserve">outside production</text><path d="M826 102h6" stroke="#2B1B3D" stroke-width="2" fill="none"/><path d="M837 102l-6 -4v8z" fill="#2B1B3D"/><rect x="838" y="56" width="150" height="92" rx="12" fill="#FCE4F0" stroke="#C2185B" stroke-width="2"/><text x="913" y="80" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#C2185B" xml:space="preserve">Team</text><text x="913" y="109" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2B1B3D" xml:space="preserve">Review</text><text x="913" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#2B1B3D" xml:space="preserve">before publishing</text><path d="M913 150V178H421V158" fill="none" stroke="#756986" stroke-width="2" stroke-dasharray="6 4"/><path d="M421 150l-4 7h8z" fill="#756986"/><text x="667" y="199" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#756986" xml:space="preserve">come back with the new code</text></svg>