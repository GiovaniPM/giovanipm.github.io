<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Differenze finite: le derivate diventano conti semplici</title>
<desc id="d">Due pannelli. A sinistra, una curva con tre punti vicini separati da una distanza h. La pendenza vera nel punto centrale è approssimata dalla retta che unisce i vicini: pendenza ≈ (f(x + h) − f(x)) ÷ h. A destra, una fila di scatoline con temperature 80, 50 e 40: la regola del calore dice che ogni scatolina tende alla media delle vicine, e la variazione è proporzionale a sinistra − 2 × centro + destra, che qui dà 80 − 100 + 40 = 20, quindi il centro si scalda.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Differenze finite: le derivate diventano conti semplici</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">L’idea che ha reso calcolabili tempo, calore e vento</text><rect x="30" y="100" width="460" height="400" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="260" y="130" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Pendenza con due punti</text><line x1="55" y1="440" x2="470" y2="440" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><polyline points="60.0,373.5 65.0,375.9 70.0,378.2 75.0,380.3 80.0,382.3 85.0,384.2 90.0,386.0 95.0,387.6 100.0,389.2 105.0,390.6 110.0,391.9 115.0,393.0 120.0,394.1 125.0,395.0 130.0,395.8 135.0,396.5 140.0,397.0 145.0,397.4 150.0,397.8 155.0,397.9 160.0,398.0 165.0,397.9 170.0,397.8 175.0,397.4 180.0,397.0 185.0,396.5 190.0,395.8 195.0,395.0 200.0,394.1 205.0,393.0 210.0,391.9 215.0,390.6 220.0,389.2 225.0,387.6 230.0,386.0 235.0,384.2 240.0,382.3 245.0,380.3 250.0,378.2 255.0,375.9 260.0,373.5 265.0,371.0 270.0,368.4 275.0,365.6 280.0,362.7 285.0,359.7 290.0,356.6 295.0,353.3 300.0,350.0 305.0,346.5 310.0,342.9 315.0,339.1 320.0,335.3 325.0,331.3 330.0,327.2 335.0,323.0 340.0,318.6 345.0,314.1 350.0,309.6 355.0,304.8 360.0,300.0 365.0,295.0 370.0,290.0 375.0,284.7 380.0,279.4 385.0,274.0 390.0,268.4 395.0,262.7 400.0,256.9 405.0,250.9 410.0,244.9 415.0,238.7 420.0,232.4 425.0,225.9 430.0,219.4 435.0,212.7 440.0,205.9 445.0,199.0 450.0,192.0 455.0,184.8 460.0,177.5" fill="none" stroke="#5B2A86" stroke-width="3" stroke-linejoin="round"/><line x1="230" y1="394.815" x2="420" y2="273.785" stroke="#756986" stroke-width="2" stroke-dasharray="5 4"/><line x1="240" y1="399.47" x2="420" y2="245.12" stroke="#FF6B6B" stroke-width="2.5"/><circle cx="290" cy="356.595" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><line x1="290" y1="356.595" x2="290" y2="440" stroke="#756986" stroke-width="1" stroke-dasharray="3 3"/><circle cx="380" cy="279.42" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><line x1="380" y1="279.42" x2="380" y2="440" stroke="#756986" stroke-width="1" stroke-dasharray="3 3"/><text x="290" y="460" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">x</text><text x="380" y="460" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">x + h</text><text x="110" y="190" font-size="13" fill="#756986" text-anchor="start">tangente (vera)</text><text x="110" y="210" font-size="13" fill="#FF6B6B" text-anchor="start" font-weight="700">retta per 2 punti</text><rect x="60" y="470" width="400" height="0" rx="12" fill="#FFFFFF"/><text x="260" y="490" font-size="16" fill="#5B2A86" text-anchor="middle" font-weight="700">pendenza ≈ (f(x + h) − f(x)) ÷ h</text><rect x="510" y="100" width="460" height="400" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><text x="740" y="130" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">Calore: guarda i vicini</text><rect x="560" y="180" width="110" height="90" rx="10" fill="#FFE8E8" stroke="#FF6B6B" stroke-width="2.5"/><text x="615" y="236" font-size="26" fill="#2B1B3D" text-anchor="middle" font-weight="700">80°</text><text x="615" y="296" font-size="14" fill="#756986" text-anchor="middle">sinistra</text><rect x="690" y="180" width="110" height="90" rx="10" fill="#FFF1C9" stroke="#FFB703" stroke-width="2.5"/><text x="745" y="236" font-size="26" fill="#2B1B3D" text-anchor="middle" font-weight="700">50°</text><text x="745" y="296" font-size="14" fill="#756986" text-anchor="middle">centro</text><rect x="820" y="180" width="110" height="90" rx="10" fill="#E6F0FF" stroke="#3A86FF" stroke-width="2.5"/><text x="875" y="236" font-size="26" fill="#2B1B3D" text-anchor="middle" font-weight="700">40°</text><text x="875" y="296" font-size="14" fill="#756986" text-anchor="middle">destra</text><text x="740" y="346" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">variazione ∝ sinistra − 2 × centro + destra</text><text x="740" y="376" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">= 80 − 100 + 40 = +20</text><text x="740" y="420" font-size="14" fill="#2B1B3D" text-anchor="middle">Positivo: il centro è più freddo della</text><text x="740" y="444" font-size="14" fill="#2B1B3D" text-anchor="middle">media dei vicini (60°) e si scalderà.</text>
</svg>
