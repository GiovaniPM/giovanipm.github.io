<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Le convinzioni su cui poggia The Choice</title>
<desc id="d">Diagramma a forma di tempio: il tetto è The Choice, pensare con chiarezza, sostenuto da cinque colonne, che sono le convinzioni di Goldratt: semplicità intrinseca, non esistono conflitti, le persone sono buone, il cielo è il limite e mai dire lo so. La base è il ragionamento di causa ed effetto.</desc>
<rect width="1000" height="600" rx="18" fill="#FFF7EC"/>
<!-- lâmpada -->
<g stroke="#FFB703" stroke-width="4" stroke-linecap="round">
  <path d="M500 8 v12 M448 30 l9 8 M552 30 l-9 8 M430 70 h12 M558 70 h12"/>
</g>
<circle cx="500" cy="66" r="30" fill="#FFD166" stroke="#2B1B3D" stroke-width="3"/>
<path d="M490 76 q0 -18 10 -18 q10 0 10 18" stroke="#B35300" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<ellipse cx="489" cy="56" rx="6" ry="9" fill="#fff" opacity=".6"/>
<rect x="487" y="94" width="26" height="8" rx="2" fill="#A898C0" stroke="#2B1B3D" stroke-width="2.5"/>
<rect x="489" y="102" width="22" height="8" rx="2" fill="#A898C0" stroke="#2B1B3D" stroke-width="2.5"/>
<!-- frontão -->
<path d="M36 234 L500 118 L964 234 Z" fill="#5B2A86" stroke="#2B1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="M92 222 L500 132 L908 222 Z" fill="none" stroke="#C9A7F5" stroke-width="2" opacity=".6"/>
<text x="500" y="190" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="3">THE CHOICE</text>
<text x="500" y="215" text-anchor="middle" font-size="17" font-style="italic" fill="#FFD166">pensare con chiarezza</text>
<rect x="44" y="234" width="912" height="22" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="3"/>
<!-- colunas -->
<rect x="57" y="256" width="166" height="16" rx="3" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2.5"/><rect x="65" y="272" width="150" height="250" fill="#FFE3E3" stroke="#2B1B3D" stroke-width="2.5"/><path d="M75 276 V518 M205 276 V518" stroke="#FF6B6B" stroke-width="3" opacity=".45"/><rect x="57" y="522" width="166" height="14" rx="3" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2.5"/><circle cx="140" cy="318" r="31" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2.5"/><g transform="translate(140 318)"><path d="M-20 -13 L-3 0 M-22 0 H-3 M-20 13 L-3 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="-21" cy="-13" r="3.5" fill="#fff"/><circle cx="-23" cy="0" r="3.5" fill="#fff"/><circle cx="-21" cy="13" r="3.5" fill="#fff"/><path d="M-3 0 H19 M12 -7 L20 0 L12 7" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="140" y="376" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">Semplicità</text><text x="140" y="396" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">intrinseca</text><text x="140" y="424" text-anchor="middle" font-size="13.5" fill="#3E3350">Dietro la</text><text x="140" y="442" text-anchor="middle" font-size="13.5" fill="#3E3350">complessità,</text><text x="140" y="460" text-anchor="middle" font-size="13.5" fill="#3E3350">poche cause</text><text x="140" y="478" text-anchor="middle" font-size="13.5" fill="#3E3350">spiegano quasi</text><text x="140" y="496" text-anchor="middle" font-size="13.5" fill="#3E3350">tutto.</text><rect x="237" y="256" width="166" height="16" rx="3" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/><rect x="245" y="272" width="150" height="250" fill="#E0ECFF" stroke="#2B1B3D" stroke-width="2.5"/><path d="M255 276 V518 M385 276 V518" stroke="#3A86FF" stroke-width="3" opacity=".45"/><rect x="237" y="522" width="166" height="14" rx="3" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/><circle cx="320" cy="318" r="31" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/><g transform="translate(320 318)"><path d="M-17 12 a8 8 0 0 1 1 -16 a11 11 0 0 1 21 -3 a9 9 0 0 1 11 19 z" fill="#fff"/><path d="M-8 -12 q-4 -4 0 -8 q4 -4 0 -8 M4 -14 q-4 -4 0 -8 q4 -4 0 -8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/></g><text x="320" y="376" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">Non esistono</text><text x="320" y="396" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">conflitti</text><text x="320" y="424" text-anchor="middle" font-size="13.5" fill="#3E3350">Ogni dilemma</text><text x="320" y="442" text-anchor="middle" font-size="13.5" fill="#3E3350">nasconde un</text><text x="320" y="460" text-anchor="middle" font-size="13.5" fill="#3E3350">presupposto</text><text x="320" y="478" text-anchor="middle" font-size="13.5" fill="#3E3350">sbagliato da</text><text x="320" y="496" text-anchor="middle" font-size="13.5" fill="#3E3350">rimuovere.</text><rect x="417" y="256" width="166" height="16" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/><rect x="425" y="272" width="150" height="250" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="2.5"/><path d="M435 276 V518 M565 276 V518" stroke="#FFB703" stroke-width="3" opacity=".45"/><rect x="417" y="522" width="166" height="14" rx="3" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/><circle cx="500" cy="318" r="31" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/><g transform="translate(500 318)"><path d="M0 16 L-16 0 a9 9 0 0 1 16 -12 a9 9 0 0 1 16 12 z" fill="#fff"/><circle cx="-5" cy="-2" r="2" fill="#FFB703"/><circle cx="5" cy="-2" r="2" fill="#FFB703"/><path d="M-5 4 q5 5 10 0" stroke="#FFB703" stroke-width="2.2" fill="none" stroke-linecap="round"/></g><text x="500" y="376" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">Le persone</text><text x="500" y="396" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">sono buone</text><text x="500" y="424" text-anchor="middle" font-size="13.5" fill="#3E3350">Prima di</text><text x="500" y="442" text-anchor="middle" font-size="13.5" fill="#3E3350">incolpare</text><text x="500" y="460" text-anchor="middle" font-size="13.5" fill="#3E3350">qualcuno, cerca</text><text x="500" y="478" text-anchor="middle" font-size="13.5" fill="#3E3350">la regola o la</text><text x="500" y="496" text-anchor="middle" font-size="13.5" fill="#3E3350">misura dietro.</text><rect x="597" y="256" width="166" height="16" rx="3" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2.5"/><rect x="605" y="272" width="150" height="250" fill="#DDF2EF" stroke="#2B1B3D" stroke-width="2.5"/><path d="M615 276 V518 M745 276 V518" stroke="#2A9D8F" stroke-width="3" opacity=".45"/><rect x="597" y="522" width="166" height="14" rx="3" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2.5"/><circle cx="680" cy="318" r="31" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="2.5"/><g transform="translate(680 318)"><g transform="rotate(40)"><path d="M0 -20 c8 8 8 22 4 28 h-8 c-4 -6 -4 -20 4 -28z" fill="#fff"/><circle cx="0" cy="-4" r="3.5" fill="#2A9D8F"/><path d="M-4 8 l-6 6 v-10z M4 8 l6 6 v-10z" fill="#fff"/><path d="M-3 10 q3 10 6 0" fill="#FFD166"/></g><path d="M-18 -16 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5z M16 -20 l1 2 2 1 -2 1 -1 2 -1 -2 -2 -1 2 -1z" fill="#fff"/></g><text x="680" y="376" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">Il cielo è</text><text x="680" y="396" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">il limite</text><text x="680" y="424" text-anchor="middle" font-size="13.5" fill="#3E3350">Ogni situazione</text><text x="680" y="442" text-anchor="middle" font-size="13.5" fill="#3E3350">può essere</text><text x="680" y="460" text-anchor="middle" font-size="13.5" fill="#3E3350">migliorata in</text><text x="680" y="478" text-anchor="middle" font-size="13.5" fill="#3E3350">modo</text><text x="680" y="496" text-anchor="middle" font-size="13.5" fill="#3E3350">significativo.</text><rect x="777" y="256" width="166" height="16" rx="3" fill="#EF476F" stroke="#2B1B3D" stroke-width="2.5"/><rect x="785" y="272" width="150" height="250" fill="#FDE0E7" stroke="#2B1B3D" stroke-width="2.5"/><path d="M795 276 V518 M925 276 V518" stroke="#EF476F" stroke-width="3" opacity=".45"/><rect x="777" y="522" width="166" height="14" rx="3" fill="#EF476F" stroke="#2B1B3D" stroke-width="2.5"/><circle cx="860" cy="318" r="31" fill="#EF476F" stroke="#2B1B3D" stroke-width="2.5"/><g transform="translate(860 318)"><circle cx="-4" cy="-4" r="13" stroke="#fff" stroke-width="3.5" fill="none"/><path d="M6 6 L17 17" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="-4" y="2" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">?</text></g><text x="860" y="376" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">Mai dire</text><text x="860" y="396" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2B1B3D">“lo so”</text><text x="860" y="424" text-anchor="middle" font-size="13.5" fill="#3E3350">Chi crede di</text><text x="860" y="442" text-anchor="middle" font-size="13.5" fill="#3E3350">sapere tutto</text><text x="860" y="460" text-anchor="middle" font-size="13.5" fill="#3E3350">smette di vedere</text><text x="860" y="478" text-anchor="middle" font-size="13.5" fill="#3E3350">i miglioramenti.</text>
<!-- degraus -->
<rect x="30" y="536" width="940" height="22" rx="3" fill="#E8DCCB" stroke="#2B1B3D" stroke-width="2.5"/>
<rect x="12" y="558" width="976" height="30" rx="4" fill="#D9C6AE" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="500" y="579" text-anchor="middle" font-size="16" font-weight="700" fill="#2B1B3D" letter-spacing="1">ragionamento di causa ed effetto</text>
</svg>
