<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 566" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Un turno, dall’inizio alla fine</title>
<desc id="d">Prima di lanciare puoi costruire e trattare. Poi lanci i dadi, muovi e risolvi la casella: comprare o mandare all’asta, pagare l’affitto, pescare una carta, pagare una tassa o andare in Detenzione. Poi puoi di nuovo costruire e trattare. Con un doppio giochi ancora; senza doppio termini il turno.</desc>
<rect width="1000" height="566" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="26" fill="#2B1B3D" font-weight="700" text-anchor="middle">Un turno, dall’inizio alla fine</text>
<rect x="40" y="76" width="270" height="74" rx="11" fill="#F6EBD9" stroke="#E2D3BC" stroke-width="2"/><text x="175" y="109" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Facoltativo: costruire,</text><text x="175" y="127" font-size="14.5" fill="#2B1B3D" text-anchor="middle">ipotecare o trattare</text><rect x="365" y="76" width="270" height="74" rx="11" fill="#C2471F" stroke="#C2471F" stroke-width="2"/><text x="500" y="118" font-size="14.5" fill="#fff" font-weight="700" text-anchor="middle">Lancia i dadi</text><rect x="690" y="76" width="270" height="74" rx="11" fill="#FFFFFF" stroke="#E2D3BC" stroke-width="2"/><text x="825" y="109" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Muovi. Passato il Largo:</text><text x="825" y="127" font-size="14.5" fill="#2B1B3D" text-anchor="middle">ricevi P$ 200</text><path d="M310 113L362 113" stroke="#5E5170" stroke-width="2.4" fill="none"/><path d="M362 113L354.1 117.3L354.1 108.7Z" fill="#5E5170"/><path d="M635 113L687 113" stroke="#5E5170" stroke-width="2.4" fill="none"/><path d="M687 113L679.1 117.3L679.1 108.7Z" fill="#5E5170"/><path d="M825 150V182M116 182H884" fill="none" stroke="#5E5170" stroke-width="2.4"/><path d="M116 182V210" stroke="#5E5170" stroke-width="2.4"/><path d="M116 212l-5 -9h10z" fill="#5E5170"/><rect x="40" y="212" width="152" height="112" rx="11" fill="#FFFFFF" stroke="#E2D3BC" stroke-width="2"/><text x="116" y="264" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Libera: compra o</text><text x="116" y="282" font-size="14.5" fill="#2B1B3D" text-anchor="middle">manda all’asta</text><path d="M308 182V210" stroke="#5E5170" stroke-width="2.4"/><path d="M308 212l-5 -9h10z" fill="#5E5170"/><rect x="232" y="212" width="152" height="112" rx="11" fill="#FFFFFF" stroke="#E2D3BC" stroke-width="2"/><text x="308" y="264" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Di un altro: paga</text><text x="308" y="282" font-size="14.5" fill="#2B1B3D" text-anchor="middle">l’affitto</text><path d="M500 182V210" stroke="#5E5170" stroke-width="2.4"/><path d="M500 212l-5 -9h10z" fill="#5E5170"/><rect x="424" y="212" width="152" height="112" rx="11" fill="#FFFFFF" stroke="#E2D3BC" stroke-width="2"/><text x="500" y="255" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Minuano o</text><text x="500" y="273" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Chimarrão: pesca</text><text x="500" y="291" font-size="14.5" fill="#2B1B3D" text-anchor="middle">una carta</text><path d="M692 182V210" stroke="#5E5170" stroke-width="2.4"/><path d="M692 212l-5 -9h10z" fill="#5E5170"/><rect x="616" y="212" width="152" height="112" rx="11" fill="#FFFFFF" stroke="#E2D3BC" stroke-width="2"/><text x="692" y="264" font-size="14.5" fill="#2B1B3D" text-anchor="middle">IPTU o ISS: paga</text><text x="692" y="282" font-size="14.5" fill="#2B1B3D" text-anchor="middle">la tassa</text><path d="M884 182V210" stroke="#5E5170" stroke-width="2.4"/><path d="M884 212l-5 -9h10z" fill="#5E5170"/><rect x="808" y="212" width="152" height="112" rx="11" fill="#FFFFFF" stroke="#E2D3BC" stroke-width="2"/><text x="884" y="264" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Vai in Detenzione:</text><text x="884" y="282" font-size="14.5" fill="#2B1B3D" text-anchor="middle">il turno finisce</text><path d="M116 324V372H884V324" fill="none" stroke="#5E5170" stroke-width="2.4"/><path d="M308 324V372" stroke="#5E5170" stroke-width="2.4"/><path d="M500 324V372" stroke="#5E5170" stroke-width="2.4"/><path d="M692 324V372" stroke="#5E5170" stroke-width="2.4"/><path d="M500 372L500 404" stroke="#5E5170" stroke-width="2.4" fill="none"/><path d="M500 404L495.7 396.1L504.3 396.1Z" fill="#5E5170"/><rect x="320" y="406" width="360" height="62" rx="11" fill="#F6EBD9" stroke="#E2D3BC" stroke-width="2"/><text x="500" y="433" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Facoltativo: costruire,</text><text x="500" y="451" font-size="14.5" fill="#2B1B3D" text-anchor="middle">ipotecare o trattare</text><path d="M320 437L180 437" stroke="#5E5170" stroke-width="2.4" fill="none"/><path d="M180 437L187.9 432.7L187.9 441.3Z" fill="#5E5170"/><rect x="40" y="406" width="138" height="62" rx="11" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="109" y="433" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Doppio: gioca</text><text x="109" y="451" font-size="14.5" fill="#2B1B3D" text-anchor="middle">ancora</text><path d="M680 437L820 437" stroke="#5E5170" stroke-width="2.4" fill="none"/><path d="M820 437L812.1 441.3L812.1 432.7Z" fill="#5E5170"/><rect x="822" y="406" width="138" height="62" rx="11" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="891" y="433" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Termina il</text><text x="891" y="451" font-size="14.5" fill="#2B1B3D" text-anchor="middle">turno</text><path d="M110 406V386H16V113H38" fill="none" stroke="#0E8074" stroke-width="2.2" stroke-dasharray="6 5"/><text x="500" y="520" font-size="14" fill="#5E5170" text-anchor="middle">Tre doppi di fila portano in Detenzione. Se mancano i soldi per pagare, il gioco chiede di trovarli prima di</text><text x="500" y="540" font-size="14" fill="#5E5170" text-anchor="middle">proseguire.</text>
</svg>
