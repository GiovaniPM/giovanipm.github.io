<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">O que faz o Cálculo Numérico</title>
<desc id="d">Fluxo em quatro etapas. Um problema contínuo, como achar a raiz de 2, a área sob uma curva ou a solução de uma equação, vira um algoritmo com passos finitos de soma, subtração, multiplicação e divisão. O algoritmo produz uma resposta aproximada, como 1,41421, e o erro é medido. Se o erro ainda for grande, o algoritmo repete. Embaixo, os três tipos de erro: de modelo, quando a equação simplifica a realidade; de truncamento, quando paramos um processo infinito; e de arredondamento, quando guardamos só algumas casas decimais.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">O que faz o Cálculo Numérico</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Trocar o “exato impossível” pelo “aproximado confiável”</text><rect x="40" y="110" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="140" y="140" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700">Problema</text><text x="140" y="166" font-size="14" fill="#2B1B3D" text-anchor="middle">√2 = ?</text><text x="140" y="186" font-size="14" fill="#2B1B3D" text-anchor="middle">área sob a curva</text><text x="140" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">equação sem fórmula</text><line x1="244" y1="185" x2="276" y2="185" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="280" y="110" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><text x="380" y="140" font-size="18" fill="#3A86FF" text-anchor="middle" font-weight="700">Algoritmo</text><text x="380" y="166" font-size="14" fill="#2B1B3D" text-anchor="middle">passos finitos</text><text x="380" y="186" font-size="14" fill="#2B1B3D" text-anchor="middle">+  −  ×  ÷</text><text x="380" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">repetidos muitas vezes</text><line x1="484" y1="185" x2="516" y2="185" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="520" y="110" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="620" y="140" font-size="18" fill="#2A9D8F" text-anchor="middle" font-weight="700">Resposta</text><text x="620" y="166" font-size="14" fill="#2B1B3D" text-anchor="middle">1,41421…</text><text x="620" y="186" font-size="14" fill="#2B1B3D" text-anchor="middle">um número</text><text x="620" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">que dá para usar</text><line x1="724" y1="185" x2="756" y2="185" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="760" y="110" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><text x="860" y="140" font-size="18" fill="#B35300" text-anchor="middle" font-weight="700">Erro medido</text><text x="860" y="166" font-size="14" fill="#2B1B3D" text-anchor="middle">|erro| &lt; 0,00001?</text><text x="860" y="186" font-size="14" fill="#2B1B3D" text-anchor="middle">sim: pare</text><text x="860" y="206" font-size="14" fill="#2B1B3D" text-anchor="middle">não: repita</text><path d="M 860 262 C 860 320 520 320 520 266" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ac)"/><text x="690" y="330" font-size="14" fill="#FF6B6B" text-anchor="middle" font-weight="700">erro grande? volte e melhore</text><text x="500" y="378" font-size="18" fill="#2B1B3D" text-anchor="middle" font-weight="700">De onde vem o erro?</text><rect x="40" y="400" width="280" height="90" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="180" y="432" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">Modelo</text><text x="180" y="462" font-size="14" fill="#2B1B3D" text-anchor="middle">a equação simplifica o mundo</text><rect x="360" y="400" width="280" height="90" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><text x="500" y="432" font-size="17" fill="#3A86FF" text-anchor="middle" font-weight="700">Truncamento</text><text x="500" y="462" font-size="14" fill="#2B1B3D" text-anchor="middle">paramos um processo infinito</text><rect x="680" y="400" width="280" height="90" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><text x="820" y="432" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">Arredondamento</text><text x="820" y="462" font-size="14" fill="#2B1B3D" text-anchor="middle">guardamos poucas casas</text>
</svg>
