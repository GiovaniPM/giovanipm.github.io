<rect x="370" y="74" width="260" height="72" rx="14" fill="#FFFFFF" stroke="#2F6FE0" stroke-width="2.5"/>
<text x="500.0" y="104.0" font-size="17" font-weight="700" fill="#2F6FE0" text-anchor="middle">E-mail</text>
<text x="500.0" y="128.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">azioni, in attesa, riferimento</text>
