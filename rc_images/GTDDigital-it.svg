<path d="M764.0 444.0 L648.9 399.6" stroke="#E04E6B" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M638.6 395.6 L651.0 394.0 L646.7 405.2 Z" fill="#E04E6B"/>
