<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Una casella di entrata per il mondo digitale</title>
<desc id="d">Diagramma con una casella di entrata al centro e sei fonti digitali intorno, ciascuna con ciò che di solito diventa: agenda, solo ciò che ha giorno e ora; e-mail, azioni, in attesa e riferimento; siti e letture, liste da leggere e riferimento; telefono e voce, raccolta ovunque; file e note, riferimento e materiale di supporto ai progetti; messaggi e chat, richieste che diventano azioni.</desc>
<rect width="1000" height="600" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Una casella di entrata per il mondo digitale</text>
