<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Madhava: séries infinitas com correção de erro</title>
<desc id="d">À esquerda, um gráfico das somas parciais da série 4 × (1 − 1/3 + 1/5 − 1/7 + …) para 1 a 10 termos: elas pulam acima e abaixo de π e chegam devagar, ainda com 3,04 depois de 10 termos. A linha corrigida, somando o termo de correção de Madhava, n ÷ (4n² + 1), já fica praticamente em cima de π desde o terceiro termo: 3,1414 com 4 termos e 3,1415902 com 10. À direita, a série rápida de Madhava, π = √12 × (1 − 1/(3·3) + 1/(5·3²) − 1/(7·3³) + …), com a qual ele obteve π com 11 casas decimais: 3,14159265359.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Madhava: séries infinitas com correção de erro</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Kerala, c. 1400: somar infinitos termos e corrigir o resto</text><line x1="90" y1="470" x2="520" y2="470" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="90" y1="470" x2="90" y2="130" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="86" y1="426" x2="510" y2="426" stroke="#F1E2CF" stroke-width="1"/><text x="82" y="430" font-size="11" fill="#756986" text-anchor="end">2,8</text><line x1="86" y1="382" x2="510" y2="382" stroke="#F1E2CF" stroke-width="1"/><text x="82" y="386" font-size="11" fill="#756986" text-anchor="end">3,0</text><line x1="86" y1="338" x2="510" y2="338" stroke="#F1E2CF" stroke-width="1"/><text x="82" y="342" font-size="11" fill="#756986" text-anchor="end">3,2</text><line x1="86" y1="294" x2="510" y2="294" stroke="#F1E2CF" stroke-width="1"/><text x="82" y="298" font-size="11" fill="#756986" text-anchor="end">3,4</text><line x1="86" y1="250" x2="510" y2="250" stroke="#F1E2CF" stroke-width="1"/><text x="82" y="254" font-size="11" fill="#756986" text-anchor="end">3,6</text><line x1="86" y1="206" x2="510" y2="206" stroke="#F1E2CF" stroke-width="1"/><text x="82" y="210" font-size="11" fill="#756986" text-anchor="end">3,8</text><line x1="86" y1="162" x2="510" y2="162" stroke="#F1E2CF" stroke-width="1"/><text x="82" y="166" font-size="11" fill="#756986" text-anchor="end">4,0</text><line x1="90" y1="350.85" x2="510" y2="350.85" stroke="#B35300" stroke-width="1.5" stroke-dasharray="6 5"/><text x="514" y="355.85" font-size="16" fill="#B35300" text-anchor="start" font-weight="700">π</text><text x="111" y="488" font-size="11" fill="#756986" text-anchor="middle">1</text><text x="153" y="488" font-size="11" fill="#756986" text-anchor="middle">2</text><text x="195" y="488" font-size="11" fill="#756986" text-anchor="middle">3</text><text x="237" y="488" font-size="11" fill="#756986" text-anchor="middle">4</text><text x="279" y="488" font-size="11" fill="#756986" text-anchor="middle">5</text><text x="321" y="488" font-size="11" fill="#756986" text-anchor="middle">6</text><text x="363" y="488" font-size="11" fill="#756986" text-anchor="middle">7</text><text x="405" y="488" font-size="11" fill="#756986" text-anchor="middle">8</text><text x="447" y="488" font-size="11" fill="#756986" text-anchor="middle">9</text><text x="489" y="488" font-size="11" fill="#756986" text-anchor="middle">10</text><polyline points="111.0,162.0 153.0,455.3 195.0,279.3 237.0,405.0 279.0,307.3 321.0,387.3 363.0,319.6 405.0,378.2 447.0,326.5 489.0,372.8" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linejoin="round"/><polyline points="111.0,338.0 153.0,351.8 195.0,350.7 237.0,350.9 279.0,350.8 321.0,350.9 363.0,350.8 405.0,350.9 447.0,350.8 489.0,350.9" fill="none" stroke="#2A9D8F" stroke-width="3" stroke-linejoin="round"/><circle cx="111" cy="162" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="153" cy="455.333" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="195" cy="279.333" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="237" cy="405.048" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="279" cy="307.27" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="321" cy="387.27" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="363" cy="319.578" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="405" cy="378.244" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="447" cy="326.479" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="489" cy="372.795" r="4.5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1"/><circle cx="111" cy="338" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="153" cy="351.804" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="195" cy="350.685" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="237" cy="350.894" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="279" cy="350.834" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="321" cy="350.856" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="363" cy="350.847" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="405" cy="350.851" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="447" cy="350.849" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><circle cx="489" cy="350.85" r="4.5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1"/><text x="300" y="510" font-size="13" fill="#756986" text-anchor="middle">número de termos</text><text x="110" y="128" font-size="13" fill="#FF6B6B" text-anchor="start" font-weight="700">sem correção: 1 − 1/3 + 1/5 − …</text><text x="110" y="148" font-size="13" fill="#2A9D8F" text-anchor="start" font-weight="700">com a correção de Madhava</text><rect x="560" y="100" width="410" height="180" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="765" y="130" font-size="17" fill="#2A9D8F" text-anchor="middle" font-weight="700">O truque da correção</text><text x="765" y="162" font-size="14" fill="#2B1B3D" text-anchor="middle">Parou no termo n? Some ± n ÷ (4n² + 1)</text><text x="765" y="188" font-size="14" fill="#2B1B3D" text-anchor="middle">para estimar o pedaço que faltou.</text><text x="765" y="214" font-size="14" fill="#2B1B3D" text-anchor="middle">10 termos: 3,04 → 3,1415902</text><text x="765" y="262" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">É uma estimativa do erro de truncamento!</text><rect x="560" y="300" width="410" height="200" rx="12" fill="#FFF1C9"/><text x="765" y="330" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">A série rápida</text><text x="765" y="366" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">π = √12 × (1 − 1/(3·3) + 1/(5·3²) − …)</text><text x="765" y="402" font-size="14" fill="#2B1B3D" text-anchor="middle">Cada termo é 3 vezes menor:</text><text x="765" y="426" font-size="14" fill="#2B1B3D" text-anchor="middle">com 21 termos, π com 11 casas:</text><text x="765" y="470" font-size="22" fill="#5B2A86" text-anchor="middle" font-weight="700">3,14159265359</text>
</svg>
