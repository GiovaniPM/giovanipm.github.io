nt-baseline="central">reimbursement</tspan></text></g><g><path d="M855 60L880 85L855 110L830 85Z" class="b-gw"/><path d="M-9 -11.5-6.3-11.5 0-2.6 6.3-11.5 9-11.5 1.7 0 9 11.5 6.3 11.5 0 2.6-6.3 11.5-9 11.5-1.7 0Z" class="b-ink" transform="translate(855 85) scale(1)"/></g><g><rect x="980" y="45" width="100" height="80" rx="10" class="b-fill"/><g transform="translate(986 50)"><path d="M10.2 6L12 6M8.9698484809835 8.969848480983499L10.242640687119286 10.242640687119284M6 10.2L6 12M3.0301515190165005 8.9698484809835L1.7573593128807152 10.242640687119286M1.7999999999999998 6.000000000000001L0 6.000000000000001M3.0301515190164996 3.0301515190165005L1.7573593128807143 1.7573593128807152M5.999999999999999 1.7999999999999998L5.999999999999999 0M8.969848480983499 3.0301515190164996L10.242640687119284 1.7573593128807143" class="b-line"/><circle cx="6" cy="6" r="4.2" class="b-blank"/><circle cx="6" cy="6" r="1.6" class="b-thin"/><path d="M14.7 10.5L16.5 10.5M13.4698484809835 13.469848480983499L14.742640687119286 14.742640687119284M10.5 14.7L10.5 16.5M7.530151519016501 13.4698484809835L6.257359312880715 14.742640687119286M6.3 10.5L4.5 10.5M7.530151519016499 7.530151519016501L6.257359312880714 6.257359312880715M10.5 6.3L10.499999999999998 4.5M13.469848480983499 7.530151519016499L14.742640687119284 6.257359312880714" class="b-line"/><circle cx="10.5" cy="10.5" r="4.2" class="b-blank"/><circle cx="10.5" cy="10.5" r="1.6" class="b-thin"/></g><text class="b-text"><tspan x="1030" y="81.75" dominant-baseline="central">Pay</tspan><tspan x="1030" y="96.25" dominant-baseline="central">reimbursement</tspan></text></g><g><circle cx="1148" cy="85" r="16.8" class="b-end"/><text class="b-text"><tspan x="1148" y="115.25" dominant-baseline="central">Reimbursement</tspan><tspan x="1148" y="129.75" dominant-baseline="central">paid</tspan></text></g><g><circle cx="555" cy="273" r="16.8" class="b-end"/><text class="b-text"><tspan x="555" y="303.25" dominant-baseline="central">Request</tspan><tspan x