<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 363" role="img" aria-labelledby="t d" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif"><title id="t">Expense reimbursement</title><desc id="d">After the expense is submitted, someone checks the receipt. With no valid receipt, the request is declined. With one, amounts above 500 go through approval; then the reimbursement is paid.</desc><style>:root{--b-fill:#fff;--b-line:#2B1B3D;--b-muted:#5E5170;--b-pool:#fff;--b-font:'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;--b-mono:Consolas,monospace}
.grid-dot{fill:var(--dot)}
.b-fill{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-line{fill:none;stroke:var(--b-line);stroke-width:1.6}
.b-thin{fill:none;stroke:var(--b-line);stroke-width:1.2}
.b-ink{fill:var(--b-line);stroke:none}
.b-blank{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.2}
.b-text{fill:var(--b-line);font:12px var(--b-font);text-anchor:middle;pointer-events:none}
.b-note{fill:var(--b-line);font:12px var(--b-font);text-anchor:start;pointer-events:none}
.b-small{fill:var(--b-muted);font:10.5px var(--b-mono);text-anchor:middle;pointer-events:none}
.b-event{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-end{fill:var(--b-fill);stroke:var(--b-line);stroke-width:3.4}
.b-gw{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-pool{fill:var(--b-pool);stroke:var(--b-line);stroke-width:1.6}
.b-lane{fill:none;stroke:var(--b-line);stroke-width:1}
.b-group{fill:none;stroke:var(--b-line);stroke-width:1.4;stroke-dasharray:9 4 2 4}
.b-seq{fill:none;stroke:var(--b-line);stroke-width:1.5;marker-end:url(#m-seq)}
.b-msg{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:7 5;marker-start:url(#m-msg-start);marker-end:url(#m-msg-end)}
.b-assoc{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.b-assoc.one{marker-end:url(#m-open)}
.b-assoc.both{marker-start:url(#m-open-s);marker-end:url(#m-open)}
.b-data{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round;marker-end:url(#m-open)}
.b-text{font-size:12px}</style><defs><marker id="m-seq" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="m-msg-end" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11z" fill="#fff" stroke="#2B1B3D" stroke-width="1.2"/></marker><marker id="m-msg-start" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#2B1B3D" stroke-width="1.4"/></marker><marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker><marker id="m-open-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 1 6 11 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker></defs><rect width="1000" height="363" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Expense reimbursement</text><svg x="20" y="60" width="960" height="282.8" viewBox="23 2.5 1200 353.5"><g><g/><g><g><path d="M116 78L230 78" class="b-seq"/></g><g><path d="M330 78L380 78" class="b-seq"/></g><g><path d="M405 103L405 85L530 85" class="b-seq"/><text class="b-text"><tspan x="467.5" y="73.75" dominant-baseline="central">Yes</tspan></text></g><g><path d="M405 103L405 273L537 273" class="b-seq"/><path d="M399.5 110L410.5 118" class="b-line"/><text class="b-text"><tspan x="430" y="188" dominant-baseline="central">No</tspan></text></g><g><path d="M555 110L555 175L680 175" class="b-seq"/><text class="b-text"><tspan x="617.5" y="163.75" dominant-baseline="central">Yes</tspan></text></g><g><path d="M580 85L830 85" cla