<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 252" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><title id="t">A sua vez</title><desc id="d">Cinco passos: olhar a carta de cima do lixo, comprar do monte ou do lixo, ver se formou algum jogo, bater se todas as cartas encaixam e, se não, descartar uma carta e passar a vez.</desc><rect width="1000" height="252" rx="18" fill="#FFF7EC"/><text x="500" y="42" font-size="25" fill="#2B1B3D" font-weight="700" text-anchor="middle">A sua vez</text><rect x="23" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="108" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="108" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Olhe a carta de</text><text x="108" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">cima do lixo</text><path d="M196 136H214" stroke="#5E5170" stroke-width="2.4"/><path d="M216 136l-9 -5v10z" fill="#5E5170"/><rect x="219" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="304" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="304" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="304" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Compre: do monte ou</text><text x="304" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">do lixo</text><path d="M392 136H410" stroke="#5E5170" stroke-width="2.4"/><path d="M412 136l-9 -5v10z" fill="#5E5170"/><rect x="415" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="500" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="500" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="500" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Veja se formou um</text><text x="500" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">jogo</text><path d="M588 136H606" stroke="#5E5170" stroke-width="2.4"/><path d="M608 136l-9 -5v10z" fill="#5E5170"/><rect x="611" y="72" width="170" height="128" rx="12" fill="#FFF1C9" stroke="#E5A93C" stroke-width="2"/><circle cx="696" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="696" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="696" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Tudo encaixou?</text><text x="696" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">Bata!</text><path d="M784 136H802" stroke="#5E5170" stroke-width="2.4"/><path d="M804 136l-9 -5v10z" fill="#5E5170"/><rect x="807" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="892" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="892" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="892" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Se não, descarte</text><text x="892" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">uma e passe a vez</text><text x="500" y="232" font-size="14.5" fill="#5E5170" text-anchor="middle">Você começa a vez com 9 cartas, fica com 10 depois de comprar e termina com 9.</text></svg>
