<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Fluxo dos Real-Time Events</title>
<desc id="d">Uma transação no JDE, como um pedido de venda no P4210, faz a business function gerar um evento XML, por exemplo RTSOOUT. Os kernels de eventos do Enterprise Server, com a tabela F90710, passam o evento ao Transaction Server, em WebLogic com filas JMS e entrega garantida por assinante, que o distribui para uma fila JMS ou MQ, para o Orchestrator como notificação ou para um web service via BSSV. Os tipos de evento são Z events, real-time events e XAPI. A configuração ativa o evento no P90701A, cadastra assinantes e transportes no P90702A, define os kernels no jde.ini e instala o Transaction Server pelo Server Manager.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
