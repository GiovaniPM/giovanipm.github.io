<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 252" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><title id="t">Tu turno</title><desc id="d">Cinco pasos: mirar el descarte superior, robar del mazo o de los descartes, ver si se formó un juego, golpear si todas las cartas encajan y, si no, descartar una carta y pasar el turno.</desc><rect width="1000" height="252" rx="18" fill="#FFF7EC"/><text x="500" y="42" font-size="25" fill="#2B1B3D" font-weight="700" text-anchor="middle">Tu turno</text><rect x="23" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="108" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="108" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Mira el descarte de</text><text x="108" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">arriba</text><path d="M196 136H214" stroke="#5E5170" stroke-width="2.4"/><path d="M216 136l-9 -5v10z" fill="#5E5170"/><rect x="219" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="304" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="304" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="304" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Roba: mazo o</text><text x="304" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">descartes</text><path d="M392 136H410" stroke="#5E5170" stroke-width="2.4"/><path d="M412 136l-9 -5v10z" fill="#5E5170"/><rect x="415" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="500" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="500" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="500" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Mira si formaste un</text><text x="500" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">juego</text><path d="M588 136H606" stroke="#5E5170" stroke-width="2.4"/><path d="M608 136l-9 -5v10z" fill="#5E5170"/><rect x="611" y="72" width="170" height="128" rx="12" fill="#FFF1C9" stroke="#E5A93C" stroke-width="2"/><circle cx="696" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="696" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="696" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">¿Todo encaja?</text><text x="696" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">¡Golpea!</text><path d="M784 136H802" stroke="#5E5170" stroke-width="2.4"/><path d="M804 136l-9 -5v10z" fill="#5E5170"/><rect x="807" y="72" width="170" height="128" rx="12" fill="#fff" stroke="#E2D3BC" stroke-width="2"/><circle cx="892" cy="72" r="14" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="892" y="77" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="892" y="128" font-size="15" fill="#2B1B3D" text-anchor="middle">Si no, descarta y</text><text x="892" y="148" font-size="15" fill="#2B1B3D" text-anchor="middle">pasa el turno</text><text x="500" y="232" font-size="14.5" fill="#5E5170" text-anchor="middle">Empiezas el turno con 9 cartas, tienes 10 después de robar y terminas con 9.</text></svg>
