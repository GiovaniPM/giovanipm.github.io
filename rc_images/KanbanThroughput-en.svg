<title id="t">Weekly throughput: items finished per week</title>
<desc id="d">Bar chart of throughput over ten weeks: 6, 8, 5, 9, 7, 4, 8, 10, 7 and 8 items finished, with a mean of 7.2 per week marked by a dashed line.</desc>
