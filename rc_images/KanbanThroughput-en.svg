<text x="132.0" y="109.0" font-size="13" fill="#C2185B" font-weight="700">mean: 7.2 per week</text>
<text x="50.0" y="270.0" font-size="12" fill="#3E3350" text-anchor="middle" font-weight="700" transform="rotate(-90 50 270)">items finished</text>
<text x="500.0" y="450.0" font-size="13" fill="#3E3350" text-anchor="middle">Variation is normal: the mean is 7.2, but there were weeks with 4 and with 10.</text>
<text x="500.0" y="472.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">To forecast dates, use the whole history, for example in a Monte Carlo simulation, not just the mean.</text>
