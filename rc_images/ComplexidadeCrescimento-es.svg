<text x="338" y="124" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">n²</text>
<text x="338" y="146" font-size="12.5" fill="#E9DDF5" text-anchor="middle" font-style="italic">comparar todos los pares</text>
<rect x="464" y="96" width="236" height="60" rx="10" fill="#5B2A86"/>
<text x="582" y="124" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">2ⁿ</text>
<text x="582" y="146" font-size="12.5" fill="#E9DDF5" text-anchor="middle" font-style="italic">probar todas las combinaciones</text>
