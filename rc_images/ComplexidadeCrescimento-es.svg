<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cuando el número de pasos explota</title>
<desc id="d">Tabla de colores con el tiempo necesario, en una computadora de 1.000 millones de pasos por segundo, para algoritmos de n al cuadrado, 2 a la n y n factorial pasos, con n igual a 10, 20, 30, 50 y 100. n = 10: n², &lt; 1 milisegundo; 2ⁿ, &lt; 1 milisegundo; n!, 3,6 ms. n = 20: n², &lt; 1 milisegundo; 2ⁿ, 1,0 ms; n!, 77 años. n = 30: n², &lt; 1 milisegundo; 2ⁿ, 1,1 s; n!, 10¹⁵ años. n = 50: n², &lt; 1 milisegundo; 2ⁿ, 13 días; n!, 10⁴⁷ años. n = 100: n², &lt; 1 milisegundo; 2ⁿ, 40 billones de años; n!, 10¹⁴¹ años.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
