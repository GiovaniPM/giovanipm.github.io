<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Del proyecto al producto: qué cambia</title>
<desc id="d">Comparación entre proyecto y producto. Equipo: en el proyecto se forma y se disuelve al final; en el producto es estable y de larga duración. Trabajo: en el proyecto las personas van al trabajo; en el producto el trabajo va al equipo. Financiación: por proyecto, aprobada una vez, frente a continua, por capacidad, revisada cada trimestre. Éxito: plazo, costo y alcance, frente a resultados para el negocio y el cliente. Fin: entregado y pasado al mantenimiento, frente a evoluciona mientras genere valor. Riesgo: concentrado al final, frente a repartido en entregas pequeñas.</desc>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Del proyecto al producto: qué cambia</text>
<rect x="40" y="78" width="360" height="46" rx="12" fill="#FF6B6B"/>
<text x="220" y="108" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Proyecto</text>
<rect x="600" y="78" width="360" height="46" rx="12" fill="#0E8074"/>
<text x="780" y="108" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Producto (flujo de valor)</text>
<rect x="40" y="140" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="140" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="140" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="140" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="163.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Formado para el proyecto,</text><text x="220" y="182.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">disuelto al final</text>
<text x="780" y="173.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Estable y de larga duración</text>
<path d="M414 146 H566 L586 168.0 L566 190 H414 Z" fill="#5B2A86"/>
<text x="494" y="173.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Equipo</text>
<rect x="40" y="204" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="204" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="204" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="204" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="237.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Las personas van al trabajo</text>
<text x="780" y="237.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">El trabajo va al equipo</text>
<path d="M414 210 H566 L586 232.0 L566 254 H414 Z" fill="#5B2A86"/>
<text x="494" y="237.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Trabajo</text>
<rect x="40" y="268" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="268" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="268" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="268" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="301.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Por proyecto, aprobado una vez</text>
<text x="780" y="291.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Continuo, por capacidad,</text><text x="780" y="310.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">revisado cada trimestre</text>
<path d="M414 274 H566 L586 296.0 L566 318 H414 Z" fill="#5B2A86"/>
<text x="494" y="301.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Financiación</text>
<rect x="40" y="332" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="332" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="332" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="332" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="365.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Plazo, costo y alcance</text>
<text x="780" y="355.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Resultados para el negocio</text><text x="780" y="374.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">y para el cliente</text>
<path d="M414 338 H566 L586 360.0 L566 382 H414 Z" fill="#5B2A86"/>
<text x="494" y="365.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Éxito</text>
<rect x="40" y="396" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="396" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="396" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="396" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="419.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Entregado y pasado</text><text x="220" y="438.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">al mantenimiento</text>
<text x="780" y="419.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Evoluciona mientras</text><text x="780" y="438.5" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">genere valor</text>
<path d="M414 402 H566 L586 424.0 L566 446 H414 Z" fill="#5B2A86"/>
<text x="494" y="429.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Fin</text>
<rect x="40" y="460" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="600" y="460" width="360" height="56" rx="10" fill="#fff" stroke="#F1E2CF" stroke-width="2"/>
<rect x="40" y="460" width="6" height="56" rx="3" fill="#FF6B6B"/>
<rect x="954" y="460" width="6" height="56" rx="3" fill="#0E8074"/>
<text x="220" y="493.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Concentrado al final</text>
<text x="780" y="493.0" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Repartido en entregas pequeñas</text>
<path d="M414 466 H566 L586 488.0 L566 510 H414 Z" fill="#5B2A86"/>
<text x="494" y="493.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Riesgo</text>
<text x="500" y="540" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Basado en Kersten (2018) y Kelly (2018).</text>
</svg>
