<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Customize or evolve the process</title>
<desc id="d">Decision tree with two questions and three paths. Faced with a request for a new system, first ask why the process exists. First question: is it a competitive differentiator? If yes, customize, since it is something competitors cannot match. If not, second question: does AI remove entire steps? If yes, redesign the flow from scratch. If not, evolve the process with best practices and standard tools, as in finance, HR and purchasing. A warning notes that automating a bad process only produces errors at scale.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="600" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Customize or evolve the process?</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Two questions, three paths</text>

<rect x="290" y="96" width="420" height="72" rx="12" fill="#2B1B3D"/>
<text x="500" y="126" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Request for a new system</text>
<text x="500" y="150" font-size="13" fill="#FFD9A0" text-anchor="middle" font-style="italic">before any code: why does this process exist?</text>

<g stroke="#2B1B3D" stroke-width="2.5" fill="none" marker-end="url(#ar)">
<line x1="500" y1="168" x2="500" y2="196"/>
<line x1="340" y1="255" x2="274" y2="255"/>
<line x1="500" y1="310" x2="500" y2="341"/>
<line x1="660" y1="400" x2="726" y2="400"/>
<line x1="500" y1="455" x2="500" y2="491"/>
</g>
<g font-size="14" font-weight="700">
<text x="307" y="245" fill="#2A9D8F" text-anchor="middle">Yes</text>
<text x="515" y="332" fill="#E23B3B">No</text>
<text x="693" y="390" fill="#2A9D8F" text-anchor="middle">Yes</text>
<text x="515" y="478" fill="#E23B3B">No</text>
</g>

<path d="M500 200 L660 255 L500 310 L340 255 z" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500" y="250" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Is it a competitive</text>
<text x="500" y="270" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">differentiator?</text>

<path d="M500 345 L660 400 L500 455 L340 400 z" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500" y="395" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Does AI remove</text>
<text x="500" y="415" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">entire steps?</text>

<rect x="50" y="215" width="220" height="80" rx="12" fill="#3A86FF"/>
<text x="160" y="246" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Customize</text>
<text x="160" y="268" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">what competitors</text>
<text x="160" y="285" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">cannot match</text>

<rect x="730" y="360" width="220" height="80" rx="12" fill="#FF6B6B"/>
<text x="840" y="394" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Redesign</text>
<text x="840" y="418" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">the flow from scratch</text>

<rect x="310" y="495" width="380" height="84" rx="12" fill="#2A9D8F"/>
<text x="500" y="525" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Evolve the process</text>
<text x="500" y="547" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">best practices and standard tools</text>
<text x="500" y="566" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">e.g. finance, HR, purchasing</text>

<rect x="730" y="205" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2" stroke-dasharray="6 4"/>
<text x="840" y="236" font-size="14" fill="#E23B3B" text-anchor="middle" font-weight="700">Warning</text>
<text x="840" y="260" font-size="13" fill="#2B1B3D" text-anchor="middle">Automating a bad process</text>
<text x="840" y="279" font-size="13" fill="#2B1B3D" text-anchor="middle">only produces</text>
<text x="840" y="298" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">errors at scale</text>
</svg>
