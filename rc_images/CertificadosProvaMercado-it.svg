<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cosa misura l’esame × cosa premia il mercato</title>
<desc id="d">Due pannelli. A sinistra, ciò che l’esame di certificazione misura e che l’IA fornisce già da sola: sintassi dei comandi, configurazione passo per passo, risposte ai test di prova, contenuti del manuale a memoria e scelta multipla standardizzata. Una freccia indica che il valore migra verso destra, dove c’è ciò che il mercato premia: formulazione dei problemi, giudizio tecnico, pensiero sistemico, conoscenza del business e prova di esecuzione. Sotto, due barre confrontano il premio retributivo medio nel 1º trimestre 2026: 9,3% per le competenze non certificate e 6,5% per le certificazioni.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="590" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cosa misura l’esame × cosa premia il mercato</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">La conoscenza attestata dalla certificazione è proprio ciò che l’IA fa meglio</text>

<rect x="50" y="100" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<path d="M50 114 a14 14 0 0 1 14 -14 h362 a14 14 0 0 1 14 14 v46 h-390 z" fill="#E23B3B"/>
<text x="245" y="128" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Cosa misura l’esame</text>
<text x="245" y="149" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">l’IA lo fornisce già da sola</text>
<g font-size="16" fill="#2B1B3D">
<circle cx="80" cy="190" r="6" fill="#E23B3B"/><text x="98" y="195">Sintassi dei comandi</text>
<circle cx="80" cy="240" r="6" fill="#E23B3B"/><text x="98" y="245">Configurazione passo per passo</text>
<circle cx="80" cy="290" r="6" fill="#E23B3B"/><text x="98" y="295">Risposte ai test di prova</text>
<circle cx="80" cy="340" r="6" fill="#E23B3B"/><text x="98" y="345">Contenuti del manuale a memoria</text>
<circle cx="80" cy="390" r="6" fill="#E23B3B"/><text x="98" y="395">Scelta multipla standardizzata</text>
</g>

<line x1="452" y1="265" x2="546" y2="265" stroke="#5B2A86" stroke-width="3" marker-end="url(#ap)"/>
<text x="500" y="250" font-size="13" fill="#5B2A86" text-anchor="middle" font-style="italic">il valore</text>
<text x="500" y="290" font-size="13" fill="#5B2A86" text-anchor="middle" font-style="italic">migra</text>

<rect x="560" y="100" width="390" height="330" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M560 114 a14 14 0 0 1 14 -14 h362 a14 14 0 0 1 14 14 v46 h-390 z" fill="#2A9D8F"/>
<text x="755" y="128" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Cosa premia il mercato</text>
<text x="755" y="149" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">distingue un professionista dall’altro</text>
<g font-size="16" fill="#2B1B3D">
<circle cx="590" cy="190" r="6" fill="#2A9D8F"/><text x="608" y="195">Formulazione dei problemi</text>
<circle cx="590" cy="240" r="6" fill="#2A9D8F"/><text x="608" y="245">Giudizio tecnico</text>
<circle cx="590" cy="290" r="6" fill="#2A9D8F"/><text x="608" y="295">Pensiero sistemico</text>
<circle cx="590" cy="340" r="6" fill="#2A9D8F"/><text x="608" y="345">Conoscenza del business</text>
<circle cx="590" cy="390" r="6" fill="#2A9D8F"/><text x="608" y="395">Prova di esecuzione</text>
</g>

<text x="50" y="470" font-size="15" fill="#2B1B3D" font-weight="700">Premio retributivo medio sullo stipendio base · 1º trimestre 2026</text>
<text x="50" y="501" font-size="14" fill="#2B1B3D">Competenze non certificate</text>
