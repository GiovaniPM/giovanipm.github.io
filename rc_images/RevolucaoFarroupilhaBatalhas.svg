<text x="288" y="72" font-size="15" text-anchor="end">Seival, 1836</text><rect x="300.0" y="56" width="280.0" height="24" fill="#0E8074"/><text x="440.0" y="73" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">54%</text><rect x="580.0" y="56" width="187.5" height="24" fill="#FFB703"/><text x="673.8" y="73" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">36%</text><rect x="767.5" y="56" width="52.5" height="24" fill="#C2185B"/><text x="793.7" y="73" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">10%</text><text x="960" y="73" font-size="14" text-anchor="end" fill="#756986">vitória</text>
<text x="288" y="110" font-size="15" text-anchor="end">Fanfa, 1836 (defendendo)</text><rect x="300.0" y="94" width="49.7" height="24" fill="#0E8074"/><text x="324.8" y="111" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">10%</text><rect x="349.7" y="94" width="139.4" height="24" fill="#FFB703"/><text x="419.3" y="111" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">27%</text><rect x="489.0" y="94" width="331.0" height="24" fill="#C2185B"/><text x="654.5" y="111" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">64%</text><text x="960" y="111" font-size="14" text-anchor="end" fill="#756986">derrota</text>
<text x="288" y="148" font-size="15" text-anchor="end">Rio Pardo, 1838</text><rect x="300.0" y="132" width="177.1" height="24" fill="#0E8074"/><text x="388.5" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">34%</text><rect x="477.1" y="132" width="254.5" height="24" fill="#FFB703"/><text x="604.3" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">49%</text><rect x="731.6" y="132" width="88.4" height="24" fill="#C2185B"/><text x="775.8" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">17%</text><text x="960" y="149" font-size="14" text-anchor="end" fill="#756986">vitória</text>
