<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
<title id="t">Batalhas históricas simuladas no jogo</title>
<desc id="d">Batalhas históricas simuladas no jogo. Seival, 1836: vitória 54%, empate 36%, derrota 10%; na história: vitória. Fanfa, 1836 (defendendo): vitória 10%, empate 27%, derrota 64%; na história: derrota. Rio Pardo, 1838: vitória 34%, empate 49%, derrota 17%; na história: vitória. Santa Vitória, 1839: vitória 13%, empate 12%, derrota 75%; na história: vitória. Taquari, 1840: vitória 3%, empate 60%, derrota 37%; na história: indeciso. São José do Norte, 1840: vitória 18%, empate 34%, derrota 48%; na história: derrota. Ponche Verde, 1843: vitória 92%, empate 7%, derrota 1%; na história: disputado. Porongos, 1844: saindo: vitória 45%, empate 14%, derrota 41%; na história: derrota. Porongos, 1844: acampado: vitória 100%, empate 0%, derrota 0%; na história: —. 2.000 combates por linha, com a função de combate do jogo e as forças das fontes. É o modelo do jogo, não a probabilidade real.</desc>
<rect width="1000" height="480" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
