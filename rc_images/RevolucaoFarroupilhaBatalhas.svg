<text x="288" y="300" font-size="15" text-anchor="end">Ponche Verde, 1843</text><rect x="300.0" y="284" width="476.6" height="24" fill="#0E8074"/><text x="538.3" y="301" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">92%</text><rect x="776.6" y="284" width="36.7" height="24" fill="#FFB703"/><text x="794.9" y="301" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">7%</text><rect x="813.2" y="284" width="6.8" height="24" fill="#C2185B"/><text x="960" y="301" font-size="14" text-anchor="end" fill="#756986">disputado</text>
<text x="288" y="338" font-size="15" text-anchor="end">Porongos, 1844: saindo</text><rect x="300.0" y="322" width="235.0" height="24" fill="#0E8074"/><text x="417.5" y="339" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">45%</text><rect x="535.0" y="322" width="70.2" height="24" fill="#FFB703"/><text x="570.1" y="339" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">14%</text><rect x="605.2" y="322" width="214.8" height="24" fill="#C2185B"/><text x="712.6" y="339" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">41%</text><text x="960" y="339" font-size="14" text-anchor="end" fill="#756986">derrota</text>
<text x="288" y="376" font-size="15" text-anchor="end">Porongos, 1844: acampado</text><rect x="300.0" y="360" width="519.0" height="24" fill="#0E8074"/><text x="559.5" y="377" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">100%</text><rect x="819.2" y="360" width="0.8" height="24" fill="#C2185B"/><text x="960" y="377" font-size="14" text-anchor="end" fill="#756986">—</text>
<rect x="300" y="408" width="18" height="18" rx="3" fill="#0E8074"/><text x="326" y="422" font-size="14">vitória</text><rect x="450" y="408" width="18" height="18" rx="3" fill="#FFB703"/><text x="476" y="422" font-size="14">empate</text><rect x="600" y="408" width="18" height="18" rx="3" fill="#C2185B"/><text x="626" y="422" font-size="14">derrota</text>
<text x="40" y="458" font-size="13.5" fill="#756986">2.000 combates por linha, com a função de combate do jogo e as forças das fontes. É o modelo do jogo, não a probabilidade real.</text>
