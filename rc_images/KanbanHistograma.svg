<title id="t">Histograma do tempo de ciclo: use percentis</title>
<desc id="d">Histograma do tempo de ciclo de 76 itens, de 1 a 20 dias, com pico entre 4 e 5 dias e uma cauda longa à direita, causada por bloqueios e dependências. Linhas marcam os percentis: 50% em até 5 dias, 85% em até 10 dias e 95% em até 14 dias, além da média. Um quadro destaca a expectativa de nível de serviço: 85% dos itens terminam em até 10 dias.</desc>
