<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Al-Kashi computes the sine of 1°</title>
<desc id="d">Table of al-Kashi’s iteration. Starting guess: sin 3° divided by 3, 0.0174453187. Step 1: 0.0174523978. Step 2: 0.0174524064268. Step 3: 0.0174524064373. True value of the sine of 1 degree: 0.0174524064373. Each step gains about 3 or 4 correct digits. Below, another feat of al-Kashi in 1424: pi to 16 decimal places, 3.1415926535897932, using a polygon with 3 times 2 to the 28th sides, 805,306,368 sides.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Al-Kashi computes the sine of 1°</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Each turn of the staircase adds correct digits</text><rect x="60" y="100" width="880" height="46" rx="8" fill="#FFF1C9"/><text x="170" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">step</text><text x="470" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">value of x</text><text x="790" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">correct digits</text><text x="170" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle">guess: sin 3° ÷ 3</text><text x="470" y="190" font-size="18" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"><tspan fill="#2A9D8F" font-weight="700">0.0174</tspan><tspan fill="#FF6B6B">453187</tspan></text><text x="790" y="190" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">4</text><line x1="60" y1="210" x2="940" y2="210" stroke="#F1E2CF" stroke-width="1.5"/><text x="170" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">1</text><text x="470" y="240" font-size="18" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"><tspan fill="#2A9D8F" font-weight="700">0.017452</tspan><tspan fill="#FF6B6B">3978</tspan></text><text x="790" y="240" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">6</text><line x1="60" y1="260" x2="940" y2="260" stroke="#F1E2CF" stroke-width="1.5"/><text x="170" y="290" font-size="15" fill="#2B1B3D" text-anchor="middle">2</text><text x="470" y="290" font-size="18" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"><tspan fill="#2A9D8F" font-weight="700">0.0174524064</tspan><tspan fill="#FF6B6B">268</tspan></text><text x="790" y="290" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">10</text><line x1="60" y1="310" x2="940" y2="310" stroke="#F1E2CF" stroke-width="1.5"/><text x="170" y="340" font-size="15" fill="#2B1B3D" text-anchor="middle">3</text><text x="470" y="340" font-size="18" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"><tspan fill="#2A9D8F" font-weight="700">0.0174524064373</tspan><tspan fill="#FF6B6B"></tspan></text><text x="790" y="340" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">13</text><line x1="60" y1="360" x2="940" y2="360" stroke="#F1E2CF" stroke-width="1.5"/><text x="470" y="400" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">true: sin 1° = 0.0174524064373</text><text x="470" y="422" font-size="13" fill="#756986" text-anchor="middle">green = correct digits · red = still wrong</text><rect x="60" y="440" width="880" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="500" y="472" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700">1424: al-Kashi computes π to 16 places: 3.1415926535897932</text><text x="500" y="502" font-size="15" fill="#2B1B3D" text-anchor="middle">using a polygon with 3 × 2²⁸ = 805,306,368 sides</text>
