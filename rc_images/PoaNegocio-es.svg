<title id="t">Un cambio bueno para ambos</title>
<desc id="d">Antes, Ana tiene Cidade Baixa, Bom Fim y Tristeza; Bia tiene Farroupilha, Ipanema y Cristal. Tras el cambio, Ana tiene el grupo naranja completo y Bia, el amarillo.</desc>
