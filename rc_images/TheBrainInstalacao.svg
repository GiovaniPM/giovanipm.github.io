<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Onde rodar o TheBrain</title>
<desc id="d">Mapa das opções de instalação. Local: aplicativo nativo para Windows, macOS e Linux; Docker, com o desktop acessível pelo navegador e um importador em contêiner; Kubernetes, com Deployment, volume persistente, Service e CronJob. Remoto: cliente web em app.thebrain.com; sincronização na nuvem, em plano pago; e API REST em api.bra.in.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="480" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Onde rodar o TheBrain</text>
<text x="500.0" y="72" font-size="15" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Local: os dados ficam na sua máquina ou no seu cluster. Remoto: ficam na nuvem da TheBrain</text>
<rect x="390.0" y="100.0" width="220" height="50" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="3"/>
<text x="500" y="131.3" font-size="18" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">TheBrain 15</text>
<path d="M440 150 L275 190" fill="none" stroke="#0E8074" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#at)"/>
<path d="M560 150 L725 190" fill="none" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<rect x="150.0" y="191.0" width="220" height="48" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="260" y="221.3" font-size="18" fill="#0E8074" text-anchor="middle" font-weight="700" xml:space="preserve">Local</text>
<rect x="630.0" y="191.0" width="220" height="48" rx="12" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="740" y="221.3" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">Remoto</text>
<path d="M150 215 L40 215 L40 424" fill="none" stroke="#0E8074" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M850 215 L960 215 L960 424" fill="none" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M40 304 L58 304" fill="none" stroke="#0E8074" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#at)"/>
<rect x="60" y="280" width="400" height="50" rx="10" fill="#FFFFFF" stroke="#0E8074" stroke-width="1.5"/>
<text x="76" y="301" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Aplicativo nativo</text>
<text x="76" y="320" font-size="12.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Windows, macOS e Linux; os cérebros ficam no disco</text>
<path d="M960 304 L942 304" fill="none" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<rect x="540" y="280" width="400" height="50" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="1.5"/>
<text x="556" y="301" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Cliente web</text>
<text x="556" y="320" font-size="12.5" fill="#3E3350" text-anchor="start" xml:space="preserve">app.thebrain.com, sem instalar nada</text>
<path d="M40 368 L58 368" fill="none" stroke="#0E8074" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#at)"/>
<rect x="60" y="344" width="400" height="50" rx="10" fill="#FFFFFF" stroke="#0E8074" stroke-width="1.5"/>
<text x="76" y="365" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Docker</text>
<text x="76" y="384" font-size="12.5" fill="#3E3350" text-anchor="start" xml:space="preserve">desktop no navegador (webtop) e importador em contêiner</text>
<path d="M960 368 L942 368" fill="none" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<rect x="540" y="344" width="400" height="50" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="1.5"/>
<text x="556" y="365" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Sincronização na nuvem</text>
<text x="556" y="384" font-size="12.5" fill="#3E3350" text-anchor="start" xml:space="preserve">plano pago; une desktop, web e celular</text>
<path d="M40 432 L58 432" fill="none" stroke="#0E8074" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#at)"/>
<rect x="60" y="408" width="400" height="50" rx="10" fill="#FFFFFF" stroke="#0E8074" stroke-width="1.5"/>
<text x="76" y="429" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Kubernetes</text>
<text x="76" y="448" font-size="12.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Deployment com PVC, Service e CronJob de importação</text>
<path d="M960 432 L942 432" fill="none" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ap)"/>
<rect x="540" y="408" width="400" height="50" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="1.5"/>
<text x="556" y="429" font-size="15" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">API REST</text>
<text x="556" y="448" font-size="12.5" fill="#3E3350" text-anchor="start" xml:space="preserve">api.bra.in, com chave gerada na sua conta</text>
</svg>
