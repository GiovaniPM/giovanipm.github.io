<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">O problema do caixeiro viajante</title>
<desc id="d">Mapa com seis cidades e uma rota que passa por todas e volta ao início, ao lado de uma tabela com o número de rotas possíveis, (n menos 1) fatorial dividido por 2, e o tempo para testar todas a 1 bilhão de rotas por segundo. 5 cidades: 12; instantâneo. 10 cidades: 181.440; instantâneo. 15 cidades: 43.589.145.600; 44 s. 20 cidades: 60.822.550.204.416.000; 1,9 anos. 25 cidades: 3,1 × 10²³; 9,8 milhões de anos.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">O problema do caixeiro viajante</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Qual é a rota mais curta que visita todas as cidades e volta ao início?</text>
