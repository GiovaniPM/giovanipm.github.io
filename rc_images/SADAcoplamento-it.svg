<rect x="437.3" y="256.0" width="125.4" height="50.0" rx="8" fill="#C9BEB8" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="500.0" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Procedurale</text>
<rect x="568.7" y="256.0" width="125.4" height="50.0" rx="8" fill="#BBC7C0" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="631.4" y="287.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Comunicazionale</text>
<rect x="700.1" y="256.0" width="125.4" height="50.0" rx="8" fill="#ACD0C7" stroke="#2B1B3D" stroke-width="1.5"/>
