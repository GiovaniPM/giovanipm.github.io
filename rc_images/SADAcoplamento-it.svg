<text x="270.0" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Comune</text>
<rect x="349.7" y="126.0" width="147.3" height="50.0" rx="8" fill="#D2B9B4" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="423.3" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Esterno</text>
<rect x="503.0" y="126.0" width="147.3" height="50.0" rx="8" fill="#C0C3BD" stroke="#2B1B3D" stroke-width="1.5"/>
<text x="576.7" y="157.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Controllo</text>
<rect x="656.3" y="126.0" width="147.3" height="50.0" rx="8" fill="#AFCEC5" stroke="#2B1B3D" stroke-width="1.5"/>
