<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
<title id="t">Risk matrix: probability times impact</title>
<desc id="d">Three by three matrix. Rows for high, medium and low probability; columns for low, medium and high impact. The level is the product: 1 or 2 is low, 3 or 4 is medium, 6 is high and 9 is critical. On the right, what raises each axis in the app. Probability: delay, blocker, progress below plan, start not made, predecessor with a problem, no update, no owner, overloaded owner. Impact: critical path, small slack, milestone, many successors, long duration.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="345.0" y="32" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Impact →</text><text x="40" y="205.0" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(-90 40 205.0)">Probability →</text><text x="215.0" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#756986">Low</text><text x="345.0" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#756986">Medium</text><text x="475.0" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#756986">High</text><text x="140" y="120.0" font-size="14" font-weight="bold" text-anchor="end" fill="#756986">High</text><rect x="153" y="73" width="124" height="84" rx="10" fill="#ffe066"/><text x="215.0" y="112" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">3</text><text x="215.0" y="136" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Medium</text><rect x="283" y="73" width="124" height="84" rx="10" fill="#ffc078"/><text x="345.0" y="112" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">6</text><text x="345.0" y="136" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">High</text><rect x="413" y="73" width="124" height="84" rx="10" fill="#ff8787"/><text x="475.0" y="112" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">9</text><text x="475.0" y="136" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Critical</text><text x="140" y="210.0" font-size="14" font-weight="bold" text-anchor="end" fill="#756986">Medium</text><rect x="153" y="163" width="124" height="84" rx="10" fill="#b2f2bb"/><text x="215.0" y="202" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">2</text><text x="215.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Low</text><rect x="283" y="163" width="124" height="84" rx="10" fill="#ffe066"/><text x="345.0" y="202" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">4</text><text x="345.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Medium</text><rect x="413" y="163" width="124" height="84" rx="10" fill="#ffc078"/><text x="475.0" y="202" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">6</text><text x="475.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">High</text><text x="140" y="300.0" font-size="14" font-weight="bold" text-anchor="end" fill="#756986">Low</text><rect x="153" y="253" width="124" height="84" rx="10" fill="#b2f2bb"/><text x="215.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">1</text><text x="215.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Low</text><rect x="283" y="253" width="124" height="84" rx="10" fill="#b2f2bb"/><text x="345.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">2</text><text x="345.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Low</text><rect x="413" y="253" width="124" height="84" rx="10" fill="#ffe066"/><text x="475.0" y="292" font-size="26" font-weight="bold" text-anchor="middle" fill="#2B1B3D">3</text><text x="475.0" y="316" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Medium</text><text x="345.0" y="370" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Probability × Impact = 1 … 9</text><rect x="600" y="60" width="370" height="200" rx="12" fill="#FFFFFF" stroke="#F1E2CF"/><text x="616" y="88" font-size="16" font-weight="bold" text-anchor="start" fill="#B35300">Raises probability</text><text x="622" y="116" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• delay or blocker</text><text x="622" y="139" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• progress below plan</text><text x="622" y="162" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• planned start has passed</text><text x="622" y="185" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• predecessor late/blocked</text><text x="622" y="208" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• no update or no owner</text><text x="622" y="231" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• overloaded owner</text><rect x="600" y="276" width="370" height="162" rx="12" fill="#FFFFFF" stroke="#F1E2CF"/><text x="616" y="304" font-size="16" font-weight="bold" text-anchor="start" fill="#5B2A86">Raises impact</text><text x="622" y="332" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• critical path (slack 0)</text><text x="622" y="355" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• slack up to 5 days</text><text x="622" y="378" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• milestone</text><text x="622" y="401" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• many successors</text><text x="622" y="424" font-size="14" font-weight="normal" text-anchor="start" fill="#2B1B3D">• long duration (10+ days)</text>
</g></svg>
