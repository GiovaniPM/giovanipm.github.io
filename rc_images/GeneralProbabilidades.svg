 x="290" y="74" width="2.0" height="18" rx="4" fill="#9FD9D0"/><text x="298" y="88" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">0,08%</text><rect x="290" y="96" width="40.8" height="22" rx="4" fill="#0E8074"/><text x="336.8" y="113" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">4,6%</text><text x="276" y="158" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Quatro iguais ou mais</text><rect x="290" y="136" width="17.8" height="18" rx="4" fill="#9FD9D0"/><text x="313.8" y="150" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">2,0%</text><rect x="290" y="158" width="257.6" height="22" rx="4" fill="#0E8074"/><text x="553.6" y="175" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">29,1%</text><text x="276" y="220" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Full (3 + 2)</text><rect x="290" y="198" width="34.2" height="18" rx="4" fill="#9FD9D0"/><text x="330.2" y="212" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">3,9%</text><rect x="290" y="220" width="321.4" height="22" rx="4" fill="#0E8074"/><text x="617.4" y="237" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">36,3%</text><text x="276" y="282" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Sequência de 5</text><rect x="290" y="260" width="27.3" height="18" rx="4" fill="#9FD9D0"/><text x="323.3" y="274" font-size="13" font-weight="normal" text-anchor="start" fill="#756986">3,1%</text><rect x="290" y="282" width="231.3" height="22" rx="4" fill="#0E8074"/><text x="527.3" y="299" font-size="14" font-weight="bold" text-anchor="start" fill="#0E8074">26,1%</text><text x="276" y="344" font-size="15" font-weight="bold" text-anchor="end" fill="#2B1B3D">Sequência de 4</text><rect x="290" y="322" width="136.7" height="18" rx="4" fill="#9FD9D0"/><text x="432.7" y="336" font-size="13" font-weight="normal" text-anchor="start" fill="#7