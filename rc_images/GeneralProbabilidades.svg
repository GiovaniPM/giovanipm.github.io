<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 436" width="1000" height="436" role="img" aria-labelledby="t d">
<title id="t">Chance de cada combinação</title>
<desc id="d">Gráfico de barras com a probabilidade de cada combinação no primeiro lançamento e em uma vez inteira de até três lançamentos, guardando os dados da melhor forma para buscar só aquela combinação. General: 0,08% e 4,6%. Quatro iguais ou mais: 2,0% e 29,1%. Full: 3,9% e 36,3%. Sequência de cinco: 3,1% e 26,1%. Sequência de quatro: 15,4% e 61,5%. Valores exatos, calculados por enumeração.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="436" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
