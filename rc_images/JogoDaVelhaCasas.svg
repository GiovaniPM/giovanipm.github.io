<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quanto vale cada casa</title>
<desc id="d">Tabuleiro do jogo da velha mostrando em quantas linhas vencedoras cada casa participa. O centro participa de 4 linhas (a linha do meio, a coluna do meio e as duas diagonais). Cada canto participa de 3 linhas (uma linha, uma coluna e uma diagonal). Cada lateral participa de apenas 2 linhas (uma linha e uma coluna). Ao todo existem 8 linhas vencedoras. Por isso a ordem de preferência é centro, depois cantos e por último as laterais.</desc>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Quanto vale cada casa</text>
<rect x="110" y="95" width="115" height="115" fill="#DDF3EF"/>
<rect x="225" y="95" width="115" height="115" fill="#FDE4EA"/>
<rect x="340" y="95" width="115" height="115" fill="#DDF3EF"/>
<rect x="110" y="210" width="115" height="115" fill="#FDE4EA"/>
<rect x="225" y="210" width="115" height="115" fill="#FFF1C9"/>
<rect x="340" y="210" width="115" height="115" fill="#FDE4EA"/>
<rect x="110" y="325" width="115" height="115" fill="#DDF3EF"/>
<rect x="225" y="325" width="115" height="115" fill="#FDE4EA"/>
<rect x="340" y="325" width="115" height="115" fill="#DDF3EF"/>
<path d="M225 95 V440 M110 210 H455" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<path d="M340 95 V440 M110 325 H455" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<rect x="110" y="95" width="345" height="345" fill="none" stroke="#2B1B3D" stroke-width="2" rx="4"/>
<text x="167.5" y="167.5" font-size="44" font-weight="700" fill="#0E8074" text-anchor="middle">3</text>
<text x="282.5" y="167.5" font-size="44" font-weight="700" fill="#C2185B" text-anchor="middle">2</text>
<text x="397.5" y="167.5" font-size="44" font-weight="700" fill="#0E8074" text-anchor="middle">3</text>
<text x="167.5" y="282.5" font-size="44" font-weight="700" fill="#C2185B" text-anchor="middle">2</text>
<text x="282.5" y="282.5" font-size="44" font-weight="700" fill="#B35300" text-anchor="middle">4</text>
<text x="397.5" y="282.5" font-size="44" font-weight="700" fill="#C2185B" text-anchor="middle">2</text>
<text x="167.5" y="397.5" font-size="44" font-weight="700" fill="#0E8074" text-anchor="middle">3</text>
<text x="282.5" y="397.5" font-size="44" font-weight="700" fill="#C2185B" text-anchor="middle">2</text>
<text x="397.5" y="397.5" font-size="44" font-weight="700" fill="#0E8074" text-anchor="middle">3</text>
<rect x="560" y="120" width="340" height="62" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="582" y="158" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="start">Centro</text>
<rect x="710" y="142" width="100" height="18" rx="5" fill="#B35300"/>
<text x="878" y="159" font-size="18" font-weight="700" fill="#B35300" text-anchor="end">4 linhas</text>
<rect x="560" y="202" width="340" height="62" rx="12" fill="#DDF3EF" stroke="#0E8074" stroke-width="2"/>
<text x="582" y="240" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="start">Canto</text>
<rect x="710" y="224" width="75" height="18" rx="5" fill="#0E8074"/>
<text x="878" y="241" font-size="18" font-weight="700" fill="#0E8074" text-anchor="end">3 linhas</text>
<rect x="560" y="284" width="340" height="62" rx="12" fill="#FDE4EA" stroke="#C2185B" stroke-width="2"/>
<text x="582" y="322" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="start">Lateral</text>
<rect x="710" y="306" width="50" height="18" rx="5" fill="#C2185B"/>
<text x="878" y="323" font-size="18" font-weight="700" fill="#C2185B" text-anchor="end">2 linhas</text>
<text x="730" y="390" font-size="15" font-weight="700" fill="#3E3350" text-anchor="middle">8 linhas vencedoras no total</text>
<text x="730" y="420" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="middle">Preferência: centro › canto › lateral</text>
<text x="500" y="495" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">O número em cada casa é quantas linhas vencedoras passam por ela.</text>
</svg>
