<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">Coordenadas y colocación</title>
<desc id="d">A la izquierda, un tablero de 10 por 10 con columnas de la A a la J y filas del 1 al 10. Hay un portaaviones en la fila 2, de B a F, un acorazado en la columna I, de 4 a 7, y un crucero en la columna C, de 6 a 8. La casilla E7 está resaltada, con líneas discontinuas que vienen de la columna E y de la fila 7; en ella hay un disparo al agua marcado con un círculo blanco, y en I5 un tocado marcado con una cruz. A la derecha, tres ejemplos de la regla por defecto de la app: barcos con una casilla libre entre ellos valen; tocándose en diagonal no valen; lado a lado no valen. Con la opción Permitido, las tres posiciones valen.</desc>
