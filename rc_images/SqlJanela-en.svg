<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 554" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Looking at neighbouring rows</title>
<desc id="d">Table with seven employees in hiring order, from Eva in 2012 to Davi in 2023. Ana’s row is highlighted. A purple arrow shows that Ana’s LAG, 3500, comes from Gil’s salary on the previous row; a blue arrow shows that Ana’s LEAD, Fábio, comes from the next row; and a green bracket shows that Ana’s running total, 18500, adds up the salaries of the first four rows.</desc>
