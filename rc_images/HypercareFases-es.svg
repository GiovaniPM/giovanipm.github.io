14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">línea de tiempo</text><text x="623" y="118.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">causas raíz</text><text x="623" y="137.8" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">lecciones y acciones</text><text x="623" y="156.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">decisión</text><rect x="758" y="30" width="222" height="168" rx="14" fill="#FFFFFF" stroke="#B35300" stroke-width="3"/><rect x="758" y="30" width="222" height="40" rx="14" fill="#B35300"/><rect x="758" y="56" width="222" height="14" fill="#B35300"/><text x="869" y="57" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4. Cerrado</text><text x="869" y="100.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">traspaso</text><text x="869" y="118.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">a soporte</text><text x="869" y="137.8" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">documentación</text><text x="869" y="156.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">final</text><line x1="243" y1="114" x2="264" y2="114" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="489" y1="114" x2="510" y2="114" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><line x1="735" y1="114" x2="756" y2="114" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><path d="M377 200 V232" stroke="#2B1B3D" stroke-width="2" stroke-dasharray="5 4"/><rect x="232" y="232" width="290" height="118" rx="12" fill="#FFF1C9" stroke="#FFB703"/><text x="377" y="258" font-size="15" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Criterios de salida</text><text x="377" y="282.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">• sin S1/S2 abierto</text><text x="377" y="299.55" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">• criterios cumplidos</text><text x="377" y="317.1" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">• pendientes altos resueltos</text><text x="377" y="334.65" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">• incidentes en baja</text><text x="980" y="340" font-size="13" font-weight="normal" text-anchor="end" fill="#756986">Cada cambio de fase queda registrado con fecha y hora</text>
</g></svg>
