<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="t d">
<title id="t">Las cuatro fases que sigue el app</title>
<desc id="d">Cuatro fases en secuencia. Post-despliegue: verificación inmediata, con smoke tests, monitoreo, comunicación y ventana de rollback. Hypercare: estabilización con soporte reforzado, incidentes con SLA, pendientes y seguimientos. Post-mortem: revisión sin culpables, con línea de tiempo, causas raíz, lecciones y acciones. Cerrado: traspaso a soporte. La salida del hypercare depende de los criterios de salida: ningún S1 o S2 abierto, criterios cumplidos, pendientes altos resueltos e incidentes en baja.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="370" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
