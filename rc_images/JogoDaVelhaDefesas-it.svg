<text x="820" y="402" font-size="14" font-weight="400" fill="#C2185B" text-anchor="middle">Qui l’angolo perde</text>
<text x="500" y="448" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Caselle verdi: risposte che garantiscono il pareggio. Caselle rosa: risposte che perdono contro il gioco perfetto.</text>
