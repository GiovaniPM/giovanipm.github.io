<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Le tre risposte che salvano la O</title>
<desc id="d">Tre griglie con la risposta corretta della O. Contro l’apertura in un angolo, O deve giocare al centro; le altre sette risposte perdono. Contro l’apertura al centro, O deve giocare in un angolo; i quattro lati perdono. Nella trappola degli angoli opposti, in cui X occupa due angoli opposti e O è al centro, O deve giocare su un lato; giocare in un angolo perde, perché permette una forchetta.</desc>
