<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The race to multiply matrices faster</title>
<desc id="d">Step chart of the best known exponent, ω, for multiplying n by n matrices, from 1968 to 2024. The schoolbook method has exponent 3. Strassen, 1969: 2.807. Pan, 1978: 2.796. Bini and colleagues, 1979: 2.780. Schönhage, 1981: 2.522. Coppersmith and Winograd, 1982: 2.496. Strassen, 1986: 2.479. Coppersmith and Winograd, 1990: 2.376. Then decades of tiny gains: 2.3737 in 2010, 2.3729 in 2012, 2.37286 in 2014 and 2020, 2.37188 in 2022 and 2.371339 in 2024. A dashed line at 2 marks the limit: nobody knows if it can be reached.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">The race to multiply matrices faster</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Best known exponent ω: multiplying takes about n to the power ω steps</text><line x1="100" y1="450" x2="930" y2="450" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="100" y1="450" x2="100" y2="110" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="95" y1="422.5" x2="920" y2="422.5" stroke="#F1E2CF" stroke-width="1"/><text x="90" y="427.5" font-size="12" fill="#756986" text-anchor="end">2.0</text><line x1="95" y1="367.5" x2="920" y2="367.5" stroke="#F1E2CF" stroke-width="1"/><text x="90" y="372.5" font-size="12" fill="#756986" text-anchor="end">2.2</text><line x1="95" y1="312.5" x2="920" y2="312.5" stroke="#F1E2CF" stroke-width="1"/><text x="90" y="317.5" font-size="12" fill="#756986" text-anchor="end">2.4</text><line x1="95" y1="257.5" x2="920" y2="257.5" stroke="#F1E2CF" stroke-width="1"/><text x="90" y="262.5" font-size="12" fill="#756986" text-anchor="end">2.6</text><line x1="95" y1="202.5" x2="920" y2="202.5" stroke="#F1E2CF" stroke-width="1"/><text x="90" y="207.5" font-size="12" fill="#756986" text-anchor="end">2.8</text><line x1="95" y1="147.5" x2="920" y2="147.5" stroke="#F1E2CF" stroke-width="1"/><text x="90" y="152.5" font-size="12" fill="#756986" text-anchor="end">3.0</text><text x="165.079" y="472" font-size="12" fill="#756986" text-anchor="middle">1970</text><text x="295.238" y="472" font-size="12" fill="#756986" text-anchor="middle">1980</text><text x="425.397" y="472" font-size="12" fill="#756986" text-anchor="middle">1990</text><text x="555.556" y="472" font-size="12" fill="#756986" text-anchor="middle">2000</text><text x="685.714" y="472" font-size="12" fill="#756986" text-anchor="middle">2010</text><text x="815.873" y="472" font-size="12" fill="#756986" text-anchor="middle">2020</text><line x