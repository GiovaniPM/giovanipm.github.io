<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d">
<title id="t">Who draws from whom</title>
<desc id="d">Top view of a table with four players: you at the bottom, Ana on your left, Beto opposite and Caio on your right. The arrows show the path of the cards: you take from Ana, Ana takes from Beto, Beto takes from Caio and Caio takes from you. The turn goes clockwise: you, Ana, Beto, Caio.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="430" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<ellipse cx="250" cy="215" rx="138" ry="138" fill="#0E6B60" stroke="#5E3518" stroke-width="12"/><rect x="204" y="367" width="92" height="40" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="250" y="393" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">You</text><rect x="14" y="195" width="92" height="40" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="60" y="221" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Ana</text><rect x="204" y="23" width="92" height="40" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="250" y="49" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Beto</text><rect x="394" y="195" width="92" height="40" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="440" y="221" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Caio</text><path d="M158 215 Q192 272 250 307" fill="none" stroke="#C2185B" stroke-width="3.5" marker-end="url(#b)"/><path d="M250 123 Q192 158 158 215" fill="none" stroke="#C2185B" stroke-width="3.5" marker-end="url(#b)"/><path d="M342 215 Q308 158 250 123" fill="none" stroke="#C2185B" stroke-width="3.5" marker-end="url(#b)"/><path d="M250 307 Q308 272 342 215" fill="none" stroke="#C2185B" stroke-width="3.5" marker-end="url(#b)"/><rect x="236" y="195" width="28" height="40" rx="4" fill="#7A3FAF" stroke="#FFFFFF" stroke-width="2"/><text x="520" y="120" font-size="18" font-weight="bold" text-anchor="start" fill="#2B1B3D">Everyone takes a card from the player on their left.</text><text x="520" y="168" font-size="16" font-weight="normal" text-anchor="start" fill="#2B1B3D">The turn goes clockwise:</text><text x="520" y="198" font-size="18" font-weight="bold" text-anchor="start" fill="#0E8074">1 You → 2 Ana → 3 Beto → 4 Caio</text><path d="M520 250 H560" stroke="#C2185B" stroke-width="3.5" marker-end="url(#b)"/><text x="576" y="256" font-size="15" font-weight="normal" text-anchor="start" fill="#756986">arrow: path of the card</text><text x="520" y="310" font-size="15" font-weight="normal" text-anchor="start" fill="#756986">Players who are out are skipped: the neighbour</text><text x="520" y="332" font-size="15" font-weight="normal" text-anchor="start" fill="#756986">becomes the next one who still has cards.</text>
</g></svg>
