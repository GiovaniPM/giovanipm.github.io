<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">When rounding gets expensive</title>
<desc id="d">Three cards. Vancouver Stock Exchange, 1982 to 1983: the index started at 1,000 and was truncated at every update; in 22 months it fell to 524.811 when the right value was 1,098.892. Patriot missile, 1991: the clock counted tenths of a second, but 0.1 does not fit exactly in binary; after 100 hours of operation the error reached 0.34 second, and the system looked for the enemy missile more than 600 metres from the right place; 28 soldiers died. Ariane 5 rocket, 1996: a number that was too large was converted to a 16-bit format, overflowed, and the rocket destroyed itself 37 seconds after launch.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">When rounding gets expensive</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Tiny errors, repeated millions of times</text><rect x="40" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="40" y="100" width="290" height="70" rx="12" fill="#FFF1C9"/><text x="185" y="132" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">Vancouver Stock Exchange</text><text x="185" y="156" font-size="14" fill="#B35300" text-anchor="middle">1982–1983</text><text x="185" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">index starts at 1,000</text><text x="185" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">chopped at 3rd decimal</text><text x="185" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">at every update</text><text x="185" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="185" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">22 months later:</text><text x="185" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">524.811 ✗</text><text x="185" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">right: 1,098.892</text><rect x="355" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="355" y="100" width="290" height="70" rx="12" fill="#FF6B6B"/><text x="500" y="132" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Patriot missile</text><text x="500" y="156" font-size="14" fill="#FFFFFF" text-anchor="middle">1991</text><text x="500" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">clock counts tenths</text><text x="500" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">0.1 is not exact</text><text x="500" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">in binary</text><text x="500" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="500" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">100 h running:</text><text x="500" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">0.34 s error</text><text x="500" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">target &gt; 600 m off</text><rect x="670" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="670" y="100" width="290" height="70" rx="12" fill="#5B2A86"/><text x="815" y="132" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Ariane 5</text><text x="815" y="156" font-size="14" fill="#FFFFFF" text-anchor="middle">1996</text><text x="815" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">a large number</text><text x="815" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">converted into</text><text x="815" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">16 bits</text><text x="815" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="815" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">overflow</text><text x="815" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">self-destruct</text><text x="815" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">37 s after launch</text>
</svg>
