<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Árbol de decisión: dos preguntas, tres caminos.</title>
<desc id="d">Árbol de decisión con dos preguntas y tres caminos. Ante el pedido de un nuevo sistema, preguntarse primero por qué existe el proceso. Primera pregunta: ¿es una ventaja competitiva? Si sí, personalizar, porque es algo que la competencia no sabe replicar. Si no, segunda pregunta: ¿la IA elimina etapas enteras? Si sí, rediseñar el flujo desde cero. Si no, evolucionar el proceso con buenas prácticas y herramientas estándar, como en finanzas, RR. HH. y compras. Un aviso recuerda que automatizar un proceso equivocado solo produce errores a escala.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="600" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">¿Personalizar o evolucionar el proceso?</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Dos preguntas, tres caminos</text>

<rect x="290" y="96" width="420" height="72" rx="12" fill="#2B1B3D"/>
<text x="500" y="126" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Pedido de un nuevo sistema</text>
<text x="500" y="150" font-size="13" fill="#FFD9A0" text-anchor="middle" font-style="italic">antes del código: ¿por qué existe este proceso?</text>

<g stroke="#2B1B3D" stroke-width="2.5" fill="none" marker-end="url(#ar)">
<line x1="500" y1="168" x2="500" y2="196"/>
<line x1="340" y1="255" x2="274" y2="255"/>
<line x1="500" y1="310" x2="500" y2="341"/>
<line x1="660" y1="400" x2="726" y2="400"/>
<line x1="500" y1="455" x2="500" y2="491"/>
</g>
<g font-size="14" font-weight="700">
<text x="307" y="245" fill="#2A9D8F" text-anchor="middle">Sí</text>
<text x="515" y="332" fill="#E23B3B">No</text>
<text x="693" y="390" fill="#2A9D8F" text-anchor="middle">Sí</text>
<text x="515" y="478" fill="#E23B3B">No</text>
</g>

<path d="M500 200 L660 255 L500 310 L340 255 z" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500" y="250" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">¿Es una ventaja</text>
<text x="500" y="270" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">competitiva?</text>

<path d="M500 345 L660 400 L500 455 L340 400 z" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500" y="395" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">¿La IA elimina</text>
<text x="500" y="415" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">etapas enteras?</text>

<rect x="50" y="215" width="220" height="80" rx="12" fill="#3A86FF"/>
<text x="160" y="246" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Personalizar</text>
<text x="160" y="268" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">lo que la competencia</text>
<text x="160" y="285" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">no sabe replicar</text>

<rect x="730" y="360" width="220" height="80" rx="12" fill="#FF6B6B"/>
<text x="840" y="394" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Rediseñar</text>
<text x="840" y="418" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">el flujo desde cero</text>

<rect x="310" y="495" width="380" height="84" rx="12" fill="#2A9D8F"/>
<text x="500" y="525" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">Evolucionar el proceso</text>
<text x="500" y="547" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">buenas prácticas y herramientas estándar</text>
<text x="500" y="566" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">ej.: finanzas, RR. HH., compras</text>

<rect x="730" y="205" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2" stroke-dasharray="6 4"/>
<text x="840" y="236" font-size="14" fill="#E23B3B" text-anchor="middle" font-weight="700">Atención</text>
<text x="840" y="260" font-size="13" fill="#2B1B3D" text-anchor="middle">Automatizar un proceso</text>
<text x="840" y="279" font-size="13" fill="#2B1B3D" text-anchor="middle">equivocado solo produce</text>
<text x="840" y="298" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">errores a escala</text>
</svg>
