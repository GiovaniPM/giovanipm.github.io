<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 388" role="img" aria-labelledby="t d" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif"><title id="t">Tre gateway, tre regole</title><desc id="d">Esclusivo: il token prende un solo percorso. Parallelo: un token per ogni percorso, e l’unione li attende tutti. Inclusivo: un token per ogni condizione vera, e l’unione attende solo quelli che possono ancora arrivare.</desc><style>:root{--b-fill:#fff;--b-line:#2B1B3D;--b-muted:#5E5170;--b-pool:#fff;--b-font:'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;--b-mono:Consolas,monospace}
.grid-dot{fill:var(--dot)}
.b-fill{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-line{fill:none;stroke:var(--b-line);stroke-width:1.6}
.b-thin{fill:none;stroke:var(--b-line);stroke-width:1.2}
.b-ink{fill:var(--b-line);stroke:none}
.b-blank{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.2}
.b-text{fill:var(--b-line);font:12px var(--b-font);text-anchor:middle;pointer-events:none}
.b-note{fill:var(--b-line);font:12px var(--b-font);text-anchor:start;pointer-events:none}
.b-small{fill:var(--b-muted);font:10.5px var(--b-mono);text-anchor:middle;pointer-events:none}
.b-event{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-end{fill:var(--b-fill);stroke:var(--b-line);stroke-width:3.4}
.b-gw{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-pool{fill:var(--b-pool);stroke:var(--b-line);stroke-width:1.6}
.b-lane{fill:none;stroke:var(--b-line);stroke-width:1}
.b-group{fill:none;stroke:var(--b-line);stroke-width:1.4;stroke-dasharray:9 4 2 4}
.b-seq{fill:none;stroke:var(--b-line);stroke-width:1.5;marker-end:url(#m-seq)}
.b-msg{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:7 5;marker-start:url(#m-msg-start);marker-end:url(#m-msg-end)}
.b-assoc{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.b-assoc.one{marker-end:url(#m-open)}
.b-assoc.both{marker-start:url(#m-open-s);marker-end:url(#m-open)}
.b-data{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round;marker-end:url(#m-open)}
.b-text{font-size:12px}</style><defs><marker id="m-seq" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="m-msg-end" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11z" fill="#fff" stroke="#2B1B3D" stroke-width="1.2"/></marker><marker id="m-msg-start" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#2B1B3D" stroke-width="1.4"/></marker><marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker><marker id="m-open-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 1 6 11 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker></defs><rect width="1000" height="388" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Tre gateway, tre regole</text><rect x="24" y="66" width="308" height="280" rx="12" fill="#fff" stroke="#E2D3BC"/><path d="M42 168L124 168" class="b-seq"/><path d="M148 144L172 168L148 192L124 168Z" class="b-gw"/><path d="M-9 -11.5-6.3-11.5 0-2.6 6.3-11.5 9-11.5 1.7 0 9 11.5 6.3 11.5 0 2.6-6.3 11.5-9 11.5-1.7 0Z" class="b-ink" transform="translate(148 168) scale(0.96)"/><path d="M148 144L148 116L234 116" class="b-seq"/><path d="M148 192L148 220L234 220" class="b-seq"/><rect x="234" y="92" width="84" height="48" rx="10" class="b-fill"/><text class="b-text"><tspan x="276" y="116" dominant-baseline="central"></tspan></text><text x="276" y="121" font-size="12.5" fill="#2B1B3D" text-anchor="middle">A</text><rect x="234" y="196" width="84" height="48" rx="10" class="b-fill"/><text class="b-text"><tspan x="276" y="220" dominant-baseline="central"></tspan></text><text x="276" y="225" font-size="12.5" fill="#2B1B3D" text-anchor="middle">B</text><circle cx="76" cy="168" r="7.5" fill="#8A7CA0" stroke="#fff" stroke-width="2"/><circle cx="148" cy="116" r="7.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="40" y="98" font-size="16" fill="#2B1B3D" font-weight="700">Esclusivo (X)</text><text x="40" y="278" font-size="13" fill="#2B1B3D">Un solo percorso: la prima condizione</text><text x="40" y="295" font-size="13" fill="#2B1B3D">vera. Se nessuna vale, il flusso</text><text x="40" y="312" font-size="13" fill="#2B1B3D">predefinito.</text><rect x="346" y="66" width="308" height="280" rx="12" fill="#fff" stroke="#E2D3BC"/><path d="M364 168L446 168" class="b-seq"/><path d="M470 144L494 168L470 192L446 168Z" class="b-gw"/><path d="M-1.7 -12H1.7V-1.7H12V1.7H1.7V12H-1.7V1.7H-12V-1.7H-1.7Z" class="b-ink" transform="translate(470 168) scale(0.96)"/><path d="M470 144L470 116L556 116" class="b-seq"/><path d="M470 192L470 220L556 220" class="b-seq"/><rect x="556" y="92" width="84" height="48" rx="10" class="b-fill"/><text class="b-text"><tspan x="598" y="116" dominant-baseline="central"></tspan></text><text x="598" y="121" font-size="12.5" fill="#2B1B3D" text-anchor="middle">A</text><rect x="556" y="196" width="84" height="48" rx="10" class="b-fill"/><text class="b-text"><tspan x="598" y="220" dominant-baseline="central"></tspan></text><text x="598" y="225" font-size="12.5" fill="#2B1B3D" text-anchor="middle">B</text><circle cx="398" cy="168" r="7.5" fill="#8A7CA0" stroke="#fff" stroke-width="2"/><circle cx="470" cy="116" r="7.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><circle cx="470" cy="220" r="7.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="362" y="98" font-size="16" fill="#2B1B3D" font-weight="700">Parallelo (+)</text><text x="362" y="278" font-size="13" fill="#2B1B3D">Tutti i percorsi. Nell’unione, attende</text><text x="362" y="295" font-size="13" fill="#2B1B3D">un token per ingresso.</text><rect x="668" y="66" width="308" height="280" rx="12" fill="#fff" stroke="#E2D3BC"/><path d="M686 168L768 168" class="b-seq"/><path d="M792 144L816 168L792 192L768 168Z" class="b-gw"/><circle r="10.5" class="b-line" transform="translate(792 168) scale(0.96)" style="stroke-width:3"/><path d="M792 144L792 116L878 116" class="b-seq"/><path d="M792 192L792 220L878 220" class="b-seq"/><rect x="878" y="92" width="84" height="48" rx="10" class="b-fill"/><text class="b-text"><tspan x="920" y="116" dominant-baseline="central"></tspan></text><text x="920" y="121" font-size="12.5" fill="#2B1B3D" text-anchor="middle">A</text><rect x="878" y="196" width="84" height="48" rx="10" class="b-fill"/><text class="b-text"><tspan x="920" y="220" dominant-baseline="central"></tspan></text><text x="920" y="225" font-size="12.5" fill="#2B1B3D" text-anchor="middle">B</text><circle cx="720" cy="168" r="7.5" fill="#8A7CA0" stroke="#fff" stroke-width="2"/><circle cx="792" cy="116" r="7.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><circle cx="792" cy="220" r="7.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="684" y="98" font-size="16" fill="#2B1B3D" font-weight="700">Inclusivo (O)</text><text x="684" y="278" font-size="13" fill="#2B1B3D">Ogni condizione vera. Nell’unione,</text><text x="684" y="295" font-size="13" fill="#2B1B3D">attende solo chi può ancora arrivare.</text><circle cx="330" cy="368" r="7.5" fill="#8A7CA0" stroke="#fff" stroke-width="2"/><text x="344" y="373" font-size="13" fill="#5E5170">Token in arrivo</text><circle cx="570" cy="368" r="7.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><text x="584" y="373" font-size="13" fill="#5E5170">Token in uscita</text></svg>
