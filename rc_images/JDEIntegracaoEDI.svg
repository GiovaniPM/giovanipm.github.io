<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 482" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Fluxo de EDI no JD Edwards</title>
<desc id="d">Entrada: o cliente envia um 850 por VAN ou AS2; o tradutor EDI converte o X12 em arquivo plano, devolve o 997 e grava nas tabelas F47011/F47012, uma área de espera corrigível; o R47011 cria o pedido em F4201/F4211 com as mesmas regras da entrada de pedidos, e os erros vão para o Work Center. Saída: após o faturamento no JDE, o R47042 extrai a fatura para as tabelas F47046/F47047; o tradutor converte o arquivo em 810 e o cliente recebe; o recibo 997 ou CONTRL é guardado.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker></defs>
<rect width="1000" height="482" rx="18" fill="#FFF7EC"/>
<text x="500" y="42" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">EDI com as tabelas do sistema 47</text>
<text x="500" y="68" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">O tradutor converte o padrão (X12, EDIFACT) em arquivo plano; o JDE valida e cria o documento</text>
<rect x="20" y="92" width="960" height="176" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="116" font-size="13" fill="#756986" text-anchor="start" font-weight="700">ENTRADA: PEDIDO DO CLIENTE (850 / ORDERS)</text>
<rect x="30" y="136" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="116.0" y="171.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cliente</text>
<text x="116.0" y="190.3" font-size="12.5" fill="#3E3350" text-anchor="middle">envia 850</text>
<rect x="222" y="136" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="308.0" y="171.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">VAN ou AS2</text>
<text x="308.0" y="190.3" font-size="12.5" fill="#3E3350" text-anchor="middle">certificados</text>
<rect x="414" y="136" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tradutor EDI</text>
<text x="500.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">X12 → arquivo plano</text>
<text x="500.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">devolve o 997</text>
<rect x="606" y="136" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="692.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">F47011 / F47012</text>
<text x="692.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">área de espera</text>
<text x="692.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">(corrigível)</text>
<rect x="798" y="136" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="884.0" y="162.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">R47011</text>
<text x="884.0" y="181.0" font-size="12.5" fill="#3E3350" text-anchor="middle">cria o pedido</text>
<text x="884.0" y="199.5" font-size="12.5" fill="#3E3350" text-anchor="middle">F4201 / F4211</text>
<polyline points="202,176 220,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,176 412,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,176 604,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,176 796,176" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="250" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">R47011 usa as mesmas regras de entrada de pedidos; erros ficam no Work Center</text>
<rect x="20" y="286" width="960" height="176" rx="14" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="36" y="310" font-size="13" fill="#756986" text-anchor="start" font-weight="700">SAÍDA: FATURA PARA O CLIENTE (810 / INVOIC)</text>
<rect x="30" y="330" width="172" height="80" rx="12" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="116.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Faturamento</text>
<text x="116.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">no JDE</text>
<rect x="222" y="330" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="308.0" y="356.6" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">R47042</text>
<text x="308.0" y="375.0" font-size="12.5" fill="#3E3350" text-anchor="middle">extrai a fatura</text>
<text x="308.0" y="393.5" font-size="12.5" fill="#3E3350" text-anchor="middle">para EDI</text>
<rect x="414" y="330" width="172" height="80" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">F47046 / F47047</text>
<text x="500.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">saída</text>
<rect x="606" y="330" width="172" height="80" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="692.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tradutor EDI</text>
<text x="692.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">arquivo → 810</text>
<rect x="798" y="330" width="172" height="80" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="884.0" y="365.8" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cliente</text>
<text x="884.0" y="384.3" font-size="12.5" fill="#3E3350" text-anchor="middle">recebe 810</text>
<polyline points="202,370 220,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="394,370 412,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="586,370 604,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="778,370 796,370" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="500" y="444" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">o tradutor marca o registro como enviado e guarda o recibo (997 / CONTRL)</text>
</svg>
