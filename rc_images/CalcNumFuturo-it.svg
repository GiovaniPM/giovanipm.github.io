<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dove va il calcolo numerico</title>
<desc id="d">Sei tendenze: Exascala: 10¹⁸ operazioni al secondo dal 2022 (Frontier); Precisione su misura: meno cifre dove si può, di più dove conta; IA come calcolatore: previsioni meteo con IA operative dal 2025; IA che inventa algoritmi: AlphaTensor (2022), AlphaEvolve (2025); Calcolo quantistico: promessa per alcuni problemi; molte riserve; Gemelli digitali: copie della Terra, del corpo e delle fabbriche, in tempo reale. Tutte convergono su un’idea: calcolare con fiducia, conoscendo la dimensione dell’errore.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Dove va il calcolo numerico</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Sei tendenze per i prossimi decenni</text><rect x="40" y="100" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="40" y="100" width="290" height="46" rx="12" fill="#5B2A86"/><text x="185" y="130" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Exascala</text><text x="185" y="182" font-size="15" fill="#2B1B3D" text-anchor="middle">10¹⁸ operazioni al secondo</text><text x="185" y="208" font-size="15" fill="#2B1B3D" text-anchor="middle">dal 2022 (Frontier)</text><rect x="355" y="100" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><rect x="355" y="100" width="290" height="46" rx="12" fill="#3A86FF"/><text x="500" y="130" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Precisione su misura</text><text x="500" y="182" font-size="15" fill="#2B1B3D" text-anchor="middle">meno cifre dove si può,</text><text x="500" y="208" font-size="15" fill="#2B1B3D" text-anchor="middle">di più dove conta</text><rect x="670" y="100" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><rect x="670" y="100" width="290" height="46" rx="12" fill="#2A9D8F"/><text x="815" y="130" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">IA come calcolatore</text><text x="815" y="182" font-size="15" fill="#2B1B3D" text-anchor="middle">previsioni meteo con IA</text><text x="815" y="208" font-size="15" fill="#2B1B3D" text-anchor="middle">operative dal 2025</text><rect x="40" y="270" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="40" y="270" width="290" height="46" rx="12" fill="#FFF1C9"/><text x="185" y="300" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">IA che inventa algoritmi</text><text x="185" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">AlphaTensor (2022),</text><text x="185" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">AlphaEvolve (2025)</text><rect x="355" y="270" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="355" y="270" width="290" height="46" rx="12" fill="#FF6B6B"/><text x="500" y="300" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Calcolo quantistico</text><text x="500" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">promessa per alcuni</text><text x="500" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">problemi; molte riserve</text><rect x="670" y="270" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#EF476F" stroke-width="2.5"/><rect x="670" y="270" width="290" height="46" rx="12" fill="#EF476F"/><text x="815" y="300" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Gemelli digitali</text><text x="815" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">copie della Terra, del corpo</text><text x="815" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">e delle fabbriche, in tempo reale</text><rect x="150" y="460" width="700" height="70" rx="12" fill="#E2F6F2" stroke="#2A9D8F" stroke-width="2.5"/><text x="500" y="490" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Il filo conduttore di 4.000 anni resta lo stesso:</text><text x="500" y="515" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">calcolare con fiducia, conoscendo la dimensione dell’errore</text>
</svg>
