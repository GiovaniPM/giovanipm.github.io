<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 322" role="img" aria-labelledby="t d" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif"><title id="t">Stallo e sincronizzazione</title><desc id="d">A sinistra, un gateway esclusivo apre due percorsi e uno parallelo li chiude: arriva un solo token e l’unione attende per sempre. A destra, parallelo apre e parallelo chiude: arrivano entrambi i token e il processo termina.</desc><style>:root{--b-fill:#fff;--b-line:#2B1B3D;--b-muted:#5E5170;--b-pool:#fff;--b-font:'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif;--b-mono:Consolas,monospace}
.grid-dot{fill:var(--dot)}
.b-fill{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-line{fill:none;stroke:var(--b-line);stroke-width:1.6}
.b-thin{fill:none;stroke:var(--b-line);stroke-width:1.2}
.b-ink{fill:var(--b-line);stroke:none}
.b-blank{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.2}
.b-text{fill:var(--b-line);font:12px var(--b-font);text-anchor:middle;pointer-events:none}
.b-note{fill:var(--b-line);font:12px var(--b-font);text-anchor:start;pointer-events:none}
.b-small{fill:var(--b-muted);font:10.5px var(--b-mono);text-anchor:middle;pointer-events:none}
.b-event{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-end{fill:var(--b-fill);stroke:var(--b-line);stroke-width:3.4}
.b-gw{fill:var(--b-fill);stroke:var(--b-line);stroke-width:1.6}
.b-pool{fill:var(--b-pool);stroke:var(--b-line);stroke-width:1.6}
.b-lane{fill:none;stroke:var(--b-line);stroke-width:1}
.b-group{fill:none;stroke:var(--b-line);stroke-width:1.4;stroke-dasharray:9 4 2 4}
.b-seq{fill:none;stroke:var(--b-line);stroke-width:1.5;marker-end:url(#m-seq)}
.b-msg{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:7 5;marker-start:url(#m-msg-start);marker-end:url(#m-msg-end)}
.b-assoc{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round}
.b-assoc.one{marker-end:url(#m-open)}
.b-assoc.both{marker-start:url(#m-open-s);marker-end:url(#m-open)}
.b-data{fill:none;stroke:var(--b-line);stroke-width:1.3;stroke-dasharray:2 4;stroke-linecap:round;marker-end:url(#m-open)}
.b-text{font-size:12px}</style><defs><marker id="m-seq" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="m-msg-end" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11z" fill="#fff" stroke="#2B1B3D" stroke-width="1.2"/></marker><marker id="m-msg-start" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#2B1B3D" stroke-width="1.4"/></marker><marker id="m-open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker><marker id="m-open-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M11 1 1 6 11 11" fill="none" stroke="#2B1B3D" stroke-width="1.3"/></marker></defs><rect width="1000" height="322" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Stallo e sincronizzazione</text><rect x="24" y="66" width="468" height="240" rx="12" fill="#FFF4EE" stroke="#A9371E"/><text x="42" y="98" font-size="16" fill="#A9371E" font-weight="700">Stallo: X apre, + chiude</text><circle cx="56" cy="178" r="18" class="b-event"/><path d="M74 178L108 178" class="b-seq"/><path d="M132 154L156 178L132 202L108 178Z" class="b-gw"/><path d="M-9 -11.5-6.3-11.5 0-2.6 6.3-11.5 9-11.5 1.7 0 9 11.5 6.3 11.5 0 2.6-6.3 11.5-9 11.5-1.7 0Z" class="b-ink" transform="translate(132 178) scale(0.96)"/><path d="M132 154L132 130L204 130" class="b-seq"/><path d="M132 202L132 226L204 226" class="b-seq"/><rect x="204" y="108" width="84" height="44" rx="10" class="b-fill"/><text class="b-text"><tspan x="246" y="130" dominant-baseline="central"></tspan></text><text x="246" y="135" font-size="12.5" fill="#2B1B3D" text-anchor="middle">A</text><rect x="204" y="204" width="84" height="44" rx="10" class="b-fill"/><text class="b-text"><tspan x="246" y="226" dominant-baseline="central"></tspan></text><text x="246" y="231" font-size="12.5" fill="#2B1B3D" text-anchor="middle">B</text><path d="M288 130L358 130L358 154" class="b-seq"/><path d="M288 226L358 226L358 202" class="b-seq"/><path d="M358 154L382 178L358 202L334 178Z" class="b-gw"/><path d="M-1.7 -12H1.7V-1.7H12V1.7H1.7V12H-1.7V1.7H-12V-1.7H-1.7Z" class="b-ink" transform="translate(358 178) scale(0.96)"/><path d="M382 178L424 178" class="b-seq"/><circle cx="442" cy="178" r="16.8" class="b-end"/><circle cx="358" cy="144" r="7.5" fill="#A9371E" stroke="#fff" stroke-width="2"/><circle cx="358" cy="212" r="7.5" fill="#fff" stroke="#A9371E" stroke-width="2" stroke-dasharray="3 2"/><text x="42" y="266" font-size="13" fill="#2B1B3D">Si crea un solo token, ma l’unione parallela ne attende due.</text><text x="42" y="283" font-size="13" fill="#2B1B3D">Il processo si blocca.</text><rect x="508" y="66" width="468" height="240" rx="12" fill="#fff" stroke="#E2D3BC"/><text x="526" y="98" font-size="16" fill="#1F7A4D" font-weight="700">Corretto: + apre, + chiude</text><circle cx="540" cy="178" r="18" class="b-event"/><path d="M558 178L592 178" class="b-seq"/><path d="M616 154L640 178L616 202L592 178Z" class="b-gw"/><path d="M-1.7 -12H1.7V-1.7H12V1.7H1.7V12H-1.7V1.7H-12V-1.7H-1.7Z" class="b-ink" transform="translate(616 178) scale(0.96)"/><path d="M616 154L616 130L688 130" class="b-seq"/><path d="M616 202L616 226L688 226" class="b-seq"/><rect x="688" y="108" width="84" height="44" rx="10" class="b-fill"/><text class="b-text"><tspan x="730" y="130" dominant-baseline="central"></tspan></text><text x="730" y="135" font-size="12.5" fill="#2B1B3D" text-anchor="middle">A</text><rect x="688" y="204" width="84" height="44" rx="10" class="b-fill"/><text class="b-text"><tspan x="730" y="226" dominant-baseline="central"></tspan></text><text x="730" y="231" font-size="12.5" fill="#2B1B3D" text-anchor="middle">B</text><path d="M772 130L842 130L842 154" class="b-seq"/><path d="M772 226L842 226L842 202" class="b-seq"/><path d="M842 154L866 178L842 202L818 178Z" class="b-gw"/><path d="M-1.7 -12H1.7V-1.7H12V1.7H1.7V12H-1.7V1.7H-12V-1.7H-1.7Z" class="b-ink" transform="translate(842 178) scale(0.96)"/><path d="M866 178L908 178" class="b-seq"/><circle cx="926" cy="178" r="16.8" class="b-end"/><circle cx="842" cy="144" r="7.5" fill="#1F7A4D" stroke="#fff" stroke-width="2"/><circle cx="842" cy="212" r="7.5" fill="#1F7A4D" stroke="#fff" stroke-width="2"/><text x="526" y="266" font-size="13" fill="#2B1B3D">Escono due token, arrivano entrambi, e l’unione libera un</text><text x="526" y="283" font-size="13" fill="#2B1B3D">token verso la fine.</text></svg>
