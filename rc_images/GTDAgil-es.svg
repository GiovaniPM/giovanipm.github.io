<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">GTD y ágil: el equipo y tú</title>
<desc id="d">Diagrama en dos capas. Arriba, el tablero del equipo, en Scrum o Kanban, con las columnas backlog, por hacer, en curso y hecho. Abajo, tu sistema GTD, con bandeja de entrada, próximas acciones, a la espera y revisión semanal. Un elemento de la columna por hacer asignado a ti baja a tu bandeja de entrada; de las próximas acciones tiras trabajo hacia la columna en curso cuando tienes capacidad; una tarjeta bloqueada en curso se convierte en un elemento de la lista a la espera; y en la revisión semanal actualizas el tablero.</desc>
