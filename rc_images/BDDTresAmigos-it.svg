<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Tre Amigos e mappatura degli esempi</title>
<desc id="d">A sinistra, tre persone, business, sviluppo e test, riunite in un workshop di specifica. Una freccia porta alla mappatura degli esempi, a destra: un cartoncino giallo con la storia prelevare contanti al bancomat, due cartoncini blu con le regole, saldo sufficiente e carta valida, cartoncini verdi con gli esempi di ogni regola e un cartoncino rosso con la domanda e se il bancomat è senza banconote.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="515" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Tre Amigos e mappatura degli esempi</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Business, sviluppo e test si parlano prima di scrivere codice, con esempi concreti</text>
<circle cx="110" cy="140" r="24" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/><path d="M70 222 q0 -48 40 -48 q40 0 40 48 z" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5" stroke-linejoin="round"/>
<text x="110.0" y="252.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Business</text>
<text x="110.0" y="272.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">che problema risolvere?</text>
<circle cx="260" cy="140" r="24" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/><path d="M220 222 q0 -48 40 -48 q40 0 40 48 z" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5" stroke-linejoin="round"/>
<text x="260.0" y="252.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sviluppo</text>
<text x="260.0" y="272.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">come costruirlo?</text>
<circle cx="410" cy="140" r="24" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2.5"/><path d="M370 222 q0 -48 40 -48 q40 0 40 48 z" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2.5" stroke-linejoin="round"/>
<text x="410.0" y="252.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Test</text>
<text x="410.0" y="272.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">cosa può andare storto?</text>
<rect x="50" y="300" width="420" height="120" rx="14" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="260.0" y="332.0" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">Workshop di specifica</text>
<text x="260.0" y="358.0" font-size="13" fill="#3E3350" text-anchor="middle">linguaggio comune, niente dettagli tecnici</text>
<text x="260.0" y="378.0" font-size="13" fill="#3E3350" text-anchor="middle">ne escono regole, esempi e domande</text>
<path d="M474 360 C 510 360, 520 300, 552 300" stroke="#2B1B3D" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="750.0" y="112.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Mappatura degli esempi</text>
<rect x="560" y="128" width="380" height="44" rx="6" fill="#FFE08A" stroke="#B35300" stroke-width="2"/>
<text x="750.0" y="156.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Storia: prelevare contanti al bancomat</text>
<rect x="560" y="188" width="180" height="40" rx="6" fill="#BFD7FF" stroke="#3A86FF" stroke-width="2"/>
<text x="650.0" y="213.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Regola: saldo sufficiente</text>
<rect x="568" y="240" width="172" height="38" rx="6" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="654.0" y="264.0" font-size="11.5" fill="#2B1B3D" text-anchor="middle">ha 100, chiede 20 → riceve 20</text>
<rect x="568" y="288" width="172" height="38" rx="6" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="654.0" y="312.0" font-size="11.5" fill="#2B1B3D" text-anchor="middle">ha 10, chiede 20 → rifiuto</text>
<rect x="760" y="188" width="180" height="40" rx="6" fill="#BFD7FF" stroke="#3A86FF" stroke-width="2"/>
<text x="850.0" y="213.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Regola: carta valida</text>
<rect x="768" y="240" width="172" height="38" rx="6" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="854.0" y="264.0" font-size="11.5" fill="#2B1B3D" text-anchor="middle">carta ok → restituita</text>
<rect x="768" y="288" width="172" height="38" rx="6" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="854.0" y="312.0" font-size="11.5" fill="#2B1B3D" text-anchor="middle">carta bloccata → trattenuta</text>
<rect x="560" y="350" width="380" height="40" rx="6" fill="#FFC9C9" stroke="#E23B3B" stroke-width="2"/>
<text x="750.0" y="375.0" font-size="13" fill="#2B1B3D" text-anchor="middle">Domanda: e se il bancomat è senza banconote?</text>
<rect x="560" y="406" width="14" height="14" rx="3" fill="#FFE08A" stroke="#2B1B3D" stroke-width="1"/>
<text x="580.0" y="418.0" font-size="12" fill="#3E3350">storia</text>
<rect x="657" y="406" width="14" height="14" rx="3" fill="#BFD7FF" stroke="#2B1B3D" stroke-width="1"/>
<text x="677.0" y="418.0" font-size="12" fill="#3E3350">regola</text>
<rect x="754" y="406" width="14" height="14" rx="3" fill="#C8EDE6" stroke="#2B1B3D" stroke-width="1"/>
<text x="774.0" y="418.0" font-size="12" fill="#3E3350">esempio</text>
<rect x="851" y="406" width="14" height="14" rx="3" fill="#FFC9C9" stroke="#2B1B3D" stroke-width="1"/>
<text x="871.0" y="418.0" font-size="12" fill="#3E3350">domanda</text>
<text x="500.0" y="470.0" font-size="13" fill="#3E3350" text-anchor="middle">Ogni esempio diventa uno scenario Dato/Quando/Allora; ogni domanda torna al business.</text>
<text x="500.0" y="492.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Troppe domande o troppe regole indicano che la storia non è ancora pronta.</text>
</svg>
