<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Passi per configurare il REST in JD Edwards</title>
<desc id="d">Otto passi in sequenza: 1 prerequisiti (Tools 9.2, JDK, WebLogic, certificati); 2 creare l'istanza dell'AIS Server nel Server Manager; 3 collegare l'AIS all'HTML Server e all'ambiente; 4 regolare la configurazione (timeout, allowed hosts, CORS, sessioni JAS); 5 sicurezza (utente di servizio, Security Workbench, UDO); 6 creare e pubblicare orchestrazioni nell'Orchestrator Studio; 7 testare con /v2/defaultconfig e Postman; 8 esporre con API gateway, TLS e monitoraggio.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="42.0" font-size="23" fill="#2B1B3D" text-anchor="middle" font-weight="700">Come configurare il REST in JD Edwards</text>
<text x="500.0" y="68.0" font-size="15" fill="#756986" text-anchor="middle" font-style="italic">Dal server alla prima chiamata, in otto passi</text>
<rect x="35" y="110" width="210" height="118" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="140.0" y="146.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">1. Prerequisiti</text>
<text x="140.0" y="164.8" font-size="12.5" fill="#3E3350" text-anchor="middle">Tools 9.2 aggiornato</text>
<text x="140.0" y="183.2" font-size="12.5" fill="#3E3350" text-anchor="middle">JDK e WebLogic</text>
<text x="140.0" y="201.8" font-size="12.5" fill="#3E3350" text-anchor="middle">certificati TLS</text>
<rect x="275" y="110" width="210" height="118" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="380.0" y="146.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">2. Istanza AIS</text>
<text x="380.0" y="164.8" font-size="12.5" fill="#3E3350" text-anchor="middle">Server Manager</text>
<text x="380.0" y="183.2" font-size="12.5" fill="#3E3350" text-anchor="middle">Create/Register</text>
<text x="380.0" y="201.8" font-size="12.5" fill="#3E3350" text-anchor="middle">a Managed Instance</text>
<rect x="515" y="110" width="210" height="118" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="620.0" y="146.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">3. Collegare al JAS</text>
<text x="620.0" y="164.8" font-size="12.5" fill="#3E3350" text-anchor="middle">HTML Server</text>
<text x="620.0" y="183.2" font-size="12.5" fill="#3E3350" text-anchor="middle">ambiente e ruolo</text>
<text x="620.0" y="201.8" font-size="12.5" fill="#3E3350" text-anchor="middle">predefiniti</text>
<rect x="755" y="110" width="210" height="118" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="860.0" y="146.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">4. Impostazioni AIS</text>
<text x="860.0" y="164.8" font-size="12.5" fill="#3E3350" text-anchor="middle">timeout, allowed hosts</text>
<text x="860.0" y="183.2" font-size="12.5" fill="#3E3350" text-anchor="middle">CORS, sessioni JAS</text>
<text x="860.0" y="201.8" font-size="12.5" fill="#3E3350" text-anchor="middle">dimensione pagina</text>
<rect x="755" y="290" width="210" height="118" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="860.0" y="326.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">5. Sicurezza</text>
<text x="860.0" y="344.8" font-size="12.5" fill="#3E3350" text-anchor="middle">utente di servizio</text>
<text x="860.0" y="363.2" font-size="12.5" fill="#3E3350" text-anchor="middle">P00950, UDO</text>
<text x="860.0" y="381.8" font-size="12.5" fill="#3E3350" text-anchor="middle">OAuth (opzionale)</text>
<rect x="515" y="290" width="210" height="118" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="620.0" y="326.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">6. Orchestrator Studio</text>
<text x="620.0" y="344.8" font-size="12.5" fill="#3E3350" text-anchor="middle">service request</text>
<text x="620.0" y="363.2" font-size="12.5" fill="#3E3350" text-anchor="middle">orchestrazioni</text>
<text x="620.0" y="381.8" font-size="12.5" fill="#3E3350" text-anchor="middle">condividere e approvare</text>
<rect x="275" y="290" width="210" height="118" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="380.0" y="326.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">7. Testare</text>
<text x="380.0" y="344.8" font-size="12.5" fill="#3E3350" text-anchor="middle">GET /v2/defaultconfig</text>
<text x="380.0" y="363.2" font-size="12.5" fill="#3E3350" text-anchor="middle">Postman / curl</text>
<text x="380.0" y="381.8" font-size="12.5" fill="#3E3350" text-anchor="middle">log nel Server Manager</text>
<rect x="35" y="290" width="210" height="118" rx="12" fill="#DCE8FF" stroke="#3A86FF" stroke-width="2"/>
<text x="140.0" y="326.2" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">8. Esporre</text>
<text x="140.0" y="344.8" font-size="12.5" fill="#3E3350" text-anchor="middle">API gateway</text>
<text x="140.0" y="363.2" font-size="12.5" fill="#3E3350" text-anchor="middle">TLS e limiti</text>
<text x="140.0" y="381.8" font-size="12.5" fill="#3E3350" text-anchor="middle">monitoraggio</text>
<polyline points="245,169 273,169" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="755,349 727,349" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="485,169 513,169" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="515,349 487,349" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="725,169 753,169" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="275,349 247,349" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="860,228 860,288" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="35" y="440" width="930" height="50" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="500.0" y="460.8" font-size="14" fill="#3E3350" text-anchor="middle">Promuovi le orchestrazioni tra ambienti come UDO (DV → PY → PD), senza mai ricrearle a mano.</text>
</svg>
