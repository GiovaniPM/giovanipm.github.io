<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Quando l’arrotondamento costa caro</title>
<desc id="d">Tre schede. Borsa di Vancouver, 1982–1983: l’indice partì da 1.000 e veniva troncato a ogni aggiornamento; in 22 mesi scese a 524,811, quando il valore giusto era 1.098,892. Missile Patriot, 1991: l’orologio contava decimi di secondo, ma 0,1 non si rappresenta esattamente in binario; dopo 100 ore di funzionamento l’errore arrivò a 0,34 secondi, e il sistema cercò il missile nemico a più di 600 metri dal punto giusto; morirono 28 soldati. Razzo Ariane 5, 1996: un numero troppo grande fu convertito in un formato a 16 bit, andò in overflow, e il razzo si autodistrusse 37 secondi dopo il lancio.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Quando l’arrotondamento costa caro</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Piccoli errori, ripetuti milioni di volte</text><rect x="40" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="40" y="100" width="290" height="70" rx="12" fill="#FFF1C9"/><text x="185" y="132" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">Borsa di Vancouver</text><text x="185" y="156" font-size="14" fill="#B35300" text-anchor="middle">1982–1983</text><text x="185" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">indice parte da 1.000</text><text x="185" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">troncato alla 3ª cifra</text><text x="185" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">a ogni aggiornamento</text><text x="185" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="185" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">22 mesi dopo:</text><text x="185" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">524,811 ✗</text><text x="185" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">giusto: 1.098,892</text><rect x="355" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="355" y="100" width="290" height="70" rx="12" fill="#FF6B6B"/><text x="500" y="132" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Missile Patriot</text><text x="500" y="156" font-size="14" fill="#FFFFFF" text-anchor="middle">1991</text><text x="500" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">orologio in decimi</text><text x="500" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">0,1 non è esatto</text><text x="500" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">in binario</text><text x="500" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="500" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">100 h acceso:</text><text x="500" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">errore di 0,34 s</text><text x="500" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">bersaglio a &gt; 600 m</text><rect x="670" y="100" width="290" height="390" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="670" y="100" width="290" height="70" rx="12" fill="#5B2A86"/><text x="815" y="132" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Ariane 5</text><text x="815" y="156" font-size="14" fill="#FFFFFF" text-anchor="middle">1996</text><text x="815" y="206" font-size="15" fill="#2B1B3D" text-anchor="middle">numero grande</text><text x="815" y="240" font-size="15" fill="#2B1B3D" text-anchor="middle">convertito in</text><text x="815" y="274" font-size="15" fill="#2B1B3D" text-anchor="middle">16 bit</text><text x="815" y="308" font-size="15" fill="#2B1B3D" text-anchor="middle"></text><text x="815" y="342" font-size="15" fill="#2B1B3D" text-anchor="middle">overflow</text><text x="815" y="376" font-size="15" fill="#2B1B3D" text-anchor="middle">autodistruzione</text><text x="815" y="410" font-size="15" fill="#2B1B3D" text-anchor="middle">37 s dopo il lancio</text>
</svg>
