<text x="370" y="297" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="middle">Alineado al flujo</text>
<rect x="96" y="112" width="62" height="236" rx="12" fill="#D5F0EA" fill-opacity=".92" stroke="#2A9D8F" stroke-width="3" stroke-dasharray="7 4"/>
<text x="132" y="230" font-size="15" font-weight="700" fill="#0E8074" text-anchor="middle" transform="rotate(-90 132 230)">Habilitador</text>
<rect x="470" y="300" width="130" height="64" rx="12" fill="#FFD9D9" stroke="#FF6B6B" stroke-width="3"/>
<rect x="470" y="300" width="130" height="16" fill="url(#hatch)"/>
<text x="535" y="336" font-size="13.5" font-weight="700" fill="#2B1B3D" text-anchor="middle">Subsistema</text><text x="535" y="352" font-size="13.5" font-weight="700" fill="#2B1B3D" text-anchor="middle">complicado</text>
<rect x="70" y="400" width="530" height="58" rx="12" fill="#D6E6FF" stroke="#3A86FF" stroke-width="3"/>
<text x="335" y="435" font-size="17" font-weight="700" fill="#1F5FCC" text-anchor="middle">Plataforma</text>
<path d="M110 386 v-10 h70 v10" fill="none" stroke="#3A86FF" stroke-width="3"/>
<path d="M145 376 V320" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M250 386 v-10 h70 v10" fill="none" stroke="#3A86FF" stroke-width="3"/>
<path d="M285 376 V320" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M390 386 v-10 h70 v10" fill="none" stroke="#3A86FF" stroke-width="3"/>
<path d="M425 376 V320" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 3"/>
<rect x="650" y="86" width="26" height="26" rx="6" fill="#FFE7A3" stroke="#E0A100" stroke-width="3"/>
<text x="690" y="104" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Alineado al flujo</text>
<text x="690" y="124" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">entrega valor de punta a</text><text x="690" y="140" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">punta en un flujo de cambio</text>
<rect x="650" y="152" width="26" height="26" rx="6" fill="#D6E6FF" stroke="#3A86FF" stroke-width="3"/>
<text x="690" y="170" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Plataforma</text>
<text x="690" y="190" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">ofrece servicios internos</text><text x="690" y="206" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">en autoservicio</text>
<rect x="650" y="218" width="26" height="26" rx="6" fill="#D5F0EA" stroke="#2A9D8F" stroke-width="3"/>
<text x="690" y="236" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Habilitador</text>
<text x="690" y="256" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">ayuda a otros equipos a</text><text x="690" y="272" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">adquirir capacidades</text>
<rect x="650" y="284" width="26" height="26" rx="6" fill="#FFD9D9" stroke="#FF6B6B" stroke-width="3"/>
<text x="690" y="302" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Subsistema complicado</text>
<text x="690" y="322" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">se ocupa de partes que</text><text x="690" y="338" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">requieren especialistas</text>
<text x="650" y="362" font-size="15" font-weight="700" fill="#5B2A86" text-anchor="start">Modos de interacción</text>
<rect x="650" y="376" width="22" height="22" rx="4" fill="#FFE7A3" stroke="#E0A100" stroke-width="2"/><rect x="662" y="376" width="22" height="22" rx="4" fill="url(#hatch)" stroke="#FF6B6B" stroke-width="2"/>
<text x="698" y="393" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">Colaboración</text>
<path d="M650 420 v-8 h34 v8" fill="none" stroke="#3A86FF" stroke-width="3"/><rect x="650" y="422" width="34" height="12" rx="3" fill="#D6E6FF" stroke="#3A86FF" stroke-width="2"/>
<text x="698" y="431" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">X como servicio</text>
<rect x="650" y="448" width="34" height="22" rx="4" fill="none" stroke="#2A9D8F" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="698" y="464" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">Facilitación</text>
<text x="500" y="500" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Basado en Skelton y Pais (2019).</text>
