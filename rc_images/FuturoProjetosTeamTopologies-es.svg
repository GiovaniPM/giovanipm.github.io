<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Team Topologies: cuatro tipos de equipo</title>
<desc id="d">Diagrama de Team Topologies. Tres equipos alineados al flujo, en amarillo, siguen el flujo de cambio de izquierda a derecha. Un equipo habilitador, en verde, cruza los equipos en vertical. Un equipo de subsistema complicado, en rojo, colabora con uno de los equipos. Un equipo de plataforma, en azul, los sostiene a todos con servicios en autoservicio. Los modos de interacción son colaboración, X como servicio y facilitación.</desc>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Team Topologies: cuatro tipos de equipo</text>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFD9D9"/><rect width="3" height="8" fill="#E0A100" opacity=".6"/></pattern></defs>
<path d="M70 92 H590" stroke="#2B1B3D" stroke-width="3"/><path d="M586 82 L606 92 L586 102 Z" fill="#2B1B3D"/>
<text x="80" y="84" font-size="14" font-weight="700" fill="#2B1B3D" text-anchor="start">Flujo de cambio</text>
<rect x="70" y="126" width="530" height="50" rx="12" fill="#FFE7A3" stroke="#E0A100" stroke-width="3" opacity=".97"/>
<text x="370" y="157" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="middle">Alineado al flujo</text>
