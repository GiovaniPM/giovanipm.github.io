<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">TDD’s Red, Green, Refactor cycle</title>
<desc id="d">Cycle with three steps linked by clockwise arrows: red, write a test that fails; green, write the minimum code to pass; refactor, improve the code without changing what it does. At the center: run all the tests at every step.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="610" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">TDD’s Red, Green, Refactor cycle</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Each turn of the cycle takes a few minutes and adds a small piece of behavior</text>
<path d="M592.3 208.2 A165 165 0 0 1 664.6 333.5" stroke="#2A9D8F" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ag)"/>
<path d="M572.3 493.3 A165 165 0 0 1 427.7 493.3" stroke="#3A86FF" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ab)"/>
<path d="M335.4 333.5 A165 165 0 0 1 407.7 208.2" stroke="#E23B3B" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ard)"/>
<circle cx="500.0" cy="180.0" r="82" fill="#FFE3E3" stroke="#E23B3B" stroke-width="4"/>
<text x="500.0" y="166.0" font-size="20" fill="#B3261E" text-anchor="middle" font-weight="700">Red</text>
<text x="500.0" y="190.0" font-size="13" fill="#3E3350" text-anchor="middle">write a test</text>
<text x="500.0" y="208.0" font-size="13" fill="#3E3350" text-anchor="middle">that fails</text>
<circle cx="642.9" cy="427.5" r="82" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="4"/>
<text x="642.9" y="413.5" font-size="20" fill="#2A9D8F" text-anchor="middle" font-weight="700">Green</text>
<text x="642.9" y="437.5" font-size="13" fill="#3E3350" text-anchor="middle">write the minimum</text>
<text x="642.9" y="455.5" font-size="13" fill="#3E3350" text-anchor="middle">code to pass</text>
<circle cx="357.1" cy="427.5" r="82" fill="#E1ECFF" stroke="#3A86FF" stroke-width="4"/>
<text x="357.1" y="413.5" font-size="20" fill="#3A86FF" text-anchor="middle" font-weight="700">Refactor</text>
<text x="357.1" y="437.5" font-size="13" fill="#3E3350" text-anchor="middle">improve the code</text>
<text x="357.1" y="455.5" font-size="13" fill="#3E3350" text-anchor="middle">without changing it</text>
<text x="500.0" y="349.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">run all the tests</text>
<text x="500.0" y="369.0" font-size="13" fill="#756986" text-anchor="middle">at every step</text>
<text x="500.0" y="590.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">While refactoring, every test must stay green; no new functionality at this stage.</text>
</svg>
