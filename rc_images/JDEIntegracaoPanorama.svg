<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Panorama da integração no JD Edwards EnterpriseOne</title>
<desc id="d">Três colunas. Sistemas externos à esquerda: web, mobile, IoT e iPaaS chamam o AIS Server com Orchestrator por REST, que usa o HTML Server e chega ao Enterprise Server por JDENET. Sistemas SOAP chamam o Business Services Server. O Enterprise Server envia eventos ao Transaction Server, que entrega aos consumidores por JMS ou HTTP. BI lê o banco por SQL somente leitura. Cargas em lote gravam nas Z-files e um UBE processa. Parceiros EDI chegam por arquivo plano às tabelas F47. O Enterprise Server, com business functions, master business functions, UBEs e kernels de eventos, acessa o banco pelo JDB.</desc>
