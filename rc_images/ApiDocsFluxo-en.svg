<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">How data moves through API Docs</title>
<desc id="d">At the centre is the API document, stored as JSON inside the HTML file itself, which you read and change in the Visualizar (view) and Editar (edit) modes. Import brings in Swagger 2.0 or OpenAPI 3 as JSON or YAML, from a file or a URL, and Postman collections. Export produces OpenAPI 3, Postman v2.1, Python tests, an InterSystems IRIS class, Markdown and PDF. Save writes a new HTML file with the data, and Try it calls the real API.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<rect x="30" y="70" width="250" height="200" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="155" y="104" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">Importar (import)</text>
<text x="155" y="140" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Swagger 2.0 / OpenAPI 3</text>
<text x="155" y="170" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">(.json or .yaml)</text>
<text x="155" y="200" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Swagger by URL</text>
<text x="155" y="230" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Postman collection</text>
<rect x="370" y="70" width="260" height="200" rx="14" fill="#FFF1C9" stroke="#2B1B3D" stroke-width="3"/>
<text x="500" y="106" font-size="26" font-weight="700" fill="#5B2A86" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">{ }</text>
<text x="500" y="146" font-size="20" font-weight="700" fill="#2B1B3D" text-anchor="middle">API document</text>
<text x="500" y="176" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">JSON stored inside</text>
<text x="500" y="198" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">the HTML file itself</text>
<rect x="380" y="222" width="240" height="32" rx="16" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="500" y="243" font-size="12.5" font-weight="700" fill="#5B2A86" text-anchor="middle">Visualizar · Editar (view · edit)</text>
<rect x="720" y="40" width="250" height="260" rx="14" fill="#E2F6F2" stroke="#2B1B3D" stroke-width="3"/>
<text x="845" y="74" font-size="19" font-weight="700" fill="#2B1B3D" text-anchor="middle">Exportar (export)</text>
<text x="845" y="110" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">OpenAPI 3 (.json)</text>
<text x="845" y="142" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Postman v2.1</text>
<text x="845" y="174" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Python tests</text>
<text x="845" y="206" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">InterSystems IRIS (.cls)</text>
<text x="845" y="238" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">Markdown (.md)</text>
<text x="845" y="270" font-size="15" font-weight="400" fill="#3E3350" text-anchor="middle">PDF</text>
<g stroke="#2B1B3D" stroke-width="3" fill="none"><path d="M284 170H366" marker-end="url(#a)"/><path d="M634 170H716" marker-end="url(#a)"/></g>
<rect x="130" y="350" width="520" height="44" rx="12" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="390" y="378" font-size="15" font-weight="700" fill="#2B1B3D" text-anchor="middle">Salvar (save): writes a new api-docs.html with the data</text>
<path d="M450 274V346" stroke="#2B1B3D" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="800" y="398" width="170" height="44" rx="12" fill="#FCE4F0" stroke="#C2185B" stroke-width="2.5"/>
<text x="885" y="428" font-size="16" font-weight="700" fill="#C2185B" text-anchor="middle">Real API</text>
<path d="M630 240C700 240 700 422 796 422" stroke="#C2185B" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#r)"/>
<text x="970" y="462" font-size="13" font-weight="700" fill="#C2185B" text-anchor="end">Testar requisição (try it): calls the real API</text>
</svg>
