<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">5W3H: the eight questions of the plan</title>
<desc id="d">Eight cards in two groups. 5W: What, what will be done; Why, why it needs to be done; Who, who will do it; Where, where it will happen; When, when it starts and ends. 3H: How, how it will be done; How much, how much it will cost; How to measure, how you will know it worked. Note: the third H varies between sources; some use How many.</desc>
<rect width="1000" height="470" rx="18" fill="#FFF7EC"/>
<text x="30" y="44" font-size="24" font-weight="700" fill="#2B1B3D">5W3H: the eight questions of the plan</text>
<text x="30" y="84" font-size="16" font-weight="700" fill="#0E8074">5W · the plan itself</text>
<rect x="30.0" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="30.0" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="44.0" y="128" font-size="12" fill="#756986">question 1</text>
<text x="44.0" y="154" font-size="21" font-weight="700" fill="#0E8074">What</text>
<text x="44.0" y="180" font-size="15" fill="#2B1B3D">What will be done?</text>
<rect x="220.4" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="220.4" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="234.4" y="128" font-size="12" fill="#756986">question 2</text>
<text x="234.4" y="154" font-size="21" font-weight="700" fill="#0E8074">Why</text>
<text x="234.4" y="180" font-size="15" fill="#2B1B3D">Why does it need to</text>
<text x="234.4" y="199" font-size="15" fill="#2B1B3D">be done?</text>
<rect x="410.8" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="410.8" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="424.8" y="128" font-size="12" fill="#756986">question 3</text>
<text x="424.8" y="154" font-size="21" font-weight="700" fill="#0E8074">Who</text>
<text x="424.8" y="180" font-size="15" fill="#2B1B3D">Who will do it?</text>
<rect x="601.2" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="601.2" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="615.2" y="128" font-size="12" fill="#756986">question 4</text>
<text x="615.2" y="154" font-size="21" font-weight="700" fill="#0E8074">Where</text>
<text x="615.2" y="180" font-size="15" fill="#2B1B3D">Where will it</text>
<text x="615.2" y="199" font-size="15" fill="#2B1B3D">happen?</text>
<rect x="791.6" y="96" width="178.4" height="128" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<rect x="791.6" y="96" width="178.4" height="8" rx="4" fill="#0E8074"/>
<text x="805.6" y="128" font-size="12" fill="#756986">question 5</text>
<text x="805.6" y="154" font-size="21" font-weight="700" fill="#0E8074">When</text>
<text x="805.6" y="180" font-size="15" fill="#2B1B3D">When will it start</text>
<text x="805.6" y="199" font-size="15" fill="#2B1B3D">and end?</text>
<text x="30" y="258" font-size="16" font-weight="700" fill="#5B2A86">3H · execution, cost and measure</text>
<rect x="30.0" y="270" width="305.3" height="128" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<rect x="30.0" y="270" width="305.3" height="8" rx="4" fill="#5B2A86"/>
<text x="44.0" y="302" font-size="12" fill="#756986">question 6</text>
<text x="44.0" y="328" font-size="21" font-weight="700" fill="#5B2A86">How</text>
<text x="44.0" y="354" font-size="15" fill="#2B1B3D">How will it be done?</text>
<rect x="347.3333333333333" y="270" width="305.3" height="128" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<rect x="347.3333333333333" y="270" width="305.3" height="8" rx="4" fill="#5B2A86"/>
<text x="361.3333333333333" y="302" font-size="12" fill="#756986">question 7</text>
<text x="361.3333333333333" y="328" font-size="21" font-weight="700" fill="#5B2A86">How much</text>
<text x="361.3333333333333" y="354" font-size="15" fill="#2B1B3D">How much will it cost?</text>
<rect x="664.6666666666666" y="270" width="305.3" height="128" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<rect x="664.6666666666666" y="270" width="305.3" height="8" rx="4" fill="#5B2A86"/>
<text x="678.6666666666666" y="302" font-size="12" fill="#756986">question 8</text>
<text x="678.6666666666666" y="328" font-size="21" font-weight="700" fill="#5B2A86">How to measure</text>
<text x="678.6666666666666" y="354" font-size="15" fill="#2B1B3D">How will you know it worked?</text>
<text x="30" y="440" font-size="14" fill="#756986">The third H varies between sources: some use How many. In this app it is How to measure.</text>
</svg>
