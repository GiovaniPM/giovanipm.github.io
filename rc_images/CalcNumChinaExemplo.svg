<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Sistemas lineares no dia a dia</title>
<desc id="d">À esquerda, um problema de lanchonete: pastel mais suco mais coxinha custam 18 reais; 2 pastéis e 1 coxinha, 20 reais; 1 suco e 2 coxinhas, 17 reais. Eliminando passo a passo, pastel = 7, suco = 5 e coxinha = 6 reais. À direita, onde sistemas lineares aparecem hoje, com o tamanho típico: circuitos elétricos, dezenas a milhões de incógnitas; estruturas de pontes e prédios, milhões; jogos 3D e animação, milhares por quadro; previsão do tempo, bilhões; inteligência artificial, bilhões de números por segundo.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Sistemas lineares no dia a dia</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Do celeiro chinês ao seu celular</text><rect x="30" y="100" width="450" height="410" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="255" y="130" font-size="18" fill="#5B2A86" text-anchor="middle" font-weight="700">Na lanchonete</text><text x="255" y="170" font-size="16" fill="#2B1B3D" text-anchor="middle">pastel + suco + coxinha = R$ 18</text><text x="255" y="200" font-size="16" fill="#2B1B3D" text-anchor="middle">2 pastéis + coxinha = R$ 20</text><text x="255" y="230" font-size="16" fill="#2B1B3D" text-anchor="middle">suco + 2 coxinhas = R$ 17</text><line x1="60" y1="262" x2="450" y2="262" stroke="#F1E2CF" stroke-width="2"/><text x="255" y="292" font-size="15" fill="#2B1B3D" text-anchor="middle">da 2ª: coxinha = 20 − 2·pastel</text><text x="255" y="318" font-size="15" fill="#2B1B3D" text-anchor="middle">na 3ª: suco = 4·pastel − 23</text><text x="255" y="344" font-size="15" fill="#2B1B3D" text-anchor="middle">na 1ª: 3·pastel − 3 = 18</text><text x="255" y="370" font-size="15" fill="#2B1B3D" text-anchor="middle">pastel = 7, e o resto sai daí</text><rect x="60" y="410" width="390" height="80" rx="10" fill="#E2F6F2"/><text x="255" y="442" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">pastel = R$ 7 · suco = R$ 5 · coxinha = R$ 6</text><text x="255" y="470" font-size="14" fill="#2B1B3D" text-anchor="middle">confira: 7 + 5 + 6 = 18 ✓</text><rect x="510" y="100" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><rect x="510" y="100" width="14" height="70" rx="6" fill="#3A86FF"/><text x="545" y="130" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Circuitos elétricos</text><text x="545" y="154" font-size="14" fill="#756986" text-anchor="start">dezenas a milhões de incógnitas</text><rect x="510" y="184" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><rect x="510" y="184" width="14" height="70" rx="6" fill="#2A9D8F"/><text x="545" y="214" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Pontes e prédios</text><text x="545" y="238" font-size="14" fill="#756986" text-anchor="start">milhões de incógnitas</text><rect x="510" y="268" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="510" y="268" width="14" height="70" rx="6" fill="#FFB703"/><text x="545" y="298" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Jogos 3D e animação</text><text x="545" y="322" font-size="14" fill="#756986" text-anchor="start">milhares a cada quadro</text><rect x="510" y="352" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="510" y="352" width="14" height="70" rx="6" fill="#FF6B6B"/><text x="545" y="382" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Previsão do tempo</text><text x="545" y="406" font-size="14" fill="#756986" text-anchor="start">bilhões de incógnitas</text><rect x="510" y="436" width="460" height="70" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="510" y="436" width="14" height="70" rx="6" fill="#5B2A86"/><text x="545" y="466" font-size="17" fill="#2B1B3D" text-anchor="start" font-weight="700">Inteligência artificial</text><text x="545" y="490" font-size="14" fill="#756986" text-anchor="start">bilhões de números por segundo</text>
</svg>
