<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Reducción: resolver un problema con otro</title>
<desc id="d">Esquema de reducción. El problema A, por ejemplo el Sudoku, pasa por un traductor rápido, en tiempo polinomial, que lo convierte en el problema B, por ejemplo SAT. Un resolvedor de B da la respuesta, que vale para A y B. Regla: si B tiene una solución rápida, A también. Abajo, el efecto dominó de Karp de 1972: SAT, sobre fórmulas lógicas, lleva a Clique, grupo de amigos, que lleva a Cobertura de vértices, vigilar cada calle, que lleva a Ciclo hamiltoniano, visitar todo una vez. Moraleja: si un problema NP-completo tiene una solución rápida, todos la tienen, y P es igual a NP.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Reducción: resolver un problema con otro</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">La herramienta que conecta todos los problemas NP-completos</text>
<rect x="40" y="104" width="164" height="78" rx="12" fill="#FF6B6B"/><text x="122" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Problema A</text>
<text x="122" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">ej.: Sudoku</text>
<line x1="207" y1="143" x2="231" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="234" y="104" width="164" height="78" rx="12" fill="#5B2A86"/><text x="316" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Traductor rápido</text>
<text x="316" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">tiempo polinomial</text>
<line x1="401" y1="143" x2="425" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="428" y="104" width="164" height="78" rx="12" fill="#3A86FF"/><text x="510" y="138" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Problema B</text>
<text x="510" y="160" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-style="italic">ej.: SAT</text>
<line x1="595" y1="143" x2="619" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="622" y="104" width="164" height="78" rx="12" fill="#2A9D8F"/><text x="704" y="148" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Resolvedor de B</text>
<line x1="789" y1="143" x2="813" y2="143" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><rect x="816" y="104" width="164" height="78" rx="12" fill="#FFB703"/><text x="898" y="138" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Respuesta</text>
<text x="898" y="160" font-size="12.5" fill="#2B1B3D" text-anchor="middle" font-style="italic">vale para A y B</text>
<text x="500" y="214" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Si B tiene una solución rápida, A también.</text>
<line x1="50" y1="238" x2="950" y2="238" stroke="#EADBC6" stroke-width="1.5"/><text x="500" y="270" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">El efecto dominó de Karp (1972)</text>
<g transform="rotate(-6 155 360)"><rect x="70" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><rect x="70" y="300" width="170" height="10" rx="4" fill="#5B2A86"/><text x="155" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">SAT</text>
<text x="155" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">fórmulas lógicas</text>
</g>
<line x1="246" y1="358" x2="289" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(-1 380 360)"><rect x="295" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/><rect x="295" y="300" width="170" height="10" rx="4" fill="#3A86FF"/><text x="380" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Clique</text>
<text x="380" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">grupo de amigos</text>
</g>
<line x1="471" y1="358" x2="514" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(4 605 360)"><rect x="520" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/><rect x="520" y="300" width="170" height="10" rx="4" fill="#2A9D8F"/><text x="605" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Cobertura de vértices</text>
<text x="605" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">vigilar cada calle</text>
</g>
<line x1="696" y1="358" x2="739" y2="358" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#ar)"/><g transform="rotate(9 830 360)"><rect x="745" y="300" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="3"/><rect x="745" y="300" width="170" height="10" rx="4" fill="#FF6B6B"/><text x="830" y="348" font-size="15.5" fill="#2B1B3D" text-anchor="middle" font-weight="700">Ciclo hamiltoniano</text>
<text x="830" y="374" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">visitar todo una vez</text>
</g>
<rect x="80" y="450" width="840" height="56" rx="12" fill="#2B1B3D"/><text x="500" y="484" font-size="15.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Si UN problema NP-completo tiene una solución rápida, TODOS la tienen, y P = NP.</text>
</svg>
