<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Chiarire e organizzare: il flusso delle decisioni</title>
<desc id="d">Diagramma di flusso del GTD. Ogni elemento della casella di entrata passa per la domanda: cos’è, ed è azionabile? Se non lo è, va nel cestino, nella lista un giorno o forse, oppure nel riferimento. Se lo è, ci si chiede qual è il risultato desiderato: se richiede più di un’azione diventa un progetto, con un piano, la revisione settimanale e sempre un’azione successiva. Poi, qual è l’azione successiva? Se richiede meno di due minuti, falla subito. Altrimenti delegala, e l’elemento va nella lista in attesa; rimandala con una data, e va in agenda; oppure rimandala senza data, e va nelle azioni successive, organizzate per contesto.</desc>
<rect width="1000" height="740" rx="18" fill="#FFF7EC"/>
