<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="t d">
<title id="t">Ciclo de trabalho com o Gestor de Projeto</title>
<desc id="d">Cinco passos em ciclo: 1 Planejar, com dados do projeto, timeline e dependências; 2 Executar, a equipe trabalha; 3 Acompanhar no follow-up, atualizando status, percentual, decisões e ações; 4 Analisar nas abas Visão geral, CFD e Métricas, Equipe e Riscos; 5 Decidir e agir, como reagendar, remover bloqueios ou renegociar escopo. Do passo 5 volta-se ao passo 2. Em todos os passos, Salvar grava os dados no HTML e o JSON guarda uma cópia.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="370" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="500" y="44" font-size="22" font-weight="bold" text-anchor="middle" fill="#2B1B3D">Um ciclo por semana (ou por reunião)</text><rect x="20" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#5B2A86" stroke-width="3"/><rect x="20" y="90" width="168" height="40" rx="14" fill="#5B2A86"/><rect x="20" y="116" width="168" height="14" fill="#5B2A86"/><text x="104" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1. Planejar</text><text x="104" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Projeto, timeline,</text><text x="104" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">dependências</text><line x1="190" y1="155" x2="213" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="216" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#0E8074" stroke-width="3"/><rect x="216" y="90" width="168" height="40" rx="14" fill="#0E8074"/><rect x="216" y="116" width="168" height="14" fill="#0E8074"/><text x="300" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2. Executar</text><text x="300" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">a equipe</text><text x="300" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">trabalha</text><line x1="386" y1="155" x2="409" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="412" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#C2185B" stroke-width="3"/><rect x="412" y="90" width="168" height="40" rx="14" fill="#C2185B"/><rect x="412" y="116" width="168" height="14" fill="#C2185B"/><text x="496" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3. Acompanhar</text><text x="496" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">follow-up: status, %,</text><text x="496" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">decisões e ações</text><line x1="582" y1="155" x2="605" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="608" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#3A86FF" stroke-width="3"/><rect x="608" y="90" width="168" height="40" rx="14" fill="#3A86FF"/><rect x="608" y="116" width="168" height="14" fill="#3A86FF"/><text x="692" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4. Analisar</text><text x="692" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Visão geral, CFD,</text><text x="692" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Equipe, Riscos</text><line x1="778" y1="155" x2="801" y2="155" stroke="#2B1B3D" stroke-width="2.5" marker-end="url(#a)"/><rect x="804" y="90" width="168" height="130" rx="14" fill="#FFFFFF" stroke="#B35300" stroke-width="3"/><rect x="804" y="90" width="168" height="40" rx="14" fill="#B35300"/><rect x="804" y="116" width="168" height="14" fill="#B35300"/><text x="888" y="117" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5. Decidir e agir</text><text x="888" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">reagendar, desbloquear,</text><text x="888" y="178.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#2B1B3D">renegociar escopo</text><path d="M888 222 V270 H300 V224" fill="none" stroke="#2B1B3D" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="20" y="300" width="960" height="44" rx="10" fill="#FFF1C9"/><text x="500" y="328" font-size="15" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Salvar grava tudo no próprio HTML · ⬇ JSON guarda uma cópia com data e hora</text>
</g></svg>
