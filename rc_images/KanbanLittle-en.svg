<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Little’s Law: less WIP, faster delivery</title>
<desc id="d">At the top, Little’s Law: average cycle time equals average WIP divided by throughput. Team A has 12 items in progress and delivers 3 per day: a cycle time of 4 days. Team B has 6 items in progress and delivers the same 3 per day: a cycle time of 2 days.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker></defs>
<rect width="1000" height="490" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Little’s Law: less WIP, faster delivery</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">With the same throughput, reducing work in progress reduces cycle time</text>
<rect x="200.0" y="96.0" width="600.0" height="56.0" rx="12" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="500.0" y="131.0" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">Average cycle time = Average WIP ÷ Throughput</text>
<text x="40.0" y="198.0" font-size="15" fill="#2B1B3D" font-weight="700">Team A: 12 items in progress</text>
<rect x="40.0" y="212.0" width="560.0" height="60.0" rx="30" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/>
<rect x="62.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="105.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="148.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="191.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="234.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="277.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="320.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="363.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="406.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="449.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="492.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="535.0" y="226.0" width="32.0" height="32.0" rx="5" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/>
<line x1="606.0" y1="242.0" x2="660.0" y2="242.0" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<text x="632.0" y="226.0" font-size="11.5" fill="#756986" text-anchor="middle">3 per day</text>
<rect x="670.0" y="212.0" width="300.0" height="60.0" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="820.0" y="236.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">12 ÷ 3 per day = 4 days</text>
<text x="820.0" y="258.0" font-size="13" fill="#3E3350" text-anchor="middle">each item takes 4 days on average</text>
<text x="40.0" y="328.0" font-size="15" fill="#2B1B3D" font-weight="700">Team B: 6 items in progress</text>
<rect x="40.0" y="342.0" width="560.0" height="60.0" rx="30" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2"/>
<rect x="62.0" y="356.0" width="32.0" height="32.0" rx="5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="105.0" y="356.0" width="32.0" height="32.0" rx="5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="148.0" y="356.0" width="32.0" height="32.0" rx="5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="191.0" y="356.0" width="32.0" height="32.0" rx="5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="234.0" y="356.0" width="32.0" height="32.0" rx="5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1.5"/>
<rect x="277.0" y="356.0" width="32.0" height="32.0" rx="5" fill="#2A9D8F" stroke="#2B1B3D" stroke-width="1.5"/>
<line x1="606.0" y1="372.0" x2="660.0" y2="372.0" stroke="#2B1B3D" stroke-width="3" marker-end="url(#ar)"/>
<text x="632.0" y="356.0" font-size="11.5" fill="#756986" text-anchor="middle">3 per day</text>
<rect x="670.0" y="342.0" width="300.0" height="60.0" rx="10" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/>
<text x="820.0" y="366.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">6 ÷ 3 per day = 2 days</text>
<text x="820.0" y="388.0" font-size="13" fill="#3E3350" text-anchor="middle">each item takes 2 days on average</text>
<text x="500.0" y="470.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">It holds for long-term averages in a stable system: what comes in must, on average, be what goes out.</text>
</svg>
