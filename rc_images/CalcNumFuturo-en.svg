t-weight="700">AI inventing algorithms</text><text x="185" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">AlphaTensor (2022),</text><text x="185" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">AlphaEvolve (2025)</text><rect x="355" y="270" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="355" y="270" width="290" height="46" rx="12" fill="#FF6B6B"/><text x="500" y="300" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Quantum computing</text><text x="500" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">promise for some</text><text x="500" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">problems; many caveats</text><rect x="670" y="270" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#EF476F" stroke-width="2.5"/><rect x="670" y="270" width="290" height="46" rx="12" fill="#EF476F"/><text x="815" y="300" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Digital twins</text><text x="815" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">copies of the Earth, the body</text><text x="815" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">and factories, in real time</text><rect x="150" y="460" width="700" height="70" rx="12" fill="#E2F6F2" stroke="#2A9D8F" stroke-width="2.5"/><text x="500" y="490" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">The common thread of 4,000 years is still the same:</text><text x="500" y="515" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">compute with confidence, knowing how big the error is</text>
