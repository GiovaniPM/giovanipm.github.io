<text x="700.0" y="151.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Texto (etiqueta)</text>
<rect x="60.0" y="179.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="202.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">[Enviar]</text>
<line x1="388" y1="196" x2="418" y2="196" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
