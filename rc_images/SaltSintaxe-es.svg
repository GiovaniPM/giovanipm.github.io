<text x="700.0" y="351.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Campo de texto</text>
<rect x="60.0" y="379.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="402.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">^Elige^</text>
<line x1="388" y1="396" x2="418" y2="396" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="430.0" y="385.0" width="200.0" height="26.0" rx="0" fill="#EDEDED" stroke="#2B1B3D" stroke-width="1.6"/><text x="435.0" y="403.0" font-size="14" fill="#2B1B3D" xml:space="preserve">Elige</text><line x1="608" y1="385" x2="608" y2="411" stroke="#2B1B3D" stroke-width="1.6"/><path d="M613 393 h12 l-6 11 z" fill="#2B1B3D"/>
<text x="700.0" y="401.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Lista desplegable</text>
<rect x="40.0" y="422.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="429.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="452.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">Usuario &lt;&amp;person&gt;</text>
<line x1="388" y1="446" x2="418" y2="446" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<text x="430.0" y="451.0" font-size="15" fill="#2B1B3D" xml:space="preserve">Usuario</text><g transform="translate(485.0,438)" fill="#2B1B3D"><circle cx="7" cy="4" r="4"/><path d="M0 15 q7 -10 14 0 z"/></g>
