<line x1="388" y1="296" x2="418" y2="296" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
<rect x="431.0" y="289.0" width="14.0" height="14.0" rx="1" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.8"/><text x="452.0" y="301.0" font-size="14" fill="#2B1B3D" xml:space="preserve">No</text><rect x="541.0" y="289.0" width="14.0" height="14.0" rx="1" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.8"/><path d="M544 296 l3.5 4 l6.5 -9" fill="none" stroke="#2B1B3D" stroke-width="2.4"/><text x="562.0" y="301.0" font-size="14" fill="#2B1B3D" xml:space="preserve">Sí</text>
<text x="700.0" y="301.0" font-size="15" fill="#5B2A86" font-weight="700" xml:space="preserve">Casilla de verificación</text>
<rect x="40.0" y="322.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="329.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="352.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">"Escribe aquí     "</text>
