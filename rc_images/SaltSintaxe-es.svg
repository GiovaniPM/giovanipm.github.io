<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Los widgets básicos de Salt</title>
<desc id="d">Tabla con siete filas. A la izquierda el código Salt, en el centro el control dibujado, a la derecha el nombre: el texto simple se convierte en una etiqueta; [Enviar] en un botón; () y (X) en botones de opción no seleccionado y seleccionado; [] y [X] en casillas de verificación; el texto entre comillas en un campo de texto; el texto entre acentos circunflejos en una lista desplegable; y &lt;&amp;person&gt; inserta el ícono de una persona.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="516" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Los widgets básicos de Salt</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Cada fragmento de texto se convierte en un control de la pantalla</text>
<text x="60.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">USTEDES ESCRIBEN</text><text x="430.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">SALT DIBUJA</text><text x="700.0" y="112.0" font-size="13" fill="#756986" font-weight="700" xml:space="preserve">NOMBRE</text>
<rect x="40.0" y="122.0" width="920.0" height="46.0" rx="10" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.7"/>
<rect x="60.0" y="129.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="152.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">Texto simple</text>
<line x1="388" y1="146" x2="418" y2="146" stroke="#756986" stroke-width="2" marker-end="url(#am)"/>
