<rect x="60.0" y="229.0" width="320.0" height="34.0" rx="8" fill="#2B1B3D" stroke="#2B1B3D" stroke-width="1"/><text x="72.0" y="252.0" font-size="15" fill="#FFB703" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">() No   (X) Sí</text>
