<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Three Amigos and example mapping</title>
<desc id="d">On the left, three people, business, development and testing, meeting in a specification workshop. An arrow leads to example mapping, on the right: a yellow card with the story withdraw cash at the ATM, two blue cards with rules, enough balance and valid card, green cards with examples for each rule and a red card with the question what if the ATM is out of notes.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="515" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Three Amigos and example mapping</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Business, development and testing talk before coding, using concrete examples</text>
<circle cx="110" cy="140" r="24" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5"/><path d="M70 222 q0 -48 40 -48 q40 0 40 48 z" fill="#FFB703" stroke="#2B1B3D" stroke-width="2.5" stroke-linejoin="round"/>
<text x="110.0" y="252.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Business</text>
<text x="110.0" y="272.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">what problem to solve?</text>
<circle cx="260" cy="140" r="24" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5"/><path d="M220 222 q0 -48 40 -48 q40 0 40 48 z" fill="#3A86FF" stroke="#2B1B3D" stroke-width="2.5" stroke-linejoin="round"/>
<text x="260.0" y="252.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Development</text>
<text x="260.0" y="272.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">how to build it?</text>
<circle cx="410" cy="140" r="24" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2.5"/><path d="M370 222 q0 -48 40 -48 q40 0 40 48 z" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="2.5" stroke-linejoin="round"/>
<text x="410.0" y="252.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Testing</text>
<text x="410.0" y="272.0" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">what could go wrong?</text>
<rect x="50" y="300" width="420" height="120" rx="14" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="260.0" y="332.0" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700">Specification workshop</text>
<text x="260.0" y="358.0" font-size="13" fill="#3E3350" text-anchor="middle">shared language, no technical details</text>
<text x="260.0" y="378.0" font-size="13" fill="#3E3350" text-anchor="middle">out come rules, examples and questions</text>
<path d="M474 360 C 510 360, 520 300, 552 300" stroke="#2B1B3D" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="750.0" y="112.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">Example mapping</text>
<rect x="560" y="128" width="380" height="44" rx="6" fill="#FFE08A" stroke="#B35300" stroke-width="2"/>
<text x="750.0" y="156.0" font-size="14" fill="#2B1B3D" text-anchor="middle" font-weight="700">Story: withdraw cash at the ATM</text>
<rect x="560" y="188" width="180" height="40" rx="6" fill="#BFD7FF" stroke="#3A86FF" stroke-width="2"/>
<text x="650.0" y="213.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Rule: enough balance</text>
<rect x="568" y="240" width="172" height="38" rx="6" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="654.0" y="264.0" font-size="11.5" fill="#2B1B3D" text-anchor="middle">has 100, asks 20 → gets 20</text>
<rect x="568" y="288" width="172" height="38" rx="6" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="654.0" y="312.0" font-size="11.5" fill="#2B1B3D" text-anchor="middle">has 10, asks 20 → refused</text>
<rect x="760" y="188" width="180" height="40" rx="6" fill="#BFD7FF" stroke="#3A86FF" stroke-width="2"/>
<text x="850.0" y="213.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">Rule: valid card</text>
<rect x="768" y="240" width="172" height="38" rx="6" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="854.0" y="264.0" font-size="11.5" fill="#2B1B3D" text-anchor="middle">card ok → returned</text>
<rect x="768" y="288" width="172" height="38" rx="6" fill="#C8EDE6" stroke="#2A9D8F" stroke-width="2"/>
<text x="854.0" y="312.0" font-size="11.5" fill="#2B1B3D" text-anchor="middle">card blocked → retained</text>
<rect x="560" y="350" width="380" height="40" rx="6" fill="#FFC9C9" stroke="#E23B3B" stroke-width="2"/>
<text x="750.0" y="375.0" font-size="13" fill="#2B1B3D" text-anchor="middle">Question: what if the ATM is out of notes?</text>
<rect x="560" y="406" width="14" height="14" rx="3" fill="#FFE08A" stroke="#2B1B3D" stroke-width="1"/>
<text x="580.0" y="418.0" font-size="12" fill="#3E3350">story</text>
<rect x="657" y="406" width="14" height="14" rx="3" fill="#BFD7FF" stroke="#2B1B3D" stroke-width="1"/>
<text x="677.0" y="418.0" font-size="12" fill="#3E3350">rule</text>
<rect x="754" y="406" width="14" height="14" rx="3" fill="#C8EDE6" stroke="#2B1B3D" stroke-width="1"/>
<text x="774.0" y="418.0" font-size="12" fill="#3E3350">example</text>
<rect x="851" y="406" width="14" height="14" rx="3" fill="#FFC9C9" stroke="#2B1B3D" stroke-width="1"/>
<text x="871.0" y="418.0" font-size="12" fill="#3E3350">question</text>
<text x="500.0" y="470.0" font-size="13" fill="#3E3350" text-anchor="middle">Each example becomes a Given/When/Then scenario; each question goes back to the business.</text>
<text x="500.0" y="492.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Too many questions or rules mean the story is not ready yet.</text>
</svg>
