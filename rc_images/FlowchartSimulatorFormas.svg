<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 474" role="img" aria-labelledby="t d"><title id="t">As 12 formas do Flowchart Simulator</title><desc id="d">Início: um por folha; Fim: pode haver vários; Processo: atividade ou cálculo; Decisão: divide o fluxo em ramos; Entrada: pede um valor; Saída: escreve uma mensagem; Subprocesso: executa outra folha; Espera: só consome tempo; Documento: registra um documento; Dados: lê ou grava em uma base; Conector: junta ramos; Nota: comentário, não executa.</desc><rect width="840" height="474" fill="#FFF7EC"/><g transform="translate(105 68)" fill="#DFF3E4" stroke="#2B7A45" stroke-width="2"><rect x="-52" y="-22" width="104" height="44" rx="22"/></g><text x="105" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Início</text><text x="105" y="144" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">um por folha</text><g transform="translate(315 68)" fill="#FBE4E2" stroke="#B3362C" stroke-width="2"><rect x="-52" y="-22" width="104" height="44" rx="22"/></g><text x="315" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Fim</text><text x="315" y="144" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">pode haver vários</text><g transform="translate(525 68)" fill="#E4F0FB" stroke="#1F5F99" stroke-width="2"><rect x="-58" y="-26" width="116" height="52" rx="3"/></g><text x="525" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Processo</text><text x="525" y="144" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">atividade ou cálculo</text><g transform="translate(735 68)" fill="#FDF0D0" stroke="#9A6A00" stroke-width="2"><path d="M0-32 66 0 0 32-66 0Z"/></g><text x="735" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Decisão</text><text x="735" y="144" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">divide o fluxo em ramos</text><g transform="translate(105 218)" fill="#EFEAFA" stroke="#65509C" stroke-width="2"><path d="M-44-26H66L44 26H-66Z"/><text x="50" y="-11" font-size="13" text-anchor="middle" fill="#2B1B3D" stroke="none">↓</text></g><text x="105" y="276" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Entrada</text><text x="105" y="294" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">pede um valor</text><g transform="translate(315 218)" fill="#EFEAFA" stroke="#65509C" stroke-width="2"><path d="M-44-26H66L44 26H-66Z"/><text x="50" y="-11" font-size="13" text-anchor="middle" fill="#2B1B3D" stroke="none">↑</text></g><text x="315" y="276" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Saída</text><text x="315" y="294" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">escreve uma mensagem</text><g transform="translate(525 218)" fill="#DCF1EC" stroke="#176B5B" stroke-width="2"><path d="M-60-26H60V26H-60ZM-48-26V26M48-26V26"/></g><text x="525" y="276" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#2B1B3D">Subprocesso</text><text x="525" y="294" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="12" fill="#2B1B3D">executa outra folha</text><g transform="translate(735 218)" fill="#FAE6EF" stroke="#A8406F" stroke-width="2"><path d="M-54-24H28A24 24 0 0 1 28