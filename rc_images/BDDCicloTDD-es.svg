<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">El ciclo Rojo, Verde, Refactorización del TDD</title>
<desc id="d">Ciclo con tres etapas unidas por flechas en sentido horario: rojo, escribe una prueba que falla; verde, escribe el código mínimo para pasar; refactorización, mejora el código sin cambiar su efecto. En el centro: ejecuta todas las pruebas en cada paso.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E23B3B"/></marker></defs>
<rect width="1000" height="610" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">El ciclo Rojo, Verde, Refactorización del TDD</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Cada vuelta del ciclo dura pocos minutos y agrega una pequeña pieza de comportamiento</text>
<path d="M592.3 208.2 A165 165 0 0 1 664.6 333.5" stroke="#2A9D8F" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ag)"/>
<path d="M572.3 493.3 A165 165 0 0 1 427.7 493.3" stroke="#3A86FF" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ab)"/>
<path d="M335.4 333.5 A165 165 0 0 1 407.7 208.2" stroke="#E23B3B" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ard)"/>
<circle cx="500.0" cy="180.0" r="82" fill="#FFE3E3" stroke="#E23B3B" stroke-width="4"/>
<text x="500.0" y="166.0" font-size="20" fill="#B3261E" text-anchor="middle" font-weight="700">Rojo</text>
<text x="500.0" y="190.0" font-size="13" fill="#3E3350" text-anchor="middle">escribe una prueba</text>
<text x="500.0" y="208.0" font-size="13" fill="#3E3350" text-anchor="middle">que falla</text>
<circle cx="642.9" cy="427.5" r="82" fill="#DDF3EF" stroke="#2A9D8F" stroke-width="4"/>
<text x="642.9" y="413.5" font-size="20" fill="#2A9D8F" text-anchor="middle" font-weight="700">Verde</text>
<text x="642.9" y="437.5" font-size="13" fill="#3E3350" text-anchor="middle">escribe el código</text>
<text x="642.9" y="455.5" font-size="13" fill="#3E3350" text-anchor="middle">mínimo para pasar</text>
<circle cx="357.1" cy="427.5" r="82" fill="#E1ECFF" stroke="#3A86FF" stroke-width="4"/>
<text x="357.1" y="413.5" font-size="20" fill="#3A86FF" text-anchor="middle" font-weight="700">Refactorización</text>
<text x="357.1" y="437.5" font-size="13" fill="#3E3350" text-anchor="middle">mejora el código</text>
<text x="357.1" y="455.5" font-size="13" fill="#3E3350" text-anchor="middle">sin cambiar lo que hace</text>
<text x="500.0" y="349.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">ejecuta todas las pruebas</text>
<text x="500.0" y="369.0" font-size="13" fill="#756986" text-anchor="middle">en cada paso</text>
<text x="500.0" y="590.0" font-size="13" fill="#756986" text-anchor="middle" font-style="italic">Durante la refactorización todas las pruebas deben seguir en verde; nada de funcionalidad nueva en esta etapa.</text>
</svg>
