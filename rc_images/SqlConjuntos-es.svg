<text x="514.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Alex 2000</text>
<rect x="740.0" y="410.0" width="228.0" height="236.0" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<text x="754.0" y="436.0" font-size="15" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">EXCEPT · MINUS</text>
<text x="954.0" y="436.0" font-size="12.5" fill="#756986" text-anchor="end" font-weight="700" xml:space="preserve">2 filas</text>
<text x="754.0" y="458.0" font-size="12" fill="#3E3350" font-style="italic" xml:space="preserve">lo que está solo en la primera</text>
<text x="754.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">João 1000</text>
<text x="754.0" y="511.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Roberto 5000</text>
<text x="500.0" y="676.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">En Oracle, EXCEPT se llama MINUS (EXCEPT también se acepta desde la versión 21c). Sin ORDER BY, el orden no está garantizado.</text>
</svg>
