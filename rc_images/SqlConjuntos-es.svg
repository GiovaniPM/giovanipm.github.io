<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 698" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">UNION, INTERSECT y EXCEPT</title>
<desc id="d">Diagrama de Venn con ventas2005 a la izquierda, con João 1000 y Roberto 5000, ventas2006 a la derecha, con João 2000 e Isaque 35000, y Alex 2000 en la intersección. Abajo, cuatro resultados: UNION con 5 filas, UNION ALL con 6, porque Alex 2000 aparece dos veces, INTERSECT con 1, Alex 2000, y EXCEPT o MINUS con 2, João 1000 y Roberto 5000.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="698" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">UNION, INTERSECT y EXCEPT</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Los operadores de conjuntos comparan filas enteras de dos consultas</text>
<circle cx="330" cy="230" r="120" fill="#EFE3FA" fill-opacity="0.8" stroke="#5B2A86" stroke-width="2.5"/><circle cx="490" cy="230" r="120" fill="#E1ECFF" fill-opacity="0.8" stroke="#3A86FF" stroke-width="2.5"/>
