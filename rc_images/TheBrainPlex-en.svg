<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The Plex: the active thought at the center</title>
<desc id="d">The active thought Bolts is at the center. Above it, the parent Fasteners. Below, the children Bolt M8x30, Bolt M6x20 and Bolt M10x40. On the left, linked by jumps, ISO 4017 and Alfa Metalworks. On the right, the siblings Nuts and Washers, which share the same parent.</desc>
