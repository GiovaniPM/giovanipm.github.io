<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" role="img" aria-labelledby="t d"><title id="t">Il mazzo è finito e non hai il seme</title><desc id="d">Due riquadri. Sul tavolo ci sono il Re e il 3 di fiori, il mazzo è vuoto e la mano del giocatore ha il 5 di quadri e il 2 di picche. Nel primo riquadro, le due carte del tavolo vanno nella sua mano. Nel secondo, passa il turno.</desc><rect width="1000" height="476" rx="18" fill="#FFF7EC"/><text x="500" y="44" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Il mazzo è finito e non hai il seme</text><rect x="20" y="66" width="470" height="388" rx="14" fill="#FFFFFF" stroke="#E9DCC8" stroke-width="2"/><text x="255" y="98" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#D9480F" font-weight="700" text-anchor="middle">Opzione: prendi le carte del tavolo</text><rect x="44" y="122" width="62" height="90" rx="8" fill="none" stroke="#B9A98F" stroke-width="2" stroke-dasharray="6 5"/><text x="75" y="232" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#756986" text-anchor="middle">mazzo vuoto</text><text x="130" y="116" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#756986">sul tavolo</text><svg x="130" y="124" width="62" height="89.89999999999999" viewBox="0 0 100 145"><rect x="1" y="1" width="98" height="143" rx="8" fill="#FFFDF6" stroke="#B9A98F" stroke-width="1.500"/><text x="7" y="21" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#20242B">K</text><path transform="translate(15 33) scale(0.55)" d="M0 -14A6.200 6.200 0 0 1 5 -4A6.200 6.200 0 1 1 3.500 7C4 10 5 12 7 14H-7C-5 12 -4 10 -3.500 7A6.200 6.200 0 1 1 -5 -4A6.200 6.200 0 0 1 0 -14Z" fill="#20242B"/><g transform="rotate(180 50 72.500)"><text x="7" y="21" font-family="Georgia, serif" f