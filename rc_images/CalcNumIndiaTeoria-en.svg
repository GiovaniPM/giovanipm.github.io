<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Building the table by adding differences</title>
<desc id="d">On the left, a bar chart of the 24 differences in Aryabhata’s table, from 225 down to 7: each sine is the previous one plus a difference, and the differences keep shrinking. On the right, the rule: new difference = previous difference − (sum of the sines so far) ÷ 233.5. Aryabhata uses the divisor 225; with the exact divisor, about 233.5, the rule reproduces the table almost perfectly. First steps: 225; 225 − 225 ÷ 233.5 ≈ 224; 224 − 449 ÷ 233.5 ≈ 222; 222 − 671 ÷ 233.5 ≈ 219. Below: this is the idea of finite differences, the same one Richardson would use in 1922, 1,400 years earlier.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Building the table by adding differences</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Each sine = previous sine + a difference that keeps shrinking</text><line x1="70" y1="420" x2="560" y2="420" stroke="#2B1B3D" stroke-width="2"/><rect x="74" y="140" width="15" height="280" rx="2" fill="#5B2A86"/><text x="81.5" y="132" font-size="12" fill="#2B1B3D" text-anchor="middle" font-weight="700">225</text><text x="81.5" y="440" font-size="12" fill="#756986" text-anchor="middle">1</text><rect x="94" y="141.244" width="15" height="278.756" rx="2" fill="#5B2A86"/><rect x="114" y="143.733" width="15" height="276.267" rx="2" fill="#5B2A86"/><rect x="134" y="147.467" width="15" height="272.533" rx="2" fill="#5B2A86"/><rect x="154" y="152.444" width="15" height="267.556" rx="2" fill="#5B2A86"/><rect x="174" y="158.667" width="15" height="261.333" rx="2" fill="#5B2A86"/><text x="181.5" y="150.667" font-size="12" fill="#2B1B3D" text-anchor="middle" font-weight="700">210</text><text x="181.5" y="440" font-size="12" fill="#756986" text-anchor="middle">6</text><rect x="194" y="164.889" width="15" height="255.111" rx="2" fill="#3A86FF"/><rect x="214" y="172.356" width="15" height="247.644" rx="2" fill="#3A86FF"/><rect x="234" y="182.311" width="15" height="237.689" rx="2" fill="#3A86FF"/><rect x="254" y="192.267" width="15" height="227.733" rx="2" fill="#3A86FF"/><rect x="274" y="203.467" width="15" height="216.533" rx="2" fill="#3A86FF"/><rect x="294" y="215.911" width="15" height="204.089" rx="2" fill="#3A86FF"/><text x="301.5" y="207.911" font-size="12" fill="#2B1B3D" text-anchor="middle" font-weight="700">164</text><text x="301.5" y="440" font-size="12" fill="#756986" text-anchor="middle">12</text><rect x="314" y="228.356" width="15" height="191.644" rx="2" fill="#2A9D8F"/><rect x="334" y="242.044" width="15" height="177.956" rx="2" fill="#2A9D8F"/><rect x="354" y="256.978" width="15" height="163.022" rx="2" fill="#2A9D8F"/><rect x="374" y="271.911" width="15" height="148.089" rx="2" fill="#2A9D8F"/><rect x="394" y="288.089" width="15" height="131.911" rx="2" fill="#2A9D8F"/><rect x="414" y="304.267" width="15" height="115.733" rx="2" fill="#2A9D8F"/><text x="421.5" y="296.267" font-size="12" fill="#2B1B3D" text-anchor="middle" font-weight="700">93</text><text x="421.5" y="440" font-size="12" fill="#756986" text-anchor="middle">18</text><rect x="434" y="321.689" width="15" height="98.3111" rx="2" fill="#FFB703"/><rect x="454" y="339.111" width="15" height="80.8889" rx="2" fill="#FFB703"/><rect x="474" y="356.533" width="15" height="63.4667" rx="2" fill="#FFB703"/><rect x="494" y="373.956" width="15" height="46.0444" rx="2" fill="#FFB703"/><rect x="514" y="392.622" width="15" height="27.3778" rx="2" fill="#FFB703"/><rect x="534" y="411.289" width="15" height="8.71111" rx="2" fill="#FFB703"/><text x="541.5" y="403.289" font-size="12" fill="#2B1B3D" text-anchor="middle" font-weight="700">7</text><text x="541.5" y="440" font-size="12" fill="#756986" text-anchor="middle">24</text><text x="315" y="464" font-size="13" fill="#756986" text-anchor="middle">arc number (each 3°45’)</text><text x="315" y="118" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Aryabhata’s 24 differences</text><rect x="600" y="100" width="370" height="200" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="785" y="130" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">The rule</text><text x="785" y="166" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">new difference = previous difference</text><text x="785" y="190" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">− (sum of sines so far) ÷ 233.5</text><text x="785" y="226" font-size="13" fill="#756986" text-anchor="middle">Aryabhata writes ÷ 225; the exact</text><text x="785" y="248" font-size="13" fill="#756986" text-anchor="middle">divisor, ≈ 233.5, reproduces the table.</text><text x="785" y="270" font-size="13" fill="#756986" text-anchor="middle">The bigger the sine, the more the curve bends.</text><rect x="600" y="320" width="370" height="160" rx="12" fill="#FFF1C9"/><text x="785" y="350" font-size="16" fill="#B35300" text-anchor="middle" font-weight="700">First steps</text><text x="785" y="380" font-size="15" fill="#2B1B3D" text-anchor="middle">225</text><text x="785" y="404" font-size="15" fill="#2B1B3D" text-anchor="middle">225 − 225 ÷ 233.5 ≈ 224</text><text x="785" y="428" font-size="15" fill="#2B1B3D" text-anchor="middle">224 − 449 ÷ 233.5 ≈ 222</text><text x="785" y="452" font-size="15" fill="#2B1B3D" text-anchor="middle">222 − 671 ÷ 233.5 ≈ 219</text><rect x="40" y="488" width="930" height="40" rx="10" fill="#E2F6F2"/><text x="505" y="514" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="700">This is the idea of finite differences, 1,400 years before Richardson.</text>
</svg>
