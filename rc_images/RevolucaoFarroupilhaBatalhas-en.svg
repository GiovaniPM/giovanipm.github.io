<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
<title id="t">Historical battles simulated in the game</title>
<desc id="d">Historical battles simulated in the game. Seival, 1836: victory 54%, draw 36%, defeat 10%; in history: victory. Fanfa, 1836 (defending): victory 10%, draw 27%, defeat 64%; in history: defeat. Rio Pardo, 1838: victory 34%, draw 49%, defeat 17%; in history: victory. Santa Vitória, 1839: victory 13%, draw 12%, defeat 75%; in history: victory. Taquari, 1840: victory 3%, draw 60%, defeat 37%; in history: indecisive. São José do Norte, 1840: victory 18%, draw 34%, defeat 48%; in history: defeat. Ponche Verde, 1843: victory 92%, draw 7%, defeat 1%; in history: disputed. Porongos, 1844: riding out: victory 45%, draw 14%, defeat 41%; in history: defeat. Porongos, 1844: in camp: victory 100%, draw 0%, defeat 0%; in history: —. 2,000 battles per row, using the game’s battle function and the forces from the sources. It is the game’s model, not the real probability.</desc>
<rect width="1000" height="480" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="300" y="38" font-size="14" fill="#756986">0%</text><text x="820" y="38" font-size="14" fill="#756986" text-anchor="end">100%</text><text x="960" y="38" font-size="14" fill="#756986" text-anchor="end">in history</text>
<text x="288" y="72" font-size="15" text-anchor="end">Seival, 1836</text><rect x="300.0" y="56" width="280.0" height="24" fill="#0E8074"/><text x="440.0" y="73" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">54%</text><rect x="580.0" y="56" width="187.5" height="24" fill="#FFB703"/><text x="673.8" y="73" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">36%</text><rect x="767.5" y="56" width="52.5" height="24" fill="#C2185B"/><text x="793.7" y="73" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">10%</text><text x="960" y="73" font-size="14" text-anchor="end" fill="#756986">victory</text>
<text x="288" y="110" font-size="15" text-anchor="end">Fanfa, 1836 (defending)</text><rect x="300.0" y="94" width="49.7" height="24" fill="#0E8074"/><text x="324.8" y="111" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">10%</text><rect x="349.7" y="94" width="139.4" height="24" fill="#FFB703"/><text x="419.3" y="111" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">27%</text><rect x="489.0" y="94" width="331.0" height="24" fill="#C2185B"/><text x="654.5" y="111" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">64%</text><text x="960" y="111" font-size="14" text-anchor="end" fill="#756986">defeat</text>
<text x="288" y="148" font-size="15" text-anchor="end">Rio Pardo, 1838</text><rect x="300.0" y="132" width="177.1" height="24" fill="#0E8074"/><text x="388.5" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">34%</text><rect x="477.1" y="132" width="254.5" height="24" fill="#FFB703"/><text x="604.3" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">49%</text><rect x="731.6" y="132" width="88.4" height="24" fill="#C2185B"/><text x="775.8" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">17%</text><text x="960" y="149" font-size="14" text-anchor="end" fill="#756986">victory</text>
<text x="288" y="186" font-size="15" text-anchor="end">Santa Vitória, 1839</text><rect x="300.0" y="170" width="66.3" height="24" fill="#0E8074"/><text x="333.1" y="187" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">13%</text><rect x="366.3" y="170" width="64.7" height="24" fill="#FFB703"/><text x="398.7" y="187" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">12%</text><rect x="431.0" y="170" width="389.0" height="24" fill="#C2185B"/><text x="625.5" y="187" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">75%</text><text x="960" y="187" font-size="14" text-anchor="end" fill="#756986">victory</text>
