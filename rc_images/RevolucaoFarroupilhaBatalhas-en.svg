<text x="288" y="338" font-size="15" text-anchor="end">Porongos, 1844: riding out</text><rect x="300.0" y="322" width="235.0" height="24" fill="#0E8074"/><text x="417.5" y="339" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">45%</text><rect x="535.0" y="322" width="70.2" height="24" fill="#FFB703"/><text x="570.1" y="339" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B1B3D">14%</text><rect x="605.2" y="322" width="214.8" height="24" fill="#C2185B"/><text x="712.6" y="339" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">41%</text><text x="960" y="339" font-size="14" text-anchor="end" fill="#756986">defeat</text>
<text x="288" y="376" font-size="15" text-anchor="end">Porongos, 1844: in camp</text><rect x="300.0" y="360" width="519.0" height="24" fill="#0E8074"/><text x="559.5" y="377" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">100%</text><rect x="819.2" y="360" width="0.8" height="24" fill="#C2185B"/><text x="960" y="377" font-size="14" text-anchor="end" fill="#756986">—</text>
<rect x="300" y="408" width="18" height="18" rx="3" fill="#0E8074"/><text x="326" y="422" font-size="14">victory</text><rect x="450" y="408" width="18" height="18" rx="3" fill="#FFB703"/><text x="476" y="422" font-size="14">draw</text><rect x="600" y="408" width="18" height="18" rx="3" fill="#C2185B"/><text x="626" y="422" font-size="14">defeat</text>
<text x="40" y="458" font-size="13.5" fill="#756986">2,000 battles per row, using the game’s battle function and the forces from the sources. It is the game’s model, not the real probability.</text>
