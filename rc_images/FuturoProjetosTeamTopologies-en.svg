<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Team Topologies: four team types</title>
<desc id="d">Team Topologies diagram. Three stream-aligned teams, in yellow, run along the flow of change from left to right. An enabling team, in green, crosses the teams vertically. A complicated-subsystem team, in red, collaborates with one of the teams. A platform team, in blue, supports all of them with self-service capabilities. The interaction modes are collaboration, X-as-a-Service and facilitating.</desc>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="50" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Team Topologies: four team types</text>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFD9D9"/><rect width="3" height="8" fill="#E0A100" opacity=".6"/></pattern></defs>
<path d="M70 92 H590" stroke="#2B1B3D" stroke-width="3"/><path d="M586 82 L606 92 L586 102 Z" fill="#2B1B3D"/>
<text x="80" y="84" font-size="14" font-weight="700" fill="#2B1B3D" text-anchor="start">Flow of change</text>
<rect x="70" y="126" width="530" height="50" rx="12" fill="#FFE7A3" stroke="#E0A100" stroke-width="3" opacity=".97"/>
<text x="370" y="157" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="middle">Stream-aligned</text>
<rect x="70" y="196" width="530" height="50" rx="12" fill="#FFE7A3" stroke="#E0A100" stroke-width="3" opacity=".97"/>
<text x="370" y="227" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="middle">Stream-aligned</text>
<rect x="70" y="266" width="530" height="50" rx="12" fill="#FFE7A3" stroke="#E0A100" stroke-width="3" opacity=".97"/>
<text x="370" y="297" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="middle">Stream-aligned</text>
<rect x="96" y="112" width="62" height="236" rx="12" fill="#D5F0EA" fill-opacity=".92" stroke="#2A9D8F" stroke-width="3" stroke-dasharray="7 4"/>
<text x="132" y="230" font-size="15" font-weight="700" fill="#0E8074" text-anchor="middle" transform="rotate(-90 132 230)">Enabling</text>
<rect x="470" y="300" width="130" height="64" rx="12" fill="#FFD9D9" stroke="#FF6B6B" stroke-width="3"/>
<rect x="470" y="300" width="130" height="16" fill="url(#hatch)"/>
<text x="535" y="336" font-size="13.5" font-weight="700" fill="#2B1B3D" text-anchor="middle">Complicated</text><text x="535" y="352" font-size="13.5" font-weight="700" fill="#2B1B3D" text-anchor="middle">subsystem</text>
<rect x="70" y="400" width="530" height="58" rx="12" fill="#D6E6FF" stroke="#3A86FF" stroke-width="3"/>
<text x="335" y="435" font-size="17" font-weight="700" fill="#1F5FCC" text-anchor="middle">Platform</text>
<path d="M110 386 v-10 h70 v10" fill="none" stroke="#3A86FF" stroke-width="3"/>
<path d="M145 376 V320" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M250 386 v-10 h70 v10" fill="none" stroke="#3A86FF" stroke-width="3"/>
<path d="M285 376 V320" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M390 386 v-10 h70 v10" fill="none" stroke="#3A86FF" stroke-width="3"/>
<path d="M425 376 V320" stroke="#3A86FF" stroke-width="2" stroke-dasharray="3 3"/>
<rect x="650" y="86" width="26" height="26" rx="6" fill="#FFE7A3" stroke="#E0A100" stroke-width="3"/>
<text x="690" y="104" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Stream-aligned</text>
<text x="690" y="124" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">delivers end-to-end value</text><text x="690" y="140" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">on one flow of change</text>
<rect x="650" y="152" width="26" height="26" rx="6" fill="#D6E6FF" stroke="#3A86FF" stroke-width="3"/>
<text x="690" y="170" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Platform</text>
<text x="690" y="190" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">offers internal services</text><text x="690" y="206" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">as self-service</text>
<rect x="650" y="218" width="26" height="26" rx="6" fill="#D5F0EA" stroke="#2A9D8F" stroke-width="3"/>
<text x="690" y="236" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Enabling</text>
<text x="690" y="256" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">helps other teams</text><text x="690" y="272" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">acquire capabilities</text>
<rect x="650" y="284" width="26" height="26" rx="6" fill="#FFD9D9" stroke="#FF6B6B" stroke-width="3"/>
<text x="690" y="302" font-size="16" font-weight="700" fill="#2B1B3D" text-anchor="start">Complicated subsystem</text>
<text x="690" y="322" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">owns parts that need</text><text x="690" y="338" font-size="13" font-weight="400" fill="#3E3350" text-anchor="start">specialist knowledge</text>
<text x="650" y="362" font-size="15" font-weight="700" fill="#5B2A86" text-anchor="start">Interaction modes</text>
<rect x="650" y="376" width="22" height="22" rx="4" fill="#FFE7A3" stroke="#E0A100" stroke-width="2"/><rect x="662" y="376" width="22" height="22" rx="4" fill="url(#hatch)" stroke="#FF6B6B" stroke-width="2"/>
<text x="698" y="393" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">Collaboration</text>
<path d="M650 420 v-8 h34 v8" fill="none" stroke="#3A86FF" stroke-width="3"/><rect x="650" y="422" width="34" height="12" rx="3" fill="#D6E6FF" stroke="#3A86FF" stroke-width="2"/>
<text x="698" y="431" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">X-as-a-Service</text>
<rect x="650" y="448" width="34" height="22" rx="4" fill="none" stroke="#2A9D8F" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="698" y="464" font-size="14" font-weight="400" fill="#3E3350" text-anchor="start">Facilitating</text>
<text x="500" y="500" font-size="13" font-weight="400" fill="#756986" text-anchor="middle" font-style="italic">Based on Skelton and Pais (2019).</text>
</svg>
