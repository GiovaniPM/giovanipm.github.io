<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Flow Framework: what flows and how to measure it</title>
<desc id="d">Flow Framework diagram. A value stream takes demand to the customer. Four flow items move through it: feature, new business value; defect, fixes quality; risk, security and compliance; and debt, removes future impediments. Five flow metrics: velocity, items completed per period; time, from work start to delivery; efficiency, active time divided by total time; load, items in progress; and distribution, share of each item type.</desc>
