<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Il metodo di Eulero: piccoli passi lungo la pendenza</title>
<desc id="d">Grafico della curva vera y = eˣ tra x = 0 e x = 1, che finisce a 2,718. Sopra, la spezzata del metodo di Eulero con passo 0,25: a ogni passo si segue la pendenza del punto attuale per un pezzetto, arrivando a 2,441. La differenza alla fine è l’errore. A destra, la formula: y nuovo = y + h × pendenza, e l’idea di Runge e Kutta: misurare la pendenza in quattro punti del passo e farne una media pesata.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Il metodo di Eulero: piccoli passi lungo la pendenza</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Esempio: y’ = y (la pendenza è uguale all’altezza), partendo da y = 1</text><line x1="90" y1="480" x2="540" y2="480" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="90" y1="480" x2="90" y2="110" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><line x1="85" y1="445.714" x2="520" y2="445.714" stroke="#F1E2CF" stroke-width="1"/><text x="80" y="450.714" font-size="12" fill="#756986" text-anchor="end">1,0</text><line x1="85" y1="360" x2="520" y2="360" stroke="#F1E2CF" stroke-width="1"/><text x="80" y="365" font-size="12" fill="#756986" text-anchor="end">1,5</text><line x1="85" y1="274.286" x2="520" y2="274.286" stroke="#F1E2CF" stroke-width="1"/><text x="80" y="279.286" font-size="12" fill="#756986" text-anchor="end">2,0</text><line x1="85" y1="188.571" x2="520" y2="188.571" stroke="#F1E2CF" stroke-width="1"/><text x="80" y="193.571" font-size="12" fill="#756986" text-anchor="end">2,5</text><text x="90" y="502" font-size="12" fill="#756986" text-anchor="middle">0</text><text x="197.5" y="502" font-size="12" fill="#756986" text-anchor="middle">0,25</text><text x="305" y="502" font-size="12" fill="#756986" text-anchor="middle">0,5</text><text x="412.5" y="502" font-size="12" fill="#756986" text-anchor="middle">0,75</text><text x="520" y="502" font-size="12" fill="#756986" text-anchor="middle">1</text><polyline points="90.0,445.7 97.2,442.8 104.3,439.9 111.5,436.9 118.7,433.9 125.8,430.8 133.0,427.7 140.2,424.5 147.3,421.3 154.5,418.0 161.7,414.6 168.8,411.2 176.0,407.8 183.2,404.2 190.3,400.7 197.5,397.0 204.7,393.3 211.8,389.6 219.0,385.7 226.2,381.8 233.3,377.9 240.5,373.9 247.7,369.8 254.8,365.6 262.0,361.4 269.2,357.1 276.3,352.7 283.5,348.3 290.7,343.8 297.8,339.2 305.0,334.5 312.2,329.8 319.3,324.9 326.5,320.0 333.7,315.0 340.8,309.9 348.0,304.8 355.2,299.5 362.3,294.2 369.5,288.8 376.7,283.2 383.8,277.6 391.0,271.9 398.2,266.1 405.3,260.2 412.5,254.2 419.7,248.1 426.8,241.9 434.0,235.6 441.2,229.2 448.3,222.7 455.5,216.1 462.7,209.3 469.8,202.5 477.0,195.5 484.2,188.4 491.3,181.2 498.5,173.9 505.7,166.4 512.8,158.9 520.0,151.2" fill="none" stroke="#5B2A86" stroke-width="3" stroke-linejoin="round"/><text x="514" y="137.152" font-size="15" fill="#5B2A86" text-anchor="end" font-weight="700">vera: 2,718</text><polyline points="90.0,445.7 197.5,402.9 305.0,349.3 412.5,282.3 520.0,198.6" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linejoin="round"/><circle cx="90" cy="445.714" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="197.5" cy="402.857" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="305" cy="349.286" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="412.5" cy="282.321" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="520" cy="198.616" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><text x="530" y="204.617" font-size="15" fill="#FF6B6B" text-anchor="start" font-weight="700">Euler: 2,441</text><line x1="522" y1="151.152" x2="522" y2="198.617" stroke="#B35300" stroke-width="2" stroke-dasharray="3 3"/><text x="510" y="174.857" font-size="13" fill="#B35300" text-anchor="end" font-weight="700">errore</text><text x="197.5" y="475.714" font-size="14" fill="#FF6B6B" text-anchor="middle" font-weight="700">h = 0,25</text><rect x="640" y="100" width="330" height="170" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><text x="805" y="132" font-size="17" fill="#FF6B6B" text-anchor="middle" font-weight="700">Euler (1768)</text><text x="805" y="176" font-size="17" fill="#2B1B3D" text-anchor="middle" font-weight="700">y nuovo = y + h × pendenza</text><text x="805" y="212" font-size="14" fill="#756986" text-anchor="middle">Segui la pendenza di adesso</text><text x="805" y="236" font-size="14" fill="#756986" text-anchor="middle">per un passetto h. Ripeti.</text><rect x="640" y="290" width="330" height="210" rx="12" fill="#E6F0FF"/><text x="805" y="322" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">Runge (1895) · Kutta (1901)</text><text x="805" y="356" font-size="14" fill="#2B1B3D" text-anchor="middle">Misura la pendenza in</text><text x="805" y="382" font-size="14" fill="#2B1B3D" text-anchor="middle">4 punti del passo:</text><text x="805" y="408" font-size="14" fill="#2B1B3D" text-anchor="middle">inizio, metà, metà, fine.</text><text x="805" y="434" font-size="14" fill="#2B1B3D" text-anchor="middle">Media con pesi 1, 2, 2, 1.</text><text x="805" y="460" font-size="14" fill="#2B1B3D" text-anchor="middle">Molto più preciso!</text>
</svg>
