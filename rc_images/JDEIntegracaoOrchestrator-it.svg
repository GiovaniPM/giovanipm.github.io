<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Architettura dell'Orchestrator e dell'AIS Server</title>
<desc id="d">App web e mobile, iPaaS e dispositivi IoT chiamano, via HTTPS, un API gateway consigliato che inoltra all'AIS Server su WebLogic. Al suo interno l'orchestrazione esegue passi in sequenza: regola, form request, data request, business function, script Groovy, connettore e messaggio. I form request passano per l'HTML Server, che parla con l'Enterprise Server tramite JDENET, che accede al database. I connettori chiamano servizi esterni REST, SOAP o database. Riquadro di sicurezza: utente di servizio con privilegi minimi, token AIS o OAuth, HTTPS e orchestrazioni gestite come UDO approvati e promossi.</desc>
