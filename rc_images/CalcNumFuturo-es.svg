<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Hacia dónde va el cálculo numérico</title>
<desc id="d">Seis tendencias: Exaescala: 10¹⁸ operaciones por segundo desde 2022 (Frontier); Precisión a medida: menos cifras donde se puede, más donde importa; IA como calculista: pronósticos del tiempo con IA operativos desde 2025; IA que inventa algoritmos: AlphaTensor (2022), AlphaEvolve (2025); Computación cuántica: promesa para algunos problemas; muchas reservas; Gemelos digitales: copias de la Tierra, del cuerpo y de las fábricas, en tiempo real. Todas convergen en una idea: calcular con confianza, conociendo el tamaño del error.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Hacia dónde va el cálculo numérico</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Seis tendencias para las próximas décadas</text><rect x="40" y="100" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><rect x="40" y="100" width="290" height="46" rx="12" fill="#5B2A86"/><text x="185" y="130" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Exaescala</text><text x="185" y="182" font-size="15" fill="#2B1B3D" text-anchor="middle">10¹⁸ operaciones por segundo</text><text x="185" y="208" font-size="15" fill="#2B1B3D" text-anchor="middle">desde 2022 (Frontier)</text><rect x="355" y="100" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/><rect x="355" y="100" width="290" height="46" rx="12" fill="#3A86FF"/><text x="500" y="130" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Precisión a medida</text><text x="500" y="182" font-size="15" fill="#2B1B3D" text-anchor="middle">menos cifras donde se puede,</text><text x="500" y="208" font-size="15" fill="#2B1B3D" text-anchor="middle">más donde importa</text><rect x="670" y="100" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><rect x="670" y="100" width="290" height="46" rx="12" fill="#2A9D8F"/><text x="815" y="130" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">IA como calculista</text><text x="815" y="182" font-size="15" fill="#2B1B3D" text-anchor="middle">pronósticos del tiempo con IA</text><text x="815" y="208" font-size="15" fill="#2B1B3D" text-anchor="middle">operativos desde 2025</text><rect x="40" y="270" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/><rect x="40" y="270" width="290" height="46" rx="12" fill="#FFF1C9"/><text x="185" y="300" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">IA que inventa algoritmos</text><text x="185" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">AlphaTensor (2022),</text><text x="185" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">AlphaEvolve (2025)</text><rect x="355" y="270" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/><rect x="355" y="270" width="290" height="46" rx="12" fill="#FF6B6B"/><text x="500" y="300" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Computación cuántica</text><text x="500" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">promesa para algunos</text><text x="500" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">problemas; muchas reservas</text><rect x="670" y="270" width="290" height="145" rx="12" fill="#FFFFFF" stroke="#EF476F" stroke-width="2.5"/><rect x="670" y="270" width="290" height="46" rx="12" fill="#EF476F"/><text x="815" y="300" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Gemelos digitales</text><text x="815" y="352" font-size="15" fill="#2B1B3D" text-anchor="middle">copias de la Tierra, del cuerpo</text><text x="815" y="378" font-size="15" fill="#2B1B3D" text-anchor="middle">y de las fábricas, en tiempo real</text><rect x="150" y="460" width="700" height="70" rx="12" fill="#E2F6F2" stroke="#2A9D8F" stroke-width="2.5"/><text x="500" y="490" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700">El hilo conductor de 4.000 años sigue siendo el mismo:</text><text x="500" y="515" font-size="16" fill="#2A9D8F" text-anchor="middle" font-weight="700">calcular con confianza, conociendo el tamaño del error</text>
</svg>
