<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The parts of an API URL</title>
<desc id="d">Two URLs from the sample API. In the first, https is the scheme, api.correios.com.br is the server, /cep/v2/enderecos is the path and 01001001 is the cep path parameter. In the second, what follows the question mark, uf=SP and size=50, are query parameters separated by &amp;.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2B1B3D"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C2185B"/></marker></defs>
<rect width="1000" height="420" rx="18" fill="#FFF7EC"/>
<rect x="40.0" y="70" width="131.2" height="42" rx="6" fill="#E2F6F2"/>
<text x="43.0" y="100" font-size="27" font-weight="700" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" textLength="125.2" lengthAdjust="spacingAndGlyphs">https://</text>
<path d="M43.0 120V128H168.2V120" fill="none" stroke="#756986" stroke-width="2"/>
<text x="105.6" y="152" font-size="15" font-weight="700" fill="#5B2A86" text-anchor="middle">scheme</text>
<rect x="171.2" y="70" width="311.6" height="42" rx="6" fill="#FFF1C9"/>
<text x="174.2" y="100" font-size="27" font-weight="700" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" textLength="305.6" lengthAdjust="spacingAndGlyphs">api.correios.com.br</text>
<path d="M174.2 120V128H479.8V120" fill="none" stroke="#756986" stroke-width="2"/>
<text x="327.0" y="152" font-size="15" font-weight="700" fill="#5B2A86" text-anchor="middle">server (base URL)</text>
<rect x="482.8" y="70" width="295.2" height="42" rx="6" fill="#DCE8FF"/>
<text x="485.8" y="100" font-size="27" font-weight="700" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" textLength="289.2" lengthAdjust="spacingAndGlyphs">/cep/v2/enderecos/</text>
<path d="M485.8 120V128H775.0V120" fill="none" stroke="#756986" stroke-width="2"/>
<text x="630.4" y="152" font-size="15" font-weight="700" fill="#5B2A86" text-anchor="middle">path</text>
<rect x="778.0" y="70" width="131.2" height="42" rx="6" fill="#FCE4F0"/>
<text x="781.0" y="100" font-size="27" font-weight="700" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" textLength="125.2" lengthAdjust="spacingAndGlyphs">01001001</text>
<path d="M781.0 120V128H906.2V120" fill="none" stroke="#756986" stroke-width="2"/>
<text x="843.6" y="152" font-size="15" font-weight="700" fill="#5B2A86" text-anchor="middle">path parameter</text>
<text x="40" y="196" font-size="16" font-weight="400" fill="#756986" text-anchor="start">In the app: Caminho (path) = /cep/v2/enderecos/{cep}</text>
<rect x="40.0" y="260" width="131.2" height="42" rx="6" fill="#E2F6F2"/>
<text x="43.0" y="290" font-size="27" font-weight="700" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" textLength="125.2" lengthAdjust="spacingAndGlyphs">https://</text>
