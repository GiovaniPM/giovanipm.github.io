<title id="t">The 14 diagrams of UML 2.5.1</title>
<desc id="d">Tree with the 14 diagram types. Structure has seven: class, object, package, component, composite structure, deployment and profile. Behavior has seven: use case, activity, state machine and the interaction group, with sequence, communication, timing and interaction overview.</desc>
