<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Função agregada ou analítica?</title>
<desc id="d">À esquerda, sete funcionários de dois departamentos. No meio, a versão agregada, AVG com GROUP BY, reduz tudo a duas linhas: departamento 10 com média 4000 e departamento 20 com média 4333,33. À direita, a versão analítica, AVG OVER PARTITION BY depto, mantém as sete linhas e acrescenta a coluna media_depto com a média do departamento de cada um.</desc>
