<text x="748.0" y="270.0" font-size="12.5" fill="#756986" font-style="italic">one or a few sprints</text>
<path d="M158 292 V320 H174" stroke="#756986" stroke-width="2" fill="none" marker-end="url(#am)"/>
<rect x="172.0" y="304.0" width="600.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<rect x="172" y="304" width="150" height="56" rx="10" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="2.5"/>
