<rect x="216" y="372" width="150" height="56" rx="10" fill="#FFB703" stroke="#FFB703" stroke-width="2.5"/>
<text x="291.0" y="406.0" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Task</text>
<text x="380.0" y="406.0" font-size="13" fill="#2B1B3D">Build the open-seats query in the API</text>
<text x="836.0" y="406.0" font-size="12.5" fill="#756986" font-style="italic">hours</text>
<line x1="980.0" y1="110.0" x2="980.0" y2="420.0" stroke="#B35300" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="962.0" y="265.0" font-size="12" fill="#B35300" text-anchor="middle" font-weight="700" transform="rotate(90 962 265)">smaller and more concrete</text>
<text x="500.0" y="460.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic">A story follows the template “As a [role], I want [action], so that [benefit]” and has acceptance criteria.</text>
