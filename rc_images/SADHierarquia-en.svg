<text x="159.0" y="202.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Epic</text>
<text x="248.0" y="202.0" font-size="13" fill="#2B1B3D">Online enrollment</text>
<text x="704.0" y="202.0" font-size="12.5" fill="#756986" font-style="italic">several sprints</text>
<path d="M114 224 V252 H130" stroke="#756986" stroke-width="2" fill="none" marker-end="url(#am)"/>
