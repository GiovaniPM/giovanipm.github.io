<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">From theme to task: the agile requirements hierarchy</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Each level breaks the one above into smaller, more concrete parts</text>
<rect x="40.0" y="100.0" width="600.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<rect x="40" y="100" width="150" height="56" rx="10" fill="#5B2A86" stroke="#5B2A86" stroke-width="2.5"/>
<text x="115.0" y="134.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Theme</text>
<text x="204.0" y="134.0" font-size="13" fill="#2B1B3D">Student self-service</text>
<text x="660.0" y="134.0" font-size="12.5" fill="#756986" font-style="italic">business goal</text>
<path d="M70 156 V184 H86" stroke="#756986" stroke-width="2" fill="none" marker-end="url(#am)"/>
