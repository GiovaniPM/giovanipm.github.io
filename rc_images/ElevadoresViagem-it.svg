<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
<title id="t">Il viaggio di andata e ritorno nella punta di salita</title>
<desc id="d">Una cabina carica P passeggeri al piano principale, sale fermandosi in S piani fino al piano di inversione H e scende senza fermate al piano principale. Il tempo di andata e ritorno somma la corsa di 2 volte H, le S + 1 fermate e la salita e discesa dei 2 P passeggeri. Diviso per il numero di cabine L dà l’intervallo; e 300 per P per L diviso per il tempo di andata e ritorno dà quante persone il gruppo trasporta in 5 minuti.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="50" y="30" width="200" height="320" fill="#E9E3DA" stroke="#9C9387" stroke-width="2"/><line x1="50" y1="330.0" x2="250" y2="330.0" stroke="#B9B1A6"/><line x1="50" y1="301.0" x2="250" y2="301.0" stroke="#B9B1A6"/><line x1="50" y1="272.0" x2="250" y2="272.0" stroke="#B9B1A6"/><line x1="50" y1="243.0" x2="250" y2="243.0" stroke="#B9B1A6"/><line x1="50" y1="214.0" x2="250" y2="214.0" stroke="#B9B1A6"/><line x1="50" y1="185.0" x2="250" y2="185.0" stroke="#B9B1A6"/><line x1="50" y1="156.0" x2="250" y2="156.0" stroke="#B9B1A6"/><line x1="50" y1="127.0" x2="250" y2="127.0" stroke="#B9B1A6"/><line x1="50" y1="98.0" x2="250" y2="98.0" stroke="#B9B1A6"/><line x1="50" y1="69.0" x2="250" y2="69.0" stroke="#B9B1A6"/><line x1="50" y1="40.0" x2="250" y2="40.0" stroke="#B9B1A6"/><rect x="90" y="304" width="34" height="26" rx="4" fill="#0E8074"/><path d="M150 316 L150 258.0 l12 0 l-12 0 L150 200.0 l12 0 l-12 0 L150 171.0 l12 0 l-12 0 L150 113.0 l12 0 l-12 0 L150 84.0 l12 0 l-12 0" fill="none" stroke="#3A86FF" stroke-width="3" marker-end="url(#a)"/><path d="M200 84.0 V316" fill="none" stroke="#C2185B" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/><circle cx="150" cy="258.0" r="5" fill="#FFB703" stroke="#2B1B3D"/><circle cx="150" cy="200.0" r="5" fill="#FFB703" stroke="#2B1B3D"/><circle cx="150" cy="171.0" r="5" fill="#FFB703" stroke="#2B1B3D"/><circle cx="150" cy="113.0" r="5" fill="#FFB703" stroke="#2B1B3D"/><circle cx="150" cy="84.0" r="5" fill="#FFB703" stroke="#2B1B3D"/><text x="265" y="322" font-size="14" font-weight="bold" text-anchor="start" fill="#2B1B3D">← Piano principale: salgono P passeggeri</text><text x="265" y="175.0" font-size="14" font-weight="bold" text-anchor="start" fill="#B35300">← S fermate probabili</text><text x="265" y="88.0" font-size="14" font-weight="bold" text-anchor="start" fill="#5B2A86">← H: piano di inversione</text><text x="208" y="207.0" font-size="13" font-weight="normal" text-anchor="start" fill="#C2185B">discesa diretta</text><rect x="500" y="70" width="470" height="230" rx="14" fill="#FFF1C9" stroke="#FFB703"/><text x="520" y="112" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">Tempo di andata e ritorno = 2·H·tv + (S + 1)·ts + 2·P·tp</text><text x="520" y="152" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">Intervallo = tempo di andata e ritorno ÷ L cabine</text><text x="520" y="192" font-size="15" font-weight="bold" text-anchor="start" fill="#2B1B3D">Capacità in 5 min = 300 · P · L ÷ tempo di andata e ritorno</text><text x="520" y="226" font-size="12" font-weight="normal" text-anchor="start" fill="#756986">tv: tempo per passare un piano</text><text x="520" y="242" font-size="12" font-weight="normal" text-anchor="start" fill="#756986">ts: tempo di ogni fermata</text><text x="520" y="258" font-size="12" font-weight="normal" text-anchor="start" fill="#756986">tp: tempo d’imbarco per persona</text>
</g></svg>
