<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The four challenges: where each one stands</title>
<desc id="d">Matrix with the four challenges as rows and three columns: already real, being built and ruled out by physics. Practical quantum computing: error correction below threshold with Willow in 2024; a fault-tolerant machine planned by IBM for 2029. Omniscient AI: AI that beats humans at specific tasks; general AI with forecasts between 2029 and 2047; omniscience ruled out by the limits of Gödel and Turing. Teleportation: of quantum states since 1997 and via satellite in 2017; of people breaks no law of physics but is far off; copying without destroying the original is forbidden by no-cloning. Entanglement communication: quantum key distribution with the Micius satellite; a global quantum internet being built; faster-than-light messages ruled out by the no-communication theorem.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><linearGradient id="gd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E23B3B"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#2A9D8F"/></linearGradient></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">The four challenges: where each one stands</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">What already exists, what is being built and what physics rules out</text>
<rect x="285" y="96" width="210" height="34" rx="10" fill="#2A9D8F"/>
<text x="390" y="118" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Already real</text>
<rect x="510" y="96" width="210" height="34" rx="10" fill="#FFB703"/>
<text x="615" y="118" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">Being built</text>
<rect x="735" y="96" width="210" height="34" rx="10" fill="#E23B3B"/>
<text x="840" y="118" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Ruled out by physics</text>
<rect x="50" y="142" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="182" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Practical quantum</text>
<text x="160" y="202" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">computing</text>
<rect x="285" y="142" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">Error correction below</text>
<text x="390" y="201" font-size="13" fill="#2B1B3D" text-anchor="middle">threshold (Willow, 2024)</text>
<rect x="510" y="142" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="182" font-size="13" fill="#2B1B3D" text-anchor="middle">Fault-tolerant machine</text>
<text x="615" y="201" font-size="13" fill="#2B1B3D" text-anchor="middle">(IBM roadmap: 2029)</text>
<rect x="735" y="142" width="210" height="88" rx="12" fill="none" stroke="#D9C9B4" stroke-width="2" stroke-dasharray="5 5"/>
<text x="840" y="192" font-size="18" fill="#756986" text-anchor="middle">—</text>
<rect x="50" y="242" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="292" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Omniscient AI</text>
<rect x="285" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">AI that beats humans</text>
<text x="390" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">at specific tasks</text>
<rect x="510" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">General AI: forecasts</text>
<text x="615" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">between 2029 and 2047</text>
<rect x="735" y="242" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="282" font-size="13" fill="#2B1B3D" text-anchor="middle">Omniscience: limits</text>
<text x="840" y="301" font-size="13" fill="#2B1B3D" text-anchor="middle">of Gödel and Turing</text>
<rect x="50" y="342" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="392" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Teleportation</text>
<rect x="285" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">Of quantum states</text>
<text x="390" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">(1997; satellite, 2017)</text>
<rect x="510" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">Of people: breaks no law</text>
<text x="615" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">of physics, but far off</text>
<rect x="735" y="342" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="382" font-size="13" fill="#2B1B3D" text-anchor="middle">Copying without destroying</text>
<text x="840" y="401" font-size="13" fill="#2B1B3D" text-anchor="middle">the original (no-cloning)</text>
<rect x="50" y="442" width="220" height="88" rx="12" fill="#2B1B3D"/>
<text x="160" y="482" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Entanglement</text>
<text x="160" y="502" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">communication</text>
<rect x="285" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<text x="390" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Quantum key</text>
<text x="390" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">distribution (Micius)</text>
<rect x="510" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<text x="615" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Quantum internet</text>
<text x="615" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">at global scale</text>
<rect x="735" y="442" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<text x="840" y="482" font-size="13" fill="#2B1B3D" text-anchor="middle">Faster-than-light</text>
<text x="840" y="501" font-size="13" fill="#2B1B3D" text-anchor="middle">messages (no-signaling)</text>
</svg>
