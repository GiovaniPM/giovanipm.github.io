<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Gráfico de Pareto: os poucos vitais</title>
<desc id="d">Gráfico de barras ordenadas com os motivos de 100 entregas atrasadas: trânsito 42, cozinha atrasou 23, endereço incompleto 15, falta de entregador 9, pagamento na entrega 6 e outros 5. Uma linha mostra o percentual acumulado, que chega a 80% nas três primeiras causas, marcadas como poucos vitais.</desc>
