<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">A história do GTD</title>
<desc id="d">Linha do tempo do GTD: nos anos 1980 e 1990, David Allen desenvolve o método em consultorias; em 2001, lança o livro Getting Things Done; em 2007, Merlin Mann populariza o Inbox Zero; em 2008, Heylighen e Vidal explicam o GTD pela ciência cognitiva; em 2011, Masicampo e Baumeister mostram que fazer um plano acalma a mente; em 2015, sai a edição revisada com os cinco passos; nos anos 2020, assistentes de inteligência artificial entram no fluxo.</desc>
<rect width="1000" height="380" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="50.0" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">A história do GTD</text>
<path d="M50 220 H950" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"/>
<circle cx="90.0" cy="220" r="10" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/>
<path d="M90.0 208.0 L90.0 168.0" stroke="#5B2A86" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="90.0" y="100.0" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="middle">Anos 1980–90</text>
<text x="90.0" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Allen desenvolve o</text><text x="90.0" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">método em consultorias</text>
<circle cx="226.7" cy="220" r="10" fill="#2F6FE0" stroke="#FFF7EC" stroke-width="3"/>
<path d="M226.7 232.0 L226.7 272.0" stroke="#2F6FE0" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="226.7" y="300.0" font-size="17" font-weight="700" fill="#2F6FE0" text-anchor="middle">2001</text>
<text x="226.7" y="324.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Lançamento do livro</text><text x="226.7" y="341.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Getting Things Done</text>
<circle cx="363.4" cy="220" r="10" fill="#0E8074" stroke="#FFF7EC" stroke-width="3"/>
<path d="M363.4 208.0 L363.4 168.0" stroke="#0E8074" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="363.4" y="100.0" font-size="17" font-weight="700" fill="#0E8074" text-anchor="middle">2007</text>
<text x="363.4" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Merlin Mann</text><text x="363.4" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">populariza o Inbox Zero</text>
<circle cx="500.1" cy="220" r="10" fill="#B35300" stroke="#FFF7EC" stroke-width="3"/>
<path d="M500.1 232.0 L500.1 272.0" stroke="#B35300" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="500.1" y="300.0" font-size="17" font-weight="700" fill="#B35300" text-anchor="middle">2008</text>
<text x="500.1" y="324.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Heylighen e Vidal explicam</text><text x="500.1" y="341.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">o GTD pela ciência cognitiva</text>
<circle cx="636.8" cy="220" r="10" fill="#C2185B" stroke="#FFF7EC" stroke-width="3"/>
<path d="M636.8 208.0 L636.8 168.0" stroke="#C2185B" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="636.8" y="100.0" font-size="17" font-weight="700" fill="#C2185B" text-anchor="middle">2011</text>
<text x="636.8" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Masicampo e Baumeister:</text><text x="636.8" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">planejar acalma a mente</text>
<circle cx="773.5" cy="220" r="10" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/>
<path d="M773.5 232.0 L773.5 272.0" stroke="#5B2A86" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="773.5" y="300.0" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="middle">2015</text>
<text x="773.5" y="324.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Edição revisada, com</text><text x="773.5" y="341.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">os cinco passos</text>
<circle cx="910.2" cy="220" r="10" fill="#0E8074" stroke="#FFF7EC" stroke-width="3"/>
<path d="M910.2 208.0 L910.2 168.0" stroke="#0E8074" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="910.2" y="100.0" font-size="17" font-weight="700" fill="#0E8074" text-anchor="middle">Anos 2020</text>
<text x="910.2" y="124.0" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">Assistentes de IA</text><text x="910.2" y="141.6" font-size="13.5" font-weight="400" fill="#3E3350" text-anchor="middle">entram no fluxo</text>
</svg>
