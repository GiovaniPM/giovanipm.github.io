<text x="96.0" y="914.0" font-size="14" fill="#B35300" text-anchor="middle">en la base de datos</text>
<path d="M824,870 L972,870 L984,882 L984,930 L824,930 Z" fill="#FFF1C9" stroke="#B35300" stroke-width="1.5"/>
<path d="M972,870 L972,882 L984,882" fill="none" stroke="#B35300" stroke-width="1.5"/>
<line x1="810" y1="900" x2="824" y2="900" stroke="#B35300" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="904.0" y="895.8" font-size="14" fill="#B35300" text-anchor="middle">y lo guarda</text>
