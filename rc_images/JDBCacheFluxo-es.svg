<text x="500" y="775.8" font-size="15" fill="#2B1B3D" text-anchor="middle">¿El registro</text>
<text x="500" y="795.2" font-size="15" fill="#2B1B3D" text-anchor="middle">ya está</text>
<text x="500" y="814.8" font-size="15" fill="#2B1B3D" text-anchor="middle">en la caché?</text>
<text x="362" y="781" font-size="14" fill="#756986" font-style="italic" text-anchor="end">sí</text>
<polyline points="370,790 300,790 300,868" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="638" y="781" font-size="14" fill="#756986" font-style="italic" text-anchor="start">no</text>
<polyline points="630,790 700,790 700,868" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="190" y="870" width="220" height="60" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="300.0" y="895.5" font-size="15" fill="#2B1B3D" text-anchor="middle">Cache HIT - obtiene</text>
<text x="300.0" y="915.0" font-size="15" fill="#2B1B3D" text-anchor="middle">de la caché</text>
<rect x="590" y="870" width="220" height="60" rx="12" fill="#FFE3E3" stroke="#E23B3B" stroke-width="2"/>
<text x="700.0" y="895.5" font-size="15" fill="#2B1B3D" text-anchor="middle">Cache MISS - obtiene</text>
<text x="700.0" y="915.0" font-size="15" fill="#2B1B3D" text-anchor="middle">de la tabla</text>
