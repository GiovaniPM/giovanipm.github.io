<text x="500.0" y="660.0" font-size="15" fill="#2B1B3D" text-anchor="middle">tabla</text>
<polyline points="500,675 500,685" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
