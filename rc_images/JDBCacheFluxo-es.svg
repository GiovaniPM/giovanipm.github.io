<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" role="img" aria-labelledby="t d" lang="es" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Cómo funciona la JDB cache</title>
<desc id="d">Flujo de actividades. Inicio. ¿La tabla está configurada en F98613? Si no: ¿JDB_addTableToDBCache() agregó la tabla? Si no: obtiene de la tabla. Después: ¿se usa la clave primaria completa? Si no: obtiene de la tabla. Después: ¿el registro ya está en la caché? Si sí: cache HIT, obtiene de la caché, ninguna operación en la base de datos. Si no: cache MISS, obtiene de la tabla y lo guarda en la caché. Fin.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker></defs>
