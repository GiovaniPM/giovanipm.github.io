<text x="658" y="106" font-size="14" fill="#756986" font-style="italic" text-anchor="start">sí</text>
<polyline points="650,115 880,115 880,450 515,450" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="510" y="164" font-size="14" fill="#756986" font-style="italic" text-anchor="start">no</text>
<polyline points="500,147 500,171" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polygon points="356.0,173.0 644.0,173.0 660.0,215 644.0,257.0 356.0,257.0 340.0,215" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="500" y="210.5" font-size="15" fill="#2B1B3D" text-anchor="middle">JDB_addTableToDBCache()</text>
<text x="500" y="230.0" font-size="15" fill="#2B1B3D" text-anchor="middle">¿agregó la tabla?</text>
<text x="668" y="206" font-size="14" fill="#756986" font-style="italic" text-anchor="start">sí</text>
<polyline points="660,215 800,215 800,395 515,395" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<text x="510" y="276" font-size="14" fill="#756986" font-style="italic" text-anchor="start">no</text>
<polyline points="500,257 500,288" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<rect x="400" y="290" width="200" height="60" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="500.0" y="315.5" font-size="15" fill="#2B1B3D" text-anchor="middle">Obtiene de la</text>
<text x="500.0" y="335.0" font-size="15" fill="#2B1B3D" text-anchor="middle">tabla</text>
<polyline points="500,350 500,380" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/>
<polygon points="500,382 513,395 500,408 487,395" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
