<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Dove inizia e finisce ogni metrica di tempo</title>
<desc id="d">Board Kanban con dieci colonne: richieste, backlog, analisi e da fare, nell’upstream; sviluppo, in attesa, test, collaudo e deploy, in corso, con limite di WIP di 6; e fatto. Sopra, dei righelli mostrano la pianificazione, dall’inizio alla colonna da fare; il lead time, dal punto di impegno al punto di consegna; il cycle time, dall’inizio dello sviluppo alla consegna; il time to market, da un capo all’altro; e il tempo bloccato, nella colonna in attesa, dove c’è una scheda bloccata.</desc>
