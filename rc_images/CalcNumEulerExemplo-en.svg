<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Smaller steps, better methods</title>
<desc id="d">Table for y’ = y, from x = 0 to x = 1, whose exact answer is e = 2.71828. Euler with step 0.5, 2 steps: 2.25, 17.2% error. Step 0.25, 4 steps: 2.44141, 10.2% error. Step 0.1, 10 steps: 2.59374, 4.6% error. Step 0.01, 100 steps: 2.70481, 0.50% error. Fourth-order Runge-Kutta with step 0.5, 2 steps: 2.71735, 0.034% error. With step 0.25, 4 steps: 2.71821, 0.0027% error. With 4 steps, Runge-Kutta beats Euler with 100.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Smaller steps, better methods</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Computing e = 2.71828… with y’ = y</text><rect x="40" y="100" width="620" height="46" rx="8" fill="#FFF1C9"/><text x="110" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">method</text><text x="230" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">step h</text><text x="350" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">no. of steps</text><text x="480" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">result</text><text x="610" y="130" font-size="15" fill="#2B1B3D" text-anchor="middle" font-weight="700">error</text><text x="110" y="180" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">Euler</text><text x="230" y="180" font-size="16" fill="#2B1B3D" text-anchor="middle">0.5</text><text x="350" y="180" font-size="16" fill="#2B1B3D" text-anchor="middle">2</text><text x="480" y="180" font-size="16" fill="#2B1B3D" text-anchor="middle">2.25000</text><text x="610" y="180" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">17.2%</text><line x1="40" y1="196" x2="660" y2="196" stroke="#F1E2CF" stroke-width="1.5"/><rect x="680" y="164" width="280" height="20" rx="4" fill="#FF6B6B"/><text x="110" y="226" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">Euler</text><text x="230" y="226" font-size="16" fill="#2B1B3D" text-anchor="middle">0.25</text><text x="350" y="226" font-size="16" fill="#2B1B3D" text-anchor="middle">4</text><text x="480" y="226" font-size="16" fill="#2B1B3D" text-anchor="middle">2.44141</text><text x="610" y="226" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">10.2%</text><line x1="40" y1="242" x2="660" y2="242" stroke="#F1E2CF" stroke-width="1.5"/><rect x="680" y="210" width="166.047" height="20" rx="4" fill="#FF6B6B"/><text x="110" y="272" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">Euler</text><text x="230" y="272" font-size="16" fill="#2B1B3D" text-anchor="middle">0.1</text><text x="350" y="272" font-size="16" fill="#2B1B3D" text-anchor="middle">10</text><text x="480" y="272" font-size="16" fill="#2B1B3D" text-anchor="middle">2.59374</text><text x="610" y="272" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">4.6%</text><line x1="40" y1="288" x2="660" y2="288" stroke="#F1E2CF" stroke-width="1.5"/><rect x="680" y="256" width="74.8837" height="20" rx="4" fill="#FF6B6B"/><text x="110" y="318" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">Euler</text><text x="230" y="318" font-size="16" fill="#2B1B3D" text-anchor="middle">0.01</text><text x="350" y="318" font-size="16" fill="#2B1B3D" text-anchor="middle">100</text><text x="480" y="318" font-size="16" fill="#2B1B3D" text-anchor="middle">2.70481</text><text x="610" y="318" font-size="16" fill="#FF6B6B" text-anchor="middle" font-weight="700">0.50%</text><line x1="40" y1="334" x2="660" y2="334" stroke="#F1E2CF" stroke-width="1.5"/><rect x="680" y="302" width="8.13953" height="20" rx="4" fill="#FF6B6B"/><text x="110" y="364" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">RK4</text><text x="230" y="364" font-size="16" fill="#2B1B3D" text-anchor="middle">0.5</text><text x="350" y="364" font-size="16" fill="#2B1B3D" text-anchor="middle">2</text><text x="480" y="364" font-size="16" fill="#2B1B3D" text-anchor="middle">2.71735</text><text x="610" y="364" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">0.034%</text><line x1="40" y1="380" x2="660" y2="380" stroke="#F1E2CF" stroke-width="1.5"/><rect x="680" y="348" width="2" height="20" rx="4" fill="#3A86FF"/><text x="110" y="410" font-size="16" fill="#3A86FF" text-anchor="middle" font-weight="700">RK4</text><text x="230" 