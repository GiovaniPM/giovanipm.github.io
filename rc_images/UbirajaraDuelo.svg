<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-labelledby="t d">
<title id="t">Como ler um duelo</title>
<desc id="d">Dois padrões de ataque, com os tempos do código do jogo. Tacape, de Pojucã no primeiro duelo e de Cori: ele se aproxima, ergue a arma por 0,5 segundo (Cori 0,75), golpeia, e fica 0,8 segundo se recompondo: essa é a janela para golpear; o escudo erguido de frente apara o golpe, e Cori aparado vacila 1,6 segundo. Bote, de Pojucã com a lança e de Agniná: ele se prepara por 0,7 segundo, investe em linha reta; se o bote bate no escudo de frente, ele vacila 1,6 segundo, a melhor janela; se erra, fica 0,9 segundo se recompondo. Um anel amarelo no chão marca a preparação.</desc>
<rect width="1000" height="390" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="40" y="50.0" font-size="16" fill="#5B2A86" text-anchor="start" font-weight="bold">Tacape · Pojucã I e Cori</text><rect x="40.0" y="64" width="196.4" height="74" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="138.22222222222223" y="94.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">aproxima-se</text><line x1="237.4" y1="101" x2="243.4" y2="101" stroke="#756986" stroke-width="2"/><rect x="244.4" y="64" width="183.7" height="74" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="336.27777777777777" y="94.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">ergue a arma</text><text x="336.27777777777777" y="118.0" font-size="13" fill="#756986" text-anchor="middle">0,5 s (Cori 0,75 s)</text><line x1="429.1" y1="101" x2="435.1" y2="101" stroke="#756986" stroke-width="2"/><rect x="436.1" y="64" width="234.8" height="74" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="2"/><text x="553.5" y="94.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">golpe</text><text x="553.5" y="118.0" font-size="13" fill="#756986" text-anchor="middle">escudo de frente apara</text><line x1="671.9" y1="101" x2="677.9" y2="101" stroke="#756986" stroke-width="2"/><rect x="678.9" y="64" width="273.1" height="74" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="815.4444444444445" y="94.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">recompõe-se 0,8 s</text><text x="815.4444444444445" y="118.0" font-size="13" fill="#0E8074" text-anchor="middle" font-weight="bold">GOLPEIE AGORA</text><text x="40" y="200.0" font-size="16" fill="#5B2A86" text-anchor="start" font-weight="bold">Bote · Pojucã II e Agniná</text><rect x="40.0" y="214" width="178.3" height="74" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="129.1645569620253" y="244.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">espera 1,1 s</text><line x1="219.3" y1="251" x2="225.3" y2="251" stroke="#756986" stroke-width="2"/><rect x="226.3" y="214" width="178.3" height="74" rx="12" fill="#FFF1C9" stroke="#B35300" stroke-width="2"/><text x="315.49367088607596" y="244.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">prepara 0,7 s</text><text x="315.49367088607596" y="268.0" font-size="13" fill="#756986" text-anchor="middle">anel amarelo</text><line x1="405.7" y1="251" x2="411.7" y2="251" stroke="#756986" stroke-width="2"/><rect x="412.7" y="214" width="213.3" height="74" rx="12" fill="#FDEAF1" stroke="#C2185B" stroke-width="2"/><text x="519.2911392405064" y="244.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">bote em linha</text><text x="519.2911392405064" y="268.0" font-size="13" fill="#756986" text-anchor="middle">escudo de frente</text><line x1="626.9" y1="251" x2="632.9" y2="251" stroke="#756986" stroke-width="2"/><rect x="633.9" y="214" width="318.1" height="74" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="792.9620253164558" y="244.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle" font-weight="bold">aparado: vacila 1,6 s</text><text x="792.9620253164558" y="268.0" font-size="13" fill="#0E8074" text-anchor="middle" font-weight="bold">GOLPEIE AGORA</text><circle cx="62" cy="355" r="15" fill="none" stroke="#E0B400" stroke-width="4"/><text x="92" y="360.0" font-size="14" fill="#2B1B3D" text-anchor="start">Anel amarelo no chão = ele vai atacar. Vire-se para ele e segure o escudo (L ou Shift).</text></g>
</svg>
