<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">Anatomía de un elemento y de una relación en C4</title>
<desc id="d">API de Reservas [Contenedor: Java / Spring Boot] → Lee y escribe [SQL/TCP] → Base de Datos [Contenedor: PostgreSQL]. 1: Nombre del elemento. 2: Tipo y, en contenedores y componentes, la tecnología. 3: Descripción breve de las responsabilidades. 4: Etiqueta con verbo, en el sentido de la flecha (evita “Usa”). 5: Tecnología o protocolo de la relación. Todo diagrama también tiene título (tipo y alcance) y leyenda.</desc>
