<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Newton’s method: sliding down the tangent</title>
<desc id="d">Graph of the curve f(x) = x³ − 2x − 5 between x = 1.6 and x = 2.7. Starting from x₀ = 2.6, draw the line tangent to the curve at that point; where it crosses the horizontal axis lies x₁ = 2.196. Repeating with the tangent at x₁ gives x₂ = 2.100, already very close to the true root, 2.0946. On the right, the formula: new x = x − f(x) ÷ f’(x), where f’(x) is the slope of the curve.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Newton’s method: sliding down the tangent</text><text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Swap the hard curve for an easy line, again and again</text><line x1="70" y1="396.296" x2="640" y2="396.296" stroke="#2B1B3D" stroke-width="2" marker-end="url(#ar)"/><text x="638" y="420.296" font-size="16" fill="#2B1B3D" text-anchor="end" font-weight="700">x</text><line x1="167.391" y1="391.296" x2="167.391" y2="401.296" stroke="#2B1B3D" stroke-width="1.5"/><text x="167.391" y="418.296" font-size="12" fill="#756986" text-anchor="middle">1.8</text><line x1="264.783" y1="391.296" x2="264.783" y2="401.296" stroke="#2B1B3D" stroke-width="1.5"/><text x="264.783" y="418.296" font-size="12" fill="#756986" text-anchor="middle">2.0</text><line x1="362.174" y1="391.296" x2="362.174" y2="401.296" stroke="#2B1B3D" stroke-width="1.5"/><text x="362.174" y="418.296" font-size="12" fill="#756986" text-anchor="middle">2.2</text><line x1="459.565" y1="391.296" x2="459.565" y2="401.296" stroke="#2B1B3D" stroke-width="1.5"/><text x="459.565" y="418.296" font-size="12" fill="#756986" text-anchor="middle">2.4</text><line x1="556.957" y1="391.296" x2="556.957" y2="401.296" stroke="#2B1B3D" stroke-width="1.5"/><text x="556.957" y="418.296" font-size="12" fill="#756986" text-anchor="middle">2.6</text><polyline points="70.0,517.9 77.0,515.4 84.0,512.9 91.0,510.4 98.0,507.7 105.0,505.1 112.0,502.3 119.0,499.5 126.0,496.6 133.0,493.7 140.0,490.7 147.0,487.6 154.0,484.5 161.0,481.3 168.0,478.0 175.0,474.7 182.0,471.3 189.0,467.8 196.0,464.3 203.0,460.7 210.0,457.1 217.0,453.3 224.0,449.5 231.0,445.6 238.0,441.7 245.0,437.7 252.0,433.6 259.0,429.4 266.0,425.2 273.0,420.9 280.0,416.5 287.0,412.0 294.0,407.5 301.0,402.9 308.0,398.2 315.0,393.4 322.0,388.6 329.0,383.7 336.0,378.7 343.0,373.6 350.0,368.5 357.0,363.2 364.0,357.9 371.0,352.5 378.0,347.1 385.0,341.5 392.0,335.9 399.0,330.1 406.0,324.3 413.0,318.4 420.0,312.5 427.0,306.4 434.0,300.3 441.0,294.0 448.0,287.7 455.0,281.3 462.0,274.8 469.0,268.2 476.0,261.5 483.0,254.8 490.0,247.9 497.0,241.0 504.0,234.0 511.0,226.8 518.0,219.6 525.0,212.3 532.0,204.9 539.0,197.4 546.0,189.8 553.0,182.1 560.0,174.4 567.0,166.5 574.0,158.5 581.0,150.4 588.0,142.3 595.0,134.0 602.0,125.6 609.0,117.2 616.0,108.6 623.0,100.0 630.0,91.2" fill="none" stroke="#5B2A86" stroke-width="3" stroke-linejoin="round"/><line x1="556.957" y1="177.748" x2="556.957" y2="396.296" stroke="#756986" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="595.913" y1="134.418" x2="345.86" y2="412.545" stroke="#FF6B6B" stroke-width="2.5"/><circle cx="556.957" cy="177.748" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="360.469" cy="396.296" r="6" fill="#FF6B6B" stroke="#2B1B3D" stroke-width="1.5"/><text x="360.469" y="440.296" font-size="14" fill="#FF6B6B" text-anchor="middle" font-weight="700">x₁ = 2.196</text><line x1="360.469" y1="360.615" x2="360.469" y2="396.296" stroke="#756986" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="399.426" y1="331.047" x2="298.849" y2="407.384" stroke="#3A86FF" stroke-width="2.5"/><circle cx="360.469" cy="360.615" r="6" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1.5"/><circle cx="313.457" cy="396.296" r="6" fill="#3A86FF" stroke="#2B1B3D" stroke-width="1.5"/><text x="305.457" y="382.296" font-size="14" fill="#3A86FF" text-anchor="end" font-weight="700">x₂ = 2.100</text><text x="564.957" y="440.296" font-size="14" fill="#FF6B6B" text-anchor="middle" font-weight="700">x₀ = 2.6</text><circle cx="310.825" cy="396.296" r="5" fill="#FFB703" stroke="#2B1B3D" stroke-width="1.5"/><text x="167.391" y="262.963" font-size="16" fill="#5B2A86" text-anchor="middle" font-weight="700">f(x) = x³ − 2x − 5</text><rect x="670" y="110" width="300" height="170" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="820" y="142" font-size="17" fill="#5B2A86" text-anchor="middle" font-weight="700">The formula</text><text x="820" y="186" font-size="18" fill="#2B1B3D" text-anchor="middle" font-weight="700">new x = x − f(x) ÷ f’(x)</text><text x="820" y="222" font-size="14" fill="#756986" text-anchor="middle">f(x): height of the curve</text><text x="820" y="246" font-size="14" fill="#756986" text-anchor="middle">f’(x): slope (the derivative)</text><rect x="670" y="300" width="300" height="200" rx="12" fill="#FFF1C9"/><text x="820" y="330" font-size="17" fill="#B35300" text-anchor="middle" font-weight="700">Why does it work?</text><text x="820" y="362" font-size="14" fill="#2B1B3D" text-anchor="middle">Up close, every smooth</text><text x="820" y="388" font-size="14" fill="#2B1B3D" text-anchor="middle">curve looks like a line.</text><text x="820" y="414" font-size="14" fill="#2B1B3D" text-anchor="middle">Finding where a line hits</text><text x="820" y="440" font-size="14" fill="#2B1B3D" text-anchor="middle">zero is easy: one division.</text>
</svg>
