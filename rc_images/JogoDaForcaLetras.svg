<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" width="1000" height="442" role="img" aria-labelledby="t d">
<title id="t">Letras mais frequentes nas 3000 palavras em português</title>
<desc id="d">Porcentagem de cada letra no total de letras das 3000 palavras em português do jogo, sem acentos, e porcentagem das palavras que têm a letra pelo menos uma vez: A 15,9% e 87%; O 10,2% e 71%; I 9,8% e 71%; E 9,3% e 65%; R 7,9% e 61%; N 5,9% e 49%; C 5,9% e 47%; T 5,6% e 47%; D 4,0% e 30%; M 3,8% e 34%; S 3,7% e 31%; L 3,7% e 34%.</desc>
