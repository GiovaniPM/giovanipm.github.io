<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
<title id="t">Os três tipos de dependência do Gestor de Projeto</title>
<desc id="d">Três exemplos. Término para Início, TI ou FS: a sucessora só começa depois que a predecessora termina. Início para Início, II ou SS: a sucessora só começa depois que a predecessora começa; com defasagem de 3 dias, começa 3 dias depois. Término para Término, TT ou FF: a sucessora só termina depois que a predecessora termina. A defasagem em dias empurra a regra para frente; um valor negativo antecipa.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B1B3D"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#FFF7EC"/>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<text x="30" y="52" font-size="18" font-weight="bold" text-anchor="start" fill="#2B1B3D">Término → Início (TI / FS)</text><text x="30" y="74" font-size="14" font-weight="normal" text-anchor="start" fill="#756986">só começa depois que a predecessora termina</text><rect x="830" y="36" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#F1E2CF"/><text x="900" y="57" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E8074">2TI</text><rect x="60" y="94" width="300" height="28" rx="6" fill="#2f9e44"/><text x="72" y="113" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Predecessora #2</text><rect x="400" y="138" width="260" height="28" rx="6" fill="#4dabf7"/><text x="412" y="157" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Sucessora</text><path d="M360 108 H380 V152 H398" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><text x="30" y="202" font-size="18" font-weight="bold" text-anchor="start" fill="#2B1B3D">Início → Início (II / SS)</text><text x="30" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#756986">só começa depois que a predecessora começa (+3 dias)</text><rect x="830" y="186" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#F1E2CF"/><text x="900" y="207" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E8074">2II+3</text><rect x="60" y="244" width="300" height="28" rx="6" fill="#2f9e44"/><text x="72" y="263" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Predecessora #2</text><rect x="150" y="288" width="300" height="28" rx="6" fill="#4dabf7"/><text x="162" y="307" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Sucessora</text><path d="M60 272 V280 H148 V287" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><text x="104" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#C2185B">+3 dias</text><text x="30" y="352" font-size="18" font-weight="bold" text-anchor="start" fill="#2B1B3D">Término → Término (TT / FF)</text><text x="30" y="374" font-size="14" font-weight="normal" text-anchor="start" fill="#756986">só termina depois que a predecessora termina</text><rect x="830" y="336" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#F1E2CF"/><text x="900" y="357" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E8074">2TT</text><rect x="60" y="394" width="300" height="28" rx="6" fill="#2f9e44"/><text x="72" y="413" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Predecessora #2</text><rect x="200" y="438" width="200" height="28" rx="6" fill="#4dabf7"/><text x="212" y="457" font-size="14" font-weight="bold" text-anchor="start" fill="#FFFFFF">Sucessora</text><path d="M360 422 V430 H400 V437" fill="none" stroke="#2B1B3D" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="478" width="960" height="40" rx="10" fill="#FFF1C9"/><text x="500" y="504" font-size="14" font-weight="normal" text-anchor="middle" fill="#2B1B3D">Na importação: número da linha + tipo + defasagem, ex.: 2TI+1 · 4II · 5TT-1</text>
</g></svg>
