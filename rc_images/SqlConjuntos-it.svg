<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 698" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">UNION, INTERSECT ed EXCEPT</title>
<desc id="d">Diagramma di Venn con vendite2005 a sinistra, con João 1000 e Roberto 5000, vendite2006 a destra, con João 2000 e Isaque 35000, e Alex 2000 nell’intersezione. Sotto, quattro risultati: UNION con 5 righe, UNION ALL con 6, perché Alex 2000 compare due volte, INTERSECT con 1, Alex 2000, ed EXCEPT o MINUS con 2, João 1000 e Roberto 5000.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker></defs>
<rect width="1000" height="698" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">UNION, INTERSECT ed EXCEPT</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Gli operatori insiemistici confrontano righe intere di due query</text>
<circle cx="330" cy="230" r="120" fill="#EFE3FA" fill-opacity="0.8" stroke="#5B2A86" stroke-width="2.5"/><circle cx="490" cy="230" r="120" fill="#E1ECFF" fill-opacity="0.8" stroke="#3A86FF" stroke-width="2.5"/>
<defs><clipPath id="ca"><circle cx="330" cy="230" r="120"/></clipPath></defs><circle cx="490" cy="230" r="120" fill="#FFB703" clip-path="url(#ca)"/>
<text x="290.0" y="98.0" font-size="15" fill="#5B2A86" text-anchor="middle" font-weight="700" xml:space="preserve">vendite2005</text><text x="530.0" y="98.0" font-size="15" fill="#3A86FF" text-anchor="middle" font-weight="700" xml:space="preserve">vendite2006</text>
<text x="275.0" y="214.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">João 1000</text>
<text x="275.0" y="246.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">Roberto 5000</text>
<text x="545.0" y="214.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">João 2000</text>
<text x="545.0" y="246.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" xml:space="preserve">Isaque 35000</text>
<text x="410.0" y="235.0" font-size="14" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="700" xml:space="preserve">Alex 2000</text>
<text x="410.0" y="380.0" font-size="12.5" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">João 1000 e João 2000 sono righe diverse: solo Alex 2000 è in entrambe</text>
<rect x="20.0" y="410.0" width="228.0" height="236.0" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<text x="34.0" y="436.0" font-size="15" fill="#B35300" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">UNION</text>
<text x="234.0" y="436.0" font-size="12.5" fill="#756986" text-anchor="end" font-weight="700" xml:space="preserve">5 righe</text>
<text x="34.0" y="458.0" font-size="12" fill="#3E3350" font-style="italic" xml:space="preserve">unisce e toglie i doppioni</text>
<text x="34.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Alex 2000</text>
<text x="34.0" y="511.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Isaque 35000</text>
<text x="34.0" y="536.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">João 1000</text>
<text x="34.0" y="561.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">João 2000</text>
<text x="34.0" y="586.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Roberto 5000</text>
<rect x="260.0" y="410.0" width="228.0" height="236.0" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<text x="274.0" y="436.0" font-size="15" fill="#5B2A86" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">UNION ALL</text>
<text x="474.0" y="436.0" font-size="12.5" fill="#756986" text-anchor="end" font-weight="700" xml:space="preserve">6 righe</text>
<text x="274.0" y="458.0" font-size="12" fill="#3E3350" font-style="italic" xml:space="preserve">unisce tutto, senza togliere</text>
<text x="274.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">João 1000</text>
<text x="274.0" y="511.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Alex 2000</text>
<text x="274.0" y="536.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Roberto 5000</text>
<text x="274.0" y="561.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">João 2000</text>
<text x="274.0" y="586.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Alex 2000</text>
<text x="274.0" y="611.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Isaque 35000</text>
<rect x="500.0" y="410.0" width="228.0" height="236.0" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<text x="514.0" y="436.0" font-size="15" fill="#2A9D8F" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">INTERSECT</text>
<text x="714.0" y="436.0" font-size="12.5" fill="#756986" text-anchor="end" font-weight="700" xml:space="preserve">1 riga</text>
<text x="514.0" y="458.0" font-size="12" fill="#3E3350" font-style="italic" xml:space="preserve">solo ciò che è in entrambe</text>
<text x="514.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Alex 2000</text>
<rect x="740.0" y="410.0" width="228.0" height="236.0" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>
<text x="754.0" y="436.0" font-size="15" fill="#C2185B" font-family="Consolas, 'Courier New', monospace" font-weight="700" xml:space="preserve">EXCEPT · MINUS</text>
<text x="954.0" y="436.0" font-size="12.5" fill="#756986" text-anchor="end" font-weight="700" xml:space="preserve">2 righe</text>
<text x="754.0" y="458.0" font-size="12" fill="#3E3350" font-style="italic" xml:space="preserve">ciò che è solo nella prima</text>
<text x="754.0" y="486.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">João 1000</text>
<text x="754.0" y="511.0" font-size="13" fill="#2B1B3D" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">Roberto 5000</text>
<text x="500.0" y="676.0" font-size="14" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">In Oracle, EXCEPT si chiama MINUS (EXCEPT è accettato anche dalla versione 21c). Senza ORDER BY, l’ordine non è garantito.</text>
</svg>
