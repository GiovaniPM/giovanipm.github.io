<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="it" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Come una missione inizia e finisce</title>
<desc id="d">Flusso della missione. Il briefing porta al volo, in cui il controllo può essere manuale o del pilota automatico. Dal volo, restare nella fascia obiettivo con il motore spento per 1,2 secondi porta alla vittoria. Quattro riquadri rossi mostrano le sconfitte: collisione con la superficie, ingresso nell'atmosfera senza scudo, fuga nello spazio e scudo esaurito. Sotto, la formula del punteggio e le regole delle tre stelle.</desc>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Come una missione inizia e finisce</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">Una vittoria e quattro modi di perdere</text>
<rect x="40.0" y="104.0" width="170.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#756986" stroke-width="2"/>
<text x="125.0" y="136.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Briefing</text>
<text x="125.0" y="156.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">Δv e fascia obiettivo</text>
<rect x="270.0" y="104.0" width="240.0" height="72.0" rx="12" fill="#EFE3FA" stroke="#5B2A86" stroke-width="2"/>
<text x="390.0" y="136.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Volo</text>
<text x="390.0" y="156.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">manuale ⇄ pilota automatico</text>
<rect x="570.0" y="104.0" width="190.0" height="72.0" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/>
<text x="665.0" y="136.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Nella fascia, motore</text>
<text x="665.0" y="156.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">spento per 1,2 s</text>
<rect x="810.0" y="104.0" width="150.0" height="72.0" rx="12" fill="#D7F2EC" stroke="#0E8074" stroke-width="2"/>
<text x="885.0" y="136.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Vittoria</text>
<text x="885.0" y="156.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">punti e stelle</text>
<line x1="212.0" y1="140.0" x2="266.0" y2="140.0" stroke="#2B1B3D" stroke-width="2" marker-end="url(#mi)"/>
<line x1="512.0" y1="140.0" x2="566.0" y2="140.0" stroke="#2B1B3D" stroke-width="2" marker-end="url(#mi)"/>
<line x1="762.0" y1="140.0" x2="806.0" y2="140.0" stroke="#2B1B3D" stroke-width="2" marker-end="url(#mi)"/>
<rect x="40.0" y="250.0" width="216.0" height="66.0" rx="12" fill="#FFE5E5" stroke="#D62828" stroke-width="2"/>
<text x="148.0" y="276.0" font-size="14.5" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">Collisione</text>
<text x="148.0" y="298.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">ha toccato la superficie</text>
<path d="M390 178 C 390 214, 148 214, 148 246" fill="none" stroke="#D62828" stroke-width="1.6" marker-end="url(#mr)" stroke-dasharray="5 4"/>
<rect x="272.0" y="250.0" width="216.0" height="66.0" rx="12" fill="#FFE5E5" stroke="#D62828" stroke-width="2"/>
<text x="380.0" y="276.0" font-size="14.5" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">Ingresso in atmosfera</text>
<text x="380.0" y="298.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">senza scudo termico</text>
<path d="M390 178 C 390 214, 380 214, 380 246" fill="none" stroke="#D62828" stroke-width="1.6" marker-end="url(#mr)" stroke-dasharray="5 4"/>
<rect x="504.0" y="250.0" width="216.0" height="66.0" rx="12" fill="#FFE5E5" stroke="#D62828" stroke-width="2"/>
<text x="612.0" y="276.0" font-size="14.5" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">Fuga nello spazio</text>
<text x="612.0" y="298.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">non ha frenato abbastanza</text>
<path d="M390 178 C 390 214, 612 214, 612 246" fill="none" stroke="#D62828" stroke-width="1.6" marker-end="url(#mr)" stroke-dasharray="5 4"/>
<rect x="736.0" y="250.0" width="216.0" height="66.0" rx="12" fill="#FFE5E5" stroke="#D62828" stroke-width="2"/>
<text x="844.0" y="276.0" font-size="14.5" fill="#D62828" text-anchor="middle" font-weight="700" xml:space="preserve">Scudo esaurito</text>
<text x="844.0" y="298.0" font-size="12.5" fill="#3E3350" text-anchor="middle" xml:space="preserve">troppa aerofrenata</text>
<path d="M390 178 C 390 214, 844 214, 844 246" fill="none" stroke="#D62828" stroke-width="1.6" marker-end="url(#mr)" stroke-dasharray="5 4"/>
<rect x="40.0" y="346.0" width="920.0" height="190.0" rx="14" fill="#FFF1C9"/>
<rect x="40" y="346" width="6" height="190" rx="3" fill="#FFB703"/>
<text x="500.0" y="382.0" font-size="19" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">Punti = 1000 × (½ precisione + ½ carburante)</text>
<text x="70.0" y="420.0" font-size="14" fill="#3E3350" text-anchor="start" xml:space="preserve">Precisione: quanto Pe e Ap sono vicini al centro della fascia (1 = al centro).</text>
<text x="70.0" y="448.0" font-size="14" fill="#3E3350" text-anchor="start" xml:space="preserve">Carburante: frazione di Δv avanzata; dal 35% in su vale il massimo.</text>
<text x="500.0" y="508.0" font-size="15" fill="#B35300" text-anchor="middle" font-weight="700" xml:space="preserve">★ per aver concluso   ★ se avanza il 15% del Δv   ★ se la precisione supera il 50%</text>
</svg>
