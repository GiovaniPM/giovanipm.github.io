<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Mil anos de damas</title>
<desc id="d">Linha do tempo: alquerque no século X, fierges no século XII, regras do alquerque em 1283, captura obrigatória por volta de 1535, primeiro livro em 1547, tabuleiro 10 por 10 no século XVII, livro de Payne em 1756, federação mundial em 1947, primeira federação brasileira em 1963, artigo de Samuel em 1959, Tinsley contra Chinook em 1992 e solução do jogo americano em 2007.</desc>
<rect width="1000" height="780" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="26" font-weight="700" fill="#2B1B3D" text-anchor="middle">Mil anos de damas</text>
<line x1="192" y1="92" x2="192" y2="746" stroke="#D8C8B0" stroke-width="3"/><text x="172" y="110" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">séc. X</text><circle cx="192" cy="104" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="109" font-size="15.5" fill="#2B1B3D">Primeira menção certa ao quirkat, ou alquerque, ancestral provável</text><text x="172" y="166" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">séc. XII</text><circle cx="192" cy="160" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="165" font-size="15.5" fill="#2B1B3D">O fierges surge na Europa: data e local ainda são debatidos</text><text x="172" y="222" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1283</text><circle cx="192" cy="216" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="221" font-size="15.5" fill="#2B1B3D">O Livro dos Jogos de Afonso X descreve as regras do alquerque</text><text x="172" y="278" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">c. 1535</text><circle cx="192" cy="272" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="277" font-size="15.5" fill="#2B1B3D">A captura obrigatória é atribuída à França: nasce o jeu forcé</text><text x="172" y="334" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1547</text><circle cx="192" cy="328" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="333" font-size="15.5" fill="#2B1B3D">Antonio Torquemada publica em Valência o primeiro livro sobre o jogo</text><text x="172" y="390" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1617–1635</text><circle cx="192" cy="384" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="389" font-size="15.5" fill="#2B1B3D">O tabuleiro 10 × 10 aparece na Holanda</text><text x="172" y="446" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1756</text><circle cx="192" cy="440" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="445" font-size="15.5" fill="#2B1B3D">William Payne publica o primeiro livro em inglês</text><text x="172" y="502" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1947</text><circle cx="192" cy="496" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="501" font-size="15.5" fill="#2B1B3D">Fundação da Federação Mundial de Jogo de Damas</text><text x="172" y="558" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1959</text><circle cx="192" cy="552" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="557" font-size="15.5" fill="#2B1B3D">Arthur Samuel publica seu estudo de aprendizado de máquina com damas</text><text x="172" y="614" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1963</text><circle cx="192" cy="608" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="613" font-size="15.5" fill="#2B1B3D">Nasce em São Paulo a primeira federação brasileira de damas</text><text x="172" y="670" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">1992</text><circle cx="192" cy="664" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="669" font-size="15.5" fill="#2B1B3D">Marion Tinsley vence a Chinook por 4 a 2, com 33 empates</text><text x="172" y="726" font-size="17" font-weight="700" fill="#2B1B3D" text-anchor="end">2007</text><circle cx="192" cy="720" r="8" fill="#5B2A86" stroke="#FFF7EC" stroke-width="3"/><text x="214" y="725" font-size="15.5" fill="#2B1B3D">As damas americanas são resolvidas: jogo perfeito termina em empate</text>
</svg>
