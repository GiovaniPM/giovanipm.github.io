<circle cx="211.8" cy="461.7" r="14" fill="#2A9D8F"/>
<text x="211.8" y="466.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="233.8" y="465.7" font-size="14" fill="#2B1B3D" font-weight="700">Implementation</text>
<text x="233.8" y="487.7" font-size="12" fill="#756986">→ tested, installed system</text>
<rect x="75.2" y="224.8" width="260.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2.5"/>
<circle cx="99.2" cy="254.8" r="14" fill="#FF6B6B"/>
<text x="99.2" y="259.8" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">5</text>
<text x="121.2" y="258.8" font-size="14" fill="#2B1B3D" font-weight="700">Maintenance and support</text>
<text x="121.2" y="280.8" font-size="12" fill="#756986">→ fixes and enhancements</text>
</svg>
