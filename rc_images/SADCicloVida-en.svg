<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">The systems development life cycle (SDLC)</title>
<desc id="d">Five phases in a circle, linked by arrows: 1, planning and feasibility, which produces the feasibility report; 2, analysis and specification, which produces the requirements specification; 3, design, which produces the design document; 4, implementation, which delivers the tested, installed system; 5, maintenance and support, with fixes and enhancements, which leads back to planning.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A9D8F"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2185B"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">The systems development life cycle (SDLC)</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">Five phases, each with its deliverable, and maintenance feeding the next cycle</text>
<line x1="597.3" y1="177.2" x2="697.5" y2="220.6" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
<line x1="757.7" y1="331.1" x2="719.4" y2="401.4" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
<line x1="562.0" y1="469.7" x2="438.0" y2="469.7" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
<line x1="280.6" y1="401.4" x2="242.3" y2="331.1" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
<line x1="302.5" y1="220.6" x2="402.7" y2="177.2" stroke="#756986" stroke-width="3" marker-end="url(#am)"/>
<ellipse cx="500" cy="320" rx="120" ry="56" fill="#5B2A86" stroke="#2B1B3D" stroke-width="2.5"/>
<text x="500.0" y="318.0" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">SDLC</text>
<text x="500.0" y="340.0" font-size="12.5" fill="#FCE4F0" text-anchor="middle">life cycle</text>
<rect x="370.0" y="97.0" width="260.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#FFB703" stroke-width="2.5"/>
<circle cx="394.0" cy="127.0" r="14" fill="#FFB703"/>
<text x="394.0" y="132.0" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">1</text>
<text x="416.0" y="131.0" font-size="14" fill="#2B1B3D" font-weight="700">Planning and feasibility</text>
<text x="416.0" y="153.0" font-size="12" fill="#756986">→ feasibility report</text>
<rect x="664.8" y="224.8" width="260.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2.5"/>
<circle cx="688.8" cy="254.8" r="14" fill="#3A86FF"/>
<text x="688.8" y="259.8" font-size="13" fill="#2B1B3D" text-anchor="middle" font-weight="700">2</text>
<text x="710.8" y="258.8" font-size="14" fill="#2B1B3D" font-weight="700">Analysis and specification</text>
<text x="710.8" y="280.8" font-size="12" fill="#756986">→ requirements specification</text>
<rect x="552.2" y="431.7" width="260.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/>
<circle cx="576.2" cy="461.7" r="14" fill="#5B2A86"/>
<text x="576.2" y="466.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="598.2" y="465.7" font-size="14" fill="#2B1B3D" font-weight="700">Design</text>
<text x="598.2" y="487.7" font-size="12" fill="#756986">→ design document</text>
