<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="t d" lang="en" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">What the autopilot does</title>
<desc id="d">Six steps in a vertical sequence: correct the approach route, wait for the braking point, brake for capture, optional aerobraking in a dashed line, adjust at the ends of the orbit and, finally, shut down the engines in the target band. On the right, three cards: the safety rule that raises the periapsis when it gets dangerous, how to take back control and the notice that the result does not count as a record.</desc>
<defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B1B3D"/></marker><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#756986"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B35300"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D62828"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A86FF"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E8074"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B2A86"/></marker></defs>
<rect width="1000" height="590" rx="18" fill="#FFF7EC"/>
<text x="500.0" y="44.0" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700" xml:space="preserve">What the autopilot does</text>
<text x="500.0" y="72.0" font-size="16" fill="#756986" text-anchor="middle" font-style="italic" xml:space="preserve">It repeats, on its own, the same strategy you learn to use</text>
<rect x="40.0" y="98.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#3A86FF" stroke-width="2"/>
<circle cx="72.0" cy="129.0" r="16.0" fill="#3A86FF"/>
<text x="72.0" y="135.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
<text x="100.0" y="123.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Correct the approach route</text>
<text x="100.0" y="145.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">Still far away, it burns sideways until the predicted periapsis is in the band.</text>
<line x1="335.0" y1="161.0" x2="335.0" y2="175.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="178.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2"/>
<circle cx="72.0" cy="209.0" r="16.0" fill="#5B2A86"/>
<text x="72.0" y="215.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
<text x="100.0" y="203.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Wait for the braking point</text>
<text x="100.0" y="225.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">It works out when to start braking so the burn is centered on periapsis.</text>
<line x1="335.0" y1="241.0" x2="335.0" y2="255.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="258.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#D62828" stroke-width="2"/>
<circle cx="72.0" cy="289.0" r="16.0" fill="#D62828"/>
<text x="72.0" y="295.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
<text x="100.0" y="283.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Brake for capture</text>
<text x="100.0" y="305.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">It brakes against the motion, holding the periapsis, until the apoapsis drops.</text>
<line x1="335.0" y1="321.0" x2="335.0" y2="335.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="338.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="72.0" cy="369.0" r="16.0" fill="#FF6B6B"/>
<text x="72.0" y="375.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
<text x="100.0" y="363.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Aerobraking (only sometimes)</text>
<text x="100.0" y="385.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">With a shield and little Δv, it flies through the air at 55% of its height.</text>
<line x1="335.0" y1="401.0" x2="335.0" y2="415.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="418.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#B35300" stroke-width="2"/>
<circle cx="72.0" cy="449.0" r="16.0" fill="#B35300"/>
<text x="72.0" y="455.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
<text x="100.0" y="443.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Adjust at the ends</text>
<text x="100.0" y="465.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">At periapsis it fixes the apoapsis; at apoapsis it fixes the periapsis.</text>
<line x1="335.0" y1="481.0" x2="335.0" y2="495.0" stroke="#756986" stroke-width="2" marker-end="url(#mm)"/>
<rect x="40.0" y="498.0" width="590.0" height="62.0" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2"/>
<circle cx="72.0" cy="529.0" r="16.0" fill="#0E8074"/>
<text x="72.0" y="535.0" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" xml:space="preserve">6</text>
<text x="100.0" y="523.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Engines off</text>
<text x="100.0" y="545.0" font-size="13" fill="#3E3350" text-anchor="start" xml:space="preserve">With Pe and Ap in the band, it waits for the mission to complete.</text>
<rect x="670.0" y="98.0" width="290.0" height="140.0" rx="12" fill="#FFF1C9" stroke="#FFB703" stroke-width="2"/>
<text x="690.0" y="132.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Safety first</text>
<text x="690.0" y="164.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">If the periapsis gets dangerous,</text>
<text x="690.0" y="185.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">it raises it before anything else.</text>
<rect x="670.0" y="258.0" width="290.0" height="140.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="690.0" y="292.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">Take over any time</text>
<text x="690.0" y="324.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Any engine command hands</text>
<text x="690.0" y="345.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">control back to you.</text>
<rect x="670.0" y="418.0" width="290.0" height="140.0" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/>
<text x="690.0" y="452.0" font-size="16" fill="#2B1B3D" text-anchor="start" font-weight="700" xml:space="preserve">No record</text>
<text x="690.0" y="484.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">Missions flown by the autopilot</text>
<text x="690.0" y="505.0" font-size="13.5" fill="#3E3350" text-anchor="start" xml:space="preserve">do not count as your best.</text>
</svg>
