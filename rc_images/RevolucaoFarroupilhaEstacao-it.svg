<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 362" width="1000" height="362" role="img" aria-labelledby="t d">
<title id="t">Una stagione di campagna</title>
<desc id="d">Ogni stagione ha cinque fasi: 1, Sorte: un dado decide piogge, bestiame, guide o adesioni; 2, Comando: ogni colonna tira un dado, Bento Gonçalves riceve 3 più metà del dado e gli altri capi 1 più metà; 3, Ordini: marciare, assediare, attaccare, trincerarsi, cercare viveri, radunare zattere o costruire lance; 4, Imperiali: le forze imperiali si muovono e attaccano; 5, Viveri: in terra amica la colonna si rifornisce, altrove perde 1. L’anno di campagna ha primavera, estate e autunno, e finisce in inverno, passato nelle estancias, quando si recuperano squadroni e si spende Adesione in rinforzi.</desc>
<rect width="1000" height="362" rx="18" fill="#FFF7EC"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#756986"/></marker></defs>
<g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#2B1B3D">
<rect x="22" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="110" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">1. Sorte</text><text x="110" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">un dado: pioggia,</text><text x="110" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">bestiame, guide, adesioni</text><line x1="200" y1="86" x2="214" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="216" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="304" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">2. Comando</text><text x="304" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">un dado per colonna:</text><text x="304" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">Bento 3 + ½ dado</text><line x1="394" y1="86" x2="408" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="410" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#5B2A86" stroke-width="2.5"/><text x="498" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#5B2A86">3. Ordini</text><text x="498" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">marciare, assediare,</text><text x="498" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">attaccare, zattere</text><line x1="588" y1="86" x2="602" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="604" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#C2185B" stroke-width="2.5"/><text x="692" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#C2185B">4. Imperiali</text><text x="692" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">si muovono e attaccano</text><text x="692" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">chi sembra debole</text><line x1="782" y1="86" x2="796" y2="86" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="798" y="30" width="176" height="112" rx="12" fill="#FFFFFF" stroke="#0E8074" stroke-width="2.5"/><text x="886" y="62" font-size="19" font-weight="bold" text-anchor="middle" fill="#0E8074">5. Viveri</text><text x="886" y="92.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">terra amica rifornisce;</text><text x="886" y="112.0" font-size="14.5" fill="#2B1B3D" text-anchor="middle">altrove −1</text>
<text x="500" y="186" font-size="17" font-weight="bold" text-anchor="middle">L’anno di campagna</text>
<rect x="70" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="155" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Primavera</text><text x="155" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">set.–nov.</text><line x1="242" y1="236" x2="286" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="290" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="375" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Estate</text><text x="375" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">dic.–feb.</text><line x1="462" y1="236" x2="506" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="510" y="204" width="170" height="64" rx="12" fill="#FFFFFF" stroke="#F1E2CF" stroke-width="2"/><text x="595" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Autunno</text><text x="595" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">mar.–mag.</text><line x1="682" y1="236" x2="726" y2="236" stroke="#756986" stroke-width="2" marker-end="url(#ar)"/>
<rect x="730" y="204" width="170" height="64" rx="12" fill="#E2F6F2" stroke="#0E8074" stroke-width="2"/><text x="815" y="230.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">Inverno</text><text x="815" y="252.0" font-size="16" fill="#2B1B3D" text-anchor="middle" font-weight="bold">giu.–ago.</text>
<path d="M 815 268 C 815 314, 155 314, 155 273" fill="none" stroke="#756986" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="500" y="340.0" font-size="14.5" fill="#756986" text-anchor="middle">Nei quartieri d’inverno le colonne recuperano squadroni, ricevono rinforzi e possono affrontare rivolte</text></g>
</svg>
