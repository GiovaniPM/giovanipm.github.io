<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d" lang="pt-BR" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title id="t">Automação × ampliação: efeito no emprego</title>
<desc id="d">Dois painéis. À esquerda, automação: quando a IA substitui tarefas, as vagas de entrada encolhem. O emprego de desenvolvedores de 22 a 25 anos caiu quase 20% em relação ao pico do fim de 2022, e jovens em ocupações expostas à IA estão 19% abaixo da tendência dos menos expostos. À direita, ampliação: quando a IA complementa o trabalho, o emprego se mantém ou cresce, e profissionais experientes não mostram queda equivalente. Fonte: Stanford Digital Economy Lab, 2025 e 2026.</desc>
<rect width="1000" height="530" rx="18" fill="#FFF7EC"/>
<text x="500" y="44" font-size="24" fill="#2B1B3D" text-anchor="middle" font-weight="700">Automação × ampliação</text>
<text x="500" y="72" font-size="16" fill="#756986" text-anchor="middle" font-style="italic">O efeito no emprego depende do tipo de uso da IA</text>

<rect x="50" y="100" width="420" height="370" rx="14" fill="#FFFFFF" stroke="#E23B3B" stroke-width="2.5"/>
<path d="M50 114 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v50 h-420 z" fill="#E23B3B"/>
<text x="260" y="130" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">Automação</text>
<text x="260" y="152" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">a IA substitui tarefas</text>
<path d="M92 188 h16 v24 h12 l-20 24 l-20 -24 h12 z" fill="#E23B3B"/>
<text x="138" y="219" font-size="17" fill="#2B1B3D" font-weight="700">Vagas de entrada encolhem</text>
<line x1="75" y1="252" x2="445" y2="252" stroke="#F2D6D6" stroke-width="2"/>
<text x="75" y="315" font-size="36" fill="#E23B3B" font-weight="700">−20%</text>
<text x="195" y="298" font-size="14" fill="#2B1B3D">emprego de desenvolvedores</text>
<text x="195" y="317" font-size="14" fill="#2B1B3D">de 22 a 25 anos, frente ao</text>
<text x="195" y="336" font-size="14" fill="#2B1B3D">pico do fim de 2022</text>
<text x="75" y="415" font-size="36" fill="#E23B3B" font-weight="700">−19%</text>
<text x="195" y="398" font-size="14" fill="#2B1B3D">jovens em ocupações expostas</text>
<text x="195" y="417" font-size="14" fill="#2B1B3D">à IA, frente à tendência dos</text>
<text x="195" y="436" font-size="14" fill="#2B1B3D">colegas menos expostos</text>

<circle cx="500" cy="285" r="22" fill="#2B1B3D"/>
<text x="500" y="292" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">×</text>

<rect x="530" y="100" width="420" height="370" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<path d="M530 114 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v50 h-420 z" fill="#2A9D8F"/>
<text x="740" y="130" font-size="19" fill="#FFFFFF" text-anchor="middle" font-weight="700">Ampliação</text>
<text x="740" y="152" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">a IA complementa o trabalho</text>
<path d="M572 236 h16 v-24 h12 l-20 -24 l-20 24 h12 z" fill="#2A9D8F"/>
<text x="618" y="219" font-size="17" fill="#2B1B3D" font-weight="700">Emprego se mantém ou cresce</text>
<line x1="555" y1="252" x2="925" y2="252" stroke="#D3ECE9" stroke-width="2"/>
<g font-size="14" fill="#2B1B3D">
<path d="M560 300 l8 8 l16 -18" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="298" font-size="16" font-weight="700">Profissionais experientes</text>
<text x="600" y="319">não mostram queda equivalente</text>
<text x="600" y="338">à dos mais jovens</text>
<path d="M560 400 l8 8 l16 -18" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="398" font-size="16" font-weight="700">Uso complementar</text>
<text x="600" y="419">onde a IA amplia o trabalho,</text>
<text x="600" y="438">as vagas se sustentam</text>
</g>

<text x="500" y="505" font-size="12" fill="#756986" text-anchor="middle" font-style="italic">Fonte: Stanford Digital Economy Lab, Canaries in the Coal Mine?, 2025 e 2026 · estudo descritivo, não causal</text>
</svg>
