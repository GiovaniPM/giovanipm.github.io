<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" role="img" aria-labelledby="t d"><title id="t">Tamanho da explosão de cada arma</title><desc id="d">Raio da cratera, em escala, e o dano no centro. Bola de neve: r 24, dano 34; Bolão de neve: r 38, dano 48; Bloco de gelo: r 58, dano 66; Granizo (cada pedra): r 26, dano 30; Bola quicante: r 32, dano 44; Pingente (cada): r 22, dano 26; Bomba de nitrogênio: r 115, dano 95.</desc><rect width="1000" height="404" rx="18" fill="#FFF7EC"/><text x="500" y="40" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#2B1B3D" font-weight="700" text-anchor="middle">Tamanho da explosão de cada arma</text><text x="500" y="66" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#756986" text-anchor="middle">Raio da cratera, em escala, e o dano no centro.</text><circle cx="80" cy="190" r="24" fill="#CFE8FF" stroke="#5FA8DF" stroke-width="2"/><circle cx="80" cy="190" r="4" fill="#2B1B3D"/><text x="80" y="290" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" font-weight="700" text-anchor="middle">Bola de neve</text><text x="80" y="326" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#756986" text-anchor="middle">r 24 · dano 34</text><circle cx="198" cy="190" r="38" fill="#CFE8FF" stroke="#5FA8DF" stroke-width="2"/><circle cx="198" cy="190" r="4" fill="#2B1B3D"/><text x="198" y="290" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2B1B3D" font-weight="700" text-anchor="middle">Bolão de neve</text><text x="198" y="326" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#756986" text-anchor="middle">r 38 · dano 48</text><circle cx="316" cy="190" r="58" fill="#CFE8FF" stroke="#5FA8DF" stroke-width="2"/><circle cx="316" cy="190" r="