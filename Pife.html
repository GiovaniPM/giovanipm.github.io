<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pife · Giovani Perotto Mesquita</title>
<meta name="description" content="Pife, ou pif-paf: jogo de cartas com dois baralhos e nove cartas na mão. Forme trincas e sequências e bata antes dos adversários, contra o computador. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#3A1420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2A0F18; --felt: #6B1F33; --felt-2: #4E1525; --panel: #FBF5EA; --panel-2: #F1E6D2; --ink: #2A1E18; --muted: #6F5F50; --line: #DFCDB1;
    --accent: #1E6F68; --accent-ink: #FFFFFF; --gold: #E8B23E; --ok: #1F7A4D;
    --sans: "Hanken Grotesk", "Segoe UI", Arial, sans-serif; --serif: "Source Serif 4", Georgia, serif;
    --cw: clamp(56px, 8.4vmin, 92px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --panel: #2B2124; --panel-2: #3A2C30; --ink: #F5EDE3; --muted: #B9A99B; --line: #4C3B40; --accent: #2F9C92; --ok: #5CC490; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100dvh; }
  .stage { display: flex; flex-direction: column; min-width: 0; padding: 8px; gap: 8px; }
  .side { display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 8px 0; min-height: 0; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .75rem; }

  /* mesa */
  .table { position: relative; flex: 1; min-height: 240px; border-radius: 20px; background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-2) 85%); border: 6px solid #3B2413; box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px; gap: 8px; overflow: hidden; }
  .opps { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .opp { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #FFF7EA; }
  .opp .np { font-weight: 700; font-size: .84rem; padding: .1rem .55rem; border-radius: 99px; background: rgba(0,0,0,.4); white-space: nowrap; }
  .opp.on .np { background: var(--gold); color: #2A1E18; }
  .backs { display: flex; height: calc(var(--cw) * .62); }
  .backs svg { width: calc(var(--cw) * .4); height: calc(var(--cw) * .58); margin-left: calc(var(--cw) * -.31); }
  .backs svg:first-child { margin-left: 0; }
  .piles { display: flex; gap: clamp(14px, 4vw, 34px); align-items: center; justify-content: center; flex: 1; }
  .pile { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FFF7EA; font-size: .8rem; background: transparent; border: 0; padding: 4px; border-radius: 10px; }
  .pile.can { outline: 3px solid var(--gold); outline-offset: 1px; }
  .pile.can:hover { background: rgba(255,255,255,.08); }
  .pile:disabled { opacity: 1; }
  .slotcard { width: var(--cw); height: calc(var(--cw) * 1.45); display: block; }
  .emptyslot { width: var(--cw); height: calc(var(--cw) * 1.45); border: 2px dashed rgba(255,255,255,.35); border-radius: 8px; }
  .vira { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FFF7EA; font-size: .8rem; }
  .pcard { display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }

  /* mão */
  .hand { position: relative; display: flex; justify-content: center; padding: 16px 4px 12px; min-height: calc(var(--cw) * 1.45 + 30px); touch-action: pan-y; }
  .hcard { position: relative; padding: 0; border: 0; background: transparent; width: var(--cw); height: calc(var(--cw) * 1.45); margin-left: var(--ov, 2px); flex: none; border-radius: 8px; transition: transform .1s; touch-action: none; }
  .hcard:first-child { margin-left: 0; }
  .hcard svg { width: 100%; height: 100%; }
  .hcard.sel { transform: translateY(-14px); z-index: 3; }
  .hcard.sel svg { filter: drop-shadow(0 0 6px var(--gold)); }
  .hcard.isnew::after { content: ""; position: absolute; top: -7px; left: 50%; width: 10px; height: 10px; margin-left: -5px; background: var(--gold); border-radius: 50%; }
  .hcard .bar { position: absolute; left: 6%; right: 6%; bottom: -8px; height: 5px; border-radius: 3px; }
  .hcard.drag { opacity: .55; }
  .hcard.over { box-shadow: -3px 0 0 var(--gold); }
  .action { min-height: 86px; }
  .action h2 { font-family: var(--serif); font-size: 1.05rem; line-height: 1.2; margin: 0 0 .3rem; }
  .action p { margin: 0 0 .4rem; font-size: .86rem; line-height: 1.3; color: var(--muted); }
  .btns { display: flex; flex-wrap: wrap; gap: .35rem; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: .5rem .72rem; font-weight: 700; font-size: .9rem; min-height: 40px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.win { background: var(--gold); color: #2A1E18; border-color: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(232,178,62,.35); } }
  .btn.sm { padding: .3rem .55rem; font-size: .8rem; min-height: 32px; }
  .score { display: grid; gap: .25rem; font-size: .9rem; }
  .score .row2 { display: flex; justify-content: space-between; gap: .5rem; padding: .15rem .3rem; border-radius: 6px; }
  .score .row2.on { background: var(--panel-2); font-weight: 700; }
  .score .sub { font-size: .75rem; color: var(--muted); }
  .log { flex: 1; min-height: 70px; overflow: auto; font-size: .82rem; line-height: 1.35; }
  .log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
  .log li { color: var(--muted); }
  .log li:last-child { color: var(--ink); font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: .35rem; }

  /* telas */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; overflow: auto; z-index: 20; background: var(--bg); }
  .sheet, dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 1.2rem clamp(1rem, 4vw, 1.8rem); box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  .sheet { width: min(100%, 620px); }
  dialog { width: min(94vw, 680px); max-height: 90dvh; overflow: auto; }
  dialog::backdrop { background: rgba(10, 2, 6, .65); }
  .back { font-size: .85rem; color: var(--accent); text-decoration: none; }
  .hero { display: flex; justify-content: center; padding: .9rem 0 .4rem; }
  .hero .pcard { width: 76px; height: 110px; margin-left: -22px; }
  .hero .pcard:first-child { margin-left: 0; }
  .hero .pcard:nth-child(1) { transform: rotate(-12deg); } .hero .pcard:nth-child(2) { transform: rotate(-6deg) translateY(-6px); } .hero .pcard:nth-child(3) { transform: translateY(-9px); } .hero .pcard:nth-child(4) { transform: rotate(6deg) translateY(-6px); } .hero .pcard:nth-child(5) { transform: rotate(12deg); }
  .sheet h1 { font-family: var(--serif); font-size: clamp(2.2rem, 7vw, 3.1rem); line-height: 1.05; margin: .2rem 0 .3rem; }
  .tag { font-family: var(--serif); font-size: 1.1rem; color: var(--accent); margin: 0 0 .4rem; font-weight: 600; }
  .sheet p { line-height: 1.45; margin: .3rem 0; font-size: .95rem; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .8rem; align-items: end; }
  .field { display: grid; gap: .2rem; font-size: .8rem; color: var(--muted); }
  select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .5rem; color: var(--ink); min-height: 38px; }
  dialog h2 { font-family: var(--serif); margin: 0 0 .6rem; font-size: 1.4rem; }
  dialog h3 { font-size: 1rem; margin: 1rem 0 .35rem; }
  .rules { padding-left: 1.1rem; margin: 0; display: grid; gap: .4rem; line-height: 1.4; font-size: .93rem; }
  .melds { display: flex; flex-wrap: wrap; gap: .8rem; margin: .5rem 0; }
  .meld { display: flex; padding: 5px; background: var(--panel-2); border-radius: 8px; }
  .meld svg { width: 44px; height: 64px; margin-left: -18px; }
  .meld svg:first-child { margin-left: 0; }
  .sumline { display: flex; justify-content: space-between; gap: 1rem; padding: .32rem .45rem; background: var(--panel-2); border-radius: 7px; font-size: .92rem; margin-bottom: .25rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 100dvh; }
    .stage { padding: 4px; }
    .table { min-height: 280px; height: 40dvh; flex: none; }
    .side { padding: 0 4px 12px; }
    .log { max-height: 180px; flex: none; }
    .action { order: -1; }
    :root { --cw: clamp(54px, 15vw, 88px); }
  }
  @media (prefers-reduced-motion: reduce) { .hcard { transition: none; } .btn.win { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <main class="stage">
    <div class="table" id="table" role="group" aria-label="Mesa"></div>
    <div class="hand" id="hand" role="group"></div>
  </main>
  <aside class="side">
    <section class="box action" id="action" aria-live="polite"></section>
    <section class="box score" id="score"></section>
    <section class="box log" aria-label="Histórico"><ol id="log"></ol></section>
    <div class="bar">
      <button type="button" class="btn sm" id="bRules" data-t="rules"></button>
      <button type="button" class="btn sm" id="bSound"></button>
      <button type="button" class="btn sm" id="bSpeed"></button>
      <button type="button" class="btn sm" id="bMenu" data-t="menu"></button>
    </div>
  </aside>
</div>

<section class="overlay" id="ovTitle" aria-labelledby="ttl">
  <div class="sheet">
    <a class="back" id="backLink" href="projects.html" data-t="back"></a>
    <div class="hero" id="heroArt" aria-hidden="true"></div>
    <h1 id="ttl">Pife</h1>
    <p class="tag" data-t="tagline"></p>
    <p data-t="story"></p>
    <div class="row">
      <label class="field"><span data-t="players"></span>
        <select id="numSel"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label>
      <label class="field"><span data-t="level"></span>
        <select id="levelSel"><option value="0" data-t="easy"></option><option value="1" data-t="medium"></option><option value="2" data-t="hard"></option></select></label>
      <label class="field"><span data-t="wild"></span>
        <select id="wildSel"><option value="none" data-t="wildNone"></option><option value="joker" data-t="wildJoker"></option><option value="vira" data-t="wildVira"></option></select></label>
      <label class="field"><span data-t="wrap"></span>
        <select id="wrapSel"><option value="0" data-t="wrapNo"></option><option value="1" data-t="wrapYes"></option></select></label>
      <label class="field"><span data-t="target"></span>
        <select id="targetSel"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select></label>
      <label class="field"><span data-t="lang"></span>
        <select id="langSel"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
    </div>
    <div class="row">
      <button type="button" class="btn pri" id="bPlay" data-t="play"></button>
      <button type="button" class="btn" id="bResume" data-t="resume" hidden></button>
      <button type="button" class="btn" id="bRules2" data-t="rules"></button>
    </div>
  </div>
</section>

<dialog id="dRules" aria-labelledby="rulesH"><h2 id="rulesH" data-t="rulesTitle"></h2><div id="rulesBody"></div><div class="row"><button type="button" class="btn pri" id="bRulesClose" data-t="close"></button></div></dialog>
<dialog id="dEnd" aria-labelledby="endH"></dialog>

<script>
// Motor do pife: regras e computador, sem nada de tela. Estado em JSON puro.
function Engine() {
  const SUITS = ['s', 'h', 'd', 'c'], HAND = 9, OUT_GAIN = 2, OUT_WIN = 40, cache = new Map();
  const rankOf = (c) => parseInt(c, 10), suitOf = (c) => c[c.length - 1];
  function rnd(S) { S.seed = (S.seed + 0x6D2B79F5) | 0; let t = Math.imul(S.seed ^ (S.seed >>> 15), 1 | S.seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const shuffle = (S, a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const log = (S, k, v) => { S.log.push({ k, v: v || {} }); if (S.log.length > 200) S.log.shift(); };
  const isWild = (c, o) => c === 'X' || (o.wildRank > 0 && rankOf(c) === o.wildRank);
  const rules = (S) => ({ wrap: S.opts.wrap, wildRank: S.wildRank, jokers: S.opts.wild === 'joker' });

  // trinca: mesmo valor e naipes diferentes, no máximo 4. Curinga substitui uma carta que exista
  function validSet(n, w) {
    if (n.length + w > 4) return false;
    if (n.some((c) => rankOf(c) !== rankOf(n[0]))) return false;
    return new Set(n.map(suitOf)).size === n.length;
  }
  // sequência: mesmo naipe, cartas seguidas. Por opção, Q-K-A e K-A-2 valem (a ordem dá a volta)
  function validRun(n, w, o) {
    if (!n.length) return true;
    if (n.some((c) => suitOf(c) !== suitOf(n[0]))) return false;
    const r = n.map(rankOf).sort((a, b) => a - b);
    if (new Set(r).size !== r.length || r.length + w > 13) return false;
    if (r[r.length - 1] - r[0] + 1 - r.length <= w) return true;
    if (!o.wrap) return false;
    // sequência circular: o maior buraco fica de fora
    let gap = r[0] + 13 - r[r.length - 1];
    for (let i = 1; i < r.length; i++) gap = Math.max(gap, r[i] - r[i - 1]);
    return 13 - gap + 1 - r.length <= w;
  }
  function validMeld(cards, o) {
    if (cards.length < 3) return false;
    const n = cards.filter((c) => !isWild(c, o)), w = cards.length - n.length;
    return validSet(n, w) || validRun(n, w, o) || validNaturalWild(cards, o);
  }
  // um curinga sorteado também pode valer como carta normal: 3 de valor igual são trinca natural
  function validNaturalWild(cards, o) {
    if (!o.wildRank || cards.includes('X')) return false;
    return validSet(cards, 0) || validRun(cards, 0, o);
  }
  // maior cobertura da mão por jogos. Só testa grupos de cartas compatíveis entre si, o que deixa a busca rápida
  const compat = (x, y, o) => {
    if (isWild(x, o) || isWild(y, o)) return true;
    const sameRank = rankOf(x) === rankOf(y), sameSuit = suitOf(x) === suitOf(y);
    return sameRank ? !sameSuit : sameSuit;
  };
  const popcount = (x) => { let c = 0; while (x) { c++; x &= x - 1; } return c; };
  function solve(hand, o) {
    const key = hand.join() + '|' + (o.wrap ? 1 : 0) + '|' + (o.wildRank || 0);
    const hit = cache.get(key);
    if (hit) return hit;
    const n = hand.length, adj = new Array(n).fill(0), byLow = hand.map(() => []);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j && compat(hand[i], hand[j], o)) adj[i] |= 1 << j;
    const list = [];
    const grow = (first, m, cand, size) => {
      if (size >= 3 && validMeld(list, o)) byLow[first].push(m);
      for (let c = cand; c; c &= c - 1) {
        const bit = c & -c, i = 31 - Math.clz32(bit);
        list.push(hand[i]);
        grow(first, m | bit, c & ~(bit | (bit - 1)) & adj[i], size + 1);
        list.pop();
      }
    };
    for (let i = 0; i < n; i++) { list.push(hand[i]); grow(i, 1 << i, adj[i] & ~((2 << i) - 1), 1); list.pop(); }
    const best = new Int8Array(1 << n).fill(-1), pick = new Int32Array(1 << n);
    const rec = (m) => {
      if (!m) return 0;
      if (best[m] >= 0) return best[m];
      const low = m & -m;
      let b = rec(m ^ low), p = 0;
      for (const t of byLow[31 - Math.clz32(low)]) {
        if ((t & m) !== t) continue;
        const v = popcount(t) + rec(m ^ t);
        if (v > b) { b = v; p = t; }
      }
      best[m] = b; pick[m] = p;
      return b;
    };
    const full = (1 << n) - 1, covered = rec(full), groups = [], used = new Set();
    let m = full;
    while (m) {
      const p = pick[m], low = m & -m;
      if (p) { const g = []; for (let i = 0; i < n; i++) if (p & (1 << i)) { g.push(i); used.add(i); } groups.push(g); m ^= p; } else m ^= low;
    }
    const r = { covered, groups, loose: hand.map((_, i) => i).filter((i) => !used.has(i)) };
    if (cache.size > 40000) cache.clear();
    cache.set(key, r);
    return r;
  }
  // bate com a mão toda (9 ou 10 cartas) ou deixando uma carta para o último descarte
  function batida(hand, o) {
    if (hand.length === HAND) { const s = solve(hand, o); return s.covered === HAND ? { discard: -1, groups: s.groups, hand: hand.slice() } : null; }
    const all = solve(hand, o);
    if (all.covered === hand.length) return { discard: -1, groups: all.groups, hand: hand.slice() };
    for (let i = 0; i < hand.length; i++) {
      const rest = hand.filter((_, k) => k !== i), s = solve(rest, o);
      if (s.covered === rest.length) return { discard: i, groups: s.groups, hand: rest };
    }
    return null;
  }

  function buildDeck(S) {
    const d = [];
    for (let k = 0; k < 2; k++) SUITS.forEach((s) => { for (let r = 1; r <= 13; r++) d.push(r + s); });
    if (S.opts.wild === 'joker') d.push('X', 'X', 'X', 'X');
    return d;
  }
  function newGame({ players, opts, target, seed }) {
    const S = { players: players.map((p) => ({ name: p.name, kind: p.kind })), n: players.length, opts: Object.assign({ wild: 'none', wrap: false }, opts), target: target || 1, wins: players.map(() => 0), seed: seed == null ? (Date.now() | 0) : seed, log: [], fx: [], over: null, roundNo: 0 };
    S.starter = Math.floor(rnd(S) * S.n);
    deal(S);
    return S;
  }
  function deal(S) {
    const d = shuffle(S, buildDeck(S));
    S.hands = S.players.map(() => d.splice(0, HAND));
    S.vira = null; S.wildRank = 0;
    if (S.opts.wild === 'vira') { S.vira = d.pop(); S.wildRank = rankOf(S.vira) % 13 + 1; }
    S.stock = d; S.discard = []; S.turn = S.starter; S.phase = 'draw'; S.drew = null; S.newCard = null; S.canSwap = false; S.first = true; S.turnNo = 0; S.pick = S.players.map(() => []); S.result = null; S.reshuffles = 0; S.roundNo++;
    log(S, 'round', { p: S.turn });
  }
  function refill(S) {
    if (S.stock.length) return;
    const top = S.discard.pop();
    S.stock = shuffle(S, S.discard); S.discard = top ? [top] : []; S.reshuffles++;
    log(S, 'reshuffle');
    S.fx.push({ t: 'reshuffle' });
  }
  function next(S) {
    S.turn = (S.turn + 1) % S.n; S.phase = 'draw'; S.drew = null; S.newCard = null; S.canSwap = false; S.turnNo++;
  }
  function finish(S, seat, b) {
    S.wins[seat]++;
    S.result = { seat, groups: b.groups.map((g) => g.map((i) => b.hand[i])), last: b.discard >= 0 ? S.hands[seat][b.discard] : null };
    S.phase = 'roundEnd';
    log(S, 'bater', { p: seat });
    S.fx.push({ t: 'bater', seat });
  }
  const canBater = (S) => S.phase !== 'roundEnd' && S.phase !== 'over' && !!batida(S.hands[S.turn], rules(S));
  function legal(S) {
    if (S.over) return [];
    if (S.phase === 'roundEnd') return [{ type: 'next' }];
    const a = [];
    if (canBater(S)) a.push({ type: 'bater' });
    if (S.phase === 'draw') {
      a.push({ type: 'stock' });
      if (S.discard.length) a.push({ type: 'pile' });
    } else {
      S.hands[S.turn].forEach((_, i) => a.push({ type: 'discard', i }));
      if (S.canSwap) a.push({ type: 'swap' });
    }
    return a;
  }
  function act(S, a) {
    S.fx = [];
    if (S.over) return false;
    if (!legal(S).some((x) => x.type === a.type && (x.i === undefined || x.i === a.i))) return false;
    const P = S.turn;
    switch (a.type) {
      case 'stock': {
        refill(S);
        const c = S.stock.pop();

      rulesHtml: `<h3>The game</h3><ul class="rules"><li><b>Deck:</b> two standard decks, 104 cards, plus 4 jokers when playing with joker wilds. Each player gets 9 cards.</li><li><b>Goal:</b> have every card in your hand in a combination. Melds stay in your hand, secret, until you go out.</li><li><b>Set:</b> three or four cards of one rank and different suits. With two decks, A♥ A♦ A♥ is not valid.</li><li><b>Run:</b> three or more consecutive cards of one suit. The ace comes before the 2. A♥ 2♥ 3♦ is not valid.</li></ul><h3>Your turn</h3><ul class="rules"><li>Draw a card from the stock or take the top discard. Then discard one, back to 9.</li><li>The round’s first player, if unhappy with the first card drawn, may discard it and draw another.</li><li><b>Going out:</b> when all your cards are in melds, with or without a final discard, go out to win the round.</li></ul><h3>Options</h3><ul class="rules"><li><b>Joker wilds:</b> a joker replaces any card that exists: A♠ 🃏 3♠ or 2♦ 2♣ 🃏 are valid, but not a fifth card in a set.</li><li><b>Turned-up wild:</b> a card is turned up, and the next rank is wild for the round. If an ace is turned, the 2 is wild; if a King, the ace.</li><li><b>Q-K-A and K-A-2:</b> with this option, runs can wrap around the ace.</li></ul><h3>In this version</h3><ul class="rules"><li>Rules vary a lot between tables. The base here is the one described on Portuguese Wikipedia; it defines no scoring, so the winner is whoever wins the chosen number of rounds.</li><li>That reference mentions 3 to 8 players; here it is 2 to 6, always against the computer.</li><li>Choices made for this version: when the stock runs out, the discards are shuffled into a new stock, keeping the top card; the go-out button only appears when going out is valid, so there is no penalty for a false claim; and the variant of “cutting” another player’s turn is left out.</li></ul>`,

      rulesHtml: `<h3>Il gioco</h3><ul class="rules"><li><b>Mazzo:</b> due mazzi comuni, 104 carte, più 4 jolly se giochi con il jolly amico. Ogni giocatore riceve 9 carte.</li><li><b>Obiettivo:</b> avere tutte le carte della mano in combinazioni. Le combinazioni restano in mano, segrete, fino alla chiusura.</li><li><b>Tris:</b> tre o quattro carte dello stesso valore e di semi diversi. Con due mazzi, A♥ A♦ A♥ non vale.</li><li><b>Scala:</b> tre o più carte consecutive dello stesso seme. L’asso viene prima del 2. A♥ 2♥ 3♦ non vale.</li></ul><h3>Il tuo turno</h3><ul class="rules"><li>Pesca dal tallone o prendi lo scarto in cima. Poi scarta una carta, tornando a 9.</li><li>Il primo giocatore del giro, se non gli piace la prima carta pescata, può scartarla e pescarne un’altra.</li><li><b>Chiudere:</b> quando tutte le carte sono in combinazioni, con o senza l’ultimo scarto, chiudi e vinci il giro.</li></ul><h3>Opzioni</h3><ul class="rules"><li><b>Jolly amico:</b> il jolly sostituisce qualsiasi carta esistente: A♠ 🃏 3♠ o 2♦ 2♣ 🃏 valgono, ma non una quinta carta nel tris.</li><li><b>Jolly sorteggiato:</b> si gira una carta, e il valore successivo è jolly per il giro. Se esce un asso, il jolly è il 2; se esce un Re, l’asso.</li><li><b>Q-K-A e K-A-2:</b> con questa opzione, la scala può girare sull’asso.</li></ul><h3>In questa versione</h3><ul class="rules"><li>Le regole cambiano molto da un tavolo all’altro. La base è quella descritta su Wikipedia in portoghese; non definisce un punteggio, quindi vince chi ottiene il numero di giri scelto.</li><li>Quel riferimento parla di 3-8 giocatori; qui sono da 2 a 6, sempre contro il computer.</li><li>Scelte di questa versione: quando il tallone finisce, gli scarti vengono mescolati in un nuovo tallone, tenendo la carta in cima; il pulsante di chiusura appare solo quando è valida, quindi non c’è penalità per una chiusura errata; la variante del “tagliare” il turno di un altro giocatore è esclusa.</li></ul>`,

      rulesHtml: `<h3>El juego</h3><ul class="rules"><li><b>Baraja:</b> dos barajas comunes, 104 cartas, más 4 comodines si juegas con comodín amigo. Cada jugador recibe 9 cartas.</li><li><b>Objetivo:</b> tener todas las cartas de la mano en combinaciones. Los juegos quedan en la mano, en secreto, hasta golpear.</li><li><b>Trío:</b> tres o cuatro cartas del mismo valor y de palos distintos. Con dos barajas, A♥ A♦ A♥ no vale.</li><li><b>Escalera:</b> tres o más cartas seguidas del mismo palo. El as va antes del 2. A♥ 2♥ 3♦ no vale.</li></ul><h3>Tu turno</h3><ul class="rules"><li>Roba una carta del mazo o toma la superior de los descartes. Después descarta una, volviendo a 9.</li><li>Quien empieza la ronda, si no le gusta la primera carta robada, puede descartarla y robar otra.</li><li><b>Golpear:</b> cuando todas las cartas estén en juegos, con o sin el último descarte, golpea para ganar la ronda.</li></ul><h3>Opciones</h3><ul class="rules"><li><b>Comodín amigo:</b> el comodín sustituye cualquier carta que exista: A♠ 🃏 3♠ o 2♦ 2♣ 🃏 valen, pero no una quinta carta en el trío.</li><li><b>Comodín sorteado:</b> se voltea una carta, y el valor siguiente es comodín en la ronda. Si sale un as, el comodín es el 2; si sale un Rey, el as.</li><li><b>Q-K-A y K-A-2:</b> con esta opción, la escalera puede dar la vuelta por el as.</li></ul><h3>En esta versión</h3><ul class="rules"><li>Las reglas varían mucho de una mesa a otra. La base es la descrita en la Wikipedia en portugués; no define puntuación, así que gana quien logre el número de rondas elegido.</li><li>Esa referencia habla de 3 a 8 jugadores; aquí son de 2 a 6, siempre contra la computadora.</li><li>Decisiones de esta versión: cuando el mazo se acaba, los descartes se barajan en un mazo nuevo, conservando la carta superior; el botón de golpear solo aparece cuando es válido, así que no hay penalidad por golpear mal; y la variante de “cortar” el turno de otro jugador queda fuera.</li></ul>`,

  let lang = 'pt';

  const shortName = (c) => (c === 'X' ? '★' : rl(E.rankOf(c)) + SUITCH[E.suitOf(c)]);

  const pname = (s) => (S.players[s].kind === 'human' ? t('you') : S.players[s].name);
  const BARC = ['#1E6F68', '#C98A10', '#7A45A8', '#C2252F'];

  function renderTable() {

    let h = `<div class="opps">${S.players.map((p, s) => (s === human ? '' : `<div class="opp${s === S.turn && S.phase !== 'roundEnd' && S.phase !== 'over' ? ' on' : ''}"><div class="backs" aria-hidden="true">${S.hands[s].map(() => backSvg()).join('')}</div><div class="np">${esc(p.name)} · ${S.wins[s]}</div></div>`)).join('')}</div>`;
    h += '<div class="piles">';
    h += `<button type="button" class="pile${myDraw ? ' can' : ''}" id="pStock" ${myDraw ? '' : 'disabled'} aria-label="${esc(t('btnStock'))}">${backSvg('slotcard')}<span>${t('stock', { n: S.stock.length })}</span></button>`;
    h += `<button type="button" class="pile${myDraw && top ? ' can' : ''}" id="pPile" ${myDraw && top ? '' : 'disabled'} aria-label="${esc(t('btnPile'))}">${top ? cardSvg(top, 'slotcard') : '<div class="emptyslot"></div>'}<span>${t('pile')}</span></button>`;
    if (S.vira) h += `<div class="vira">${cardSvg(S.vira, 'slotcard')}<span>${t('vira')} → ${rl(S.wildRank)}</span></div>`;

    $('table').innerHTML = h;
  }

    return { map, covered: r.covered, groups: r.groups, loose: r.loose };
  }
  function renderHand() {
    const hand = S.hands[human], box = $('hand'), n = hand.length, canPick = !busy && S.turn === human && S.phase === 'discard', g = groupsOf(hand);
    const w = box.clientWidth - 8, cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || 0;
    const cardW = box.querySelector('.hcard') ? box.querySelector('.hcard').offsetWidth : (cw || 70);
    const ov = n > 1 ? Math.min(2, (w - cardW * n) / (n - 1)) : 0;
    box.setAttribute('aria-label', t('yourHand'));
    box.style.setProperty('--ov', ov + 'px');
    let newIdx = S.turn === human && S.phase === 'discard' ? hand.lastIndexOf(S.newCard) : -1;
    box.innerHTML = hand.map((c, i) => `<button type="button" class="hcard${sel === i ? ' sel' : ''}${newIdx === i ? ' isnew' : ''}" data-i="${i}" aria-label="${esc(cardName(c))}" aria-pressed="${sel === i}">${cardSvg(c)}${g.map[i] !== undefined ? `<span class="bar" style="background:${BARC[g.map[i] % 4]}"></span>` : ''}</button>`).join('');

  function renderScore() {

  const btn = (a, label, cls, dis) => `<button type="button" class="btn ${cls || ''}" data-a="${a}" ${dis ? 'disabled' : ''}>${esc(label)}</button>`;
  function renderAction() {

    const hand = S.hands[human], bat = E.canBater(S), g = groupsOf(hand), info = `<p>${t('melded', { a: g.covered, b: hand.length })}${bat ? ` <b>${t('batOk')}</b>` : ''}</p>`;

    } else {

  // ---------------------------------------------------------------- fluxo

  async function dispatch(a) {

  function arrange() {

  function moveCard(from, to) {

      g.gain.setValueAtTime(v || 0.05, st); g.gain.exponentialRampToValueAtTime(0.0001, st + d);
      o.connect(g); g.connect(audio.destination); o.start(st); o.stop(st + d);
    } catch (e) { /* sem áudio */ }
  }
  function sfx(k) {
    if (k === 'card') tone(520, 0.05, 'triangle', 0.04);
    else if (k === 'tick') tone(880, 0.07, 'sine', 0.04);
    else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, i * 0.12));
    else if (k === 'lose') [392, 349, 311, 262].forEach((f, i) => tone(f, 0.26, 'sine', 0.05, i * 0.18));
  }

  // ---------------------------------------------------------------- telas
  function startGame() {
    const n = +$('numSel').value, L = +$('levelSel').value, wild = $('wildSel').value, wrap = $('wrapSel').value === '1', target = +$('targetSel').value;
    savePref({ num: n, level: L, wild, wrap, target });
    const players = Array.from({ length: n }, (_, i) => ({ name: i ? CPU[i - 1] : '', kind: i ? L : 'human' }));
    S = E.newGame({ players, opts: { wild, wrap }, target, seed: (Math.random() * 2147483647) | 0 });
    sel = null;
    enter();
  }
  function enter() {
    $('ovTitle').hidden = true; $('app').hidden = false;
    S.fx = []; save(); render();
    if (S.phase === 'roundEnd' || S.phase === 'over') showEnd(); else schedule();
  }
  function showMenu() {
    clearTimeout(aiTimer);
    if (S) save();
    if ($('dEnd').open) $('dEnd').close();
    $('app').hidden = true; $('ovTitle').hidden = false;
    refreshResume();
  }
  function refreshResume() { const g = Store.get('pife.game'); $('bResume').hidden = !(g && !g.over && g.players); }
  const savePref = (o) => Store.set('pife.prefs', Object.assign({}, Store.get('pife.prefs') || {}, o));
  function applySoundSpeed() { $('bSound').textContent = t(soundOn ? 'soundOn' : 'soundOff'); $('bSpeed').textContent = t(fast ? 'speedF' : 'speedN'); }
  function applyLang() {
    document.documentElement.lang = TAG[lang];
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('rulesBody').innerHTML = t('rulesHtml');
    $('langSel').value = lang;
    $('backLink').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    $('heroArt').innerHTML = ['1s', '2s', '3s', '13h', '13d'].map((c) => cardSvg(c)).join('');
    applySoundSpeed();
    if (S && !$('app').hidden) render();
  }

  // ---------------------------------------------------------------- cliques e arrasto
  $('table').addEventListener('click', (e) => {
    const b = e.target.closest('.pile');
    if (!b || b.disabled) return;
    dispatch({ type: b.id === 'pStock' ? 'stock' : 'pile' });
  });
  $('action').addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    const a = b.dataset.a;
    if (a === 'showEnd') showEnd();
    else if (a === 'sort') arrange();
    else if (a === 'left') moveCard(sel, sel - 1);
    else if (a === 'right') moveCard(sel, sel + 1);
    else if (a === 'discard') dispatch({ type: 'discard', i: sel });
    else dispatch({ type: a });
  });
  let drag = null;
  $('hand').addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.hcard');
    if (!b || busy) return;
    drag = { from: +b.dataset.i, x: e.clientX, moved: false, id: e.pointerId, el: b, over: null };
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (Math.abs(e.clientX - drag.x) > 10) { drag.moved = true; drag.el.classList.add('drag'); }
    if (!drag.moved) return;
    const under = document.elementFromPoint(e.clientX, e.clientY), c = under && under.closest && under.closest('.hcard');
    $('hand').querySelectorAll('.over').forEach((x) => x.classList.remove('over'));
    if (c && c !== drag.el) { c.classList.add('over'); drag.over = +c.dataset.i; } else drag.over = null;
  });
  window.addEventListener('pointerup', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (d.moved) {
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
      if (d.over != null && d.over !== d.from) moveCard(d.from, d.over); else render();
    }
  });
  let suppressClick = false;
  $('hand').addEventListener('click', (e) => {
    const b = e.target.closest('.hcard');
    if (suppressClick) { suppressClick = false; return; }
    if (!b || busy) return;
    const i = +b.dataset.i;
    // no descarte, o segundo toque na mesma carta descarta; fora dele, só seleciona para mover
    if (sel === i) {
      if (S.turn === human && S.phase === 'discard') { dispatch({ type: 'discard', i }); return; }
      sel = null;
    } else sel = i;
    render();
  });
  $('dEnd').addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (!go) return;
    const k = go.dataset.go;
    if (k === 'close') $('dEnd').close();
    else if (k === 'menu') showMenu();
    else if (k === 'next') { $('dEnd').close(); dispatch({ type: 'next' }); }
  });
  const openRules = () => { $('dRules').showModal(); $('dRules').scrollTop = 0; };
  $('bRules').addEventListener('click', openRules);
  $('bRules2').addEventListener('click', openRules);
  $('bRulesClose').addEventListener('click', () => $('dRules').close());
  $('bMenu').addEventListener('click', showMenu);
  $('bPlay').addEventListener('click', startGame);
  $('bResume').addEventListener('click', () => { const g = Store.get('pife.game'); if (g && !g.over) { S = g; sel = null; enter(); } });
  $('bSound').addEventListener('click', () => { soundOn = !soundOn; savePref({ sound: soundOn }); applySoundSpeed(); });
  $('bSpeed').addEventListener('click', () => { fast = !fast; savePref({ fast }); applySoundSpeed(); });
  $('langSel').addEventListener('change', () => { lang = $('langSel').value; savePref({ lang }); applyLang(); });
  window.addEventListener('resize', () => { if (S && !$('app').hidden) renderHandOverlap(); });

  // ---------------------------------------------------------------- início
  const prefs = Store.get('pife.prefs') || {};
  const hashLang = location.hash.slice(1), navLang = ((navigator.language || 'pt').slice(0, 2)).toLowerCase();
  lang = I18N[hashLang] ? hashLang : (prefs.lang && I18N[prefs.lang] ? prefs.lang : (I18N[navLang] ? navLang : 'pt'));
  soundOn = prefs.sound !== false; fast = !!prefs.fast;
  $('numSel').value = String(prefs.num || 3);
  $('levelSel').value = String(prefs.level == null ? 1 : prefs.level);
  $('wildSel').value = prefs.wild || 'none';
  $('wrapSel').value = prefs.wrap ? '1' : '0';
  $('targetSel').value = String(prefs.target || 3);
  applyLang();
  refreshResume();
})();
</script>
</body>
</html>
