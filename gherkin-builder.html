<style>
:root{

  --g-bg:#fbfbf9;--g-kw:#6a3fa0;--g-step:#176b5b;--g-tag:#a8520b;--g-var:#b3261e;--g-com:#6f6d68;--g-tb:#1f5f99;--g-cur:#e6f4f0;

  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#14171a;--panel:#1b1f23;--panel2:#21262a;--text:#e5e8ea;--muted:#a0a8ae;--line:#343a40;--line2:#2a2f34;
  --accent:#58c4ad;--accent-text:#0b1f1b;--accent-soft:#16332d;--danger:#ef8a80;--danger-soft:#3b211f;--warn:#e3b45a;--warn-soft:#352a14;--ok:#6cc98a;--ok-soft:#1c3522;--tip:#6db5ee;
  --g-bg:#171a1d;--g-kw:#c3a6f0;--g-step:#6fd3bd;--g-tag:#e8a765;--g-var:#f29a90;--g-com:#9a9890;--g-tb:#7fbdf0;--g-cur:#1d2f2b;
  --dt-g:#172a3c;--dt-w:#2a2240;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);color:var(--text);background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--panel2);border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
button.danger{color:var(--danger)}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px;white-space:normal;text-align:left}
button.icon{padding:3px 7px;border-color:transparent;background:none;color:var(--muted)}
button.icon:hover:not(:disabled){color:var(--text)}
input[type=text],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical}
.mono,textarea.mono{font:13px/1.5 var(--mono)}
.muted{color:var(--muted)}
.spacer{flex:1}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:none}
#topbar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#brand{font-weight:650;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-right:6px}
#brand svg{width:18px;height:18px}
#views{display:none;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#views button{border:none;border-radius:0}
#views button[aria-selected=true]{background:var(--accent);color:var(--accent-text);font-weight:600}
.lbl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.lbl select{width:auto;color:var(--text);font-size:13px;padding:4px 6px}
#lang{width:auto}
.menu{position:relative}
.menu-list{position:absolute;left:0;top:calc(100% + 3px);background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:40;min-width:250px;padding:4px}
.menu-list button{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 9px;border-radius:4px}
.menu-list button:hover:not(:disabled){background:var(--accent-soft)}
.menu-list hr{border:none;border-top:1px solid var(--line2);margin:4px 0}
#main{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(320px,38%);min-height:0}
#left{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#lefttop{padding:10px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line2)}
#tree{overflow:auto;flex:1;padding:6px 0 12px;min-height:0}
.tf{display:flex;align-items:center;gap:5px;width:100%;border:none;border-radius:0;background:none;text-align:left;padding:5px 10px;font-weight:650;white-space:normal}
.ts{display:flex;align-items:baseline;gap:6px;width:100%;border:none;border-radius:0;background:none;text-align:left;padding:4px 10px 4px 22px;white-space:normal;font-size:13px}
.tf:hover:not(:disabled),.ts:hover:not(:disabled){background:var(--line2)}
.tf.active,.ts.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ts .dot{flex:none;font-size:11px;font-weight:700;width:12px;text-align:center}
.dot.e{color:var(--danger)}.dot.w{color:var(--warn)}.dot.g{color:var(--ok)}
.ts em{font-style:normal;color:var(--tip);font-size:11px;flex:none}
.tadd{display:block;padding:3px 10px 8px 22px}
#center{overflow:auto;min-height:0;padding:16px 20px 40px}
#editor{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span,.lab{font-size:12px;color:var(--muted);font-weight:600}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.big{font-size:17px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:9px}
.card h3{margin:0;font-size:13px;font-weight:650}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:5px;align-items:center}
.step select{font-weight:600;color:var(--g-kw);padding:6px 4px}
.step .acts{display:flex}
.step-wrap{display:flex;flex-direction:column;gap:4px}
.attach{margin-left:109px;display:flex;flex-direction:column;gap:4px;padding:6px;border-left:2px solid var(--line);background:var(--panel2);border-radius:0 6px 6px 0}
.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid-wrap{overflow-x:auto}
.grid th{font-size:12px;text-align:left;color:var(--muted);font-weight:650;padding:3px 5px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono)}
.grid td{padding:2px}
.grid td input{min-width:90px;padding:4px 6px}
.grid td.x{width:26px}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--panel)}
.tags input{border:none!important;padding:2px 4px!important;width:auto!important;flex:1;min-width:110px;background:none}
.tags input:focus{outline:none}
.tags:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.tag{display:inline-flex;gap:3px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:0 3px 0 8px;font:12px var(--mono)}
.tag button{border:none;background:none;padding:0 4px;color:var(--muted)}
#empty{max-width:560px;margin:7vh auto 0;text-align:center;display:flex;flex-direction:column;gap:12px}
#empty h1{font-size:20px;margin:0}
#empty p{margin:0;color:var(--muted)}
#right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#rtabs{display:flex;gap:2px;padding:7px 10px 0;border-bottom:1px solid var(--line);flex:none}
.rt{border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:none;color:var(--muted);padding:4px 11px;margin-bottom:-1px}
.rt[aria-selected=true]{background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);color:var(--text);font-weight:600}
.rt b{background:var(--danger);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:4px}
.rt b.w{background:var(--warn);color:var(--panel)}
#actions{display:flex;gap:5px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line2);flex:none}
#rbody{overflow:auto;flex:1;min-height:0}
#gh{font:13px/1.6 var(--mono);padding:10px 0 24px;background:var(--g-bg);min-height:100%;margin:0;white-space:pre;tab-size:2}
#gh .ln{display:block;padding:0 12px;min-height:1.6em}
#gh .ln.click{cursor:pointer}
#gh .ln.click:hover{background:var(--line2)}
#gh .ln.cur{background:var(--g-cur)}
.k{color:var(--g-kw);font-weight:650}.s{color:var(--g-step);font-weight:650}.tg{color:var(--g-tag)}.v{color:var(--g-var);font-weight:600}.c{color:var(--g-com)}.tb{color:var(--g-tb)}
#issues{padding:10px;display:flex;flex-direction:column;gap:6px}
.issue{display:block;width:100%;text-align:left;white-space:normal;padding:6px 9px;border-left:3px solid var(--warn);border-radius:0 6px 6px 0;font-size:13px}
.issue.error{border-left-color:var(--danger)}.issue.tip{border-left-color:var(--tip)}
.issue small{display:block;color:var(--muted);font-size:11px}
.ok-msg{color:var(--ok);font-weight:600}
.issue.cur{background:var(--g-cur)}
#chk-open{margin-bottom:6px}
.dt-top{position:sticky;left:0;padding:8px 10px 4px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.dt-bar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.dt-ctl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.dt-ctl select{font-size:12px;max-width:100%}
.dt-sum{font-size:12px;color:var(--muted)}
.dt-leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.dt-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid;margin-right:4px;vertical-align:-1px}
.dt-svg{display:block;margin:2px 0 10px}
dialog.huge{width:96vw;height:90vh}
dialog.huge .dlg{height:90vh}
dialog.huge .b{padding:0}
@media print{.dt-top{display:none}}
.tpl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;padding:6px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.tpl:hover{background:var(--panel2)}
.tpl b{font-weight:600}.tpl small{display:block;color:var(--muted);font-size:12px}
dialog{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:0;width:min(520px,94vw);max-height:90vh;box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog.wide{width:min(760px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg header{padding:12px 16px;font-weight:650;border-bottom:1px solid var(--line2)}
.dlg .b{padding:14px 16px;overflow:auto;flex:1}
.dlg .b h4{margin:14px 0 4px}.dlg .b h4:first-child{margin-top:0}
.dlg .b p{margin:0 0 8px}.dlg .b ul{margin:0 0 8px;padding-left:18px}
.dlg .b table{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 8px}
.dlg .b td{border-bottom:1px solid var(--line2);padding:3px 8px 3px 0;vertical-align:top}
.dlg footer{padding:10px 16px;display:flex;justify-content:flex-end;gap:6px;border-top:1px solid var(--line2)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:54px;z-index:9999;display:flex;flex-direction:column;gap:6px;max-width:min(520px,92vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:7px 10px;box-shadow:0 4px 18px rgba(0,0,0,.2);display:flex;gap:10px;white-space:pre-wrap}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
.toast span{flex:1}.toast button{border:none;background:none;padding:0 3px;color:var(--muted)}
@media (max-width:1100px){#main{grid-template-columns:210px minmax(0,1fr) minmax(280px,36%)}#center{padding:12px}}
@media (max-width:900px){
  #views{display:flex}
  #main{grid-template-columns:minmax(0,1fr)}
  #left,#center,#right{display:none;border:none}
  body[data-view=list] #left,body[data-view=edit] #center,body[data-view=out] #right{display:flex;flex-direction:column}
  body[data-view=edit] #center{display:block}
}
@media (max-width:560px){
  #brand span{display:none}
  .step{grid-template-columns:82px minmax(0,1fr);}
  .step .acts{grid-column:2;justify-content:flex-end}
  .attach{margin-left:0}
  .lbl{font-size:0;gap:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  #topbar,#left,#center,#rtabs,#actions,#toasts{display:none!important}
  #main{display:block}#right{display:block!important;border:none}#rbody{overflow:visible}
  #gh{white-space:pre-wrap;background:#fff}
}
</style>
<style id="dt-css">
.dt-n{cursor:pointer;outline:none}
.dt-n rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.dt-n text{font-size:12px;fill:var(--text)}
.dt-n .k{font-weight:700}
.dt-n .m{fill:var(--muted);font-size:11px}
.dt-n.given rect{fill:var(--dt-g);stroke:var(--tip)}.dt-n.given .k{fill:var(--tip)}
.dt-n.when rect{fill:var(--dt-w);stroke:var(--g-kw)}.dt-n.when .k{fill:var(--g-kw)}
.dt-n.then rect{fill:var(--ok-soft);stroke:var(--ok)}.dt-n.then .k{fill:var(--ok)}
.dt-n.root rect{fill:var(--panel2);stroke:var(--text)}
.dt-n.leaf rect{fill:var(--panel);stroke:var(--muted)}
.dt-n.leaf .e{fill:var(--danger);font-weight:700}.dt-n.leaf .w{fill:var(--warn);font-weight:700}.dt-n.leaf .g{fill:var(--ok);font-weight:700}
.dt-n.nores rect{stroke:var(--danger);stroke-dasharray:5 3}
.dt-n.cur rect{stroke:var(--accent);stroke-width:3}
.dt-n:hover rect{stroke-width:2.5}
.dt-n:focus-visible rect{stroke:var(--accent);stroke-width:4}
.dt-e{fill:none;stroke:var(--muted);stroke-width:1.4}
.dt-e.cur{stroke:var(--accent);stroke-width:2.6}
.dt-d{fill:var(--panel);stroke:var(--text);stroke-width:1.6}
.dt-d.warn{fill:var(--warn);stroke:var(--warn)}
</style>

const HELP={
pt:`<h4>Em três passos</h4><ul><li>Dê um nome à funcionalidade.</li><li>Escreva cada cenário: a situação inicial (Dado), a ação (Quando) e o resultado esperado (Então).</li><li>Copie ou baixe o Gherkin à direita.</li></ul><h4>Para ganhar tempo</h4><table><tr><td>Enter</td><td>cria o próximo passo</td></tr><tr><td>Shift+Enter</td><td>passa para a próxima fase: Dado, Quando, Então</td></tr><tr><td>Ctrl+Enter</td><td>cria um novo cenário</td></tr><tr><td>Alt+↑ / Alt+↓</td><td>move o passo</td></tr><tr><td>Backspace em passo vazio</td><td>exclui o passo</td></tr><tr><td>Ctrl+Z / Ctrl+Y, Ctrl+S</td><td>desfaz, refaz e salva o projeto</td></tr></table><ul><li><b>Digite a palavra:</b> "quando clico em salvar" vira um passo Quando.</li><li><b>Cole várias linhas:</b> cada linha vira um passo.</li><li><b>Mesmo teste com vários dados:</b> escreva <code>&lt;valor&gt;</code> no passo, e a tabela de exemplos aparece. Dá para colar do Excel.</li><li><b>Sugerir cenários:</b> traz prontos os testes que costumam ser esquecidos.</li></ul><h4>Bons cenários</h4><ul><li>Um comportamento por cenário.</li><li>Escreva o que a pessoa quer fazer, não em qual botão clica.</li><li>O resultado esperado precisa ser algo que dê para conferir.</li></ul><p>Para entender BDD e Gherkin, veja o <a href="BDD.html" target="_blank" rel="noopener">tutorial de BDD</a>.</p><h4>Seus dados</h4><p>Tudo fica neste navegador. O app não usa rede. Salve uma cópia em Arquivo.</p><h4>Árvore de decisão</h4><ul><li>A aba <b>Árvore</b> mostra os cenários da funcionalidade como caminhos. Passos com o mesmo texto viram um caminho só, e onde os cenários se separam há um ponto de decisão.</li><li>Ela avisa quando o mesmo caminho leva a resultados diferentes, quando há cenários repetidos e quando falta resultado.</li></ul>`,
en:`<h4>In three steps</h4><ul><li>Name the feature.</li><li>Write each scenario: the starting situation (Given), the action (When) and the expected result (Then).</li><li>Copy or download the Gherkin on the right.</li></ul><h4>To save time</h4><table><tr><td>Enter</td><td>adds the next step</td></tr><tr><td>Shift+Enter</td><td>moves to the next phase: Given, When, Then</td></tr><tr><td>Ctrl+Enter</td><td>adds a new scenario</td></tr><tr><td>Alt+↑ / Alt+↓</td><td>moves the step</td></tr><tr><td>Backspace on an empty step</td><td>deletes the step</td></tr><tr><td>Ctrl+Z / Ctrl+Y, Ctrl+S</td><td>undo, redo and save the project</td></tr></table><ul><li><b>Type the keyword:</b> "when I click save" becomes a When step.</li><li><b>Paste several lines:</b> each line becomes a step.</li><li><b>Same test with several data sets:</b> write <code>&lt;value&gt;</code> in the step and the examples table appears. You can paste from Excel.</li><li><b>Suggest scenarios:</b> brings ready the tests that are usually forgotten.</li></ul><h4>Good scenarios</h4><ul><li>One behavior per scenario.</li><li>Write what the person wants to do, not which button they click.</li><li>The expected result must be something you can check.</li></ul><p>To learn about BDD and Gherkin, see the <a href="BDD.html#en" target="_blank" rel="noopener">BDD tutorial</a>.</p><h4>Your data</h4><p>Everything stays in this browser. The app uses no network. Save a copy under File.</p><h4>Decision tree</h4><ul><li>The <b>Tree</b> tab shows the feature's scenarios as paths. Steps with the same text share one path, and where scenarios part ways there is a decision point.</li><li>It warns when the same path leads to different results, when scenarios repeat and when a result is missing.</li></ul>`,
it:`<h4>In tre passi</h4><ul><li>Dai un nome alla funzionalità.</li><li>Scrivi ogni scenario: la situazione iniziale (Dato), l'azione (Quando) e il risultato atteso (Allora).</li><li>Copia o scarica il Gherkin a destra.</li></ul><h4>Per risparmiare tempo</h4><table><tr><td>Invio</td><td>crea il passo successivo</td></tr><tr><td>Maiusc+Invio</td><td>passa alla fase seguente: Dato, Quando, Allora</td></tr><tr><td>Ctrl+Invio</td><td>crea un nuovo scenario</td></tr><tr><td>Alt+↑ / Alt+↓</td><td>sposta il passo</td></tr><tr><td>Backspace su un passo vuoto</td><td>elimina il passo</td></tr><tr><td>Ctrl+Z / Ctrl+Y, Ctrl+S</td><td>annulla, ripeti e salva il progetto</td></tr></table><ul><li><b>Digita la parola:</b> "quando clicco su salva" diventa un passo Quando.</li><li><b>Incolla più righe:</b> ogni riga diventa un passo.</li><li><b>Stesso test con più dati:</b> scrivi <code>&lt;valore&gt;</code> nel passo e appare la tabella degli esempi. Puoi incollare da Excel.</li><li><b>Suggerisci scenari:</b> propone già pronti i test che di solito si dimenticano.</li></ul><h4>Buoni scenari</h4><ul><li>Un comportamento per scenario.</li><li>Scrivi ciò che la persona vuole fare, non quale pulsante clicca.</li><li>Il risultato atteso deve essere qualcosa di verificabile.</li></ul><p>Per capire BDD e Gherkin, vedi il <a href="BDD.html#it" target="_blank" rel="noopener">tutorial di BDD</a>.</p><h4>I tuoi dati</h4><p>Tutto resta in questo browser. L'app non usa la rete. Salva una copia da File.</p><h4>Albero di decisione</h4><ul><li>La scheda <b>Albero</b> mostra gli scenari della funzionalità come percorsi. I passi con lo stesso testo condividono un percorso, e dove gli scenari si separano c'è un punto di decisione.</li><li>Avvisa quando lo stesso percorso porta a risultati diversi, quando ci sono scenari ripetuti e quando manca un risultato.</li></ul>`,
es:`<h4>En tres pasos</h4><ul><li>Da un nombre a la funcionalidad.</li><li>Escribe cada escenario: la situación inicial (Dado), la acción (Cuando) y el resultado esperado (Entonces).</li><li>Copia o descarga el Gherkin de la derecha.</li></ul><h4>Para ganar tiempo</h4><table><tr><td>Enter</td><td>crea el siguiente paso</td></tr><tr><td>Mayús+Enter</td><td>pasa a la siguiente fase: Dado, Cuando, Entonces</td></tr><tr><td>Ctrl+Enter</td><td>crea un nuevo escenario</td></tr><tr><td>Alt+↑ / Alt+↓</td><td>mueve el paso</td></tr><tr><td>Retroceso en un paso vacío</td><td>elimina el paso</td></tr><tr><td>Ctrl+Z / Ctrl+Y, Ctrl+S</td><td>deshacer, rehacer y guardar el proyecto</td></tr></table><ul><li><b>Escribe la palabra:</b> "cuando hago clic en guardar" se convierte en un paso Cuando.</li><li><b>Pega varias líneas:</b> cada línea se convierte en un paso.</li><li><b>La misma prueba con varios datos:</b> escribe <code>&lt;valor&gt;</code> en el paso y aparece la tabla de ejemplos. Se puede pegar desde Excel.</li><li><b>Sugerir escenarios:</b> trae listas las pruebas que suelen olvidarse.</li></ul><h4>Buenos escenarios</h4><ul><li>Un comportamiento por escenario.</li><li>Escribe lo que la persona quiere hacer, no en qué botón hace clic.</li><li>El resultado esperado debe ser algo que se pueda comprobar.</li></ul><p>Para entender BDD y Gherkin, mira el <a href="BDD.html#es" target="_blank" rel="noopener">tutorial de BDD</a>.</p><h4>Tus datos</h4><p>Todo se queda en este navegador. La aplicación no usa la red. Guarda una copia en Archivo.</p><h4>Árbol de decisión</h4><ul><li>La pestaña <b>Árbol</b> muestra los escenarios de la funcionalidad como caminos. Los pasos con el mismo texto comparten un camino, y donde los escenarios se separan hay un punto de decisión.</li><li>Avisa cuando el mismo camino lleva a resultados distintos, cuando hay escenarios repetidos y cuando falta un resultado.</li></ul>`,
};
function t(key,...a){const e=I18N[key];let s=e?e[LANGS.indexOf(LANG)]:key;a.forEach((v,i)=>{s=s.split('{'+i+'}').join(String(v))});return s}

  vague:['funciona','correctamente','como se espera','ok','normalmente'],ui:['hago clic','pulso','botón','boton','escribo en el campo','relleno el campo','xpath','selector'],stepPh:'que el cliente está registrado'},

const KWS=['given','when','then','and','but'];
const PHASE={given:'given',when:'when',then:'then'};

/* ========== utilitários ========== */
const $=(q,r=document)=>r.querySelector(q);
const $$=(q,r=document)=>[...r.querySelectorAll(q)];
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;
    else if(k==='checked'||k==='disabled'||k==='selected')e[k]=!!v;
    else if(k==='html')e.innerHTML=v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));
  return e;
}
let uidN=0;
const uid=p=>p+Date.now().toString(36)+(++uidN).toString(36);
const store={get(k,d){try{const v=localStorage.getItem('ghbuild.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('ghbuild.'+k,JSON.stringify(v))}catch{}}};
function toast(msg,kind='ok',ms){
  const d=h('div',{class:'toast '+kind},h('span',null,msg),h('button',{'aria-label':t('close'),onclick(){d.remove()}},'×'));
  $('#toasts').append(d);setTimeout(()=>d.remove(),ms||(kind==='err'?7000:3200));
}
function download(data,name,type='application/octet-stream'){
  const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));
  const a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function modal({title,body,actions,wide,onclose}){
  const d=h('dialog',{class:wide?'wide':''});
  const close=()=>{d.close();d.remove();onclose&&onclose()};
  const foot=(actions||[{label:t('close'),primary:true}]).map(a=>h('button',{class:a.primary?'primary':a.danger?'danger':'',onclick(){if(a.run&&a.run()===false)return;close()}},a.label));
  d.append(h('div',{class:'dlg'},h('header',null,title),h('div',{class:'b'},body),h('footer',null,foot)));
  d.addEventListener('cancel',e=>{e.preventDefault();close()});
  document.body.append(d);d.showModal();return d;
}
const slug=s=>String(s||'funcionalidade').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,60)||'funcionalidade';
async function copyText(s){
  try{await navigator.clipboard.writeText(s);toast(t('copied'));return}catch{}
  const a=h('textarea',{style:'position:fixed;opacity:0'});a.value=s;document.body.append(a);a.select();
  let ok=false;try{ok=document.execCommand('copy')}catch{}
  a.remove();toast(ok?t('copied'):t('copyFail'),ok?'ok':'err');
}

/* ========== modelo ========== */
const newProject=()=>({app:'gherkin-builder',v:1,lang:'pt',features:[]});
const newFeature=name=>({id:uid('f'),name:name||'',as:'',want:'',so:'',desc:'',tags:[],background:[],scenarios:[]});
const newStep=(kw,text)=>({id:uid('p'),kw:kw||'given',text:text||'',table:null,doc:null});
const newScenario=(name)=>({id:uid('s'),name:name||'',desc:'',tags:[],steps:[newStep('given')],examples:[]});
const str=v=>v==null?'':String(v);
function cleanTag(s){return String(s).trim().replace(/^@+/,'').replace(/[\s#@]+/g,'-').replace(/^-+|-+$/g,'')}
function normSteps(a){
  return(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object').map(x=>({id:uid('p'),kw:KWS.includes(x.kw)?x.kw:'and',text:str(x.text).replace(/\s*\n\s*/g,' '),
    table:Array.isArray(x.table)&&x.table.length?normGrid(x.table):null,doc:x.doc==null?null:str(x.doc)}));
}
function normGrid(g){const w=Math.max(1,...g.map(r=>Array.isArray(r)?r.length:0));return g.map(r=>{const a=(Array.isArray(r)?r:[]).map(str);while(a.length<w)a.push('');return a})}
function normRow(r){const o=Object.create(null);if(r&&typeof r==='object')for(const k of Object.keys(r))o[k]=str(r[k]);return o}
function normFeature(f){
  const x=newFeature(str(f.name));
  for(const k of['as','want','so','desc'])x[k]=str(f[k]);
  x.name=x.name.replace(/\s*\n\s*/g,' ');
  x.tags=(Array.isArray(f.tags)?f.tags:[]).map(cleanTag).filter(Boolean);
  x.background=normSteps(f.background);
  x.scenarios=(Array.isArray(f.scenarios)?f.scenarios:[]).filter(s=>s&&typeof s==='object').map(s=>({id:uid('s'),name:str(s.name).replace(/\s*\n\s*/g,' '),desc:str(s.desc),tags:(Array.isArray(s.tags)?s.tags:[]).map(cleanTag).filter(Boolean),steps:normSteps(s.steps),examples:(Array.isArray(s.examples)?s.examples:[]).map(normRow)}));
  return x;
}
function loadProject(o){
  if(!o||typeof o!=='object'||o.app!=='gherkin-builder'||!Array.isArray(o.features))throw new Error(t('notProject'));
  const p=newProject();p.lang=LANGS.includes(o.lang)?o.lang:'pt';
  p.features=o.features.filter(f=>f&&typeof f==='object').map(normFeature);
  return p;
}
const VAR_RE=/<([^<>\s](?:[^<>\n]*[^<>\s])?)>/g;
function varsOf(s){
  const out=[],add=x=>{for(const m of String(x||'').matchAll(VAR_RE))if(!out.includes(m[1]))out.push(m[1])};
  add(s.name);
  for(const st of s.steps){add(st.text);if(st.table)st.table.forEach(r=>r.forEach(add));add(st.doc)}
  return out;
}
const stepsOut=a=>a.filter(s=>s.text.trim()||s.table||s.doc!=null);
function phaseOf(steps,i){for(let j=i;j>=0;j--)if(PHASE[steps[j].kw])return steps[j].kw;return null}

/* ========== geração ========== */
const escCell=v=>String(v).replace(/\\/g,'\\\\').replace(/\|/g,'\\|').replace(/\n/g,'\\n');
function tableLines(rows,pad,sid,headerVars){
  const cells=rows.map(r=>r.map(escCell)),w=[];
  cells.forEach(r=>r.forEach((c,i)=>{w[i]=Math.max(w[i]||0,c.length)}));
  return cells.map(r=>({sid,ind:pad,p:[['tb','| '+r.map((c,i)=>c.padEnd(w[i])).join(' | ')+' |']]}));
}
function descLines(text,pad,sid){
  const out=[];const ls=String(text||'').split(/\r?\n/);
  while(ls.length&&!ls[ls.length-1].trim())ls.pop();
  for(const l of ls)out.push({sid,ind:l.trim()?pad:'',p:[['',l.trim()]]});
  return out;
}
function stepLines(steps,lang,sid){
  const g=GK[lang],out=[];
  for(const st of stepsOut(steps)){
    out.push({sid,ind:'    ',p:[['s',g[st.kw]+' '],...varParts(st.text.trim())]});
    if(st.table)out.push(...tableLines(st.table,'      ',sid));
    if(st.doc!=null){
      out.push({sid,ind:'      ',p:[['c','"""']]});
      for(const l of st.doc.split(/\r?\n/))out.push({sid,ind:l?'      ':'',p:[['',l.replace(/"""/g,'\\"\\"\\"')]]});
      out.push({sid,ind:'      ',p:[['c','"""']]});
    }
  }
  return out;
}
function varParts(s){
  const out=[];let last=0;
  for(const m of s.matchAll(VAR_RE)){if(m.index>last)out.push(['',s.slice(last,m.index)]);out.push(['v',m[0]]);last=m.index+m[0].length}
  if(last<s.length)out.push(['',s.slice(last)]);
  return out;
}
function scenarioLines(s,lang){
  const g=GK[lang],out=[],vars=varsOf(s),sid=s.id;
  if(s.tags.length)out.push({sid,ind:'  ',p:[['tg',s.tags.map(x=>'@'+x).join(' ')]]});
  out.push({sid,ind:'  ',p:[['k',(vars.length?g.outline:g.scenario)+':'],['',s.name.trim()?' ':''],...varParts(s.name.trim())]});
  if(s.desc.trim())out.push(...descLines(s.desc,'    ',sid));
  out.push(...stepLines(s.steps,lang,sid));
  if(vars.length){
    out.push({sid,ind:'',p:[['','']]});
    out.push({sid,ind:'    ',p:[['k',g.examples+':']]});
    out.push(...tableLines([vars,...s.examples.map(r=>vars.map(v=>r[v]||''))],'      ',sid));
  }
  return out;
}
function featureLines(f,lang){
  const g=GK[lang],out=[{ind:'',p:[['c','# language: '+lang]]}];
  if(f.tags.length)out.push({ind:'',p:[['tg',f.tags.map(x=>'@'+x).join(' ')]]});
  out.push({ind:'',p:[['k',g.feature+':'],['',f.name.trim()?' '+f.name.trim():'']]});
  for(const k of['as','want','so'])if(f[k].trim())out.push({ind:'  ',p:[['k',g[k]+' '],['',f[k].trim().replace(/\s*\n\s*/g,' ')]]});
  if(f.desc.trim()){if(f.as.trim()||f.want.trim()||f.so.trim())out.push({ind:'',p:[['','']]});out.push(...descLines(f.desc,'  ',null))}
  if(stepsOut(f.background).length){
    out.push({ind:'',p:[['','']]});
    out.push({ind:'  ',p:[['k',g.background+':']]});
    out.push(...stepLines(f.background,lang,null));
  }
  for(const s of f.scenarios){out.push({sid:s.id,ind:'',p:[['','']]});out.push(...scenarioLines(s,lang))}
  return out;
}
const linesText=ls=>ls.map(l=>l.ind+l.p.map(x=>x[1]).join('')).join('\n').replace(/[ \t]+$/gm,'')+'\n';
const featureText=(f,lang)=>linesText(featureLines(f,lang));
function scenarioText(s,lang){return linesText(scenarioLines(s,lang).map(l=>({...l,ind:l.ind.slice(2)})))}

/* ========== importação de Gherkin ========== */
function parseGherkin(src,defLang){
  const lines=String(src).replace(/^\uFEFF/,'').split(/\r?\n/),warn=new Set();
  let lang=null;
  for(const l of lines){const m=/^\s*#\s*language\s*:\s*([\w-]+)\s*$/.exec(l);if(m){lang=m[1];break}if(l.trim()&&!l.trim().startsWith('#'))break}
  if(lang&&!GK[lang])throw new Error(t('badLang',lang));
  const hasFeature=(lg)=>lines.some(l=>GK[lg].a.feature.some(k=>l.trim().startsWith(k+':')));
  if(!lang){lang=[defLang,'en',...LANGS].find(l=>GK[l]&&hasFeature(l));if(!lang)throw new Error(t('noFeature'))}
  const g=GK[lang],A=g.a,kwLine=(list,s)=>{for(const k of list)if(s.startsWith(k+':'))return s.slice(k.length+1).trim();return null};
  const stepKw=[];for(const k of KWS)for(const w of A[k])stepKw.push([k,w+' ']);stepKw.push(['and','* ']);stepKw.sort((a,b)=>b[1].length-a[1].length);
  const features=[];let f=null,cur=null,mode='',tags=[],st=null,grid=null,docEnd=null,doc=[],docInd=0,sawExamples=false,narr=true;
  const unesc=c=>c.replace(/\\(\\|\||n)/g,(_,x)=>x==='n'?'\n':x);
  const cells=s=>{const o=[];let b='',i=s.indexOf('|')+1;for(;i<s.length;i++){const c=s[i];if(c==='\\'&&i+1<s.length){b+=c+s[++i];continue}if(c==='|'){o.push(unesc(b.trim()));b='';continue}b+=c}return o};
  let ln=0,exHead=null,exBlocks=0;
  const flushEx=()=>{};
  for(const raw of lines){
    ln++;
    if(docEnd){
      if(raw.trim()===docEnd){st.doc=doc.join('\n');docEnd=null;continue}
      let l=raw;let n=0;while(n<docInd&&l[n]===' ')n++;l=l.slice(n);
      doc.push(l.replace(/\\"\\"\\"/g,'"""'));continue;
    }
    const s=raw.trim();
    if(!s)continue;
    if(s.startsWith('#')){if(!/^#\s*language\s*:/.test(s))warn.add('impComments');continue}
    if(s.startsWith('@')){tags.push(...s.split(/\s+/).filter(x=>x.startsWith('@')).map(cleanTag).filter(Boolean));continue}
    let v;
    if((v=kwLine(A.feature,s))!=null){f=newFeature(v);f.tags=tags;tags=[];features.push(f);cur=null;mode='feature';narr=true;st=null;continue}
    if(!f)throw new Error(t('lineErr',ln,s.slice(0,50)));
    if((v=kwLine(A.rule,s))!=null){warn.add('impRule');tags=[];mode='rule';cur=null;st=null;continue}
    if((v=kwLine(A.background,s))!=null){mode='bg';cur=null;st=null;continue}
    if((v=kwLine([...A.outline,...A.scenario].sort((a,b)=>b.length-a.length),s))!=null){cur={id:uid('s'),name:v,desc:'',tags,steps:[],examples:[]};tags=[];f.scenarios.push(cur);mode='scen';st=null;exHead=null;exBlocks=0;continue}
    if((v=kwLine(A.examples,s))!=null){if(!cur)throw new Error(t('lineErr',ln,s.slice(0,50)));exBlocks++;if(exBlocks>1||tags.length||v)warn.add('impExamples');tags=[];mode='ex';exHead=null;st=null;continue}
    if(s.startsWith('"""')||s.startsWith('```')){
      if(!st)throw new Error(t('lineErr',ln,s.slice(0,50)));
      docEnd=s.slice(0,3);docInd=raw.indexOf(docEnd);doc=[];continue;
    }
    if(s.startsWith('|')){
      const c=cells(s);
      if(mode==='ex'){
        if(!exHead)exHead=c;
        else{const o=Object.create(null);exHead.forEach((k,i)=>{o[k]=c[i]||''});cur.examples.push(o)}
        continue;
      }
      if(!st)throw new Error(t('lineErr',ln,s.slice(0,50)));
      (st.table||(st.table=[])).push(c);continue;
    }
    if(mode==='bg'||mode==='scen'){
      const hit=stepKw.find(([,w])=>s.startsWith(w));
      if(hit){st=newStep(hit[0],s.slice(hit[1].length).trim());(mode==='bg'?f.background:cur.steps).push(st);continue}
      if(!st&&mode==='scen'){cur.desc+=(cur.desc?'\n':'')+s;continue}
      if(!st&&mode==='bg')continue;
      throw new Error(t('lineErr',ln,s.slice(0,50)));
    }
    if(mode==='feature'){
      if(!f.as&&s.startsWith(g.as+' '))f.as=s.slice(g.as.length+1);
      else if(!f.want&&s.startsWith(g.want+' '))f.want=s.slice(g.want.length+1);
      else if(!f.so&&s.startsWith(g.so+' '))f.so=s.slice(g.so.length+1);
      else f.desc+=(f.desc?'\n':'')+s;
      continue;
    }
    if(mode==='rule')continue;
    throw new Error(t('lineErr',ln,s.slice(0,50)));
  }
  if(!features.length)throw new Error(t('noFeature'));
  return{lang,features,warn:[...warn]};
}

function wordIn(text,w){const e=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return new RegExp('(^|[^\\p{L}])'+e+'($|[^\\p{L}])','iu').test(text)}
function checkProject(p){
  const out=[],lang=p.lang,g=GK[lang];
  const add=(sev,fid,sid,msg)=>out.push({sev,fid,sid,msg});
  const badDesc=(line,inScen)=>{
    const s=line.trim();if(!s)return false;
    if(s[0]==='@'||s[0]==='#'||s.startsWith('"""')||s.startsWith('```'))return true;
    const kws=[...g.a.feature,...g.a.background,...g.a.scenario,...g.a.outline,...g.a.examples,...g.a.rule];
    if(kws.some(k=>s.startsWith(k+':')))return true;
    if(inScen&&(s.startsWith('* ')||KWS.some(k=>g.a[k].some(w=>s.startsWith(w+' ')))))return true;
    if(inScen&&s[0]==='|')return true;
    return false;
  };
  for(const f of p.features){
    const fn=f.name.trim()||t('untitledF');
    if(!f.name.trim())add('warn',f.id,null,t('iNoName'));
    if(!f.scenarios.length)add('tip',f.id,null,t('iNoScen',fn));
    for(const l of f.desc.split('\n'))if(badDesc(l,false))add('error',f.id,null,t('iBadDesc',fn,l.trim().slice(0,40)));
    const bg=stepsOut(f.background);
    for(const st of bg)if(st.kw==='when'||st.kw==='then')add('warn',f.id,null,t('iBgAct',fn,st.text.trim().slice(0,40)));
    const seen=new Map();
    for(const s of f.scenarios){
      const nm=s.name.trim();
      if(!nm)add('warn',f.id,s.id,t('iNoTitle',fn));
      else{const k=nm.toLowerCase();if(seen.has(k))add('warn',f.id,s.id,t('iDup',fn,nm));seen.set(k,1)}
      const sn=nm||t('untitledS'),st=stepsOut(s.steps);
      for(const l of s.desc.split('\n'))if(badDesc(l,true))add('error',f.id,s.id,t('iBadDesc',sn,l.trim().slice(0,40)));
      if(!st.length){add('error',f.id,s.id,t('iNoSteps',sn));continue}
      const phases=st.map((_,i)=>phaseOf(st,i));
      const iW=st.findIndex(x=>x.kw==='when'),iT=st.findIndex(x=>x.kw==='then'),hasG=st.some(x=>x.kw==='given')||bg.length>0;
      if(iT<0)add('error',f.id,s.id,t('iNoThen',sn,g.then));
      if(iW<0)add('warn',f.id,s.id,t('iNoWhen',sn,g.when));
      if(!hasG)add('tip',f.id,s.id,t('iNoGiven',sn,g.given));
      if(iW>=0&&iT>=0&&iT<iW)add('warn',f.id,s.id,t('iOrder',sn,g.then,g.when));
      if(st.filter(x=>x.kw==='when').length>1)add('warn',f.id,s.id,t('iManyWhen',sn,g.when));
      if(st.length>8)add('tip',f.id,s.id,t('iLong',sn,st.length));
      if(st[0].kw==='and'||st[0].kw==='but')add('warn',f.id,s.id,t('iFirstAnd',sn,g[st[0].kw]));
      let fill=/\[[^\]\n]+\]/.test(nm);
      st.forEach((x,i)=>{
        if(/\[[^\]\n]+\]/.test(x.text))fill=true;
        const ph=phases[i];
        if(ph==='then')for(const w of g.vague)if(wordIn(x.text,w)){add('warn',f.id,s.id,t('iVague',sn,x.text.trim().slice(0,50)));break}
        if(ph==='when'||ph==='given')for(const w of g.ui)if(wordIn(x.text,w)){add('tip',f.id,s.id,t('iUi',sn,x.text.trim().slice(0,50)));break}
      });
      const vars=varsOf(s);
      if(vars.length){
        const rows=s.examples;
        for(const v of vars)if(!rows.some(r=>String(r[v]||'').trim()))add('error',f.id,s.id,t('iExEmpty',sn,v));
        if(rows.length>1&&rows.some(r=>vars.every(v=>!String(r[v]||'').trim())))add('warn',f.id,s.id,t('iExBlank',sn));
        const sig=rows.map(r=>vars.map(v=>r[v]||'').join('\u0001'));
        if(new Set(sig).size<sig.length&&sig.every(x=>x.replace(/\u0001/g,'').trim()))add('warn',f.id,s.id,t('iExDup',sn));
        for(const r of rows)for(const v of vars)if(/\[[^\]\n]+\]/.test(r[v]||''))fill=true;
      }
      if(fill)add('warn',f.id,s.id,t('iFill',sn));
    }
  }
  return out;
}

/* ========== zip sem compressão ========== */
const CRC=(()=>{const a=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;a[n]=c>>>0}return a})();
function crc32(b){let c=~0;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(~c)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=v=>[v&255,v>>>8&255],u32=v=>[v&255,v>>>8&255,v>>>16&255,v>>>24&255];
  const d=new Date(),time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const common=[...u16(20),...u16(0x0800),...u16(0),...u16(time),...u16(date),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
    const head=new Uint8Array([0x50,0x4b,3,4,...common]);
    parts.push(head,name,data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=head.length+name.length+data.length;
  }
  const size=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(size),...u32(off),0,0]);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

function pressEnd(){
  if(!press.on)return;

  const q=[...press.q];press.q.clear();
  if(q.length)setTimeout(()=>q.forEach(f=>f()),0);
}
document.addEventListener('pointerdown',()=>{press.on=true;clearTimeout(press.t);press.t=setTimeout(pressEnd,1000)},true);

/* os ids mudam na normalização: reaproveita a seleção pela posição */
function restore(j){
  const fi=S.p.features.findIndex(f=>f.id===S.fid),f=feat(),si=f?f.scenarios.findIndex(s=>s.id===S.sid):-1;
  S.p=loadProject(JSON.parse(j));
  const nf=S.p.features[Math.min(fi,S.p.features.length-1)]||null;
  S.fid=nf?nf.id:null;S.sid=nf&&si>=0&&nf.scenarios.length?nf.scenarios[Math.min(si,nf.scenarios.length-1)].id:null;
  S.history[S.hIdx]=JSON.stringify(S.p);

}

function renderDatalists(){

    for(const s of f.scenarios){s.tags.forEach(x=>tags.add(x));for(const st of s.steps)if(st.text.trim())steps.add(st.text.trim())}

/* grade editável: colar do Excel preenche várias células */
function gridEditor({cols,rows,get,set,addRow,delRow,header,label}){
  const tbl=h('table',{class:'grid'});
  const nav=(r,c)=>{const e=tbl.querySelector(`input[data-r="${r}"][data-c="${c}"]`);if(e){e.focus();e.select()}};
  const draw=(fr,fc)=>{
    const n=rows();tbl.replaceChildren();
    if(header)tbl.append(h('thead',null,h('tr',null,cols().map(x=>h('th',null,x)),h('th',null))));
    const tb=h('tbody');
    for(let r=0;r<n;r++){
      tb.append(h('tr',null,cols().map((col,c)=>{
        const i=h('input',{type:'text','data-r':r,'data-c':c,'aria-label':t('cellOf',col,r+1)});i.value=get(r,c);
        i.addEventListener('input',()=>{set(r,c,i.value);live()});
        i.addEventListener('change',()=>record());
        i.addEventListener('keydown',e=>{
          if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();e.stopPropagation();if(r===rows()-1){addRow();commit();draw(r+1,c)}else nav(r+1,c)}
          else if(e.key==='ArrowDown'&&r<rows()-1){e.preventDefault();nav(r+1,c)}
          else if(e.key==='ArrowUp'&&r>0){e.preventDefault();nav(r-1,c)}
        });
        i.addEventListener('paste',e=>{
          const txt=(e.clipboardData||{}).getData?e.clipboardData.getData('text'):'';
          if(!/[\t\n]/.test(txt))return;
          e.preventDefault();
          const lines=txt.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
          lines.forEach((l,dr)=>{while(r+dr>=rows())addRow();l.forEach((v,dc)=>{if(c+dc<cols().length)set(r+dr,c+dc,v.trim())})});
          commit();draw(r,c);
        });
        return h('td',null,i);
      }),h('td',{class:'x'},h('button',{class:'icon','aria-label':t('removeRow'),title:t('removeRow'),disabled:n<=1&&header,onclick(){delRow(r);commit();draw()}},'×'))));
    }
    tbl.append(tb);
    if(fr!=null)nav(fr,fc);
  };
  draw();
  return{el:h('div',{class:'grid-wrap','aria-label':label||null},tbl),draw};
}

/* ========== árvore de decisão ========== */
const DT_MAX=300,DT={W:224,LW:196,GX:46,GY:12,PAD:9,LH:16,M:12};
const dtCtx=document.createElement('canvas').getContext('2d');
function dtWrap(text,max){
  const rows=[];let cur='';
  const fits=x=>dtCtx.measureText(x).width<=max;
  for(let w of String(text).split(/\s+/).filter(Boolean)){
    while(!fits(w)){let n=w.length;while(n>1&&!fits(w.slice(0,n)))n--;if(cur){rows.push(cur);cur=''}rows.push(w.slice(0,n));w=w.slice(n)}
    const x=cur?cur+' '+w:w;
    if(fits(x))cur=x;else{rows.push(cur);cur=w}
  }
  if(cur||!rows.length)rows.push(cur);
  return rows;
}
/* junta os passos iguais do início de cada cenário em uma árvore de prefixos */
function dtModel(f,o){
  const g=GK[S.p.lang],rank={when:0,given:1,then:2};
  const root={k:'root',lines:[],kids:[],sids:new Set(),path:'0'};
  const rowsOf=s=>{const v=varsOf(s);return o.rows&&v.length&&s.examples.length?s.examples:[null]};
  const many=f.scenarios.reduce((a,s)=>a+rowsOf(s).length,0)>DT_MAX;
  const add=(par,n)=>{n.path=par.path+'.'+par.kids.length;par.kids.push(n);return n};
  for(const s of f.scenarios){
    const v=varsOf(s),rows=many?[null]:rowsOf(s);
    rows.forEach((row,ri)=>{
      let ph='given';const seq=[];
      for(const st of stepsOut(s.steps)){
        if(PHASE[st.kw])ph=st.kw;
        let tx=st.text.trim();
        if(row)tx=tx.replace(VAR_RE,(m,x)=>v.includes(x)?str(row[x]):m);
        if(st.table)tx+=' ▦';
        if(st.doc!=null)tx+=' ¶';
        seq.push({ph,kw:g[st.kw],tx,key:[ph,tx.toLowerCase().replace(/\s+/g,' '),JSON.stringify(st.table),st.doc||''].join('\u0001')});
      }
      if(o.order==='when')seq.sort((a,b)=>rank[a.ph]-rank[b.ph]);
      let n=root;root.sids.add(s.id);
      for(const x of seq){
        n=n.kids.find(c=>c.key===x.key)||add(n,{k:x.ph,key:x.key,lines:[{kw:x.kw,tx:x.tx}],kids:[],sids:new Set()});
        n.sids.add(s.id);
      }
      add(n,{k:'leaf',kids:[],sids:new Set([s.id]),sid:s.id,name:s.name.trim()||t('untitledS'),row:row?ri+1:null,count:!row&&v.length?s.examples.length:0,noThen:!seq.some(x=>x.ph==='then')});
    });
  }
  const nm=n=>f.scenarios.filter(s=>n.sids.has(s.id)).map(s=>s.name.trim()||t('untitledS')),seen=new Set(),alerts=[];
  const alert=(msg,sid)=>{if(!seen.has(msg)){seen.add(msg);alerts.push({msg,sid})}};
  let decisions=0,paths=0;
  const walk=n=>{
    if(n.k==='leaf'){paths++;if(n.noThen)alert(t('dtNoThen',n.name),n.sid);return}
    const leaves=n.kids.filter(c=>c.k==='leaf'),thens=n.kids.filter(c=>c.k==='then');
    n.split=n.kids.length>1&&leaves.length<n.kids.length;
    if(n.split)decisions++;
    n.conflict=thens.length>1;
    if(n.conflict)alert(t('dtConflict',nm(n).join(', ')),[...n.sids][0]);
    const distinct=new Set(leaves.map(c=>c.sid));
    if(distinct.size>1)alert(t('dtDup',f.scenarios.filter(s=>distinct.has(s.id)).map(s=>s.name.trim()||t('untitledS')).join(', ')),[...distinct][0]);
    n.kids.forEach(walk);
  };
  walk(root);
  /* passos seguidos da mesma fase, sem ramificação, ficam no mesmo bloco */
  const pack=n=>{

  root.kw=g.feature;

}
function dtLayout(root){
  const{W,LW,GX,GY,PAD,LH}=DT;
  const size=n=>{
    const w=n.k==='leaf'?LW:W,max=w-PAD*2;let rows=[];
    if(n.k==='leaf'){
      rows=dtWrap('✓ '+n.name,max).map((x,i)=>({x,leaf:i===0}));
      const extra=n.row?t('dtLine',n.row):n.count?'×'+n.count:'';
      if(extra)rows.push({x:extra,m:true});
      if(n.noThen)rows.push({x:t('dtNoRes'),m:true});
    }else{
      if(n.k==='root')dtWrap(n.kw+': '+n.title,max).forEach((x,i)=>rows.push({x,kw:i===0?n.kw.length+1:0}));
      for(const l of n.lines)dtWrap(l.kw+' '+l.tx,max).forEach((x,i)=>rows.push({x,kw:i===0?l.kw.length:0}));
    }
    n.w=w;n.rows=rows;n.h=PAD*2+rows.length*LH;
    n.kids.forEach(size);
    const sum=n.kids.reduce((a,c)=>a+c.bh,0)+GY*Math.max(0,n.kids.length-1);
    n.kh=sum;n.bh=Math.max(n.h,sum);
  };
  dtCtx.font='600 12px '+getComputedStyle(document.body).fontFamily;
  size(root);
  let right=0;
  const place=(n,x,top)=>{
    n.x=x;n.y=top+(n.bh-n.h)/2;right=Math.max(right,x+n.w);
    let c=top+(n.bh-n.kh)/2;
    for(const k of n.kids){place(k,x+W+GX,c);c+=k.bh+GY}
  };
  place(root,DT.M,DT.M);
  return{w:right+DT.M,h:root.bh+DT.M*2};
}
const SVGNS='http://www.w3.org/2000/svg';

  document.addEventListener('pointerdown',away,true);document.addEventListener('keydown',esc,true);
  S.menuClose=close;S.menuBtn=btn;list.querySelector('button')?.focus();
}
function fileMenu(){
  const has=S.p.features.length>0;
  openMenu($('#b-file'),[
    {label:t('fNew'),run(){confirmReplace(()=>{const p=newProject();p.lang=LANG;setProject(p)})}},
    {label:t('fSample'),run:openSample},
    '-',
    {label:t('fImport'),run(){$('#file-in').click()}},
    {label:t('fPaste'),run:pasteDialog},
    '-',
    {label:t('fSave'),run:saveJson},
    {label:t('fZip'),disabled:!has,run:downloadZip},
    {label:t('fPrint'),disabled:!has,run(){S.right='gh';renderRight();window.print()}},
  ]);
}
function saveJson(){record();download(JSON.stringify(S.p,null,2),'gherkin-projeto.json','application/json');toast(t('saved'))}
function importText(txt){
  const r=parseGherkin(txt,S.p.lang);
  if(!S.p.features.length)S.p.lang=r.lang;
  const fs=r.features.map(normFeature);
  S.p.features.push(...fs);
  S.fid=fs[0].id;S.sid=null;
  return{n:fs.length,warn:r.warn};
}
function afterImport(n,warn){
  commit();applyStatic();renderEditor();
  toast(t('imported',n));
  for(const w of warn)toast(t(w),'warn',6000);
}
function pasteDialog(){
  const ta=h('textarea',{class:'mono',rows:12,'aria-label':t('pasteTitle')});
  modal({title:t('pasteTitle'),wide:true,body:h('div',null,h('p',null,t('pasteHint')),ta),actions:[{label:t('cancel')},{label:t('pasteDo'),primary:true,run(){
    try{const r=importText(ta.value);afterImport(r.n,r.warn)}catch(e){toast(t('badFile',e.message),'err');return false}
  }}]});
  setTimeout(()=>ta.focus(),0);
}
$('#file-in').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';let n=0;const warn=new Set();
  for(const f of files){
    try{
      if(f.size>10*1024*1024)throw new Error(t('tooBig'));
      const txt=await f.text();
      if(/\.json$/i.test(f.name)||/^\s*\{/.test(txt)){
        const p=loadProject(JSON.parse(txt));
        await new Promise(res=>confirmReplaceP(()=>{setProject(p);res()},res));
      }else{const r=importText(txt);n+=r.n;r.warn.forEach(x=>warn.add(x))}
    }catch(err){toast(t('badFile',err.message),'err')}
  }
  if(n)afterImport(n,[...warn]);
});
function confirmReplaceP(run,done){
  if(!S.p.features.length){run();return}
  modal({title:t('confirmNew'),body:h('p',null,t('confirmNewText')),actions:[{label:t('cancel'),run:done},{label:t('confirm'),danger:true,run}],onclose:done});
}

/* ========== início ========== */
function setLang(l,keep){
  LANG=LANGS.includes(l)?l:'pt';store.set('lang',LANG);
  document.documentElement.lang=HTML_LANG[LANG];$('#lang').value=LANG;
  if(!keep){const want=LANG==='pt'?'':'#'+LANG;if(location.hash!==want)history.replaceState(null,'',location.pathname+location.search+want)}
  renderAll();
}
function setTheme(x){document.documentElement.dataset.theme=x;store.set('theme',x)}
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  const ctrl=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(ctrl&&k==='s'){e.preventDefault();saveJson();return}
  if(ctrl&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(ctrl&&k==='y'){e.preventDefault();redo();return}
  if(ctrl&&e.key==='Enter'){e.preventDefault();if(feat())addScenario();return}
});
$('#b-file').addEventListener('click',fileMenu);
$('#b-undo').addEventListener('click',undo);
$('#b-redo').addEventListener('click',redo);
$('#b-help').addEventListener('click',()=>modal({title:t('help'),wide:true,body:h('div',{html:HELP[LANG]})}));
$('#b-theme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
$('#lang').addEventListener('change',e=>setLang(e.target.value));
$('#glang').addEventListener('change',e=>{S.p.lang=e.target.value;commit();renderEditor()});
$('#search').addEventListener('input',e=>{S.filter=e.target.value;renderTree()});
$('#b-newf').addEventListener('click',()=>{const f=newFeature('');S.p.features.push(f);S.fid=f.id;S.sid=null;S.focus='#f-name';setView('edit');commit();renderEditor()});
$$('#views button').forEach(b=>b.addEventListener('click',()=>{setView(b.dataset.view);if(b.dataset.view==='out')renderRight()}));
window.addEventListener('hashchange',()=>{const l=location.hash.slice(1);if(LANGS.includes(l)||!l)setLang(l||'pt',true)});
window.addEventListener('pagehide',()=>{clearTimeout(saveT);store.set('project',S.p)});
(function boot(){
  const hl=location.hash.slice(1),nav=(navigator.language||'pt').slice(0,2).toLowerCase();
  LANG=LANGS.includes(hl)?hl:(store.get('lang')||(LANGS.includes(nav)?nav:'pt'));
  document.documentElement.lang=HTML_LANG[LANG];$('#lang').value=LANG;
  setTheme(store.get('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  let p=null;try{const sv=store.get('project');if(sv)p=loadProject(sv)}catch{}
  if(!p){p=newProject();p.lang=LANG}
  S.p=p;if(p.features[0])S.fid=p.features[0].id;
  record();setView('edit');renderAll();
})();
</script>
</body>
