<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- UML Studio: um único arquivo. Os diagramas ficam guardados dentro deste próprio HTML (bloco #uml-store), como no TiddlyWiki. Sem rede e sem eval. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>UML Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f5fa7'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='white' stroke-width='1.3'/%3E%3Cpath d='M3 6.5h10M3 9.5h10' stroke='white' stroke-width='1.1'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef0f3;--panel:#fff;--panel2:#f6f7f9;--text:#1d2329;--muted:#5b646e;--line:#d5dae0;--line2:#e8ebef;
  --accent:#2f5fa7;--accent-text:#fff;--accent-soft:#e2ebf8;--danger:#b3261e;--danger-soft:#fbe9e7;--warn:#8a5a00;--ok:#1f7a3d;
  --canvas:#fbfbfa;--dot:#d2d6db;--sel:#d9480f;--sim:#e8590c;--sim-ink:#b8460a;--sim-soft:rgba(232,89,12,.14);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#13161a;--panel:#1b1f24;--panel2:#21262c;--text:#e4e7ea;--muted:#9aa3ad;--line:#353b43;--line2:#2a3036;
  --accent:#86aef0;--accent-text:#0d1a2e;--accent-soft:#1d2c44;--danger:#ef8a80;--danger-soft:#3b211f;--warn:#e3b45a;--ok:#6cc98a;
  --canvas:#171a1e;--dot:#30363d;--sel:#ff8f5a;--sim:#ff922b;--sim-ink:#ffa94d;--sim-soft:rgba(255,146,43,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--sans);color:var(--text);background:var(--bg);display:grid;grid-template-rows:48px minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
button:hover:not(:disabled){background:var(--panel2);border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
button.danger{color:var(--danger)}
button svg{width:16px;height:16px;flex:none}
input[type=text],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;width:100%}
textarea{resize:vertical;min-height:54px;font:12px/1.45 var(--mono)}
label{display:block}

/* barra superior */
#top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
#brand{display:flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap}
#brand svg{width:22px;height:22px}
#ptitle{border:1px solid transparent;background:transparent;font-weight:600;min-width:60px;width:220px;padding:4px 6px;border-radius:5px;flex:0 1 auto}
#ptitle:hover,#ptitle:focus{border-color:var(--line);background:var(--panel2)}
#dirty{font-size:11px;color:var(--muted);white-space:nowrap}
#dirty.on{color:var(--warn)}
.sp{flex:1}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:60;min-width:230px;padding:4px}
.menu-list button{display:flex;width:100%;text-align:left;border:none;background:none;padding:6px 10px;border-radius:5px}
.menu-list button:hover:not(:disabled){background:var(--accent-soft)}
.menu-list hr{border:none;border-top:1px solid var(--line2);margin:4px 0}
#lang{width:auto;padding:3px 4px}
.mob{display:none}

/* corpo */
#main{display:grid;grid-template-columns:236px minmax(0,1fr) 284px;min-height:0;position:relative}
#left,#right{background:var(--panel2);min-height:0;overflow:auto}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.side-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:12px 12px 5px;display:flex;align-items:center;gap:6px}
.side-title .sp{flex:1}
.side-title button{padding:2px 7px;font-size:11px;text-transform:none;letter-spacing:0}
#center{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
#tabs{display:flex;align-items:flex-end;gap:3px;padding:7px 8px 0;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;min-width:0}
.tabw{display:flex;align-items:stretch;flex:none;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--bg)}
.tabw:hover{background:var(--line2)}
.tabw.on{background:var(--canvas);box-shadow:inset 0 2px 0 var(--accent)}
.tabw.drop-l{box-shadow:inset 3px 0 0 var(--sel)}
.tabw.drop-r{box-shadow:inset -3px 0 0 var(--sel)}
.tab{display:flex;align-items:center;gap:6px;padding:6px 3px 6px 10px;cursor:pointer;min-width:0;font-size:12.5px;white-space:nowrap;user-select:none;-webkit-user-select:none;outline-offset:-2px;border-radius:8px 0 0 0}
.tab .ab{font:600 10px var(--mono);color:var(--muted)}
.tab .nm{overflow:hidden;text-overflow:ellipsis;max-width:170px}
.tabw.on .nm{font-weight:650}
.tx{border:none;background:none;padding:0 8px;font-size:15px;line-height:1;color:var(--muted);opacity:0;border-radius:0 8px 0 0}
.tx:hover:not(:disabled){background:var(--danger-soft);color:var(--danger)}
.tabw:hover .tx,.tabw.on .tx,.tx:focus-visible{opacity:1}
.tabadd{flex:none;align-self:center;margin:0 0 4px 4px;padding:1px 10px;font-size:16px;line-height:1.2}
.tabin{width:150px;padding:1px 4px;font-size:12.5px}
#ptype{padding:0 12px 4px;color:var(--muted);font-size:12px}
.pal-group{font-size:11px;color:var(--muted);padding:6px 12px 2px}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:2px 10px 6px}
.pal{flex-direction:column;justify-content:flex-start;padding:5px 3px;white-space:normal;line-height:1.15;font-size:11px;text-align:center;gap:2px;min-height:58px}
.pal svg{width:46px;height:28px;pointer-events:none}
.pal[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pal.lock[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--accent)}
#stage{position:relative;min-height:0;min-width:0;overflow:hidden;background:var(--canvas)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px)}
#cv.tool{cursor:crosshair}
#cv.pan{cursor:grab}
#zoombar{position:absolute;left:10px;bottom:10px;display:flex;gap:2px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
#zoombar button{border:none;background:none;padding:2px 8px}
#zoombar span{font:11px var(--mono);color:var(--muted);min-width:44px;text-align:center}
#zoombar label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:0 6px 0 4px;border-left:1px solid var(--line2)}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--accent);color:var(--accent-text);padding:5px 12px;border-radius:20px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;max-width:calc(100% - 20px);text-align:center}
#inl{position:absolute;z-index:20;font:12px var(--sans);border:2px solid var(--accent);border-radius:4px;padding:3px 4px;background:var(--panel);resize:none;overflow:hidden;text-align:center;min-height:0}
#props{padding:0 12px 14px}
#props .f{margin:0 0 9px}
#props .f>span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
#props .f small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#props .chk{display:flex;gap:6px;align-items:center}
#props .chk input{width:auto}
#props .kind{font-weight:700;font-size:14px;margin:2px 0 2px}
#props .desc{color:var(--muted);font-size:12px;margin:0 0 10px}
#props .row{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}
#props .row button{font-size:12px}
#props .row.icons{gap:3px;margin:2px 0 8px}
#props .row.icons button{padding:4px 6px}
#props .grp{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}
#props small.desc{display:block;color:var(--muted);font-size:11px;margin:-2px 0 8px}
.menu-list .mh{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:7px 10px 2px}
.menu-list .mnote{font-size:11px;color:var(--muted);margin:4px 10px 4px;max-width:230px}
.menu-list button svg{width:16px;height:16px}
#mArr{max-height:calc(100vh - 70px);overflow:auto}
#bSim[aria-pressed=true]{background:var(--sim);border-color:var(--sim);color:#fff}
body.simming #pal{opacity:.45;pointer-events:none}
body.simming #cv{cursor:grab}
.simst{font-weight:600;margin:2px 0 8px}
#simChoice .simq{margin:0 0 4px;font-weight:600;color:var(--sim-ink)}
#simChoice .simopt{display:flex;width:100%;text-align:left;white-space:normal;margin:0 0 4px;border-color:var(--sim)}
#simChoice{margin-bottom:8px}
.simlog{max-height:240px;overflow:auto;margin:0 0 8px;padding:6px 8px 6px 10px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:12px}
.simlog li{margin:2px 0}
.simlog li.pick{color:var(--muted);font-style:italic}
.simlog li.end{font-weight:600;color:var(--sim-ink)}
#simg *{pointer-events:none}
#simg .sh{fill:none;stroke:var(--sim);stroke-width:3.5}
#simg .sh.sq{stroke-dasharray:6 4}
#simg .sa{fill:var(--sim-soft);stroke:var(--sim);stroke-width:2.5}
#simg .se{fill:none;stroke:var(--sim);stroke-width:4;stroke-linecap:round;opacity:.75}
#simg .tk{fill:var(--sim);stroke:var(--panel);stroke-width:2}
#simg .tkn{fill:#fff;font:bold 9px var(--sans);text-anchor:middle}
#simg .cur{stroke:var(--sim);stroke-width:2;stroke-dasharray:4 3}
#simg .sob{pointer-events:auto;cursor:pointer}
#simg .sob *{pointer-events:auto}
#simg .sob text{pointer-events:none}
#simg .so{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:7 4}
#simg .so-hit{fill:none;stroke:transparent;stroke-width:16}
#simg .sob circle{fill:var(--accent);stroke:var(--panel);stroke-width:2}
#simg .sob text{fill:var(--accent-text);font:bold 11px var(--sans);text-anchor:middle}
#simg .sob:hover .so{stroke-width:4}
.kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 18px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,20,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
dialog h2{font-size:16px;margin:0;padding:14px 18px 10px;border-bottom:1px solid var(--line2)}
dialog .body{padding:12px 18px;overflow:auto}
dialog .foot{display:flex;justify-content:flex-end;gap:6px;padding:10px 18px;border-top:1px solid var(--line2)}
dialog .body p{margin:0 0 10px}
dialog .body ul,dialog .body ol{margin:0 0 10px;padding-left:20px}
dialog .body li{margin:2px 0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin:4px 0 12px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;white-space:normal;text-align:left;padding:7px 9px;gap:2px;height:100%}
.tcard b{font-size:12.5px}
.tcard small{color:var(--muted);font-size:11.5px;line-height:1.3}
.tcard[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tgroup{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.doclist{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:4px 0 6px}
.doclist .chk small{color:var(--muted);font:10px var(--mono)}
dialog .chk{display:flex;gap:7px;align-items:center;margin:3px 0}
dialog .chk input{width:auto}
dialog .f{margin:0 0 9px}dialog .f>span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
dialog .desc{color:var(--muted);font-size:12px}
.tgroup .mini{font-size:11px;padding:1px 7px;margin-left:4px;text-transform:none;letter-spacing:0}
.docrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:520px){.docrow{grid-template-columns:1fr}}
.issues{list-style:none;padding:0!important}
.issues li{padding:6px 8px;border:1px solid var(--line2);border-radius:6px;cursor:pointer;margin:4px 0}
.issues li:hover{background:var(--panel2)}
.issues li b{color:var(--warn)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:100;pointer-events:none;align-items:center;width:max-content;max-width:calc(100vw - 24px)}
#toast div{background:var(--text);color:var(--panel);padding:8px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:12.5px}
#toast div.err{background:var(--danger);color:#fff}

/* SVG: o tema do desenho vem de #svgcss, gerado pelo script */
.hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.node{cursor:move}
.selb{fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:5 3;pointer-events:none}
.rh{fill:var(--panel);stroke:var(--sel);stroke-width:1.5;cursor:nwse-resize}
.bh{fill:var(--sel);stroke:var(--panel);stroke-width:1.5;cursor:grab}
.edge.sel .ln{stroke:var(--sel)}
.edge.sel .k{fill:var(--sel)}
.tmp{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 4;pointer-events:none}
.marq{fill:var(--accent-soft);fill-opacity:.5;stroke:var(--accent);stroke-dasharray:4 3;pointer-events:none}
.tgt>*:first-child{filter:drop-shadow(0 0 3px var(--accent))}

@media (max-width:1100px){#top .lbl{display:none}#ptitle{width:150px}}
@media (max-width:760px){
  #main{grid-template-columns:minmax(0,1fr)}
  #left,#right{position:absolute;top:0;bottom:0;z-index:30;width:min(300px,88vw);box-shadow:0 0 30px rgba(0,0,0,.25);display:none}
  #left{left:0}#right{right:0}
  body.show-left #left,body.show-right #right{display:block}
  .mob{display:inline-flex}
  #brand span,#dirty{display:none}
  #ptitle{width:90px}
  #top{gap:4px;padding:0 6px}
  #top button{padding:4px 6px}
  #zoombar label span{display:none}
  .tab .nm{max-width:120px}
  .tabw.on .tx{opacity:1}
}
@media (max-width:420px){#bUndo,#bRedo,#bVal,#bHelp,#bDoc{display:none}#ptitle{width:70px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#top,#left,#right,#zoombar,#hint,#tabs{display:none}body{display:block}#main{display:block;height:100vh}#cv{background:none}}
</style>
</head>
<body>
<header id="top">
  <button class="mob" id="bLeft" type="button" data-i="aria:panelLeft"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
  <div id="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#2f5fa7"/><rect x="3" y="3" width="10" height="10" fill="none" stroke="#fff" stroke-width="1.3"/><path d="M3 6.5h10M3 9.5h10" stroke="#fff" stroke-width="1.1"/></svg><span>UML Studio</span></div>
  <input id="ptitle" type="text" spellcheck="false" data-i="aria:projectTitle">
  <span id="dirty" aria-live="polite"></span>
  <span class="sp"></span>
  <button id="bSave" class="primary" type="button" data-i="title:saveTip"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h9l2 2v9h-11z M5 2.5v4h6v-4 M5 13.5v-4h6v4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="lbl" data-i="save"></span></button>
  <div class="menu">
    <button id="bFile" type="button" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h6l4 4v8H3z M9 2v4h4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="lbl" data-i="file"></span></button>
    <div class="menu-list" id="mFile" role="menu" hidden>
      <button type="button" role="menuitem" data-act="save" data-i="saveFile"></button>
      <button type="button" role="menuitem" data-act="saveAs" data-i="saveAs"></button>
      <hr>
      <button type="button" role="menuitem" data-act="exportSvg" data-i="exportSvg"></button>
      <button type="button" role="menuitem" data-act="exportPng" data-i="exportPng"></button>
      <button type="button" role="menuitem" data-act="exportJson" data-i="exportJson"></button>
      <button type="button" role="menuitem" data-act="import" data-i="importFile"></button>
      <button type="button" role="menuitem" data-act="doc" data-i="docMenu"></button>
      <hr>
      <button type="button" role="menuitem" data-act="newProject" data-i="newProject"></button>
    </div>
  </div>
  <div class="menu">
    <button id="bArr" type="button" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 1v14" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="3" width="9" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="4" y="9" width="6" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span class="lbl" data-i="arrange"></span></button>
    <div class="menu-list" id="mArr" role="menu" hidden></div>
  </div>
  <button id="bSim" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span class="lbl" data-i="simulate"></span></button>
  <button id="bUndo" type="button" data-i="title:undo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3L2 6l3 3M2 6h7a4 4 0 010 8H6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <button id="bRedo" type="button" data-i="title:redo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3l3 3-3 3M14 6H7a4 4 0 000 8h3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <button id="bVal" type="button" data-i="title:validate"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span class="lbl" data-i="validate"></span></button>
  <button id="bDoc" type="button" data-i="title:docTip"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h6.5l3.5 3.5v9.5H3z M9.5 1.5V5H13" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 8h6M5 10.5h6M5 13h4" stroke="currentColor" stroke-width="1.1"/></svg><span class="lbl" data-i="docBtn"></span></button>
  <button id="bHelp" type="button" data-i="title:help"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.2 6.3a1.9 1.9 0 113 1.5c-.8.5-1.2.9-1.2 1.7M8 11.3v.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>

`<p>O UML Studio desenha os 14 tipos de diagrama da UML 2.5.1, a versão atual da especificação da OMG (<i>formal/17-12-05</i>), agrupados como no Anexo A: estrutura, comportamento e interação.</p>
<ol><li>Cada diagrama é uma aba acima do quadro. O <b>+</b> cria outro; duplo clique na aba renomeia, arrastar a aba muda a ordem e o <b>×</b> exclui. Com a aba em foco, as setas passam de uma aba a outra.</li>
<li>Clique em um elemento da paleta e depois no quadro, ou arraste-o para o quadro. Duplo clique na paleta mantém a ferramenta ativa.</li>
<li>Para ligar, escolha um relacionamento e arraste de um elemento até outro. Em diagramas de sequência, a altura do arraste define a altura da mensagem.</li>
<li>Duplo clique edita o nome. O painel da direita mostra todas as propriedades: atributos, operações, multiplicidades, guardas, estereótipos.</li>
<li>Arraste o meio de uma linha para dobrá-la. Arraste o quadrado no canto de um elemento para mudar o tamanho. Arrastar um contêiner (pacote, sujeito, nó, raia, estado) leva junto o que está dentro dele.</li>
<li>Rolagem move o quadro; Ctrl + rolagem amplia; Espaço + arrastar ou o botão do meio também movem. No toque, arraste com um dedo no vazio e use pinça para ampliar.</li></ol>
<p><b>Onde os dados ficam.</b> Como no TiddlyWiki, <b>Salvar</b> grava este próprio arquivo HTML com os diagramas dentro. No Chrome e no Edge você escolhe o arquivo uma vez e as próximas gravações o substituem. Nos outros navegadores é baixada uma cópia nova; substitua o arquivo antigo por ela. Até você salvar, um rascunho fica neste navegador e é oferecido de volta se a página for fechada.</p>
<p><b>Teclas:</b> <span class="kbd">Del</span> exclui, <span class="kbd">Ctrl+Z</span>/<span class="kbd">Ctrl+Y</span> desfaz e refaz, <span class="kbd">Ctrl+C</span>/<span class="kbd">Ctrl+V</span>/<span class="kbd">Ctrl+D</span> copia, cola e duplica, <span class="kbd">Ctrl+A</span> seleciona tudo, setas movem, <span class="kbd">Tab</span> passa de um elemento a outro, <span class="kbd">F2</span> renomeia, <span class="kbd">Esc</span> cancela.</p>
<p><b>Organizar.</b> O menu Organizar e os botões do painel de propriedades alinham (esquerda, centro, direita, topo, meio, base), distribuem com espaços iguais, igualam largura e altura ao primeiro item selecionado, ajustam o tamanho ao conteúdo (num contêiner, envolve o que está dentro) e mudam a sobreposição: trazer para a frente, avançar, recuar e enviar para trás. Atalhos: <span class="kbd">Ctrl+]</span> e <span class="kbd">Ctrl+[</span> avançam e recuam; com <span class="kbd">Shift</span>, vão até a frente ou o fundo. Contêineres ficam sempre atrás dos demais elementos.</p>
<p><b>Simular.</b> Nos diagramas de atividades e de visão geral, tokens percorrem os fluxos (bifurcação, união, decisão, finais). Na máquina de estados, você dispara eventos e vê o estado ativo, com entry/exit, estados compostos, escolha, histórico, bifurcação e união. Na sequência, as mensagens seguem a ordem de cima para baixo, com os fragmentos alt, opt, loop, par, break e neg. Na comunicação, a ordem segue a numeração; no tempo, um cursor percorre o eixo. As escolhas são suas ou sorteadas com uma semente: a mesma semente repete a mesma simulação. Guardas não são avaliadas.</p>
<p><b>Documentar.</b> O botão Documentar gera um PDF do projeto: capa, sumário com links, cada diagrama em desenho vetorial (texto selecionável) e, se quiser, tabelas de elementos, de relacionamentos e o resultado da verificação. O PDF tem marcadores para navegar entre os diagramas.</p>
<p><b>Limites:</b> a notação segue a especificação, mas o app não exporta XMI e a verificação cobre só regras comuns, não a norma inteira.</p>`,
`<p>UML Studio draws the 14 diagram types of UML 2.5.1, the current version of the OMG specification (<i>formal/17-12-05</i>), grouped as in Annex A: structure, behavior and interaction.</p>
<ol><li>Each diagram is a tab above the canvas. <b>+</b> creates another; double-clicking a tab renames it, dragging a tab changes the order and <b>×</b> deletes it. With a tab focused, the arrow keys move between tabs.</li>
<li>Click an element in the palette and then the canvas, or drag it onto the canvas. Double-clicking in the palette keeps the tool active.</li>
<li>To connect, pick a relationship and drag from one element to another. In sequence diagrams the height of the drag sets the height of the message.</li>
<li>Double-click edits the name. The right panel shows all properties: attributes, operations, multiplicities, guards, stereotypes.</li>
<li>Drag the middle of a line to bend it. Drag the square at an element's corner to resize it. Dragging a container (package, subject, node, partition, state) moves what is inside it too.</li>
<li>Scrolling moves the canvas; Ctrl + scroll zooms; Space + drag or the middle button also move it. On touch screens, drag with one finger on empty space and pinch to zoom.</li></ol>
<p><b>Where the data lives.</b> As in TiddlyWiki, <b>Save</b> writes this very HTML file with the diagrams inside. In Chrome and Edge you choose the file once and later saves replace it. In other browsers a new copy is downloaded; replace the old file with it. Until you save, a draft is kept in this browser and offered back if the page is closed.</p>
<p><b>Keys:</b> <span class="kbd">Del</span> deletes, <span class="kbd">Ctrl+Z</span>/<span class="kbd">Ctrl+Y</span> undo and redo, <span class="kbd">Ctrl+C</span>/<span class="kbd">Ctrl+V</span>/<span class="kbd">Ctrl+D</span> copy, paste and duplicate, <span class="kbd">Ctrl+A</span> selects all, arrows move, <span class="kbd">Tab</span> goes from one element to the next, <span class="kbd">F2</span> renames, <span class="kbd">Esc</span> cancels.</p>
<p><b>Arrange.</b> The Arrange menu and the buttons in the properties panel align (left, center, right, top, middle, bottom), distribute with equal gaps, match width and height to the first selected item, fit the size to the content (for a container, it wraps what is inside) and change the stacking order: bring to front, bring forward, send backward and send to back. Shortcuts: <span class="kbd">Ctrl+]</span> and <span class="kbd">Ctrl+[</span> move forward and backward; with <span class="kbd">Shift</span>, all the way to the front or back. Containers always stay behind other elements.</p>
<p><b>Simulate.</b> In activity and interaction overview diagrams, tokens travel along the flows (fork, join, decision, finals). In the state machine you fire events and see the active state, with entry/exit, composite states, choice, history, fork and join. In sequence diagrams, messages follow top-to-bottom order, with the alt, opt, loop, par, break and neg fragments. In communication diagrams the order follows the numbering; in timing diagrams a cursor moves along the axis. Choices are yours or drawn with a seed: the same seed repeats the same simulation. Guards are not evaluated.</p>
<p><b>Document.</b> The Document button creates a PDF of the project: cover, contents with links, each diagram as a vector drawing (selectable text) and, if you want, tables of elements, of relationships and the check results. The PDF has bookmarks to move between diagrams.</p>
<p><b>Limits:</b> the notation follows the specification, but the app does not export XMI and the check covers only common rules, not the whole standard.</p>`,

<li>El doble clic edita el nombre. El panel derecho muestra todas las propiedades: atributos, operaciones, multiplicidades, guardas, estereotipos.</li>
<li>Arrastra el centro de una línea para doblarla. Arrastra el cuadrado de la esquina de un elemento para cambiar su tamaño. Arrastrar un contenedor (paquete, sujeto, nodo, calle, estado) mueve también lo que está dentro.</li>
<li>La rueda mueve el lienzo; Ctrl + rueda acerca; Espacio + arrastrar o el botón central también lo mueven. En pantallas táctiles, arrastra con un dedo en el vacío y pellizca para acercar.</li></ol>
<p><b>Dónde quedan los datos.</b> Como en TiddlyWiki, <b>Guardar</b> escribe este mismo archivo HTML con los diagramas dentro. En Chrome y Edge eliges el archivo una vez y los siguientes guardados lo sustituyen. En otros navegadores se descarga una copia nueva; sustituye con ella el archivo antiguo. Hasta que guardes, un borrador queda en este navegador y se ofrece de nuevo si la página se cierra.</p>
<p><b>Teclas:</b> <span class="kbd">Supr</span> elimina, <span class="kbd">Ctrl+Z</span>/<span class="kbd">Ctrl+Y</span> deshace y rehace, <span class="kbd">Ctrl+C</span>/<span class="kbd">Ctrl+V</span>/<span class="kbd">Ctrl+D</span> copia, pega y duplica, <span class="kbd">Ctrl+A</span> selecciona todo, las flechas mueven, <span class="kbd">Tab</span> pasa de un elemento a otro, <span class="kbd">F2</span> renombra, <span class="kbd">Esc</span> cancela.</p>
<p><b>Organizar.</b> El menú Organizar y los botones del panel de propiedades alinean (izquierda, centro, derecha, arriba, medio, abajo), distribuyen con espacios iguales, igualan ancho y alto al primer elemento seleccionado, ajustan el tamaño al contenido (en un contenedor, envuelve lo que hay dentro) y cambian la superposición: traer al frente, traer adelante, enviar atrás y enviar al fondo. Atajos: <span class="kbd">Ctrl+]</span> y <span class="kbd">Ctrl+[</span> adelantan y atrasan; con <span class="kbd">Shift</span>, hasta el frente o el fondo. Los contenedores quedan siempre detrás de los demás elementos.</p>
<p><b>Simular.</b> En los diagramas de actividades y de visión general, los tokens recorren los flujos (bifurcación, unión, decisión, finales). En la máquina de estados disparas eventos y ves el estado activo, con entry/exit, estados compuestos, elección, historial, bifurcación y unión. En la secuencia, los mensajes siguen el orden de arriba abajo, con los fragmentos alt, opt, loop, par, break y neg. En la comunicación el orden sigue la numeración; en el de tiempos un cursor recorre el eje. Las elecciones son tuyas o sorteadas con una semilla: la misma semilla repite la misma simulación. Las guardas no se evalúan.</p>
<p><b>Documentar.</b> El botón Documentar genera un PDF del proyecto: portada, índice con enlaces, cada diagrama como dibujo vectorial (texto seleccionable) y, si quieres, tablas de elementos, de relaciones y el resultado de la verificación. El PDF tiene marcadores para pasar de un diagrama a otro.</p>
<p><b>Límites:</b> la notación sigue la especificación, pero la app no exporta XMI y la verificación cubre solo reglas comunes, no la norma entera.</p>`];

      for(const f of Object.keys(F))if(f in n)m[f]=F[f].t==='check'?!!n[f]:String(n[f]??'');if(isFinite(n.z)&&n.z!==null)m.z=+n.z;if(ids.has(m.id))m.id=rid();ids.add(m.id);nd.nodes.push(m)}

function collectIssues(d){
  const out=[];const ins=id=>d.edges.filter(e=>e.t===id&&E[e.k].f!==undefined&&e.k!=='noteAnchor'),outs=id=>d.edges.filter(e=>e.s===id&&e.k!=='noteAnchor');
  const nm=n=>n.name||L(K[n.k].n);
  for(const e of d.edges){const p=edgeProblem(d,e.k,byId(d,e.s),byId(d,e.t));if(p)out.push([e.id,p])}
  for(const n of d.nodes){const k=K[n.k];
    if(['initial','initialPs'].includes(n.k)&&ins(n.id).length)out.push([n.id,t('v_incomingInitial',L(k.n))]);
    if(n.k==='initialPs'&&outs(n.id).length!==1)out.push([n.id,t('v_initialOne')]);
    if(['activityFinal','flowFinal','finalState','terminate'].includes(n.k)&&outs(n.id).length)out.push([n.id,t('v_outgoingFinal',L(k.n))]);
    if(['decision','choice'].includes(n.k)&&ins(n.id).length===1&&outs(n.id).length===1)out.push([n.id,t('v_decision')]);
    if(n.k==='forkJoin'&&!((ins(n.id).length===1&&outs(n.id).length>=2)||(ins(n.id).length>=2&&outs(n.id).length===1)))out.push([n.id,t('v_fork')]);
    if(k.nm!==0&&k.f.includes('name')&&!String(n.name??'').trim())out.push([n.id,t('v_unnamed',L(k.n))]);
    if(['action','usecase','state','callBehavior','lifelineBox'].includes(n.k)&&!d.edges.some(e=>e.s===n.id||e.t===n.id)&&d.nodes.length>1)out.push([n.id,t('v_isolated',nm(n))]);
  }
  // ciclos de generalização
  const gen=d.edges.filter(e=>e.k==='generalization');const adj={};for(const e of gen)(adj[e.s]=adj[e.s]||[]).push(e.t);
  const seen=new Set();for(const st of Object.keys(adj)){const stack=[[st,new Set([st])]];while(stack.length){const[v,path]=stack.pop();for(const w of adj[v]||[]){if(w===st){if(!seen.has(st)){seen.add(st);const n=byId(d,st);out.push([st,t('v_genCycle',n?nm(n):'?')])}}else if(!path.has(w)&&path.size<60)stack.push([w,new Set([...path,w])])}}}
  return out;
}

const CLS_KINDS=new Set(['class','interface','enumeration','datatype','primitive','signal','component','stereotype','metaclass','artifact','structuredClass','deploymentSpec']);
function edgeProblem(d,k,s,tg){
  if(!s||!tg)return'?';
  if(k==='noteAnchor'&&s.k!=='note'&&tg.k!=='note')return t('v_noteAnchor');
  if((k==='include'||k==='extend')&&(s.k!=='usecase'||tg.k!=='usecase'))return t('v_ucOnly',E[k].kw);
  if(k==='extension'&&(s.k!=='stereotype'||tg.k!=='metaclass'))return t('v_extension');
  if(E[k].msg&&d.type==='sequence'&&!isSeqMsg(d,{k},s,tg))return t('v_msgEnds');
  if(k==='generalization'&&s.k!==tg.k&&!(CLS_KINDS.has(s.k)&&CLS_KINDS.has(tg.k))&&!(['node','device','execEnv'].includes(s.k)&&['node','device','execEnv'].includes(tg.k)))return t('v_genKinds',L(K[s.k].n),L(K[tg.k].n));

const SQ=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1"${f===1?' fill="currentColor"':f==='p'?' style="fill:var(--panel)"':' fill="none"'} stroke="currentColor" stroke-width="1.2"/>`;

  sameSize:SQ(2,2,5,5)+SQ(9,2,5,5)+SQ(2,9,5,5)+SQ(9,9,5,5),fitContent:SQ(5,5,6,6,1)+LN2('M1 4V1h3M12 1h3v3M15 12v3h-3M4 15H1v-3'),
  toFront:SQ(1,1,7,7)+SQ(4,4,7,7,'p')+SQ(8,8,7,7,1),forward:SQ(2,2,8,8)+SQ(6,6,8,8,1),
  backward:SQ(6,6,8,8,1)+SQ(2,2,8,8,'p'),toBack:SQ(8,8,7,7,1)+SQ(4,4,7,7,'p')+SQ(1,1,7,7,'p')};
const ARR=[['a_align',[['left',2],['hcenter',2],['right',2],['top',2],['vcenter',2],['bottom',2]]],['a_dist',[['distH',3],['distV',3]]],['a_size',[['sameW',2],['sameH',2],['sameSize',2],['fitContent',1]]],['a_z',[['toFront',1],['forward',1],['backward',1],['toBack',1]]]];

function selNodes(){const d=D(),order2=[...sel];return d.nodes.filter(n=>sel.has(n.id)).sort((a,b)=>order2.indexOf(a.id)-order2.indexOf(b.id))}
function contents(d,c){const b=box(c),out=[];for(const m of d.nodes){if(m===c)continue;const q=box(m);if(q.x>=b.x&&q.y>=b.y&&q.x+q.w<=b.x+b.w&&q.y+q.h<=b.y+b.h&&q.w*q.h<b.w*b.h)out.push(m)}return out}
function fitContent(d,n){

function zorder(d,ns,act){
  const ids=new Set(ns.map(n=>n.id));
  for(const layer of[0,1]){const list=order(d).filter(n=>(K[n.k].c?0:1)===layer);if(!list.some(n=>ids.has(n.id)))continue;let a=[...list];
    if(act==='toFront')a=[...list.filter(n=>!ids.has(n.id)),...list.filter(n=>ids.has(n.id))];
    else if(act==='toBack')a=[...list.filter(n=>ids.has(n.id)),...list.filter(n=>!ids.has(n.id))];
    else if(act==='forward'){for(let i=a.length-2;i>=0;i--)if(ids.has(a[i].id)&&!ids.has(a[i+1].id))[a[i],a[i+1]]=[a[i+1],a[i]]}
    else for(let i=1;i<a.length;i++)if(ids.has(a[i].id)&&!ids.has(a[i-1].id))[a[i],a[i-1]]=[a[i-1],a[i]];

}
function arrange(act){
  if(SIM){toast(t('simEditBlocked'),'err');return}
  const d=D(),ns=selNodes();for(const n of d.nodes)measure(n);
  if(ns.length<ARR_NEED[act]){toast(t('arrNeed',ARR_NEED[act]),'err');return}
  const bx=ns.map(box);const L0=Math.min(...bx.map(b=>b.x)),R0=Math.max(...bx.map(b=>b.x+b.w)),T0=Math.min(...bx.map(b=>b.y)),B0=Math.max(...bx.map(b=>b.y+b.h));
  const plan=new Map();const to=(n,x,y)=>{const b=box(n);plan.set(n.id,{n,dx:Math.round(x-b.x),dy:Math.round(y-b.y)})};
  switch(act){
    case'left':ns.forEach(n=>to(n,L0,n.y));break;
    case'hcenter':ns.forEach(n=>to(n,(L0+R0)/2-box(n).w/2,n.y));break;
    case'right':ns.forEach(n=>to(n,R0-box(n).w,n.y));break;
    case'top':ns.forEach(n=>to(n,n.x,T0));break;
    case'vcenter':ns.forEach(n=>to(n,n.x,(T0+B0)/2-box(n).h/2));break;
    case'bottom':ns.forEach(n=>to(n,n.x,B0-box(n).h));break;
    case'distH':{const s=[...ns].sort((a,b)=>a.x+box(a).w/2-(b.x+box(b).w/2));const gap=(R0-L0-s.reduce((a,n)=>a+box(n).w,0))/(s.length-1);let x=L0;for(const n of s){to(n,x,n.y);x+=box(n).w+gap}break}
    case'distV':{const s=[...ns].sort((a,b)=>a.y+box(a).h/2-(b.y+box(b).h/2));const gap=(B0-T0-s.reduce((a,n)=>a+box(n).h,0))/(s.length-1);let y=T0;for(const n of s){to(n,n.x,y);y+=box(n).h+gap}break}
    case'sameW':case'sameH':case'sameSize':{const r=box(ns[0]);for(const n of ns.slice(1)){if(K[n.k].rs===0)continue;if(act!=='sameH')n.w=Math.max(K[n.k].mw||16,Math.round(r.w));if(act!=='sameW')n.h=Math.max(K[n.k].mh||16,Math.round(r.h))}break}

  render();commit();renderProps();
}

function mulberry(seed){let h=Math.imul((seed>>>0)^0x9E3779B9,0x85EBCA6B);h^=h>>>13;h=Math.imul(h,0xC2B2AE35);h^=h>>>16;let a=h|0;const r=()=>{a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};r();r();r();return r}
const nmOf=n=>n?(String(n.name??'').trim()||L(K[n.k].n)):'?';
function msgText(d,e){const s=nmOf(byId(d,e.s)),tg=nmOf(byId(d,e.t)),nm=String(e.name??'').trim();const ar={sync:'→',async:'⇀',reply:'⇠',create:'→ «create»',deleteMsg:'→ ✕'}[e.k]||'→';return `${s} ${ar} ${tg}${nm?': '+nm:''}`}
function trLabel(e){let s=String(e.trigger??'').trim();if(String(e.guard??'').trim())s+=(s?' ':'')+'['+e.guard.trim()+']';if(String(e.effect??'').trim())s+=' / '+e.effect.trim();return s}
function along(pts,f){let tot=0;for(let i=1;i<pts.length;i++)tot+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);let h=tot*f;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=Math.hypot(b.x-a.x,b.y-a.y);if(h<=l||i===pts.length-1){const q=l?Math.min(1,h/l):0;return{x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q}}h-=l}return pts[0]}
const pd=pts=>'M'+pts.map(p=>r1(p.x)+','+r1(p.y)).join(' L');

function* simActivity(d){
  for(const n of d.nodes)measure(n);
  const FL=new Set(['controlFlow','objectFlow']);const edges=d.edges.filter(e=>FL.has(e.k));
  const inE=new Map(),outE=new Map();for(const n of d.nodes){inE.set(n.id,[]);outE.set(n.id,[])}for(const e of edges){outE.get(e.s).push(e);inE.get(e.t).push(e)}
  const tok=new Map(),has=e=>(tok.get(e.id)||0)>0,take=e=>tok.set(e.id,tok.get(e.id)-1),put=e=>tok.set(e.id,(tok.get(e.id)||0)+1);
  const ACT=new Set(['action','callBehavior','sendSignal','acceptEvent','timeEvent','interactionUse','interactionFrame']);
  const ANY=new Set(['decision','activityFinal','flowFinal']);
  const inits=d.nodes.filter(n=>n.k==='initial');
  let starters=d.nodes.filter(n=>ACT.has(n.k)&&!inE.get(n.id).length&&outE.get(n.id).length);
  if(!inits.length&&!starters.length)return{msg:t('simNoInitial')};
  let moved=[];for(const n of inits)for(const e of outE.get(n.id)){put(e);moved.push(e.id)}

  for(let step=0;step<1000;step++){
    const fire=[];
    for(const n of d.nodes){if(n.k==='initial')continue;const ins=inE.get(n.id);
      if(starters.includes(n)){fire.push(n);continue}
      if(!ins.length)continue;if(ANY.has(n.k)?ins.some(has):ins.every(has))fire.push(n)}
    starters=[];
    if(!fire.length){const left=[...tok].filter(([,c])=>c>0).map(([id])=>nmOf(byId(d,edges.find(e=>e.id===id).t)));return{msg:left.length?t('simStuck',[...new Set(left)].join(', ')):t('simNoTokens')}}
    const pick=new Map();
    for(const n of fire){const outs=outE.get(n.id);if(n.k==='decision'&&outs.length>1){
      const i=yield{type:'choice',prompt:String(n.name??'').trim()||t('simDecision'),node:n.id,options:outs.map(e=>({label:String(e.guard??'').trim()?'['+e.guard.trim()+']':'→ '+nmOf(byId(d,e.t)),edge:e.id}))};pick.set(n.id,outs[i]||outs[0])}}

      if(n.k==='decision')logs.push(outs.length>1?(String(n.name??'').trim()||t('simDecision'))+' '+(String(send[0].guard??'').trim()?'['+send[0].guard.trim()+']':'→ '+nmOf(byId(d,send[0].t))):t('simMerge'));

function* simState(d){
  for(const n of d.nodes)measure(n);
  const TR=d.edges.filter(e=>e.k==='transition');
  const inside=(a,b)=>{const p=box(a),q=box(b);return p.x>=q.x&&p.y>=q.y&&p.x+p.w<=q.x+q.w&&p.y+p.h<=q.y+q.h&&p.w*p.h<q.w*q.h};
  const parent=new Map();for(const n of d.nodes){let best=null;for(const s of d.nodes)if(s!==n&&s.k==='state'&&inside(n,s)&&(!best||box(s).w*box(s).h<box(best).w*box(best).h))best=s;parent.set(n.id,best)}

  const isAnc=(a,n)=>anc(n).includes(a);

  const activeIn=a=>[...act].some(id=>{const n=byId(d,id);return n===a||isAnc(a,n)});
  function logEntry(s,logs){const x=[...actsOf(s,'entry'),...actsOf(s,'do')];logs.push(t('simEnter',nmOf(s))+(x.length?' ('+x.join('; ')+')':''))}

    for(const a of chain)if(kids(a).some(c=>c.k==='state'||c.k==='finalState'))hist.set(a.id,leaves.filter(id=>isAnc(a,byId(d,id))));
    for(const s of[...chain].sort((a,b)=>anc(b).length-anc(a).length))if(s.k==='state'){const x=actsOf(s,'exit');logs.push(t('simExitSt',nmOf(s))+(x.length?' ('+x.join('; ')+')':''))}

      case'forkJoin':{const is=TR.filter(e=>e.t===n.id);if(is.length>1){const w=joinWait.get(n.id)||new Set();if(w.size<new Set(is.map(e=>e.s)).size){logs.push(t('simJoinWait'));return}joinWait.delete(n.id)}

  function* fire(e,logs){

    render();clearTimeout(window._nudge);window._nudge=setTimeout(commit,350);return}
  if(ev.key==='+'||ev.key==='='){const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.2)}
  if(ev.key==='-'){const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2)}
  if(ev.key==='0'&&!mod)fit();
  if(ev.key.toLowerCase()==='v'&&!mod)setTool({t:'sel'});
});
window.addEventListener('keyup',ev=>{if(ev.key===' '){spaceDown=false;svg.classList.remove('pan')}});
window.addEventListener('blur',()=>{spaceDown=false;svg.classList.remove('pan')});

/* ---------- exportação e importação ---------- */
function exportSvgText(){const d=D();for(const n of d.nodes)measure(n);const b=bbox(d);if(!b)return null;
  const m=d.frame?52:24,x=b.x-m,y=b.y-m-(d.frame?16:0),w=b.w+m*2,h=b.h+m*2+(d.frame?16:0);
  const title=esc(d.name||L(TYPES[d.type].n));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${r1(x)} ${r1(y)} ${r1(w)} ${r1(h)}" width="${Math.ceil(w)}" height="${Math.ceil(h)}" role="img" aria-labelledby="t"><title id="t">${title}</title><style>${svgCss(TOK.light)}</style><rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(h)}" fill="#ffffff"/>${drawDiagram(d,null,true).replace(/<[^>]*class="(hit|selb|rh|bh)"[^>]*\/>/g,'')}</svg>`}
const safeName=()=>(D().name||'diagrama').replace(/[\\/:*?"<>|]+/g,'_').slice(0,80);
function exportSvg(){const s=exportSvgText();if(!s){toast(t('emptyDiagram'),'err');return}download(s,safeName()+'.svg','image/svg+xml')}
function exportPng(){const s=exportSvgText();if(!s){toast(t('emptyDiagram'),'err');return}
  const img=new Image(),url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  img.onload=()=>{const c=document.createElement('canvas'),sc=2;c.width=img.naturalWidth*sc;c.height=img.naturalHeight*sc;const g=c.getContext('2d');g.scale(sc,sc);g.drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>{if(b)download(b,safeName()+'.png');else toast(t('noPng'),'err')},'image/png')};
  img.onerror=()=>{URL.revokeObjectURL(url);toast(t('noPng'),'err')};img.src=url}
function exportJson(){download(JSON.stringify(JSON.parse(clean(P)),null,1),(P.title||'uml').replace(/[\\/:*?"<>|]+/g,'_')+'.json','application/json')}
$('#fileIn').addEventListener('change',async()=>{const f=$('#fileIn').files[0];$('#fileIn').value='';if(!f)return;
  let txt=await f.text(),data=null;
  try{if(/^\s*</.test(txt)){const m=txt.match(/<script type="application\/json" id="uml-store">([\s\S]*?)<\/script>/);if(m)data=JSON.parse(m[1])}else data=JSON.parse(txt)}catch{data=null}
  if(data&&!data.diagrams&&TYPES[data.type])data={diagrams:[data]};
  const p=sanitize(data);if(!p){toast(t('badFile'),'err');return}
  const used=new Set(P.diagrams.map(d=>d.id));for(const d of p.diagrams){if(used.has(d.id))d.id=rid();P.diagrams.push(d)}
  P.active=p.diagrams[0].id;sel.clear();commit();renderAll();setTimeout(fit,0);toast(t('imported',p.diagrams.length))});

/* ---------- barra e menus ---------- */
const mFile=$('#mFile'),bFile=$('#bFile');
bFile.addEventListener('click',ev=>{ev.stopPropagation();$('#mArr').hidden=true;mFile.hidden=!mFile.hidden;bFile.setAttribute('aria-expanded',String(!mFile.hidden));if(!mFile.hidden)mFile.querySelector('button').focus()});
document.addEventListener('click',ev=>{if(!ev.target.closest('.menu')){mFile.hidden=true;bFile.setAttribute('aria-expanded','false');mArr.hidden=true;bArr.setAttribute('aria-expanded','false')}});
const mArr=$('#mArr'),bArr=$('#bArr');
bArr.addEventListener('click',ev=>{ev.stopPropagation();mFile.hidden=true;bFile.setAttribute('aria-expanded','false');if(mArr.hidden)renderArrMenu();mArr.hidden=!mArr.hidden;bArr.setAttribute('aria-expanded',String(!mArr.hidden));if(!mArr.hidden){const b=mArr.querySelector('button:not(:disabled)');b&&b.focus()}});
mArr.addEventListener('click',ev=>{const b=ev.target.closest('[data-arr]');if(!b||b.disabled)return;mArr.hidden=true;bArr.setAttribute('aria-expanded','false');arrange(b.dataset.arr)});
mArr.addEventListener('keydown',ev=>{const bs=[...mArr.querySelectorAll('button:not(:disabled)')],i=bs.indexOf(document.activeElement);if(!bs.length)return;if(ev.key==='ArrowDown'){ev.preventDefault();bs[(i+1)%bs.length].focus()}if(ev.key==='ArrowUp'){ev.preventDefault();bs[(i-1+bs.length)%bs.length].focus()}if(ev.key==='Escape'){mArr.hidden=true;bArr.focus()}});
$('#bSim').addEventListener('click',()=>{if(SIM)simClose();else simOpen()});
mFile.addEventListener('keydown',ev=>{const bs=[...mFile.querySelectorAll('button')],i=bs.indexOf(document.activeElement);if(ev.key==='ArrowDown'){ev.preventDefault();bs[(i+1)%bs.length].focus()}if(ev.key==='ArrowUp'){ev.preventDefault();bs[(i-1+bs.length)%bs.length].focus()}if(ev.key==='Escape'){mFile.hidden=true;bFile.focus()}});
mFile.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;mFile.hidden=true;bFile.setAttribute('aria-expanded','false');
  ({save:()=>save(false),saveAs:()=>save(true),exportSvg,exportPng,exportJson,import:()=>$('#fileIn').click(),doc:docDialog,
    newProject:()=>ask(t('newProject'),t('newProjectQ'),[[t('cancel')],[t('confirm'),'primary',()=>{const d=newDiagram('class');P.title=t('newProjectName');P.diagrams=[d];P.active=d.id;sel.clear();commit();renderAll()}]])})[b.dataset.act]()});
$('#bSave').addEventListener('click',()=>save(false));
$('#bUndo').addEventListener('click',undo);$('#bRedo').addEventListener('click',redo);
$('#bVal').addEventListener('click',validate);
$('#bHelp').addEventListener('click',()=>{const b=el('div');b.innerHTML=HELP[LANG];ask(t('helpTitle'),b,[[t('close'),'primary']])});
$('#bTheme').addEventListener('click',()=>{const th=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(th);store.set('theme',th)});
function setTheme(th){document.documentElement.dataset.theme=th;let st=$('#svgcss');if(!st){st=document.createElement('style');st.id='svgcss';document.head.append(st)}st.textContent='#cv '+svgCss(TOK[th]).replace(/\}(?=.)/g,'} #cv ')+' .pal '+svgCss(TOK[th]).replace(/\}(?=.)/g,'} .pal ')}
$('#lang').addEventListener('change',()=>{LANG=Math.max(0,LANGS.indexOf($('#lang').value));store.set('lang',LANGS[LANG]);history.replaceState(null,'',LANG?'#'+LANGS[LANG]:location.pathname+location.search);renderAll();if(!$('#hint').hidden)setTool(tool)});
$('#ptitle').addEventListener('input',()=>{P.title=$('#ptitle').value});$('#ptitle').addEventListener('change',()=>commit());
$('#zIn').addEventListener('click',()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.2)});
$('#zOut').addEventListener('click',()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2)});
$('#zFit').addEventListener('click',fit);
$('#bLeft').addEventListener('click',()=>{document.body.classList.toggle('show-left');document.body.classList.remove('show-right')});
$('#bRight').addEventListener('click',()=>{document.body.classList.toggle('show-right');document.body.classList.remove('show-left')});
$('#stage').addEventListener('pointerdown',()=>{if(matchMedia('(max-width:760px)').matches)document.body.classList.remove('show-left','show-right')},true);
window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue=t('leave');return t('leave')}});
window.addEventListener('hashchange',()=>{const i=LANGS.indexOf(location.hash.slice(1));if(i>=0&&i!==LANG){LANG=i;renderAll()}});
window.addEventListener('resize',()=>updView());

/* ---------- início ---------- */
(function init(){
  const h=LANGS.indexOf(location.hash.slice(1));const sl=LANGS.indexOf(store.get('lang',''));const nl=LANGS.indexOf((navigator.language||'pt').slice(0,2).toLowerCase());
  LANG=h>=0?h:sl>=0?sl:nl>=0?nl:0;
  setTheme(store.get('theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  let emb=null;try{emb=sanitize(JSON.parse($('#uml-store').textContent))}catch{emb=null}
  P=emb||exampleProject();
  resetHistory();applyI18n();
  const dr=store.get(DRAFT,null);const dp=dr&&sanitize(dr.data);
  if(dp&&dr.at>(P.savedAt||0)&&clean(dp)!==clean(P)){
    const when=new Date(dr.at).toLocaleString(['pt-BR','en','it','es'][LANG]);
    setTimeout(()=>ask(t('restoreTitle'),t('restoreText',when),[[t('discard'),'',()=>{store.set(DRAFT,{at:P.savedAt||0,data:JSON.parse(clean(P))})}],[t('restore'),'primary',()=>{P=dp;sel.clear();commit();renderAll();setTimeout(fit,0);toast(t('restoreDone'))}]]),50);
  }
  renderAll();
  requestAnimationFrame(()=>{if(!emb)fit();else updView()});
})();

</script>
