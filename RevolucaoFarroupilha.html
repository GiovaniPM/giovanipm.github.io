<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>A Revolução Farroupilha · Giovani Perotto Mesquita</title>
<meta name="description" content="Jogo de tabuleiro com dados sobre as batalhas da Revolução Farroupilha (1835–1845), da tomada de Porto Alegre à paz de Ponche Verde, com datas, chefes e números tirados das fontes. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#14261B">
<style>
  :root {
    --bg: #14261B; --panel: #F6EEDC; --panel-2: #EBDDBF; --ink: #2A1D14; --muted: #6E5B47; --line: #D3BF97;
    --accent: #A3241E; --sand: rgba(201,154,46,.14); --accent-ink: #FFFFFF; --gold: #C99A2E; --ok: #2F6B3A; --sea: #9DB8C2; --sea-2: #86A6B2; --land: #E9DDBE; --land-2: #DCCBA2;
    --road: #6B4A2A; --river: #4F7F91; --searoute: #2F5E8F; --coast: #5E4A32; --mapink: #2A1D14; --hatch: #7A5530; --tree: #4E6B38;
    --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif; --serif: Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: #241C15; --panel-2: #30261D; --ink: #F1E7D3; --muted: #BDAA8C; --line: #4A3C2C; --accent: #E0614F; --accent-ink: #1A0E08; --ok: #7CC48A; --sea: #2D4651; --sea-2: #253B45; --land: #5A4C36; --land-2: #4E412E; --road: #D8B888; --river: #86BED0; --searoute: #9CC3E6; --coast: #C9B48E; --mapink: #F1E7D3; --hatch: #C9A574; --tree: #9CC48A; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --panel: #241C15; --panel-2: #30261D; --ink: #F1E7D3; --muted: #BDAA8C; --line: #4A3C2C; --accent: #E0614F; --accent-ink: #1A0E08; --ok: #7CC48A; --sea: #2D4651; --sea-2: #253B45; --land: #5A4C36; --land-2: #4E412E; --road: #D8B888; --river: #86BED0; --searoute: #9CC3E6; --coast: #C9B48E; --mapink: #F1E7D3; --hatch: #C9A574; --tree: #9CC48A; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { overflow-x: hidden; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 8px; padding: 8px; height: 100dvh; }
  .stage { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .side { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .75rem; }
  .box h2 { font-family: var(--serif); font-size: 1rem; margin: 0 0 .4rem; }
  .topbar { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; color: #F3E6CC; font-size: .86rem; }
  .topbar .info { display: flex; gap: .3rem .9rem; flex-wrap: wrap; flex: 1; min-width: 0; align-items: baseline; }
  .topbar .date { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: #F7D27A; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: .45rem .8rem; font-weight: 600; min-height: 38px; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.sm { padding: .25rem .55rem; min-height: 30px; font-size: .8rem; }
  .topbar .btn.sm { background: rgba(0,0,0,.3); color: #F3E6CC; border-color: rgba(255,255,255,.25); }
  .mapwrap { position: relative; flex: 1; min-height: 260px; border-radius: 14px; overflow: hidden; border: 4px solid #6B4A2A; background: var(--sea); touch-action: none; }
  #map { width: 100%; height: 100%; display: block; user-select: none; }
  .zoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .zoom .btn { width: 36px; padding: 0; background: var(--panel); }
  .legend { position: absolute; left: 8px; bottom: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: .72rem; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 60px); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #0006; }
  /* mapa */
  .node { cursor: pointer; }
  .node .lbl { font-family: var(--serif); font-size: 9px; fill: #2A1D14; paint-order: stroke; stroke: #F4EAD3; stroke-width: 2.4px; stroke-linejoin: round; pointer-events: none; }
  .rvl { font-size: calc(var(--k, 1) * 10px); font-style: italic; fill: var(--river); paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--k, 1) * 2.4px); }
  .mtl { font-size: calc(var(--k, 1) * 11px); font-style: italic; letter-spacing: .12em; fill: var(--road); paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--k, 1) * 2.4px); }
  .scalebar { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 5px; font-family: var(--serif); font-size: .72rem; color: var(--ink); }
  .scalebar i { display: block; height: 6px; margin-top: 3px; border: 1px solid var(--ink); border-top: 0; background: repeating-linear-gradient(90deg, var(--ink) 0 25%, transparent 25% 50%); }
  .compass { color: var(--mapink); position: absolute; right: 56px; top: 8px; width: 54px; height: 54px; pointer-events: none; opacity: .9; }
  .rl { font-size: calc(var(--k, 1) * 22px); } .sl { font-size: calc(var(--k, 1) * 13px); }
  :root[data-theme="dark"] .node .lbl { fill: #F1E7D3; stroke: #2A2117; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node .lbl { fill: #F1E7D3; stroke: #2A2117; } }
  :root[data-theme="dark"] .node circle.dot { stroke: #F1E7D3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node circle.dot { stroke: #F1E7D3; } }
  .node.reach circle.dot { stroke: #F7D27A; stroke-width: 3; }
  .node.reach .ring { display: block; }
  .node .ring { display: none; fill: none; stroke: #F7D27A; stroke-width: 1.5; stroke-dasharray: 3 2; }
  .node:focus-visible { outline: none; }
  .node:focus-visible circle.dot { stroke: #F7D27A; stroke-width: 4; }
  .army { cursor: pointer; }
  .army.sel rect.bg { stroke: #F7D27A; stroke-width: 3; }
  .army text { font-family: var(--sans); font-weight: 700; pointer-events: none; }
  /* painel */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stats div { background: var(--panel-2); border-radius: 8px; padding: 4px; }
  .stats b { display: block; font-family: var(--serif); font-size: 1.15rem; }
  .stats span { font-size: .72rem; color: var(--muted); }
  .armies { display: flex; flex-direction: column; gap: 4px; }
  .armies button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 8px; display: flex; justify-content: space-between; gap: 6px; font-size: .84rem; }
  .armies button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .armies button.done { opacity: .6; }
  .leg { display: grid; grid-template-columns: minmax(0, 12em) minmax(36px, 1fr) auto; white-space: nowrap; gap: 6px; align-items: center; font-size: .8rem; padding: 2px 0; }
  .leg .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .leg .bar i { display: block; height: 100%; background: var(--accent); }
  .leg b { font-family: var(--serif); }
  .leg label { display: flex; align-items: center; gap: 4px; min-width: 0; } .leg label b { overflow: hidden; text-overflow: ellipsis; }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .acts .btn { flex: 1 1 46%; font-size: .82rem; }
  .moves { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .moves .btn { font-size: .78rem; }
  .muted { color: var(--muted); font-size: .8rem; }
  .cp { font-weight: 700; color: var(--accent); }
  .logbox ol { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; font-size: .8rem; line-height: 1.4; }
  .logbox li { padding: 2px 0; border-bottom: 1px dotted var(--line); }
  .logbox li.h { font-weight: 700; color: var(--accent); font-family: var(--serif); border-bottom: 0; padding-top: 6px; }
  .logbox li.q { font-style: italic; color: var(--muted); }
  /* dados */
  .dice { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; align-items: center; }
  .die { width: 28px; height: 28px; border-radius: 6px; background: #FBF7EE; border: 1px solid #8A7556; box-shadow: inset 0 -2px 0 #0002, 0 1px 2px #0004; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 3px; }
  .die.red { background: #8E1B1B; border-color: #5A0F0F; }
  .die.red i { background: #FBF0D8; }
  .die.grn { background: #3E6B3A; border-color: #24401F; }
  .die.grn i { background: #F3EBD3; }
  .die.pur { background: #5B2D6E; border-color: #3A1B47; }
  .die.pur i { background: #F3EBD3; }
  .die i { width: 5px; height: 5px; border-radius: 50%; background: #2A1D14; place-self: center; visibility: hidden; }
  .die.hit { box-shadow: 0 0 0 2px var(--gold), 0 1px 2px #0004; }
  .die.miss { opacity: .55; }
  .die.roll { animation: roll .45s ease-out; }
  @keyframes roll { 0% { transform: rotate(-200deg) scale(.6); } 70% { transform: rotate(20deg) scale(1.1); } 100% { transform: none; } }
  /* diálogos */
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); width: min(760px, calc(100vw - 20px)); max-height: calc(100dvh - 30px); padding: 1rem 1.1rem; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-family: var(--serif); margin: 0 0 .5rem; }
  dialog h3 { margin: .9rem 0 .3rem; font-size: 1rem; font-family: var(--serif); }
  dialog p, dialog li { line-height: 1.5; font-size: .92rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .6rem; }
  .bt-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bt-sides > div { background: var(--panel-2); border-radius: 10px; padding: 8px; }
  .bt-sides h3 { margin: 0 0 4px; }
  .bt-sides ul { margin: 4px 0; padding-left: 1.1rem; font-size: .82rem; }
  .bt-val { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; }
  .bt-log { max-height: 200px; overflow: auto; font-size: .85rem; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .bt-log p { margin: .2rem 0; }
  .quote { font-family: var(--serif); font-style: italic; color: var(--muted); border-left: 3px solid var(--gold); padding-left: .7rem; margin: .5rem 0; }
  .ev-src { font-size: .78rem; color: var(--muted); }
  .overlay { position: fixed; inset: 0; z-index: 50; overflow: auto; background: radial-gradient(ellipse at 50% 25%, #2E5236, #0D1A11 75%); display: flex; align-items: flex-start; justify-content: center; padding: 16px; }
  .sheet { width: min(860px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.2rem 1.2rem; margin: auto 0; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .sheet h1 { font-family: var(--serif); margin: .2rem 0; font-size: clamp(1.7rem, 5vw, 2.5rem); letter-spacing: .02em; }
  .sheet .tag2 { margin: 0 0 .6rem; color: var(--muted); }
  .sheet .back { color: var(--accent); font-weight: 600; text-decoration: none; font-size: .9rem; }
  .hero { font-family: var(--serif); text-align: center; letter-spacing: .3em; color: var(--accent); font-size: .9rem; margin: .3rem 0; }
  .scen { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: .6rem 0; }
  .scen label { border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; background: var(--panel-2); display: flex; gap: .5rem; align-items: flex-start; cursor: pointer; }
  .scen label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .scen b { font-family: var(--serif); display: block; }
  .scen small { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .5rem .8rem; }
  .field { display: flex; flex-direction: column; gap: .2rem; font-size: .85rem; font-weight: 600; }
  .field select, .field input { font-weight: 400; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: .4rem .5rem; min-height: 38px; }
  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; height: auto; min-height: 100dvh; }
    .mapwrap { flex: none; height: min(70dvh, 560px); }
    .side { overflow: visible; }
  }
  @media (max-width: 560px) {
    .topbar .info { flex-basis: 100%; }
    .mapwrap { overflow: visible; margin-bottom: 92px; height: 62dvh; }
    #map { border-radius: 10px; }
    .compass { width: 40px; height: 40px; }
    .legend { top: calc(100% + 8px); bottom: auto; left: -4px; max-width: calc(100% + 8px); font-size: .68rem; }
    .bt-sides { grid-template-columns: 1fr; }
    .acts .btn { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .die.roll { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <main class="stage">
    <div class="topbar">
      <div class="info"><span class="date" id="date"></span><span id="scenName"></span></div>
      <button type="button" class="btn sm" id="bRules" data-t="rules"></button>
      <button type="button" class="btn sm" id="bTheme"></button>
      <button type="button" class="btn sm" id="bSpeed"></button>
      <button type="button" class="btn sm" id="bMenu" data-t="menu"></button>
    </div>
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="group" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="zoom"><button type="button" class="btn sm" id="zIn" aria-label="+">+</button><button type="button" class="btn sm" id="zOut" aria-label="−">−</button><button type="button" class="btn sm" id="zFit" aria-label="⤢">⤢</button></div>
      <div class="legend" id="legend"></div>
      <div class="scalebar" id="scalebar" aria-hidden="true"><span id="scaleTxt">50 km</span><i id="scaleBar"></i></div>
      <svg class="compass" viewBox="-30 -30 60 60" aria-hidden="true"><circle r="22" fill="none" stroke="currentColor" stroke-width="1"/><circle r="17" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="1.5 1.5"/><path d="M0-27L4 0L0 27L-4 0Z" fill="#A3241E"/><path d="M-27 0L0-4L27 0L0 4Z" fill="currentColor"/><path d="M0-27L4 0L-4 0Z" fill="var(--land)" opacity=".5"/><text y="-23" text-anchor="middle" font-family="Georgia" font-size="7" fill="currentColor" dy="-6">N</text><text y="31" text-anchor="middle" font-family="Georgia" font-size="7" fill="currentColor" dy="2">S</text></svg>
    </div>
  </main>
  <aside class="side">
    <section class="box"><div class="stats"><div><b id="sGloria">0</b><span data-t="gloria"></span></div><div><b id="sAuct">0</b><span data-t="auctoritas"></span></div><div><b id="sMil">0</b><span data-t="soldiers"></span></div></div></section>
    <section class="box"><h2 data-t="yourArmies"></h2><div class="armies" id="armyList"></div></section>
    <section class="box" id="selBox"></section>
    <section class="box"><h2 data-t="diceT"></h2><div class="dice" id="diceTray" aria-live="polite"></div><p class="muted" id="diceTxt"></p>
      <div class="row"><button type="button" class="btn pri" id="bEnd" data-t="endSeason"></button></div></section>
    <section class="box logbox"><h2 data-t="logT"></h2><ol id="log"></ol></section>
  </aside>
</div>

<section class="overlay" id="ovSetup" aria-labelledby="ttl">
  <div class="sheet">
    <a class="back" id="backLink" href="projects.html" data-t="back"></a>
    <p class="hero">REPÚBLICA RIO-GRANDENSE</p>
    <h1 id="ttl" data-t="title"></h1>
    <p class="tag2" data-t="tagline"></p>
    <p class="quote" data-t="openQuote"></p>
    <div class="scen" id="scenList" role="radiogroup"></div>
    <div class="grid">
      <label class="field"><span data-t="difficulty"></span><select id="sDiff"><option value="0" data-t="d0"></option><option value="1" data-t="d1"></option><option value="2" data-t="d2"></option></select></label>
      <label class="field"><span data-t="lang"></span><select id="sLang"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
      <label class="field"><span data-t="seed"></span><input id="sSeed" inputmode="numeric" autocomplete="off"></label>
    </div>
    <div class="row">
      <button type="button" class="btn pri" id="bPlay" data-t="play"></button>
      <button type="button" class="btn" id="bResume" data-t="resume" hidden></button>
      <button type="button" class="btn" id="bRules2" data-t="rules"></button>
      <button type="button" class="btn" id="bTheme2"></button>
    </div>
  </div>
</section>

<dialog id="dRules" aria-labelledby="rulesH"><h2 id="rulesH" data-t="rules"></h2><div id="rulesBody"></div><div class="row"><button type="button" class="btn pri" id="bRulesClose" data-t="close"></button></div></dialog>
<dialog id="dEvent" aria-labelledby="evH"><h2 id="evH"></h2><div id="evBody"></div><div class="row" id="evBtns"></div></dialog>
<dialog id="dBattle" aria-labelledby="btH"><h2 id="btH"></h2><div id="btBody"></div><div class="dice" id="btDice"></div><div class="bt-log" id="btLog" aria-live="polite"></div><div class="row" id="btBtns"></div></dialog>

<script>
(() => {

    ['portoalegre', 'Porto Alegre', 'Porto Alegre', -30.03, -51.23, 'city', 3, 'hostile', 'lit', 1, 'l'],
    ['viamao', 'Viamão', 'Viamão', -30.08, -51.02, 'plain', 0, 'neutral', 'lit', 0, 'b'],
    ['saoleopoldo', 'São Leopoldo', 'São Leopoldo', -29.76, -51.15, 'plain', 1, 'hostile', 'lit', 0, 'u'],

    ['torres', 'Torres', 'Torres', -29.34, -49.73, 'coast', 1, 'neutral', 'lit', 0],
    ['triunfo', 'Triunfo', 'Triunfo', -29.94, -51.72, 'plain', 1, 'neutral', 'cen', 0, 'b'],
    ['taquari', 'Taquari', 'Taquari', -29.8, -51.86, 'plain', 0, 'neutral', 'cen', 0, 'u'],
    ['riopardo', 'Rio Pardo', 'Rio Pardo', -29.99, -52.38, 'city', 2, 'hostile', 'cen', 0, 'u'],
    ['cachoeira', 'Cachoeira', 'Cachoeira do Sul', -30.04, -52.89, 'plain', 1, 'neutral', 'cen', 0, 'u'],
    ['santamaria', 'Santa Maria', 'Santa Maria', -29.69, -53.81, 'plain', 0, 'neutral', 'cen', 0],
    ['encruzilhada', 'Encruzilhada', 'Encruzilhada do Sul', -30.54, -52.52, 'hill', 0, 'allied', 'sul', 0, 'b'],
    ['cacapava', 'Caçapava', 'Caçapava do Sul', -30.51, -53.49, 'hill', 2, 'allied', 'sul', 0],
    ['camaqua', 'Camaquã', 'Camaquã', -30.85, -51.81, 'plain', 0, 'allied', 'sul', 2],

    deceitP: ['Os bombeiros dizem que a força de Francisco Pedro de Abreu, o Moringue, anda longe e não chega antes de dias. Uns oficiais querem dar descanso à tropa no acampamento; outros querem montar a cavalo e sair ao encontro dele já, antes que ele escolha a hora.', 'The scouts say the force of Francisco Pedro de Abreu, “Moringue”, is far away and will not arrive for days. Some officers want to rest the troops in camp; others want to mount and ride out to meet him now, before he chooses the hour.', 'Gli esploratori dicono che la forza di Francisco Pedro de Abreu, il “Moringue”, è lontana e non arriverà prima di giorni. Alcuni ufficiali vogliono far riposare la truppa nel campo; altri vogliono montare a cavallo e andargli incontro subito, prima che scelga lui l’ora.', 'Los bomberos dicen que la fuerza de Francisco Pedro de Abreu, el Moringue, anda lejos y no llegará en días. Unos oficiales quieren dar descanso a la tropa en el campamento; otros quieren montar y salir a su encuentro ya, antes de que él elija la hora.'],

    histCmp: ['Na história, os farroupilhas tomaram Porto Alegre em 20 de setembro de 1835 e a perderam em junho de 1836; venceram no Seival e proclamaram a República em setembro de 1836; Bento Gonçalves caiu preso no Fanfa e fugiu em 1837; venceram em Rio Pardo (1838) e tomaram Laguna (1839), que o Império retomou quatro meses depois. Porto Alegre e Rio Grande nunca voltaram às mãos deles. Depois de Porongos (1844), a paz de Ponche Verde, em 1º de março de 1845, deu anistia geral.', 'In history the Farroupilhas took Porto Alegre on 20 September 1835 and lost it in June 1836; they won at Seival and proclaimed the Republic in September 1836; Bento Gonçalves was captured at Fanfa and escaped in 1837; they won at Rio Pardo (1838) and took Laguna (1839), which the Empire retook four months later. They never regained Porto Alegre or Rio Grande. After Porongos (1844), the peace of Ponche Verde on 1 March 1845 brought a general amnesty.', 'Nella storia i farroupilhas presero Porto Alegre il 20 settembre 1835 e la persero nel giugno 1836; vinsero al Seival e proclamarono la Repubblica nel settembre 1836; Bento Gonçalves fu catturato al Fanfa e fuggì nel 1837; vinsero a Rio Pardo (1838) e presero Laguna (1839), che l’Impero riprese quattro mesi dopo. Porto Alegre e Rio Grande non tornarono mai nelle loro mani. Dopo Porongos (1844), la pace di Ponche Verde, il 1º marzo 1845, portò l’amnistia generale.', 'En la historia, los farroupilhas tomaron Porto Alegre el 20 de septiembre de 1835 y la perdieron en junio de 1836; vencieron en el Seival y proclamaron la República en septiembre de 1836; Bento Gonçalves cayó preso en el Fanfa y huyó en 1837; vencieron en Rio Pardo (1838) y tomaron Laguna (1839), que el Imperio retomó cuatro meses después. Porto Alegre y Rio Grande nunca volvieron a sus manos. Tras Porongos (1844), la paz de Ponche Verde, el 1 de marzo de 1845, trajo la amnistía general.'],

  // eventos históricos: título e texto em cada idioma; a fonte é dada à parte
  const EV = {
    setembro: [['20 de setembro', 'Em 20 de setembro de 1835, Bento Gonçalves, Gomes Jardim e Onofre Pires chegam a Porto Alegre com cerca de 200 a 300 homens (as fontes divergem). A guarnição, de uns 270 homens da Guarda Municipal, dos Permanentes e de voluntários, se recolhe. O presidente Fernandes Braga foge de escuna. Tome a capital.'], ['20 September', 'On 20 September 1835 Bento Gonçalves, Gomes Jardim and Onofre Pires reach Porto Alegre with about 200 to 300 men (the sources differ). The garrison, some 270 men of the Municipal Guard, the Permanentes and volunteers, falls back. President Fernandes Braga flees by schooner. Take the capital.'], ['20 settembre', 'Il 20 settembre 1835 Bento Gonçalves, Gomes Jardim e Onofre Pires arrivano a Porto Alegre con circa 200-300 uomini (le fonti divergono). La guarnigione, circa 270 uomini della Guardia Municipale, dei Permanentes e di volontari, si ritira. Il presidente Fernandes Braga fugge su una goletta. Prendi la capitale.'], ['20 de septiembre', 'El 20 de septiembre de 1835, Bento Gonçalves, Gomes Jardim y Onofre Pires llegan a Porto Alegre con unos 200 a 300 hombres (las fuentes difieren). La guarnición, unos 270 hombres de la Guardia Municipal, los Permanentes y voluntarios, se repliega. El presidente Fernandes Braga huye en una goleta. Toma la capital.'], 'Wikipédia, “Tomada de Porto Alegre”; Wikipedia, “Capture of Porto Alegre”'],
    legalidade: [['O governo legal se reorganiza', 'Rio Grande e São José do Norte ficam com o governo, apoiados pela esquadra. Dali sai uma força legal para retomar o interior.'], ['The lawful government regroups', 'Rio Grande and São José do Norte stay with the government, backed by the squadron. From there a loyalist force sets out to retake the interior.'], ['Il governo legale si riorganizza', 'Rio Grande e São José do Norte restano con il governo, sostenuti dalla squadra navale. Da lì parte una forza lealista per riprendere l’interno.'], ['El gobierno legal se reorganiza', 'Rio Grande y São José do Norte quedan con el gobierno, apoyados por la escuadra. De allí sale una fuerza legal para retomar el interior.'], 'Wikipedia, “Ragamuffin War”; Wikipédia, “Revolução Farroupilha”'],
    retomada: [['A retomada de Porto Alegre', 'Em 15 de junho de 1836, Manuel Marques de Sousa, preso num navio-prisão, lidera um levante com o 8º Batalhão de Caçadores e colonos alemães de São Leopoldo e retoma Porto Alegre, guardada só pela polícia. Na história, a cidade ficou com o Império até o fim da guerra. No jogo, uma coluna farroupilha dentro da cidade impede o levante.'], ['The recapture of Porto Alegre', 'On 15 June 1836 Manuel Marques de Sousa, held on a prison ship, leads a rising with the 8th Caçadores Battalion and German colonists from São Leopoldo and retakes Porto Alegre, guarded only by police. In history the city stayed with the Empire until the end of the war. In the game, a Farroupilha column inside the city prevents the rising.'], ['La riconquista di Porto Alegre', 'Il 15 giugno 1836 Manuel Marques de Sousa, prigioniero su una nave-prigione, guida una sollevazione con l’8º Battaglione Cacciatori e coloni tedeschi di São Leopoldo e riprende Porto Alegre, difesa solo dalla polizia. Nella storia la città restò all’Impero fino alla fine della guerra. Nel gioco, una colonna farroupilha dentro la città impedisce la sollevazione.'], ['La recuperación de Porto Alegre', 'El 15 de junio de 1836, Manuel Marques de Sousa, preso en un barco-prisión, encabeza un levantamiento con el 8.º Batallón de Cazadores y colonos alemanes de São Leopoldo y retoma Porto Alegre, guardada solo por la policía. En la historia, la ciudad quedó con el Imperio hasta el fin de la guerra. En el juego, una columna farroupilha dentro de la ciudad impide el levantamiento.'], 'Wikipedia, “Recapture of Porto Alegre” (Spalding, 1939; Fragoso, 1938); Wikipedia, “Ragamuffin War”'],
    seival: [['O Seival', 'Junto ao arroio Seival, perto de Candiota, João da Silva Tavares espera com 500 a 560 legalistas. Antônio de Sousa Netto tem 400 a 430 homens (as fontes divergem). Na história, em 10 de setembro de 1836, Netto venceu, e as baixas legais foram pesadas.'], ['Seival', 'By the Seival stream, near Candiota, João da Silva Tavares waits with 500 to 560 loyalists. Antônio de Sousa Netto has 400 to 430 men (the sources differ). In history, on 10 September 1836, Netto won and the loyalist losses were heavy.'], ['Il Seival', 'Presso il torrente Seival, vicino a Candiota, João da Silva Tavares aspetta con 500-560 lealisti. Antônio de Sousa Netto ha 400-430 uomini (le fonti divergono). Nella storia, il 10 settembre 1836, Netto vinse e le perdite lealiste furono pesanti.'], ['El Seival', 'Junto al arroyo Seival, cerca de Candiota, João da Silva Tavares espera con 500 a 560 legalistas. Antônio de Sousa Netto tiene 400 a 430 hombres (las fuentes difieren). En la historia, el 10 de septiembre de 1836, Netto venció y las bajas legales fueron grandes.'], 'Wikipédia, “Batalha do Seival”; Wikipedia, “Battle of Seival” (Donato; Hartmann, 2002)'],
    fanfa: [['O Fanfa', 'Bento Manuel Ribeiro, agora com o governo, sobe o Jacuí com 1.000 soldados e a flotilha de John Pascoe Grenfell: um vapor e canhoneiras. Na história, em 3 e 4 de outubro de 1836, Bento Gonçalves e 1.100 homens ficaram cercados na ilha do Fanfa, perto de Triunfo; a rendição negociada foi rompida e ele foi preso. Fique longe dos rios ou enfrente-os com força.'], ['Fanfa', 'Bento Manuel Ribeiro, now with the government, comes up the Jacuí with 1,000 soldiers and John Pascoe Grenfell’s flotilla: a steamer and gunboats. In history, on 3 and 4 October 1836, Bento Gonçalves and 1,100 men were trapped on Fanfa island near Triunfo; the negotiated surrender was broken and he was taken prisoner. Keep away from the rivers or meet them in strength.'], ['Il Fanfa', 'Bento Manuel Ribeiro, ora con il governo, risale il Jacuí con 1.000 soldati e la flottiglia di John Pascoe Grenfell: un vapore e cannoniere. Nella storia, il 3 e 4 ottobre 1836, Bento Gonçalves e 1.100 uomini restarono accerchiati sull’isola del Fanfa, vicino a Triunfo; la resa negoziata fu violata e lui fu fatto prigioniero. Stai lontano dai fiumi o affrontali in forze.'], ['El Fanfa', 'Bento Manuel Ribeiro, ahora con el gobierno, sube el Jacuí con 1.000 soldados y la flotilla de John Pascoe Grenfell: un vapor y cañoneras. En la historia, el 3 y 4 de octubre de 1836, Bento Gonçalves y 1.100 hombres quedaron cercados en la isla del Fanfa, cerca de Triunfo; la rendición negociada se rompió y él cayó preso. Mantente lejos de los ríos o enfréntalos con fuerza.'], 'Wikipédia, “Batalha da Ilha do Fanfa”; Wikipedia, “Battle of Fanfa” (Donato; Fragoso)'],
    fuga: [['A volta de Bento Gonçalves', 'Preso desde o Fanfa, Bento Gonçalves foge em 1837 do Forte de São Marcelo, na Bahia, e volta ao Rio Grande. Netto e Bento Manuel, que agora luta pela República, esperam por ele.'], ['Bento Gonçalves returns', 'A prisoner since Fanfa, Bento Gonçalves escapes in 1837 from São Marcelo Fort in Bahia and returns to Rio Grande do Sul. Netto and Bento Manuel, who now fights for the Republic, await him.'], ['Il ritorno di Bento Gonçalves', 'Prigioniero dal Fanfa, Bento Gonçalves fugge nel 1837 dal Forte di São Marcelo, a Bahia, e torna nel Rio Grande. Netto e Bento Manuel, che ora combatte per la Repubblica, lo aspettano.'], ['La vuelta de Bento Gonçalves', 'Preso desde el Fanfa, Bento Gonçalves huye en 1837 del Fuerte de São Marcelo, en Bahía, y vuelve a Río Grande. Netto y Bento Manuel, que ahora lucha por la República, lo esperan.'], 'Wikipedia, “Battle of Fanfa”; Wikipédia, “Batalha do Barro Vermelho”'],
    barro: [['Rio Pardo', 'O marechal Sebastião Barreto defende Rio Pardo com cerca de 1.546 homens. Na história, em 30 de abril de 1838, Bento Gonçalves, Netto, Domingos Crescêncio e Bento Manuel atacaram com cerca de 2.800 ao amanhecer; em pouco mais de uma hora, os imperiais fugiram pelo Jacuí.'], ['Rio Pardo', 'Marshal Sebastião Barreto holds Rio Pardo with about 1,546 men. In history, on 30 April 1838, Bento Gonçalves, Netto, Domingos Crescêncio and Bento Manuel attacked with about 2,800 at dawn; in little more than an hour the imperials fled down the Jacuí.'], ['Rio Pardo', 'Il maresciallo Sebastião Barreto difende Rio Pardo con circa 1.546 uomini. Nella storia, il 30 aprile 1838, Bento Gonçalves, Netto, Domingos Crescêncio e Bento Manuel attaccarono con circa 2.800 all’alba; in poco più di un’ora gli imperiali fuggirono lungo il Jacuí.'], ['Rio Pardo', 'El mariscal Sebastião Barreto defiende Rio Pardo con unos 1.546 hombres. En la historia, el 30 de abril de 1838, Bento Gonçalves, Netto, Domingos Crescêncio y Bento Manuel atacaron con unos 2.800 al amanecer; en poco más de una hora, los imperiales huyeron por el Jacuí.'], 'Wikipédia, “Batalha do Barro Vermelho”; Wikipedia, “Battle of Barro Vermelho” (Bento, 1993; Fragoso, 1938; Hartmann, 2002)'],
    laguna: [['A expedição a Laguna', 'Garibaldi e John Griggs levam os lanchões ao mar, e David Canabarro marcha por terra até Laguna, em Santa Catarina, defendida por cerca de 1.000 homens e navios de guerra. Na história, a vila caiu em 22 de julho de 1839, num ataque noturno pela barra. Canabarro está em Torres, com lanchões.'], ['The Laguna expedition', 'Garibaldi and John Griggs take the boats to sea, and David Canabarro marches overland to Laguna, in Santa Catarina, held by about 1,000 men and warships. In history the town fell on 22 July 1839, in a night attack through the bar. Canabarro is at Torres, with boats.'], ['La spedizione a Laguna', 'Garibaldi e John Griggs portano le lance in mare, e David Canabarro marcia via terra fino a Laguna, in Santa Catarina, difesa da circa 1.000 uomini e navi da guerra. Nella storia la città cadde il 22 luglio 1839, in un attacco notturno attraverso la barra. Canabarro è a Torres, con le lance.'], ['La expedición a Laguna', 'Garibaldi y John Griggs llevan las lanchas al mar, y David Canabarro marcha por tierra hasta Laguna, en Santa Catarina, defendida por unos 1.000 hombres y buques de guerra. En la historia, la villa cayó el 22 de julio de 1839, en un ataque nocturno por la barra. Canabarro está en Torres, con lanchas.'], 'Wikipédia, “Tomada de Laguna”'],
    retLaguna: [['O Império volta a Laguna', 'Uma expedição imperial marcha para o sul de Santa Catarina. Na história, Laguna voltou às mãos do Império quatro meses depois de tomada.'], ['The Empire returns to Laguna', 'An imperial expedition marches on southern Santa Catarina. In history Laguna went back to the Empire four months after its capture.'], ['L’Impero torna a Laguna', 'Una spedizione imperiale marcia sul sud di Santa Catarina. Nella storia Laguna tornò all’Impero quattro mesi dopo la presa.'], ['El Imperio vuelve a Laguna', 'Una expedición imperial marcha hacia el sur de Santa Catarina. En la historia, Laguna volvió al Imperio cuatro meses después de tomada.'], 'Wikipedia, “Ragamuffin War”'],
    santavitoria: [['Santa Vitória', 'Francisco Xavier da Cunha desce para o passo de Santa Vitória, no rio Pelotas, com cerca de 2.000 imperiais, no caminho entre Vacaria e Lages. Na história, em 14 de dezembro de 1839, Teixeira Nunes e Garibaldi, com cerca de 500 homens, o derrotaram, e Xavier da Cunha morreu afogado no rio.'], ['Santa Vitória', 'Francisco Xavier da Cunha comes down to the Santa Vitória pass on the Pelotas river with about 2,000 imperials, on the road between Vacaria and Lages. In history, on 14 December 1839, Teixeira Nunes and Garibaldi, with about 500 men, defeated him, and Xavier da Cunha drowned in the river.'], ['Santa Vitória', 'Francisco Xavier da Cunha scende al passo di Santa Vitória, sul fiume Pelotas, con circa 2.000 imperiali, sulla strada tra Vacaria e Lages. Nella storia, il 14 dicembre 1839, Teixeira Nunes e Garibaldi, con circa 500 uomini, lo sconfissero, e Xavier da Cunha annegò nel fiume.'], ['Santa Vitória', 'Francisco Xavier da Cunha baja al paso de Santa Vitória, en el río Pelotas, con unos 2.000 imperiales, en el camino entre Vacaria y Lages. En la historia, el 14 de diciembre de 1839, Teixeira Nunes y Garibaldi, con unos 500 hombres, lo derrotaron, y Xavier da Cunha murió ahogado en el río.'], 'Wikipedia, “Battle of Santa Vitória” (Ridley, 1976)'],
    taquari: [['Taquari', 'Manuel Jorge Rodrigues reúne o exército imperial em Taquari, com cerca de 4.300 homens e a flotilha de Grenfell. Na história, em 3 de maio de 1840, ele enfrentou cerca de 3.360 republicanos de Bento Gonçalves e Netto, e o resultado foi indeciso.'], ['Taquari', 'Manuel Jorge Rodrigues gathers the imperial army at Taquari, about 4,300 men, with Grenfell’s flotilla. In history, on 3 May 1840, he faced about 3,360 republicans under Bento Gonçalves and Netto, and the result was indecisive.'], ['Taquari', 'Manuel Jorge Rodrigues raduna l’esercito imperiale a Taquari, circa 4.300 uomini, con la flottiglia di Grenfell. Nella storia, il 3 maggio 1840, affrontò circa 3.360 repubblicani di Bento Gonçalves e Netto, e il risultato fu incerto.'], ['Taquari', 'Manuel Jorge Rodrigues reúne el ejército imperial en Taquari, unos 4.300 hombres, con la flotilla de Grenfell. En la historia, el 3 de mayo de 1840, enfrentó a unos 3.360 republicanos de Bento Gonçalves y Netto, y el resultado fue indeciso.'], 'Wikipedia, “Battle of Taquari” (Hartmann, 2002; Fragoso, 1938)'],
    sjnorte: [['São José do Norte', 'São José do Norte guarda a entrada da lagoa com 599 homens, que Rio Grande pode reforçar. Na história, em 16 de julho de 1840, Bento Gonçalves, Domingos Crescêncio e Garibaldi atacaram com cerca de 1.200 homens; depois de nove horas de luta na chuva, recuaram, e Bento Gonçalves recusou a proposta de Garibaldi de incendiar a vila.'], ['São José do Norte', 'São José do Norte guards the entrance of the lagoon with 599 men, whom Rio Grande can reinforce. In history, on 16 July 1840, Bento Gonçalves, Domingos Crescêncio and Garibaldi attacked with about 1,200 men; after nine hours of fighting in the rain they withdrew, and Bento Gonçalves refused Garibaldi’s proposal to burn the town.'], ['São José do Norte', 'São José do Norte difende l’ingresso della laguna con 599 uomini, che Rio Grande può rinforzare. Nella storia, il 16 luglio 1840, Bento Gonçalves, Domingos Crescêncio e Garibaldi attaccarono con circa 1.200 uomini; dopo nove ore di lotta sotto la pioggia si ritirarono, e Bento Gonçalves rifiutò la proposta di Garibaldi di incendiare la città.'], ['São José do Norte', 'São José do Norte guarda la entrada de la laguna con 599 hombres, que Rio Grande puede reforzar. En la historia, el 16 de julio de 1840, Bento Gonçalves, Domingos Crescêncio y Garibaldi atacaron con unos 1.200 hombres; tras nueve horas de lucha bajo la lluvia se retiraron, y Bento Gonçalves rechazó la propuesta de Garibaldi de incendiar la villa.'], 'Wikipedia, “Battle of São José do Norte” (Donato, 1996)'],
    caxias: [['Caxias', 'Em 1842, Luís Alves de Lima e Silva, barão de Caxias, assume a presidência e o comando das armas da província. O quadro do artigo em português dá entre 11.500 e 12.000 soldados de um lado e 3.500 do outro, em 1842. O exército imperial está em Rio Pardo e vai crescer.'], ['Caxias', 'In 1842 Luís Alves de Lima e Silva, Baron of Caxias, takes over as president and military commander of the province. The infobox of the Portuguese article gives 11,500 to 12,000 soldiers on one side and 3,500 on the other, in 1842. The imperial army is at Rio Pardo and will grow.'], ['Caxias', 'Nel 1842 Luís Alves de Lima e Silva, barone di Caxias, assume la presidenza e il comando militare della provincia. Il riquadro dell’articolo in portoghese dà tra 11.500 e 12.000 soldati da una parte e 3.500 dall’altra, nel 1842. L’esercito imperiale è a Rio Pardo e crescerà.'], ['Caxias', 'En 1842, Luís Alves de Lima e Silva, barón de Caxias, asume la presidencia y el mando militar de la provincia. El cuadro del artículo en portugués da entre 11.500 y 12.000 soldados de un lado y 3.500 del otro, en 1842. El ejército imperial está en Rio Pardo y va a crecer.'], 'Wikipédia, “Revolução Farroupilha”; Wikipedia, “Ragamuffin War”'],
    ponche: [['Ponche Verde', 'Bento Manuel, de volta ao lado imperial, e Francisco Pedro de Abreu marcham para a estância de Ponche Verde com cerca de 1.425 homens. Na história, em 26 de maio de 1843, Bento Gonçalves, Canabarro e Netto os atacaram com cerca de 2.800, aproveitando a cavalaria; os dois lados proclamaram vitória.'], ['Ponche Verde', 'Bento Manuel, back on the imperial side, and Francisco Pedro de Abreu march on the Ponche Verde ranch with about 1,425 men. In history, on 26 May 1843, Bento Gonçalves, Canabarro and Netto attacked them with about 2,800, using their cavalry; both sides claimed victory.'], ['Ponche Verde', 'Bento Manuel, tornato dalla parte imperiale, e Francisco Pedro de Abreu marciano sull’estancia di Ponche Verde con circa 1.425 uomini. Nella storia, il 26 maggio 1843, Bento Gonçalves, Canabarro e Netto li attaccarono con circa 2.800, sfruttando la cavalleria; entrambe le parti proclamarono vittoria.'], ['Ponche Verde', 'Bento Manuel, de vuelta en el bando imperial, y Francisco Pedro de Abreu marchan hacia la estancia de Ponche Verde con unos 1.425 hombres. En la historia, el 26 de mayo de 1843, Bento Gonçalves, Canabarro y Netto los atacaron con unos 2.800, aprovechando la caballería; ambos lados proclamaron la victoria.'], 'Wikipédia, “Batalha do Ponche Verde” (Hartmann, 2002; Donato, 1996)'],
    porongos: [['Porongos', 'Francisco Pedro de Abreu, o Moringue, ronda os acampamentos republicanos com cavalaria ligeira. Na história, em 14 de novembro de 1844, ele surpreendeu o acampamento de Canabarro junto ao arroio Porongos, em Pinheiro Machado; os Lanceiros Negros de Teixeira Nunes sofreram as maiores perdas. Os números variam muito, e a culpa de Canabarro é discutida até hoje.'], ['Porongos', 'Francisco Pedro de Abreu, “Moringue”, prowls around the republican camps with light cavalry. In history, on 14 November 1844, he surprised Canabarro’s camp by the Porongos stream, in Pinheiro Machado; Teixeira Nunes’s Black Lancers suffered the heaviest losses. The figures vary widely, and Canabarro’s responsibility is still debated.'], ['Porongos', 'Francisco Pedro de Abreu, il “Moringue”, si aggira intorno ai campi repubblicani con cavalleria leggera. Nella storia, il 14 novembre 1844, sorprese il campo di Canabarro presso il torrente Porongos, a Pinheiro Machado; i Lancieri Neri di Teixeira Nunes subirono le perdite maggiori. Le cifre variano molto, e la colpa di Canabarro è discussa ancora oggi.'], ['Porongos', 'Francisco Pedro de Abreu, el Moringue, ronda los campamentos republicanos con caballería ligera. En la historia, el 14 de noviembre de 1844, sorprendió el campamento de Canabarro junto al arroyo Porongos, en Pinheiro Machado; los Lanceros Negros de Teixeira Nunes sufrieron las mayores pérdidas. Las cifras varían mucho, y la culpa de Canabarro se discute hasta hoy.'], 'Wikipédia, “Massacre de Porongos”'],
    paz: [['A paz de Ponche Verde', 'Em 1º de março de 1845, o Tratado de Ponche Verde, em Dom Pedrito, encerra a guerra: anistia geral, incorporação dos oficiais republicanos ao exército imperial, escolha do novo presidente da província pelos republicanos, pagamento das dívidas da República pelo Império e taxa de 25% sobre o charque importado. Segundo o artigo sobre Porongos, também a liberdade dos escravizados que lutaram.'], ['The peace of Ponche Verde', 'On 1 March 1845 the Treaty of Ponche Verde, at Dom Pedrito, ends the war: general amnesty, incorporation of republican officers into the imperial army, the republicans choose the next provincial president, the Empire pays the Republic’s debts and sets a 25% tariff on imported jerked beef. According to the article on Porongos, also freedom for the enslaved men who fought.'], ['La pace di Ponche Verde', 'Il 1º marzo 1845 il Trattato di Ponche Verde, a Dom Pedrito, chiude la guerra: amnistia generale, incorporazione degli ufficiali repubblicani nell’esercito imperiale, scelta del nuovo presidente della provincia da parte dei repubblicani, pagamento dei debiti della Repubblica da parte dell’Impero e dazio del 25% sul charque importato. Secondo l’articolo su Porongos, anche la libertà degli schiavi che combatterono.'], ['La paz de Ponche Verde', 'El 1 de marzo de 1845, el Tratado de Ponche Verde, en Dom Pedrito, pone fin a la guerra: amnistía general, incorporación de los oficiales republicanos al ejército imperial, elección del nuevo presidente de la provincia por los republicanos, pago de las deudas de la República por el Imperio y arancel del 25% sobre el charque importado. Según el artículo sobre Porongos, también la libertad de los esclavizados que lucharon.'], 'Wikipedia, “Ragamuffin War”; Wikipédia, “Massacre de Porongos”'],

  const RULES = {
    pt: `<p>Você comanda Bento Gonçalves e os chefes farroupilhas. O ano de campanha começa na primavera (setembro a novembro), segue pelo verão e pelo outono e termina no inverno (junho a agosto), passado nas estâncias: são as estações do hemisfério sul. Os imperiais agem pelas regras do jogo e pelos dados, seguindo o calendário das fontes.</p>
<h3>Estação</h3><ol><li><b>Sorte:</b> um dado decide chuvas, tropas de gado, vaqueanos ou novas adesões.</li><li><b>Comando:</b> cada coluna rola um dado. Bento Gonçalves recebe 3 + metade do dado (arredondada para cima); outro chefe, 1 + metade.</li><li><b>Ordens:</b> marchar custa o número da estrada (a subida da serra custa 2 ou 3). Para atravessar o Jacuí, o Camaquã ou o Pelotas, junte balsas numa das margens. A Lagoa dos Patos e o Guaíba só se atravessam entre portos, e a esquadra imperial pode barrar a travessia enquanto Rio Grande for imperial. O mar até Laguna só com lanchões, construídos no estaleiro do Camaquã. Entrar onde há uma força imperial em campo abre o combate.</li><li><b>Imperiais:</b> o exército imperial ataca quando se acha mais forte e recebe reforços; as guarnições ficam nas trincheiras; Moringue arma surpresas, e uma coluna acampada pode ter de escolher entre ficar ou sair ao encontro dele.</li><li><b>Víveres:</b> no fim da estação, quem está em terra farroupilha, simpática ou ocupada se abastece; fora dela perde 1. Com 0, os homens desertam.</li></ol>
<h3>Unidades</h3><p>Cada unidade tem 10 esquadrões e um número de homens; a cavalaria de cada coluna conta à parte. Os totais de cada cenário seguem as fontes quando elas dão números, como os cerca de 3.500 republicanos de 1842 no quadro do artigo em português. A divisão em unidades, as guarnições das vilas e o exército imperial dos anos sem números nas fontes são estimativas do jogo.</p>
<h3>Combate</h3><p>Cada 20 infantes valem 1 ponto (veteranos 1,35; elite 1,7); cada 40 cavaleiros valem 1. Imperiais: cada 1.000 milicianos valem 30 pontos vezes a qualidade, e cada 1.000 soldados de linha, 50. Cada lado rola um dado para cada 7 pontos (no máximo 14 ou 16), mais os modificadores de terreno, trincheiras, acampamento, cavalaria, artilharia, canhoneiras e Bento Gonçalves. Tropas veteranas acertam com 4 a 6; novatos e a maioria dos imperiais, com 5 ou 6. Cada acerto tira 3 pontos. Depois de cada rodada, quem sofreu mais rola 2d6 de moral: acima do valor, foge e sofre a perseguição da cavalaria. São no máximo três rodadas. Na surpresa, a primeira rodada é de quem ataca: rola dados a mais e acerta com 4 a 6, enquanto o surpreendido só acerta com 6 e tem moral 2 menor. Se a coluna de Bento Gonçalves foge, ele pode cair preso (1 em 12): a coluna mais forte assume o comando, e sem outra coluna a revolta acaba.</p>
<h3>Cercos</h3><p>Imperiais atrás de trincheiras precisam ser cercados: cada ordem de cerco soma um dado mais metade das unidades (e 2 com Bento Gonçalves). Quando o cerco chega a 6 vezes a fortificação, a vila cai. A cada estação os sitiados comem os víveres; sem víveres, rendem-se. Depois de retomada pelo Império, Porto Alegre se abastece pela água, como Rio Grande e São José do Norte: só uma coluna com lanchões consegue cercá-las. Na história, Porto Alegre resistiu aos cercos e nunca voltou às mãos dos farroupilhas.</p>
<h3>Capitais e façanhas</h3><p>Bento Gonçalves pode instalar a capital da República em Piratini, Caçapava, Alegrete ou São Gabriel, as quatro capitais oficiais da história (Bagé, por duas semanas, e São Borja também serviram de sede): a vila vira farroupilha e rende Glória. Vencer no Seival proclama a República; tomar Rio Pardo e Laguna rende Glória e Adesão.</p>
<h3>Inverno</h3><p>Colunas em terra amiga recuperam esquadrões; fora dela, perdem. Unidades que venceram podem virar veteranas. Gaste Adesão para completar unidades ou receber voluntários. Vilas ocupadas podem voltar ao lado legal. Se a Adesão cair abaixo de −3, a tropa se dispersa e a campanha termina.</p>
<h3>Vitória</h3><p>Glória vem de combates, vilas tomadas, adesões, capitais e façanhas. Cada cenário tem um objetivo histórico e vai até a data dele; o terceiro termina com o tratado de paz, em março de 1845.</p>
<h3>Fontes e realismo</h3><p>Datas, chefes e números vêm dos artigos da Wikipédia em português e da Wikipedia em inglês sobre a Revolução Farroupilha, a República Rio-Grandense, os Lanceiros Negros e cada combate (Tomada de Porto Alegre, Recapture of Porto Alegre, Seival, Ilha do Fanfa, Barro Vermelho, Tomada de Laguna, Santa Vitória, Taquari, São José do Norte, Ponche Verde e Massacre de Porongos), consultados em novembro de 2026; esses artigos citam Donato, Fragoso, Spalding, Hartmann e outros. As fontes divergem: na tomada de Porto Alegre, os rebeldes eram cerca de 200 ou de 300; no Seival, 400 ou 430 contra 500 a 560; as baixas do Seival, do Fanfa e de Porongos variam muito de um artigo para outro; em Porongos, o quadro do artigo dá 150 lanceiros e 260 imperiais, e o texto, mais de 1.200 republicanos e mais de 1.100 imperiais (o jogo usa o texto); Ponche Verde é dada como indefinida ou como vitória republicana, conforme o autor; a culpa de Canabarro em Porongos e a autenticidade da carta atribuída a Caxias são disputadas; o artigo sobre Laguna chama o comandante imperial ora de Vilas Boas, ora de Vilas Lobos. Os eventos de inverno (a retomada de Porto Alegre, em junho de 1836, e a expedição a Laguna, em julho de 1839) aparecem no começo do inverno do jogo; o ataque a São José do Norte, em julho de 1840, fica como alvo para o jogador. O mapa usa o litoral, a Lagoa Mirim e as fronteiras atuais do Natural Earth (domínio público) e os rios do OpenStreetMap (© colaboradores do OpenStreetMap, licença ODbL); as fronteiras desenhadas são as de hoje, não as da época. As vilas estão nas sedes dos municípios de hoje. As regras de combate são um modelo de jogo, não uma reconstrução militar.</p>`,
    en: `<p>You command Bento Gonçalves and the Farroupilha leaders. The campaign year begins in spring (September to November), runs through summer and autumn and ends in winter (June to August), spent on the ranches: these are southern-hemisphere seasons. The imperials act by the game rules and the dice, following the calendar of the sources.</p>
<h3>Season</h3><ol><li><b>Fortune:</b> one die decides rain, cattle herds, local guides or new supporters.</li><li><b>Command:</b> each column rolls a die. Bento Gonçalves gets 3 + half the die (rounded up); any other leader, 1 + half.</li><li><b>Orders:</b> marching costs the number on the road (climbing the serra costs 2 or 3). To cross the Jacuí, the Camaquã or the Pelotas, gather rafts on one bank. The Lagoa dos Patos and the Guaíba can only be crossed between ports, and the imperial squadron may bar the crossing while Rio Grande is imperial. The sea to Laguna needs boats, built at the Camaquã shipyard. Entering a place with an imperial force in the field starts a battle.</li><li><b>Imperials:</b> the imperial army attacks when it thinks itself stronger and receives reinforcements; garrisons stay behind their defences; Moringue sets surprises, and a camped column may have to choose between staying or riding out to meet him.</li><li><b>Supplies:</b> at the end of the season, columns on Farroupilha, friendly or occupied ground resupply; elsewhere they lose 1. At 0, men desert.</li></ol>
<h3>Units</h3><p>Each unit has 10 squadrons and a number of men; each column’s cavalry counts apart. The totals of each scenario follow the sources where they give numbers, such as the roughly 3,500 republicans of 1842 in the infobox of the Portuguese article. The split into units, the town garrisons and the imperial army in years without figures in the sources are game estimates.</p>
<h3>Battle</h3><p>Every 20 infantry are worth 1 point (veterans 1.35, elite 1.7); every 40 horsemen are worth 1. Imperials: every 1,000 militiamen are worth 30 points times their quality, and every 1,000 line soldiers 50. Each side rolls one die per 7 points (at most 14 or 16), plus modifiers for terrain, defences, camp, cavalry, artillery, gunboats and Bento Gonçalves. Veteran troops hit on 4 to 6; raw troops and most imperials on 5 or 6. Each hit removes 3 points. After each round the side that suffered more rolls 2d6 for morale: above the value it flees and suffers the cavalry pursuit. There are at most three rounds. In a surprise the first round belongs to the attacker: it rolls extra dice and hits on 4 to 6, while the surprised side hits only on 6 and has morale 2 lower. If Bento Gonçalves’s column flees, he may be captured (1 in 12): the strongest column takes command, and with no other column the revolt ends.</p>
<h3>Sieges</h3><p>Imperials behind defences must be besieged: each siege order adds a die plus half the units (and 2 with Bento Gonçalves). When the siege reaches 6 times the fortification, the town falls. Each season the besieged eat their food; without food they surrender. Once retaken by the Empire, Porto Alegre is supplied by water, like Rio Grande and São José do Norte: only a column with boats can besiege them. In history Porto Alegre withstood the sieges and never went back to the Farroupilhas.</p>
<h3>Capitals and feats</h3><p>Bento Gonçalves may seat the Republic’s capital at Piratini, Caçapava, Alegrete or São Gabriel, the four official capitals of history (Bagé, for two weeks, and São Borja also served as seat): the town becomes Farroupilha and gives Glory. Winning at Seival proclaims the Republic; taking Rio Pardo and Laguna gives Glory and Support.</p>
<h3>Winter</h3><p>Columns on friendly ground recover squadrons; elsewhere they lose them. Victorious units may become veterans. Spend Support to bring units up to strength or receive volunteers. Occupied towns may go back to the loyalists. If Support falls below −3, the troops scatter and the campaign ends.</p>
<h3>Victory</h3><p>Glory comes from battles, captured towns, new supporters, capitals and feats. Each scenario has a historical goal and runs to its date; the third ends with the peace treaty, in March 1845.</p>
<h3>Sources and realism</h3><p>Dates, leaders and numbers come from the Portuguese and English Wikipedia articles on the Ragamuffin War, the Riograndense Republic, the Black Lancers and each battle (Capture and Recapture of Porto Alegre, Seival, Fanfa, Barro Vermelho, Capture of Laguna, Santa Vitória, Taquari, São José do Norte, Ponche Verde and the Porongos massacre), consulted in November 2026; those articles cite Donato, Fragoso, Spalding, Hartmann and others. The sources disagree: at the capture of Porto Alegre the rebels were about 200 or 300; at Seival 400 or 430 against 500 to 560; the losses at Seival, Fanfa and Porongos vary widely from one article to another; for Porongos the infobox gives 150 lancers and 260 imperials, the text more than 1,200 republicans and more than 1,100 imperials (the game uses the text); Ponche Verde is given as indecisive or as a republican victory depending on the author; Canabarro’s responsibility at Porongos and the authenticity of the letter attributed to Caxias are disputed; the Laguna article calls the imperial commander both Vilas Boas and Vilas Lobos. The winter events (the recapture of Porto Alegre in June 1836 and the Laguna expedition in July 1839) appear at the start of the game’s winter; the attack on São José do Norte in July 1840 is left as a target for the player. The map uses the coastline, the Lagoa Mirim and the present-day borders from Natural Earth (public domain) and the rivers from OpenStreetMap (© OpenStreetMap contributors, ODbL licence); the borders drawn are today’s, not those of the time. Towns sit at today’s municipal seats. The battle rules are a game model, not a military reconstruction.</p>`,
    it: `<p>Comandi Bento Gonçalves e i capi farroupilhas. L’anno di campagna comincia in primavera (da settembre a novembre), prosegue in estate e in autunno e finisce in inverno (da giugno ad agosto), passato nelle estancias: sono le stagioni dell’emisfero sud. Gli imperiali agiscono secondo le regole del gioco e i dadi, seguendo il calendario delle fonti.</p>
<h3>Stagione</h3><ol><li><b>Sorte:</b> un dado decide piogge, mandrie, guide locali o nuove adesioni.</li><li><b>Comando:</b> ogni colonna tira un dado. Bento Gonçalves riceve 3 + metà del dado (arrotondata per eccesso); un altro capo, 1 + metà.</li><li><b>Ordini:</b> marciare costa il numero della strada (la salita della serra costa 2 o 3). Per attraversare il Jacuí, il Camaquã o il Pelotas, radunate zattere su una riva. La Lagoa dos Patos e il Guaíba si attraversano solo tra porti, e la squadra imperiale può sbarrare il passaggio finché Rio Grande è imperiale. Il mare fino a Laguna solo con le lance, costruite nel cantiere del Camaquã. Entrare dove c’è una forza imperiale in campo apre il combattimento.</li><li><b>Imperiali:</b> l’esercito imperiale attacca quando si crede più forte e riceve rinforzi; le guarnigioni restano dietro le difese; Moringue tende sorprese, e una colonna accampata può dover scegliere tra restare o uscirgli incontro.</li><li><b>Viveri:</b> a fine stagione, chi è in terra farroupilha, favorevole od occupata si rifornisce; altrove perde 1. A 0, gli uomini disertano.</li></ol>
<h3>Unità</h3><p>Ogni unità ha 10 squadroni e un numero di uomini; la cavalleria di ogni colonna conta a parte. I totali di ogni scenario seguono le fonti quando danno numeri, come i circa 3.500 repubblicani del 1842 nel riquadro dell’articolo in portoghese. La divisione in unità, le guarnigioni e l’esercito imperiale negli anni senza cifre nelle fonti sono stime del gioco.</p>
<h3>Combattimento</h3><p>Ogni 20 fanti valgono 1 punto (veterani 1,35; élite 1,7); ogni 40 cavalieri valgono 1. Imperiali: ogni 1.000 miliziani valgono 30 punti per la loro qualità, e ogni 1.000 soldati di linea 50. Ogni parte tira un dado ogni 7 punti (al massimo 14 o 16), più i modificatori di terreno, difese, campo, cavalleria, artiglieria, cannoniere e Bento Gonçalves. Le truppe veterane colpiscono con 4-6; i novizi e la maggior parte degli imperiali con 5 o 6. Ogni colpo toglie 3 punti. Dopo ogni turno, chi ha subito di più tira 2d6 di morale: sopra il valore fugge e subisce l’inseguimento della cavalleria. Al massimo tre turni. Nella sorpresa il primo turno è di chi attacca: tira dadi in più e colpisce con 4-6, mentre chi è sorpreso colpisce solo con 6 e ha il morale più basso di 2. Se la colonna di Bento Gonçalves fugge, lui può essere catturato (1 su 12): la colonna più forte prende il comando, e senza altre colonne la rivolta finisce.</p>
<h3>Assedi</h3><p>Gli imperiali dietro le difese vanno assediati: ogni ordine d’assedio aggiunge un dado più metà delle unità (e 2 con Bento Gonçalves). Quando l’assedio arriva a 6 volte la fortificazione, la città cade. A ogni stagione gli assediati consumano i viveri; senza viveri si arrendono. Una volta ripresa dall’Impero, Porto Alegre si rifornisce dall’acqua, come Rio Grande e São José do Norte: solo una colonna con lance può assediarle. Nella storia Porto Alegre resistette agli assedi e non tornò mai ai farroupilhas.</p>
<h3>Capitali e imprese</h3><p>Bento Gonçalves può insediare la capitale della Repubblica a Piratini, Caçapava, Alegrete o São Gabriel, le quattro capitali ufficiali della storia (anche Bagé, per due settimane, e São Borja furono sede): la città diventa farroupilha e dà Gloria. Vincere al Seival proclama la Repubblica; prendere Rio Pardo e Laguna dà Gloria e Adesione.</p>
<h3>Inverno</h3><p>Le colonne in terra amica recuperano squadroni; altrove li perdono. Le unità vittoriose possono diventare veterane. Spendi Adesione per completare le unità o ricevere volontari. Le città occupate possono tornare ai lealisti. Se l’Adesione scende sotto −3, la truppa si disperde e la campagna finisce.</p>
<h3>Vittoria</h3><p>La Gloria viene da combattimenti, città prese, adesioni, capitali e imprese. Ogni scenario ha un obiettivo storico e dura fino alla sua data; il terzo finisce con il trattato di pace, nel marzo 1845.</p>
<h3>Fonti e realismo</h3><p>Date, capi e numeri vengono dagli articoli di Wikipedia in portoghese e in inglese sulla Rivoluzione Farroupilha, la Repubblica Riograndense, i Lancieri Neri e ogni combattimento (presa e riconquista di Porto Alegre, Seival, Fanfa, Barro Vermelho, presa di Laguna, Santa Vitória, Taquari, São José do Norte, Ponche Verde e massacro di Porongos), consultati nel novembre 2026; quegli articoli citano Donato, Fragoso, Spalding, Hartmann e altri. Le fonti divergono: alla presa di Porto Alegre i ribelli erano circa 200 o 300; al Seival 400 o 430 contro 500-560; le perdite del Seival, del Fanfa e di Porongos variano molto da un articolo all’altro; per Porongos il riquadro dà 150 lancieri e 260 imperiali, il testo più di 1.200 repubblicani e più di 1.100 imperiali (il gioco usa il testo); Ponche Verde è data come incerta o come vittoria repubblicana, secondo l’autore; la colpa di Canabarro a Porongos e l’autenticità della lettera attribuita a Caxias sono discusse; l’articolo su Laguna chiama il comandante imperiale ora Vilas Boas, ora Vilas Lobos. Gli eventi d’inverno (la riconquista di Porto Alegre, nel giugno 1836, e la spedizione a Laguna, nel luglio 1839) appaiono all’inizio dell’inverno del gioco; l’attacco a São José do Norte, nel luglio 1840, resta un obiettivo per il giocatore. La mappa usa la costa, la Lagoa Mirim e i confini attuali di Natural Earth (pubblico dominio) e i fiumi di OpenStreetMap (© contributori di OpenStreetMap, licenza ODbL); i confini disegnati sono quelli di oggi, non quelli dell’epoca. Le città sono nelle sedi dei comuni di oggi. Le regole di combattimento sono un modello di gioco, non una ricostruzione militare.</p>`,
    es: `<p>Mandas a Bento Gonçalves y a los jefes farroupilhas. El año de campaña empieza en primavera (de septiembre a noviembre), sigue por el verano y el otoño y termina en invierno (de junio a agosto), pasado en las estancias: son las estaciones del hemisferio sur. Los imperiales actúan según las reglas del juego y los dados, siguiendo el calendario de las fuentes.</p>
<h3>Estación</h3><ol><li><b>Suerte:</b> un dado decide lluvias, tropas de ganado, baqueanos o nuevas adhesiones.</li><li><b>Mando:</b> cada columna tira un dado. Bento Gonçalves recibe 3 + la mitad del dado (redondeada hacia arriba); otro jefe, 1 + la mitad.</li><li><b>Órdenes:</b> marchar cuesta el número del camino (la subida de la sierra cuesta 2 o 3). Para cruzar el Jacuí, el Camaquã o el Pelotas, junta balsas en una orilla. La Laguna de los Patos y el Guaíba solo se cruzan entre puertos, y la escuadra imperial puede cortar el paso mientras Rio Grande sea imperial. El mar hasta Laguna solo con lanchas, construidas en el astillero del Camaquã. Entrar donde hay una fuerza imperial en campo abre el combate.</li><li><b>Imperiales:</b> el ejército imperial ataca cuando se cree más fuerte y recibe refuerzos; las guarniciones se quedan tras las trincheras; Moringue tiende sorpresas, y una columna acampada puede tener que elegir entre quedarse o salir a su encuentro.</li><li><b>Víveres:</b> al final de la estación, quien está en tierra farroupilha, afín u ocupada se abastece; fuera de ella pierde 1. Con 0, los hombres desertan.</li></ol>
<h3>Unidades</h3><p>Cada unidad tiene 10 escuadrones y un número de hombres; la caballería de cada columna cuenta aparte. Los totales de cada escenario siguen las fuentes cuando dan cifras, como los unos 3.500 republicanos de 1842 del cuadro del artículo en portugués. La división en unidades, las guarniciones y el ejército imperial en los años sin cifras en las fuentes son estimaciones del juego.</p>
<h3>Combate</h3><p>Cada 20 infantes valen 1 punto (veteranos 1,35; élite 1,7); cada 40 jinetes valen 1. Imperiales: cada 1.000 milicianos valen 30 puntos por su calidad, y cada 1.000 soldados de línea, 50. Cada lado tira un dado por cada 7 puntos (como máximo 14 o 16), más los modificadores de terreno, trincheras, campamento, caballería, artillería, cañoneras y Bento Gonçalves. Las tropas veteranas aciertan con 4 a 6; los novatos y la mayoría de los imperiales, con 5 o 6. Cada acierto quita 3 puntos. Tras cada ronda, quien sufrió más tira 2d6 de moral: por encima del valor, huye y sufre la persecución de la caballería. Son como máximo tres rondas. En la sorpresa, la primera ronda es de quien ataca: tira dados de más y acierta con 4 a 6, mientras el sorprendido solo acierta con 6 y tiene la moral 2 más baja. Si la columna de Bento Gonçalves huye, él puede caer preso (1 de 12): la columna más fuerte asume el mando, y sin otra columna la revuelta termina.</p>
<h3>Sitios</h3><p>Los imperiales tras trincheras deben ser sitiados: cada orden de sitio suma un dado más la mitad de las unidades (y 2 con Bento Gonçalves). Cuando el sitio llega a 6 veces la fortificación, la villa cae. Cada estación los sitiados comen sus víveres; sin víveres, se rinden. Una vez retomada por el Imperio, Porto Alegre se abastece por agua, como Rio Grande y São José do Norte: solo una columna con lanchas puede sitiarlas. En la historia, Porto Alegre resistió los sitios y nunca volvió a los farroupilhas.</p>
<h3>Capitales y hazañas</h3><p>Bento Gonçalves puede instalar la capital de la República en Piratini, Caçapava, Alegrete o São Gabriel, las cuatro capitales oficiales de la historia (Bagé, por dos semanas, y São Borja también fueron sede): la villa se vuelve farroupilha y da Gloria. Vencer en el Seival proclama la República; tomar Rio Pardo y Laguna da Gloria y Adhesión.</p>
<h3>Invierno</h3><p>Las columnas en tierra amiga recuperan escuadrones; fuera de ella, los pierden. Las unidades vencedoras pueden volverse veteranas. Gasta Adhesión para completar unidades o recibir voluntarios. Las villas ocupadas pueden volver al bando legal. Si la Adhesión baja de −3, la tropa se dispersa y la campaña termina.</p>
<h3>Victoria</h3><p>La Gloria viene de combates, villas tomadas, adhesiones, capitales y hazañas. Cada escenario tiene un objetivo histórico y dura hasta su fecha; el tercero termina con el tratado de paz, en marzo de 1845.</p>
<h3>Fuentes y realismo</h3><p>Fechas, jefes y cifras vienen de los artículos de Wikipedia en portugués y en inglés sobre la Revolución Farroupilha, la República Riograndense, los Lanceros Negros y cada combate (toma y recuperación de Porto Alegre, Seival, Fanfa, Barro Vermelho, toma de Laguna, Santa Vitória, Taquari, São José do Norte, Ponche Verde y masacre de Porongos), consultados en noviembre de 2026; esos artículos citan a Donato, Fragoso, Spalding, Hartmann y otros. Las fuentes difieren: en la toma de Porto Alegre, los rebeldes eran unos 200 o 300; en el Seival, 400 o 430 contra 500 a 560; las bajas del Seival, del Fanfa y de Porongos varían mucho de un artículo a otro; en Porongos, el cuadro del artículo da 150 lanceros y 260 imperiales, y el texto, más de 1.200 republicanos y más de 1.100 imperiales (el juego usa el texto); Ponche Verde figura como indecisa o como victoria republicana, según el autor; la culpa de Canabarro en Porongos y la autenticidad de la carta atribuida a Caxias se discuten; el artículo sobre Laguna llama al comandante imperial a veces Vilas Boas y a veces Vilas Lobos. Los eventos de invierno (la recuperación de Porto Alegre, en junio de 1836, y la expedición a Laguna, en julio de 1839) aparecen al comienzo del invierno del juego; el ataque a São José do Norte, en julio de 1840, queda como objetivo para el jugador. El mapa usa la costa, la Laguna Merín y las fronteras actuales de Natural Earth (dominio público) y los ríos de OpenStreetMap (© colaboradores de OpenStreetMap, licencia ODbL); las fronteras dibujadas son las de hoy, no las de la época. Las villas están en las cabeceras de los municipios de hoy. Las reglas de combate son un modelo de juego, no una reconstrucción militar.</p>`,
  };
  // ================================================================ motor
  const EXPV = [1, 1.35, 1.7];
  const FRIENDLY = { roman: 1, allied: 1, subdued: 1 };
  // escala: 20 infantes = 1 ponto; uma unidade de m homens vale m/200 por esquadrão (décimo); 40 cavaleiros = 1 ponto
  const UW = (l) => l.m / 200;
  const CAVW = 25;
  const ESCALE = 50; // 1.000 imperiais de linha = 50 pontos; milícias 0,6 disso
  const LOCAL = { imp: 1, leg: 1 }; // os imperiais cruzam os grandes rios com a flotilha
  const RIVERS = ['triunfo', 'taquari', 'riopardo', 'cachoeira', 'camaqua', 'portoalegre', 'pelotas'];
  let G = null;
  const rnd = () => { let s = (G.rs = (G.rs + 0x6D2B79F5) | 0); let x = Math.imul(s ^ (s >>> 15), 1 | s); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const d6 = () => 1 + Math.floor(rnd() * 6);
  const roll = (n) => Array.from({ length: n }, d6);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const log = (k, v, c) => { G.log.push({ k, v: v || {}, c: c || '' }); if (G.log.length > 600) G.log.shift(); };
  const push = (item) => G.queue.push(item);
  const st = (id) => G.ns[id].s;
  const armyAt = (id) => G.armies.filter((a) => a.at === id);
  const enemiesAt = (id) => G.enemies.filter((e) => e.at === id);
  const fieldEnemiesAt = (id) => enemiesAt(id).filter((e) => !e.inTown);
  const caesarArmy = () => G.armies.find((a) => a.caesar);
  const rVal = (a) => a.legs.reduce((s, l) => s + l.c * EXPV[l.e] * UW(l), 0) + a.cav * CAVW;
  const eCav = (e) => e.cav * (e.cq || 0.8) * CAVW;
  const eVal = (e) => e.str * (e.type === 'leg' ? 1 : 0.6) * e.q * ESCALE + eCav(e);
  const cohorts = (a) => a.legs.reduce((s, l) => s + l.c * UW(l), 0);
  const menOf = (a) => Math.round(a.legs.reduce((s, l) => s + l.c * l.m / 10, 0) + a.cav * 1000);
  const eMen = (e) => Math.round((e.str + e.cav) * 1000 / 10) * 10;
  const ZONE = () => SCEN[G.scen].zone;
  const inZone = (id) => ZONE().includes(NODES[id].g);
  const nn = (id) => (G && G.ns[id] && G.ns[id].city) || NODES[id].n;
  // ano exibido: a primavera é do ano de campanha; o verão atravessa a virada; outono e inverno são do ano seguinte
  const dispYear = (y, s) => (s === 0 ? String(y) : s === 1 ? `${y}–${y + 1}` : String(y + 1));
  function addLegion(a, n, c, e, m) { a.legs.push({ n, c, e, m, won: false }); }
  function mkArmy(name, at, caesar, legs, cav) {
    const a = { id: 'a' + (G.nid++), name, at, caesar: !!caesar, legs: [], cav: cav || 0, cp: 0, sup: 3, camp: false, fleet: false, fed: false };
    legs.forEach(([n, e, m, c]) => addLegion(a, n, c == null ? 10 : c, e, m));
    G.armies.push(a); return a;
  }
  function mkEnemy(o) {
    const e = Object.assign({ id: 'e' + (G.nid++), q: 1, cav: 0, type: 'barb', fac: 'imp', beh: 'field', inTown: false, food: 2, mor: 0, pi: 0 }, o);
    if (e.inTown == null) e.inTown = false;
    e.peak = e.str + e.cav;
    G.enemies.push(e); return e;
  }
  function nextLegion() { return G.legPool.shift() || { n: 'Voluntários ' + G.nid, e: 0, m: 200 }; }
  function freeLegate() { return G.legates.shift(); }
  const takeLegate = (n) => { G.legates = G.legates.filter((x) => x !== n); return n; };
  // vizinho livre para um inimigo que entra em cena perto de uma coluna
  const freeSpot = (pref, near) => {
    if (!armyAt(pref).length) return pref;
    const n = ADJ[near || pref].map((x) => x.to).find((id) => !armyAt(id).length && NODES[id].g !== 'uru');
    return n || pref;
  };
  const setS = (list, s) => list.forEach((id) => { G.ns[id].s = s; });
  const GARRISON = (at, str, o) => mkEnemy(Object.assign({ name: 'Guarnição imperial', leader: '', fac: 'imp', type: 'leg', at, str, q: 1.1, beh: 'defend', inTown: true, food: 3, seaborne: true }, o || {}));
  // ---------------------------------------------------------------- cenários
  const SCEN = {
    setembro: {
      name: 'scSet', desc: 'scSetD', y0: 1835, y1: 1836, goal: 'g_set', ranks: [8, 16, 26], view: [300, 230, 520, 400], zone: ['lit', 'cen', 'sul', 'cam'],
