<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Gerador de QR Code · Giovani Perotto Mesquita</title>
<meta name="description" content="Gerador de QR Code em um único arquivo, sem rede: texto, link, Wi-Fi, contato, e-mail, SMS, telefone, WhatsApp, localização, evento e Pix (estático, dinâmico e saque), com leitura e validação de Pix Copia e Cola. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<style>

    --accent:#5FD3C4; --accent-soft:#1D3A38; --accent-strong:#C9A7F5; --warn:#FFC94D; --warn-soft:#3A2E12; --err:#FF8A80; --err-soft:#3D1A1A; --ok:#7CD89A; color-scheme: dark; } }
  :root[data-theme="dark"] {

    --accent:#5FD3C4; --accent-soft:#1D3A38; --accent-strong:#C9A7F5; --warn:#FFC94D; --warn-soft:#3A2E12; --err:#FF8A80; --err-soft:#3D1A1A; --ok:#7CD89A; color-scheme: dark; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .4rem .8rem; font-weight: 600; font-size: .9rem; display: inline-flex; gap: .35rem; align-items: center; }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

  .card h3 { font-size: .92rem; margin: 14px 0 6px; color: var(--ink); }

  .field small { font-weight: 400; color: var(--muted); }

  .meta { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }

  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: .5rem .7rem; font-weight: 600; min-height: 40px; }

  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--surface); }

</head>
<body>
<header class="top">
  <h1 id="ttl" data-t="title"></h1>
  <a id="back" href="projects.html" data-t="back"></a>
  <label class="row" style="font-size:.85rem"><span data-t="lang"></span>

  <button type="button" class="btn sm" id="bTheme"></button>
</header>
<main class="wrap">
  <div class="tabs" role="tablist" id="tabs" aria-labelledby="ttl"></div>
  <div class="grid">
    <div class="leftcol">
      <section class="card form-card" id="formCard" role="tabpanel" aria-labelledby="ttl">
        <h2 id="formH"></h2>
        <div class="fields" id="fields"></div>
        <ul class="msgs" id="msgs" aria-live="polite"></ul>
        <div id="parseOut"></div>
      </section>
      <section class="card opts-card" style="margin-top:14px">
        <h2 data-t="optsH"></h2>
        <div class="opts">
          <label class="field"><span data-t="ecc"></span><select id="oEcc"><option value="0" data-t="eccL"></option><option value="1" data-t="eccM"></option><option value="2" data-t="eccQ"></option><option value="3" data-t="eccH"></option></select></label>
          <label class="field"><span data-t="size"></span><select id="oSize"><option value="256">256 px</option><option value="512">512 px</option><option value="1024">1024 px</option><option value="2048">2048 px</option></select></label>
          <label class="field"><span data-t="margin"></span><select id="oMargin"><option value="4" data-t="m4"></option><option value="2">2</option><option value="1">1</option><option value="0">0</option></select></label>
          <label class="field"><span data-t="style"></span><select id="oStyle"><option value="square" data-t="stSquare"></option><option value="rounded" data-t="stRounded"></option><option value="dots" data-t="stDots"></option></select></label>
          <label class="field"><span data-t="fg"></span><input type="color" id="oFg" value="#000000"></label>
          <label class="field"><span data-t="bg"></span><input type="color" id="oBg" value="#ffffff"></label>
          <label class="field" style="grid-column:1/-1"><span data-t="logo"></span><input type="file" id="oLogo" accept="image/png,image/jpeg,image/svg+xml,image/webp"><small data-t="logoNote"></small></label>
          <div class="row" style="grid-column:1/-1"><button type="button" class="btn sm" id="bNoLogo" data-t="noLogo" disabled></button><button type="button" class="btn sm" id="bReset" data-t="resetOpts"></button></div>
        </div>
      </section>
      <section class="card hist-card" style="margin-top:14px">
        <h2 data-t="histH"></h2>
        <ul class="hist" id="hist"></ul>
        <div class="row" style="margin-top:8px"><button type="button" class="btn sm" id="bClearHist" data-t="clearHist"></button></div>
      </section>
      <details class="help card" id="help"></details>
    </div>
    <aside class="card preview" aria-labelledby="prevH">
      <h2 id="prevH" data-t="prevH"></h2>
      <div class="qrbox"><canvas id="cv" width="512" height="512" role="img"></canvas><p class="empty" id="empty" hidden></p></div>
      <div class="meta" id="meta" aria-live="polite"></div>
      <div class="payload-wrap"><label class="field"><span data-t="payloadL"></span><textarea class="payload" id="payload" readonly spellcheck="false"></textarea></label></div>
      <div class="acts">
        <button type="button" class="btn pri" id="bPng" data-t="dlPng"></button>
        <button type="button" class="btn" id="bSvg" data-t="dlSvg"></button>
        <button type="button" class="btn" id="bCopyImg" data-t="copyImg"></button>
        <button type="button" class="btn" id="bCopyTxt" data-t="copyTxt"></button>
        <button type="button" class="btn" id="bPrint" data-t="print"></button>
        <button type="button" class="btn" id="bSave" data-t="saveHist"></button>
      </div>
    </aside>
  </div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script>

        for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));

      };
      drawFormat(0);
      if (ver >= 7) {
        let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);

        const la = parseFloat(String(v.lat).replace(',', '.')), lo = parseFloat(String(v.lon).replace(',', '.'));
        if (!(la >= -90 && la <= 90 && lo >= -180 && lo <= 180)) { msgs.push(['err', t('e_lat')]); return ''; }
        return v.geofmt === 'maps' ? 'https://www.google.com/maps?q=' + la + ',' + lo : 'geo:' + la + ',' + lo;
      }
      case 'event': {
        if (!req('summary', 'f_summary') || !req('start', 'f_start')) return '';
        if (v.end && v.end < v.start) msgs.push(['err', t('e_dates')]);
        const L = ['BEGIN:VEVENT', 'SUMMARY:' + vEsc(v.summary), 'DTSTART:' + icsDate(v.start)];
        if (v.end) L.push('DTEND:' + icsDate(v.end)); if (v.location) L.push('LOCATION:' + vEsc(v.location)); if (v.desc) L.push('DESCRIPTION:' + vEsc(v.desc));

  }
  function cut(s, n, label, msgs) { if (s.length > n) { msgs.push(['warn', t('w_trunc', { f: t(label), n })]); return s.slice(0, n); } return s; }
  function buildPix(v, msgs) {
    const mode = v.pixmode || 'static', dynamic = mode === 'dynamic';
    let accent = false; const A = (s) => { const r = ascii(s || ''); if (r !== (s || '')) accent = true; return r.trim(); };
    const p = { dynamic, once: !!v.once };
    let ok = true;
    if (dynamic) {
      let u = (v.purl || '').trim().replace(/^https?:\/\//i, '');
      if (!u) { msgs.push(['err', t('e_req', { f: t('f_purl') })]); ok = false; } else if (u.length > 77 || /\s/.test(u)) { msgs.push(['err', t('e_purl')]); ok = false; }
      p.url = u;
    } else {
      const kt = v.keytype || 'cpf', raw = (v.key || '').trim();
      if (!raw) { msgs.push(['err', t('e_req', { f: t('f_key') })]); ok = false; }
      else if (kt === 'cpf') { const d = raw.replace(/\D/g, ''); if (!cpfOk(d)) { msgs.push(['err', t('e_cpf')]); ok = false; } p.key = d; }
      else if (kt === 'cnpj') { const d = raw.toUpperCase().replace(/[^0-9A-Z]/g, ''); if (/^\d{14}$/.test(d)) { if (!cnpjOk(d)) { msgs.push(['err', t('e_cnpj')]); ok = false; } } else if (/^[0-9A-Z]{12}\d{2}$/.test(d)) msgs.push(['warn', t('w_cnpjAlnum')]); else { msgs.push(['err', t('e_cnpj')]); ok = false; } p.key = d; }
      else if (kt === 'phone') { const d = raw.replace(/\D/g, ''); let n = raw.startsWith('+') ? '+' + d : (d.length === 10 || d.length === 11 ? '+55' + d : d.length >= 12 && d.startsWith('55') ? '+' + d : ''); if (!/^\+55\d{10,11}$/.test(n)) { msgs.push(['err', t('e_phone')]); ok = false; } p.key = n; }
      else if (kt === 'email') { if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw) || raw.length > 77) { msgs.push(['err', t('e_email')]); ok = false; } p.key = raw; }
      else { const d = raw.toLowerCase(); if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(d)) { msgs.push(['err', t('e_evp')]); ok = false; } p.key = d; }
      if (mode === 'saque') { const f = (v.fss || '').replace(/\D/g, ''); if (!/^\d{8}$/.test(f)) { msgs.push(['err', t('e_fss')]); ok = false; } p.fss = f; }
      if ((v.amount || '').trim()) { const a = v.amount.trim().replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'); const n = Number(a); if (!/^\d+(\.\d{1,2})?$/.test(a) || !(n > 0) || n.toFixed(2).length > 13) { msgs.push(['err', t('e_amount')]); ok = false; } else p.amount = n.toFixed(2); }

    if (!p.name) { msgs.push(['err', t('e_req', { f: t('f_name') })]); ok = false; }
    if (!p.city) { msgs.push(['err', t('e_req', { f: t('f_pcity') })]); ok = false; }
    if ((v.cep || '').trim()) { const c = v.cep.replace(/\D/g, ''); if (c.length !== 8) { msgs.push(['err', t('e_cep')]); ok = false; } p.cep = c; }
    if (accent) msgs.push(['warn', t('w_accent')]);

  }
  function readPix(v, msgs) {
    const s = (v.paste || '').trim().replace(/[\r\n]/g, '');
    const out = $('parseOut'); out.textContent = '';
    if (!s) return '';
    let top;
    try { top = parseTLV(s); } catch (e) { msgs.push(['err', t('e_pixparse')]); return s; }
    const crcF = top.find((x) => x.id === '63');
    const exp = crc16(s.slice(0, s.length - 4));
    if (!crcF || s.slice(-8, -4) !== '6304') msgs.push(['err', t('e_pixparse')]);
    else if (crcF.v.toUpperCase() !== exp) msgs.push(['err', t('e_pixcrc', { c: exp, f: crcF.v })]);
    else msgs.push(['ok', t('ok_pix', { c: exp })]);
    const tbl = document.createElement('table'); tbl.className = 'parse';
    const head = tbl.createTHead().insertRow(); ['th_id', 'th_field', 'th_val'].forEach((k) => { const th = document.createElement('th'); th.textContent = t(k); head.appendChild(th); });
    const body = tbl.createTBody(); let pixFound = false, kind = 'pixStatic';
    const row = (id, name, val, sub) => { const r = body.insertRow(); if (sub) r.className = 'sub'; [id, name, val].forEach((x, i) => { const c = r.insertCell(); c.textContent = x; if (i === 2) c.className = 'v'; }); };
    top.forEach((f) => {
      const nm = I18N['fn_' + f.id] ? t('fn_' + f.id) : (+f.id >= 26 && +f.id <= 51 ? t('fn_26') : '');
      const nested = ['26', '62', '80'].includes(f.id) || (+f.id >= 26 && +f.id <= 51);
      if (nested) {
        row(f.id, nm, '');
        let subs = []; try { subs = parseTLV(f.v); } catch (e) { row('', '', f.v, true); return; }
        const isPix = subs.some((x) => x.id === '00' && x.v.toLowerCase() === 'br.gov.bcb.pix');
        if (isPix) { pixFound = true; if (subs.some((x) => x.id === '25')) kind = 'pixDynamic'; else if (subs.some((x) => x.id === '03')) kind = 'pixSaque'; }
        subs.forEach((x) => row(f.id + '.' + x.id, I18N['fn_' + f.id + '_' + x.id] ? t('fn_' + f.id + '_' + x.id) : (f.id >= '26' && f.id <= '51' && I18N['fn_26_' + x.id] ? t('fn_26_' + x.id) : ''), x.v, true));
      } else row(f.id, nm, f.v);

    if (!pixFound) msgs.push(['err', t('e_pixgui')]); else msgs.unshift(['ok', t(kind)]);
    out.appendChild(tbl);
    return s;
  }

  // ================================================================ desenho
  const lum = (hex) => { const c = [1, 3, 5].map((i) => parseInt(hex.substr(i, 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4))); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const inFinder = (qr, x, y) => { const s = qr.size; return (x < 7 && y < 7) || (x >= s - 7 && y < 7) || (x < 7 && y >= s - 7); };
  function logoBox(qr) { const n = qr.size, w = Math.max(3, Math.floor(n * 0.22)) | 1; const o = Math.floor((n - w) / 2); return { o, w }; }
  function paint(ctx, qr, px, o) {
    const m = o.margin, n = qr.size, cell = px / (n + 2 * m);
    ctx.fillStyle = o.bg; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = o.fg;
    const lb = logo ? logoBox(qr) : null;
    const hidden = (x, y) => lb && x >= lb.o && x < lb.o + lb.w && y >= lb.o && y < lb.o + lb.w;
    const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {

      const X = (x + m) * cell, Y = (y + m) * cell;
      if (o.style === 'square' || inFinder(qr, x, y)) ctx.fillRect(Math.floor(X), Math.floor(Y), Math.ceil(cell + (X - Math.floor(X))), Math.ceil(cell + (Y - Math.floor(Y))));
      else if (o.style === 'dots') { ctx.beginPath(); ctx.arc(X + cell / 2, Y + cell / 2, cell * 0.45, 0, Math.PI * 2); ctx.fill(); }

      let x = 0;

        if (!qr.modules[y][x] || hidden(x, y)) { x++; continue; }

        else { dots += o.style === 'dots' ? `<circle cx="${x + m + 0.5}" cy="${y + m + 0.5}" r="0.45"/>` : `<rect x="${x + m + 0.05}" y="${y + m + 0.05}" width="0.9" height="0.9" rx="0.3"/>`; x++; }

    if (lb && o.logoUrl) { const pad = 0.4; img = `<rect x="${lb.o + m}" y="${lb.o + m}" width="${lb.w}" height="${lb.w}" fill="${o.bg}"/><image href="${o.logoUrl}" x="${lb.o + m + pad}" y="${lb.o + m + pad}" width="${lb.w - 2 * pad}" height="${lb.w - 2 * pad}" preserveAspectRatio="xMidYMid meet"/>`; }

  }

  // ================================================================ atualização
  function update() {
    let msgs = [];
    if (state.type !== 'pixread') $('parseOut').textContent = '';
    let payload = build(state.type, vals(), msgs);
    // formulário ainda vazio: só a orientação, sem erros
    const v0 = vals(), typed = TYPES[state.type].fields.some((f) => f.type !== 'select' && f.type !== 'check' && String(v0[f.k] || '').trim());
    if (!typed) { msgs = []; payload = ''; }
    const o = state.opts, ecc = logo ? 3 : +o.ecc;
    let qr = null;

    else if (payload && state.type === 'pixread') qr = QR.encode(payload, ecc);
    else if (!payload && !msgs.length && state.type !== 'pixread') msgs.push(['warn', t('e_empty')]);
    const cr = (Math.max(lum(o.fg), lum(o.bg)) + 0.05) / (Math.min(lum(o.fg), lum(o.bg)) + 0.05);
    if (cr < 4) msgs.push(['warn', t('w_contrast')]); else if (lum(o.fg) > lum(o.bg)) msgs.push(['warn', t('w_inverted')]);
    if (+o.margin < 4) msgs.push(['warn', t('w_margin')]);
    if (logo) msgs.push(['warn', t('w_logoH')]);
    const ul = $('msgs'); ul.textContent = '';
    msgs.forEach(([c, s]) => { const li2 = document.createElement('li'); li2.className = c; li2.textContent = s; ul.appendChild(li2); });

    current = qr ? { payload, qr } : null;
    const cv = $('cv'), empty = $('empty');

      $('meta').textContent = t('meta', { v: qr.version, s: qr.size, e: 'LMQH'[qr.ecl], m: qr.mask, n: [...payload].length });
    } else { cv.hidden = true; empty.hidden = false; empty.textContent = t('emptyQr'); $('meta').textContent = ''; }

    $('bCopyTxt').textContent = state.type === 'pix' || state.type === 'pixread' ? t('copyPix') : t('copyTxt');
    $('oEcc').disabled = !!logo; $('oEcc').value = String(ecc);

  let saveT = 0;

  $('bSvg').addEventListener('click', () => { if (!current) return; const o = Object.assign({}, state.opts, { logoUrl: logo ? logo.dataUrl : null }); download(new Blob([svgOf(current.qr, o)], { type: 'image/svg+xml' }), baseName() + '.svg'); });
  $('bCopyImg').addEventListener('click', async () => { if (!current) return; try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': await pngBlob() })]); toast(t('t_copied')); } catch (e) { toast(t('t_noclip')); } });
  $('bCopyTxt').addEventListener('click', async () => { if (!current) return; try { await navigator.clipboard.writeText(current.payload); toast(t('t_copied')); } catch (e) { $('payload').select(); toast(t('t_noclip')); } });
  $('bPrint').addEventListener('click', () => window.print());
  $('bSave').addEventListener('click', () => {
    if (!current) return;
    const h = Store.get('hist') || [];
    const item = { type: state.type, values: JSON.parse(JSON.stringify(vals())), text: current.payload.slice(0, 80), at: Date.now() };
    const k = h.findIndex((x) => x.type === item.type && x.text === item.text); if (k >= 0) h.splice(k, 1);
    h.unshift(item); Store.set('hist', h.slice(0, 15)); renderHist(); toast(t('t_saved'));
  });
  $('bClearHist').addEventListener('click', () => { Store.set('hist', []); renderHist(); });
  function renderHist() {
    const ul = $('hist'), h = Store.get('hist') || []; ul.textContent = '';

    h.forEach((it) => {
      const li2 = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
      const a = document.createElement('span'); a.className = 't'; a.textContent = (TYPES[it.type] ? t('ty_' + it.type) : '') + ' · ' + it.text;
      const d = document.createElement('span'); d.className = 'd'; d.textContent = new Date(it.at).toLocaleDateString(TAG[lang]);
      b.append(a, d); b.addEventListener('click', () => { if (!TYPES[it.type]) return; state.values[it.type] = it.values; selectType(it.type); });
      li2.appendChild(b); ul.appendChild(li2);
    });
  }
  // aparência
  const optMap = { oEcc: 'ecc', oSize: 'size', oMargin: 'margin', oStyle: 'style', oFg: 'fg', oBg: 'bg' };
  Object.entries(optMap).forEach(([id, k]) => $(id).addEventListener('input', () => { state.opts[k] = $(id).value; update(); }));
  function syncOpts() { Object.entries(optMap).forEach(([id, k]) => { $(id).value = String(state.opts[k]); }); }
  $('bReset').addEventListener('click', () => { state.opts = { ecc: 1, size: 512, margin: 4, style: 'square', fg: '#000000', bg: '#ffffff' }; syncOpts(); update(); });
  $('oLogo').addEventListener('change', () => {
    const f = $('oLogo').files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { logo = img; logo.dataUrl = r.result; $('bNoLogo').disabled = false; update(); }; img.src = r.result; };
    r.readAsDataURL(f);
  });
  $('bNoLogo').addEventListener('click', () => { logo = null; $('oLogo').value = ''; $('bNoLogo').disabled = true; update(); });

  // ================================================================ idioma e tema
  let theme = ['auto', 'light', 'dark'].includes(Store.get('theme')) ? Store.get('theme') : 'auto';
  function applyTheme() { if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); $('bTheme').textContent = t({ auto: 'themeAuto', light: 'themeLight', dark: 'themeDark' }[theme]); }
  $('bTheme').addEventListener('click', () => { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme]; Store.set('theme', theme); applyTheme(); });
  function applyLang() {
    document.documentElement.lang = TAG[lang];
    document.title = t('title') + ' · Giovani Perotto Mesquita';
    document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = t(n.dataset.t); });
    $('back').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    $('selLang').value = lang;
    const help = $('help'); help.textContent = ''; const sm = document.createElement('summary'); sm.textContent = t('helpH'); help.appendChild(sm); help.insertAdjacentHTML('beforeend', HELP[lang]);

  }
  $('selLang').addEventListener('change', () => { lang = $('selLang').value; Store.set('lang', lang); applyLang(); });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== lang) { lang = h; applyLang(); } });
  const hl = location.hash.slice(1), nl = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  lang = LANGS.includes(hl) ? hl : LANGS.includes(Store.get('lang')) ? Store.get('lang') : LANGS.includes(nl) ? nl : 'pt';
  syncOpts();
  applyLang();
  // ganchos para testes automatizados
  window.__qr = { QR, pixPayload, crc16, parseTLV, I18N, state: () => state, current: () => current };
})();
