<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Damas de Gelo · Giovani Perotto Mesquita</title>
<meta name="description" content="Damas de Gelo: jogo de damas com as regras brasileiras e os personagens de My Little Ice World. Bonecos de neve contra yetis cinzentos, contra o computador ou a dois. Em português, inglês, italiano e espanhol.">

<style>
  :root {
    --space: #070B1F; --panel: rgba(14, 20, 48, .88); --panel-solid: #111A3C; --line: rgba(160, 200, 255, .2);
    --ink: #F2F7FF; --muted: #A9B8DA; --ice: #8FD3FF; --ice-deep: #2F6FE0; --pink: #FF8FB8;
    --gold: #FFC94D; --danger: #FF6B6B; --ok: #5FD3A4;
    --round: "Fredoka", "Hanken Grotesk", "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); color: var(--ink); font-family: "Hanken Grotesk", "Segoe UI", Arial, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { touch-action: none; }
  #cv { position: fixed; inset: 0; display: block; outline: none; }
  button, select { font: inherit; }
  button { cursor: pointer; }
  a { color: var(--ice); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* HUD */
  .hud { position: fixed; inset: 0 0 auto 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .5rem; padding: calc(.6rem + env(safe-area-inset-top)) calc(.6rem + env(safe-area-inset-right)) 0 calc(.6rem + env(safe-area-inset-left)); pointer-events: none; }
  .pcard { display: flex; align-items: center; gap: .5rem; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .3rem .7rem .3rem .3rem; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .pcard.yeti { flex-direction: row-reverse; text-align: right; padding: .3rem .3rem .3rem .7rem; justify-self: end; }
  .pcard.snow { justify-self: start; }
  .pcard.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(255, 201, 77, .3); }
  .pcard canvas { width: 40px; height: 48px; flex: none; }
  .pcard strong { display: block; font-family: var(--round); font-weight: 700; font-size: .98rem; line-height: 1.15; color: var(--ice); }
  .pcard.yeti strong { color: var(--pink); }
  .pcard span { display: block; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .status { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: .45rem 1rem; font-weight: 700; font-size: .92rem; text-align: center; max-width: 42vw; }
  .status.forced { border-color: var(--pink); color: var(--pink); }
  .bar { position: fixed; inset: auto 0 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .35rem; padding: 0 .6rem calc(.6rem + env(safe-area-inset-bottom)); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .hbtn { display: inline-flex; align-items: center; gap: .35rem; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .7rem; font-size: .85rem; font-weight: 600; }
  .hbtn:hover { border-color: var(--ice); }
  .hbtn:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  .hbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .hbtn kbd { font-family: inherit; font-size: .68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 .25rem; }
  body.touch .hbtn kbd { display: none; }
  @media (max-width: 640px) {
    .hud { grid-template-columns: 1fr 1fr; }
    .status { grid-column: 1 / -1; grid-row: 2; justify-self: center; max-width: 94vw; font-size: .85rem; padding: .3rem .8rem; }
    .pcard strong { font-size: .85rem; }
    .pcard span { font-size: .72rem; }
  }
  .toasts { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); width: min(92vw, 520px); display: grid; gap: .4rem; justify-items: center; pointer-events: none; }
  .toast { background: var(--panel-solid); border: 1px solid var(--line); border-left: 4px solid var(--ice); border-radius: 10px; padding: .5rem .9rem; font-size: .92rem; text-align: center; animation: tin .25s ease-out; }
  .toast.warn { border-left-color: var(--danger); }
  .toast.good { border-left-color: var(--gold); }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  /* painéis */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; background: rgba(5, 8, 24, .6); overflow: auto; touch-action: auto; }
  #ovTitle { background: radial-gradient(ellipse at center, rgba(5,8,24,.2), rgba(5,8,24,.75)); }
  .panel { width: min(100%, 560px); max-height: calc(100dvh - 2rem); overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px; padding: 1.4rem clamp(1rem, 4vw, 2rem); box-shadow: 0 30px 80px rgba(0,0,0,.5); -webkit-user-select: text; user-select: text; }
  .panel h2 { font-family: var(--round); font-weight: 700; font-size: 1.6rem; margin: 0 0 .8rem; color: var(--ice); }
  .panel p, .panel li { color: var(--muted); line-height: 1.5; font-size: .95rem; }
  .panel ul { padding-left: 1.2rem; margin: 0; display: grid; gap: .45rem; }
  .panel li b { color: var(--ink); }
  .title { text-align: center; }
  .title p { margin: .4rem 0; }
  .back { display: inline-block; font-size: .85rem; text-decoration: none; margin-bottom: .2rem; }
  #logo { width: 300px; max-width: 100%; height: 150px; display: block; margin: 0 auto -.2rem; }
  .logo-text { font-family: var(--round); font-weight: 700; font-size: clamp(2.1rem, 8vw, 3.2rem); line-height: 1.05; margin: 0 0 .4rem; background: linear-gradient(180deg, #FFFFFF 20%, #8FD3FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-family: var(--round); font-size: 1.15rem; color: var(--pink) !important; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1rem; }
  .field { display: grid; gap: .25rem; text-align: left; font-size: .8rem; color: var(--muted); }
  select { background: #0B1230; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .6rem; }
  .btn { border: 0; border-radius: 12px; padding: .7rem 1.2rem; font-weight: 700; font-size: 1rem; color: #fff; background: var(--ice-deep); }
  .btn:hover { filter: brightness(1.12); }
  .btn.alt { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .art { width: min(380px, 100%); aspect-ratio: 380 / 230; height: auto; display: block; margin: 0 auto .6rem; }
  #hEnd { text-align: center; color: var(--gold); font-size: 2rem; margin-bottom: .2rem; }
  #pEnd { text-align: center; margin: 0; }

<script>
// Motor das damas (regras brasileiras). Não usa nada de fora: também roda dentro de um Web Worker.
// Casas: índice = linha * 8 + coluna, linha 0 no topo. Valores: 1 pedra e 2 dama da neve; -1 e -2 dos yetis.
function Engine() {
  const RAY = [];
  for (let s = 0; s < 64; s++) {
    const r = s >> 3, c = s & 7;
    RAY[s] = [[-1, -1], [-1, 1], [1, -1], [1, 1]].map(([dr, dc]) => {
      const a = [];
      for (let i = r + dr, j = c + dc; i >= 0 && i < 8 && j >= 0 && j < 8; i += dr, j += dc) a.push(i * 8 + j);
      return a;
    });
  }
  const DARK = [];
  for (let s = 0; s < 64; s++) if (((s >> 3) + (s & 7)) % 2) DARK.push(s);

  function start() {
    const b = new Array(64).fill(0);
    DARK.forEach((s) => { if (s < 24) b[s] = -1; else if (s >= 40) b[s] = 1; });
    return b;
  }

  // as peças capturadas só saem no fim do lance: continuam bloqueando e não podem ser saltadas duas vezes
  function capFrom(b, sq, king, side, path, caps, out) {
    let found = false;
    for (let d = 0; d < 4; d++) {
      const ray = RAY[sq][d];
      if (!king) {
        if (ray.length < 2) continue;
        const a = ray[0], l = ray[1];
        if (b[a] * side < 0 && b[l] === 0 && !caps.includes(a)) {
          found = true; path.push(l); caps.push(a);
          capFrom(b, l, false, side, path, caps, out);
          path.pop(); caps.pop();
        }
      } else {
        let i = 0;
        while (i < ray.length && b[ray[i]] === 0) i++;
        if (i >= ray.length - 1) continue;
        const a = ray[i];
        if (b[a] * side >= 0 || caps.includes(a)) continue;
        for (let j = i + 1; j < ray.length && b[ray[j]] === 0; j++) {
          found = true; path.push(ray[j]); caps.push(a);
          capFrom(b, ray[j], true, side, path, caps, out);
          path.pop(); caps.pop();
        }
      }
    }
    if (!found && caps.length) out.push({ path: path.slice(), caps: caps.slice() });
  }

  function genMoves(b, side) {
    let out = [];
    for (const s of DARK) {
      const v = b[s];
      if (v * side <= 0) continue;
      b[s] = 0;
      capFrom(b, s, Math.abs(v) === 2, side, [s], [], out);
      b[s] = v;
    }
    if (out.length) {
      // lei da maioria: só valem os lances que capturam o maior número de peças
      const max = out.reduce((m, x) => Math.max(m, x.caps.length), 0);
      return out.filter((x) => x.caps.length === max);
    }
    for (const s of DARK) {
      const v = b[s];
      if (v * side <= 0) continue;
      if (Math.abs(v) === 2) {
        for (let d = 0; d < 4; d++) for (const t of RAY[s][d]) { if (b[t] !== 0) break; out.push({ path: [s, t], caps: [] }); }
      } else {
        const ds = side > 0 ? [0, 1] : [2, 3];
        for (const d of ds) { const t = RAY[s][d][0]; if (t !== undefined && b[t] === 0) out.push({ path: [s, t], caps: [] }); }
      }
    }
    return out;
  }

  // a peça teria alguma captura, ainda que menor do que a exigida pela lei da maioria?
  function hasCapture(b, s) {
    const v = b[s], out = [];
    b[s] = 0;
    capFrom(b, s, Math.abs(v) === 2, Math.sign(v), [s], [], out);
    b[s] = v;
    return out.length > 0;
  }

  function apply(b, m) {
    const n = b.slice(), from = m.path[0], to = m.path[m.path.length - 1];
    let v = n[from];
    n[from] = 0;
    for (const c of m.caps) n[c] = 0;
    // a pedra só vira dama se terminar o lance na última fileira
    if (v === 1 && to >> 3 === 0) v = 2;
    if (v === -1 && to >> 3 === 7) v = -2;
    n[to] = v;
    return n;
  }

  const posKey = (b, side) => b.join('') + '|' + side;

  // ------------------------------------------------------------ busca
  const seedRand = (() => { let a = 0x9E3779B9; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; })();
  const Z1 = [], Z2 = [];
  for (let s = 0; s < 64; s++) { Z1[s] = [seedRand(), seedRand(), seedRand(), seedRand()]; Z2[s] = [seedRand(), seedRand(), seedRand(), seedRand()]; }
  const ZI = { '1': 0, '2': 1, '-1': 2, '-2': 3 }, ZS1 = seedRand(), ZS2 = seedRand();
  function hash(b, side) {
    let h1 = side > 0 ? ZS1 : 0, h2 = side > 0 ? ZS2 : 0;
    for (const s of DARK) if (b[s]) { const k = ZI[b[s]]; h1 ^= Z1[s][k]; h2 ^= Z2[s][k]; }
    return (h1 >>> 0) * 2097152 + ((h2 >>> 0) & 0x1FFFFF);
  }

  function evaluate(b, side) {
    let score = 0, snow = 0, yeti = 0;
    for (const s of DARK) {
      const v = b[s];
      if (!v) continue;
      const r = s >> 3, c = s & 7, center = c >= 2 && c <= 5 && r >= 2 && r <= 5 ? 4 : 0;
      if (v === 1) { snow += 100; score += 100 + (7 - r) * 3 + center + (r === 7 ? 6 : 0); }
      else if (v === -1) { yeti += 100; score -= 100 + r * 3 + center + (r === 0 ? 6 : 0); }
      else if (v === 2) { snow += 300; score += 320 + (r + c === 7 ? 10 : 0); }
      else { yeti += 300; score -= 320 + (r + c === 7 ? 10 : 0); }
    }
    // quem está na frente prefere trocar peças
    const total = snow + yeti;
    if (snow !== yeti) score += Math.sign(snow - yeti) * Math.round((2400 - total) / 40);
    return score * side;
  }

  const MATE = 100000, TIMEOUT = {};
  const TT = new Map();
  let nodes = 0, deadline = 0;

  function search(b, side, depth, alpha, beta, ply) {
    if ((++nodes & 2047) === 0 && Date.now() > deadline) throw TIMEOUT;
    const moves = genMoves(b, side);
    if (!moves.length) return -MATE + ply;
    const forced = moves[0].caps.length > 0;
    // capturas estendem a busca: não se avalia uma posição no meio de uma troca
    if (depth <= 0 && !forced) return evaluate(b, side);
    if (ply > 48) return evaluate(b, side);
    const key = hash(b, side), hit = TT.get(key), a0 = alpha;
    if (hit && hit.depth >= depth) {
      if (hit.flag === 0) return hit.score;
      if (hit.flag < 0 && hit.score <= alpha) return hit.score;
      if (hit.flag > 0 && hit.score >= beta) return hit.score;
    }
    if (hit && hit.best) {
      const i = moves.findIndex((m) => m.path.join() === hit.best);
      if (i > 0) { const m = moves[i]; moves[i] = moves[0]; moves[0] = m; }
    }
    let best = -Infinity, bestPath = null;
    for (const m of moves) {
      const s = -search(apply(b, m), -side, forced || moves.length === 1 ? depth : depth - 1, -beta, -alpha, ply + 1);
      if (s > best) { best = s; bestPath = m.path; }
      if (s > alpha) alpha = s;
      if (alpha >= beta) break;
    }
    if (TT.size > 400000) TT.clear();
    TT.set(key, { depth, score: best, flag: best <= a0 ? -1 : best >= beta ? 1 : 0, best: bestPath && bestPath.join() });
    return best;
  }

  // level: 0 fácil, 1 médio, 2 difícil. seen: quantas vezes cada posição já ocorreu na partida
  function pick({ board, side, level, seen }) {
    const moves = genMoves(board, side);
    if (!moves.length) return null;
    if (moves.length === 1) return moves[0];
    if (level === 0 && Math.random() < 0.3) return moves[(Math.random() * moves.length) | 0];
    const maxDepth = [2, 5, 30][level], noise = [30, 8, 0][level];
    deadline = Date.now() + [1000, 1500, 1100][level];
    nodes = 0;
    let order = moves.slice().sort(() => Math.random() - 0.5), best = order[0];
    try {
      for (let d = 1; d <= maxDepth; d++) {
        let alpha = -Infinity, iterBest = null, iterScore = -Infinity;
        for (const m of order) {
          const n = apply(board, m), rep = seen ? seen[posKey(n, -side)] || 0 : 0;
          let s = -search(n, -side, d - 1, -Infinity, noise || rep ? Infinity : -alpha, 1);
          // evita repetir a posição quando está ganhando
          if (rep >= 2) s = 0; else if (rep === 1 && s > 0) s *= 0.7;
          if (noise) s += (Math.random() - 0.5) * noise;
          if (s > iterScore) { iterScore = s; iterBest = m; }
          if (s > alpha) alpha = s;
        }
        best = iterBest;
        order = [best].concat(order.filter((m) => m !== best));
        if (Math.abs(iterScore) > MATE - 200) break;
      }
    } catch (e) { if (e !== TIMEOUT) throw e; }
    return best;
  }

  return { start, genMoves, hasCapture, apply, posKey, pick };
}
</script>

<script>
(() => {
  'use strict';
  const E = Engine();
  const TAU = Math.PI * 2;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const HATS = ['#E63B5A', '#3A86FF', '#FFB703', '#2A9D8F', '#C77DFF'];
  const FLAVORS = ['#FFB3C7', '#8B5A3C', '#B8F2D0', '#FFF1CC', '#C9B8FF', '#FFD08A'];
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function mulberry(seed) { let a = seed | 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const Store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } }
  };

  // ---------------------------------------------------------------- textos
  const I18N = {
    pt: {
      name: 'Damas de Gelo', back: '← Voltar aos projetos', tagline: 'Bonecos de neve contra yetis cinzentos',

  function drawEnd(tm) {
    const c = $('endArt');
    if (c.width !== 380 * DPR) { c.width = 380 * DPR; c.height = 230 * DPR; }
    ctx = c.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, 380, 230);
    const w = G.over.winner;
    if (w > 0) {
      // bonecos em festa, jogando o herói para cima
      sceneBack('#141C46', '#3A4B8C');
      fireworks(tm);
      snowFloor();
      PARTY_SHEEP.forEach((s, i) => { ctx.save(); ctx.translate(0, -Math.abs(Math.sin(tm * 5 + i * 1.3)) * 10); drawSheep(s); ctx.restore(); });
      [[120, HATS[0]], [160, HATS[1]], [200, HATS[2]], [240, HATS[3]]].forEach(([x, hat], i) => {
        const bob = reduceMotion ? 0 : Math.abs(Math.sin(tm * 5.2 + i)) * 3;
        ctx.save(); ctx.translate(0, -bob); drawSnowman(x, 208, i % 2 ? -1 : 1, tm * 6 + i, { scale: 0.95, hat, cheer: true }); ctx.restore();
      });
      const toss = reduceMotion ? 0.4 : Math.abs(Math.sin(tm * 2.6));
      ctx.save(); ctx.translate(180, 132 - toss * 46); ctx.rotate(-Math.PI / 2 + Math.sin(tm * 2.6) * 0.25);
      drawSnowman(0, 30, 1, tm * 8, { helmet: true, cheer: true });
      ctx.restore();
      confetti(tm);
    } else if (w < 0) {
      // boneco chorando cubos de gelo enquanto os yetis comemoram
      sceneBack('#1B1230', '#4A2B4F');
      snowFloor();
      const pile = Math.min(PILE.length, Math.floor(tm / 0.5));
      for (let i = 0; i < pile; i++) iceCube(PILE[i][0], PILE[i][1], 8, PILE[i][2]);
      const sob = reduceMotion ? 0 : Math.abs(Math.sin(tm * 9)) * 2.5;
      ctx.save(); ctx.translate(0, -sob); drawSnowman(182, 206, 1, 0, { sad: true, scale: 1.9 }); ctx.restore();
      const eyes = [[181, 124 - sob], [194.4, 124 - sob]];
      ctx.strokeStyle = 'rgba(143,211,255,.7)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      eyes.forEach((e, k) => { const sd = k ? 1 : -1; ctx.beginPath(); ctx.moveTo(e[0], e[1] + 3); ctx.lineTo(e[0] + sd * 3, e[1] + 15); ctx.stroke(); });
      for (let i = 0; i < 8; i++) {
        const start = i * 0.18;
        if (tm < start) continue;
        const p = ((tm - start) % 1.3) / 1.3, sd = i % 2 ? 1 : -1, e = eyes[i % 2 ? 1 : 0];
        const x = e[0] + sd * (5 + p * 30), y = e[1] + 4 + p * p * 82;
        iceCube(x, Math.min(y, 204), 6, p * 5 * sd, p > 0.85 ? (1 - p) / 0.15 : 1);
      }
      [[52, 1], [100, 1], [298, -1], [342, -1]].forEach(([x, f], i) => {
        const bob = reduceMotion ? 0 : Math.abs(Math.sin(tm * 5 + i)) * 6;
        ctx.save(); ctx.translate(0, -bob); drawYeti(x, 208, f, tm * 6 + i, { scale: 0.95, cheer: true, helmet: i === 0 || i === 3, time: tm }); ctx.restore();
      });
    } else {
      // empate: os dois líderes se encaram, sem vencedor
      sceneBack('#141C46', '#2E3D73');
      snowFloor();
      ctx.save(); drawSnowman(130, 204, 1, reduceMotion ? 0 : tm * 2, { helmet: true, scale: 1.7 }); ctx.restore();
      drawYeti(250, 204, -1, reduceMotion ? 0 : tm * 2, { helmet: true, scale: 1.7, time: tm });
    }
    ctx.restore();
    ctx = mainCtx;
  }

  // ---------------------------------------------------------------- som
  let audio = null;
  function tone(f, d, type, v, when) {
    if (!soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const o = audio.createOscillator(), g = audio.createGain(), st = audio.currentTime + (when || 0);
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, st);
      g.gain.setValueAtTime(v || 0.07, st); g.gain.exponentialRampToValueAtTime(0.0001, st + d);
      o.connect(g); g.connect(audio.destination); o.start(st); o.stop(st + d);
    } catch (e) { /* sem áudio */ }
  }
  function sfx(k) {
    if (k === 'move') tone(520, 0.08, 'triangle');
    else if (k === 'select') tone(760, 0.05, 'sine', 0.05);
    else if (k === 'hop') { tone(420, 0.1, 'triangle'); tone(680, 0.1, 'triangle', 0.06, 0.06); }
    else if (k === 'cap') { [1400, 1100, 900, 1600].forEach((f, i) => tone(f, 0.07, 'square', 0.025, i * 0.035)); }
    else if (k === 'promo') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'sine', 0.08, i * 0.09));
    else if (k === 'bad') tone(170, 0.14, 'sawtooth', 0.04);
    else if (k === 'win') [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.08, i * 0.12));
    else if (k === 'lose') [392, 349, 311, 262].forEach((f, i) => tone(f, 0.3, 'sine', 0.08, i * 0.2));
    else if (k === 'draw') [440, 440].forEach((f, i) => tone(f, 0.2, 'sine', 0.06, i * 0.22));
  }

  // ---------------------------------------------------------------- interface
  function refreshUI() {
    if (!G) return;
    const a = count(1), b = count(-1);
    $('nSnow').textContent = t('count', a);
    $('nYeti').textContent = t('count', b);
    $('cSnow').classList.toggle('on', !G.over && G.turn > 0);
    $('cYeti').classList.toggle('on', !G.over && G.turn < 0);
    const st = $('status');
    let txt, forced = false;
    if (G.over) txt = G.over.winner === 0 ? t('draw') : t(G.over.winner > 0 ? 'winSnow' : 'winYeti');
    else if (thinking) txt = t('thinking', { name: sideName(G.turn) });
    else if (!isHuman(G.turn)) txt = t('turnOf', { name: sideName(G.turn) });
    else if (sel && sel.step > 0) { txt = t('keepGoing'); forced = true; }
    else if (legal[0] && legal[0].caps.length) { const n = legal[0].caps.length; txt = n === 1 ? t('forced1') : t('forcedN', { n }); forced = true; }
    else txt = G.mode === 'pvp' ? t('turnOf', { name: sideName(G.turn) }) : t('yourTurn');
    st.textContent = txt;
    st.classList.toggle('forced', forced);
    $('bUndo').disabled = !canUndo() || !!anim;
    layout();
  }
  function announce(m) {
    // texto para leitores de tela: o status já é uma região viva
    $('srMove').textContent = t('moved', { name: sideName(G.turn), path: m.path.map(sqName).join(m.caps.length ? '×' : '–') });
  }
  function toast(msg, cls) {
    const box = $('toasts'), el = document.createElement('div');
    el.className = 'toast' + (cls ? ' ' + cls : '');
    el.textContent = msg;
    box.appendChild(el);
    while (box.children.length > 2) box.removeChild(box.firstChild);
    setTimeout(() => el.remove(), 2800);
  }

  function clickSquare(sq) {
    if (!canAct() || sq < 0) return;
    if (sel) {
      const nexts = sel.cands.map((m) => m.path[sel.step + 1]);
      if (nexts.includes(sq)) { advance(sq); return; }
      if (sel.step > 0) { sfx('bad'); return; }
    }
    const p = pieceAt(sq);
    if (p && p.v * G.turn > 0) {
      const cands = legal.filter((m) => m.path[0] === sq);
      if (cands.length) { sel = { sq, cands, step: 0 }; sfx('select'); refreshUI(); return; }
      sel = null; sfx('bad');
      if (legal[0].caps.length) toast(t(E.hasCapture(G.board, sq) ? 'mustMajority' : 'mustCapture'), 'warn');
      else toast(t('noMoves'), 'warn');
      refreshUI();
      return;
    }
    if (p) { sfx('bad'); toast(t('notYours'), 'warn'); }
    sel = null;
    refreshUI();
  }
  function advance(sq) {
    const c = sel.cands.filter((m) => m.path[sel.step + 1] === sq), step = sel.step, from = sel.sq;
    const p = pieceAt(from);
    const capSq = c[0].caps.length ? c[0].caps[step] : -1;
    sel = { sq, cands: c, step: step + 1 };
    startLeg(p, from, sq, capSq, () => {
      const m = sel.cands[0];
      if (sel.step >= m.path.length - 1) { commit(m); return; }
      // se só houver um caminho, continua sozinho
      const nexts = new Set(sel.cands.map((x) => x.path[sel.step + 1]));
      if (nexts.size === 1) advance([...nexts][0]);
      else refreshUI();
    });
    refreshUI();
  }
  function cancelSel() {
    if (!sel || anim) return;
    if (sel.step > 0) syncPieces();
    sel = null;
    refreshUI();
  }

  cv.addEventListener('pointerdown', (e) => {
    kbd = false;
    if (scene !== 'game') return;
    cv.focus({ preventScroll: true });
    clickSquare(xySq(e.clientX, e.clientY));
  });
  cv.addEventListener('pointermove', (e) => {
    if (scene !== 'game') return;
    hover = xySq(e.clientX, e.clientY);
    let on = false;
    if (canAct() && hover >= 0) on = sel ? sel.cands.some((m) => m.path[sel.step + 1] === hover) || legal.some((m) => m.path[0] === hover) : legal.some((m) => m.path[0] === hover);
    cv.style.cursor = on ? 'pointer' : 'default';
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('ovRules').hidden) { closeRules(); return; }
      if (scene === 'game' && $('ovEnd').hidden) cancelSel();
      return;
    }
    if (scene !== 'game' || !$('ovEnd').hidden || !$('ovRules').hidden) return;
    if (e.target && e.target.closest && e.target.closest('select, a')) return;
    const flip = flipped() ? -1 : 1;
    const dirs = { ArrowUp: [-flip, 0], ArrowDown: [flip, 0], ArrowLeft: [0, -flip], ArrowRight: [0, flip] };
    if (dirs[e.key]) {
      e.preventDefault();
      kbd = true;
      const r = clamp((cursor >> 3) + dirs[e.key][0], 0, 7), c = clamp((cursor & 7) + dirs[e.key][1], 0, 7);
      cursor = r * 8 + c;
    } else if ((e.key === 'Enter' || e.key === ' ') && e.target === cv) {
      e.preventDefault();
      kbd = true;
      clickSquare(cursor);
    } else if (e.key === 'u' || e.key === 'U') undo();
  });

  function showGame() {
    scene = 'game';
    $('ovTitle').hidden = true; $('ovEnd').hidden = true;
    $('hud').hidden = false; $('bar').hidden = false;
    layout();
    cv.focus({ preventScroll: true });
  }
  function showTitle() {
    aiToken++; thinking = false; anim = null; sel = null; particles = [];
    if (G && !G.over) save();
    scene = 'title';
    $('hud').hidden = true; $('bar').hidden = true; $('ovEnd').hidden = true;
    $('ovTitle').hidden = false;
    refreshResume();
  }
  function refreshResume() {
    const g = Store.get('damasDeGelo.game');
    $('bResume').hidden = !(g && !g.over && g.board);
  }
  function startFromMenu() {
    const mode = $('modeSel').value;
    const prefs = { mode, side: +$('sideSel').value, level: +$('levelSel').value };
    savePrefs(prefs);
    G = newGame(mode, mode === 'ai' ? prefs.side : 1, prefs.level);
    anim = null; particles = [];
    syncPieces();
    showGame();
    cursor = flipped() ? 11 : 52;
    beginTurn();
  }
  function resumeGame() {
    const g = Store.get('damasDeGelo.game');
    if (!g || g.over) return;
    G = g;
    anim = null; particles = [];
    syncPieces();
    showGame();
    beginTurn();
  }
  function savePrefs(p) { Store.set('damasDeGelo.prefs', Object.assign({}, Store.get('damasDeGelo.prefs') || {}, p)); }
  function closeRules() { $('ovRules').hidden = true; }
  function applySound() {
    $('lSound').textContent = t(soundOn ? 'soundOn' : 'soundOff');
    $('bSound').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  }
  function syncModeFields() {
    document.querySelectorAll('.aiOnly').forEach((el) => { el.hidden = $('modeSel').value !== 'ai'; });
  }
  function applyLang() {
    document.documentElement.lang = LANG_TAG[lang];
    document.title = t('name') + ' · Giovani Perotto Mesquita';
    cv.setAttribute('aria-label', t('name'));
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('rulesList').innerHTML = t('rulesList').map((x) => '<li>' + x + '</li>').join('');
    $('langSel').value = lang;
    document.querySelector('.back').href = 'projects.html' + (lang === 'pt' ? '' : '#' + lang);
    applySound();
    refreshUI();
    if (G && G.over && !$('ovEnd').hidden) showEnd();
  }

  $('bPlay').addEventListener('click', startFromMenu);
  $('bResume').addEventListener('click', resumeGame);
  $('bRules').addEventListener('click', () => { $('ovRules').hidden = false; $('bRulesClose').focus(); });
  $('bRules2').addEventListener('click', () => { $('ovRules').hidden = false; $('bRulesClose').focus(); });
  $('bRulesClose').addEventListener('click', closeRules);
  $('bUndo').addEventListener('click', undo);
  $('bNew').addEventListener('click', showTitle);
  $('bEndMenu').addEventListener('click', showTitle);
  $('bAgain').addEventListener('click', () => { const g = G; G = newGame(g.mode, g.human, g.level); anim = null; particles = []; syncPieces(); showGame(); beginTurn(); });
  $('bSeeBoard').addEventListener('click', () => { $('ovEnd').hidden = true; cv.focus({ preventScroll: true }); });
  $('bSound').addEventListener('click', () => { soundOn = !soundOn; savePrefs({ sound: soundOn }); applySound(); });
  $('modeSel').addEventListener('change', syncModeFields);
  $('langSel').addEventListener('change', () => { lang = $('langSel').value; savePrefs({ lang }); applyLang(); });
  window.addEventListener('resize', resize);
  window.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') document.body.classList.add('touch'); }, { passive: true });

  // ---------------------------------------------------------------- laço principal
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000), time = now / 1000;
    lastT = now;
    updateAnim(dt);
    ctx = mainCtx;
    drawStars(time * 8, time * 3, reduceMotion ? 0 : time);
    if (scene === 'game' && G) drawBoard(time);
    if (scene === 'title' && !$('ovTitle').hidden) drawLogo(time);
    if (G && G.over && !$('ovEnd').hidden) drawEnd(reduceMotion ? 1.2 : (now - endStart) / 1000);
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- início
  const srEl = document.createElement('div');
  srEl.id = 'srMove'; srEl.className = 'sr'; srEl.setAttribute('aria-live', 'polite');
  document.body.appendChild(srEl);
  const prefs = Store.get('damasDeGelo.prefs') || {};
  const navLang = ((navigator.language || 'pt').slice(0, 2)).toLowerCase();
  const hashLang = location.hash.slice(1);
  lang = I18N[hashLang] ? hashLang : (prefs.lang && I18N[prefs.lang] ? prefs.lang : (I18N[navLang] ? navLang : 'pt'));
  soundOn = prefs.sound !== false;
  if (prefs.mode) $('modeSel').value = prefs.mode;
  if (prefs.side) $('sideSel').value = String(prefs.side);
  if (prefs.level != null) $('levelSel').value = String(prefs.level);
  syncModeFields();
  applyLang();
  resize();
  refreshResume();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
