<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Tríade Estelar · Giovani Perotto Mesquita</title>
<meta name="description" content="Tríade Estelar: jogo de tiro arcade com uma nave-robô que se transforma em caça, híbrido e robô para enfrentar ondas de inimigos e naves-mãe. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<style>
:root{
  --bg:#FFF7EC; --surface:#FFFFFF; --surface-2:#FBF1E3; --ink:#2B1B3D; --text:#3E3350; --muted:#756986; --line:#F1E2CF;
  --accent:#0E8074; --accent-ink:#FFFFFF; --gold:#FFB703; --gold-soft:#FFF1C9; --bad:#C62828;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif; --serif:Georgia,"Times New Roman",serif; --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#1A1328; --surface:#241A36; --surface-2:#2D2244; --ink:#F7F0FF; --text:#E2D8F0; --muted:#A898C0; --line:#3A2D52;
  --accent:#5FD3C4; --accent-ink:#10231F; --gold:#FFC94D; --gold-soft:#3A2E12; --bad:#FF8A8A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;padding:.45rem .8rem;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--serif);font-size:1.2rem;margin:0;color:var(--ink);line-height:1.1}
.brand p{margin:0;font-size:.78rem;color:var(--muted)}
.tools{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem .75rem;min-height:38px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.big{font-size:1.05rem;padding:.6rem 1.3rem;min-height:48px}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.35rem .5rem;min-height:38px;color:var(--ink)}
.stage{position:relative;flex:1;min-height:0;background:#05040C}
#cv{display:block;width:100%;height:100%;touch-action:none}
.touch{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.touch button{width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(20,20,40,.55);color:#fff;font-weight:800;font-size:1.4rem;touch-action:none;user-select:none;-webkit-user-select:none}
.touch button small{display:block;font-size:.62rem;font-weight:700}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:0;width:min(620px,calc(100vw - 20px));max-height:calc(100vh - 20px)}
dialog::backdrop{background:rgba(5,4,15,.7)}
.dlg{padding:1rem 1.1rem 1.1rem;overflow:auto}
.dlg h2{font-family:var(--serif);color:var(--ink);margin:0 0 .7rem;font-size:1.35rem}
.dlg h3{color:var(--ink);margin:1rem 0 .3rem;font-size:1rem}
.dlg p,.dlg li{line-height:1.5;max-width:68ch}
.dlg table{width:100%;border-collapse:collapse;font-size:.88rem}
.dlg th,.dlg td{border-bottom:1px solid var(--line);padding:.3rem .4rem;text-align:left;vertical-align:top}
.dlg td.n,.dlg th.n{text-align:right;font-variant-numeric:tabular-nums}
.dlg tr.me td,.dlg tr.me th{background:var(--gold-soft);font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem}
.form label{display:flex;flex-direction:column;gap:.2rem;font-size:.84rem;font-weight:600;color:var(--ink);min-width:0}
.form select,.form input{width:100%;min-width:0;max-width:100%}
.acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 .4rem;font-family:var(--sans);font-weight:700;background:var(--surface-2);color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.6rem 0}
.modes div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.5rem;font-size:.82rem}
.modes strong{display:block;color:var(--ink);font-size:.95rem}
.shop .credits{font-size:1.05rem;color:var(--ink);margin:0}
#dShop{width:min(880px,calc(100vw - 20px))}
.shop{display:flex;flex-direction:column;max-height:calc(100vh - 22px);max-height:calc(100dvh - 22px)}
.shop-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.3rem 1rem;padding:.8rem 1.1rem .6rem;border-bottom:1px solid var(--line)}
.shop-head h2{font-family:var(--serif);color:var(--ink);margin:0;font-size:1.3rem}
.shop-body{overflow:auto;padding:0 1.1rem .8rem;min-height:0}
.shop-body h3{color:var(--ink);margin:.8rem 0 .35rem;font-size:1rem}
.shop-foot{padding:.6rem 1.1rem .8rem;border-top:1px solid var(--line);margin:0}
.shop .credits strong{color:var(--gold-ink, #B35300);font-size:1.3rem}
:root[data-theme="dark"] .shop .credits strong{color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.55rem}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:.55rem .6rem;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.card h4{margin:0;font-size:.92rem;color:var(--ink);display:flex;align-items:center;gap:.4rem}
.card h4 .ic{display:inline-grid;place-items:center;min-width:1.7rem;height:1.7rem;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:.85rem}
.card p{margin:0;font-size:.78rem;line-height:1.35;color:var(--text);flex:1}
.card .pips{display:flex;gap:3px}
.card .pips i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.card .pips i.on{background:var(--accent)}
.card button{min-height:36px;font-size:.84rem}
.card button:disabled{opacity:.55;cursor:default}
@media (max-width:760px){.brand p{display:none}}
@media (max-width:480px){.form{grid-template-columns:1fr}.modes{grid-template-columns:1fr}.tools .btn{padding:.35rem .5rem}.brand h1{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#0B0820"/><circle cx="31" cy="9" r="1.3" fill="#fff"/><circle cx="8" cy="28" r="1" fill="#fff"/><path d="M20 5 L23 17 L33 25 L33 28 L23 25 L22 31 L26 34 L14 34 L18 31 L17 25 L7 28 L7 25 L17 17 Z" fill="#D9DEE4" stroke="#18B8A8" stroke-width="1.2"/><path d="M20 11 l2 6 h-4z" fill="#4CC9F0"/><path d="M16 34 l2 4 h4 l2-4z" fill="#F2A33A"/></svg>
    <div><h1 data-i="title"></h1><p data-i="subtitle"></p></div>
  </div>
  <div class="tools">
    <button type="button" class="btn primary" id="bNew" data-i="newGame"></button>
    <button type="button" class="btn" id="bPause" data-i="pause"></button>
    <button type="button" class="btn" id="bHelp" data-i="help"></button>
    <button type="button" class="btn" id="bSound" aria-pressed="true" data-ta="sound">🔊</button>
    <button type="button" class="btn" id="bTheme" data-ta="theme">◐</button>
    <select id="sLang" data-ta="lang"><option value="pt">🇧🇷 PT</option><option value="en">🇬🇧 EN</option><option value="it">🇮🇹 IT</option><option value="es">🇪🇸 ES</option></select>
  </div>
</header>
<main class="stage" id="stage">
  <canvas id="cv" tabindex="0" role="application" aria-describedby="live"></canvas>
  <div class="touch" id="touch" hidden>
    <button type="button" id="tSpecial">✦<small data-i="tSpecial"></small></button>
    <button type="button" id="tMorph">⇄<small data-i="tMorph"></small></button>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>

<dialog id="dSetup" aria-labelledby="hSetup"><div class="dlg">
  <h2 id="hSetup" data-i="setupTitle"></h2>
  <p data-i="setupIntro"></p>
  <div class="modes">
    <div><strong data-i="mFighter"></strong><span data-i="mFighterD"></span></div>
    <div><strong data-i="mHybrid"></strong><span data-i="mHybridD"></span></div>
    <div><strong data-i="mRobot"></strong><span data-i="mRobotD"></span></div>
  </div>
  <div class="form">
    <label><span data-i="level"></span><select id="fLevel"><option value="easy" data-i="lvEasy"></option><option value="normal" data-i="lvNormal"></option><option value="hard" data-i="lvHard"></option></select></label>
    <label><span data-i="startWave"></span><select id="fWave"><option>1</option><option>3</option><option>5</option><option>8</option><option>10</option></select></label>
    <label><span data-i="autofire"></span><select id="fAuto"><option value="off" data-i="off"></option><option value="on" data-i="on"></option></select></label>
    <label><span data-i="shopOpt"></span><select id="fShop"><option value="each" data-i="shopEach"></option><option value="three" data-i="shopThree"></option><option value="boss" data-i="shopBoss"></option></select></label>
    <label><span data-i="seed"></span><input type="text" id="fSeed" inputmode="numeric" maxlength="9" autocomplete="off"></label>
  </div>
  <h3 data-i="scoresTitle"></h3>
  <div id="setupScores"></div>
  <div class="acts"><button type="button" class="btn" id="bSetupCancel" data-i="cancel"></button><button type="button" class="btn primary big" id="bStart" data-i="start"></button></div>
</div></dialog>

<dialog id="dShop" aria-labelledby="hShop"><div class="shop">
  <div class="shop-head"><h2 id="hShop" data-i="shopTitle"></h2>
  <p class="credits"><span data-i="credits"></span>: <strong id="shopCredits"></strong> ¢</p></div>
  <p id="shopLive" class="sr" aria-live="polite"></p>
  <div class="shop-body">
  <h3 data-i="shopWeapons"></h3><div class="cards" id="shopW"></div>
  <h3 data-i="shopShip"></h3><div class="cards" id="shopS"></div>
  <h3 data-i="shopSupplies"></h3><div class="cards" id="shopC"></div>
  </div>
  <div class="acts shop-foot"><button type="button" class="btn primary big" id="bShopGo"></button></div>
</div></dialog>

<dialog id="dHelp" aria-labelledby="hHelp"><div class="dlg">
  <h2 id="hHelp" tabindex="-1" data-i="helpTitle"></h2>
  <div id="helpBody"></div>
  <div class="acts"><button type="button" class="btn primary" id="bHelpClose" data-i="close"></button></div>
</div></dialog>

<dialog id="dEnd" aria-labelledby="hEnd"><div class="dlg">
  <h2 id="hEnd" data-i="gameOver"></h2>
  <p id="endText"></p>
  <div id="endScores"></div>
  <p id="endMeta" style="color:var(--muted);font-size:.84rem"></p>
  <div class="acts"><button type="button" class="btn" id="bEndSetup" data-i="options"></button><button type="button" class="btn primary big" id="bAgain" data-i="again"></button></div>
</div></dialog>

  helpBody:[`<h3>Controles</h3>
<table><tbody>
<tr><td><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></td><td>mover</td></tr>
<tr><td><kbd>Espaço</kbd> ou <kbd>J</kbd></td><td>atirar (segure)</td></tr>
<tr><td><kbd>Shift</kbd> ou <kbd>K</kbd></td><td>mudar para a próxima forma</td></tr>
<tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>Caça, Híbrido ou Robô direto</td></tr>
<tr><td><kbd>B</kbd> ou <kbd>L</kbd></td><td>especial: enxame de mísseis que limpa os tiros inimigos</td></tr>
<tr><td>Mouse</td><td>no Robô, o canhão mira no cursor; clique esquerdo atira</td></tr>
<tr><td><kbd>P</kbd> ou <kbd>Esc</kbd></td><td>pausa</td></tr>
<tr><td>Toque</td><td>arraste em qualquer lugar para mover (o tiro é automático); botões de forma e especial no canto</td></tr>
</tbody></table>
<h3>As três formas</h3>
<ul><li><strong>Caça:</strong> a mais rápida e a de menor área de impacto. Tiro em leque, que cresce com a potência.</li>
<li><strong>Híbrido:</strong> metralhadora e mísseis que buscam os inimigos. Bom contra naves espalhadas.</li>
<li><strong>Robô:</strong> lento, mas o canhão pesado causa mais dano e mira sozinho no inimigo mais próximo, ou no cursor do mouse. Um escudo na frente bloqueia tiros até a energia acabar; ela se recarrega com o tempo.</li></ul>
<p>Durante a transformação, a nave fica invulnerável por um instante.</p>
<h3>Itens</h3>
<ul><li><strong>P</strong>: potência da arma (até 4). <strong>M</strong>: mais um especial. <strong>E</strong>: recarrega o escudo. <strong>1UP</strong>: vida extra.</li>
<li>Destruir inimigos em sequência aumenta o multiplicador de pontos, até ×8.</li></ul>
<h3>Créditos e hangar</h3>
<p>Os inimigos destruídos soltam fichas douradas de crédito (¢): passe por cima para coletar. Entre as ondas, o hangar abre e você troca os créditos por aprimoramentos de armas e da nave ou por suprimentos. Os aprimoramentos ficam mais caros a cada nível e valem até o fim da partida. Na opção <em>Loja entre ondas</em>, escolha se o hangar abre a cada onda, a cada 3 ondas ou só depois da nave-mãe.</p>
<p>A cada cinco ondas aparece uma nave-mãe: destrua as três torres para expor o núcleo. Ao perder uma nave, você volta com a potência um nível abaixo.</p>
<p>O jogo é original. A forma Caça tem silhueta inspirada no caça F-22, com asa em diamante e derivas inclinadas; a transformação, os inimigos e os nomes foram criados para o jogo. As naves são modelos 3D desenhados pelo próprio jogo, sem bibliotecas.</p>`,
`<h3>Controls</h3>
<table><tbody>
<tr><td><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></td><td>move</td></tr>
<tr><td><kbd>Space</kbd> or <kbd>J</kbd></td><td>fire (hold)</td></tr>
<tr><td><kbd>Shift</kbd> or <kbd>K</kbd></td><td>switch to the next form</td></tr>
<tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>Fighter, Hybrid or Robot directly</td></tr>
<tr><td><kbd>B</kbd> or <kbd>L</kbd></td><td>special: a missile swarm that clears enemy fire</td></tr>

<h3>The three forms</h3>
<ul><li><strong>Fighter:</strong> the fastest and the smallest target. Spread shot that grows with power.</li>
<li><strong>Hybrid:</strong> gun and missiles that seek out enemies. Good against scattered ships.</li>
<li><strong>Robot:</strong> slow, but the heavy cannon deals more damage and aims by itself at the nearest enemy, or at the mouse cursor. A front shield blocks shots until its energy runs out; it recharges over time.</li></ul>
<p>While transforming, the ship is invulnerable for a moment.</p>
<h3>Items</h3>
<ul><li><strong>P</strong>: weapon power (up to 4). <strong>M</strong>: one more special. <strong>E</strong>: recharges the shield. <strong>1UP</strong>: extra life.</li>
<li>Destroying enemies in a row raises the score multiplier, up to ×8.</li></ul>
<h3>Credits and hangar</h3>
<p>Destroyed enemies drop gold credit chips (¢): fly over them to collect. Between waves the hangar opens and you trade credits for weapon and ship upgrades or supplies. Upgrades get pricier with each level and last until the end of the game. In the <em>Shop between waves</em> option, choose whether the hangar opens every wave, every 3 waves or only after the mothership.</p>
<p>Every five waves a mothership appears: destroy its three turrets to expose the core. When you lose a ship, you return with power one level lower.</p>
<p>The game is original. The Fighter form has a silhouette inspired by the F-22 jet, with a diamond wing and canted tails; the transformation, enemies and names were created for the game. The ships are 3D models drawn by the game itself, with no libraries.</p>`,

};
const LANGS = ['pt','en','it','es'], HTML_LANG = {pt:'pt-BR',en:'en',it:'it',es:'es'};
let LANG = 'pt';
function t(k, ...a) { const r = I18N[k]; let s = r ? r[LANGS.indexOf(LANG)] : k; a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); }); return s; }
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('triade.' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('triade.' + k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } }
};
const $ = (s) => document.querySelector(s);
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const nf = (v) => new Intl.NumberFormat(HTML_LANG[LANG]).format(v);
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let fxr = mulberry(7);

/* ===================== Som (sintetizado) ===================== */
const SND = {
  ctx: null, on: true, master: null, noise: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    if (!this.on) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx; this.master = c.createGain(); this.master.gain.value = .4; this.master.connect(c.destination);
    const len = c.sampleRate, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0), r = mulberry(3); for (let i = 0; i < len; i++) d[i] = r() * 2 - 1; this.noise = buf;
  },
  ok() { return this.on && this.ctx && this.ctx.state === 'running'; },
  tone(type, f0, f1, vol, dur, at) {

    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + .02);
  },

    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); s.connect(f); f.connect(g); g.connect(this.master); s.start(t0, fxr() * .5); s.stop(t0 + dur + .02);
  },
  last: {},
  limit(k, gap) { const n = performance.now(); if (this.last[k] && n - this.last[k] < gap) return false; this.last[k] = n; return true; },
  shot(mode) { if (!this.limit('shot', 70)) return; if (mode === 2) this.tone('square', 260, 90, .08, .14); else this.tone('square', mode ? 820 : 1100, mode ? 400 : 520, .035, .06); },
  missile() { if (!this.limit('mis', 120)) return; this.noiseBurst(2400, 600, .12, .25, 'bandpass'); },
  hit() { if (!this.limit('hit', 45)) return; this.tone('triangle', 400, 160, .05, .05); },

  morph(to) { this.tone('sawtooth', 180 + to * 80, 520 + to * 120, .06, .22); this.tone('square', 900, 1400, .03, .12, .18); },
  power() { [660, 880, 1320].forEach((f, i) => this.tone('square', f, f, .06, .09, i * .07)); },
  life() { [523, 659, 784, 1046].forEach((f, i) => this.tone('square', f, f, .07, .12, i * .09)); },
  special() { this.noiseBurst(3000, 300, .35, 1.2, 'bandpass'); this.tone('sawtooth', 120, 600, .1, .6); },
  coin() { if (!this.limit('coin', 40)) return; this.tone('square', 1320, 1760, .03, .06); },
  shieldHit() { if (!this.limit('sh', 60)) return; this.tone('sine', 1400, 700, .05, .08); },
  alarm() { for (let i = 0; i < 3; i++) { this.tone('square', 440, 440, .08, .25, i * .55); this.tone('square', 330, 330, .08, .25, i * .55 + .27); } },
  die() { this.noiseBurst(2000, 40, .7, 1.4); this.tone('sawtooth', 300, 40, .3, 1.2); }
};

/* ===================== Mundo ===================== */
const W = 540, H = 900;                 // campo de jogo lógico (retrato)
const MODES = ['fighter', 'hybrid', 'robot'];
const SPEED = [340, 250, 175], HITR = [5, 7, 10];
const DIFF = { easy: { hp: .8, bs: .8, fire: .7, lives: 5 }, normal: { hp: 1, bs: 1, fire: 1, lives: 3 }, hard: { hp: 1.25, bs: 1.2, fire: 1.35, lives: 3 } };
const DEF_OPTS = { level: 'normal', wave: 1, auto: 'off', shop: 'each', seed: '' };
let OPTS = Object.assign({}, DEF_OPTS, store.get('opts') || {});
let G = null;

function newGame(seed) {
  const d = DIFF[OPTS.level];
  G = { seed, rng: mulberry(seed), d, score: 0, mult: 1, multT: 0, wave: OPTS.wave - 1, waveT: 0, phase: 'intro', phaseT: 0, spawns: [], enemies: [], pb: [], eb: [], items: [], parts: [], pops: [], rings: [],
    kills: 0, shots: 0, hits: 0, shake: 0, flash: 0, over: false, paused: false, time: 0, banner: null, inShop: false,
    credits: 0, creditsTotal: 0, up: { fdmg: 0, rate: 0, mis: 0, rdmg: 0, spec: 0, armor: 0, shield: 0, eng: 0, mag: 0, morph: 0 }, buys: { life: 0, charge: 0, power: 0 },
    P: { x: W / 2, y: H - 120, mode: 0, target: 0, m: 0, power: 1, lives: d.lives, special: 2, shield: 100, armor: 0, shieldOff: false, inv: 2.5, fireCd: 0, misCd: 0, alive: true, respawn: 0, aim: -Math.PI / 2, tilt: 0 } };
  fxr = mulberry(seed ^ 0x51ED);
  if (OPTS.wave > 1) G.P.power = Math.min(4, 1 + Math.floor(OPTS.wave / 3));
  nextWave();
}
function say(s) { $('#live').textContent = s; }

/* ---------- Ondas ---------- */
function nextWave() {
  G.wave++; G.waveT = 0; G.spawns = []; G.P.armor = G.up.armor;
  const n = G.wave, r = G.rng, boss = n % 5 === 0;
  G.banner = { text: boss ? t('bossWarn') : t('waveN', n), t: 0, boss };
  say(boss ? t('bossWarn') : t('waveN', n));
  if (boss) { SND.alarm(); G.spawns.push({ at: 2.5, kind: 'boss' }); for (let k = 0; k < 2; k++) G.spawns.push({ at: 8 + k * 9, kind: 'line', x: k ? W * .75 : W * .25 }); return; }
  const groups = Math.min(4 + Math.floor(n * .8), 12), gap = Math.max(2.1, 3.6 - n * .12);
  let cruisers = 0;
  for (let i = 0; i < groups; i++) {
    const pool = [['line', 3], ['v', n >= 2 ? 3 : 1], ['swoop', 3], ['gunship', n >= 2 ? 2 + n * .2 : 0], ['cruiser', n >= 4 && cruisers < 1 + Math.floor(n / 9) ? 1.2 : 0]];

    if (kind === 'cruiser') cruisers++;
    G.spawns.push({ at: 2.2 + i * gap, kind, side: r() < .5 ? -1 : 1, x: 70 + r() * (W - 140) });

}
const hpScale = () => G.d.hp * (1 + .1 * (G.wave - 1));

  e.hp = e.maxhp = Math.ceil(e.hp * hpScale()); G.enemies.push(e); return e;
}
function spawnGroup(s) {

function collide() {

    if (b.dead) continue;

  }
  for (const e of G.enemies) {
    if (e.dead || e.x < -500) continue;
    const rr = e.type === 'boss' ? 60 : e.r * .8;
    if (Math.hypot(e.x - P.x, e.y - P.y) < rr + hr) { if (P.inv <= 0) { if (e.type !== 'boss' && e.type !== 'cruiser') { e.hp -= 5; if (e.hp <= 0) killEnemy(e); } hitPlayer(); } }

    if (it.dead) continue;
    if (Math.hypot(it.x - P.x, it.y - P.y) < (it.kind === 'C' ? 22 : 26)) {
      it.dead = true;
      if (it.kind === 'C') { G.credits += it.v; G.creditsTotal += it.v; SND.coin(); G.pops.push({ x: it.x, y: it.y - 10, t: 0, text: '+' + it.v + ' ¢', coin: true }); continue; }

      else if (it.kind === 'M') { P.special = Math.min(specMax(), P.special + 1); flashText(t('specialUp')); SND.power(); }
      else if (it.kind === 'E') { P.shield = shieldMax(); P.shieldOff = false; flashText(t('shieldUp')); SND.power(); }

}

function step(dt) {

  updatePlayer(dt); updateEnemies(dt);

  for (const b of G.pb) {
    b.t += dt; if (b.t < 0) continue;
    if (b.kind === 'missile') {
      if (!b.tgt || b.tgt.dead) { const ne = nearestEnemy(b.x, b.y); b.tgt = ne ? ne[2] : null; b.tp = ne; }
      let tx = b.x, ty = b.y - 200;
      if (b.tgt) { const ne = nearestEnemy(b.x, b.y); if (ne) { tx = ne[0]; ty = ne[1]; } }
      const want = Math.atan2(ty - b.y, tx - b.x) + (b.swarm ? Math.sin(b.t * 9 + b.wob) * .5 : 0);

      cur += clamp(dA, -7 * dt, 7 * dt); const sp = Math.min(b.sp, Math.hypot(b.vx, b.vy) + 900 * dt);
      b.vx = Math.cos(cur) * sp; b.vy = Math.sin(cur) * sp;
      b.trail.push([b.x, b.y]); if (b.trail.length > 16) b.trail.shift();
      if (b.t > 3.2) b.dead = true;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) b.dead = true;
  }
  for (const b of G.eb) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) b.dead = true; }
  for (const it of G.items) {
    it.t += dt; const P = G.P, d = Math.hypot(P.x - it.x, P.y - it.y), R = it.kind === 'C' ? magR() : (G.up.mag ? magR() * .7 : 0);
    if (P.alive && d < R && d > 1) { const sp = 240 + 300 * (1 - d / R); it.x += (P.x - it.x) / d * sp * dt; it.y += (P.y - it.y) / d * sp * dt; }

  G.multT -= dt; if (G.multT <= 0) G.mult = Math.max(1, G.mult - dt * 2);
  // fim da onda
  if (G.spawns.every((s) => s.done) && G.enemies.length === 0 && !G.over && G.P.lives > 0) {
    if (!G.clearT) { G.clearT = 2.2; if (G.wave % 5 === 0 || G.wave > OPTS.wave) G.banner = { text: t('waveClear'), t: 0 }; }
    G.clearT -= dt; if (G.clearT <= 0) { G.clearT = 0; if (shopDue()) openShop(); else nextWave(); }
  }
}
function updateFx(dt) {
  for (const p of G.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; const dr = p.k === 'smoke' ? .5 : .1; p.vx *= Math.pow(dr, dt); p.vy *= Math.pow(dr, dt); }

/* ===================== 3D: malhas, poses e projeção (sem bibliotecas) =====================
   Cada nave é um conjunto de peças rígidas feitas de polígonos. A câmera olha de cima, inclinada,
   com perspectiva leve; as faces são iluminadas, ordenadas da mais distante para a mais próxima e
   pintadas com contorno. Na transformação, cada peça interpola posição e rotação entre as poses. */
const TILT = 36 * Math.PI / 180, CT = Math.cos(TILT), ST = Math.sin(TILT);

const L2 = (() => { const v = [.6, -.55, .3], l = Math.hypot(...v); return v.map((c) => c / l); })();    // luz de contorno (planeta)

function outward(faces) {

const F = (p, col, fl) => ({ p, c: rgb(col), f: fl || 0 });   // fl: 1 = emissivo, 2 = brilhante
function loftY(secs, col, fl, capA, capB) { // secções transversais ao longo de Y: [{y, pts:[[x,z]...]}]

    for (let i = 0; i < n; i++) { const j = (i + 1) % n; out.push(F([[A.pts[i][0], A.y, A.pts[i][1]], [A.pts[j][0], A.y, A.pts[j][1]], [B.pts[j][0], B.y, B.pts[j][1]], [B.pts[i][0], B.y, B.pts[i][1]]], col, fl)); } }

  const out = [F(pts.map(([x, y]) => [x, y, z1]), top, fl), F(pts.map(([x, y]) => [x, y, z0]), side, fl)];
  for (let i = 0; i < pts.length; i++) { const j = (i + 1) % pts.length; out.push(F([[pts[i][0], pts[i][1], z0], [pts[j][0], pts[j][1], z0], [pts[j][0], pts[j][1], z1], [pts[i][0], pts[i][1], z1]], side, fl)); }

function extrudeYZ(pts, x0, x1, col, side) { // contorno no plano YZ com espessura em X (derivas)

  for (let i = 0; i < pts.length; i++) { const j = (i + 1) % pts.length; out.push(F([[x0, pts[i][0], pts[i][1]], [x0, pts[j][0], pts[j][1]], [x1, pts[j][0], pts[j][1]], [x1, pts[i][0], pts[i][1]]], side || col)); }

  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * (OX + sx), DPR * (OY + sy));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawBackground(dt);
  if (!G) { ctx.restore(); return; }
  for (const it of G.items) {
    if (it.kind === 'C') { // ficha de crédito: hexágono dourado girando
      const w = Math.abs(Math.cos(it.t * 5)) * .8 + .2; ctx.save(); ctx.translate(it.x, it.y); ctx.scale(w, 1);
      ctx.fillStyle = '#FFD24D'; ctx.strokeStyle = '#8A5A00'; ctx.lineWidth = 1.2; ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * 6.283 + .52; ctx.lineTo(Math.cos(a) * 6.5, Math.sin(a) * 6.5); } ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8A5A00'; ctx.font = '800 7px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('¢', 0, .5); ctx.restore(); continue;
    }
    const col = { P: '#FFB703', M: '#FF5D8F', E: '#5FD3C4', 1: '#7CFF6B' }[it.kind];
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.t * 2) * .2);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 13 + Math.sin(it.t * 6), 0, 7); ctx.stroke();
    ctx.fillStyle = col; ctx.font = '800 ' + (it.kind === '1' ? 9 : 14) + 'px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.kind === '1' ? '1UP' : it.kind, 0, 1);
    ctx.restore();
  }
  for (const e of G.enemies) drawEnemy(e);
  // rastros de fumaça dos mísseis
  ctx.lineCap = 'round';
  for (const b of G.pb) if (b.kind === 'missile' && b.trail && b.trail.length > 1) {
    for (let k = 1; k < b.trail.length; k++) { const al = k / b.trail.length; ctx.strokeStyle = 'rgba(220,225,240,' + al * .55 + ')'; ctx.lineWidth = 1 + al * 3; ctx.beginPath(); ctx.moveTo(b.trail[k - 1][0], b.trail[k - 1][1]); ctx.lineTo(b.trail[k][0], b.trail[k][1]); ctx.stroke(); }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const b of G.pb) {
    if (b.t < 0) continue;
    if (b.kind === 'shot') { ctx.fillStyle = '#9FF7FF'; ctx.fillRect(b.x - 1.5, b.y - 9, 3, 16); ctx.fillStyle = 'rgba(80,200,255,.35)'; ctx.fillRect(b.x - 3, b.y - 10, 6, 18); }
    else if (b.kind === 'heavy') { const g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, 11); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.4, '#FFC94D'); g.addColorStop(1, 'rgba(255,120,30,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, 7); ctx.fill(); }
    else { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx)); ctx.fillStyle = '#F1F3F5'; ctx.fillRect(-6, -1.6, 10, 3.2); ctx.fillStyle = 'rgba(255,170,60,.9)'; ctx.beginPath(); ctx.arc(-7, 0, 3, 0, 7); ctx.fill(); ctx.restore(); }
  }
  for (const b of G.eb) { const g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r * 1.8); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.4, b.kind === 'big' ? '#FF5DC8' : '#FF8A5D'); g.addColorStop(1, 'rgba(255,60,120,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.8, 0, 7); ctx.fill(); }
  for (const p of G.parts) {
    const k = p.t / p.life;
    if (p.k === 'fire') { const col = k < .3 ? '255,240,200' : k < .6 ? '255,170,70' : '200,70,30'; ctx.fillStyle = 'rgba(' + col + ',' + (1 - k) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (1 - k * .5), 0, 7); ctx.fill(); }
    else if (p.k === 'spark') { ctx.fillStyle = p.c; ctx.globalAlpha = 1 - k; ctx.fillRect(p.x, p.y, p.s, p.s); ctx.globalAlpha = 1; }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of G.parts) if (p.k === 'smoke') { const k = p.t / p.life; ctx.fillStyle = 'rgba(90,90,110,' + .35 * (1 - k) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (1 + k), 0, 7); ctx.fill(); }
  for (const r of G.rings) { const k = r.t / r.life; ctx.strokeStyle = 'rgba(255,230,190,' + (1 - k) + ')'; ctx.lineWidth = 3 * (1 - k); ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (.3 + k), 0, 7); ctx.stroke(); }
  const P = G.P;
  if (P.alive) { drawShield(P); drawShip(P.x, P.y, P.m, P.aim, P.tilt, P.inv, P.power); }
  if (P.alive && P.target === 2 && MOUSE.on) { const [wx, wy] = toWorld(MOUSE.x, MOUSE.y); ctx.strokeStyle = 'rgba(255,201,77,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(wx, wy, 9, 0, 7); ctx.moveTo(wx - 14, wy); ctx.lineTo(wx + 14, wy); ctx.moveTo(wx, wy - 14); ctx.lineTo(wx, wy + 14); ctx.stroke(); }
  for (const p of G.pops) { const k = p.t / (p.big ? 1.6 : .9); ctx.globalAlpha = 1 - k; ctx.fillStyle = p.big ? '#FFE066' : p.coin ? '#FFD24D' : '#FFFFFF'; ctx.font = '800 ' + (p.big ? 18 : p.coin ? 10 : 12) + 'px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); ctx.globalAlpha = 1; }
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + G.flash * .5 + ')'; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  ctx.restore();
}
function drawHUD() {
  const P = G.P, hi = Math.max(G.score, ((store.get('scores') || [])[0] || { s: 0 }).s);
  ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(5,4,20,.55)'; ctx.fillRect(0, 0, W, 34);
  ctx.font = '700 11px "Segoe UI",Arial,sans-serif'; ctx.fillStyle = '#A898C0'; ctx.textAlign = 'left'; ctx.fillText(t('score'), 10, 4); ctx.textAlign = 'center'; ctx.fillText(t('hi'), W / 2, 4); ctx.textAlign = 'right'; ctx.fillText(t('wave'), W - 10, 4);
  ctx.font = '800 15px "Segoe UI",Arial,sans-serif'; ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'left'; ctx.fillText(nf(G.score), 10, 16); ctx.textAlign = 'center'; ctx.fillText(nf(hi), W / 2, 16); ctx.textAlign = 'right'; ctx.fillText(String(G.wave), W - 10, 16);
  if (G.mult >= 2) { ctx.fillStyle = '#FFC94D'; ctx.textAlign = 'left'; ctx.fillText('×' + Math.floor(G.mult), 120, 16); }
  ctx.font = '700 11px "Segoe UI",Arial,sans-serif'; ctx.fillStyle = '#A898C0'; ctx.textAlign = 'center'; ctx.fillText(t('creditsHud'), W * .73, 4); ctx.font = '800 15px "Segoe UI",Arial,sans-serif'; ctx.fillStyle = '#FFD24D'; ctx.fillText(nf(G.credits) + ' ¢', W * .73, 16);
  // rodapé: vidas, especiais, formas, potência, escudo
  ctx.fillStyle = 'rgba(5,4,20,.55)'; ctx.fillRect(0, H - 40, W, 40);
  for (let k = 0; k < Math.min(P.lives, 6); k++) drawShip(16 + k * 20, H - 20, 0, -Math.PI / 2, 0, 0, 1, .3);
  if (P.lives > 6) { ctx.fillStyle = '#fff'; ctx.font = '700 11px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('+' + (P.lives - 6), 136, H - 20); }
  for (let k = 0; k < G.up.armor; k++) { ctx.fillStyle = k < P.armor ? '#FFD27F' : 'rgba(255,255,255,.18)'; ctx.font = '800 13px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⛨', 262 + k * 15, H - 20); }
  const SPS = Math.min(16, 76 / Math.max(1, P.special - 1));
  for (let k = 0; k < P.special; k++) { ctx.fillStyle = '#FF5D8F'; ctx.font = '800 14px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✦', 170 + k * SPS, H - 20); }
  // formas
  const mx = W - 150;
  ['C', 'H', 'R'].forEach((L, k) => {
    const on = P.target === k; ctx.fillStyle = on ? '#18B8A8' : 'rgba(255,255,255,.12)'; ctx.fillRect(mx + k * 34, H - 34, 30, 28);
    ctx.fillStyle = on ? '#06201D' : '#C8BEDC'; ctx.font = '800 12px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText((k + 1) + ' ' + t(MODES[k]).charAt(0), mx + k * 34 + 15, H - 20);
  });
  for (let k = 0; k < 4; k++) { ctx.fillStyle = k < P.power ? '#FFB703' : 'rgba(255,255,255,.15)'; ctx.fillRect(mx - 46 + k * 9, H - 26, 6, 12); }
  if (P.target === 2) { ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(mx, H - 46, 98, 4); ctx.fillStyle = P.shieldOff ? '#C62828' : '#5FD3C4'; ctx.fillRect(mx, H - 46, 98 * P.shield / shieldMax(), 4); ctx.fillStyle = '#A898C0'; ctx.font = '700 9px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(t('shield'), mx - 4, H - 44); }
  // faixa da onda
  if (G.banner) {
    const k = G.banner.t, al = Math.min(1, k / .3, (2.6 - k) / .4);
    ctx.globalAlpha = al; ctx.fillStyle = G.banner.boss ? 'rgba(120,10,40,.75)' : 'rgba(10,10,40,.65)'; ctx.fillRect(0, H * .38, W, 60);
    ctx.fillStyle = G.banner.boss ? '#FF8A8A' : '#FFE066'; ctx.font = '900 30px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(G.banner.text, W / 2, H * .38 + 30); ctx.globalAlpha = 1;
  }
  // barra de vida da nave-mãe
  const boss = G.enemies.find((e) => e.type === 'boss');
  if (boss) {
    const tur = boss.turrets.reduce((a, u) => a + Math.max(0, u.hp), 0), tmax = boss.turrets.reduce((a, u) => a + u.maxhp, 0);
    const frac = (tur + Math.max(0, boss.hp)) / (tmax + boss.maxhp);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(40, 40, W - 80, 6); ctx.fillStyle = boss.core ? '#FF5DC8' : '#9F86FF'; ctx.fillRect(40, 40, (W - 80) * frac, 6);
  }
  if (G.paused && !G.over) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.font = '800 20px "Segoe UI",Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t('paused'), W / 2, H / 2); }
}

/* ===================== Laço ===================== */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G && !G.paused && !G.over && !G.inShop) { acc += dt; let n = 0; while (acc >= FIXED && n < 12) { step(FIXED); acc -= FIXED; n++; } if (n >= 12) acc = 0; updateFx(dt); }
  else if (G && G.over) updateFx(dt);
  try { if (CW) drawWorld(G && G.paused ? 0 : dt); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

/* ===================== Entrada ===================== */
function keyOf(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || document.querySelector('dialog[open]')) return;
  const k = keyOf(e);
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  SND.init();
  if (!G || G.over) return;
  if (k === 'p' || k === 'escape') { togglePause(); return; }
  if (G.paused) return;
  if (!e.repeat) {
    if (k === 'shift' || k === 'k' || k === 'x') setMode((G.P.target + 1) % 3);
    else if (k === '1' || k === '2' || k === '3') setMode(+k - 1);
    else if (k === 'b' || k === 'l') special();
  }
  KEYS.add(k);
});
document.addEventListener('keyup', (e) => KEYS.delete(keyOf(e)));
window.addEventListener('blur', () => { KEYS.clear(); MOUSE.down = false; if (G && !G.over && !G.paused && !G.inShop) togglePause(); });
cv.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (e.pointerType === 'mouse') { MOUSE.x = x; MOUSE.y = y; MOUSE.on = true; }
  else if (TOUCH.id === e.pointerId && G) { TOUCH.dx += (x - TOUCH.lx) / SC; TOUCH.dy += (y - TOUCH.ly) / SC; TOUCH.lx = x; TOUCH.ly = y; }
});
cv.addEventListener('pointerdown', (e) => {
  SND.init(); cv.focus({ preventScroll: true });
  const r = cv.getBoundingClientRect();
  if (e.pointerType === 'mouse') { if (e.button === 0) MOUSE.down = true; e.preventDefault(); }
  else if (TOUCH.id === null) { TOUCH.id = e.pointerId; TOUCH.lx = e.clientX - r.left; TOUCH.ly = e.clientY - r.top; TOUCH.active = true; cv.setPointerCapture(e.pointerId); }
});
const endTouch = (e) => { if (e.pointerType === 'mouse') { MOUSE.down = false; return; } if (TOUCH.id === e.pointerId) { TOUCH.id = null; TOUCH.active = false; } };
cv.addEventListener('pointerup', endTouch); cv.addEventListener('pointercancel', endTouch);
cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { MOUSE.on = false; MOUSE.down = false; } });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
$('#tMorph').addEventListener('pointerdown', (e) => { e.preventDefault(); SND.init(); if (G && !G.paused) setMode((G.P.target + 1) % 3); });
$('#tSpecial').addEventListener('pointerdown', (e) => { e.preventDefault(); SND.init(); special(); });
function togglePause() { if (!G || G.over) return; G.paused = !G.paused; KEYS.clear(); MOUSE.down = false; $('#bPause').textContent = G.paused ? t('resume') : t('pause'); }

/* ===================== Interface ===================== */
function scoresTable(list, me) {
  if (!list.length) { const p = document.createElement('p'); p.textContent = t('noScores'); return p; }
  const tb = document.createElement('table'), th = document.createElement('thead'), tr = document.createElement('tr');
  for (const [k, n] of [['thRank', 1], ['thScore', 1], ['thWave', 1], ['thLevel', 0], ['thDate', 0]]) { const c = document.createElement('th'); c.textContent = t(k); if (n) c.className = 'n'; tr.appendChild(c); }
  th.appendChild(tr); tb.appendChild(th); const bd = document.createElement('tbody');
  list.forEach((s, i) => {
    const r = document.createElement('tr'); if (me && s.id === me.id) r.className = 'me';
    for (const [v, n] of [[i + 1, 1], [nf(s.s), 1], [s.w, 1], [t({ easy: 'lvEasy', normal: 'lvNormal', hard: 'lvHard' }[s.l] || 'lvNormal'), 0], [new Intl.DateTimeFormat(HTML_LANG[LANG]).format(new Date(s.d + 'T12:00:00')), 0]]) { const c = document.createElement('td'); c.textContent = v; if (n) c.className = 'n'; r.appendChild(c); }
    bd.appendChild(r);
  });
  tb.appendChild(bd); return tb;
}
function showEnd(entry, top) {
  $('#endText').textContent = t('endText', G.wave, nf(G.score)) + (entry.s > 0 && top[0] && top[0].id === entry.id ? ' ' + t('newRecord') : '');
  const box = $('#endScores'); box.textContent = ''; box.appendChild(scoresTable(top, entry));
  const acc = G.shots ? Math.round(G.hits / G.shots * 100) + '%' : '—';
  $('#endMeta').textContent = t('endMeta', G.seed, t({ easy: 'lvEasy', normal: 'lvNormal', hard: 'lvHard' }[OPTS.level]), nf(G.kills), acc) + ' · ' + t('endCredits', nf(G.creditsTotal));
  say(t('gameOver') + '. ' + $('#endText').textContent);
  $('#dEnd').showModal(); $('#bAgain').focus();
}
function fillSetup() {
  $('#fLevel').value = OPTS.level; $('#fWave').value = String(OPTS.wave); $('#fAuto').value = OPTS.auto; $('#fShop').value = OPTS.shop || 'each'; $('#fSeed').value = OPTS.seed;
  const box = $('#setupScores'); box.textContent = ''; box.appendChild(scoresTable(store.get('scores') || []));
}
function readSetup() { OPTS = { level: $('#fLevel').value, wave: +$('#fWave').value, auto: $('#fAuto').value, shop: $('#fShop').value, seed: ($('#fSeed').value.match(/\d+/) || [''])[0].slice(0, 9) }; store.set('opts', OPTS); }
function openSetup() { if (G && !G.over) G.paused = true; fillSetup(); if ($('#dEnd').open) $('#dEnd').close(); $('#dSetup').showModal(); $('#bStart').focus(); }
const newSeed = () => (Date.now() ^ Math.floor(performance.now() * 1000)) % 1000000000 >>> 0;
function begin(seed) { TIMERS = []; if ($('#dShop').open) { G.inShop = false; $('#dShop').close(); } newGame(seed); $('#bPause').textContent = t('pause'); cv.focus({ preventScroll: true }); }
function applyLang() {
  document.documentElement.lang = HTML_LANG[LANG]; document.title = t('title') + ' · Giovani Perotto Mesquita';
  document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-ta]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.ta)); el.title = t(el.dataset.ta); });
  $('#helpBody').innerHTML = t('helpBody'); $('#sLang').value = LANG; cv.setAttribute('aria-label', t('canvasLabel'));
  if ($('#dSetup').open) fillSetup();
  if ($('#dShop').open && G) renderShop();
  if (G) $('#bPause').textContent = G.paused && !G.over ? t('resume') : t('pause');
}
function setLang(l, push) { LANG = LANGS.includes(l) ? l : 'pt'; store.set('lang', LANG); if (push) history.replaceState(null, '', LANG === 'pt' ? location.pathname + location.search : '#' + LANG); applyLang(); }
function setTheme(th) { document.documentElement.dataset.theme = th; }
$('#bNew').addEventListener('click', () => { if (G && !G.over && G.time > 5 && !window.confirm(t('gameOver') + '?')) return; openSetup(); });
$('#bStart').addEventListener('click', () => { SND.init(); readSetup(); $('#dSetup').close(); begin(OPTS.seed ? +OPTS.seed : newSeed()); });
$('#bSetupCancel').addEventListener('click', () => $('#dSetup').close());
$('#dSetup').addEventListener('close', () => { if (!G) begin(OPTS.seed ? +OPTS.seed : newSeed()); else if (!G.over) { G.paused = false; $('#bPause').textContent = t('pause'); } });
$('#bPause').addEventListener('click', () => { togglePause(); cv.focus({ preventScroll: true }); });
$('#bHelp').addEventListener('click', () => { if (G && !G.over && !G.paused) togglePause(); $('#dHelp').showModal(); $('#hHelp').focus(); });
$('#bHelpClose').addEventListener('click', () => $('#dHelp').close());
$('#bShopGo').addEventListener('click', closeShop);
$('#dShop').addEventListener('close', closeShop);
$('#bTheme').addEventListener('click', () => { const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; setTheme(th); store.set('theme', th); });
$('#bSound').addEventListener('click', () => { SND.on = !SND.on; store.set('sound', SND.on); $('#bSound').textContent = SND.on ? '🔊' : '🔇'; $('#bSound').setAttribute('aria-pressed', String(SND.on)); if (SND.on) SND.init(); });
$('#sLang').addEventListener('change', (e) => setLang(e.target.value, true));
$('#bAgain').addEventListener('click', () => { $('#dEnd').close(); begin(OPTS.seed ? (G.seed + 1) >>> 0 : newSeed()); });
$('#bEndSetup').addEventListener('click', openSetup);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LANGS.includes(h) && h !== LANG) setLang(h, false); });
(function init() {
  setTheme(store.get('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  const snd = store.get('sound'); SND.on = snd === null ? true : !!snd; $('#bSound').textContent = SND.on ? '🔊' : '🔇';
  const h = location.hash.slice(1), saved = store.get('lang'), nav = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  LANG = LANGS.includes(h) ? h : LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'pt';
  if (window.matchMedia('(pointer: coarse)').matches) { $('#touch').hidden = false; if (!store.get('opts')) OPTS.auto = 'on'; }
  resize(); applyLang(); requestAnimationFrame(frame); openSetup();
})();
</script>
