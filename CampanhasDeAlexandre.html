<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>As Campanhas de Alexandre · Giovani Perotto Mesquita</title>
<meta name="description" content="Jogo de tabuleiro com dados sobre as campanhas de Alexandre, o Grande, do Helesponto (334 a.C.) à Índia (326–325 a.C.), com eventos, números e batalhas tirados de Arriano, Diodoro e Plutarco. Em português, inglês, italiano e espanhol.">
<meta name="author" content="Giovani Perotto Mesquita">
<meta name="theme-color" content="#231622">
<style>

    --road: #6B4A2A; --river: #4F7F91; --searoute: #2F5E8F; --coast: #5E4A32; --mapink: #2A1D14; --hatch: #7A5530; --tree: #4E6B38;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: #241C15; --panel-2: #30261D; --ink: #F1E7D3; --muted: #BDAA8C; --line: #4A3C2C; --accent: #E0614F; --accent-ink: #1A0E08; --ok: #7CC48A; --sea: #2D4651; --sea-2: #253B45; --land: #5A4C36; --land-2: #4E412E; --road: #D8B888; --river: #86BED0; --searoute: #9CC3E6; --coast: #C9B48E; --mapink: #F1E7D3; --hatch: #C9A574; --tree: #9CC48A; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --panel: #241C15; --panel-2: #30261D; --ink: #F1E7D3; --muted: #BDAA8C; --line: #4A3C2C; --accent: #E0614F; --accent-ink: #1A0E08; --ok: #7CC48A; --sea: #2D4651; --sea-2: #253B45; --land: #5A4C36; --land-2: #4E412E; --road: #D8B888; --river: #86BED0; --searoute: #9CC3E6; --coast: #C9B48E; --mapink: #F1E7D3; --hatch: #C9A574; --tree: #9CC48A; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }

  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .75rem; }

  .topbar .date { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; color: #F7D27A; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: .45rem .8rem; font-weight: 600; min-height: 38px; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .topbar .btn.sm { background: rgba(0,0,0,.3); color: #F3E6CC; border-color: rgba(255,255,255,.25); }
  .mapwrap { position: relative; flex: 1; min-height: 260px; border-radius: 14px; overflow: hidden; border: 4px solid #6B4A2A; background: var(--sea); touch-action: none; }
  #map { width: 100%; height: 100%; display: block; user-select: none; }

  .legend { position: absolute; left: 8px; bottom: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: .72rem; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 60px); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #0006; }
  /* mapa */
  .node { cursor: pointer; }
  .node .lbl { font-family: var(--serif); font-size: 9px; fill: #2A1D14; paint-order: stroke; stroke: #F4EAD3; stroke-width: 2.4px; stroke-linejoin: round; pointer-events: none; }
  .rvl { font-size: calc(var(--k, 1) * 10px); font-style: italic; fill: var(--river); paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--k, 1) * 2.4px); }
  .mtl { font-size: calc(var(--k, 1) * 11px); font-style: italic; letter-spacing: .12em; fill: var(--road); paint-order: stroke; stroke: var(--land); stroke-width: calc(var(--k, 1) * 2.4px); }
  .scalebar { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 5px; font-family: var(--serif); font-size: .72rem; color: var(--ink); }
  .scalebar i { display: block; height: 6px; margin-top: 3px; border: 1px solid var(--ink); border-top: 0; background: repeating-linear-gradient(90deg, var(--ink) 0 25%, transparent 25% 50%); }

  .rl { font-size: calc(var(--k, 1) * 22px); } .sl { font-size: calc(var(--k, 1) * 13px); }
  :root[data-theme="dark"] .node .lbl { fill: #F1E7D3; stroke: #2A2117; }

  :root[data-theme="dark"] .node circle.dot { stroke: #F1E7D3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node circle.dot { stroke: #F1E7D3; } }
  .node.reach circle.dot { stroke: #F7D27A; stroke-width: 3; }
  .node.reach .ring { display: block; }
  .node .ring { display: none; fill: none; stroke: #F7D27A; stroke-width: 1.5; stroke-dasharray: 3 2; }
  .node:focus-visible { outline: none; }
  .node:focus-visible circle.dot { stroke: #F7D27A; stroke-width: 4; }
  .army { cursor: pointer; }
  .army.sel rect.bg { stroke: #F7D27A; stroke-width: 3; }
  .army text { font-family: var(--sans); font-weight: 700; pointer-events: none; }
  /* painel */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stats div { background: var(--panel-2); border-radius: 8px; padding: 4px; }
  .stats b { display: block; font-family: var(--serif); font-size: 1.15rem; }
  .stats span { font-size: .72rem; color: var(--muted); }
  .armies { display: flex; flex-direction: column; gap: 4px; }
  .armies button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 8px; display: flex; justify-content: space-between; gap: 6px; font-size: .84rem; }
  .armies button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .armies button.done { opacity: .6; }

  .leg .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .leg .bar i { display: block; height: 100%; background: var(--accent); }
  .leg b { font-family: var(--serif); }
  .leg label { display: flex; align-items: center; gap: 4px; }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

  .moves { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

  .muted { color: var(--muted); font-size: .8rem; }
  .cp { font-weight: 700; color: var(--accent); }
  .logbox ol { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; font-size: .8rem; line-height: 1.4; }
  .logbox li { padding: 2px 0; border-bottom: 1px dotted var(--line); }
  .logbox li.h { font-weight: 700; color: var(--accent); font-family: var(--serif); border-bottom: 0; padding-top: 6px; }
  .logbox li.q { font-style: italic; color: var(--muted); }
  /* dados */
  .dice { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; align-items: center; }
  .die { width: 28px; height: 28px; border-radius: 6px; background: #FBF7EE; border: 1px solid #8A7556; box-shadow: inset 0 -2px 0 #0002, 0 1px 2px #0004; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 3px; }
  .die.red { background: #8E1B1B; border-color: #5A0F0F; }
  .die.red i { background: #FBF0D8; }
  .die.grn { background: #3E6B3A; border-color: #24401F; }
  .die.grn i { background: #F3EBD3; }
  .die.pur { background: #5B2D6E; border-color: #3A1B47; }
  .die.pur i { background: #F3EBD3; }
  .die i { width: 5px; height: 5px; border-radius: 50%; background: #2A1D14; place-self: center; visibility: hidden; }
  .die.hit { box-shadow: 0 0 0 2px var(--gold), 0 1px 2px #0004; }
  .die.miss { opacity: .55; }
  .die.roll { animation: roll .45s ease-out; }
  @keyframes roll { 0% { transform: rotate(-200deg) scale(.6); } 70% { transform: rotate(20deg) scale(1.1); } 100% { transform: none; } }
  /* diálogos */
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); width: min(760px, calc(100vw - 20px)); max-height: calc(100dvh - 30px); padding: 1rem 1.1rem; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-family: var(--serif); margin: 0 0 .5rem; }
  dialog h3 { margin: .9rem 0 .3rem; font-size: 1rem; font-family: var(--serif); }
  dialog p, dialog li { line-height: 1.5; font-size: .92rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .6rem; }
  .bt-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bt-sides > div { background: var(--panel-2); border-radius: 10px; padding: 8px; }
  .bt-sides h3 { margin: 0 0 4px; }
  .bt-sides ul { margin: 4px 0; padding-left: 1.1rem; font-size: .82rem; }
  .bt-val { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; }
  .bt-log { max-height: 200px; overflow: auto; font-size: .85rem; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .bt-log p { margin: .2rem 0; }
  .quote { font-family: var(--serif); font-style: italic; color: var(--muted); border-left: 3px solid var(--gold); padding-left: .7rem; margin: .5rem 0; }
  .ev-src { font-size: .78rem; color: var(--muted); }
  .overlay { position: fixed; inset: 0; z-index: 50; overflow: auto; background: radial-gradient(ellipse at 50% 25%, #4A2A48, #160D15 75%); display: flex; align-items: flex-start; justify-content: center; padding: 16px; }
  .sheet { width: min(860px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.2rem 1.2rem; margin: auto 0; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .sheet h1 { font-family: var(--serif); margin: .2rem 0; font-size: clamp(1.7rem, 5vw, 2.5rem); letter-spacing: .02em; }
  .sheet .tag2 { margin: 0 0 .6rem; color: var(--muted); }
  .sheet .back { color: var(--accent); font-weight: 600; text-decoration: none; font-size: .9rem; }
  .hero { font-family: var(--serif); text-align: center; letter-spacing: .3em; color: var(--accent); font-size: .9rem; margin: .3rem 0; }
  .scen { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: .6rem 0; }
  .scen label { border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; background: var(--panel-2); display: flex; gap: .5rem; align-items: flex-start; cursor: pointer; }
  .scen label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .scen b { font-family: var(--serif); display: block; }
  .scen small { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .5rem .8rem; }
  .field { display: flex; flex-direction: column; gap: .2rem; font-size: .85rem; font-weight: 600; }
  .field select, .field input { font-weight: 400; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: .4rem .5rem; min-height: 38px; }
  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; height: auto; min-height: 100dvh; }
    .mapwrap { flex: none; height: min(70dvh, 560px); }
    .side { overflow: visible; }
  }
  @media (max-width: 560px) {
    .topbar .info { flex-basis: 100%; }
    .mapwrap { overflow: visible; margin-bottom: 92px; height: 62dvh; }
    #map { border-radius: 10px; }
    .compass { width: 40px; height: 40px; }
    .legend { top: calc(100% + 8px); bottom: auto; left: -4px; max-width: calc(100% + 8px); font-size: .68rem; }

  }
  @media (prefers-reduced-motion: reduce) { .die.roll { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <main class="stage">
    <div class="topbar">
      <div class="info"><span class="date" id="date"></span><span id="scenName"></span></div>

      <button type="button" class="btn sm" id="bTheme"></button>
      <button type="button" class="btn sm" id="bSpeed"></button>
      <button type="button" class="btn sm" id="bMenu" data-t="menu"></button>
    </div>
    <div class="mapwrap" id="mapwrap">

      <div class="scalebar" id="scalebar" aria-hidden="true"><span id="scaleTxt">1000 stadia</span><i id="scaleBar"></i></div>
      <svg class="compass" viewBox="-30 -30 60 60" aria-hidden="true"><circle r="22" fill="none" stroke="currentColor" stroke-width="1"/><circle r="17" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="1.5 1.5"/><path d="M0-27L4 0L0 27L-4 0Z" fill="#8E1B1B"/><path d="M-27 0L0-4L27 0L0 4Z" fill="currentColor"/><path d="M0-27L4 0L-4 0Z" fill="var(--land)" opacity=".5"/><text y="-23" text-anchor="middle" font-family="Georgia" font-size="7" fill="currentColor" dy="-6">Α</text><text y="31" text-anchor="middle" font-family="Georgia" font-size="7" fill="currentColor" dy="2">Μ</text><text x="31" y="2.5" text-anchor="middle" font-family="Georgia" font-size="6.5" fill="currentColor">Ἀν</text><text x="-31" y="2.5" text-anchor="middle" font-family="Georgia" font-size="6.5" fill="currentColor">Δυ</text></svg>
    </div>
  </main>
  <aside class="side">
    <section class="box"><div class="stats"><div><b id="sGloria">0</b><span data-t="gloria"></span></div><div><b id="sAuct">0</b><span data-t="auctoritas"></span></div><div><b id="sMil">0</b><span data-t="soldiers"></span></div></div></section>
    <section class="box"><h2 data-t="yourArmies"></h2><div class="armies" id="armyList"></div></section>
    <section class="box" id="selBox"></section>
    <section class="box"><h2 data-t="diceT"></h2><div class="dice" id="diceTray" aria-live="polite"></div><p class="muted" id="diceTxt"></p>
      <div class="row"><button type="button" class="btn pri" id="bEnd" data-t="endSeason"></button></div></section>
    <section class="box logbox"><h2 data-t="logT"></h2><ol id="log"></ol></section>
  </aside>
</div>

<section class="overlay" id="ovSetup" aria-labelledby="ttl">
  <div class="sheet">
    <a class="back" id="backLink" href="projects.html" data-t="back"></a>
    <p class="hero">ΑΛΕΞΑΝΔΡΟΥ</p>
    <h1 id="ttl" data-t="title"></h1>
    <p class="tag2" data-t="tagline"></p>
    <p class="quote" data-t="openQuote"></p>
    <div class="scen" id="scenList" role="radiogroup"></div>
    <div class="grid">
      <label class="field"><span data-t="difficulty"></span><select id="sDiff"><option value="0" data-t="d0"></option><option value="1" data-t="d1"></option><option value="2" data-t="d2"></option></select></label>
      <label class="field"><span data-t="lang"></span><select id="sLang"><option value="pt">Português</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
      <label class="field"><span data-t="seed"></span><input id="sSeed" inputmode="numeric" autocomplete="off"></label>
    </div>
    <div class="row">
      <button type="button" class="btn pri" id="bPlay" data-t="play"></button>
      <button type="button" class="btn" id="bResume" data-t="resume" hidden></button>
      <button type="button" class="btn" id="bRules2" data-t="rules"></button>
      <button type="button" class="btn" id="bTheme2"></button>
    </div>
  </div>
</section>

<dialog id="dRules" aria-labelledby="rulesH"><h2 id="rulesH" data-t="rules"></h2><div id="rulesBody"></div><div class="row"><button type="button" class="btn pri" id="bRulesClose" data-t="close"></button></div></dialog>
<dialog id="dEvent" aria-labelledby="evH"><h2 id="evH"></h2><div id="evBody"></div><div class="row" id="evBtns"></div></dialog>
<dialog id="dBattle" aria-labelledby="btH"><h2 id="btH"></h2><div id="btBody"></div><div class="dice" id="btDice"></div><div class="bt-log" id="btLog" aria-live="polite"></div><div class="row" id="btBtns"></div></dialog>

    l_hellespont: ['Alexandre atravessa o Helesponto com sessenta navios de guerra (Diodoro XVII.17). +1 Glória.', 'Alexander crosses the Hellespont with sixty warships (Diodorus XVII.17). +1 Glory.', 'Alessandro attraversa l’Ellesponto con sessanta navi da guerra (Diodoro XVII.17). +1 Gloria.', 'Alejandro cruza el Helesponto con sesenta naves de guerra (Diodoro XVII.17). +1 Gloria.'],
    l_ilion: ['Em Ílion, Alexandre sacrifica a Atena e dedica a ela a sua armadura (Arriano I.11); Diodoro conta que honrou os túmulos de Aquiles e Ájax. +1 Glória.', 'At Ilium Alexander sacrifices to Athena and dedicates his armour to her (Arrian I.11); Diodorus says he honoured the tombs of Achilles and Ajax. +1 Glory.', 'A Ilio Alessandro sacrifica ad Atena e le dedica la sua armatura (Arriano I.11); Diodoro racconta che onorò le tombe di Achille e Aiace. +1 Gloria.', 'En Ilión, Alejandro sacrifica a Atenea y le dedica su armadura (Arriano I.11); Diodoro cuenta que honró las tumbas de Aquiles y Áyax. +1 Gloria.'],
    l_gordion: ['O nó górdio: segundo a versão comum, Alexandre o corta com a espada; segundo Aristobulo, tira a cavilha do timão. Arriano não sabe dizer qual é a verdade (II.3). +2 Glória, +1 Lealdade.', 'The Gordian knot: the common version says Alexander cut it with his sword; Aristobulus says he pulled out the pin of the pole. Arrian cannot say which is true (II.3). +2 Glory, +1 Loyalty.', 'Il nodo gordiano: secondo la versione comune Alessandro lo taglia con la spada; secondo Aristobulo toglie il perno del timone. Arriano non sa dire quale sia vera (II.3). +2 Gloria, +1 Lealtà.', 'El nudo gordiano: según la versión común, Alejandro lo corta con la espada; según Aristóbulo, saca la clavija del timón. Arriano no sabe cuál es la verdad (II.3). +2 Gloria, +1 Lealtad.'],
    l_ammon: ['No oásis de Amon, duas serpentes (segundo Ptolomeu) ou dois corvos (segundo Aristobulo) guiam o exército. O oráculo responde “o que agradava ao rei” (Arriano III.3). +4 Glória, +1 Lealdade.', 'At the oasis of Ammon two serpents (says Ptolemy) or two ravens (says Aristobulus) guide the army. The oracle gives an answer “agreeable to his wishes” (Arrian III.3). +4 Glory, +1 Loyalty.', 'All’oasi di Ammone due serpenti (secondo Tolomeo) o due corvi (secondo Aristobulo) guidano l’esercito. L’oracolo risponde «ciò che piaceva al re» (Arriano III.3). +4 Gloria, +1 Lealtà.', 'En el oasis de Amón, dos serpientes (según Ptolomeo) o dos cuervos (según Aristóbulo) guían al ejército. El oráculo responde «lo que agradaba al rey» (Arriano III.3). +4 Gloria, +1 Lealtad.'],
    l_iaxartes: ['O exército atravessa o Iaxartes e entra na terra dos citas. +4 Glória.', 'The army crosses the Iaxartes into the land of the Scythians. +4 Glory.', 'L’esercito attraversa lo Iassarte ed entra nella terra degli Sciti. +4 Gloria.', 'El ejército cruza el Iaxartes y entra en la tierra de los escitas. +4 Gloria.'],
    l_hyphasis: ['O exército chega ao Hífase, o ponto mais a leste da campanha. +3 Glória.', 'The army reaches the Hyphasis, the easternmost point of the campaign. +3 Glory.', 'L’esercito arriva all’Ifasi, il punto più orientale della campagna. +3 Gloria.', 'El ejército llega al Hífasis, el punto más oriental de la campaña. +3 Gloria.'],
    l_ocean: ['Em Pátala, o exército vê o Oceano: o fim do mundo conhecido dos gregos. +4 Glória.', 'At Patala the army sees the Ocean, the end of the world the Greeks knew. +4 Glory.', 'A Patala l’esercito vede l’Oceano, la fine del mondo conosciuto dai Greci. +4 Gloria.', 'En Patala el ejército ve el Océano, el fin del mundo conocido por los griegos. +4 Gloria.'],
    l_treasure_s: ['Susa entrega o tesouro real: 50.000 talentos (Arriano III.16). +2 Lealdade.', 'Susa hands over the royal treasure: 50,000 talents (Arrian III.16). +2 Loyalty.', 'Susa consegna il tesoro reale: 50.000 talenti (Arriano III.16). +2 Lealtà.', 'Susa entrega el tesoro real: 50.000 talentos (Arriano III.16). +2 Lealtad.'],
    l_treasure_p: ['Persépolis abre o maior tesouro do império: 120.000 talentos, contando o ouro em prata (Diodoro XVII.71). +3 Lealdade.', 'Persepolis opens the empire’s greatest treasury: 120,000 talents, reckoning gold as silver (Diodorus XVII.71). +3 Loyalty.', 'Persepoli apre il più grande tesoro dell’impero: 120.000 talenti, contando l’oro in argento (Diodoro XVII.71). +3 Lealtà.', 'Persépolis abre el mayor tesoro del imperio: 120.000 talentos, contando el oro en plata (Diodoro XVII.71). +3 Lealtad.'],
    l_tyreFleet: ['Com a queda de Tiro, a frota persa perde os portos da Fenícia: o mar fica livre.', 'With the fall of Tyre the Persian fleet loses the ports of Phoenicia: the sea is clear.', 'Con la caduta di Tiro la flotta persiana perde i porti della Fenicia: il mare è libero.', 'Con la caída de Tiro, la flota persa pierde los puertos de Fenicia: el mar queda libre.'],
    l_aornos: ['Aornos cai. Diziam que nem Héracles a tomara; Arriano não sabe se Héracles chegou à Índia (IV.28). +4 Glória.', 'Aornos falls. They said not even Heracles had taken it; Arrian cannot say whether Heracles ever reached India (IV.28). +4 Glory.', 'Aorno cade. Si diceva che nemmeno Eracle l’avesse presa; Arriano non sa dire se Eracle arrivò in India (IV.28). +4 Gloria.', 'Aornos cae. Decían que ni Heracles la había tomado; Arriano no sabe si Heracles llegó a la India (IV.28). +4 Gloria.'],

    deceitP: ['Os batedores dizem que os sogdianos de Espitâmenes e os cavaleiros citas fogem para o deserto. Os oficiais querem persegui-los já, antes que escapem; o rei ainda está longe. Em 329, a coluna de Farnuces fez isso no rio Politimeto e foi destruída (Arriano IV.6).', 'The scouts report that Spitamenes’s Sogdians and the Scythian horsemen are fleeing into the desert. The officers want to pursue at once, before they escape; the king is still far away. In 329 the column under Pharnuches did just that on the Polytimetus and was destroyed (Arrian IV.6).', 'Gli esploratori dicono che i Sogdiani di Spitamene e i cavalieri sciti fuggono nel deserto. Gli ufficiali vogliono inseguirli subito, prima che scappino; il re è ancora lontano. Nel 329 la colonna di Farnuche fece così sul fiume Politimeto e fu distrutta (Arriano IV.6).', 'Los exploradores dicen que los sogdianos de Espitamenes y los jinetes escitas huyen al desierto. Los oficiales quieren perseguirlos ya, antes de que escapen; el rey aún está lejos. En 329, la columna de Farnuces hizo eso en el río Politimeto y fue destruida (Arriano IV.6).'],

    lostCaesar: ['Alexandre morreu em combate. Os generais dividem o exército, e a história tomará outro caminho.', 'Alexander has died in battle. The generals divide the army, and history will take another path.', 'Alessandro è morto in battaglia. I generali si dividono l’esercito, e la storia prenderà un’altra strada.', 'Alejandro murió en combate. Los generales se reparten el ejército, y la historia tomará otro camino.'],

    lostAuct: ['A Lealdade acabou: os macedônios se amotinam e exigem voltar para casa.', 'Loyalty is gone: the Macedonians mutiny and demand to go home.', 'La Lealtà è finita: i Macedoni si ammutinano e chiedono di tornare a casa.', 'La Lealtad se acabó: los macedonios se amotinan y exigen volver a casa.'],

    histCmp: ['Na história, Alexandre venceu no Grânico (334), em Isso (333) e em Gaugamela (331), chegou ao Hífase em 326 e morreu em 323 a.C., aos 32 anos e 8 meses (Arriano VII.28).', 'In history Alexander won at the Granicus (334), Issus (333) and Gaugamela (331), reached the Hyphasis in 326 and died in 323 BC, aged 32 years and 8 months (Arrian VII.28).', 'Nella storia Alessandro vinse al Granico (334), a Isso (333) e a Gaugamela (331), arrivò all’Ifasi nel 326 e morì nel 323 a.C., a 32 anni e 8 mesi (Arriano VII.28).', 'En la historia, Alejandro venció en el Gránico (334), en Iso (333) y en Gaugamela (331), llegó al Hífasis en 326 y murió en 323 a. C., a los 32 años y 8 meses (Arriano VII.28).'],

  // eventos históricos: título e texto; a fonte é dada à parte
  const EV = {
    granikos: [['O Grânico', 'Os sátrapas da Ásia Menor esperam na margem do Grânico. Memnon de Rodes aconselhou queimar os campos e evitar a batalha, mas eles preferem lutar. Arriano fala em cerca de 20.000 cavaleiros persas e pouco menos de 20.000 mercenários gregos; Diodoro dá outros números.'], ['The Granicus', 'The satraps of Asia Minor wait on the bank of the Granicus. Memnon of Rhodes advised burning the fields and avoiding battle, but they choose to fight. Arrian speaks of about 20,000 Persian horsemen and a little fewer than 20,000 Greek mercenaries; Diodorus gives other figures.'], ['Il Granico', 'I satrapi dell’Asia Minore aspettano sulla riva del Granico. Memnone di Rodi aveva consigliato di bruciare i campi ed evitare la battaglia, ma loro preferiscono combattere. Arriano parla di circa 20.000 cavalieri persiani e poco meno di 20.000 mercenari greci; Diodoro dà altre cifre.'], ['El Gránico', 'Los sátrapas de Asia Menor esperan en la orilla del Gránico. Memnón de Rodas aconsejó quemar los campos y evitar la batalla, pero ellos prefieren luchar. Arriano habla de unos 20.000 jinetes persas y algo menos de 20.000 mercenarios griegos; Diodoro da otras cifras.'], 'Arriano I.12–14; Diodoro XVII.18–19'],
    memnon: [['Memnon em Halicarnasso', 'Depois do Grânico, Memnon de Rodes, agora comandante da costa, se fecha em Halicarnasso com mercenários e o apoio da frota persa. Dario o nomeou governador da Ásia baixa e comandante de toda a frota.'], ['Memnon at Halicarnassus', 'After the Granicus, Memnon of Rhodes, now commander of the coast, shuts himself in Halicarnassus with mercenaries and the support of the Persian fleet. Darius has made him governor of lower Asia and commander of the whole fleet.'], ['Memnone ad Alicarnasso', 'Dopo il Granico, Memnone di Rodi, ora comandante della costa, si chiude ad Alicarnasso con mercenari e l’appoggio della flotta persiana. Dario lo ha nominato governatore dell’Asia inferiore e comandante di tutta la flotta.'], ['Memnón en Halicarnaso', 'Tras el Gránico, Memnón de Rodas, ahora comandante de la costa, se encierra en Halicarnaso con mercenarios y el apoyo de la flota persa. Darío lo nombró gobernador de Asia baja y comandante de toda la flota.'], 'Arriano I.20–23'],
    gordion: [['O carro de Górdio', 'Em Górdion há um carro antigo amarrado ao timão por um nó de casca de corniso. Diz o oráculo que quem o desatar governará a Ásia. Leve Alexandre até lá.'], ['The wagon of Gordius', 'At Gordium stands an old wagon tied to its pole with a knot of cornel bark. The oracle says that whoever undoes it will rule Asia. Take Alexander there.'], ['Il carro di Gordio', 'A Gordio c’è un antico carro legato al timone con un nodo di corteccia di corniolo. L’oracolo dice che chi lo scioglierà regnerà sull’Asia. Porta lì Alessandro.'], ['El carro de Gordio', 'En Gordio hay un carro antiguo atado al timón con un nudo de corteza de cornejo. El oráculo dice que quien lo desate gobernará Asia. Lleva allí a Alejandro.'], 'Arriano II.3'],
    issos: [['Dario marcha', 'O próprio rei Dario desce com o exército real. Arriano diz que eram cerca de 600.000 homens, com 30.000 mercenários gregos e 60.000 cárdacos; os números antigos variam muito entre os autores. Dario tenta cortar a retirada macedônica perto de Isso.'], ['Darius marches', 'King Darius himself comes down with the royal army. Arrian says it numbered about 600,000, with 30,000 Greek mercenaries and 60,000 Cardaces; the ancient figures vary widely between authors. Darius tries to cut the Macedonian line of retreat near Issus.'], ['Dario marcia', 'Il re Dario in persona scende con l’esercito reale. Arriano dice che erano circa 600.000 uomini, con 30.000 mercenari greci e 60.000 cardaci; le cifre antiche variano molto tra gli autori. Dario cerca di tagliare la ritirata macedone vicino a Isso.'], ['Darío marcha', 'El propio rey Darío baja con el ejército real. Arriano dice que eran unos 600.000 hombres, con 30.000 mercenarios griegos y 60.000 cárdacos; las cifras antiguas varían mucho entre autores. Darío intenta cortar la retirada macedonia cerca de Iso.'], 'Arriano II.6–8'],
    tyros: [['Tiro fecha as portas', 'Tiro, na ilha, recusa a entrada do rei. Para cercá-la é preciso um molhe e uma frota: oitenta navios fenícios e cento e vinte de Chipre se juntam a Alexandre em Sídon. No fim, segundo Arriano, cerca de 8.000 tírios morreram e 30.000 foram vendidos; Diodoro diz que o cerco durou sete meses.'], ['Tyre shuts its gates', 'Tyre, on its island, refuses the king entry. Besieging it needs a mole and a fleet: eighty Phoenician ships and a hundred and twenty from Cyprus join Alexander at Sidon. In the end, says Arrian, about 8,000 Tyrians died and 30,000 were sold; Diodorus says the siege lasted seven months.'], ['Tiro chiude le porte', 'Tiro, sull’isola, rifiuta l’ingresso al re. Per assediarla servono un molo e una flotta: ottanta navi fenicie e centoventi di Cipro si uniscono ad Alessandro a Sidone. Alla fine, secondo Arriano, morirono circa 8.000 Tirii e 30.000 furono venduti; Diodoro dice che l’assedio durò sette mesi.'], ['Tiro cierra las puertas', 'Tiro, en su isla, niega la entrada al rey. Para asediarla hacen falta un muelle y una flota: ochenta naves fenicias y ciento veinte de Chipre se unen a Alejandro en Sidón. Al final, según Arriano, murieron unos 8.000 tirios y 30.000 fueron vendidos; Diodoro dice que el asedio duró siete meses.'], 'Arriano II.16–24; Diodoro XVII.46'],
    gaza: [['Gaza', 'O comandante de Gaza (Bátis, segundo Cúrcio) não se rende. A cidade fica num monte alto, e os engenheiros dizem que as muralhas não podem ser tomadas à força.'], ['Gaza', 'The commander of Gaza (Batis, according to Curtius) will not surrender. The city stands on a high mound, and the engineers say the walls cannot be taken by force.'], ['Gaza', 'Il comandante di Gaza (Bati, secondo Curzio) non si arrende. La città sta su un’alta altura, e gli ingegneri dicono che le mura non si possono prendere con la forza.'], ['Gaza', 'El comandante de Gaza (Batis, según Curcio) no se rinde. La ciudad está en un montículo alto, y los ingenieros dicen que las murallas no pueden tomarse por la fuerza.'], 'Arriano II.25–27; Cúrcio IV.6'],
    egypt: [['O Egito se entrega', 'Mazaces, sátrapa persa do Egito, não tem tropas para resistir e recebe Alexandre como amigo. Pelúsio, Mênfis e a costa abrem as portas. Na costa, junto à ilha de Faros, Alexandre pode fundar uma cidade com o seu nome; no deserto, a oeste, fica o oráculo de Amon.'], ['Egypt gives itself up', 'Mazaces, the Persian satrap of Egypt, has no troops to resist and receives Alexander as a friend. Pelusium, Memphis and the coast open their gates. On the coast by the island of Pharos Alexander may found a city bearing his name; in the desert to the west lies the oracle of Ammon.'], ['L’Egitto si arrende', 'Mazace, satrapo persiano d’Egitto, non ha truppe per resistere e accoglie Alessandro da amico. Pelusio, Menfi e la costa aprono le porte. Sulla costa, vicino all’isola di Faro, Alessandro può fondare una città con il suo nome; nel deserto, a ovest, c’è l’oracolo di Ammone.'], ['Egipto se entrega', 'Mazaces, sátrapa persa de Egipto, no tiene tropas para resistir y recibe a Alejandro como amigo. Pelusio, Menfis y la costa abren sus puertas. En la costa, junto a la isla de Faros, Alejandro puede fundar una ciudad con su nombre; en el desierto, al oeste, está el oráculo de Amón.'], 'Arriano III.1–4'],
    darius331: [['O exército real em Babilônia', 'Dario reúne em Babilônia as tropas das satrapias do leste. Arriano fala em 40.000 cavaleiros, 1.000.000 de infantes, 200 carros com foices e cerca de quinze elefantes. Os persas escolhem uma planície aberta, onde os carros possam correr. No caminho para Persépolis, Ariobarzanes guarda as Portas Pérsicas.'], ['The royal army at Babylon', 'Darius gathers at Babylon the troops of the eastern satrapies. Arrian speaks of 40,000 cavalry, 1,000,000 infantry, 200 scythed chariots and about fifteen elephants. The Persians choose an open plain where the chariots can run. On the road to Persepolis, Ariobarzanes guards the Persian Gates.'], ['L’esercito reale a Babilonia', 'Dario raduna a Babilonia le truppe delle satrapie orientali. Arriano parla di 40.000 cavalieri, 1.000.000 di fanti, 200 carri falcati e circa quindici elefanti. I Persiani scelgono una pianura aperta, dove i carri possano correre. Sulla strada per Persepoli, Ariobarzane guarda le Porte Persiane.'], ['El ejército real en Babilonia', 'Darío reúne en Babilonia las tropas de las satrapías del este. Arriano habla de 40.000 jinetes, 1.000.000 de infantes, 200 carros falcados y unos quince elefantes. Los persas eligen una llanura abierta donde puedan correr los carros. En el camino a Persépolis, Ariobarzanes guarda las Puertas Persas.'], 'Arriano III.8, III.18'],
    campaign331: [['Primavera de 331', 'Tiro e Gaza caíram, o Egito é seu e a frota persa não tem mais portos. Alexandre está de volta a Tiro. Do outro lado do Eufrates e do Tigre, Dario reúne o exército real. Com Alexandre seguem 7.000 cavaleiros e cerca de 40.000 infantes.'], ['Spring 331', 'Tyre and Gaza have fallen, Egypt is yours and the Persian fleet has no ports left. Alexander is back at Tyre. Beyond the Euphrates and the Tigris, Darius is gathering the royal army. With Alexander march 7,000 cavalry and about 40,000 infantry.'], ['Primavera del 331', 'Tiro e Gaza sono cadute, l’Egitto è tuo e la flotta persiana non ha più porti. Alessandro è di nuovo a Tiro. Oltre l’Eufrate e il Tigri, Dario raduna l’esercito reale. Con Alessandro marciano 7.000 cavalieri e circa 40.000 fanti.'], ['Primavera de 331', 'Tiro y Gaza han caído, Egipto es tuyo y la flota persa ya no tiene puertos. Alejandro ha vuelto a Tiro. Al otro lado del Éufrates y del Tigris, Darío reúne el ejército real. Con Alejandro van 7.000 jinetes y unos 40.000 infantes.'], 'Arriano III.6, III.12'],
    eclipse: [['Eclipse da lua', 'Uma noite, a lua se apaga quase por inteiro. O adivinho Aristandro diz que é bom sinal: haverá batalha naquele mesmo mês, e as vítimas dos sacrifícios anunciam a vitória. A nota do tradutor de Arriano data o eclipse de 20 de setembro de 331 a.C. +1 Lealdade.'], ['Eclipse of the moon', 'One night the moon goes almost completely dark. The seer Aristander says it is a good sign: there will be a battle that very month, and the sacrificial victims foretell victory. The note in Arrian’s translation dates the eclipse to 20 September 331 BC. +1 Loyalty.'], ['Eclissi di luna', 'Una notte la luna si oscura quasi del tutto. L’indovino Aristandro dice che è un buon segno: ci sarà battaglia in quello stesso mese, e le vittime dei sacrifici annunciano la vittoria. La nota del traduttore di Arriano data l’eclissi al 20 settembre 331 a.C. +1 Lealtà.'], ['Eclipse de luna', 'Una noche la luna se apaga casi por completo. El adivino Aristandro dice que es buena señal: habrá batalla ese mismo mes, y las víctimas de los sacrificios anuncian la victoria. La nota del traductor de Arriano fecha el eclipse el 20 de septiembre de 331 a. C. +1 Lealtad.'], 'Arriano III.7'],
    bessos: [['A morte de Dario', 'Na fuga, Dario é preso por Besso, sátrapa da Báctria, Nabarzanes e Barsaentes. Quando os macedônios se aproximam, Nabarzanes e Barsaentes o ferem e o deixam; ele morre pouco depois. Besso foge para a Báctria e se põe à frente da resistência.'], ['The death of Darius', 'In flight, Darius is seized by Bessus, satrap of Bactria, Nabarzanes and Barsaentes. As the Macedonians close in, Nabarzanes and Barsaentes wound him and leave him; he dies soon after. Bessus flees to Bactria and puts himself at the head of the resistance.'], ['La morte di Dario', 'Nella fuga Dario viene catturato da Besso, satrapo della Battriana, da Nabarzane e da Barsaente. Quando i Macedoni si avvicinano, Nabarzane e Barsaente lo feriscono e lo abbandonano; muore poco dopo. Besso fugge in Battriana e si mette a capo della resistenza.'], ['La muerte de Darío', 'En la huida, Darío es apresado por Beso, sátrapa de Bactriana, Nabarzanes y Barsaentes. Cuando los macedonios se acercan, Nabarzanes y Barsaentes lo hieren y lo abandonan; muere poco después. Beso huye a Bactriana y se pone al frente de la resistencia.'], 'Arriano III.21; Diodoro XVII.73'],
    satibarzanes: [['A revolta de Satibarzanes', 'Satibarzanes, sátrapa da Ária, se submeteu, mas agora mata Anaxipo e os lanceiros a cavalo que estavam com ele, arma os árias e os reúne em Artacoana.'], ['The revolt of Satibarzanes', 'Satibarzanes, satrap of Aria, had submitted, but now he kills Anaxippus and the horse-lancers with him, arms the Arians and gathers them at Artacoana.'], ['La rivolta di Satibarzane', 'Satibarzane, satrapo dell’Aria, si era sottomesso, ma ora uccide Anassippo e i lancieri a cavallo che erano con lui, arma gli Arii e li raduna ad Artacoana.'], ['La revuelta de Satibarzanes', 'Satibarzanes, sátrapa de Aria, se había sometido, pero ahora mata a Anaxipo y a los lanceros a caballo que iban con él, arma a los arios y los reúne en Artacoana.'], 'Arriano III.25'],
    spitamenes: [['A revolta da Sogdiana', 'Besso foi capturado, mas a Sogdiana se levanta: os bárbaros prendem e matam os soldados macedônios que guardavam as cidades. Espitâmenes cerca a cidadela de Marakanda; do outro lado do Iaxartes estão os citas. Espitâmenes não aceita batalha: ataca e some na estepe. Na história, Farnuces o perseguiu e, segundo Arriano, só 40 cavaleiros e 300 infantes escaparam; Cúrcio fala em 2.000 infantes e 300 cavaleiros mortos.'], ['The revolt of Sogdiana', 'Bessus has been captured, but Sogdiana rises: the barbarians seize and kill the Macedonian soldiers garrisoning the towns. Spitamenes besieges the citadel of Maracanda; across the Iaxartes are the Scythians. Spitamenes refuses battle: he strikes and vanishes into the steppe. In history Pharnuches pursued him and, according to Arrian, only 40 horsemen and 300 foot escaped; Curtius speaks of 2,000 foot and 300 horse killed.'], ['La rivolta della Sogdiana', 'Besso è stato catturato, ma la Sogdiana insorge: i barbari catturano e uccidono i soldati macedoni di guarnigione nelle città. Spitamene assedia la cittadella di Maracanda; oltre lo Iassarte ci sono gli Sciti. Spitamene non accetta battaglia: colpisce e sparisce nella steppa. Nella storia Farnuche lo inseguì e, secondo Arriano, si salvarono solo 40 cavalieri e 300 fanti; Curzio parla di 2.000 fanti e 300 cavalieri uccisi.'], ['La revuelta de Sogdiana', 'Beso fue capturado, pero Sogdiana se levanta: los bárbaros apresan y matan a los soldados macedonios que guardaban las ciudades. Espitamenes asedia la ciudadela de Maracanda; al otro lado del Iaxartes están los escitas. Espitamenes no acepta batalla: ataca y desaparece en la estepa. En la historia, Farnuces lo persiguió y, según Arriano, solo escaparon 40 jinetes y 300 infantes; Curcio habla de 2.000 infantes y 300 jinetes muertos.'], 'Arriano III.30, IV.1–6; Cúrcio VII.7'],
    petra: [['A Rocha Sogdiana', 'Os sogdianos se refugiam numa rocha a pique, com víveres para um longo cerco, e zombam: só soldados com asas a tomariam. Alexandre oferece prêmios a quem subir. Trezentos homens treinados em escalar sobem à noite com pequenos cravos de ferro e cordas de linho; trinta morrem na subida.'], ['The Sogdian Rock', 'The Sogdians take refuge on a sheer rock, with food for a long siege, and jeer that only soldiers with wings could take it. Alexander offers rewards to whoever climbs it. Three hundred men practised in climbing go up at night with small iron pegs and ropes of flax; thirty die on the way.'], ['La Rocca Sogdiana', 'I Sogdiani si rifugiano su una rupe a picco, con viveri per un lungo assedio, e deridono: solo soldati con le ali la prenderebbero. Alessandro offre premi a chi salirà. Trecento uomini esperti di scalate salgono di notte con piccoli chiodi di ferro e corde di lino; trenta muoiono nella salita.'], ['La Roca Sogdiana', 'Los sogdianos se refugian en una roca a pico, con víveres para un largo asedio, y se burlan: solo soldados con alas la tomarían. Alejandro ofrece premios a quien suba. Trescientos hombres entrenados en escalar suben de noche con pequeños clavos de hierro y cuerdas de lino; treinta mueren en la subida.'], 'Arriano IV.18–19'],
    india: [['A Índia', 'Táxiles, rei de Taxila, oferece aliança. No vale do Swat, os assacenos defendem Massaga; os fugitivos se refugiam em Aornos, uma rocha de cerca de 200 estádios de circuito. No Indo, Heféstion já fez uma ponte; para cruzar os rios do Punjab, o exército precisa de outras.'], ['India', 'Taxiles, king of Taxila, offers an alliance. In the Swat valley the Assacenians defend Massaga; the fugitives take refuge on Aornos, a rock some 200 stades round. On the Indus Hephaestion has already built a bridge; to cross the rivers of the Punjab the army needs more.'], ['L’India', 'Tassile, re di Taxila, offre alleanza. Nella valle dello Swat gli Assaceni difendono Massaga; i fuggiaschi si rifugiano su Aorno, una rupe di circa 200 stadi di giro. Sull’Indo Efestione ha già fatto un ponte; per attraversare i fiumi del Punjab l’esercito ne ha bisogno di altri.'], ['La India', 'Taxiles, rey de Taxila, ofrece alianza. En el valle del Swat, los asacenos defienden Massaga; los fugitivos se refugian en Aornos, una roca de unos 200 estadios de perímetro. En el Indo, Hefestión ya hizo un puente; para cruzar los ríos del Punjab, el ejército necesita otros.'], 'Arriano IV.22–30, V.3'],
    poros: [['Poro no Hidaspes', 'Poro espera do outro lado do Hidaspes com 4.000 cavaleiros, 300 carros, 200 elefantes e 30.000 infantes escolhidos. Os cavalos não suportam o cheiro e o barulho dos elefantes. Construa uma ponte em Taxila e atravesse o rio.'], ['Porus on the Hydaspes', 'Porus waits across the Hydaspes with 4,000 horsemen, 300 chariots, 200 elephants and 30,000 picked infantry. The horses cannot bear the smell and noise of the elephants. Build a bridge at Taxila and cross the river.'], ['Poro sull’Idaspe', 'Poro aspetta oltre l’Idaspe con 4.000 cavalieri, 300 carri, 200 elefanti e 30.000 fanti scelti. I cavalli non sopportano l’odore e il rumore degli elefanti. Costruisci un ponte a Taxila e attraversa il fiume.'], ['Poro en el Hidaspes', 'Poro espera al otro lado del Hidaspes con 4.000 jinetes, 300 carros, 200 elefantes y 30.000 infantes escogidos. Los caballos no soportan el olor y el ruido de los elefantes. Construye un puente en Taxila y cruza el río.'], 'Arriano V.9–15'],
    sangala: [['Sangala', 'Além do Hidraotes, os catéus se preparam para a guerra na cidade de Sangala, sobre um monte, cercada por uma tripla paliçada de carros.'], ['Sangala', 'Beyond the Hydraotes the Cathaeans prepare for war in the city of Sangala, on a hill, surrounded by a triple palisade of wagons.'], ['Sangala', 'Oltre l’Idraote i Catei si preparano alla guerra nella città di Sangala, su un colle, circondata da una triplice palizzata di carri.'], ['Sangala', 'Más allá del Hidraotes, los cateos se preparan para la guerra en la ciudad de Sangala, sobre un cerro, rodeada por una triple empalizada de carros.'], 'Arriano V.22–24'],
    hyphasis: [['O motim do Hífase', 'No Hífase, o exército não quer seguir. Alexandre fala às tropas; Ceno, filho de Polemócrates, toma coragem e responde por elas: os homens estão cansados e querem voltar. Alexandre decide retornar e manda erguer altares na margem.'], ['The mutiny at the Hyphasis', 'At the Hyphasis the army will go no further. Alexander addresses the troops; Coenus son of Polemocrates plucks up courage and answers for them: the men are worn out and want to go home. Alexander decides to turn back and has altars raised on the bank.'], ['L’ammutinamento dell’Ifasi', 'All’Ifasi l’esercito non vuole proseguire. Alessandro parla alle truppe; Ceno, figlio di Polemocrate, prende coraggio e risponde per loro: gli uomini sono stanchi e vogliono tornare. Alessandro decide di tornare indietro e fa erigere altari sulla riva.'], ['El motín del Hífasis', 'En el Hífasis, el ejército no quiere seguir. Alejandro habla a las tropas; Ceno, hijo de Polemócrates, se arma de valor y responde por ellas: los hombres están agotados y quieren volver. Alejandro decide regresar y manda levantar altares en la orilla.'], 'Arriano V.25–29'],
    malloi: [['Os malos', 'Na descida para o Oceano, os malos resistem nas suas cidades. Na história, Alexandre saltou sozinho dentro de uma muralha e foi atingido por uma flecha que atravessou a couraça e entrou no peito.'], ['The Malli', 'On the way down to the Ocean the Malli resist in their towns. In history Alexander leapt alone inside a wall and was struck by an arrow that went through his breastplate into his chest.'], ['I Malli', 'Nella discesa verso l’Oceano i Malli resistono nelle loro città. Nella storia Alessandro saltò da solo dentro un muro e fu colpito da una freccia che attraversò la corazza e gli entrò nel petto.'], ['Los malios', 'En el descenso hacia el Océano, los malios resisten en sus ciudades. En la historia, Alejandro saltó solo dentro de una muralla y fue alcanzado por una flecha que atravesó la coraza y le entró en el pecho.'], 'Arriano VI.6–11'],

  const RULES = {
    pt: `<p>Você comanda Alexandre e seus generais. O ano tem três estações de campanha (primavera, verão e outono) e um inverno nos quartéis. Os inimigos agem pelas regras do jogo e pelos dados, seguindo o calendário dos relatos antigos.</p>
<h3>Estação</h3><ol><li><b>Týche:</b> um dado decide estradas ruins, comboios de víveres, guias ou bons presságios.</li><li><b>Comando:</b> cada exército rola um dado. Alexandre recebe 3 + metade do dado (arredondada para cima); um general, 1 + metade. A rapidez das marchas de Alexandre conta a favor dele.</li><li><b>Ordens:</b> marchar custa o número da estrada (montanhas custam 2 ou 3). O Helesponto se atravessa sem risco. Navegar exige portos e pode trazer tempestades e, até a queda de Tiro, a frota persa. Os grandes rios (Eufrates, Oxo, Iaxartes, Indo, Hidaspes) só se atravessam depois de construir uma ponte numa das margens. O deserto custa víveres e homens, sobretudo o da Gedrósia; o Oceano, de Pátala a Harmózia, só com frota. Entrar onde há um exército inimigo em campo abre a batalha.</li><li><b>Inimigos:</b> exércitos de campo atacam quando se acham mais fortes; guarnições ficam atrás das muralhas; Dario e Besso evitam batalhas desiguais; Espitâmenes arma emboscadas e ataca destacamentos pequenos, e um exército acampado pode ter de escolher entre ficar ou persegui-lo. Dario recebe reforços enquanto está na Mesopotâmia.</li><li><b>Víveres:</b> no fim da estação, quem está em terra macedônica, aliada ou submetida se abastece; fora dela perde 1. Com 0, os homens desertam ou morrem de fome. Na Sogdiana revoltada, buscar víveres fica mais difícil.</li></ol>
<h3>Unidades</h3><p>Cada unidade tem 10 companhias e um número de homens: os hipaspistas, 3.000; cada grupo de falange, 4.500; os aliados gregos, 7.000. O exército inicial segue Diodoro: 12.000 macedônios, 7.000 aliados, 5.000 mercenários, 7.000 trácios e ilírios, 1.000 agrianos e arqueiros. A cavalaria conta em milhares.</p>
<h3>Batalha</h3><p>Cada 480 homens valem 1 ponto (veteranos 1,35; elite 1,7); mil cavaleiros macedônios valem 1. Mil guerreiros inimigos valem 0,6 vezes a qualidade deles; mil hoplitas mercenários valem 2. Cada lado rola um dado para cada 7 pontos, mais os modificadores de terreno, muralhas, acampamento, cavalaria, carros, elefantes e Alexandre. Tropas veteranas acertam com 4 a 6; novatos e a maioria dos inimigos, com 5 ou 6. Cada acerto tira 3 pontos. Depois de cada rodada, quem sofreu mais rola 2d6 de moral: acima do valor, foge e sofre a perseguição da cavalaria. São no máximo três rodadas. Se o exército de Alexandre foge, ele pode morrer: 1 em 12.</p>
<h3>Cercos</h3><p>Inimigos dentro de muralhas precisam ser cercados: cada ordem de cerco soma um dado mais metade das unidades (e 2 com Alexandre). Quando o cerco chega a 6 vezes a fortificação, a cidade cai. A cada estação os sitiados comem os víveres; sem víveres, rendem-se. Tiro, na ilha, só pode ser cercada por um exército com frota: reúna os navios num porto amigo, como Sídon.</p>
<h3>Cidades e façanhas</h3><p>Alexandre pode fundar cidades em Faros (Alexandria), Ária, Aracósia, no Cáucaso, no Iaxartes e no Hidaspes: a cidade vira aliada e rende Glória. Ílion, o nó de Górdio, o oráculo de Amon, a travessia do Iaxartes, o Hífase e o Oceano dão Glória. Os tesouros de Susa e Persépolis dão Lealdade.</p>
<h3>Inverno</h3><p>Exércitos em território amigo recuperam companhias; fora dele, perdem. Unidades que venceram podem virar veteranas. Gaste Lealdade para completar unidades ou receber reforços. Regiões submetidas podem se revoltar, sobretudo na Báctria e na Sogdiana em 329 e 328 a.C. Se a Lealdade cair abaixo de −3, o exército se amotina e a campanha termina.</p>
<h3>Vitória</h3><p>Glória vem de batalhas, cidades tomadas, regiões submetidas, cidades fundadas e façanhas. Cada cenário tem um objetivo histórico. Alexandre morto ou sem tropas encerra o jogo.</p>
<h3>Fontes e realismo</h3><p>Datas, chefes, exércitos e números vêm de Arriano, <i>Anábase de Alexandre</i> (tradução de E. J. Chinnock, 1884), de Diodoro Sículo, livro XVII, de Plutarco, <i>Alexandre</i>, e, onde dito, de Quinto Cúrcio. Os autores antigos divergem muito sobre os exércitos persas (em Gaugamela, Arriano fala em um milhão de infantes); o jogo usa forças persas bem menores, para que a partida seja jogável, e diz no texto de cada evento o que cada autor conta. Em Diodoro, as parcelas da cavalaria somam 5.100, mas o total dado é 4.500; o jogo usa as parcelas. Arriano dá os sobreviventes do Politimeto, Cúrcio dá os mortos. Algumas localizações são incertas: Tápsaco, a Rocha Sogdiana, Massaga, Sangala, a cidade dos malos e Pátala estão em posições aproximadas. O mapa usa o relevo, os rios, os lagos e os litorais do Natural Earth (domínio público); os litorais e rios são os de hoje, e o golfo Pérsico, o delta do Indo e o mar de Aral eram diferentes. A escala usa o estádio ático de cerca de 185 m; o estádio variava de lugar para lugar. As regras de combate são um modelo de jogo, não uma reconstrução militar.</p>`,
    en: `<p>You command Alexander and his generals. Each year has three campaign seasons (spring, summer and autumn) and a winter in quarters. The enemies act by the game rules and the dice, following the calendar of the ancient accounts.</p>
<h3>Season</h3><ol><li><b>Tyche:</b> one die decides bad roads, supply convoys, guides or good omens.</li><li><b>Command:</b> each army rolls a die. Alexander gets 3 + half the die (rounded up); a general, 1 + half. The speed of Alexander’s marches counts in his favour.</li><li><b>Orders:</b> marching costs the number on the road (mountains cost 2 or 3). The Hellespont can be crossed safely. Sailing needs ports and may bring storms and, until Tyre falls, the Persian fleet. The great rivers (Euphrates, Oxus, Iaxartes, Indus, Hydaspes) can only be crossed after building a bridge on one bank. The desert costs supplies and men, above all in Gedrosia; the Ocean, from Patala to Harmozeia, needs a fleet. Entering a place with an enemy army in the field starts a battle.</li><li><b>Enemies:</b> field armies attack when they think they are stronger; garrisons stay behind their walls; Darius and Bessus avoid uneven battles; Spitamenes lays ambushes and attacks small detachments, and a camped army may have to choose between staying put and pursuing him. Darius receives levies while he is in Mesopotamia.</li><li><b>Supplies:</b> at the end of the season, armies in Macedonian, allied or subdued land are resupplied; elsewhere they lose 1. At 0, men desert or starve. In rebel Sogdiana foraging is harder.</li></ol>
<h3>Units</h3><p>Each unit has 10 companies and a number of men: the hypaspists 3,000; each group of the phalanx 4,500; the Greek allies 7,000. The starting army follows Diodorus: 12,000 Macedonians, 7,000 allies, 5,000 mercenaries, 7,000 Thracians and Illyrians, 1,000 Agrianians and archers. Cavalry counts in thousands.</p>
<h3>Battle</h3><p>Every 480 men are worth 1 point (veterans 1.35, elite 1.7); a thousand Macedonian horsemen are worth 1. A thousand enemy warriors are worth 0.6 times their quality; a thousand mercenary hoplites are worth 2. Each side rolls one die per 7 points, plus modifiers for terrain, walls, camp, cavalry, chariots, elephants and Alexander. Veteran troops hit on 4 to 6; raw troops and most enemies on 5 or 6. Each hit removes 3 points. After each round, the side that suffered more rolls 2d6 for morale: above the value, it flees and suffers the cavalry pursuit. There are at most three rounds. If Alexander’s army flees he may die: 1 in 12.</p>
<h3>Sieges</h3><p>Enemies behind walls must be besieged: each siege order adds a die plus half the units (and 2 with Alexander). When the siege reaches 6 times the fortification, the city falls. Each season the besieged eat their food; without food, they surrender. Tyre, on its island, can only be besieged by an army with a fleet: gather the ships in a friendly port such as Sidon.</p>
<h3>Cities and feats</h3><p>Alexander may found cities at Pharos (Alexandria), in Aria, Arachosia, the Caucasus, on the Iaxartes and on the Hydaspes: the city becomes allied and brings Glory. Ilium, the Gordian knot, the oracle of Ammon, the crossing of the Iaxartes, the Hyphasis and the Ocean bring Glory. The treasuries of Susa and Persepolis bring Loyalty.</p>
<h3>Winter</h3><p>Armies in friendly land recover companies; elsewhere they lose them. Victorious units may become veterans. Spend Loyalty to bring units up to strength or receive reinforcements. Subdued regions may revolt, above all Bactria and Sogdiana in 329 and 328 BC. If Loyalty falls below −3 the army mutinies and the campaign ends.</p>
<h3>Victory</h3><p>Glory comes from battles, captured cities, subdued regions, founded cities and feats. Each scenario has a historical goal. Alexander dead or without troops ends the game.</p>
<h3>Sources and realism</h3><p>Dates, leaders, armies and numbers come from Arrian, <i>Anabasis of Alexander</i> (translated by E. J. Chinnock, 1884), Diodorus Siculus book XVII, Plutarch’s <i>Alexander</i> and, where stated, Quintus Curtius. The ancient authors disagree widely about the Persian armies (at Gaugamela Arrian speaks of a million infantry); the game uses much smaller Persian forces so that it stays playable, and each event text says what each author reports. In Diodorus the cavalry contingents add up to 5,100, but the stated total is 4,500; the game uses the contingents. Arrian gives the survivors of the Polytimetus, Curtius the dead. Some locations are uncertain: Thapsacus, the Sogdian Rock, Massaga, Sangala, the town of the Malli and Patala are placed approximately. The map uses the relief, rivers, lakes and coastlines of Natural Earth (public domain); coasts and rivers are today’s, and the Persian Gulf, the Indus delta and the Aral Sea were different. The scale uses the Attic stade of about 185 m; the stade varied from place to place. The combat rules are a game model, not a military reconstruction.</p>`,
    it: `<p>Comandi Alessandro e i suoi generali. Ogni anno ha tre stagioni di campagna (primavera, estate e autunno) e un inverno nei quartieri. I nemici agiscono secondo le regole del gioco e i dadi, seguendo il calendario dei racconti antichi.</p>
<h3>Stagione</h3><ol><li><b>Tyche:</b> un dado decide strade cattive, convogli di viveri, guide o buoni presagi.</li><li><b>Comando:</b> ogni esercito tira un dado. Alessandro riceve 3 + metà del dado (arrotondata per eccesso); un generale, 1 + metà. La rapidità delle marce di Alessandro conta a suo favore.</li><li><b>Ordini:</b> marciare costa il numero della strada (le montagne costano 2 o 3). L’Ellesponto si attraversa senza rischi. Navigare richiede porti e può portare tempeste e, fino alla caduta di Tiro, la flotta persiana. I grandi fiumi (Eufrate, Osso, Iassarte, Indo, Idaspe) si attraversano solo dopo aver costruito un ponte su una delle rive. Il deserto costa viveri e uomini, soprattutto quello della Gedrosia; l’Oceano, da Patala ad Armozia, solo con una flotta. Entrare dove c’è un esercito nemico in campo apre la battaglia.</li><li><b>Nemici:</b> gli eserciti in campo attaccano quando si credono più forti; le guarnigioni restano dietro le mura; Dario e Besso evitano battaglie impari; Spitamene tende imboscate e attacca i piccoli distaccamenti, e un esercito accampato può dover scegliere tra restare o inseguirlo. Dario riceve leve finché è in Mesopotamia.</li><li><b>Viveri:</b> alla fine della stagione, chi è in terra macedone, alleata o sottomessa si rifornisce; altrove perde 1. A 0, gli uomini disertano o muoiono di fame. Nella Sogdiana ribelle cercare viveri è più difficile.</li></ol>
<h3>Unità</h3><p>Ogni unità ha 10 compagnie e un numero di uomini: gli ipaspisti 3.000; ogni gruppo della falange 4.500; gli alleati greci 7.000. L’esercito iniziale segue Diodoro: 12.000 Macedoni, 7.000 alleati, 5.000 mercenari, 7.000 Traci e Illiri, 1.000 Agriani e arcieri. La cavalleria si conta in migliaia.</p>
<h3>Battaglia</h3><p>Ogni 480 uomini valgono 1 punto (veterani 1,35; élite 1,7); mille cavalieri macedoni valgono 1. Mille guerrieri nemici valgono 0,6 volte la loro qualità; mille opliti mercenari valgono 2. Ogni parte tira un dado ogni 7 punti, più i modificatori di terreno, mura, campo, cavalleria, carri, elefanti e Alessandro. Le truppe veterane colpiscono con 4–6; i novizi e la maggior parte dei nemici con 5 o 6. Ogni colpo toglie 3 punti. Dopo ogni turno, chi ha sofferto di più tira 2d6 per il morale: sopra il valore, fugge e subisce l’inseguimento della cavalleria. I turni sono al massimo tre. Se l’esercito di Alessandro fugge, lui può morire: 1 su 12.</p>
<h3>Assedi</h3><p>I nemici dietro le mura vanno assediati: ogni ordine d’assedio aggiunge un dado più metà delle unità (e 2 con Alessandro). Quando l’assedio arriva a 6 volte la fortificazione, la città cade. A ogni stagione gli assediati consumano i viveri; senza viveri si arrendono. Tiro, sull’isola, si può assediare solo con una flotta: riunisci le navi in un porto amico, come Sidone.</p>
<h3>Città e imprese</h3><p>Alessandro può fondare città a Faro (Alessandria), in Aria, in Aracosia, nel Caucaso, sullo Iassarte e sull’Idaspe: la città diventa alleata e dà Gloria. Ilio, il nodo di Gordio, l’oracolo di Ammone, il passaggio dello Iassarte, l’Ifasi e l’Oceano danno Gloria. I tesori di Susa e Persepoli danno Lealtà.</p>
<h3>Inverno</h3><p>Gli eserciti in terra amica recuperano compagnie; altrove le perdono. Le unità vittoriose possono diventare veterane. Spendi Lealtà per completare le unità o ricevere rinforzi. Le regioni sottomesse possono ribellarsi, soprattutto la Battriana e la Sogdiana nel 329 e nel 328 a.C. Se la Lealtà scende sotto −3, l’esercito si ammutina e la campagna finisce.</p>
<h3>Vittoria</h3><p>La Gloria viene da battaglie, città prese, regioni sottomesse, città fondate e imprese. Ogni scenario ha un obiettivo storico. Alessandro morto o senza truppe chiude la partita.</p>
<h3>Fonti e realismo</h3><p>Date, capi, eserciti e numeri vengono da Arriano, <i>Anabasi di Alessandro</i> (traduzione di E. J. Chinnock, 1884), da Diodoro Siculo, libro XVII, da Plutarco, <i>Alessandro</i>, e, dove indicato, da Quinto Curzio. Gli autori antichi divergono molto sugli eserciti persiani (a Gaugamela Arriano parla di un milione di fanti); il gioco usa forze persiane molto minori, perché la partita resti giocabile, e il testo di ogni evento dice che cosa racconta ciascun autore. In Diodoro i contingenti di cavalleria sommano 5.100, ma il totale indicato è 4.500; il gioco usa i contingenti. Arriano dà i sopravvissuti del Politimeto, Curzio i morti. Alcune posizioni sono incerte: Tapsaco, la Rocca Sogdiana, Massaga, Sangala, la città dei Malli e Patala sono collocate in modo approssimativo. La mappa usa il rilievo, i fiumi, i laghi e le coste di Natural Earth (pubblico dominio); coste e fiumi sono quelli di oggi, e il Golfo Persico, il delta dell’Indo e il lago d’Aral erano diversi. La scala usa lo stadio attico di circa 185 m; lo stadio variava da luogo a luogo. Le regole di combattimento sono un modello di gioco, non una ricostruzione militare.</p>`,
    es: `<p>Mandas a Alejandro y a sus generales. Cada año tiene tres estaciones de campaña (primavera, verano y otoño) y un invierno en los cuarteles. Los enemigos actúan según las reglas del juego y los dados, siguiendo el calendario de los relatos antiguos.</p>
<h3>Estación</h3><ol><li><b>Tyche:</b> un dado decide malos caminos, convoyes de víveres, guías o buenos presagios.</li><li><b>Mando:</b> cada ejército tira un dado. Alejandro recibe 3 + la mitad del dado (redondeada hacia arriba); un general, 1 + la mitad. La rapidez de las marchas de Alejandro cuenta a su favor.</li><li><b>Órdenes:</b> marchar cuesta el número del camino (las montañas cuestan 2 o 3). El Helesponto se cruza sin riesgo. Navegar exige puertos y puede traer tormentas y, hasta la caída de Tiro, la flota persa. Los grandes ríos (Éufrates, Oxo, Iaxartes, Indo, Hidaspes) solo se cruzan después de construir un puente en una de las orillas. El desierto cuesta víveres y hombres, sobre todo el de Gedrosia; el Océano, de Patala a Harmozia, solo con flota. Entrar donde hay un ejército enemigo en campo abre la batalla.</li><li><b>Enemigos:</b> los ejércitos en campo atacan cuando se creen más fuertes; las guarniciones se quedan tras las murallas; Darío y Beso evitan batallas desiguales; Espitamenes tiende emboscadas y ataca destacamentos pequeños, y un ejército acampado puede tener que elegir entre quedarse o perseguirlo. Darío recibe levas mientras está en Mesopotamia.</li><li><b>Víveres:</b> al final de la estación, quien está en tierra macedonia, aliada o sometida se abastece; fuera de ella pierde 1. Con 0, los hombres desertan o mueren de hambre. En la Sogdiana sublevada, buscar víveres es más difícil.</li></ol>
<h3>Unidades</h3><p>Cada unidad tiene 10 compañías y un número de hombres: los hipaspistas, 3.000; cada grupo de la falange, 4.500; los aliados griegos, 7.000. El ejército inicial sigue a Diodoro: 12.000 macedonios, 7.000 aliados, 5.000 mercenarios, 7.000 tracios e ilirios, 1.000 agrianos y arqueros. La caballería se cuenta en miles.</p>
<h3>Batalla</h3><p>Cada 480 hombres valen 1 punto (veteranos 1,35; élite 1,7); mil jinetes macedonios valen 1. Mil guerreros enemigos valen 0,6 veces su calidad; mil hoplitas mercenarios valen 2. Cada bando tira un dado por cada 7 puntos, más los modificadores de terreno, murallas, campamento, caballería, carros, elefantes y Alejandro. Las tropas veteranas aciertan con 4 a 6; los novatos y la mayoría de los enemigos, con 5 o 6. Cada acierto quita 3 puntos. Tras cada ronda, quien sufrió más tira 2d6 de moral: por encima del valor, huye y sufre la persecución de la caballería. Son tres rondas como máximo. Si el ejército de Alejandro huye, él puede morir: 1 de cada 12.</p>
<h3>Asedios</h3><p>Los enemigos tras murallas deben ser asediados: cada orden de asedio suma un dado más la mitad de las unidades (y 2 con Alejandro). Cuando el asedio llega a 6 veces la fortificación, la ciudad cae. Cada estación los sitiados consumen sus víveres; sin víveres, se rinden. Tiro, en su isla, solo puede asediarse con un ejército con flota: reúne las naves en un puerto amigo, como Sidón.</p>
<h3>Ciudades y hazañas</h3><p>Alejandro puede fundar ciudades en Faros (Alejandría), en Aria, Aracosia, el Cáucaso, el Iaxartes y el Hidaspes: la ciudad se vuelve aliada y da Gloria. Ilión, el nudo de Gordio, el oráculo de Amón, el cruce del Iaxartes, el Hífasis y el Océano dan Gloria. Los tesoros de Susa y Persépolis dan Lealtad.</p>
<h3>Invierno</h3><p>Los ejércitos en territorio amigo recuperan compañías; fuera de él, las pierden. Las unidades vencedoras pueden volverse veteranas. Gasta Lealtad para completar unidades o recibir refuerzos. Las regiones sometidas pueden rebelarse, sobre todo Bactriana y Sogdiana en 329 y 328 a. C. Si la Lealtad cae por debajo de −3, el ejército se amotina y la campaña termina.</p>
<h3>Victoria</h3><p>La Gloria viene de batallas, ciudades tomadas, regiones sometidas, ciudades fundadas y hazañas. Cada escenario tiene un objetivo histórico. Alejandro muerto o sin tropas termina el juego.</p>
<h3>Fuentes y realismo</h3><p>Fechas, jefes, ejércitos y cifras vienen de Arriano, <i>Anábasis de Alejandro</i> (traducción de E. J. Chinnock, 1884), de Diodoro Sículo, libro XVII, de Plutarco, <i>Alejandro</i>, y, donde se indica, de Quinto Curcio. Los autores antiguos discrepan mucho sobre los ejércitos persas (en Gaugamela, Arriano habla de un millón de infantes); el juego usa fuerzas persas mucho menores, para que la partida sea jugable, y el texto de cada evento dice qué cuenta cada autor. En Diodoro, los contingentes de caballería suman 5.100, pero el total que da es 4.500; el juego usa los contingentes. Arriano da los supervivientes del Politimeto; Curcio, los muertos. Algunas ubicaciones son inciertas: Tápsaco, la Roca Sogdiana, Massaga, Sangala, la ciudad de los malios y Patala están en posiciones aproximadas. El mapa usa el relieve, los ríos, los lagos y las costas de Natural Earth (dominio público); las costas y los ríos son los de hoy, y el golfo Pérsico, el delta del Indo y el mar de Aral eran distintos. La escala usa el estadio ático de unos 185 m; el estadio variaba de un lugar a otro. Las reglas de combate son un modelo de juego, no una reconstrucción militar.</p>`,

  // ---------------------------------------------------------------- ordens romanas

  // ---------------------------------------------------------------- batalha

    let rv = rVal(a), ev = eVal(e);

  function freeNeighbors(id, forEnemy) {

  // zoom e arraste
  let panMoved = false, drag = null;
  function setVB() { svg.setAttribute('viewBox', vb.join(' ')); const k = clamp(vb[2] / W, 0.25, 1.1); svg.style.setProperty('--k', k.toFixed(3)); ['waves', 'hatchM', 'hatchD'].forEach((id) => { const p = document.getElementById(id); if (p) p.setAttribute('patternTransform', `scale(${Math.max(0.6, k)})`); }); const ns = clamp(vb[2] / W * 1.35, 0.42, 1.15); Object.values(NODES).forEach((n) => { const g = nodeEls[n.id]; if (g) g.setAttribute('transform', `translate(${n.x} ${n.y}) scale(${ns})`); }); updateScale(); }
  // escala: 1 estádio ático ≈ 185 m; nesta projeção, 1 grau de latitude (111 km) = 19 unidades
  function updateScale() {
    const r = svg.getBoundingClientRect(); if (!r.width) return;
    const s = Math.min(r.width / vb[2], r.height / vb[3]);
    const unitsPerMile = 19 * 0.185 / 111;
    let miles = 100; const steps = [100, 250, 500, 1000, 2000, 4000];
    for (const m of steps) { if (m * unitsPerMile * s <= 140) miles = m; }
    document.getElementById('scaleBar').style.width = Math.round(miles * unitsPerMile * s) + 'px';
    document.getElementById('scaleTxt').textContent = miles + ' stadia';
  }
  function zoom(f, cx, cy) {
    const nw = clamp(vb[2] * f, 160, W * 1.1), nh = nw * H / W;
    if (cx == null) { cx = vb[0] + vb[2] / 2; cy = vb[1] + vb[3] / 2; }
    vb = [cx - (cx - vb[0]) * nw / vb[2], cy - (cy - vb[1]) * nh / vb[3], nw, nh];
    if (G) renderMap(); else setVB();
  }
  function svgPoint(ev) { const r = svg.getBoundingClientRect(); const s = Math.max(vb[2] / r.width, vb[3] / r.height); const ox = (r.width * s - vb[2]) / 2, oy = (r.height * s - vb[3]) / 2; return [vb[0] - ox + (ev.clientX - r.left) * s, vb[1] - oy + (ev.clientY - r.top) * s, s]; }
  svg.addEventListener('wheel', (ev) => { ev.preventDefault(); const [x, y] = svgPoint(ev); zoom(ev.deltaY > 0 ? 1.15 : 1 / 1.15, x, y); }, { passive: false });
  svg.addEventListener('pointerdown', (ev) => { drag = { x: ev.clientX, y: ev.clientY, vb: vb.slice(), s: svgPoint(ev)[2] }; panMoved = false; });
  window.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) panMoved = true;
    if (panMoved) { vb = [drag.vb[0] - dx * drag.s, drag.vb[1] - dy * drag.s, vb[2], vb[3]]; setVB(); }
  });
  window.addEventListener('pointerup', () => { drag = null; setTimeout(() => { panMoved = false; }, 0); });
  $('zIn').addEventListener('click', () => zoom(1 / 1.3));
  $('zOut').addEventListener('click', () => zoom(1.3));
  $('zFit').addEventListener('click', () => { vb = SCEN[G.scen].view.slice(); vb[3] = vb[2] * H / W; setVB(); });

  async function afterAction() { renderAll(); await flush(); saveGame(); renderAll(); if (G.over) showEnd(); }

  // ---------------------------------------------------------------- dados e diálogos
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const DCLS = { red: 'red', grn: 'grn', pur: 'pur', gold: '', blue: '' };
  function dieHTML(v, c, extra) { return `<span class="die ${DCLS[c] || ''} ${extra || ''}" role="img" aria-label="${v}">${Array.from({ length: 9 }, (_, i) => `<i style="visibility:${PIPS[v].includes(i) ? 'visible' : 'hidden'}"></i>`).join('')}</span>`; }
  function openDialog(d) { return new Promise((res) => { const onClose = () => { d.removeEventListener('close', onClose); res(d.returnValue); }; d.addEventListener('close', onClose); if (!d.open) d.showModal(); }); }
  async function flush() {
    busy = true;
    while (G && G.queue.length) {
      const it = G.queue.shift();
      if (it.k === 'event') await showEvent(it.id);
      else if (it.k === 'battle') await showBattle(it.rep);
      renderAll();
    }
    busy = false;
    if (G) renderAll();
  }

    const e = EV[id], li = LANGS.indexOf(lang);

    $('evBody').innerHTML = `<p>${esc(e[li][1])}</p><p class="ev-src">${SRC_LABEL[li]}: ${esc(e[4])}</p>`;

  }
  async function deceitDialog() {

    $('evBtns').innerHTML = `<button type="button" class="btn pri" data-v="hold">${t('deceitHold')}</button><button type="button" class="btn" data-v="go">${t('deceitGo')}</button>`;

  async function showBattle(rep) {
    const d = $('dBattle');
    $('btH').textContent = t('bt_title', { p: NODES[rep.node].n });
    const side = (title, v, n, h, m, mods, cls) => `<div><h3>${esc(title)}</h3><div class="bt-val">${Math.round(v)}</div><div class="muted">${t('bt_val')}</div><p>${t('bt_dice', { n, h })}<br>${t('bt_morale', { m })}</p><ul>${mods.map((x) => `<li>${esc(t(x.k, x.v))}</li>`).join('')}</ul></div>`;
    $('btBody').innerHTML = `<div class="bt-sides">${side(t('bt_rom') + ': ' + rep.rName, rep.rV0, rep.rN, rep.rH, rep.rM, rep.rMods)}${side(t('hostes') + ': ' + rep.eName, rep.eV0, rep.eN, rep.eH, rep.eM, rep.eMods)}</div>`;
    $('btDice').innerHTML = ''; $('btLog').innerHTML = '';
    $('btBtns').innerHTML = `<button type="button" class="btn pri" id="btGo">${t('bt_auto')}</button>`;
    const p = openDialog(d);
    await new Promise((r) => $('btGo').addEventListener('click', r, { once: true }));
    $('btBtns').innerHTML = '';
    const L = (s) => { $('btLog').insertAdjacentHTML('beforeend', `<p>${esc(s)}</p>`); $('btLog').scrollTop = $('btLog').scrollHeight; };
    for (let i = 0; i < rep.rounds.length; i++) {
      const r = rep.roundsDone = rep.rounds[i];
      $('btDice').innerHTML = `<div class="dice">${r.rd.map((v) => dieHTML(v, 'red', 'roll ' + (v >= rep.rH ? 'hit' : 'miss'))).join('')}</div><div class="dice" style="margin-top:4px">${r.ed.map((v) => dieHTML(v, 'grn', 'roll ' + (v >= rep.eH ? 'hit' : 'miss'))).join('')}</div>`;
      await sleep(650);
      L(t('bt_round', { n: i + 1, a: r.rh, b: r.eh }));
      for (const m of r.mor) {
        const sum = m.roll[0] + m.roll[1];
        if (m.rally) L(t('bt_rally', { r: m.rally[0] + m.rally[1] }));
        L(t((m.ok ? 'bt_mok_' : 'bt_mfail_') + m.side, { r: m.rally ? m.rally[0] + m.rally[1] : sum }));
        await sleep(300);
      }
    }
    if (rep.result === 'rwin') L(t('bt_win', { n: rep.eLostK }) + (rep.gloria ? ' ' + t('l_gloria', { n: rep.gloria }) : ''));
    else if (rep.result === 'ewin') L(t('bt_loss', { n: rep.rLostCoh }));
    else L(t('bt_draw', { s: rep.attacker === 'r' ? rep.eName : rep.rName }));

    $('btOk').addEventListener('click', () => d.close('ok'));
    $('btOk').focus();
    await p;
  }

  // ---------------------------------------------------------------- estação, inverno e fim
  async function endSeason() {
    if (!G || busy || G.phase !== 'player' || G.over) return;
    busy = true; G.sel = G.sel; renderAll();
    beginEnemyPhase();
    for (;;) {
      const more = enemyStep();
      renderAll(); busy = false; await flush(); busy = true;
      if (G.pending) { busy = false; await deceitDialog(); await flush(); busy = true; }
      if (G.over || !more) break;
      await sleep(120);
    }
    if (!G.over) advance();
    busy = false;
    renderAll(); await flush(); saveGame();
    if (G.over) { showEnd(); return; }
    if (G.phase === 'winter') await winterDialog();
  }
  async function winterDialog() {
    const draw = () => {
      $('evH').textContent = t('winterT', { y: G.year });
      let h = `<p>${esc(t('winterP'))}</p><p><b>${t('auctoritas')}: ${G.auct}</b></p>`;
      G.armies.forEach((a) => { h += `<h3>${esc(a.name)} · ${esc(NODES[a.at].n)}</h3><div class="moves">${a.legs.map((l, i) => `<button type="button" class="btn sm" data-w="${a.id}:${i}" ${G.auct >= 1 && l.c < 10 ? '' : 'disabled'}>${esc(t('w_reinf', { l: l.n }))} · ${l.c}/10</button>`).join('')}</div>`; });
      h += `<div class="row"><button type="button" class="btn" id="wRec" ${G.auct >= 3 && G.legPool.length ? '' : 'disabled'}>${esc(t('w_recruit', { l: (G.legPool[0] || {}).n || '—', p: nn(recruitSpot()) }))}</button></div>`;
      $('evBody').innerHTML = h;
      $('evBody').querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => { const [aid, li] = b.dataset.w.split(':'); winterReinforce(G.armies.find((x) => x.id === aid), +li); draw(); renderAll(); }));
      $('wRec').addEventListener('click', () => { winterRecruit(); draw(); renderAll(); });
    };
    draw();
    $('evBtns').innerHTML = `<button type="button" class="btn pri">${t('w_done')}</button>`;
    $('evBtns').firstChild.addEventListener('click', () => $('dEvent').close('ok'));
    await openDialog($('dEvent'));
    endWinter();
    renderAll(); await flush(); saveGame();
    if (G.over) showEnd();
  }
  function showEnd() {
    const r = finalResult();
    let msg = '';
    if (G.over === 'caesar') msg = t('lostCaesar'); else if (G.over === 'army') msg = t('lostArmy'); else if (G.over === 'auct') msg = t('lostAuct');
    const goal = t(SCEN[G.scen].goal);
    $('evH').textContent = t('endT');
    $('evBody').innerHTML = `${msg ? `<p>${esc(msg)}</p>` : ''}<p><b>${esc(t(r.ok ? 'goalOk' : 'goalNo', { g: goal }))}</b></p><p>${esc(t('finalScore', { g: r.g, r: t(r.rk) }))}</p><p class="quote">${esc(t('histCmp'))}</p>`;
    $('evBtns').innerHTML = `<button type="button" class="btn pri" id="eNew">${t('newGame')}</button><button type="button" class="btn" id="eMenu">${t('menu')}</button>`;
    $('eNew').addEventListener('click', () => { $('dEvent').close(); startFromSetup(); });
    $('eMenu').addEventListener('click', () => { $('dEvent').close(); toMenu(true); });
    Store.del('alexandros.save');
    if (!$('dEvent').open) $('dEvent').showModal();
  }

  // ---------------------------------------------------------------- tela inicial, idioma e tema
  function renderSetup() {
    const cur = prefs.scen && SCEN[prefs.scen] ? prefs.scen : 'gaugamela';
    $('scenList').innerHTML = Object.keys(SCEN).map((k) => `<label><input type="radio" name="scen" value="${k}" ${k === cur ? 'checked' : ''}><span><b>${esc(t(SCEN[k].name))}</b><small>${esc(t(SCEN[k].desc))}</small></span></label>`).join('');
    $('sDiff').value = String(prefs.diff != null ? prefs.diff : 1);
    $('bResume').hidden = !Store.get('alexandros.save');
  }
  function startFromSetup() {
    const scen = (document.querySelector('input[name="scen"]:checked') || {}).value || 'gaugamela';
    const diff = +$('sDiff').value;
    let seed = parseInt($('sSeed').value, 10); if (!Number.isFinite(seed)) seed = (Math.random() * 2147483647) | 0;
    savePref({ scen, diff });
    newGame(scen, diff, seed);
    G.sel = (caesarArmy() || G.armies[0]).id;
    openGame();
  }
  function openGame() {
    $('ovSetup').hidden = true; $('app').hidden = false;
    vb = SCEN[G.scen].view.slice(); vb[3] = vb[2] * H / W;
